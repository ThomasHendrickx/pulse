# DR-0027: what a merchant rule matches on.
# The owner, looking at the deployed merchant review on their phone, saw two
# rows from the same counterparty account listed as two separate unnamed
# counterparties and asked what a naming would match on. Measured over their
# real month: 39 transactions produce 39 distinct descriptions, so the
# current EXACT rule on the normalised description can never match a second
# transaction. Decided by the owner in session on 2026-08-23.
kind: decision-record
id: DR-0027
project: pulse
task: v02-merchant-identity
question: >-
  Two payments from the same counterparty account carrying different free
  text communications: one counterparty or two?
options:
  - label: One, keyed on the counterparty account
    consequence: >-
      The same account number is the same counterparty, always. The free text
      communication is dropped from identity, so a counterparty is named once
      and stays named as the communication varies. On the owner's real month
      this collapses 11 rows carrying an account number into 6 counterparties
      instead of 11. Chosen by the owner. The cost is accepted and stated:
      two different purposes paid to the same counterparty, a car insurance
      and a pension contribution to one insurer, land in ONE group, and
      separating them is a tag question rather than a merchant question. The
      28 rows carrying no account number are a separate problem this decision
      does not answer: they hold 28 distinct descriptions and only 6 distinct
      openings, so their identity comes from the descriptor grammar, the way
      the card grammar was answered.
  - label: Account plus communication
    consequence: >-
      Purposes stay separate, at the cost of matching breaking again whenever
      a communication carries a reference, a date or an invoice number. Not
      chosen.
reversibility: reversible
vetoable: true
revert-cost: >-
  The key derivation is interpretation, not fact. Rows are never rewritten,
  so changing the derivation and recomputing is the whole revert. Merchant
  rules already written against the old key would need re-deriving, which is
  a migration of declarations rather than of data.
status: decided
decided: >-
  One counterparty, keyed on the account (owner, 2026-08-23), chosen against
  a stated recommendation and its cost.
date: "2026-08-23"
evidence:
  - backlog.md
