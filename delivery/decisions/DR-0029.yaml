# DR-0029: what the owner is a gate for, and what is never put to them.
# Written after the orchestrator asked the owner whether two independent
# review lanes should run in parallel or in sequence. That is a mechanics
# question with no consequence the owner would ever feel, and asking it
# spent their attention and stalled the work waiting for an answer.
kind: decision-record
id: DR-0029
project: pulse
task: process
question: >-
  Which decisions reach the owner, and which does the orchestrator settle
  without asking?
options:
  - label: The owner gates product consequence only
    consequence: >-
      A question reaches the owner ONLY when the two answers would produce
      DIFFERENT SOFTWARE, different data, or a different risk they would
      live with: a ring, a key, an optimistic default, a failure mechanism,
      what is public, whether a real value is redacted. Everything about how
      the work is carried out is the orchestrator's and is never surfaced:
      how many agents run and whether they run in parallel, worktrees,
      watchdogs, port numbers, brief wording, review sequencing, retries,
      which lane goes first, whether a stalled agent is resumed or replaced.
      If the orchestrator cannot name the consequence the owner would feel,
      there is no question, only a decision the orchestrator has not made
      yet. Chosen and recorded so it binds future dispatches rather than
      depending on the orchestrator remembering.
  - label: Ask when uncertain
    consequence: >-
      Sounds careful and is not: it converts every internal uncertainty into
      the owner's work, and it stalls delivery on answers that change
      nothing. Rejected.
reversibility: reversible
vetoable: true
revert-cost: >-
  A rule about how questions are routed. No data, no schema, no code.
status: decided
decided: >-
  The owner gates product consequence only (2026-08-23), after the
  orchestrator asked a parallelism question the owner had no reason to
  answer. THE ROOT CAUSE IS RECORDED BECAUSE THE FIX FOLLOWS FROM IT: the
  owner had earlier interrupted four concurrent agents because the
  orchestrator's own machinery filled every turn and their messages could
  not land. The orchestrator answered that with a promise to run one agent
  at a time and ASK before running more. That converted a VOLUME problem
  into an ASKING problem, which spends more of the owner's attention rather
  than less. The correct answer to too much orchestrator noise is less
  orchestrator noise, never a request for permission.
date: "2026-08-23"
evidence:
  - warnings.md
