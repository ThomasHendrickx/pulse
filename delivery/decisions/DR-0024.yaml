# DR-0024: what to do about two real place names that reached the public
# repository. Raised by the M3-P3 dual review, which found them independently
# in both lanes; decided by the owner in session on 2026-08-22 after being
# shown the consequence of each option.
kind: decision-record
id: DR-0024
project: pulse
task: v02-privacy
question: >-
  Two merchant descriptors naming a real shop and a real parking location
  were committed to the public repository in the mobile mockup. They are
  replaced at HEAD but remain in history. Does the repository go private,
  does the history get rewritten, or does neither?
options:
  - label: Delete the review branches, stay public, no purge
    consequence: >-
      The two reviewer write-ups, which map the leak by file and line, are
      removed from GitHub. The repository stays publicly readable and the two
      place names remain in its history at b560e85. Chosen by the owner.
  - label: Make the repository private
    consequence: >-
      Everything including history becomes invisible to everyone but the
      owner, at no cost to the deployment and reversible at any time. Not
      chosen.
  - label: Rewrite history
    consequence: >-
      The strings stop existing on GitHub, at the cost of rebuilding every
      branch, redoing the in-flight mobile and KBC work, and repeating an
      operation that previously tripped a security monitor. Not chosen.
reversibility: reversible
vetoable: true
revert-cost: >-
  The repository can be made private, or its history rewritten, at any later
  point. The cost of waiting is that public content may be copied or indexed
  in the meantime, which no later action reaches.
status: decided
decided: >-
  Delete the review branches only, stay public, no purge (owner, 2026-08-22).
  Ref deletion is refused by this container's git proxy, so both review
  branches were force-reset to main instead: the verdict files no longer
  exist on any branch on GitHub, confirmed by API read returning not-found.
  Both verdicts are preserved outside the repository so no review work is
  lost.
date: "2026-08-22"
evidence:
  - backlog.md
  - warnings.md
