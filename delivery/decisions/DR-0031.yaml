# DR-0031: the household enters every account once at setup, before any
# statement is imported. Cut by the owner directly, over the shape the plan
# had been iterating on. Recorded here because it reached the plan through a
# commit message rather than a decision record, and an orchestrator without
# it in context could not confirm it and stopped the work to ask. Confirmed
# by the owner in session on 2026-08-27.
kind: decision-record
id: DR-0031
project: pulse
task: v02-account-setup
question: >-
  Does Pulse discover the household's accounts progressively, as statements
  arrive, or does it ask for all of them once at setup before any import?
options:
  - label: Ask once at setup, then import
    consequence: >-
      At household setup the owner enters every account they own ONCE, each
      with a label, an account number and a ring, pot or savings. Credit
      cards are explicitly NOT asked for and are declared at first sight
      when their statement arrives, because a card has no account number to
      type. The ring is fixed at setup, correctable only while the account
      has no imported rows of its own. Then statements are imported, and the
      import gate keeps an unregistered account out. WHAT THIS DELETES,
      rather than reworks: the half-imported world entirely, and with it the
      upload-first ordering trap, adoption of an account discovered mid
      import, merchant namings made before the accounts were known and the
      rule counting that followed them, the mid-flight ring correction as a
      load-bearing journey, the clearing of rows on accounts leaving the pot,
      and the scoping of the gap reads. Twenty-one criteria across two phases
      become fifteen across one phase and a small migration phase. Decisions
      D-49, D-50, D-56 and D-58 are withdrawn with their reasons; D-51 is
      rewritten to the one rule that keeps the simple world simple. THE
      OWNER'S GROUND, in their own words: the rounds were overcomplicating
      the details and postponing the value stream by fine tuning a plan that
      is theoretical, when usage and testing are worth more. WHAT IT COSTS
      THE HOUSEHOLD: a setup screen completed before the first month view,
      ten accounts typed in up front. Chosen by the owner.
  - label: Progressive discovery, accounts found as statements arrive
    consequence: >-
      The shape the plan had been iterating on. Rejected. It is the source of
      the half-imported world, which three rounds of review findings were
      spent on: an account can be registered after rows referencing it are
      already imported and already named as merchants, the ring can be
      answered wrongly at upload and corrected later, and every read that
      touches interpretation has to be correct in both worlds. The defects
      were real and the fixes were getting more elaborate rather than less.
reversibility: reversible
vetoable: true
revert-cost: >-
  The phase is not built. Reverting means restoring the two-phase shape from
  git history, and it costs the household nothing it already has.
status: decided
decided: >-
  Ask once at setup, then import (owner, cut directly over the plan; the
  shape reached the plan on 2026-08-26 and the owner confirmed it in session
  on 2026-08-27 when the orchestrator could not verify it from context).
date: "2026-08-27"
evidence:
  - decisions/DR-0030.yaml
  - decisions/DR-0027.yaml
