# DR-0025: whether an action shows its result before the server confirms it.
# Raised by the M0-P4 interaction-feedback planning phase, after the owner
# reported that pressing a control produces no visible change until the
# server round trip completes. Decided by the owner in session on
# 2026-08-23.
kind: decision-record
id: DR-0025
project: pulse
task: v02-interaction-feedback
question: >-
  Does an action show its result optimistically before the server confirms
  it, or does it only show that work is in progress and wait for the answer?
options:
  - label: Optimistic, revert loudly on failure
    consequence: >-
      The screen predicts the result and shows it immediately, expecting the
      server state to match. When it does not, the failure is shown and the
      screen reverts to what it was. Chosen by the owner, who put the
      expected split at about 9999 successes in 10000. The application's
      standing rule that a screen never shows an unknown as though it were
      known is not weakened by this: a prediction is not an unknown, and the
      revert is what keeps it honest. Two constraints follow and bind the
      plan. A failed action must be visible without the reader having to
      notice a value changing back, because a silent revert on a screen full
      of figures is worse than no optimism at all. And where an action would
      change a MONEY figure rather than a label, the plan says so explicitly
      and states what is predicted, since predicting a total is a different
      act from predicting a name.
  - label: Pending only, wait for the server
    consequence: >-
      The screen shows that work is in progress and changes nothing until the
      server answers. Never shows a wrong value, always costs the reader the
      full round trip. Not chosen.
reversibility: reversible
vetoable: true
revert-cost: >-
  A rendering choice per surface, not a data or schema commitment. Reverting
  one surface to pending-only is local to that surface.
status: decided
decided: >-
  Optimistic, revert loudly on failure (owner, 2026-08-23): "I am a fan of
  optimistic state management. So I rather have it 99,99% of the time just
  predict what it will be and already show it like that, and expect the new
  server state to match it. and 0,01% of the time show me that it failed and
  revert back to what it was."
date: "2026-08-23"
evidence:
  - dispatch-plan-feedback.yaml
  - backlog.md
