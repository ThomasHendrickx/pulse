# DR-0021: the mobile share-sheet mechanism for pulse v0.2.
# The Web Share Target API exists on Android/Chromium only; iOS Safari
# has no equivalent. The owner's platform decides whether M3-P5 is built.
# Raised by the v0.2 plan (M0-P2 scout); decided by the owner in session
# on 2026-08-21.
kind: decision-record
id: DR-0021
project: pulse
task: v02-planning
question: >-
  Is the mobile share-sheet import path (PWA share_target) built, which
  requires an Android/Chromium phone, or is the mobile upload screen the
  whole phone flow?
options:
  - label: Android, build the share target
    consequence: >-
      M3-P5 ships: the owner shares the PDF from the banking app straight
      into Pulse. The PWA manifest carries share_target with the
      no-caching discipline explicit (no service worker cache, no offline
      shell).
  - label: iPhone, drop the share target
    consequence: >-
      M3-P5 is dropped from the plan; the mobile upload screen (M3-P4) is
      the phone flow.
reversibility: reversible
vetoable: true
revert-cost: >-
  Building it unnecessarily wastes one phase; dropping it wrongly costs
  re-planning one phase later. Either way no data or schema is affected.
status: decided
decided: >-
  Android (owner, 2026-08-21): the share-sheet target is built. M3-P5's
  dispatch gate is satisfied.
date: "2026-08-21"
evidence:
  - dispatch-plan-v02.yaml
  - backlog.md
