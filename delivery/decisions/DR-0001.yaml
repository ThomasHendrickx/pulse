# DR-0001: the binding shape of release verification for pulse v1.
# The charter left release-verification.mode reserved per kernel DR-0014;
# the plan (delivery/plan/pulse-v1.yaml, M1-P5) carries the slot. Decided
# by the owner in session on 2026-08-17.
kind: decision-record
id: DR-0001
project: pulse
task: fleet-setup
question: >-
  What is the binding release verification for pulse v1: the charter left
  the mode reserved with a working candidate.
options:
  - label: Accept the working candidate as binding
    consequence: >-
      The Playwright golden journey plus the fast gate, both green on the
      release commit, become the binding release verification. Matches the
      two-gate discipline the charter constraints and CLAUDE.md already
      declare.
  - label: Keep reserved until M1-P5
    consequence: >-
      The decision waits until the month view exists and the golden
      journey's real coverage is visible. Nothing blocks before M1-P5
      closes, but M1-P5 cannot close without it.
reversibility: reversible
vetoable: true
revert-cost: >-
  Supersede this record with a new one naming a different verification;
  one commit in the fleet home, plus rework of any release evidence
  already produced under the old shape.
status: decided
decided: >-
  Accept the working candidate as binding (owner, 2026-08-17): the
  Playwright golden journey plus the fast gate, both green on the release
  commit, are the release verification for pulse v1. The charter's
  release-verification field is updated from reserved in a later
  paperwork change; this record is the authority until then.
date: "2026-08-17"
evidence:
  - charter/pulse.yaml
