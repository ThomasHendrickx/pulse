# DR-0023: how the spend card groups its rows.
# Raised by the M0-P3 mobile planning phase, which found that the approved
# mockup shows merchant rows nested under tag subheads while the shipped
# projection emits one row per tag. Decided by the owner on 2026-08-23.
kind: decision-record
id: DR-0023
project: pulse
task: v02-mobile
question: >-
  Does the spend card keep one row per tag, which is what the month
  projection emits today, or gain merchant rows nested under tag subheads,
  which is what the approved mockup shows?
options:
  - label: One row per tag
    consequence: >-
      The rebuild changes layout only. Nesting is a projection and
      delta-keying change rather than a layout one, it makes the spend card
      roughly three times taller on the screen the owner graded 1 out of 10,
      and with zero merchant rules in the owner's data it renders identically
      either way today. Chosen by the owner against a stated recommendation.
      The question is worth reopening once merchant naming actually
      converges, which is what M3-P12 exists to make true, because nesting
      only becomes visible when merchants group.
  - label: Merchant rows under tag subheads
    consequence: >-
      Matches the approved mockup's fix 4 and shows where money went inside a
      tag, at the cost of a projection change inside a layout phase and a
      much taller card. Not chosen for v0.2.
reversibility: reversible
vetoable: true
revert-cost: >-
  A projection and a rendering change on one card. No data, no schema.
status: decided
decided: >-
  One row per tag (owner, 2026-08-23), taking the stated recommendation.
  Deferred rather than refused: revisit after M3-P12 makes naming converge.
date: "2026-08-23"
evidence:
  - backlog.md
  - https://claude.ai/code/artifact/c8077ad4-7774-41ea-9028-f445bdf54ee5
