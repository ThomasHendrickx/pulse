# DR-0003: how the pilot satisfies DR-0012's dual cross-model review
# condition while every dispatchable agent is one model family. Decided by
# the owner in session on 2026-08-17.
kind: decision-record
id: DR-0003
project: pulse
task: fleet-setup
question: >-
  DR-0012 requires the two clean-room reviews per phase to come from
  different model families, and every agent this environment can dispatch
  is Claude. How does the pilot satisfy the dual-review merge condition?
options:
  - label: Same family, varied lenses
    consequence: >-
      Both reviews may be produced by the Claude family, provided their
      review-contract values are distinct (one criteria, one hazard) and
      their framing values are distinct. This keeps the decorrelation the
      kernel's T-007 evidence measured as decisive (the question asked),
      and gives up the model-family decorrelation of T-001 for the
      duration of the pilot.
  - label: Owner runs the second review in another tool
    consequence: >-
      Keeps the letter of DR-0012 at the cost of owner time on every
      phase, which DR-0012 was granted to remove.
  - label: Wire a second provider into the environment
    consequence: >-
      Strongest guarantee, needs a key, network allowance and custom
      wiring that does not exist today.
reversibility: reversible
vetoable: true
revert-cost: >-
  Supersede this record; phases merged under it keep their verdicts, and
  later phases return to the two-family requirement.
status: decided
decided: >-
  Same family, varied lenses (owner, 2026-08-17), for this pilot only:
  a phase may merge when both clean-room verdicts are Claude-family,
  provided review-contract and framing are distinct across the pair and
  every other DR-0012 condition holds. Revisit when a second model family
  is reachable from the fleet's environment; this record does not amend
  DR-0012's text, it narrows how condition one is discharged during the
  pilot.
date: "2026-08-17"
evidence:
  - decisions/DR-0012-delegated-merge-authority.md
