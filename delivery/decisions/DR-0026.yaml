# DR-0026: how a failed optimistic update is told to the reader.
# Follows DR-0025, which decided that the screen predicts a result and
# reverts when the server disagrees. That decision left the revert's
# visibility as a requirement without naming a mechanism. Decided by the
# owner in session on 2026-08-23.
kind: decision-record
id: DR-0026
project: pulse
task: v02-interaction-feedback
question: >-
  When an optimistic update fails server side and the screen reverts, how is
  the reader told?
options:
  - label: A toast, in the reader's own language
    consequence: >-
      A transient notice appears carrying a user-friendly message, not an
      error code and not a stack trace. Chosen by the owner, who uses this
      pattern in other applications they rely on. Copy comes from the message
      catalogues in English, Dutch and French like every other string in this
      product, so a hardcoded English sentence is a defect. The notice
      carries an accessible live region so a reader who is not looking at
      that corner of the screen is still told, and it respects the
      reduced-motion path. It is built by hand: CLAUDE.md scope discipline
      forbids a component library, and a toast is not a reason to add one.
      One risk rides with the mechanism and the plan must answer it rather
      than inherit it: a transient notice that is missed leaves no trace, and
      a reverted value on a screen full of figures then looks like a value
      the reader themselves entered. So a failure notice is dismissible by
      the reader rather than only by a timer, or it persists until the reader
      acts, and the plan states which and why.
  - label: Inline on the control that failed
    consequence: >-
      The message sits next to the thing that failed and cannot be missed,
      at the cost of moving the layout and of having no home on a screen
      where the control has already scrolled away. Not chosen as the
      mechanism, though nothing prevents a phase from marking the reverted
      row as well as raising the notice.
reversibility: reversible
vetoable: true
revert-cost: >-
  One presentational component and its copy keys. No data, no schema.
status: decided
decided: >-
  A toast with a user-friendly message (owner, 2026-08-23): "in other apps I
  use a toast to notify when it failed to update the state server side
  (offcourse with a user friendly message)".
date: "2026-08-23"
evidence:
  - decisions/DR-0025.yaml
  - dispatch-plan-feedback.yaml
