# DR-0032: how Pulse adapts to @tiphys/kernel 0.2.0. Decided by the owner in
# session on 2026-09-23, after the kernel pin moved from 0.1.0 to 0.2.0 and a
# probe showed what the new review rules make of the records already written.
kind: decision-record
id: DR-0032
project: pulse
task: kernel-0.2.0-adaptation
question: >-
  Kernel 0.2.0 requires every verdict to name the head it reviewed, refuses
  APPROVE beside an open medium finding, and offers a review-families charter
  declaration for a single-family environment, which it refutes unless every
  committed verdict under delivery/ carries the declared family verbatim. The
  records already committed meet none of these. Are those records brought up
  to the new rules, or does the adaptation apply only from here on?
options:
  - label: Current and future only, history stays as written
    consequence: >-
      Every review record, work history and finding set committed before
      this record stays byte for byte as it is, including the ten verdicts
      whose produced-by names a model rather than the family and every
      verdict that has no head. The live setup (package pin, charter,
      plan process summary) moves to 0.2.0, and every review written from
      here on follows the 0.2.0 verdict contract. WHAT IT COSTS: the
      review-families declaration cannot be made, because the kernel reads
      the whole committed corpus and the unchanged history contradicts a
      single-family claim on every run. DR-0003 therefore keeps being
      discharged by the orchestrator by hand, as it has been since M1.
      Historical verdicts also stay invalid against the 0.2.0 schema; no
      gate in this repository validates them.
  - label: Normalise history to the new rules
    consequence: >-
      Rewrite produced-by on the ten verdicts so the review-families
      declaration holds. Rejected: it edits the review record after the
      fact, and it still cannot supply a head for past verdicts without
      inventing one.
reversibility: reversible
vetoable: true
revert-cost: >-
  Supersede this record. Nothing is lost: the history this record protects
  is unchanged, and a later owner decision could still add the
  review-families declaration if the kernel ever scopes its corpus to a
  cutover commit.
status: decided
decided: >-
  Current and future only (owner, 2026-09-23): history remains what it is.
  Records committed before this decision are not edited to satisfy kernel
  0.2.0. From here on every verdict carries head (the full sha of the
  commit reviewed), produced-by names the family (claude) and not the model,
  and no verdict reads APPROVE while it lists an open finding at medium or
  above. No review-families declaration is made, and DR-0003 continues to be
  discharged by the orchestrator.
date: "2026-09-23"
evidence:
  - decisions/DR-0003.yaml
  - decisions/DR-0012-delegated-merge-authority.md
