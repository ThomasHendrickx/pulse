# DR-0030: whether a reserve account's own statement can be imported in v1.
# Raised by the M0-P6 round-two plan review, which found that decision D-55
# in the plan presented the refusal as forced when it is chosen. Decided by
# the owner in session on 2026-08-27.
kind: decision-record
id: DR-0030
project: pulse
task: v02-account-registration
question: >-
  Does Pulse accept a statement whose own account sits in the RESERVE ring,
  or does it refuse the import and let the household register the account by
  name only?
options:
  - label: Accept the statement, hold its rows out of the totals
    consequence: >-
      A household with four savings accounts uploads all ten of its
      documents rather than six. The rows on a reserve account are imported
      as facts, shown, and marked as HELD ON A RESERVE ACCOUNT and not part
      of the month's income, spend or net-to-reserves. This was written into
      the plan as impossible. It is not: the engine change that lets a row
      on a non-pot account be interpreted as deliberately not counted is
      already scheduled in M3-P15, and what admitting the statement needs
      beyond that is a screen state saying the rows are held and not
      counted, its copy in the three catalogues, and its tests. It fits
      inside M3-P14 and M3-P15 rather than adding a phase. WHAT THE
      HOUSEHOLD GAINS, none of which any current-account row can stand in
      for: interest credited on a savings account, which in Belgium arrives
      as a base rate plus a loyalty premium once or twice a year and is real
      household income; a movement between two of the household's own
      savings accounts, which touches no current account and is today
      invisible in full; and anything paid directly out of savings. WHAT IT
      COSTS: a later working month view, and one more screen state that has
      to be correct in three languages. The uninterpreted-row gap read must
      distinguish a row deliberately not counted from a row nothing could
      read, or the reconciliation verdict becomes a lie in the other
      direction. Chosen by the owner.
  - label: Registration only, the statement refused at upload
    consequence: >-
      The household registers a savings account by name and Pulse refuses
      its statement, explaining why. Transfers into savings, seen from the
      current account, still classify RESERVE and still show under the typed
      label, so the counterparty-as-merchant defect is fixed either way.
      Rejected, and the price it was rejected at is recorded rather than
      lost: savings interest invisible, savings-to-savings movements
      invisible, direct payments from savings invisible, and the reserves
      figure permanently a record of what was moved aside rather than a
      picture of what is set aside. Also rejected because the refusal as
      drafted never fires in the order a household is actually in: uploading
      is the only way into Pulse today, so four savings statements uploaded
      before the accounts screen is ever seen would be declared POT
      silently, their transfers classified INTERNAL, reserves read zero, and
      the banner report that the books close. That is quieter and worse than
      the defect being fixed.
reversibility: reversible
vetoable: true
revert-cost: >-
  Neither phase is built. Reverting means restoring the refusal at the
  import boundary and deleting one screen state, and it costs the household
  nothing it already has.
status: decided
decided: >-
  Accept the statement and hold its rows out of the totals (owner,
  2026-08-27). D-55 in the plan is superseded and must be rewritten as a
  decision that was made rather than one that was forced.
date: "2026-08-27"
evidence:
  - decisions/DR-0027.yaml
  - decisions/DR-0028.yaml
