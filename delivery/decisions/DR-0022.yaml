# DR-0022: viewport priority for pulse.
# The v1 charter (pulse-frontend skill, "Desktop first ... Mobile is not
# a v1 target and no effort is spent on it") was written before the owner
# used the product. On first real use the owner graded the shipped month
# view 2/10 quality and 1/10 usability, on a phone, and asked for a
# mobile rebuild grounded in an approved mockup. Raised and decided by
# the owner in session on 2026-08-22.
kind: decision-record
id: DR-0022
project: pulse
task: v02-planning
question: >-
  Does the desktop-first charter line stand, or does mobile become the
  primary viewport that every screen is designed and reviewed against?
options:
  - label: Mobile first, supersede the charter line
    consequence: >-
      The pulse-frontend skill's "Desktop first" paragraph is replaced by
      a mobile-first constraint. Every screen is designed at phone width
      first and widened from there. Phone-width evidence becomes a
      standing acceptance criterion on every UI phase, measuring usability
      (reachable targets, readable density, no lost content) rather than
      only absence of horizontal overflow. The month view and the merchant
      review screen are rebuilt against the owner-approved mockup. Cost:
      one rebuild phase for the two screens already shipped, and a slower
      review pass on every later UI phase.
  - label: Keep desktop first
    consequence: >-
      The shipped month view stands as designed and the owner's stated
      usage on a phone stays unsupported.
reversibility: reversible
vetoable: true
revert-cost: >-
  A layout constraint, not a data or schema commitment. Reverting costs
  the CSS of the rebuilt screens.
status: decided
decided: >-
  Mobile first (owner, 2026-08-22, "mobile ok and a go" against the
  approved mockup). The desktop-first paragraph in the pulse-frontend
  skill is superseded and is amended as part of the rebuild phase, not
  by the orchestrator unilaterally.
date: "2026-08-22"
evidence:
  - backlog.md
  - https://claude.ai/code/artifact/c8077ad4-7774-41ea-9028-f445bdf54ee5
