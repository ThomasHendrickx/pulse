# DR-0020: the PDF text-extraction runtime dependency for pulse v0.2.
# A new runtime dependency is a charter stop-for item (charter.yaml:92),
# so the choice is the owner's. Raised by the v0.2 plan (M0-P2 scout);
# decided by the owner in session on 2026-08-21.
kind: decision-record
id: DR-0020
project: pulse
task: v02-planning
question: >-
  Which PDF text-extraction library may the v0.2 PDF import use: the
  charter forbids new runtime dependencies without an owner decision.
options:
  - label: pdfjs-dist
    consequence: >-
      Mozilla PDF.js as the extraction engine, server-side only, behind
      the parser adapter. Actively maintained, pure JavaScript, no native
      binaries. The scout's recommendation; both real statements carry
      full text layers so no OCR is needed anywhere in v0.2.
  - label: unpdf
    consequence: >-
      A lighter serverless-focused wrapper around PDF.js internals.
      Smaller surface, younger project, same underlying engine.
  - label: Delegate to the implementer
    consequence: >-
      The M3-P2 implementer chooses within the adapter boundary and
      records the choice in the work history; the owner reviews it at
      merge rather than before build.
reversibility: reversible
vetoable: true
revert-cost: >-
  Swap the library behind the StatementParser adapter; the adapter
  boundary exists precisely so extraction is replaceable. One phase-sized
  change plus re-run of the PDF gates.
status: decided
decided: >-
  pdfjs-dist (owner, 2026-08-21), server-side only, behind the parser
  adapter. M3-P2's dispatch gate is satisfied.
date: "2026-08-21"
evidence:
  - dispatch-plan-v02.yaml
  - backlog.md
