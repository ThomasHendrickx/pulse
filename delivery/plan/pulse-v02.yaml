  - id: M3-P9
    branch: claude/m3-p9-pressed-and-disabled
    intent: >-
      A control looks pressed while it is being pressed, and looks unusable
      while it cannot be used: the motion and state tokens are added to
      styles/tokens.css first, every interactive control in the product gains
      a pressed, a disabled and a busy appearance built only from those
      tokens, a reduced-motion path is declared in the same change, and the
      evidence is a held press in a browser with the computed style read
      while the pointer is down, at the phone width and at the desk width.
      No component is edited and no client boundary is opened by this phase.
    grounding: >-
      The owner's report of 2026-08-23, quoted verbatim in standing-context,
      first half: "buttons don't feel like button". Measured at 89ed187 and
      recorded with captured output in this phase's report-code-disagreement
      entries: four :hover rules in src/app/globals.css and a fifth in
      styles/tokens.css:201, zero :active rules, zero :disabled rules, zero
      transitions, zero animations and zero @keyframes across all four
      tracked stylesheets; no duration, easing, motion or elevation token in
      styles/tokens.css; no prefers-reduced-motion block anywhere; and
      cursor: pointer on five rules, which is a cue a phone cannot show. The
      governing document is .claude/skills/pulse-frontend/SKILL.md, section 3
      for the token rule (SKILL.md:70, a missing token is added to tokens.css
      before it is used) and section 8 for what may be animated
      (SKILL.md:131, no animation beyond state transitions that aid
      comprehension, which is what a pressed state and a busy mark are and is
      the whole permission this phase uses). M3-P7 in this plan is the worked
      example of a phase answering an owner usability report, and its lesson
      is carried here: a criterion that asserts a rule exists is the same
      error as measuring horizontal overflow. This phase is grounded at
      89ed187, not at this plan's baseline-commit e4ea3ba.
    severity: high
    verified-root-cause: >-
      The stylesheet declares no pressed state, no disabled state and no
      transition, so a control's appearance is identical the instant before,
      during and after a press. On a pointer device the five cursor: pointer
      rules (src/app/globals.css:89, :239, :381, :439, :617) give a partial
      cue; on the phone the owner is using there is none at all, because a
      cursor does not exist there. This is a cause that is complete before
      any network work starts and is therefore independent of the pending
      state M3-P10 adds: a control with a pending state but no pressed
      appearance still does not feel pressable, and a control with a pressed
      appearance but no pending state still leaves the dead interval the
      owner's second sentence describes.
    steps:
      - kind: verification-first
        text: >-
          Before editing any rule, re-take every measurement this plan states
          against this phase's own base and write each answer into the phase
          work history with the command and its captured output beside it.
          (a) The :hover, :active, :disabled, transition, animation,
          @keyframes and cursor counts over EVERY file git ls-files "*.css"
          returns, not over src/app/globals.css alone: the fifth hover rule
          recorded in this phase's first report-code-disagreement entry is
          outside that file and a phase that greps one file will not see it.
          (b) The absence of any duration, easing, motion or elevation token
          in styles/tokens.css, and the exact text of the section heading at
          styles/tokens.css:116. (c) The absence of prefers-reduced-motion
          anywhere under src/, styles/ and test/. (d) The complete list of
          controls the phase must cover, produced by running the criterion
          9.2 selector over every screen in the product rather than by
          copying the list in this plan, a note of every control the
          selector finds that this plan does not name, and the route by
          which the spec reaches each of the FIVE controls that render only
          under a condition, which criterion 9.2(a) names. If the sweep finds
          a control the enumeration does not carry, the enumeration is
          amended and the spec is not narrowed to avoid it; that is how
          criterion 9.2(a) was found to be three short in fix round 2. (e) THE ONE THING
          THAT COULD INVALIDATE THE MEASUREMENT TECHNIQUE: whether a held
          page.mouse.down produces the :active state under the
          chromium-phone project, which sets isMobile and hasTouch
          (playwright.config.ts, the third project). Record the captured
          result. REWRITTEN IN THE M0-P4 FIX ROUND (finding ADV-M0P4-06): the
          fallback this step used to pre-authorise was to measure at 390 by
          844 WITHOUT touch emulation, and that is the one fallback that
          cannot detect the failure the question is about, because it turns a
          touch measurement into a desktop measurement at a phone width,
          which is the M3-P7 error class this phase's own grounding cites. If
          a held page.mouse.down does not produce :active under that project,
          the fallback is NOT to drop touch emulation. Drive the press with
          the touch API instead, page.touchscreen or a dispatched touchstart
          held open, still under hasTouch, and record the captured result. If
          :active still does not apply under touch, then the pressed
          appearance is not built on :active at all: it is built on a class
          or attribute the control carries between pointerdown and pointerup,
          M3-P9's state vocabulary gains that selector, and criterion 9.2 is
          measured against it, still under hasTouch at 390 by 844. Measuring
          the phone width without touch emulation is not an admissible answer
          to this question. (f) Whether a real phone browser is available to
          the container at all; if it is not, record that, because every
          answer above is then an emulation result and says so.
      - text: >-
          Add the nine tokens to styles/tokens.css BEFORE any rule uses them,
          per .claude/skills/pulse-frontend/SKILL.md:70 and CLAUDE.md
          non-negotiable 4, in the file's existing two-layer shape and with
          the same kind of one-line justification the file already carries
          for the M3-P7 additions (styles/tokens.css:144 through :184). The
          nine are named, with the reason each is not already in the file, in
          this phase's token entry in report-code-disagreement, and they are
          --duration-press, --duration-state, --duration-busy-cycle,
          --ease-standard, --press-offset, --color-surface-pressed,
          --color-surface-inverse-pressed, --color-ink-disabled and
          --color-surface-disabled. Add them under their own heading rather
          than under the heading at styles/tokens.css:116, which already
          advertises an elevation group the file does not have.
      - text: >-
          Declare the reduced-motion path IN THE SAME CHANGE as the tokens,
          not after the rules. One @media (prefers-reduced-motion: reduce)
          block in styles/tokens.css redefines --duration-press,
          --duration-state and --duration-busy-cycle at :root, so every rule
          that consumes them follows without knowing about it and no rule can
          forget its own variant. The reduced-motion path removes the
          TRANSITION and the LOOP and never the appearance: a reader who has
          asked the system for less motion still gets a pressed control that
          looks pressed, a disabled control that looks disabled and a busy
          control that looks busy, all arriving at once instead of easing in.
          That is what criterion 9.4 measures, and it is the difference
          between a reduced-motion path and switching the feature off for
          that reader.
      - text: >-
          Write the pressed appearance for every control the criterion 9.2
          selector finds, which at this phase's base is the seven submit
          controls, the three shell nav links, the two month step controls,
          the unresolved pill, the empty-state import link, the sign-up link
          on the sign-in screen, and the spec editor's disclosure summary.
          A pressed control moves by --press-offset and changes its surface,
          and it does BOTH rather than either: the movement is what survives
          a phone screen in daylight and the surface change is what a reader
          who cannot perceive the movement gets. Controls whose resting
          surface is --color-surface-inverse press to
          --color-surface-inverse-pressed and the rest press to
          --color-surface-pressed. Do NOT set -webkit-tap-highlight-color:
          transparent anywhere: on the owner's platform that highlight is the
          only press feedback the product has today, and removing it while
          adding a pressed state is a trade this phase is not making.
          Criterion 9.2 fails the phase if it is set.
      - text: >-
          Write the disabled, busy and unconfirmed appearances as a state
          vocabulary that M3-P10 and M3-P11 will enter and this phase does
          not: the selectors :disabled, [aria-disabled="true"],
          [aria-busy="true"], [data-unconfirmed] and the class the
          link-shaped controls will carry for their busy mark.
          [data-unconfirmed] was ADDED in the M0-P4 fix round (finding
          ADV-M0P4-10): the marking M3-P11 puts on a predicted row cannot be
          aria-busy, because aria-busy tells assistive technology to hold
          back the changes inside the element and would suppress the
          announcement of the very change it marks, so the row carries its
          own attribute and aria-busy stays on the CONTROL that is working.
          A disabled
          control changes to --color-surface-disabled and --color-ink-disabled
          and stops computing cursor: pointer. A busy control keeps its label
          and gains a mark drawn as a pseudo-element on the control itself,
          so that M3-P10 adds no markup for it and no message key in any
          language, and the mark loops on --duration-busy-cycle at full
          motion and stands still at reduced motion. Nothing in the product
          enters these states until M3-P10, which is why criterion 9.3
          measures them by applying the state through the DOM: see decision
          D-28, which says plainly what that technique proves and what it
          does not.
      - text: >-
          Write the measurements as a new Playwright spec and register it in
          playwright.config.ts under BOTH the desktop project and the
          chromium-phone project, by widening that project's testMatch. The
          spec must REACH ALL NINETEEN controls criterion 9.2(a) enumerates,
          which the merchants journey alone does not: it visits the month
          view BEFORE importing, for the empty-state link; it lands on a
          month that has a later one through the month view's own query
          parameter rather than through whatever month the clock gives, for
          the next step control; it opens the spec editor's disclosure on the
          CSV confirmation screen, for the preview-again submit and the
          summary; it visits the sign-in screen, for the sign-in submit and
          the sign-up link, and the sign-up screen, for the sign-in link; and
          it drives one import the parser REJECTS, using the committed
          test/fixtures/unknown-layout.pdf, for the back-to-import link on
          the failed-import screen. It adds no fixture of its own and reuses
          the committed synthetic ones test/e2e/merchants.spec.ts and
          test/e2e/import.spec.ts already drive. This spec is the durable part of the phase: it is what
          makes a later phase that rebuilds one of these screens turn the
          suite red instead of quietly dropping the state.
    files-to-touch:
      - styles/tokens.css
      - src/app/globals.css
      - playwright.config.ts
      - test/e2e/ (one new spec, criterion 9.7 pins the phase to exactly one)
    extras: []
    acceptance:
      - id: "9.1"
        criterion: >-
          The phase work history records an answer to each of the SIX
          verification-first questions with the command and its captured
          output beside it: the seven rule counts over every file git
          ls-files "*.css" returns, the token absence and the exact text of
          the styles/tokens.css section heading, the prefers-reduced-motion
          search over src/, styles/ and test/, the SWEEP that enumerates the
          nineteen controls criterion 9.2(a) pins together with every
          control the 9.2 selector finds that this plan does not name and
          the route by which the spec reaches each of the five conditional
          ones, the captured result of how a held press is produced under
          the chromium-phone project and whether it yields :active, and
          whether a real phone browser is available to the container at all.
          FALSIFIED BY any of the six missing, by a recorded answer that
          carries a conclusion with no captured output beside it, or by a
          sweep that returns a control the enumeration does not name with no
          amendment to the enumeration.
      - id: "9.2"
        criterion: >-
          THE PRESSED APPEARANCE, MEASURED BY PRESSING, OVER A SET THE PLAN
          NAMES AND WITH A DIFFERENCE BIG ENOUGH TO SEE. REWRITTEN IN THE
          M0-P4 FIX ROUND to close findings ADV-M0P4-02 and ADV-M0P4-05, and
          CORRECTED IN FIX ROUND 2 to close DELTA-M0P4-01 and DELTA-M0P4-03.
          The first version let the implementer's own spec decide the
          denominator and asked for a difference with no magnitude. The
          second version fixed both and got the count wrong, enumerating
          sixteen controls where the tree carries NINETEEN, and measured the
          alpha of a pressed tint rather than what that tint composites to.
          Three halves. (a) THE SET IS THE ONE THE PLAN NAMES, AND IT IS
          SWEPT RATHER THAN LOOKED UP. The spec builds the set by running
          the selector on every screen it reaches and COLLECTING what it
          finds, never by looking up a list of known selectors, and asserts
          that the collected set equals the enumeration below, by testid or
          by selector and text where a control has no testid. Both
          directions fail: a control the spec does not reach fails this
          criterion rather than being skipped, and a control the sweep finds
          that the enumeration does not name fails it too. If the
          verification-first sweep in step (d) finds a control this plan
          does not name, the ENUMERATION IS AMENDED to include it and the
          spec is never narrowed to avoid it. THE ENUMERATION IS NINETEEN,
          measured at 89ed187 by a census of the elements this selector
          matches, which returns seventeen source sites rendering nineteen
          controls because src/platform/ui/nav-link.tsx:47 renders three:
          the seven submit controls, the seven navigating controls, the spec
          editor's disclosure summary, the sign-up link on the sign-in
          screen (src/app/(auth)/sign-in/page.tsx:37), the sign-in link on
          the sign-up screen (src/app/(auth)/sign-up/page.tsx:37), the
          import-again link on the import result screen
          (src/modules/import/ui/import-result.tsx:66) and the
          back-to-import link on the failed-import screen
          (src/modules/import/ui/import-result.tsx:36). FIVE of the nineteen
          render only under a condition the journey must create, not the
          four the second version named. The empty-state import link
          requires the month view to be visited BEFORE any import
          (src/modules/overview/ui/month-view.tsx:416). The next month step
          control requires a month that has a later one, reached by the
          month view's own query parameter (src/app/(app)/page.tsx:12 and
          src/modules/overview/ui/month-view.tsx:448 through :449) rather
          than by whatever month the clock lands on. The preview-again
          submit and the disclosure summary require the CSV confirmation
          screen with the spec editor's details element OPENED, since it
          carries no open attribute
          (src/modules/import/ui/profile-confirmation.tsx:151); that screen
          is the DELIMITED path and not the PDF one, which decision D-35
          records as a correction to the review that raised it. The sign-in
          submit and the sign-up link require the sign-in screen, which a
          journey that signs UP never visits. And the back-to-import link
          requires an import the parser REJECTS, for which
          test/fixtures/unknown-layout.pdf already exists. (b) THE PRESSED
          DIFFERENCE. At 1280 by 720 and again at 390 by 844, for every
          control in that set: the spec captures getComputedStyle for
          background-color, color, border-color, box-shadow, transform,
          opacity and text-decoration-line in TWO states, first with the
          pointer resting on the control and NOT pressed, then with the
          pointer held down on the control's centre, and the held snapshot
          differs from the HOVERING snapshot in BOTH of the following. (i)
          MOVEMENT: the computed transform carries a vertical translation
          whose magnitude is at least 1 device-independent pixel and equals
          the computed value of --press-offset, and styles/tokens.css
          declares --press-offset at 1px or more. (ii) SURFACE, REWRITTEN IN
          FIX ROUND 2 (finding DELTA-M0P4-03). The spec COMPOSITES the held
          background-color over the nearest ancestor's non-transparent
          background-color, does the same for the hovering value, and
          requires the two composited colours to differ by a WCAG contrast
          ratio of at least 1.1 to 1; where the control declares its own
          colour rather than a background, the same bar applies to computed
          color. Where the hovering background-color is fully transparent,
          the held one must ALSO carry an alpha of at least 0.08, so a tint
          that clears the ratio only by being nearly opaque and a tint that
          is the page's own colour both fail. A contrast ratio and not a
          luminance difference, because relative luminance is
          scale-dependent: 0.03 of it is about 1.03 to 1 near white, which
          nothing can see, and about 1.4 to 1 near black, and this product's
          surfaces live at the light end. 1.1 to 1 is calibrated to pass a
          five percent grey step on a light surface and to fail a two
          percent one. The alpha floor is kept AS WELL AS the ratio and not
          instead of it, because the page's own background is
          var(--color-surface) (styles/tokens.css:43 and :194) and a pressed
          tint of that same colour at alpha 0.09 clears an alpha-only branch
          while compositing to exactly the surface it sits on. The
          transparent case is real and is why the alpha branch exists at
          all: .app-nav-link (src/app/globals.css:177 through :190),
          .app-signout (:231 through :241, with an explicit background: none
          at :236) and .empty-state-cta (:281 through :287) declare no
          background. The hovering state is the baseline and not the at-rest
          state, deliberately: comparing against at-rest would let the four
          pre-existing hover rules (src/app/globals.css:192, :243, :701,
          :758 at 89ed187) and the fifth at styles/tokens.css:201 pass with
          no pressed rule added at all. Each held press is RELEASED AWAY
          FROM THE CONTROL, by moving the pointer off it before the button
          is raised, so no measurement submits a form or follows a link and
          the sign-out control can be measured in place without ending the
          session. (c) THE PLATFORM'S OWN CUE IS NOT TRADED AWAY. grep -rn
          "tap-highlight" over every file matching *.css under src/ and
          styles/ returns nothing, so the press highlight the owner's
          platform already draws is not removed in the same change that
          claims to add one. The spec names every offender by testid, or by
          selector and text where it has no testid, in its failure message.
          FALSIFIED BY a collected set that is not those nineteen in either
          direction, by one control whose held snapshot fails either (i) or
          (ii) at either width, or by any tap-highlight declaration.
      - id: "9.3"
        criterion: >-
          THE DISABLED, BUSY AND UNCONFIRMED APPEARANCES, MEASURED BY
          ENTERING THEM, AND WITH A MAGNITUDE. No control in the product
          enters any of these states until M3-P10 and M3-P11, so the spec
          applies each state through the DOM and reads the result, which is
          decision D-28 and is a real measurement of the shipped stylesheet
          rather than a grep for a selector. A MAGNITUDE was added in the
          M0-P4 fix round (finding ADV-M0P4-05), because "[disabled] {
          opacity: 0.995 }" satisfied the first version on every control,
          and the magnitude was RESTATED as a contrast ratio in fix round 2
          (finding DELTA-M0P4-03) for the reason criterion 9.2(b)(ii) gives:
          a relative luminance difference is scale-dependent and 3 percent
          of it is invisible at the light end where this product's surfaces
          live. At 1280 by 720 and at 390 by 844, over the same
          nineteen-control set criterion 9.2(a) pins: (a) with the disabled
          attribute set on it where it is a button or an input, and with
          aria-disabled="true" set on it where it is a link or a summary,
          the computed snapshot differs from the AT-REST snapshot in at
          least one of background-color, color and border-color by a WCAG
          contrast ratio of at least 1.1 to 1 between the two COMPOSITED
          colours, measured exactly as criterion 9.2(b)(ii) measures it and
          with the same alpha floor on a transparent resting background, or
          in opacity by at least 0.15, AND the computed cursor is not
          "pointer"; (b) with aria-busy="true" set on it, the computed
          snapshot differs from the at-rest snapshot by at least as much,
          measured the same way, and getComputedStyle(element, "::after")
          returns a content value other than "none" with a non-zero computed
          width, so the busy mark is really drawn; (c) with data-unconfirmed
          set on a list row, that row's computed snapshot differs from its
          at-rest snapshot by at least as much and its ::after content is
          other than "none". Half (c) was ADDED in the first fix round for
          finding ADV-M0P4-10: the unconfirmed marking M3-P11 puts on a
          predicted row must NOT be aria-busy on the row, because aria-busy
          tells assistive technology to hold back the changes inside the
          element and would suppress the announcement of the very change it
          marks, so the row needs a marking of its own and the stylesheet
          has to ship it here. FALSIFIED BY one control whose disabled, busy
          or unconfirmed snapshot differs from its at-rest snapshot by less
          than the stated magnitude, by one that still computes cursor
          pointer while disabled, or by a busy or unconfirmed element whose
          mark has no content or zero width.
      - id: "9.4"
        criterion: >-
          THE REDUCED-MOTION PATH, AND THAT IT REMOVES THE MOTION AND NOT
          THE FEEDBACK. Three halves, each run under a browser context
          created with reducedMotion set to "reduce" and again under one set
          to "no-preference", over the nineteen-control set criterion 9.2(a)
          pins. (a) Under reduce, for every control in that set, every value
          in computed transition-duration is 0s, and computed
          animation-duration is 0s or computed animation-name is none. (b)
          Under no-preference, the same controls report at least one
          non-zero transition-duration between them, so the reduce result is
          a real difference and not an empty stylesheet. (c) THE HALF THAT
          MATTERS: criterion 9.2(b)'s pressed measurement and criterion
          9.3's disabled, busy and unconfirmed measurements are re-run IN
          FULL under reduce, including their magnitudes, and all of them
          PASS, so a reader who asked the system for less motion keeps the
          pressed, disabled, busy and unconfirmed appearances and loses only
          the easing between them. The movement half 9.2(b)(i) is inside
          this deliberately: a pressed control that only moves while a
          transition is running would lose its whole pressed appearance
          under reduce, and that is the failure this half exists to catch.
          FALSIFIED BY a non-zero duration under reduce, by no non-zero
          duration under no-preference, or by 9.2 or 9.3 failing under
          reduce.
      - id: "9.5"
        criterion: >-
          TOKENS ONLY, AND THE TIME LITERALS ARE COVERED TOO. styles/tokens.css
          declares all nine tokens named in this phase's token entry in
          report-code-disagreement, by those exact names, and all four checks
          below hold. (a) grep -rEn "oklch\(|#[0-9a-fA-F]{3,8}|[0-9]+px" over
          src/ restricted to *.tsx exits 1. (b) grep -nE
          "^[^/*]*[0-9.]+(px|rem)" over every file matching *.css under src/
          and styles/ EXCEPT styles/tokens.css returns the same line count,
          with the same declarations, that it returned at this phase's base,
