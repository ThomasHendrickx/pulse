    acceptance:
      - id: "12.1"
        criterion: >-
          CONVERGENCE, COUNTED. A test in test/domain/counterparty-identity.test.ts
          parses test/fixtures/belfius-counterparty-identity.pdf through the
          shipped path and counts DISTINCT counterpartyIdentity keys over its
          rows. The fixture carries 24 rows representing 12 invented
          counterparties, and the test asserts the distinct-key count is
          exactly 12, printing both 12 and 24, and separately asserts that the
          BASELINE derivation (normaliseCounterparty(counterpartyText(row)))
          over the same rows yields EXACTLY 24 distinct keys, one per row,
          printing that number too, so the fixture is proven to reproduce the
          TOTAL non-convergence the owner's month shows on its
          account-carrying rows (11 rows, 11 baseline keys, measured) rather
          than a partly converged version of it. The fixture's composition is
          also asserted, so neither basis can carry the proof alone: at least
          8 rows carry a trusted account over at least 4 distinct accounts,
          and at least 8 rows carry none. A test that asserts only that a rule
          exists, that asserts a count without printing the row count beside
          it, or that admits a baseline count below 24, does not meet this
          criterion.
      - id: "12.2"
        criterion: >-
          CONVERGENCE ON THE OWNER'S OWN MONTH, so the fixture cannot be built
          to pass a bar the real data fails. The phase work history records,
          with the exact command that produced each number, the command
          naming the COMMITTED harness path rather than a scratchpad path, and
          with no descriptor content, the result of running the SHIPPED
          pipeline over the real Belfius document in memory: total rows 39,
          distinct identity keys EXACTLY 20 against a recorded baseline of 25,
          of which the account basis contributes EXACTLY 6 (baseline 11) and
          the descriptor basis EXACTLY 14 (baseline 14); and the same run over
          the real KBC card document records 22 rows and EXACTLY 16 identity
          keys, unchanged from its baseline of 16. BOTH BOUNDS ARE BINDING AND
          THE LOWER ONE MATTERS MOST: over-collapse drives the count DOWN, so
          a ceiling alone would pass hardest exactly when the critical defect
          is worst, and a run producing fewer than 20 is treated as an
          over-collapse and stops the phase until it is explained. Any number
          differing in either direction is reported with the measured value
          rather than the plan's.
      - id: "12.3"
        criterion: >-
          NAMED ONCE, MATCHED AGAIN. A test in
          test/application/counterparty-identity-journey.test.ts imports
          test/fixtures/belfius-counterparty-identity.pdf, asserts that a
          designated counterparty of that fixture appears as ONE unresolved
          group whose count is 3, calls assignMerchant EXACTLY ONCE against
          that group's identity key (asserted by a call counter on the fake
          merchants port, which must read 1 at the end of the test), runs
          interpretation, and then asserts that a DIFFERENT transaction of the
          same counterparty, which the naming was not made from and which
          differs from it in booking date, in amount and in free-text
          communication, now carries that merchant id. The test names both
          transaction ids and the fixture in its assertions. A test that names
          each transaction separately, or that asserts only the group count,
          does not meet this criterion.
      - id: "12.4"
        criterion: >-
          DIFFERENT COUNTERPARTIES STAY DIFFERENT WHERE THE STORED VALUES
          DIFFER. Over the same fixture, a test asserts that no two rows
          carrying different TRUSTED counterparty accounts share an identity
          key, that no account-basis key is equal to any descriptor-basis key,
          and that the 12 identity keys partition the 24 rows exactly as THE
          GENERATOR'S OWN INPUT RECORD says, row by row, so a merge shows up
          as a failed row rather than as a count that still happens to be 12.
          That record is EMITTED BY test/fixtures/generate-pdf-fixtures.ts as
          the list of row ordinal to invented counterparty ordinal pairs it
          generated the fixture FROM, written in the same run that writes the
          PDF; the test imports it from the generator, and a check asserts
          regenerating the fixture reproduces both files byte for byte so the
          record cannot have been hand-edited. A mapping transcribed from
          counterpartyIdentity's own output does not meet this criterion,
          because it would certify the function against itself. STATED
          PLAINLY: this criterion is NOT the guard on H12.1. In every
          mechanism that reaches H12.1 the two rows end up carrying the SAME
          stored value, so this criterion's antecedent is false and it passes
          vacuously; criterion 12.16 is the guard.
      - id: "12.5"
        criterion: >-
          THIS PHASE STRIPS NOTHING NEW. For every row of every committed
          fixture that takes the descriptor basis, the identity key produced
          by this branch is exactly the lowercase literal "descriptor:"
          followed by a suffix BYTE-IDENTICAL to the key the baseline commit
          produces for the same row, asserted by a test that reads a committed
          table of baseline keys generated at the baseline commit and compares
          key.slice("descriptor:".length) against it. A separate test asserts
          normaliseCounterparty never emits a lowercase letter, so no
          descriptor key can ever begin with either namespace and the two key
          spaces cannot collide by construction. And git diff of the baseline
          against this branch shows no
          change to CARD_RAIL_PREFIX, CARD_NUMBER_LABEL, CARD_NUMBER_TAIL,
          CARD_AMOUNT_BEFORE_LABEL, ANGLE_COUNTRY_MARKER,
          TERMINAL_NOISE_PATTERNS, DATE_FRAGMENT_PATTERNS,
          POSTAL_CODE_BEFORE_CITY or CITY_TOKENS in
          src/modules/merchants/domain/normalise-counterparty.ts, and the
          pinned regression table in
          test/domain/normalise-counterparty.test.ts is unchanged.
      - id: "12.6"
        criterion: >-
          A ROW MATCHING NO FAMILY IS NOT GUESSED AT. A test asserts that for
          a row carrying no counterparty account whose descriptor the card
          predicate does not recognise, the identity key is "descriptor:"
          followed by exactly normaliseCounterparty(counterpartyText(row)),
          whose suffix after the namespace is equal character for character to
          the baseline key, and that its basis is reported as descriptor. A
          test asserts the same of a row whose stored counterparty account is
          empty or whitespace only, so no row is ever keyed on a bare
          namespace, which is the hazard
          src/modules/merchants/domain/normalise-counterparty.ts:462 through
          :464 already guards on the descriptor side and which this phase must
          not reintroduce on the account side. The plan and the code state,
          and a test asserts, that no truncation, no opening-prefix key and no
          fallback bucket is ever produced: two such rows share a key only
          when their full normalised descriptors are equal.
      - id: "12.7"
        criterion: >-
          NO NAMING THE OWNER MADE IS DISCARDED, MEASURED AS EFFECT AND NOT
          AS ROWS. Against a seeded database holding MerchantRule rows written
          under the baseline derivation, the test compares the set of
          (transactionId, merchantId) pairs recompute produces BEFORE the
          re-derivation with the set it produces AFTER, printing both sizes,
          and asserts the after set is a SUPERSET of the before set: no
          transaction that carried a merchant id loses it, and no transaction
          changes from one merchant to another. SELECT COUNT(*) FROM
          merchant_rules before and after is reported beside it and is NOT by
          itself sufficient, and the plan says why: a rule left byte-identical
          survives as a row and, once the key has changed under it, matches
          nothing, so the row count is preserved while the naming is dead. The
          routine prints one line per rule it touched carrying the rule id,
          the pass, the new basis, the number of transactions the old pattern
          matched and the number the new pattern matches, and lists separately
          every rule whose matched count INCREASED, which is the broadening
          decision D-45 authorises and makes visible. It exits non-zero on
          exactly two conditions: a merchant-conflict, meaning two rules for
          DIFFERENT merchants would collide on one new pattern, which is a
          genuine ambiguity a person must settle; and a LOST assignment,
          meaning the superset test above fails. Every other outcome,
          including a rule that could not be promoted, is printed, counted and
          exits 0, because a rule left safely in place is not a reason to
          block a deploy. A test asserts the routine issues no UPDATE and no
          DELETE against any pattern written under the ACCOUNT namespace and
          never rewrites a descriptor pattern into an account one, so
          promotion is additive and the declaration the owner made survives
          the run verbatim, which is what answers pulse-domain section 2's
          classification of MerchantRule as a declaration the engine does not
          rebuild. THE TWO BLOCKING CONDITIONS HAVE AN ACKNOWLEDGE
          PATH, decided deliberately rather than left as an unreachable green:
          the routine accepts a flag naming the specific rule ids whose
          conflict or lost assignment a person has seen and accepted, exits 0
          for exactly those, and prints them as accepted; a test asserts the
          flag clears only the ids it names and clears nothing else. No criterion in this phase is met by a run that
          removed a rule row or lost an assignment.
      - id: "12.8"
        criterion: >-
          THE RE-DERIVATION IS IDEMPOTENT, AND IDEMPOTENT MEANS THE SAME
          ANSWER RATHER THAN A QUIET ONE. Running the script a second time
          rewrites zero patterns, adds zero rules, and prints the same
          DECISION REPORT as the first run, byte for byte, that report being
          the rule id, the pass that touched it, the resulting basis and the
          outcome for every rule; and it returns the SAME exit code. The
          matched-count columns criterion 12.7 requires are EXCLUDED from that
          comparison, and the criterion says why rather than leaving it to be
          rediscovered: on the second run a rule's old pattern is the pattern
          the first run wrote, so for any rule whose rows split across the two
          bases the counts legitimately differ while the decision does not,
          and comparing them would turn a CORRECT run red and push the
          implementer toward a seed containing no split rule, which is the
          dataset-choosing this criterion exists to forbid. The full
          merchant_rules table is still compared in full. The test runs
          against a database seeded to contain at least one rule the routine
          cannot promote, at least one rule whose matched rows split across
          the two bases, and at least one merchant-conflict. Requiring exit 0 on the second run
          would contradict criterion 12.7 on any database holding a conflict,
          since the routine deletes nothing and the condition therefore
          persists; an implementer who satisfies the two criteria against two
          different seeded databases has not met this one.
      - id: "12.9"
        criterion: >-
          FACTS ARE NOT REWRITTEN AND THE CHANGE IS A DERIVATION PLUS A
          RECOMPUTE. A test asserts the re-derivation issues no write against
          the transactions table at all, and grep over this phase's steps
          shows no step that updates a transaction fact field. Separately, the
          pulse-domain section 2 test: a test clears every
          transactions.merchantId, runs the existing recompute, and asserts
          the identical assignment set returns, so the naming survives
          entirely as a declaration plus a derivation.
      - id: "12.10"
        criterion: >-
          PREFIX AND PATTERN ARE SETTLED. A unit test asserts that a PREFIX
          rule whose pattern is a proper prefix of an ACCOUNT-basis key
          returns undefined from matchRules, that a PATTERN rule whose glob
          matches an account-basis key returns undefined, and that both kinds
          still match a descriptor-basis key as they do today. A test asserts
          assignMerchant writes kind EXACT and only EXACT. git diff of the
          baseline shows NO change to the MerchantRuleKind enum in
          prisma/schema/merchants.prisma, and grep of
          prisma/schema/merchants.prisma and
          src/modules/merchants/domain/merchant-rule.ts shows the stated
          disposition, that no product surface writes either kind today, in
          both files.
      - id: "12.11"
        criterion: >-
          THE TWO SCREENS AGREE WHERE THEY ARE MEANT TO. A test runs the
          merchant review builder and the overview fold over ONE dataset drawn
          from a single month and asserts that for every row NOT matched by
          the overview's cash predicate and with options.useTags false, the
          two produce the same set of unresolved group keys and the same row
          count per key. Three divergences are named as expected exceptions
          rather than avoided by choosing a dataset without them, which would
          be the dataset-choosing hazard H12.8 exists to prevent: the fold
          branches on cash FIRST into one shared key
          (src/modules/overview/domain/month-projection.ts:63 through :66) and
          the review has no cash concept at all
          (src/modules/merchants/domain/merchant-review.ts:77 through :98);
          the fold regroups by primary tag when useTags is set
          (src/modules/overview/domain/month-projection.ts:67 through :74) and
          the review never does; and the two differ in SCOPE, the overview
          bounding by booking date
          (src/modules/overview/adapters/overview-repository.ts:130 through
          :131) where listCountedTransactions has no date bound
          (src/modules/merchants/adapters/merchant-repository.ts:229 through
          :243). The test asserts each divergence at its named site.
          The SQL pin in test/domain/merchant-review.test.ts is updated to the
          new fragment and still asserts that fragment appears exactly once in
          src/modules/overview/adapters/overview-repository.ts and that both
          reads use it.
      - id: "12.12"
        criterion: >-
          THE MODULE BOUNDARY HOLDS. The MerchantResolver port still has
          exactly one member, asserted by the existing key-set assertion in
          test/application/resolve-merchants.test.ts updated to the new member
          name, so no code path in interpretation can write a MerchantRule.
          The ledger's own counterpartyKey
          (src/modules/ledger/domain/corrections.ts:209) is unchanged, asserted
          by git diff showing no change to
          src/modules/ledger/domain/corrections.ts, so no flow classification
          moves.
      - id: "12.13"
        criterion: >-
          NOTHING OF THE OWNER'S DATA REACHES THE REPOSITORY. npm run
          gate:privacy passes; every identifier in the new fixture is listed
          in test/fixtures/allowed-identifiers.txt with its provenance; the
          phase work history reports counts only and quotes no descriptor,
          counterparty, place, amount or date from either real document; and
          the branch's commit messages carry no data of any kind.
      - id: "12.14"
        criterion: >-
          THE STANDING GATE. npm run typecheck, npm run lint, npm test and
          npm run gate:privacy all exit 0, and npm run test:e2e exits 0, each
          with its captured output in the phase work history.
      - id: "12.15"
        criterion: >-
          THE WHOLE-CORPUS EFFECT IS RECORDED, NOT ONLY THE HAPPY FIXTURE. The
          phase work history carries one line per committed fixture with the
          distinct merchant-group count under the baseline derivation and
          under the new one, produced by a committed script so the numbers can
          be regenerated. Every fixture whose new count is HIGHER than its
          baseline count is listed with the reason, and for each such fixture a
          test asserts that naming both of the split groups with the SAME
          merchant name lands both under ONE merchant id, so the split is
          recoverable by the owner rather than permanent.
      - id: "12.16"
        criterion: >-
          THE ACCOUNT BASIS FAILS CLOSED, AND THIS IS THE GUARD ON H12.1
          RATHER THAN CRITERION 12.4. A unit test over WHOLLY INVENTED inputs
          asserts that each of the following yields a DESCRIPTOR-basis key and
          never an account-basis one: an account that is empty or whitespace
          after uppercasing and whitespace removal; an account whose country
          code the pinned country-length table does not carry; an account
          whose length differs from the length that table assigns its country
          code; and an account that fails the ISO 7064 mod-97 check. The
          TRUNCATION case is asserted end to end rather than only as a
          predicate: the fixture row whose description carries a
          longer-than-Belgian account written spaced is parsed through the
          SHIPPED importer, the test asserts the stored account is a strict
          PREFIX of the invented source value, and asserts that row takes the
          descriptor basis, so two rows whose sources differ only after the
          twelfth digit can never share an identity key. THE TABLE CLOSES
          TRUNCATION DETERMINISTICALLY RATHER THAN PROBABILISTICALLY, and the
          reason is one sentence: truncation can only ever emit a
          SIXTEEN-CHARACTER value, so it only reaches accounts whose true
          length exceeds sixteen, and such a value always carries a country
          code whose table length is not sixteen. mod-97 alone would leave a
          residual of roughly one in ninety-seven, measured uniform across
          source lengths, which is why both tests are required and not either.
          FIFTH CASE, pinning a behaviour rather than a guard: the fixture row
          whose description carries two distinct account-shaped tokens is
          asserted end to end, the test stating which token the generator
          wrote FIRST and asserting the stored account, and therefore the
          identity key, is that one, so the first-wins rule at
          src/modules/import/domain/belfius-current-account-template.ts:266
          through :272 is PINNED rather than incidental. The assertion names
          the parked item that owns the question, so a later change from
          first-wins to last-wins or longest-wins is red here before it
          silently moves 4 of the owner's 39 rows. Measured on the real
          month before this criterion was written, so it is known to cost
          nothing: all 11 stored accounts pass all three tests and the trusted
          distinct count is still 6. Every value used is invented and listed
          in test/fixtures/allowed-identifiers.txt.
      - id: "12.17"
        criterion: >-
          THE RE-DERIVATION HAS ONE NAMED INVOCATION POINT AND ONE STATED
          ORDER. package.json carries a script that runs
          scripts/rederive-merchant-rules.ts, asserted by a test that reads
          package.json and finds it; decision D-46 states that it runs AFTER
          the code deploy and why that is forced rather than chosen; and the
          phase work history records the command actually run against the
          deployed database with its exit code and its printed before-and-after
          assignment-set sizes, with no pattern content. A phase that ships
          the routine with no invocation point does not meet this criterion,
          and neither does one whose work history records only that the
          routine exists.
      - id: "12.18"
        criterion: >-
          THE RULE SUBJECT IS VALIDATED AT THE WRITE BOUNDARY. assignMerchant
          returns a typed error, and writes nothing, for a counterpartyText
          that does not begin with one of the two known namespaces, and for an
          account-basis subject whose remainder is empty after uppercasing and
          whitespace removal or fails the trust gate. A test asserts each
          case, and an e2e test asserts that submitting a PRE-MIGRATION
          un-namespaced key, which is what a page left open across the deploy
          submits, surfaces that error to the reader rather than silently
          writing a rule that can never match anything. This replaces the
          guard at src/modules/merchants/application/assign-merchant.ts:54
          through :57 that step 4 removes, and the phase does not remove that
          guard without putting this one in its place.
      - id: "12.19"
        criterion: >-
          THE GOVERNING DOCUMENT SAYS WHAT THE CODE DOES. pulse-domain section
          7's resolution chain is amended in the same change to state that
          resolution keys on a namespaced counterparty IDENTITY with two
          bases, the counterparty account where the row carries a TRUSTED one
          and the normalised descriptor otherwise, and that PREFIX and PATTERN
          never apply to an account basis. grep of
          .claude/skills/pulse-domain/SKILL.md shows the account basis inside
          that chain and shows no remaining sentence saying the key is the
          normalised counterparty string.
      - id: "12.20"
        criterion: >-
          THE RESIDUE IS COUNTED AND NAMED, so the size of the problem this
          phase does NOT solve is a number rather than a decision's prose. The
          phase work history records, for each real document and for the
          committed corpus, the number of rows whose identity key is shared
          with no other row after the change and the number of DISTINCT such
          keys, alongside the same two counts at the baseline. The record
          states plainly that a row in that set still needs naming per row,
          and it names the two documents separately, since the card document
          is in exactly the same position and the earlier draft of this plan
          did not say so. No content is recorded.
      - id: "12.22"
        criterion: >-
          THE TRUST TABLE IS PINNED AND SOURCED, in the shape this codebase
          already uses one tier down for exactly this kind of object
          (src/modules/merchants/domain/normalise-counterparty.ts:127 through
          :132: pin the accepted shapes, never widen, with
          test/domain/normalise-counterparty.test.ts as the pin that makes an
          accidental edit red). The country-length table is a committed
          constant in the merchants domain, each entry carrying a country code
          and a length, with the ISO 13616 registry named as its source in a
          comment beside it and populated from that registry rather than from
          the countries seen so far. A regression test pins its FULL contents,
          so adding, removing or altering an entry is red rather than silent.
          A separate test asserts the entry for the country of the committed
          fixtures resolves to the length those fixtures use, so a wrong entry
          fails the FAST gate rather than only the work-history measurement in
          criterion 12.2.
      - id: "12.21"
        criterion: >-
          PASS ONE CANNOT LOSE A RULE'S MEANING, FOR ANY KIND. A property test
          over generated (pattern, key) pairs asserts that for every kind,
          matchRules applied to the namespaced pattern and the namespaced key
          returns exactly what matchRules applied to the bare pattern and the
          bare key returns, and the generator INCLUDES the empty pattern and
          an already-namespaced pattern among the cases it produces, so pass
          one's two guards are red rather than unreached: EXACT because
          equality is preserved under a common
          prefix, PREFIX because
          ("descriptor:" + K).startsWith("descriptor:" + P) holds precisely
          when K.startsWith(P), and PATTERN because the glob is anchored at
          both ends. A separate assertion covers the case the property test
          cannot generate: no PREFIX or PATTERN rule produced by pass one ever
          matches an ACCOUNT-basis key, which is D-40's refusal.
    hazard-classes:
      - id: H12.1
        statement: >-
          The key collapses so far that two genuinely different counterparties
          become one group, which silently merges the owner's money and is
          worse than today because today's failure is visible and this one is
          not. It does NOT enter through stripping, where this phase changes
          nothing; it enters through the account basis this phase adds, which
          is a regex scrape out of free text that nothing validates.
        addressed-by: criterion 12.16
      - id: H12.2
        statement: >-
          Convergence is proved on a fixture built to converge, so the
          criterion passes and the owner's own month still does not.
        addressed-by: criterion 12.2
      - id: H12.3
        statement: >-
          The naming the owner has already made is lost when the key changes,
          because the stored pattern no longer reproduces and nothing notices.
        addressed-by: criterion 12.7
      - id: H12.4
        statement: >-
          The key is fixed by rewriting stored transaction rows, breaking the
          rule that facts are immutable.
        addressed-by: criterion 12.9
      - id: H12.5
        statement: >-
          Real descriptor content from the owner's statements reaches the
          plan, a fixture, a commit message or a work history while the shape
          is being reproduced.
        addressed-by: criterion 12.13
      - id: H12.6
        statement: >-
          A row whose counterparty cannot be identified is given a shortened
          or bucketed key that quietly groups it with an unrelated row.
        addressed-by: criterion 12.6
      - id: H12.14
        statement: >-
          A longer-than-Belgian account written spaced is scraped as a
          sixteen-character PREFIX of itself
          (src/modules/import/domain/belfius-current-account-template.ts:88),
          so two different accounts differing only after the twelfth digit are
          stored as one value and merge into one counterparty. Demonstrated on
          invented values: both scrape to one identical sixteen-character
          value.
        addressed-by: criterion 12.16
      - id: H12.15
        statement: >-
          A stored account that is empty or whitespace only keys every such
          row on the bare namespace, collapsing unrelated rows into one group,
          which is the hazard the descriptor side already guards at
          src/modules/merchants/domain/normalise-counterparty.ts:462.
        addressed-by: criterion 12.6
      - id: H12.16
        statement: >-
          A description offering two account-shaped tokens has its identity
          decided by which one the bank printed first
          (src/modules/import/domain/belfius-current-account-template.ts:266
          through :272), measured on 4 of the owner's 39 rows.
        addressed-by: >-
          judgment-property-of-prose: choosing between two account-shaped
          candidates is an IMPORTER decision about a fact column, so it is a
          template version bump and a re-parse rather than a derivation
          change, and it cannot be answered inside this phase without
          rewriting facts. It is carried on the plan's parked surface with its
          measurement, and until it is answered the trust gate in step 2 means
          a wrongly chosen candidate that is not a complete valid account
          takes the descriptor basis rather than merging.
      - id: H12.17
        statement: >-
          The convergence proof is self-certifying, because the expected
          row-to-counterparty mapping is transcribed from the implementation's
          own output rather than authored from the fixture's intent.
        addressed-by: criterion 12.4
      - id: H12.25
        statement: >-
          Pass one namespaces a pattern that already carries a namespace, so a
          naming the owner made inside D-46's window is killed on the FIRST
          run, where a second-run comparison would never see it.
        addressed-by: criterion 12.21
      - id: H12.26
        statement: >-
          Pass one turns a stored empty pattern, inert today under
          src/modules/merchants/domain/merchant-rule.ts:65, into a bare
          namespace that a PREFIX rule matches every descriptor key with.
        addressed-by: criterion 12.21
      - id: H12.27
        statement: >-
          The idempotence check compares matched counts that legitimately
          differ between runs, so a CORRECT run goes red and the implementer
          seeds around it with a database containing no split rule.
        addressed-by: criterion 12.8
      - id: H12.28
        statement: >-
          The country-length table is edited, trimmed or mistyped and nothing
          goes red, so a country silently leaves the account basis and every
          row of that counterparty stops converging.
        addressed-by: criterion 12.22
      - id: H12.29
        statement: >-
          A later change to the importer's first-wins candidate selection
          silently moves the identity of 4 of the owner's 39 rows, because the
          behaviour is parked as a question and pinned by nothing.
        addressed-by: criterion 12.16
      - id: H12.18
        statement: >-
          A rule survives as a row while its EFFECT dies, because the key
          changed under it, and a row-count check reports the migration clean.
        addressed-by: criterion 12.7
      - id: H12.19
        statement: >-
          The re-derivation blocks a deploy that can never go green again,
          because a condition it can never clear returns a non-zero exit
          forever and no acknowledge path exists.
        addressed-by: criterion 12.7
      - id: H12.20
        statement: >-
          The routine is shipped with nowhere to run from, so the migration is
          described rather than performed and criterion 12.7's exit code is
          observed by nobody.
        addressed-by: criterion 12.17
      - id: H12.21
        statement: >-
          assignMerchant loses its normalisation and gains no replacement
          guard, so a stale page writes a rule subject that can never match.
        addressed-by: criterion 12.18
      - id: H12.22
        statement: >-
          pulse-domain section 7 keeps describing a resolution chain the code
          no longer implements, and it is loaded into every task's context.
        addressed-by: criterion 12.19
      - id: H12.23
        statement: >-
          The headline numbers are recorded against a harness nobody else can
          run, so the measurement cannot be checked without rewriting it.
        addressed-by: criterion 12.2
      - id: H12.24
        statement: >-
          The rows that still cannot converge are never counted, so the owner
          is told the promise is kept while a bounded number of rows on their
          own month still need naming per row.
        addressed-by: criterion 12.20
      - id: H12.7
        statement: >-
          A new descriptor family is induced from one month of one bank and
          over-fires on a shape nobody has seen, which is the failure
          src/modules/merchants/domain/normalise-counterparty.ts:127 through
          :132 already forbids one tier down.
        addressed-by: criterion 12.5
      - id: H12.8
        statement: >-
          The merchant review and the month view disagree about what a group
          is, because the rule is written once in TypeScript and once in SQL
          and only one of them changes.
        addressed-by: criterion 12.11
      - id: H12.9
        statement: >-
          Moving CSV rows from name-keyed to account-keyed splits a merchant
          that is paid through two accounts, and the split is discovered by
          the owner rather than by this phase.
        addressed-by: criterion 12.15
      - id: H12.10
        statement: >-
          The resolver is handed a raw text somewhere that was missed, and it
          silently resolves nothing rather than failing, because the port
          still accepts a string.
        addressed-by: criterion 12.12
      - id: H12.11
        statement: >-
          The identity change reaches flow classification through the ledger's
          own counterparty key, so resolution reclassifies instead of only
          renaming and regrouping.
