decisions:
  - id: D-1
    statement: >-
      The v0.2 work is milestone M3 (phases M3-P1 through M3-P5). M2 stays
      reserved for intake slices 5 and 6 exactly as the v1 plan left them,
      gated on DR-0002; the owner directed v0.2 ahead of the DR-0002 month
      (fleet backlog, 2026-08-21), and reusing M2 for different content
      would silently rewrite a merged plan's meaning.
  - id: D-2
    statement: >-
      SourceProfileSpec becomes a discriminated union on a kind field:
      "delimited" carrying the existing shape unchanged
      (source-profile.ts:49) and "pdf-layout" carrying templateId and
      templateVersion. The StatementParser port shape (ports.ts:18) and the
      spec-equality recognition path (upload-statement.ts:101) stand
      unchanged; layout templates are code-owned and selected by
      fingerprint, never by asking the user
      (pulse-v0.2-pdf-addendum.md:23). Chosen over a parallel PDF-only port
      because the upload pipeline, profile recognition, account binding and
      re-parse machinery all key on the one spec type, and a second port
      would duplicate every one of those seams.
  - id: D-3
    statement: >-
      Committed fixtures are synthetic PDFs produced by a committed
      deterministic generator script (stable bytes, fixed metadata), plus
      extracted-text unit fixtures where a template test wants them. Both
      real statements carry full text layers, so the parser consumes the
      text layer and no OCR path exists in v0.2; generating real PDF bytes
      keeps the extraction adapter inside the tested path instead of only
      the template logic. No identifier, name, amount, date or merchant
      string from the real statements appears in any fixture.
  - id: D-4
    statement: >-
      The Belfius PDF dedup key follows the addendum (account plus year of
      booking date plus sequence number, pulse-v0.2-pdf-addendum.md:68),
      emitted through the existing natural-key mechanism (dedup.ts:95) with
      the year as the statement-scope component; the exact wiring is
      settled by M3-P2's verification-first step because the implemented
      key shape is statement-scoped and the addendum's cross-statement
      continuity premise rests on the owner's format knowledge plus one
      observed statement. The year-scoped key is strictly safer against
      re-exported or overlapping statements. Unifying dedup keys across the
      CSV and PDF paths for the same account is parked, not decided.
  - id: D-5
    statement: >-
      The import failure vocabulary grows exactly two machine reasons,
      "layout-unsupported" and "balance-mismatch", extending the existing
      union (ports.ts:38) and translated in the three catalogs like the
      existing reasons, so an unrecognised layout is a loud translated
      failure and never a user-facing parser question
      (pulse-v0.2-pdf-addendum.md:27).
  - id: D-6
    statement: >-
      Opening and closing balances are verified at parse time and NOT
      persisted: no schema change anywhere in v0.2. The settlement matching
      machinery derives card totals from stored rows
      (src/modules/ledger/domain/interpret.ts:67) and needs no stored
      balance; persisting balances for audit is parked until something
      reads them.
  - id: D-7
    statement: >-
      Navigation is server-rendered links in the authenticated shell
      (layout.tsx) with the active route derived from the request path: no
      client state library (the deliberately-absent list,
      charter.yaml:80), no route registry abstraction for three links.
  - id: D-8
    statement: >-
      The KBC balance identity is: previous balance plus the sum of all
      transaction rows including the DOMICILIERING settlement credit equals
      the Afrekening amount, the closing figure sitting on the Afrekening
      line (space thousands separator), because that is the identity that
      closes exactly in integer cents on the real statement; the addendum's
      looser "closing balance or settlement total" wording is pinned to
      this verified form.
  - id: D-9
    statement: >-
      LLM-assisted extraction for unknown layouts stays out of v0.2
      entirely. The addendum permits it in principle for v0.3+ behind the
      balance gate (pulse-v0.2-pdf-addendum.md:45); nothing in this plan
      builds toward it beyond the gate itself, which M3-P2 ships for its
      own reasons.
  - id: D-10
    statement: >-
      An unauthenticated share is NOT preserved through sign-in: the share
      route redirects to sign-in, stores no Import row, no bytes and no
      server-side handoff, and the user shares again after signing in,
      the share sheet being one tap away (finding PR2-005). Chosen over a
      bounded server-side handoff because the handoff stores
      unauthenticated bytes before any household context exists, which is
      hazard H5.2's exact shape, and its whole benefit is saving one tap
      on a rare cold-session path; criterion 5.4 witnesses the
      no-preservation contract.
  - id: D-11
    statement: >-
      The merchant source stays counterpartyName ?? description and does
      NOT become a per-SourceProfile or per-template concern; what changes
      is that the rule gets ONE definition, an exported helper both call
      sites use (src/modules/ledger/application/interpret-window.ts:87 and
      src/modules/merchants/domain/merchant-review.ts:50 currently define
      it twice). Considered and rejected under R-005 as a question with a
      defensible answer rather than a genuine fork: a template-declared
      merchant extractor would put an INTERPRETATION concern inside the
      code-owned facts-parsing layer, which the facts-versus-interpretation
      split forbids; the CSV path carries the same descriptor shapes and
      would gain nothing from template ownership; the merchants normaliser
      is the one place with a stability contract and a pinned regression
      table, so grouping logic belongs there; and the choice is cheap to
      revisit, since adding a template hook later is additive and touches
      no stored data. No decision record is raised. FORWARD NOTE, recorded
      from the fix-round-2 adversarial review, which judged this decision
      correct and named one cost to keep in view rather than a finding:
      every future bank grammar added to the shared normaliser is a CR-402
      recipe change that re-normalises every household's stored rules, so
      the SECOND bank grammar is the moment to revisit the
      template-extractor option rather than to add a third set of patterns
      here by reflex.
  - id: D-12
    statement: >-
      Card-number masking is DISPLAY ONLY. The masking helper is applied
      to rendered labels and to nothing else: not to rawLine, which stays
      verbatim because facts are immutable
      (prisma/schema/import.prisma:106) and the statement genuinely prints
      the unmasked number; not to the normalised grouping key; and not to
      the hidden counterpartyText value the review form submits
      (src/modules/merchants/ui/merchant-review.tsx:42), because that
      value becomes the EXACT MerchantRule subject
      (src/modules/merchants/application/assign-merchant.ts:54) and a
      masked subject would match no future transaction. Criterion 6.4
      witnesses the unmasked subject, criterion 6.3 the masked label.
  - id: D-13
    statement: >-
      Which branch of the CR-402 stability contract M3-P6 ships is
      selected by MEASUREMENT, not by assumption: the verification-first
      step counts stored MerchantRule rows in the deployed database over
      an explicitly pinned read-only connection and records the number,
      zero selecting the no-migration branch and any nonzero count
      selecting the one-off re-normalisation of stored EXACT and PREFIX
      patterns in the same change. The claim that production holds no
      rules is thereby made checkable rather than asserted, and criterion
      6.6 fails if the record or the migration is missing.
  - id: D-14
    statement: >-
      The rebuild is TWO phases, not one and not three: M3-P7 carries the
      constraint change, the tokens, the app shell and the month view, and
      M3-P8 carries the merchant review. They are separable because the
      dependency runs one way only: M3-P8 consumes the tap-target token, the
      row-height token and the two-line row primitive that M3-P7 defines and
      contributes none of its own back, which criterion 8.7 pins by requiring
      styles/tokens.css to be unchanged by M3-P8. Splitting further would be
      dishonest, and so would merging them: the shell, the tokens and the
      month view cannot be split from each other because the shell is where
      the 44px rule first lands and the month view is the only screen that
      exercises the wide-width rail, while the merchant review shares nothing
      with them except the stylesheet and the primitives. The cost of the
      split is that the two screens are briefly inconsistent between the two
      merges, which is visible only to whoever is running the fleet.
  - id: D-15
    statement: >-
      The pulse-frontend skill's desktop-first paragraph is replaced ONCE, by
      M3-P7, and M3-P4 does not replace it a second time. M3-P4 was written
      before DR-0022 and its step 1 said the same paragraph would be revised
      to "import is mobile-first, the month view remains desktop-competent",
      which DR-0022 supersedes: mobile first is now every screen, not the
      import screens alone. M3-P4's step 1 is amended to a CHECK that the
      constraint M3-P7 wrote is present and unweakened, and criterion 4.4 is
      ADDED to carry that check; criteria 4.1, 4.2 and 4.3 are left byte
      unchanged and are all still satisfiable, because 4.2's grep for "desk
      activity" exits 1 either way and 4.2's mobile-first stance line is
      present either way. Nothing in M3-P4 is weakened; one duplicated edit
      is removed.
  - id: D-16
    statement: >-
      The stylesheet is allowed exactly ONE breakpoint, and the value is
      declared as a token even though the token cannot be referenced from the
      media condition. The tree reached b560e85 with zero media queries on
      purpose: src/app/globals.css:97 records that a var() cannot appear in a
      media-query condition, so the alternative to a literal was intrinsic
      wrapping, and the M3-P6 comment at src/app/globals.css:696 chose
      wrapping for exactly that reason. Mobile first changes the calculation:
      the phone layout is now the default and the rail is the exception, and
      an exception stated as "wrap when it happens to fit" cannot express
      "spend wide with income and reserves beside it". So one @media
      (min-width) condition is permitted, its literal is mirrored by a
      breakpoint token in styles/tokens.css so a reader finds it where every
      other layout constant lives, a comment says why the literal is repeated,
      and criterion 7.3 fails the moment a second distinct condition appears.
      This is an engineering call with a defensible answer, not a product
      fork, so it is decided here and no decision record is raised.
  - id: D-17
    statement: >-
      Names WRAP and are never truncated, on both rebuilt screens, against
      the mockup. The mockup ellipsizes every long name
      (Main.dc.html:87, :131, :158, :168; MerchantReview.dc.html:31, :46,
      :61), the shipped screen wraps (src/app/globals.css:803 through :808),
      and .claude/skills/pulse-frontend/SKILL.md:122 forbids truncating
      anything the user needs. A Belgian bank descriptor and a Dutch or
      French label are exactly the strings that lose their meaning in their
      last twelve characters, and the mockup's own README says it is a layout
      reference and not a source of truth. The single deliberate exception in
      the tree stays: the household identity may ellipsize
      (src/app/globals.css:160 through :166), which M3-P1 criterion 1.5
      decided and criterion 8.4 pins to that one rule.
  - id: D-18
    statement: >-
      The mockup is a LAYOUT reference. Where it and the shipped product
      disagree about copy, about data, or about what the screen can do, the
      shipped product wins unless the difference is one of the six things
      delivery/design/mobile-v02/README.md:24 through :40 says the mockup
      exists to fix. By that rule the rebuild adds no message key in any
      language (criteria 7.10 and 8.7 pin messages/ to an empty diff), builds
      no rename capability, prints no month span it has no dates for, and
      keeps the merchant review's two direction sections and their totals.
      Four mockup elements are parked rather than dropped silently; each is
      listed under parked with the file and line that shows it has nothing
      behind it.
  - id: D-19
    statement: >-
      ORDERING. M3-P7 runs first, then M3-P8, and both run BEFORE M3-P4 and
      M3-P5. Before M3-P4 because M3-P4 rewrites the same skill paragraph
      (decision D-15) and because M3-P4 designs the import screens
      mobile-first and would otherwise invent its own tap-target and row
      tokens hours before M3-P7 adds the real ones. Before M3-P5 because the
      whole point of a share target is that the phone hands Pulse a statement
      and the user lands on the month view: shipping that entry point onto
      the screen the owner graded 1/10 delivers the defect faster rather than
      fixing it. INDEPENDENT of M3-P3, which is implemented, green and
      paused: M3-P3's files-to-touch are src/modules/import/domain/,
      test/fixtures/ and test/application/ and it changes no UI file, so its
      review can resume at any point without waiting for or blocking the
      rebuild. Severity is the tie-breaker where the ordering was otherwise
      free: the owner's own grade of the shipped product is the highest-
      severity open item in v0.2 and DR-0002's clock does not start until the
      owner can actually use Pulse from a phone.
  - id: D-20
    statement: >-
      Both rebuild phases are LAYOUT phases and the plan makes that
      falsifiable rather than aspirational: criteria 7.10 and 8.7 require git
      diff --name-only over the domain and application directories, prisma/
      and messages/ to print nothing. If the rebuild turns out to need a
      projection change, the phase stops and says so rather than growing one,
      which is the same discipline CLAUDE.md's scope-discipline section
      applies to queues, caches and state libraries. Nothing in either phase
      needs a queue, a cron, an event bus, a cache, a state management
      library, a component library, a per-transaction override, a goal or a
      budget, and the icons the mockup draws are hand-written inline SVG
      precisely so that no icon library is added.
  - id: D-21
    statement: >-
      The phone project uses a chromium device descriptor with isMobile true
      rather than a bare viewport override, and this is load-bearing rather
      than stylistic. Playwright without isMobile sizes the layout viewport
      directly and never consults the meta viewport tag, which is exactly why
      three existing phone specs (test/e2e/navigation.spec.ts:168,
      test/e2e/merchants.spec.ts:166, test/e2e/import.spec.ts:184) pass
      whether that tag exists or not, and whether it exists is unconfirmed at
      b560e85. The specs that already set their own viewport with test.use
      keep doing so and keep working; the project adds the device profile
      that makes criterion 7.2 mean something.
open-questions:
