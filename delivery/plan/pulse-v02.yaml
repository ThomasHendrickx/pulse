  - id: M3-P10
    branch: claude/m3-p10-pending-feedback
    intent: >-
      A press changes the DOM before the server answers: one shared client
      submit leaf gives all seven submit controls a busy state that cannot be
      pressed twice, two client leaves give the seven navigating controls a
      pending marker, and the evidence is the measured interval between the
      press and the first DOM change at a phone viewport with the server
      action artificially delayed. This phase acknowledges every press and
      PREDICTS NOTHING: the prediction DR-0025 decided is M3-P11's job and
      needs this layer under it. The client boundary opens in src/platform/ui
      and nowhere else, and this phase changes no stylesheet.
    grounding: >-
      The owner's report of 2026-08-23, quoted verbatim in standing-context,
      second half: "after pressing, nothing happens in the UI untill the full
      server cycle comes back". Measured at 89ed187 and recorded with
      captured output in this phase's report-code-disagreement entries: a
      grep over src/ for useFormStatus, useOptimistic, useTransition,
      isPending and aria-busy returns nothing; the application has exactly
      one client component, src/platform/ui/nav-link.tsx:1; the six forms are
      seven submit controls behind seven rendered server actions, with the
      merchant naming form rendered once per unresolved group; and seven Link
      navigations carry the same dead interval and are not forms. The
      governing document is .claude/skills/pulse-frontend/SKILL.md, section 1
      for the boundary rule (SKILL.md:10 and SKILL.md:12: "use client" needs
      one of three reasons and is pushed to the leaf, and a page is a server
      component that renders a small client island) and section 2 for what
      may not cross (SKILL.md:44, no second copy of the domain types in the
      frontend). CLAUDE.md scope discipline binds: no state management
      library, no component library, no animation library and no new
      dependency; React's useFormStatus, useOptimistic and useTransition and
      the app router's useLinkStatus are built in and are not libraries.
      DR-0025 is DECIDED (owner, 2026-08-23, optimistic and revert loudly on
      failure) and DR-0026 with it (the revert is told by a hand-built
      toast); decisions D-30, D-31 and D-32 record what they mean. Neither
      gates this phase, because this phase builds the layer both of them sit
      on and predicts nothing itself, which criterion 10.10 measures. This
      phase is grounded at 89ed187, not at this plan's
      baseline-commit e4ea3ba, and it consumes the state vocabulary M3-P9
      defines and adds none of its own.
    severity: high
    verified-root-cause: >-
      Every form in the application is a plain server-action form with no
      client boundary, so React has no pending state to render and nothing in
      the DOM changes between the press and the server's response. The seven
      navigating controls have the same interval for the same reason: a Link
      press starts a route transition and the screen holds still until the
      payload arrives. This is independent of the appearance cause M3-P9
      answers: a control with a pressed appearance and no pending state still
      goes dead the moment the finger lifts, which is the interval the owner
      described.
    steps:
      - kind: verification-first
        text: >-
          Before editing any component, settle the five things this plan
          records as unverified or as mechanism it has not run, and write each
          answer into the phase work history with the command and its
          captured output beside it. (a) THE MEASUREMENT TECHNIQUE ITSELF:
          confirm that a server-action request can be identified and delayed
          from a Playwright route handler under BOTH the desktop project and
          the chromium-phone project, and record the captured request line
          that identifies it. If a route handler that delays and then
          continues does not work, record that and use one that delays, then
          fetches, then fulfils with the fetched response. If NEITHER works,
          stop and say so rather than adding a test-only delay to product
          code. (b) What React's useFormStatus reports for the profile
          confirmation form, which carries two submit controls, one of them
          overriding the action (src/modules/import/ui/profile-confirmation.tsx:160
          and :190): capture whether the pending state can be attributed to
          the control that was pressed. Criterion 10.3 requires only that the
          pressed control carries the busy affordance and that no control in
          the form is pressable while it is in flight, so either answer is
          buildable; what is not acceptable is guessing. (c) Whether
          useLinkStatus ever reports pending for these links in this app,
          given the app router's prefetching: capture a pending observation
          for at least one of the seven navigating controls, or capture that
          prefetching makes the navigation complete inside criterion 10.5's
          own threshold, which is the other branch that criterion allows.
          (d) The exact list of files carrying "use client" at this phase's
          base. (e) Confirm that src/modules/ledger/ui/actions.ts:15 is still
          behind no rendered control, so the phase touches three action files
          and not four, and confirm the current instance shape of the
          merchant naming form.
      - text: >-
          Add ONE shared client submit leaf at src/platform/ui, a
          "use client" component that reads React's useFormStatus and renders
          the button. THE BOUNDARY GOES HERE AND NOWHERE ELSE, and decision
          D-23 records why and what it costs: useFormStatus reports the
          pending state of the nearest ancestor form, so the leaf needs no
          props threaded down and no state lifted, and every form, every row,
          every page and every layout that renders it stays a server
          component. Its props are the already-translated label passed as
          children, a class name and, where a control overrides the form's
          action, that action reference; so no message catalog, no domain
          type, no projection and no household context crosses the boundary.
          It renders the busy state with the vocabulary M3-P9 shipped
          (aria-busy on the control, whose mark is drawn by a pseudo-element)
          and adds no class and no rule of its own.
      - text: >-
          Use that leaf on all seven submit controls: the upload submit
          (src/modules/import/ui/upload-form.tsx:29), the preview-again and
          confirm submits (src/modules/import/ui/profile-confirmation.tsx:160
          and :190), the merchant naming submit
          (src/modules/merchants/ui/merchant-review.tsx:60), the sign-in and
          sign-up submits (src/app/(auth)/sign-in/page.tsx:33 and
          src/app/(auth)/sign-up/page.tsx), and the sign-out submit
          (src/app/(app)/layout.tsx:66). While a form is in flight none of
          its submit controls is pressable, so a second press cannot produce
          a second request, and the control that was pressed carries the busy
          affordance. Change nothing else in these files: the labels stay the
          server-rendered translated strings, the hidden fields stay exactly
          as they are, and in particular the hidden counterpartyText field
          keeps submitting the UNMASKED value that decision D-12 requires
          (src/modules/merchants/ui/merchant-review.tsx:46 through :50).
      - text: >-
          Give the seven navigating controls a pending marker with the app
          router's useLinkStatus, in the smallest form the hook allows: the
          hook must run in a descendant of the Link, so the marker is a
          second small client leaf at src/platform/ui rendered inside the
          Link, and the existing client component src/platform/ui/nav-link.tsx
          renders it for the three shell links. The two month step controls
          (src/modules/overview/ui/month-view.tsx:455 and :464), the
          unresolved pill (:497) and the empty-state import link (:421) are
          rendered by a server component that keeps rendering the Link itself
          and adds the leaf as its child, so month-view.tsx stays a server
          component and no part of the month projection reaches the browser.
          The marker uses the busy mark class M3-P9 shipped and adds no rule.
      - text: >-
          PREDICT NOTHING IN THIS PHASE, and do not import useOptimistic. The
          prediction DR-0025 decided is M3-P11's, and six of the seven submit
          controls stay pending-only FOREVER under decision D-31, because
          their results are parses, ingests, interpretations and sessions the
