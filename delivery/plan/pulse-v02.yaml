      - id: H9.2
        statement: >-
          Motion is added with no reduced-motion path, or the reduced-motion
          path is written as "no transition and no pressed appearance either",
          so the reader who asked the system for less motion ends up with
          less feedback than the reader who did not, which is worse than the
          state this phase starts from.
