kind: plan
status: draft
baseline-commit: e4ea3ba
binding-rule: >-
  If it is not written here, it is not being made. Unanswered questions go to
  the orchestrator.
process-summary: >-
  Orchestrated delivery on @tiphys/kernel 0.1.0 under the full mode: verified
  plan, adversarial plan review, one phase per branch, fast gate (npm run
  typecheck, npm run lint, npm test) every iteration, Playwright golden
  journey before a phase closes, dual clean-room review before merge under
  DR-0012's delegated-merge conditions and DR-0003's same-family override.
  This plan is the v0.2 iteration: one milestone, M3, dispatched BEFORE the
  DR-0002 one-real-month checkpoint by owner direction (fleet backlog,
  DR-0002 feedback log, 2026-08-21). M2 (intake slices 5 and 6) stays
  reserved and gated on DR-0002 exactly as the v1 plan left it.
standing-context: |
  What previous runs bought: the whole M1 walking skeleton, merged and
  deployed, release verification per DR-0001 green at the release head.
  Verified present at e4ea3ba and load-bearing for this plan: the
  StatementParser port with detect and parse (ports.ts:18 in
  src/modules/import/application/, implemented by the one delimited adapter,
  src/modules/import/adapters/delimited-file-parser.ts:10); deterministic
  profile detection (src/modules/import/domain/detect-profile.ts:1); the
  upload pipeline identify, declare, ingest, interpret
  (src/modules/import/application/upload-statement.ts:38 through :92) with
  the ask-once declaration branch (upload-statement.ts:57) and spec-equality
  profile recognition (upload-statement.ts:101,
  src/modules/import/domain/source-profile.ts:217); the import status
  machine with FAILED and machine-readable failureReason
  (prisma/schema/import.prisma:8, src/modules/import/application/ports.ts:38);
  immutable facts with rawContent and rawLine kept verbatim
  (prisma/schema/import.prisma:64, prisma/schema/import.prisma:106); the
  dedup recipe with the occurrence ordinal, which IS the addendum's section
  5 first amendment, already implemented and tested
  (src/modules/import/domain/dedup.ts:80, dedup.ts:95,
  prisma/schema/import.prisma:112); the card settlement matching step, which
  IS the addendum's section 5 second amendment, already implemented between
  the declared-set checks and the sign fallback
  (src/modules/ledger/domain/classify-flow.ts:77,
  src/modules/ledger/domain/constants.ts:16,
  src/modules/ledger/domain/corrections.ts:38) with the settlement total
  DERIVED from the card import's stored rows, never persisted
  (src/modules/ledger/domain/interpret.ts:67); the profile-fix re-parse path
  (src/modules/import/application/fix-profile.ts:1); and the reconciliation
  panel in the month view (src/modules/overview/ui/month-view.tsx:289).

  Deploy state: the M1 product is live on Vercel against the dedicated
  Supabase project; release verification is DR-0001 (fast gate plus golden
  journey at the release head).

  The input evidence: the owner's v0.2 addendum
  (delivery/intake/pulse-v0.2-pdf-addendum.md) and two REAL statement PDFs
  in this container's uploads directory, read by the scout for structure
  only. Every structural claim the addendum makes was checked against them
  and against the tree; the outcomes are in report-code-disagreement below.
  New anonymized structural facts are recorded in the fleet home note
  notes/export-format-facts.md (2026-08-21 section), the most consequential
  being: both real PDFs carry full text layers (no OCR anywhere in v0.2);
  KBC text extraction is word-gap tolerance-sensitive, so the extractor must
  reconstruct lines from positioned text items deliberately; and the KBC
  closing figure sits on the Afrekening line with a space thousands
  separator. The real PDFs are NEVER committed; committed fixtures are
  synthetic derivatives with invented identifiers, and every phase that
  touches fixtures carries that as a hazard class.

  Decision records touching this plan: DR-0002 stays OPEN and its clock
  starts only when the owner can feed Pulse from their phone (owner,
  2026-08-21). The two decision records this plan raised are now DECIDED by
  the owner (2026-08-21, fleet decisions/DR-0020.yaml and DR-0021.yaml):
  DR-0020, the PDF text-extraction runtime dependency, a charter stop-for
  ("any new runtime dependency beyond the declared stack", charter.yaml:92),
  is decided as pdfjs-dist, server side only, behind the parser adapter;
  DR-0021, the mobile share-sheet mechanism, is decided as Android, the
  share target IS built. M3-P2's and M3-P5's fill-ins are filled
  accordingly and both phases are dispatchable. M3-P1 (navigation) depends
  on neither and ships first.

  Revision note, fix round 1 under R-061: the adversarial plan review
  (delivery/review/pulse-v02-plan-adversarial.yaml on branch
  claude/m0-p2-plan-review, verdict revise, findings PR2-001 to PR2-008) is
  applied in full in this revision, no finding disputed. The one new
  structural fact it contributed: the bare BIJLAGE token also occurs INSIDE
  a transaction description block on a real Belfius transaction page, so
  annex skipping must be body-starts-with, never marker-anywhere, and the
  fixture now encodes that trap (PR2-002). The other findings tightened
  criteria from provable-in-prose to failable-by-test: recognition
  round-trip for pre-widening stored profiles (PR2-001), a cross-file
  overlap witness for the year-scoped dedup key (PR2-003), a
  month-straddling booking-date witness (PR2-004), an explicit and
