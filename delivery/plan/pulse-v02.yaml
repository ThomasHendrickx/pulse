    hazard-classes:
      - id: H9.1
        statement: >-
          The phase writes a pressed rule the stylesheet carries and the
          screen never shows, because the evidence is a grep for ":active"
          rather than a press. This is the exact class of error the first
          mobile round shipped, where the bar measured horizontal overflow
