  - id: M3-P12
    branch: claude/m3-p12-counterparty-identity
    intent: >-
      A merchant naming matches every future transaction from the same
      counterparty, because what a rule is written against stops being a
      transaction's free text and becomes the counterparty's IDENTITY: the
      counterparty account where the row carries one, per DR-0027, and the
      normalised descriptor where it does not. The derivation is one pure
      function in the merchants domain, the four places that group or resolve
      counterparties all call it, the one naming the owner has already made is
      re-derived rather than dropped, and the proof is a distinct-key count
      plus a second transaction that resolves with no second naming.
    grounding: >-
      DR-0027, decided by the owner on 2026-08-23: the same counterparty
      account is the same counterparty, always, the free-text communication is
      dropped from identity, and the owner accepted the stated cost that two
      purposes paid to one counterparty land in one group and separating them
      is a tag question. The owner's question that opened it, quoted verbatim
      in decision D-36. The worked example is the M3-P6 card grammar at
      src/modules/merchants/domain/normalise-counterparty.ts:99 onward, which
      answered this same defect for one descriptor family and proved it by
      counting distinct keys over real rows; this phase is that method applied
      one family wider, and it deliberately adds no new stripping. The
      governing document is the pulse-domain skill: section 2 for facts versus
      interpretation and its three absolute rules, section 7 for merchant
      resolution, section 9 for the module boundary the MerchantResolver port
      sits on. The stability contract that binds any change to the key lives
      at src/modules/merchants/domain/normalise-counterparty.ts:54 through
      :80, and its zero-rows discharge is stale: see this phase's
      report-code-disagreement entries.
    severity: critical
    verified-root-cause: >-
      What a merchant rule matches on is the whole normalised counterparty
      TEXT, and for a PDF-imported row that text is the whole description,
      because counterpartyText falls back to it
      (src/modules/merchants/domain/normalise-counterparty.ts:94 through :97)
      and the Belfius template never populates a counterparty name
      (src/modules/import/domain/belfius-current-account-template.ts:265
      through :281). A transfer description embeds a free-text communication
      and a per-transaction reference, so every such row is its own group.
      assignMerchant stores that string as an EXACT rule
      (src/modules/merchants/application/assign-merchant.ts:54 and :63) and
      matching compares it for equality
      (src/modules/merchants/domain/merchant-rule.ts:68), so the naming
      matches the one row it was written from. The structured counterparty
      account the importer already stores is consulted for flow, for pairing
      and for the refund correction, and for merchant identity by nothing: the
      review builder does not read it
      (src/modules/merchants/domain/merchant-review.ts:79) and the repository
      does not even select it
      (src/modules/merchants/adapters/merchant-repository.ts:234 through
      :241). Measured on the owner's real month through the shipped pipeline:
      the 11 rows carrying an account produce 11 distinct keys over 6 distinct
      accounts, and 4 accounts appear on 2 or more rows covering 9 rows with
      all 4 groups disagreeing. That is the screen's promise failing in front
      of the owner.
    steps:
      - kind: verification-first
        text: >-
          Reproduce every count in this phase's report-code-disagreement
          entries before building on them, and record each with the command
          that produced it in the phase work history. Against the COMMITTED
          fixtures first: parse every committed Belfius and KBC fixture and
          every committed CSV fixture through the shipped path and record, per
          fixture, the row count, the rows carrying a counterparty account,
          the rows carrying a counterparty name, and the distinct merchant
          keys the baseline derivation produces. Against the real documents in
          the container second, IN MEMORY ONLY, reporting counts and never
          content, and never writing any parsed string to disk. Confirm in
          particular the three findings the dispatch did not have: that the
          baseline produces 25 distinct keys over the 39 real rows and not 39,
          that the matcher already applies PREFIX and PATTERN while nothing
          writes them, and that the deployed merchant_rules table is no longer
          empty. If any of the three fails to reproduce, write down what it
          actually is and re-derive the affected criterion before building.
          COMMIT THE HARNESS, do not describe it: the measurement script lands
          as test/fixtures/measure-identity-convergence.ts, takes a path
          argument, prints COUNTS ONLY and never a parsed string, and is
          covered by the fast gate through a test that runs it over the
          COMMITTED fixtures, with its invocation against the real documents
          documented beside it. Every number this phase records then cites a
          path anyone can run, which is what the M0-P5 amendment could not do:
          its own figures were produced by an uncommitted scratchpad harness
          and are recorded that way in this plan's measurement block.
      - text: >-
          Add the derivation as ONE exported pure function in the merchants
          domain, counterpartyIdentity, beside the normaliser that the
          descriptor branch calls, returning a namespaced key and a two-valued
          basis. Where the row carries a counterparty account AND THAT
          ACCOUNT IS TRUSTWORTHY, the key is the lowercase literal "account:"
          followed by that account uppercased with whitespace removed, and
          NOTHING else is consulted, not the name, not the description, not
          the communication (DR-0027, decision D-37). The uppercasing and
          whitespace removal named here IS the platform canonical form M3-P14
          introduces, imported rather than expressed a second time, and the
          three trust tests below live beside it in that same module for the
          same reason (decision D-57); M3-P14 criterion 14.4 reddens on any
          second inline copy of that transformation wherever in src it is
          written, so writing one here fails that pin rather than passing this
          step. TRUSTWORTHY is three
          pure tests in the platform account-number module M3-P14 owns
          (decision D-57), imported here rather than written a second time,
          decided by decision D-43 and measured by criterion 12.16, and a value
          failing ANY of them is not trusted: it is non-empty after
          uppercasing and whitespace removal; its length is exactly the
          length the pinned country-length table assigns its country code,
          and a country code the table does not carry is REFUSED rather than
          admitted; and it passes the ISO 7064 mod-97 check. Where the row
          carries no account, or carries one that is not trusted, the key is
          the lowercase literal "descriptor:" followed by
          normaliseCounterparty(counterpartyText(row)), unchanged from the
          baseline, which is today's behaviour exactly. THE NAMESPACES ARE
          LOWERCASE ON PURPOSE: normaliseCounterparty uppercases its input at
          src/modules/merchants/domain/normalise-counterparty.ts:457, so a
          lowercase namespace cannot be produced by the normaliser and the
          two spaces are collision-proof by construction rather than by
          inspection. The namespace is also what D-40's refusal reads to
          decide whether a key is account-basis, and it is the shape the
          ledger's own refund key already uses
          (src/modules/ledger/domain/corrections.ts:209 through :215). That
          sibling is NOT unified with this one and must not be: the warning at
          src/modules/merchants/domain/normalise-counterparty.ts:15 through
          :22 says why, and swapping it would move flow classifications.
      - text: >-
          Add NO new stripping and NO new descriptor family, and record why
          with the measurement (decision D-38). The card grammar and the
          always-on passes stay byte-for-byte as M3-P6 left them, so
          over-stripping cannot collapse two counterparties on the DESCRIPTOR
          side, and criterion 12.5 pins that. SAY THE OTHER HALF PLAINLY,
          because the earlier draft of this step did not and it was wrong: the
          over-collapse hazard does not enter through stripping, it enters
          through the ACCOUNT BASIS THIS PHASE ADDS, which is a regex scrape
          out of the same free text the phase exists to escape
          (src/modules/import/domain/belfius-current-account-template.ts:88
          and :266 through :272) and which nothing in the tree validates. On
          the account side the hazard is answered by the trust gate in step 2
          and measured by criterion 12.16, not by criterion 12.4, which is
          blind to it because in every mechanism that reaches it the two rows
          carry the SAME stored value. Decision D-43 states the asymmetry that
          makes falling back safe. A row whose descriptor matches no family,
          and a row whose account is not trusted, both keep exactly the key
          they have today, which is their own full normalised descriptor:
          neither is ever given a shorter key that could merge it with
          something else, and criterion 12.6 is what says so. What changes for those rows is that the screen names their basis
          and their row count, in M3-P13, so the owner can see that a naming
          there will reach the transactions it says it reaches and no more.
      - text: >-
          Carry the identity through the four places that group or resolve a
          counterparty, and through nothing else. One: the merchant review
          builder keys on counterpartyIdentity rather than on the normalised
          text (src/modules/merchants/domain/merchant-review.ts:79), its
          CountedRow gains the counterparty account, and the repository read
          selects it (src/modules/merchants/adapters/merchant-repository.ts:234
          through :241). Two: the ledger computes the identity for each counted
          row and passes DISTINCT IDENTITY KEYS through the MerchantResolver
          port (src/modules/ledger/application/interpret-window.ts:105 through
          :127), the port member is renamed so a caller cannot pass a raw text
          to it by accident (src/modules/ledger/application/ports.ts:45), and
          the resolver stops re-normalising what it is handed
          (src/modules/merchants/application/resolve-counterparties.ts:36). The
          port stays exactly one member, which is what keeps interpretation
          unable to write a declaration
          (src/modules/ledger/application/ports.ts:31 through :39). Three: the
          overview's grouped counted read returns the counterparty account
          beside the counterparty text and groups by it, and the fold keys on
          the identity (src/modules/overview/adapters/overview-repository.ts:58
          and :113 through :131,
          src/modules/overview/domain/month-projection.ts:80 through :83); the
          SQL fragment is the third sibling of the source rule named at
          src/modules/merchants/domain/normalise-counterparty.ts:25 through
          :33 and its pin in test/domain/merchant-review.test.ts is updated
          with it. Four: assignMerchant stores the identity key as the rule
          subject and stops normalising the submitted string a second time
          (src/modules/merchants/application/assign-merchant.ts:54).
      - text: >-
          Re-derive the declarations the owner has already made, in the same
          change, as the stability contract at
          src/modules/merchants/domain/normalise-counterparty.ts:54 through
          :70 requires. Add an idempotent, household-scoped re-derivation to
          the merchants application layer, invoked by a committed one-shot
          script, which reads every MerchantRule row and every transaction of
          the household. It runs in TWO passes and the split is the whole
          design (decision D-45). PASS ONE, MECHANICAL AND TOTAL OVER THE
          RULES IT APPLIES TO: every rule whose pattern does NOT already begin
          with a known namespace has its pattern rewritten to the descriptor
          namespace followed by its old pattern. A rule that ALREADY carries a
          namespace is left exactly as it is and counted as already-migrated,
          which is not a hypothetical case but the shape of a naming made
          inside D-46's window: assignMerchant writes a namespaced subject
          under criterion 12.18, so a second namespacing would kill a correct
          rule on the FIRST run, where criterion 12.8 would never see it. A
          rule whose pattern is the EMPTY string is also left as it is and
          reported, because the bare namespace is non-empty and a PREFIX rule
          carrying it would match every descriptor-basis key, where the empty
          pattern it replaced is inert under
          src/modules/merchants/domain/merchant-rule.ts:65; assignMerchant
          guards that at :55 and upsertRule does not
          (src/modules/merchants/adapters/merchant-repository.ts:72 through
          :101 verifies only household ownership). Pass one still consults no
          transaction, still has no failure branch, and is
          meaning-preserving for all three kinds at once, because the
          namespace is a constant prefix on BOTH sides of the comparison: an
          EXACT rule still matches exactly what it matched, and a PREFIX or
          PATTERN rule still matches exactly what it matched, since
          ("descriptor:" + K).startsWith("descriptor:" + P) holds precisely
          when K.startsWith(P). Nothing can be lost in pass one and criterion
          12.21 asserts it. PASS TWO, PROMOTION, WHICH IS THE ONLY PASS THAT
          READS FACTS AND THE ONLY ONE THAT CAN BROADEN, AND WHICH IS PURELY
          ADDITIVE: where every transaction the old pattern matched carries a
          TRUSTED account under step 2's gate and they all carry the SAME one,
          the routine ADDS an account-basis rule pointing at the SAME merchant
          and LEAVES the descriptor rule pass one produced exactly where it
          is. It never rewrites a descriptor rule into an account rule. That
          needs no schema change: MerchantRule's unique key is (householdId,
          kind, pattern) at prisma/schema/merchants.prisma:70 and
          assignMerchant already attaches several rules to one merchant
          (src/modules/merchants/application/assign-merchant.ts:58 through
          :65). The added rule is what saves a naming written against a row
          that has since moved to the account basis, which is the owner's
          single deployed rule; without it that rule's row survives and its
          EFFECT is dead, which is why criterion 12.7 measures the assignment
          set and not the row count. THE DESCRIPTOR RULE THAT REMAINS IS A
          LIVE FALLBACK, NOT DEAD WEIGHT, and the plan says so rather than
          leaving it to be wondered about: it is the only thing that keeps a
          row of that same counterparty whose account FAILED the trust gate,
          or which carries no account at all, attached to the merchant the
          owner named. The two can never both fire on one key, because one
          begins with the account namespace and the other with the descriptor
          namespace, so the tie-break at
          src/modules/merchants/domain/merchant-rule.ts:34 through :42 is
          never reached between them. Where the matched transactions carry
          more than one account, or none, or an untrusted one, no rule is
          added: the descriptor rule stands alone, and that is printed and
          counted rather than treated as a failure. It deletes nothing, ever
          (decision D-39). It writes only to merchant_rules; the
          transaction rows are facts and are not touched, and the assignments
          reach the rows afterwards through the existing recompute, which is
          the only thing that writes transactions.merchantId (pulse-domain
          section 2 rule 1 and rule 2).
      - text: >-
          Give the routine somewhere to run from and one stated order
          (decision D-46). package.json gains a script that invokes
          scripts/rederive-merchant-rules.ts; at the baseline package.json
          carries build, start, typecheck, lint, the two gates, test,
          test:e2e, db:reset and db:migrate and no deploy or release hook at
          all, so without this the routine has no invocation point and D-39's
          "stops the deploy" would be unfounded. The routine runs AFTER the
          code deploys, and that is forced rather than preferred: it imports
          the new derivation to compute the new patterns, so it cannot run
          against a build that does not carry it. State the consequence of the
          window between the two: for its duration the stored patterns are
          pre-migration and the matcher computes namespaced keys, so rules
          match nothing and the affected rows show as unresolved. No total
          moves (hazard H3.2), nothing is lost, and the recompute the routine
          runs at its end closes the window.
      - text: >-
          Make the run reversible and the broadening visible (decision D-45,
          answering the objection that a rewrite of a DECLARATION is not
          something recompute may quietly do). The routine prints one line per
          rule it touches carrying the rule id, the pass that touched it, the
          basis the new pattern has, the number of transactions the old
          pattern matched and the number the new pattern matches, so a
          promotion that BROADENS is a number the owner can read rather than
          something inferred. REVERSIBILITY IS STRUCTURAL AND RESTS ON NO
          FILE, which is the correction the delta review earned: pass one's
          rewrite is invertible by stripping a constant prefix and pass two
          only ADDS, so a run is undone by deleting the rules it added and
          stripping the namespace from the rest. An earlier draft rested this
          on a timestamped file the routine wrote beside itself; that file
          cannot be kept, because the routine runs against the deployed
          database from an ephemeral container and the file is DATA that a
          public repository must never hold, so it was a guarantee in name
          only and it is gone.
      - text: >-
          Amend the governing document in the same change, because it is
          loaded into every task's context by CLAUDE.md and a stale paragraph
          is what the next implementer reads first. pulse-domain section 7
          states the resolution chain as "Exact match on normalised
          counterparty string, from MerchantRule"; after this phase the first
          step matches on a namespaced identity whose account branch never
          reads that string at all. Rewrite that chain to state the two bases
          and the trust gate, and to state that PREFIX and PATTERN never apply
          to an account basis. Criterion 12.19 measures it.
      - text: >-
          Settle the PREFIX and PATTERN kinds rather than leaving the schema
          advertising them (decision D-40). Both stay in the enum and both
          stay live in the matcher, because they ARE applied today and
          removing them would be a Prisma enum migration for no gain, with
          zero rows of either kind deployed. What is added is the one rule the
          new key makes necessary: matchRules refuses to apply a PREFIX or a
          PATTERN rule to an ACCOUNT-basis key, because a prefix of an account
          number is a different account and matching it would merge two
          counterparties. Correct the schema comment at
          prisma/schema/merchants.prisma:57 and the resolver header at
          src/modules/merchants/domain/merchant-rule.ts:1 through :14 to state
          that no product surface writes either kind today, that assignMerchant
          writes EXACT only
          (src/modules/merchants/application/assign-merchant.ts:63), and that
          both are reserved for the slice-5 accepted-answer path the
          pulse-domain skill's section 7 names. No schema change, no migration.
      - text: >-
          Build the fixture the convergence criteria are measured on, wholly
          invented, and generate it through the committed generator
          (test/fixtures/generate-pdf-fixtures.ts) so it arrives through the
          shipped importer rather than being handed to the domain directly. It
          reproduces the SHAPE the real month has and nothing of its content:
          rows sharing one counterparty account with a different free-text
          communication on each, rows sharing one counterparty account with a
          different reference on each, card-descriptor rows carrying their own
          date and amount, and rows with neither an account nor a card shape
          whose descriptors differ per row. IT ALSO CARRIES THE THREE ROWS
          THAT ATTACK THE ACCOUNT BASIS, because a fixture built only from
          well-formed accounts cannot fail criterion 12.16: one row whose
          description carries a longer-than-Belgian account written spaced, so
          the shipped scrape stores a sixteen-character PREFIX of it; and one
          row whose description carries two distinct account-shaped tokens,
          for which the generator RECORDS which token it wrote first so
          criterion 12.16 can pin the first-wins rule rather than be satisfied
          by writing the intended token first. The EMPTY-OR-WHITESPACE ACCOUNT
          IS DELIBERATELY NOT IN THE PDF FIXTURE, because the shipped Belfius
          template cannot produce it: the field is set only inside a
          successful pattern match, the value goes through compactIban, and
          the field is omitted entirely when nothing matches
          (src/modules/import/domain/belfius-current-account-template.ts:90,
          :266 through :272 and :281). It is covered where criterion 12.16
          already puts it, as a unit test over invented inputs on the pure
          identity function, and by a committed CSV fixture row for the
          whitespace case, which the delimited path CAN produce because
          src/modules/import/domain/parse-statement.ts:120 guards the empty
          cell and not the blank one. Asking the PDF generator for a row it
          cannot emit would leave an implementer to fake it by handing the
          domain a row directly, which this same step forbids. The
          generator ALSO emits, in the same run that writes the PDF, the
          record of what it generated the fixture FROM: the list of row
          ordinal to invented counterparty ordinal pairs, which is the
          independent oracle criterion 12.4 compares against. Every identifier
          in it is invented and is added to
          test/fixtures/allowed-identifiers.txt with its provenance in the
          same change. No string, amount, date, place or
          counterparty from either real document appears in it, and the file
          is read back line by line before it is committed.
      - text: >-
          Record the whole-corpus effect rather than only the happy fixture.
          For every committed fixture, record in the phase work history the
          distinct merchant-group count under the baseline derivation and
          under the new one, and list every fixture where the new count is
          HIGHER than the baseline count together with the reason, since a
          merchant paid through two different accounts now lands in two
          groups. Recovering from that split is naming both groups with the
          same merchant name, which attaches a second rule to one merchant
          (src/modules/merchants/application/assign-merchant.ts:58 through
          :60); the group LABEL, which M3-P13 renders, is what makes them
          recognisable, and decision D-41 fixes it as the carried counterparty
          name where a row has one and the masked account otherwise.
      - text: >-
          Run the full gate before calling the slice done, and run it in the
          worktree with pinned local database credentials per the fleet
          environment warnings: npm run typecheck, npm run lint, npm test,
          npm run gate:privacy, then npm run test:e2e.
    files-to-touch:
