  - id: M3-P5
    branch: claude/m3-p5-share-target
    intent: >-
      The share-sheet entry: the phone's share sheet hands an exported PDF
      straight to Pulse. DR-0021 is decided (Android, owner 2026-08-21),
      so this phase ships a web app manifest with a share_target and a
      receiving route that feeds the existing upload pipeline unchanged,
      with an explicit no-preservation contract for unauthenticated
      shares (decision D-10).
    grounding: >-
      pulse-v0.2-pdf-addendum.md:125 (the natural v0.2 import path is the
      phone share sheet). Web Share Target requires an installed PWA and
      exists on Android/Chromium; iOS Safari has no share-target
      mechanism, so the owner's platform decided whether this phase is
      built at all. That question was raised as DR-0021 and is now
      DECIDED by the owner (2026-08-21, fleet decisions/DR-0021.yaml):
      Android, the share target IS built. The dispatch gate is satisfied
      and the fill-in below is filled. Verified at e4ea3ba: no manifest,
      no public/ directory, no share-target surface anywhere.
    severity: medium
    verified-root-cause: >-
      Not a defect phase; dispatchable since DR-0021 was decided (Android,
      build). No verification-first step: the absence of any manifest or
      share-target surface at e4ea3ba is verified, and the platform
      question was a decision record, not a code check.
    steps:
      - text: >-
          Web app manifest with share_target (method POST, enctype
          multipart/form-data, a files member accepting application/pdf),
          served from the app with name, icons and start_url; installable
          on the owner's device. NO service worker unless installability on
          the owner's platform measurably requires one, and if one is
          required it registers with no fetch handler and touches no cache
          API, because the deliberately-absent list bans caching
          (charter.yaml:80).
      - text: >-
          The receiving route accepts the share POST, requires the
          authenticated household context exactly like the upload action,
          hands the file to uploadStatement unchanged, and redirects into
          the import flow at the declaration, result or failure state the
          upload produced. An unauthenticated share redirects to sign-in
          and the shared file is NOT preserved: no Import row, no stored
          bytes, no server-side handoff; after signing in the user shares
          again, the share sheet being one tap away (decision D-10,
          finding PR2-005).
      - text: >-
          An integration or e2e test posting multipart form data with the
          synthetic fixture PDF to the share route and following the
          redirect to the same states criterion 2.5 walks.
    files-to-touch:
      - src/app/ (manifest and share receiving route)
      - src/modules/import/ui/
      - messages/en.json
      - messages/nl.json
      - messages/fr.json
      - test/e2e/ (share-target spec)
    extras: []
    acceptance:
      - id: "5.1"
        criterion: >-
          curl -s against the deployed or dev manifest URL returns JSON
          whose share_target declares method POST, multipart/form-data and
          a files entry accepting application/pdf, and npm run test:e2e
          exits 0 including a spec that POSTs the synthetic fixture PDF as
          multipart form data to the share route and asserts the redirect
          chain ends on an import state with the fixture's rows added.
      - id: "5.2"
        criterion: >-
          grep -rE "caches\.|CacheStorage|workbox" src/ exits 1, and if a
          service worker file exists it contains no fetch event listener,
          asserted by grep for "fetch" over that file exiting 1.
      - id: "5.3"
        criterion: >-
          npm run typecheck && npm run lint && npm test exit 0 and npm run
          test:e2e exits 0 at the phase head, including the unmodified
          M3-P4 mobile journey.
      - id: "5.4"
        criterion: >-
          A test POSTs the fixture PDF as multipart form data to the share
          route with NO session and asserts: the response redirects to
          sign-in, no Import row is created, and no uploaded bytes are
          persisted anywhere (decision D-10's no-preservation contract;
          finding PR2-005).
    hazard-classes:
      - id: H5.1
        statement: >-
          A service worker creeping toward caching to satisfy an
          installability checklist, entering the deliberately-absent list
          through the side door.
        addressed-by: criterion 5.2
      - id: H5.2
        statement: >-
          The share route accepting files outside the authenticated
          household context, turning the share endpoint into an
          unauthenticated write path.
        addressed-by: criterion 5.4
      - id: H5.3
        statement: >-
          Building the share target for a platform the owner does not
          carry, an unusable phase.
        addressed-by: "state-not-entered: DR-0021 is decided (Android, owner 2026-08-21, fleet decisions/DR-0021.yaml), so the wrong-platform state cannot arise"
    migrations: none.
    conflicts-with: []
    parallelizable: false
    citations:
      - delivery/intake/pulse-v0.2-pdf-addendum.md:125
      - charter.yaml:80
      - src/modules/import/application/upload-statement.ts:23
    fill-in:
      filled: true
      root-cause: >-
        Not a defect; the share-sheet entry point. The dispatch gate was
        DR-0021 (owner platform), decided by the owner 2026-08-21 (fleet
        decisions/DR-0021.yaml): Android, the share target is built.
      fix-shape: >-
        Web app manifest with share_target, receiving route feeding
        uploadStatement, D-10 no-preservation contract for
        unauthenticated shares, no-caching discipline witnessed by grep.
