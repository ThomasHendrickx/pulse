        M3-P15 (same module and the same screen:
        src/modules/accounts/ and src/app/(app)/accounts/): runs strictly
        BEFORE it, because M3-P15 corrects a ring on a registry this phase
        creates. AND M3-P15 IS A SHIPPING PREREQUISITE AND NOT ONLY AN
        ORDERING SUCCESSOR. Under DR-0030 the ring a household answers on its
        FIRST upload decides whether that statement's rows are counted or
        held, and no refusal stands behind the answer, while the accounts
        module publishes no update and no delete
        (src/modules/accounts/application/ports.ts:23 through :38) until
        M3-P15 adds one. A release carrying this phase alone would let a
        household mis-ring an account on the only order the product offers and
        give it no way back, and this phase's copy names a control that would
        not exist. The two phases therefore reach a household together;
        criterion 15.9 is the witness, in the tree where the control exists.
      - >-
        M3-P12 and M3-P13 (they change what a merchant naming matches and how
        the review screen groups): this phase runs strictly BEFORE both, per
        decision D-52, because under M3-P12 the owner's own-account
        counterparties become nine tidy groups that invite a naming, and every
        naming made in that window becomes a rule that matches nothing the
        moment the accounts are registered.
      - >-
        M3-P9, M3-P10 and M3-P11 (src/app/globals.css, styles/tokens.css and
        src/app/(app)/layout.tsx): no ordering is required, but the two rounds
