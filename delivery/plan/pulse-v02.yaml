          redundant. (c) TWO LINES. For every spend-group, income-group or
          reserve-group row: the group-total's bounding top is within 6 CSS
          pixels of the group-label's bounding top, so name and amount share
          line one; the row-count element's bounding top is at least the
          group-label's bounding bottom minus 2, and where a group-delta
          renders, its bounding top is likewise at least the group-label's
          bounding bottom minus 2, so count and delta are on line two. The
          spec names every offending row by its group-label text. WHAT WOULD FAIL IT: any row that keeps a
          three-track grid; any row that leaves the name less than 55 percent
          of the row's border box, or less than 180 pixels at 390 or 160 at
          360, to sit in, however that narrowing is achieved; and any row
          that keeps the row count or the month-over-month delta beside the
          name instead of beneath it. MEASURED AT THE PHASE BASE AND STATED
          HERE SO THIS CRITERION CANNOT BE SATISFIED BY THE TREE AS IT
          STANDS. The box chain at 390: .app-main takes 48 of horizontal
