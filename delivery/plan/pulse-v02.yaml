          those six is the acknowledgement layer and nothing more, and
          criterion 10.10 fails the phase if any of them changes anything on
          screen before the server has answered.
      - text: >-
          Widen the repository's hardcoded-string gate to cover where this
          round puts its client leaves, before M3-P11 puts catalogue copy
          through it. That gate is not a grep despite the name
          .claude/skills/pulse-frontend/SKILL.md:119 gives it: it is the
          ESLint rule react/jsx-no-literals scoped by a files glob to
          src/modules/**/ui/**/*.tsx (eslint.config.mjs:37 through :40), so
          nothing under src/platform/ui/ is covered and the leaves this phase
          adds, and the toast M3-P11 adds, would all sit outside it. Add
          src/platform/ui/**/*.tsx to that glob, which is green at this
          phase's base. Do NOT add src/app/**/*.tsx in the same change: it
          fails at the base on one line, the brand word at
          src/app/(app)/layout.tsx:43, which is a proper noun rather than
          translatable copy, and that half is parked with the reason.
      - text: >-
          Add the PRODUCTION-MODE PHONE PROJECT and take the interval
          measurements there, which decision D-34 records and finding
          ADV-M0P4-04 forced. playwright.config.ts gains a fourth project,
          chromium-phone-prod, spreading the same chromium mobile device
          descriptor with isMobile and a 390 by 844 viewport as
          chromium-phone but bound to prodBaseURL, so it runs against the
          server the config already builds and starts with npm run build and
          npx next start. Criteria 10.2, 10.3, 10.4 and 10.5 are evaluated
          there, because that is the build the owner presses, and 10.5 is
          evaluated in the development project as well so the prefetch branch
          each control takes in each build is recorded and compared. TWO
          THINGS THIS COSTS AND BOTH ARE REAL. The production server refuses
          a frozen clock, so playwright.config.ts strips PULSE_FIXED_NOW from
          its environment and the interaction spec must be clock-independent:
          it reaches a month through the month view's own query parameter
          (src/app/(app)/page.tsx:12) rather than through whatever month the
          clock gives, which is the same route criterion 9.2(a) needs for the
          next step control. And the phase cannot close unless the production
          bundle builds, which is a gate this phase now depends on and is the
          right one to depend on.
      - text: >-
          Write the measurements as a Playwright spec registered under the
          desktop, the chromium-phone and the chromium-phone-prod projects,
          alongside the spec M3-P9 added. It is this spec that keeps the work
          alive: M3-P8
          rebuilds the merchant review's naming form, and its own criterion
          8.7 requires npm run test:e2e to exit 0 under every project, so a
          rebuild that drops the busy state turns that phase red rather than
          silently spending this one.
