      - R-010a
      - R-012
  - id: M3-P15
    branch: claude/m3-p15-ring-correction
    intent: >-
      An account's ring can be corrected after it was declared, and the
      correction is a declaration edit followed by a recompute and never a row
      rewrite. Rows on an account that LEAVES the pot have their
      interpretation cleared instead of being left standing, the month reads
      scope to pot accounts so those rows are never counted, the gap read
      having been scoped already in M3-P14 so that a cleared row has a landing
      place, the owner is told before they confirm what will
      move between the spend total and the reserves block, and a MerchantRule
      that a correction leaves matching nothing is kept and named rather than
      deleted by any engine path.
    grounding: >-
      The M0-P6 dispatch's second gap: a current account mistakenly declared
      RESERVE at first import is wrong forever, and so is the reverse. The
      pulse-domain skill is the authority: section 2 for facts versus
      declarations and its three absolute rules, of which rule 1 forbids
      updating a raw field to fix a classification and rule 3 forbids
      interpretation writing to the declarations layer
      (.claude/skills/pulse-domain/SKILL.md:39 through :41), and section 1 for
      the ring being a declaration the user makes and never an inference
      (.claude/skills/pulse-domain/SKILL.md:20). The charter's stop-for list binds
      the second half of this
      phase and decision D-50 records why this work is not one of its entries
      (charter.yaml:86 through :88). Grounded at 75ec85d and consuming
      M3-P14's registry; every citation here was read at 75ec85d.
    severity: critical
    verified-root-cause: >-
      Two halves, and the second is why this is a phase rather than a form
      field. FIRST, nothing can change a ring: the accounts module publishes
      createAccount, listAccounts, findAccountByIban and getAccountById and
      nothing else (src/modules/accounts/application/ports.ts:23 through :38)
      and the Prisma adapter implements exactly those four
      (src/modules/accounts/adapters/account-repository.ts:26 through :70),
      while the import form does let a first declaration pick a ring
      (src/modules/import/ui/profile-confirmation.tsx:180 through :184), so a
      wrong first answer is permanent. DR-0030 makes that worse rather than
      better, and it is why this phase is a shipping prerequisite for M3-P14
      rather than only its successor: under the accept position the ring
      answered on a first upload decides whether that statement's rows are
      counted or held, in both directions, and no refusal stands behind the
      answer. A savings account declared POT has its own rows counted as
      ordinary income and spend; a current account declared RESERVE has its own
      rows held and counted nowhere. Both are wrong forever without this
      phase. SECOND, a correction cannot be a
      declaration edit plus a recompute until something owns the rows that
      leave the pot. Interpretation loads pot accounts only
      (src/modules/ledger/application/interpret-window.ts:37 through :39) and
      replaceInterpretation writes only the transaction ids it was handed
      (src/modules/ledger/adapters/ledger-repository.ts:171 through :198), so
      a row on an account that becomes RESERVE keeps the flow and the merchant
      it was last stamped with and is never visited again; and every
      downstream read filters on the flow column alone and never on the
      account, in the counted read
      (src/modules/overview/adapters/overview-repository.ts:128 through :131),
      in the month aggregate (overview-repository.ts:233 through :235) and in
      the merchant review's read
      (src/modules/merchants/adapters/merchant-repository.ts:231 through
      :234). So the stale row goes on counting and goes on being offered for
      naming. Clearing its flow to NULL was not free either at 75ec85d:
      overview-repository.ts:230 counted a NULL flow as uninterpretedCount with
      no account filter, and
      src/modules/overview/domain/month-projection.ts:179 through :184 makes a
      non-zero count hold the books open, so a household that ever imported a
      reserve statement saw its books never close. M3-P14 scopes that one read
      to pot accounts under decision D-56, together with the gap LISTING at
      overview-repository.ts:263 through :310, which is the second read that
      admits a null flow and which an earlier draft of this plan wrongly said
      did not exist; so at THIS phase's base a cleared row already has a
      landing place in both. The reads that remain each filter on the flow
      column and therefore cannot see a cleared row, and scoping them here is
      defence in depth against a clearing that misses a row rather than the
      mechanism the verdict depends on. Both halves were READ at
      75ec85d and not executed, which is why step 1 is verification-first.
    steps:
      - kind: verification-first
        text: >-
          Before any edit, establish with captured output, against a real
          database rather than by reading, what happens at THIS phase's base to
          the rows of an account that is not a pot account. M3-P14 closed the
          interface route into that state under decision D-55, so reach it the
          way a household that imported before M3-P14 is already in it: put
          rows on an account through the ordinary import path and then set that
          account's role to RESERVE by a direct declaration write against a
          scratch database, never through shipped code and never committed as a
          code path. Record: the flow column on those rows; whether they appear
          in the month's spend or income totals; whether they appear on the
          merchant review screen; the value of the uninterpreted count, which
          after M3-P14's gap-read scoping should exclude them; and whether the
          month view reports that the books close. In the same session and
          before any edit, CAPTURE the baseline criterion 15.4 asserts against:
          the full MonthFigures of a household whose accounts are ALL pot
          accounts, over a committed fixture, printed as captured output, so
          that this phase's evidence lives in its own tree rather than in a
          repository state that stops existing the moment the phase lands.
          Write all of it into the phase work history and only then build; if
          the observed behaviour differs from this phase's
          verified-root-cause, the plan is corrected before the code is.
      - text: >-
          Add the ring correction to the accounts module as a declaration
          edit: one published use case that updates Account.role, one
          repository function behind the existing port, and the accounts
          screen's control that invokes it. It writes one declaration column
          and then calls the ledger's published recompute, which is the same
          shape as naming a merchant
          (src/modules/merchants/application/assign-merchant.ts:61 through
          :69). It writes nothing to any transaction row, and no code path
          added by this phase may update a raw transaction column at all.
      - text: >-
          Make interpretation own every transaction in the household rather
          than only the ones it counts. Interpretation continues to CLASSIFY
          pot accounts only, and additionally CLEARS the interpretation
          columns of rows on accounts that are not pot accounts, using the
          null write the port already defines as the way an assignment that no
          rule supports stops applying
          (src/modules/ledger/application/ports.ts:51 through :57). A row on a
          reserve account therefore ends with no flow and no merchant, which
          is the HELD state DR-0030 and decision D-59 define: a row with no
          flow on an account that is not a pot account, told apart from an
          uninterpreted row by the account's ring and named on the screen by
          criterion 14.15, which M3-P14 built. A correction into or out of the
          pot therefore moves rows between counted and held, and criterion 15.2
          requires the screen to follow. This
          is an interpretation write and touches no fact column, and it needs
          no schema change because Transaction.flow is already nullable
          (prisma/schema/import.prisma:135).
      - text: >-
          Scope the remaining month reads to pot accounts, so that clearing a
          row cannot reach a figure or a list by any route. BOTH reads that
          can see a row with no flow were scoped in M3-P14 under decision
          D-56, the uninterpreted count at
          src/modules/overview/adapters/overview-repository.ts:230 and
          listGapRows at overview-repository.ts:263 through :310, and neither
          is touched again here; what this phase scopes is the counted reads,
          the month aggregate, the reserves read and the merchant review's
          read, which each join the accounts table and take pot accounts only.
          Each of those already filters on the flow column, so a correctly
          cleared row is invisible to them anyway: the scoping is defence in
          depth against a clearing that misses a row, and the phase says so
          rather than claiming the verdict depends on it. Decision D-50 records why
          this is a defect fix and not the charter stop-for at charter.yaml:86
          through :88: the identity's own definition already says changeInPot
          is the sum over POT accounts
          (src/modules/ledger/domain/reconciliation.ts:7 through :8) and the
          domain function already skips rows outside the interpreted set
          (reconciliation.ts:62 through :66), so the SQL projection is the
          copy that drifted and this restores it. The phase must prove that
          claim rather than assert it, which is criterion 15.4.
      - text: >-
          Say what the owner sees, before they confirm and after, and say all
          of it. A correction out of the pot makes TWO movements, not one: the
          rows ON the account are cleared and stop being counted at all, while
          the reserves block gains a DIFFERENT set of rows, the counterparty
          rows on the household's other pot accounts that move from INTERNAL to
          RESERVE (src/modules/ledger/domain/classify-flow.ts:62 through :68).
          The screen states both, with the direction, before the change is
          made, together with the number of merchant rules that will stop
          matching. Decision D-58 settles how each figure is produced: by a DRY
          RUN of the same domain interpretation the recompute runs, over the
          proposed declaration set, writing nothing, never by a second query
          that sums rows whose counterparty account matches. A second query
          agrees on a simple fixture and diverges wherever the engine applies a
          correction, at the settlement match
          (src/modules/ledger/domain/classify-flow.ts:80 through :98), the
          reserve drawdown (classify-flow.ts:62 through :68), the refund arm
          (classify-flow.ts:110 through :118) and the unmatched or in-transit
          leg accounting
          (src/modules/overview/adapters/overview-repository.ts:222 through
          :229). After the recompute the screen states what actually moved.
          Neither number is an estimate, and criterion 15.7 is what makes that
          sentence true rather than claimed.
      - text: >-
          Handle the dead MerchantRule, on the same terms decision D-49 set
          for M3-P14: kept, never deleted by any engine path, counted and
          named. A correction that moves an account INTO the pot ring is the
          case that makes keeping them worth it, because a rule kept through
          the wrong ring starts matching again by itself when the ring is put
          right, and a deleted one would be gone. The screen names the count
          both ways.
      - text: >-
          Run the gates: npm run typecheck, npm run lint, npm test, npm run
          gate:privacy, npm run gate:tokens and npm run test:e2e, and record
          the captured output in the phase work history.
    files-to-touch:
      - src/modules/accounts/application/
      - src/modules/accounts/adapters/account-repository.ts
      - src/modules/accounts/ui/
      - src/app/(app)/accounts/
      - src/modules/ledger/application/interpret-window.ts
      - src/modules/ledger/application/ports.ts
      - src/modules/ledger/adapters/ledger-repository.ts
      - src/modules/overview/adapters/overview-repository.ts
      - src/modules/merchants/adapters/merchant-repository.ts
      - messages/en.json
      - messages/nl.json
      - messages/fr.json
      - test/application/
      - test/domain/
      - test/e2e/accounts.spec.ts
      - test/e2e/month-view.spec.ts
    extras: []
    acceptance:
      - id: "15.1"
        criterion: >-
          A RING IS CORRECTED AND THE MONEY MOVES, IN THE DIRECTION THE
          CLASSIFICATION ORDER ACTUALLY PRODUCES. FIRST ARM, the mis-ringed
          counterparty. A Playwright test registers a savings account in the
          POT ring by mistake, imports the M3-P14 fixture, and records
          spend-total, pot-change, reserves-net and recon-cause-unmatched as
          strings, reserves-net being always present because
          src/modules/overview/ui/month-view.tsx:223 renders it in the card
          header whether or not a group exists. It then corrects the ring to
          RESERVE on the accounts screen and asserts, with no further upload,
          that the rows referencing that account have moved from the
          unmatched-internal cause into the reserves block: reserves-net rises
          by exactly the fixture's movements to that account,
          recon-cause-unmatched falls by exactly those rows, and spend-total
          AND pot-change are each BYTE IDENTICAL before and after, every figure
          compared against strings written by hand in the spec from the
          fixture's own arithmetic. Pot-change is asserted rather than merely
          recorded, because a value recorded without an assertion reads to the
          next person as a value that was checked: the rows move from INTERNAL
          to RESERVE and carry a flow either way, and
          src/modules/overview/adapters/overview-repository.ts:219 sums every
          row that has one, so it cannot move. Spend-total cannot fall in this arm and the criterion
          says so rather than asking for it: an account registered POT already
          makes those rows INTERNAL at
          src/modules/ledger/domain/classify-flow.ts:73 through :77, which runs
          before the sign fallback at classify-flow.ts:102, so the fall
          happened at registration and not at the correction, and a repair that
          made a wrongly ringed account's transfers SPEND in order to produce
          one would put the household's own transfers back into the spend
          total, which is the defect this whole round exists to remove. SECOND
          ARM, the only construction in which a ring correction does move the
          spend total. The same spec registers an ordinary current account in
          the POT ring, imports a statement whose own rows are ordinary outside
          spend, records spend-total, corrects that account to RESERVE and
          asserts spend-total FALLS by exactly those rows against a hand-written
          string, then corrects the ring BACK to POT and asserts spend-total,
          reserves-net and pot-change all return byte identical to the values
          first recorded, which is the rebuildability test the domain sets
          (.claude/skills/pulse-domain/SKILL.md:35) applied to a ring.
      - id: "15.2"
        criterion: >-
          A ROW ON AN ACCOUNT THAT LEFT THE POT STOPS COUNTING AND STOPS BEING
          OFFERED. A Playwright test imports a statement for an account
          declared POT, confirms its rows are in the spend total and its
          counterparties are on /merchants, corrects that account to RESERVE,
          and asserts with no further upload that none of those rows appears
          in any month figure, that none of their counterparties appears as an
          unresolved-group, and that reserve movements from the OTHER side are
          unaffected. It further asserts that those rows are NAMED AS HELD
          after the correction, in the held-rows element criterion 14.15
          introduces, with the account and the count, rather than simply
          vanishing from the page: a correction that makes a household's rows
          disappear with no statement is the same surprise as the defect this
          round exists to remove. An application test asserts the same at the
          use-case level and additionally that every one of those rows carries
          no flow and no merchant after the recompute, and that a second
          correction back into the pot returns them to the counted set and
          removes them from the held-rows element.
      - id: "15.3"
        criterion: >-
          AND THE BOOKS STILL CLOSE, WITHOUT THE GAP READ BEING BLINDED TO DO
          IT. In the state of 15.2, after the correction, the month view's
          verdict reads as books closing, the uninterpreted count renders zero,
          recon-difference is absent and no cause block is rendered. Two
          further cases stop that from being bought too cheaply. An application
          test asserts that a row on a POT account whose flow is null is STILL
          counted as uninterpreted and STILL holds the verdict open, so nothing
          done here may be a blanket removal of the null-flow count, which is
          finding CR-502 held rather than undone
          (src/modules/overview/adapters/overview-repository.ts:237 through
          :242). And an application test asserts that a cleared row on a
          non-pot account reaches NO named figure and NO screen: not income,
          spend, reserves or changeInPot, not the merchant review's counted
          read, not the reserves block, and NOT listGapRows
          (src/modules/overview/adapters/overview-repository.ts:263 through
          :310), which is the read that hands the reconciliation panel its
          rows and whose omission from this list would let every cleared row
          go on being listed under a verdict that says the books close. The reason the first half is reachable
          at all is the gap-read scoping M3-P14 made under decision D-56
          (src/modules/overview/domain/month-projection.ts:179 through :184
          still makes a non-zero uninterpreted count hold the books open, and
          that is unchanged); the clearing this phase adds is what the second
          half measures, and H15.3 is the hazard that the two are separated.
      - id: "15.4"
        criterion: >-
          SCOPING THE READS MOVES NOTHING THAT EXISTS TODAY. The committed
          golden journey (test/e2e/golden-journey.spec.ts) passes unchanged,
          and its asserted strings for income-total, spend-total,
          reserves-net, pot-change and every reconciliation figure are
          untouched in the diff. A second witness makes the claim mechanical
          rather than incidental, and it is obtainable inside this phase's OWN
          tree rather than from a repository state that stops existing the
          moment the phase lands: the verification-first step records, from the
          phase base and before any edit, the full MonthFigures of a household
          whose accounts are ALL pot accounts over a committed fixture, as
          captured output in the phase work history, and an application test in
          this phase's diff then asserts that the scoped projection over that
          same fixture returns each of those recorded values, written into the
          test by hand from that captured output and never read back from the
          implementation. A third case, over a household that also holds one
          non-pot account carrying rows, asserts the figures differ ONLY in the
          fields the scoping is meant to change, so the test can tell a scoping
          that works from a scoping that does nothing. No copy of an unscoped
          read is kept alive in the shipped tree to be compared against, and a
          criterion that required one would be the M3-P12 criterion 12.17
          defect again. The phase work history states, with those results, that
          this is a restoration of the identity as
          src/modules/ledger/domain/reconciliation.ts:7 through :8 already
          defines it and not a change to it, which is what keeps it outside
          the charter stop-for at charter.yaml:86 through :88.
      - id: "15.5"
        criterion: >-
          NO FACT IS REWRITTEN, ANYWHERE IN THIS PHASE. A grep over the
          phase's diff shows no write to a raw transaction column outside the
          import module, and no new function in any repository updates
          bookingDate, amountCents, description, counterpartyName,
          counterpartyIban, rawLine or any dedup column. The correction path
          writes exactly one declaration column and then calls recompute; an
          application test asserts that a correction followed by two
          recomputes leaves every interpretation column identical to a single
          recompute, and that the raw columns of every affected row are byte
          identical before and after the whole sequence.
      - id: "15.6"
        criterion: >-
          A DEAD MERCHANT RULE IS KEPT, COUNTED AND NAMED, AND NO ENGINE
          DELETES IT. An application test writes a MerchantRule against a
          counterparty, then registers or corrects the account so those rows
          become INTERNAL or RESERVE, and asserts three things: the
          MerchantRule row still exists after the recompute, the affected
          transactions carry no merchant, and the correction's result reports
          the number of rules that stopped matching together with the account
          that absorbed them. A second case corrects the ring back and asserts
          the rule matches again with no user action, which is why keeping it
          is worth more than deleting it. A grep asserts no interpretation
          code path calls any delete on a MerchantRule, which is
          .claude/skills/pulse-domain/SKILL.md:41 held mechanically.
      - id: "15.7"
        criterion: >-
          THE OWNER IS TOLD BEFORE THEY CONFIRM, AND THE PREVIEW IS THE SAME
          COMPUTATION AS THE OUTCOME. The correction control shows, before the
          change is applied, THREE quantities and not one: how many
          transactions ON the account will stop being counted at all, how much
          will move between the spend total and the reserves block and in which
          direction, and how many merchant rules will stop matching. Both
          movements are named because a correction out of the pot makes two,
          and criterion 15.2 is built on exactly that case: the rows on the
          account are cleared entirely and enter nothing, while the reserves
          block gains a DIFFERENT set of rows, the counterparty rows on the
          household's other pot accounts that move from INTERNAL to RESERVE at
          src/modules/ledger/domain/classify-flow.ts:62 through :68. The two
          quantities that describe a RECLASSIFICATION, the movement between the
          spend total and the reserves block and the number of merchant rules
          that stop matching, are produced by a DRY RUN of the same
          interpretation the recompute runs over the proposed declaration set,
          writing nothing, and never by a second rule that sums rows whose
          counterparty account matches, which is decision D-58. The third, the
          count of rows ON the account that stop being counted at all, is the
          count of rows on that account carrying a non-null flow today, because
          clearing them is an application act and the domain interpretation is
          never asked about a row it does not load
          (src/modules/ledger/application/interpret-window.ts:85 through :90
          over a list built from pot accounts only); the criterion names it
          that way so an implementer does not fake a dry run for it. An
          application test asserts all three against the actual movement over a
          fixture that carries a settlement-matched card debit and a matched
          transfer pair as well as ordinary rows, so a preview computed by a
          second rule diverges rather than agrees; a Playwright test asserts
          every shown figure is byte identical to the movement the totals make
          when the change is confirmed, rendered in the reader's own language
          from all three catalogues. A correction that would move nothing says
          so rather than showing a bare zero with no explanation.
      - id: "15.8"
        criterion: >-
          npm run typecheck, npm run lint, npm test, npm run gate:tokens and
          npm run gate:privacy all exit 0, and npm run test:e2e exits 0 with
          the accounts spec and the month-view spec both reporting their tests
          as passed. And the phase work history carries the captured output of
          the verification-first step, one block per observation and per
          baseline that step enumerates, each block showing the command and its
          output rather than a restatement of the conclusion; an observation or
          a baseline listed in step 1 with no captured output under it fails
          this criterion, which is what makes skipping that step visible rather
          than costless.
      - id: "15.9"
        criterion: >-
          THE REMEDY M3-P14'S COPY NAMES EXISTS, AND ONE JOURNEY WALKS THE
          WRONG ANSWER BACK. Under DR-0030 the ring a household answers on its
          first upload decides whether that statement's rows are counted or
          held, no refusal stands behind the answer, and neither a ring
          correction nor any undo exists in M3-P14's tree, so this phase
          carries the witness. A grep asserts the accounts screen renders the
          ring-correction control that M3-P14's import copy names. A Playwright
          test then walks the whole path in one journey: upload a savings
          statement having registered nothing, answer the ring question with
          the SPENDING ring, which is the mistake the product cannot otherwise
          catch, see its rows counted in the month's spend, follow the link
          M3-P14's copy renders to the accounts screen, correct that account's
          ring to savings with the control that copy named, and land on a month
          view where those rows are held and named by criterion 14.15, the
          spend total has fallen by exactly them against a hand-written string,
          and the verdict still reads as books closing. The test fails if
          M3-P14's copy names a control this screen does not render, and it
          fails if the accounts screen offers no way to change the ring of an
          account declared under the wrong one. This is the criterion M3-P14
          cannot hold in its own tree, and decision D-53 and M3-P14's
          conflicts-with record why the two phases reach a household together.
    hazard-classes:
      - id: H15.1
        statement: >-
          A ring correction is implemented by rewriting stored rows rather
          than by editing the declaration and recomputing.
        addressed-by: criterion 15.5
      - id: H15.2
        statement: >-
          The correction leaves the rows of the account that left the pot
          standing with the flow and merchant they were last stamped with, so
          they go on counting in the totals and go on appearing on the naming
          screen.
        addressed-by: criterion 15.2
      - id: H15.3
        statement: >-
          Those rows are cleared to no flow instead, and the household's books
          then never close again because an uninterpreted row holds the
          verdict open.
        addressed-by: criterion 15.3
      - id: H15.4
        statement: >-
          Scoping the month reads to pot accounts silently changes a figure on
          data that already exists, which would be a change to the
          reconciliation identity and a charter stop-for rather than the
          defect fix this phase claims it is.
        addressed-by: criterion 15.4
      - id: H15.5
        statement: >-
          A recompute or another interpretation path deletes a MerchantRule
          that stopped matching, breaking the absolute rule that recompute
          never writes to the declarations layer.
        addressed-by: criterion 15.6
      - id: H15.6
        statement: >-
          The owner is offered a control that silently moves money between the
          spend total and the reserves block with no statement of what will
          move, which is the same class of surprise as the defect this round
          exists to remove.
        addressed-by: criterion 15.7
      - id: H15.7
        statement: >-
          The phase is built on a reading of the code rather than on an
          observation of the running system, and the observed behaviour of a
          non-pot account's rows turns out to differ from what
          verified-root-cause states.
        addressed-by: criterion 15.8
      - id: H15.8
        statement: >-
          M3-P14 reaches a household without this phase, so an account
          declared under the wrong ring on a first upload can be neither
          corrected nor removed nor re-registered, and the copy naming the
          remedy points at a control the product does not have.
        addressed-by: criterion 15.9
    migrations: >-
      none. Account.role already exists as a declared column
      (prisma/schema/accounts.prisma:15) so a correction is an update to a
      declaration, and Transaction.flow is already nullable
      (prisma/schema/import.prisma:135) so clearing an interpretation needs no
      new column and no new enum member. Adding a member to the Flow enum to
      mark a non-pot row WOULD be a migration and is deliberately not done;
      the absence of a flow already means the row was not interpreted, and
      criterion 15.3 is what makes that state safe to be in.
    conflicts-with:
      - >-
        M3-P14 (same module, same route, same catalogues): runs strictly
        AFTER it, because it corrects a ring on the registry M3-P14 creates.
      - >-
        M3-P12 and M3-P13: this phase runs strictly BEFORE both, per decision
        D-52, for the same reason M3-P14 does.
      - >-
        M3-P7 and M3-P8 (src/modules/overview/adapters/overview-repository.ts
        and src/modules/overview/ui/month-view.tsx): must not run in parallel
        with either.
    parallelizable: false
    citations:
      - R-005
      - R-010a
      - R-012
decisions:
  - id: D-1
    statement: >-
      The v0.2 work is milestone M3 (phases M3-P1 through M3-P5). M2 stays
      reserved for intake slices 5 and 6 exactly as the v1 plan left them,
      gated on DR-0002; the owner directed v0.2 ahead of the DR-0002 month
      (fleet backlog, 2026-08-21), and reusing M2 for different content
      would silently rewrite a merged plan's meaning.
  - id: D-2
    statement: >-
      SourceProfileSpec becomes a discriminated union on a kind field:
      "delimited" carrying the existing shape unchanged
      (source-profile.ts:49) and "pdf-layout" carrying templateId and
      templateVersion. The StatementParser port shape (ports.ts:18) and the
      spec-equality recognition path (upload-statement.ts:101) stand
      unchanged; layout templates are code-owned and selected by
      fingerprint, never by asking the user
      (pulse-v0.2-pdf-addendum.md:23). Chosen over a parallel PDF-only port
      because the upload pipeline, profile recognition, account binding and
      re-parse machinery all key on the one spec type, and a second port
      would duplicate every one of those seams.
  - id: D-3
    statement: >-
      Committed fixtures are synthetic PDFs produced by a committed
      deterministic generator script (stable bytes, fixed metadata), plus
      extracted-text unit fixtures where a template test wants them. Both
      real statements carry full text layers, so the parser consumes the
      text layer and no OCR path exists in v0.2; generating real PDF bytes
      keeps the extraction adapter inside the tested path instead of only
      the template logic. No identifier, name, amount, date or merchant
      string from the real statements appears in any fixture.
  - id: D-4
    statement: >-
      The Belfius PDF dedup key follows the addendum (account plus year of
      booking date plus sequence number, pulse-v0.2-pdf-addendum.md:68),
      emitted through the existing natural-key mechanism (dedup.ts:95) with
      the year as the statement-scope component; the exact wiring is
      settled by M3-P2's verification-first step because the implemented
      key shape is statement-scoped and the addendum's cross-statement
      continuity premise rests on the owner's format knowledge plus one
      observed statement. The year-scoped key is strictly safer against
      re-exported or overlapping statements. Unifying dedup keys across the
      CSV and PDF paths for the same account is parked, not decided.
  - id: D-5
    statement: >-
      The import failure vocabulary grows exactly two machine reasons,
      "layout-unsupported" and "balance-mismatch", extending the existing
      union (ports.ts:38) and translated in the three catalogs like the
      existing reasons, so an unrecognised layout is a loud translated
      failure and never a user-facing parser question
      (pulse-v0.2-pdf-addendum.md:27).
  - id: D-6
    statement: >-
      Opening and closing balances are verified at parse time and NOT
      persisted: no schema change anywhere in v0.2. The settlement matching
      machinery derives card totals from stored rows
      (src/modules/ledger/domain/interpret.ts:67) and needs no stored
      balance; persisting balances for audit is parked until something
      reads them.
  - id: D-7
    statement: >-
      Navigation is server-rendered links in the authenticated shell
      (layout.tsx) with the active route derived from the request path: no
      client state library (the deliberately-absent list,
      charter.yaml:80), no route registry abstraction for three links.
  - id: D-8
    statement: >-
      The KBC balance identity is: previous balance plus the sum of all
      transaction rows including the DOMICILIERING settlement credit equals
      the Afrekening amount, the closing figure sitting on the Afrekening
      line (space thousands separator), because that is the identity that
      closes exactly in integer cents on the real statement; the addendum's
      looser "closing balance or settlement total" wording is pinned to
      this verified form.
  - id: D-9
    statement: >-
      LLM-assisted extraction for unknown layouts stays out of v0.2
      entirely. The addendum permits it in principle for v0.3+ behind the
      balance gate (pulse-v0.2-pdf-addendum.md:45); nothing in this plan
      builds toward it beyond the gate itself, which M3-P2 ships for its
      own reasons.
  - id: D-10
    statement: >-
      An unauthenticated share is NOT preserved through sign-in: the share
      route redirects to sign-in, stores no Import row, no bytes and no
      server-side handoff, and the user shares again after signing in,
      the share sheet being one tap away (finding PR2-005). Chosen over a
      bounded server-side handoff because the handoff stores
      unauthenticated bytes before any household context exists, which is
      hazard H5.2's exact shape, and its whole benefit is saving one tap
      on a rare cold-session path; criterion 5.4 witnesses the
      no-preservation contract.
  - id: D-11
    statement: >-
      The merchant source stays counterpartyName ?? description and does
      NOT become a per-SourceProfile or per-template concern; what changes
      is that the rule gets ONE definition, an exported helper both call
      sites use (src/modules/ledger/application/interpret-window.ts:87 and
      src/modules/merchants/domain/merchant-review.ts:50 currently define
      it twice). Considered and rejected under R-005 as a question with a
      defensible answer rather than a genuine fork: a template-declared
      merchant extractor would put an INTERPRETATION concern inside the
      code-owned facts-parsing layer, which the facts-versus-interpretation
      split forbids; the CSV path carries the same descriptor shapes and
      would gain nothing from template ownership; the merchants normaliser
      is the one place with a stability contract and a pinned regression
      table, so grouping logic belongs there; and the choice is cheap to
      revisit, since adding a template hook later is additive and touches
      no stored data. No decision record is raised. FORWARD NOTE, recorded
      from the fix-round-2 adversarial review, which judged this decision
      correct and named one cost to keep in view rather than a finding:
      every future bank grammar added to the shared normaliser is a CR-402
      recipe change that re-normalises every household's stored rules, so
      the SECOND bank grammar is the moment to revisit the
      template-extractor option rather than to add a third set of patterns
      here by reflex.
  - id: D-12
    statement: >-
      Card-number masking is DISPLAY ONLY. The masking helper is applied
      to rendered labels and to nothing else: not to rawLine, which stays
      verbatim because facts are immutable
      (prisma/schema/import.prisma:106) and the statement genuinely prints
      the unmasked number; not to the normalised grouping key; and not to
      the hidden counterpartyText value the review form submits
      (src/modules/merchants/ui/merchant-review.tsx:42), because that
      value becomes the EXACT MerchantRule subject
      (src/modules/merchants/application/assign-merchant.ts:54) and a
      masked subject would match no future transaction. Criterion 6.4
      witnesses the unmasked subject, criterion 6.3 the masked label.
  - id: D-13
    statement: >-
      Which branch of the CR-402 stability contract M3-P6 ships is
      selected by MEASUREMENT, not by assumption: the verification-first
      step counts stored MerchantRule rows in the deployed database over
      an explicitly pinned read-only connection and records the number,
      zero selecting the no-migration branch and any nonzero count
      selecting the one-off re-normalisation of stored EXACT and PREFIX
      patterns in the same change. The claim that production holds no
      rules is thereby made checkable rather than asserted, and criterion
      6.6 fails if the record or the migration is missing.
  - id: D-14
    statement: >-
      The rebuild is TWO phases, not one and not three: M3-P7 carries the
      constraint change, the tokens, the app shell and the month view, and
      M3-P8 carries the merchant review. They are separable because the
      dependency runs one way only: M3-P8 consumes the tap-target token, the
      row-height token and the two-line row primitive that M3-P7 defines and
      contributes none of its own back, which criterion 8.7 pins by requiring
      styles/tokens.css to be unchanged by M3-P8. Splitting further would be
      dishonest, and so would merging them: the shell, the tokens and the
      month view cannot be split from each other because the shell is where
      the 44px rule first lands and the month view is the only screen that
      exercises the wide-width rail, while the merchant review shares nothing
      with them except the stylesheet and the primitives. The cost of the
      split is that the two screens are briefly inconsistent between the two
      merges, which is visible only to whoever is running the fleet.
  - id: D-15
    statement: >-
      The pulse-frontend skill's desktop-first paragraph is replaced ONCE, by
      M3-P7, and M3-P4 does not replace it a second time. M3-P4 was written
      before DR-0022 and its step 1 said the same paragraph would be revised
      to "import is mobile-first, the month view remains desktop-competent",
      which DR-0022 supersedes: mobile first is now every screen, not the
      import screens alone. M3-P4's step 1 is amended to a CHECK that the
      constraint M3-P7 wrote is present and unweakened, and criterion 4.4 is
      ADDED to carry that check. CORRECTED in the M0-P3 fix round (finding
      MPR-011): the original claim that criteria 4.1, 4.2 and 4.3 were all
      still satisfiable byte unchanged was right about 4.2's "desk activity"
      grep and WRONG about the rest of 4.2, which also requires the stance
      line to CITE THE V0.2 ADDENDUM. M3-P7 step 2 as first written cited only
      DR-0022, and criterion 4.4 forbids M3-P4 from editing the file, so M3-P4
      would have arrived at a paragraph it could not fix and could not close
      against. 4.2 stays satisfiable only because M3-P7 step 2 and criterion
      7.11 now require the addendum citation as well. Criteria 4.2 and 4.3
      remain byte unchanged; criterion 4.1 was STRENGTHENED in the same round
      (finding MPR-007) off the overflow-only bar, because DR-0022 makes
      phone-width usability evidence standing on every UI phase. Nothing in
      M3-P4 is weakened; one duplicated edit is removed and one bar is
      raised.
  - id: D-16
    statement: >-
      The stylesheet is allowed exactly ONE breakpoint, and the value is
      declared as a token even though the token cannot be referenced from the
      media condition. The tree reached b560e85 with zero media queries on
      purpose: src/app/globals.css:97 records that a var() cannot appear in a
      media-query condition, so the alternative to a literal was intrinsic
      wrapping, and the M3-P6 comment at src/app/globals.css:696 chose
      wrapping for exactly that reason. Mobile first changes the calculation:
      the phone layout is now the default and the rail is the exception, and
      an exception stated as "wrap when it happens to fit" cannot express
      "spend wide with income and reserves beside it". So one @media
      (min-width) condition is permitted, its literal is mirrored by a
      breakpoint token in styles/tokens.css so a reader finds it where every
      other layout constant lives, a comment says why the literal is repeated,
      and criterion 7.3 fails the moment a second distinct condition appears.
      This is an engineering call with a defensible answer, not a product
      fork, so it is decided here and no decision record is raised.
  - id: D-17
    statement: >-
      Names WRAP and are never truncated, on both rebuilt screens, against
      the mockup. The mockup ellipsizes every long name
      (Main.dc.html:87, :131, :158, :168; MerchantReview.dc.html:50, :65,
      :80), the shipped screen wraps (src/app/globals.css:803 through :808),
      and .claude/skills/pulse-frontend/SKILL.md:122 forbids truncating
      anything the user needs. A Belgian bank descriptor and a Dutch or
      French label are exactly the strings that lose their meaning in their
      last twelve characters, and the mockup's own README says it is a layout
      reference and not a source of truth. The single deliberate exception in
      the tree stays: the household identity may ellipsize
      (src/app/globals.css:160 through :166), which M3-P1 criterion 1.5
      decided and criterion 8.4 pins to that one rule.
  - id: D-18
    statement: >-
      The mockup is a LAYOUT reference. Where it and the shipped product
      disagree about copy, about data, or about what the screen can do, the
      shipped product wins unless the difference is one of the six things
      delivery/design/mobile-v02/README lists as fixes 1 through 6 as the
      things the mockup exists to fix. By that rule the rebuild adds no message key in any
      language (criteria 7.10 and 8.7 pin messages/ to an empty diff), builds
      no rename capability, prints no month span it has no dates for, and
      keeps the merchant review's two direction sections and their totals.
      Four mockup elements are parked rather than dropped silently; each is
      listed under parked with the file and line that shows it has nothing
      behind it. ONE EXCEPTION THIS RULE DOES NOT SETTLE BY ITSELF, recorded
      in the M0-P3 fix round (finding MPR-014): fix 4, the tag subheads, IS
      one of the six, so this rule points at building it, and it is
      nonetheless a projection change rather than a layout one. That is
      exactly why it is raised as DR-0023 rather than decided here, and why
      the recommendation attached to it now says what a yes costs.
  - id: D-19
    statement: >-
      ORDERING. M3-P7 runs first, then M3-P8, and both run BEFORE M3-P4 and
      M3-P5. Before M3-P4 because M3-P4 rewrites the same skill paragraph
      (decision D-15) and because M3-P4 designs the import screens
      mobile-first and would otherwise invent its own tap-target and row
      tokens hours before M3-P7 adds the real ones. Before M3-P5 because the
      whole point of a share target is that the phone hands Pulse a statement
      and the user lands on the month view: shipping that entry point onto
      the screen the owner graded 1/10 delivers the defect faster rather than
      fixing it. INDEPENDENT of M3-P3, which is implemented, green and
      paused: M3-P3's files-to-touch are src/modules/import/domain/,
      test/fixtures/ and test/application/ and it changes no UI file, so its
      review can resume at any point without waiting for or blocking the
      rebuild. Severity is the tie-breaker where the ordering was otherwise
      free: the owner's own grade of the shipped product is the highest-
      severity open item in v0.2 and DR-0002's clock does not start until the
      owner can actually use Pulse from a phone. ADDED in the M0-P3 fix round
      (finding MPR-007): the standing criterion DR-0022 decided applies to
      M3-P4 and M3-P5 too, not only to the two rebuild phases, which is why
      criterion 4.1 was raised off the overflow-only bar and criterion 5.5 was
      added. Ordering and the standing criterion are the same argument: it is
      no better to build the next three mobile screens to the discredited bar
      than to ship the share target onto the screen the owner graded 1 out
      of 10.
  - id: D-20
    statement: >-
      Both rebuild phases are LAYOUT phases and the plan makes that
      falsifiable rather than aspirational: criteria 7.10 and 8.7 require git
      diff --name-only over the domain and application directories, prisma/
      and messages/ to print nothing. If the rebuild turns out to need a
      projection change, the phase stops and says so rather than growing one,
      which is the same discipline CLAUDE.md's scope-discipline section
      applies to queues, caches and state libraries. Nothing in either phase
      needs a queue, a cron, an event bus, a cache, a state management
      library, a component library, a per-transaction override, a goal or a
      budget, and the icons the mockup draws are hand-written inline SVG
      precisely so that no icon library is added.
  - id: D-21
    statement: >-
      The phone project uses a chromium device descriptor with isMobile true
      rather than a bare viewport override, and this is load-bearing rather
      than stylistic. Playwright without isMobile sizes the layout viewport
      directly and never consults the meta viewport tag, which is exactly why
      three existing phone specs (test/e2e/navigation.spec.ts:168,
      test/e2e/merchants.spec.ts:166, test/e2e/import.spec.ts:184) pass
      whether that tag exists or not, and whether it exists is unconfirmed at
      b560e85. The specs that already set their own viewport with test.use
      keep doing so and keep working; the project adds the device profile
      that makes criterion 7.2 mean something.
  - id: D-22
    statement: >-
      The interaction-feedback work is THREE phases, and it was written as
      two before the owner decided DR-0025 and DR-0026 mid-round. The split
      follows the causes and the boundaries rather than a convenient size.
      M3-P9 carries the APPEARANCE: the tokens, the reduced-motion path, and
      the pressed, disabled and busy rules. It edits two stylesheets, the
      Playwright config and one spec, opens no client boundary and edits no
      component, which criterion 9.7 pins by requiring every *.tsx path to
      print nothing in the diff. M3-P10 carries the ACKNOWLEDGEMENT: the
      client leaves, their use on all fourteen controls, the double-press
      guard and the interval measurement. It edits components and no
      stylesheet, which criterion 10.7 pins. M3-P11 carries the PREDICTION
      DR-0025 decided, with the loud failure and the toast DR-0026 decided.
      THE DEPENDENCY RUNS ONE WAY THROUGH ALL THREE, which is the test
      decision D-14 applied to M3-P7 and M3-P8: M3-P10 consumes M3-P9's state
      vocabulary and contributes none back, M3-P11 consumes M3-P10's submit
      leaf and widened copy gate and contributes none back, and each phase's
      diff pins what it may not touch. WHY THE THIRD PHASE RATHER THAN A
      LARGER SECOND ONE, which is the call the owner's decisions forced. The
      prediction is a different KIND of work from the acknowledgement rather
      than more of it: a different client boundary, being the first component
      in this product that holds state across a server round trip; the first
      catalogue copy this round adds; a hand-built accessible notice; and two
      paths that exist only because the prediction does, the failure and the
      difference. Folding it into M3-P10 would produce a phase of twenty
      criteria whose most dangerous half, the failure path, would be reviewed
      last and least. And the acknowledgement layer is worth merging on its
      own, because it reaches every control in the product while the
      prediction reaches exactly one surface. Merging M3-P9 and M3-P10 was
      rejected for the reason it was rejected when this round had two phases:
      a stylesheet rewrite and the product's first component-level client
      boundary need different reviewers looking for different things.
      Splitting further would be dishonest: the pressed and the disabled
      appearance are the same rules on the same controls, and the submit busy
      state and the navigation pending marker are the same vocabulary entered
      by two hooks. The cost of the split is that after M3-P9 merges the
      product carries rules for states nothing enters yet, recorded as hazard
      H9.6, and that the owner's optimism arrives one merge after the
      acknowledgement does.
  - id: D-23
    statement: >-
      WHERE THE CLIENT BOUNDARY GOES AND WHAT IT COSTS. It goes in
      src/platform/ui and nowhere else, as at most three "use client" files:
      the pre-existing src/platform/ui/nav-link.tsx, one shared submit leaf
      reading React's useFormStatus, and one pending-marker leaf reading the
      app router's useLinkStatus. Nothing else becomes a client component: no
      page, no layout, no route, and no file under any module's ui/
      directory, which criterion 10.6 pins. The reason this is the smallest
      boundary the job allows rather than merely a small one is the shape of
      useFormStatus: it reports the pending state of the nearest ANCESTOR
      form, so the leaf needs no props threaded down from the form, no state
      lifted into a shared parent, and no context provider, and every form,
      every row, every screen and every layout that renders it stays a server
      component doing its own data fetching. M3-P11 adds two more client
      files and no more: the hand-built toast, which knows nothing about
      merchants and therefore belongs under src/platform/ui by the placement
      test at .claude/skills/pulse-frontend/SKILL.md:60, and one leaf under
      src/modules/merchants/ui/ that owns a single group row and predicts its
      label, which knows what a merchant group is and therefore belongs to
      the module. Five client files in total, and criterion 11.7 fails a
      sixth. THE COST, stated so it is not
      discovered later. Three component modules and their React runtime reach
      the browser where two did before. Every user-facing string these leaves
      render is passed in as an already-translated prop from a server
      component, so no message catalog crosses; criterion 10.6(c) fails the
      phase if next-intl is imported inside one. The merchant review renders
      one instance of the submit leaf per unresolved group, so a household
      with many unresolved counterparties gets many ELEMENTS of one already
      loaded module, not many modules. And what does not cross at all: no
      domain type, no application function, no repository, no projection and
      no household context, which is the rule
      .claude/skills/pulse-frontend/SKILL.md:44 states and criterion 10.6(c)
      measures.
  - id: D-24
    statement: >-
      The stylesheet's media-condition budget grows from one to two, and the
      second one is not a breakpoint. Decision D-16 permitted exactly ONE
      @media condition, a min-width, and M3-P7's criterion 7.3 counted the
      distinct conditions at exactly 1. M3-P9 adds a prefers-reduced-motion
      condition, which is not a width and does not reopen the layout question
      D-16 settled: the budget is now exactly one min-width condition and
      exactly one prefers-reduced-motion condition, and criterion 9.6 counts
      both and fails on a third. This is recorded as a decision rather than
      done quietly because D-16's own text says criterion 7.3 fails the
      moment a second distinct condition appears, and a later reader
      comparing the two counts should find the reason here instead of a
      contradiction. The block redefines --duration-press, --duration-state
      and --duration-busy-cycle at :root rather than repeating a variant per
      rule, so a rule added later inherits the reduced-motion path without
      knowing it exists, which is the only version of this that survives the
      next phase.
  - id: D-25
    statement: >-
      ORDERING. M3-P9 runs first, then M3-P10, then M3-P11, and all three run
      BEFORE M3-P8,
      M3-P4 and M3-P5. Before M3-P8 because M3-P8 rebuilds the merchant
      review's group row and its naming form, which is one of the seven
      submit controls M3-P10 changes: running M3-P8 first would mean
      rebuilding that form and then reopening the same markup a phase later
      to add the busy control, and running it after means it inherits a form
      whose submit is already the shared leaf and keeps it. The same argument
      that decision D-19 made for M3-P7 applies here unchanged, because it is
      the same argument: these two phases define PRIMITIVES that every
      interactive surface consumes, exactly as M3-P7 defined the tap-target
      token M3-P8 consumes, and a primitive is cheaper to consume than to
      retrofit. Before M3-P4 because M3-P4 redesigns the import screens,
      which carry three of the seven submit controls, and because it would
      otherwise invent its own pressed and busy treatment hours before M3-P9
      adds the real one. Before M3-P5 because a share target hands Pulse a
      statement and drops the owner on a screen whose controls give no sign
      they were pressed, which delivers the defect faster rather than fixing
      it. INDEPENDENT of M3-P3, which is implemented and paused and changes
      no UI file. WHAT ORDERING THIS WAY COSTS, stated because it is not
      free: M3-P8's phone rebuild of the merchant review now waits behind
      THREE phases, so the screen the owner graded stays as it is for three
      more merges, and two of those three edit the very component M3-P8
      rebuilds. The tie-breakers are that the owner's live report is this
      one, that the pressed and pending states reach ALL fourteen controls in
      the product at once while M3-P8 improves one screen, and that M3-P11
      rewrites that screen's naming row anyway, so running M3-P8 in the
      middle would mean rebuilding the same row twice.
  - id: D-26
    statement: >-
      NO PACKAGE, and the phase stops rather than adding one. React's
      useFormStatus, useOptimistic and useTransition and the app router's
      useLinkStatus are part of the framework this product already depends
      on, and using them adds nothing to package.json; criterion 10.7
      requires git diff over package.json and package-lock.json to be empty,
      so the rule is measured rather than promised. No state management
      library, no component library, no animation library, no spinner
      package, no toast package: CLAUDE.md scope discipline and
      charter.yaml's deliberately-absent list both bind, and the correct
      response to concluding that the work needs one is to say so and stop,
      not to plan it in. The one thing this decision deliberately does not
      do is forbid the phase from finding that a package is needed; it
      forbids adding one without the owner deciding. DR-0026 puts this under
      real pressure and the decision holds: the toast is built by hand, which
      the record itself requires, and criteria 10.7 and 11.8 both require the
      two package files to be byte unchanged.
  - id: D-27
    statement: >-
      COPY LANDS IN ONE PHASE ONLY, and the cap is FOUR keys rather than the
      three this decision first set. M3-P9 and M3-P10 add no message key:
      the busy affordance is a visual mark drawn as a pseudo-element plus
      aria-busy on the control, and the control keeps the label it already
      has, so criteria 9.7 and 10.7 both pin messages/ to an empty diff.
      M3-P11 adds at most FOUR keys and criterion 11.6(a) enforces the count
      and requires all three catalogues to carry the same set: the failure
      message and the dismiss control's label, which DR-0026 requires; the
      difference notice, which criterion 11.5 requires; and the unconfirmed
      marking's accessible text. THE FOURTH KEY WAS ADDED IN THE M0-P4 FIX
      ROUND (finding ADV-M0P4-10) and the reason is worth stating plainly,
      because the cap in the first version of this decision was the only
      thing blocking it. A prediction marked only visually is not marked at
      all for a reader who is not looking, and the first design made that
      worse rather than neutral by marking the row with aria-busy, which
      tells assistive technology to hold back the changes inside the element
      and would have suppressed the announcement of the predicted value. In
      a finance product, showing one reader an unstored value as though it
      were stored is not a cost worth paying to hold a copy budget. The cost
      of keeping the first two phases out of the catalogues stands and is
      worth naming: aria-busy is supported unevenly by screen readers, so
      between M3-P10 and M3-P11 a non-visual reader gets a non-pressable
      control and not the word busy. A polite live region announcing that an
      action is RUNNING, as against the assertive one M3-P11 raises when one
      FAILS, is the fix for that; it is more copy in three languages for a
      state the owner has not asked to hear, and it is parked rather than
      built.
  - id: D-28
    statement: >-
      M3-P9's disabled and busy appearances are measured by APPLYING THE
      STATE THROUGH THE DOM, because nothing in the product enters either
      state until M3-P10, and this is stated plainly rather than left as a
      trick in a spec. What the technique proves: that the shipped stylesheet
      renders a real, visibly different control when the state is present, at
      both widths and under reduced motion, which is exactly what a grep for
      the selector would not prove. What it does NOT prove: that anything
      ever sets the state, which is M3-P10's job and is measured by criteria
      10.3 and 10.5 against the real controls. The alternative was to merge
      the two phases so that every state has a producer inside its own phase,
      and decision D-22 records why that trade was not taken. A reviewer
      reading criterion 9.3 should read this decision beside it.
  - id: D-29
    statement: >-
      TWO THINGS FOUND WHILE MEASURING AND DELIBERATELY NOT BUILT, both
      parked with their reasons. First, the four hover rules in
      src/app/globals.css and the fifth at styles/tokens.css:201 are not
      guarded by an @media (hover: hover) condition, so on the owner's touch
      device a hover state STICKS after a tap until something else is
      touched, which a reader can easily read as a control that stayed
      pressed. It is a real defect and it is adjacent to this complaint, and
      it is parked rather than folded in because the fix is a third media
      condition that decision D-24 has just budgeted against, and because
      changing the hover rules in the same phase that adds the pressed rules
      would make criterion 9.2's hover baseline move under the measurement
      that depends on it. Second, no control anywhere carries a busy
      announcement for a non-visual reader, which decision D-27 records.
      Neither is smuggled into these two phases and neither is dropped.
  - id: D-30
    statement: >-
      DR-0025 IS DECIDED AND THIS ROUND PLANS ON IT: optimistic, revert
      loudly on failure (owner, 2026-08-23, record in the fleet decisions
      directory). The owner's framing is that the screen should predict the
      result nearly always and, the rest of the time, show that it failed
      and put back what was there. This does NOT weaken the standing rule
      that a screen never shows an unknown as though it were known
      (.claude/skills/pulse-frontend/SKILL.md:105), and the plan is written
      so that it does not: a prediction is shown MARKED as a prediction, and
      the marking clears only when the server's answer arrives. AMENDED
      TWICE, and both amendments are about the same sentence being stronger
      than the mechanism under it. In the first fix round (finding
      ADV-M0P4-10) the claim "no reader ever has to guess" was FALSE for a
      non-visual reader, because the marking was aria-busy on the row and
      aria-busy tells assistive technology to hold back the changes inside
      the element. In the second (findings DELTA-M0P4-02 and DELTA-M0P4-04)
      the replacement was still stronger than its mechanism, because
      visually-hidden text on a non-focusable li is present and unheard, and
      because forbidding aria-busy on every element OF the row also removed
      it from the submit control inside that row, where criterion 10.3
      requires it. THE MARKING AS IT NOW STANDS HAS TWO PARTS AND ONE
      CARVE-OUT. The visual part is data-unconfirmed on the row, drawn by
      the state vocabulary M3-P9 ships and measured by criterion 9.3(c). The
      non-visual part is the fourth catalogue key rendered inside a POLITE
      live region, role="status", inside the row so that it is ANNOUNCED
      when it appears, and referenced by aria-describedby from the naming
      submit control where focus sits at that moment; criterion 11.2(c)
      measures both halves and criterion 11.1(g) observes the announcement
      rather than reading the accessibility tree, because a description
      appears in that tree whether or not anything speaks it. THE CARVE-OUT:
      aria-busy is forbidden on the row element, on the group-label and on
      the live region, and is REQUIRED on the naming submit control inside
      the row, which criterion 11.2(d) states and criterion 10.3 depends on.
      It scopes to that control's own subtree, which carries only its label,
      so it suppresses nothing that matters and it is what tells a reader
      the action is running. With both parts present and the carve-out
      stated, the claim holds for both readers. Two further constraints ride
      with the decision and are planned as first-class rather than as error
      handling: the failure path is a feature and is measured on a forced
      failure by criterion 11.4, and the difference path, where the server
      succeeds but answers something other than what was predicted, is
      measured by criterion 11.5. The decision is recorded as reversible per
      surface: reverting one surface to pending-only is a rendering change
      in one component.
  - id: D-31
    statement: >-
      WHAT IS PREDICTED, SURFACE BY SURFACE, because predicting a label and
      predicting a money figure are different acts. ONE surface predicts.
      (1) The merchant naming action predicts the row's LABEL, taken straight
      from the submitted form value with no rule applied to it, and the row
      leaving the unresolved treatment. It predicts NO amount, NO count, NO
      position and NO merge, and each of those has a reason that is a line of
      code rather than a preference: naming into an existing merchant name
      merges two groups and sums two totals
      (src/modules/merchants/application/assign-merchant.ts:58 through :60),
      the review's order is a domain sort with a tie-break on the label
      (src/modules/merchants/domain/merchant-review.ts:57 through :67), and
      the unresolved count is a projection over the household rather than a
      property of the row. Predicting any of them means running a domain rule
      in the browser, which is how a screen and a database start disagreeing.
      SIX surfaces are PENDING-ONLY and stay that way, each because the
      result is something the browser cannot derive without inventing it.
      (2) The statement upload: the result is a parse of a file the browser
      has not read, and the detected format, the row count and the account
      come from the server's parser. (3) Preview again: the same parse, run
      again. (4) Confirm import: an ingest plus an interpretation, whose
      outputs are rows added, duplicates skipped and a reconciliation
      verdict, every one of them money-shaped. (5) and (6) Sign in and sign
      up: an authenticated session or a refusal from the identity provider,
      so a predicted success would show a household that may not exist.
      (7) Sign out: it redirects and there is nothing to show but the busy
      control. The seven navigating controls are pending-only by nature: a
      route transition has no result to predict. THE TRIM IS NOT PREDICTED
      EITHER, deliberately: the use case stores the trimmed name
      (src/modules/merchants/application/assign-merchant.ts:50), and
      trimming inside the prediction would put one line of the use case in
      two places AND would leave the difference path with no deterministic
      test, which is how a path fails silently the first time it is really
      reached. So the prediction shows what was typed, and criterion 11.5
      uses exactly that input to prove the difference is surfaced.
  - id: D-32
    statement: >-
      DR-0026 IS DECIDED AND THIS IS ITS SHAPE: a hand-built toast, and here
      is every choice inside it that the record left to the plan. IT HAS NO
      TIMER. The failure notice stays until the reader dismisses it with a
      real control, rather than auto-dismissing with a dismiss control
      available. The reason is the risk the record itself names: a transient
      notice that is missed leaves no trace, and a reverted value on a screen
      of figures then reads as a value the reader entered themselves, which
      is the failure this whole decision exists to prevent arriving by
      another door. An auto-dismissing notice loses exactly the reader who
      looked away, which is the reader it is for. The cost is real and is
      accepted: an undismissed notice occupies the bottom of a 390 pixel
      screen until it is dealt with, which is why its dismiss control clears
      the tap-target minimum and why the page scrolls behind it. THE LIVE
      REGION IS PART OF THE MECHANISM: a failure is assertive (role="alert")
      and a non-failing difference is polite (role="status"), because a
      reader not looking at the corner of the screen is told either way.
      REDUCED MOTION IS FREE HERE and that is by design: the notice's
      entrance uses --duration-state, which M3-P9's reduced-motion block
      redefines at :root, so the notice appears at once instead of sliding
      with no separate rule to remember. THE ROW IS MARKED AS WELL AS THE
      TOAST BEING RAISED, which the record permits and this plan takes:
      criterion 11.4 requires the reverted label to equal the pre-action
      value and the notice to be raised, and the marking is what lets a
      reader who sees the toast find the row it is about. ONE HOST PER ROW,
      not a shared one: a shared toast host would need state above the rows,
      which means a provider, which means the rows' parent becomes a client
      component and the merchant review's list ships to the browser. Two
      simultaneous failures would overlap; at the failure rate the owner
      estimated that is a cosmetic risk this plan accepts rather than paying
      a boundary for, and a shared host is parked for the day a second
      surface needs one.
  - id: D-33
    statement: >-
      THE REPOSITORY'S HARDCODED-STRING GATE HAS A HOLE AND THIS ROUND CLOSES
      HALF OF IT. .claude/skills/pulse-frontend/SKILL.md:119 calls it a grep
      gate; it is the ESLint rule react/jsx-no-literals, scoped by a files
      glob to src/modules/**/ui/**/*.tsx (eslint.config.mjs:37 through :40),
      so nothing under src/platform/ui/ or src/app/ has ever been covered.
      That matters now because this round puts client leaves under
      src/platform/ui/ and DR-0026 requires the toast's copy to come from the
      catalogues. M3-P10 widens the glob to src/platform/ui/**/*.tsx, which
      is green at its base, and criterion 10.11 proves the widening with a
      red witness rather than trusting a glob that could match nothing.
      src/app/**/*.tsx is NOT widened in the same change, for one measured
      reason: it fails at the base on exactly one line, the brand word at
      src/app/(app)/layout.tsx:43, which is a proper noun rather than
      translatable copy. Closing that half means deciding how a brand name is
      exempted, which is a copy question and not this round's, so it is
      parked with the line that causes it.
  - id: D-34
    statement: >-
      WHERE THE INTERVAL MEASUREMENTS RUN, and it is not the development
      server they were first written against. Finding ADV-M0P4-04
      established the fact this decision turns on: viewport prefetching is
      disabled in development
      (node_modules/next/dist/client/components/links.js:194 through :199),
      and criterion 10.5 is precisely about what a navigation does while it
      waits. In the gate, prefetch off and the destination held for two
      seconds, only the marker branch could ever pass. WHAT HAPPENS IN THE
      OWNER'S BUILD IS NOT PREDICTED HERE, corrected in fix round 2 (finding
      DELTA-M0P4-07): this decision used to assert that with prefetch on the
      destination renders from the router cache with no pending state at
      all, and that is not true of this app's routes. The App Router
      prefetches a dynamically rendered route only as far as its nearest
      loading boundary, this application declares none (no loading.tsx
      anywhere under src/app at 89ed187), and every destination the seven
      navigating controls point at awaits requireHouseholdContext and is
      therefore dynamic (src/app/(app)/page.tsx:14,
      src/app/(app)/merchants/page.tsx:8, src/app/(app)/import/page.tsx:12).
      So the production run may well take the marker branch too. That is not
      known until it is run, which is the point: the branch each control
      takes is a property of the build and the route shape and is RECORDED
      by criterion 10.5(c) and DISCOVERED by criterion 10.1, not predicted
      in this plan. THE DECISION IS UNCHANGED BY THAT CORRECTION and stands
      for the reason underneath it: the measurement belongs in the
      production build because that is where the prefetching behaviour is
      real whatever it turns out to be, and because a phase that never
      builds the production bundle cannot say anything about the build the
      owner presses. playwright.config.ts gains a FOURTH project,
      chromium-phone-prod, spreading the same chromium mobile device
      descriptor with isMobile at 390 by 844 as chromium-phone but bound to
      prodBaseURL, which is the production-mode server the config already
      builds and starts (npm run build followed by npx next start,
      playwright.config.ts webServer entry one). Criteria 10.2, 10.3, 10.4
      and 10.5 are evaluated there, criterion 10.5 is evaluated in the
      development project AS WELL so the branch each control takes in each
      build is recorded and compared, and M3-P11's prediction and failure
      measurements are taken in the production project and the desktop
      project and NOT in the development one. The appearance criteria 9.2,
      9.3 and 9.4 stay in the development and desktop projects: they measure
      hand-written rules in src/app/globals.css and styles/tokens.css, which
      the build does not transform, and no dev-versus-production divergence
      in them has been observed; if one ever is, adding them to the
      production project costs one line. WHAT THIS COSTS, restated in fix
      round 2 because the first version understated the matrix (finding
      DELTA-M0P4-09). The gate's wall clock grows by roughly the interaction
      specs' own runtime, not by a build, because the production server was
      already being started on every run: criteria 10.2, 10.3 and 10.4 MOVE
      to the production project rather than doubling, criterion 10.5 is the
      one that runs twice, and M3-P11's spec runs in two projects across
      three languages. The largest single cost is criterion 11.4, two causes
      by three languages by two viewports, each carrying a two second delay
      and a five second wait, in a container where this fleet has already
      lost a round to moving chromium renderer crashes on long runs
      (playwright.config.ts:35 through :47). The production server also
      refuses a frozen clock, so playwright.config.ts strips PULSE_FIXED_NOW
      from its environment and every spec that runs there must be
      clock-independent; the interaction spec reaches a month through the
      month view's own query parameter (src/app/(app)/page.tsx:12,
      src/modules/overview/ui/month-view.tsx:448 through :449) rather than
      through whatever month the clock gives, which is the same route
      criterion 9.2(a) needs anyway for the next month step control. And the
      phase cannot close unless the production bundle builds, which is a
      real new dependency for M3-P10 and M3-P11 and is the right one to
      have.
  - id: D-35
    statement: >-
      WHAT THE M0-P4 FIX ROUNDS ACCEPTED AND WHERE THEY REFINED RATHER THAN
      COPIED. ROUND 1: the adversarial review returned thirteen findings and
      this plan accepted all thirteen on the merits; none was declined. It
      spot-checked every one of the sixteen report-code-disagreement entries
      that names a file and line and found every line number correct, and it
      attacked neither the grounding nor the three-phase split, so the edits
      were criterion-level throughout and no phase changed shape. TWO of the
      thirteen were REFINED rather than taken verbatim, and both refinements
      are recorded in the criteria themselves. ADV-M0P4-05's edit required
      the pressed background-color to differ by at least 3 percent in
      relative luminance on every control; several of the nineteen are
      anchors and buttons whose resting background is transparent
      (src/app/globals.css:177 .app-nav-link, :231 .app-signout with an
      explicit background: none at :236, :281 .empty-state-cta declare no
      background at all), and the relative luminance of a fully transparent
      colour is not defined, so the clause as written would have been
      unsatisfiable on them rather than strict. ADV-M0P4-10's edit kept
      aria-busy on the predicted row and added a described text beside it;
      this plan removes aria-busy from the row instead, because leaving it
      is what suppresses the announcement. ONE PIECE OF ROUND 1'S EVIDENCE
      WAS WRONG and the correction made the fix cheaper: ADV-M0P4-02 stated
      that the preview-again submit is behind isPdfLayout and does not
      render for the CSV fixture, when the ternary at
      src/modules/import/ui/profile-confirmation.tsx:136 puts the hidden
      profile inputs in the TRUE arm and the spec editor with that submit in
      the ELSE arm, so the control renders for the DELIMITED path and not
      for a PDF. The reviewer accepted that correction and recorded it as
      its own error. The rest of that evidence line held and is what
      criterion 9.2(a) acts on: the control sits inside a details element
      with no open attribute (profile-confirmation.tsx:151), so the
      disclosure must be opened and no PDF fixture is needed for it. ROUND
      2: the delta review returned nine findings and this plan accepts all
      nine, again declining none. It could not reconstruct the document.body
      cheat or any variant of it against the rewritten criterion 10.2, which
      is the round's main result. TWO of the nine were the round-1 fixes
      biting back and both are worth naming here, because they are the same
      failure shape and it is one this plan should expect of itself.
      Removing aria-busy from the row over-corrected by one word: the naming
      submit is a DESCENDANT of the row
      (src/modules/merchants/ui/merchant-review.tsx:26 the li, :45 the form,
      :60 the submit), so "no element of that row" contradicted criterion
      10.3 on the control the owner presses most, and criterion 11.2(d) now
      carves the submit control out by name. And the set assertion that
      answered the denominator finding enumerated sixteen controls where a
      census of the selector at 89ed187 returns seventeen source sites
      rendering NINETEEN controls, because src/platform/ui/nav-link.tsx:47
      renders three; the three the enumeration missed are
      src/app/(auth)/sign-up/page.tsx:37,
      src/modules/import/ui/import-result.tsx:66 and
      src/modules/import/ui/import-result.tsx:36, the last of which is a
      FIFTH conditional control. Criterion 9.2(a) now names nineteen and
      states that the set is SWEPT rather than looked up, which is the half
      that stops the same error recurring: a sweep that finds an unnamed
      control amends the enumeration, and never narrows the spec. TWO OF
      ROUND 2'S FINDINGS ARE THE REVIEWER CORRECTING ITSELF, recorded
      because they change what the criteria say: it withdrew its own 3
      percent relative-luminance bar as scale-dependent, since 0.03 of
      luminance is about 1.03 to 1 near white and about 1.4 to 1 near black,
      and criteria 9.2(b)(ii) and 9.3 now measure a WCAG contrast ratio of
      at least 1.1 to 1 between COMPOSITED colours with the alpha floor kept
      as well as rather than instead of; and it found that the
      data-group-key attribute it had asked for in round 1 is a third
      unmasked copy of the normalised descriptor
      (src/modules/merchants/domain/merchant-review.ts:80), which M3-P11's
      third step now masks.
  - id: D-36
    statement: >-
      The question this work answers, in the owner's own words, recorded so
      that a later reader can check the answer against the question rather
      than against a paraphrase of it. Looking at the deployed merchant review
      on their phone on 2026-08-23: "if I name a merchant .. what is the thing
      new transactions will match on? if I look at the first two here ... they
      are seperate according to pulse, but they are the same bank account. if
      the full description is used at matching string .. I think pulse has
      zero ability to deliver on its promise." They were right about the
      mechanism and about the consequence. The measured shape of it is in this
      plan's report-code-disagreement entries for M3-P12; the owner's answer
      to the product question it raised is DR-0027.
  - id: D-37
    statement: >-
      Merchant identity is a NAMESPACED KEY plus a two-valued BASIS, derived
      by one pure function in the merchants domain. Where the row carries a
      counterparty account the key is that account, uppercased and
      whitespace-stripped, under an account namespace, and nothing else is
      consulted: not the counterparty name, not the description, not the
      communication (DR-0027). Where it does not, the key is the normalised
      descriptor under a descriptor namespace, unchanged from the baseline.
      Chosen over three alternatives. Over account plus communication, which
      DR-0027 rejected with its cost stated. Over a new column on MerchantRule
      carrying the basis, because the namespace prefix carries the same
      information with no schema migration and the unique index on (household,
      kind, pattern) keeps working unchanged. And over letting the account
      lose to a carried counterparty name, because a name is display text a
      bank can change between exports while an account number is the thing the
      money actually moved to, which is the whole content of DR-0027.
  - id: D-38
    statement: >-
      NO NEW DESCRIPTOR FAMILY IS ADDED, and the refusal is the measurement
      rather than caution. The dispatch that opened this round expected the
      rows carrying no counterparty account to need a descriptor grammar the
      way the card family got one in M3-P6. Measured through the shipped
      predicate over the real Belfius document: 23 of those 28 rows are
      ALREADY recognised by the card grammar, and the residue is 5 rows over 4
      distinct opening tokens producing 5 distinct keys. Inducing a family
      from at most one candidate pair on one month of one bank is exactly the
      widening this codebase forbids one tier down
      (src/modules/merchants/domain/normalise-counterparty.ts:127 through
      :132: pin the accepted shapes, never widen to a shape nobody has seen),
      and the cost of getting it wrong is a silent merge of two counterparties,
      which is worse than the visible non-convergence it would replace. Those
      5 rows therefore keep exactly the key they have today, so they can never
      merge with anything, and M3-P13 states their basis and their reach on
      the screen so the residue is VISIBLE and countable instead of guessed.
      The second family is added when a second real statement supplies the
      evidence for it, not before.
  - id: D-39
    statement: >-
      Declarations already written against the old key are RE-DERIVED, never
      dropped and never left dead. The deployed database holds one MerchantRule
      row and one merchant, measured read-only on 2026-08-23, so exactly one
      naming the owner made is at stake, and the M3-P6 note that the table was
      empty (src/modules/merchants/domain/normalise-counterparty.ts:72 through
      :80) no longer holds. An idempotent household-scoped routine carries
      every existing rule across, and DECISION D-45 IS THE MECHANISM OF
      RECORD: this decision states only WHAT must be true of the outcome, and
      the two-pass design that achieves it, along with the exit codes and the
      acknowledge path, is D-45's, which supersedes the single equality-driven
      pass this decision first described. What must be true: it DELETES
      NOTHING and it OVERWRITES no declaration; every rule either keeps its
      meaning or gains a rule beside it; and any rule whose EFFECT cannot be
      carried across is reported by id and reason rather than disappearing.
      Rejected: dropping the rules and returning the counterparty to unnamed,
      which discards owner work the owner never agreed to discard; and leaving
      them dead, which discards the same work while looking like it did not.
      Facts are untouched throughout: this is a change to DECLARATIONS
      followed by the existing recompute, which is the only thing that writes
      transactions.merchantId.
  - id: D-40
    statement: >-
      PREFIX and PATTERN stay declared, stay live and gain one refusal. The
      dispatch recorded them as dead; they are not. The matcher applies PREFIX
      at src/modules/merchants/domain/merchant-rule.ts:74 and PATTERN at
      src/modules/merchants/domain/merchant-rule.ts:81, and a test already
      exercises a PREFIX rule (test/application/resolve-merchants.test.ts:373).
      What is dead is the WRITE path: assignMerchant hardcodes EXACT
      (src/modules/merchants/application/assign-merchant.ts:63) and is the only
      caller of upsertRule in src. Removing the two kinds would be a Prisma
      enum migration that destroys a working matcher capability for zero
      deployed rows, and adding a write surface for them would re-open the
      substring guessing DR-0027 just closed, so neither is done. Instead:
      both kinds remain, matchRules REFUSES to apply either to an
      account-basis key, because a prefix of an account number is a different
      account and matching it would merge two counterparties, and the schema
      comment and the resolver header are corrected to state plainly that no
      product surface writes either kind today and that both are reserved for
      the slice-5 accepted-answer path. Cost: no migration, no schema change.
  - id: D-41
    statement: >-
      An account-basis group is LABELLED by the counterparty name where any of
      its rows carries one and by the counterparty account in masked display
      form otherwise. The label is display only and never the key: a masked
      key would produce a stored rule that can never match a second
      transaction, which is the hazard
      src/modules/merchants/domain/normalise-counterparty.ts:84 through :88
      already names for card numbers. Chosen over labelling the group with one
      of its rows' descriptors, which would present a per-transaction string
      as the group's identity and is the exact confusion this work exists to
      remove. The name is preferred over the account only because it reads
      better, and it changes nothing about what the group is: the account
      decides membership either way.
  - id: D-42
    statement: >-
      The identity is computed by the CALLER and passed to the
      MerchantResolver port as distinct keys, rather than the port growing a
      row-shaped parameter. The ledger already imports counterpartyText from
      the merchants module (src/modules/ledger/application/interpret-window.ts:111),
      so it imports counterpartyIdentity the same way, and the port keeps
      exactly one member taking distinct strings
      (src/modules/ledger/application/ports.ts:45). That single member is what
      makes it structurally impossible for interpretation to write a
      MerchantRule (src/modules/ledger/application/ports.ts:31 through :39,
      pulse-domain section 2 rule 3), and it is worth more than the
      convenience of passing rows. The member is RENAMED in the same change so
      that a caller still passing a raw description fails to compile instead
      of silently resolving nothing.
  - id: D-43
    statement: >-
      THE ACCOUNT BASIS IS TAKEN ONLY WHEN THE ACCOUNT IS TRUSTWORTHY, AND THE
      ASYMMETRY IS THE WHOLE ARGUMENT. The counterparty account is not a
      structured field on the path the owner uses: it is a regex scrape out of
      the free-text description
      (src/modules/import/domain/belfius-current-account-template.ts:88, which
      takes two letters, two digits and exactly three groups of four, and :266
      through :272, which take the first non-own match and stop), and nothing
      in the tree validates it: a grep over src for a mod-97 or check-digit or
      length rule returns nothing at the baseline. Today that costs nothing,
      because every consumer tests the value for SET MEMBERSHIP against
      declared accounts (src/modules/ledger/domain/classify-flow.ts:63 and
      :74) or for EQUALITY against the other leg
      (src/modules/ledger/domain/pair-transfers.ts:76), and a wrong value
      simply misses. This phase promotes the same value to the thing that
      decides which transactions are one merchant, where a wrong value MERGES
      instead of missing. So the account basis is taken only when the value is
      non-empty after uppercasing and whitespace removal, its length is
      exactly what the pinned country-length table assigns its country code
      with an unknown country code REFUSED rather than admitted, and it passes
      the ISO 7064 mod-97 check. Otherwise the row takes the descriptor basis.
      THE ASYMMETRY THAT MAKES THAT SAFE, stated because it is the reason the
      fallback direction is not arbitrary: the descriptor basis is today's
      behaviour, and today's failure is VISIBLE non-convergence, a row the
      owner must name again; the account basis' failure is a SILENT MERGE, two
      counterparties' money in one group with nothing on screen to say so. A
      visible failure is recoverable by the owner and a silent one is not, so
      every uncertain case falls to the visible side. MEASURED BEFORE
      DECIDING, so the gate is known to cost nothing: all 11 stored accounts
      on the owner's real month pass all three tests and the trusted distinct
      count is still 6, so the convergence figures in criterion 12.2 are
      unchanged by the gate. THAT MEASUREMENT COVERS THE PDF PATH ONLY, and
      the difference matters. The scrape at
      src/modules/import/domain/belfius-current-account-template.ts:88 can
      emit only sixteen characters, so on that path the table's only reachable
      entries are countries of that length and refusing an unknown code is
      nearly free. The DELIMITED path stores accounts of any length
      (src/modules/import/domain/detect-profile.ts:45 admits a two-letter
      code, two digits and eight to thirty more characters), so on that path a
      country the table omits sends every row of that counterparty to the
      descriptor basis, where it never converges: this phase's own defect,
      reintroduced for that counterparty. The table is therefore populated
      from the ISO 13616 registry rather than from the countries seen so far,
      criterion 12.22 pins it, and criterion 12.15's whole-corpus record is
      where such a loss would surface, as a fixture whose new group count is
      HIGHER than its baseline count. Refusing an unknown code remains the
      right default even so, because the asymmetry above does not depend on
      which path the value arrived by: the refusal produces visible
      non-convergence and admitting it risks a silent merge. Two invented
      longer-form values sharing their
      first sixteen characters both scrape to one identical sixteen-character
      value, and that value fails both the length test and the mod-97 test, so
      the gate closes the truncation case rather than merely narrowing it.
  - id: D-44
    statement: >-
      ORDERING OF THE IDENTITY WORK, which the amendment left unstated. M3-P12
      runs FIRST, before M3-P8 through M3-P11. It is the only phase in the M3
      tail at severity critical, D-19's stated tie-break is severity where the
      ordering is otherwise free, and its work is confined to domain,
      application, adapters and test except for the one component it shares
      with M3-P8, M3-P10 and M3-P11, which its conflicts-with entry sequences.
      It shares NO file with M3-P9, checked rather than assumed. M3-P13 runs
      LAST, after M3-P8 through M3-P11, because it consumes M3-P9's tokens,
      M3-P10's submit leaf and M3-P11's predicted row, and because it edits
      the same component and the same two stylesheets all of them edit.
  - id: D-45
    statement: >-
      THE DECLARATION MIGRATION IS TWO PASSES, AND THE SPLIT IS WHAT MAKES
      LOSS IMPOSSIBLE IN ONE AND VISIBLE IN THE OTHER. Pass one rewrites, to
      the descriptor namespace followed by its old pattern, every rule whose
      pattern does not ALREADY begin with a known namespace; one that does is
      left alone and counted as already-migrated, and one whose pattern is the
      empty string is left alone and reported. Both guards are load-bearing on
      the FIRST run rather than only a second: D-46's window means a naming
      made between the deploy and the migration is written already namespaced
      by criterion 12.18, and a second namespacing would kill a correct rule;
      and an empty pattern, inert today under
      src/modules/merchants/domain/merchant-rule.ts:65 and unguarded by
      upsertRule, would become a bare namespace that a PREFIX rule matches
      every descriptor key with. Pass one reads no transaction, has no failure
      branch, and preserves meaning for
      EXACT, PREFIX and PATTERN alike because a constant prefix on both sides
      of an equality or a startsWith changes neither. PASS TWO IS PURELY
      ADDITIVE, which is the delta review's correction and a better design
      than the rewrite this decision first carried: where every transaction
      the OLD pattern matched carries a TRUSTED account and they all carry the
      same one, the routine ADDS an account-basis rule pointing at the SAME
      merchant and leaves the descriptor rule pass one produced exactly where
      it is. It needs no schema change, because MerchantRule's unique key is
      (householdId, kind, pattern) at prisma/schema/merchants.prisma:70 and
      assignMerchant already attaches several rules to one merchant
      (src/modules/merchants/application/assign-merchant.ts:58 through :65).
      NOTHING IS DESTROYED AT ANY POINT: pass one's rewrite is invertible by
      stripping a constant prefix and pass two only adds, so a run is undone
      by deleting the rules it added and stripping the namespace from the
      rest, with no external file involved. That also answers rather than
      manages the objection that made this a finding, which the plan had
      accepted: pulse-domain section 2 classifies MerchantRule as a
      declaration the user writes and the engine does not rebuild, and an
      engine ADDING a rule beside one, on the owner's own decision in DR-0027,
      leaves what the owner declared exactly where they left it. THE
      DESCRIPTOR RULE THAT REMAINS IS A LIVE FALLBACK: it is what keeps a row
      of the same counterparty whose account failed the trust gate, or which
      carries no account, attached to the merchant the owner named, and the
      two rules can never both fire on one key because their namespaces
      differ, so the tie-break at
      src/modules/merchants/domain/merchant-rule.ts:34 through :42 is never
      reached between them. The added rule still BROADENS, meaning everything
      ever seen from that account, which is DR-0027's decision applied to a
      declaration the owner already made and is the point rather than an
      overreach; two things keep it honest. The routine prints per rule the
      old and new matched counts, so a broadening is a number the owner can
      read. And criterion 12.7 measures EFFECT rather than rows, because a
      rule left byte-identical survives as a row and matches nothing once the
      key has changed under it: the count is preserved and the naming is
      dead. Rejected: a single equality-driven pass, which was
      the amendment's design and which reports no-matching-transaction forever
      for every PREFIX rule, since a prefix pattern is by definition equal to
      no row's key; and a permanently non-zero exit on any unmigratable rule,
      which converts a recoverable declaration condition into a deploy that
      can never go green. The routine exits non-zero on exactly two
      conditions, a merchant conflict and a lost assignment, and both have a
      named acknowledge path.
  - id: D-46
    statement: >-
      THE RE-DERIVATION RUNS AFTER THE CODE DEPLOY, AND THAT IS FORCED RATHER
      THAN PREFERRED. The routine imports the new derivation to compute the
      new patterns, so it cannot run against a build that does not carry it;
      there is no ordering in which it runs first. The window between the two
      is stated rather than hidden: for its duration the stored patterns are
      pre-migration while the matcher computes namespaced keys, so rules match
      nothing and the affected rows show as unresolved. No total moves, which
      is hazard H3.2's standing guarantee, nothing is lost, and the recompute
      the routine runs at its end closes the window. Spelled out because it
      was checked rather than assumed: a recompute happening INSIDE that
      window clears the affected merchantId values, since interpretation
      output is rebuilt wholesale and a null write is how an assignment no
      rule supports stops applying
      (src/modules/ledger/application/ports.ts:53 through :56), and the
      routine's own recompute restores them. Facts untouched, declarations
      untouched, no total moved. package.json gains the
      script that invokes it, because at the baseline the repository has build,
      start, typecheck, lint, two gates, test, test:e2e, db:reset and
      db:migrate and no deploy or release hook of any kind, so without it the
      routine would have nowhere to run from and D-39's "stops the deploy"
      would be unfounded.
  - id: D-47
    statement: >-
      THE CANONICAL FORM OF AN ACCOUNT NUMBER LIVES IN src/platform, NOT IN A
      MODULE. Four consumers need it and they sit in four modules: the
      accounts registration form, the import path's account lookup
      (src/modules/import/application/confirm-import.ts:86 through :91), the
      declared-set derivation in the ledger domain
      (src/modules/ledger/domain/ledger-transaction.ts:48 through :72) and the
      reserves join in the overview repository
      (src/modules/overview/adapters/overview-repository.ts:175 through :176).
      The ledger domain imports nothing from another module by rule
      (.claude/skills/pulse-domain/SKILL.md:168, and the note recording that
      exact choice for the role union at
      src/modules/ledger/domain/ledger-transaction.ts:25 through :27), so
      putting it in the accounts module would force either a copy or a rule
      break. src/platform is where this codebase already keeps shared value
      types that every domain may import, which the ledger domain itself
      demonstrates by importing money and plain-date
      (src/modules/ledger/domain/ledger-transaction.ts:7 through :8). Rejected:
      a second copy, because the merchants module has already paid for that
      once, with the ledger and the review silently disagreeing about which
      text a transaction resolves under while both looked right in isolation
      (the note recording it at
      src/modules/ledger/application/interpret-window.ts:104 through :109).
  - id: D-48
    statement: >-
      THE REGISTRATION SURFACE REGISTERS ONLY ACCOUNTS THAT HAVE AN ACCOUNT
      NUMBER; A CARD IS REGISTERED BY IMPORTING ITS STATEMENT. A card account
      carries no account number by design and is recognised through its bound
      SourceProfile (prisma/schema/accounts.prisma:16 through :20, bound at
      src/modules/import/application/confirm-import.ts:112). The reason this
      is a decision rather than a limitation accepted for convenience: a
      pre-registered card would have NO identifier for the import path to
      adopt it by, because the branch that resolves a file with no account
      number reads the account off a spec-identical stored profile
      (confirm-import.ts:89 through :91) and a card being imported for the
      first time has no such profile, so the confirm would declare a SECOND
      account and split the card's history in two. Refusing to create an
      account without an account number closes that by construction rather
      than by a mechanism that could be got wrong. THE COST, stated so the
      owner does not discover it: the household's two cards cannot be taken
      off the naming screen by registering them. Until each card's statement
      is imported once, the direct debit that pays it is honest unitemised
      spend against the issuer
      (src/modules/ledger/domain/classify-flow.ts:98) and its descriptor is
      still offered for naming. Criterion 14.6 measures both states. Rejected:
      letting the import confirmation offer a list of existing accounts to
      bind a card file to, which would work and is a bigger change to the
      import screen than this round is willing to make; it is recorded in
      parked rather than dropped.
  - id: D-49
    statement: >-
      A MERCHANT RULE THAT STOPS MATCHING IS KEPT, COUNTED AND NAMED, AND NO
      ENGINE PATH DELETES IT. When an account is registered or its ring is
      corrected, a row that becomes INTERNAL or RESERVE stops being a counted
      row, so interpretation writes a null merchant for it and the assignment
      stops applying by itself
      (src/modules/ledger/application/interpret-window.ts:123 through :128,
      contract at src/modules/ledger/application/ports.ts:51 through :57); the
      MerchantRule the owner wrote then matches nothing. It is KEPT for two
      reasons. Recompute may never write to the declarations layer
      (.claude/skills/pulse-domain/SKILL.md:41), so an automatic deletion
      would break an absolute rule of the domain, and a deletion made by a use
      case rather than by recompute is still an irreversible act taken on the
      owner's behalf. And a kept rule HEALS: correct the ring back and the
      naming starts applying again with no user action, which criterion 15.6
      measures, while a deleted one is gone. It is COUNTED AND NAMED because
      the failure this decision guards against is not a wasted row, it is a
      naming that silently vanished, so the registration and the correction
      each report how many rules stopped matching and which account absorbed
      them. No delete control is added in this round: a rule that matches
      nothing is inert, it is invisible on every screen because every screen
      groups over transactions, and removing it is the one move that cannot be
      undone.
  - id: D-50
    statement: >-
      SCOPING THE MONTH READS TO POT ACCOUNTS IS A DEFECT FIX, NOT A CHANGE TO
      THE RECONCILIATION IDENTITY, SO IT IS NOT THE CHARTER STOP-FOR AT
      charter.yaml:86 THROUGH :88. The identity's own definition already says
      changeInPot is the sum of raw amounts over POT accounts
      (src/modules/ledger/domain/reconciliation.ts:7 through :8) and the
      domain function already implements it that way by skipping any row
      outside the interpreted set (reconciliation.ts:62 through :66). The SQL
      projection is the copy that drifted: it filters on the flow column alone
      (src/modules/overview/adapters/overview-repository.ts:128 through :131
      and :233 through :235). This phase brings the projection back to the
      definition and changes no definition. ONE HALF OF THE WORK MOVED
      FORWARD: the two reads that can see a row the engine never interprets,
      the uninterpreted count at overview-repository.ts:230 and the gap listing
      at overview-repository.ts:263 through :310, are both scoped in M3-P14
      under decision D-56, because scoping them earlier heals a household
      already in that state and scoping only one of them would make the
      reconciliation panel disagree with its own rows; what M3-P15 scopes is
      the rest. The claim is not left as
      an argument: criterion 15.4 requires the committed golden journey to pass
      with every asserted string untouched, and requires a second test
      asserting that the scoped projection over a committed fixture returns,
      field for field, the MonthFigures this phase's own verification-first
      step captured from its own base for a household whose accounts are all
      pot accounts, which is every household in existence today, plus a third
      case over a household that also holds a non-pot account carrying rows
      showing the figures differ only where the scoping is meant to change
      them, so a scoping that does nothing cannot pass as one that works. If
      either witness moves a figure, the premise of this decision is false and
      the phase escalates instead of proceeding.
  - id: D-51
    statement: >-
      A RING CHANGE IS A DECLARATION EDIT PLUS A RECOMPUTE, AND THE ROWS THAT
      LEAVE THE POT ARE CLEARED RATHER THAN LEFT OR REWRITTEN. Three options
      were available and two are wrong. Leaving them is wrong because nothing
      downstream filters on the account, so a stale SPEND goes on counting
      (the three reads at
      src/modules/overview/adapters/overview-repository.ts:128 through :131,
      :233 through :235 and
      src/modules/merchants/adapters/merchant-repository.ts:231 through
      :234). Rewriting the fact rows is forbidden outright
      (.claude/skills/pulse-domain/SKILL.md:39). So interpretation clears the
      interpretation columns of rows on accounts that are not pot accounts,
      using the null write the port already defines as how an assignment no
      rule supports stops applying
      (src/modules/ledger/application/ports.ts:51 through :57). That is an
      interpretation write, it touches no fact, and it needs no migration
      because Transaction.flow is already nullable
      (prisma/schema/import.prisma:135). It is only safe once the GAP READ is
      scoped, which M3-P14 does under decision D-56, and criterion 15.3 is the
      one that fails if the two halves are separated or if the scoping is
      bought by removing the null-flow count altogether, which would undo
      finding CR-502 and let a pot row that ingest committed and interpretation
      never reached vanish behind a green panel.
  - id: D-52
    statement: >-
      M3-P14 AND M3-P15 ARE DISPATCHED BEFORE M3-P12 AND M3-P13, AND THE
      REASON IS NOT FILE OVERLAP. M3-P12 makes what a merchant naming matches
      the counterparty's IDENTITY, the counterparty account where the row
      carries one. Every one of the owner's own-account transfers carries one,
      so under M3-P12 nine scattered per-transaction groups collapse into nine
      tidy per-account groups, each with a plausible count and total: exactly
      the shape that invites a naming. Every naming made in that window writes
      a MerchantRule against the household's own account, and D-49 then keeps
      each of those rules for a counterparty that no longer resolves to
      anything. Registering the accounts first removes those groups from the
      screen before they can be named at all, which is cheaper than any
      migration of the rules afterwards. There is no ordering requirement
      against M3-P9, M3-P10 or M3-P11, which touch the stylesheets and the
      client leaves; the only interaction is the fourth navigation link and
      criterion 14.7 measures it. These two phases carry the new ids M3-P14
      and M3-P15 rather than being inserted at the position they are
      dispatched from, because no existing phase id in this document may be
      renumbered.
  - id: D-53
    statement: >-
      TWO PHASES RATHER THAN ONE. The registry and the ring correction are
      separated because the correction has a second half that the registry
      does not need and cannot be reviewed inside it: making interpretation
      own the rows of accounts that are not pot accounts, and scoping four
      month reads to pot accounts. That half touches the ledger, the overview
      and the merchants repositories and sits one step from the reconciliation
      identity, so it deserves its own review lane, its own verification-first
      observation against a real database and its own hazard set. The registry
      answers the owner's question on its own and is dispatchable without the
      correction; the correction is not dispatchable without the registry,
      which is why conflicts-with orders them strictly. ONE CORRECTION,
      RECORDED IN THE SECOND FIX ROUND: the registry is BUILDABLE without the
      correction and it is not SHIPPABLE without it, and DR-0030 sharpens
      rather than softens that. Under the accept position the ring a household
      answers on its FIRST upload decides whether a statement's rows are
      counted or held, no refusal stands behind that answer, and the accounts
      module publishes no update and no delete until M3-P15 adds one
      (src/modules/accounts/application/ports.ts:23 through :38). A release
      carrying M3-P14 alone would therefore let a household mis-ring an
      account on the only order the product offers and give it no way back.
      The phases are separate for review and joined for release.
  - id: D-54
    statement: >-
      THIS ROUND RAISES NO DECISION RECORD, AND THAT IS A FINDING RATHER THAN
      AN OMISSION. Three questions looked like candidates and none survives
      the test that two options be genuinely comparable. What registering a
      card means: decided in D-48, because pre-registering one produces a
      duplicate under a code path that already exists, so the options are not
      comparable. What happens to a dead MerchantRule: decided in D-49,
      because the domain forbids the engine deleting a declaration outright
      and a kept rule heals on a ring correction while a deleted one cannot.
      Whether scoping the month reads is a charter stop-for: decided in D-50,
      because the identity's own definition already reads the way the change
      makes the SQL read, and the decision is made falsifiable by criterion
      15.4 rather than argued. Raising any of the three would have spent the
      owner's attention on a question whose answer was already available in
      the code. THE FIX ROUND ADDS FOUR DECISIONS AND STILL NO DECISION
      RECORD. D-55, whether a reserve account's statement may be imported: the
      domain already says it may not and the engine already cannot interpret
      it, so the options are not comparable. D-56, which phase scopes the gap
      read and in what shape: settled by which read can see the row, and by
      which phase's landing heals a household already in the state. D-57, which
      phase owns the account-number validity test: DR-0028 already decided the
      predicate and M3-P14 runs first, so reaching for a settled decision one
      phase early is not a new one. D-58, how the correction preview is
      computed: a second query diverges from the engine wherever the engine
      applies a correction, so there is one answer and not two. THE SECOND FIX
      ROUND ADDS NO DECISION AND RAISES ONE QUESTION. It corrects D-53, D-55,
      D-56 and D-58 in place rather than adding to them, and it sends exactly
      one question to the owner: whether v1 should decline a savings account's
      statement at all, which is the part of D-55 headed THE STATUS OF THE
      RULE. That question qualifies where the other three did not, because the
      two answers produce different software and a different set of facts the
      household can see, and because the alternative is cheap in a way the
      first draft of D-55 did not admit. THE OWNER ANSWERED IT ON 2026-08-24
      AS DR-0030 AND THE ANSWER REVERSED THE DECISION: Pulse accepts a reserve
      account's statement in v1 and holds its rows without counting them. D-55
      is rewritten to that position and records it as chosen with the price of
      both rejected options stated; no sentence anywhere in this plan calls the
      refusal forced, because there is no refusal. Two decisions follow from
      the answer rather than from a question: D-59, that held is derived from
      the account's ring and needs no migration, and D-60, that v1 shows no
      savings balance and the reserves heading may not read as one. Neither is
      a fork with two comparable answers, so neither goes to the owner.
  - id: D-55
    statement: >-
      PULSE ACCEPTS A RESERVE ACCOUNT'S OWN STATEMENT IN v1, AND HOLDS ITS
      ROWS WITHOUT COUNTING THEM. This decision record supersedes the earlier
      form of D-55, which refused the statement; the owner decided the
      question as DR-0030 on 2026-08-24 and the refusal is gone from this
      plan. Read it in four parts: THE RULE, THE STATUS OF THE RULE, WHAT THE
      HOUSEHOLD GETS AND WHAT IT DOES NOT, and HOW IT LANDS.
      THE RULE. A statement for an account in the reserve ring is imported
      like any other statement. Its rows are INGESTED as facts and are HELD:
      they enter no month total, they are not offered for naming, and they are
      not an uninterpreted gap. The screen says they are held, per account, in
      all three catalogues, so a reader can tell held from missing and held
      from uninterpreted. The reconciliation invariant is untouched, because a
      held row carries no flow and every named sum, changeInPot and rowCount
      filter on the flow column
      (src/modules/overview/adapters/overview-repository.ts:217 through :235).
      Criterion 14.15 measures the screen state and criterion 14.16 measures
      the invariant.
      THE STATUS OF THE RULE. CHOSEN, and recorded as chosen. The owner's
      reasoning is the load-bearing part and it is about a FIGURE BEING WRONG
      rather than about rows being missing: a savings total derived only from
      transfers seen on pot accounts is a running sum from an assumed zero, so
      it is wrong by the household's entire existing savings unless every
      savings account started empty. The statement is the one document that
      fixes that, because the balance contract already makes opening plus rows
      equal closing a hard per-file gate (decision D-8, and the failure reason
      balance-mismatch at src/modules/import/application/ports.ts:76), so an
      opening balance arrives CHECKED rather than typed. The statement also
      carries the two things a transfer can never show: the interest a reserve
      account earns, which has no matching row on any pot account, and a
      movement between two reserve accounts, which touches no pot account at
      all. REJECTED, refuse the statement and show no total: it answers "how
      much have we set aside" with silence permanently, hides savings interest
      entirely, and cannot see a movement between two reserve accounts at all;
      it was also the cheapest repair for a defect rather than a product
      position, and this plan had recorded it as forced when the machinery to
      do better was already scheduled one phase away. REJECTED, refuse the
      statement and ask the household to type a starting balance: it produces
      the APPEARANCE of a correct total without the mechanism that keeps one
      correct, because a typed number is checked by nothing and drifts
      silently the moment interest lands or money moves between two reserve
      accounts, and a figure that is wrong and looks right is worse than one
      that is absent and says so.
      WHAT THE HOUSEHOLD GETS AND WHAT IT DOES NOT, stated so nobody discovers
      it. It gets: its savings statements accepted, their rows kept as facts,
      and a screen that says those rows are held and counted nowhere. It does
      NOT get a savings balance in v1. Decision D-60 records that separately
      and names the copy consequence: the reserves block is a MONTHLY
      MOVEMENT, so its heading may not read as a balance, and no figure
      anywhere in v1 is accumulated into one. That boundary is deliberate,
      because the argument above is precisely that an accumulated figure is
      the wrong figure; the closing balance a statement carries is the right
      source and v1 does not persist it (decision D-6), which is parked rather
      than smuggled in.
      HOW IT LANDS, and the order matters more than the state. Uploading is
      the only way into Pulse today, so the order every household is in is
      upload first and accounts screen later, and on that order
      src/modules/import/application/confirm-import.ts:95 through :99 declares
      the account from the owner's answer to the ring question. That answer
      now decides everything and no refusal stands behind it, so THE RING
      QUESTION STAYS ON THE IMPORT SCREEN OFFERING BOTH RINGS
      (src/modules/import/ui/profile-confirmation.tsx:181 through :184), the
      confirm path rejects a declaration carrying no ring rather than
      defaulting one, and the copy beside each answer states its CONSEQUENCE:
      a spending account's rows are counted in this month's income and spend,
      a savings account's rows are held and counted nowhere while transfers
      into it show as money set aside. A household that answers wrongly is not
      stuck: the ring correction M3-P15 builds is the remedy, which is why
      M3-P14's conflicts-with records M3-P15 as a shipping prerequisite.
      Criterion 14.11 measures the order.
  - id: D-56
    statement: >-
      THE GAP READ IS SCOPED TO POT ACCOUNTS IN M3-P14 RATHER THAN M3-P15, AND
      IT IS SCOPED BY THE ACCOUNT'S RING AND NEVER BY DROPPING THE NULL-FLOW
      COUNT. This decision is WANTED EITHER WAY and survives DR-0030
      unchanged: under the accept position it is what makes a held row a held
      row rather than a gap, and it is also what heals a household that
      imported a reserve statement before this round. Three questions, each
      settled by what the reads actually do. WHICH READS, and the answer is
      TWO reads carrying THREE null-flow conditions, corrected in the second
      fix round after one executed grep for a null-flow condition in src/
      returned three lines rather than one, at
      src/modules/overview/adapters/overview-repository.ts:230, :280 and
      :295. The named sums, changeInPot and rowCount each
      filter on the flow column
      (src/modules/overview/adapters/overview-repository.ts:217 through :235),
      the counted read filters on flow (overview-repository.ts:130), and the
      merchant review's read takes INCOME and SPEND only
      (src/modules/merchants/adapters/merchant-repository.ts:231 through :234),
      so a row with no flow is already invisible to every one of them. The two
      that DO see it are both in the overview repository: the uninterpreted
      COUNT at overview-repository.ts:230, and listGapRows at
      overview-repository.ts:263 through :310, whose WHERE at :295 admits a
      null flow and which joins accounts only for a label, with no ring filter.
      Both are scoped, by the same predicate, in this phase. Scoping one and
      not the other is not a smaller version of the fix, it is a different and
      worse defect: the cause block is gated on the count
      (src/modules/overview/ui/month-view.tsx:354) while the rows beneath it
      come from the listing
      (src/modules/overview/application/month-overview.ts:167), so a scoped
      count with an unscoped listing makes the block vanish with its rows while
      the repository goes on returning them, and the household is shown a green
      verdict over money the software has quietly decided not to look at. That
      is the state decision D-55 rejects in its own text, which is why the
      accounts screen names those rows and their count instead. WHICH PHASE: M3-P14, because that is where a household can first
      reach the state deliberately, and, decisively, because scoping it there
      heals a household that imported a reserve statement BEFORE this round
      instead of leaving its month open until the next phase lands. M3-P15 then
      scopes the remaining reads as defence in depth against a clearing that
      misses a row, which decision D-50 and criterion 15.4 cover, and says so
      rather than claiming the verdict depends on it. WHAT SHAPE: the count is
      narrowed by the account's ring and never by removing the null-flow
      filter, because a null flow on a POT account is a row that ingest
      committed and interpretation never reached, which must go on holding the
      verdict open and go on being listed. That is finding CR-502, recorded in
      the comment at overview-repository.ts:237 through :242, and criteria
      14.14 and 15.3 each carry a case that goes red if it is undone.
  - id: D-57
    statement: >-
      M3-P14 OWNS THE PLATFORM ACCOUNT-NUMBER MODULE INCLUDING DR-0028'S
      DETERMINISTIC VALIDITY TEST, AND M3-P12 IMPORTS IT. The canonical form
      lives in src/platform by decision D-47; the validity test belongs beside
      it rather than one phase later, for two reasons. A canonical form that
      cannot say whether a string is an account number can only be applied
      blindly, and blind application is the exact failure the module exists
      against: an account number mistyped by one character matches nothing at
      src/modules/ledger/domain/classify-flow.ts:62 through :77, the transfer
      falls through to the sign rule at classify-flow.ts:102, lands in the
      spend total and is offered on the naming screen, and the owner is left in
      a state indistinguishable from never having registered, with no message
      anywhere, while every fixture in the phase carries account numbers
      correct by construction and every other criterion stays green. And the
      predicate is already decided rather than open: DR-0028 makes identity
      deterministic, a pinned country-length table plus the ISO 7064 mod-97
      check, with a model naming and never deciding identity, and M3-P12
      already specifies those four refusals and tests them in criterion 12.16.
      Reaching for a settled decision one phase early is not a new decision.
      M3-P14 writes the module, criterion 14.12 tests the four refusals at the
      registration form, M3-P12's counterpartyIdentity imports it, and M3-P14
      criterion 14.4 reddens on any second inline copy of the same
      transformation wherever in src it is written, because two functions that
      agree on the day they are written and are edited by different phases are
      one function with a delay fuse.
  - id: D-58
    statement: >-
      THE RING CORRECTION'S PREVIEW IS A DRY RUN OF THE SAME INTERPRETATION,
      NEVER A SECOND QUERY, AND IT NAMES BOTH MOVEMENTS. M3-P15 promises the
      owner that neither the before figure nor the after figure is an estimate,
      and only one construction makes that sentence true. A query that sums the
      rows whose counterparty account equals the account being corrected
      satisfies a byte-identity assertion on a simple fixture and diverges
      wherever the engine applies a correction: the settlement match
      (src/modules/ledger/domain/classify-flow.ts:80 through :98), the reserve
      drawdown (classify-flow.ts:62 through :68), the refund arm
      (classify-flow.ts:110 through :118) and the unmatched or in-transit leg
      accounting
      (src/modules/overview/adapters/overview-repository.ts:222 through :229).
      So the two quantities that describe a RECLASSIFICATION, the movement
      between the spend total and the reserves block and the number of merchant
      rules that stop matching, are produced by a dry run of the same
      interpretation the recompute runs over the proposed declaration set,
      writing nothing, and never by a second rule; the merchant count falls out
      of the same run through the null-merchant write at
      src/modules/ledger/application/interpret-window.ts:123 through :128. THE
      THIRD QUANTITY IS DIFFERENT AND THE DECISION SAYS SO RATHER THAN
      SMUGGLING IT: the count of rows ON the account that stop being counted at
      all is a count of rows on that account carrying a non-null flow today,
      because clearing them is an APPLICATION act added by M3-P15 step 3 and no
      domain interpretation is asked about a row it never loads, the domain
      call at interpret-window.ts:85 through :90 receiving a transaction list
      built from pot accounts only. An absolute that cannot be met is a
      criterion an implementer negotiates with alone at the end of a phase, so
      the exception is named here. All THREE are reported, because a correction
      out of the pot makes two distinct movements and naming one of two is
      wrong in exactly the case criterion 15.2 is built on: the owner would be
      told an amount moved into reserves while a different amount silently left
      the books. Criterion 15.7 holds all three against the actual movement
      over a fixture on which a second rule diverges rather than agrees.
  - id: D-59
    statement: >-
      HELD IS DERIVED FROM THE ACCOUNT'S RING, NOT FROM A NEW Flow MEMBER, SO
      DR-0030 NEEDS NO MIGRATION. A row is HELD when it carries no flow and
      sits on an account that is not a pot account; it is UNINTERPRETED when
      it carries no flow and sits on a pot account. Both halves of that test
      are already in the database: the flow column is nullable
      (prisma/schema/import.prisma:135) and the ring is a declared column on
      the account (prisma/schema/accounts.prisma:15), and a row's account is a
      fact. So the distinction is exact and deterministic without a schema
      change, and every read that must tell the two apart joins the accounts
      table, which decision D-56 already requires of the only reads that can
      see either. REJECTED: adding a HELD member to the Flow enum. It would be
      a migration, it would need a backfill, and it would put a SECOND source
      of truth beside the ring for something the ring already decides, so a
      ring correction would have to rewrite it on every affected row and the
      two could disagree. The one thing the enum would buy, a read that can
      tell held from uninterpreted without joining accounts, is bought instead
      by the join D-56 already introduces. The migrations notes on both phases
      stay true as written.
  - id: D-60
    statement: >-
      v1 SHOWS NO SAVINGS BALANCE, AND THE RESERVES BLOCK SAYS WHAT IT IS. The
      reserves block is the movement TO reserve accounts in the month, derived
      from the pot-side rows, and DR-0030's whole argument is that a figure
      accumulated from an assumed zero is the wrong figure. So no heading, no
      eyebrow and no label in v1 may read as a balance or as a total held: the
      reserves card's own copy names a monthly movement in all three
      catalogues, which is a copy change this phase makes and criterion 14.15
      measures, and no figure anywhere is accumulated across months. IF a
      balance is ever shown it comes from a statement's CLOSING BALANCE and
      never from an accumulated sum; v1 does not persist balances (decision
      D-6 verifies them at parse time and stores nothing), so showing one is a
      schema change and is PARKED rather than smuggled in. This decision is
      the boundary that keeps DR-0030 from turning into a savings dashboard
      nobody asked for: the decision admits the statement, and admitting the
      statement is what makes a correct balance possible LATER without making
      an incorrect one now.
