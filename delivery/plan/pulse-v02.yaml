          greater than element.clientHeight plus 1 returns an empty offender
          list; the vertical half is scoped to those elements deliberately,
          because an element with visible overflow reports content height it
          is not clipping. (c) grep -nE "line-clamp|-webkit-box-orient|
          text-overflow" over every file matching *.css under src/ and
          styles/ returns exactly one line, the text-overflow inside
          .app-household that M3-P1 criterion 1.5 decided
          (src/app/globals.css:164 at b560e85). (d) ADDED in the second
          M0-P3 fix round (finding MPR-022), which found the one truncation
          route left after (a), (b) and (c): a label shortened in the
          COMPONENT, by a slice or an ellipsis helper, clips nothing and
