    extras: []
    acceptance:
      - id: "14.1"
        criterion: >-
          THE OWNER'S SCENARIO, END TO END, AND THE FIXTURE IS PROVED CAPABLE
          OF FAILING. One new Playwright spec, one new invented
          current-account fixture whose rows carry transfers to seven distinct
          other accounts of the same household (three in the pot ring, four in
          the reserve ring) plus at least three ordinary outside merchants,
          and two tests in that spec over fresh households that differ in
          exactly one thing. CONTROL ARM, no registration: sign up, import the
          fixture, open /merchants, and assert that the elements with
          data-testid unresolved-group number the outside merchants PLUS the
          seven own accounts, and that the set of rendered group-label values
          contains, for each of the seven own accounts, the counterparty text
          the fixture writes for it, recorded in the spec as a hand-written
          list, so the registered arm's assertion is a set DIFFERENCE of
          exactly those seven and not merely a smaller number. That clause is
          keyed on the counterparty text and not on an account number because a
          group label is normaliseCounterparty(counterpartyText(row))
          (src/modules/merchants/domain/merchant-review.ts:79 through :92) and
          the counterparty ACCOUNT column is never consulted there, so an
          account number could reach a group label only in a fixture shaped
          unlike any statement; the account-number-on-screen assertion lives in
          criterion 14.2, on the reserves block, which is where an account
          number really can surface. AND EVERY ACCOUNT NUMBER THIS FIXTURE
          INTRODUCES PASSES THE PLATFORM VALIDITY TEST OF CRITERION 14.12, with
          a unit test in the FAST gate asserting it for each of them, because
          criterion 14.12 makes that test a refusal at the registration form
          and criteria 14.1, 14.2, 14.5, 14.8 and 15.1 all require these
          accounts to be registered through it; a fixture invented the way
          every existing fixture in this repository was invented mostly does
          not pass, so this clause makes it redden at the fixture rather than
          in the middle of a Playwright run. The same predicate is M3-P12's
          trust gate under decision D-57, so an account number valid here is
          also TRUSTED there, which keeps the two phases' fixtures consistent
          rather than accidentally divergent.
          REGISTERED ARM: sign up, register the seven accounts through the
          accounts screen with NO file uploaded for any of them, then import
          the same fixture, open /merchants, and assert that the elements with
          data-testid unresolved-group number the outside merchants ONLY, that
          no group-label equals the canonical form of any registered account
          number or any registered account label, and that unresolved-count
          names that same number. Both arms are in the fast Playwright gate
          and both must pass; the control arm is what makes the registered
          arm's zero meaningful, and a fixture that produced no own-account
          groups at all would fail the control arm rather than pass the phase.
      - id: "14.2"
        criterion: >-
          THE SAVINGS CASE, WHICH NO EXISTING TEST CAN CATCH. In the
          registered arm of 14.1, with the four reserve-ring accounts
          registered and the fixture imported, the month view for the
          fixture's month asserts all six of: reserve-group elements number
          exactly the distinct reserve accounts the fixture references;
          no-reserves is absent; reserves-net renders the parked total as a
          positive magnitude in the parked direction, byte compared against a
          string written by hand in the spec from the fixture's own arithmetic
          and never read back from the implementation; spend-total is byte
          identical to a hand-written string that EXCLUDES every reserve
          movement; spend-total in the CONTROL arm is byte identical to a
          hand-written string that INCLUDES them, so the two arms differ by
          exactly the household's savings PLUS its pot-to-pot transfers, which
          together are every movement between accounts the household owns,
          because the three pot siblings are SPEND in the control arm
          (src/modules/ledger/domain/classify-flow.ts:102 through :107) and
          INTERNAL in the registered arm (classify-flow.ts:73 through :77) and
          therefore leave the spend total alongside the four reserve transfers,
          and the spec states that decomposition in a comment and computes each
          of the three hand-written strings, control spend-total, registered
          spend-total and their difference, from the fixture's own arithmetic
          and never reads one back from the implementation; and each
          reserve-group's rendered label is byte identical to the LABEL the
          household typed when it registered that account, with no
          reserve-group label containing any account-shaped token, which fails
          if the reserves join at
          src/modules/overview/adapters/overview-repository.ts:175 through :176
          compares raw stored strings, and the fixture writes its counterparty
          accounts in the spaced surface form precisely so that a join over raw
          values cannot pass. A SEVENTH assertion separates a normalised join
          from a normalised GROUPING, which is the other half of the same SQL
          statement: the reserves query groups by the raw stored column
          (src/modules/overview/adapters/overview-repository.ts:182 groups on
          the counterparty account and the joined label), and the stored column
          really does hold two surface forms for one account, because the
          delimited parse stores the cell verbatim
          (src/modules/import/domain/parse-statement.ts:114 through :123) while
          the PDF path compacts it
          (src/modules/import/domain/belfius-current-account-template.ts:90).
          So an application test over a household whose stored counterparty
          account column carries the SAME reserve account in two surface forms,
          one spaced and one compact, asserts exactly ONE reserve-group is
          returned, carrying the household's typed label and the sum of both
          rows. That fixture is deliberately mixed, because a fixture uniform
          in one surface form passes a normalised join with a raw grouping and
          the owner then sees one savings account twice, under the right name
          both times, with the money split. The spec carries in its own header
          comment, and this criterion carries in its text, the reason no
          existing test catches this: the reconciliation identity is invariant
          under the error, because
          src/modules/ledger/domain/reconciliation.ts:70 through :74 add a row
          to spendSigned or to reserveSigned and reconciliation.ts:79 through
          :81 subtract both from income with the same sign, so differenceCents
          is bit for bit identical whether a savings transfer is called SPEND
          or RESERVE; test/property/reconciliation.test.ts goes on passing and
          the month view goes on saying the books close.
      - id: "14.3"
        criterion: >-
          ADOPTION, NOT DUPLICATION. A test at the application level over the
          in-memory fakes registers an account by account number with no
          import, then runs the upload and confirm path for a file whose own
          account number is that account written in a DIFFERENT surface form
          (spaced against compact, and a lower-case country code), and asserts
          that the household holds exactly one account afterwards, that the
          ingested rows carry that account's id, and that declareAccount was
          not called. A second case asserts the reverse order, import first
          then a registration attempt for the same account number, is refused
          with a named error rather than creating a second account, and that
          the screen tells the owner the account is already registered. A
          third case asserts that an account declared through the IMPORT path
          stores its account number in the canonical form, so that a subsequent
          registration of the same account in any surface form is refused by
          the application check AND would collide on the per-household
          uniqueness constraint at prisma/schema/accounts.prisma:28, which is
          what makes that constraint a real backstop rather than a nominal one.
          Any criterion or code path that creates a second account for an
          account number already registered fails this phase.
      - id: "14.4"
        criterion: >-
          ONE CANONICAL FORM, WITNESSED WHERE IT MATTERS. A grep over src
          shows exactly one definition of the canonical account-number
          function and every consumer imports it: a unit test enumerates the
          call sites and fails on a second definition, in the manner the
          merchants module already pins its normaliser. A domain test asserts
          the function is idempotent, that the spaced, compact and mixed-case
          renderings of one account number produce one identical result, and
          that a string that is not an account number is returned unchanged
          rather than mangled. A ledger domain test asserts that a transaction
          whose stored counterparty account is written spaced classifies as
          RESERVE against a reserve account registered in compact form, and as
          INTERNAL against a pot account registered in compact form. This
          criterion exists because it was measured rather than supposed: every
          one of the 26 account-shaped tokens in the owner's own
          current-account document is written spaced, and the delimited parse
          stores such a cell verbatim
          (src/modules/import/domain/parse-statement.ts:114 through :123)
          while the PDF path compacts it
          (src/modules/import/domain/belfius-current-account-template.ts:90).
          The unit test that enumerates the call sites is written so that a
          SECOND implementation of the same transformation reddens it wherever
          it lives, including one written inline inside another module's
          identity derivation: it asserts that no file under src/ other than
          the platform module contains an uppercase plus whitespace-removal
          expression applied to an account-bearing field. That is what stops
          M3-P12's counterpartyIdentity, which lands after this pin has already
          gone green, from growing a private copy that agrees on the day it is
          written and is edited by a different phase afterwards. The same
          enumeration test pins the VALIDITY PREDICATE and not only the
          canonical form, because a second copy of the country-length table or
          of the ISO 7064 loop matches no whitespace-and-uppercase grep: it
          asserts that the pinned country-length table and the mod-97
          implementation each have exactly one definition under src/, in the
          platform module, and that every consumer imports it. And the
          whitespace-removal helper that ALREADY exists outside the platform
          module, compactIban at
          src/modules/import/domain/belfius-current-account-template.ts:90,
          used at :169 and :267, is NAMED by this phase and is either replaced
          by the platform form or recorded in the test as the one permitted
          exception with its reason, so the enumeration is a list a reader can
          check rather than a grep that passes by accident.
      - id: "14.5"
        criterion: >-
          REGISTRATION HEALS ROWS THAT ARE ALREADY THERE. A third test in the
          spec of 14.1 imports the fixture FIRST, confirms on /merchants that
          the own-account groups are present, then registers the seven
          accounts, and asserts with no further upload that the same page now
          shows the outside merchants only, that the month view's reserves
          block has gained its rows, that spend-total has fallen to the
          registered arm's hand-written string, and that each reserve-group's
          rendered label is byte identical to the label the household typed at
          registration with no reserve-group label carrying an account-shaped
          token, which is the reserves-join witness of criterion 14.2 made in
          the order where the rows existed first. A unit or application test
          asserts the registration use case calls the ledger's published
          recompute exactly once per registration and writes nothing to any
          transaction row itself.
      - id: "14.6"
        criterion: >-
          THE CARD CASE IS STATED AND ITS CONSEQUENCE IS MEASURED. The
          registration form has no control that submits an account without an
          account number and the server action refuses such a submission with
          a named error: an application test asserts both, and a grep asserts
          no code path in the accounts UI calls the registration use case
          without one. The accounts screen renders a line of catalogue copy,
          present in all three catalogues, saying that a card is registered by
          importing its statement, and renders any card account the household
          already has in the same list with its ring. And the consequence is
          witnessed rather than asserted: a Playwright test imports a card
          fixture and its paying current-account fixture, and asserts that
          before the card statement is imported the settlement debit appears
          in the spend total as one aggregate row against the issuer, and that
          after it is imported the debit is INTERNAL and the card's own line
          items are the counted spend. Registration is not involved in either
          state and the spec says so.
      - id: "14.7"
        criterion: >-
          THE SCREEN IS REACHABLE AND SURVIVES THE PHONE. At 390 and at 360
          the accounts route is reachable from the shell's navigation row and
          from the month view's empty state; every nav target and every
          control on the accounts screen meets the tap-target floor the
          existing helpers measure; no element in main is clipped on either
          axis; and document.documentElement.scrollWidth does not exceed the
          viewport width. The measurement reuses the helper functions already
          in test/e2e/month-view.spec.ts rather than defining a second bar.
          AND A WIDTH WITNESS, because the fourth link changes width and not
          height and every instrument named so far is blind to that:
          tapTargetOffenders compares a rect's height against the minimum only
          (test/e2e/month-view.spec.ts:635), clippingOffenders scans the main
          element only (test/e2e/month-view.spec.ts:676 through :706) while the
          navigation row lives in the header
          (src/app/(app)/layout.tsx:48), and src/app/globals.css:180 sets
          overflow-wrap so a label too wide for a quarter row wraps inside its
          own quarter rather than widening the document. So, at 390 and at 360,
          and at the 150 and 200 percent text scales the existing spec already
          applies to the shell: every element with data-testid nav-overview,
          nav-import, nav-merchants and nav-accounts renders its label on at
          most the number of lines the verification-first step recorded for it
          at the phase base, those numbers written into the spec by hand from
          that captured output and never read back from the running page. And
          because nav-accounts is the link this phase ADDS and therefore has no
          recorded baseline, its bound is stated as an absolute: at both widths
          and at both text scales it renders its label on at most the largest
          line count the verification-first step recorded for any existing
          link, that number carried into the spec by hand from the same
          captured output, so the added link is not the one element the guard
          leaves free to be the offender. And
          each link's border box measures at least the tap-target minimum in
          BOTH dimensions. The criterion fails if any existing nav target
          renders on more lines with the fourth link than the captured baseline
          records without it, or falls below the floor it meets today.
      - id: "14.8"
        criterion: >-
          THE NEW GAP IS NAMED WITH ITS REMEDY, NOT LEFT AS AN ALARM. In the
          registered arm, where three pot siblings are registered and their
          statements are NOT imported, the month view's reconciliation panel
          renders recon-cause-unmatched with a count equal to the fixture's
          pot-to-pot transfers and a total equal to their sum, the verdict
          does not read as books closing, and the copy naming that cause,
          present in all three catalogues, names importing the other account's
          statement as what closes it. A fourth test imports a companion
          fixture carrying the partner legs AND NOTHING ELSE, no outside spend
          and no income, and asserts that recon-cause-unmatched is absent, that
          the unmatched count reaches zero, that income-total, spend-total and
          reserves-net are byte identical to the strings recorded before that
          import, that pot-change moves by exactly the sum of the partner legs
          against a string written by hand in the spec, and that
          recon-difference is absent where it previously rendered the unmatched
          total. The three counted totals are the figures that must NOT move;
          pot-change and the difference MUST move, because the household gained
          the other side of its own transfers and
          src/modules/overview/domain/month-projection.ts:201 computes the
          difference as changeInPot minus the counted identity, so a criterion
          asserting that no money figure moves would be asserting the identity
          is broken and would invite an implementer to make changeInPot ignore
          a paired leg.
      - id: "14.9"
        criterion: >-
          NO FACT IS REWRITTEN AND NO DECLARATION IS WRITTEN BY AN ENGINE. A
          grep over this phase's diff shows no write to any raw transaction
          column outside the import module, and the accounts module's
          repository exports no function that updates a transaction. The
          registration path writes exactly one declaration row and then calls
          recompute; a test asserts that running recompute twice after a
          registration leaves every interpretation column identical, which is
          the rebuildability test the domain sets
          (.claude/skills/pulse-domain/SKILL.md:35).
      - id: "14.10"
        criterion: >-
          npm run typecheck, npm run lint, npm test, npm run gate:tokens and
          npm run gate:privacy all exit 0, and npm run test:e2e exits 0 with
          the new spec reporting its tests as passed. Because gate:tokens greps
          src/modules/*/ui only, and matches neither a spacing literal nor a
          colour written as rgb(), hsl() or a named colour, while this phase
          adds a route under src/app/ and edits the shell layout and the global
          stylesheet, the phase additionally asserts by its own grep, recorded
          in the work history, that no LINE IT ADDS OR CHANGES, measured over
          the phase's own diff rather than over whole files, under src/app/ or
          under src/modules/*/ui carries a colour literal in any notation or a
          px, rem or em length, with two exceptions named in the work history:
          a token DEFINITION in styles/tokens.css, and a value written inside a
          CSS comment. The clause is scoped to the diff because
          src/app/globals.css is in this phase's files-to-touch and already
          carries such lengths in rules and in comments the phase does not
          write, so a whole-file form of this clause would be red before the
          phase starts and would be disabled rather than met. Any value the new
          screen needs is added to styles/tokens.css first and the work history
          names each token added.
          The phase work history also carries the captured output of the
          verification-first step, one block per claim and per baseline that
          step enumerates, each block showing the command and its output rather
          than a restatement of the conclusion, and a claim or a baseline
          listed in step 1 with no captured output under it fails this
          criterion. Every account-shaped
          identifier the phase adds anywhere in the tree is present in
          test/fixtures/allowed-identifiers.txt with a note saying how it was
          invented, and the phase work history records that every new fixture
          and every new line of copy was read back line by line against the
          real documents before commit, because the privacy gate cannot see a
          merchant name, a place name, a date or an amount inside a file. And
          .claude/skills/pulse-domain/SKILL.md:22, which says a reserve
          account's statements are not imported in v1, is corrected in this
          phase's commit to record DR-0030 and the held state, because that
          file is always in context and a skill contradicting the shipped
          behaviour is a trap for whoever reads it next; a grep asserts the
          superseded sentence is gone.
      - id: "14.11"
        criterion: >-
          THE SAVINGS STATEMENT IS ACCEPTED, IN THE ORDER A HOUSEHOLD IS
          ACTUALLY IN, AND NOTHING IS DECLARED SILENTLY. Four witnesses, and
          the phase fails if any one is missing. ONE, THE ORDER EVERY HOUSEHOLD
          IS IN. A Playwright test signs up, registers NOTHING, and uploads a
          statement whose own account is a savings account, which is the first
          thing a household does because uploading is the only way into Pulse
          today. It asserts that the import confirmation screen asks the ring
          question with BOTH answers available, that the copy beside each
          answer states its consequence in copy present in all three
          catalogues, a spending account's rows being counted in this month's
          income and spend and a savings account's rows being held and counted
          nowhere while transfers into it show as money set aside; that
          answering with the savings ring ADMITS the import, creates the
          account in the reserve ring and ingests its rows, with the import
          result reporting the same row count it reports for any other file
          (src/modules/import/ui/import-result.tsx:54 through :56); and that
          the month view then names those rows as held per criterion 14.15
          rather than showing nothing. TWO, NO DEFAULTED RING. An application
          test asserts the confirm path rejects a declaration carrying no ring
          with a named error rather than choosing one, and a grep asserts no
          code path in the import module supplies a default ring, because the
          answer decides whether a statement's rows are counted or held and
          nothing stands behind it. THREE, THE WRONG ANSWER IS RECOVERABLE AND
          THE SCREEN SAYS WHERE. The same spec asserts the import screen names
          the accounts screen as where an account's ring is changed, with a
          link to it, and criterion 15.9 walks that path to the control in the
          tree where the control exists; M3-P14's conflicts-with records
          M3-P15 as a shipping prerequisite for exactly this reason. FOUR, THE
          COMMITTED FIXTURE THAT PREDATES THE VALIDITY CHECK. The existing
          reserve upload at test/e2e/month-view.spec.ts:1377 goes on uploading
          its statement, and its reserve-group count and its reserves-net and
          no-reserves assertions are unchanged and still passing; but the
          savings account criteria 14.1 and 14.5 require to be REGISTERED
          through the form criterion 14.12 guards must pass the platform
          validity test, and the verification-first step measures how many
          committed fixture numbers fail it. So the phase re-invents each
          fixture account number that a criterion requires to be registered to
          a value the validity test accepts, updates every reference to it in
          the sibling fixtures in the same commit, adds the new entries to
          test/fixtures/allowed-identifiers.txt with a written provenance note
          and removes the superseded ones. Only those numbers are re-invented;
          the rest of the tree's invented numbers are left alone, and the phase
          work history says which were changed and why. A criterion that
          required an invented account to be registered or to be TRUSTED while
          that account fails the check is unsatisfiable, and this witness is
          what stops the cheap way out, weakening criterion 14.12 to a warning.
      - id: "14.12"
        criterion: >-
          A REGISTRATION THE ENGINE CANNOT USE IS REFUSED AT THE FORM, NOT
          ACCEPTED SILENTLY. The server action refuses an account number that
          is empty after canonicalisation, whose country code the pinned
          country-length table does not carry, whose length differs from the
          length that table assigns its country code, or that fails the ISO
          7064 mod-97 check, with a named error rendered in all three
          catalogues. An application test asserts each of those four refusals
          over wholly invented inputs and asserts that no account row is
          created for any of them; a Playwright test asserts the owner sees the
          message on the accounts screen and that the account list is
          unchanged. Those are the same four tests DR-0028 settles and M3-P12
          criterion 12.16 runs one phase later, applied here to the platform
          module M3-P14 owns per decision D-57. The criterion exists because an
          account number mistyped by one character matches nothing at
          src/modules/ledger/domain/classify-flow.ts:62 through :77, so the
          transfer falls through to the sign rule at classify-flow.ts:102,
          lands in the spend total and is offered on the naming screen: a state
          indistinguishable from never having registered at all, and one every
          other criterion in this phase is green in, because every fixture
          account number is correct by construction.
      - id: "14.13"
        criterion: >-
          A NAMING THAT STOPS APPLYING IS COUNTED AND NAMED, NEVER SILENTLY
          GONE. A Playwright test imports the fixture, names one own-account
          group as a merchant on /merchants, registers the account that group
          belongs to, and asserts three things: that the registration result
          names the number of merchant rules that stopped matching and the
          account that absorbed them, in copy present in all three catalogues;
          that the transactions concerned carry no merchant; and that the
          MerchantRule row still exists, asserted at the application level. A
          grep asserts that no code path in the accounts module and no code
          path in interpretation calls any delete on a MerchantRule, which is
          .claude/skills/pulse-domain/SKILL.md:41 held mechanically rather than
          promised in a step. This is decision D-49 given a witness in the
          phase where the owner meets it first: without it an implementation
          that does nothing at all about merchant rules passes M3-P14
          unchanged, while this phase's own ordering argument (decision D-52)
          assumes namings made before registration exist.
      - id: "14.14"
        criterion: >-
          THE TWO READS THAT CAN SEE A HELD ROW ARE SCOPED THE SAME WAY, SO A
          HELD ROW IS NEVER REPORTED AS A GAP. Executed at the phase base and
          recorded by the verification-first step, a grep for a null-flow
          condition in src/ returns THREE lines in two reads: the uninterpreted
          COUNT at src/modules/overview/adapters/overview-repository.ts:230,
          and listGapRows at overview-repository.ts:263 through :310, whose
          CASE at :280 labels a null flow uninterpreted and whose WHERE at :295
          admits it, joining accounts only for a label and carrying no ring
          filter.
          Four cases, all at the application level over the real repository.
          ONE: over a household holding a non-pot account whose rows carry a
          null flow, uninterpretedCount excludes those rows AND listGapRows
          returns no gap row for any of them, so the count and the listing
          agree; the month's verdict reads as reconciling. TWO: over a
          household whose accounts are ALL pot accounts, every field of
          MonthFigures is byte identical to the values the verification-first
          step captured from the phase base, written into the test by hand from
          that captured output and never read back from the implementation, and
          listGapRows returns the same rows it returned at the base. THREE: a
          row on a POT account with a null flow is STILL counted as
          uninterpreted, STILL returned by listGapRows and STILL holds the
          verdict open, so neither read may be scoped by dropping its null-flow
          condition, which is finding CR-502 held rather than undone
          (src/modules/overview/adapters/overview-repository.ts:237 through
          :242). FOUR: the two reads are scoped by the same predicate, asserted
          by a test that flips one account's ring and requires the count and
          the listing to change together; a phase in which the count excludes a
          row the listing still returns, or the reverse, fails this criterion,
          because the cause block is gated on the count
          (src/modules/overview/ui/month-view.tsx:354) while the rows under it
          come from the listing
          (src/modules/overview/application/month-overview.ts:167), and the two
          disagreeing is how a household is shown a green verdict over money
          the repository is still handing the screen.
      - id: "14.15"
        criterion: >-
          A HELD ROW IS NAMED AS HELD: NOT MISSING, NOT UNINTERPRETED, AND NOT
          A BALANCE. This is what DR-0030 is paying for and it is a criterion
          rather than a step. Five assertions, over a household that has
          imported a statement for an account in the reserve ring. ONE, THE
          MONTH VIEW SAYS SO: an element with data-testid held-rows renders,
          naming each account whose rows are held and how many of its rows fall
          in the month, and it renders OUTSIDE the reconciliation panel, so a
          grep asserts it is not one of the cause blocks and a test asserts the
          verdict still reads as books closing while it is on the page. A held
          statement is a normal state and not a gap, and rendering it as a
          cause would tell the reader the books are open when they are not.
          TWO, THE ACCOUNTS SCREEN SAYS SO: the account's row on the accounts
          screen names it as an account whose rows are held and gives the count
          of imported rows held for it, so a household that imported before
          this phase finds them there too. THREE, HELD IS DISTINGUISHABLE FROM
          UNINTERPRETED: over a household holding BOTH a held row on a reserve
          account AND a null-flow row on a pot account, the two render in
          different places with different copy, the pot row under
          recon-cause-uninterpreted and the reserve row under held-rows, and a
          test asserts neither string appears in the other's element. The two
          states are told apart by the account's ring and not by the flow
          column, which is decision D-59. FOUR, ALL THREE CATALOGUES: every
          string this criterion introduces is present in messages/en.json,
          messages/nl.json and messages/fr.json, English written first, with a
          test asserting no key is missing from any catalogue. FIVE, THE
          HEADING IS NOT A BALANCE: decision D-60. The reserves card's heading,
          eyebrow and any label rendered with reserves-net name a MOVEMENT IN
          THE MONTH and not an amount held, in all three catalogues, and a test
          asserts the rendered strings for that card contain no word from a
          hand-written list of balance words in each language. No figure in v1
          is accumulated across months, and a grep asserts no read in the
          overview module sums outside the requested period.
      - id: "14.16"
        criterion: >-
          THE INVARIANT DOES NOT MOVE WHEN A RESERVE STATEMENT IS PRESENT. One
          application test and one Playwright test over the same shape. A
          household holds a pot account and a reserve account; the month is
          computed FIRST with only the pot statement imported, and every field
          of MonthFigures is recorded; then the reserve account's OWN statement
          is imported, with no other change, and the test asserts that
          incomeCents, spendCents, netToReservesCents and changeInPotCents are
          each byte identical to the recorded values, that differenceCents is
          unchanged, that reconciles is still true, that uninterpretedCount is
          unchanged, and that rowCount is unchanged, while the held-rows
          element of criterion 14.15 has appeared and names the new rows. The
          test is RED if a held row reaches any of the four totals, if it is
          counted as uninterpreted, or if it moves the difference, and it is
          the criterion that fails if an implementation reaches for a Flow
          member or lets a held row through a sum. The identity being preserved
          is the one src/modules/ledger/domain/reconciliation.ts:79 through :81
          defines and src/modules/overview/domain/month-projection.ts:201
          projects, and the mechanism that preserves it is that a held row
          carries no flow while every named sum, changeInPot and rowCount
          filter on the flow column
          (src/modules/overview/adapters/overview-repository.ts:217 through
          :235). A Playwright arm asserts the same three totals and the same
          verdict on the rendered page, so the guarantee is one the reader gets
          and not only one the repository holds.
