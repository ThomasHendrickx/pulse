  searchParams at all (src/app/(app)/merchants/page.tsx has no such
  parameter), so nothing is rendered. There is nothing to fix and everything
  to build, which is why the toast, its live region, its dismiss control and
  its three catalogue entries are planned as the substance of M3-P11 rather
  than as its error handling. The failure notice has NO TIMER: it stays until
  the reader dismisses it, and decision D-32 records why that choice was made
  over an auto-dismissing notice.

  A SERVER ANSWER CAN DIFFER WITHOUT FAILING, and that case has a
  deterministic witness rather than a hypothetical one. The use case trims
  the name it stores (src/modules/merchants/application/assign-merchant.ts:50),
  so typing a name with surrounding whitespace produces a confirmed label
  that differs from the predicted one with no failure anywhere. M3-P11 shows
  that difference on the row instead of swapping one plausible value for
  another, and criterion 11.5 measures it with exactly that input. The
  alternative, trimming inside the prediction, was rejected in decision D-31:
  it puts one line of the use case in two places, and it would leave the
  difference path with no deterministic test at all, which is how a path
  fails silently the first time it is really reached.

  V0.2 OWN-ACCOUNTS ROUND (added by the M0-P6 scout, 2026-08-23), phases
  M3-P14 and M3-P15. The owner's household is ten accounts: four current
  accounts, four savings accounts and two credit cards. They upload one
  current account first, and that statement carries transfers to the other
  nine. Pulse offers those transfers as counterparties to name as merchants.
  They are not merchants. They are the household's own accounts.

  THE DOMAIN ALREADY ANSWERS THE QUESTION AND THE ANSWER NEVER FIRES.
  Classification runs against the DECLARED sets before the sign rule
  (.claude/skills/pulse-domain/SKILL.md:61 through :66, implemented at
  src/modules/ledger/domain/classify-flow.ts:62 and :73), and merchant
  resolution runs only over the counted rows, so a declared own-account never
  reaches the naming screen
  (src/modules/ledger/application/interpret-window.ts:100 through :103 and
  :123 through :128, and the review's own read at
  src/modules/merchants/adapters/merchant-repository.ts:231 through :234).
  The owner sees the transfers because rule three fires instead: those
  accounts do not exist. An account can come into existence only through
  src/modules/import/application/confirm-import.ts:96, which declares the
  account the imported FILE belongs to; that is the single caller of
  declareAccount in src, and there is no accounts route under src/app.
  Measured on the owner's own deployed data and already recorded in this
  document's header block: 39 transactions, an account-shaped counterparty on
  11 of them over 6 distinct accounts, and flows SPEND 33, INCOME 6, INTERNAL
  0, RESERVE 0. Not one of those 6 is declared, so not one of those 11 rows
  is classified as anything but spend or income.

  THE HALF THAT MAKES THIS CRITICAL RATHER THAN A MISSING SCREEN. Section 1
  of the domain skill says reserve accounts are registered for their IBAN
  only and their statements are not imported in v1
  (.claude/skills/pulse-domain/SKILL.md:22). That capability was specified and
  never built. Importing is the only way an account is declared, so on the
  path the domain describes a reserve account is never declared at all, and
  every euro the household moves to savings falls through to the sign rule at
  src/modules/ledger/domain/classify-flow.ts:102 and is counted as SPEND. The
  reserves block stays empty and the spend total is inflated by every euro
  saved.

  AND THE PROJECT'S HIGHEST-LEVERAGE TEST IS BLIND TO IT. The reconciliation
  invariant, income minus spend minus netToReserves equals changeInPot, holds
  throughout, because the money genuinely did leave the pot. The mechanism is
  three lines: src/modules/ledger/domain/reconciliation.ts:70 through :74 add
  a row's amount to spendSigned or to reserveSigned depending on its flow, and
  reconciliation.ts:79 through :81 subtract BOTH from income with the same
  sign, so moving a single row between SPEND and RESERVE changes the two terms
  by exactly offsetting amounts and leaves differenceCents bit for bit
  identical. The property test at test/property/reconciliation.test.ts goes on
  passing, the month view goes on reporting that the books close, and the
  household's savings sit in its spend total. Criterion 14.2 is the criterion
  that catches it, and it states that reason in its own text because no
  existing test can.

  TWO FURTHER GAPS, found while establishing the above and planned as M3-P15.
  There is no way to CHANGE an account's ring after declaration: the accounts
  module publishes createAccount, listAccounts, findAccountByIban and
  getAccountById and nothing else
  (src/modules/accounts/application/ports.ts:23 through :38), so a current
  account mistakenly declared RESERVE at first import, which the import form
  allows at src/modules/import/ui/profile-confirmation.tsx:180 through :184,
  is wrong forever, and so is the reverse. And a correction cannot be a
  declaration edit plus a recompute until something owns the rows that leave
  the pot, because interpretation loads pot accounts only
  (src/modules/ledger/application/interpret-window.ts:37 through :39) while
  every downstream read filters on the flow column alone and never on the
  account (src/modules/overview/adapters/overview-repository.ts:128 through
  :131 and :233 through :235).

  A CARD IS NOT REGISTRABLE BY ACCOUNT NUMBER AND THIS PLAN SAYS SO RATHER
  THAN PAPERING OVER IT. A card account carries no IBAN by design: cards are
  recognised through their bound SourceProfile
  (prisma/schema/accounts.prisma:16 through :20,
  src/modules/import/application/confirm-import.ts:112). Decision D-48
  records what follows: the registration surface registers only accounts that
  have an account number, a card is registered by importing its statement,
  and the consequence for the owner's two cards is stated on the screen and
  in criterion 14.6 rather than discovered the way this defect was.

  WHERE THESE TWO PHASES SIT. They are dispatched BEFORE M3-P12 and M3-P13
  and after nothing in particular; decision D-52 records the reason. M3-P12
  makes what a naming matches the counterparty's identity, so under it the
  owner's nine own-account counterparties collapse from one group per
  transfer into one tidy group per account, which is precisely the shape that
  invites a naming; every naming made in that window becomes a rule that
  matches nothing the moment the accounts are registered. Registering the
  accounts first removes those groups from the screen before they can be
  named at all.
