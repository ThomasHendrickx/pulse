  - id: M3-P7
    branch: claude/m3-p7-mobile-month-view
    intent: >-
      Mobile first becomes the project's constraint and the month view is
      rebuilt against it: the pulse-frontend skill's desktop-first paragraph
      is replaced under DR-0022, the five design tokens the approved mockup
      needs are added to styles/tokens.css first, the app shell and the month
      view are rebuilt one-column at phone width with the reconciliation
      answer above the fold, and the phone-width regression guard stops
      measuring horizontal overflow and starts measuring whether the screen
      can be used.
    grounding: >-
      DR-0022 (owner, 2026-08-22): mobile first supersedes the desktop-first
      charter line, decided against an approved mockup after the owner graded
      the shipped month view 2/10 for quality and 1/10 for usability on a
      phone. The layout reference is delivery/design/mobile-v02/, whose
      README.md:24 through :40 states the six things it fixes and whose
      canvas.json:3 fixes the frame at 390 by 844. The frames are
      Main.dc.html (books close), BooksDoNotClose.dc.html (a reconciliation
      gap) and DenseAlternate.dc.html, which README.md:20 records as
      considered and NOT chosen. This phase is grounded at b560e85, not at
      this plan's baseline-commit e4ea3ba: M3-P1, M3-P2 and M3-P6 have merged
      since, and every file and line reference in this phase and in its
      report-code-disagreement entries was read at b560e85. Measured there:
      grep -c "@media" src/app/globals.css returns 0; src/app/globals.css:564
      reads "Desktop first"; .claude/skills/pulse-frontend/SKILL.md:113 is the
      paragraph DR-0022 supersedes, and SKILL.md:109 carries the rail
      sentence that has to move with it. DR-0023 is raised to the owner by
      this phase and does not gate it: it asks whether the spend card keeps
      one row per tag or gains merchant rows nested under tag subheads, and
      every criterion below holds whichever way it resolves.
    severity: critical
    verified-root-cause: >-
      Not a defect round on one commit; the whole screen was built to a
      charter line that has now been superseded. The measured cause is that
      src/app/globals.css carries no media query at any width (grep -c
      "@media" returns 0 at b560e85) and no layout rule below the top-level
      grid gives way: src/app/globals.css:756 and :781 both declare
      grid-template-columns minmax(0, 1fr) auto auto with two of those tracks
      pinned to min-width var(--space-14), 80px each (styles/tokens.css:121),
      so a spend row spends 160px of a 390px screen on two figures and gives
      the merchant name what is left. The dispatch's own statement of the
      cause named a rule that M3-P6 had already replaced, which is why step 1
      is verification-first: see the first report-code-disagreement entry for
      this phase. Whether a phone even lays the document out at its own width
      is UNCONFIRMED and is the first thing step 1 must settle.
    steps:
      - kind: verification-first
        text: >-
          Before editing any component, settle the four unverified claims
          this plan records against this phase and write each answer into the
          phase work history with the command and its captured output beside
          it. (a) Read the viewport meta tag off a rendered page of the
          running app and record the exact string, or record that the tag is
          absent; if it is absent, adding it is this phase's first change and
          nothing else in the phase is meaningful until it lands. (b) Re-read
          the .month-grid rule and record its current text, since the
          dispatch's description of it is stale. (c) Record grep -c "@media"
          src/app/globals.css and grep -n "Desktop first" over both
          src/app/globals.css and .claude/skills/pulse-frontend/SKILL.md.
          (d) Confirm that the spend projection still collapses a tag to one
          group (src/modules/overview/domain/month-projection.ts:67) so that
          DR-0023 is asked about the real code and not about a memory of it.
      - text: >-
          Replace the desktop-first paragraph. .claude/skills/pulse-frontend/
          SKILL.md:113 currently reads "Desktop first. The import is a desk
          activity. Mobile is not a v1 target and no effort is spent on it."
          It is replaced by a mobile-first constraint written in that
          document's own voice and at that document's own length: every
          screen is designed at 390 by 844 first and widened from there,
          phone-width evidence is a standing acceptance criterion on every UI
          phase, and the evidence measures reachable targets, readable
          density and content that survives the narrowing, never the absence
          of horizontal scrolling. Cite DR-0022 by id in the text. The rail
          sentence two paragraphs above it (SKILL.md:109) moves with it: the
          rail at wide widths is a widening of the one-column layout, not the
          layout the phone degrades from, which is what
          delivery/design/mobile-v02/README.md:40 records. The stale comment
          at src/app/globals.css:564 goes in the same change. Touch nothing
          under delivery/intake/: the intake documents are the record of what
          was asked for and are not edited to match what was later decided.
      - text: >-
          Add the five missing tokens to styles/tokens.css BEFORE any rule
          uses them, in the file's existing two-layer shape and with the same
          kind of one-line justification the file already carries: a 44px
          minimum tap target, a 56px list-row minimum height, a phone
          headline figure size at 40px, a -0.02em tracking for that figure,
          and a single breakpoint value. The breakpoint token is
          documentation only, because a custom property cannot appear in a
          media-query condition, so the same literal is repeated in the one
          @media condition the stylesheet is allowed to grow, with a comment
          saying that. Use the nearest existing token for the four values the
          mockup implies that are within 2px of one (14px, 18px, 3px and
          1.45); see this phase's token entry in report-code-disagreement.
      - text: >-
          Rebuild the app shell at phone width: the header's brand,
          navigation, household identity and sign-out laid out per
          delivery/design/mobile-v02/Main.dc.html:23 through :33, with the
          three nav links as an equal-width row whose every target clears
          44px. Keep every testid the shell already publishes (main-nav,
          nav-overview, nav-import, nav-merchants, household-context) and
          keep the deliberate identity ellipsis M3-P1 criterion 1.5 decided
          (src/app/globals.css:160 through :166); the identity is the one
          element in the product allowed to give way.
      - text: >-
          Rebuild the month view one column at phone width, in DOM order
          income, spend, reserves, with the reconciliation answer above the
          fold. The three-column rows (src/app/globals.css:756 and :781)
          become the mockup's two-line row: name and amount on line one,
          row count and month-over-month delta on line two, amounts
          right-aligned in the mono face through the existing .pulse-amount
          class (styles/tokens.css:163 through :168). Every figure the
          desktop screen shows still renders: the in-progress badge, the
          days-elapsed meta, the row count, the comparison head, every group
          total, every delta, the unresolved pill, the pot figure, the
          reconciliation parts and every cause block with its gap rows. The
          reconciliation panel moves ahead of the three cards in DOM order.
          At the one breakpoint and above, the rail returns as a widening:
          spend wide with income and reserves beside it, produced by grid
          placement and never by the CSS order property, so the DOM order
          assistive technology reads is the order the phone shows.
      - text: >-
          Rebuild the phone-width regression guard so that a screen which is
          unusable but does not scroll sideways FAILS. Add a Playwright
          project to playwright.config.ts that spreads a chromium mobile
          device descriptor with isMobile true at a 390 by 844 viewport,
          alongside the existing chromium and chromium-prod projects, and run
          test/e2e/month-view.spec.ts and test/e2e/navigation.spec.ts under
          both the desktop project and the new phone project. isMobile is the
          point and not a detail: without it Playwright sizes the layout
          viewport directly and the meta viewport tag is never exercised,
          which is why the existing phone specs could not see its absence.
          Add the four measurements the old bar did not make: rendered tap
          target height, the same testid set at both widths, no clipped
          element anywhere in main, and the reconciliation verdict inside the
          first 844 pixels. Keep every existing assertion; the overflow check
          stays, it is simply no longer the only one.
      - text: >-
          Raise DR-0023 to the owner with this plan's recommendation stated
          first: keep the shipped one-row-per-tag spend grouping for the
          rebuild, because nesting merchants under tag subheads is a change
          to the projection and to the delta keying rather than to the
          layout, because it makes the spend card roughly three times taller
          on the screen the owner just graded 1/10 for usability, and because
          with zero merchant rules in the owner's data it renders nothing
          today either way. Build nothing on the answer in this phase.
    files-to-touch:
      - .claude/skills/pulse-frontend/SKILL.md
      - styles/tokens.css
      - src/app/globals.css
      - src/app/layout.tsx
      - src/app/(app)/layout.tsx
      - src/modules/overview/ui/month-view.tsx
      - playwright.config.ts
      - test/e2e/month-view.spec.ts
      - test/e2e/navigation.spec.ts
    extras: []
    acceptance:
      - id: "7.1"
        criterion: >-
          The phase work history records an answer to each of the four
