  with the capability it announces (PR2-007), and privacy gates covering
  all five promised categories on phase-touched files with a not-witnessed
  honesty clause (PR2-008).
report-code-disagreement:
  - phase: M3-P1
    claim: >-
      Owner feedback item 1 (fleet backlog, DR-0002 feedback log): the app
      has no general navigation; the month empty state names the import
      action with no link; once data exists there is no way to reach /import
      or /merchants from the header. Checked: the authenticated shell header
      renders brand, household name and sign-out only, no nav links
      (src/app/(app)/layout.tsx:18 through :26); the empty state renders
      title and body naming the import action with no Link element
      (src/modules/overview/ui/month-view.tsx:387 through :396,
      messages/en.json:28); the routes exist at src/app/(app)/import/page.tsx
      and src/app/(app)/merchants/page.tsx, reachable today only by typed
      URL.
    verified: true
  - phase: M3-P2
    claim: >-
      Addendum section 1 (pulse-v0.2-pdf-addendum.md:18): "PDF is a second
      adapter behind the existing StatementParser port. Nothing upstream
      changes." The port exists and its shape holds
      (src/modules/import/application/ports.ts:18: detect bytes to spec,
      parse bytes plus spec to statement), and the use-case pipeline is
      untouched in the addendum's sense. But the claim FAILS in the strict
      reading: both port methods are typed to SourceProfileSpec, which is a
      flat delimited-only record (src/modules/import/domain/
      source-profile.ts:49: delimiter, encoding, headerRowIndex, dateFormat,
      decimalStyle, amountRepresentation, columns), parseStatementRow
      assumes delimited lines (src/modules/import/domain/
      parse-statement.ts:60), and hasNaturalKey and specEquals read
      delimited fields (source-profile.ts:62, source-profile.ts:217). A PDF
      adapter cannot slot in until SourceProfileSpec becomes a discriminated
      union, and the failure-reason union must grow
      (src/modules/import/application/ports.ts:38 carries exactly
      mixed-accounts, undetectable, unparseable). Owned by M3-P2's
      verification-first step; the widening is decision D-2.
    verified: false
  - phase: M3-P2
    claim: >-
      Addendum section 1 (pulse-v0.2-pdf-addendum.md:19): identify, declare,
      ingest, interpret are untouched, and the ask-once account-declaration
      step stays exactly as is with only the format question disappearing
      for recognised layouts. Checked: the pipeline lives in
      src/modules/import/application/upload-statement.ts:38 through :92
      (detect, parse, mixed-account guard, declaration branch at :57, ingest
      at :74, interpret at :92); profile recognition is spec equality
      (upload-statement.ts:101), which a code-owned template spec satisfies
      by template id; account identity rides the file's own-account IBAN or
      the profile binding (upload-statement.ts:113,
      prisma/schema/import.prisma:43). The flow accommodates PDF without
      structural change once the spec type is widened.
    verified: true
  - phase: M3-P2
    claim: >-
      Addendum section 2 (pulse-v0.2-pdf-addendum.md:35): both statement
      types carry an opening balance, the transactions, and a closing
      balance or settlement total, and opening plus the sum of parsed
      transactions equals closing in integer cents. Checked arithmetically
      against both real PDFs in-container: Belfius opening SALDO OP plus the
      sum of all 39 transaction amounts equals the closing SALDO OP exactly;
      KBC previous balance plus the sum of all 22 rows including the
      settlement credit equals the Afrekening amount exactly. The identity
      is real and usable as a hard gate.
    verified: true
  - phase: M3-P2
    claim: >-
      Addendum section 3 structural claims for the Belfius layout
      (pulse-v0.2-pdf-addendum.md:50 through :62): fingerprint text plus
      SALDO OP lines, IBAN in a band line between dashes, a repeated
      per-page header block, annex pages starting with the BIJLAGE marker
      that contain amount-like non-transactions, opening and closing as
      first and last SALDO OP lines, and the transaction start pattern
      (4-digit sequence, DD-MM-YYYY booking date, VAL. value date, sign and
      amount at line end). Checked against the real statement's text layer:
      all present; fingerprint text on all 5 pages; 4 band lines; 39
      transaction starts on pages 1 through 4; page 5 is the annex and
      contributes zero transaction starts; exactly 2 SALDO OP lines and the
      balance identity closes. Counterparty IBANs inside descriptions
      confirmed (STORTING VAN and NAAR followed by IBAN shapes).
    verified: true
  - phase: M3-P2
    claim: >-
      Addendum section 3 amount traps (pulse-v0.2-pdf-addendum.md:63):
      decimal comma, thousands dot only from 1.000,00 up, and the space
      between sign and amount disappears on large amounts. Checked: decimal
      comma everywhere and thousands dot only on large amounts hold; the
      sign-space correlation is DIRECTIONAL, not strict (spaced signs were
      observed only without a thousands dot, but tight signs occur both with
      and without one). The parser requirement the addendum draws, accept
      both forms, is the right one and is what M3-P2 builds; a parser
      encoding the strict correlation would reject real lines.
    verified: true
  - phase: M3-P2
    claim: >-
      Addendum section 3 dedup key (pulse-v0.2-pdf-addendum.md:68): natural
      key is account plus year of booking date plus sequence number, the
      sequence being per account and continuous across statements within a
      year. Two failures of verification: (a) the implemented natural key at
      e4ea3ba is a DIFFERENT shape, account plus statementNumber plus
      sequenceNumber (src/modules/import/domain/dedup.ts:95), so the
      addendum's key is new wiring, not existing behaviour; (b) continuity
      of the sequence ACROSS statements cannot be verified from the single
      real statement available (continuity within it holds, 39 consecutive).
      Owned by M3-P2's verification-first step; the key choice is decision
      D-4.
    verified: false
  - phase: M3-P2
    claim: >-
      Addendum section 5 first amendment (pulse-v0.2-pdf-addendum.md:91):
      "the current hash key collides and would silently drop one" of two
      identical rows, so the key must gain an occurrence index. STALE
      relative to e4ea3ba: the occurrence ordinal is implemented exactly as
      the addendum specifies, including the cross-import
      highest-occurrence-wins semantics
      (src/modules/import/domain/dedup.ts:80 through :105,
      prisma/schema/import.prisma:112), with the identical-pair fixture and
      tests from M1-P2 (test/domain/dedup.test.ts). The v1 plan absorbed
      this amendment in its fix rounds. No new build is owed; M3-P3 only
      re-witnesses it through the PDF path.
    verified: true
  - phase: M3-P2
    claim: >-
      Addendum section 6 (pulse-v0.2-pdf-addendum.md:111): fixtures may be
      synthetic PDFs "or their extracted text, if the parser consumes a text
      layer". Checked: BOTH real statements carry full machine-readable text
      layers (extraction in-container produced complete text for all pages),
      so the v0.2 parser consumes the text layer and no OCR path exists in
      this plan. Fixture format is decision D-3.
    verified: true
  - phase: M3-P3
    claim: >-
      Addendum section 4 structural claims for the KBC layout
      (pulse-v0.2-pdf-addendum.md:73 through :88): fingerprint text, masked
      card number, statement number and period line, row shape (transaction
      date, settlement date, description, amount), FX continuation lines
      belonging to the preceding row, the previous-balance and total lines
      being balances not transactions, and the settlement credit line being
      a real transaction. Checked against the real statement's text layer:
      all present (22 rows; 4 FX transactions each with two continuation
      lines). Three nuances the addendum does not state, recorded in
      notes/export-format-facts.md: the closing figure sits on the
      Afrekening line, not the Totaal bedrag line, and uses a SPACE
      thousands separator; text extraction is word-gap tolerance-sensitive
      (default assembly glues words), so the extractor reconstructs lines
      from positioned items and template matching must not depend on
      interior label spacing; and the DOMICILIERING credit equals the
      negated previous balance exactly.
    verified: true
  - phase: M3-P3
    claim: >-
      Addendum section 4 (pulse-v0.2-pdf-addendum.md:86): no sequence
      numbers exist in the card format, so the hash dedup key applies with
      the occurrence amendment, and a real identical duplicate row pair
      exists. Checked: the real statement carries no per-row sequence
      column, and exactly one identical pair (same transaction date,
      description, amount) occurs; the implemented hash path with occurrence
      ordinal (src/modules/import/domain/dedup.ts:80) covers it.
    verified: true
  - phase: M3-P3
    claim: >-
      Addendum section 5 second amendment (pulse-v0.2-pdf-addendum.md:100):
      the settlement debit carries no IBAN, so classification gains a step
      between the declared-set checks and the sign fallback, matching by
      amount against an imported card statement's settlement total within a
      date window, with the unimported-card SPEND fallback. STALE relative
      to e4ea3ba: implemented as decision D-11 of the v1 plan
      (src/modules/ledger/domain/classify-flow.ts:77,
      src/modules/ledger/domain/corrections.ts:38,
      src/modules/ledger/domain/constants.ts:16), and the credit-side
      pattern already matches the DOMICILIERING line
      (src/modules/ledger/domain/constants.ts:26). The settlement total is
      derived from stored rows (src/modules/ledger/domain/interpret.ts:67),
      so KBC PDF imports feed it with no schema change. No new build is
      owed; M3-P3 witnesses the pairing end to end through two PDF imports.
    verified: true
  - phase: M3-P4
    claim: >-
      Addendum section 7 (pulse-v0.2-pdf-addendum.md:123): the v1 desktop
      stance was downstream of CSV, PDF exports come from the phone, the
      natural v0.2 import path is the phone share sheet, and the frontend
      skill's desktop-first line gets revisited in the v0.2 plan. Checked:
      the line exists verbatim (.claude/skills/pulse-frontend/SKILL.md:113,
      "Desktop first. The import is a desk activity."); the upload input
      accepts CSV only (src/modules/import/ui/upload-form.tsx:22,
      accept=".csv,text/csv"); no PWA manifest and no share-target handler
      exist anywhere in the tree (no public/ directory, no manifest file
      under src/app). The share-sheet MECHANISM is platform-dependent and
      unverifiable from the repository: Web Share Target requires an
      installed PWA and exists on Android/Chromium only, with no iOS Safari
      support. That platform question is DR-0021; the mobile-first upload
      flow itself (M3-P4) is platform-neutral and not gated on it.
    verified: true
phases:
  - id: M3-P1
    branch: claude/m3-p1-navigation
    intent: >-
      General navigation, the owner's phase-blocking feedback item. Header
      navigation in the authenticated shell (overview, import, merchants)
      with a visible current-route state, and an empty state that links to
      the import screen instead of only naming it. Small and shippable
      first, before any PDF work.
    grounding: >-
      Fleet backlog, DR-0002 feedback log item 1 (owner, 2026-08-21,
      phase-blocking): "no general navigation so later imports past empty
      screen also won't work". Verified at e4ea3ba: the shell header carries
      no nav (src/app/(app)/layout.tsx:18 through :26); the empty state
      names the import action with no link
      (src/modules/overview/ui/month-view.tsx:387,
      messages/en.json:28); the target routes exist
      (src/app/(app)/import/page.tsx, src/app/(app)/merchants/page.tsx).
    severity: high
    verified-root-cause: >-
      Not a defect in any module's logic: M1 phases each built their screen
      and no phase owned the shell's navigation, so none exists. The fix is
      additive UI in the authenticated shell and the empty state.
    steps:
      - text: >-
          Add a nav element to the authenticated shell header
          (src/app/(app)/layout.tsx:18): three links, overview at /, import
          at /import, merchants at /merchants, each with a stable
          data-testid and an aria-current or data-active marker on the
          current route. Labels come from the message catalogs (new keys in
          messages/en.json, messages/nl.json, messages/fr.json, EN as
          source), never hardcoded copy. Styling with existing design
          tokens only; a missing token is added to styles/tokens.css first
          (CLAUDE.md non-negotiable 4).
      - text: >-
          Give the month view's empty state
          (src/modules/overview/ui/month-view.tsx:387) a Link to /import,
          with its label from the catalogs, so the named action is
          reachable where it is named.
      - text: >-
          Add a fast-gate catalog parity test (new file under test/) that
          reads messages/en.json, messages/nl.json and messages/fr.json and
          asserts the three key sets are identical, so this and every later
          phase cannot ship an untranslated key. No such test exists at
          e4ea3ba (checked under test/).
      - text: >-
          Add test/e2e/navigation.spec.ts: on an empty household the empty
          state's link navigates to /import; seeded with data, the header
          links navigate between /, /import and /merchants and the active
          marker follows the route; the nav is present on all three routes.
    files-to-touch:
      - src/app/(app)/layout.tsx
      - src/modules/overview/ui/month-view.tsx
      - messages/en.json
      - messages/nl.json
      - messages/fr.json
      - styles/tokens.css
      - test/e2e/navigation.spec.ts
      - test/app/ (the catalog parity test)
    extras:
      - src/platform/ui/nav-link.tsx
      - src/app/globals.css
    acceptance:
      - id: "1.1"
        criterion: >-
          npm run test:e2e exits 0 with test/e2e/navigation.spec.ts passing:
          it asserts the three header nav links are present (by testid) on
          /, /import and /merchants, that clicking each navigates to its
          route, that the active marker matches the current route, and that
          the empty state for a household with no imports contains a link
          whose click lands on /import. And the nav is rendered by the
          shell, not by pages: grep -rl for the nav's data-testid over src/
          matches exactly one component file, src/app/(app)/layout.tsx
          (finding PR2-006: per-page copies on the three current routes
          would pass the route assertions and ship the next route bare).
      - id: "1.2"
        criterion: >-
          npm test exits 0 including the new catalog parity test, which
          fails red when any key exists in one of messages/en.json,
          messages/nl.json, messages/fr.json and not the others (witnessed
          red once in the work history by removing a key locally, then
          green).
      - id: "1.3"
        criterion: >-
          npm run typecheck && npm run lint && npm test exit 0 at the phase
          head, and grep -rE "oklch\(|#[0-9a-fA-F]{3,8}" over src/ excluding
          the token and theme files exits 1.
      - id: "1.4"
        criterion: >-
          The pre-existing test/e2e/golden-journey.spec.ts passes unmodified
          except for selectors the new header markup forces; git diff
          --name-only against the phase base shows no deleted test files.
