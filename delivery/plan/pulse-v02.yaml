  - id: M3-P14
    branch: claude/m3-p14-account-registry
    intent: >-
      The household registers every account it owns, in either ring, without
      importing a statement for it, so that a transfer to one of its own
      accounts is classified as its own account instead of being offered as a
      merchant to name. One canonical form of an account number is used by
      registration, by import and by classification; a later import of an
      account already registered ADOPTS it rather than creating a second one;
      and registering an account recomputes, so rows already imported that
      reference it are reclassified with no fact rewritten. The case this
      phase exists for is the one the product cannot express at all today: a
      reserve account. Its statement is ACCEPTED under DR-0030 and its own
      rows are HELD, ingested as facts, counted in no total, offered for no
      naming and reported as no gap, with the screen saying so per account in
      all three catalogues so a reader can tell held from missing and held
      from uninterpreted.
    grounding: >-
      The owner's scenario, quoted in standing-context: ten accounts, one
      uploaded first, its transfers to the other nine offered as merchants.
      The pulse-domain skill is the authority and answers it already: section
      1 for the three rings (.claude/skills/pulse-domain/SKILL.md:20), whose
      next sentence, that reserve accounts are registered for their IBAN only
      and their statements are not imported in v1
      (.claude/skills/pulse-domain/SKILL.md:22), is SUPERSEDED by DR-0030 and
      is corrected by this phase in the same commit, because a skill that is
      always in context and contradicts the plan is a trap for whoever reads
      it next. Section 2 for
      facts versus declarations and its three absolute rules
      (.claude/skills/pulse-domain/SKILL.md:37 through :41),
      section 3 for the classification order
      (.claude/skills/pulse-domain/SKILL.md:61
      through :66), section 8 for the invariant that cannot see this
      (.claude/skills/pulse-domain/SKILL.md:144 through :154). The existing
      declaration surface, and the
      thing being generalised, is the import confirmation screen at
      src/modules/import/ui/profile-confirmation.tsx:166 through :186. The
      pulse-frontend skill binds the screen itself: section 1 for the server
      and client boundary, section 3 for the token rule
      (.claude/skills/pulse-frontend/SKILL.md:70), section 5 for the states
      this product must handle and its rule that a screen never hides an
      unknown (.claude/skills/pulse-frontend/SKILL.md:105), section 7 for the
      copy rules across the three
      catalogues. Grounded at 75ec85d, not at this plan's baseline-commit
      e4ea3ba; every citation in this phase and in its
      report-code-disagreement entries was read at 75ec85d.
    severity: critical
    verified-root-cause: >-
      An account can come into existence only through
      src/modules/import/application/confirm-import.ts:96, which declares the
      account the imported FILE belongs to. That is the single caller of
      declareAccount in src and there is no accounts route under src/app, so a
      household cannot name an account it has not imported. For a reserve
      account this is decisive rather than inconvenient, because
      .claude/skills/pulse-domain/SKILL.md:22 said, at 75ec85d and before
      DR-0030 superseded it, that its statements are not imported: on the path
      the domain described the account is never declared, deriveDeclaredSets adds nothing for it
      (src/modules/ledger/domain/ledger-transaction.ts:56 through :61), the
      reserve arm of classification never fires
      (src/modules/ledger/domain/classify-flow.ts:62), and every euro moved to
      savings falls through to the sign rule at classify-flow.ts:102, lands in
      the spend total, and offers its counterparty on the naming screen. The
      same mechanism explains the pot siblings: a transfer to an undeclared
      current account misses classify-flow.ts:73 and is spend as well.
      Nothing detects either, because
      src/modules/ledger/domain/reconciliation.ts:70 through :74 and :79
      through :81 subtract spend and netToReserves from income with the same
      sign, so the identity is unchanged by exactly this error.
    steps:
      - kind: verification-first
        text: >-
          At the head this phase is built on, re-establish with captured
          output every claim this plan's report-code-disagreement entries make
          for M3-P14, and write the output into the phase work history rather
          than restating the conclusion. The single caller of declareAccount
          and the absence of an accounts route; the classification order and
          the derivation of the declared sets; that merchant resolution runs
          over INCOME and SPEND rows only; that a reserve account's own rows
          are excluded from the interpretation window; and, because the
          dispatch's own wording failed verification here, exactly HOW a
          reserve account can be declared today and at what cost. Then settle
          the question that decides the shape of the work: read
          confirm-import.ts:86 through :101 and state whether an account
          registered by account number before any import is adopted by a later
          import or duplicated, and under what condition on the two strings
          that answer holds. Then CAPTURE, from the phase base and before any
          edit, the three baselines the criteria below compare against, because
          a criterion may rest only on evidence that exists in this phase's own
          tree. ONE, the full MonthFigures of a household whose accounts are
          ALL pot accounts over a committed fixture, printed as captured
          output, which criterion 14.14 asserts against by hand. TWO, for every
          navigation link the shell renders today, the rendered line count of
          its label and its border box in both dimensions at 390 and at 360 and
          at the 150 and 200 percent text scales the existing spec already
          applies, which criterion 14.7 asserts against by hand. THREE, the
          state a household is left in when a statement is imported for an
          account declared RESERVE, which test/e2e/month-view.spec.ts:1377 sets
          up today and asserts nothing about: the flow column on those rows,
          the uninterpreted count, whether listGapRows returns them, and
          whether the month view says the books close. FOUR, which committed
          fixture account numbers pass the ISO 7064 mod-97 check and which do
          not, run as a script over the tree and recorded as counts, because
          criterion 14.12 turns that check into a refusal at the registration
          form while every invented account number in this repository was
          invented before any criterion required validity, and criterion 14.11
          requires one of them to be registered through that very form. That
          capture is a measurement and not an assumption: the phase reads the
          number off its own run rather than off this plan.
      - text: >-
          Give an account number ONE canonical form and put it where every
          consumer may reach it. The ledger domain imports nothing from other
          modules by rule (.claude/skills/pulse-domain/SKILL.md:168, and the
          note recording that choice at
          src/modules/ledger/domain/ledger-transaction.ts:25 through :27), so
          the form lives beside the other shared value types in src/platform,
          as decision D-47 records, and is a pure function with its own unit
          test. Registration normalises what the owner typed BEFORE storing
          it, because Account.iban is a declaration and normalising a
          declaration on the way in is allowed; every COMPARISON against a
          transaction's counterparty account normalises both sides at
          comparison time, because that column is a fact and is never
          rewritten (.claude/skills/pulse-domain/SKILL.md:39). That includes
          the declared-set derivation
          and the reserves SQL join at
          src/modules/overview/adapters/overview-repository.ts:175 through
          :176. Pin the single definition with a test the way the merchants
          module pins its own normaliser, so a second copy cannot appear. The
          same platform module carries the DETERMINISTIC validity test DR-0028
          settles, the pinned country-length table and the ISO 7064 mod-97
          check, because a canonical form that cannot say whether a string is
          an account number can only be applied blindly, and because the owner
          types seven of these by hand from paper documents on a phone-first
          product, where a transposed pair of digits is expected rather than
          unlikely. Decision D-57 records that M3-P14 owns that module and that
          M3-P12 imports it rather than expressing the same transformation a
          second time. And the import path's own declaration at
          src/modules/import/application/confirm-import.ts:93 through :99
          stores the canonical form too, so Account.iban holds ONE form
          tree-wide and the per-household uniqueness constraint at
          prisma/schema/accounts.prisma:28 is a real backstop rather than a
          nominal one; the stored FACT column on the transaction is untouched,
          because that is a fact and every comparison normalises both sides at
          comparison time.
      - text: >-
          Build the registration surface. A route under the authenticated
          shell that lists every account the household has registered with its
          label, its bank, its ring and whether a statement has ever been
          imported for it, and a form that registers a new one from a label, a
          bank, a ring and an account number. The reserve ring must be
          reachable from it, since that is the case the product cannot express
          at all today. Say how the owner reaches it: a link in the shell's
          navigation row, which today carries three links sized a third of the
          width each at the phone widths
          (src/app/(app)/layout.tsx:48 through :58, built that way by M3-P7),
          so the row's geometry is re-measured rather than assumed; and a
          second route into it from the month view's empty state
          (src/modules/overview/ui/month-view.tsx:415 through :429), because a
          household with no imports is exactly when registering accounts is
          most useful. Copy lands in all three catalogues, English written
          first.
      - text: >-
          Plan the card case explicitly and do not paper over it. A card
          account carries no account number by design and is recognised
          through its bound SourceProfile
          (prisma/schema/accounts.prisma:16 through :20, bound at
          src/modules/import/application/confirm-import.ts:112), so it cannot
          be registered the way a bank account is. Decision D-48 decides what
          follows and this step implements it: the registration form has no
          path that creates an account without an account number, which closes
          the duplicate hazard for cards by construction rather than by a
          mechanism, since a pre-registered card would have no identifier for
          confirm-import.ts:89 through :91 to adopt it by and would become a
          second account. The screen says in its own copy that a card is
          registered by importing its statement, and it lists card accounts
          once they exist. The consequence for the owner's two cards is stated
          in criterion 14.6 and is not hidden: until each card's statement is
          imported once, the direct debit that pays it is honest unitemised
          spend against the issuer
          (src/modules/ledger/domain/classify-flow.ts:98) and its descriptor
          is still offered on the naming screen, and registration cannot
          change that.
      - text: >-
          Make adoption a property that is kept rather than a property that is
          hoped for. A later import of an account already registered must
          resolve to the SAME account, and no path may create a second account
          for an account number the household has already registered. The
          lookup that already does this is confirm-import.ts:86 through :91;
          the work is to make it compare canonical forms and to hold it with a
          test at the application level and a witness in the browser. The
          uniqueness the database already carries
          (prisma/schema/accounts.prisma:28) is the backstop and not the
          mechanism.
      - text: >-
          Plan the healing. Interpretation runs over a window across all pot
          accounts rather than over the rows just imported
          (src/modules/ledger/application/interpret-window.ts:29 through :39
          and :189), so declaring an account must reclassify the past rows
          that reference it. Registering an account therefore triggers the
          recompute the ledger already publishes, exactly as naming a merchant
          does today (a declaration write followed by a recompute,
          src/modules/merchants/application/assign-merchant.ts:61 through
          :69), and nothing in the registration path writes a transaction row.
          Say what the owner sees afterwards and plan for it rather than being
          surprised by it: once the pot siblings are registered, every
          transfer to one of them whose partner statement has not been
          imported becomes an UNMATCHED INTERNAL LEG, which the domain calls a
          known state rather than an error
          (.claude/skills/pulse-domain/SKILL.md:96) and which the
          reconciliation panel already names. The books stop closing silently
          and start naming a gap, which is the correct direction, and
          criterion 14.8 measures that the gap is named with its remedy rather
          than left as a bare alarm.
      - text: >-
          ACCEPT the reserve account's statement, HOLD its rows, and say on
          the screen that they are held. Decision D-55, rewritten to DR-0030:
          a statement for an account in the reserve ring is imported like any
          other, its rows are ingested as facts, and they are HELD, meaning
          they enter no month total, are offered for no naming, and are not an
          uninterpreted gap. NO REFUSAL AND NO NEW FAILURE REASON ARE ADDED,
          and the earlier draft of this plan that added both is reversed here.
          The work is therefore not in the import path, which already ingests
          rows for whatever account the confirm declares; it is in three
          places. FIRST, the ring question on the import screen
          (src/modules/import/ui/profile-confirmation.tsx:181 through :184)
          goes on offering BOTH rings, the confirm path rejects a declaration
          carrying no ring rather than defaulting one, and the copy beside each
          answer states its consequence, because uploading is the only way into
          Pulse today, the order every household is in is upload first and
          accounts screen later, and on that order
          src/modules/import/application/confirm-import.ts:95 through :99
          declares the account from that answer with nothing standing behind
          it. SECOND, decision D-56, which DR-0030 leaves wanted either way:
          the two reads that can see a row with no flow take pot accounts only,
          the uninterpreted COUNT at
          src/modules/overview/adapters/overview-repository.ts:230 and
          listGapRows at overview-repository.ts:263 through :310, whose CASE at
          :280 labels a null flow uninterpreted and whose WHERE at :295 admits
          it, neither carrying a ring filter today. Scoping one and not the
          other leaves the repository handing the screen rows the verdict has
          already declared absent. The scoping is by the account's ring and
          never by dropping the null-flow condition, because a null flow on a
          POT account is a row ingest committed and interpretation never
          reached, and it must go on holding the verdict open and go on being
          listed, which is finding CR-502 recorded in the comment at
          src/modules/overview/adapters/overview-repository.ts:237 through
          :242. THIRD, and this is the part DR-0030 is paying for, the SCREEN
          STATE. Held rows are named, per account, on the month view and on the
          accounts screen, in English, Dutch and French, so a reader can tell
          held from missing and held from uninterpreted; and the reserves
          card's own copy is corrected so its heading cannot read as a balance,
          which is decision D-60, because the reserves block is a monthly
          movement and DR-0030's own argument is that an accumulated figure is
          the wrong figure. Held is derived from the ring and needs no
          migration and no new Flow member, which is decision D-59. Criterion
          14.11 measures the order, criterion 14.14 the two reads, criterion
          14.15 the screen state and the heading, and criterion 14.16 the
          invariant.
      - text: >-
          Decide and implement what happens to a MerchantRule the owner
          already wrote against a counterparty that turns out to be their own
          account. Decision D-49 decides it: the rule is KEPT, is never
          deleted by any engine path, and is counted and named to the owner at
          the moment of registration. Kept because recompute may never write
          to the declarations layer
          (.claude/skills/pulse-domain/SKILL.md:41), so an automatic deletion
          would break an absolute rule of the domain; and because a rule left
          standing heals by itself if the ring is ever corrected back, while a
          deleted one is gone. The rows heal on their own: an INTERNAL or
          RESERVE row is not a counted row, so interpretation writes a null
          merchant for it and the stale assignment stops applying
          (src/modules/ledger/application/interpret-window.ts:123 through :128
          and the contract at
          src/modules/ledger/application/ports.ts:51 through :57). What the
          owner must not have is a naming that silently vanished, so the
          registration result names how many of their merchant rules stopped
          matching and which accounts absorbed them.
      - text: >-
          Build the witness and build it so it would FAIL on the tree as it
          stands. The specification is criterion 14.1: one fixture, two arms
          in one spec, the arms differing only in whether the accounts were
          registered before the import. The control arm proves the fixture is
          CAPABLE of producing own-account groups on the naming screen, which
          is what stops a fixture built to pass from passing vacuously. Every
          value in the fixture is invented, no string in it is drawn from any
          real document, and every account-shaped identifier it introduces is
          added to test/fixtures/allowed-identifiers.txt with a written
          provenance note.
      - text: >-
          Run the gates: npm run typecheck, npm run lint, npm test, npm run
          gate:privacy, npm run gate:tokens and npm run test:e2e, and record
          the captured output in the phase work history.
