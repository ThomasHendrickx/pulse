  - id: M3-P2
    branch: claude/m3-p2-pdf-belfius
    intent: >-
      The PDF import path, foundation plus the first layout: a PDF
      text-extraction adapter behind the existing StatementParser port, the
      SourceProfileSpec widened to a discriminated union, code-owned layout
      templates selected by fingerprint, the balance contract as a hard
      per-file gate shared by every template, the Belfius current-account
      template end to end (upload through interpreted month), loud FAILED
      imports for unrecognised layouts and non-reconciling files, and
      synthetic fixtures.
    grounding: >-
      pulse-v0.2-pdf-addendum.md:18 (second adapter behind the port),
      :23 (code-owned layout templates selected by fingerprint, never by
      asking the user), :27 (unrecognised layout fails loudly), :35 (the
      balance contract), :50 through :69 (template A), :111 (fixture
      requirements). Owner feedback item 2 makes this the essential path.
      The one new runtime dependency this phase needs was a charter
      stop-for (charter.yaml:92), raised as DR-0020 and now DECIDED by the
      owner (2026-08-21, fleet decisions/DR-0020.yaml): pdfjs-dist,
      server side only, behind the parser adapter, exactly the scout's
      recorded recommendation (positioned text items support the
      deliberate line reconstruction the real KBC statement requires, no
      wrapper dependency). The dispatch gate is satisfied and the fill-in
      below is filled; the criteria were and are library-independent.
    severity: critical
    verified-root-cause: >-
      Not a defect phase. The verification-first step exists because two
      addendum claims failed verification: "second adapter, nothing
      upstream changes" fails against the delimited-only SourceProfileSpec
      (source-profile.ts:49) that types both port methods (ports.ts:18);
      and the addendum's Belfius natural key (account plus year plus
      sequence, pulse-v0.2-pdf-addendum.md:68) differs from the implemented
      key shape (dedup.ts:95) and its cross-statement continuity premise is
      unverifiable from the single real statement available.
    steps:
      - kind: verification-first
        text: >-
          Before building, confirm and write into the work history: (a) the
          spec seam, that SourceProfileSpec (source-profile.ts:49) types
          detect, parse, specEquals, hasNaturalKey, parseSourceProfileSpec
          and the fix-profile re-parse, and that the chosen widening (D-2, a
          kind discriminant with the existing delimited shape unchanged)
          leaves every stored profile Json readable, proven by a test that
          parses a spec captured in the e4ea3ba shape; (b) the natural-key
          wiring (D-4): the addendum's year-scoped key against the
          implemented statement-scoped mechanism (dedup.ts:95), recording
          how the Belfius template emits key components so re-importing an
          adjacent or re-exported statement cannot duplicate rows, and
          noting that cross-statement sequence continuity remains an
          assumption until a second real statement is observed.
      - text: >-
          Widen SourceProfileSpec to a discriminated union: kind
          "delimited" with the existing fields byte-for-byte, and kind
          "pdf-layout" carrying templateId and templateVersion.
          parseSourceProfileSpec, specEquals and hasNaturalKey branch on
          kind; every existing delimited test stays green unmodified.
          Recognised template profiles keep the ask-once account
          declaration exactly as is (upload-statement.ts:57); only the
          format question disappears (pulse-v0.2-pdf-addendum.md:27).
      - text: >-
          PDF text extraction behind a new adapter-internal port using the
          DR-0020 dependency, server side only: PDF magic-bytes sniffing in
          detect, then deliberate line reconstruction from positioned text
          items (group by y within tolerance, sort by x, explicit word-gap
          threshold), because the real KBC statement showed default library
          text assembly glues words (notes/export-format-facts.md). Same
          bytes always yield the same lines; no randomness, no environment
          dependence.
      - text: >-
          Template registry keyed by fingerprint: the Belfius template
          matches its header text plus a SALDO OP line
          (pulse-v0.2-pdf-addendum.md:50). A PDF matching no template fails
          the import loudly: FAILED import row, new machine reason
          "layout-unsupported" added to the ImportFailureReason union
          (ports.ts:38) and translated in all three catalogs, zero rows
          written. Non-PDF bytes flow down the delimited path untouched.
      - text: >-
          The Belfius template per addendum section 3 and the verified
          structure: skip the repeated per-page header block, skip annex
          pages whose body starts with the BIJLAGE marker, take opening and
          closing from the first and last SALDO OP lines, start a
          transaction at the 4-digit sequence plus DD-MM-YYYY plus VAL.
          pattern, join following indented lines into the description and
          keep the whole block verbatim as rawLine, accept every sign
          spacing and thousands-dot combination (the strict correlation the
          addendum implies does not hold on the real file), extract a
          counterparty IBAN from the description where present, and emit
          the account identity from the band-line IBAN. Emit natural-key
          components per the verification-first outcome (D-4).
      - text: >-
          The balance contract in the shared PDF parse path, not in the
          template: opening plus the sum of parsed transactions must equal
          closing in integer cents, or the import is FAILED with new reason
          "balance-mismatch" and nothing is written
          (pulse-v0.2-pdf-addendum.md:35). Every future template inherits
          the gate by construction.
      - text: >-
          Synthetic fixtures (D-3): a committed deterministic generator
          script produces a Belfius-style fixture PDF with invented IBAN,
          names and amounts reproducing variable sign spacing with and
          without thousands dot, multi-line descriptions, an annex page, a
          page break mid-transaction-list, one transaction on a
          TRANSACTION page whose description block contains the annex
          marker phrase as a description line (finding PR2-002: the real
          statement carries the bare marker token inside a description, so
          body-starts-with skipping must be distinguishable from
          marker-anywhere skipping), and reconciling balances; plus a
          second Belfius-style statement file with a different statement
          identity whose rows re-carry some of the first fixture's
          year-and-sequence pairs alongside genuinely new rows (a
          re-exported overlap, finding PR2-003); plus a deliberately
          non-reconciling variant; plus a valid PDF matching no template.
          Fixture bytes are stable across runs (fixed timestamps and
          metadata). No string from the real statements appears anywhere.
      - text: >-
          Wire the upload UI: the file input accepts PDF next to CSV
          (upload-form.tsx:22), the two new failure reasons render
          translated, and every catalog string that names accepted formats
          (the empty-state body, messages/en.json:29, and the import
          screen's field and hint copy) names PDF alongside CSV in all
          three languages (finding PR2-007). Extend the re-parse test:
          fix-profile over an ingested PDF import re-parses from
          rawContent with an unchanged spec as a strict no-op (zero key
          changes, zero row changes).
    files-to-touch:
      - package.json
      - package-lock.json
      - src/modules/import/domain/source-profile.ts
      - src/modules/import/domain/parse-statement.ts
      - src/modules/import/domain/dedup.ts
