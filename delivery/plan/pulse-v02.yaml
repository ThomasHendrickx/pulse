    migrations: >-
      none. The Account model already carries label, bank, role and an
      optional account number with a per-household uniqueness constraint
      (prisma/schema/accounts.prisma:10 through :31), so registration needs no
      new column, no new table and no enum change. Normalising a declaration
      on the way in and comparing canonically at read time is deliberately
      chosen over a data migration of stored values, which would be a
      rewrite of rows this plan does not need.
    conflicts-with:
