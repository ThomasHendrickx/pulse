  - id: M3-P13
    branch: claude/m3-p13-identity-on-review
    intent: >-
      The review screen says what it is grouping on and how far a naming will
      reach, now that a group is several transactions rather than one: every
      unresolved group states its basis in words, states how many
      transactions the naming will apply to, carries a label a person can
      recognise when the group has no descriptor to show, and lets the
      individual transactions behind it be seen, so that two purposes paid to
      one counterparty read as the thing DR-0027 accepted rather than as a
      mistake.
    grounding: >-
      DR-0027's accepted cost, stated in the decision itself: two different
      purposes paid to the same counterparty land in ONE group and separating
      them is a tag question rather than a merchant question. The owner's
      question that opened it, quoted in decision D-36, is a question about
      what a naming matches, so the screen has to answer it where the naming
      is made. The governing document is the pulse-frontend skill: section 5
      for the states this product must handle and its rule that a screen
      never hides an unknown
      (.claude/skills/pulse-frontend/SKILL.md:105), section 7 for the copy
      rules binding all three languages, section 8 for accessibility. This phase
      consumes M3-P12's counterpartyIdentity and adds no derivation of its
      own. Read at the baseline: the group row already renders its count
      (src/modules/merchants/ui/merchant-review.tsx:38 through :40) and
      already masks card numbers in the label only
      (src/modules/merchants/ui/merchant-review.tsx:36), so this phase adds
      the basis, the account-basis label and the rows behind a group, and
      nothing that already exists.
    severity: high
    verified-root-cause: >-
      Not a defect phase on its own. It exists because M3-P12 changes what a
      group IS, and a screen that shows a group of nine transactions under a
      label taken from one of them, with no statement of what joined them,
      would answer the owner's question wrongly in the other direction. Two
      concrete gaps at the baseline: an unresolved group's label IS the
      normalised descriptor (src/modules/merchants/domain/merchant-review.ts:88
      through :91, the assignment; the field is declared at :37 through :40),
      so an account-basis group has no label at all once the key
      stops being text, and the naming form submits the grouping string
      through a hidden input named counterpartyText
      (src/modules/merchants/ui/merchant-review.tsx:48,
      src/modules/merchants/ui/actions.ts:26), which has to carry the identity
      key instead or the naming writes a rule against a string nothing
      matches.
    steps:
      - kind: verification-first
        text: >-
          Re-read the screen against M3-P12's merged head rather than against
          this plan, since M3-P12 changes the shape ReviewGroup carries.
          Record what ReviewGroup actually exposes at that head (key, label,
          basis, count, the identity key the form submits), what the group row
          renders today, and whether M3-P8 has merged and therefore whether
          the row is the two-line phone row or the baseline row. Build on the
          recorded reading, not on this description of it.
      - text: >-
          State the basis on every unresolved group, in words a person reads
          rather than a code: the group is joined because the transactions
          share a counterparty account, or because they share a description.
          The copy is added to messages/en.json first as the source and
          translated into messages/nl.json and messages/fr.json in the same
          change, in the neutral register the pulse-frontend skill's section 7
          requires, and it never implies the reader did anything wrong.
      - text: >-
          Give an account-basis group a label a person can recognise, per
          decision D-41: the counterparty name where any row of the group
          carries one, and the counterparty account in masked display form
          otherwise. The mask is applied in the display layer only, beside
          the existing card-number mask (src/platform/ui/mask-card-number.ts),
          and never in the key: a masked key would produce a stored rule that
          can never match a second transaction, which is exactly the hazard
          src/modules/merchants/domain/normalise-counterparty.ts:84 through
          :88 already names.
      - text: >-
          Say how far the naming reaches, using the count the group already
          carries: the form states, before it is submitted, how many
          transactions of this month the naming will apply to right now. That
          is a fact computed from the rows and never a prediction, and it is
          the direct answer to the owner's question at the place the question
          is asked.
      - text: >-
          Let the transactions behind a group be seen, so a group holding two
          purposes reads as two lines the owner can point at rather than as
          one opaque total. Each line shows that transaction's own booking
          date, its own amount through the mandatory money rendering the
          pulse-frontend skill fixes, and its own description. No new client
          component and no new server action: the rows come from the same read
          that builds the groups.
      - text: >-
          Keep the whole screen on tokens: no literal colour, font size or
          spacing value is added, and any value that has no token gets one in
          styles/tokens.css first (CLAUDE.md non-negotiable 4).
      - text: >-
          Run the full gate in the worktree with pinned local database
          credentials per the fleet environment warnings: npm run typecheck,
          npm run lint, npm test, npm run gate:privacy, then npm run test:e2e.
    files-to-touch:
      - src/modules/merchants/ui/merchant-review.tsx
      - src/modules/merchants/ui/actions.ts
      - src/modules/merchants/domain/merchant-review.ts
      - src/modules/merchants/application/merchant-review.ts
      - src/modules/merchants/adapters/merchant-repository.ts
      - src/platform/ui/
      - src/app/globals.css
      - styles/tokens.css
      - messages/en.json
      - messages/nl.json
      - messages/fr.json
      - test/e2e/
      - test/domain/
    extras: []
    acceptance:
      - id: "13.1"
        criterion: >-
          npm run test:e2e exits 0 with a spec that loads /merchants for a
