      - id: "7.14"
        criterion: >-
          ADDED in the M0-P3 fix round to close finding MPR-001, which was
          critical and correct: the two-line row is the one structural change
          this phase exists to make, step 5 is the only place it appeared,
          and nothing measured it. An implementer could pad five controls,
          move the panel up, stack the cards, add the tokens, the one media
