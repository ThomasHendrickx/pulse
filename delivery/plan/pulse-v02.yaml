        addressed-by: criterion 10.9
      - id: H10.10
        statement: >-
          The copy gate is widened to a glob that matches nothing, or to one
          that matches the new files but is never proved to fire, so M3-P11
          puts an English sentence into the toast and the gate the owner was
          told about stays green.
        addressed-by: criterion 10.11
      - id: H10.11
        statement: >-
          ADDED in the M0-P4 fix round (finding ADV-M0P4-01, critical). The
          interval is satisfied by a mutation the press did not cause and
          the reader cannot see. One line in the leaf's click handler
          setting a data attribute on document.body, rendering nothing,
          turned the first version of criterion 10.2 green on all seven
          controls with the screen dead, because the observer watched the
          whole document and accepted the first record from any source.
        addressed-by: criterion 10.2
      - id: H10.12
        statement: >-
          ADDED in the M0-P4 fix round (finding ADV-M0P4-04). Every interval
          figure is measured against a development server whose behaviour
          differs from the owner's build in exactly the dimension the
          navigation criterion turns on, so the phase proves a pending state
