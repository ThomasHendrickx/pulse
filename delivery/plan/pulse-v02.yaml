          entry on the mockup's own tap targets.
      - id: "7.6"
        criterion: >-
          REWRITTEN in the M0-P3 fix round (finding MPR-002), which found two
          escape hatches: .visually-hidden is width 1px by height 1px
          (src/app/globals.css:548 through :556), so its bounding rect is
          already non-zero and the exemption protected nothing while
          licensing the class as a way to hide a figure; and deleting a
          data-testid removed an element from both collections at once.
          A spec loads the SAME seeded month twice, at 1280 by 720 and at 390
          by 844, and at each width collects every element carrying a
          data-testid as the pair of its testid and its trimmed textContent,
          sorted; the two collections are deeply equal. At 390 by 844 EVERY
          collected element, with no exemption for any class, has a bounding
          rect whose width and height are both greater than zero. THE FLOOR LIST WAS
          EXTENDED in the second M0-P3 fix round (finding MPR-019): the first
          version named ten testids, omitted the four reconciliation cause
          blocks that hazard H7.2 names in its own text, and ended in a
          self-referential clause that a both-widths deletion satisfied
          vacuously. The collected testid set at 390 by 844 contains at least
          month-title, in-progress-badge, month-meta, compare-head,
          compare-na or the comparison figures the dataset implies,
          pot-change, recon-panel, recon-verdict, spend-delta, group-label,
          income-total, spend-total, reserves-net; recon-difference,
          unresolved-pill, month-no-rows and no-reserves wherever the dataset
          renders them; the four cause blocks recon-cause-uninterpreted,
          recon-cause-unmatched, recon-cause-in-transit and
          recon-cause-unresolved wherever the dataset renders them; and every
          group-total and group-delta. The general rule that list stands in
          for, which is what makes the self-referential clause unnecessary:
          grep for data-testid over src/modules/overview/ui/ at this phase's
          BASE and at its head returns the same set of testid values, so no
          testid that existed before the rebuild is absent after it. No
          element inside main has computed display none or visibility hidden,
          or carries the visually-hidden class, at 390 by 844 unless it also
          does at 1280 by 720. FALSIFIED BY a testid present at one width and
          absent at the other, by any differing text, by any zero-sized
          element, by a missing testid from that list, by a testid present at
          the base and absent at the head, or by any element hidden at one
          width and not the other.
      - id: "7.7"
        criterion: >-
          REWRITTEN in the M0-P3 fix round (finding MPR-003), which found the
          sweep both unsatisfiable and blind. Unsatisfiable: .visually-hidden
          combines width 1px with white-space nowrap and overflow hidden
          (src/app/globals.css:548 through :556), so every such element is an
