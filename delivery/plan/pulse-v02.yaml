  - id: M3-P6
    branch: claude/m3-p6-card-merchant-grouping
    intent: >-
      Restore merchant grouping for card rows, whose descriptors embed the
      transaction's own date, amount, card number and holder name so every
      payment becomes its own group, and mask the card number in the
      display layer only. Rules only, no LLM: the merchants normaliser
      learns the card-descriptor grammar, the merchant-source rule stops
      being duplicated, and the stored-rule stability contract is
      discharged rather than tripped.
    grounding: >-
      Owner's first deployed use of the Belfius PDF import (2026-08-21,
      fleet backlog): the parse is correct and two defects surfaced.
      Re-measured by the scout in-container through the shipped pipeline,
      counts only: 39 rows, 15 card-payment rows, none carrying
      counterpartyName, 15 distinct grouping keys after the shipped
      normaliser (src/modules/ledger/application/interpret-window.ts:87
      picks counterpartyName ?? description; none of the normaliser's
      terminal-noise, masked-PAN, city or date patterns matches this
      descriptor grammar), and 15 of 15 normalised descriptors still
      carrying the full 16-digit card number that both label surfaces
      render. The same merchant-source rule is duplicated at
      src/modules/merchants/domain/merchant-review.ts:50. Two stability
      contracts bound this phase: the merchants recipe contract
      (normalise-counterparty.ts:16, finding CR-402) and the frozen dedup
      recipe one module over (dedup.ts:18), which this phase must not
      touch.
    severity: high
    verified-root-cause: >-
      Measured, not inferred. Card payments have no counterparty account,
      so the merchant key is the entire descriptor, and the descriptor
      embeds per-transaction values (date, amount, card number, holder),
      which makes every payment unique. The shipped normaliser reduces to
      uppercase plus whitespace collapse on this shape, so it removes none
      of that variance. The verification-first step exists because three
      claims did not survive verification as stated: the count of real
      merchants behind the card rows, the multiplicity of card numbers in
      the file, and the premise that production holds no MerchantRule rows
      (unanswerable from the repository, and it selects which branch of
      the CR-402 contract this phase must ship).
    steps:
      - kind: verification-first
        text: >-
          Before changing the recipe, establish and write into the work
          history: (a) the number of MerchantRule rows the deployed
          database holds, measured with a read-only count over a
          connection string pinned explicitly to the pulse deployed
          project's session pooler (never the ambient DATABASE_URL, fleet
          warnings 1 and 5), and the branch it selects under the CR-402
          contract, zero rows meaning no stored patterns exist to
          re-normalise and any nonzero count meaning the one-off
          re-normalisation of stored EXACT and PREFIX patterns ships in
          this same change; (b) the pre-change grouping measurement on the
          committed synthetic card fixture (distinct keys per merchant),
          so the after-measurement in criterion 6.1 has a recorded before;
          (c) that the real statement's merchant count is not the number
          any criterion asserts, since every criterion runs on synthetic
          fixtures with invented values; (d) the PREDICATE that defines a
          card row, written down explicitly, together with the count of
          rows carrying each card-tail shape and the count of non-card
          rows carrying a long structured reference, because this plan's
          own first pass recorded counts whose predicate was implicit and
          two sub-claims did not survive an independent re-measurement
          (finding PR3-003).
      - text: >-
          Unify the merchant source: one exported helper is the single
          definition of which text a transaction resolves under, and both
          call sites use it (src/modules/ledger/application/
          interpret-window.ts:87 and src/modules/merchants/domain/
          merchant-review.ts:50). The rule itself stays counterpartyName
          ?? description, per decision D-11.
      - text: >-
          Teach the merchants normaliser the card-descriptor grammar,
          word-bounded patterns only, no LLM anywhere (Claude API is bound
          to slice 5 onward, charter.yaml:41): strip the payment-rail
          prefix, the embedded transaction date in its bare day-and-month
          shape, the trailing amount plus currency, the card-number tail
          in every observed shape (full grouped and partially masked,
          finding PR3-002) together with the holder name that follows it,
          where the partially-masked pattern is anchored to the CARD-TAIL
          GRAMMAR, the tail's position after the card-number label and the
          holder text that follows it, and never to the presence of an
          X-masked token alone, because X-masked tokens occur in 11
          non-card descriptors in the real statement and the strip must
          not touch those rows (finding PR4-002),
          and the country marker that Belfius emits as real text, whose
          pattern is anchored to the ANGLE-bracket shape specifically and
          never to bracketing in general, because the parenthesised
          value-date token on every transaction start line is bracketed
          too and the Belfius template depends on it (finding PR3-003).
          No pattern keys on digit-run length alone: five non-card rows in
          the real statement carry long structured references. Each
          added pattern is grounded in a committed synthetic fixture, and
          none may consume a merchant name from the middle of a word.
      - text: >-
          Discharge the CR-402 stability contract in the same change:
          update the pinned regression table
          (test/domain/normalise-counterparty.test.ts:119) so an
          accidental future change still reddens, and ship the branch step
          1 selected, either the one-off re-normalisation of stored EXACT
          and PREFIX MerchantRule patterns (the pipeline is idempotent
          over its own output) or the recorded decision to version the
          recipe.
      - text: >-
          Display-layer masking: one helper masks a card-number run to its
          last four digits, applied where the descriptor is RENDERED, on
          the month view group label
          (src/modules/overview/ui/month-view.tsx:78) and the merchant
          review group label (src/modules/merchants/ui/
          merchant-review.tsx:29). It is applied nowhere else: never to
          rawLine, which stays verbatim because facts are immutable
          (prisma/schema/import.prisma:106), never to the normalised key,
          and never to the hidden counterpartyText value the review form
          submits (merchant-review.tsx:42), because that value becomes the
          EXACT rule subject (assign-merchant.ts:54) and a masked subject
          would match nothing (decision D-12).
      - text: >-
          Synthetic fixtures only, invented values in the real grammar:
          several card rows of ONE merchant spread across two months with
          differing dates and amounts, carrying the card tail in BOTH
          observed shapes, full grouped on some rows and partially masked
          ending in four digits on others (finding PR3-002); two DISTINCT
          merchants sharing a chain prefix and a city, the over-stripping
          witness; a row whose descriptor carries a full card-number run
          PRINTED IN THE GROUPED FOUR-BY-FOUR FORM WITH SEPARATORS, which
          is the form the real statement prints and the form criterion
          6.3's separator-insensitive test exists for (finding PR3-001); a
          row carrying a legitimate long structured reference that is not
          a card number and must survive the strip; and a non-card control
          row that must be unaffected, carrying an X-masked token followed
          by holder-like text and NO card-number label, which is the shape
          8 of the 11 real non-card X-token descriptors have (finding
          PR5-003), so a partially-masked pattern anchored on the holder
          text alone fires on it and fails. Real statement content is
          never committed.
    files-to-touch:
      - src/modules/merchants/domain/normalise-counterparty.ts
      - src/modules/merchants/domain/merchant-review.ts
      - src/modules/merchants/ui/merchant-review.tsx
      - src/modules/ledger/application/interpret-window.ts
      - src/modules/overview/ui/month-view.tsx
      - src/platform/ui/ (the display-only masking helper)
      - test/domain/normalise-counterparty.test.ts
      - test/domain/merchant-review.test.ts
      - test/fixtures/
      - test/e2e/merchants.spec.ts
    extras:
      - src/app/globals.css
      - src/modules/import/ui/profile-confirmation.tsx
      - src/modules/overview/adapters/overview-repository.ts
    acceptance:
      - id: "6.1"
        criterion: >-
          npm test exits 0 with a grouping test over the synthetic card
          fixture asserting that the several rows of the one fixture
          merchant, differing in date and amount across two months AND
          carrying the card tail in BOTH observed shapes, a full grouped
          number on some rows and a partially masked tail ending in four
          digits on others (finding PR3-002), produce exactly ONE distinct
          normalised key and exactly one review group, where the same test
          pinned against the pre-change recipe produces one key per row;
          the work history records both numbers. A separate row in the
          same fixture carries a legitimate long structured reference that
          is NOT a card number, 13 to 19 digits long, the length the real
          statement carries (measured: 13-digit and 15-digit references,
          and 20 of 39 real descriptors fall inside that window while only
          15 are card rows), so it exercises criterion 6.3's named
          exception rather than dodging the sweep by being shorter
          (finding PR4-001); and the test asserts that reference survives
          in its key, so the strip stays anchored to the card-tail grammar
          rather than to any long digit run; and the test asserts that the
          non-card control row's key, an X-masked token followed by
          holder-like text with NO card-number label, is UNCHANGED by the
          strip, which is what witnesses step 3's anchor and fails an
          implementation that keys the masked-tail pattern on the holder
          text alone (finding PR5-003; measured, the card-number label
          occurs in 15 of 15 card descriptors and 0 of the 11 X-token
          descriptors, while holder-like text follows the token in 8 of
          those 11 as well).
      - id: "6.2"
        criterion: >-
          npm test exits 0 with an over-stripping test asserting the two
          distinct fixture merchants that share a chain prefix and a city
          normalise to two DIFFERENT keys and stay two review groups, so a
          strip that swallows the distinguishing token fails.
      - id: "6.3"
        criterion: >-
          Both halves use the SAME separator-insensitive test, where a
          card-number run is 13 to 19 consecutive digits after spaces,
          dots and dashes are REMOVED (finding PR3-001: the real statement
          carries the number grouped four by four, the extractor's own gap
          rule inserts those spaces and the normaliser collapses
          whitespace rather than removing it, so a contiguous-16-digit
          regex matches nothing and cannot fail; measured through the
          shipped pipeline, contiguous runs in the parsed descriptors: 0,
          separator-insensitive runs: every card row). npm test exits 0
          with tests asserting, under that separator-insensitive test,
          that (a) no normalised key produced from the card fixture and no
          rendered group label contains the fixture's INVENTED CARD NUMBER
          exactly, and (b) no key or label contains ANY 13-to-19-digit run
          except the key AND the rendered label of the single row
          criterion 6.1 declares as carrying a legitimate structured
          reference, which this test names explicitly as its one permitted
          exception, the key and the label being the SAME STRING for an
          unresolved group (src/modules/merchants/domain/
          merchant-review.ts:86 and src/modules/overview/domain/
          month-projection.ts:83 both set the label to the normalised text
          that is the key), so the exception must cover both or the
          criterion is satisfiable only by the accident of that row
          happening to be resolved in the scenario (finding PR5-002); and
          that the
          display helper renders such a run masked to its last four
          digits. npm run test:e2e exits 0 with the merchant review and
          month view specs asserting the same two sweeps over rendered
          group labels. The exact sweep and the named exception exist
          because the general sweep alone contradicted 6.1 (finding
          PR4-001): measured over the real statement, every structured
          reference is 13 or 15 digits and 5 non-card descriptors fall
          inside the 13-to-19 window, so a faithful fixture reference
          cannot avoid it and the only way to satisfy both criteria
          without this exception is a sub-13-digit reference, which would
          disarm the guard criterion 6.1 exists to provide.
      - id: "6.4"
        criterion: >-
          npm test exits 0 with a round-trip test: the value the review
          form submits for a card group is the UNMASKED normalised text,
          assigning a merchant from it writes an EXACT rule whose pattern
          equals that text, and re-running resolution over the fixture
          resolves every row of that merchant, including a row from the
          other month that was not the one named.
      - id: "6.5"
        criterion: >-
