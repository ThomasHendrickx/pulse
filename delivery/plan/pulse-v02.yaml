          group-label's trimmed textContent is character for character the
          label that fixture defines for that group, and contains no
          horizontal-ellipsis character and no trailing run of full stops.
          The failure message names each offender by its testid or its first
          40 characters of text and says which axis overflowed. FALSIFIED BY
          a non-empty list on either axis, by any line-clamp or box-orient
          declaration, by a second text-overflow, or by a rendered label
          shorter than the fixture's, which is truncation performed before
          render and is what decision D-17 forbids.
      - id: "7.8"
        criterion: >-
          REWRITTEN in the M0-P3 fix round (finding MPR-004): 844 is the
          device height of the mockup frame, not the fold. Playwright renders
          no browser chrome, so a verdict placed at a top of about 790 landed
          inside 844 and below the fold on the owner's actual phone, and the
