  - item: >-
      Optimism on the six surfaces that are pending-only: the statement
      upload, the preview, the import confirmation, sign in, sign up and sign
      out, and the seven navigating controls.
    reason: >-
      Decision D-31, and it is a limit on DR-0025 rather than a departure
      from it: the owner decided the default, not that every surface must
      predict regardless of what it would have to invent. Each of these
      results is a parse, an ingest, an interpretation or a session, produced
      by the server from input the browser has not seen, and a prediction
      there would be a made-up figure on a finance screen. They get the
      acknowledgement layer M3-P10 builds and nothing more, and criterion
      10.10 fails M3-P10 if any of them changes anything on screen before the
      server answers. Revisit only if a surface acquires a result the client
      genuinely holds.
  - item: >-
      A shared toast host serving every surface, rather than one host per
      failing row.
    reason: >-
      Decision D-32. A shared host needs state above the rows, which needs a
      provider, which makes the rows' parent a client component and ships the
      merchant review's list to the browser to hold one string. Two
      simultaneous failures would overlap under the per-row arrangement,
      which at the failure rate the owner estimated is a cosmetic risk rather
      than a correctness one. Build the shared host when a second surface
      needs a notice, and let that phase pay the boundary knowingly.
  - item: >-
      A visible failure for a reader with JavaScript disabled, when a naming
      fails.
    reason: >-
      M3-P11 makes the naming action return its Result so the client can show
      the toast DR-0026 decided. Without JavaScript the form still posts and
      the failure stays silent, which is NOT a regression: it is silent today
      for everyone, because the action redirects to a status
      (src/modules/merchants/ui/actions.ts:32) that the route never reads
      (src/app/(app)/merchants/page.tsx:7 through :10). Making it visible
      without JavaScript means rendering that status on the screen, which is
      a second copy of the same message in a second mechanism, and it is
      recorded here rather than built so the limit is known rather than
      discovered.
  - item: >-
      Widening the hardcoded-string ESLint glob to src/app/**/*.tsx.
    reason: >-
      Decision D-33. Measured at 89ed187: the widening fails at the base on
      exactly one line, the brand word at src/app/(app)/layout.tsx:43, which
      is a proper noun and not translatable copy. Closing that half means
      deciding how a brand name is exempted from a copy rule, which is a copy
      question rather than an interaction-feedback one. M3-P10 widens the
      glob to src/platform/ui/**/*.tsx, where this round's new components
      live, and leaves this half here with the line that causes it.
  - item: >-
      A polite announcement that an action is RUNNING, for a reader who is
      not looking at the control.
    reason: >-
      Decision D-27. Between M3-P10 and M3-P11 the busy state is a visual
      mark plus aria-busy, which is supported unevenly by screen readers, so
      a non-visual reader gets a non-pressable control and not the word busy.
      M3-P11 raises an ASSERTIVE announcement when an action FAILS, which is
      what DR-0026 decided; a polite one for the running state is more copy
      in three languages for a state the owner has not asked to hear.
      Recorded so the gap is visible rather than discovered by the reader who
      needs it.
  - item: >-
      Guarding the product's five hover rules with an @media (hover: hover)
      condition, so a hover state does not stick after a tap on a touch
      device.
    reason: >-
      Decision D-29. Measured at 89ed187: four hover rules in
      src/app/globals.css (:192, :243, :701, :758) and a fifth at
      styles/tokens.css:201, none of them guarded. On the owner's phone a
      tapped control keeps its hover appearance until something else is
      touched, which reads as a control that stayed pressed, so it is adjacent
      to this complaint rather than unrelated. Not folded into M3-P9 for two
      reasons: the fix is a third media condition and decision D-24 has just
      set the budget at two, and criterion 9.2 measures the pressed
      appearance against the HOVERING state as its baseline, so changing the
      hover rules in the same phase moves the baseline under the measurement
      that depends on it. Its own phase, after M3-P10, if the owner sees it.
  - item: >-
      A busy or pressed state on the recompute action
      (src/modules/ledger/ui/actions.ts:15).
    reason: >-
      Nothing renders it. The action is exported and no file in src/ imports
      it, and its own comment (src/modules/ledger/ui/actions.ts:3 through :8)
      says the dev-only screen that would carry its button has not been
      built. Recorded because the dispatch that opened this round named its
      file among the server actions behind the six surfaces, and a phase told
      to cover every server action would otherwise spend time looking for a
      control that does not exist.
  - item: >-
      Dispatch M0-P4 acceptance criterion 6, which required DR-0025 to appear
      in open-questions undecided and required no acceptance criterion to
      depend on its answer.
    reason: >-
      SUPERSEDED, and recorded here rather than left for a later reader to
      find as a contradiction (finding ADV-M0P4-13). The owner decided
      DR-0025 and DR-0026 in session on 2026-08-23, after the dispatch was
      written and while this round was being written. A decided question is
      not an open question, so DR-0025 is deliberately ABSENT from
      open-questions and is recorded as decisions D-30, D-31 and D-32
      instead, and criteria 10.6(d), 10.10, 11.2, 11.3, 11.4 and 11.5 depend
      on the decided answer by design. The dispatch's hazard H3, that DR-0025
      is decided silently, is answered by those three decision entries rather
      than by that criterion. A phase review evaluating M0-P4 against its own
      dispatch should mark criterion 6 SUPERSEDED and read this entry, not
      mark it met.
  - item: >-
      Letting the import confirmation bind a file that carries no account
      number to an account the household has already registered, instead of
      always declaring a new one.
    reason: >-
      This is the only shape in which a card could be registered before its
      first statement is imported, and decision D-48 rejects it for this round
      rather than dismissing it. Today the branch that resolves such a file
      reads the account off a spec-identical stored profile
      (src/modules/import/application/confirm-import.ts:89 through :91) and
      falls through to a fresh declaration when there is none, so binding
      would mean a new control on the confirmation screen, a new rejected
      state when the chosen account already has a different profile bound, and
      a decision about what happens when the household picks the wrong
      account, which is unrecoverable without the ring correction M3-P15
      builds. Parked because the cost of not having it is bounded and stated
      (criterion 14.6 measures it) and because M3-P15 is what makes a wrong
      binding recoverable. Revisit after M3-P15 merges.
