          The border box is the denominator because the row's own padding
          sits inside the content box and outside the border box, so padding
          the row out no longer moves the number the ratio is taken against;
          and the absolute floors are there because a percentage of anything
          is satisfiable by making everything narrower one level up, which is
          what raising .app-main's padding would do to the border box itself.
