  - id: M3-P11
    branch: claude/m3-p11-optimistic-naming
    intent: >-
      The naming action predicts its result, as DR-0025 decided: the row shows
      the typed name the moment it is submitted and shows it MARKED as
      unconfirmed, no figure on the screen moves until the server answers, a
      failure puts the row back and says so in a hand-built toast carrying
      catalogue copy in the reader's own language (DR-0026), and a server
      answer that differs from the prediction is shown on the row rather than
      swapped in silently.
    grounding: >-
      DR-0025 (owner, 2026-08-23): optimistic, revert loudly on failure, in
      the owner's own framing about 9999 predictions in 10000 and a visible
      failure the other time. DR-0026 (owner, 2026-08-23): the failure is
      told by a toast with a user-friendly message, built by hand because
      CLAUDE.md scope discipline forbids a component library. Both records
      live in the fleet decisions directory and both are DECIDED; decisions
      D-30, D-31 and D-32 record what they mean for this plan. Read at
      89ed187 and recorded with captured output in this phase's
      report-code-disagreement entries: the naming action moves no money
      figure in the case the committed journey covers
      (test/e2e/merchants.spec.ts:70 and :78 through :81) and DOES move one
      when it merges into an existing merchant
      (src/modules/merchants/application/assign-merchant.ts:58 through :60);
      the stored name is trimmed (assign-merchant.ts:50), which is the
      deterministic case where the server's answer differs from the
      prediction without failing; the review's sort breaks ties on the label
      (src/modules/merchants/domain/merchant-review.ts:57 through :67), so a
      label change alone can reorder; and a failed naming is SILENT today,
      because the action redirects with a status
      (src/modules/merchants/ui/actions.ts:31 through :33) that the route
      never reads (src/app/(app)/merchants/page.tsx:7 through :10). The
      governing documents are .claude/skills/pulse-frontend/SKILL.md section
      5 for the states this product must handle and its rule that a screen
      never hides an unknown (SKILL.md:105), section 7 for the copy rules
      that bind the toast's wording (SKILL.md:117 through :127: English is
      the source, Dutch and French are translations, neutral register, never
      imply the reader did badly), and section 8 for accessibility basics
      (SKILL.md:133). This phase consumes M3-P9's tokens and busy vocabulary
      and M3-P10's submit leaf and widened copy gate, and it is grounded at
      89ed187 rather than at this plan's baseline-commit e4ea3ba.
    severity: high
    verified-root-cause: >-
      Not a defect phase. DR-0025 changed what this product's screens are
      supposed to do, and the naming action is the one surface in the product
      whose result can be predicted without inventing a figure. The parts
      that do not exist yet: there is no prediction anywhere, there is no
      failure surface at all (a failed naming redirects to a status nothing
      reads), and there is no notice component and no catalogue entry for
      one.
    steps:
      - kind: verification-first
        text: >-
          Before editing, settle the seven things this plan records against
          this phase and write each answer into the phase work history with
          the command and its captured output beside it. (a) Re-run
          test/e2e/merchants.spec.ts and record that the two direction totals
          are byte identical across the naming, so the claim the prediction
          rests on is measured on this phase's base and not inherited.
          (b) Drive a naming into an EXISTING merchant name and record what
          the screen does: whether the two groups merge, what the merged
          total is against the two originals, and where the merged row
          lands. This is the case the prediction must not cover and the phase
          must have seen it. (c) Drive a naming whose input carries
          surrounding whitespace and record the confirmed label, which is the
          input criterion 11.5 uses. (d) Submit a whitespace-only name on the
          shipped screen and record what the reader sees today, which this
          plan says is nothing at all. (e) Confirm that a server action
          returning a Result can be awaited from a client action wrapper and
          that a rejected or failing action reaches the client, captured; and
          settle WHICH transport failure the spec will use. EXTENDED in the
          M0-P4 fix round (finding ADV-M0P4-09): this was the one mechanism
          question in three phases with no branch for the answer being no,
          and criterion 11.4 depends on it. Try the route handler fulfilling
          the action's request with a 500 first. If that does not reach the
          client wrapper and surfaces as a framework error page instead,
          record the captured evidence and use the second admissible form
          instead: the route handler ABORTS the action's request, which a
          client wrapper awaiting the action observes as a rejection. If
          NEITHER reaches the wrapper, STOP AND SAY SO rather than adding a
          test-only failure path to product code. Name the form chosen in the
          phase work history, because criterion 11.4 reads it from there.
          (f) Confirm that M3-P10's widened copy gate actually fires on a
          bare literal placed in this phase's own new component, captured,
          because this phase is the first to put catalogue copy through it.
          (g) Confirm, from the browser's own accessibility snapshot rather
          than by assertion, that a row carrying data-unconfirmed with an
          aria-describedby description exposes that description, and that it
          does NOT expose it when aria-busy is set on the same row, which is
          the observation finding ADV-M0P4-10 rests on and which this phase
          should see for itself before building on it.
      - text: >-
          Make the naming action REPORT its outcome instead of redirecting a
          failure into a status nothing reads. src/modules/merchants/ui/actions.ts
          returns a Result the client wrapper can read; the success path
          keeps its revalidate and its redirect exactly as they are. Touch
          nothing under src/modules/merchants/application/ or /domain/:
          assignMerchant already returns a Result
          (src/modules/merchants/application/assign-merchant.ts:49) and the
          action is discarding it, so this is a change to the ui layer alone
          and criterion 11.8 pins the other two layers to an empty diff.
          Record the honest limit rather than hiding it: without JavaScript
          the form still posts and the failure stays as silent as it is
          today, which is not a regression and is parked with the reason.
      - text: >-
          Add ONE client leaf under src/modules/merchants/ui/ that owns a
          single group row's label and naming form and predicts with React's
          useOptimistic. It belongs to the module and not to src/platform/ui
          because it knows what a merchant group is, which is the placement
          test at .claude/skills/pulse-frontend/SKILL.md:60. It takes every
          string it renders as a prop from the server component, the
          already-masked label and the toast's wording included, so it
          imports no message catalog and criterion 11.7 fails the phase if it
          does. It may import from src/platform/ui/ and from nowhere else.
          THE ROW GAINS A DOM IDENTITY THE PREDICTION DOES NOT CHANGE, added
          in the M0-P4 fix round (finding ADV-M0P4-03) and MASKED in fix
          round 2 (finding DELTA-M0P4-08): the li element carries
          data-group-key={maskCardNumbers(group.key)}, the same masking the
          label beside it already applies
          (src/modules/merchants/ui/merchant-review.tsx:35), because for an
          unresolved group that key IS the raw normalised descriptor
          (src/modules/merchants/domain/merchant-review.ts:80, key =
          merchantId ?? normalised) and an unmasked copy of it in an
          attribute would reach spec failure messages and retained traces
          (playwright.config.ts sets trace retain-on-failure) for no gain,
          since criterion 11.3 only ever compares the sequence to itself. The
          value is otherwise the one already passed as the React key at
          src/modules/merchants/ui/merchant-review.tsx:94 and therefore
          already computed, so criterion 11.3's order half has something to
          compare that the naming does not rewrite. Without it
          the only identities a row has are its data-testid
          (merchant-review.tsx:28) and its group-label text
          (merchant-review.tsx:35), and criterion 11.2 requires the
          prediction to change both.
      - text: >-
          THE PREDICTION CONTRACT, which decision D-31 states in full and
          this step builds. Predicted: the row's label becomes the string the
          reader typed, taken straight from the submitted form value with no
          rule applied to it, and the row leaves the unresolved treatment.
          NOT predicted, and each for a stated reason: the group's own total
          and the two direction totals, because a naming that merges into an
          existing merchant sums two totals
          (src/modules/merchants/application/assign-merchant.ts:58 through
          :60) and predicting that means running a domain rule in the
          browser; the unresolved count, because it is a projection over the
          whole household and not a property of the row; the row's position,
          because the order is a domain sort
          (src/modules/merchants/domain/merchant-review.ts:57 through :67);
          and the merge itself. A predicted label is shown MARKED as
          unconfirmed until the server's answer arrives, and the marking has
          TWO parts because one of them only works for a reader who is
          looking (finding ADV-M0P4-10). The visual part is data-unconfirmed
          on the row, which M3-P9's state vocabulary draws. The non-visual
          part is the fourth catalogue key rendered inside a POLITE LIVE
          REGION, role="status", within the row, so that it is ANNOUNCED when
          it appears, AND referenced by aria-describedby from the naming
          submit control inside that row, which is where focus sits when the
          prediction lands, so a reader who moves focus back to it is told
          again. Both halves, and the live region was added in fix round 2
          (finding DELTA-M0P4-04): visually-hidden text alone sits on a
          non-focusable li (src/modules/merchants/ui/merchant-review.tsx:26)
          that nothing focuses or traverses at that moment, so it is present
          and unheard, which is the same shape of error as the aria-busy it
          replaced. A polite region and not an assertive one, because a
          prediction is not a failure; the assertive role belongs to the
          toast (decision D-32). aria-busy is NOT used on the row, on the
          group-label or on the region and must not be: it tells assistive
          technology to hold back the changes inside the element, so it would
          suppress the announcement of the very change it marks. It stays
          where M3-P10 put it, on the SUBMIT CONTROL, which is a descendant
          of the row (merchant-review.tsx:60) and where criterion 10.3
          requires it; there it scopes to its own label and does no harm.
          With both parts present, no reader has to guess whether a value on
          a finance screen has been stored.
      - text: >-
          Build the toast by hand, per DR-0026, as one presentational client
          component under src/platform/ui/ that knows nothing about
          merchants: a fixed region anchored to the bottom of the viewport,
          its message text arriving as a prop, a real dismiss button that
          clears the tap-target minimum M3-P7 established and carries the
          pressed appearance M3-P9 shipped, and a live region. THE LIVE
          REGION IS PART OF THE MECHANISM AND NOT A POLISH: a failure is
          announced assertively (role="alert") and a non-failing difference
          is announced politely (role="status"), because a reader who is not
          looking at the corner of the screen is exactly the reader this
          decision exists to protect. THE FAILURE NOTICE HAS NO TIMER: it
          stays until the reader dismisses it, which decision D-32 records
          the reasoning for. Its entrance uses --duration-state, so the
          reduced-motion block M3-P9 added makes it appear at once instead of
          sliding, with no separate rule to remember. Its rules go in
          src/app/globals.css using M3-P9's tokens and adding no literal,
          which criterion 11.9 measures the same way M3-P8's criterion 8.9
          does.
      - text: >-
          Add the copy, in English first and then Dutch and French, per
          .claude/skills/pulse-frontend/SKILL.md:117. At most FOUR new keys,
          raised from three in the M0-P4 fix round (finding ADV-M0P4-10, and
          decision D-27 as amended): the failure message, the dismiss
          control's accessible label, the notice that the saved name differs
          from the one typed, and the unconfirmed marking's accessible text.
          The fourth exists because the round's own copy cap was the only
          thing standing between a non-visual reader and the same
          information a sighted one gets, which is not a trade this plan is
          willing to make in a finance product. The
          wording follows this product's copy rules and is checked against
          them rather than written freely: neutral register, no apology, no
          implication that the reader did something wrong, no error code and
          no exception text, and it says what happened and what the product
          did about it. Domain-named keys, not screen-positional ones.
      - text: >-
          Write the measurements as a Playwright spec registered under the
          chromium-phone-prod project and the desktop project M3-P10 adds,
          which are the two criterion 11.2 names, and NOT under
          chromium-phone: decision D-34 moves the prediction and failure
          measurements to the production build, and running them in
          development as well buys nothing criterion 10.5(c) does not already
          record, while costing a third pass of a spec that itself drives en,
          nl and fr (finding DELTA-M0P4-09). It drives the forced-failure
          journey end to end in each of the three languages rather than
          asserting that a toast component exists.
    files-to-touch:
      - src/modules/merchants/ui/merchant-review.tsx
      - src/modules/merchants/ui/actions.ts
      - src/modules/merchants/ui/ (one new client leaf for the predicted row)
      - src/platform/ui/ (the hand-built toast)
      - src/app/globals.css
      - messages/en.json
      - messages/nl.json
      - messages/fr.json
      - playwright.config.ts
      - test/e2e/ (one new spec, criterion 11.8 pins the phase to exactly one)
    extras: []
    acceptance:
      - id: "11.1"
        criterion: >-
          The phase work history records an answer to each of the SEVEN
          verification-first questions with the command and its captured
          output beside it: the re-run showing both direction totals byte
          identical across a naming, the observed behaviour of a naming into
          an existing merchant name including the merged total against the
          two originals, the confirmed label for a name typed with
          surrounding whitespace, what the reader sees today when a naming
          fails, the captured evidence of WHICH transport failure reaches
          the client wrapper, the captured evidence that the widened copy
          gate fires on a bare literal in this phase's own component, and
          (g) THE ANNOUNCEMENT, not the tree. REWRITTEN IN FIX ROUND 2
          (finding DELTA-M0P4-04): the first version read the browser's
          accessibility snapshot, and any description attached with
          aria-describedby appears in that tree whether or not assistive
          technology would ever speak it, so the question was answerable yes
          by a mechanism that proves nothing about announcement. Capture
          instead that the unconfirmed text ENTERS a live region at the
          moment the prediction lands, by observing the region's textContent
          change with a MutationObserver scoped to that region, and record
          SEPARATELY that the accessibility tree exposes the description on
          the focused submit control. Record both, and record that an
          accessibility-tree entry alone does not answer this question.
          FALSIFIED BY any of the seven missing, by an answer that carries a
          conclusion with no captured output beside it, or by (g) answered
          from the accessibility tree alone.
      - id: "11.2"
        criterion: >-
          THE PREDICTION IS SHOWN, AND SHOWN AS A PREDICTION, TO EVERY
          READER. REWRITTEN IN THE M0-P4 FIX ROUND (finding ADV-M0P4-10) and
          CORRECTED IN FIX ROUND 2 (findings DELTA-M0P4-02 and
          DELTA-M0P4-04). The first version made the marking
          aria-busy="true" on the row, and aria-busy tells assistive
          technology to hold back the changes inside the element, so it
          suppressed the announcement of the very change it was there to
          mark. The second version removed aria-busy from the row and
          over-corrected by one word, forbidding it on every element OF the
          row when the naming submit is a descendant of that row
          (src/modules/merchants/ui/merchant-review.tsx:26 opens the li, :45
          the form, :60 the submit), where criterion 10.3 requires it and
          where it is correct; and it put the non-visual marking somewhere
          nothing announces it. Under the chromium-phone-prod project at 390
          by 844 and again under the desktop project, on the merchant review
          with the naming action delayed by 2000 milliseconds by a route
          handler, in each of en, nl and fr: (a) within 200 MILLISECONDS of
          the click the group-label element of the named row has trimmed
          textContent equal to the string typed into the input; (b) that row
          carries data-unconfirmed, and the busy mark M3-P9 shipped for that
          selector is drawn, with getComputedStyle(row, "::after") returning
          a content value other than "none"; (c) THE NON-VISUAL PART IS
          ANNOUNCED AND NOT MERELY PRESENT. Inside that row there is an
          element with role="status" whose trimmed text is the catalogue
          value of the unconfirmed key for the language under test, read
          from messages/en.json, messages/nl.json or messages/fr.json by the
          spec rather than hard-coded in it; the spec observes that text
          ENTER the region, by a MutationObserver scoped to the region,
          rather than finding it already there; and the naming submit
          control inside that row has an accessible description, through
          aria-describedby, that resolves to the same text, so a reader who
          moves focus back to the control they just pressed is told again. A
          polite live region and not an assertive one, because the
          prediction is not a failure; the assertive role belongs to the
          toast (decision D-32). (d) THE CARVE-OUT, and it is exact: NEITHER
          THE ROW ELEMENT ITSELF, NOR THE GROUP-LABEL ELEMENT, NOR THE
          role="status" REGION carries aria-busy="true", so nothing holds
          back the announcement of the predicted value. aria-busy on the
          naming SUBMIT CONTROL inside the row is REQUIRED by criterion 10.3
          and is correct there: it scopes to that control's own subtree,
          which carries only its label, and it is what tells a reader the
          action is running. (e) At 1000 milliseconds after the click,
          before the response is released, (a) through (d) are all still
          true. After the response is released, data-unconfirmed, the
          region's text and the description are gone from that row.
          FALSIFIED BY the label not carrying the typed string within 200
          milliseconds, by a missing or wrongly worded region text in any of
          the three languages, by text that was already present rather than
          observed entering, by a submit control whose accessible
          description does not resolve to that text, by aria-busy on the row
          element, the group-label or the region, by an unmarked prediction
          at any point before the response, or by a marking, region text or
          description that outlives the response.
      - id: "11.3"
        criterion: >-
          NO FIGURE MOVES ON A PREDICTION, AND NO ROW MOVES EITHER. THIS IS
          THE CRITERION THAT KEEPS THE OPTIMISM HONEST IN A FINANCE PRODUCT.
          ITS ORDER HALF WAS REWRITTEN IN THE M0-P4 FIX ROUND (finding
          ADV-M0P4-03, high): the first version compared "the sequence of
          group keys in DOM order", and there is no group key in the DOM.
          src/modules/merchants/ui/merchant-review.tsx:94 passes group.key
          as a React key only, and the row's two real DOM identities are the
          unresolved-group or merchant-group testid (merchant-review.tsx:28)
          and the group-label text (merchant-review.tsx:35), both of which
          criterion 11.2 and decision D-31 REQUIRE the prediction to change
          on the row under test, so the half was unsatisfiable by
          construction and would have been quietly reinterpreted rather than
          run red. With the same delay, at 1000 milliseconds after the click
          and before the response is released, both halves hold. (a) THE
          MONEY HALF, unchanged because it was sound: the elements with
          testid income-total, spend-total and unresolved-count, and the
          group-total of EVERY group on the screen, have trimmed textContent
          byte identical to their values captured immediately before the
          click. (b) THE ORDER HALF: the sequence of data-group-key values
          in DOM order, which M3-P11's third step adds to the row element
          MASKED, is byte identical to the sequence captured immediately
          before the click, so no row has been moved or merged by the
          prediction; and every row OTHER than the named one has a
          byte-identical data-testid and group-label text as well. Two rows
          whose MASKED keys are equal are indistinguishable to this
          comparison, which is accepted and stated rather than left to be
          discovered (finding DELTA-M0P4-08): a reorder of two rows carrying
          the same masked descriptor is not something this criterion can see,
          and not something a reader could see either. The named row's own
          data-testid and group-label are outside the comparison, and only
          those two, because criterion 11.2 requires both to change.
          Evaluated on the small mixed seed AND on the dense dataset M3-P7's
          criterion 7.13 introduced, and additionally on a naming whose
          typed name is the name of an EXISTING merchant on the screen,
          which is the case that would merge and sum two totals if anything
          predicted them. FALSIFIED BY one differing figure, one differing
          count, one changed data-group-key sequence, or one other row whose
          testid or label changed before the server has answered.
      - id: "11.4"
        criterion: >-
          THE FAILURE IS LOUD, THE VALUE COMES BACK, AND THE NOTICE WAITS
          FOR THE READER. Measured end to end on a FORCED FAILURE, twice by
          two different causes, at 390 by 844 and at 1280 by 720, and in
          each of en, nl and fr. The first cause is a DOMAIN failure,
          submitting a name that is only whitespace, which the use case
          rejects (src/modules/merchants/application/assign-merchant.ts:50
          through :53) and which the required attribute on the input
          (src/modules/merchants/ui/merchant-review.tsx:57) does not block.
          The second is a TRANSPORT failure, and which form it takes is
          settled by criterion 11.1(e) rather than assumed here (finding
          ADV-M0P4-09): it is a route handler that fulfils the action's
          request with a 500 if that reaches the client wrapper, or a route
          handler that ABORTS the request if it does not, and the phase work
          history names which. In both cases and in all three languages, all
          five of the following hold. (a) The predicted label is on the row
          within 200 milliseconds of the click, so the revert is a revert of
          something the reader saw. (b) After the failure reaches the
          client, the group-label's trimmed textContent is byte identical to
          its value captured immediately before the click, and
          data-unconfirmed and the unconfirmed description are gone from the
          row. (c) A notice is visible with a bounding rect whose width and
          height are both greater than zero, it sits inside an element with
          role="alert", and its trimmed text is exactly the value of the
          failure key in that language's catalogue, read from
          messages/en.json, messages/nl.json or messages/fr.json by the spec
          rather than hard-coded in it, so a notice that renders an English
          sentence in the French run fails here. (d) The notice is STILL
          VISIBLE 5000 milliseconds after it appeared, with no reader
          interaction, and it disappears when its dismiss control is
          pressed. (e) income-total, spend-total, unresolved-count and every
          group-total are byte identical to their pre-click values
          throughout. FALSIFIED BY a silent revert, by a label that does not
          return to its pre-click value, by a marking left behind, by a
          notice outside a role="alert" element, by notice text that is not
          the catalogue value for the language under test, by a notice that
          disappears on its own within 5000 milliseconds, by a dismiss
          control that does not dismiss it, or by any figure moving.
      - id: "11.5"
        criterion: >-
          A DIFFERENT ANSWER IS NOT SWAPPED IN SILENTLY. The use case stores
          the trimmed name (src/modules/merchants/application/assign-merchant.ts:50),
          which makes a name typed with surrounding whitespace a case where
          the server's answer differs from the prediction and NOTHING has
          failed. With that input, in each of en, nl and fr: within 200
          milliseconds the group-label carries the string as typed; after the
          response, the group-label carries the trimmed string AND a notice
          is present on that row inside an element with role="status", whose
          trimmed text is the catalogue value of the difference key for that
          language, with a bounding rect whose width and height are both
          greater than zero, still present 5000 milliseconds later. FALSIFIED
          BY the label changing from the predicted value to the confirmed one
          with no notice, by a notice outside a role="status" element, or by
          notice text that is not the catalogue value for the language under
          test.
      - id: "11.6"
        criterion: >-
          THE COPY IS REAL COPY IN THREE LANGUAGES. (a) messages/en.json,
          messages/nl.json and messages/fr.json each gain the SAME set of
          new keys, AT MOST FOUR, and the three files' complete key sets are
          equal to each other, compared as sorted lists by the spec. The cap
          was raised from three to four in the M0-P4 fix round (finding
          ADV-M0P4-10, and decision D-27 as amended): the fourth key is the
          unconfirmed marking's accessible text, without which a non-visual
          reader meets a predicted value with no sign it is unstored, and
          the round's own copy budget was the only thing blocking it. (b)
          npm run lint exits 0 with the react/jsx-no-literals rule covering
          src/platform/ui/**/*.tsx as M3-P10's criterion 10.11 widened it,
          and covering src/modules/**/ui/**/*.tsx as it always did, so
          neither the toast nor the predicted-row leaf can carry a bare
          sentence. (c) THE RED WITNESS, because (b) alone proves only that
          no literal is present today: with the failure message replaced by
          a bare English string literal in the component, npm run lint exits
          NON-ZERO and names react/jsx-no-literals, captured in the phase
          work history, and the temporary edit is not committed. (d) No new
          key's English value contains an exclamation mark, the words sorry
          or oops, or the word error, which is this product's copy rule made
          checkable rather than left to taste
          (.claude/skills/pulse-frontend/SKILL.md:125 through :127).
          FALSIFIED BY unequal key sets, by a fifth key, by lint failing, by
          the red witness exiting 0, or by any of the banned strings in an
          English value.
      - id: "11.7"
        criterion: >-
          THE BOUNDARY STILL DOES NOT LEAK. (a) grep -rln "use client" src/
          returns at most FIVE files: the three M3-P10's criterion 10.6
          permits, the toast under src/platform/ui/, and exactly one file
          under src/modules/merchants/ui/. (b) No file named page.tsx,
          layout.tsx or route.ts and no file under src/app/ carries "use
          client". (c) For every file that carries it, criterion 10.6(c)
          holds UNCHANGED, with its pattern character for character: grep
          -nE "from \"(@/modules/|\.\./(application|domain|adapters))" exits
          1 and grep -nE "next-intl|getTranslations|useTranslations" exits
          1. The pattern is 10.6(c)'s and not a narrower one, corrected in
          the M0-P4 fix round (finding ADV-M0P4-08): the first version
          narrowed the ban to a module's application, domain and adapters
          directories, which would have let a leaf under src/platform/ui
          import a module's ui layer after this phase landed and made a
          later phase GREENER on the same files than the phase that
          established the guard. (d) THE IMPORT CLOSURE, the same walk
          criterion 10.6(e) introduces, re-run over this phase's five client
          files with the same forbidden set. (e) The merchants client leaf
          imports nothing outside src/platform/ui/ and React. FALSIFIED BY a
          sixth client file, by a client file under src/app/, by any module,
          application, domain, adapter or i18n import inside one, by a
          forbidden path anywhere in the import closure, or by the merchants
          leaf importing anything else.
      - id: "11.8"
        criterion: >-
          THE PHASE STAYS WHAT IT SAYS IT IS. npm run typecheck && npm run
          lint && npm test exit 0; npm run test:e2e exits 0 under every
          project, the chromium-phone-prod project M3-P10 adds included,
          with the naming journey at test/e2e/merchants.spec.ts:18 passing
          UNCHANGED in its assertions under every project it runs under and
          the card-label describe in the same file passing unchanged; git diff
          against this phase's base over package.json and package-lock.json
          is EMPTY, so the hand-built toast really is hand built; and git
          diff --name-only against this phase's base over
          src/modules/merchants/application/,
          src/modules/merchants/domain/, src/modules/merchants/adapters/,
          src/modules/overview/, src/modules/import/, src/modules/ledger/,
          src/platform/ui/amount.tsx, src/platform/ui/mask-card-number.ts,
          styles/tokens.css and prisma/ prints NOTHING. The tokens pin is
          what keeps the three-phase split real: this phase consumes M3-P9's
          tokens and contributes none back. FALSIFIED BY any printed path, by
          any package change, or by a weakened assertion in the existing
          journey.
      - id: "11.9"
        criterion: >-
          NO LITERAL REACHES THE STYLESHEET OR THE COMPONENTS, the same gate
          M3-P8's criterion 8.9 applies for the same reason: this phase
          edits src/app/globals.css, which M3-P9's own literal count was
          evaluated against at M3-P9's head and never re-run. Half (a) was
          REWRITTEN in the M0-P4 fix round (finding ADV-M0P4-07): its
          pattern had been broken across a YAML fold, so the criterion as
          parsed specified a literal space before the hash and a colour
          written in the hand-built toast as a quoted or colon-prefixed hex
          value would have escaped it, in the one phase that adds a
          hand-drawn component. (a) grep -rEn
          "oklch\(|#[0-9a-fA-F]{3,8}|[0-9]+px" over src/modules/ and
          src/platform/ restricted to *.tsx exits 1, that pattern being
          character for character the one criterion 9.5(a) uses. (b) grep
          -nE "^[^/*]*[0-9.]+(px|rem)" over every file matching *.css under
          src/ and styles/ except styles/tokens.css returns the SAME line
          count, with the same declarations, that it returned at this
          phase's base. (c) grep -nE "^[^/*]*[0-9.]+m?s[;,
          )]|cubic-bezier|steps\(" over the same files returns nothing, so
          the toast's own transition is a token. (d) grep -rhoE
          "@media[^{]+" over those files, whitespace normalised and
          deduplicated, still returns exactly 2, so the toast does not bring
          a third media condition with it. (e) npm run gate:tokens exits 0.
          FALSIFIED BY any one of the five.
      - id: "11.10"
        criterion: >-
          PRIVACY, in the three-half shape criteria 7.15, 8.10, 9.8 and 10.9
          use, and it is sharper here than anywhere else in this plan because
          this phase's own criteria require capturing a naming journey and a
          failed request. (a) bash scripts/gate-privacy.sh exits 0, and the
          gate is the version at origin/main HEAD when the phase is
          dispatched, recorded by sha in the phase work history. (b) A
          whole-worktree grep for the real statements' identifier,
          holder-name, merchant-string, thousands-form amount and date
          probes, built in the container at review time from the real uploads
          and never committed, exits 1, and the same grep over the files this
          phase adds or modifies exits 1. (c) Every rendered measurement,
          every captured request line and every merchant name quoted in the
          phase work history is captured from a committed synthetic fixture
          and not from the deployed household, with the command that produced
          it beside it. A naming journey types a merchant name and a failed
          request body carries it, so a run against the owner's real month
          would put a real counterparty string into a public repository. If
          the real statements are absent from the executing container, half
          (b) is recorded as NOT WITNESSED rather than green. FALSIFIED BY
          the gate exiting non-zero, by any probe hit, or by a captured
          measurement, request line or name whose stated source is the
          deployed database.
    hazard-classes:
      - id: H11.1
        statement: >-
          The optimism predicts a MONEY figure. The most likely route is not
          ambition but tidiness: a naming that merges into an existing
          merchant leaves the screen looking wrong for the length of the
          round trip, and adding the two group totals in the browser makes it
          look right. That is the same domain rule implemented twice, and it
          is how a screen and a database start disagreeing.
        addressed-by: criterion 11.3
      - id: H11.2
        statement: >-
          The revert is silent. The prediction is reverted correctly by
          React, no notice is raised or the notice is raised and missed, and
          the reader is left looking at a value they believe they entered.
          This is the failure mode DR-0025 and DR-0026 exist to prevent, and
          it arrives most easily through a notice that times out.
        addressed-by: criterion 11.4
      - id: H11.3
        statement: >-
          The toast is visual only. It appears in a corner with no live
          region, or with a polite one for a failure, so a reader using a
          screen reader or not looking at that corner is told nothing at all
          and the product has a revert that only sighted attentive readers
          can see.
        addressed-by: criterion 11.4
      - id: H11.4
        statement: >-
          The toast's copy is an English sentence in the component, or an
          error code, or a translation that exists in English and not in
          Dutch or French. The pressure is real: the failure path is the last
          thing built and the copy is the last thing written in it.
        addressed-by: criterion 11.6
      - id: H11.5
        statement: >-
          The server's answer differs from the prediction without failing and
          is swapped in silently, so the row ends up carrying a value the
          reader did not type and never saw change. This is the door the
          whole decision does not close by itself.
        addressed-by: criterion 11.5
      - id: H11.6
        statement: >-
          A component library, a toast package or a state store is added,
          because building a dismissible accessible notice by hand looks like
          the long way round.
        addressed-by: criterion 11.8
      - id: H11.7
        statement: >-
          The prediction is shown as though it were confirmed, with no
          marking, so for the length of the round trip a finance screen
          carries a label that is indistinguishable from a stored one. The
          owner decided to predict; they did not decide to stop saying which
          values are known.
