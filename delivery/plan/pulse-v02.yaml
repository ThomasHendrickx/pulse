          MPR-023), because the naive form exits 0 at this phase's base for a
          reason unrelated to the work: a comment at
          src/modules/import/ui/profile-confirmation.tsx:47 cites an intake
          document by filename and section, and the two characters before
          that colon happen to be one of the tokens. The breakpoint half
          matches only INSIDE a className attribute value, that is the form
          className="..." or className={"..."} containing a
          whitespace-delimited word beginning sm:, md:, lg:, xl: or 2xl:; the
          arbitrary-value half matches an opening square bracket immediately
          following a utility prefix such as min-h-, max-h-, h-, w-, p-, gap-
          or text-. FALSIFIED BY any one of the four checks failing.
      - id: "7.5"
        criterion: >-
          At 390 by 844 and again at 360 by 740, on the month view seeded
          with the reconciling dataset and on the empty state, every element
          matching "a, button, input:not([type=hidden]), select,
          [role=button]" inside the shell header and inside main that has a
          non-zero bounding box has a bounding box height of at least 44 CSS
          pixels, and the spec names every offender by testid or text in its
          failure message. FALSIFIED BY one offender. The elements that fail
          this today and must therefore change are .app-nav-link
          (src/app/globals.css:129, 4px of vertical padding on 12px text),
          .app-signout (src/app/globals.css:168, no padding), .month-nav
          (src/app/globals.css:602 through :609, width and height
          var(--space-9), 24px), .month-unresolved-pill
          (src/app/globals.css:651) and .empty-state-cta
          (src/app/globals.css:210). ADDED in the M0-P3 fix round (finding
