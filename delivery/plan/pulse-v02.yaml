      - >-
        M3-P7 and M3-P8 (test/e2e/month-view.spec.ts): no ordering is
        required, but they must not run in parallel with this phase, which
        rewrites the reserve upload at test/e2e/month-view.spec.ts:1377 under
        decision D-55 and adds a width witness to the shell's navigation row.
    parallelizable: false
    citations:
