parked:
  - item: >-
      Cross-format dedup unification (the same period imported once as CSV
      and once as PDF stores every row twice, because the hash tuple and
      the natural-key components differ across formats).
    reason: >-
      The owner's stated input is PDF from the phone going forward, CSV
      requiring PC banking; the balance gate keeps each file internally
      consistent; and unifying keys would rewrite stored keys, which the
      dedup stability contract (dedup.ts:18) marks as the costly direction.
      Revisit only if a mixed-format household actually appears; recorded
      here so the risk is visible rather than discovered.
  - item: Persisting opening and closing balances on the Import row.
    reason: >-
      Decision D-6: nothing reads them yet; the gate verifies in memory and
      the settlement machinery derives totals from rows. Add columns when a
      feature reads them, additively.
  - item: Additional bank layout templates beyond Belfius and KBC.
    reason: >-
      The addendum's own routing (pulse-v0.2-pdf-addendum.md:27): an
      unrecognised layout fails loudly and becomes a backlog item, not a
      user problem; templates land one phase each as real statements
      appear.
  - item: OCR for image-only statement PDFs.
    reason: >-
      Both real statements carry full text layers; an image-only export
      fails as layout-unsupported until one is actually observed.
  - item: LLM-assisted extraction for unknown layouts behind the balance gate.
    reason: >-
      Decision D-9: v0.3+ in principle per the addendum, out of v0.2, and
      Claude API use is bound to slice 5 onward by the charter
      (charter.yaml:41).
  - item: >-
      Queue, cron, event bus, caching layer, state management library,
      component library.
    reason: >-
      The deliberately-absent list is binding (charter.yaml:80); nothing in
      the PDF path needs any of them, and the share-target phase carries an
      explicit no-caching criterion so PWA work cannot smuggle one in.
  - item: >-
      Merchant rows nested under tag subheads in the spend card, as
      delivery/design/mobile-v02/Main.dc.html:124 through :176 draws them.
    reason: >-
      Raised to the owner as DR-0023 and not decided here. It is a projection
      change, not a layout change: src/modules/overview/domain/
      month-projection.ts:67 through :74 folds every tagged merchant row into
      one group labelled with the tag, so producing the mockup's shape means
      changing OverviewGroup and the delta keying. This plan's recommendation
      is stated in M3-P7 step 7 and in the open question below; whichever way
      it resolves, no criterion in M3-P7 or M3-P8 changes. With zero merchant
      rules in the owner's data it renders nothing today either way.
  - item: >-
      A month span per group on the merchant review ("3 rows and June and
      July", delivery/design/mobile-v02/MerchantReview.dc.html:34).
    reason: >-
      No data behind it: ReviewGroup carries no date
      (src/modules/merchants/domain/merchant-review.ts:36 through :47) and
      neither does CountedRow (merchant-review.ts:22 through :29). Adding it
      means widening the review projection and its query, which is not a
      layout change. Revisit if the owner asks for it after using the
      rebuilt screen.
  - item: >-
      A "Recently named" list with a Rename affordance on the merchant review
      (delivery/design/mobile-v02/MerchantReview.dc.html:74 through :91).
    reason: >-
      No capability behind it: src/modules/merchants/ui/actions.ts and
      src/modules/merchants/application/assign-merchant.ts expose assignment
      only, and messages/ carries no rename key. Renaming a merchant that
      already has stored MerchantRule rows is a rule-rewrite question with a
      stability contract attached, not a button; it is its own phase if the
      owner wants it.
  - item: >-
      A named count beside the unresolved count on the merchant review ("3
      left and 17 named", MerchantReview.dc.html:24 through :26).
    reason: >-
      Cheap to derive but it is new copy in three languages for a number the
      owner did not ask for, and the screen already shows the count that
      matters (src/modules/merchants/ui/merchant-review.tsx:114 through :117,
      testid unresolved-count). Decision D-18: the mockup is not a source of
      copy.
  - item: >-
      Ordering the merchant review's groups unresolved first, as
      delivery/design/mobile-v02/MerchantReview.dc.html shows them.
    reason: >-
      The order is a DOMAIN sort by magnitude
      (src/modules/merchants/domain/merchant-review.ts:57 through :67) and
      M3-P8 is a layout phase that changes no domain file (criterion 8.7).
      The unresolved rows already carry their own flag treatment at every
      width (src/app/globals.css:498 through :502), so the work queue is
      visible without a resort.
  - item: >-
      A 48px compact-row height token, implied by the mockup's "recently
      named" rows (MerchantReview.dc.html:77 and :84).
    reason: >-
      Only that parked section needs it. Adding a token nothing references is
      how a token scale stops being a scale; add it with the section, if the
      section is ever built.
  - item: >-
      A dense single-ledger month view, the DenseAlternate frame.
    reason: >-
      delivery/design/mobile-v02/README.md:20 records it as considered and
      NOT chosen by the owner, and canvas.json's second annotation states its
      cost: the comparison with the previous month moves behind a tap, and
      that comparison is part of the primary view by
      .claude/skills/pulse-frontend/SKILL.md:111. Recorded so a later reader
      does not rediscover it as a new idea.
