  - item: >-
      Widening the Belgian-length-only counterparty account pattern in the
      Belfius PDF template, DESCRIPTION_IBAN at
      src/modules/import/domain/belfius-current-account-template.ts:88, which
      matches a two-letter country code plus two check digits plus exactly
      three groups of four.
    reason: >-
      CORRECTED RATHER THAN QUIETLY REWRITTEN, because the first version of
      this entry stated the mechanism BACKWARDS and the wrong way round was
      the reassuring way round. It said the pattern "cannot see a foreign
      counterparty account". It cannot see one WHOLE, and it CAN see a
      sixteen-character PREFIX of one: against a longer account written
      spaced, the trailing word boundary succeeds at a group boundary, so the
      pattern matches the first sixteen characters and the row is stored with
      a truncated value. Demonstrated on two wholly invented longer-form
      values differing only after their twelfth digit: both scrape to one
      identical sixteen-character value. The failure mode is therefore a
      SILENT MERGE of two counterparties, not a miss, which is the dangerous
      direction rather than the safe one. What stands between the two until
      the template is widened is decision D-43's trust gate: the truncated
      value fails both the country-length test and the mod-97 test, so the row
      falls to the descriptor basis and shows as unconverged instead of
      merging. Parked rather than fixed because widening the pattern changes
      what the importer writes into a FACT column, which is a template version
      bump and a re-parse of stored raw lines rather than a derivation change
