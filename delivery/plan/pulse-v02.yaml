      - id: "7.9"
        criterion: >-
          The month view publishes testids income-card, spend-card and
          reserves-card on its three sections. At 390 by 844 the three have
          equal x within 1px and equal width within 1px, and
          income-card.y is less than spend-card.y which is less than
