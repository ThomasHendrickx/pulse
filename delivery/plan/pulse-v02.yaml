    extras: []
    acceptance:
      - id: "10.1"
        criterion: >-
          The phase work history records an answer to each of the SEVEN
          verification-first questions with the command and its captured
          output beside it: the captured request line that identifies a
          server-action request and the route-handler form that successfully
          delays it under both the development and the production-mode
          projects; what useFormStatus reports for the two-control profile
          confirmation form; a captured pending observation from
          useLinkStatus under the PRODUCTION-mode build or a captured
          measurement that prefetching completes the navigation inside
          criterion 10.5's threshold there, asked so the phase DISCOVERS the
          answer rather than confirming a stated one; whether ANY loading
          boundary exists under src/app at the phase base, ADDED IN FIX
          ROUND 2 (finding DELTA-M0P4-07) because that is what decides
          whether a prefetched dynamic route can render without waiting and
          therefore which branch of criterion 10.5 the production build can
          even take; the exact "use client" file list at the phase base; the
          confirmation that src/modules/ledger/ui/actions.ts is behind no
          rendered control; and the captured evidence that the
          production-mode server starts and serves the interaction spec's
          journey without a frozen clock, since playwright.config.ts strips
          PULSE_FIXED_NOW from that server's environment by the app's own
          production guard. FALSIFIED BY any of the seven missing, or by a
          recorded answer that carries a conclusion with no captured output
          beside it.
      - id: "10.2"
        criterion: >-
          THE INTERVAL BETWEEN THE PRESS AND THE FIRST DOM CHANGE, AND THE
          CHANGE MUST BE ONE A READER COULD SEE. THIS IS THE CRITERION THE
          PHASE EXISTS FOR AND IT IS THE ONE THE OWNER'S SECOND SENTENCE
          DESCRIBES. REWRITTEN IN THE M0-P4 FIX ROUND to close findings
          ADV-M0P4-01 (critical), ADV-M0P4-02, ADV-M0P4-11 and ADV-M0P4-12.
          The first version observed the whole document with subtree and
          attributes true and accepted the first record from any source, so
          ONE LINE in the leaf's click handler, setting a data attribute on
          document.body and rendering nothing at all, turned it green on all
          seven controls with the screen dead; and it had no control run, in
          a plan that uses one twice elsewhere. Measured under the
          chromium-phone-prod project against the production-mode build,
          which is the build the owner presses (decision D-34), for each of
          the seven submit controls, with that control's server action
          delayed by 2000 MILLISECONDS by a route handler. All five of the
          following hold. (a) THE SET IS THE ONE THE PLAN NAMES. Before
          measuring, the spec builds the list of submit controls it will
          measure and asserts that it equals, by testid or by selector and
          text where a control has no testid, the seven this plan
          enumerates; a control the spec does not reach FAILS this criterion
          rather than being skipped. (b) THE OBSERVER IS SCOPED AND THE
          RECORD IS FILTERED. The spec installs a MutationObserver whose
          target is the pressed control's nearest ancestor form, with
          childList, subtree, attributes and characterData, and DISCARDS
          every record whose target is neither the pressed control nor a
          node inside the pressed control's own subtree. Of the records that
          survive, the first must be an attribute record whose attributeName
          is aria-busy, aria-disabled, disabled or class ON THE PRESSED
          CONTROL, or a childList or characterData record inside it; every
          other surviving record is discarded too. (c) THE INTERVAL. The
          interval from the click event's timestamp to that first surviving
          record is at most 200 MILLISECONDS, and inside the
          MutationObserver callback that delivers it the pressed control's
          computed appearance differs from a snapshot captured immediately
          before the click, over the property set criterion 9.3 uses
          together with getComputedStyle(control, "::after").content, so the
          record that stopped the clock is one that changed what is on the
          screen. (d) THE SERVER REALLY WAITED. The route handler recorded
          at least one request carrying the server-action header for that
          action, and the response it released arrived at least 1500
          MILLISECONDS after the click, so no measurement here can be
          satisfied by the server merely being fast OR by a route handler
          that never matched the request. With a 2000 millisecond delay and
          a 200 millisecond ceiling on (c) the slack is 300 milliseconds,
          stated so a later reader tuning either number sees what it costs.
          (e) THE CONTROL RUN, WHICH IS WHAT MAKES (b) AND (c) MEAN
          ANYTHING. The identical measurement is run once with this phase's
          submit leaf replaced by the plain server-rendered button it
          replaces, on the same page under the same delay, and NO surviving
          record appears within 2000 MILLISECONDS of the click; the captured
          output of both runs is recorded in the phase work history and the
          temporary replacement is not committed. Without (e) this criterion
          passes on a mutation the phase did not cause, which is exactly how
          its first version failed. AND ON THE MERCHANT NAMING SUBMIT, which
          is the control the owner presses most, the same measurement is
          taken on FIVE DIFFERENT unresolved rows' naming submits, each
          named SUCCESSFULLY, and the MEDIAN of the five intervals is at
          most 100 MILLISECONDS. Five is what the committed fixture
          supports: test/e2e/merchants.spec.ts:54 asserts exactly five
          unresolved groups and a successful naming consumes one. Pressing
          one control five times, or measuring a naming that fails, does not
          satisfy this. WHY THOSE NUMBERS, stated so a later reader does not
          have to guess: 100 milliseconds is the interval below which a
          response reads as caused by the press rather than as a separate
          event, so it is the product bar; 200 is twice it and absorbs the
          container noise this fleet has recorded (playwright.config.ts:35
          through :47) without letting a quarter-second control pass a
          criterion about perception. The interval is measured from the
          CLICK and not from the pointer down, because the submission starts
          on release and the pointer-down moment is what criterion 9.2
          answers; the two measurements meet at the press and divide there
          on purpose. FALSIFIED BY a measured set that is not the seven the
          plan names, by one control exceeding 200 milliseconds, by a first
          surviving record that is not one of the named kinds or that leaves
          the control's computed appearance unchanged, by a request counter
          of zero or a response released less than 1500 milliseconds after
          the click, by ANY surviving record in the control run, or by a
          median above 100 milliseconds.
      - id: "10.3"
        criterion: >-
          THE BUSY STATE IS NOT A BLINK. With the same 2000 millisecond
          delay, under the chromium-phone-prod project and again under the
          desktop project, for each of the seven submit controls, over the
          set criterion 10.2(a) pins: at 1000 milliseconds after the click
          and before the response is released, the pressed control carries
          aria-busy="true", is not pressable, and getComputedStyle(control,
          "::after") returns a content value other than "none"; and after
          the response is released and the resulting navigation or
          revalidation settles, no element in the document carries
          aria-busy="true". FALSIFIED BY a busy state that is absent at 1000
          milliseconds, by a control that is still pressable then, by a busy
          mark that is not drawn, or by an aria-busy that survives the
          response.
      - id: "10.4"
        criterion: >-
          A CONTROL CANNOT BE PRESSED TWICE. With the same 2000 millisecond
          delay, for each of the seven submit controls, over the set
          criterion 10.2(a) pins, the control is pressed twice 100
          milliseconds apart inside the delay window while the route handler
          counts the requests carrying the server-action header for that
          action; the count is exactly 1. Run under the chromium-phone-prod
          project and under the desktop project, because a touch device and
          a pointer device deliver the second press differently. FALSIFIED
          BY a count of 2 on any of the seven.
      - id: "10.5"
        criterion: >-
          THE NAVIGATING CONTROLS, which are not forms and carry the same
          dead interval, MEASURED IN THE BUILD THE OWNER PRESSES. REWRITTEN
          IN THE M0-P4 FIX ROUND to close findings ADV-M0P4-04 (high) and
          ADV-M0P4-02. The first version took this measurement only against
          the development server, and viewport prefetching is disabled in
          development (node_modules/next/dist/client/components/links.js:194
          through :199), so each of its two admissible branches was
          unreachable in the environment where the other one is real: in the
          gate only the marker branch could ever pass, and in the owner's
          deployed build prefetch makes the destination render with no
          pending state at all, so whichever branch the gate took told
          nobody anything about the owner's screen. (a) THE SET IS THE ONE
          THE PLAN NAMES. The spec builds the set it measures and asserts
          that it equals the SEVEN navigating controls this plan enumerates,
          matched by testid where they carry one and BY ARIA-LABEL for the
          two month step controls, which carry none: nav-overview,
          nav-import and nav-merchants (src/app/(app)/layout.tsx:49, :52 and
          :55, rendered at src/platform/ui/nav-link.tsx:50), unresolved-pill
          (src/modules/overview/ui/month-view.tsx:499),
          empty-state-import-link (month-view.tsx:424), and the previous and
          next month step controls, which render only a className, an
          aria-label and a glyph child (month-view.tsx:455 and :464).
          CORRECTED IN FIX ROUND 2 (finding DELTA-M0P4-06): the first version
          asserted on a testid that two of its seven controls do not have,
          which is not executable. Either answer is admissible and the phase
          records which it took, matching on the aria-label or giving those
          two Links a data-testid, which this phase may do because
          month-view.tsx is in its files-to-touch and whose values are then
          pinned in the phase work history. Matching on the glyph child is
          NOT admissible: it is a punctuation mark, not text a spec should
          bind to. The set is SWEPT and not looked up, on the same terms
          criterion 9.2(a) states. A control the spec does not reach FAILS
          this criterion rather than being skipped, and the routes to the
          two conditional ones are the ones criterion 9.2(a) names. (b) THE
          MEASUREMENT, RUN TWICE. At 390 by 844, with the destination's
          response delayed by 2000 milliseconds by a route handler, under
          the chromium-phone-prod project against the production-mode build,
          where viewport prefetching is ON, and again under the
          chromium-phone project against the development server, where it is
          off: within 200 MILLISECONDS of the click the document has changed
          in at least one of two ways, either the destination has rendered
          or the pressed control carries the pending marker with a bounding
          rect whose width and height are both greater than zero; and where
          the marker appeared, it is gone within 500 milliseconds of the
          destination rendering. (c) THE BRANCHES ARE RECORDED AND COMPARED.
          The phase work history records WHICH of the two branches each of
          the seven controls took in EACH run, with the captured output. A
          control that takes the marker branch in the development run and
          NEITHER branch in the production run fails this criterion, because
          that is exactly the outcome the first version could not see: a
          pending state proved in an environment the owner never uses and
          absent in the one they do. The criterion keeps two admissible
          answers deliberately, because whether a prefetched navigation ever
          reaches a pending state is a property of the framework's
          prefetching and not of this phase; what it forbids is the press
          that produces NEITHER, which is what all seven do today. FALSIFIED
          BY a measured set that is not those seven, by one of them where
          neither branch is true at 200 milliseconds in either run, by a
          marker left behind after the destination rendered, or by a missing
          branch record.
      - id: "10.6"
        criterion: >-
          THE CLIENT BOUNDARY IS AS SMALL AS THE JOB ALLOWS, AND THE DIFF
          PROVES IT. (a) grep -rln "use client" src/ returns AT MOST three
          files, all of them under src/platform/ui/, one of which is the
          pre-existing src/platform/ui/nav-link.tsx. (b) No file under
          src/app/, no file named page.tsx, layout.tsx or route.ts, and no
          file under any module's ui/ directory carries "use client". (c)
          For every file that does carry it, grep -nE "from
          \"(@/modules/|\.\./(application|domain|adapters))" exits 1 and
          grep -nE "next-intl|getTranslations|useTranslations" exits 1, so
          no domain type, no application function, no repository and no
          message catalog crosses the boundary; every user-facing string
          these leaves render arrives as a server-rendered prop. (d) grep
          -rn "useOptimistic" src/ exits 1, because DR-0025's prediction is
          M3-P11's job and this phase is the layer under it (decision D-22):
          a prediction built here would arrive without the failure path and
          the toast DR-0026 requires, which is the one shape of this work
          the owner ruled out. (e) THE IMPORT CLOSURE, NOT JUST THE FILE,
          added in the M0-P4 fix round (finding ADV-M0P4-08) and given its
          resolution rules in fix round 2 (finding DELTA-M0P4-05). A grep
          over the files that carry the directive counts client FILES and
          not client MODULES: in this framework a module imported by a "use
          client" file joins the client bundle without carrying the
          directive itself, so a leaf that imports a shared helper which
          itself imports a domain module ships that module to the browser
          and halves (a) through (c) see nothing. A script under test/ walks
          the import specifiers of every file carrying "use client" and of
          every file those reach, transitively, and asserts that the closure
          contains no path under src/modules/*/application/,
          src/modules/*/domain/, src/modules/*/adapters/ or
          src/platform/auth/, and no import of @/platform/tenancy. FIVE
          RULES, because a walk that passes by failing to look is the green
          and worthless guard this fleet has shipped before. It follows
          "export ... from" RE-EXPORTS as well as import and import type
          statements, because this repository publishes every module through
          a barrel, eight of them under src/**/index.ts at the phase base
          and one of those src/modules/merchants/ui/index.ts, the directory
          M3-P11's leaf goes in, so a walk that follows only imports stops
          at the first one. It follows ONLY relative specifiers and
          specifiers beginning @/; a bare package specifier such as react or
          next/link is recorded and not entered. It resolves an
          extensionless specifier by trying .ts, then .tsx, then /index.ts.
          It FAILS THE CRITERION on any specifier it cannot resolve rather
          than skipping it, because a walk that skips what it cannot read
          reports a clean closure for a tree it never opened. And TYPE-ONLY
          IMPORTS COUNT: decision D-23's rule is that no domain type
          crosses, so an import type from a forbidden path fails exactly as
          a value import does, and @/platform/tenancy is inside the ban on
          the same terms. The script runs in the FAST GATE (npm test) and
          not only as a criterion, so the guard survives the phase that
          introduced it. No package is added: the walk is a regex over
          import and export-from lines plus one alias, @/* to ./src/*, which
          is the only path mapping tsconfig.json declares (tsconfig.json:28
          through :32). The hole is not a live defect today, because
          src/platform/ui carries only amount.tsx and mask-card-number.ts
          and both are self-contained, which is why this is a guard rather
          than a repair. FALSIFIED BY a fourth client file, by a client file
          outside src/platform/ui/, by any module, application, domain,
          adapter or i18n import inside one, by any use of useOptimistic, by
          a forbidden path anywhere in the import closure, by an
          unresolvable specifier, or by the closure script not running in
          the fast gate.
      - id: "10.7"
        criterion: >-
          NO STYLESHEET, NO COPY, NO SCHEMA, NO PACKAGE. npm run typecheck
          && npm run lint && npm test exit 0; npm run test:e2e exits 0 under
          EVERY project, the new chromium-phone-prod project included, with
          every pre-existing spec passing, test/e2e/golden-journey.spec.ts
          and test/e2e/merchants.spec.ts among them; git diff against this
          phase's base over package.json and over package-lock.json is
          EMPTY, so the phase adds no dependency of any kind; and git diff
          --name-only against this phase's base over styles/,
          src/app/globals.css, messages/, prisma/, test/fixtures/,
          src/modules/*/application/, src/modules/*/domain/,
          src/modules/*/adapters/, src/platform/ui/amount.tsx and
          src/platform/ui/mask-card-number.ts prints NOTHING. The stylesheet
          pins are what make the three-phase split real: this phase consumes
          M3-P9's vocabulary and contributes none back, which is the same
          one-way dependency decision D-14 records between M3-P7 and M3-P8.
          Two files outside the surfaces and the test rig may be touched,
          and only these two: playwright.config.ts, for the new project and
          the testMatch widenings, and eslint.config.mjs, for the glob
          widening criterion 10.11 measures. FALSIFIED BY any printed path
          or by any change to either package file.
      - id: "10.8"
        criterion: >-
          THE MERCHANT SCREEN'S EXISTING GUARANTEES SURVIVE. The journey at
          test/e2e/merchants.spec.ts:18, which asserts that naming an
          unresolved counterparty regroups it and changes no total, passes
          UNCHANGED in its assertions under both projects; the card-label
          describe in the same file passes unchanged; and grep -n
          "maskCardNumbers" against the hidden counterpartyText input returns
          nothing, so the value submitted by the busy-capable form is still
          the unmasked subject decision D-12 requires. FALSIFIED BY either
          spec failing, by any weakening of their assertions, or by a masked
          value reaching the submitted field.
      - id: "10.9"
        criterion: >-
          PRIVACY, in the three-half shape criteria 7.15, 8.10 and 9.8 use.
          (a) bash scripts/gate-privacy.sh exits 0, and the gate is the
          version at origin/main HEAD when the phase is dispatched, recorded
          by sha in the phase work history. (b) A whole-worktree grep for the
          real statements' identifier, holder-name, merchant-string,
          thousands-form amount and date probes, built in the container at
          review time from the real uploads and never committed, exits 1, and
          the same grep over the files this phase adds or modifies exits 1.
          (c) Every rendered measurement quoted in the phase work history,
          every captured request line criterion 10.1 requires included, is
          captured from a committed synthetic fixture and not from the
          deployed household, and the command that produced it is written
          beside it. A captured server-action request line carries the
          submitted FormData, so this half is not a formality here: the
          merchant naming request body contains whatever counterparty text
          the fixture produced, and only a synthetic fixture may produce it.
          If the real statements are absent from the executing container,
          half (b) is recorded as NOT WITNESSED rather than green. FALSIFIED
          BY the gate exiting non-zero, by any probe hit, or by a captured
          measurement or request line whose stated source is the deployed
          database.
      - id: "10.10"
        criterion: >-
          NOTHING IS PREDICTED IN THIS PHASE, and the six pending-only
          surfaces never predict anything in any later phase either
          (decision D-31). For each of the six submit controls other than the
          merchant naming submit, under both projects, with that control's
          action delayed by 2000 milliseconds: the spec captures the pair of
          testid and trimmed textContent for every element carrying a
          data-testid immediately before the click, and again at 1000
          milliseconds after the click and before the response is released,
          and the two collections are deeply equal. The pressed control and
          its busy mark are outside the comparison because the busy mark is
          drawn by a pseudo-element and carries no testid, so nothing has to
          be exempted by name. The naming submit is deliberately NOT in this
          criterion, because M3-P11 makes exactly that surface predict under
          DR-0025, and a criterion a later phase has to delete is a criterion
          this plan will not write. FALSIFIED BY any testid whose text
          differs before the server has answered, on any of the six.
      - id: "10.11"
        criterion: >-
          THE HARDCODED-STRING GATE COVERS WHERE THE NEW COMPONENTS LIVE, and
          the widening is proved by making it fail. (a) eslint.config.mjs's
          files glob for the react/jsx-no-literals rule includes
          src/platform/ui/**/*.tsx as well as src/modules/**/ui/**/*.tsx, and
          npm run lint exits 0. (b) THE RED WITNESS: with a bare JSX text
          node temporarily added to one of this phase's client leaves under
          src/platform/ui/, npm run lint exits NON-ZERO and names that file
          and the react/jsx-no-literals rule; the phase work history records
          the captured output of both runs, and the temporary edit is not
          committed. Without half (b) this criterion would pass on a glob
          that matches nothing. (c) The glob does NOT include src/app/**,
          which is parked with its one reason. FALSIFIED BY lint failing on
          the widened glob, by the red witness exiting 0, or by a missing
          captured output.
    hazard-classes:
      - id: H10.1
        statement: >-
          The phase satisfies the letter of the complaint with a transition
          or an animation while the dead interval between the press and the
          response remains exactly as long as it was, because nothing
          measures the interval itself. This is the hazard the whole round is
          written against.
        addressed-by: criterion 10.2
      - id: H10.2
        statement: >-
          Server components become client components more widely than the job
          needs. The cheap route to a pending state is to put "use client" at
          the top of the screen that has the form, which ships the month
          projection or the merchant review projection to the browser to buy
          a spinner, and which the frontend skill forbids at SKILL.md:12.
        addressed-by: criterion 10.6
      - id: H10.3
        statement: >-
          The phase reaches ahead into DR-0025's prediction because it is
          decided and the code is right there, and a merchant name or an
          account label appears on a finance screen before the server has
          confirmed it with no failure path and no toast under it, which is
          the one shape of the optimistic work the owner ruled out when they
          said the failure must be shown.
        addressed-by: criterion 10.10
      - id: H10.4
        statement: >-
          The busy state is a blink: it appears on the press and clears on
          the next render pass rather than on the response, so the owner sees
          a flicker and then the same dead interval, and every criterion that
          measured only the first DOM change stays green.
        addressed-by: criterion 10.3
      - id: H10.5
        statement: >-
