          (src/app/globals.css:781) are both grid-template-columns minmax(0,
          1fr) auto auto, three tracks. (b) fails because two gaps of
          var(--space-7) take 32 and the two amount tracks take
          var(--space-14) each, 160 in total (src/app/globals.css:767 and
          :772, styles/tokens.css:121), leaving the name about 116 pixels and
          the label-to-total distance about 132: that is about 39 percent of
          the 340 border box and below the 180 floor, and at 360 the same
          chain gives a 310 border box, a name of about 86 and a distance of
          about 102, about 33 percent and below the 160 floor. (c) fails
          because .month-row is align-items baseline with the delta in its
          third track, so the delta's top equals the label's top. THE INCOME
          AND RESERVES ROWS ARE INSIDE (b) AND (c) DELIBERATELY, added in the
          second fix round (finding MPR-018): they already satisfy (a) at the
          base, because .month-row-rail is two tracks
          (src/app/globals.css:790 through :792) and .month-rail-amount
          stacks the total over the delta (src/app/globals.css:822 through
          :827), so a criterion bound to spend rows alone would have proved
          nothing for two of the three cards while the mockup asks for the
          two-line row on the whole screen (README fix 1, and the income list
          item at delivery/design/mobile-v02/Main.dc.html:85 through :93).
          They fail (c) at the base for the same reason spend rows do: the
          row count sits inside the same wrapping flex as the label
          (.month-row-main, src/app/globals.css:794 through :801) and renders
          beside it. FALSIFIED BY one offending row in any of (a), (b) or
          (c).
