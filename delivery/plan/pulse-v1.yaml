  - id: M1-P3
    branch: claude/m1-p3-one-pot
    intent: >-
      Intake slice 2, one pot. Deterministic flow classification against
      user-declared account sets, transfer pairing with deterministic
      tie-breaks, the four corrections (card settlement, reserve drawdown,
      refunds, cash withdrawals), interpretation over a period window across
      accounts, full recompute plus profile-fix re-parse from rawLine, and
      the reconciliation identity held by a property test.
    grounding: >-
      pulse-v1-plan.md:154 (slice 2 row), pulse-v1-plan.md:89-116 (flow,
      classification order, the four corrections),
      pulse-v1-architecture.md:157-178 (interpretation window, recompute,
      pairing), charter.yaml:23-30 (core data model, reconciliation
      identity), acceptance-criteria.md:49-66. Ordered before merchant
      resolution on purpose: pretty names on wrong totals are worse than raw
      strings on right totals (pulse-v1-plan.md:162).
    severity: critical
    verified-root-cause: >-
      Not a defect phase. This is the phase the intake calls the quality bar:
      a finance overview that does not reconcile is a spreadsheet with better
      fonts (pulse-v1-plan.md:29). Any change to the reconciliation identity,
      flow semantics or the meaning of the four corrections is an escalation
      per charter.yaml:88-90, never a local call.
    steps:
      - text: >-
          Flow classification as pure domain functions over the declared
          sets: counterparty in the declared reserve set gives RESERVE signed
          by direction; in the declared pot set gives INTERNAL; then, between
          the declared-set checks and the sign fallback, the settlement-match
          step of the owner's v0.2 addendum section 5 (which binds v0.1,
          decision D-11) as specified in the corrections step below;
          unmatched INTERNAL stays INTERNAL and is flagged; otherwise sign
          decides SPEND or INCOME; then the remaining corrections
          (pulse-v1-plan.md:99-105). UNRESOLVED is shown, never dropped or
          defaulted into a total (charter.yaml:72-74).
      - text: >-
          The four corrections, each a named pure function
          (pulse-v1-plan.md:111-116). Card settlement follows the owner's
          v0.2 addendum section 5 amendment, which binds v0.1 and supersedes
          the fix round 1 declared-identifier mechanism (decision D-11):
          a debit matching a settlement description pattern (code-owned,
          for example MASTERCARD AFREKENING NUMMER) whose amount equals an
          imported card statement's settlement total (the total the
          statement carries, otherwise the sum of its line items), within a
          date window held as a named constant, classifies INTERNAL and is
          paired to that card import; the card-side positive settlement row
          classifies INTERNAL as the mirror leg; the card line items remain
          the only counted spend. If no matching card import exists (a card
          whose statements the household does not import), the settlement
          debit stays SPEND aggregated against the card issuer as merchant,
          the honest reading of an unitemised card, never INTERNAL and
          never UNRESOLVED. Reserve drawdown: return from reserves is a
          negative reserve movement, never income. Refunds: incoming from a
          counterparty with outgoing history is SPEND with positive amount.
          Cash withdrawals: their own destination, never split.
      - text: >-
          Transfer pairing, deterministic and order-independent: both legs in
          pot accounts of the same household, amounts exactly opposite,
          booking dates within the tolerance window (4 days, a named
          constant, decision D-7), each leg's counterparty account matching
          the other leg's account; ties broken by smallest date difference
          then lowest transaction id (pulse-v1-architecture.md:167-174).
          Reserve movements are never paired
          (pulse-v1-architecture.md:178).
      - text: >-
          Interpretation runs over the affected period window across all pot
          accounts, not over the imported rows, so an unmatched leg heals on
          the next upload (pulse-v1-architecture.md:157). Recompute is the
          same step with no import attached, over everything, one dev-only
          action (pulse-v1-architecture.md:159). The profile-fix re-parse
          rebuilds facts of affected imports from stored rawLine without
          re-upload and without losing declarations
          (pulse-v1-architecture.md:37), closing hazard H1.3 under
          criterion 2.7.
      - text: >-
          The reconciliation identity as a pure function over facts plus
          interpretation: income minus spend minus net-to-reserves equals
          change in pot, exactly, in integer cents, with the difference
          computed and surfaced when it does not hold.
    files-to-touch:
