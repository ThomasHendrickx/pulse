  - phase: M1-P1
    claim: >-
      charter.yaml line 9 pins kernel-version-pin 0.1.0. Checked: the wiring
      commit's package.json pins @tiphys/kernel 0.1.0 and the installed
      package reports version 0.1.0. Absent at c940e4d itself (no
      package.json there), satisfied by wiring commit 9b32e2a.
    verified: true
  - phase: M1-P1
    claim: >-
      CLAUDE.md's skills table names pulse-domain, pulse-frontend and
      pulse-typescript. Checked: .claude/skills/pulse-domain/SKILL.md,
      .claude/skills/pulse-frontend/SKILL.md and
      .claude/skills/pulse-typescript/SKILL.md all exist at c940e4d.
    verified: true
  - phase: M1-P2
    claim: >-
      pulse-v1-plan.md line 124 claims Belgian bank exports carry a statement
      number plus sequence number as a stable natural key per account. No
      export fixture exists at c940e4d; the owner's two real statements
      (notes/export-format-facts.md, 2026-08-17) settle it: the key HOLDS for
