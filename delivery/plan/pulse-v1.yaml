# pulse v1 delivery plan, written by the M0-P1 scout (plan-writer).
# Input report: delivery/intake/pulse-v1-plan.md, pulse-v1-architecture.md,
# acceptance-criteria.md, tiphys-pilot-success.md, plus charter.yaml; and,
# since fix round 2, delivery/intake/pulse-v0.2-pdf-addendum.md (main commit
# 669fd71), whose section 5 rule amendments explicitly bind v0.1.
# Baseline: c940e4d. Verification pass ran against the tree at that commit.
#
# work-log (incremental, newest last):
# - created beacon file before reading kernel docs and intake documents
# - read kernel docs: plan.schema.json, plan.example.yaml, gate-registry.yaml,
#   dispatch contract
# - read pulse-v1-plan.md, charter.yaml, pulse-v1-architecture.md,
#   acceptance-criteria.md, tiphys-pilot-success.md
# - verification pass: git ls-tree at c940e4d shows 15 files, no product code;
#   design/reference/pulse-prototype.html (395 lines) exists; messages en/nl/fr
#   exist (2890/3139/3220 bytes); styles/pulse-tokens.css (172 lines) and
#   styles/pulse-theme.css (53 lines) exist, no tokens.css; package.json exists
#   only from wiring commit 9b32e2a and carries no scripts; @tiphys/kernel
#   installed version prints 0.1.0; prototype contains Sign in, email and
#   password strings
# - wrote the plan below, then validated with tiphys validate, iterating on
#   diagnostics until exit 0
# - fix round 1 (R-061): read the adversarial review
#   delivery/review/pulse-v1-plan-adversarial.yaml (verdict revise, findings
#   PR-001..PR-014), notes/export-format-facts.md (fresh evidence from two
#   real statements), decisions DR-0001 (now decided) and DR-0003; applied
#   all fourteen findings, disputed none; re-validated to exit 0
# - fix round 2 (owner-directed): read pulse-v0.2-pdf-addendum.md from
#   origin/main (669fd71); realigned the card settlement mechanism to the
#   owner's section 5 amendment (supersedes the fix round 1 PR-002
#   mechanism, recorded as decision D-11); verified the dedup occurrence
#   mechanism already yields the addendum's cross-import end state
#   (ordinal-keyed insert-ignore keeps, per tuple, the highest occurrence
#   count seen) and strengthened criterion 1.2 to witness the
#   partial-overlap case; confirmed no v0.2 scope (PDF parsing, layout
#   templates, balance gate, mobile upload) leaks into v1; re-validated to
#   exit 0
kind: plan
status: draft
baseline-commit: c940e4d
binding-rule: >-
  If it is not written here, it is not being made. Unanswered questions go to
  the orchestrator.
process-summary: >-
  Orchestrated delivery on @tiphys/kernel 0.1.0, first real charter on the
  kernel. Verified plan, adversarial plan review, one phase per branch, fast
  gate (npm run typecheck, npm run lint, npm test) every iteration, Playwright
  golden journey before a phase closes, clean-room review before merge. Two
  milestones: M1 is the walking skeleton (intake slices 0 to 4), M2 is the
  post-skeleton pair (intake slices 5 and 6), gated on the owner using the
  skeleton for one real month (DR-0002).
standing-context: |
  What previous runs bought: nothing, this is the first plan on this charter.
  The repository at baseline c940e4d carries no product code: no src/, no
  app/, no prisma/, no package.json, no npm scripts. What it does carry, all
  verified by git ls-tree at c940e4d: the four intake documents under
  delivery/intake/, charter.yaml, CLAUDE.md, three agent skills under
  .claude/skills/ (pulse-domain, pulse-frontend, pulse-typescript), the design
  prototype design/reference/pulse-prototype.html (395 lines, includes a
  sign-in screen with email and password fields), message catalogs
  messages/en.json, messages/nl.json, messages/fr.json (2890, 3139, 3220
  bytes), and the token sources styles/pulse-tokens.css (172 lines, primitive
  plus semantic layers, oklch values) and styles/pulse-theme.css (53 lines).
  Later wiring commits (9b32e2a, 52c3af9) added the @tiphys/kernel 0.1.0 pin,
  retention directories under delivery/, and a session-start hook; they add no
  product code either. Deploy state: none, nothing has ever been deployed.

  Revision note, fix round 1 under R-061: the adversarial plan review
  (delivery/review/pulse-v1-plan-adversarial.yaml on branch
  claude/m0-p1-plan-review, verdict revise, findings PR-001 to PR-014) is
  applied in full in this revision, no finding disputed. Fresh evidence that
  postdates the first draft and grounds several findings: the fleet note
  notes/export-format-facts.md (2026-08-17) records structural facts from two
  real statements the owner provided. Belfius current account: the
  statement-plus-sequence natural key holds. KBC Mastercard: no per-row
  sequence exists so the hash path is mandatory, legitimate same-day
  same-amount same-merchant duplicate rows occur, FX sub-lines exist, and the
  card settlement appears on both sides with linkable references. The owner
  resolved that CSV from PC banking is the v1 input; CSV column layouts
  remain unverified against real exports.

  Revision note, fix round 2, owner-directed: the owner landed
  delivery/intake/pulse-v0.2-pdf-addendum.md on main (commit 669fd71). It is
  v0.2 intake (PDF import, out of v1 scope), but its section 5 declares two
  rule amendments that bind v0.1. First, the dedup occurrence index, which
  this plan has carried since fix round 1: its cross-import semantics
  (highest occurrence count per tuple wins) are what the ordinal-keyed
  insert-ignore already produces, and criterion 1.2 now witnesses the
  partial-overlap case explicitly. Second, a card settlement mechanism that
  SUPERSEDES the fix round 1 resolution of finding PR-002 (user-declared
  settlement-counterparty identifiers): classification gains a step between
  the declared-set checks and the sign fallback, matching settlement-pattern
  debits by amount against an imported card statement's settlement total
  within a date window, recorded as decision D-11. Everything else in the
  addendum (PDF parsing, layout templates, the balance contract, mobile
  share-sheet upload) is v0.2 machinery and stays out of this plan.

  Decision records touching this plan:
  DR-0001 is DECIDED (owner, 2026-08-17): the Playwright golden journey plus
  the fast gate, both green on the release commit, are the binding release
  verification for pulse v1. Phase M1-P5 exercises exactly that.
  DR-0002 remains OPEN: whether intake slices 5 and 6 proceed as specified
  after the owner has used the walking skeleton for one real month.
  pulse-v1-plan.md line 160 defers this explicitly ("Ship them, use them for
  one real month, then decide whether 5 and 6 still look right"). Phases
  M2-P1 and M2-P2 are planned to review quality but their fill-in stays
  unfilled until DR-0002 resolves, so they are valid for review and invalid
  for dispatch by construction.
report-code-disagreement:
  - phase: M1-P1
    claim: >-
      Dispatch grounding claim that the repository at c940e4d carries no
      product code. Checked with git ls-tree -r c940e4d: 15 files, all of them
      docs, skills, design reference, message catalogs and stylesheets; no
      src/, no app/, no prisma/, no package.json, no test files.
    verified: true
  - phase: M1-P1
    claim: >-
      charter.yaml line 68 constrains components to "design tokens from
      tokens.css only", and CLAUDE.md non-negotiable 4 says a missing token is
      added to tokens.css first. No file named tokens.css exists at c940e4d.
      The committed token source is styles/pulse-tokens.css (172 lines), whose
      own header carries the same rule. The claim as written names a file the
      tree does not have.
    verified: false
  - phase: M1-P1
    claim: >-
      acceptance-criteria.md lines 9 to 12 describe npm test, npm run
      test:e2e, npm run db:reset and (line 20) npm run typecheck and npm run
