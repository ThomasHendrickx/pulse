  - id: M1-P3
    branch: claude/m1-p3-one-pot
    intent: >-
      Intake slice 2, one pot. Deterministic flow classification against
      user-declared account sets, transfer pairing with deterministic
      tie-breaks, the four corrections (card settlement, reserve drawdown,
      refunds, cash withdrawals), interpretation over a period window across
      accounts, full recompute plus profile-fix re-parse from rawLine, and
      the reconciliation identity held by a property test.
    grounding: >-
      pulse-v1-plan.md:154 (slice 2 row), pulse-v1-plan.md:89-116 (flow,
      classification order, the four corrections),
      pulse-v1-architecture.md:157-178 (interpretation window, recompute,
      pairing), charter.yaml:23-30 (core data model, reconciliation
      identity), acceptance-criteria.md:49-66. Ordered before merchant
      resolution on purpose: pretty names on wrong totals are worse than raw
      strings on right totals (pulse-v1-plan.md:162).
    severity: critical
    verified-root-cause: >-
      Not a defect phase. This is the phase the intake calls the quality bar:
      a finance overview that does not reconcile is a spreadsheet with better
      fonts (pulse-v1-plan.md:29). Any change to the reconciliation identity,
      flow semantics or the meaning of the four corrections is an escalation
      per charter.yaml:88-90, never a local call.
    steps:
      - text: >-
          Flow classification as pure domain functions over the declared
          sets: counterparty in the declared reserve set gives RESERVE signed
          by direction; in the declared pot set gives INTERNAL; unmatched
          INTERNAL stays INTERNAL and is flagged; otherwise sign decides
          SPEND or INCOME; then the corrections (pulse-v1-plan.md:99-105).
          UNRESOLVED is shown, never dropped or defaulted into a total
          (charter.yaml:72-74).
      - text: >-
          The four corrections, each a named pure function: card settlement
          (the direct debit paying the card account is INTERNAL, card
          transactions are the spend), reserve drawdown (return from reserves
          is a negative reserve movement, never income), refunds (incoming
          from a counterparty with outgoing history is SPEND with positive
          amount), cash withdrawals (their own destination, never split)
          (pulse-v1-plan.md:111-116).
      - text: >-
          Transfer pairing, deterministic and order-independent: both legs in
          pot accounts of the same household, amounts exactly opposite,
          booking dates within the tolerance window (4 days, a named
          constant, decision D-7), each leg's counterparty account matching
          the other leg's account; ties broken by smallest date difference
          then lowest transaction id (pulse-v1-architecture.md:167-174).
          Reserve movements are never paired
          (pulse-v1-architecture.md:178).
      - text: >-
          Interpretation runs over the affected period window across all pot
          accounts, not over the imported rows, so an unmatched leg heals on
          the next upload (pulse-v1-architecture.md:157). Recompute is the
          same step with no import attached, over everything, one dev-only
          action (pulse-v1-architecture.md:159). The profile-fix re-parse
          rebuilds facts of affected imports from stored rawLine without
          re-upload and without losing declarations
          (pulse-v1-architecture.md:37), closing hazard H1.3.
      - text: >-
          The reconciliation identity as a pure function over facts plus
          interpretation: income minus spend minus net-to-reserves equals
          change in pot, exactly, in integer cents, with the difference
          computed and surfaced when it does not hold.
    files-to-touch:
      - src/modules/ledger/
      - src/modules/import/
      - prisma/
      - test/domain/classify-flow.test.ts
      - test/domain/pair-transfers.test.ts
      - test/domain/corrections.test.ts
      - test/property/reconciliation.test.ts
      - test/application/interpret.test.ts
    extras: []
    acceptance:
      - id: "2.1"
        criterion: >-
          npm test exits 0 with test/domain/classify-flow.test.ts covering
          all five flow values and the declared-set precedence (reserve set
          before pot set before sign).
      - id: "2.2"
        criterion: >-
          test/domain/pair-transfers.test.ts asserts pairing is deterministic
          and order-independent, shuffling insertion order and asserting an
          identical pair set, including the tie-break by date distance then
          id.
      - id: "2.3"
        criterion: >-
          The four corrections each have a named passing test in
          test/domain/corrections.test.ts, one describe block per correction
          (card settlement, reserve drawdown, refund, cash withdrawal).
      - id: "2.4"
        criterion: >-
          test/property/reconciliation.test.ts passes: a fast-check property
          test over generated datasets asserting income minus spend minus
          net-to-reserves equals change in pot, exactly, in integer cents,
          across at least 500 generated cases.
      - id: "2.5"
        criterion: >-
          An unmatched internal leg is excluded from both sides and surfaced,
          asserted in test/domain/pair-transfers.test.ts; interpretation
          re-run over the period window after a second file heals it,
          asserted in test/application/interpret.test.ts.
      - id: "2.6"
        criterion: >-
          npm run typecheck && npm run lint && npm test exit 0 and npm run
          test:e2e exits 0 at the phase head.
    hazard-classes:
      - id: H2.1
        statement: >-
          Card settlement double count: the settlement debit counted as spend
          on top of the card transactions, inflating every month.
        addressed-by: criterion 2.3
      - id: H2.2
        statement: >-
          Reserve drawdown counted as income, spiking income the month
          something big is funded from savings.
        addressed-by: criterion 2.3
      - id: H2.3
        statement: >-
          Pairing that depends on insertion order, making recompute unsafe
