      at the current tree package.json declares zero scripts. None of these
      commands exist yet; M1-P1 creates every one of them.
    verified: false
  - phase: M1-P1
    claim: >-
      pulse-v1-architecture.md line 49 claims the auth choice (Supabase Auth,
      email plus password) "matches the prototype". Checked by grep over
