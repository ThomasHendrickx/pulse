  - id: M1-P2
    branch: claude/m1-p2-import
    intent: >-
      Intake slice 1, import. File upload to immutable facts: one generic
      delimited-file parser driven by a user-declared SourceProfile, detect
      then propose then confirm over a five-row preview, account declaration
      at first sight (label, bank, ring), idempotent ingest with dedup keys,
      mixed-account files failing loudly with nothing written, and the raw
      source line kept on every transaction.
    grounding: >-
      pulse-v1-plan.md:153 (slice 1 row), pulse-v1-plan.md:75-87 (import is a
      conversation, one file is one account), pulse-v1-plan.md:124 (dedup
      key), pulse-v1-architecture.md:108-123 (SourceProfile and detection),
      pulse-v1-architecture.md:129-155 (pipeline and idempotency),
      acceptance-criteria.md:31-47.
    severity: high
    verified-root-cause: >-
      Not a defect phase. The verification-first step exists because the
      natural-key claim (statement plus sequence number in Belgian exports,
      pulse-v1-plan.md:124) could not be verified against the tree: no export
      fixture of any kind exists at c940e4d.
    steps:
      - kind: verification-first
        text: >-
          The statement-plus-sequence natural key claim is unverified: no real
          export exists in the tree. Build the committed synthetic fixtures to
          exercise both key paths (natural key present, hash fallback), treat
          the hash fallback as the guaranteed path, and when the owner's first
          anonymised real export arrives, verify the natural-key claim against
          it and record the outcome in the work history before widening
          reliance on it.
      - text: >-
          SourceProfile as a declaration-layer model carrying delimiter,
          encoding, header row index, date format, decimal style, amount
          representation (signed column, debit and credit pair, or amount plus
          D/C indicator) and column roles (pulse-v1-architecture.md:110-121).
      - text: >-
          Deterministic profile detection over the first lines: delimiter by
          frequency, decimal style by pattern, date format by parsing
          candidates against every row, amount representation by column shape
          (pulse-v1-architecture.md:123). No LLM anywhere in this phase.
      - text: >-
          One generic DelimitedFileParser behind the StatementParser port,
          parsing in memory with no writes. No per-bank parsers
          (pulse-v1-architecture.md:108).
      - text: >-
          The import status machine PARSED, AWAITING_DECLARATION, INGESTED,
          INTERPRETED, FAILED (pulse-v1-architecture.md:143-151). Account
          identity resolved from the file; unknown accounts asked once, at
          first sight, against parsed data, before anything reaches the
          ledger (pulse-v1-architecture.md:153).
      - text: >-
          Ingest: dedup key per row (natural key where present, otherwise
          hash of accountId, bookingDate, amount, normalisedCounterparty,
          reference), unique index per household, insert with duplicate
          skipping so re-upload is one statement not a read-then-write loop
          (pulse-v1-architecture.md:65). A file resolving to more than one
          account fails the entire import with status FAILED and zero rows
          written. rawLine stored on every transaction
          (pulse-v1-architecture.md:37).
      - text: >-
          Upload UI: file in, detected profile proposed with five parsed rows
          rendered as they will be stored, user confirms or fixes and names
          the profile; re-upload of overlapping periods reports added versus
          already-known counts and asks nothing.
    files-to-touch:
