    hazard-classes:
      - id: H1.1
        statement: >-
          Amount representation misdetected, silently inverting every sign in
          a history, the field a naive column mapping misses.
        addressed-by: criterion 1.1
      - id: H1.2
        statement: >-
          Silent partial import of a mixed-account file, poisoning pot totals
          in a way that is very hard to notice later.
        addressed-by: criterion 1.3
      - id: H1.3
        statement: >-
          A wrong confirmed profile writes wrong facts that no recompute
          fixes. rawLine (criterion 1.4) preserves the input; the re-parse
          action that consumes it ships with recompute.
        addressed-by: "later-phase: M1-P3"
    migrations: >-
      One migration in this phase adding Account, SourceProfile, Import and
