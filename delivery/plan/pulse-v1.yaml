decisions:
  - id: D-1
    statement: >-
      The ORM is Prisma. pulse-v1-plan.md:142 says "Drizzle or Prisma" and
      the port table at pulse-v1-architecture.md:106 still carries a Drizzle
      cell, but charter.yaml:16-19 pins Prisma as an irreversible stack
      decision and pulse-v1-architecture.md:48 agrees; the Drizzle mentions
      are leftovers, not options. The charter is the authority, so this was
      never an open question.
  - id: D-2
    statement: >-
      The v1 table set is the plan document's eight (pulse-v1-plan.md:57-69)
      plus SourceProfile and MerchantRule, plus the rawLine column on
      Transaction, because the charter's facts-versus-interpretation model
      (charter.yaml:23-30) requires profiles and corrections to exist as
      declaration rows for recompute to read. The architecture document
      already treats all three as given.
  - id: D-3
    statement: >-
      No invite flow and no Membership table in v1. The intake's only open
      item (pulse-v1-plan.md:202) is closed by the charter, which lists a
      second household member's invite flow as out of scope
      (charter.yaml:54-57); the tenant boundary stays drawn at the household
      so adding Membership later is additive.
  - id: D-4
    statement: >-
      styles/tokens.css becomes the single canonical token source: M1-P1
      moves the content of the committed styles/pulse-tokens.css there and
      in the same commit deletes pulse-tokens.css or reduces it to one
      import line, criterion 0.5 asserts byte-identity on that migration
      commit only, and every later token addition lands in tokens.css alone,
      so exactly one file answers the tokens.css name the charter and
      CLAUDE.md use and the two-truths drift finding PR-012 names cannot
      start.
  - id: D-5
    statement: >-
      The counterparty registration prompt threshold (pulse-v1-plan.md:82,
      "only above a threshold", value unspecified) starts at an unregistered
      counterparty IBAN seen at least twice in each direction, held as one
      named constant. A tunable default with a one-line change cost is not a
      product question.
  - id: D-6
    statement: >-
      Schema grows one migration per phase, owned by the module that owns
      the tables (M1-P1 Household and User, M1-P2 the facts and declaration
      tables, M1-P3 TransferLink, M1-P4 the merchant tables, M2-P1 the review
      queue), matching the schema folder layout at
      pulse-v1-architecture.md:61 and keeping every facts migration additive
      per charter.yaml:94-96.
  - id: D-7
    statement: >-
      The transfer pairing date tolerance starts at 4 days as a named
      constant, taken directly from pulse-v1-architecture.md:171 ("start at
      4 days, bank timing is not tight"); widening it later is a one-line
      change plus a recompute.
  - id: D-8
    statement: >-
      The working title Pulse stands through v1. pulse-v1-plan.md:196 defers
      the public name to "before anything public"; nothing in v1 is public
      beyond the owner's own deployment, so the naming decision sits past
      this plan's horizon and blocks nothing in it.
  - id: D-9
    statement: >-
      The slices map to two milestones: M1-P1 through M1-P5 are intake
      slices 0 through 4 (the walking skeleton), M2-P1 and M2-P2 are slices
      5 and 6, because pulse-v1-plan.md:160 makes the boundary between them
      an explicit owner checkpoint (DR-0002) rather than a scheduling
      accident. Intake slice ordering is preserved exactly, including slice
      2 ahead of merchant resolution (pulse-v1-plan.md:162).
  - id: D-10
    statement: >-
      The intake's slice numbering authority is the delivery table at
      pulse-v1-plan.md:150-158 together with acceptance-criteria.md. The
      prose references putting the Claude resolver at slice 4
      (pulse-v1-plan.md:137) and recurring at slice 5 (pulse-v1-plan.md:120
      and :166) are off-by-one leftovers of an earlier slice count and are
      read as slices 5 and 6, so M2-P1 and M2-P2 follow the table and no
      reordering of the intake has happened (finding PR-014).
  - id: D-11
    statement: >-
      Card settlement recognition follows the owner's v0.2 addendum section
      5 (delivery/intake/pulse-v0.2-pdf-addendum.md on main, commit 669fd71),
      which binds v0.1: between the declared-set checks and the sign
      fallback, a settlement-pattern debit whose amount equals an imported
      card statement's settlement total within a date window classifies
      INTERNAL paired to that card import, and with no matching card import
      it stays SPEND aggregated against the card issuer as merchant. This
      SUPERSEDES the fix round 1 resolution of finding PR-002 (user-declared
      settlement-counterparty identifiers on the card Account): owner-
      authored intake outranks the reviewer-proposed mechanism. The
      real-shape fixtures from that round remain in criterion 2.3; the
      unimported-card SPEND fallback gains its own criterion 2.8.
open-questions:
  - DR-0002
parked:
  - item: PSD2 / Ibanity bank connection.
    reason: >-
      Out of v1 by intake decision (pulse-v1-plan.md:49): the CSV path proves
      the domain model and insight quality, which is the actual risk; the
      bank connection swaps out one adapter later.
  - item: Conversational ask box.
    reason: >-
      v1.1 by intake decision (pulse-v1-plan.md:51): questions over bad
      merchant mapping return confidently wrong answers; resolution quality
      comes first.
  - item: Investment value tracking (positions and prices).
    reason: >-
      Out of scope per pulse-v1-plan.md:109 and charter.yaml:54-57; v1 shows
      what moved to reserves, not what reserves are worth.
  - item: Platform extraction from Hemma.
    reason: >-
      Deferred per pulse-v1-plan.md:144: copy the small things (tokens, i18n
      setup), extract only once Pulse is running and the repeating seams are
      visible.
  - item: Membership table and second-member invite flow.
    reason: >-
      Decision D-3: charter lists it out of scope; the household tenant
      boundary makes it additive later.
  - item: Per-transaction tag or merchant override.
    reason: >-
      pulse-v1-plan.md:121 and the charter's deliberately-absent list
      (charter.yaml:79-82): not needed to see the picture; corrections live
      on rules and merchants.
  - item: >-
      PDF statement import, layout templates, the balance contract gate,
      and mobile share-sheet upload.
    reason: >-
      All v0.2 machinery per the owner's addendum
      (delivery/intake/pulse-v0.2-pdf-addendum.md on main, commit 669fd71):
      CSV from PC banking is the resolved v1 input, and only the addendum's
      section 5 rule amendments (dedup occurrence index, settlement
      matching) bind v0.1. The balance contract is compatible with v1 but
      is not pulled in.
  - item: >-
      Queue, cron, event bus, caching layer, state management library,
      component library.
    reason: >-
      The deliberately-absent list is binding (charter.yaml:79-82,
      pulse-v1-architecture.md:271-275); each has a trigger and none of the
      triggers is a household with a few thousand transactions a year.
