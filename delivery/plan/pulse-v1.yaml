# pulse v1 delivery plan, written by the M0-P1 scout (plan-writer).
# Input report: delivery/intake/pulse-v1-plan.md, pulse-v1-architecture.md,
# acceptance-criteria.md, tiphys-pilot-success.md, plus charter.yaml.
# Baseline: c940e4d. Verification pass ran against the tree at that commit.
#
# work-log (incremental, newest last):
# - created beacon file before reading kernel docs and intake documents
# - read kernel docs: plan.schema.json, plan.example.yaml, gate-registry.yaml,
#   dispatch contract
# - read pulse-v1-plan.md, charter.yaml, pulse-v1-architecture.md,
#   acceptance-criteria.md, tiphys-pilot-success.md
# - verification pass: git ls-tree at c940e4d shows 15 files, no product code;
#   design/reference/pulse-prototype.html (395 lines) exists; messages en/nl/fr
#   exist (2890/3139/3220 bytes); styles/pulse-tokens.css (172 lines) and
#   styles/pulse-theme.css (53 lines) exist, no tokens.css; package.json exists
#   only from wiring commit 9b32e2a and carries no scripts; @tiphys/kernel
#   installed version prints 0.1.0; prototype contains Sign in, email and
#   password strings
# - wrote the plan below, then validated with tiphys validate, iterating on
#   diagnostics until exit 0
kind: plan
status: draft
baseline-commit: c940e4d
binding-rule: >-
  If it is not written here, it is not being made. Unanswered questions go to
  the orchestrator.
process-summary: >-
  Orchestrated delivery on @tiphys/kernel 0.1.0, first real charter on the
  kernel. Verified plan, adversarial plan review, one phase per branch, fast
  gate (npm run typecheck, npm run lint, npm test) every iteration, Playwright
  golden journey before a phase closes, clean-room review before merge. Two
  milestones: M1 is the walking skeleton (intake slices 0 to 4), M2 is the
  post-skeleton pair (intake slices 5 and 6), gated on the owner using the
  skeleton for one real month (DR-0002).
standing-context: |
  What previous runs bought: nothing, this is the first plan on this charter.
  The repository at baseline c940e4d carries no product code: no src/, no
  app/, no prisma/, no package.json, no npm scripts. What it does carry, all
  verified by git ls-tree at c940e4d: the four intake documents under
  delivery/intake/, charter.yaml, CLAUDE.md, three agent skills under
  .claude/skills/ (pulse-domain, pulse-frontend, pulse-typescript), the design
  prototype design/reference/pulse-prototype.html (395 lines, includes a
  sign-in screen with email and password fields), message catalogs
  messages/en.json, messages/nl.json, messages/fr.json (2890, 3139, 3220
  bytes), and the token sources styles/pulse-tokens.css (172 lines, primitive
  plus semantic layers, oklch values) and styles/pulse-theme.css (53 lines).
  Later wiring commits (9b32e2a, 52c3af9) added the @tiphys/kernel 0.1.0 pin,
  retention directories under delivery/, and a session-start hook; they add no
  product code either. Deploy state: none, nothing has ever been deployed.

  Open questions carried as decision records, statements here because the
  register itself is the orchestrator's to raise:
  DR-0001: the binding shape of release verification for pulse. charter.yaml
  lines 101 to 107 set mode reserved and name a working candidate (Playwright
  golden journey plus fast gate, green on the release commit); the owner has
  not yet decided. Phase M1-P5 exercises the working candidate and its
  acceptance does not change under any resolution.
  DR-0002: whether intake slices 5 and 6 proceed as specified after the owner
  has used the walking skeleton for one real month. pulse-v1-plan.md line 160
  defers this explicitly ("Ship them, use them for one real month, then decide
  whether 5 and 6 still look right"). Phases M2-P1 and M2-P2 are planned to
  review quality but their fill-in stays unfilled until DR-0002 resolves, so
  they are valid for review and invalid for dispatch by construction.
