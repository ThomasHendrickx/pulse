    verified: true
phases:
  - id: M1-P1
    branch: claude/m1-p1-skeleton
    intent: >-
      Intake slice 0, skeleton. Stand up the deployable application: Next.js
      App Router, TypeScript strict, Prisma with the schema folder layout,
      local Postgres via supabase start, Supabase Auth with email and
      password, one household with one user, the full npm script set CLAUDE.md
      names, both test gates runnable, the committed design tokens and message
      catalogs wired in, and a first Vercel deployment.
    grounding: >-
      pulse-v1-plan.md:152 (slice 0 row), charter.yaml:16-42 (irreversible
      stack, tenancy and auth decisions), acceptance-criteria.md:16-29. The
      baseline tree has no product code, so this phase creates the entire
      scaffold; the two unverified claims it owns (no tokens.css, no npm
      scripts) are exactly the gaps it closes.
    severity: high
    verified-root-cause: >-
      Not a defect phase, greenfield scaffolding. The verification-first step
      exists because two intake claims about the tree failed verification (the
      tokens.css name and the npm script set) and this phase is where both
      resolve.
    steps:
      - kind: verification-first
        text: >-
          Confirm the two failed claims this phase owns before scaffolding:
          (a) no tokens.css exists, the committed token source is
          styles/pulse-tokens.css plus styles/pulse-theme.css; (b) no npm
          scripts exist at the baseline. Write the confirmation into the work
          history, then build so both claims become true: the token content
          moves to styles/tokens.css as the single canonical source
          (decision D-4), and every command CLAUDE.md names exists in
          package.json.
      - text: >-
          Scaffold Next.js App Router with TypeScript strict under src/, npm
          only, with the module layout from pulse-v1-architecture.md:73-97
          (src/modules/, src/platform/) and npm scripts dev, typecheck, lint,
          test, test:e2e, db:reset, db:migrate.
      - text: >-
          Prisma with the schema folder layout, one schema file per module
          (pulse-v1-architecture.md:61). Initial migration creates Household
          and User only; every later model lands with the phase that owns its
          module (decision D-6). Every model except Household carries a
          non-null householdId (charter.yaml:31-35).
      - text: >-
          Supabase Auth with email and password, no OAuth, no magic links
          (charter.yaml:36-38). Household context resolved once at the server
          action or route boundary and passed explicitly into use cases and
          repositories (pulse-v1-architecture.md:217). Seed one household
          with one user for local dev and tests.
      - text: >-
          Wire the design tokens: move the content of styles/pulse-tokens.css
          to styles/tokens.css as the single canonical token source, and in
          the same commit delete styles/pulse-tokens.css or reduce it to one
          import line, so exactly one file answers the tokens.css name
          CLAUDE.md non-negotiable 4 uses from then on (decision D-4). Wire
          tokens.css and styles/pulse-theme.css as the app's only styling
          source next to Tailwind v4, and next-intl with the committed
          messages/en.json, messages/nl.json, messages/fr.json, language
          order EN, NL, FR.
      - text: >-
          Set up Vitest (fast gate) and Playwright (slow gate) with a fixed
          injected clock and a seeded household (pulse-v1-architecture.md:247),
          write test/schema/tenancy.test.ts and test/e2e/auth.spec.ts, and
          deploy to Vercel with the pooled connection string at runtime and
          the direct connection string for migrations
          (pulse-v1-architecture.md:65).
    files-to-touch:
      - package.json
      - package-lock.json
      - tsconfig.json
      - next.config.ts
      - vitest.config.ts
      - playwright.config.ts
      - .env.example
      - prisma/
      - src/
      - styles/tokens.css
      - styles/pulse-tokens.css
      - test/schema/tenancy.test.ts
      - test/e2e/auth.spec.ts
    extras: []
    acceptance:
      - id: "0.1"
        criterion: >-
          npm ci && npm run typecheck && npm run lint && npm test exit 0 on a
          clean clone.
      - id: "0.2"
        criterion: >-
          npm run db:reset exits 0 against local supabase start, applying all
          migrations; npx prisma migrate status exits 0 and reports no pending
          migrations.
      - id: "0.3"
        criterion: >-
          npm run test:e2e exits 0 with test/e2e/auth.spec.ts passing: it
          signs up with email and password, signs out, signs in again, and
          asserts an authenticated household context renders.
      - id: "0.4"
        criterion: >-
          test/schema/tenancy.test.ts passes under npm test with three named
          assertions and the mechanism for each named: (a) reading the Prisma
          DMMF, every model except Household carries a non-null householdId;
          (b) reading the same DMMF, every model field whose name matches
          /amount|balance|total|cents/i has type Int or BigInt, never Float
          or Decimal; (c) a static analysis over src/modules/**/adapters
          using the TypeScript compiler API (or ts-morph) asserts every
          exported repository function declares a parameter of the household
          context type.
      - id: "0.5"
        criterion: >-
          On the commit that moves the tokens, styles/tokens.css carries
          token declarations byte-identical to styles/pulse-tokens.css at
          baseline c940e4d, and at most one canonical token file remains
          (pulse-tokens.css deleted or reduced to a single import line);
          later token additions land in tokens.css alone. grep -rE
          "oklch\(|#[0-9a-fA-F]{3,8}" over src/ excluding the token and
          theme files exits 1 (no matches).
      - id: "0.6"
        criterion: >-
          curl -s -o /dev/null -w "%{http_code}" against the deployed Vercel
          URL prints 200 and the sign-in page HTML contains the localized
          sign-in heading; a database-backed path is exercised against the
          deployed environment (the sign-up flow of test/e2e/auth.spec.ts
          run against the deployed URL, or a curl to a route performing a
          database query returning 200 with expected content); and npx
          prisma migrate status exits 0 against the deployed database over
          the direct connection string, reporting no pending migrations.
    hazard-classes:
      - id: H0.1
        statement: >-
          A session or household read buried inside a repository or query
          builder, making tenant scoping ambient instead of explicit, the one
          decision the intake says cannot be retrofitted.
        addressed-by: criterion 0.4
      - id: H0.2
        statement: >-
          Literal colours, font sizes or spacing creeping into components
          before the slice 4 grep gate exists, normalising the violation.
        addressed-by: criterion 0.5
      - id: H0.3
        statement: >-
          Migrations run over the pooled connection string, the single most
          common way this stack breaks on first deploy per
          pulse-v1-architecture.md:65.
        addressed-by: criterion 0.6
    migrations: >-
      One initial migration creating Household and User with the householdId
      constraint pattern every later table copies.
    conflicts-with: []
    parallelizable: false
    citations:
      - delivery/intake/pulse-v1-plan.md:152
      - delivery/intake/acceptance-criteria.md:16
      - delivery/intake/pulse-v1-architecture.md:61
      - delivery/intake/pulse-v1-architecture.md:217
      - charter.yaml:31
    fill-in:
      filled: true
      root-cause: >-
        Greenfield, no defect. Basis verified against the tree at c940e4d:
        no product code exists, scaffold from zero.
      fix-shape: >-
        Full application scaffold, auth, tenancy backbone, both gates, first
        deploy.
      files:
        - package.json
        - prisma/
        - src/
  - id: M1-P2
    branch: claude/m1-p2-import
    intent: >-
      Intake slice 1, import. File upload to immutable facts: one generic
      delimited-file parser driven by a user-declared SourceProfile, detect
      then propose then confirm over a five-row preview, account declaration
      at first sight (label, bank, ring), idempotent ingest with dedup keys,
      mixed-account files failing loudly with nothing written, and the raw
      source line kept on every transaction.
    grounding: >-
      pulse-v1-plan.md:153 (slice 1 row), pulse-v1-plan.md:75-87 (import is a
      conversation, one file is one account), pulse-v1-plan.md:124 (dedup
      key), pulse-v1-architecture.md:108-123 (SourceProfile and detection),
      pulse-v1-architecture.md:129-155 (pipeline and idempotency),
      acceptance-criteria.md:31-47.
    severity: high
    verified-root-cause: >-
      Not a defect phase. The verification-first step exists because the
      intake's natural-key claim (pulse-v1-plan.md:124) is refuted as a
      general property by the recorded evidence (per-format only, see the
      report-code-disagreement entries), because the skill's hash recipe
      collapses legitimate duplicate rows (finding PR-001), and because the
      CSV column layouts of real PC-banking exports remain unverified.
    steps:
      - kind: verification-first
        text: >-
          The natural-key question is part-answered by recorded evidence
          (notes/export-format-facts.md, two real statements, 2026-08-17):
          the statement-plus-sequence key HOLDS for the Belfius current
          account format and FAILS for the KBC Mastercard format, which
          carries no per-row sequence number. The key choice is therefore a
          per-SourceProfile property: natural key where the profile has one,
          content hash mandatory for card profiles. The remaining unverified
          claim is the CSV column layouts of real PC-banking exports (the
          owner's examples were PDF; CSV is the v1 input): when the first
          anonymised real CSV arrives, verify the committed fixture layouts
          against it and record the outcome in the work history before
          widening reliance on them.
      - text: >-
          SourceProfile as a declaration-layer model carrying delimiter,
          encoding, header row index, date format, decimal style, amount
          representation (signed column, debit and credit pair, or amount plus
          D/C indicator) and column roles (pulse-v1-architecture.md:110-121).
      - text: >-
          Deterministic profile detection over the first lines: delimiter by
          frequency, decimal style by pattern, date format by parsing
          candidates against every row, amount representation by column shape
          (pulse-v1-architecture.md:123). No LLM anywhere in this phase.
      - text: >-
          One generic DelimitedFileParser behind the StatementParser port,
          parsing in memory with no writes. No per-bank parsers
          (pulse-v1-architecture.md:108).
      - text: >-
          The import status machine PARSED, AWAITING_DECLARATION, INGESTED,
          INTERPRETED, FAILED (pulse-v1-architecture.md:143-151). Account
          identity resolved from the file; unknown accounts asked once, at
          first sight, against parsed data, before anything reaches the
          ledger (pulse-v1-architecture.md:153).
      - text: >-
          Ingest: dedup key per row. Natural key where the profile has one;
          otherwise the hash path, and the hash key is the content hash over
          accountId, bookingDate, amount, normalisedCounterparty and
          reference PLUS the occurrence ordinal of that row among
          identical-content rows within the same file, so two legitimate
          identical rows (observed in the real KBC statement) get distinct
          keys while re-uploading the same file maps each row to the same
          key and adds nothing (finding PR-001; the ordinal-free recipe in
          pulse-domain SKILL.md collapses them; confirmed by the owner's
          v0.2 addendum section 5, which binds v0.1). Across imports, the
          insert-ignore over ordinal-suffixed keys keeps, per identical
          tuple, the highest occurrence count seen, which is exactly the
          addendum's cross-import rule. Unique index per household,
          insert with duplicate skipping so re-upload is one statement not a
          read-then-write loop (pulse-v1-architecture.md:65). A file
          resolving to more than one account fails the entire import with
          status FAILED and zero rows written. rawLine stored on every
          transaction (pulse-v1-architecture.md:37).
      - text: >-
          Upload UI: file in, detected profile proposed with five parsed rows
          rendered as they will be stored, user confirms or fixes and names
          the profile; re-upload of overlapping periods reports added versus
          already-known counts and asks nothing.
    files-to-touch:
      - src/modules/accounts/
      - src/modules/import/
      - prisma/
      - test/domain/profile-detection.test.ts
      - test/application/ingest.test.ts
      - test/fixtures/
      - test/e2e/import.spec.ts
    extras:
      - src/app/
      - src/platform/
      - messages/
      - vitest.config.ts
      - test/app/
      - test/schema/
      - test/domain/dedup.test.ts
      - test/application/fake-import-world.ts
      - .claude/skills/pulse-domain/SKILL.md
    acceptance:
      - id: "1.1"
        criterion: >-
          npm test exits 0 with test/domain/profile-detection.test.ts
          passing, covering delimiter (";" and ","), encoding (UTF-8 and
          Windows-1252), header row offset, date formats DD/MM/YYYY and
          YYYY-MM-DD and DD.MM.YY, decimal styles 1.234,56 and 1234.56, and
          all three amount representations against committed synthetic
          fixtures in test/fixtures/. The fixture set includes a card-profile
          family mirroring the observed KBC shape: no counterparty-account
          column, no statement or sequence numbers, at least one FX row
          carrying original-amount and exchange-rate sub-line content, and
          two legitimate identical same-day same-amount same-merchant rows.
          Every decimal-style fixture asserts the parsed amount is an
          integer number of cents.
      - id: "1.2"
        criterion: >-
          test/application/ingest.test.ts asserts that importing fixture A
          then re-importing an overlapping fixture A2 adds exactly the
          non-overlapping rows and reports added versus already-known counts;
          dedup keys are unique per household; a fixture containing two
          identical same-day same-amount same-merchant rows stores two
          Transaction rows, with a re-upload of that same fixture adding
          zero; and in the partial-overlap case (import A carries one
          occurrence of an identical tuple, a later overlapping import B
          carries two) the end state is exactly two rows, the cross-import
          rule of the owner's v0.2 addendum section 5.
      - id: "1.3"
        criterion: >-
          A fixture containing rows from two accounts fails the import with
          status FAILED and zero rows written, asserted in
          test/application/ingest.test.ts.
      - id: "1.4"
        criterion: >-
          Every stored Transaction carries rawLine equal to its source line,
          asserted in test/application/ingest.test.ts.
      - id: "1.5"
        criterion: >-
          npm run test:e2e exits 0 with test/e2e/import.spec.ts passing: it
          uploads a first file, is asked to declare the account (label, bank,
          ring) and confirm the detected profile over a five-row preview,
          completes, re-uploads the same file, and asserts zero new rows and
          no questions asked.
      - id: "1.6"
        criterion: >-
          npm run typecheck && npm run lint && npm test exit 0 at the phase
          head.
    hazard-classes:
      - id: H1.1
        statement: >-
          Amount representation misdetected, silently inverting every sign in
          a history, the field a naive column mapping misses.
        addressed-by: criterion 1.1
      - id: H1.2
        statement: >-
          Silent partial import of a mixed-account file, poisoning pot totals
          in a way that is very hard to notice later.
        addressed-by: criterion 1.3
      - id: H1.3
