claims:
  - id: C-5-middleware-red
    kind: coverage
    statement: >-
      The manifest test and the unauthenticated-share test fail against the
      pre-phase middleware and pass against the phase's. With
      src/middleware.ts restored to its base content and everything else at
      the phase tree, both fail on the status code; with the phase's
      middleware both pass. The file was copied back afterwards and its
      diff against the base checked.
    settled-by:
      executed-construction:
        command: >-
          git show HEAD:src/middleware.ts > src/middleware.ts; npx
          playwright test share-target --project=chromium -g
          "manifest|unauthenticated"; then the phase's middleware restored
        exit-code: 1
        output: |
          ✘  1 [chromium] › test/e2e/share-target.spec.ts:54:5 › the manifest is served without a session and declares a PDF share target (93ms)
          ✘  2 [chromium] › test/e2e/share-target.spec.ts:82:5 › an unauthenticated share goes to sign-in with a 303 and nothing is kept (170ms)
              Expected: 200
              Received: 307
              Expected: 303
              Received: 307
            2 failed
  - id: C-5.2-no-cache
    kind: coverage
    statement: >-
      No caching API and no service worker exist in the tree.
    settled-by:
      executed-construction:
        command: "grep -rE \"caches\\.|CacheStorage|workbox\" src/"
        exit-code: 1
        output: "(no output); and no sw.js or service-worker file exists outside node_modules"
  - id: C-5-no-literal-colour
    kind: coverage
    statement: >-
      No literal oklch() or hex colour exists anywhere under src/.
    settled-by:
      executed-construction:
        command: "grep -rE \"oklch\\(|#[0-9a-fA-F]{3,8}\" src/"
        exit-code: 1
        output: "(no output)"
  - id: C-5-on-device
    kind: open-question
    statement: >-
      Pulse installs on the owner's Android phone and appears in its share
      sheet for a PDF, and a share from the banking app lands in the import
      flow.
    still-open-because: >-
      No Android device is reachable from the container. The manifest and
      the route are checked against the request Chromium's source says a
      share sends; the owner sharing one real statement is the witness.
  - id: C-5-body-size
    kind: open-question
    statement: >-
      Whether the share route should cap the size of a shared file the way
      Next's default caps the upload server action at 1 MB.
    still-open-because: >-
      A cap needs a number and a refusal sentence in three catalogues; it
      is a product choice, not a fix-round correction (finding HZ-002,
      low). Reachable only with a household session.
  - id: C-5-merged-at-approved-head
    kind: coverage
    statement: >-
      CLOSING RECORD, written after the merge. Both round two verdicts
      (delivery/review/m3-p5-criteria-round2.json and
      m3-p5-hazard-round2.json) read APPROVE at head 98fbadc, with no
      finding at medium or above, and the kernel's pair check reports
      verdict-pair-approves satisfied for that head; its
      dual-review-decorrelation line names the shared family, which DR-0003
      discharges (no review-families declaration, DR-0032). CI's fast and
      slow gates were green on 98fbadc. Pull request 25 merged with its
      head pinned to 98fbadc, and main's tree equals 98fbadc's tree.
      Round two's six lows are carried, not re-reviewed (CLAUDE.md rule
      10): CR2-M3P5-01 and HZ2-001 (the route's comment and key decision
      say the cross-site check does not rely on the SameSite cookie; for a
      POST with Origin null and no Sec-Fetch-Site it does, which only an
      older browser without Fetch Metadata sends; carried as code work:
      refuse that combination and add a unit case), HZ2-002 (no test pins
      the anchored manifest matcher; carried as code work), HZ-002 (body
      size, open claim C-5-body-size, which should also say that until a
      cap exists a PDF over 1 MB fails through the upload form and
      succeeds through the share sheet), CR2-M3P5-02 and CR2-M3P5-03
      (below).
    settled-by:
      executed-construction:
        command: >-
          git rev-parse origin/main^{tree} 98fbadc^{tree}; git log
          --format='%h parents %p' -1 origin/main
        exit-code: 0
        output: |
          8edba11701ff0f6c2eb2574091395ae02dcccfe5
          8edba11701ff0f6c2eb2574091395ae02dcccfe5
          35d2e55 parents dff0824 98fbadc
environment-warnings:
  - warning: >-
      The Docker daemon did not survive the session resume: dockerd failed
      with "failed to start containerd: timeout waiting for containerd to
      start" until the stale containerd pid and socket files under
      /var/run/docker were removed. The local Supabase stack then came back
      with its data, migrations included. Every e2e run pinned the six
      connection variables to that local stack.
    evidence: >-
      dockerd log: "Daemon shutdown complete" error="failed to start
      containerd: timeout waiting for containerd to start"; after removing
      the stale files, docker info succeeded and supabase start reported
      the four kept services healthy.
