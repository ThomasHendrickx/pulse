kind: work-history
phase: M3-P5
prompt: |
  todo:

  * Add a CI workflow to pulse.
  * Merge one pulse phase at exactly the commit its reviewers approved.
  pulse fleet also needs to update to 0.2.1
files-touched:
  - src/app/manifest.ts
  - src/app/(app)/import/share/route.ts
  - src/middleware.ts
  - src/modules/import/ui/share-target.ts
  - src/modules/import/ui/index.ts
  - scripts/generate-app-icons.ts
