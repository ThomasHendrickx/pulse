claims:
  - id: C-5-middleware-red
    kind: coverage
    statement: >-
      The manifest test and the unauthenticated-share test fail against the
      pre-phase middleware and pass against the phase's. With
      src/middleware.ts restored to its base content and everything else at
      the phase tree, both fail on the status code; with the phase's
      middleware both pass. The file was copied back afterwards and its
      diff against the base checked.
    settled-by:
      executed-construction:
        command: >-
          git show HEAD:src/middleware.ts > src/middleware.ts; npx
          playwright test share-target --project=chromium -g
          "manifest|unauthenticated"; then the phase's middleware restored
        exit-code: 1
        output: |
          ✘  1 [chromium] › test/e2e/share-target.spec.ts:54:5 › the manifest is served without a session and declares a PDF share target (93ms)
          ✘  2 [chromium] › test/e2e/share-target.spec.ts:82:5 › an unauthenticated share goes to sign-in with a 303 and nothing is kept (170ms)
              Expected: 200
              Received: 307
              Expected: 303
              Received: 307
            2 failed
  - id: C-5.2-no-cache
    kind: coverage
    statement: >-
      No caching API and no service worker exist in the tree.
    settled-by:
      executed-construction:
        command: "grep -rE \"caches\\.|CacheStorage|workbox\" src/"
        exit-code: 1
        output: "(no output); and no sw.js or service-worker file exists outside node_modules"
  - id: C-5-no-literal-colour
    kind: coverage
    statement: >-
      No literal oklch() or hex colour exists anywhere under src/.
    settled-by:
      executed-construction:
        command: "grep -rE \"oklch\\(|#[0-9a-fA-F]{3,8}\" src/"
        exit-code: 1
        output: "(no output)"
environment-warnings:
  - warning: >-
      The Docker daemon did not survive the session resume: dockerd failed
      with "failed to start containerd: timeout waiting for containerd to
      start" until the stale containerd pid and socket files under
      /var/run/docker were removed. The local Supabase stack then came back
      with its data, migrations included. Every e2e run pinned the six
      connection variables to that local stack.
    evidence: >-
      dockerd log: "Daemon shutdown complete" error="failed to start
      containerd: timeout waiting for containerd to start"; after removing
      the stale files, docker info succeeded and supabase start reported
      the four kept services healthy.
