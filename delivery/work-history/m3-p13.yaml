key-decisions:
  - decision: >-
      The basis and the row count are READ off M3-P12's identity and off the
      group's own fields, and this phase derives neither. ReviewGroup gains a
      `basis` field set from counterpartyIdentity(row).basis and nothing else,
      and the reach sentence is given group.count, the same number the row
      already prints beside the label.
    why: >-
      The plan's grounding says this phase consumes M3-P12's identity and adds
      no derivation of its own, and hazard H13.6 is exactly the failure of a
      second, independent count. Two numbers that mean the same thing can
      disagree; one number cannot.
  - decision: >-
      An account-basis group hands the screen its ACCOUNT through a separate
      field, accountAlias, and not through `label`. `label` keeps the
      descriptor for those groups, which is what the deterministic sort reads,
      and the screen renders the masked alias in its place. SETTLED BY THE
      ASSIGNMENTS THEMSELVES rather than by this sentence: grep -n "label:"
      src/modules/merchants/domain/merchant-review.ts returns four sites (the
      type at :70, the accumulator at :134, the constructor at :191 and the
      projection at :243), and the only values any of them can take are the
      merchant name, the carried counterparty name and the normalised
      descriptor. The account reaches accountAlias, off the KEY, at one place.
    why: >-
      Putting a bare account number in `label` would make the screen's masking
      a matter of remembering: `label` is masked with the CARD mask everywhere
      it is rendered, and the card mask does not touch an account number, so a
      single missed call site would print it in full. A separate field forces
      the display rule to be chosen explicitly at the one place that renders
      it, and the derivation test in test/domain/merchant-review.test.ts sees
      that place.
  - decision: >-
      The account mask is a TEXT SCRUBBER applied to descriptor text as well
      as to the alias, not a formatter applied to the alias alone.
    why: >-
      This phase puts transaction descriptions on the screen for the first
      time, and a transfer descriptor carries the counterparty account exactly
      as the statement printed it. Measured on the shipped normaliser: the
      label an account-basis group would otherwise carry contains the account
      in its spaced form. Rendering the lines without a scrubber would have
      created hazard H13.2 in the act of answering it.
  - decision: >-
      The mask identifies an account by the registry's COUNTRY AND LENGTH and
      consumes exactly that many characters, rather than matching a wide shape
      and validating afterwards.
    why: >-
      The first draft did match-then-validate and was measured wrong on a real
      sentence: a greedy group-shaped pattern swallowed the following word,
      the compacted match was then the wrong length, the validity test refused
      it and the account was printed in full. The failure mode of that design
      is silent leakage, so the design was replaced rather than patched.
  - decision: >-
      The transactions behind a group are a native <details> disclosure inside
      the existing row, fed by a children slot on the client leaf, and are
      rendered for RESOLVED groups as well as unresolved ones.
    why: >-
      The plan's step forbids a new client component and a new server action,
      and a native disclosure needs neither and carries its own accessible
      name. Rendering them for resolved groups too is a deliberate reading of
      "let the transactions behind a group be seen": DR-0027's merge is the
      same merge once the group is named, and hiding the lines at the moment
      the owner has just named something would remove the evidence exactly
      when it is most likely to be questioned.
  - decision: >-
      REVERSED IN THE FIX ROUND, and the original decision is quoted rather
      than deleted. It read: "The row's data-group-key is left UNMASKED for an
      account-basis group", on the ground that "two accounts sharing a
      country, check digits and last four characters mask to one string, and
      that attribute is the row identity criterion 11.3 and the
      optimistic-naming spec both address rows by. A collision there is a
      wrong row targeted, which is worse than an unrendered attribute carrying
      an account." data-group-key is now an OPAQUE DIGEST of the key.
    why: >-
      Both review lanes refuted the original independently and they were
      right on two counts. The argument was wrong ABOUT THE CRITERION:
      criterion 11.3 says the attribute is added MASKED and accepts
      masked-key indistinguishability in terms (finding DELTA-M0P4-08), so
      collision there is a declared limitation rather than a breach. And it
      posed a false choice: the collision it worried about is real for the
      OTHER consumer, the client naming-claims store, but a digest answers
      both halves at once, because it carries no identifier AND stays
      injective wherever the key is. The excluded set for criterion 13.2
      therefore shrinks from three channels to two, which is the direction a
      screen carrying an account should move.
  - decision: >-
      CountedTransaction and CountedRow gain bookingDate, selected in the
      adapter and converted once at the repository boundary.
    why: >-
      The lines need each transaction's own date and the read was already
      ORDERED by that column without selecting it. The conversion to the
      branded calendar string happens at the boundary, per pulse-typescript
      section 2, so no Date crosses into the domain.

verification-first:
  - finding: >-
      Read at the merged head 975d0ce, before any edit. ReviewGroup
      (src/modules/merchants/domain/merchant-review.ts) exposes: key (the
      merchant id for a resolved group, the namespaced counterparty identity
      key otherwise), label (the merchant name, or the lexicographically
      smallest normalised descriptor for an unresolved group), merchantId,
      counterpartyText (present only on a nameable unresolved group, and its
      value is ALREADY the namespaced identity key, not a raw text),
      unnameableReason, totalCents and count. It exposes no basis, no account
      and no rows. The naming form's hidden input is named counterpartyText
      and is fed group.counterpartyText through the MerchantGroupRow client
      leaf's naming.identityKey prop, so the subject the form submits is
      already the identity key. The plan's verified-root-cause says that field
      "has to carry the identity key instead"; M3-P12 already made it so, and
      that half of the root cause is therefore stale relative to this head.
      The half that is NOT stale is the other one: an account-basis group has
      no label a person can recognise, because label is still a descriptor.
    contradicts-plan: false
  - finding: >-
      M3-P8 has NOT merged. There is no origin branch matching
      claude/m3-p8-mobile-merchant-review (git branch -r | grep p8 returns
      only origin/claude/m0-p8-plan-testid) and no commit on origin/main names
      M3-P8. The group row is therefore the BASELINE row: one wrapping flex
      line, .merchant-row in src/app/globals.css, carrying label, count, total
      and the naming form, with the wrap added in M3-P6 for the phone width.
      This phase is built on that row, which is hazard H13.7's second arm and
      the one the merge state selects.
    contradicts-plan: false
  - finding: >-
      Criterion 13.2 cannot be satisfied as written, because its two halves
      contradict each other on this screen. Settled by construction, and the
      construction is claim C13-2 below plus the slow-gate assertion
      expect(await page.content()).toContain(account), which passes: the
      account IS in the page source, through the machine identities, and the
      criterion forbids exactly that while requiring one of them. It requires that the rendered HTML
      of /merchants "does NOT contain the unmasked account anywhere, asserted
      over the full page source" AND that "the hidden field the naming form
      submits carries the unmasked namespaced identity key, asserted on the
      same page". For an account-basis group the namespaced identity key IS
      the string "account:" followed by that account in its canonical form
      (src/modules/merchants/domain/counterparty-identity.ts, the account
      branch of counterpartyIdentity), so the second half puts the unmasked
      account into the page source and the first half forbids it. The plan
      carries no amendment note resolving this: grep for 13.2 in
      delivery/plan/pulse-v02.yaml returns the criterion and the two hazard
      cross-references only, and the plan has no amendment-notes section.
      Decision D-41 and hazard H13.2 both speak about the account being
      RENDERED and about a screenshot, which is the reading the rest of the
      criterion supports.
    contradicts-plan: true
    stopped-and-reported: >-
      Reported to the orchestrator in the phase report with the exact criterion
      text, and not improvised around. The work continued on everything the
      question does not block. What was built and asserted instead is the
      strongest form that is true, stated in the spec beside the assertion:
      the account appears in NO rendered text of the page in either the
      compact or the spaced shape, and every occurrence of it in the page
      source sits in one of the two machine identities that must hold it
      unmasked, the hidden counterpartyText field the criterion itself
      requires and the row's data-group-key. Neither is rendered, so neither
      reaches a screenshot.
  - finding: >-
      Measured before the change, on the shipped normaliser, with tsx: for a
      Belfius transfer descriptor the label an account-basis group carries is
      the normalised descriptor and it contains the counterparty account in
      the SPACED form the statement prints. Command: npx tsx over a probe
      calling normaliseCounterparty(counterpartyText({description})) with the
      committed fixture's own invented account. Output: "label carries the
      account spaced: true", "label carries the account compact: false". So
      /merchants printed a counterparty account in full before this phase, and
      the assertion that reddens against the unfixed screen is the one on the
      SPACED shape, not the compact one. The spec asserts both shapes; a
      compact-only assertion would have passed against the unfixed screen.
    contradicts-plan: false
  - finding: >-
      The Belfius PDF template stores a counterparty ACCOUNT and no
      counterparty NAME. Captured: grep -c "counterpartyName"
      src/modules/import/domain/belfius-current-account-template.ts prints 0
      and exits 1, while grep -n "counterpartyIban" on the same file returns
      three sites (the declaration, the assignment and the row builder). So
      on the fixture criterion 13.1 names, every account-basis group takes
      decision D-41's second branch, the masked account, and the first branch,
      the carried counterparty name, has no witness in the slow gate. It is
      witnessed in the fast gate instead, over rows built with a name.
    contradicts-plan: false

deviations:
  - plan-clause: >-
      Criterion 13.2, "the rendered HTML of /merchants contains the masked form
      and does NOT contain the unmasked account anywhere, asserted over the
      full page source; and the hidden field the naming form submits carries
      the unmasked namespaced identity key, asserted on the same page."
    why: >-
      The two halves cannot both hold, because the namespaced identity key of
      an account-basis group is the namespace followed by that account. The
      verification-first record above carries the derivation and the
      escalation. NARROWED IN THE FIX ROUND from three excluded channels to
      TWO: the hidden counterpartyText input, which the criterion itself
      requires, and the framework's serialised payload, which is downstream of
      that requirement because the naming row is a client component. Both
      review lanes probed each channel separately and confirmed these two are
      necessary. The third, the row's data-group-key, was not, and is now an
      opaque digest. What is asserted is the strongest true form: no rendered
      markup carries the account in ANY of five renderings (compact, ASCII
      spaced, no-break spaced, narrow-no-break spaced and hyphenated), every
      row identity is asserted free of all five, and every occurrence in the
      page source is inside the hidden subject or the serialised payload. And
      for the one account in the fixture that is NOT an identity key, row 20's
      second token, the criterion's literal clause is asserted over the full
      page source with NOTHING excluded, which is what shows the exclusion set
      is forced by the contradiction rather than chosen for convenience.
  - plan-clause: >-
      files-to-touch, which declares test/domain/ and test/e2e/ but neither
      test/application/ nor test/property/, and which declares
      src/modules/merchants/application/merchant-review.ts but not that
      module's index.ts.
    why: >-
      REPORTED RATHER THAN WORKED AROUND, and reported here because the
      declaration is read from the merge base and cannot be amended on this
      branch. That is the implementer brief's own statement, quoted rather
      than inferred: "The auditor reads that declaration FROM THE MERGE BASE,
      so a file you discover you need which is not on the list cannot be fixed
      by editing the declaration on your own branch: the amendment has to land
      on the base branch first." Four files outside the declaration were touched, each for the
      same mechanical reason and none for a design one. CountedTransaction
      gained a REQUIRED bookingDate, which the transaction lines need, so
      every construction of that type had to supply it:
      test/application/fake-import-world.ts (one line, mapping the stored
      row's own date), test/application/rederive-merchant-rules.test.ts and
      test/property/rederive-loss-reporting.test.ts (invented dates on row
      builders). ReviewGroupRow had to be exported from
      src/modules/merchants/application/index.ts, which is the module's
      published interface and the only route the UI may import through. No
      behaviour in any of the four changed.
  - plan-clause: >-
      Step 5, "Let the transactions behind a group be seen".
    why: >-
      Read as unqualified and applied to RESOLVED groups as well as unresolved
      ones. The criterion only exercises an unresolved group, so this is more
      than the criterion asks for; the reason is in the key decisions above.

