fix-round:
  - mechanism: >-
      A REDACTION THAT DECIDES WHAT TO REMOVE BY A RULE IT WRITES ITSELF,
      rather than by asking the one module that already answers the question.
      Not "the mask misses a no-break space", which is the finding: the
      mechanism is that a second consumer of an identifier's grammar restated
      the grammar locally, so the tree held two answers and the redaction
      failed OPEN wherever they disagreed. It has three instances on this
      branch, and all three are the same shape. ONE: the separator set, which
      the mask wrote as `character === " "` while importing
      canonicalAccountNumber, whose /\s/ removes every whitespace character
      including the three no-break spaces. TWO: the country test, which
      treated a country the registry does not carry as "not an account
      number", copying the validity module's REFUSAL semantics into a
      redaction context where the cost of being wrong has the opposite sign.
      THREE: the enumeration of where the redaction is applied, which was a
      sentence in a comment rather than a derivation, and was false.
      The rule this round establishes, recorded at the definition in
      src/platform/ui/mask-account-number.ts and named at its siblings
      src/platform/ui/mask-card-number.ts and
      src/modules/merchants/domain/normalise-counterparty.ts: a redaction
      asks the identifier's owning module what the grammar is and never
      restates it, it FAILS CLOSED where a validity test fails open, and the
      set of surfaces it covers is derived by a test and never written down.
    derivation:
      command: >-
        grep -rn "maskCardNumbers(" src/ --include=*.tsx | grep -v
        "mask-card-number"
      output: |
        src/modules/overview/ui/month-view.tsx:109:          ? maskCardNumbers(group.label)
        src/modules/overview/ui/month-view.tsx:313:                  {maskCardNumbers(row.text)}
        src/modules/overview/ui/month-view.tsx:351:          {maskCardNumbers(row.text)}
        src/modules/import/ui/profile-confirmation.tsx:143:                    {maskCardNumbers(
        src/modules/import/ui/profile-confirmation.tsx:148:                    {maskCardNumbers(row.description)}
        src/modules/merchants/ui/merchant-review.tsx:84:              {maskAccountNumbers(maskCardNumbers(row.description))}
        src/modules/merchants/ui/merchant-review.tsx:123:        data-group-key={maskCardNumbers(group.key)}
        src/modules/merchants/ui/merchant-review.tsx:185:      groupKey={maskCardNumbers(group.key)}
        src/modules/merchants/ui/merchant-review.tsx:201:          ? maskAccountNumbers(maskCardNumbers(group.label))
        (nine sites at the head the review read. Five of them ran the card
        mask alone and printed an account in full: the three month-view sites
        and the two import-preview cells. Two more, the data-group-key sites,
        put the raw key in an attribute. A SIXTH RENDERING SURFACE THIS GREP
        DOES NOT REACH was found by reading the exclusion table of
        test/domain/merchant-review.test.ts: month-view.tsx renders the
        RESERVES group label with NO mask at all, excused there on the ground
        that it is "the household's own declared account label or a
        counterparty IBAN". All six render surfaces now pass through the
        account mask, and the enumeration is derived by that same test rather
        than by this grep.)
    not-covered: >-
      THE REGIONS THIS DERIVATION EXCLUDED, and why, because a search whose
      scope is wrong returns an empty result indistinguishable from an absence
      of defects. (a) It greps for maskCardNumbers, so it CANNOT see a surface
      that renders counterparty text through NO mask at all; one such surface
      exists and was found by reading the exclusion table instead, which is
      how the reserves label was caught, and the derived walk in
      test/domain/merchant-review.test.ts is what now covers that direction.
      (b) It is limited to .tsx, so a redaction owed in a route handler, an
      API response or a server action would not appear; grep over src/ for
      console, logger and process.stdout returns eleven call sites, none in
      the merchants module and none carrying a counterparty value, and no JSON
      endpoint serves these screens. (c) It sees RENDERING only. It says
      nothing about what is stored, which is correct and deliberate: facts are
      immutable and a mask must never reach a key, a dedup input or a rule
      subject, and the fast-gate test that walks src/modules/merchants/domain
      and src/modules/merchants/application asserting neither mask is called
      there is what holds that boundary. (d) It does not cover the OTHER
      identifier class: the card mask's own coverage was not re-derived in
      this round and is carried by M3-P6's tests unchanged.
      (e) It cannot see a surface added after it ran; only the derived walk
      can, which is why the enumeration moved into a test.

claims:
  - id: C13-1
    kind: coverage
    statement: >-
      Every acceptance criterion of M3-P13 is walked in this document with
      evidence or with a stated deviation, and criterion 13.2 is the one that
      carries a deviation rather than a plain pass.
    settled-by:
      executed-construction:
        command: >-
          grep -n "criterion 13" delivery/work-history/m3-p13.yaml
        exit-code: 0
        output: >-
          The per-criterion walk in the gate-evidence section names, for each
          of 13.1 through 13.9, the artifact that settles it: a fast-gate test
          by name for 13.2's derivation half, 13.6, 13.7 and the D-41 label
          rule, a slow-gate assertion by file and test title for 13.1, 13.3,
          13.4 and 13.5, and a captured exit code for 13.8. Criterion 13.2 is
          recorded with a deviation rather than as a plain pass.
  - id: C13-2
    kind: impossibility
    statement: >-
      Criterion 13.2's two halves cannot both hold on this screen, because the
      namespaced identity key of an account-basis group is the string
      "account:" followed by that account in canonical form, and the criterion
      requires that key to be in a hidden field on the same page whose full
      source it forbids to carry the account.
    settled-by:
      executed-construction:
        command: >-
          npx tsx over a probe that calls counterpartyIdentity on a row
          carrying the committed fixture's own invented counterparty account,
          plus the slow-gate assertion expect(html).toContain(account) in
          test/e2e/identity-on-review.spec.ts
        exit-code: 0
        output: >-
          The identity key is the account namespace followed by the canonical
          account, and the rendered page source therefore contains that
          account inside the hidden counterpartyText input. The spec asserts
          that occurrence exists and that no OTHER occurrence does outside the
          row's data-group-key.
  - id: C13-3
    kind: remedy
    statement: >-
      RESTATED IN THE FIX ROUND BECAUSE THE ROUND-ONE FORM WAS TOO NARROW AND
      TOO WEAK IN THE SAME SENTENCE. It read: "Masking the account in the
      display layer removes it from every rendered surface of /merchants, in
      both the compact shape the importer stores and the spaced shape the
      statement prints." Too narrow, because /merchants was one of six
      rendering surfaces and the other five printed the account in full. Too
      weak, because "the spaced shape" meant the ASCII-spaced shape alone, and
      the mask accepted no other separator, so an account grouped with a
      no-break space, a narrow no-break space, a thin space, a tab, a newline,
      a full stop or a hyphen was printed whole. What is claimed now: every
      rendering surface in the tree that shows counterparty-derived text
      redacts the account, and the redaction accepts every separator the
      canonical form removes plus the two the card mask tolerates.
    settled-by:
      executed-construction:
        command: >-
          npx vitest run test/domain/identity-on-review.test.ts followed by
          npx vitest run test/domain/merchant-review.test.ts
        exit-code: 0
        output: >-
          31 tests passed in the first, including the separator table (nine
          separators, each asserted bare and inside a transfer descriptor),
          the derived assertion that every character canonicalAccountNumber
          removes is a separator the mask tolerates, and the two
          unregistered-country cases; 30 passed in the second, including the
          new inverted derivation "every surface that masks a descriptor masks
          it against the ACCOUNT as well as the card", which walks every .tsx
          under src/ with the compiler API and returns an empty offender list.
          The red witness for the first is recorded in the fix-round section
          of m3-p13-notes.md: 9 failed, 17 passed before the change.
  - id: C13-6
    kind: remedy
    statement: >-
      A THIRD SERIALISATION CHANNEL WAS FOUND IN THE FIX ROUND, BEYOND EITHER
      REVIEW LANE, AND IT WAS THIS PHASE'S OWN. The transaction lines were
      handed to the client leaf as the ELEMENT <GroupRows rows={group.rows} />
      inside a prop, and a React element in a client component's props is
      serialised together with its own props, so the raw rows array crossed
      the boundary and every unmasked description was in a script element.
      The leaf is handed the RENDERED MARKUP now, so the value that becomes a
      prop is a tree of host elements holding already-masked strings.
    settled-by:
      executed-construction:
        command: >-
          npx playwright test test/e2e/identity-on-review.spec.ts
          --project=chromium, with a diagnostic printing the source context
          around each occurrence of row 20's second account
        exit-code: 0
        output: >-
          Before the change the context printed the raw rows array, keyed by
          id, bookingDate, amountCents and description, with the descriptor of
          the two-token row intact. After it, the four tests pass, and the
          remaining occurrences on the development server are shown by the
          widened trace to sit inside Next's own server-component debug
          payload, which is a separate matter recorded as C13-7.
  - id: C13-7
    kind: open-question
    statement: >-
      THE DEVELOPMENT SERVER SERIALISES EVERY SERVER COMPONENT'S PROPS INTO
      THE PAGE. Measured on this screen: a script chunk of the shape
      {"name":"GroupRow","env":"Server","stack":[...],"props":{"group":{...}}}
      carries each ReviewGroup whole, raw transaction descriptions and
      counterparty accounts included. It is a property of `next dev` and not
      of the page: the same assertion over the production server this config
      builds and starts finds none of the three shapes of that account and no
      debug chunk at all, which the spec now asserts rather than assumes.
    still-open-because: >-
      Nothing in this phase can change what the development server emits, and
      it does not reach the owner, so there is nothing to fix here. It is
      recorded because it makes a whole class of page-source assertion
      meaningless against `next dev`, and because the next agent to write one
      will otherwise spend the time this round spent finding out. Anyone
      asserting that a value is absent from a page must run that assertion
      against the production project, as this spec now does.
  - id: C13-8
    kind: open-question
    statement: >-
      ANSWERING THE IMPORT FORMAT QUESTION TWICE WITH ONE NAME CRASHES THE
      SERVER. A source profile's name is unique per household, and
      createProfile lets the Prisma P2002 escape: the reader gets "Application
      error: a server-side exception has occurred" instead of a sentence
      saying the name is taken. Met while building the two-statement case
      here.
    still-open-because: >-
      It is a defect in the import path
      (src/modules/import/adapters/import-repository.ts createProfile, reached
      through confirm-import.ts and the confirm action), which is not among
      this phase's files-to-touch, and it is pre-existing rather than
      introduced here. Handed on with the captured stack rather than fixed,
      and the spec that met it now gives each upload its own format name.
  - id: C13-4
    kind: open-question
    statement: >-
      The month view still renders unnormalised counterparty text on its gap
      rows and its held rows and masks CARD numbers there only, so an account
      number inside one of those descriptors is shown in full on that screen.
      This phase did not change it.
    still-open-because: >-
      That surface belongs to the overview module and is not among this
      phase's files-to-touch, and widening the phase to it would be a change
      to a screen no criterion of M3-P13 names. It is recorded at the
      definition of src/platform/ui/mask-account-number.ts as a residue so the
      next reader of the masker meets it, and it is handed on here.
  - id: C13-5
    kind: open-question
    statement: >-
      The account mask redacts only a token whose country the pinned registry
      knows AND whose length that registry assigns that country. A token that
      is an account number of a country the registry does not carry, or one
      written with a separator other than a single space, is left in full.
    still-open-because: >-
      Both are deliberate: the registry is the project's single definition of
      what an account number is (M3-P14 criterion 14.4), and widening the
      redaction to a shape nobody has seen is the mechanism this codebase
      refuses one tier down. I did not find a way to close either without
      inventing a second definition of an account number, which is the thing
      that pin exists to prevent.

environment-warnings:
  - warning: >-
      DO NOT RUN npm run build IN THE WORKTREE BEFORE THE SLOW GATE. The build
      writes the production output into .next, which is the SAME directory
      `next dev` uses; the Playwright config gives its own production server a
      separate .next-prod through PULSE_DIST_DIR precisely so the two cannot
      collide, and a hand-run build defeats that. The first slow-gate run
      started after such a build and failed three specs that have nothing to
      do with this phase, one of them the wrong-password sign-in line. After
      removing .next and .next-prod and re-running, two of those three passed.
    evidence: >-
      Run 1 log: accounts.spec.ts:216, accounts.spec.ts:407 and auth.spec.ts:48
      red. Run 2 log, same head plus a removed .next: accounts.spec.ts:407 and
      auth.spec.ts:48 green, accounts.spec.ts:216 still red for a real reason
      recorded below.
  - warning: >-
      DO NOT EDIT ANY FILE UNDER src/ OR test/e2e/ WHILE THE SLOW GATE IS
      RUNNING. The dev server the gate starts compiles from disk, so an edit
      lands in the middle of the run and the result is a measurement of no
      single tree. The first run here was invalidated that way and had to be
      discarded. Editing delivery/ during a run is safe; nothing compiles it.
  - warning: >-
      The Supabase stack in this container is shared between worktrees: its
      project id is m1-p1-skeleton and `docker ps` showed it already up from
      another worktree's session. node_modules/.bin/supabase status prints the
      keys and the loopback URLs; there is no need to start a second stack,
      and npx prisma migrate deploy against it reported no pending migrations.
  - warning: >-
      A NEW INTERACTIVE ELEMENT ANYWHERE IN THE PRODUCT REDDENS
      test/e2e/pressed-and-disabled.spec.ts, and that is the gate working. Its
      sweep collects every button, link, summary, submit input and role=button
      the journey reaches and asserts the collected set EQUALS a written
      enumeration in both directions, with a literal count beside it. A phase
      that adds a control amends the enumeration and the count; criterion
      9.2(a) forbids narrowing the sweep instead. Two separate assertions have
      to be updated, and the second one only fires once the first passes, so
      the fix looks incomplete after one round.
    evidence: >-
      Run 3, four failures over two projects, all of them "the swept control
      set is not the enumeration". After amending the enumeration, the same
      spec failed again on expect(found).toHaveLength(21). After amending
      both, npx playwright test test/e2e/pressed-and-disabled.spec.ts exits 0
      with 11 passed.
  - warning: >-
      A PAGE-SOURCE ABSENCE ASSERTION PROVES NOTHING AGAINST `next dev`. The
      development server emits a server-component DEBUG payload into script
      elements, carrying each server component's name, source location, stack
      AND ITS PROPS, so every value a server component receives is in the page
      whether the page renders it or not. Any spec asserting that a value does
      not appear in the source must run against the production project this
      config already builds and starts, or must exclude script elements and
      say so.
    evidence: >-
      Measured on /merchants: a chunk of the shape {"name":"GroupRow",
      "env":"Server","stack":[...],"props":{"group":{...}}} carrying each
      ReviewGroup whole. The same assertions against the production server on
      port 3100 find neither the value nor any debug chunk, which
      test/e2e/identity-on-review.spec.ts now asserts.
  - warning: >-
      A REACT ELEMENT PASSED AS A PROP TO A CLIENT COMPONENT SHIPS ITS OWN
      PROPS. Handing a client leaf <Something data={raw} /> inside a prop
      serialises `raw` into the payload even when the rendered output shows
      none of it: serialisation follows the element, not the pixels. Pass the
      RESULT instead. This cost this phase a real leak of every raw
      transaction description on the review screen.
    evidence: >-
      The traced source context before the fix carried the whole rows array,
      keyed by id, bookingDate, amountCents and description. After passing the
      awaited markup instead of the element, it does not.
  - warning: >-
      Free disk was 3.8G of 252G at the start of the slow gate here. The
      recorded renderer-crash incident happened at 54MB free, so this is not
      that, but it is close enough that `docker image prune -f` reclaimed
      nothing and the margin should be checked before every suite run.
