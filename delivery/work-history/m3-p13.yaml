  ENVIRONMENT FACTS, corrected today, do not re-derive them and do not repeat
  the error four phases made:
  - THE SLOW GATE RUNS HERE. npm run test:e2e is fully runnable. Docker is
    installed; if the daemon is not running, start it. The repo ships its own
    Supabase CLI at node_modules/.bin/supabase, so node_modules/.bin/supabase
