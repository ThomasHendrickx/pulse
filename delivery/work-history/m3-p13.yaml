kind: work-history
phase: M3-P13
prompt: |
  You are the IMPLEMENTER for Pulse phase M3-P13 (identity on the review
  screen: the screen says what it is grouping on and how far a naming will
  reach). Repo /home/user/pulse (never work in it directly). Node: export
  NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh. Read /home/user/pulse/CLAUDE.md and
  ALL THREE skills it names (pulse-domain, pulse-frontend, pulse-typescript):
  this phase is a UI surface over the counterparty identity domain.

  Setup: git -C /home/user/pulse worktree add /home/user/wt-m3p13 -b
  claude/m3-p13-identity-on-review origin/main, cd there, npm install, then
  compose your brief yourself: npx --prefix /home/user/pulse-fleet tiphys
  brief compose --role implementer --phase delivery/plan/pulse-v02.yaml
  --phase-id M3-P13 (run npm install in /home/user/pulse-fleet first if its
  node_modules is missing). Read the composed brief IN FULL and follow its
  contract: mandated reading, work-history schema, generated gate list, push
  protocol, scope rules. Your phase section is M3-P13 in
  delivery/plan/pulse-v02.yaml on current main (975d0ce), branch
  claude/m3-p13-identity-on-review; its criteria are your spec and its steps
  are your order, verification-first step before any edit.

  CHECKPOINT PROTOCOL, mandatory: this container restarts unpredictably every
  twenty to thirty minutes and has destroyed several agent sessions today.
  Commit and push after each meaningful unit of work, never more than about
  five tool calls between pushes, and write witnesses into the work history as
  you obtain them rather than from memory at the end.

  ENVIRONMENT FACTS, corrected today, do not re-derive them and do not repeat
  the error four phases made:
  - THE SLOW GATE RUNS HERE. npm run test:e2e is fully runnable. Docker is
    installed; if the daemon is not running, start it. The repo ships its own
    Supabase CLI at node_modules/.bin/supabase, so node_modules/.bin/supabase
    start brings the stack up, and npx prisma migrate deploy puts the schema
    on. Four phases in a row wrongly recorded the gate as environment-limited
    because a stopped daemon was read as an absent capability, and main was
    silently red for hours as a result. An environment limitation is a claim
    like any other: verify it before you record it.
  - NEVER run prisma migrate reset (Prisma refuses it without an owner-consent
    variable, and you must NOT set that variable). Use migrate deploy against
    the local stack.
  - The Docker daemon can die mid-run and take the local database with it,
    turning every later test red at its sign-up step. That looks like a mass
    product failure and is not one: restart and re-run before believing a wall
    of red.
  - Disk fills up. Check free space before a suite run and reclaim with docker
    image prune if needed; an ENOSPC mid-run shows up as a renderer crash.
  - DATABASE SAFETY IS ABSOLUTE: the ambient DATABASE_URL points at a deployed
    Supabase pooler for a DIFFERENT project of the owner's. Pin DATABASE_URL,
    DIRECT_URL and E2E_DATABASE_URL explicitly to loopback on every command and
    assert the parsed host is 127.0.0.1 before running. Nothing you run may
    reach a deployed database.

  Constraints from the non-negotiables: design tokens only, no literal colours,
  sizes or spacing; all copy in English, Dutch and French with English written
  first; amounts stay integer cents; facts are immutable, so nothing here
  rewrites an imported row; every query filters on householdId; no em dashes
  anywhere; no data values in commit messages, and any invented identifier that
  enters the tree goes on test/fixtures/allowed-identifiers.txt with its
  provenance in the same commit.

  Gates before you finish, each recorded with its exit code: npm run typecheck,
  lint, npm test, gate:privacy, gate:decisions, gate:tokens, npm run build with
  DB env pinned to an invented localhost, AND npm run test:e2e for real. Main is
  green on all of them right now (118 e2e passed, 1 skipped), so any red you see
  is yours and must be fixed, not recorded as environment-limited.

  Write delivery/work-history/m3-p13.yaml per the schema and validate it.
  Commits: English, no em dashes, no data, no model names. Push -u origin
  claude/m3-p13-identity-on-review (4 retries, backoff, network failures only).
  No pull request, no merge, no plan edits. If the plan section is stale against
  the tree (it was written before several phases merged, including M3-P12's
  counterparty identity, M3-P11's optimistic naming and M3-P18's held rows),
  STOP on the specific criterion and report it rather than improvising, but
  first check whether the plan's own amendment notes already resolve it.

  Also read /home/user/pulse-fleet/notes/owner-ledger.md before you start and
  append your delivery note to it at the end, pushing that repo too.

  Return: head SHA, gates table including the real e2e numbers, files changed,
  per-criterion status, and anything you stopped on with the exact plan text
  that blocked you.

