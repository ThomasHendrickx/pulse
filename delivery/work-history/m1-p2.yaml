claims:
  - id: M1P2-C1
    kind: open-question
    statement: >-
      Whether the committed fixture column layouts match real PC-banking
      CSV exports is unverified: the owner's two real statements were PDF
      exports, which verified content facts (keys, duplicates, FX
      sub-lines, settlement rows) but not CSV columns, and no anonymised
      real CSV arrived during this phase. When the first one arrives, the
      fixture layouts must be checked against it and the outcome recorded
      before reliance on them widens.
  - id: M1P2-C2
    kind: coverage
    statement: >-
      The ingest tests guard the occurrence-ordinal mechanism rather than
      one instance: removing the ordinal from the hash key (the old skill
      recipe) reddens three tests across two structurally different
      members of the class (same-file identical rows, cross-import partial
      overlap).
    settled-by:
      executed-construction:
        command: >-
          python3 (replace 'return `h:${digest}#${ordinal}`;' with 'return
          `h:${digest}`;' in src/modules/import/domain/dedup.ts) && npx
          vitest run test/application/ingest.test.ts; git restore
          src/modules/import/domain/dedup.ts
        exit-code: 1
        output: >-
          x two legitimate identical rows store two Transaction rows;
          re-upload adds zero; x partial overlap keeps the highest
          occurrence count per identical tuple (owner v0.2 addendum
          section 5); x rawLine equals the source line for every ingested
          row, both fixtures; Tests 3 failed | 5 passed (8)
  - id: M1P2-C3
    kind: coverage
    statement: >-
      The mixed-account zero-write rule is guarded on both write paths:
      defanging the account-count check reddens the upload-path test and
      the confirm-path test together.
    settled-by:
      executed-construction:
        command: >-
          python3 (replace 'accountIbans.length > 1' with
          'accountIbans.length > 99' in
          src/modules/import/application/upload-statement.ts) && npx vitest
          run test/application/ingest.test.ts; git restore
          src/modules/import/application/upload-statement.ts
        exit-code: 1
        output: >-
          x a file with rows from two accounts becomes a FAILED import with
          zero rows; x a mixed-account file caught at confirm time also
          writes nothing; Tests 2 failed | 6 passed (8)
  - id: M1P2-C4
    kind: coverage
    statement: >-
      Row level security is enabled in the live local database for each
      table Prisma declares, not merely present as text in the migration
      file: pg_class reports relrowsecurity true for the six application
      tables after the migration applied.
    settled-by:
      executed-construction:
        command: >-
          psql "$DATABASE_URL" -Atc "select relname, relrowsecurity from
          pg_class where relnamespace='public'::regnamespace and
          relkind='r' order by 1" (DATABASE_URL pinned to
          127.0.0.1:54322)
        exit-code: 0
        output: >-
          _prisma_migrations|f accounts|t households|t imports|t
          source_profiles|t transactions|t users|t
  - id: M1P2-C5
    kind: coverage
    statement: >-
      The sign-inversion hazard H1.1 is guarded for two structurally
      different amount representations: flipping the indicator branch sign
      reddens two card tests, and dropping the debit negation reddens the
      debit-credit test, each run against committed code and restored.
    settled-by:
      executed-construction:
        command: >-
          python3 sign-flip edits in
          src/modules/import/domain/parse-statement.ts (indicator branch,
          then debitCredit branch) with npx vitest run
          test/domain/profile-detection.test.ts after each, git restore
          between
        exit-code: 1
        output: >-
          indicator flip: Tests 2 failed | 22 passed (24); debit negation
          dropped: Tests 1 failed | 23 passed (24); after restore: 24
          passed (24)
  - id: M1P2-C6
    kind: open-question
    statement: >-
      Which account a second card in the same bank format should land in is
      an owner decision still pending: spec-equality profile binding sends
      it to the first card's account today, now visibly (the landing
      account is named on the confirmation and result screens), and
      identical cross-card tuples would share hash inputs apart from the
      accountId. Options raised with the owner alongside the round:
      a per-upload account choice when a household holds two or more
      accounts on one profile spec, or file-carried card identity once the
      real CSV layouts are verified (claim M1P2-C1).
fix-round:
  - mechanism: >-
      Assigning a monetary sign from input the code did not positively
      recognise (an unknown indicator marker guessed as credit, F2; a
      missing credit column read as a signed all-positive history, F3).
    derivation:
      command: >-
        grep -n "magnitude|(-parsed.value)|kind === \"signed\"|debitCredit|indicator"
        src/modules/import/domain/parse-statement.ts
        src/modules/import/domain/detect-profile.ts (run as three greps,
        outputs concatenated)
      output: >-
        parse-statement.ts amountOf: three representation branches (signed
        at the parseAmountToCents sign, debitCredit negating the debit
        column, indicator now matching debitValue then creditValue then
        err("indicator")); detect-profile.ts: representation decision
        sites at the two-amount-column branch, the empty-sibling-pair
        branch (new), the indicator search and the signed fallback. No
        other sign-assignment site exists under src/modules/import. All
        three greps exit 0.
    not-covered: >-
      The signed representation still trusts a leading minus as the whole
      sign story: an export with a reversed sign convention is
      shape-indistinguishable, and the five-row confirm preview is the
      guard there. Detection of an indicator pair whose tokens are outside
      the pinned INDICATOR_PAIRS list stays fail-closed to signed, which
      the strict parser then refuses to sign wrongly only if a minus is
      present; a new token pair must be added to the pinned list rather
      than guessed.
  - mechanism: >-
      Read-then-act on a status machine with unconditional writers (F4).
    derivation:
      command: >-
        grep -n "status" src/modules/import/adapters/import-repository.ts |
        grep -iE "updateMany|status:"
      output: >-
        Lines 35/45/63/74 are type fields and the initial createImport
        value (not transitions); line 170-172 markImportFailed, now
        conditional where status AWAITING_DECLARATION; line 199-202 the
        ingest claim, conditional where status equals fromStatus inside
        the ingest transaction. No other writer touches Import.status; no
        code path writes Transaction rows outside ingestRows. Grep exit 0.
    not-covered: >-
      The losing confirm may have declared an account before losing the
      claim, leaving an unused empty account row (no transactions
      reference it). Making the account declaration part of the ingest
      transaction would cross the accounts module's application boundary,
      so it was left out knowingly; the row is harmless, visible, and
