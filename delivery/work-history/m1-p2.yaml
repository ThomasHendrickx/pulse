key-decisions:
  - decision: >-
      Amendment A (carried, done): the phase migration enables ROW LEVEL
      SECURITY, policy-free, on households, users, accounts,
      source_profiles, imports and transactions, and test/schema/rls.test.ts
      derives the table list from the Prisma DMMF by name and reddens when a
      table lacks the enablement in the committed migration SQL.
    why: >-
      Orchestrator declaration amendment, owner-approved, carried from the
      M1-P1 review. Assert-by-name over the DMMF because the table registry
      is append-only and a pinned count goes stale on the next phase.
      _prisma_migrations stays RLS-off: it is not a table Prisma declares
      (absent from the DMMF), so it sits outside the amendment's stated
      scope; recorded here rather than silently skipped.
  - decision: >-
      Amendment B (carried, done): the auth-status whitelist moved to
      src/app/(auth)/status-keys.ts and tests membership with
      Object.hasOwn; test/app/auth-status.test.ts was shown red against the
      extracted-verbatim `in` implementation first (1 failed, prototype key
      admitted), then green (4 passed).
    why: >-
      Finding CR-006: `in` walks the prototype chain, so a crafted
      ?status=constructor link reached the translator with a Function
      value. The import module's new status whitelist copies the hardened
      pattern from day one.
  - decision: >-
      Amendment C (carried, done): the tenancy analyzer's held-to-rule test
      is now a source-text scan for the client module specifier, a final
      default arm flags any exported statement kind without a positive
      analyzer arm, four red fixtures cover the escaped shapes, and the
      comments in src/platform/tenancy.ts and the test header were
      corrected in place with the residue named.
    why: >-
      Finding CR-007: dynamic import, import-equals and exported namespaces
      escaped the ImportDeclaration walk and the arm chain. The fixtures
      were run red first (4 failed) against the committed analyzer, then
      the fix landed (21 passed).
  - decision: >-
      Amendment D (carried, done): pulse-domain SKILL.md section 6 now
      teaches the per-profile key choice and the ordinal-extended hash,
      with a loud correction note in place of the old recipe.
    why: >-
      The ordinal-free recipe collapses legitimate identical rows (finding
      PR-001, refuted by the owner's real card statement); a skill teaching
      a defect reproduces it in later phases.
  - decision: >-
      SourceProfile's parsing spec is stored as ONE validated Json column
      (spec), parsed at the repository boundary by parseSourceProfileSpec
      and rejected loudly when invalid.
    why: >-
      The amount representation is a discriminated union that must not
      decay into optional columns (pulse-typescript section 4), and a
      column named after the amount field would trip the DMMF money-name
      gate, which is reserved for integer-cent columns.
  - decision: >-
      Account identity: resolved from the file's own-account IBAN column
      where the profile has one (current-account shape); card-shaped files
      carry no account column, so the declared account is bound to the
      confirmed SourceProfile (accountId on SourceProfile) and re-uploads
      resolve through that binding. Re-upload recognition is structural
      spec equality over deterministic detection.
    why: >-
      The phase requires unknown accounts asked once, at first sight, and
      re-uploads asking nothing (criterion 1.5). The recorded card format
      has no per-row account identifier at all, so profile binding is the
      one deterministic mechanism available without re-asking.
  - decision: >-
      Ingest tests (criteria 1.2 to 1.4) run the real parser and use cases
      against in-memory fakes of the import and accounts ports; the fake
      reproduces insert-with-duplicates-skipped over (householdId,
      dedupKey), and the real schema's unique index is asserted by name
      over the DMMF inside the same test file.
    why: >-
      The fast gate runs with no database (pulse-typescript section 8). A
      port fake is the skill's sanctioned test seam; the DMMF assertion
      ties the fake's semantics to the real constraint, and the migration
      side is exercised by test/schema/rls.test.ts, shown red before the
      migration existed and green in the phase-head npm test run (77
      passed, exit 0, captured in the notes).
  - decision: >-
      Each module's application/index.ts doubles as the module's
      composition root: use cases take a deps object typed by the ports,
      and index.ts binds them to the real adapters. Tests inject fakes and
      touch the binding nowhere.
    why: >-
      The skill fixes the layering (application depends on ports, adapters
      implement them, cross-module traffic goes through the published
      application interface) but names no composition point; one line of
      binding per module inside the published interface keeps every other
      file on the pure side of the rule. Mechanical choice, reversible.
  - decision: >-
      The dedup hash normalisation (uppercase, collapse whitespace, trim)
      is declared FROZEN at its definition in
      src/modules/import/domain/dedup.ts, with the stability contract and
      the sibling distinction (the merchants module's richer normalisation
      arriving in M1-P4 is a different function) recorded at the mechanism
      definition per the mechanism-sibling clause.
    why: >-
      Changing any hash input changes every stored key and turns the next
      re-upload into a full duplicate import. No project tuition feed
      exists yet under delivery/tuition/ to carry the rule; flagged for the
      orchestrator so the index inherits it when the feed starts.
  - decision: >-
      Mechanism lookup (mechanism-lookup clause): tuition/mechanism-index.yaml
      was read before implementation. It carries kernel-process mechanisms
      only (claim files, leases, append-only logs, watchdogs, reporter
      parsing, generated-artifact drift); it has no entry for CSV parsing,
      dedup keys, Prisma migrations or RLS, which is a recorded answer, not
      a skipped lookup. Two rows were still applied: assert-by-name over
      append-only registries (the RLS and DMMF tests) and
      witness-per-class-reddens-under-two-members (the mutation witnesses).
    why: >-
      The clause requires stating which rules were found and how the
      implementation satisfies them, including the honest none-found case.
verification-first:
  - finding: >-
      Recorded evidence (notes/export-format-facts.md, two real statements,
      2026-08-17) part-answers the natural-key question exactly as the
      phase text states: the statement-plus-sequence key holds for the
      Belfius current-account format and fails for the KBC card format,
      which has no per-row sequence. The phase's per-SourceProfile key
      choice was implemented as written (hasNaturalKey on the spec, hash
      path with occurrence ordinal otherwise).
    contradicts-plan: false
  - finding: >-
      The CSV column layouts of real PC-banking exports were still
      unverified at phase start and no anonymised real CSV arrived during
      the phase. The committed fixtures reproduce the structural facts the
      PDF statements verified (keys, duplicates, FX sub-lines, settlement
      rows) with invented column layouts in the styles Belgian exports use.
      The check against the first real CSV remains owed and is restated in
      the claims section.
    contradicts-plan: false
  - finding: >-
      The baseline tree at 99642c1 carried no import module code, no
      Account, SourceProfile, Import or Transaction model and no
      test/fixtures directory (verified with git ls-tree and by reading
      src/modules/*/.gitkeep), so this phase created all of them; the two
      M1-P1 findings named by amendments B and C were confirmed present in
      the committed code before being fixed (the `in` operator at the old
      auth-status.tsx line 18, the ImportDeclaration-only walk in
      test/schema/tenancy.test.ts).
    contradicts-plan: false
deviations:
  - plan-clause: >-
      M1-P2 files-to-touch (src/modules/accounts/, src/modules/import/,
      prisma/, test/domain/profile-detection.test.ts,
      test/application/ingest.test.ts, test/fixtures/,
      test/e2e/import.spec.ts)
    why: >-
      Step 7 (upload UI) and criterion 1.5 (Playwright over real routes)
      require files outside the declared list: the thin routes
      src/app/(app)/import/{page.tsx,[id]/page.tsx}, src/app/globals.css
      (token-only import screen classes), the three message catalogs (no
      user-facing string may be hardcoded), vitest.config.ts (the @ path
      alias), and the platform primitives src/platform/{money,plain-date,
      result}.ts plus src/platform/ui/amount.tsx that pulse-typescript and
      pulse-frontend mandate to live in platform. Escalated in the notes
      the moment it was found; the orchestrator must amend the phase
      declaration on the base branch before the scope gate runs. Amendment
      items A to D touch their own files (migration, rls test, auth-status,
      tenancy test, skill file) under the orchestrator's declared
      authority.
  - plan-clause: >-
      Fix round 1 finding F1 (CR-201/CR-008, high): full remediation of the
      second-same-format-card misbinding
    why: >-
      Escalated to the owner by the orchestrator rather than fixed here:
      the full fix (a per-upload account question when a household holds
      two accounts on one profile spec, or file-carried card identity once
      claim M1P2-C1 verifies real CSV layouts) changes the acceptance
      contract that a card re-upload asks nothing. This round shipped
      transparency only: the landing account is named on the confirmation
      and result screens, and the confirm use case resolves the account by
      the same rule the screens render. The residual hazard stands until
      the owner decides, and is restated as claim M1P2-C6.
