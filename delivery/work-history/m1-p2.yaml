kind: work-history
phase: M1-P2
prompt: |
  You are the implementer for phase M1-P2 (import) of the pulse project, dispatched by the orchestrator under the Tiphys kernel process. Fresh implementer, one phase, your worktree only.

  READ FIRST, in this order:
  1. Your composed role brief: /home/user/pulse-fleet/implementer-brief-m1-p2.md. It contains the COMPLETE rendered M1-P2 phase (intent, all 7 steps, files-to-touch, all 6 acceptance criteria, 3 hazard classes, the migration declaration) plus fleet environment warnings 1 through 5. The binding rule applies: if it is not written in the phase, you do not build it. Warning 1 (ambient foreign database credentials, pin everything local) and warning 5 (session pooler facts) are load-bearing.
  2. CLAUDE.md and all three skills in the worktree (.claude/skills/): this phase is the heart of pulse-domain (facts vs interpretation, source profiles, dedup, immutability), with pulse-typescript for parsing/branded types and pulse-frontend for the upload/preview/confirm flow. Non-negotiables are hard: npm only, English, integer cents, tokens only, immutable facts, householdId everywhere, no em dashes.
  3. delivery/plan/pulse-v1.yaml in full: M1-P2's steps realize adversarial-review findings PR-001 (dedup occurrence ordinal, cross-import highest-occurrence-count rule) and PR-011 (card fixture family); read the plan's report-code-disagreement entries for M1-P2, including the one recording that pulse-domain SKILL.md section 6's dedup recipe collapses legitimate duplicates.
  4. /home/user/pulse-fleet/notes/export-format-facts.md: anonymized structural facts from the owner's two REAL bank statements (Belfius account: statement-plus-sequence key holds; KBC card: no row sequence, hash+ordinal mandatory, FX sub-lines, legitimate identical duplicate rows, settlement rows). Your synthetic CSV fixtures must reproduce these quirks with invented IBANs, names and amounts. The real files are never committed and you do not have them; the note is your source.

  ORCHESTRATOR DECLARATION AMENDMENT, recorded in the fleet and to be listed in your work history as amendment-carried items (they are in scope for this phase by owner-approved orchestrator arbitration, carried from the M1-P1 review):
  A. RLS enablement migration: this phase's migration also enables ROW LEVEL SECURITY (no policies) on ALL public tables, existing (households, users) and new. The app connects as table owner via Prisma so behavior is unchanged; this is the charter's declared backstop, and the deployed project currently has RLS off (hand-applied schema, recorded in fleet notes). Add a criterion-grade check: a test asserting the migration SQL contains ENABLE ROW LEVEL SECURITY for every public table Prisma declares.
  B. CR-006 (low, from M1-P1 hazard review): the auth-status whitelist uses the `in` operator which admits prototype keys (constructor, toString); switch to Object.hasOwn with a red-witness test.
  C. CR-007 (low): the tenancy analyzer misses dynamic import of the db client, import-equals, and exported namespace shapes, and its comment overclaims; default-flag unhandled exported statement kinds, add red fixtures for those three shapes, correct the comment.
  D. The pulse-domain SKILL.md section 6 dedup recipe correction (the plan's report-code-disagreement entry): fix the recipe text to include the occurrence ordinal so the skill stops teaching the duplicate-collapsing defect. Minimal edit, mechanism-faithful.

  YOUR WORKTREE: /home/user/pulse-fleet/worktrees/m1-p2-import, branch claude/m1-p2-import, at main (99642c1). Work only there.

  ENVIRONMENT, measured previously: Node 22 default; tiphys needs Node 26 (export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh). The docker daemon DIES between sessions: check `docker info` and restart with `sudo dockerd >/tmp/dockerd.log 2>&1 &` if needed; then `supabase start` (db, kong, gotrue, postgrest suffice). npm install first. Do NOT push, do NOT deploy; deployed-environment assertions defer to deploy-verify (the /api/health/db pattern exists if you need a reference).

  DISCIPPLINE: incremental output is mandatory. Create delivery/work-history/m1-p2-notes.md within the first minutes and append continuously (commands, output, decisions, deviations); the watchdog reads your worktree mtime and treats 15 quiet minutes as death. Every test must be provable red (write the red witness before or alongside the green). Facts immutability is absolute: imported Transaction rows are never updated by any code path this phase adds; corrections happen in later phases via declarations plus recompute. Mixed-account files fail with status FAILED and write NOTHING (transactional).

  WHEN DONE:
  1. npm run typecheck && npm run lint && npm test all exit 0; run the e2e gate (extend it per the phase's criteria); capture tails in the notes.
  2. Work history delivery/work-history/m1-p2.yaml validating against the kernel schema (tiphys validate exit 0), amendment items listed.
  3. Commit on your branch in coherent story commits. Do NOT push. No model or tool attribution anywhere. No em dashes.
  4. Final report as plain data: per acceptance criterion executed-and-green / executed-and-red / deferred with one line of evidence; per amendment item A-D the same; local gate exit codes; deviations with reasons; head sha.
