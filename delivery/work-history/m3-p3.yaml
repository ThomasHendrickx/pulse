  # ---------------- FIX ROUND 4 -----------------------------------------
  - plan-clause: >-
      DEV-M3P3-08 as fix round 3 wrote it: the net of the line items is the
      derivation, and it is never worse than the sum it replaced.
    why: >-
      DEV-M3P3-11. The second half of that sentence was FALSE and
      foreclosing, and finding HZ3-M3P3-01 demonstrated it end to end. A
      settlement credit whose wording the one code-owned Dutch pattern does
      not match is a positive row the code treats as not-the-settlement-
      credit, so the sentence's own escape clause fired on exactly the case
      that breaks it: there the net is wrong by the whole credit while the
      sum it replaced was right, and the account-side debit fell from
      INTERNAL to SPEND with the month doubled. WHICH OPTION I TOOK, of the
      three offered: neither widening the pattern nor refusing. Widening
      swaps one dependency on unobserved wording for another, in a code
      path whose entire population is sources nobody has observed, and
      refusing produces the silently doubled month the dispatch forbids.
      Instead the summary now carries BOTH derivations as CANDIDATE totals
      and the account-side debit matches either. From the rows alone an
      unrecognised settlement credit and an ordinary merchant refund are
      the same shape and imply different totals; a debit equal to one of
      them is the evidence of which, and a debit equal to neither is still
      loud. A stored printed figure still collapses the candidates to
      itself. THE RESIDUAL IS ASSERTED, not hidden: an unrecognised credit
      is still read as a refund by the classifier, so the card's own spend
      is UNDER-stated by it rather than doubled, and the settlement link
      has no incoming side so the leg is surfaced and the books stay open.
      THE ENUMERATION IS ALSO CORRECTED: underpayment, overpayment and a
      late-arriving credit all leave the debit loud, which the lane
      measured and which the earlier comment named only in part.
  - plan-clause: >-
      Criterion 3.3's witnesses, and the fixture family they run on.
    why: >-
      DEV-M3P3-12, finding CR3-M3P3-01. Every card fixture in the tree had
      a settlement credit that exactly cancels its previous balance AND
      carries the observed wording, so the stored figure and both
      derivations agreed and criterion 3.3's assertions held under an
      implementation that never read the stored figure. Measured before the
      fix: ignoring the stored figure reddened exactly ONE test in the
      whole fast gate, and it was not one of 3.3's. A new fixture whose
      credit settles LESS than its previous balance makes the printed
      figure, the net of the line items and the sum of the debit magnitudes
      three different numbers, and the same fixture serves the wording case
      above. The discrimination is now inside criterion 3.3's own witness
      file as well: ignoring the stored figure reddens two tests, one of
      them there.
  - plan-clause: >-
      M3-P3 files-to-touch, once more: fix round 4 touches
      scripts/gate-privacy.sh and test/fixtures/allowed-identifiers.txt
      again, and three generic delimited fixtures by reference.
    why: >-
      DEV-M3P3-13, finding HZ3-M3P3-03. The allow list's first sentence is
      the strongest promise in this repository's privacy machinery and the
      script did not keep it in two more forms nobody had probed: an
      account number whose body carries LETTERS never matched the pattern
      at all, and one had been sitting in two tracked fixtures unlisted
      with the gate green; and a lower-case account shape passed unlisted
      while the card half of the same script folds case. Both are closed
      with red witnesses. The sweep that followed the widening surfaced
      three account numbers, all of them the published worked examples from
      the account-numbering specification's own documentation, now listed
      with that provenance. The widening was measured rather than assumed:
      an earlier form that allowed separators inside a variable-length body
      ran past the account number into the following upper-case word and
      invented four shapes nobody could write a note for, so the
      letters-in-body pattern takes the compact form only.

