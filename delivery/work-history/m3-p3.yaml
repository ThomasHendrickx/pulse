    why: >-
      DEV-M3P3-05. A second thousands-form amount from the same real
      statement occurs in three committed CSV fixtures, two test
      assertions and one e2e comment, and on a line THIS PHASE ADDED to
      the fixture generator. It was NOT replaced. It is a round figure; it
