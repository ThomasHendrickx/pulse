claims:
  - id: M3P3-C1
    kind: coverage
    statement: >-
      Criterion 3.1's tests are real witnesses for the whole template:
      run before the template existed, the file reddened wholesale, and
      four dangerous-state mutations each reddened the specific
      assertion that guards them.
    settled-by:
      executed-construction:
        command: "npx vitest run test/domain/kbc-pdf-template.test.ts BEFORE registering the template; then mutations W1 (bookingDate := settlementDate), W2 (FX fold dropped), W2b (FX folded into description), W3 (space strip removed), W4 (balance gate disabled), each run and reverted with backup compare"
        exit-code: 1
        output: >-
          Pre-template: "Tests 9 failed | 1 passed (10)". W1: "Tests 1
          failed | 11 passed", exactly the PR2-004 straddler test. W2:
          "Tests 1 failed | 11 passed", the rawLine-verbatim test. W2b:
          "Tests 2 failed | 10 passed" (description and rawLine). W3:
          "Tests 8 failed | 4 passed". W4: "Tests 1 failed | 11
          passed", the non-reconciling variant sailed through. Restored:
          full fast gate 296 passed, 0 skipped, git diff src/ clean.
  - id: M3P3-C2
    kind: coverage
    statement: >-
      Criterion 3.2's duplicate-pair test guards the occurrence
      ordinal: with the ordinal removed from the hash key, the pair
      collapses and the loss propagates into the settlement match.
    settled-by:
      executed-construction:
        command: "mutate assignDedupKeys ordinal to constant 0; npx vitest run test/application/kbc-settlement.test.ts; restore from backup"
        exit-code: 1
        output: >-
          Mutated: "Tests 2 failed | 2 passed (4)": the duplicate-pair
          test reddened (one identical row silently dropped) AND the
          settlement-pairing test reddened, because the collapsed pair
          changes the card import's settlement total so the debit no
          longer matches. Restored: 4 passed.
  - id: M3P3-C3
    kind: coverage
    statement: >-
      Criterion 3.3's assertions guard both settlement legs under two
      structurally different corruptions: the whole settlement step
      suppressed, and only the credit pattern broken.
    settled-by:
      executed-construction:
        command: "mutation W6: classify-flow settlement step forced undefined; mutation W6b: SETTLEMENT_CREDIT_PATTERNS entry replaced with a never-matching pattern; npx vitest run test/application/kbc-settlement.test.ts after each; restore"
        exit-code: 1
        output: >-
          W6: "Tests 1 failed | 3 passed": the debit fell to sign-rule
          SPEND while its card rows were imported (the H3.4 double
          count) and the link vanished. W6b: "Tests 1 failed | 3
          passed": the mirror leg misclassified and the link lost its
          incoming side. Restored: 4 passed; the SPEND-fallback arm
          (companion-only world) stayed green throughout, as it should.
  - id: M3P3-C4
    kind: coverage
    statement: >-
      The template generalises from the synthetic fixture to the real
      statement: the full shipped detect-and-parse path was executed
      against the real KBC upload in-container with abstract-only
      output.
    settled-by:
      executed-construction:
        command: "scratchpad script driving statementParser.detect/parse plus assignDedupKeys over the 0f79fa3d upload (the script prints counts and booleans only, as the output beside this shows)"
        exit-code: 0
        output: >-
          detect selected kbc-mastercard-uitgavenstaat v1; parse.ok
          true through the shared balance gate; 22 rows; accountIbans
          empty; exactly 1 positive credit row equal to the negated
          opening; 4 rows with folded continuation lines, 8 folded
          lines total; zero natural-key components; 22 distinct
          hash-path dedup keys with exactly one ordinal-#1 key (the
          real identical pair). The real Belfius upload still detects
          belfius-current-account-nl v1 and parses 39 rows.
  - id: M3P3-Q1
    kind: remedy
    statement: >-
      RESOLVED, and previously recorded here as an open question
      (corrected in place per R-087 rather than deleted): the
      real-statement Afrekening amount survived in the file versions
      of three branch commits (the template header comment quoted it
      as a shape example before the half (b) gate caught it; the head
      fix landed the same day). A history rewrite from inside this
      session was refused twice by the permission classifier, so the
      purge was escalated; the orchestrator rebuilt the branch with
      purged history (the final tree byte-identical, squashed into one
      code commit d47614a plus one docs commit 253e074, force-pushed
      with no consumers; no PR ever referenced the tainted commits).
    settled-by:
      executed-construction:
        command: "git fetch origin claude/m3-p3-pdf-kbc && git checkout -B claude/m3-p3-pdf-kbc origin/claude/m3-p3-pdf-kbc; git log --oneline -5; git diff --stat <pre-purge head> HEAD"
        exit-code: 0
        output: >-
          Branch history is now exactly d47614a plus 253e074 on base
          a577e51; the diff against the retained local pre-purge head
          object is EMPTY (trees byte-identical), and the six former
          per-step shas are absent from the branch. The pre-purge gate
          runs therefore executed against this exact tree.
  - id: M3P3-Q2
    kind: open-question
    statement: >-
      Only a single-card uitgavenstaat has been observed. The template
      ignores per-card sub-heading lines, so a hypothetical multi-card
      statement would parse all cards' rows into the one
      profile-bound account rather than failing the mixed-account
      rule; whether KBC emits multi-card statements, and what identity
      they carry, is unknowable from the available document and is
      left for the first real example.
  - id: M3P3-Q3
    kind: open-question
    statement: >-
      A corrupted row line whose two-date prefix is itself damaged
      looks like boilerplate to this template and would drop silently
      when its amount is zero; a nonzero amount in that corner reddens
      the balance gate, and this format offers no sequence numbers to
      anchor a continuity gate on. Stated at the template header; same
      residue class M3-P2 recorded for the Belfius first-transaction
      corner.
environment-warnings:
  - warning: >-
      The permission classifier of this session denies git
      filter-branch (history rewrite) even on an unshared feature
      branch, and once triggered it can transiently deny adjacent git
      plumbing reads (git cat-file was denied immediately after; git
      rev-list worked). Plan privacy scrubs to run BEFORE the first
      push: after a push, a leak lives in remote history whose rewrite
      this session was refused (witnessed twice here), leaving only a
      head fix plus escalation.
    evidence: >-
      Two denials of the same filter-branch command at the criterion
      3.5 correction, then a denial of a read-only git cat-file; the
      head fix landed as a normal commit instead.
  - warning: >-
      A grep probe that starts with a dash is parsed as an option when
      passed positionally, errors grep, and a naive
      exit-code-is-nonzero check counts that as "no hit": a silent
      false pass, and the grep usage error echoes the probe (real
      statement content) into the terminal. Pass every probe behind -e
      and terminate options with -- in any scrub tooling.
    evidence: >-
      The first independent-scrub run misparsed the real statement's
      band lines (leading dashes) as options; fixed with -e and
      re-run, results confirmed 0-hit for those probes.
