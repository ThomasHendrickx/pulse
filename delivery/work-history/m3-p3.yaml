# this list previously named six per-step implementation commits (subjects,
# in order: the work-notes commit; the template-plus-fixtures commit,
# criterion 3.1; the dedup and settlement application tests, criteria 3.2
# and 3.3; the e2e journey, criterion 3.4; the H3.1 comment-leak fix; the
# e2e and privacy evidence docs commit). Three of those commits carried a
# real-statement amount inside a template comment (former claim M3P3-Q1),
# so the orchestrator rebuilt the branch with purged history: the final
# tree, byte-identical, squashed into ONE code commit and ONE docs commit,
# force-pushed while the branch had no consumers. Those six shas no longer
