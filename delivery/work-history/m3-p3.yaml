  # ---------------- FIX ROUND 3 -----------------------------------------
  - plan-clause: >-
      DEV-M3P3-01 as fix round 2 wrote it: the settlement figure is stored
      because deriving it is unsafe.
    why: >-
      DEV-M3P3-08. That justification was half right and the delta hazard
      lane was right to hit it. It rejected deriving the figure from the
      BALANCES, which is correct: that derivation holds only while the
      settlement credit cancels the previous balance, and the criteria
      lane built the underpaid document and showed both derivations wrong
