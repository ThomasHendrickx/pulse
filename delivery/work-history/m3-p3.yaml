prompt: |
  You are the implementer for phase M3-P3 (pdf-kbc) of the Pulse v0.2
  delivery. Your brief is /home/user/pulse-fleet/implementer-brief-m3-p3.md:
  read it fully first, including the appended fleet warnings (warning 9 is
  absolute: real upload file names never appear anywhere, 8-hex prefixes
  only: 0f79fa3d is the KBC Mastercard statement, 39bada64 is the Belfius
  one; warning 10: check df before e2e work, delete closed-phase
  node_modules freely). Your working tree is the fresh clone
  /home/user/pulse-fleet/worktrees/m3-p3-pdf-kbc on branch
  claude/m3-p3-pdf-kbc (based on main a577e51, which contains the whole
  merged M3-P2 PDF foundation: pdfjs adapter, template registry, positional
  line classification, fail-closed versioning, balance gate, distinct
  failure reasons). The plan is delivery/plan/pulse-v02.yaml, phase M3-P3;
  the intake is delivery/intake/pulse-v0.2-pdf-addendum.md sections on the
  KBC card format; read pulse-domain (card settlement, dedup hash path with
  occurrence ordinals) and pulse-typescript first.

  Build the KBC Mastercard template on the M3-P2 foundation, walking the
  phase's steps and criteria exactly as written. The plan's criteria carry
  review-hardened traps you must honor: FX continuation folding (the
  sub-lines carrying original amount and exchange rate fold into their
  parent row, per the fixture family the M1-P2 fixtures already mirror in
  CSV form), the Afrekening balance identity as this format's hard gate
  (previous-balance line, DOMICILIERING semantics, the settlement total on
  the Afrekening line: the M0-P2 scout verified the identity holds exactly
  on the real statement: previous plus rows equals Afrekening in cents with
  space-thousands separators), the month-straddling row asserting
  bookingDate equals the TRANSACTION date not the settlement date
  (PR2-004), legitimate identical duplicate rows via the hash-path
  occurrence ordinal (the real statement carries one identical pair), and
  the settlement-pairing witness through two PDF imports (the account-side
  debit pairing to the card import per D-11 semantics already in the
  ledger). The card format has no counterparty account column and no
  sequence numbers: the dedup path is the HASH path with ordinals, never a
  natural key; the M3-P2 continuity gate is Belfius-specific and must not
  fire on card statements.

  FORMAT REFERENCE: the real KBC statement (0f79fa3d prefix) at
  /root/.claude/uploads/e8dfc624-eaf2-5480-bcf2-af6a168fb888/. Read it to
  build and verify the template; content never leaves the container;
  committed fixtures are synthetic via the existing generator, extended for
  the KBC family; run the criterion privacy gates (both halves) plus an
  independent in-memory scrub before every push, and NEVER write the real
  file names anywhere.

  Standing rules: before EVERY push, diff your branch against
  files-to-touch plus extras on main and declare any excess in the same
  commit (the M3-P2 lesson); red witness before green; phone viewport holds
  on any touched UI surface (390x844, no horizontal scroll); all five env
  values pinned local for db and e2e; Node 26 via nvm for tiphys; npm only;
  integer cents; no em dashes; small commits pushed incrementally; if
  killed and resumed, reread your commits and continue.

  Before reporting: npm run typecheck, npm run lint, npm run gate:tokens,
  npm test, npm run test:e2e all exit 0 at the final head;
  delivery/work-history/m3-p3.yaml schema-valid plus notes; push confirmed
  with git ls-remote output. Report: per-criterion status with executed
  evidence, the real-statement parse result stated abstractly (row count,
  identity held, no content), privacy scrub result, deviations, open
  questions, head sha.
