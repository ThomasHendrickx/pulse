    subject: "M3-P3: KBC Mastercard PDF template, dedup and settlement witnesses, e2e journey"
  - sha: "253e074"
    subject: "docs: M3-P3 work history, schema-valid, with final gate evidence"
key-decisions:
  - decision: >-
      Line classification in the KBC template is shape-first with two
      loud guards (a two-date-prefixed line that fails the full row
      parse is a structure error; an FX continuation line with no open
      row is a structure error), instead of the Belfius template's
      positional margin/indent rule.
    why: >-
      On this layout the counterparty-controlled text is a substring of
      the bank-composed row line, not free-standing lines, so a crafted
      merchant string cannot mint a line and the HZ-001 fabricated-row
      construction has no analogue; the guards keep the zero-sum drop
      shapes loud, which is what the positional rule bought Belfius.
      Reasoning recorded at the template header per mechanism-sibling.
  - decision: >-
      Space-thousands amounts are handled template-locally (spaces
      stripped from the matched text, then the frozen
      parseAmountToCents comma style), leaving parse-amount.ts
      untouched.
    why: >-
      parse-amount.ts's accepted shapes also feed delimited detection
      and the dedup-adjacent delimited parser; widening a shared frozen
      recipe for one layout risks changing detection behaviour, while a
      template-local strip is pure, tested, and scoped to the one
      format that uses spaces.
  - decision: >-
      The settlement date (datum verrekening) maps to
      ParsedRow.valueDate and stays verbatim in rawLine; bookingDate is
      the transaction date.
    why: >-
      The addendum requires the settlement date kept in the raw block
      (done, rawLine) and the booking date to be the transaction date
      (PR2-004); valueDate is the existing slot with exactly value-date
      semantics, the same slot the Belfius template fills from VAL.,
      and no interpretation code reads valueDate, so this adds honest
      data without behaviour change.
  - decision: >-
      In the synthetic KBC fixture the previous balance magnitude
      equals the statement's own Afrekening magnitude (the debit rows
      sum to it), and the companion's settlement debit is booked two
      days after the DOMICILIERING credit.
    why: >-
      This makes the one companion debit satisfy BOTH pairing windows
      at once (amount equality with the card import's settlement total
      for the D-11 link, and amount plus 4-day date match with the
      DOMICILIERING credit for the mirror leg), so the criterion 3.4
      month view closes with zero unmatched legs while criterion 3.3's
      link and mirror assertions are both witnessable in one scenario.
  - decision: >-
      Fixture dates are drawn from 2026-05-16 through 2026-06-14 plus
      2026-06-22, and every identifier, merchant, amount and rate is
      invented.
    why: >-
      The date set was chosen against the distinct date strings
      extracted in-memory from BOTH real statements so no fixture date
      string can collide with either statement in any form; the M3-P2
      Belfius fixtures already occupy May and the companion continues
      that family's account and sequence range (0130-0133).
verification-first:
  - finding: >-
      Real KBC statement structure verified in-container through the
      repository's own extraction settings and line-reconstruction
      algorithm before any code: fingerprint lines KBC-Mastercard and
      Uitgavenstaat present as separate lines; rows are single lines of
      transaction date, settlement date, description, tight-signed
      comma-decimal amount; Vorig saldo and the Afrekening line are
      indented balance lines, the Totaal bedrag line carries no amount,
      the Afrekening amount uses a space thousands separator; 22 rows,
      4 FX rows each followed by two continuation lines (original
      amount, rate) at a deeper indent; exactly one identical duplicate
      row pair; the DOMICILIERING credit equals the negated previous
      balance; the balance identity holds exactly in integer cents; no
      IBAN and no sequence numbers exist anywhere in the document. All
      as the plan's grounding and notes/export-format-facts.md record.
    contradicts-plan: false
  - finding: >-
      The dispatch's upload mapping (0f79fa3d = KBC card, 39bada64 =
      Belfius) verified correct by fingerprint text of both files, per
      fleet warning 9's corrected mapping; the M3-P2 dispatch had had
      the two crossed and this one does not.
    contradicts-plan: false
  - finding: >-
      Fixture-date safety derived before fixture design: the distinct
      DD-MM-YYYY strings of both real statements were extracted
      in-memory and the synthetic period, row dates and Afrekening date
      were chosen outside that set (both statements occupy mid-June
      through mid-July 2026 plus one early-August date; the fixtures
      use mid-May through 14 June plus 22 June).
    contradicts-plan: false
deviations:
  - plan-clause: >-
      M3-P3 "migrations: none, template and fixtures only."
      (delivery/plan/pulse-v02.yaml, phase M3-P3).
    why: >-
      DEV-M3P3-01. Fix round 2 adds ONE migration,
      prisma/schema/migrations/20260822070000_import_settlement_total, a
      single nullable integer column imports.settlementTotalCents. It is
      what closes finding HZ-M3P3-01, and the finding cannot be closed
      without it. The defect is that a card import's settlement total was
      RE-DERIVED as the sum of the magnitudes of its negative rows while
      the figure the statement itself prints was parsed for the balance
      gate and then discarded. Every alternative that avoids storage is
      another re-derivation from the rows: the closest one, minus the sum
      of all rows except the settlement credit, gives the right answer
      only while the credit exactly cancels the previous balance, so it
      breaks the moment a household underpays a statement or a charge is
      disputed, which is precisely the class of assumption this finding
      exists to remove. The settlement figure is a FACT the document
      carries, and CLAUDE.md non-negotiable 5 plus pulse-domain's
      facts-versus-interpretation split say a fact is stored, never
      recomputed by interpretation. The column is nullable and written
      only by the ingest that writes the rows; every pre-existing import
      and every statement that prints no such figure is null, and the
      documented row-sum fallback is what those take. Escalated here
      rather than decided quietly, because "migrations: none" is a phase
      contract clause and this is a departure from it.
  - plan-clause: >-
      M3-P3 files-to-touch: src/modules/import/domain/, test/fixtures/,
      test/domain/, test/application/, test/e2e/import.spec.ts; extras [].
      Reinforced by decision D-19, which describes M3-P3 as changing no UI
      file.
    why: >-
      DEV-M3P3-02. Fix round 2 touches eight paths outside that list, and
      each is owed by a finding rather than chosen. src/modules/ledger/
      (domain, application, adapters): HZ-M3P3-01's settlement total and
      HZ-M3P3-06's card-refund arm both live in the ledger, because that
      is where a card import is summarised and where a positive row is
      classified. src/modules/import/application/ and adapters/: the
      figure has to travel from the parse to the stored row.
      prisma/schema/: see DEV-M3P3-01. src/modules/import/ui/ and
      src/app/(app)/import/[id]/page.tsx and messages/{en,nl,fr}.json:
      CR-M3P3-04, the preview row limit and the copy that discloses it
      were two unlinked literals. NO LAYOUT CHANGED and no stylesheet was
      touched: the UI edits are one new constant module, one import, a
      slice that reads the constant, and two message strings that
      interpolate a count where they used to spell the word "five".
      src/app/globals.css and every overview surface are untouched, so the
      mobile rebuild phases keep their ground. Stated as a departure
      anyway, because D-19 asserts in the plan that this phase changes no
      UI file and that sentence is now false.
  - plan-clause: >-
      Fix-round dispatch: "Do not touch anything under delivery/intake/."
    why: >-
      DEV-M3P3-03. Finding CR-M3P3-08 is not fixed. It reports that
      delivery/intake/pulse-v0.2-pdf-addendum.md quotes one real FX
      continuation line verbatim, including its original-currency amount,
      as a format example. The fix is one line and I did not make it,
      because the dispatch forbids touching that directory and the file is
      owner-authored. It stays open and it is a real leak in a PUBLIC
      repository: it needs the owner, both to change the line and to
      decide whether main's history needs the same purge M3-P3's own
      amount received under M3P3-Q1.
  - plan-clause: >-
      CLAUDE.md non-negotiable 8 and fleet warning 12: nothing from a real
      statement is committed, in any form, and the repository is public.
    why: >-
      DEV-M3P3-04. A repair inside two files this phase does not own.
      Re-derived in fix round 2: one seven-significant-digit thousands-form
      amount from the real Belfius statement occurred verbatim in
      test/domain/profile-detection.test.ts as a parser case AND, in
      dot-decimal form, inside a source comment in
      src/modules/import/domain/parse-amount.ts. It is not round, its
      coincidence is not plausible, and the comment reads like a value
      copied from something open on the desk. Both occurrences were
      replaced with an invented value, measured absent from both real
      statements in six rendering forms before being written. Neither file
      is in M3-P3's files-to-touch and neither is this phase's work; a
      real amount sitting in a public tree is not something to leave for
      the phase that owns the file. HEAD is clean of it; HISTORY IS NOT,
      on this branch and on main, and that purge is the owner's call.
  - plan-clause: >-
      Same clause as DEV-M3P3-04, recorded separately because the decision
      went the other way.
    why: >-
      DEV-M3P3-05. A second thousands-form amount from the same real
      statement occurs in three committed CSV fixtures, two test
      assertions and one e2e comment, and on a line THIS PHASE ADDED to
      the fixture generator. It was NOT replaced. It is a round figure; it
      sits in its fixture as a deliberately absurd reimbursement amount
      whose leading digits read as a joke rather than as a transcription;
      both review lanes independently judged the round-figure class a
      plausible coincidence; and replacing it churns three committed
      fixtures plus the merged M1-P4 records that quote the totals derived
      from them. Recorded, measured and escalated for owner adjudication
      instead of decided here. If the owner reads it the other way the
      change is mechanical and I have listed every location.
  - plan-clause: >-
      Same clause again, for a class no gate and neither review lane
      reached.
    why: >-
      DEV-M3P3-06. Fix round 2 ran its own whole-tree sweep for the class
      that actually leaked twice, multi-word capitalised runs probed
      against both real uploads: 956 runs, 23 hits, and every one of the
      23 is bank-controlled layout vocabulary (transaction-type labels,
      column headers, annex and footer boilerplate, the bank's own app and
      product names). No merchant name, no holder name and no
      place-and-merchant pair is in the tree. TWO BARE PLACE TOKENS DO
      COINCIDE, one with each real statement, both inside otherwise
      invented merchant descriptors in fixtures that predate this round.
      They were left alone and are recorded here: the codebase's own
      merchant normaliser already carries both as generic city vocabulary,
      a bare city token identifies nothing on its own, and changing them
      churns committed fixture bytes. One row this round AUTHORED had
      picked up one of those two tokens by accident; that one was changed
      before commit to a place name measured absent from both documents,
      because for new content the measured-absent choice is free.
  - plan-clause: >-
      Fix-round dispatch: work every finding in both verdicts.
    why: >-
      DEV-M3P3-07. Two findings are answered by argument rather than by a
      code change, and both are named in the report. CR-M3P3-03 asked for
      an honest header on scripts/gate-privacy.sh; that landed on main
      before this round started (commits 364227a, 88c861e and fd1d51d),
      and the file now states what its three rules decide and what they
      cannot see, so nothing is owed. HZ-M3P3-03's design-mockup half also
      landed on main and was re-verified clean by this round's own sweep.
      HZ-M3P3-08's second half is CORRECTED RATHER THAN ACCEPTED: it
      reports that two of the three KBC marketing footer lines occur
      verbatim in the real card statement, and measurement in fix round 2
      finds exactly ONE of the three does. The record in the fixture
      generator says one, not two, and says how it was measured.

