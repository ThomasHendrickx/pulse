  - sha: "d47614a"
    subject: "M3-P3: KBC Mastercard PDF template, dedup and settlement witnesses, e2e journey"
  - sha: "253e074"
    subject: "docs: M3-P3 work history, schema-valid, with final gate evidence"
key-decisions:
  - decision: >-
      Line classification in the KBC template is shape-first with two
      loud guards (a two-date-prefixed line that fails the full row
      parse is a structure error; an FX continuation line with no open
      row is a structure error), instead of the Belfius template's
      positional margin/indent rule.
    why: >-
      On this layout the counterparty-controlled text is a substring of
      the bank-composed row line, not free-standing lines, so a crafted
      merchant string cannot mint a line and the HZ-001 fabricated-row
      construction has no analogue; the guards keep the zero-sum drop
      shapes loud, which is what the positional rule bought Belfius.
      Reasoning recorded at the template header per mechanism-sibling.
  - decision: >-
      Space-thousands amounts are handled template-locally (spaces
      stripped from the matched text, then the frozen
      parseAmountToCents comma style), leaving parse-amount.ts
      untouched.
    why: >-
      parse-amount.ts's accepted shapes also feed delimited detection
      and the dedup-adjacent delimited parser; widening a shared frozen
      recipe for one layout risks changing detection behaviour, while a
      template-local strip is pure, tested, and scoped to the one
      format that uses spaces.
  - decision: >-
      The settlement date (datum verrekening) maps to
      ParsedRow.valueDate and stays verbatim in rawLine; bookingDate is
      the transaction date.
    why: >-
      The addendum requires the settlement date kept in the raw block
      (done, rawLine) and the booking date to be the transaction date
      (PR2-004); valueDate is the existing slot with exactly value-date
      semantics, the same slot the Belfius template fills from VAL.,
      and no interpretation code reads valueDate, so this adds honest
      data without behaviour change.
  - decision: >-
      In the synthetic KBC fixture the previous balance magnitude
      equals the statement's own Afrekening magnitude (the debit rows
      sum to it), and the companion's settlement debit is booked two
      days after the DOMICILIERING credit.
    why: >-
      This makes the one companion debit satisfy BOTH pairing windows
      at once (amount equality with the card import's settlement total
      for the D-11 link, and amount plus 4-day date match with the
      DOMICILIERING credit for the mirror leg), so the criterion 3.4
      month view closes with zero unmatched legs while criterion 3.3's
      link and mirror assertions are both witnessable in one scenario.
  - decision: >-
      Fixture dates are drawn from 2026-05-16 through 2026-06-14 plus
      2026-06-22, and every identifier, merchant, amount and rate is
      invented.
    why: >-
      The date set was chosen against the distinct date strings
      extracted in-memory from BOTH real statements so no fixture date
      string can collide with either statement in any form; the M3-P2
      Belfius fixtures already occupy May and the companion continues
      that family's account and sequence range (0130-0133).
verification-first:
  - finding: >-
      Real KBC statement structure verified in-container through the
      repository's own extraction settings and line-reconstruction
      algorithm before any code: fingerprint lines KBC-Mastercard and
      Uitgavenstaat present as separate lines; rows are single lines of
      transaction date, settlement date, description, tight-signed
      comma-decimal amount; Vorig saldo and the Afrekening line are
      indented balance lines, the Totaal bedrag line carries no amount,
      the Afrekening amount uses a space thousands separator; 22 rows,
      4 FX rows each followed by two continuation lines (original
      amount, rate) at a deeper indent; exactly one identical duplicate
      row pair; the DOMICILIERING credit equals the negated previous
      balance; the balance identity holds exactly in integer cents; no
      IBAN and no sequence numbers exist anywhere in the document. All
      as the plan's grounding and notes/export-format-facts.md record.
    contradicts-plan: false
  - finding: >-
      The dispatch's upload mapping (0f79fa3d = KBC card, 39bada64 =
      Belfius) verified correct by fingerprint text of both files, per
      fleet warning 9's corrected mapping; the M3-P2 dispatch had had
      the two crossed and this one does not.
    contradicts-plan: false
  - finding: >-
      Fixture-date safety derived before fixture design: the distinct
      DD-MM-YYYY strings of both real statements were extracted
      in-memory and the synthetic period, row dates and Afrekening date
      were chosen outside that set (both statements occupy mid-June
      through mid-July 2026 plus one early-August date; the fixtures
      use mid-May through 14 June plus 22 June).
    contradicts-plan: false
