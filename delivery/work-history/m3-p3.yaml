  - id: M3P3-F3-Q1
    kind: open-question
    statement: >-
      A card reissued with a new number cannot continue on its existing
      account. Identity is the normalised card string in the profile spec,
      and a spec that matches no stored profile has exactly one branch
      available in the confirmation flow, which creates an account rather
      than offering to bind to one. So the answer to a reissue today is a
      duplicate account holding the same card's later rows, with the
      earlier ones left behind in the first. The delta hazard lane raised
      this beside the identity split; the round 3 dispatch supplement
      narrowed that finding to the normalisation after the criteria lane
      demonstrated the end-to-end path working, so the binding half was
      deliberately left out of this round rather than missed. It is a
      product decision as much as a mechanism: binding a file to an
      existing account is a question the confirmation screen does not ask
      today and would have to.
      ADDED IN FIX ROUND 4 (finding HZ3-M3P3-04), because whoever builds
      that screen needs it: the account a card file binds to may ALREADY
      hold another card's rows. The identity is the masked form, and two
      different cards sharing their visible digits and mask positions print
      one masked form, so the binding screen cannot assume that one account
      means one card. The delta hazard lane judged leaving this open safe
      for the owner's real data now that capture is normalised, because the
      accidental split is closed and the remaining trigger is a reissue the
      owner initiates and will recognise, whose consequence is a second
      account with split history rather than the same rows twice. Recorded
      here rather than argued again.
  - id: M3P3-F2-Q2
    kind: open-question
    statement: >-
      The card identity now rides the profile spec as accountIdentifier,
      which means a stored pdf-layout profile created BEFORE this change
      is no longer spec-equal to a freshly detected one for the same card,
      and its next upload would ask a declaration and create a twin
      profile rather than fail closed. No migration is owed TODAY, because
      the KBC template has never been merged or deployed and no stored KBC
      profile can exist anywhere. It is written down because the next
      person to change a pdf-layout spec shape will not have that luxury:
      at that point the template-version bump procedure at pdf-template.ts
      is the mechanism, and it fails closed by design.
    still-open-because: >-
      The statement carries "never" where it says the template has never
      been merged or deployed, which is a guarded token, so this field is
      owed. It stays open because the migration question it names is not
      answerable until a pdf-layout spec shape changes AFTER something is
      stored, and nothing is stored today; I checked the branch history
      and the deployed state rather than assuming, and there is no stored
      KBC profile to migrate.
  - id: M3P3-Q3
    kind: open-question
    statement: >-
      A corrupted row line whose two-date prefix is itself damaged
      looks like boilerplate to this template and would drop silently
      when its amount is zero; a nonzero amount in that corner reddens
      the balance gate, and this format offers no sequence numbers to
      anchor a continuity gate on. Stated at the template header; same
      residue class M3-P2 recorded for the Belfius first-transaction
      corner.
