      pre-existing arm, the sum of the magnitudes of the debit rows, in
      place as the fallback. Netting the LINE ITEMS is a different
      derivation and it is what the printed figure IS. The fallback is now
      that net, and it is reached only by an import whose source printed
      no figure at all. Storing the printed figure where one exists is
      unchanged and still wins, so nothing the earlier reasoning got right
      is given up; what changes is that the arm nobody printed a figure
      for is no longer answered with arithmetic this round had already
      proved wrong. The residue is stated at the code: on an underpaid
      previous statement no derivation from rows alone can recover the
      printed figure, which is exactly why a printed figure is stored.
      NOTED IN FIX ROUND 4 BECAUSE IT IS WORTH KEEPING: the criteria lane
      endorsed this deviation and, in doing so, corrected reasoning THAT
      SAME LANE had endorsed a round earlier. It had rejected
      derivation-from-balances on evidence it built itself, and then let
      "every storage-free alternative is another re-derivation" stand
      without noticing that the pre-existing fallback was a DIFFERENT
      derivation. Both sides reached the same correction from opposite
      directions, one round apart. That is the two-lane process doing what
      it is for, and it is recorded rather than left to disappear into a
      green verdict.
