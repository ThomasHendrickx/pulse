          text, label removed from the pattern) then Mutation B (an additional
          strip keyed on digit-run length alone), each applied alone to
          src/modules/merchants/domain/normalise-counterparty.ts and followed by
          npx vitest run test/domain/normalise-counterparty.test.ts
          test/domain/merchant-review.test.ts
        exit-code: 1
        output: |
          MUTATION A: Tests 15 failed | 61 passed (76)
            x ... a non-card row carrying an X-masked token followed by
