claims:
  - id: M3P6-C1
    kind: coverage
    statement: >-
      Criterion 6.10 holds at the fix-round head in all three of its original
      halves AND in the SQL half the fix round added: the literal
      operand-bearing pattern matches exactly three files, the two frozen
      sibling recipes import no path of the shared helper's module, the shared
      helper's import specifier appears in exactly the two former call sites,
      and the SQL form of the same rule now appears exactly once.
    settled-by:
      executed-construction:
        command: >-
          grep -rlE 'counterpartyName \?\? [A-Za-z_]*\.?description' src/ ;
          grep -nE 'normalise-counterparty|merchants/application|merchants/domain'
          src/modules/import/domain/dedup.ts src/modules/ledger/domain/corrections.ts ;
          grep -rlE '^\s*(import \{[^}]*\bcounterpartyText\b|  counterpartyText,)' src/ ;
          grep -rnE 'COALESCE\(\s*t\."counterpartyName",\s*t\."description"\s*\)' src/
        exit-code: 0
        output: |
          src/modules/import/domain/dedup.ts
          src/modules/ledger/domain/corrections.ts
          src/modules/merchants/domain/normalise-counterparty.ts
          count=3

