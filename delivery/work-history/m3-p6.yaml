environment-warnings:
  - warning: >-
      The tenancy gate holds every repository file to "no export that does not
      take a household context", and it fails CLOSED, so adding an exported
      SQL fragment to a repository file reddens test/schema/tenancy.test.ts
      with no hint that the export is a constant rather than a query. Keep such
      a fragment module-local; a test that pins its TEXT does not need the
      symbol.
    evidence: >-
      npm test after exporting COUNTERPARTY_TEXT_SQL: 1 failed | 337 passed,
      "repositories-take-household-context ... the real src/modules tree has no
      tenancy violations", expected [ { ... } ] to deeply equal []. Making the
      constant module-local: 338 passed.
  - warning: >-
      pkill -f "next dev" and pkill -f "next-server" match the agent's own
      shell command line and kill the shell running them (observed exit 144
      twice). Check the port with curl instead, or match a pattern that cannot
      appear in the killing command itself.
    evidence: >-
      Two Bash calls returned exit code 144 with no output; the dev server was
      down afterwards, and a curl probe was the only thing that reported it.
  - warning: >-
      npm ci under npm 10 (Node 22) FAILS on this repository's committed
      lockfile with "Missing: @swc/helpers@0.5.23 from lock file", while npm
      11.19 (Node 26) installs it cleanly. package.json pins engines to node
      22.x, so the obvious toolchain choice is the one that does not work.
    evidence: >-
      /opt/node22/bin/npm ci -> exit 1, EUSAGE, "Missing: @swc/helpers@0.5.23
      from lock file". Ambient node v26.7.0 with npm 11.19.0 -> npm ci exit 0.
