          changed files: 2 hits, both from those same base-matching generic
          probes. In-memory scrub over commits and patch: 0.
  - id: M3P6-C6
    kind: open-question
    statement: >-
      The merchant-source rule has a third implementation, in SQL, at
      src/modules/overview/adapters/overview-repository.ts:95 and :266, as
      COALESCE of the counterparty name and the description. Criterion 6.10's
      literal pattern is TypeScript and does not see it. This phase named it at
      the helper's definition rather than rewriting the aggregation.
    still-open-because: >-
      The query is raw SQL by design (pulse-domain section 9 keeps the overview
      aggregations set-based), so it cannot call the shared helper, and
      src/modules/overview/adapters is outside this phase's files-to-touch.
      Whether that third site should be derived from one place, and how, is a
      decision for the orchestrator.
  - id: M3P6-C7
    kind: open-question
    statement: >-
      Criterion 6.3(b) permits the structured-reference row's 13-to-19-digit run
      in both its key and its rendered label. This implementation keeps it in
      the key and masks it in the label, so the label side of that permission
      goes unused.
    still-open-because: >-
      The criterion states the exception as a permission rather than an
      obligation, and finding PR5-002's reasoning (that the key and the label
      are the same string for an unresolved group) is satisfied either way. A
      reviewer who reads the exception as an obligation would want the display
      helper anchored to the card grammar instead of to the digit window, which
      is a different trade and would leave an unlabelled card number visible.
  - id: M3P6-C8
    kind: open-question
    statement: >-
      Descriptors on the second payment rail keep rail vocabulary and separator
      dashes in their key, so a group label there reads less cleanly than one on
      the first rail.
    still-open-because: >-
      Step 3 lists exactly five things to strip and the contactless marker is
      not among them. Rows of one merchant on that rail still collapse to one
      key, so grouping is correct; only the label's readability suffers.
      Widening the strip is a recipe change the plan did not authorise, and
      under the stability contract it would travel with a stored-pattern
      migration.
  - id: M3P6-C9
    kind: open-question
    statement: >-
      Two phone-viewport overflows were fixed in src/app/globals.css, which is
      outside files-to-touch.
    still-open-because: >-
      I found no way to satisfy criterion 6.7 from a file on the list: the
      overflow was measured at 462 on the merchant review and 424 on the month
      view, and in both cases the overflowing rule is in that stylesheet
      (.merchant-row's non-wrapping flex and .month-grid's fixed
      --layout-rail track). The brief states that a file outside the
      declaration is amended on the base branch rather than on this one, which
      is why this is handed back rather than fixed by editing the declaration
      here. The phase wants a base-branch amendment adding src/app/globals.css,
      or an explicit acceptance of the excess.
  - id: M3P6-C10
    kind: coverage
    statement: >-
      Every mechanism this phase touches was looked up in the kernel's mechanism
      index before the code that uses it was written.
    settled-by:
      executed-construction:
        command: >-
          Read node_modules/@tiphys/kernel/tuition/mechanism-index.yaml in full
          (grep -n 'name:' listed all 14 entries; the three plausibly relevant
          ones were read in their entirety)
        exit-code: 0
        output: |
          RELEVANT: "Deciding what another program will do by pattern-matching
          the text of a file it consumes". Its rule, one tier down, is what
          this phase's strip patterns obey: PIN the accepted shapes and fail
          closed on anything else, never widen the pattern. Each card pattern
          matches an observed printed shape and is grounded in a committed
          fixture; the header comment states that adding a shape is a recipe
          change under the stability contract rather than a widening.
          NO ENTRY EXISTS for the mechanism this phase's own hazard turns on,
          a normalisation recipe whose OUTPUT is stored as a user declaration.
          Recorded as absent rather than skipped. Its rule is stated at the
          definition (normalise-counterparty.ts) and its siblings are named
          there: the frozen dedup hash, the ledger refund key, and the SQL
          COALESCE in the overview repository.
          The remaining index entries (claim files, leases, worktree removal,
          append-only logs, reporter parsing, path-type establishment,
          supervision, remote access, generated-artifact checking, error
          classification, guard failure paths, atomic replacement, shared
          worktrees, CI-step wiring) cover kernel mechanisms this phase does
          not use.
environment-warnings:
  - warning: >-
      npm ci under npm 10 (Node 22) FAILS on this repository's committed
      lockfile with "Missing: @swc/helpers@0.5.23 from lock file", while npm
      11.19 (Node 26) installs it cleanly. package.json pins engines to node
