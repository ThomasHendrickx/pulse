key-decisions:
  - decision: >-
      The shared merchant-source helper lives in
      src/modules/merchants/domain/normalise-counterparty.ts, merchant-review.ts
      imports and re-exports it, and interpret-window.ts imports it through the
      merchants module's published application interface.
    why: >-
      Criterion 6.10's positive half requires BOTH former call sites to be
      witnessed by what they IMPORT, so the helper could not stay in
      merchant-review.ts where one of them defines it. A new file in
      merchants/domain would have been outside files-to-touch. Putting it beside
      the normaliser that consumes it keeps it on the list, keeps the merchants
      module's published interface byte-identical for every existing importer
      (index.ts re-exports counterpartyText from merchant-review.ts, which now
      re-exports it in turn, so index.ts needed no edit), and keeps the ledger's
      cross-module import on the published application interface as pulse-domain
      section 9 requires.
  - decision: >-
      The display helper masks ANY 13-to-19-digit run once separators are
      removed, including the legitimate structured reference criterion 6.3(b)
      names as its permitted exception.
    why: >-
      Criterion 6.3 defines a card-number run as exactly that, and the sentence
      that follows says the display helper renders SUCH a run masked. The
      exception in 6.3(b) is a permission, not an obligation: a sweep saying "no
      label carries a run except possibly this one" is satisfied a fortiori by a
      label that carries none. The trade differs from the normaliser's on
      purpose and is written down at both definitions: the strip must NOT key on
      length, because a stripped reference is gone from the grouping key and
      from the stored rule subject, while a masked reference costs a reader four
      digits and still sits verbatim in the fact.
  - decision: >-
      The fixture's five rows of one merchant use one payment rail with both
      printed card-tail shapes, rather than one merchant spread across both
      rails.
    why: >-
      Collapsing across both rails would need a country-code strip and deeper
      separator cleanup, neither of which step 3 lists. Step 3's list is the
      contract and substituting a wider design for it is the thing R-007 and
      R-034 forbid. The second rail is still grounded by its own fixture rows,
      which collapse to one key of their own.
  - decision: >-
      An orphan-separator collapse was added to the recipe (a run of dash
      separators becomes one).
    why: >-
      Stripping a field from between two separators leaves the separators
      orphaned, which is the same class of artifact as the doubled space the
      recipe already collapses. It touches separators only and cannot reach a
      letter, so it is hygiene rather than a strip, and it changed no pre-M3-P6
      pin.
verification-first:
  - finding: >-
      The deployed pulse database holds ZERO MerchantRule rows. Measured
      read-only against project ref ygsarzjqosqmkqibqogk with the query
      "select count(*)::int as merchant_rules, (select count(*)::int from
      public.merchants) as merchants, (select count(*)::int from
      public.transactions) as transactions, (select count(*)::int from
      public.imports) as imports from public.merchant_rules;", which returned
      [{"merchant_rules":0,"merchants":0,"transactions":0,"imports":1}]. The one
      deployed import sits in status AWAITING_DECLARATION. This selects the ZERO
      branch of the CR-402 stability contract: no stored pattern exists to
      detach, so no re-normalisation migration ships, and the contract is
      discharged by the updated pinned table plus this recorded measurement.
      Re-measured at the release head with the same pinned query: still zero.
    contradicts-plan: false
  - finding: >-
      The PREDICATE that defines a card row, written down explicitly because the
      plan's step 1(d) asks for it: a row is a CARD ROW when its uppercased
      descriptor matches /\bKAART\s+NR\s+(?:\d{4}[ .-]?){3}\d{4}\b/, the
      card-number label followed by a four-group sixteen-digit run. Measured
      in-container through the SHIPPED pipeline at the phase base, counts only:
      39 rows parsed; 15 match that predicate; 23 match the broader predicate
      that accepts the label word without the number word and X-masked groups,
      which is 15 full grouped tails plus 8 partially masked ones; 0 of the 15
      carry a counterpartyName; the shipped normaliser produces 15 distinct keys
      over those 15 rows; 15 of 15 keys still carry a separator-insensitive
      sixteen-digit run while 0 of 39 descriptors carry a CONTIGUOUS one; 15 of
      15 keys carry the trailing holder-like shape, a bare day-and-month token
      and an amount followed by a currency code; 11 descriptors carry an X-run
      of two or more, of which 0 carry the label-plus-number-word form, 8 carry
      the bare label word and 8 end in a holder-like tail. Over NORMALISED KEYS,
      20 of 39 contain a 13-to-19-digit run once spaces, dots and dashes are
      removed, and 5 of those are non-card keys; the standalone structured
      reference tokens are 15, 15, 15 and 13 digits long. Every count the plan
      states is reproduced.
    contradicts-plan: false
  - finding: >-
      A PREDICATE-SENSITIVITY result the plan's step 1(d) exists to surface: the
      13-to-19-digit sweep gives 20 of 39 and 5 non-card rows over NORMALISED
      KEYS, and 28 of 39 and 13 non-card rows over RAW DESCRIPTORS, because
      removing separators glues an IBAN to its neighbours and yields a
      fourteen-digit run. The plan's numbers are correct for the surface
      criterion 6.3 names, which is keys. This changes no design decision: more
      non-card rows inside the window makes the named-exception design more
      necessary rather than less.
    contradicts-plan: false
  - finding: >-
      The pre-change grouping measurement on the committed synthetic fixture,
      which step 1(b) requires as the recorded "before". Over
      test/fixtures/card-descriptors.csv through detectSourceProfile,
      parseStatement and the BASE normaliser: 12 distinct keys over 13 rows,
      with the one fixture merchant's five rows producing FIVE distinct keys.
      After the recipe change the same measurement gives 8 distinct keys over 13
      rows and ONE key for those five rows. The five pre-change keys are pinned
      in test/domain/merchant-review.test.ts as captured literals and are not
      recomputed by calling the new normaliser: the constant
      PRE_CHANGE_KEYS_OF_THE_ONE_MERCHANT is a literal array, which
      "grep -n 'PRE_CHANGE_KEYS_OF_THE_ONE_MERCHANT' -A 3
      test/domain/merchant-review.test.ts" shows carries string literals and no
      call. This matters because the contract is idempotent over its own
      output, so a self-seeded "before" would be green for any recipe whatever
      (finding PR3-005).
    contradicts-plan: false
  - finding: >-
      Step 1(c), recorded as asked: the real statement's merchant count is NOT
      the number any criterion asserts. Every acceptance criterion in this phase
      runs on synthetic fixtures with invented values, and no assertion anywhere
      in the suite depends on a measurement of the real file.
    contradicts-plan: false
deviations:
  - plan-clause: >-
      Step 1(a): the deployed MerchantRule count is measured "over a connection
      string pinned explicitly to the pulse deployed project's session pooler
      (never the ambient DATABASE_URL, fleet warnings 1 and 5)".
    why: >-
      No pulse database password exists in this container or in the repository.
      The fleet's own infrastructure note records that it holds no secrets, and
      the only ambient DATABASE_URL belongs to a different project, which fleet
      warning 1 forbids using. The count was taken instead through the Supabase
      management API pinned to the pulse project by its ref
      (ygsarzjqosqmkqibqogk), which is the route every previous deployed-schema
      step in this delivery used, and the statement was a read-only count. Same
      measurement, same project, different transport. Declared the moment it was
      found, before any code was written.
  - plan-clause: >-
      files-to-touch, which does not list src/app/globals.css.
    why: >-
      Criterion 6.7 requires 390x844 to hold on the month view and the merchant
      review. Both screens already overflowed before this phase and neither
      overflow can be fixed from a file on the list: the merchant review reached
      a scrollWidth of 462 because the naming form has an intrinsic width inside
      a non-wrapping row, and the month view reached 424 because .month-grid's
      second track was the fixed --layout-rail width and could not shrink. Both
      are pre-existing: nothing in this phase widened either, and the
      phone-viewport spec M3-P1 added visits an empty-state household where the
      month grid is not in the document at all. Both fixes are wrapping-only and
      use existing tokens. This needs a files-to-touch amendment on the base
      branch, or an explicit acceptance of the excess; it is declared in the
      commit that makes it and in the report.
  - plan-clause: >-
      files-to-touch, which lists no test/application path, while criterion 6.5
      asks for "an import test re-importing the card fixture".
    why: >-
      That test lives in test/domain/merchant-review.test.ts, which IS on the
      list, and imports the existing in-memory port fakes from
      test/application/fake-import-world.ts without modifying them. The file
      name says "domain" while three of its describe blocks drive the real
      import path; the alternative was a new file outside the declaration.
  - plan-clause: >-
      Criterion 6.3's e2e half, "the merchant review and month view specs
      asserting the same two sweeps over rendered group labels", and criterion
      6.7's phone spec covering both screens.
    why: >-
      Both live in ONE spec inside test/e2e/merchants.spec.ts, which navigates
      to /merchants and then to /?month=2026-08 and runs the identical sweep
      helper over the rendered group labels of each. test/e2e/month-view.spec.ts
      is not in files-to-touch, so a second spec file there would have been an
      excess on top of the stylesheet one. The sweep helper is defined once and
      applied to both surfaces, which is what "the same two sweeps" asks for.
