            x criterion 6.1: ... the non-card control row ... is UNCHANGED
            x the pinned row "ONLINE AANKOOP WEBSHOP DE VLIEGER ..."
          MUTATION B: Tests 5 failed | 71 passed (76)
            x a legitimate 13-to-19-digit structured reference on a NON-card
              row survives in the key
            x criterion 6.1: ... keeps it in its key
            x criterion 6.3 (b) exactly ONE key carries a 13-to-19-digit run
