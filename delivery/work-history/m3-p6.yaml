fix-round:
  - mechanism: >-
      IDENTIFYING A VALUE BY THE SHAPE IT HAPPENS TO HAVE INSTEAD OF BY THE
      GRAMMAR THAT DEFINES IT. The finding was that maskCardNumbers masked
      zero card numbers and six non-card identifiers on the owner's two real
      statements. The mechanism is that it decided "this is a card number"
      from a digit-run length, while the merchants normaliser one module over
      already refuses exactly that and says so in its own rules. Anywhere the
      two disagree about what a card number IS, one of them is wrong about a
      real row. The fix is not "narrow the run pattern": it is that both
      sites now use the SAME grammar, the card-number LABEL followed by four
      groups, and the price of that anchoring is written down at both.
    derivation:
      command: >-
        grep -rnE '13,19|\{13,19\}|\[0-9X\]\{4\}|KAART' --include='*.ts'
        --include='*.tsx' src/ test/ | grep -vE '^\S+:\s*//|// ' | sort
      output: |
        In PRODUCTION code the enumeration is exactly two sites, and after
        this round they carry the same grammar:
          src/modules/merchants/domain/normalise-counterparty.ts:168
            /(\bKAART(?:\s+NR\.?)?)\s+(?:[0-9X]{4}[\s.-]*){3}[0-9X]{4}(?:\s*-\s*[A-Z][A-Z'-]+(?:\s+[A-Z][A-Z'-]+)*\s*$)?/g
          src/platform/ui/mask-card-number.ts:84
            /(\bKAART(?:\s+NR\.?)?\s+)((?:[0-9X]{4}[\s.-]*){3}[0-9X]{4})\b/g
        Two further production lines matched the grep and are NOT card-number
        identification: normalise-counterparty.ts:196, the amount pattern,
        which uses the label only as a LOOKAHEAD anchor, and :211, the
        terminal-noise pattern for a Dutch card-payment phrase.
        Every other hit is in test/ or test/fixtures: 3 sites define the
        13-to-19 sweep used by the criterion 6.3 assertions
        (test/domain/merchant-review.test.ts:91,
        test/domain/normalise-counterparty.test.ts:346,
        test/e2e/merchants.spec.ts:105), and the remainder are fixture
        strings and expectations, including the four PDF-fixture card
        descriptors in test/fixtures/generate-pdf-fixtures.ts that carry the
        Dutch contactless token finding HZ-M3P6-06 is about.
    not-covered: >-
      The search is over .ts and .tsx under src/ and test/ ONLY. It does
      not reach: the SQL in the overview repository, which selects
      counterparty text but never inspects it for a card number; the
      message catalogs under messages/, which carry no descriptor
      interpolation (checked separately, zero hits); anything that would
      identify a card number by a token OTHER than the four I grepped, for
      instance a Luhn check or a bank-name heuristic, of which the tree
      contains none today but which the grep would not have found; and any
      code outside this repository, notably the KBC template on the
      unmerged M3-P3 branch, whose descriptors were probed to carry NO
      card-number label at all.
  - mechanism: >-
      A RENDERING SURFACE THAT DISPLAYS DESCRIPTOR TEXT WITHOUT PASSING IT
      THROUGH THE DISPLAY HELPER. The finding named one surface, the import
      confirm preview. The mechanism is that round 0 enumerated the two
      surfaces the plan happened to name and never derived the set, so any
      surface the plan did not think of renders raw. The fix is the
      derivation below, kept in the helper's own comment so the next reader
      re-runs it rather than trusting a list.
    derivation:
      command: >-
        grep -rnE
        '\{[^}]*\b(description|counterpartyText|counterpartyName|rawLine|\.label|\.text)\b[^}]*\}'
        --include='*.tsx' src/ | sort
      output: |
        src/modules/import/ui/profile-confirmation.tsx:100:  <td>{row.counterpartyName ?? row.counterpartyIban ?? ""}</td>
        src/modules/import/ui/profile-confirmation.tsx:101:  <td className="preview-descriptor">{row.description}</td>
        src/modules/merchants/ui/merchant-review.tsx:36:        {maskCardNumbers(group.label)}
        src/modules/merchants/ui/merchant-review.tsx:49:            value={group.counterpartyText}
        src/modules/overview/ui/month-view.tsx:226:  <span className="month-group-label">{group.label}</span>
        src/modules/overview/ui/month-view.tsx:263:          {row.text}
        src/modules/overview/ui/month-view.tsx:321:  <span className="pulse-eyebrow recon-part-label">{part.label}</span>
        src/modules/overview/ui/month-view.tsx:87:  {group.kind === "cash" ? t("cash") : maskCardNumbers(group.label)}
        EIGHT sites, THREE files. Round 0 masked two of them. This round masks
        three more: profile-confirmation.tsx:100 and :101 (finding
        CR-M3P6-01) and month-view.tsx:263, the reconciliation gap row, which
        renders the UNNORMALISED counterparty text (finding CR-M3P6-03).
        THE THREE THAT ARE DELIBERATELY NOT MASKED, each with its reason
        rather than by omission: merchant-review.tsx:49 is the hidden field
        that becomes the EXACT rule subject and MUST stay unmasked (decision
        D-12); month-view.tsx:226 is the reserves group label, which is the
        user's own declared account label or a counterparty IBAN and is not a
        descriptor; month-view.tsx:321 is translated copy.
    not-covered: >-
      The pattern is a JSX EXPRESSION over .tsx files, so it does not reach:
      a descriptor rendered through a variable named something else, since
      the pattern keys on five field names; a descriptor placed in an
      ATTRIBUTE rather than in element text, which was swept separately
      (grep for title= and aria-label= carrying a descriptor: zero hits); a
      descriptor written to a log, swept separately (zero hits); a
      descriptor interpolated through a translation message, swept
      separately over messages/ (zero hits); and any surface added after
      this head, which is the reason the command lives in the helper's
      comment instead of the result.

key-decisions:
  - decision: >-
      The shared merchant-source helper lives in
      src/modules/merchants/domain/normalise-counterparty.ts, merchant-review.ts
      imports and re-exports it, and interpret-window.ts imports it through the
      merchants module's published application interface.
    why: >-
      Criterion 6.10's positive half requires BOTH former call sites to be
      witnessed by what they IMPORT, so the helper could not stay in
      merchant-review.ts where one of them defines it. A new file in
      merchants/domain would have been outside files-to-touch. Putting it beside
      the normaliser that consumes it keeps it on the list, keeps the merchants
      module's published interface byte-identical for every existing importer
      (index.ts re-exports counterpartyText from merchant-review.ts, which now
      re-exports it in turn, so index.ts needed no edit), and keeps the ledger's
      cross-module import on the published application interface as pulse-domain
      section 9 requires.
  - decision: >-
      REVERSED IN FIX ROUND 1. The display helper no longer masks any
      13-to-19-digit run; it masks where the card-number LABEL identifies a
      card number, the same grammar the merchants normaliser strips.
    why: >-
      Round 0 read criterion 6.3's sentence "the display helper renders such a
      run masked" as licensing a length test, and reasoned that a permission is
      satisfied a fortiori by masking more. The review measured what that cost
      on real data: ZERO card numbers masked and SIX non-card identifiers
      damaged, because the normaliser had already removed every card number
      from the keys, so on observed data the length test only ever fired on
      something else. The round-0 reasoning was sound about the criterion and
      wrong about the world, which is the difference a probe makes. The
      criterion is still satisfied, and its named exception is now REAL rather
      than vacuous: the structured reference is not a card number, so nothing
      masks it and the owner can still read it.
  - decision: >-
      The trailing-city loop keeps running on card descriptors, which is NOT
      the edit finding HZ-M3P6-08 proposed.
    why: >-
      The proposed edit was implemented first and then rejected on evidence.
      Skipping the loop for card descriptors makes the key space not closed
      under the pipeline: a card key ending in a city re-normalises without the
      city, because the second pass sees no card tail. assign-merchant.ts
      normalises the submitted subject again, so the stored EXACT rule would
      have been the city-less string while every matching row keys with the
      city, and the owner's naming would have matched NOTHING while every total
      stayed right. That is hazard H6.4, which outranks a latent merge of two
      branches of one chain, and the pinned idempotency assertion caught it. The
      merge the finding names is M1-P4's deliberate rule reaching card rows, it
      is now pinned as what it is, and a new closure invariant asserts over
      EVERY group that a submitted subject re-normalises to itself.
  - decision: >-
      The two payment rails are unified by keeping the CITY on both, not by
      dropping it from either.
    why: >-
      The rails disagreed because one prints "postcode CITY" and the other
      prints the city as bare text, and the postal pattern removed the pair
      wholesale. Dropping the city from the other rail would have collided
      head-on with HZ-M3P6-08. Keeping it, by removing only the postal CODE and
      dropping the separator dashes a card descriptor prints between its
      fields, makes both rails produce the same key without touching the city
      rule at all. Measured on the owner's own statement: the two merchants the
      review found split across rails are now one group each, and all four
      merged groups are still one merchant.
  - decision: >-
      The fixture's five rows of one merchant use one payment rail with both
      printed card-tail shapes, rather than one merchant spread across both
      rails.
    why: >-
      Collapsing across both rails would need a country-code strip and deeper
      separator cleanup, neither of which step 3 lists. Step 3's list is the
      contract and substituting a wider design for it is the thing R-007 and
      R-034 forbid. The second rail is still grounded by its own fixture rows,
      which collapse to one key of their own.
  - decision: >-
      An orphan-separator collapse was added to the recipe (a run of dash
      separators becomes one).
    why: >-
      Stripping a field from between two separators leaves the separators
      orphaned, which is the same class of artifact as the doubled space the
      recipe already collapses. It touches separators only and cannot reach a
      letter, so it is hygiene rather than a strip, and it changed no pre-M3-P6
      pin.
verification-first:
  - finding: >-
      The deployed pulse database holds ZERO MerchantRule rows. Measured
      read-only against project ref ygsarzjqosqmkqibqogk with the query
      "select count(*)::int as merchant_rules, (select count(*)::int from
      public.merchants) as merchants, (select count(*)::int from
      public.transactions) as transactions, (select count(*)::int from
      public.imports) as imports from public.merchant_rules;", which returned
      [{"merchant_rules":0,"merchants":0,"transactions":0,"imports":1}]. The one
      deployed import sits in status AWAITING_DECLARATION. This selects the ZERO
      branch of the CR-402 stability contract: no stored pattern exists to
      detach, so no re-normalisation migration ships, and the contract is
      discharged by the updated pinned table plus this recorded measurement.
      Re-measured at the release head with the same pinned query: still zero.
    contradicts-plan: false
  - finding: >-
      The PREDICATE that defines a card row, written down explicitly because the
      plan's step 1(d) asks for it: a row is a CARD ROW when its uppercased
      descriptor matches /\bKAART\s+NR\s+(?:\d{4}[ .-]?){3}\d{4}\b/, the
      card-number label followed by a four-group sixteen-digit run. Measured
      in-container through the SHIPPED pipeline at the phase base, counts only:
      39 rows parsed; 15 match that predicate; 23 match the broader predicate
      that accepts the label word without the number word and X-masked groups,
      which is 15 full grouped tails plus 8 partially masked ones; 0 of the 15
      carry a counterpartyName; the shipped normaliser produces 15 distinct keys
      over those 15 rows; 15 of 15 keys still carry a separator-insensitive
      sixteen-digit run while 0 of 39 descriptors carry a CONTIGUOUS one; 15 of
      15 keys carry the trailing holder-like shape, a bare day-and-month token
      and an amount followed by a currency code; 11 descriptors carry an X-run
      of two or more, of which 0 carry the label-plus-number-word form, 8 carry
      the bare label word and 8 end in a holder-like tail. Over NORMALISED KEYS,
      20 of 39 contain a 13-to-19-digit run once spaces, dots and dashes are
      removed, and 5 of those are non-card keys; the standalone structured
      reference tokens are 15, 15, 15 and 13 digits long. Every count the plan
      states is reproduced.
    contradicts-plan: false
  - finding: >-
      A PREDICATE-SENSITIVITY result the plan's step 1(d) exists to surface: the
      13-to-19-digit sweep gives 20 of 39 and 5 non-card rows over NORMALISED
      KEYS, and 28 of 39 and 13 non-card rows over RAW DESCRIPTORS, because
      removing separators glues an IBAN to its neighbours and yields a
      fourteen-digit run. The plan's numbers are correct for the surface
      criterion 6.3 names, which is keys. This changes no design decision: more
      non-card rows inside the window makes the named-exception design more
      necessary rather than less.
    contradicts-plan: false
  - finding: >-
      The pre-change grouping measurement on the committed synthetic fixture,
      which step 1(b) requires as the recorded "before". Over
      test/fixtures/card-descriptors.csv through detectSourceProfile,
      parseStatement and the BASE normaliser: 12 distinct keys over 13 rows,
      with the one fixture merchant's five rows producing FIVE distinct keys.
      After the recipe change the same measurement gives 8 distinct keys over 13
      rows and ONE key for those five rows. The five pre-change keys are pinned
      in test/domain/merchant-review.test.ts as captured literals and are not
      recomputed by calling the new normaliser: the constant
      PRE_CHANGE_KEYS_OF_THE_ONE_MERCHANT is a literal array, which
      "grep -n 'PRE_CHANGE_KEYS_OF_THE_ONE_MERCHANT' -A 3
      test/domain/merchant-review.test.ts" shows carries string literals and no
      call. This matters because the contract is idempotent over its own
      output, so a self-seeded "before" would be green for any recipe whatever
      (finding PR3-005).
    contradicts-plan: false
  - finding: >-
      Step 1(c), recorded as asked: the real statement's merchant count is NOT
      the number any criterion asserts. Every acceptance criterion in this phase
      runs on synthetic fixtures with invented values, and no assertion anywhere
      in the suite depends on a measurement of the real file.
    contradicts-plan: false
deviations:
  - plan-clause: >-
      Step 1(a): the deployed MerchantRule count is measured "over a connection
      string pinned explicitly to the pulse deployed project's session pooler
      (never the ambient DATABASE_URL, fleet warnings 1 and 5)".
    why: >-
      No pulse database password exists in this container or in the repository.
      The fleet's own infrastructure note records that it holds no secrets, and
      the only ambient DATABASE_URL belongs to a different project, which fleet
      warning 1 forbids using. The count was taken instead through the Supabase
      management API pinned to the pulse project by its ref
      (ygsarzjqosqmkqibqogk), which is the route every previous deployed-schema
      step in this delivery used, and the statement was a read-only count. Same
      measurement, same project, different transport. Declared the moment it was
      found, before any code was written.
  - plan-clause: >-
      files-to-touch, which does not list src/app/globals.css.
    why: >-
      Criterion 6.7 requires 390x844 to hold on the month view and the merchant
      review. Both screens already overflowed before this phase and neither
      overflow can be fixed from a file on the list: the merchant review reached
      a scrollWidth of 462 because the naming form has an intrinsic width inside
      a non-wrapping row, and the month view reached 424 because .month-grid's
      second track was the fixed --layout-rail width and could not shrink. Both
      are pre-existing: nothing in this phase widened either, and the
      phone-viewport spec M3-P1 added visits an empty-state household where the
      month grid is not in the document at all. Both fixes are wrapping-only and
      use existing tokens. RESOLVED RATHER THAN LEFT STANDING: this record
      asked for a base-branch amendment, and the orchestrator landed one at
      29c4745, so src/app/globals.css sits on the plan's extras from the merge
      base 77da0c6 onward and is no longer an excess. The deviation is kept
      here because the file was edited before the amendment existed.
  - plan-clause: >-
      files-to-touch, which lists no test/application path, while criterion 6.5
      asks for "an import test re-importing the card fixture".
    why: >-
      That test lives in test/domain/merchant-review.test.ts, which IS on the
      list, and imports the existing in-memory port fakes from
      test/application/fake-import-world.ts without modifying them. The file
      name says "domain" while three of its describe blocks drive the real
      import path; the alternative was a new file outside the declaration.
  - plan-clause: >-
      Criterion 6.3's e2e half, "the merchant review and month view specs
      asserting the same two sweeps over rendered group labels", and criterion
      6.7's phone spec covering both screens.
    why: >-
      Both live in ONE spec inside test/e2e/merchants.spec.ts, which navigates
      to /merchants and then to /?month=2026-08 and runs the identical sweep
      helper over the rendered group labels of each. test/e2e/month-view.spec.ts
      is not in files-to-touch, so a second spec file there would have been an
      excess on top of the stylesheet one. The sweep helper is defined once and
      applied to both surfaces, which is what "the same two sweeps" asks for.
  - plan-clause: >-
      files-to-touch plus the plan's extras at 77da0c6, which do not list
      src/modules/overview/adapters/overview-repository.ts.
    why: >-
      Findings HZ-M3P6-05 and CR-M3P6-02, which both reviewers reached
      independently, are that the merchant-source rule has a third
      implementation written twice in raw SQL in that file, that criterion
      6.10's pin is structurally blind to it, and that it is the copy the month
      view's grouping actually reads. Neither reviewer's remedy can be applied
      from a declared file: hoisting the two occurrences into one fragment is an
      edit to that file. The change is contained, the two SQL reads are
      unchanged in meaning, and a new test reads the file and pins the SQL form.
      Declared in the commit that makes it; the phase wants the amendment.
