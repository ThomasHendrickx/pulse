claims:
  - id: M3P6-C1
    kind: coverage
    statement: >-
      Criterion 6.10 holds at the head in all three of its halves: the literal
      operand-bearing pattern matches exactly three files, the two frozen
      sibling recipes import no path of the shared helper's module, and the
      shared helper's import specifier appears in exactly the two former call
      sites.
    settled-by:
      executed-construction:
        command: >-
          grep -rlE 'counterpartyName \?\? [A-Za-z_]*\.?description' src/ ;
          grep -nE 'normalise-counterparty|merchants/application|merchants/domain'
          src/modules/import/domain/dedup.ts src/modules/ledger/domain/corrections.ts ;
          grep -rlE '^\s*(import \{[^}]*\bcounterpartyText\b|  counterpartyText,)' src/
        exit-code: 0
        output: |
          src/modules/import/domain/dedup.ts
          src/modules/ledger/domain/corrections.ts
          src/modules/merchants/domain/normalise-counterparty.ts
          count=3

          (negative half) exit=1

          src/modules/ledger/application/interpret-window.ts
          src/modules/merchants/domain/merchant-review.ts

          (the bare-literal pattern, for reference) 5 files, down from 6
  - id: M3P6-C2
