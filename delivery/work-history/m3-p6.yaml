          row), then runs git grep -F over the whole worktree and over the
          changed files, and finally searches the same probes in memory over
          every changed file and over git log -p 68fc7ee..HEAD
        exit-code: 0
        output: |
          tight probe categories: iban=18 ref=17 filename=5 card=12 holder=3
                                  merchant=11 total: 66
          HALF (a) whole-worktree hits: 0
          HALF (b) changed-file hits: 0
          TIGHT_EXIT=0

          A deliberately over-inclusive BROAD run (132 probes: every token of
          five or more letters on a card row, every thousands-form amount,
          every date) reported 6 whole-worktree and 2 changed-file hits, and
          every one of those 8 is a probe that ALSO matches at the phase base
