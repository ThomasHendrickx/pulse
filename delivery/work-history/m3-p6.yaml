prompt: |
  You are the implementer for phase M3-P6 (card-descriptor merchant grouping
  plus display-only card-number masking) of the Pulse v0.2 delivery, severity
  high. Your brief is /home/user/pulse-fleet/implementer-brief-m3-p6.md: read
  it fully first, including the appended fleet warnings. Warning 9 is
  absolute: the two real statement PDFs live at
  /root/.claude/uploads/e8dfc624-eaf2-5480-bcf2-af6a168fb888/ and are
  referenced by 8-hex prefix ONLY (39bada64 Belfius current account, 0f79fa3d
  KBC card); never write their file names anywhere; their content never
  leaves the container; committed fixtures are synthetic with invented
  values. Warning 10: check df before e2e work.

  Your working tree is the fresh clone
  /home/user/pulse-fleet/worktrees/m3-p6-card-merchant-grouping on branch
  claude/m3-p6-card-merchant-grouping (based on main 68fc7ee). The plan is
  delivery/plan/pulse-v02.yaml, phase M3-P6. Read pulse-domain (merchant
  resolution, facts vs interpretation vs declarations), pulse-typescript, and
  pulse-frontend before code.

  WHY THIS PHASE EXISTS: the owner tested the deployed Belfius PDF import.
  The parse was correct, but merchant grouping is dead for card payments: the
  merchant key falls back to the entire descriptor, which embeds each
  transaction's own date and amount plus a card-number tail and holder name,
  so 15 card rows in one real statement produce 15 distinct keys where a
  handful of real merchants exist. Naming a merchant writes an EXACT rule
  that can never match a second transaction. Separately, the unmasked card
  number is rendered on screen.

  This phase's plan is unusually load-bearing because four adversarial review
  rounds hardened it: the criteria contain executed counts, an explicitly
  named exception, and pins whose patterns were run against the tree. Walk
  every step and criterion exactly as written, including the
  verification-first step's measurement clauses. Specific traps the reviews
  bought, do not undo them: the card-number sweep is separator-insensitive
  13-to-19 digits because the real number is printed space-grouped; five
  NON-card rows carry legitimate 13-to-19-digit structured references that
  must survive the strip, and criterion 6.1's reference row plus 6.3(b)'s
  single named exception exist to prove exactly that, so never key the strip
  on digit-run length alone; the partially-masked tail must be anchored to
  the card-number-label grammar, not to an X token or holder text alone (the
  label occurs in 15 of 15 card descriptors and 0 of the 11 X-token
  descriptors, while holder-like text follows in 8 of those 11); criterion
  6.10's grep pin is literal and executed (the operand-bearing pattern
  returns 4 today and must return 3 after unification, with the two frozen
  recipes in dedup.ts and corrections.ts keeping their own copies by design);
  masking is DISPLAY-only and must never touch rawLine, rawContent, any dedup
  key, or the subject the review form submits when writing a rule.

  Standing rules: red witness before green for every behavior; before EVERY
  push, and again after the final gate build, diff your branch against
  files-to-touch plus extras on main and declare any excess in the same
  commit (tool-rewritten files included); phone viewport 390x844 holds on
  touched UI; all five env values pinned local for db and e2e work; Node 26
  via nvm for tiphys; npm only; integer cents; facts immutable; no em dashes;
  small commits pushed incrementally; if killed and resumed, reread your
  commits and continue.

  Before reporting: npm run typecheck, npm run lint, npm run gate:tokens, npm
  test, npm run test:e2e all exit 0 at the final head;
  delivery/work-history/m3-p6.yaml schema-valid (context containing
  delivery/plan/pulse-v02.yaml) plus notes; privacy gates both halves plus an
  independent in-memory scrub; final push confirmed with git ls-remote
  output. Report: per-criterion status with executed evidence, the
  real-statement measurements stated abstractly (counts only), deviations
  declared the moment found, open questions, head sha.
