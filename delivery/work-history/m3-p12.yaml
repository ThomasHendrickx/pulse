key-decisions:
  - decision: >-
      The uncommitted test/e2e/merchants.spec.ts change is FINISHED WORK and
      is committed as part of the phase rather than discarded as a fragment.
    why: >-
      Criterion 12.18 requires an e2e test asserting that a pre-migration
      un-namespaced subject surfaces the refusal to the reader, and without
      this file that half of the criterion has no witness anywhere.
      CORRECTED IN THE FIX ROUND, finding HZ-M3P12-08: the commit message for
      this file said it asserts "that nothing was written", and it did not.
      Zero merchant groups and an unchanged unresolved count cannot
      distinguish a refusal from a rule that WAS written and matches nothing,
      which is precisely the outcome the criterion exists to prevent. The
      spec now reloads the page and asserts the group's hidden subject is
      still a namespaced identity key, which is the page state a refusal
      leaves and a written rule does not; the stronger form, counting the
      repository calls, is carried by
      test/application/counterparty-identity-surfaces.test.ts, and each test
      now says in its own comment which half it carries. Every
      selector it uses exists in the shipped component (the unresolved-group
      and merchant-group test ids and the hidden counterpartyText field in
      src/modules/merchants/ui/merchant-review.tsx, the naming-refused test id
      on its refusal line) and the message key it types into is in all three
      catalogues. It runs green inside the full suite. A finished test that
      the phase's own criterion names is not a fragment.
  - decision: >-
      The tracked node_modules SYMLINK that commit 62612ad swept into the
      index is removed with git rm --cached, and .gitignore's rule is widened
      from `node_modules/` to `node_modules`.
    why: >-
      A trailing slash matches directories only. In a fleet worktree
      node_modules is a SYMLINK, which git sees as a file, so the ignore rule
      did not cover it and an `add -A` tracked it. What was committed is a
      120000-mode blob whose whole content is an absolute container path in
      another worktree. It is wrong three ways: it publishes a machine-local
      path from this container into a PUBLIC repository, it makes any clone
      resolve its dependencies to a path that does not exist, and it is not in
      this phase's files-to-touch. Dropping the trailing slash closes the
      recurrence for every worktree rather than only for this one.
  - decision: >-
      The account basis is verified as costing the owner nothing by reading it
      off the COMMITTED harness rather than by writing a separate predicate
      script.
    why: >-
      The harness reports rows-with-account and identity-rows-account-basis
      separately. On the real current-account document both read 11, which is
      the whole of criterion 12.16's real-month claim in one number: every
      stored account took the account basis, so every one passed all three
      trust tests, and identity-account-keys reads 6. A separate script
      measuring the predicate directly would be a second implementation of a
      number the committed one already prints, which is the reproducibility
      failure plan step 1 exists to end.
  - decision: >-
      FIX ROUND. A one-row promotion still PROMOTES; it gets its own outcome
      token and its own list rather than a two-row minimum-evidence floor.
    why: >-
      Finding HZ-M3P12-06 offered either. A two-row floor would decline to
      promote the owner's OWN deployed naming, which is a single EXACT rule
      written from one row and is the exact declaration criterion 12.7 is
      built around, so the floor would refuse the one real case this phase
      exists to carry and cost the owner a re-naming to buy back a visibility
      the token buys for nothing. What was actually wrong was invisibility:
      the same-account test is vacuous over one row and a one-row promotion
      reports matchedBefore equal to matchedAfter, so it landed in no
      broadened list and no report line distinguished it. It now carries
      promoted-on-one-row and appears in its own list, so the conversion of a
      parked READ question, which account the first-wins scrape chose, into a
      permanent WRITE is a number the owner reads rather than an inference.
  - decision: >-
      FIX ROUND. The truncation residual is CORRECTED IN PROSE AND PINNED BY A
      COUNTEREXAMPLE, not closed in the importer.
    why: >-
      Finding HZ-M3P12-05 is right and reproduced here: two invented sources
      differing only in a fifth four-digit group scrape to one identical
      sixteen-character value that passes all three trust tests, so the
      determinism claim in the source, in the plan and in a test NAME was
      false. Closing it means refusing a scrape match whose next characters
      continue the bank's group grammar, which is a change to the importer's
      template and therefore a layout version bump and a re-parse of every
      stored source. That is not a fix-round change and doing it here would
      be a facts-layer migration smuggled into a defect round. The claim now
      says what is true, names what it does not close, and a test carries the
      counterexample so the next reader meets the fact instead of the
      sentence.
  - decision: >-
      FIX ROUND. The adapter's write path is covered in the PLAYWRIGHT gate,
      not in npm test.
    why: >-
      Finding CR-M3P12-02 is right that updateRulePattern was exercised by
      nothing and that it is the routine's only production write path. Its
      premise is not: this tree has NO live-Postgres lane in the fast gate.
      test/schema/rls.test.ts and test/schema/tenancy.test.ts are static
      analysis over the schema, the migration SQL and the source text, and
      test/db/db-guard.test.ts tests a pure function and a CLI that refuses
      to run; not one opens a connection, verified by grepping the whole test
      tree for a client construction. Putting a connecting test in npm test
      would change what the fast gate requires of every contributor and every
      CI runner, which is a bigger decision than a fix round should take. The
      Playwright gate already boots the local stack with migrations applied
      and must pass before this slice closes, so the test lives there and
      says in its own header why.
  - decision: >-
      FIX ROUND. The bare-namespace refusal is STRICT in the matcher and
      TRIMMING at the write boundary.
    why: >-
      The first draft treated a whitespace-only remainder as bare everywhere,
      and the property test for criterion 12.21 refuted it in 218 cases: the
      PREFIX pattern "descriptor: " matched exactly what " " matched before
      the namespaces existed, so refusing it in the matcher would have broken
      pass one's meaning-preservation for a rule that is not a sweep at all.
      Only the exactly bare namespace is a prefix of every key of its basis,
      and only the exactly bare namespace is what the derivation can emit,
      since the normaliser trims and collapses and compactAccount removes
      whitespace. A subject arriving from a FORM is not a derived key, so the
      boundary trims. The split is stated at both sites rather than left as a
      subtlety.
