    kind: coverage
    statement: >-
      The convergence criteria in test/domain/counterparty-identity.test.ts
      redden against the tree's pre-change behaviour and go green against the
      committed derivation, so they discriminate rather than hold either way.
    settled-by:
      executed-construction:
        command: >-
          the account branch of counterpartyIdentity disabled, then npx vitest
          run test/domain/counterparty-identity.test.ts; then the file
          restored from its committed copy and the same command re-run
        exit-code: 1
        output: |
          RED RUN, verbatim failures:
            expected 24 to be 12                        (criterion 12.1)
            expected 0 to be greater than or equal to 8 (12.1 composition)
            row 6: the partition against the generator's record  (12.4)
            expected 'descriptor' to be 'account'       (12.16 control)
            the 12.16 first-wins pin
