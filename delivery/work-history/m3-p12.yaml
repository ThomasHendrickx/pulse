kind: work-history
phase: M3-P12
prompt: |
  You are the implementer finishing phase M3-P12 of the pulse project. A
  previous implementer built it and was interrupted mid-flight by a
  session-level stop, not for cause. Its work is intact and pushed. YOUR JOB
  IS TO VERIFY AND CLOSE IT OUT, NOT TO REBUILD IT.

  WORKTREE: /home/user/wt-m3p12, branch claude/m3-p12-counterparty-identity,
  five commits ahead of origin/main, head d62b63d, pushed. node_modules is
  symlinked; do not npm install. `npx prisma generate` if typecheck
  complains. Node: `export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh` in every
  shell running npx/npm. npm only. Use `git -C /home/user/wt-m3p12` for every
  git command.

  ORIENT FIRST, against the tree rather than against any account of it:
    git -C /home/user/wt-m3p12 log --oneline -6
    git -C /home/user/wt-m3p12 status --porcelain
    git -C /home/user/wt-m3p12 diff --stat origin/main HEAD
  What you should find: five commits carrying the identity derivation wired
  into merchants, ledger and overview; the re-derivation routine with its
  invocation point; the rule-kind settlement and the pulse-domain skill
  amendment; a fixture with its input record and a red journey witness;
  test/fixtures/measure-identity-convergence.ts;
  test/property/pass-one-preserves-meaning.test.ts; and ONE uncommitted file,
  test/e2e/merchants.spec.ts, about 71 lines of change. Read that uncommitted
  diff and decide whether it is finished work that belongs in the phase or a
  fragment; say which in your report.

  READ, in order: /home/user/pulse-fleet/roles/_shared-dispatch-contract.md;
  /home/user/pulse-fleet/warnings.md, all thirteen; delivery/plan/pulse-v02.yaml
  phase M3-P12, its twenty-two acceptance criteria and twenty-nine hazard
  classes; CLAUDE.md and its three skills, pulse-domain in full; and
  /home/user/pulse-fleet/decisions/DR-0027.yaml and DR-0028.yaml.

  WHAT THE PHASE IS FOR. The owner asked what a merchant naming matches on,
  having seen two rows from the same counterparty account listed as two
  separate unnamed counterparties. Measured on their real month: 6
  counterparty accounts, 4 of which appear more than once covering 9
  transactions, and in all four every description differs, so a naming
  matches one row and never the next. This phase makes identity the
  counterparty's account where the row carries a trustworthy one, and the
  descriptor grammar where it does not.

  WHAT IS OWED, and it is verification, not construction:

  1. THE FULL GATE, run and pasted with real output, never summarised:
     export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh
     cd /home/user/wt-m3p12
     npm run typecheck && npm run lint && npm test && npm run gate:privacy && npm run gate:tokens
     npm run test:e2e
     The e2e stack needs `sudo dockerd` then about thirty seconds. That suite
     takes roughly fourteen minutes here, so a long run is not a hang. If
     `npx supabase start` fails on an rlimit error naming the database, the
     real cause is the edge-runtime container: set enabled = false under
     [edge_runtime] in supabase/config.toml, start, then REVERT that tracked
     file and verify with git diff. Nothing else is running, so ports are
     free.

  2. THE CONVERGENCE NUMBERS the criteria pin, measured and pasted: exactly
     20 distinct keys on the owner's month with account exactly 6 and
     descriptor exactly 14; exactly 16 on the card document; exactly 24
     baseline keys on the fixture, one per row. A count BELOW 20 is
     over-collapse and stops the phase rather than passing it.

  3. THE RED WITNESS. Criterion 12.4's expected row-by-row mapping must be
     emitted by the fixture generator FROM ITS OWN INPUT in the same run that
     writes the PDF, with a byte-for-byte regeneration check; a mapping
     transcribed from the derivation's output certifies itself and does not
     meet the criterion. Verify that is what the committed generator does.
     And take the convergence test red against the tree before the change and
     green after, capturing both. If the previous implementer captured them,
     reproduce rather than quote.

  4. THE TRUST GATE. Verify it refuses what it must: an account failing the
     country-length table, one failing mod-97, an unknown country code, and
     an empty value all take the descriptor basis rather than an account key.
     And verify it costs the owner nothing: all 11 of their stored accounts
     should pass all three tests, giving 6 distinct trusted accounts.

  5. delivery/work-history/m3-p12.yaml with a populated deviations list,
     validated with /home/user/pulse-fleet/node_modules/.bin/tiphys validate
     --type work-history --context /home/user/pulse-fleet.

  Then delete BRIEF.md if present, commit, and push to
  claude/m3-p12-counterparty-identity with 2s/4s/8s/16s backoff on network
  errors.

  IF SOMETHING IS WRONG, FIX IT, but say clearly in your report what you
  changed and why. You are inheriting work you did not write: read it
  critically. If a criterion the previous implementer marked met is not met,
  say so plainly rather than inheriting the claim.

  The repository is PUBLIC and stays public. Counts only in the work history,
  in commit messages and in your report: never descriptor content, a
  counterparty name, an account number, an amount or a date. Two real
  merchant descriptors have already reached this repository and no gate
  caught either; both were found by review.

  REPORT BACK: criterion by criterion, met or not, with the command and its
  real output; the convergence numbers; the red and green runs; what the
  trust gate refuses and what it costs; what you did with the uncommitted
  spec file; anything you changed in the inherited work and why; and anything
  you could not complete. Do not claim a command passed that you did not run.
