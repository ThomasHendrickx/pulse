fix-round:
  - mechanism: >-
      DERIVING A GROUPING KEY FROM A ROW'S STORED FIELDS, and specifically its
      FLOOR: what the derivation does when the fields it reads carry nothing.
      The M3-P12 fix round's first high finding, HZ-M3P12-01, is that this
      phase introduced a namespaced key and thereby turned the empty case from
      a value every consumer refused into a value every consumer accepted. The
      mechanism's rule, already written at the derivation's own definition, is
      that a key derived from an unvalidated value must FAIL CLOSED to the
      longer, more specific key rather than open to the shorter one; a bare
      namespace is the shortest possible key and there is nothing to derive a
      longer one from, so the floor is a REFUSAL and it must hold at every
      consumer rather than at the one that happened to be looked at.
    derivation:
      command: >-
        grep -rn "isBareIdentityKey\|identityRemainder" src/ --include=*.ts
        --include=*.tsx
      output: |
        src/modules/merchants/application/assign-merchant.ts:18:  identityRemainder,
        src/modules/merchants/application/assign-merchant.ts:109:  if ((identityRemainder(pattern) ?? "x").trim() === "") {
        src/modules/merchants/application/index.ts:71:  isBareIdentityKey,
        src/modules/merchants/domain/merchant-review.ts:12:  isBareIdentityKey,
        src/modules/merchants/domain/merchant-review.ts:130:        ? isBareIdentityKey(identity.key)
        src/modules/merchants/domain/merchant-rule.ts:40:  isBareIdentityKey,
        src/modules/merchants/domain/merchant-rule.ts:98:  if (normalised === "" || isBareIdentityKey(normalised)) {
        src/modules/merchants/domain/merchant-rule.ts:112:    (rule) => rule.pattern !== "" && !isBareIdentityKey(rule.pattern),
        src/modules/merchants/domain/counterparty-identity.ts:90:export const identityRemainder = (key: string): string | undefined => {
        src/modules/merchants/domain/counterparty-identity.ts:118:export const isBareIdentityKey = (key: string): boolean =>
        src/modules/merchants/domain/counterparty-identity.ts:119:  identityRemainder(key) === "";
        src/modules/merchants/domain/counterparty-identity.ts:311:  // through isBareIdentityKey above (finding HZ-M3P12-01).
        FOUR CONSUMERS, and the fix reaches all four rather than the one the
        finding named. The definition (counterparty-identity.ts) states the
        floor and exports the predicate. The MATCHER refuses a bare key and,
        separately, a bare PATTERN, which is the half that reaches an ordinary
        row: a bare PREFIX is a prefix of every key of its basis. The WRITE
        BOUNDARY refuses a bare subject on both bases, which closes the only
        door in the product that can create such a rule. The REVIEW SURFACE
        withholds the naming form from a bare-namespace group, so the reader
        is not offered a naming that would be refused.
    not-covered: >-
      THE IMPORTER IS NOT CHANGED, and that is where the bare key comes from.
      src/modules/import/domain/parse-statement.ts sets description from the
      cell with no emptiness guard, while every optional text role beside it
      IS guarded, so a delimited file with a blank description cell still
      produces a row whose identity is the bare namespace. Guarding it there
      would change what the importer ACCEPTS, which is a facts-layer decision
      with a re-parse behind it and no criterion in this phase covering it.
      What this round changes is that such a row can no longer be named,
      matched or merged; it still exists and still shows. Also not covered:
      the matcher's strictness and the writer's trimming differ by design, so
      a hand-written pattern whose remainder is whitespace only is refused at
      the boundary and preserved by the matcher; the property test for
      criterion 12.21 is what forced that split and it is asserted, not
      assumed. And the truncation residual named in HZ-M3P12-05 is corrected
      in prose and pinned by a counterexample test, NOT closed: closing it
      means changing the importer's account scrape, which is a layout version
      bump and a re-parse of every stored source. AND THE ONE-ROW PROMOTION,
      added in fix round two under finding CR2-M3P12-06 because it belonged in
      this list and was not in it: a promotion whose whole evidence is a
      single transaction is still a promotion, the account it keys on is
      whichever candidate the importer's first-wins scrape stored for that one
      row, hazard H12.16 records that choice as unanswered and measures it at
      4 of the owner's 39 rows, and this phase makes it VISIBLE with its own
      outcome token, its own list and an explanatory line on the operator's
      console rather than closing it. Sized against the owner's own table it
      is 1 of 1: the deployed declaration is a single EXACT rule written from
      one row.
  - mechanism: >-
      DECIDING A MIGRATION AGAINST A MODEL OF THE TABLE, and specifically what
      the model must carry. The first fix round moved every decision onto an
      in-memory working copy so the routine could block before it writes. The
      second round's high finding, raised independently by both clean-room
      lanes, is that the working copy modelled rule identity, kind and pattern
      and NOT the one constraint the real table enforces over exactly those
      three fields, @@unique([householdId, kind, pattern]). A model weaker than
      its subject reports safe by construction: the routine reached the end of
      its decision phase clean, reported exit 0, and then threw inside the
      write it had promised was safe. The mechanism's rule is that a decide
      phase is only as good as the constraints its model carries, and that
      where the model cannot carry them the APPLY must be atomic so a
      rejection cannot land after a commit. Both halves are built here.
    derivation:
      command: >-
        grep -rn "applyRuleWrites\|assessRederiveTarget\|resolveDbEnv" src/
        scripts/ --include=*.ts
      output: |
        src/modules/merchants/application/index.ts:91:  applyRuleWrites: repository.applyRuleWrites,
        src/modules/merchants/application/rederive-rules.ts:223:    | "applyRuleWrites"
        src/modules/merchants/application/rederive-rules.ts:618:    await deps.merchants.applyRuleWrites(context, {
