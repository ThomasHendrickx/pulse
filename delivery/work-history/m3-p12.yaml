      branches are driven from the fast gate.
    why: >-
      HAZARD finding CR7-M3P12-02, low, closed because the principle behind it
      is one this phase has now paid for twice. The harness decides four ways
      and only the crash branch was exercised, by the SELF entry added when
      that branch was written; the unattributed branch had nothing. A branch
      nothing exercises is how the defect that branch replaced arrived. The
      decision is extracted to test/property/mutant-scoring.ts, which is pure
      and importable, and five cases drive green, caught with one property,
      caught with both, died and unattributed against canned runner output,
      plus the case where a property is named only in a PASSING line. The SELF
      entry stays, because a canned report cannot show that a REAL crash
      produces no assertion; the two checks are complementary.

