  - plan-clause: >-
      Criterion 12.23's consequence: the routine cannot be rehearsed against
      any database an operator can create.
    why: >-
      RECORDED AS A DEVIATION RATHER THAN ENGINEERED AROUND, on the
      orchestrator's instruction and the criteria lane's reasoning: the
      alternatives are an override flag criterion 12.23 forbids, or an
      under-specified carve-out for local hosts. The interlock refuses a
      connection carrying no project ref in either field, and a local
      connection carries one in neither, so the first execution of the write
      path through this command is necessarily the deploy-time run. What
      changed in fix round three is WHERE that is said: it was in this
      document only, and it is now the last paragraph of the command's own
      header, where the person who runs it at deploy time will meet it
      (finding CR3-M3P12-05). The rehearsal lives in the application-level
      tests and in the Playwright spec that drives the adapter against a real
      database, which fix round three repointed onto the member the routine
      actually uses.
  - plan-clause: >-
      files-to-touch, which does not name src/modules/overview/.
    why: >-
      Finding CR3-M3P12-06, the fifth consumer. The overview fold is a place
      that takes a counterparty identity and applied no floor to it, so two
      rows carrying no counterparty information at all merged into one
      month-view group with an empty label. The plan's own hazard H12.15
      describes that outcome, and fix round two repaired the sibling screen
      and not this one, which is the definition of a rule applied in one place
      and not another. The change is the minimum that closes it: the fold
      marks the group, the screen renders the sentence that already existed in
      all three languages, and the predicate is injected the way the identity
      already was, so the overview module still imports nothing from
      merchants. The group's money stays in the month.
  - plan-clause: >-
      files-to-touch, which does not name playwright.config.ts,
      src/platform/db/gate-target.ts or src/platform/db/guard.ts.
    why: >-
      REQUIRED BY THE FIX AND NAMED RATHER THAN SLIPPED IN. Finding
      Criteria finding CR4-M3P12-02 is about a writing surface this phase itself
      only place early enough to refuse an unnamed target is the gate's own
      configuration: a per-test guard runs after both web servers have already
      started against whatever the container held. src/platform/db/ is in
      files-to-touch as amended, so the two files there are inside the phase's
      set; playwright.config.ts is not, and it is also a file M3-P9 edits, so
      the plan's conflicts-with entry for M3-P9 is updated in the same change
      to say so rather than leaving the overlap to be discovered on rebase.
  - plan-clause: >-
      Criterion 12.23, which requires the interlock to resolve the environment
      "the way the command it guards resolves it" and describes that reading
      as ".env only for a variable the shell does not carry OR carries empty".
    why: >-
      THE CRITERION'S DESCRIPTION OF THE PRISMA CLI IS FALSE and the code no
      longer repeats it. Witnessed twice against CLI 6.19.3, and now executed
      by the fast gate: an ABSENT variable falls back to .env, a shell-EMPTY
      one does not and the CLI aborts on it. The guard's reading diverges from
      the CLI on exactly that case, deliberately, and the divergence leaves
      the guard STRICTER than the command in both directions, which is the
      only direction a fail-closed interlock may err in. The implementation is
      unchanged; what changed is that the comment states what is true and a
      test pins it. Amending the criterion's wording is the orchestrator's.
  - plan-clause: >-
      CRITERIA finding CR5-M3P12-11, which asks that a pass-two promotion
      adding no rule get its own outcome token.
    why: >-
      BUILT, WITNESSED TO CONFLICT WITH CRITERION 12.8, AND REVERTED. The
      finding states that "criterion 12.8's byte-for-byte report comparison is
      unaffected, since the token is stable across runs". It is not, and the
      reason is structural rather than an implementation detail: run one
      INSERTS the account rule, run two finds that same rule already held by
      the same merchant, so a token separating the two cases differs between
      the two runs by construction. With the token added, four tests failed,
      all of them idempotence tests, including criterion 12.8's own "a second
      run prints the same decision report byte for byte" and the second-run
      halves of the round-two and round-three regressions. Criterion 12.8's
      content is that idempotence means the same ANSWER, and the distinction
      the finding wants is exactly the distinction that criterion forbids.
      WHAT WAS KEPT is the honest half: the token's own definition now says
      what "promoted" means, that it is a statement about the state after the
      run and not about whether a row was inserted, that the two cases cannot
      be separated here without breaking 12.8, and that rules-added is where a
      run says how many rules it actually wrote.
  - plan-clause: >-
      CRITERIA finding CR5-M3P12-05 and the dispatch that accepted it, both of
      which describe the development-server refusal as gated on isProduction()
      being false.
    why: >-
      SUPERSEDED IN FIX ROUND TEN AND CORRECTED HERE IN FIX ROUND TWELVE
      (HAZARD finding HZ11-M3P12-04). THE WIDER PREDICATE IS WHAT SHIPPED.
      assessNonProductionDbTarget admits production and refuses every other
      context that names a non-local host, so this entry, which was the last
      recorded word on the predicate, argued for a shape the code no longer
      has, persuasively enough that a reader could have narrowed the guard
      back.

      WHAT THIS ENTRY SAID, quoted rather than deleted (clause R-087): "The
      refusal is gated on NODE_ENV being exactly development. The wider
      predicate is not implementable without two carve-outs that amount to the
      same thing: vitest sets NODE_ENV=test and the fast gate imports this
      module transitively, so not production made npm test refuse to run in any
      container whose ambient DATABASE_URL is remote ... and a tsx entry point
      carries no NODE_ENV at all, including the re-derivation command, whose
      entire purpose is to open a DEPLOYED database."

      WHY THAT ARGUMENT NO LONGER HOLDS, and it is because both costs were
      REMOVED rather than traded away. The first cost rested on the fast gate
      importing this module and thereby constructing a client. Construction is
      now LAZY, so the fast gate imports the adapters, issues no query, and
      constructs nothing: measured on this branch, npm test prints the client's
      own startup line ZERO times and passes with an ambient DATABASE_URL that
      parses to a non-local host. The second cost rested on the re-derivation
      command having no way to say which deployed database it had proved. It
      now records the connection it verified in src/platform/db/runtime-target.ts,
      and the predicate admits that exact connection and no other.

      WHAT REMAINS TRUE FROM THE ORIGINAL ENTRY: the deviation itself. The plan
      clause describes the refusal as gated on isProduction() being false, and
      what shipped is gated on NODE_ENV being exactly "production", which is
      the same intent expressed against the variable the guard can actually
      read.

