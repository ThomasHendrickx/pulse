      where a defect found in inherited work belongs.
  - finding: >-
      (h) THE BRANCH IS ONE COMMIT BEHIND origin/main AND THE DIFFERENCE IS A
      PRIVACY REDACTION. git log HEAD..origin/main returns exactly 75ec85d,
      "intake: replace a real statement figure with placeholders". git diff
      origin/main HEAD therefore SHOWS
      delivery/intake/pulse-v0.2-pdf-addendum.md as changed, which reads at
      first glance as this branch un-redacting the owner's intake document. It
