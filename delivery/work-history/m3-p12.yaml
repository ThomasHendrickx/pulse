      (m) FIX ROUND TWO, THE TRUNCATION RESIDUAL SIZED ON THE OWNER'S OWN
      ROWS, which finding HZ-M3P12-R2-06 asked for and which turns out to
      bound it to nothing. The population the residual can reach is rows whose
      scrape match is FOLLOWED by a further four-digit group, since that is
      the only shape whose Belgian-prefixed truncation the length test cannot
