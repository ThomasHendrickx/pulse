  - finding: >-
      (j) THE RESIDUE, criterion 12.20, counts only. Real current-account
      document: baseline 21 keys shared with no other row covering 21 rows,
      after the change 12 keys covering 12 rows. Real card document: baseline
      12 covering 12 rows, after the change 12 covering 12 rows, unchanged
      because that document carries no counterparty account at all. New
      fixture: baseline 24 covering 24 rows, after the change 8 covering 8
      rows. A row in that set still needs naming per row, and the card
      document is in exactly the same position as the current account: this
      phase moves nothing there and does not pretend to.
      COMPLETED IN THE FIX ROUND, finding CR-M3P12-04: criterion 12.20 asks
      for the residue for each real document AND for the committed corpus,
      and the record above covered the two real documents and the one new
      fixture only. THE COMMITTED CORPUS, over all 37 parsable fixtures,
      summed from the same committed harness: baseline 176 keys shared with
      no other row covering 176 rows, after the change 160 keys covering 160
