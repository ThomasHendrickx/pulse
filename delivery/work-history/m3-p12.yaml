key-decisions:
  - decision: >-
      The uncommitted test/e2e/merchants.spec.ts change is FINISHED WORK and
      is committed as part of the phase rather than discarded as a fragment.
    why: >-
      Criterion 12.18 requires an e2e test asserting that a pre-migration
      un-namespaced subject surfaces the refusal to the reader, and without
      this file that half of the criterion has no witness anywhere.
      CORRECTED IN THE FIX ROUND, finding HZ-M3P12-08: the commit message for
      this file said it asserts "that nothing was written", and it did not.
      Zero merchant groups and an unchanged unresolved count cannot
      distinguish a refusal from a rule that WAS written and matches nothing,
      which is precisely the outcome the criterion exists to prevent. The
      spec now reloads the page and asserts the group's hidden subject is
      still a namespaced identity key, which is the page state a refusal
      leaves and a written rule does not; the stronger form, counting the
      repository calls, is carried by
      test/application/counterparty-identity-surfaces.test.ts, and each test
      now says in its own comment which half it carries. Every
      selector it uses exists in the shipped component (the unresolved-group
      and merchant-group test ids and the hidden counterpartyText field in
      src/modules/merchants/ui/merchant-review.tsx, the naming-refused test id
      on its refusal line) and the message key it types into is in all three
      catalogues. It runs green inside the full suite. A finished test that
      the phase's own criterion names is not a fragment.
  - decision: >-
      The tracked node_modules SYMLINK that commit 62612ad swept into the
      index is removed with git rm --cached, and .gitignore's rule is widened
      from `node_modules/` to `node_modules`.
    why: >-
      A trailing slash matches directories only. In a fleet worktree
      node_modules is a SYMLINK, which git sees as a file, so the ignore rule
      did not cover it and an `add -A` tracked it. What was committed is a
      120000-mode blob whose whole content is an absolute container path in
      another worktree. It is wrong three ways: it publishes a machine-local
      path from this container into a PUBLIC repository, it makes any clone
      resolve its dependencies to a path that does not exist, and it is not in
      this phase's files-to-touch. Dropping the trailing slash closes the
      recurrence for every worktree rather than only for this one.
  - decision: >-
      The account basis is verified as costing the owner nothing by reading it
      off the COMMITTED harness rather than by writing a separate predicate
      script.
    why: >-
      The harness reports rows-with-account and identity-rows-account-basis
      separately. On the real current-account document both read 11, which is
      the whole of criterion 12.16's real-month claim in one number: every
      stored account took the account basis, so every one passed all three
      trust tests, and identity-account-keys reads 6. A separate script
      measuring the predicate directly would be a second implementation of a
      number the committed one already prints, which is the reproducibility
      failure plan step 1 exists to end.
  - decision: >-
      FIX ROUND. A one-row promotion still PROMOTES; it gets its own outcome
      token and its own list rather than a two-row minimum-evidence floor.
    why: >-
      Finding HZ-M3P12-06 offered either. A two-row floor would decline to
      promote the owner's OWN deployed naming, which is a single EXACT rule
      written from one row and is the exact declaration criterion 12.7 is
      built around, so the floor would refuse the one real case this phase
      exists to carry and cost the owner a re-naming to buy back a visibility
      the token buys for nothing. What was actually wrong was invisibility:
      the same-account test is vacuous over one row and a one-row promotion
      reports matchedBefore equal to matchedAfter, so it landed in no
      broadened list and no report line distinguished it. It now carries
      promoted-on-one-row and appears in its own list, so the conversion of a
      parked READ question, which account the first-wins scrape chose, into a
      permanent WRITE is a number the owner reads rather than an inference.
  - decision: >-
      FIX ROUND. The truncation residual is CORRECTED IN PROSE AND PINNED BY A
      COUNTEREXAMPLE, not closed in the importer.
    why: >-
      Finding HZ-M3P12-05 is right and reproduced here: two invented sources
      differing only in a fifth four-digit group scrape to one identical
      sixteen-character value that passes all three trust tests, so the
      determinism claim in the source, in the plan and in a test NAME was
      false. Closing it means refusing a scrape match whose next characters
      continue the bank's group grammar, which is a change to the importer's
      template and therefore a layout version bump and a re-parse of every
      stored source. That is not a fix-round change and doing it here would
      be a facts-layer migration smuggled into a defect round. The claim now
      says what is true, names what it does not close, and a test carries the
      counterexample so the next reader meets the fact instead of the
      sentence.
  - decision: >-
      FIX ROUND. The adapter's write path is covered in the PLAYWRIGHT gate,
      not in npm test.
    why: >-
      Finding CR-M3P12-02 is right that updateRulePattern was exercised by
      nothing and that it is the routine's only production write path. Its
      premise is not: this tree has NO live-Postgres lane in the fast gate.
      test/schema/rls.test.ts and test/schema/tenancy.test.ts are static
      analysis over the schema, the migration SQL and the source text, and
      test/db/db-guard.test.ts tests a pure function and a CLI that refuses
      to run; not one opens a connection, verified by grepping the whole test
      tree for a client construction. Putting a connecting test in npm test
      would change what the fast gate requires of every contributor and every
      CI runner, which is a bigger decision than a fix round should take. The
      Playwright gate already boots the local stack with migrations applied
      and must pass before this slice closes, so the test lives there and
      says in its own header why.
  - decision: >-
      FIX ROUND. The bare-namespace refusal is STRICT in the matcher and
      TRIMMING at the write boundary.
    why: >-
      The first draft treated a whitespace-only remainder as bare everywhere,
      and the property test for criterion 12.21 refuted it in 218 cases: the
      PREFIX pattern "descriptor: " matched exactly what " " matched before
      the namespaces existed, so refusing it in the matcher would have broken
      pass one's meaning-preservation for a rule that is not a sweep at all.
      Only the exactly bare namespace is a prefix of every key of its basis,
      and only the exactly bare namespace is what the derivation can emit,
      since the normaliser trims and collapses and compactAccount removes
      whitespace. A subject arriving from a FORM is not a derived key, so the
      boundary trims. The split is stated at both sites rather than left as a
      subtlety.
  - decision: >-
      FIX ROUND TWO. A SAME-MERCHANT pattern collision is DECIDED in pass one
      with its own outcome token, and the source rule is left alone; it is not
      treated as a conflict and it does not block.
    why: >-
      Both clean-room lanes found the same defect independently: the collision
      test blocked only on a DIFFERENT merchant, so a same-merchant claimant
      fell through and queued an update onto a pattern another rule of the
      same kind already held, which the declaration table's unique key on
      (householdId, kind, pattern) refuses. The decide-then-apply shape the
      first fix round built then did not hold: the decision phase reported the
      run clean and the write phase threw. It is NOT a conflict, because there
      is no ambiguity to settle: the two rules already say the same thing
      about the same merchant, so the rewrite is redundant rather than
      contested, and blocking on it would stop a migration that has nothing
      wrong with it. Leaving the old rule un-namespaced loses nothing, and the
      superset test proves that rather than assuming it: every row the old
      rule reached under the old key is reached by the twin under the new one.
      Deleting it is forbidden by decision D-39.
  - decision: >-
      FIX ROUND TWO. The routine's whole write set goes through ONE port
      member the adapter runs in a database transaction, and the RECOMPUTE
      stays outside it.
    why: >-
      The apply block was separate awaits with nothing around them, so any
      failure partway through left the table half migrated with no report
      printed at all, while the command's own contract told the operator a
      non-zero exit meant nothing had happened. Modelling the unique key
      closes the one reachable collision; the transaction closes the class,
      including a check constraint, a lost connection or anything else the
      decide phase cannot model. The recompute is outside deliberately: it
      writes interpretation output rather than a declaration, it is
      idempotent, and holding a transaction open across it would put a long
      write lock on the transactions table for a guarantee the recompute
      already gives by being re-runnable.
  - decision: >-
      FIX ROUND TWO. The target interlock is a NEW module beside
      src/platform/db/guard.ts rather than a widening of it, and the
      environment resolution both share is EXTRACTED into one file.
    why: >-
      guard.ts answers whether a DESTRUCTIVE command is pointed at a LOCAL
      host, and a hostname is a complete answer to that. This asks whether a
      WRITING migration is pointed at the ONE database an operator named, and
      a hostname is not a complete answer to that, because the session pooler
      host is regional infrastructure shared by every project in the region.
      Folding the second question into the first would have given guard.ts two
      postures and one escape hatch that cleared both. The RESOLUTION is
      shared, because criterion 12.23 requires the interlock to resolve the
      way the command it guards resolves and calls an interlock that does not
      "decorative"; two copies that agree today is not that, so guard-cli.ts
      now imports the same function.
  - decision: >-
      FIX ROUND TWO. The interlock has NO override, and the account subject at
      the write boundary is REPAIRED while the descriptor subject is REFUSED.
    why: >-
      An override on the interlock would be a flag asserting the target is
      right, which is the assertion being checked; guard.ts has one because
      its default posture is local-only and a deliberate remote reset needs a
      door. On the write boundary the asymmetry is about what a canonical form
      IS: compactAccount is a total function with exactly one answer and it is
      the same function the derivation applies, so rebuilding the subject from
      it stores the key the derivation would derive. normaliseCounterparty is
      a lossy grammar rather than a canonicalisation, so re-running it over a
      subject that is already a key is not a repair and could change what the
      owner named; a descriptor subject that is not a fixed point of the
      normaliser did not come from a rendered group, so it is refused.
  - decision: >-
      FIX ROUND THREE. A pass-one claimant means the source rule is SUPERSEDED,
      whichever merchant the claimant carries. The different-merchant case is
      no longer a merchant conflict and no longer blocks.
    why: >-
      The claimant is always a rule that existed BEFORE the run and already
      carried the namespace, because the table's unique key forbids two rules
      of one kind sharing a bare pattern, so no rule pass one rewrote earlier
      in the same run can be holding this rule's target pattern. That makes
      the source rule DEAD rather than contested: the shipped matcher can
      never apply an un-namespaced pattern again, so the namespaced rule has
      been the live declaration since the code deployed, whatever merchant it
      points at, and the owner chose that merchant on the screen. Calling it a
      conflict blocked the entire migration, withheld every other rule's
      rewrite and every promotion, and reported a LOST assignment for a row
      that in production carries the owner's current merchant and never
      carried the old one. Decision D-39 forbids deleting the dead row, so the
      condition never cleared on its own and --accept became a thing an
      operator learns to type at a real signal.
  - decision: >-
      FIX ROUND THREE. The before-set is computed AFTER pass one and excludes
      superseded rule ids, and excludes nothing else.
    why: >-
      The residue is the half the skip left behind: a permanently dead
      un-namespaced pattern that keyForRule still routed to the baseline key,
      so the routine credited it with rows the deployed resolver never gave
      it. Excluding un-namespaced rules in general would have been wrong in
      the opposite direction: on a FIRST run every rule is un-namespaced and
      the before-set is the whole point of criterion 12.7. Only ids pass one
      has just declared superseded are dropped, which is why the computation
      moved after that pass rather than gaining a filter.
  - decision: >-
      FIX ROUND THREE. A recompute failure throws its own error type carrying
      the report and the fact that the writes committed, and the command exits
      4 for it rather than 1.
    why: >-
      The two failure surfaces leave the database in opposite states and the
      rejection handler could not tell them apart, so it printed, for both,
      that the table is as the run found it. After a recompute failure that is
      false in both halves, and the action a false "nothing happened" invites
      is rolling the code deploy back, which is the one action that turns
      every migrated pattern into a rule that matches nothing under the
      pre-deploy derivation. A distinct exit code and a distinct message are
      what let an operator act correctly; carrying the report on the error is
      what gives them the record of what was written, which the old shape
      printed only after a successful return.
  - decision: >-
      FIX ROUND THREE. The interlock refuses a `host` query parameter, refuses
      any parameter it does not understand, and compares the database name.
    why: >-
      A connection string is a document rather than two fields, and the
      connector resolves more of it than the authority: `?host=` names a unix
      socket directory and the client opens THAT, ignoring the hostname the
      interlock was comparing. A guard that reads a different field from the
      one the client connects through is the decorative guard criterion 12.23
      exists to prevent, one level down. The rule the fix applies is that the
      guard must refuse anything it cannot fully account for, which is why an
      unknown parameter refuses rather than being ignored, and why the
      database name is now a third comparison instead of an unread field.
  - decision: >-
      FIX ROUND THREE. The interlock resolves DATABASE_URL the way the CLIENT
      does, process.env only, and the shared resolver keeps the CLI reading
      for the guard that guards the CLI.
    why: >-
      Criterion 12.23 requires the interlock to resolve the connection the way
      the command it guards resolves it and calls an interlock that does not
      decorative. The command it guards is a tsx entry point whose connection
      is opened by new PrismaClient(), which reads process.env and nothing
      else: nothing in this tree loads dotenv. The extracted resolver
      implemented the PRISMA CLI's reading, which is right for guard-cli.ts
      and wrong here, so the interlock could approve a target read out of .env
      while the routine opened a different connection or none. Two readings,
      each named, each used where it belongs.
  - decision: >-
      FIX ROUND THREE. updateRulePattern is REMOVED from the port, the
      binding, the adapter and the fake rather than kept with a corrected
      comment, and the real-database spec is repointed at applyRuleWrites.
    why: >-
      The one thing fix round two bought is that a declaration rewrite is all
      or nothing. Leaving a second, untransactional write path on the
      published interface is how that guarantee gets lost, and its comment
      still pointed at the routine as the sanctioned caller, which is exactly
      what would make a future author believe that call site is the right one.
      The behaviour the fake needed for hand-migration in tests is kept as a
      fake-local helper rather than as a port member. The Playwright spec was
      covering the path the routine had abandoned; it now drives the one that
      is used and asserts the two things a fake cannot, that the household
      filter lives in the statement and that a rejection leaves nothing.
  - decision: >-
      FIX ROUND THREE. The overview fold marks a bare-namespace group rather
      than dropping it, and the month view renders the merchant review's copy.
    why: >-
      The floor is a refusal at the matcher and the write boundary, because
      resolving there merges money. On a display surface the same refusal
      would DELETE a group whose money must stay in the month, which is a
      worse answer than a blank label. So the fold keeps the group and marks
      it, and the screen says the same sentence its sibling says about the
      same rows. The predicate is injected the way the identity already is, so
      the overview module still imports nothing from merchants.
  - decision: >-
      FIX ROUND FOUR'S FINDING IDS ARE QUALIFIED BY LANE everywhere they are
      cited, in this document and in every source comment.
    why: >-
      The two round-four review lanes numbered their findings independently
      and collided on four ids: CR4-M3P12-01 is the resolve-env comment in the
      criteria lane and the before-set narrowing in the hazard lane, -02 is
      the unnamed database and the uncompared port, -03 is the supersede
      generalisation and the tenancy breach, -04 is the schema parameter and
      the e2e run. An unqualified id in a comment would point a later reader
      at the wrong finding, which is the failure this phase has already had
      twice with claims that were true of one half of a statement.
  - decision: >-
      FIX ROUND FOUR. The Playwright gate resolves and PINS its own database
      target, refuses anything that is not a local stack, and does not consult
      the ambient DATABASE_URL at all. src/platform/db/gate-target.ts.
    why: >-
      Criteria finding CR4-M3P12-02, the phase's most important. This phase added a
      spec whose whole content is direct writes through a client constructed
      with no arguments, and that constructor reads process.env and nothing
      else, so the target of every write was whatever the invoking shell
      carried. In this fleet's containers that is a DEPLOYED pooler belonging
      to a different project with a working password. The plan names this
      exact shape as hazard H12.30 and criterion 12.23 bought a guard against
      it for ONE command; the same phase then opened a second writing surface
      without one. THE ORCHESTRATOR ESTABLISHED THAT NO PULSE TABLE EXISTS IN
      THAT PROJECT, so a write could not have succeeded rather than merely not
      having been observed. That is why this is a fix round and not an
      incident, and it does not make the hole acceptable.
  - decision: >-
      The ambient DATABASE_URL is not a source, and an approved target is
      ASSIGNED into process.env rather than merely checked.
    why: >-
      Two separate things had to be true for the gate to be safe and checking
      alone gives neither. FIRST, the variable this fleet's containers carry
      is precisely the variable nobody named for this purpose, so the resolver
      reads PULSE_GATE_* names, which exist for no other purpose, and then the
      .env file at the package root, and then refuses. SECOND, a check that
      leaves process.env alone is not a pin: the reviewer proved that Next's
      own loader does not override a shell variable, so a .env file was not a
      pin at all, and playwright.config.ts spread the whole ambient
      environment into both web servers. The approved values are therefore
      written into process.env at config module scope, before a server is
      spawned and again inside every worker that loads the config.
  - decision: >-
      There is no override flag on the gate interlock, and the refusal is a
      throw out of the config rather than a skipped test.
    why: >-
      A gate that may be pointed at a deployed database on request is a gate
      that will be, and the sibling destructive guard's escape hatch exists
      for a command an operator invokes deliberately, which a test suite is
      not. A throw out of the config is the only moment early enough to be a
      mechanism: it aborts before a web server is spawned and before a worker
      constructs a client. A per-test skip would let the servers start first.
  - decision: >-
      The one spec that opens a client of its own ALSO refuses for itself, and
      it does not run at all in deploy-verify mode.
    why: >-
      The config covers every run through `playwright test`; the beforeAll
      covers the case the config cannot, which is the same spec imported by a
      different runner now or later. And in deploy-verify mode the suite
      drives a DEPLOYED app through its browser and opens no database of its
      own: this is the only spec that would, and pointing direct writes at a
      deployed database would be worse than the hole being closed.
  - decision: >-
      The supersede treatment is restricted to kind EXACT, and a colliding
      PREFIX or PATTERN rule of another merchant blocks as an ordinary
      conflict.
    why: >-
      Criteria finding CR4-M3P12-03. The justification for leaving a superseded
      place is an argument about EQUALITY, and the reviewer verified the
      property it rests on exhaustively over every Unicode code point: nothing
      uppercases into an ASCII lowercase letter, so a bare pattern can never
      EQUAL a namespaced key. The comment then generalised that to PREFIX and
      PATTERN and the generalisation is FALSE, witnessed against the shipped
      matcher: a glob need not be a prefix of anything, so a pattern beginning
      with a star matches a namespaced key and a bare star matches every key.
      No shipped defect follows, because assignMerchant writes EXACT and only
      EXACT and the deployed table holds no row of either other kind. What was
      wrong was the REASON, and a later reader would have relied on it. The
      treatment now splits where the argument splits.
  - decision: >-
      main() in scripts/rederive-merchant-rules.ts takes its impure
      dependencies as a parameter and is exported.
    why: >-
      Criteria finding CR4-M3P12-05. The exit-4 contract was pinned only by a
      over the script's own header comment, so changing `return 4` to
      `return 1` left every assertion green while the header kept promising 4.
      A contract nothing can execute is prose. The auto-run is now guarded on
      the file being the process entry point, so importing it in a test starts
      no run.
  - decision: >-
      The superseded rule is put back into the before-set whole, and the
      artifact it produces is filtered at the COMPARISON instead.
    why: >-
      Hazard finding CR4-M3P12-01, high. Round three excluded the whole
      superseded rule from the before-set, and the justification for doing so
      covers only the rows the namespaced claimant can actually reach. The
      baseline key is basis-agnostic, so a superseded rule also claims rows
      that have migrated to the ACCOUNT basis, which a descriptor-namespaced
      claimant can never match and which pass two promotes only when they all
      carry one trusted account. Those rows were dropped from BOTH sides of
      the superset test, so a real loss vanished with no entry, no count and
      no line in the report: round three traded a false loss for a hidden one.
      The narrowed rule is that a superseded rule's claim is dismissed only
      when the row is still covered AFTER the run, by the claimant or by
      anything else, and is reported as a loss when nothing covers it.
  - decision: >-
      applyRuleWrites verifies the inserted merchant belongs to the household,
      inside the same transaction as the write.
    why: >-
      Hazard finding CR4-M3P12-03. Fix round three closed the UPDATE half of
      this; the INSERT half had never had a check at all. The schema's foreign
      key on MerchantRule.merchantId carries no household component, so the
      database permits a declaration in one household naming a merchant owned
      by another, and it was witnessed doing exactly that against a real local
      Postgres. CLAUDE.md's sixth non-negotiable is a rule about what reaches
      the table, so this is not a severity judgement. The fake the fast gate
      binds routes its inserts through upsertRule, which DOES check, so the
      fake was stricter than its subject and could never have caught this: the
      real-database spec now submits an INSERT ALONE, so the update loop
      cannot throw first and the two write paths are proven independently.
  - decision: >-
      The target interlock compares the connection PORT: unknown ports are
      refused, and --expect-port compares one exactly.
    why: >-
      Hazard finding CR4-M3P12-02, folded in with the unnamed-database high
      because they are the same subject. Three otherwise identical strings on
      5432, 6543 and an arbitrary 9999 were approved identically with the same
      reason text, because nothing read parsed.port. The port is the last
      field of the endpoint the client resolves and the module's whole rule is
      that the guard must account for every part of the connection that
      decides where it lands. The new argument is OPTIONAL on purpose: an
      unnamed port must still be one of the two this product's own strings
      use, so the arbitrary port is refused either way, and making it a third
      required argument would change the invocation criterion 12.23 documents
      for a field that cannot reach a different project on its own.
  - decision: >-
      The loss exemption is decided by TRACEABLE LINEAGE, not by asking
      whether the row is covered afterwards, and the lineage is published in
      the report.
    why: >-
      HAZARD finding HAZ5-1, high, and the lane's trajectory call is what
      shaped the answer: this predicate had been rewritten three times, each
      version a boolean short-circuit reacting to the last counterexample, and
      each trading one bug for another. Round two reported losses that had not
      happened. Round three hid real ones by dropping the rule from the
      before-set. Round four asked "is the row covered by ANYTHING afterwards"
      and thereby hid a silent REASSIGNMENT: a row moving from the dead rule's
      merchant to a third merchant named by a declaration with no relationship
      to either, which is criterion 12.7's second half failing while the tool
      built to catch it reported clean. A fourth patch aimed at that witness
      would have been the same mistake again. So the relationship itself is
      recorded where it is known, in two maps: which namespaced rule
      superseded which dead rule, and which rule carries whose account-basis
      promotion. The exemption asks one question of them, whether the row's
      coverage DESCENDS FROM the specific claimant, which is decidable from
      the lineage without case analysis. Both relations are published in the
      report as ids, so the operator can check the reasoning and the property
      test can read it rather than reimplement it.
  - decision: >-
      Both outcomes of a pass-two promotion are recorded as lineage, including
      the one where no insert happens.
    why: >-
      Pass two matches under the OLD key, so a promotion made from a claimant
      genuinely covers rows the superseded rule used to claim, and the
      exemption has to follow that second link or it would report a loss on
      every ordinary deploy-window migration. When the promoted pattern is
      already held by a rule of the SAME merchant, pass two writes nothing,
      and that existing rule IS the source rule's naming already recorded in
      the account key space. Leaving it out of the lineage would have made the
      exemption depend on whether the owner happened to have named the account
      group already, which is not a distinction anything else in this routine
      draws.
  - decision: >-
      A row that ends at the claimant's merchant through an UNRELATED rule is
      still reported as a change.
    why: >-
      Stated because it is the one place the new predicate is deliberately
      wider than the old one, and it is the direction to err in. Nothing in
      the supersede relationship explains that row, so the run says so, and a
      person clears it with the acknowledge flag that already exists. After
      three rounds of this predicate hiding things, over reporting costs a
      flag and under reporting costs a naming the owner cannot get back.
  - decision: >-
      The re-derivation's target interlock admits ONLY port 5432 when the
      operator names no port.
    why: >-
      HAZARD finding HAZ5-2. Round four added the port comparison and then
      admitted both 5432 and 6543 unnamed, which left the exact ambiguity the
      finding was raised to force a decision on. This is the decision. 5432 is
      where one client connection is one server connection, which is what this
      routine's single interactive transaction depends on, and the atomicity
      criterion 12.7 rests on is not something a host and a project ref can
      establish. The transaction pooler stays reachable by naming it, so a
      deployment that needs 6543 is one flag away; what it is no longer is
      silent.
  - decision: >-
      A DEVELOPMENT server refuses a non-local database, and NOTHING else
      changes: production, tests and scripts are untouched.
    why: >-
      HAZARD finding HAZ5-3, and the lane is right that the previous round's
      open question conflated two commands. `next start` must open a deployed
      database and is left exactly as it was. `next dev` never serves real
      traffic, and in a fleet container the ambient DATABASE_URL is a deployed
      project with a working password, so a developer starting the dev server
      without pinning anything had a local looking app writing to it. The
      predicate is NODE_ENV exactly "development" rather than "not
      production", and that narrowing is load bearing in two directions: the
      wider form catches NODE_ENV=test, and the fast gate imports this module
      transitively, so it would have made `npm test` refuse in any container
      with a remote ambient value; and it catches NODE_ENV unset, which is
      what a tsx entry point has, including the one command criterion 12.23
      exists for, whose whole purpose is to open a deployed database.
  - decision: >-
      The two interlocks ask ONE shared question about a connection string's
      query, in src/platform/db/connection-string.ts.
    why: >-
      CRITERIA finding CR5-M3P12-03. Fix round three established with a
      witness that a connection string is a document rather than two fields,
      and taught the re-derivation's interlock to refuse a host query
      parameter by name. Fix round four then added a SECOND interlock, for the
      Playwright gate, which decided "is this a local stack" from the hostname
      alone. So a string whose authority was the local stack and whose query
      redirected the connector was approved by one guard and refused by the
      other, in the same tree, in the same directory, one round apart. Two
      guards disagreeing about one attack is worse than either being wrong
      alone, because the tree looks defended. The rules are EXTRACTED rather
      than copied, which is the move LOCAL_DB_HOSTS already made, and they are
      applied only to the two POSTGRES endpoints: a connector's parameters
      mean nothing for the Supabase API URL, whose host is still checked.
  - decision: >-
      A pinned variable the naming source does not carry is DELETED from the
      environment, not left as it was.
    why: >-
      CRITERIA finding CR5-M3P12-07. The module's own comment said the two
      Supabase keys travel with the pin because a key issued by one project is
      meaningless against another; they travelled only where the source
      happened to carry them, so a PULSE_GATE_* pin naming the three endpoints
      left an ambient, possibly foreign, anon key and service role key beside
      them. test/e2e/auth.spec.ts builds a service-role admin client out of
      exactly those two. The naming source now decides all five.
  - decision: >-
      The standing answer to "can anything reach a database nobody named" is a
      SCAN of test/ and scripts/, and it covers Supabase admin clients too.
    why: >-
      CRITERIA finding CR5-M3P12-08. The assertion stated a universal and read
      one hard-coded path, so a second spec opening a client would not have
      reddened it, and a service-role Supabase client, which creates users and
      writes rows, was not covered at all though one exists. The scan reads
      CODE rather than prose, because this tree discusses `new PrismaClient()`
      in comments and test titles more often than it calls it; without that it
      reported the sentence explaining the guard as a violation of it. A new
      assertion, assertGateApiTargetIsLocal, covers the API door, and the
      sign-up spec calls it.
  - decision: >-
      The fake's insert path models a CREATE, including the unique key, rather
      than delegating to an upsert.
    why: >-
      CRITERIA finding CR5-M3P12-04, and it is the THIRD finding on this one
      seam in alternating directions: the fake was weaker than the adapter on
      the unique key in round two, stricter on tenancy in round four, and
      weaker on the unique key one method along now. The adapter issues
      tx.merchantRule.create, which the schema's unique key rejects on a
      submission upsertRule would quietly repoint. Latent rather than live,
      because pass two consults the working copy before queueing an insert,
      but three findings on one seam is a structural signal and the modelling
      is now written out where it can be read.
  - decision: >-
      An ABSENT port is read as the connector's default rather than refused.
    why: >-
      CRITERIA finding CR5-M3P12-09. A portless connection string was
      unapprovable and the refusal advised passing --expect-port, which then
      refused again because the exact comparison could not match an empty
      string. A refusal that advises something that cannot work is worse than
      one that says the shape is not allowed.
  - decision: >-
      Criterion 12.19's pin asserts the CLAIM, scoped to the section, instead
      of two exact spellings.
    why: >-
      CRITERIA finding CR5-M3P12-10. The two regexes pinned two wordings, and
      the phrase the criterion asks be gone still occurs once in the document,
      differing from both by one word, inside a quotation of what the section
      used to say. That occurrence is correct and stays; a reintroduction
      phrased the same way would have passed. The check now reads the
      merchant-resolution section and refuses the phrase on any line that is
      not explicitly historical, and it asserts it really read that section so
      an empty result cannot come from slicing the wrong text.
  - decision: >-
      The lineage predicate is written toward criterion 12.7's amendment, and
      where the two could differ is named rather than assumed away.
    why: >-
      The orchestrator has dispatched an amendment to criterion 12.7 stating
      the exception the code has carried in a comment since fix round three:
      a row's merchant may change only where the new resolution traces back
      through the SPECIFIC claimant that superseded the rule it previously
      resolved through, coverage by any other rule is a reported and blocking
      loss, and the check is by IDENTITY rather than by re-derivation. That is
      what this round builds, term for term: supersededByClaimant records
      which rule superseded which, the comparison is an equality on rule ids,
      and coverage by anything else is reported and blocks. It was not
      available while building, so the mapping is written here to be checked
      against the amendment when it lands.
      ONE PLACE THEY COULD DIFFER, named because a reader should not have to
      find it: this implementation treats a rule carrying the CLAIMANT'S OWN
      PASS-TWO PROMOTION as tracing through the claimant. That second link is
      not optional. Pass two matches under the OLD key, so a promotion made
      from a claimant genuinely covers rows the superseded rule used to claim,
      and without the link every ordinary deploy-window migration would report
      a loss on every account-basis row. If the amendment's wording does not
      cover it, the wording needs the link rather than the code losing it, and
      that is a question for the plan rather than something to bend here.
      A new hazard class H12.31 now names the shape that got through three
      rewrites, which is the same statement read from the other side.

