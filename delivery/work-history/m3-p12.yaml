    contradicts-plan: false
deviations:
  - plan-clause: >-
      Criterion 12.17, the half requiring the phase work history to record the
      command actually run AGAINST THE DEPLOYED DATABASE with its exit code
      and its printed before-and-after assignment-set sizes.
    why: >-
      NOT DONE, and it cannot be done before this branch merges. Decision D-46
      states the order and the plan calls it forced rather than chosen: the
      routine imports the new derivation to compute the new patterns, so it
      cannot run against a build that does not carry it, and this branch is
      not deployed. Running it now from this worktree against the owner's live
      database would write merchant_rules while the deployed application still
      carries the old code, which is the deploy window D-46 describes with its
      two halves in the wrong order. The other half of the criterion IS met:
      package.json carries rederive:merchant-rules invoking
      scripts/rederive-merchant-rules.ts, and a test in
      test/domain/counterparty-identity-contracts.test.ts reads package.json
      and asserts it. The deployed run is owed AT DEPLOY TIME and is recorded
      here as owed rather than as done.
  - plan-clause: >-
      Criteria 12.7, 12.8 and 12.9, which speak of "a seeded database" holding
      MerchantRule rows written under the baseline derivation.
    why: >-
      The seeded subject is the in-memory fake repository this codebase's
      application tests already use (test/application/fake-import-world.ts),
      not a live Postgres. That is this tree's standing convention for the
      application layer and it is what lets criterion 12.9's assertion be made
      at all, since "issues no write against the transactions table" is
      observable on a port and invisible against a real database without a
      query log. Recorded as a deviation rather than left implicit because the
      criterion's word is "database" and a reader is entitled to know which
      one answered it.
  - plan-clause: >-
      files-to-touch, which does not name .gitignore.
    why: >-
      Commit 62612ad tracked the worktree's node_modules SYMLINK, publishing
      an absolute container path into a public repository and breaking any
      clone. The blob is removed with git rm --cached, and .gitignore line 2
      is widened from `node_modules/` to `node_modules` because the trailing
      slash matches directories only and is the whole reason a symlink got
      through. Fixing the accident without closing the hole would leave the
      next worktree to repeat it.
      CORRECTED IN THE FIX ROUND, findings HZ-M3P12-04 and CR-M3P12-06,
      because the sentence above was true of the TREE and read as true of the
      repository, and it is not. The blob is still reachable in this branch's
      own history: git ls-tree d62b63d node_modules returns the 120000 blob,
      and commits 62612ad and d62b63d are pushed, so a clone of the branch
      can read the path. Removing it from the tip did not remove it from the
      public repository. THE ROUTE TAKEN is the orchestrator's decision,
      recorded here rather than chosen by this implementer: no history
      rewrite, on the ground that the content is a build path carrying no
      household data and the phase squash-merges, so main never carries it.
      What this branch owes, and pays here, is that no reader concludes from
      the words removed and untracked that the path is gone.
  - plan-clause: >-
      files-to-touch, which does not name src/app/globals.css, test/e2e/,
      messages/en.json, messages/nl.json, messages/fr.json or
      src/app/(app)/merchants/page.tsx.
    why: >-
      RECORDED IN THE FIX ROUND, finding HZ-M3P12-10, because all six were
      changed and none was declared. Every one of them is criterion 12.18's
      doing: the criterion requires a naming refusal to REACH THE READER,
      which needs a status the route reads (page.tsx), a component that
      renders it (already in files-to-touch), a message in each of the three
      catalogues, a style for the banner (globals.css) and a browser witness
      (test/e2e/merchants.spec.ts). A criterion that says "surfaces that
      error to the reader" cannot be met inside the declared set. The
      consequence is not only bookkeeping: the plan's conflicts-with entry
      for M3-P9 asserted, as CHECKED, that this phase touches none of
      M3-P9's four files, and two of them are src/app/globals.css and
      test/e2e/. That entry is corrected in delivery/plan/pulse-v02.yaml in
      this branch, since a false checked statement is worse than an
      unchecked one and M3-P9 is not merged.
  - plan-clause: >-
      Criterion 12.1's composition clause, "at least 8 rows carry none",
      under its strict reading.
    why: >-
      LEFT ALONE DELIBERATELY, and it is the plan's defect rather than the
      implementation's. The orchestrator has said so and both review lanes
      agree. Under the strict reading, "none" means no account FIELD, and the
      criterion then collides with plan step 7, which requires the same
      fixture to carry the two truncation-attack rows: those rows carry an
      account field and take the descriptor basis, so rows with no account
      field cap at 6 while the criterion's own arithmetic fixes the
      descriptor-basis count at exactly 8. The shipped test asserts 8
      DESCRIPTOR-BASIS rows, which is the only reading the plan admits. No
      code was contorted for the strict reading and none should be; the
      orchestrator amends the criterion.
  - plan-clause: >-
      Criterion 12.5's committed baseline table, test/fixtures/baseline-descriptor-keys.json.
    why: >-
      Not a deviation from the plan, recorded because the fix round changed
      the file it lives beside. One PAN-shaped substring of that table,
      already invented and already listed in another form, was not on the
      identifier allow list; it is added there in this round with its
      provenance. See the environment warning about gate:privacy below for
      why that mattered and what it probably explains.
  - plan-clause: >-
      Step 13, "run the full gate before calling the slice done", read as one
      clean run of every gate.
    why: >-
      npm run typecheck, npm run lint, npm test, npm run gate:privacy and npm
      run gate:tokens all exit 0 on the first run. The Playwright run needed a
      re-run of one spec; what failed, why, and the outcome are in the
      gate-evidence entry for it rather than summarised away here.
  - plan-clause: >-
      Criterion 12.23, added to the plan AFTER this implementation was built.
    why: >-
      BUILT IN THIS ROUND, and recorded here rather than left to look like a
      criterion that was always owed. The criterion says of itself that it
      postdates the implementation under review at the time of its relocation,
      that a review evaluating that implementation marks it NOT MET AND NOT
      YET OWED, and that it is owed by the NEXT change to this phase. This is
      that change, so it is built: src/platform/db/target-guard.ts with
      test/db/target-guard.test.ts, wired into
      scripts/rederive-merchant-rules.ts as its first statement. ONE
      CONSEQUENCE WORTH STATING because it is not obvious and it is
      deliberate: the interlock refuses a connection carrying no project ref
      in either field, and a local Postgres connection carries none, so THE
      SCRIPT CANNOT BE RUN AGAINST A LOCAL DATABASE AT ALL. That is what the
      criterion specifies and it is right for a one-off command aimed at one
      deployed database, but it means the script's own end-to-end behaviour is
      exercised by the routine's tests and by the process-level refusal tests
      rather than by a local happy-path run.
  - plan-clause: >-
      files-to-touch, which does not name src/platform/db/guard-cli.ts or
      src/platform/db/resolve-env.ts.
    why: >-
      src/platform/db/ IS in files-to-touch as amended, and both files are
      inside it, but the guard-cli edit deserves naming because it changes a
      file this phase otherwise has no business in. Criterion 12.23 requires
      the interlock to resolve the environment the way the command it guards
      resolves it and calls an interlock that does not "decorative". The
      reading lived inline in guard-cli.ts, so meeting that requirement was a
      choice between one implementation and two copies that agree until
      somebody edits one. The reading is extracted to resolve-env.ts and
      guard-cli.ts now imports it; its behaviour is unchanged.
  - plan-clause: >-
      Criterion 12.17, the deployed run.
    why: >-
      STILL NOT DONE AND NO LONGER THIS PHASE'S TO DO. The criteria lane
      recorded it as half met with the deployed run impossible before merge
      and attributed the defect to the plan; the plan now agrees and has moved
      the deployed run to M3-P16. The invocation point half is met and is now
      met with a target interlock in front of it, which is the part this phase
      owed.
