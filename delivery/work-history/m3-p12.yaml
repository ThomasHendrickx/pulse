      being false.
    why: >-
      BUILT NARROWER, DELIBERATELY, AND THE DIFFERENCE IS SAID HERE RATHER
      THAN GLOSSED. The refusal is gated on NODE_ENV being exactly
      "development". The wider predicate is not implementable without two
      carve-outs that amount to the same thing: vitest sets NODE_ENV=test and
      the fast gate imports this module transitively, so "not production"
      made `npm test` refuse to run in any container whose ambient
      DATABASE_URL is remote, which changes what the fast gate requires of
      every contributor in order to guard a server the fast gate never starts;
      and a tsx entry point carries no NODE_ENV at all, including the
      re-derivation command, whose entire purpose is to open a DEPLOYED
      database and which carries the stricter interlock criterion 12.23 asked
      for. Both consequences were observed, not predicted. So the positive
      form is the honest one: this guards the dev server, which is the gap
      both lanes named, and nothing else.

