key-decisions:
  - decision: >-
      The uncommitted test/e2e/merchants.spec.ts change is FINISHED WORK and
      is committed as part of the phase rather than discarded as a fragment.
    why: >-
      Criterion 12.18 requires an e2e test asserting that a pre-migration
      un-namespaced subject surfaces the refusal to the reader, and without
      this file that half of the criterion has no witness anywhere. Every
      selector it uses exists in the shipped component (the unresolved-group
      and merchant-group test ids and the hidden counterpartyText field in
      src/modules/merchants/ui/merchant-review.tsx, the naming-refused test id
      on its refusal line) and the message key it types into is in all three
      catalogues. It runs green inside the full suite. A finished test that
      the phase's own criterion names is not a fragment.
  - decision: >-
      The tracked node_modules SYMLINK that commit 62612ad swept into the
      index is removed with git rm --cached, and .gitignore's rule is widened
      from `node_modules/` to `node_modules`.
    why: >-
      A trailing slash matches directories only. In a fleet worktree
      node_modules is a SYMLINK, which git sees as a file, so the ignore rule
      did not cover it and an `add -A` tracked it. What was committed is a
      120000-mode blob whose whole content is an absolute container path in
      another worktree. It is wrong three ways: it publishes a machine-local
      path from this container into a PUBLIC repository, it makes any clone
      resolve its dependencies to a path that does not exist, and it is not in
      this phase's files-to-touch. Dropping the trailing slash closes the
      recurrence for every worktree rather than only for this one.
  - decision: >-
      The account basis is verified as costing the owner nothing by reading it
      off the COMMITTED harness rather than by writing a separate predicate
      script.
    why: >-
      The harness reports rows-with-account and identity-rows-account-basis
      separately. On the real current-account document both read 11, which is
      the whole of criterion 12.16's real-month claim in one number: every
      stored account took the account basis, so every one passed all three
      trust tests, and identity-account-keys reads 6. A separate script
      measuring the predicate directly would be a second implementation of a
      number the committed one already prints, which is the reproducibility
      failure plan step 1 exists to end.
