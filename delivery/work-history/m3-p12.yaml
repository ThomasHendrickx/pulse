      rows 39, rows-with-account 11, rows-with-name 0,
      baseline-distinct-keys 25, baseline-singleton-keys 21,
      baseline-singleton-rows 21, identity-distinct-keys 20,
      identity-account-keys 6, identity-descriptor-keys 14,
      identity-rows-account-basis 11, identity-rows-descriptor-basis 28,
      identity-singleton-keys 12, identity-singleton-rows 12. For the card
      document: rows 22, rows-with-account 0, rows-with-name 0,
      baseline-distinct-keys 16, baseline-singleton-keys 12,
      identity-distinct-keys 16, identity-account-keys 0,
      identity-descriptor-keys 16, identity-rows-account-basis 0,
      identity-rows-descriptor-basis 22, identity-singleton-keys 12. Every
      figure criterion 12.2 pins is met exactly and none is below its floor.
      Nothing was written to disk and no parsed string was printed.
    contradicts-plan: false
  - finding: >-
      (b) THE FIXTURE'S OWN NUMBERS. The same harness over
      test/fixtures/belfius-counterparty-identity.pdf: rows 24,
      baseline-distinct-keys 24 (one per row, so the fixture reproduces TOTAL
      non-convergence rather than a partly converged version of it),
      identity-distinct-keys 12, identity-account-keys 4,
      identity-descriptor-keys 8, identity-rows-account-basis 16,
      identity-rows-descriptor-basis 8, rows-with-account 18. The 18 against
      16 is the trust gate refusing the two attack rows the generator writes
      for it, which is the fixture working as designed.
    contradicts-plan: false
  - finding: >-
      (c) THE GENERATOR'S RECORD IS AN INDEPENDENT ORACLE, checked in the
      source rather than accepted. The only imports in
      test/fixtures/generate-pdf-fixtures.ts are node:fs, node:path and
      node:url: nothing from src reaches it, so counterpartyIdentity cannot.
      Its row record is built by mapping the fixture's transaction list to
      each row's own counterparty ordinal field, which is the INPUT the
      description is written from, and both the PDF and the record are written
      by one main block in a single loop. Regeneration check, run for this
      record: npx tsx test/fixtures/generate-pdf-fixtures.ts followed by git
      status --porcelain, which listed no fixture as modified, so all fifteen
      emitted files reproduce byte for byte.
    contradicts-plan: false
  - finding: >-
      (d) THE RED WITNESS FOR THE CONVERGENCE CRITERIA, taken here rather than
      quoted. The account branch of counterpartyIdentity was disabled so the
      derivation reproduces the tree's PRE-CHANGE behaviour, the normalised
      descriptor for every row, and npx vitest run
      test/domain/counterparty-identity.test.ts was run: 5 failed, 16 passed,
      exit 1. The failures, verbatim: criterion 12.1 "expected 24 to be 12";
      criterion 12.1's composition assertion "expected 0 to be greater than or
      equal to 8"; criterion 12.4's row-by-row partition against the
      generator's record, failing at row 6; criterion 12.16's positive control
      "expected 'descriptor' to be 'account'"; and criterion 12.16's
      first-wins pin. The file was then restored from its committed copy and
      the same command run again: 21 passed, exit 0. The convergence criteria
      therefore discriminate; they are not assertions that hold under the old
      behaviour too.
    contradicts-plan: false
  - finding: >-
      (e) THE TRUST GATE COSTS THE OWNER NOTHING, measured. On the real
      current-account document rows-with-account is 11 and
      identity-rows-account-basis is 11, so all 11 stored accounts pass the
      shape grammar, the pinned country-length table and the ISO 7064 mod-97
      check; identity-account-keys is 6, so the trusted distinct count is
      still 6. This reproduces the M0-P5 run-6 figure through a COMMITTED
      harness, which is what that record could not do.
    contradicts-plan: false
  - finding: >-
      (f) NO REAL MERCHANT, PLACE OR PERSON NAME REACHED THE NEW FIXTURE,
      checked rather than assumed, because gate:privacy is blind to exactly
      this and its own header says so (fleet warning 12). An in-memory script
      parsed both real documents through the shipped path and tested every
      name-like token of the new fixture against their descriptions and
      counterparty names. Of 27 tokens, 5 occur in a real document and all 5
      are generic transaction vocabulary the statement grammar itself uses;
      every shop-like, place-like and person-like token of the fixture occurs
      in neither document. Nothing from either document was printed or written
      to disk.
    contradicts-plan: false
  - finding: >-
      (g) A TRACKED node_modules SYMLINK IS ON THE BRANCH AND IS NOT IN
      files-to-touch. git ls-files node_modules returns `node_modules`; git
      diff origin/main HEAD shows it added in commit 62612ad as new file mode
