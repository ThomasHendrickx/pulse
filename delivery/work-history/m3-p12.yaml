      Whether it can fire first is a property of the regex engine and the
      locale rather than of the tree, and I could not make it. Sweeping every
      tracked file, that was the ONLY card-shaped value in the whole tree not
      on the allow list; it is now listed with its provenance, so the gate's
      answer no longer depends on which alternative matches. That does not
      prove it was the cause and I do not claim it was.
  - id: C-M3P12-08
    kind: coverage
    statement: >-
      A same-merchant pattern collision crashed the migration part way through
      applying before this round, and is a reported decision that writes
      nothing after it; the property holds against real Postgres and not only
      against a fake.
    settled-by:
      executed-construction:
        command: >-
          the fake taught the unique key the schema declares, then the D-46
          window shape seeded and the routine run against it; then the same
          seed against a real Postgres database created for this purpose and
          pinned explicitly, with the collision branch removed and restored
        exit-code: 1
        output: |
          RED, against the fake:
            THREW: Unique constraint failed on the fields: (householdId,kind,pattern)
            calls: ["update rule-2 REJECTED unique(kind,pattern)"]
            report: none produced
          RED, against real Postgres:
            THREW: PrismaClientKnownRequestError code=P2002
            exit: none  applied: undefined
          GREEN, against real Postgres, after the fix:
            THREW: no
            exit: 0  applied: true
            twin-outcomes: 1
            old rule pattern unchanged: true
            twin rule pattern unchanged: true
            rule row count before 2 after 2
          The fast gate carries five committed tests for it, including a
          different-merchant collision that still BLOCKS, so the new outcome
          is a distinction and not a blanket permission.
  - id: C-M3P12-09
    kind: coverage
    statement: >-
      The target interlock refuses the ambient connection in this container
      even when the ambient host is passed as the expected host, which is the
      case a host-only interlock approves.
    settled-by:
      executed-construction:
        command: >-
          npx tsx scripts/rederive-merchant-rules.ts --household demo, then
          the same with --expect-host set to the ambient connection's own host
          and --expect-ref set to the Pulse project ref
        exit-code: 3
        output: |
          With no target arguments:
            rederive-merchant-rules: no target host was given. This command
            rewrites every merchant rule of a household and then recomputes;
            it will not run against a database nobody named. Pass
            --expect-host and --expect-ref.
            exit 3
          With the ambient host and the Pulse ref:
            rederive-merchant-rules: the project ref in the resolved
            connection's username is not the ref given on the command line.
            Refusing. The resolved value is deliberately not printed here.
          No connection was opened on either path, and no resolved host, ref
          or password appears in either message.
  - id: C-M3P12-10
    kind: open-question
    statement: >-
      Whether the interlock's resolution is byte-for-byte equivalent to the
      database client's own for every connection string is not settled, and
      one direction of the gap is known and accepted rather than closed.
    still-open-because: >-
      The URL parser this resolution uses does not percent-decode a username
      while the client's parser does, so a connection string carrying a
      percent-encoded username is seen here in its encoded form and REFUSES a
      target the client would have opened. That direction costs a blocked run
      and a round trip; the other direction would cost a migration in the
      wrong database, so the asymmetry is accepted. It is named in the
      criterion, in the module's own header and in a test that pins it.
      Whether any other divergence exists I did not establish.
fix-round:
  - mechanism: >-
      DERIVING A GROUPING KEY FROM A ROW'S STORED FIELDS, and specifically its
      FLOOR: what the derivation does when the fields it reads carry nothing.
      The M3-P12 fix round's first high finding, HZ-M3P12-01, is that this
      phase introduced a namespaced key and thereby turned the empty case from
      a value every consumer refused into a value every consumer accepted. The
      mechanism's rule, already written at the derivation's own definition, is
      that a key derived from an unvalidated value must FAIL CLOSED to the
      longer, more specific key rather than open to the shorter one; a bare
      namespace is the shortest possible key and there is nothing to derive a
      longer one from, so the floor is a REFUSAL and it must hold at every
      consumer rather than at the one that happened to be looked at.
    derivation:
      command: >-
        grep -rn "isBareIdentityKey\|identityRemainder" src/ --include=*.ts
        --include=*.tsx
      output: |
        src/modules/merchants/application/assign-merchant.ts:18:  identityRemainder,
        src/modules/merchants/application/assign-merchant.ts:109:  if ((identityRemainder(pattern) ?? "x").trim() === "") {
        src/modules/merchants/application/index.ts:71:  isBareIdentityKey,
        src/modules/merchants/domain/merchant-review.ts:12:  isBareIdentityKey,
        src/modules/merchants/domain/merchant-review.ts:130:        ? isBareIdentityKey(identity.key)
        src/modules/merchants/domain/merchant-rule.ts:40:  isBareIdentityKey,
        src/modules/merchants/domain/merchant-rule.ts:98:  if (normalised === "" || isBareIdentityKey(normalised)) {
        src/modules/merchants/domain/merchant-rule.ts:112:    (rule) => rule.pattern !== "" && !isBareIdentityKey(rule.pattern),
        src/modules/merchants/domain/counterparty-identity.ts:90:export const identityRemainder = (key: string): string | undefined => {
        src/modules/merchants/domain/counterparty-identity.ts:118:export const isBareIdentityKey = (key: string): boolean =>
        src/modules/merchants/domain/counterparty-identity.ts:119:  identityRemainder(key) === "";
        src/modules/merchants/domain/counterparty-identity.ts:311:  // through isBareIdentityKey above (finding HZ-M3P12-01).
        FOUR CONSUMERS, and the fix reaches all four rather than the one the
        finding named. The definition (counterparty-identity.ts) states the
        floor and exports the predicate. The MATCHER refuses a bare key and,
        separately, a bare PATTERN, which is the half that reaches an ordinary
        row: a bare PREFIX is a prefix of every key of its basis. The WRITE
        BOUNDARY refuses a bare subject on both bases, which closes the only
        door in the product that can create such a rule. The REVIEW SURFACE
        withholds the naming form from a bare-namespace group, so the reader
        is not offered a naming that would be refused.
    not-covered: >-
      THE IMPORTER IS NOT CHANGED, and that is where the bare key comes from.
      src/modules/import/domain/parse-statement.ts sets description from the
      cell with no emptiness guard, while every optional text role beside it
      IS guarded, so a delimited file with a blank description cell still
      produces a row whose identity is the bare namespace. Guarding it there
      would change what the importer ACCEPTS, which is a facts-layer decision
      with a re-parse behind it and no criterion in this phase covering it.
      What this round changes is that such a row can no longer be named,
      matched or merged; it still exists and still shows. Also not covered:
      the matcher's strictness and the writer's trimming differ by design, so
      a hand-written pattern whose remainder is whitespace only is refused at
      the boundary and preserved by the matcher; the property test for
      criterion 12.21 is what forced that split and it is asserted, not
      assumed. And the truncation residual named in HZ-M3P12-05 is corrected
      in prose and pinned by a counterexample test, NOT closed: closing it
      means changing the importer's account scrape, which is a layout version
      bump and a re-parse of every stored source. AND THE ONE-ROW PROMOTION,
      added in fix round two under finding CR2-M3P12-06 because it belonged in
      this list and was not in it: a promotion whose whole evidence is a
      single transaction is still a promotion, the account it keys on is
      whichever candidate the importer's first-wins scrape stored for that one
      row, hazard H12.16 records that choice as unanswered and measures it at
      4 of the owner's 39 rows, and this phase makes it VISIBLE with its own
      outcome token, its own list and an explanatory line on the operator's
      console rather than closing it. Sized against the owner's own table it
      is 1 of 1: the deployed declaration is a single EXACT rule written from
      one row.
  - mechanism: >-
      DECIDING A MIGRATION AGAINST A MODEL OF THE TABLE, and specifically what
      the model must carry. The first fix round moved every decision onto an
      in-memory working copy so the routine could block before it writes. The
      second round's high finding, raised independently by both clean-room
      lanes, is that the working copy modelled rule identity, kind and pattern
      and NOT the one constraint the real table enforces over exactly those
      three fields, @@unique([householdId, kind, pattern]). A model weaker than
      its subject reports safe by construction: the routine reached the end of
      its decision phase clean, reported exit 0, and then threw inside the
      write it had promised was safe. The mechanism's rule is that a decide
      phase is only as good as the constraints its model carries, and that
      where the model cannot carry them the APPLY must be atomic so a
      rejection cannot land after a commit. Both halves are built here.
    derivation:
      command: >-
        grep -rn "applyRuleWrites\|assessRederiveTarget\|resolveDbEnv" src/
        scripts/ --include=*.ts
      output: |
        src/modules/merchants/application/index.ts:91:  applyRuleWrites: repository.applyRuleWrites,
        src/modules/merchants/application/rederive-rules.ts:223:    | "applyRuleWrites"
        src/modules/merchants/application/rederive-rules.ts:618:    await deps.merchants.applyRuleWrites(context, {
        src/modules/merchants/application/ports.ts:95:  readonly applyRuleWrites: (
        src/modules/merchants/adapters/merchant-repository.ts:153:export const applyRuleWrites = async (
        src/modules/merchants/adapters/merchant-repository.ts:190:      "applyRuleWrites: one or more rules did not belong to the household",
        src/platform/db/target-guard.ts:112:export const assessRederiveTarget = (
        src/platform/db/guard-cli.ts:2:import { resolveDbEnv } from "./resolve-env";
        src/platform/db/guard-cli.ts:14:const resolved = resolveDbEnv;
        src/platform/db/resolve-env.ts:40:export const resolveDbEnv = (name: string): string | undefined =>
        scripts/rederive-merchant-rules.ts:77:import { resolveDbEnv } from "@/platform/db/resolve-env";
        scripts/rederive-merchant-rules.ts:78:import { assessRederiveTarget } from "@/platform/db/target-guard";
        scripts/rederive-merchant-rules.ts:97:  const target = assessRederiveTarget(
        scripts/rederive-merchant-rules.ts:98:    { DATABASE_URL: resolveDbEnv("DATABASE_URL") },
        ONE WRITE SITE, not a loop of awaits: the routine issues its whole set
        through one port member, the adapter runs that member's statements
        inside prisma.$transaction, and the fake mirrors the all-or-nothing
        behaviour by restoring its array on any rejection. ONE GUARD SITE, and
        it is the first statement of the command's main function, before the
        household argument is read. ONE RESOLUTION, shared by the two
        interlocks in src/platform/db so they cannot drift apart.
    not-covered: >-
      THE MODEL STILL DOES NOT CARRY EVERY CONSTRAINT, and the transaction is
      what stands where it does not: a check constraint, a foreign key, a
      trigger or a lost connection is still discovered at apply time, and what
      the fix guarantees is that discovering one leaves the table as the run
      found it rather than half migrated. THE RECOMPUTE IS OUTSIDE THE
      TRANSACTION, deliberately, so a failure between the rule writes and the
      recompute leaves the declarations migrated and the rows not yet
      recomputed; that is the deploy window D-46 already describes and the
      recompute is idempotent and re-runnable. THE INTERLOCK CANNOT BE
      EXERCISED END TO END AGAINST A LOCAL DATABASE, because a local
      connection carries no project ref and the interlock refuses one; its
      happy path is covered per endpoint shape as a pure function and its
      refusals through the shipped command as a process. AND IT GUARDS THIS
      COMMAND ONLY: every other writing entry point in this repository still
      resolves its target from ambient environment, and widening the sibling
      guard's own sentence from DESTRUCTIVE to WRITING, which the criteria
      lane asked for, is not done here because it would change the posture of
      a guard this phase does not own.
environment-warnings:
  - warning: >-
      TWO FLEET LANES CANNOT RUN THE PLAYWRIGHT GATE AT ONCE ON THE DEFAULT
      PORTS. The config starts its own servers on 3000 and 3100 with
      reuseExistingServer false, deliberately, so a concurrent worktree
      running its suite makes the run die immediately on "http://127.0.0.1:3100
      is already used". The recorded practice from M3-P7 is to move the ports
      temporarily, run, then restore the tracked file and verify the diff is
      empty. Nothing belonging to another lane may be killed to free a port.
    evidence: >-
      A first attempt exited 1 with that message while another worktree held
      both ports; the run recorded in the gate evidence was made on 3200 and
      3300 and playwright.config.ts was restored afterwards, verified with an
      empty git diff.
  - warning: >-
      THE AMBIENT DATABASE_URL IN THESE CONTAINERS IS A DIFFERENT SUPABASE
      PROJECT OF THE OWNER'S, WITH A WORKING PASSWORD, IN THE SAME REGION AS
      PULSE, and shell environment overrides .env for Prisma. Fleet warning 1
      already says pin the connection; what this round adds is that a HOST
      COMPARISON IS NOT ENOUGH TO CATCH IT, because the session pooler host is
      regional infrastructure shared by every project in that region. Any
      future interlock on a writing command must compare the PROJECT REF as
      well, and the ref lives in the username on a pooler and in the host on a
      direct connection.
    evidence: >-
      Witnessed through the shipped command with nothing connected: passing
      the ambient connection's OWN host as the expected host, which a
      host-only interlock approves, and the Pulse project ref as the expected
      ref, the run refuses on the ref. Every database command in this round
      was pinned explicitly to a database created for it on the local stack.
  - warning: >-
      A fleet worktree's node_modules is a SYMLINK, and .gitignore's
      `node_modules/` rule matched directories only, so `git add -A` tracked
      it as a 120000-mode blob carrying an absolute container path. The rule
      in this repository is now `node_modules` with no trailing slash, but any
      other worktree or fleet repository still carrying the slashed form has
      the same hole open.
    evidence: >-
      git ls-files node_modules returned `node_modules` on this branch; git
      diff origin/main HEAD showed it added in 62612ad as a new file mode
      120000.
  - warning: >-
      gate:privacy scans each file with an ALTERNATION of an IBAN pattern and
      a card pattern, and one string can match both. A spaced foreign account
      of more than four groups is matched by the IBAN pattern from its country
      code and by the card pattern from its first digit group, yielding two
      different normalised values, and only one of them needs to be missing
      from the allow list for the gate to report the file. Sweeping every
      tracked file for card-shaped values, exactly one in the whole tree was
      not on the list, and it is the card-shaped view of a value whose IBAN
      view WAS listed. It is now listed too. Any fixture that writes an
      identifier in spaced groups should be added to the allow list in EVERY
      form the gate's patterns can produce, not only in the form the author
      was thinking of.
    evidence: >-
      The hazard lane of M3-P12 recorded one gate:privacy run reporting
      test/fixtures/baseline-descriptor-keys.json with "identifier shape not
      on the allow list" and twenty-three clean runs on the identical tree.
      I could not reproduce it in twenty-five further runs. The sweep is
      reproducible: applying the gate's own card pattern to every tracked
      file it scans and matching against the normalised allow list found one
      unlisted value before this change and zero after.
  - warning: >-
      npm run gate:privacy passes on a fixture carrying a real merchant, place
      or person name, because such a string is indistinguishable from an
      invented one. The only thing that catches it is reading the fixture back
      against the real document. A cheap mechanical check exists and was used
      here: parse both real documents in memory through the shipped path and
      test every name-like token of the new fixture against their text,
      printing booleans and counts only.
    evidence: >-
      CORRECTED AND MADE REPRODUCIBLE IN THE FIX ROUND, finding HZ-M3P12-09.
      The original numbers, 27 tokens with 5 overlaps, were produced by an
      uncommitted script whose definition of "name-like" was recorded
      nowhere, so the hazard lane re-running the judgement by its own
      definition got 58 tokens with 23 overlaps and reached the SAME
      conclusion by a different route. Neither pair of numbers was wrong;
      neither was reproducible. The check is now the committed harness
      test/fixtures/measure-fixture-token-overlap.ts, whose header states the
      definition and whose grammar list is a list a reader can argue with:
      the population is every alphabetic run of four or more characters in
      the fixture's descriptions, with the bank's own transaction grammar,
      the card rail's vocabulary and the letterhead subtracted. Command: npx
      tsx test/fixtures/measure-fixture-token-overlap.ts <the two real
      documents>. Output: corpus 39bada64 rows 39, corpus 0f79fa3d rows 22,
      fixture name-like tokens 28, name-like overlap 2. Both overlaps were
      read: one is a four-letter substring of a Dutch transaction verb, the
      other a Dutch category noun. No shop-like, place-like or person-like
      token of the fixture occurs in either document. The harness prints only
      strings drawn from the COMMITTED fixture, never from the corpus, and a
      fast-gate test asserts that.
  - warning: >-
      Fleet warning 1 bites on the very first database command. Ambient
      DATABASE_URL in this container pointed at a foreign pooler host and npx
      prisma migrate status failed P1001 against it before the worktree's own
      .env was pinned into the invoking shell with `set -a; . ./.env; set +a`.
      This worktree had NO .env of its own and one had to be brought in from a
      sibling worktree; .env is gitignored and nothing was committed.
    evidence: >-
      npx prisma migrate status without pinning named a foreign pooler host
      and returned `Error: P1001`. With the pin it named 127.0.0.1:54322 and
      returned `Database schema is up to date!`.
  - warning: >-
      The local supabase stack from an earlier phase survives a dockerd
      restart under its old project name, so `sudo dockerd` alone brought all
      eleven containers back healthy and neither `npx supabase start` nor the
      [edge_runtime] workaround of fleet warning 13 was needed.
      supabase/config.toml was never edited and git diff on it is empty.
    evidence: >-
      sudo docker ps listed supabase_db_m1-p1-skeleton and ten siblings as Up
      and healthy roughly thirty seconds after dockerd started.
