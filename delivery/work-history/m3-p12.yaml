      applied: undefined. After the fix, on the same real database: THREW: no,
      exit: 0, applied: true, twin-outcomes: 1, old rule pattern unchanged:
      true, twin rule pattern unchanged: true, rule row count before 2 after
      2.
    contradicts-plan: false
  - finding: >-
      (l) FIX ROUND TWO, WHAT THE TARGET INTERLOCK REFUSES IN THIS CONTAINER,
      witnessed through the shipped command and with nothing connected. Run
      with no target arguments: exit 3 and the message "no target host was
      given". Run with the AMBIENT connection's own host passed as
      --expect-host, which is what a host-only interlock would have approved,
      and the Pulse project ref as --expect-ref: REFUSED, "the project ref in
      the resolved connection's username is not the ref given on the command
      line". That is the coordinator's scenario exactly: the ambient
      DATABASE_URL in these containers is a different project of the owner's,
