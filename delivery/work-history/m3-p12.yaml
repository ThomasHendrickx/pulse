      test/fixtures/*.pdf test/fixtures/*.csv, summing its per-file
      baseline-singleton-keys, baseline-singleton-rows,
      identity-singleton-keys and identity-singleton-rows. The 16-key
      reduction is entirely the new fixture, which is the only committed
      fixture whose rows share a counterparty account; every other fixture's
      residue is unchanged, which is the honest shape of what this phase does
      to a corpus written before it.
    contradicts-plan: false
  - finding: >-
      (k) FIX ROUND TWO, THE SAME-MERCHANT COLLISION, REPRODUCED BEFORE IT WAS
      FIXED AND AGAINST A REAL DATABASE. Both clean-room lanes found it
      independently. Reproduced here twice. AGAINST THE FAKE, once the fake
      was taught the unique key the schema declares: seeding the D-46 window
      shape, an un-namespaced EXACT rule and a namespaced EXACT rule for ONE
      merchant on one descriptor, the shipped routine printed THREW: Unique
      constraint failed on the fields: (householdId,kind,pattern), calls:
