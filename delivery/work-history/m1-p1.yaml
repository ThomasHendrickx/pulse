kind: work-history
phase: M1-P1
prompt: |
  You are the implementer for phase M1-P1 of the pulse project, dispatched by
  the orchestrator under the Tiphys kernel process.

  READ FIRST, in this order:
  1. Your composed role brief: /home/user/pulse-fleet/implementer-brief-m1-p1.md.
  It is your contract and contains the COMPLETE rendered M1-P1 phase: intent,
  grounding, all 6 steps, all 13 files-to-touch, all 6 acceptance criteria,
  all 3 hazard classes. The plan's binding rule applies: if it is not written
  in the phase, you do not build it.
  2. The project rules: CLAUDE.md at the worktree root, and all three skills
  under .claude/skills/ (pulse-domain, pulse-frontend, pulse-typescript). The
  phase touches app scaffolding, styling, database and tests, so all three
  apply. CLAUDE.md non-negotiables are hard: npm only, English everywhere,
  integer cents, design tokens only (no literal colours/sizes/spacing),
  immutable facts, householdId on every table, no em dashes anywhere.
  3. The full plan for context: delivery/plan/pulse-v1.yaml (your phase is
  M1-P1; do not do later phases' work).

  YOUR WORKTREE: /home/user/pulse-fleet/worktrees/m1-p1-skeleton, on branch
  claude/m1-p1-skeleton, at main (59ad3bc). Work only there.

  ENVIRONMENT FACTS, measured not assumed:
  - Node 22 is the default and fine for the Next.js app itself. For any tiphys
  command: export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh first (kernel needs
  Node 26).
  - Docker daemon is RUNNING (started by the orchestrator). If `supabase
  start` fails to pull images through this container's egress proxy, fall
  back to a plain postgres:16 container via docker compose for local dev and
  record the deviation prominently in your work notes; the charter's
  supabase-start stance then gets verified on the owner's machine.
  - Outbound HTTPS goes through a proxy with CA bundle
  /root/.ccr/ca-bundle.crt already wired into npm. npm installs work
  normally.
  - The repo root package.json currently holds only the @tiphys/kernel
  dependency. Extend it into the real app package.json (keep the exact
  @tiphys/kernel 0.1.0 pin and the private flag); the full npm script set
  CLAUDE.md names must exist and run.
  - gh CLI exists but is NOT authenticated here; do not use it. Do NOT push.
  Do NOT deploy.

  DEPLOY-SCOPED CRITERIA: any part of an acceptance criterion that asserts
  against the DEPLOYED environment (Vercel deployment, deployed database,
  prisma migrate status over the deployed connection string) CANNOT run in
  this worktree. Implement everything those criteria need, verify locally
  what is locally verifiable, and record in your work notes a precise list:
  per criterion, which assertions you executed with their observed output,
  and which are deferred to the deploy-verify stage after merge. Never claim
  a deferred assertion ran (a gate result is scoped to the run that produced
  it). The orchestrator is provisioning Vercel and Supabase in parallel.

  QUALITY BARS, from your brief and the skills: every test you write must be
  able to fail (no vacuous asserts); the fast gate (npm test) and typecheck
  and lint must exit 0 before you finish; the e2e gate must at minimum run
  its scaffold against a locally running app (document what it covers);
  commit messages tell the story; salvaged or generated boilerplate is
  verified, never trusted.

  INCREMENTAL OUTPUT IS MANDATORY: create
  delivery/work-history/m1-p1-notes.md within the first minutes and append as
  you go (commands run, output observed, decisions, deviations). A watchdog
  reads your worktree's newest mtime; 10 quiet minutes reads as death. This
  phase is large; write continuously.

  WHEN DONE:
  1. npm run typecheck && npm run lint && npm test all exit 0 in the
  worktree; capture the tail of each in the work notes.
  2. Commit on your branch in coherent commits (the story, not one blob; no
  model or tool attribution anywhere). Do NOT push.
  3. Final report as plain data: per acceptance criterion 0.1..0.6,
  executed-and-green / executed-and-red / deferred-to-deploy-verify with one
  line of evidence each; the local gate exit codes; any deviation from the
  phase text with its reason; the head commit sha.
