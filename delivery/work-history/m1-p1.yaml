per-step-commits:
  - sha: fcf34ba
    subject: "build: npm script set, strict TypeScript, lint and both test gate configs"
  - sha: ac65915
    subject: "styles: tokens.css becomes the single canonical token source (D-4)"
  - sha: "085e352"
    subject: "feat: application skeleton with Supabase auth and tenancy backbone"
  - sha: 8585c5f
    subject: "test: red-driven fixes to the DMMF fixtures, build artifacts"
key-decisions:
  - decision: >-
      pulse-tokens.css was reduced to the single line `@import "./tokens.css";`
      rather than deleted (D-4 allows either).
    why: >-
      styles/pulse-theme.css, which is outside this phase's files-to-touch,
      carries a comment naming pulse-tokens.css in its documented import
      order; deletion would have made a committed comment false in a file
      this phase is not allowed to correct.
  - decision: >-
      Criterion 0.4c is implemented with the TypeScript compiler API directly
      (ts.createSourceFile plus an AST walk inside the test), not ts-morph.
    why: >-
      The criterion offers either; the compiler API is already a dependency
      through typescript itself, so no new package is added for a dev check.
  - decision: >-
      Module directories src/modules/{accounts,import,ledger,merchants,overview}
      exist as .gitkeep placeholders only; no domain/application/adapters/ui
      subtrees yet.
    why: >-
      The plan's D-6 lands each module's real content with the phase that
      owns it; empty code stubs would be boilerplate nothing verifies. The
      placeholders make the declared layout visible and give the 0.4c
      adapter scan a real root to walk.
  - decision: >-
      supabase CLI installed as a devDependency and `supabase start` run with
      realtime, storage-api, imgproxy, mailpit, postgres-meta, studio,
      edge-runtime, logflare, vector and supavisor excluded.
    why: >-
      The phase needs db, kong, gotrue and postgrest for auth plus Postgres;
      excluding the rest keeps image pulls through the egress proxy small.
      The pulls succeeded, so the postgres:16 fallback the dispatch allowed
      was never needed.
  - decision: >-
      Sign-up creates the household, named after the email local part, inside
      src/platform/auth/household.ts; requireHouseholdContext resolves the
      session to a HouseholdContext once at the boundary.
    why: >-
      One user per household in v1 makes sign-up the household bootstrap; it
      runs before any household context exists, so it is the one platform
      function keyed on the auth user. Everything downstream takes the
      context explicitly (hazard H0.1).
  - decision: >-
      The mechanism index was looked up before implementation as the
      mechanism-lookup clause requires; delivery/tuition/ is empty and no
      mechanism-index.yaml exists anywhere in the worktree or fleet root, so
      the index had no entry for any mechanism this phase touches.
    why: >-
      Recorded because not looking is not an answer; this phase adds no
      claim files, leases, append-only logs, worktree removals or force
      deletes either.
  - decision: >-
      A missing token discovered while styling (--border-hairline) was added
      to styles/tokens.css after the D-4 migration commit, then referenced
      from src/app/globals.css.
    why: >-
      CLAUDE.md non-negotiable 4 and criterion 0.5: later token additions
      land in tokens.css alone, never inline in components.
verification-first:
  - finding: >-
      (a) No tokens.css exists at baseline: `git ls-tree -r c940e4d
      --name-only | grep -i tokens` printed only styles/pulse-tokens.css and
      `find . -name tokens.css -not -path './node_modules/*'` printed
      nothing. The committed token source is styles/pulse-tokens.css plus
      styles/pulse-theme.css, as the phase text states.
    contradicts-plan: false
  - finding: >-
      (b) No npm scripts exist at baseline: `git show c940e4d:package.json`
      printed `fatal: path 'package.json' exists on disk, but not in
      'c940e4d'`, and the wiring-commit package.json at HEAD printed
      `scripts: undefined`.
    contradicts-plan: false
  - finding: >-
      The session shell carries ambient DATABASE_URL, DIRECT_URL and
      Supabase variables pointing at a DEPLOYED Supabase pooler
      (aws-1-eu-north-1.pooler.supabase.com, ref yqpebyihcmounorruwdl, with
      SUPABASE_BUCKET_NAME=hemma-assets-local). Shell env overrides .env for
      Prisma, so the first `prisma migrate dev` tried that host (P1001,
      unreachable, nothing executed against it). All db-touching commands in
      this session were re-run with connection strings pinned to the local
      supabase stack.
    contradicts-plan: false
deviations:
  - plan-clause: >-
      files-to-touch (13 entries; messages/*.json not among them)
    why: >-
      Criterion 0.3 requires sign-up and sign-out flows; the committed
      catalogs carry no copy for either. messages/{en,nl,fr}.json each
      gained exactly two keys (signup, signout), a four-line diff per file,
      EN NL FR order preserved. Raised for a declaration amendment on the
      base branch before the scope audit.
  - plan-clause: >-
      files-to-touch (scaffold support files)
    why: >-
      The scaffold does not run without .gitignore, eslint.config.mjs,
      postcss.config.mjs, next-env.d.ts and supabase/config.toml (plus the
      supabase-generated supabase/.gitignore). All are off-list; listed the
      moment found in the work notes for the same declaration amendment.
  - plan-clause: >-
      Step 6, "deploy to Vercel with the pooled connection string at runtime
      and the direct connection string for migrations", and criterion 0.6
    why: >-
      This worktree holds no Vercel or Supabase deploy credentials and the
      dispatch forbids deploying from here. Everything the deployment needs
      is implemented (build passes; prisma datasource carries url plus
      directUrl; .env.example documents the pooled-versus-direct rule).
      Deferred to the deploy-verify stage after merge.
