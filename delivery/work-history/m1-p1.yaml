claims:
  - id: M1P1-C1
    kind: coverage
    statement: >-
      No literal oklch or hex colour exists under src/ (criterion 0.5 grep).
    settled-by:
      executed-construction:
        command: grep -rE "oklch\(|#[0-9a-fA-F]{3,8}" src/
        exit-code: 1
        output: "(no matches; grep exit 1 is the no-match code the criterion requires)"
  - id: M1P1-C2
    kind: coverage
    statement: >-
      On the token migration commit, styles/tokens.css is byte-identical to
      styles/pulse-tokens.css at baseline c940e4d and pulse-tokens.css is a
      single import line.
    settled-by:
      executed-construction:
        command: git show ac65915:styles/tokens.css | cmp - <(git show c940e4d:styles/pulse-tokens.css); git show ac65915:styles/pulse-tokens.css
        exit-code: 0
        output: "cmp printed nothing (exit 0); pulse-tokens.css content is exactly: @import \"./tokens.css\";"
  - id: M1P1-C3
    kind: coverage
    statement: >-
      The three tenancy mechanisms of criterion 0.4 each turn red on
      violating input: the DMMF householdId checker reports a model with the
      column missing and one with it optional, the money-field checker
      reports Float and Decimal fields, and the adapter analyzer reports two
      structurally different context-free exported functions.
    settled-by:
      executed-construction:
        command: npm test (test/schema/tenancy.test.ts, fixture-mechanism tests)
        exit-code: 0
        output: "7 passed (7); the fixture tests assert violations equal to the expected non-empty lists, so an inert checker reddens the suite"
  - id: M1P1-Q1
    kind: open-question
    statement: >-
      Criterion 0.6 in full, plus the deployed halves of nothing else: which
      of its three assertions pass against the real Vercel and Supabase
      deployment.
    still-open-because: >-
      No deploy credentials exist in this worktree and the dispatch forbids
      deploying from it; the orchestrator provisions Vercel and Supabase in
      parallel. Deploy-verify preconditions recorded: set DATABASE_URL to
      the pooled string and DIRECT_URL to the direct string, and disable (or
      auto-confirm) email confirmation in the deployed Supabase project, or
      the sign-up flow of test/e2e/auth.spec.ts will stall on a confirmation
      mail the spec never reads.
  - id: M1P1-Q2
    kind: open-question
    statement: >-
      The committed catalog key signinFoot promises "It never connects to
      your bank", which the pulse-frontend skill's copy rules forbid as a
      trust claim the roadmap breaks.
    still-open-because: >-
      The catalogs belong to M1-P5's files-to-touch; the skeleton simply
      does not render signinFoot. Raised for the orchestrator to route to
      the copy phase.
environment-warnings:
  - warning: >-
      Ambient DATABASE_URL, DIRECT_URL, E2E_DATABASE_URL and Supabase
      variables in this fleet environment point at a deployed Supabase
      project that is not pulse's; shell env overrides .env for Prisma and
      Next. Pin connection strings explicitly on every db-touching command
      in every phase.
    evidence: >-
      First `prisma migrate dev` printed "Datasource db: PostgreSQL database
      postgres, schema public at aws-1-eu-north-1.pooler.supabase.com:5432"
      then P1001; env shows SUPABASE_BUCKET_NAME=hemma-assets-local.
  - warning: >-
      npm 11.19 blocks dependency install scripts until approved; a fresh
      install needs the committed allowScripts block in package.json, and
      adding a dependency with an install script means approving it again.
    evidence: >-
      npm install printed "8 packages have install scripts not yet covered
      by allowScripts"; prisma engines and esbuild were inert until `npm
      install-scripts approve`.
  - warning: >-
      Prisma 6.19 refuses `migrate reset` from an AI agent without
      PRISMA_USER_CONSENT_FOR_DANGEROUS_AI_ACTION; humans running npm run
      db:reset do not hit it.
    evidence: >-
      First db:reset run printed the consent-demand text and exited 1; the
      target was verified as the session-local docker db before re-running
      with the variable set.
  - warning: >-
      `supabase start` succeeds through the egress proxy for container
      images, but its edge-runtime migrations-catalog helper fails TLS to
      registry.npmjs.org (UnknownIssuer) and prints a scary-looking warning;
      the stack still comes up healthy and exits 0.
    evidence: >-
      supabase-start.log carries "failed to cache migrations catalog ...
      invalid peer certificate: UnknownIssuer" followed by the started
      services and EXIT=0.
  - warning: >-
      Next.js infers the workspace root from the OUTER
      /home/user/pulse-fleet/package-lock.json when run inside this
      worktree and warns about multiple lockfiles; harmless locally, but a
      future phase silencing it should set outputFileTracingRoot rather
      than deleting a lockfile it does not own.
    evidence: >-
      npm run test:e2e webServer output: "Next.js inferred your workspace
      root ... selected the directory of /home/user/pulse-fleet/package-lock.json".
