fix-round:
  - mechanism: >-
      A redirect emitted from inside the guarded region toward a page the
      middleware bounces straight back, with the only recovery control
      rendered behind the guard that redirects first (auth live-lock,
      findings CR-001 in both verdicts). Fixed on both arms: the boundary
      destroys the broken half-session before redirecting, and a failed
      household create after signUp signs the fresh session out.
    derivation:
      command: grep -rn "redirect(" src/
      output: |
        src/middleware.ts:44:    return NextResponse.redirect(target);
        src/middleware.ts:50:    return NextResponse.redirect(target);
        src/platform/auth/context.ts:17:    redirect("/sign-in");
        src/platform/auth/context.ts:31:    redirect("/sign-in?status=incomplete-signup");
        src/platform/auth/actions.ts:22:    redirect("/sign-up?status=signup-failed");
        src/platform/auth/actions.ts:28:    redirect("/sign-up?status=signup-failed");
        src/platform/auth/actions.ts:44:    redirect("/sign-up?status=signup-failed");
        src/platform/auth/actions.ts:51:    redirect("/sign-in?status=confirm-email");
        src/platform/auth/actions.ts:54:    redirect("/");
        src/platform/auth/actions.ts:61:    redirect("/sign-in?status=signin-failed");
        src/platform/auth/actions.ts:67:    redirect("/sign-in?status=signin-failed");
        src/platform/auth/actions.ts:70:    redirect("/");
        src/platform/auth/actions.ts:76:    redirect("/sign-in");
    not-covered: >-
      The derivation enumerates redirect call sites under src/ only; no
      other directory ships routing code today. It reasons over the two
      middleware bounce rules by reading; a future third bounce rule in the
      middleware would need the same walk again, and the e2e witness (the
      orphan-user spec) is what reddens if any future pair recreates the
      loop. Client-side navigation loops that involve no redirect() call are
      outside this derivation.
  - mechanism: >-
      A destructive command resolving its target from ambient environment
      with no interlock (finding CR-002, hazard verdict). Fixed with a
      fail-closed host guard run by every destructive db script before
      prisma, override only via PULSE_ALLOW_REMOTE_DB_DESTRUCTION=1.
    derivation:
      command: grep -n "prisma migrate\|prisma db\|migrate reset" package.json
      output: |
        13:    "db:reset": "tsx src/platform/db/guard-cli.ts && prisma migrate reset --force",
        14:    "db:migrate": "tsx src/platform/db/guard-cli.ts && prisma migrate dev"
    not-covered: >-
      The derivation covers npm scripts in package.json; no other script
      files exist in the repository today and no raw SQL entry point exists.
      A developer invoking npx prisma migrate reset directly bypasses the
      guard by construction; the guard.ts header carries the sibling note
      obliging future destructive entry points to route through it, and the
      repository has no project-level gates.manifest.json to register the
      command in (only the vendored kernel copy under node_modules), which
      is recorded for the orchestrator.
  - mechanism: >-
      A static gate that silently passes what it cannot classify, fail open
      by shape and by membership (findings CR-003 hazard, CR-002 criteria).
      Fixed by inverting the default: a db-client import is what holds a
      file to the repository rule wherever it lives, and every export shape
      the analyzer cannot positively verify is a violation.
    derivation:
      command: npx tsx .probe-tmp/old-analyzer-probe.ts (old analyzer extracted verbatim from git HEAD f3dfdff, run against the reviewer shapes)
      output: |
        object-literal violations: []
        cache-wrapped violations: []
        export-list violations: []
        class-repo violations: []
    not-covered: >-
      Stated in the corrected src/platform/tenancy.ts comment: call sites
      are not analyzed, and a repository that receives its database client
      by injection from a file whose name does not contain repository
      escapes the trigger; both remain review territory. Dynamic import()
      of the db client is likewise outside the import-declaration scan.
  - mechanism: >-
      Failure collapsed into the success path: every auth failure redirected
      to the same bare form (finding CR-004, hazard verdict). Fixed with
      whitelisted status parameters rendered as localized lines.
    derivation:
      command: grep -n "redirect(\"/sign" src/platform/auth/actions.ts src/platform/auth/context.ts
      output: |
        src/platform/auth/actions.ts:22:    redirect("/sign-up?status=signup-failed");
        src/platform/auth/actions.ts:28:    redirect("/sign-up?status=signup-failed");
        src/platform/auth/actions.ts:44:    redirect("/sign-up?status=signup-failed");
        src/platform/auth/actions.ts:51:    redirect("/sign-in?status=confirm-email");
        src/platform/auth/actions.ts:61:    redirect("/sign-in?status=signin-failed");
        src/platform/auth/actions.ts:67:    redirect("/sign-in?status=signin-failed");
        src/platform/auth/context.ts:31:    redirect("/sign-in?status=incomplete-signup");
    not-covered: >-
      signOutAction still redirects to a bare /sign-in, which is the
      success path of sign-out and carries no failure to surface. Supabase
      error CODES are not differentiated further (wrong password versus
      rate limit render the same line); slice 0 scope, recorded for the
      copy phase.
  - mechanism: >-
      A seed writing a row whose owning identity does not exist (finding
      CR-005, hazard verdict), arming the live-lock collision locally.
      Fixed by seeding the household only when no auth identity can be
      created, and saying so.
    derivation:
      command: grep -n "prisma.user" prisma/seed.ts
      output: |
        75:  await prisma.user.upsert({
    not-covered: >-
      The derivation shows the single users write in the seed, now behind
      the authUserId null check at prisma/seed.ts:66-71; other writers of
      users rows (signUpAction) create the auth identity first by
      construction. Seeds added by later phases are the sibling handoff.
