      executed-construction:
        command: git show ac65915:styles/tokens.css | cmp - <(git show c940e4d:styles/pulse-tokens.css); git show ac65915:styles/pulse-tokens.css
        exit-code: 0
        output: "cmp printed nothing (exit 0); pulse-tokens.css content is exactly: @import \"./tokens.css\";"
  - id: M1P1-C3
    kind: coverage
    statement: >-
      The three tenancy mechanisms of criterion 0.4 each turn red on
      violating input: the DMMF householdId checker reports a model with the
      column missing and one with it optional, the money-field checker
      reports Float and Decimal fields, and the adapter analyzer reports two
      structurally different context-free exported functions.
    settled-by:
      executed-construction:
        command: npm test (test/schema/tenancy.test.ts, fixture-mechanism tests)
        exit-code: 0
        output: "7 passed (7); the fixture tests assert violations equal to the expected non-empty lists, so an inert checker reddens the suite"
  - id: M1P1-C4
    kind: coverage
    statement: >-
      The destructive-db guard refuses this fleet's real ambient foreign
      environment before prisma runs, and the refusal is wired through the
      npm script, not only the pure function.
    settled-by:
      executed-construction:
        command: npm run db:reset (run WITHOUT pinning, under the session's ambient env carrying the foreign pooler)
        exit-code: 1
        output: 'db guard: DATABASE_URL points at non-local host "aws-1-eu-north-1.pooler.supabase.com"; refusing to run a destructive database command against it. Set PULSE_ALLOW_REMOTE_DB_DESTRUCTION=1 only for a deliberate remote reset.'
  - id: M1P1-C5
    kind: coverage
    statement: >-
      Both fix-round e2e witnesses red on the unfixed app and green after
      the fix, and the pre-fix analyzer passes all four reviewer shapes
      silently while the rewritten one flags each.
    settled-by:
      executed-construction:
        command: npx playwright test --grep "wrong password|recovers to sign-in" (at f3dfdff, before the fix); npx tsx .probe-tmp/old-analyzer-probe.ts; npm run test:e2e (after the fix)
        exit-code: 0
        output: "pre-fix e2e: exit 1, 2 failed; old-analyzer probe: object-literal/cache-wrapped/export-list/class-repo all violations: []; post-fix e2e: exit 0, 3 passed (24.6s)"
  - id: M1P1-Q1
    kind: open-question
    statement: >-
      Criterion 0.6 in full, plus the deployed halves of nothing else: which
      of its three assertions pass against the real Vercel and Supabase
      deployment.
    still-open-because: >-
      No deploy credentials exist in this worktree and the dispatch forbids
      deploying from it; the orchestrator provisions Vercel and Supabase in
      parallel. Deploy-verify preconditions recorded: set DATABASE_URL to
      the pooled string and DIRECT_URL to the direct string, and disable (or
      auto-confirm) email confirmation in the deployed Supabase project, or
      the sign-up flow of test/e2e/auth.spec.ts will stall on a confirmation
      mail the spec never reads.
  - id: M1P1-Q2
