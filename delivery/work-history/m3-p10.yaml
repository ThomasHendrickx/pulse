          A standalone Playwright script run from /home/user/wt-m3p10 against
          the same delayed development server, with this phase's leaf replaced
          by the plain server-rendered button it replaces on two structurally
          different controls (a form with one control and a file input; a form
          rendered once per unresolved row). Not committed; the tree was
          restored and typecheck and lint re-run clean afterwards.
        exit-code: 0
        output: >-
          CONTROL RUN A (upload submit, plain server-rendered button):
          {"clickAt":847.6,"firstAt":null,"kind":null,"discarded":4} requests 1
          CONTROL RUN B (merchant naming submit, plain server-rendered button):
          {"clickAt":1156.4,"firstAt":null,"kind":null,"discarded":4} requests 1
          No surviving record within 2000 milliseconds of the click on either,
          while the route handler still counted the request, so the press did
          submit and the screen did nothing. discarded 4 on both is the
          observer's filter doing work: records DID arrive inside the form and
          every one of them was outside the pressed control's subtree.
