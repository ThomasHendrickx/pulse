  - id: M3P10-C6
    kind: universal
    statement: >-
      For each of the eight submit controls other than the merchant naming
      submit, the collection of every data-testid on screen and its trimmed
      text is identical immediately before the press and one second after it
      while the server is still held, so this phase predicts nothing.
    settled-by:
      counter-experiment: >-
        The spec captures both collections itself and compares them by deep
        equality per control, so a control that renders a predicted value
        turns the run red rather than being argued about. The measurement is
        real rather than vacuous because the SAME collection call, on the same
        controls, is what the pressed control's own busy state does NOT show
        up in: the busy mark is a pseudo-element and carries no testid, which
        is why nothing has to be exempted by name and why a predicted merchant
        name WOULD show up. The refuting experiment would be to render any
        predicted text before the response is released; a grep for
        useOptimistic over src/ exits 1, so no such render exists to try.
  - id: M3P10-C7
    kind: open-question
    statement: >-
      Criterion 10.9(b), the whole-worktree grep for probes built from the
      real statements, is NOT WITNESSED by this phase.
    still-open-because: >-
      The real uploads are present in this container but this agent's
      environment refused to read them, so the probe set could not be built
      here. The weaker check that was run, a shape grep over every added line
      of the phase diff for identifier, card-number, thousands-form amount and
      date shapes, returned 0 hits over 1296 added lines and exits 1; it does
      not see a merchant name or a place name, which is precisely the hole
      fleet warning 12 records. Someone with permission to read the uploads
      should build the probes and grep this branch.
  - id: M3P10-C8
    kind: open-question
    statement: >-
      Criterion 10.6(a) and 10.6(b) are UNMET at the letter and this phase did
      not make them met.
    still-open-because: >-
      Four files carry the client directive at the final tree, one of them
      under a module's ui directory: src/modules/accounts/ui/account-setup-form.tsx,
      which M3-P14 shipped before this phase started and which criterion 14.3
      depends on. Removing it is a redesign of another phase's screen. The
      substance the two halves exist to protect is met and is now enforced
      over all four files by the closure walk in the fast gate. Whether the
      criterion should be amended to name the accounts island, or the island
      should be reshaped, is a question for the plan rather than for this
      branch.
  - id: M3P10-C9
    kind: open-question
    statement: >-
      The one surface where a busy state can appear and clear without the
      document being replaced is the accounts setup island on a REFUSED
      submission, and no minimum visible duration guards it.
    still-open-because: >-
      Every server action in the product ends in redirect(), so on every other
      surface the busy control is replaced rather than returning to rest in
      place. That island calls its action inside a transition and re-renders
      the same form when the submission is refused, so a very fast refusal
      would show the busy state briefly and clear it. A validation round trip
      is not a 40 millisecond no-op, so this was left as it is rather than
      answered with a timer that would hold a busy state on screen after the
      work was done; it is recorded so the next reader can decide with the
      trade-off in front of them rather than discovering it.
fix-round:
  # ROUND ONE against the retrospective clean-room HAZARD verdict
  # delivery/review/m3-p10-hazard.yaml on claude/m3-p10-rev-haz at e64e1fc.
  # The phase was merged and deployed with no review of any kind on record,
  # so five of the seven findings were live in production while this round
  # ran. Branch claude/m3-p10-busy-state-fix, off origin/main at 1ed44c3,
  # which has moved on from the head the review read (e499d64): M3-P11
  # landed in between and the leaf, the stylesheet and the naming row all
  # changed under the findings. Every finding was re-witnessed at THIS head
  # before anything was edited, in a real chromium driving the head's own
  # stylesheet through page.setContent, which needs no server and no Docker,
  # and each was re-measured the same way afterwards.
  - mechanism: >-
      HZ-M3P10-01. THE MECHANISM IS TWO STATES SHARING ONE ELEMENT AND THE
      CASCADE, NOT THE READER, DECIDING WHICH ONE IS DRAWN. The leaf set the
      disabled attribute and aria-busy on the same button; the stylesheet
      declares those as two appearances with two different meanings; and the
      disabled selectors carry an element name, so at (0,1,1) they outranked
      the busy rule at (0,1,0) on every property the two share. The busy
      appearance the stylesheet designed was unreachable through the shipped
      leaf, and what the owner actually saw on a press was the product's own
      vocabulary for UNAVAILABLE. The second half is the same mechanism one
      layer down: the mark inherited currentColor, which had become the
      disabled ink, inside a box painted at 0.55, and then faded ITSELF to a
      quarter of that for most of its loop. Three edits, each aimed at the
      mechanism rather than at the symptom. Every rule that draws the
      disabled appearance is scoped away from a control that is marked busy,
      through :where(:not([aria-busy="true"])) so the weights M3-P9 tuned are
      unchanged and only the scope narrows; the one disabled rule NOT scoped
      is the pointer-events refusal, which must still reach a busy control
      because it is what refuses a second pointer activation. The mark takes
      its colour from a new token rather than from whatever ink it inherits,
      and the four submit controls whose surface is the inverse one redeclare
      that token beside their own colours. The loop pulses the mark's SIZE
      instead of its opacity, so the contrast holds for the whole cycle
      rather than only at the peak, and the mark is visible where the loop is
      refused, which matters because under reduced motion the cycle duration
      is zero and an animation of zero duration does not run.
    derivation:
      command: >-
        A chromium probe over this head's own tokens.css and globals.css
        through page.setContent, on a button carrying the shipped
        .merchant-name-button class, reading computed style for the control
        and its ::after and compositing both over the page through a canvas
        2D context (the stylesheet's colours are oklch, so a canvas is what
        resolves them to what the screen shows). Run at the head before any
        edit and again after, plus a sweep of the same measurement over all
        ten control classes that can become busy.
      output: >-
        RED, at the unedited head, reproducing the review's numbers exactly:
        busy control opacity 0.55, cursor default, background
        --color-surface-disabled, colour --color-ink-disabled, identical to
        the same control merely disabled; page rgb(252,250,247), control as
        painted rgb(236,236,237), mark rgb(227,227,228) at the loop's low
        point and rgb(199,199,201) at its peak, CONTRAST 1.09 TO 1 AND 1.43
        TO 1 against a 3 to 1 floor. GREEN, after the three edits: the same
        control busy computes opacity 0.7, cursor progress, its OWN
        background and its own ink, which is the busy appearance the
        stylesheet designed; the mark measures CONTRAST 6.10 TO 1 for the
        whole cycle. The sweep over every control class that can become busy:
        auth-submit, import-primary, account-setup-submit and
        merchant-name-button 6.10; accounts-ring-switch 6.28; app-signout
        6.10; month-nav 6.28; unresolved-pill, nav-link and empty-state-link
        6.10. All ten were below the floor before the mark's colour became a
        token: the four dark ones at 1.09 through 1.43 as shipped, and the
        light ones could not reach 3 to 1 at any opacity because their
        inherited ink is the link colour and it tops out at 2.96 once the
        busy state's own 0.7 has faded it.
    not-covered: >-
      The measurement is a COMPOSITE COMPUTED FROM COMPUTED STYLE, not a
      screenshot: it resolves each colour through a canvas and blends the
      mark over the control and the control over the page exactly as the
      stylesheet stacks them, which is the same method the review used and
      the reason its numbers reproduced to the digit. It does not read
      pixels off a rendered frame, so a compositing effect no rule declares
      (a filter, a blend mode, a backdrop) would be invisible to it; the
      stylesheet declares none today. The sweep renders each control class in
      isolation, so a control that inherits a background from an ancestor
      panel would be measured against the page instead: the ten classes
      measured all declare their own background or are transparent over the
      page. Not measured in a browser driving the real product: no Docker
      here, so test:e2e could not run, and the assertion that pins this
      (dressedAsDisabled false and markContrast at or above 3, per control,
      inside the existing 1000ms window) is written and unexecuted.
  - mechanism: >-
      HZ-M3P10-02. THE MECHANISM IS A REFUSAL EXPRESSED WITH AN ATTRIBUTE
      THAT ALSO REMOVES THE ELEMENT FROM THE TAB ORDER. Every submit control
      set the native disabled attribute on the element that had just been
      activated, and a focused element that becomes disabled is dropped by
      the browser, which moves focus to the document body. Nothing put it
      back, so the acknowledgement this phase exists to deliver was, on the
      keyboard and assistive-technology path, the exact opposite: aria-busy
      on an unfocused control is announced to nobody. The fix is the split
      M3-P9's own stylesheet comment describes and hands to this phase:
      aria-disabled marks the refusal and keeps the element focusable, the
      stylesheet's pointer-events rule refuses the pointer, and a handler
      refuses the keyboard, because an aria-disabled submit button is still
      activated by Enter and Space and pointer-events cannot reach either.
      Both submit surfaces changed, the shared leaf and the accounts setup
      form, because the mechanism is in both.
    derivation:
      command: >-
        A chromium probe over a real form carrying both shapes: the shipped
        one (focus the control, then set disabled, the way React does on a
        press) and the fixed one (focus the control, then set aria-busy and
        aria-disabled), reading document.activeElement across the change;
        then, on the fixed shape while busy, a real Enter, a real Space and a
        forced pointer click, counting submit events on the form.
      output: >-
        RED, the shipped shape: activeElement before the change is the
        control, after it is BODY, and the control is no longer tabbable.
        GREEN, the fixed shape: activeElement before and after the change is
        the same control and it is still tabbable. The refusal holds on both
        paths: submit events on the form stayed 0 across Enter, Space and a
        forced pointer click while the control was busy, and when the busy
        window closed the control was pressable again with pointer events
        back to auto. Fast gate 702 passed, typecheck 0, lint 0.
    not-covered: >-
      The probe drives the ATTRIBUTE TRANSITION the leaf performs, not React
      performing it, so it says the browser keeps focus across that change
      and nothing about whether a revalidation that re-renders the row keeps
      the same element. That is the case the e2e assertion covers (focus read
      immediately after the press, before the spec's own forced second press,
      which lands on whatever sits under a control that refuses the pointer
      and moves focus by itself), and it is unexecuted here. One behaviour is
      knowingly changed and not a regression to hide: a pointer tap on a busy
      control now lands on the element beneath it, so a pointer user's focus
      moves, exactly as it does when they tap anywhere else; the keyboard
      user, who is who the finding is about, keeps their place. The cursor is
      the other cost: pointer-events none means the progress cursor the busy
      rule sets is not painted, which is already true of every aria-disabled
      control in the product and is why the mark, not the cursor, is the
      state's carrier.
  - mechanism: >-
      HZ-M3P10-04. THE MECHANISM IS A VISIBLE STATE DRIVEN BY A PROMISE WHOSE
      REJECTION PATH IS UNWRITTEN. The one submit outside the shared leaf ties
      aria-busy and its refusal to a transition that awaited a server action
      with no catch, so a call that REJECTED rather than returning a typed
      refusal never reached setState, and whether the busy state ended was
      the framework's business rather than the file's. On the owner's phone
      that is a connection dropped mid-submit. THE FIX IS CATCH AND SURFACE,
      NOT A BOUNDARY, and the reason is the criterion the screen already
      carries: a route-level error boundary replaces the whole screen, and
      criterion 14.3 exists because a refused submission must leave the other
      rows exactly as they were typed. A boundary would discard them at the
      moment the owner most needs them. Catching inside the transition also
      settles the finding by CONSTRUCTION rather than by behaviour: both
      branches end the transition, so the busy state clears either way. A
      redirect is how this action reports success and the framework signals
      it by throwing, so a redirect is re-thrown rather than reported as a
      failure. The new sentence is a client observation ("the connection did
      not complete"), not a server claim, in English, Dutch and French with
      English written first.
    derivation:
      command: >-
        Read of src/modules/accounts/ui/account-setup-form.tsx and
        src/modules/accounts/ui/actions.ts (the transition, the state type
        and the redirect that ends the action), then find over src/app for
        error.tsx, global-error.tsx and loading.tsx, then npm test and npm
        run build with the database env pinned to an invented localhost.
      output: >-
        The boundary search returns nothing, at this head as at the reviewed
        one, so there is nowhere for a rejection to land and the finding's
        premise holds. After the fix: the transition has both branches, the
        transport failure is a variant of the FORM's state and not of the
        action's contract (the action reports what the server can say; a
        submission that never arrived is the client's knowledge), the
        catalogues carry one new key each with equal key sets, fast gate 702
        passed including the catalogue parity test, npm run build exit 0.
    not-covered: >-
      NOT WITNESSED AS A BEHAVIOUR, and this is the finding's own position
      too: the review could not observe what React does with a rejected async
      transition here either. What is claimed is that both branches are now
      written, which is checkable by reading, and that the fast gate and the
      production build are green over it. What is owed is the test the
      finding asks for, a press with the action made to reject and an
      assertion that the control comes back within a bounded window; it needs
      either the e2e suite (no Docker here) or a DOM test environment this
      repository deliberately does not carry (no jsdom, no testing-library,
      and adding one is a dependency this round will not add for one case).
      The fast gate pins the SHAPE instead, which is weaker and is named as
      such. The other error boundary question is untouched and still open:
      src/app has no error.tsx anywhere, and this round did not add one,
      because a boundary is a product-wide decision about what a broken
      screen looks like and it is not this fix round's to take.
  - mechanism: >-
      HZ-M3P10-03. THE MECHANISM IS AN ASSERTION PLACED WHERE ITS SUBJECT
      CANNOT EXIST. The only assertion that the busy state clears sat at the
      very end of the nine-press journey, immediately after the sign-in
      press, whose action redirects: by the time it evaluated, the document
      had been replaced and held no control that had ever been pressed, so it
      passed whatever the leaf did. The central promise of the phase was
      unmeasured for all nine controls, and unmeasured precisely on the two
      that revalidate in place rather than navigating away, which are the
      only ones where a stuck busy state would strand the owner. The reading
      moved into the per-control measurement: after THIS control's own
      delayed response is released, the pressed control is read again (gone
      is a pass, because the response navigated), and the document-wide count
      of busy elements is read with it. The naming loop, which walks five
      rows, additionally asserts that the NEXT row's freshly rendered control
      is pressable and carries no busy mark, which is the revalidate-in-place
