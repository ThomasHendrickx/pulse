  - id: M3P10-C5
    kind: remedy
    statement: >-
      The closure walk follows a multi-line import, which it did not on its
      first version.
    settled-by:
      executed-construction:
        command: >-
          npx vitest run test/app/client-boundary.test.ts against the first
          version of the walk, whose specifier pattern was bounded by
          [^\n;]*? and therefore matched only single-line imports.
        exit-code: 1
