      test/app/client-boundary.test.ts, which criterion 10.6(e) requires to
      run in the FAST gate and therefore cannot live under test/e2e. The two
      criteria are read together here rather than one being chosen over the
      other.

      FIX ROUND: THIS PIN IS DELIBERATELY BROKEN AND IS NOT PRETENDED TO
      HOLD. The round edits src/app/globals.css and styles/tokens.css, adds
      one message key to the three catalogues and the one line that resolves
