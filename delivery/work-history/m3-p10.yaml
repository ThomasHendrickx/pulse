prompt: |
  You are the tiphys IMPLEMENTER for Pulse phase M3-P10, the busy state. Work
  only in the worktree /home/user/wt-m3p10 (branch `claude/m3-p10-busy-state`,
  branched from main at 8d99dfd). Never touch /home/user/pulse or any other
  worktree.

  Read your brief first, in full, and follow it exactly:
  /tmp/.../briefs/impl-m3p10.md

  Read the phase M3-P10 in delivery/plan/pulse-v02.yaml. Read the skills this
  touches: `.claude/skills/pulse-frontend`, `.claude/skills/pulse-typescript`.
  Read CLAUDE.md.

  THIS IS THE OWNER'S OWN FEEDBACK, TWICE OVER. First they said: "the total
  lack of feedback I get when I press something, buttons don't feel like
  buttons, and after pressing, nothing happens in the UI until the full server
  cycle comes back." Phase M3-P9 answered the first half, the press itself, and
  shipped. The owner then tested the deployed result and said:

    "I still don't see a loading or 'being busy loading' animation or
    something. I see the button press interaction, then nothing, and then the
    new state gets loaded after 500ms to 1s."

  So this phase is the gap between the press ending and the server answering.
  It is the second half of a complaint the owner has now made twice, about a
  product they are trying to use. Judge your work by whether that gap is
  visibly filled on a phone, not by whether the criteria are green.

  ONE THING THE PLAN CANNOT KNOW, and you must handle it as a recorded
  deviation rather than a question. The phase says "all seven submit controls".
  That count was written before phase M3-P14 merged, which shipped a new
  accounts setup screen at src/app/(app)/accounts with its own submit controls,
  and M3-P14's implementer explicitly recorded that those controls fall outside
  the pressed-feedback control set. Enumerate the submit controls that actually
  exist at your branch head, cover all of them with the shared busy leaf, and
  record the difference from the plan's seven in your work history as a plan
  deviation with the reason. Do not leave the newest screen in the product as
  the one place a press still goes quiet.

  WHAT MATTERS MOST, in order:
  1. The change is VISIBLE on a phone within the gap it is meant to fill, which
     the owner measured at 500ms to 1s. A busy state that appears after 800ms
     has not fixed anything. Whatever you build, prove when it becomes visible,
     and prove it on the `chromium-phone` Playwright project, because the
     complaint came from a phone.
  2. It must not flash. A control that shows a busy state for 40ms on a fast
     action reads as a glitch. If the plan does not settle that, settle it and
     record what you chose and why.
  3. Every user-facing string needs English, Dutch and French.

  HOUSE RULES, NON-NEGOTIABLE. npm only. English everywhere. Design tokens
  only. Amounts are integer cents, householdId on every table and query. No em
  dashes. No data in a commit message. Scope discipline: DR-0025 and DR-0026
  are M3-P11, not this one.

  GATES, all of which must exit 0 before you report done:
    npm run typecheck && npm run lint && npm test && npm run gate:tokens && npm run gate:privacy
  then npm run test:e2e. Quote each summary line and exit code.

  WRITE THE WORK HISTORY the brief specifies, with the red witness for the busy
  state and every plan deviation recorded. Commit on
  `claude/m3-p10-busy-state` and push.

  PACE: build the criteria, cover every control that exists, stop there.

  REPORT BACK: criteria met out of total, the measured time from press to the
  busy state becoming visible on the phone project, the control count you
  covered against the plan's seven, each gate's exit code, anything you could
  not meet and why, and the pushed sha.
