environment-warnings:
  - warning: >-
      THE WORKTREE ARRIVED WITH NO node_modules AND NO .env, unlike the M3-P9
      dispatch which said node_modules was symlinked. Both had to be created
      before anything could run: npm ci (about a gigabyte), and a local .env
      pinning the five values fleet warning 6 names. .env is gitignored and
      was not committed.
    evidence: >-
      `ls node_modules` printed nothing; `ls -a | grep env` returned only
      .env.example and next-env.d.ts.
  - warning: >-
      package.json declares engines node 22.x and the container's nvm default
      is Node 26, so `. /opt/nvm/nvm.sh` selects an interpreter npm warns
      about (EBADENGINE) for every project command. /opt/node22/bin/node is
      present and is what every npm, next and playwright command in this phase
      ran under; nvm's Node 26 is for tiphys only. This is fleet warning 1 in
      its "more than one toolchain" form and it is worth stating with the
      path, because the two shells look identical from the outside.
    evidence: >-
      `npm ci` under Node 26 printed "npm warn EBADENGINE required: { node:
      '22.x' } current: { node: 'v26.8.0-alpha.0.0.0' }"; `export
      PATH=/opt/node22/bin:$PATH && node -v` prints v22.22.2.
  - warning: >-
      `pkill -f "playwright test"` KILLS THE SHELL THAT RUNS IT, because that
      shell's own command line contains the pattern. The failure looks like an
      unexplained exit 144 from a command that did nothing. Use a pattern the
      invoking command line does not match, for example
      `pkill -f "playwright[ ]test"`.
    evidence: >-
      Two consecutive invocations returned exit 144 with no output and the
      backgrounded command they were chained with never started.
  - warning: >-
      A PLAYWRIGHT ROUTE HANDLER THAT HOLDS A REQUEST OUTLIVES THE TEST
      TIMEOUT. A first run of this phase's spec sat for more than fourteen
      minutes against a five minute per-test timeout: a locator click that
      did not succeed was waiting inside a test whose route handler was
      holding requests, and neither the timeout nor the reporter produced a
      line. The diagnosis came from the DEV SERVER's request log rather than
      from Playwright, which is where to look first for this shape.
    evidence: >-
      run1 printed only "Running 1 test using 1 worker" for the whole run;
      the dev server log's last line was the GET that rendered the screen the
      run was stuck on.
  - warning: >-
      A SUBMIT CONTROL SHARING A FORM WITH A REQUIRED FIELD SENDS NOTHING WHEN
      THAT FIELD IS EMPTY, and therefore shows no busy state, correctly. A
      spec that presses such a control before filling the field measures a
      press that never submitted and reads it as a missing feature. Fill the
      required fields first, or measure a control whose form has none.
    evidence: >-
      The preview-again control recorded requests 0 and no DOM change while
      every other control in the same run recorded requests 1 and 4 to 9
      milliseconds.
