claims:
  - id: M3P10-C1
    kind: coverage
    statement: >-
      Every submit control that exists in the product at this branch head is
      covered by the busy state, and each of the nine was measured under a
      2000 millisecond server delay for its interval, its state at one second,
      its request count under a double press and the stability of everything
      else on screen.
    settled-by:
      executed-construction:
        command: >-
          export PATH=/opt/node22/bin:$PATH && cd /home/user/wt-m3p10 &&
          set -a; . ./.env; set +a && npm run test:e2e
        exit-code: 0
        output: >-
          "1 skipped, 89 passed (23.1m)", exit 0, at the committed head
          c5ab8be, under all four projects including the new
          chromium-phone-prod one. The one skipped test is M3-P9's touch
          measurement under the desktop project, which skips itself where
          hasTouch is not set and runs under chromium-phone. THE SET
          ASSERTION the spec makes before it measures anything is
          expect(results.map(r => r.name)).toEqual([...nine names...]), which
          fails on a missing control and on an extra one alike. The
          chromium-phone-prod numbers, which are the build the owner presses,
          verbatim from the run: sign-up 4.80ms, register accounts 3.10ms,
          ring switch 2.30ms, upload 3.60ms, preview-again 3.10ms, confirm
          3.20ms, merchant naming 2.30ms, sign-out 2.40ms, sign-in 2.60ms;
          every one kind attributes:disabled on the pressed control,
          appearanceChanged true, requests 1 after two presses 100ms apart,
          response released 2027 to 2055ms after the click, aria-busy true and
          not pressable and mark drawn at 1000ms, and every data-testid and
          its trimmed text identical before the press and one second into it.
          The same nine under chromium (desktop, development) 3.80 to 9.70ms
          and under chromium-phone (development) 3.90 to 10.00ms. The merchant
          naming median over FIVE DIFFERENT rows: 2.2ms under
          chromium-phone-prod, 4.4ms under both development projects. The nine
          navigating controls take the marker branch in BOTH the production
          and the development run, so no control has a pending state only in
          the environment nobody uses.
  - id: M3P10-C2
    kind: remedy
    statement: >-
      The interval measurement is capable of failing, and the numbers it
      reports are caused by this phase's leaf rather than by an unrelated
      mutation.
    settled-by:
      executed-construction:
        command: >-
          A standalone Playwright script run from /home/user/wt-m3p10 against
          the same delayed development server, with this phase's leaf replaced
          by the plain server-rendered button it replaces on two structurally
          different controls (a form with one control and a file input; a form
          rendered once per unresolved row). Not committed; the tree was
          restored and typecheck and lint re-run clean afterwards.
        exit-code: 0
        output: >-
          CONTROL RUN A (upload submit, plain server-rendered button):
