      fast-gate file, test/app/busy-state.test.ts. Every one of those is
      outside what 10.7 allows the merged phase to touch. THE REASON IS THAT
      THE DEFECT IS IN THE STYLESHEET: finding HZ-M3P10-01 is a cascade
      collision between the disabled rules and the busy rule, and there is no
