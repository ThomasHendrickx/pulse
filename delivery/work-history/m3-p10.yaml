key-decisions:
  - decision: >-
      The busy state is FORM-WIDE: while a form is in flight every submit
      control in it carries aria-busy and none of them is pressable.
    why: >-
      Criterion 10.3 allows either answer and forbids guessing, so the
      question was measured rather than assumed. Reading useFormStatus out of
      both leaves of the one two-control form during a real press shows that
      attribution is available in ONE direction only: the control that
      overrides its form's action recognises its own submission by comparing
      status.action with the action it was handed (identical true), and the
      control that does not override has no action of its own to compare with
      (identical false). Attributing the second one would mean threading the
      form's own action into every leaf as a prop that a caller can forget
      and that mis-attributes silently when forgotten. The rejected
      alternative, a local armed flag set in onClick, goes stale: press A,
      let it settle, press B, and A lights up beside it. The form-wide rule
      does not light a control belonging to a press that is over, because
      the busy predicate is the form's own pending flag and nothing else; the
      spec checks the other end of that with
      expect(page.locator('[aria-busy="true"]')).toHaveCount(0) once the last
      response has settled. The cost is one extra mark on the one two-control
      form whose second control sits inside a collapsed disclosure.
  - decision: >-
      THERE IS NO MINIMUM VISIBLE DURATION on the busy state, and no timer of
      any kind.
    why: >-
      The plan does not settle this and the dispatch asked for it to be
      settled. A minimum-duration floor is a timer that holds a busy state on
      screen after the work is finished, which is a second kind of lie about
      what the server is doing. It exists to stop a busy state flickering back
      to rest in place on a fast action, and that shape does not occur here:
      every server action in the product ends in redirect(), verified by
      grep -n "redirect" over the four action files (import 8 sites, merchants
      2, accounts, auth), so a busy control is replaced by a new document
      rather than flickering back. The busy control also carries the opacity
      transition M3-P9 shipped, so the state fades rather than snapping. The
      one surface where a fast round trip does return to the same form is the
      accounts setup island on a REFUSED submission, which is a validation
      round trip rather than a 40ms no-op, and it is recorded here rather than
      papered over with a timer.
  - decision: >-
      The two month step controls were given data-testid values
      (month-step-previous, month-step-next).
    why: >-
      Criterion 10.5(a) requires the navigating set to be matched by
      something a spec can bind to, explicitly forbids binding to the glyph
      child (a punctuation mark), and explicitly permits this phase to add the
      testids because month-view.tsx is in its files-to-touch. The values are
      pinned here so a later phase renaming them turns the spec red.
  - decision: >-
      The navigation marker carries data-link-pending and NOT data-testid.
    why: >-
      Same measured reason M3-P9 recorded at src/app/layout.tsx for
      data-press-feedback: the helper collectTestids in
      test/e2e/month-view.spec.ts sweeps every data-testid in the document and
      then requires a non-zero bounding rect from everything it collects, so a
      transient marker in that sweep is a race waiting to happen. Criterion
      10.5 binds to the attribute, which serves it exactly as well.
  - decision: >-
      The closure walk treats a module carrying the "use server" directive as
      a boundary it records and does not enter, which is a SIXTH rule beside
      the five criterion 10.6(e) lists.
    why: >-
      A server action module is not included in a client bundle; the bundler
      replaces its exports with references. MEASURED IN THE PRODUCTION BUNDLE
      THIS PHASE BUILDS rather than taken from documentation: grepping
      .next-prod/static/ for symbols that exist only below the accounts ui
      layer returns 0 files for validateAccountRegistration, listAccounts,
      changeAccountRing, AccountsSetupDependencies, createAccounts, prisma,
      @prisma/client and PrismaClient, while control probes that DO belong to
      the client island (addRow, removeRow, account-setup-form) return 1 to 2
      files each. The failure-kind literals already-registered,
      checksum-failed and duplicate-in-submission also appear in one client
      chunk, and that is NOT the application module leaking: the island's own
      switch over the failure kinds carries those strings itself. Without this
      rule the walk follows src/modules/accounts/ui/actions.ts into the
      accounts application layer and reports a leak the bundle does not have.
      The residue is stated at the rule and here: a "use server" module ALSO
      imported for a value that is not an action would slip through, nothing
      in the tree does that today, and the walk pins by name which modules it
      treats as action boundaries so a new one shows up as a failing
      assertion.
  - decision: >-
      The navigating controls covered are thirteen, not the plan's seven: the
      nine the plan's own categories now contain at this head, plus the two
      back-to-import links on the import result and the two alternate-auth
      links.
    why: >-
      The dispatch's instruction was to leave no press quiet. Those four are
      one child element each and cost nothing. Criterion 10.5's measured set
      is still the nine, asserted by name, so the criterion is evaluated
      against exactly what it names.
verification-first:
  - finding: >-
      (a) THE MEASUREMENT TECHNIQUE. A server action is a POST whose headers
      carry next-action, and a Playwright route handler that counts it, holds
      it with a Node timer and then calls route.continue() unchanged works
      under the development project AND under the production-mode project; the
      delay-then-fetch-then-fulfil fallback the plan allows was not needed.
      Captured, per press, from the handler itself: requests 1 and the first
      release 2030 to 2064 milliseconds after the click, against a 2000
      millisecond delay. The identifying predicate is written at the handler:
      request.method() === "POST" && headers["next-action"] !== undefined. No
      test-only delay was added to product code.
    contradicts-plan: false
  - finding: >-
      (b) WHAT useFormStatus REPORTS FOR THE TWO-CONTROL FORM. Measured with a
      temporary console probe in the leaf, not committed, driving a real press
      on src/modules/import/ui/profile-confirmation.tsx. Pressing the
      overriding control, both leaves reporting at once, verbatim:
      {"pending":true,"method":"get","actionType":"function","identicalToProp":true,"hasFormActionProp":true,"dataKeys":["importId","profileName","spec"]}
      and
      {"pending":true,"method":"get","actionType":"function","identicalToProp":false,"hasFormActionProp":false,"dataKeys":["importId","profileName","spec"]}.
      So the pending state CAN be attributed, in one direction: a control that
      overrides its form's action recognises its own submission by identity,
      and a control that does not override has no action of its own to compare
      with. The phase takes the form-wide answer, which criterion 10.3
      explicitly admits, and the reason is recorded at the leaf. This answer
      also corrects a sentence this phase's own first draft of that comment
      carried, which asserted the identity comparison did not work; that was
      written before the measurement and was false (clause R-087).
    contradicts-plan: false
  - finding: >-
      (c) WHETHER useLinkStatus EVER REPORTS PENDING FOR THESE LINKS. Against
      the development server, where viewport prefetching is off, all NINE
      navigating controls took the marker branch: captured verbatim,
      [{"name":"empty-state-accounts-link","branch":"marker"},{"name":"empty-state-import-link","branch":"marker"},{"name":"nav-merchants","branch":"marker"},{"name":"nav-accounts","branch":"marker"},{"name":"nav-import","branch":"marker"},{"name":"nav-overview","branch":"marker"},{"name":"unresolved-pill","branch":"marker"},{"name":"month-step-previous","branch":"marker"},{"name":"month-step-next","branch":"marker"}].
      The production-mode branch record is the chromium-phone-prod run of the
      same spec, quoted in the gate evidence below, and the two are compared
      there as criterion 10.5(c) requires.
    contradicts-plan: false
  - finding: >-
      (d) WHETHER ANY LOADING BOUNDARY EXISTS UNDER src/app AT THE PHASE BASE.
      None. `find src/app -name "loading.*" | wc -l` returns 0, so a prefetched
      dynamic route has no framework-supplied fallback to render and whichever
      branch the production build takes for a navigating control is the
      framework's prefetching behaviour and this phase's marker, nothing else.
    contradicts-plan: false
  - finding: >-
      (e) THE EXACT "use client" FILE LIST AT THE PHASE BASE (8d99dfd), from
      `grep -rln '^"use client"' src/`: src/modules/accounts/ui/account-setup-form.tsx
      and src/platform/ui/nav-link.tsx. TWO files, and one of them is under a
      module's ui directory rather than under src/platform/ui. A plain
      `grep -rln "use client" src/` returns a third path, src/app/layout.tsx,
      and that is a FALSE POSITIVE: the string occurs there inside a prose
      comment M3-P9 wrote about why that file is a script and not a client
      component. The list this phase's guard uses is the directive at the top
      of a file, not the string anywhere in it.
    contradicts-plan: true
    stopped-and-reported: >-
      Not stopped. Criterion 10.6(a) reads "at most three files, all of them
      under src/platform/ui/", and 10.6(b) reads "no file under any module's
      ui/ directory carries use client", and both were already untrue at the
      base because M3-P14 merged after this plan section was written. The
      dispatching orchestrator's instruction named exactly this class in
      advance and told me to record it as a deviation rather than raise it as
      a question, which is what the deviations list below does. Removing
      M3-P14's client island is not this phase's work and would undo criterion
      14.3.
  - finding: >-
      (f) src/modules/ledger/ui/actions.ts IS STILL BEHIND NO RENDERED
      CONTROL. Its one export is recomputeAction (line 15), and a grep across
      src/ and test/ for that identifier and for the module's ui path returns
      only imports of @/modules/ledger/APPLICATION from four other modules and
      no importer of the ui action at all. So this phase touches three action
      surfaces and not four, and the merchant naming form's instance shape is
      unchanged: one form per unresolved group, rendered at
      src/modules/merchants/ui/merchant-review.tsx:47, with the hidden
      counterpartyText field still carrying the UNMASKED value at :50.
    contradicts-plan: false
  - finding: >-
      (g) THE PRODUCTION-MODE SERVER STARTS AND SERVES THE SPEC'S JOURNEY WITH
      NO FROZEN CLOCK. playwright.config.ts strips PULSE_FIXED_NOW from that
      server's environment by the app's own production guard, so the spec
      reaches its month through the month view's own query parameter
      (?month=2026-08 and ?month=2026-07) rather than through whatever month
      the clock gives. The evidence is the chromium-phone-prod rows of the
      full suite quoted in the gate evidence below, which include the month
      step controls.
    contradicts-plan: false
  - finding: >-
      MECHANISM LOOKUP, as clause mechanism-lookup requires. The index at
      node_modules/@tiphys/kernel/tuition/mechanism-index.yaml has NO entry
      for a busy state, a pending state or a client boundary. Three entries do
      govern the closure guard this phase adds and each is satisfied
      deliberately. "Deciding what another program will do by pattern-matching
      the text of a file it consumes" asks for the accepted shapes to be
      PINNED and the walk to FAIL CLOSED rather than for the pattern to be
      widened, and for the residue to be named: the walk enters only relative
      and @/ specifiers, resolves by a fixed candidate list, throws on
      anything it cannot resolve, and names its two recorded non-entries
      (bare packages, and "use server" modules) by assertion so a new one is
      visible. "Asserting a CI step is wired" asks a class witness to redden
      under at least two structurally different members, which is why the red
      witness below is a direct type-only import AND a transitive leak through
      a barrel re-export rather than the same shape twice. "A guard's own
      failure path" asks that the success path be total, which is why an
      unresolvable specifier throws rather than being skipped.
    contradicts-plan: false
deviations:
  - plan-clause: >-
      The phase intent and step 3: "all seven submit controls", enumerated as
      the upload submit, the preview-again and confirm submits, the merchant
      naming submit, the sign-in and sign-up submits and the sign-out submit.
    why: >-
      NINE submit controls exist at this branch head. The plan section was
      written against 89ed187; M3-P14 merged afterwards and shipped the
      accounts screen, which adds the ring-switch submit
      (src/modules/accounts/ui/accounts-screen.tsx) and the setup register
      submit (src/modules/accounts/ui/account-setup-form.tsx). The dispatching
      orchestrator instructed that this be recorded as a deviation rather than
      raised as a question, and that the newest screen not be left as the one
      place a press still goes quiet. Eight of the nine render through the
      shared leaf. The ninth, the setup register submit, does not, and the
      reason is mechanical: that form submits through an onSubmit handler and
      a transition rather than through a form action, so useFormStatus reports
      nothing for it. It carries the same aria-busy vocabulary from the
      transition's own pending flag, and the reason is recorded at the line.
      Criterion 10.2(a)'s set assertion in the spec therefore names nine
      controls, not seven, and fails on a missing one in both directions.
  - plan-clause: >-
      Step 4 and criterion 10.5(a): "the seven navigating controls",
      enumerated as nav-overview, nav-import, nav-merchants, unresolved-pill,
      empty-state-import-link and the two month step controls.
    why: >-
      NINE exist in the plan's own categories at this head: M3-P14 added a
      fourth shell link (nav-accounts) and a second empty-state call to action
      (empty-state-accounts-link). The spec measures all nine and asserts the
      set by name. Four further Links exist outside the plan's categories and
      are covered by the same leaf without being measured: the two
      back-to-import links on the import result and the two alternate-auth
      links. They are recorded here rather than left as an unstated
      difference.
  - plan-clause: >-
      Criterion 10.6(a), "grep -rln 'use client' src/ returns AT MOST three
      files, all of them under src/platform/ui/", and 10.6(b), "no file under
      any module's ui/ directory carries use client".
    why: >-
      FOUR files carry the directive at the final tree and one of them,
      src/modules/accounts/ui/account-setup-form.tsx, is under a module's ui
      directory. That file is M3-P14's and was already there at this phase's
      base; both halves of the criterion were untrue before this phase touched
      anything. This phase adds two client files, both under src/platform/ui,
      which is the part of the criterion it can satisfy and does. The letter
      of 10.6(a) and 10.6(b) is NOT met and is recorded as unmet rather than
      reinterpreted. The substance behind it, that no domain type, no
      application function, no repository and no message catalogue reaches the
      browser, is met and is now enforced by a closure walk in the fast gate
      that covers all four files rather than by a grep over three.
  - plan-clause: >-
      Criterion 10.6(e), the five rules for the closure walk.
    why: >-
      A sixth rule was added: a module whose own directive is "use server" is
      recorded as a boundary and not entered. Its justification, its cost and
      its residue are written at the rule in test/app/client-boundary.test.ts
      and in the key decisions above. Without it the walk reports a leak that
      exists in no bundle.
  - plan-clause: >-
      Criterion 10.9(b), the whole-worktree grep for probes built from the
      real statements.
    why: >-
      RECORDED AS NOT WITNESSED, which is the branch the criterion itself
      provides. The real uploads are present in this container, but this
      agent's environment refused the read of them (the action was blocked
      before the extraction ran), so the probes could not be built here. What
      was done instead, and it is weaker: a shape grep over every added line
      of the phase diff for identifier, card-number, thousands-form amount and
      date shapes, which returned 0 hits over 1296 added lines (exit 1). That
      does not see a merchant name or a place name, which is exactly the hole
      fleet warning 12 records, so half (b) stays NOT WITNESSED and is a
      review-time task.
  - plan-clause: >-
      The plan's branch name for this phase, claude/m3-p10-pending-feedback.
    why: >-
      The dispatch names claude/m3-p10-busy-state and created the worktree on
      it. The branch the work is on is the dispatched one. Flagged because
      clause R-031 makes the branch name load-bearing for the scope auditor.
  - plan-clause: >-
      Criterion 10.7, "Two files outside the surfaces and the test rig may be
      touched, and only these two: playwright.config.ts and eslint.config.mjs".
    why: >-
      Both are touched and nothing else outside the surfaces is, but the test
      rig grew by TWO files rather than one: test/e2e/busy-state.spec.ts,
      which is the single new spec criterion 10.7 allows, and
      test/app/client-boundary.test.ts, which criterion 10.6(e) requires to
      run in the FAST gate and therefore cannot live under test/e2e. The two
      criteria are read together here rather than one being chosen over the
      other.
