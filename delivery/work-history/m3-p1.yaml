  - src/app/globals.css
  - src/modules/overview/ui/month-view.tsx
  - src/platform/ui/nav-link.tsx
  - messages/en.json
  - messages/nl.json
  - messages/fr.json
  - test/e2e/navigation.spec.ts
  - test/app/catalog-parity.test.ts
  - delivery/work-history/m3-p1-notes.md
  - delivery/work-history/m3-p1.yaml
