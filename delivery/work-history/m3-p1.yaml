fix-round:
  - mechanism: >-
      Exact string equality used as a route-membership test over a
      hierarchical path space (finding CR-601). The finding was "no link is
      current on /import/[id]"; the mechanism is that pathname === href
      answers "is this the same page" when the nav's question is "is this
      page inside this section". Fixed in the one place the decision lives
      (isCurrentRoute in nav-link.tsx): non-root hrefs match exact or
      prefix-plus-slash, the root href stays exact so it is not current
      everywhere. The rule is recorded at the mechanism's definition and
      the sibling that consumes its output is named there (the CSS state
      selector in globals.css).
    derivation:
      command: grep -rn "usePathname\|pathname" src/; find 'src/app/(app)' -name 'page.tsx' | sort
      output: |
        src/middleware.ts:10:const isAuthPath = (pathname: string): boolean =>
        src/middleware.ts:11:  pathname.startsWith("/sign-in") || pathname.startsWith("/sign-up");
        src/middleware.ts:38:  if (!user && !isAuthPath(request.nextUrl.pathname)) {
        src/middleware.ts:40:    target.pathname = "/sign-in";
        src/middleware.ts:44:  if (user && isAuthPath(request.nextUrl.pathname)) {
        src/middleware.ts:46:    target.pathname = "/";
        src/platform/ui/nav-link.tsx:4:import { usePathname } from "next/navigation";
        src/platform/ui/nav-link.tsx:10:// after the first click; usePathname is the supported way to read the
        src/platform/ui/nav-link.tsx:28:const isCurrentRoute = (pathname: string, href: string): boolean => {
        src/platform/ui/nav-link.tsx:30:    return pathname === "/";
        src/platform/ui/nav-link.tsx:32:  return pathname === href || pathname.startsWith(`${href}/`);
        src/platform/ui/nav-link.tsx:44:  const pathname = usePathname();
        src/platform/ui/nav-link.tsx:45:  const active = isCurrentRoute(pathname, href);
        src/app/(app)/import/[id]/page.tsx
        src/app/(app)/import/page.tsx
        src/app/(app)/merchants/page.tsx
        src/app/(app)/page.tsx
    not-covered: >-
      (Derivation captured AFTER the fix; the pre-fix state of the one nav
      call site was pathname === href at nav-link.tsx line 30, commit
      c2aceec, and the middleware lines are byte-identical in both states.)
      The derivation enumerates pathname consumers under src/ only; no
      other directory ships routing code today. The middleware's two
      startsWith calls are the OTHER route-membership decisions and were
      read, not changed: they guard /sign-in and /sign-up prefixes outside
      the shell and have no active-marker role. The route listing shows
      /import/[id] as the only sub-route today; a future sub-route under
      /merchants or a new top-level section inherits the prefix rule
      automatically, but a future nav link whose href is a PREFIX of a
      sibling href (say /import and /imports) would mark both current, and
      no such pair exists to witness now. Query-string and hash variants
      are outside pathname by construction and were not probed.
  - mechanism: >-
      Comparing a nested structure by its top-level projection (finding
      CR-602). The finding was "a dropped array entry stays green"; the
      mechanism is that Object.keys flattens the comparison to one level,
      so any difference below that level (array length, array-versus-string
      shape) is invisible to the guard. Fixed by comparing the full leaf
      path sets (collectLeafPaths in the test: object keys join with dots,
      array entries append their index), so the difference IS a named path.
    derivation:
      command: "python3: per locale, list keys whose values are arrays (with lengths) and keys whose values are neither string nor array, over messages/{en,nl,fr}.json"
      output: |
        en arrays: {'prevMonth': 2, 'steps': 3, 'emptySteps': 3} other-non-string: {}
        nl arrays: {'prevMonth': 2, 'steps': 3, 'emptySteps': 3} other-non-string: {}
        fr arrays: {'prevMonth': 2, 'steps': 3, 'emptySteps': 3} other-non-string: {}
    not-covered: >-
      The derivation covers the three committed catalogs at the fix-round
      head: three array-valued keys, no deeper nesting, no non-string
      scalars. The repaired test recurses arbitrarily, so deeper shapes a
      later phase adds are compared without re-derivation, but VALUES are
      still out of scope on purpose: a translation that is byte-identical
      to the English source, or one missing an ICU placeholder such as
      {count} or an <amt> tag that its siblings carry, passes this guard.
      Placeholder parity is a different check with real legitimate
      asymmetries (plural arms differ per language) and is not smuggled
      into this one; recorded as the standing residue.
claims:
  - id: M3P1-C1
    kind: coverage
    statement: >-
      The nav's testids are rendered by the shell and pinned to exactly one
      component file (criterion 1.1 second half): each of the four grep -rl
      runs over src/ prints exactly src/app/(app)/layout.tsx and nothing
      else.
    settled-by:
      executed-construction:
        command: grep -rl "nav-overview" src/; grep -rl "nav-import" src/; grep -rl "nav-merchants" src/; grep -rl "main-nav" src/
        exit-code: 0
        output: "src/app/(app)/layout.tsx (once per grep, four greps, no other line)"
  - id: M3P1-C2
    kind: coverage
    statement: >-
      No literal colour under src/ (criterion 1.3 second half), in the
      criterion's exact form; the token and theme files live under styles/,
      outside src/, so the un-excluded grep is the stricter run.
    settled-by:
      executed-construction:
        command: grep -rE "oklch\(|#[0-9a-fA-F]{3,8}" src/
        exit-code: 1
        output: "(no matches; exit 1 is the no-match code the criterion requires)"
  - id: M3P1-C3
    kind: coverage
    statement: >-
      The catalog parity test reddens under two structurally different
      members of its class (criterion 1.2): a key deleted from a target
      catalog, and an extra key added to a target catalog; green with the
      committed catalogs before and after.
    settled-by:
      executed-construction:
        command: "delete signout from messages/nl.json; npx vitest run test/app/catalog-parity.test.ts; restore; add onlyInFrProbe to messages/fr.json; rerun; restore; rerun"
        exit-code: 1
        output: >-
          Run 1: "x nl carries exactly the en key set: keys in en but not
          in nl: expected [ 'signout' ] to deeply equal []" (1 failed).
          Run 2: "x fr carries exactly the en key set: keys in fr but not
          in en: expected [ 'onlyInFrProbe' ] to deeply equal []" (1
          failed). Final run after restores: 3 passed (3), and git diff
          --stat over messages/ empty before the implementation commit
          added the five new keys.
  - id: M3P1-C4
    kind: coverage
    statement: >-
      The navigation e2e is a real witness (criterion 1.1 first half): both
      tests fail against the pre-nav code and pass against the
      implementation, reddening under two structurally different journeys
      (empty household via the empty state, seeded household via header
      click-through).
    settled-by:
      executed-construction:
        command: "git restore --source=0cc70ad -- src/; pinned env npx playwright test -g \"the nav is in the shell|active marker follows\"; git restore --source=HEAD -- src/; pinned env npm run test:e2e"
        exit-code: 0
        output: >-
          Red run: "2 failed" naming navigation.spec.ts:76 and :92, both at
          expect(page.getByTestId("main-nav")).toBeVisible()
          (navigation.spec.ts:63). Green run: "14 passed (2.1m)", exit 0,
          including both navigation tests and the unmodified
          golden-journey spec.
  - id: M3P1-C5
    kind: impossibility
    statement: >-
      The shell layout file cannot be made the client component that
      computes the active marker: with "use client" prepended to
      src/app/(app)/layout.tsx, the production build fails (tsc alone does
      not catch it; the earlier typecheck probe exited 0, which is why the
      build probe was run).
    settled-by:
      executed-construction:
        command: sed -i '1i "use client";' 'src/app/(app)/layout.tsx' && npm run build; git restore 'src/app/(app)/layout.tsx'
        exit-code: 1
        output: >-
          Error: x You're importing a component that needs "next/headers".
          That only works in a Server Component ... Build failed because of
          webpack errors. Layout restored afterwards; git status clean of
          src changes.
  - id: M3P1-C6
    kind: coverage
    statement: >-
      The CR-601 sub-route witness is real: red with a captured numeric
      exit code against the exact-match NavLink, green after the
      isCurrentRoute fix, and it also asserts the converse (nav-overview
      and nav-merchants NOT current on /import/<id>), so the fix could not
      pass by marking everything current.
    settled-by:
      executed-construction:
        command: "pinned env npx playwright test -g \"import link stays current\" at bb6ea80 (pre-fix src); then pinned env npm run test:e2e at 1a0e0d8"
        exit-code: 1
        output: >-
          Red: exit 1, "Error: expect(locator).toHaveAttribute(expected)
          failed" at navigation.spec.ts:110
          (getByTestId("nav-import")).toHaveAttribute("aria-current",
          "page"), 1 failed. Green: exit 0, 15 passed (2.2m) including
          "import sub-route: the import link stays current on the confirm
          step (CR-601)".
  - id: M3P1-C7
    kind: coverage
    statement: >-
      The CR-602 repair follows R-037a in full: the lying test was shown
      green against the dangerous state first (old top-level test, nl
      emptySteps cut to two entries: 3 passed, exit 0), then the repaired
      deep-path test reddens under two structurally different members and
      names the drifted paths, then green with intact catalogs.
    settled-by:
      executed-construction:
        command: "mutate nl emptySteps to length 2, npx vitest run test/app/catalog-parity.test.ts (old then new test); restore; replace fr prevMonth array with a string, rerun; restore, rerun"
        exit-code: 1
        output: >-
          Old test on mutated nl: Tests 3 passed (3), exit 0 (the
          reviewer's construction, reproduced). New test, member A: "paths
          in en but not in nl: expected [ 'emptySteps[2]' ] to deeply
          equal []", 1 failed. New test, member B: "paths in en but not in
          fr: expected [ 'prevMonth[0]', 'prevMonth[1]' ] to deeply equal
          []", 1 failed. Restored: 3 passed (3), exit 0, git diff over
          messages/ empty.
  - id: M3P1-Q1
    kind: open-question
    statement: >-
      I did not capture the red navigation run's numeric process exit code:
      the capture piped the runner through tail, so the recorded number is
      tail's. The runner's own "2 failed" listing with the failing
      assertion site is the captured red evidence, and the green side's
      exit 0 was captured directly.
  - id: M3P1-Q2
    kind: open-question
    statement: >-
      The claim-grep hits inside this document's prompt block are the
      dispatcher's own words recorded verbatim per R-052a (the environment
      prohibitions and the description of the owner's blocked state); I
      did not treat quoted dispatch language as claims of mine to settle.
    still-open-because: >-
      The prompt is required verbatim, so its wording is not mine to
      restate; which of its sentences need settling is a judgement the
      reviewer can re-run with the same grep over the prompt block.
environment-warnings:
  - warning: >-
      Prisma 6.19's AI-agent consent guard fires on migrate reset for the
      LOCAL target too, after the repo's own db guard has printed its
      allow; before reaching for the consent-quoting precedent, check
      whether a reset is needed at all: prisma migrate status (pinned) is
      cheap and made the reset unnecessary here.
    evidence: >-
      npm run db:reset (pinned local) exit 1 with the consent prompt after
      "db guard:" allow; npx prisma migrate status (pinned) exit 0, "5
      migrations found... Database schema is up to date!".
  - warning: >-
      After sudo dockerd, the local supabase stack's CORE containers (db
      54322, kong 54321, auth, rest) restart by themselves, but ten
      services stay stopped (storage, inbucket, realtime, studio, pooler
      and friends); the e2e suite needs only the core four, so the stopped
      list is noise, not a failure.
    evidence: >-
      npx supabase status listed the ten stopped services while printing
      the working DB_URL, API_URL and both keys; the full e2e suite then
      passed 14 of 14 against that stack.
  - warning: >-
      playwright.config.ts spreads process.env into the webServer env, so
      pinning the five values in the invoking shell does reach the dev
      server; fleet warning 6 stays true and this is the confirming
      mechanism, not a new fact.
    evidence: >-
      test:e2e passed against the local stack with the ambient foreign
      values still present in the wider shell but overridden by the pinned
      invocation.
