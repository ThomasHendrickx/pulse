  - sha: 0cc70ad
    subject: "test: navigation e2e and catalog parity red witnesses, written before the nav exists"
  - sha: c2aceec
    subject: "feat: shell header navigation, active-route marker, empty-state import link"
  - sha: 5c23aa4
    subject: "docs: M3-P1 work history (schema-valid) and incremental work notes"
  - sha: bb6ea80
    subject: "test: fix-round witnesses for CR-601 and CR-602, red before the fixes"
  - sha: 1a0e0d8
    subject: "fix: NavLink marks a section current on its sub-routes (CR-601)"
key-decisions:
  - decision: >-
      The active-route marker is computed by a small client island,
      src/platform/ui/nav-link.tsx (usePathname), while the literal
      data-testid values and the catalog labels stay in the server layout
      and reach the island as props.
    why: >-
      The App Router keeps the shell layout mounted across client-side
      navigations, so a server-computed marker goes stale after the first
      click; and criterion 1.1's grep pins the nav testids to
      src/app/(app)/layout.tsx as the only matching component file, which
      props satisfy and a second literal would break. The island passes
      pulse-frontend's platform/ui test: it knows an href and a label, not
      what a transaction is.
  - decision: >-
      aria-current="page" is both the e2e marker and the styled state
      (.app-nav-link[aria-current="page"] in globals.css); no separate
      data-active attribute.
    why: >-
      One attribute serving the accessible state, the visible state and the
      test assertion cannot drift into three disagreeing signals. The plan
      offers aria-current or data-active; aria-current is the one with
      accessibility semantics.
  - decision: >-
      No database reset was run. The pre-existing local supabase stack
      (project_id m1-p1-skeleton, the id committed in supabase/config.toml)
      was reused after dockerd restart, verified current with prisma
      migrate status.
    why: >-
      npm run db:reset (pinned local) was refused by Prisma 6.19's AI-agent
      consent guard after the repo's own guard allowed the local target;
      instead of quoting consent per the M1-P1 precedent, migrate status
      (pinned) printed "Database schema is up to date!" with 5 migrations,
      and the e2e specs each sign up a fresh household, so a reset would
      have destroyed state for no benefit.
  - decision: >-
      Mechanism lookup (mechanism-lookup clause): read the kernel
      tuition/mechanism-index.yaml (15 keys, listed in the notes file). No
      entry exists for the mechanisms this phase uses (React server
      components, next-intl catalogs, Vitest, Playwright). The one rule
      applied by analogy is from asserting-a-ci-step-is-wired: a witness
      for a class must redden under at least two structurally different
      members, honoured in both witnesses below.
    why: >-
      The clause requires the lookup to be recorded even when the index has
      no entry; the two-member rule shaped the parity red witness (a
      missing key AND an extra key) and the nav red witness (empty-state
      journey AND seeded click-through journey).
  - decision: >-
      Nav labels are new catalog keys navLabel, navOverview, navImport,
      navMerchants, emptyImportCta in EN, NL, FR; NL uses Tegenpartijen and
      FR Contreparties for the merchants link.
    why: >-
      Consistent with the existing NL and FR catalog vocabulary
      (Tegenpartijen nakijken, Revision des contreparties): the ubiquitous
      language for that screen is counterparties, and the nav should name
      the screen the way the screen names itself.
verification-first:
  - finding: >-
      At base c518181 the shell header renders brand eyebrow, the
      household-context span and the sign-out form only, no nav
      (src/app/(app)/layout.tsx lines 17 to 27); the empty state renders
      noData, emptyTitle and emptyBody with no Link element
      (src/modules/overview/ui/month-view.tsx lines 387 to 396); grep -rln
      over src/ for nav-overview, nav-import, nav-merchants and app-nav
      prints nothing. This matches the grounding's citations.
    contradicts-plan: false
  - finding: >-
      The three catalogs are at parity at base (101 keys each, key-set
      differences empty in both directions per locale), so the parity test
      is born green and its red has to be forced locally, which is exactly
      what criterion 1.2 instructs (witnessed red once by removing a key
      locally, then green). No parity test exists under test/ at base
      (grep -rn parity test/ prints nothing).
    contradicts-plan: false
  - finding: >-
      A server layout cannot read the current pathname, and the layout
      stays mounted across client-side navigations, so the current-route
      marker required by step 1 needs a client hook (settled by the
      executed construction in claim M3P1-C5: the alternative of marking
      the layout itself "use client" fails the build with exit 1); the
      mechanism is not specified in the phase text, which names only the
      marker itself (aria-current or data-active). Resolved as a small
      mechanical choice with the NavLink island, keeping the testid
      literals in the layout as criterion 1.1 pins them.
    contradicts-plan: false
deviations:
  - plan-clause: >-
      files-to-touch (phase M3-P1): the list does not name
      src/platform/ui/nav-link.tsx or src/app/globals.css, both of which
      the phase in fact requires.
    why: >-
      nav-link.tsx: the active marker needs a client island (see
      verification-first), and "use client" is impossible on the layout
      file itself because the layout is a server component resolving the
      household context through next/headers; both halves settled by the
      executed construction in claim M3P1-C5 rather than asserted. globals.css: the file where all
      existing app-shell classes live; the nav chrome classes belong
      beside .app-header, and styles/tokens.css holds tokens, not
      component rules. Declared in the notes file the moment found, per
      the phase-scope clause, so the orchestrator can amend the
      declaration on the base branch before the scope audit.
  - plan-clause: >-
      files-to-touch (phase M3-P1): styles/tokens.css is listed but was
      not modified.
    why: >-
      The listing is conditional (step 1: a missing token is added there
      first); no token was missing. Every new rule uses existing tokens
      (space, text, weight, ink colours, border-hairline, focus-ring,
      radius), verified by the gate:tokens grep and the criterion 1.3
      grep, both exit codes captured below.
