kind: work-history
phase: M3-P1
prompt: |
  You are the implementer for phase M3-P1 (navigation) of the Pulse v0.2
  delivery. Your brief is /home/user/pulse-fleet/implementer-brief-m3-p1.md:
  read it fully first, including the appended fleet warnings; it is your
  contract. Your working tree is the fresh clone
  /home/user/pulse-fleet/worktrees/m3-p1-navigation on branch
  claude/m3-p1-navigation (based on main c518181). Do all work there, never
  in /home/user/pulse. The plan is delivery/plan/pulse-v02.yaml in your
  clone, phase M3-P1; the owner is currently BLOCKED on this exact gap (no
  way to reach the import screen from the UI), so this phase is deliberately
  small: ship it clean and fast.

  Read the pulse-frontend skill before any component work (server
  components, design tokens only, next-intl EN/NL/FR for every user-facing
  string, no literal colours or spacing) and pulse-typescript for any TS.
  Scope per the plan: header navigation in the authenticated shell
  (src/app/(app)/layout.tsx, the plan pins the nav's data-testid to exactly
  ONE component file under src/, the shell layout, by grep count in
  criterion 1.1: put it there and nowhere else), links for the month view,
  import, and merchants; the month view's empty state links to /import;
  catalog additions in all three languages with parity; the navigation e2e
  per the plan's criteria (walk every acceptance criterion of M3-P1 exactly
  as written, including the lint gate and any copy assertions). The
  jsx-no-literals rule covers src/modules/**/ui: keep every string in
  catalogs regardless of where the nav component lives.

  Environment (also in the brief's warnings): never use ambient
  DATABASE_URL/DIRECT_URL/SUPABASE_* (foreign project; they override .env
  for Prisma AND the Playwright webServer, pin ALL FIVE values local for db
  and e2e); docker daemon may be dead, sudo dockerd then wait ~30s for
  auth; Node 26 for tiphys via export NVM_DIR=/opt/nvm && .
  /opt/nvm/nvm.sh; npm only; no em dashes; use -g for Playwright test
  filters.

  Work in small commits pushed incrementally (git push -u origin
  claude/m3-p1-navigation on first push). Red witness before green (the
  e2e asserting nav presence, written first, is the natural red). Before
  reporting: npm run typecheck, npm run lint, npm run gate:tokens, npm
  test, npm run test:e2e all exit 0; delivery/work-history/m3-p1.yaml
  schema-valid (npx --prefix /home/user/pulse-fleet tiphys validate --type
  work-history with a context containing delivery/plan/pulse-v02.yaml)
  plus m3-p1-notes.md; confirm the final push with git ls-remote origin
  claude/m3-p1-navigation output in your report. Report: per-criterion
  status with executed evidence, deviations declared the moment found,
  head sha.
