fix-round:
  - mechanism: >-
      A cross-language mirror ASSERTED rather than derived: SQL text
      standing in for a JavaScript character class (POSIX [[:space:]] for
      the platform canonical form's whitespace class), with the claimed
      equivalence exercised only over inputs on which the two classes
      happen to agree (ASCII-spaced renderings), so the divergent members
      (U+00A0, U+202F, U+FEFF and the rest of the ECMAScript set) were
      never traversed by any test.
    derivation:
      command: >-
        grep -rn "\[\[:space:\]\]" --include="*.ts" --include="*.tsx"
        --include="*.sql" src/ scripts/ prisma/ test/ | grep -v
        node_modules   (run at 85da7f6, before any fix edit)
      output: |
