key-decisions:
  - decision: >-
      The mandated mechanism-index lookup was answered with "the index does
      not exist in this fleet checkout": find over /home/user/pulse-fleet
      outside node_modules returned no tuition/mechanism-index.yaml and no
      gates.manifest.json. The mechanisms this phase touches were looked up
      at their source definitions instead: the db guard contract
      (src/platform/db/guard.ts header), the canonical account-number
      mechanism note and its sibling list (src/platform/account-number.ts),
      and the migration folder conventions (existing six migrations).
    why: >-
      The brief's mechanism-lookup clause accepts a recorded "no entry"
      answer; the source-level mechanism notes are the nearest surviving
      home for the same rules, and the sibling list there was extended in
      the same change (clause mechanism-sibling).
  - decision: >-
      Step 4's ring scoping and the mechanism-sibling additions landed in
      the same commit as step 3 (4ef4c01), because criterion 18.2 assertion
      five is unsatisfiable while the uninterpreted count still counts held
      rows: the two edits are one behaviour.
    why: >-
      Committing an intermediate state in which a savings statement is
      accepted but its rows trip the uninterpreted cause block would be a
      commit whose fast gate contradicts the phase's own criteria.
  - decision: >-
      messages/fr.json carried a DUPLICATE key nameRefusedUnidentifiable (an
      accent-less copy at line 127 shadowed by an accented one at line 168).
      Rewriting the catalogue through JSON.parse/stringify collapsed the
      pair to the single effective (accented) value.
    why: >-
      JSON last-key-wins semantics made the accented value the effective one
      already, so behaviour is unchanged; the duplicate itself was a latent
      defect and is corrected loudly here rather than silently (R-087).
  - decision: >-
      Criterion 18.5's phrase "refused with the named error pointing at the
      row it duplicates" is implemented as the existing failure shape: the
      error carries the INDEX of the offending typed row and the setup form
      renders accountsErrorAlreadyRegistered against that row in all three
      catalogues.
    why: >-
      The stronger reading (naming the duplicated EXISTING account's label
      in the message) requires interpolation through
      src/modules/accounts/ui/account-setup-form.tsx and accounts-screen.tsx,
      neither of which is in files-to-touch; the chosen reading satisfies
      the criterion text without leaving the declaration. Recorded as an
      open question (claim M3P18-C6) for the reviewer.
  - decision: >-
      A bare Postgres 16 was found installed in this container (no Docker
      daemon, no Supabase auth service). A throwaway cluster on
      127.0.0.1:54322 was used to witness prisma migrate deploy, the
      SQL-level arms of criteria 18.3/18.4/18.5 (temporary script, output
      captured verbatim in m3-p18-notes.md, then deleted), and one formal
      Playwright pass of test/e2e/held-and-gap-rows.spec.ts.
    why: >-
      Evidence beats assertion: the dispatch said no local Postgres exists,
      and the cheapest honest answer to finding one was to convert as many
      environment-limited claims as possible into captured runs while
      recording exactly which browser-dependent arms remain unwitnessed.
verification-first:
  - finding: >-
      Capture A, at dee3d32: the savings refusal arm exists at
      src/modules/import/application/confirm-import.ts:121 with its union
      member at :32; the full consumer sweep (grep over ts/tsx/json,
      excluding delivery/) finds exactly six code sites plus three
      catalogue entries, matching the round-2 review's enumeration.
      Verbatim output in delivery/work-history/m3-p18-notes.md.
    contradicts-plan: false
  - finding: >-
      Capture B: findAccountByIban
      (src/modules/accounts/adapters/account-repository.ts:107-118)
      canonicalises the probe and exact-matches the stored column; M3-P14's
      own writes store canonical (:34-35), a pre-P14 row stores the cell
      verbatim (parse-statement.ts optionalText).
    contradicts-plan: false
  - finding: >-
      Capture C: the already-registered check
      (src/modules/accounts/application/register-accounts.ts:45-54) builds
      its known set from stored strings while the typed side arrives
      canonical from validation, and the unique index
      (prisma/schema/accounts.prisma, unique on householdId+iban) compares
      stored strings too.
    contradicts-plan: false
  - finding: >-
      Capture D, the null-flow occurrence sweep in three arms (SQL IS NULL,
      COALESCE/CASE-to-sentinel, Prisma null spellings): exactly two reads
      test for an absent flow, the uninterpreted count
      (overview-repository.ts:256) and listGapRows (:306 CASE, :321 WHERE);
      the only Prisma-form hit is an in-list with no null
      (merchant-repository.ts:325). Verbatim commands and output in
      m3-p18-notes.md.
    contradicts-plan: false
  - finding: >-
      Capture E: the interpretation window is built from the pot account
      ids alone (interpret-window.ts via deriveDeclaredSets,
      ledger-transaction.ts), so a savings-ring account's rows keep flow
      NULL by construction under both interpret-for-import and recompute.
    contradicts-plan: false
  - finding: >-
      The step-1 database captures (the refusal of the non-canonical stored
      account's statement, the second-row trap, the MonthFigures baseline)
      could not be taken before editing in THIS container as the plan
      sequences them, because no database existed at that point and the
      dispatch stated none was available; they were instead taken at gate
      time against a locally started bare Postgres 16, where the door-closed
      lookup, the ring-scoped baseline figures and the typed-twin refusal
      were all captured over the committed harness (m3-p18-notes.md,
      "Environment upgrade" section). The browser-level renderings of the
      same captures remain owed to a container with the Supabase auth
      service. Whether the owner's DEPLOYED rows carry a non-canonical
      rendering is not readable from this tree (report-code-disagreement,
      verified false), which is why the backfill is proven a no-op over
      already-canonical rows.
    contradicts-plan: false
deviations:
  - plan-clause: files-to-touch (M3-P18 declaration)
    why: >-
      src/modules/overview/application/index.ts is edited although
      undeclared: it is the overview module's composition root, and the new
      port method listHeldRows must be bound there or the phase does not
      build. The declaration names ports.ts for "the held read" and plainly
      intended the application layer; flagged per the brief's phase-scope
      section for the base-branch amendment.
  - plan-clause: files-to-touch (M3-P18 declaration)
    why: >-
      src/modules/ledger/domain/ledger-transaction.ts and
      src/platform/account-number.ts received comment-only edits although
      undeclared: the first carried the sentence that reserve statements
      are not imported, which DR-0030 made false and clause R-087 requires
      correcting in place loudly; the second's mechanism-sibling list must
      name the new consumer and the two new SQL mirror sites (clause
      mechanism-sibling). No behaviour changed in either file.
  - plan-clause: step 1 ordering (capture before any other edit)
    why: >-
      The database-dependent captures could not precede editing in this
      container (no database existed until gate time); the static captures
      were taken first as ordered, and the database captures were taken at
      gate time over the committed harness against a locally started
      Postgres, with the browser-level forms still owed elsewhere. Recorded
      in verification-first above.
