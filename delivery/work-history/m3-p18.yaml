      The refusal reason account-in-savings-ring is gone root and branch
      (union, arm, routing, whitelist, SETUP_LINKED, three catalogues), the
      three superseded skill sentences are gone, exactly two null-flow
      reads exist and both are ring-scoped, the held read carries no flow
      condition and no sum, the migration touches only the accounts table,
      and the detection script groups by canonical form with the surviving
      guard wiring; each is pinned by a fast-gate test that was shown red
      against the dangerous state.
