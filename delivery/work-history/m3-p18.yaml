prompt: |
  You are the IMPLEMENTER for Pulse phase M3-P18 (savings statements held,
  canonical backfill migration). Your composed role brief is at
  /tmp/claude-0/-home-user-pulse/675e0551-6f95-56a2-81c0-05a797f5bf41/scratchpad/brief-m3p18.md
  read it fully FIRST and follow its contract. Node: export NVM_DIR=/opt/nvm
  && . /opt/nvm/nvm.sh. Read /home/user/pulse/CLAUDE.md and ALL THREE skills
  it names (pulse-domain, pulse-frontend, pulse-typescript): this phase
  touches the domain (flow classification, held rows), the UI (three
  catalogues, screen states) and migrations.

  Setup: git -C /home/user/pulse worktree add /home/user/wt-m3p18 -b
  claude/m3-p18-savings-held-and-migration origin/main. Your phase section is
  M3-P18 in delivery/plan/pulse-v02.yaml on current main (head dee3d32 or
  later): criteria 18.1 through 18.6 are your spec, the steps are your order
  (the verification-first step is FIRST: capture the baselines it names
  before editing anything). The phase implements owner decision DR-0030
  (delivery/decisions/DR-0030.yaml): a savings statement is accepted, its
  rows held out of every total, shown as held.

  Carried into your brief as work, beyond the plan's own steps:
  - R2-M3P18-01 (low, from delivery/review/m3-p18-plan-review-round2.yaml):
    the detection script's selection must GROUP BY canonical form and emit
    groups of two or more rows (a spaced+compact pair BOTH members), never
    "rows whose stored form is not canonical" alone.
  - R2-M3P18-02 (medium): scripts/detect-account-collisions.ts must pin to
    the SURVIVING guard contract only: resolve-env.ts readings plus
    assessNonProductionDbTarget/assessDestructiveDbTarget from
    src/platform/db/guard.ts and their hatches. The modules target-guard.ts,
    runtime-target.ts, gate-target.ts, connection-string.ts NO LONGER EXIST
    (withdrawn by D-62, merged); if you find a reference in any precedent you
    copy from, it is stale, do not reintroduce.
  - The plan's parked entries and the findings the phase text says ride its
    steps (P14-001, P14-006, P17-004/006/007/009) are part of your criteria
    text; read them where the plan cites them.

  Constraints: files-to-touch is the phase declaration; facts are immutable
  (never rewrite a stored transaction row; the backfill canonicalises the
  DECLARATION column Account.iban only, exactly as 18.4 specifies); amounts
  integer cents; all copy in English, Dutch, French, English written first;
  design tokens only. DATABASE SAFETY: ambient DATABASE_URL points at a
  deployed pooler for a DIFFERENT project of the owner's; pin every db
  command to a local target explicitly; there is NO local Postgres in this
  container (no Docker), so database-connected work is authored as code +
  slow-gate specs but cannot be executed here.

  Gates before finishing, recorded with exit codes: npm run typecheck, lint,
  npm test, gate:privacy, gate:decisions, gate:tokens, npm run build (DB env
  pinned to an invented localhost). The slow-gate specs you write
  (direct-PrismaClient, per 18.3/18.4/18.5) and npm run test:e2e CANNOT run
  here: record them as environment-limited in the work history with the
  exact commands a capable container must run; the slice does not close
  until they pass somewhere. Do not fake them, do not skip writing them.

  Write delivery/work-history/m3-p18.yaml per the schema (validate with npx
  --prefix /home/user/pulse-fleet tiphys validate --type work-history ...).
  Commits: English, no em dashes, NO data values (rule 8: no amount, no
  counterparty, no account number in any commit message; invented
  identifiers in fixtures must be on test/fixtures/allowed-identifiers.txt
  with provenance you add in the same commit), no model names. Push -u
  origin claude/m3-p18-savings-held-and-migration (4 retries backoff,
  network failures only). No PR, no merge, no plan edits; if the plan is
  wrong, stop and say so.

  Return: head SHA, gates table, files changed summary, per-criterion status
  (built and fast-gate-witnessed vs authored-but-environment-limited),
  per-carried-finding disposition, anything not done with reason.
