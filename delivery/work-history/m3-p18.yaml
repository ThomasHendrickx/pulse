        prisma/schema/migrations/20260827120000_canonical_account_iban_backfill/migration.sql:19:-- removed. The whitespace class is written [[:space:]] and not a
        prisma/schema/migrations/20260827120000_canonical_account_iban_backfill/migration.sql:53:SET "iban" = upper(regexp_replace(a."iban", '[[:space:]]', '', 'g'))
        prisma/schema/migrations/20260827120000_canonical_account_iban_backfill/migration.sql:55:  AND a."iban" IS DISTINCT FROM upper(regexp_replace(a."iban", '[[:space:]]', '', 'g'))
