      this expression strips.
  - mechanism: >-
      A MONEY AGGREGATE JOINED TO A TABLE THAT IS NOT UNIQUE ON THE JOIN
      KEY. The reserves read joined a transaction to the accounts table
      on the CANONICAL FORM of an account number, which is not a unique
      key of that table and is deliberately not one in this phase,
      because the backfill PRESERVES a pair of rows sharing one canonical
      form rather than guessing which to merge. Every matching row
      therefore multiplied the transaction, and the GROUP BY turned the
      multiplication into one group per pair member each carrying the
      full amount. The general shape, which is what a reader should carry
      away: an aggregate may only join on a key the joined table is
      unique on, and where it is not, the uniqueness must be imposed by
      the query (a LATERAL with LIMIT 1, a DISTINCT ON, or a
      pre-aggregation) rather than assumed.
    derivation:
      command: >-
        grep -rn -A2 "JOIN " --include="*.ts" src/ | grep -v node_modules
        (every JOIN in every SQL read under src, with its ON clause,
        classified by hand against the schema's keys)
      output: |
        overview-repository.ts:84  JOIN "transactions" p ON p."householdId" = t."householdId" AND p."id" = CASE ...
                                   -> joins on p."id", the primary key: at most one row. SAFE.
        overview-repository.ts:124 LEFT JOIN "merchants" m ON m."id" = t."merchantId" AND m."householdId" = t."householdId"
                                   -> joins on m."id", the primary key: at most one row. SAFE.
        overview-repository.ts:126 LEFT JOIN "merchant_tags" mt ON mt."merchantId" = t."merchantId" AND mt."isPrimary" AND mt."householdId" = t."householdId"
                                   -> NOT a primary key. Uniqueness is imposed by a partial unique index,
                                      merchant_tags_one_primary_per_merchant ON "merchant_tags"("merchantId") WHERE "isPrimary"
                                      (migration 20260820084740_one_primary_per_merchant). At most one row. SAFE,
                                      and it is the SIBLING of this mechanism: its safety is a database constraint,
                                      so dropping that index would fan this join out exactly as the reserves join fanned out.
        overview-repository.ts:130 LEFT JOIN "tags" pt ON pt."id" = mt."tagId" AND pt."householdId" = t."householdId"
                                   -> joins on pt."id", the primary key: at most one row. SAFE.
        overview-repository.ts:235 LEFT JOIN LATERAL (SELECT m."label" FROM "accounts" m WHERE ... ORDER BY m."id" ASC LIMIT 1) a ON TRUE
                                   -> THE FIXED SITE. At most one row by construction of the subquery.
        overview-repository.ts:301 JOIN "accounts" a ON a."id" = t."accountId" AND a."householdId" = t."householdId"   (monthFigures)
                                   -> joins on a."id", the primary key: at most one row. SAFE.
        overview-repository.ts:392 JOIN "accounts" a ON a."id" = t."accountId" AND a."householdId" = t."householdId"   (listGapRows)
                                   -> joins on a."id", the primary key: at most one row. SAFE.
        overview-repository.ts:465 JOIN "accounts" a ON a."id" = t."accountId" AND a."householdId" = t."householdId"   (listHeldRows)
                                   -> joins on a."id", the primary key: at most one row. SAFE.
    not-covered: >-
      Reading of the output FIRST: eight JOIN sites under src, all in the
      overview repository, and EXACTLY ONE of them joined on a
      non-unique key with no uniqueness imposed. That one is fixed. One
      other (merchant_tags) is unique only by a partial index rather than
      by a key, and is named here as this mechanism's sibling so the next
      reader knows the rule is not local. WHAT THE DERIVATION DID NOT
      COVER: (a) it enumerates SQL written as raw text under src, so a
      fan-out arising from a Prisma client `include` or a nested
      `findMany` would not appear in it; none of the money reads use
      those, but the search cannot say so. (b) It covers src only:
      prisma/seed.ts, the migrations and scripts/ were not swept, on the
      ground that none of them aggregates money for a screen. (c) It does
      not reach fan-out that arises OUTSIDE a query, for example the same
      group being summed twice by two callers; the invariant assertion
      added in the slow gate (the reserves block's net equals the
      reconciliation's own net to reserves) is what covers that, and it
      covers it for the reserves block alone.
  - mechanism: >-
      A GUARD WHOSE PREDICATE IS BROADER THAN THE PROPERTY IT PROTECTS.
      The ring-change guard exists so that no row can be left carrying an
      interpretation computed against the ring it left, and it tested
      "does this account carry ANY imported row". The two were the same
      thing only while a savings account could not have rows at all, and
      DR-0030, which this very phase implements, ended that. From the
      first accepted savings statement the broad predicate refused a
      correction the narrow property permits, and it did so silently and
      permanently. The general shape: when a guard's predicate is a proxy
      for a property, the proxy is only as good as the invariant that
      links them, and a phase that changes that invariant owns every
      guard standing on it.
    derivation:
      command: >-
        grep -rn "hasImportedRows" --include="*.ts" --include="*.tsx"
        src/ test/ scripts/ | grep -v node_modules
      output: |
        src/modules/ledger/application/index.ts:84:export const hasImportedRows = (
        src/modules/ledger/application/index.ts:87:): Promise<boolean> => repository.hasImportedRows(context, accountId);
        src/modules/ledger/adapters/ledger-repository.ts:144:export const hasImportedRows = async (
        src/modules/accounts/ui/actions.ts:22:  hasImportedRows,
        src/modules/accounts/ui/actions.ts:38:  hasImportedRows,
        src/modules/accounts/application/change-account-ring.ts:47://   decided here: hasImportedRows stays flow-agnostic and no ring-change
        src/modules/accounts/application/ports.ts:80:  readonly hasImportedRows: (
        src/modules/accounts/application/change-account-ring.ts:96:    (await deps.ledger.hasImportedRows(context, input.accountId))
        test/application/account-setup.test.ts:93:        hasImportedRows: async (_context, accountId) =>
        test/application/account-setup.test.ts:530:        hasImportedRows: async () => false,
    not-covered: >-
      Reading of the output FIRST: one definition, one published export,
      one port declaration, one composition-root binding, exactly ONE
      call site that decides anything (change-account-ring.ts:96), one
      comment quoting the superseded justification, and two test fakes.
      The single deciding call site is the one narrowed. WHAT THE
      DERIVATION DID NOT COVER, and it is the part that matters: this
      grep finds the guard by NAME, so a SECOND guard standing on the
      same invariant under a different name would not appear in it. The
      invariant is "a reserve-ring account's own rows carry no flow", and
      it is now stated at the guard that maintains it. I looked for other
      standers by reading rather than by pattern: the interpretation
      window (interpret-window.ts:37, which is where the invariant comes
      from), the held read (keyed on the ring, no flow condition), the
      uninterpreted count and the gap listing (both now ring-scoped in
      the WHERE, see the next entry) and the import gate (which no longer
      refuses on the ring at all). No other guard was found; a clean-room
      lane is the check on that reading, not this grep.
