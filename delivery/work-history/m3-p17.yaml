claims:
  - id: C-17.4-scope
    kind: coverage
    statement: >-
      This branch's diff against its merge base carries exactly one new
      route, its unit test, and the one-block addition to
      test/e2e/prod-smoke.spec.ts, and no other file.
    settled-by:
      executed-construction:
        command: "git diff --name-only origin/main...HEAD (origin/main at f19984b, HEAD at 8dc9678)"
        exit-code: 0
        output: |
          src/app/api/health/version/route.ts
          test/app/health-version.test.ts
          test/e2e/prod-smoke.spec.ts
  - id: C-17.2-two-vars-by-name
    kind: coverage
    statement: >-
      The route reads exactly the two environment variables the plan names,
      by those names, and no third.
    settled-by:
      executed-construction:
        command: "grep -n 'process\\.env' src/app/api/health/version/route.ts"
        exit-code: 0
        output: |
          41:    sha: buildFact(process.env.VERCEL_GIT_COMMIT_SHA),
          42:    deploymentEnvironment: buildFact(process.env.VERCEL_ENV),
  - id: C-17.4-no-dependency
    kind: coverage
    statement: >-
      This phase adds no dependency and no lockfile change.
    settled-by:
      executed-construction:
        command: "git diff --stat origin/main...HEAD -- package.json package-lock.json"
        exit-code: 0
        output: "(no output: the two files are byte-identical to origin/main)"
  - id: C-17-gate-decisions-preexisting
    kind: coverage
    statement: >-
      npm run gate:decisions fails on origin/main f19984b itself, before
      any of this phase's changes are applied, with the identical six
      review lanes over the two-round cap that it reports at this phase's
      final head, so the failure is a pre-existing condition of the branch
      point rather than something this phase introduced or could clear
      within its own file scope.
    settled-by:
      executed-construction:
        command: >-
          git checkout f19984b (detached, clean working tree, no phase
          changes applied) then npm run gate:decisions, in the same
          worktree
        exit-code: 1
        output: |
          > gate:decisions
          > bash scripts/gate-decisions.sh

          gate:decisions: review lane 'm0-p6-plan-review' carries 5 rounds, the cap is 2.
            What round two leaves open is carried into the implementer's brief as work, not into a third round.
          gate:decisions: review lane 'm3-p14-criteria' carries 3 rounds, the cap is 2.
            What round two leaves open is carried into the implementer's brief as work, not into a third round.
          gate:decisions: review lane 'm3-p14-plan-review' carries 4 rounds, the cap is 2.
            What round two leaves open is carried into the implementer's brief as work, not into a third round.
          gate:decisions: review lane 'm3-p16-plan-review' carries 5 rounds, the cap is 2.
            What round two leaves open is carried into the implementer's brief as work, not into a third round.
          gate:decisions: review lane 'm3-p3-criteria' carries 3 rounds, the cap is 2.
            What round two leaves open is carried into the implementer's brief as work, not into a third round.
          gate:decisions: review lane 'm3-p3-hazard' carries 3 rounds, the cap is 2.
            What round two leaves open is carried into the implementer's brief as work, not into a third round.
  - id: OQ-17-gate-decisions-remediation
    kind: open-question
    statement: >-
      This phase touches no file under delivery/review/ or
      delivery/decisions/ (files-to-touch is src/app/api/health/,
      test/app/ and test/e2e/prod-smoke.spec.ts), and step 4's own text
      closes this phase to further additions. I did not find a way to
      clear the pre-existing gate-decisions failure from within this
      phase's file scope; whether to accept the branch with this gate red
      (since it is unrelated to and no worse than main), or to fix the
      review lanes in a separate change before or alongside merging this
      phase, is left to the orchestrator.
    still-open-because: >-
      Fixing it means either editing or removing historical review
      records under delivery/review/, which is a decision about those
      review lanes and their authors, not about this route, and is
      outside this phase's declared files.
  - id: OQ-17-claim-grep-prompt-hit
    kind: open-question
    statement: >-
      Running the mandated claim-grep against this document leaves one hit
      unsettled by a construction: the word "needs" inside "e2e (npm run
      test:e2e) needs a local Supabase stack", which sits inside the
      `prompt` field. That field is required by the schema to carry the
      dispatch prompt verbatim (R-052a), so the sentence is a quotation of
      the instructions this phase was given, not an assertion this work
      history makes about the system, and it is left unedited rather than
      altered to dodge the grep.
    still-open-because: >-
      An earlier draft of this statement quoted the grep pattern's own
      token list verbatim, which tripped the pattern on this very
      sentence (several of the pattern's tokens are ordinary English
      words). Rephrased to describe the hit rather than quote the
      pattern. Left open rather than settled by construction because the
      only settlement available is a reading of the schema's own
      required-field rule (R-052a) against this one field, not an
      executable check.
environment-warnings:
  - warning: >-
      npm run gate:decisions fails on origin/main itself (six review lanes
      already exceed the two-round cap), independent of anything this
      phase changed. A later phase should not assume this gate is green on
      main; it must be checked, and cleared or explicitly waived, by
      whoever is authorized to touch delivery/review/.
    evidence: >-
      Checked at this phase's final head by temporarily checking out
      origin/main's tip (f19984b, the branch's own merge base) in the same
      worktree and running `npm run gate:decisions` there: it reported the
      identical six lanes over cap, so the failure predates this phase's
      own commit. That command and its full output are captured under
      claim C-17-gate-decisions-preexisting above.
  - warning: >-
      This container has no Docker daemon (docker info reports "failed to
      connect to the docker API at unix:///var/run/docker.sock ... dial
      unix /var/run/docker.sock: connect: no such file or directory") and
      no .env, only .env.example, so npm run test:e2e cannot start a local
      Supabase stack and playwright.config.ts's own gate-target check
      refuses to run against an ambient/ unset database target.
    evidence: >-
      `npx supabase start` returned
      {"_tag":"Error","error":{"code":"LegacyDockerLifecycleInspectError","message":"failed
      to inspect container health: failed to connect to the docker API at
      unix:///var/run/docker.sock; ... no such file or directory"}}.
      `npm run test:e2e` then failed at config load with
      GateDbTargetRefused: "no source named a database for this gate. The
      gate does not fall back to an ambient DATABASE_URL... Set
      PULSE_GATE_DATABASE_URL, PULSE_GATE_DIRECT_URL and
      PULSE_GATE_SUPABASE_URL, or put DATABASE_URL, DIRECT_URL and
      NEXT_PUBLIC_SUPABASE_URL in a .env file", thrown from
      src/platform/db/gate-target.ts:324 via playwright.config.ts:29. This
      matches the task's own stated environment limitation (no Docker in
      this container).
