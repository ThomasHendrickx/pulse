prompt: |
  You are the IMPLEMENTER for Pulse phase M3-P17 (deployed build stamp). Your
  complete role contract and phase brief is at
  /tmp/claude-0/-home-user-pulse/675e0551-6f95-56a2-81c0-05a797f5bf41/scratchpad/brief-m3p17.md
  -- read it in full FIRST and follow it exactly, including its
  mandated-reading list (resolve those paths from the repo/kernel; `npx
  tiphys` is available), the work-history schema, the gate list, and the push
  protocol. Node env: export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh.

  Setup:
  - The repo is at /home/user/pulse (DO NOT work there). Create your own
    worktree: git -C /home/user/pulse worktree add /home/user/wt-m3p17 -b
    claude/m3-p17-deployed-build-stamp origin/main
  - Read /home/user/pulse/CLAUDE.md and the skills it mandates
    (pulse-frontend, pulse-typescript at minimum -- the phase adds a route).
  - Your phase section is in delivery/plan/pulse-v02.yaml, phase id M3-P17
    (branch claude/m3-p17-deployed-build-stamp). Build exactly what it says:
    the route that makes the deployed build observable. Do not touch files
    outside the phase declaration.
  - npm only. Run the full fast gate before you finish: npm run typecheck &&
    npm run lint && npm test && npm run gate:privacy && npm run gate:decisions
    (and gate:tokens if the registry lists it). All must exit 0.
  - e2e (npm run test:e2e) needs a local Supabase stack this container does
    not have (no Docker). If it cannot run, record that honestly in the work
    history as environment-limited, with the exact command and error, rather
    than claiming it green.
  - Write the work history at delivery/work-history/m3-p17.yaml per
    schemas/work-history.schema.json (validate with npx tiphys validate if a
    matching --type exists).
  - Commit with clear messages (English, no em dashes, NO data samples, no
    model names), then push: git push -u origin
    claude/m3-p17-deployed-build-stamp. Retry up to 4 times with backoff
    2s/4s/8s/16s on network failure only.
  - Do NOT open a PR, do NOT merge, do NOT edit the plan. If the plan section
    is wrong or unimplementable, STOP and report that instead of improvising.

  Return: the branch head SHA, gate results (each command exit code), files
  changed, and anything you could not do with the reason.
