key-decisions:
  - decision: >-
      The route reads process.env.VERCEL_GIT_COMMIT_SHA and process.env.VERCEL_ENV
      directly inside the GET handler, at request time, rather than through
      src/platform/config.ts's normal confinement of process.env reads
      (pulse-typescript section 6, "no process.env anywhere else").
    why: >-
      The phase declaration's files-to-touch list is
      src/app/api/health/, test/app/ and test/e2e/prod-smoke.spec.ts;
      src/platform/config.ts is not on it, and the top-level task
      instruction is explicit that files outside the phase declaration are
      not touched. The two variables are Vercel platform facts, not
      application secrets, and the read happens inside the handler body at
      request time and not at module scope (checked at round 1: `grep -n
      'process\.env' src/app/api/health/version/route.ts` showed both reads
      at lines 41-42, both inside `GET()`, which began at line 39; no
      module-scope statement read either variable. RE-CHECKED AT THE FIX
      ROUND 1 HEAD after the marker moved to build-stamp.ts: the same grep
      now shows the two reads at lines 47-48, both inside `GET()`, which
      now begins at line 44; still no module-scope read, still true), which
      is the property config.ts's own comment calls BUILD-SAFE (src/platform/config.ts:1-10):
      a Vercel build importing this route module during page-data
      collection reads nothing and validates nothing. There is also
      existing precedent for process.env reads outside config.ts confined
      to src/platform/db/* (client.ts, resolve-env.ts, gate-target.ts,
      guard-cli.ts), so this is not the first exception in the tree. The
      exception and its scope are recorded in a comment at the route
      itself (mechanism-sibling clause), naming that any future sibling
      route needing the same two facts should read them the same way here
      rather than opening a third site.
  - decision: >-
      The two JSON field names are sha and deploymentEnvironment.
    why: >-
      The plan fixes the two environment variable names and the unstamped
      marker but not the JSON field names, leaving that choice to this
      phase. M3-P16's own criteria already refer informally to "the sha"
      and "the deployment-environment field" when describing what it reads
      from this route, so these names were chosen to match that
      vocabulary and reduce friction for the phase that consumes this
      route.
  - decision: >-
      The branch was rebased onto origin/main (f19984b) before the final
      gate run, after `npm run gate:privacy` first failed with pre-existing
      identifier-shape gaps in delivery/review/m3-p14-*.yaml that a later
      main commit (f19984b, "review: land every lane's verdicts with their
      quoted invented identifiers listed") had already fixed by extending
      test/fixtures/allowed-identifiers.txt.
    why: >-
      The worktree was created from origin/main at the moment of creation
      (ac9a8a0), and main moved forward by two commits (7b2dfc0, f19984b)
      while this phase worked. Rebasing picks up an unrelated fix already
      landed on trunk rather than this phase re-deriving or duplicating
      it, and it touches none of this phase's own three files (confirmed:
      `git diff --name-only origin/main...HEAD` still lists exactly the
      three files this phase owns after the rebase).
  - decision: >-
      FIX ROUND 1 (coordinator dispatch, both clean-room lanes returned
      FIX-ROUND-NEEDED on head 12c20f3). Moved `export const UNSTAMPED`
      out of src/app/api/health/version/route.ts into a new sibling file,
      src/app/api/health/version/build-stamp.ts, and repointed both
      importers (test/app/health-version.test.ts and
      test/e2e/prod-smoke.spec.ts) at the new module.
    why: >-
      CR-M3P17-01 / HZ-M3P17-01 (both lanes, severity high/critical):
      `npm run build` exited 1 at 12c20f3 with "UNSTAMPED is not a valid
      Route export field", because a Next.js App Router route module may
      only export its HTTP handlers and the segment config fields, and
      tsc --noEmit never runs that check, so the fast gate was green over
      a head whose production build (and therefore npm run test:e2e,
      whose chromium-prod project builds before it serves) could not pass
      in any environment, Docker or not. I reproduced this myself before
      touching any code (see verification-first below). The new file
      stays inside this phase's declared files-to-touch
      (src/app/api/health/), which both verdicts' concrete-fix already
      confirmed as available; the criteria lane named the file
      build-stamp.ts, the hazard lane named it unstamped.ts, and I used
      build-stamp.ts, since "build stamp" is the phase's own vocabulary
      (the plan's own title for M3-P17). Only the marker moved; buildFact
      stays in route.ts because it was never exported and never tripped
      the route-export check.
  - decision: >-
      FIX ROUND 1. Added an explicit `Cache-Control: no-store` header to
      the route's 200 response, plus one unit test asserting it.
    why: >-
      HZ-M3P17-02 (low): force-dynamic stops Next's static caching but
      emits no freshness header of its own, so an intermediary could
      apply heuristic freshness to a body whose entire purpose is telling
      a waiting phase (M3-P16) which build is currently live. A stale
      cached sha read by that phase is exactly the failure mode the
      hazard lane named.
  - decision: >-
      FIX ROUND 1. Corrected the route's comment, which said the marker
      "carries no hexadecimal-only characters", to the plan's own
      wording: the marker carries characters that are NOT hexadecimal
      digits.
    why: >-
      CR-M3P17-03 (low, R-087): the original sentence was false as
      written, since the marker "unstamped" DOES contain hexadecimal
      digits (a, d, e); the property that is actually true, and tested,
      is that not every character is hexadecimal, so the whole word can
      never match /^[0-9a-f]+$/i.
  - decision: >-
      FIX ROUND 1. Rebased the branch a second time onto origin/main's
      new tip (dc18484 at dispatch time) rather than leaving it on
      f19984b.
    why: >-
      HZ-M3P17-03 / CR-M3P17-02 (low): npm run gate:decisions was red at
      12c20f3 on six review lanes over the two-round cap, and both lanes
      independently confirmed by construction that the same six lanes
      are red at the branch's own merge base f19984b, i.e. pre-existing
      and not introduced by this phase. dc18484 ("review: keep at most
      two rounds per lane on main") already prunes them on trunk, one
      commit ahead of this phase's old merge base, so rebasing removes
      the open question entirely rather than leaving it for the
      orchestrator. Verified after rebasing: npm run gate:decisions
      exits 0 (see gate-evidence).
verification-first:
  - finding: >-
      No existing build stamp. Captured: `grep -rniE
      'VERCEL_GIT_COMMIT_SHA|VERCEL_URL|VERCEL_ENV|commitSha|buildId' src
      scripts test` exits 1 (no matches) in the worktree, and the same
      pattern over the eight top-level config files
      (eslint.config.mjs, next.config.ts, vitest.config.ts,
      playwright.deploy.config.ts, package.json, playwright.config.ts,
      tsconfig.json, postcss.config.mjs) also exits 1. `ls vercel.json
      .vercel` reports both absent. The only routes under src/app/api are
      health/db and health/pdf, neither of which names a build (read in
      full). So this phase adds the first build stamp rather than a
      second one.
    contradicts-plan: false
  - finding: >-
      The two platform variable names are fixed by the plan and not chosen
      here: VERCEL_GIT_COMMIT_SHA for the build commit, VERCEL_ENV for the
      deployment environment (whose three documented values are
      production, preview and development). The plan's own grounding
      section already settles that whether the platform sets either
      variable for this project is not verifiable from inside a fleet
      container, naming the reason (the connector returns 403 for this
      project); this phase did not re-attempt that check itself, per
      clause R-007 (not re-investigating a question the plan has already
      answered). A wrong variable name and an
      unset variable both answer "unstamped" forever and are
      indistinguishable in production, which is exactly why the names are
      pinned by the plan rather than left to this implementer's judgement.
    contradicts-plan: false
  - finding: >-
      Mechanism-index lookup (clause mechanism-lookup), checked before
      writing the route: `grep -n '^  - key:'
      node_modules/@tiphys/kernel/tuition/mechanism-index.yaml` lists 15
      keys (a-guard-s-own-failure-path, append-only-log,
      asserting-a-ci-step-is-wired, atomic-file-replacement,
      checking-a-generated-artifact-against-its-own-generator,
      claim-file-mutual-exclusion-by-o-excl,
      classifying-another-program-s-errors,
      deciding-what-another-program-will-do-by-pattern-matching-the-text-of-a-file-it-consumes,
      lease-compare-and-swap, parsing-another-program-s-reporter-output,
      reading-a-path-whose-type-is-not-established, shared-worktree,
      supervising-a-dispatched-agent, verifying-access-to-a-remote,
      worktree-removal-and-force-branch-delete). None of these mechanisms
      is used by this route: it opens no claim file, takes no lease, reads
      no append-only log, removes no worktree, deletes no branch,
      classifies no other program's errors and parses no other program's
      output. The index has no entry for "reading a platform-supplied
      environment variable and returning it as a diagnostic HTTP
      response", which is an acceptable, recorded answer under the clause
      rather than an omission.
    contradicts-plan: false
  - finding: >-
      FIX ROUND 1. Both clean-room verdicts' central finding (CR-M3P17-01
      / HZ-M3P17-01) reproduced myself before writing any fix, per the
      dispatch's instruction to verify their evidence rather than take it
      on trust. In this worktree at head 12c20f3, with DATABASE_URL,
      DIRECT_URL, NEXT_PUBLIC_SUPABASE_URL and
      NEXT_PUBLIC_SUPABASE_ANON_KEY pinned to invented local values:
      `npm run build` exits 1 with "Type error: Route
      src/app/api/health/version/route.ts does not match the required
      types of a Next.js Route. UNSTAMPED is not a valid Route export
      field." Compilation itself succeeded first ("Compiled successfully
      in 13.0s"); the route-export type check is what fails, exactly as
      both verdicts state. Also reproduced the typecheck escape hatch
      both lanes named: immediately after the failed build, with
      .next/types now present, `npm run typecheck` exits 2 with TS2344 on
      the generated route type naming property UNSTAMPED; removing
      .next/ and re-running typecheck alone exits 0 again, which is the
      exact state the fast gate was measured in during the previous
      round. Both findings independently confirmed rather than trusted.
    contradicts-plan: false
  - finding: >-
      FIX ROUND 1. Mechanism-index lookup re-checked before writing the
      fix (clause mechanism-lookup): the mechanism behind CR-M3P17-01 /
      HZ-M3P17-01 is that a Next.js special route file's exports are
      checked against a closed whitelist only during `next build`
      ("checking validity of types"), never during `tsc --noEmit`, so an
      extra named export on such a file is invisible to the fast gate and
      visible only to a gate this phase's own container can run without a
      database or Docker (npm run build). The index
      (node_modules/@tiphys/kernel/tuition/mechanism-index.yaml) still
      has no entry matching this shape (re-checked against the same 15
      keys listed above); this is a second recorded miss under the same
      acceptable answer as before, and it is the one this fix round adds
      the mechanism-sibling record for (see key-decisions and the comment
      at src/app/api/health/version/build-stamp.ts:1-14).
    contradicts-plan: false
deviations: []
fix-round:
  - mechanism: >-
      A Next.js App Router special route file's exports are checked
      against a closed whitelist (its HTTP handlers plus the segment
      config fields) only during `next build`'s own type-checking pass,
      never during `tsc --noEmit`, so any additional named export is
      invisible to the fast gate and visible only to a gate this
      container can run without a database or Docker.
    derivation:
      command: >-
        find src/app -name "route.ts" | sort; then find src/app -name
        "route.ts" -print0 | xargs -0 grep -Hn "export"
      output: |
        src/app/api/health/db/route.ts
        src/app/api/health/pdf/route.ts
        src/app/api/health/version/route.ts

        src/app/api/health/version/route.ts:15:// why it is not exported from here) AND THE TWO VARIABLE NAMES BELOW ARE
        src/app/api/health/version/route.ts:38:export const runtime = "nodejs";
        src/app/api/health/version/route.ts:39:export const dynamic = "force-dynamic";
        src/app/api/health/version/route.ts:44:export async function GET() {
        src/app/api/health/db/route.ts:32:export const runtime = "nodejs";
        src/app/api/health/db/route.ts:33:export const dynamic = "force-dynamic";
        src/app/api/health/db/route.ts:61:export async function GET() {
        src/app/api/health/pdf/route.ts:16:export const runtime = "nodejs";
        src/app/api/health/pdf/route.ts:17:export const dynamic = "force-dynamic";
        src/app/api/health/pdf/route.ts:19:export async function GET() {
    not-covered: >-
      The enumeration is scoped to src/app, where Next's App Router
      special files (route.ts, page.tsx, layout.tsx and siblings) live;
      it does not walk page.tsx or layout.tsx files, which carry a
      DIFFERENT export whitelist (default export plus named metadata
      exports) and were not touched by this phase or this fix round. It
      also only covers the tree as it exists at this commit: a route.ts
      added later could reintroduce the same mechanism, and nothing here
      guards against that beyond `npm run build` itself, which is why
      this fix round's key-decisions and the comment at
      src/app/api/health/version/build-stamp.ts:1-14 record the rule at
      the mechanism's definition for the next reader, and this work
      history records the miss against the mechanism index (the index
      has no entry for this shape, verification-first above), which is
      the channel this project uses to carry a mechanism rule forward
      past a single phase.
