kind: work-history
phase: M3-P4
prompt: |
  Ok after that a phase as well, 0.2.0 is a small thing but not real work. A small phase to prove 0.2.0 works
files-touched:
  - src/app/globals.css
  - src/modules/import/ui/import-result.tsx
  - playwright.config.ts
  - test/e2e/mobile-import.spec.ts
  - test/e2e/phone-helpers.ts
  - test/e2e/month-view.spec.ts
  - test/e2e/pressed-and-disabled.spec.ts
  - delivery/work-history/m3-p4.yaml
per-step-commits:
  - sha: 787055b
    subject: "M3-P4: the import flow is usable at phone width"
  - sha: fdedf35
    subject: "M3-P4: the pressed sweep knows the two import links by their new class"
key-decisions:
  - decision: >-
      This phase was run by the orchestrator session directly, as the first
      phase under @tiphys/kernel 0.2.0 (DR-0032), with no separate
      implementer dispatch. The prompt above is the owner's instruction
      verbatim.
    why: >-
      The owner asked for one small real phase, taken to main, to prove
      0.2.0 works end to end. M3-P4 is the smallest open phase in the plan
      (four criteria, three hazard classes, no migration) and needed no
      decision the plan had not already made. The two clean-room reviews
      are still dispatched to separate agents that did not write the code.
  - decision: >-
      The screens are made phone-first by sizing, not by a second tree: the
      import form stretches its controls to the column at the base width,
      every input, select, primary action and the result screen's link
      back clears --tap-target-min, and the existing single media condition
      returns the form to controls at their natural width at the desk.
    why: >-
      Step 2 asks for the phone layout with the desktop kept acceptable
      "through responsive CSS rather than a second tree", and criterion 7.3
      (M3-P7) counts distinct media conditions, so the widening sits inside
      the one condition globals.css already carries rather than a new one.
      No new token was needed: --tap-target-min exists (styles/tokens.css).
  - decision: >-
      The desk-versus-phone testid comparison (collectTestids) and the
      hiding comparison (collectHiding) moved out of
      test/e2e/month-view.spec.ts into test/e2e/phone-helpers.ts, unchanged
      apart from the export keyword, and month-view.spec.ts now imports
      them.
    why: >-
      Criterion 4.1 asks for "the three standing phone measurements M3-P7
      introduced". phone-helpers.ts exists so a second phone spec measures
      with the SAME instruments rather than a copy (its own header comment,
      M3-P14). Copying the two functions into the new spec would have been
      the drift that file was created to prevent.
  - decision: >-
      The new spec gives the step after each upload and each confirm a
      thirty second wait instead of the default five.
    why: >-
      On a cold dev server the first request to the confirmation route
      compiles it and parses a PDF; the first run of the spec timed out at
      five seconds on the heading while the page was still on /import. The
      longer wait bounds a compile, not a behaviour: every assertion that
      measures the screen runs after the element is visible.
  - decision: >-
      The first full slow-gate run at 787055b failed four tests, the two
      pressed-and-disabled journeys under the desk and the phone projects,
      all on one assertion: the swept control set is not the enumeration.
      The enumeration in test/e2e/pressed-and-disabled.spec.ts was amended
      so the two links back to the upload are keyed a.import-next instead
      of a; the sweep was not narrowed.
    why: >-
      The sweep keys each control by tag and class, and this phase gave the
      two links the class that sizes them to the tap target, so the keys
      changed while the controls did not. The spec's own M3-P13 precedent
      (and criterion 9.2(a) it cites) is to amend the enumeration when the
      two disagree. The appearance rules for links are declared at element
      scope (a:active, src/app/globals.css:1670), so the class brings no
      new appearance to measure. The re-run of that spec under both
      projects, and then the full suite, are green (gate-evidence).
verification-first:
  - finding: >-
      Criteria 4.2 and 4.4 already hold at this phase's base 03625ee, as
      step 1 (amended by D-15) expects. `git show
      03625ee:.claude/skills/pulse-frontend/SKILL.md | grep -c "desk
      activity"` prints 0, the same for "Desktop first" prints 0, and for
      DR-0022 prints 1. Line 113 of the skill states the mobile-first
      stance and names pulse-v0.2-pdf-addendum.md as a phone stance. So
      this phase consumes the constraint M3-P7 wrote and does not touch
      the skill.
    contradicts-plan: false
  - finding: >-
      Viewport meta: no file under src/ declares one (`grep -rln "export
      const viewport|name=\"viewport\"|width=device-width" src` prints
      nothing), and the served page carries Next.js's default `<meta
      name="viewport" content="width=device-width, initial-scale=1"/>`
      (read from the dev server's /sign-in response). Step 2's "verified
      present or added" is answered "present, by the framework default";
      the new spec's guard (window.innerWidth is 390 under the phone
      project's isMobile emulation, on /import) is the executable witness.
    contradicts-plan: false
  - finding: >-
      Baseline captured BEFORE any style change, with the new spec against
      the base styles under the phone project: the import screen reported
      two tap-target offenders, the file picker at 30px tall and the Upload
      button at 32px tall. After the form fix the result screens reported
      one more, the "Import another file" link at 24px tall. So the spec
      fails on the pre-phase tree and is not vacuous.
    contradicts-plan: false
deviations:
  - plan-clause: "branch: claude/m3-p4-mobile-import"
    why: >-
      Built on claude/tender-albattani-2btl5u, the branch this session is
      bound to push to, restarted from main at 03625ee after the kernel
      adaptation merged. The phase content is unaffected; only the branch
      name differs.
  - plan-clause: "files-to-touch (styles/tokens.css named; src/app/globals.css not named)"
    why: >-
      The import screens' rules live in src/app/globals.css (the
      .import-* block, M1-P2), so that is where the sizing had to change.
      tokens.css is untouched because the one token the phase needs,
      --tap-target-min, already exists. Criterion 4.3's colour grep runs
      over all of src/ and exits 1, so the file stays token-only.
  - plan-clause: "files-to-touch (test/e2e/ (mobile import spec))"
    why: >-
      Besides the new spec, three existing test files changed:
      test/e2e/phone-helpers.ts gained the two moved comparisons,
      test/e2e/month-view.spec.ts imports them instead of defining them, and
      test/e2e/pressed-and-disabled.spec.ts has two enumeration keys
      amended (key-decisions). All sit under the declared test/e2e/
      directory; recorded because the declaration names only the new spec.
  - plan-clause: "files-to-touch (src/app/layout.tsx, messages/en.json, messages/nl.json, messages/fr.json)"
    why: >-
      Declared and not touched: the viewport tag is present by framework
      default (verification-first), and no user-facing copy changed, so no
      catalogue needed an entry.
