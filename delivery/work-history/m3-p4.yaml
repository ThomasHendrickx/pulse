claims:
  - id: C-4.4-skill-untouched
    kind: coverage
    statement: >-
      This phase does not modify .claude/skills/pulse-frontend/SKILL.md.
    settled-by:
      executed-construction:
        command: "git diff --name-only 03625ee HEAD -- .claude/skills/pulse-frontend/SKILL.md"
        exit-code: 0
        output: "(no output)"
  - id: C-4.3-no-literal-colour
    kind: coverage
    statement: >-
      No literal oklch() or hex colour exists anywhere under src/.
    settled-by:
      executed-construction:
        command: "grep -rE \"oklch\\(|#[0-9a-fA-F]{3,8}\" src/"
        exit-code: 1
        output: "(no output)"
  - id: C-4-no-new-media-condition
    kind: coverage
    statement: >-
      globals.css still carries exactly one distinct media condition.
    settled-by:
      executed-construction:
        command: "grep -c \"@media\" src/app/globals.css"
        exit-code: 0
        output: "1"
environment-warnings:
  - warning: >-
      The Playwright version this repository pins (1.62.1) expects
      chromium_headless_shell-1234 and the container ships
      chromium_headless_shell-1194, so the first run failed at browser
      launch. The run used a container-local symlink from the expected path
      to the shipped headless shell. Nothing in the repository changed for
      it.
    evidence: >-
      "browserType.launch: Executable doesn't exist at
      /opt/pw-browsers/chromium_headless_shell-1234/chrome-headless-shell-linux64/chrome-headless-shell";
      after the symlink the same command launched and ran.
  - warning: >-
      Docker was not running at session start; the daemon was started and
      the local Supabase stack brought up with the unused services
      excluded. Every database and e2e command ran with DATABASE_URL,
      DIRECT_URL, E2E_DATABASE_URL, NEXT_PUBLIC_SUPABASE_URL,
      NEXT_PUBLIC_SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY pinned to
      that local stack. Migrations were applied with prisma migrate deploy
      to the fresh local database, because prisma migrate reset refuses to
      run under an agent without a consent string, and a freshly started
      local database has nothing to reset.
    evidence: >-
      `npx tsx src/platform/db/guard-cli.ts` printed "db guard: both
      connection strings target the local stack"; `npx prisma migrate
      deploy` ended "All migrations have been successfully applied."
