claims:
  - id: M3P2-C1
    kind: coverage
    statement: >-
      Criterion 2.1's annex pair is a real witness: with the template
      mutated to marker-anywhere page skipping, the fixture's
      transaction pages are dropped and the suite reddens on both halves
      (the in-description marker row and the totals), green with
      body-starts-with skipping.
    settled-by:
      executed-construction:
        command: "mutate belfius-current-account-template.ts annex check to body.some(line => line.includes(ANNEX_MARKER)); npx vitest run test/domain/belfius-pdf-template.test.ts; restore from backup"
        exit-code: 1
        output: >-
          Mutated: "Tests 6 failed | 1 passed (7)", including the
          PR2-002 pair test and the sum test (page 2's rows vanished so
          the balance identity broke). Restored: full suite 268 passed,
          0 failed.
  - id: M3P2-C2
    kind: coverage
    statement: >-
      The balance contract is a hard gate with a real red: with the
      mismatch branch in parse-pdf-statement.ts disabled, the
      non-reconciling fixture sails past FAILED and the criterion 2.2
      test reddens; enabled, the upload lands exactly one FAILED import
      with balance-mismatch and zero transaction rows.
    settled-by:
      executed-construction:
        command: "mutate parse-pdf-statement.ts gate condition to if (false); npx vitest run test/application/pdf-upload.test.ts -t balance-mismatch; restore"
        exit-code: 1
        output: >-
          Mutated: "Tests 1 failed | 3 skipped (4)" at the
          outcome-kind assertion. Restored: test green; the green run
          asserts status FAILED, failureReason balance-mismatch,
          world.transactions length 0.
  - id: M3P2-C3
    kind: coverage
    statement: >-
      The overlap witness fails a statement-scoped key emission
      (criterion 2.3, finding PR2-003): with the template emitting a
      per-file statement component instead of the booking year, the
      overlapping fixture re-adds every shared row.
    settled-by:
      executed-construction:
        command: "mutate template statementNumber emission to String(pages.length); npx vitest run test/application/pdf-upload.test.ts -t 'overlapping re-export'; restore"
        exit-code: 1
        output: >-
          Mutated: "expected 5 to be 3" (all five rows added, shared
          rows duplicated). Restored: green with added 3, known 2, and
          one stored row per dedup key.
  - id: M3P2-C4
    kind: coverage
    statement: >-
      layout-unsupported is fingerprint-driven, not vacuous: with the
      Belfius fingerprint mutated to match everything, the unknown-layout
      fixture is mis-routed into the template and the criterion 2.2 test
      reddens naming the wrong reason.
    settled-by:
      executed-construction:
        command: "mutate belfius template matches() to () => true; npx vitest run test/application/pdf-upload.test.ts -t layout-unsupported; restore"
        exit-code: 1
        output: >-
          Mutated: "expected 'unparseable' to be 'layout-unsupported'".
          Restored: green with FAILED, layout-unsupported, zero rows.
  - id: M3P2-C5
    kind: coverage
    statement: >-
      Criterion 2.4 was red before the widening and is green after: the
      spec-compat test parsed the exact e4ea3ba kind-less shape against
      the unwidened parser and failed on the missing discriminant, and
