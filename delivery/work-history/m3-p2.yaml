kind: work-history
phase: M3-P2
prompt: |
  You are the implementer for phase M3-P2 (pdf-belfius) of the Pulse v0.2
  delivery, severity critical. Your brief is
  /home/user/pulse-fleet/implementer-brief-m3-p2.md: read it fully first,
  including the appended fleet warnings; it is your contract. Your
  working tree is the fresh clone
  /home/user/pulse-fleet/worktrees/m3-p2-pdf-belfius on branch
  claude/m3-p2-pdf-belfius (based on main 7796fc9). Do all work there.
  The plan is delivery/plan/pulse-v02.yaml, phase M3-P2; the intake is
  delivery/intake/pulse-v0.2-pdf-addendum.md; read the pulse-domain
  skill (facts vs interpretation, source profiles, import status
  machine) and pulse-typescript before code; pulse-frontend for any UI
  copy work.

  Owner decision DR-0020 binds: the extraction dependency is pdfjs-dist,
  server-side only, behind the StatementParser adapter. Walk the phase's
  steps exactly as written in the plan, including its verification-first
  steps (the two falsified addendum claims are owned here: the
  SourceProfileSpec widening to a discriminated union with the
  recognition round-trip criterion 2.4 guarding pre-widening stored
  profiles, and the Belfius natural key facts). Honor every criterion,
  notably: the balance contract as a hard gate (opening balance plus
  rows equals closing, else FAILED with zero rows, criterion 2.2), the
  in-description BIJLAGE marker fixture (criterion 2.1: the full annex
  phrase inside a transaction description on a transaction page parses
  as a row while the real annex page contributes zero rows), the
  overlapping-statement dedup witness (criterion 2.3), the catalog copy
  update naming PDF alongside CSV in all three languages (criterion
  2.5), and the two-half privacy gates (criterion 2.6) with the honesty
  clause.

  FORMAT REFERENCE, privacy-critical: the real Belfius statement PDF is
  at /root/.claude/uploads/e8dfc624-eaf2-5480-bcf2-af6a168fb888/ (the
  file whose name starts with 0f79fa3d, the current-account statement;
  the other file, 39bada64..., is the KBC card for M3-P3). You may read
  it to build and verify the template. Its content NEVER leaves the
  container: no account numbers, holder names, amounts, dates,
  references or merchant strings from it in any committed file, commit
  message, or note. Committed fixtures are synthetic, generated by the
  fixture generator the plan specifies, with invented identifiers;
  verify the balance identity holds arithmetically in your synthetic
  fixtures the same way it does in the real statement. Before your final
  push, run the criterion 2.6 privacy gates and ALSO an independent
  scrub: extract the real PDF's identifier strings in-memory and grep
  the entire repo tree for each; every grep must exit 1.

  Environment: fleet warnings all apply (pin all five env values local
  for db and e2e, never ambient; sudo dockerd plus ~30s if docker is
  dead; Node 26 via nvm for tiphys; use -g for Playwright; paginate any
  auth listUsers). npm only; pdfjs-dist is the ONLY new dependency
  permitted (runtime; devDependencies for testing are per
  pulse-typescript's existing conventions, no new test frameworks).
  Integer cents; facts immutable; no em dashes; English identifiers.

  Work in small commits pushed incrementally (git push -u origin
  claude/m3-p2-pdf-belfius first push); if killed and resumed, reread
  your commits and continue. Red witness before green for every
  behavior. Before reporting: npm run typecheck, npm run lint, npm run
  gate:tokens, npm test, npm run test:e2e all exit 0;
  delivery/work-history/m3-p2.yaml schema-valid (context containing
  delivery/plan/pulse-v02.yaml) plus notes; final push confirmed with
  git ls-remote output in the report. Report: per-criterion status with
  executed evidence, the privacy scrub result, deviations declared the
  moment found, open questions, head sha.
