fix-round:
  - mechanism: >-
      Classifying reconstructed statement lines by TEXT SHAPE ALONE,
      guarded only by a sum-comparison integrity gate (finding HZ-001).
      The findings were a fabricated zero row, two silent zero-sum drops
      and a truncation; the mechanism is that any full line matching a
      structure regex acted as structure wherever it appeared, and any
      line matching nothing was silently skipped, while the balance gate
      is blind to every corruption that changes the sum by zero. Fixed
      at the mechanism: reconstructed lines now carry their left edge,
      the template classifies POSITIONALLY (indented lines are data
      whatever their shape; unrecognized margin-level lines inside an
      open block are structure errors), and within-file sequence numbers
      must be strictly consecutive.
    derivation:
      command: grep -n "TRANSACTION_START\|BALANCE_LINE\|BAND_LINE\|PAGE_MARKER\|ANNEX_MARKER\|isIndented" src/modules/import/domain/belfius-current-account-template.ts
      output: |
        71:export const ANNEX_MARKER = "BIJLAGE BIJ VERRICHTING";
        73:const PAGE_MARKER = /^(?:BLZ\.\s*:\s*\d+\/\d+|\d{2}-\d{2}-\d{4}\s+\d+\/\d+)$/;
        80:const BAND_LINE =
        82:const BALANCE_LINE =
        84:const TRANSACTION_START =
        123:    const markerIndex = page.findIndex((line) => PAGE_MARKER.test(line.text));
        130:    if (body[0]?.text.startsWith(ANNEX_MARKER) === true) {
        141:    const isIndented = (line: { readonly x: number }): boolean =>
        156:      if (isIndented(line)) {
        166:      const band = BAND_LINE.exec(line.text);
        175:      const balance = BALANCE_LINE.exec(line.text);
        185:      const start = TRANSACTION_START.exec(line.text);
        (Every shape matcher in the one existing template, enumerated
        AFTER the fix: the structural matchers at 166 to 190 are
        reachable only for margin-level lines because the isIndented
        branch at 156 consumes indented lines first; PAGE_MARKER and
        ANNEX_MARKER run before the margin split by design, page markers
        sitting mid-page horizontally and the annex check being
        body-starts-with.)
    not-covered: >-
      (1) Other templates: none exist yet; the KBC template is M3-P3's,
      and the registry's mechanism comment now instructs positional
      classification, but nothing mechanical forces a future template to
      use it. (2) The stated residue: a zero-amount FIRST transaction
      whose start line is corrupted still drops silently, because
      continuity has no lower anchor and a zero drop keeps the sum;
      every nonzero variant is caught by the balance gate and every
      non-first position by the open-block error or continuity. (3) The
      threat model is crafted DESCRIPTION CONTENT inside a bank-produced
      PDF, which the bank's own layout indents; a fully adversarial PDF
      controls x coordinates too and can fabricate an entire statement,
      which no parser-side check reaches.
  - mechanism: >-
      A field validated at the boundary and consulted by no consumer
      (finding HZ-002): templateVersion was checked for shape at parse
      time and then discarded by the adapter, so the mechanism that
      exists to witness code identity was inert and a future version
      bump would silently re-parse stored bytes under different code.
      Fixed by making the shared parse path compare the DECLARED version
      against the registered template's version (fail closed) and the
      upload path refuse a stale-version stored profile loudly instead
      of silently twinning it.
    derivation:
      command: grep -rn "templateVersion" src/ --include=*.ts --include=*.tsx
      output: |
        src/modules/import/application/upload-statement.ts:98: candidate.spec.templateVersion !== detectedSpec.templateVersion (the stale-twin refusal)
        src/modules/import/domain/pdf-template.ts:72: the bump-procedure comment
        src/modules/import/domain/source-profile.ts:74,125-131,137: the spec type and boundary validation
        src/modules/import/domain/parse-pdf-statement.ts:26 (comment), plus the declaredVersion parameter and mismatch branch
        src/modules/import/adapters/statement-parser.ts:64 (detect emits the registry version), :83 (parse passes spec.templateVersion through)
        (Post-fix enumeration: every site that touches the field, with
        the two consumers, parse-pdf-statement's mismatch branch and
        upload-statement's stale-twin refusal, present where before the
        fix the only non-boundary site was the adapter discarding it.)
    not-covered: >-
      The enumeration covers src/ only; test/ references construct specs
      deliberately. The migration itself (what a future bump must do to
      stored profiles and imports) is documented as procedure at the
      registry but not built, because no version 2 exists; the fail-closed
      behaviour is what makes forgetting it loud instead of silent.
  - mechanism: >-
      Reading a moving infrastructure failure as test flakiness (finding
      CR-903). The finding was a chromium "Page crashed" on a different
      pre-existing test per run; the mechanism was resource exhaustion
      OUTSIDE the suite: this container's root filesystem hit 100% full
      (54MB free) and the kernel log showed chrome-headless-shell
      Compositor processes trapping. Reclaimed ~3GB of regenerable
      caches (npm cache, node compile cache, a 1.1GB scratch clone left
      in the shared session scratchpad); the immediately following full
      suite passed 19 of 19 with zero new Compositor traps.
    derivation:
      command: "free -h; df -h /dev/shm /tmp; df -h /; dmesg | tail -5 (before reclaim); df -h / and full e2e run (after)"
      output: |
        Before: Mem 15Gi total, 13Gi available; /dev/shm 16G, 0% used;
        /dev/vda 252G, avail 54M, Use% 100%.
        dmesg: five entries of the form "traps: Compositor[NNNN] trap
        int3 ... in chrome-headless-shell[...]" across the failing runs.
        After reclaim: /dev/vda avail 3.2G (92%); npm run test:e2e
        EXIT=0, 19 passed (2.7m); dmesg tail shows no Compositor trap
        newer than the failing run.
    not-covered: >-
      The review container's own disk state was not observable from this
      session, so the classification there is inferred from the
      identical failure shape (moving, non-assertion, renderer-level,
      green in isolation) rather than measured; if their crashes recur
      on a machine with ample disk, the classification must be reopened.
      The chromium launch flags added alongside
      (--disable-dev-shm-usage, --disable-gpu) are hardening, explicitly
      NOT credited with the fix in the config comment.
