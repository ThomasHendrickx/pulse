claims:
  - id: M3P2-C1
    kind: coverage
    statement: >-
      Criterion 2.1's annex pair is a real witness: with the template
      mutated to marker-anywhere page skipping, the fixture's
      transaction pages are dropped and the suite reddens on both halves
      (the in-description marker row and the totals), green with
      body-starts-with skipping.
    settled-by:
      executed-construction:
        command: "mutate belfius-current-account-template.ts annex check to body.some(line => line.includes(ANNEX_MARKER)); npx vitest run test/domain/belfius-pdf-template.test.ts; restore from backup"
        exit-code: 1
        output: >-
          Mutated: "Tests 6 failed | 1 passed (7)", including the
          PR2-002 pair test and the sum test (page 2's rows vanished so
          the balance identity broke). Restored: full suite 268 passed,
          0 failed.
  - id: M3P2-C2
    kind: coverage
    statement: >-
      The balance contract is a hard gate with a real red: with the
      mismatch branch in parse-pdf-statement.ts disabled, the
      non-reconciling fixture sails past FAILED and the criterion 2.2
      test reddens; enabled, the upload lands exactly one FAILED import
      with balance-mismatch and zero transaction rows.
    settled-by:
      executed-construction:
        command: "mutate parse-pdf-statement.ts gate condition to if (false); npx vitest run test/application/pdf-upload.test.ts -t balance-mismatch; restore"
        exit-code: 1
        output: >-
          Mutated: "Tests 1 failed | 3 skipped (4)" at the
          outcome-kind assertion. Restored: test green; the green run
          asserts status FAILED, failureReason balance-mismatch,
          world.transactions length 0.
  - id: M3P2-C3
    kind: coverage
    statement: >-
      The overlap witness fails a statement-scoped key emission
      (criterion 2.3, finding PR2-003): with the template emitting a
      per-file statement component instead of the booking year, the
      overlapping fixture re-adds every shared row.
    settled-by:
      executed-construction:
        command: "mutate template statementNumber emission to String(pages.length); npx vitest run test/application/pdf-upload.test.ts -t 'overlapping re-export'; restore"
        exit-code: 1
        output: >-
          Mutated: "expected 5 to be 3" (all five rows added, shared
          rows duplicated). Restored: green with added 3, known 2, and
          one stored row per dedup key.
  - id: M3P2-C4
    kind: coverage
    statement: >-
      layout-unsupported is fingerprint-driven, not vacuous: with the
      Belfius fingerprint mutated to match everything, the unknown-layout
      fixture is mis-routed into the template and the criterion 2.2 test
      reddens naming the wrong reason.
    settled-by:
      executed-construction:
        command: "mutate belfius template matches() to () => true; npx vitest run test/application/pdf-upload.test.ts -t layout-unsupported; restore"
        exit-code: 1
        output: >-
          Mutated: "expected 'unparseable' to be 'layout-unsupported'".
          Restored: green with FAILED, layout-unsupported, zero rows.
  - id: M3P2-C5
    kind: coverage
    statement: >-
      Criterion 2.4 was red before the widening and is green after: the
      spec-compat test parsed the exact e4ea3ba kind-less shape against
      the unwidened parser and failed on the missing discriminant, and
      its second half round-trips specEquals recognition against the
      detect-emitted spec so a pre-widening stored profile is recognised
      by findProfileBySpec without re-asking the declaration.
    settled-by:
      executed-construction:
        command: "npx vitest run test/domain/spec-compat.test.ts (at 42a3af4, pre-widening src); then again after the widening commit 0ccfe96"
        exit-code: 1
        output: >-
          Pre-widening: "Tests 1 failed | 1 passed (2)", failing at
          expect(parsed.value.kind).toBe('delimited') with undefined.
          Post-widening: 2 passed; and git diff --name-only 7796fc9
          HEAD shows no deleted files under test/ (checked, zero D
          entries).
  - id: M3P2-C6
    kind: coverage
    statement: >-
      The privacy gates ran with a probe list read from the real PDFs in
      the container uploads, both halves, plus the dispatch's
      independent whole-tree scrub, and the phase corrected two of its
      own leaks loudly along the way (both upload file names, which
      embed real identifiers, were scrubbed out of the notes and out of
      the pushed history by two branch rewrites, each verified by
      grepping every rewritten commit).
    settled-by:
      executed-construction:
        command: "node scratchpad/privacy-scrub.mjs (in-memory probes from both real PDFs: IBANs spaced+compact, card groups, name forms, statement-number contexts, merchant strings, long references, thousands-form amounts, dates in all three forms)"
        exit-code: 0
        output: >-
          half-a whole-tree: 45 probes, 0 hits (every grep exit 1).
          half-b phase-written (added files whole, modified files
          added-lines only): 116 probes, 0 hits. PRIVACY SCRUB CLEAN,
          exit 0. Residues recorded: the bare token SUPABASE (a KBC
          merchant) equals the project's database stack name present at
          base, so it is excluded as a probe with a written note; the
          plan-recorded M1-era baseline collisions (two thousands-form
          amounts, one date string) sit on lines this phase did not
          write.
  - id: M3P2-C7
    kind: coverage
    statement: >-
      Fixture bytes are stable and pinned: building the fixtures twice
      in one process yields identical bytes, and the committed PDFs
      equal the generator's output byte for byte, asserted in the fast
      gate.
    settled-by:
      executed-construction:
        command: "npx vitest run test/domain/pdf-fixtures.test.ts"
        exit-code: 0
        output: >-
          2 passed: generate-twice equality and committed-bytes
          equality over all four fixtures.
  - id: M3P2-Q1
    kind: open-question
    statement: >-
      I did not find a dangerous-state red for hazard H2.3's
      nondeterminism half: forcing a DIFFERENT extraction between ingest
      and re-parse inside one test process would require a seam (clock,
      randomness, environment read) that the extraction path
      deliberately lacks. The standing witnesses are the
      determinism test (same bytes parsed twice, deep-equal statements)
      and the unchanged-spec PDF re-parse strict no-op test (zero key
      changes, zero row changes), plus the lockfile pin on pdfjs-dist; a
      library upgrade that changes text-item geometry would surface as a
      red re-parse no-op or a red fixture test rather than silently.
  - id: M3P2-Q2
    kind: open-question
    statement: >-
      Cross-statement sequence continuity for the Belfius format rests
      on the owner's format knowledge plus one observed statement
      (continuity holds within it). The year-scoped key's dedup
      correctness does not depend on continuity; what continuity rules
      out is two DIFFERENT transactions sharing a year and sequence
      number on one account within a year. Re-verify when a second real
      statement is available.
  - id: M3P2-Q3
    kind: open-question
    statement: >-
      Criterion 2.8 (the post-merge deploy check: the deployed import
      screen accepts the synthetic Belfius fixture and reaches the
      rows-added state against the deployed URL, proving pdfjs-dist runs
      in the Vercel Node runtime) is deferred to the orchestrator's
