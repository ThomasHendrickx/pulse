key-decisions:
  - decision: >-
      The StatementParser port keeps its one-port two-method shape (D-2)
      but both methods now return Promises; the delimited path stays a
      pure synchronous computation wrapped in a resolved Promise, and
      the one adapter (adapters/statement-parser.ts) routes on the PDF
      magic bytes alone.
    why: >-
      pdfjs-dist (the DR-0020 dependency) is Promise-based end to end
      with no synchronous entry point in the shipped package, so a
      synchronous port method could not call it at all; a second
      PDF-only port was the alternative and is exactly what D-2 rejects
      because recognition, account binding and re-parse all key on the
      one spec type.
  - decision: >-
      parseSourceProfileSpec normalises a kind-less stored spec to the
      delimited variant and detection emits kind "delimited", so BOTH
      sides of every specEquals comparison carry the discriminant.
    why: >-
      Criterion 2.4 / finding PR2-001: canonical-JSON specEquals
      compares key sets, so a stored pre-widening spec without kind
      against a detect-emitted spec with kind would read unequal and
      every existing source would be re-asked its declaration (hazard
      H2.4). Both sides normalised makes the recognition round-trip a
      structural property.
  - decision: >-
      D-4 wiring: the Belfius template emits the BOOKING YEAR as the
      row's statementNumber component and the 4-digit sequence as
      sequenceNumber, so the existing dedup mechanism (dedup.ts:95)
      produces nat:account:YYYY:SSSS unchanged.
    why: >-
      The addendum's year-scoped key rides the implemented natural-key
      mechanism without touching dedup.ts (whose stability contract
      marks key changes the costly direction); the overlap fixture
      witnesses that a re-exported statement maps shared year+sequence
      pairs onto existing keys, and the criterion 2.3 mutation probe
      showed a statement-scoped emission duplicating every shared row.
  - decision: >-
      The balance contract lives in parse-pdf-statement.ts, the SHARED
      path between the template registry and the port, rather than
      inside any template; templates return rows plus opening and
      closing and nothing else about balances (settled by the M3P2-C2
      construction: disabling the shared gate is what let the
      non-reconciling fixture through, proving the firing gate is the
      shared one).
    why: >-
      Every future template inherits the gate by construction (plan step
      6, hazard H2.2); a template author physically has no seam in which
      to forget it.
  - decision: >-
      Fixtures are real PDF bytes from a committed, dependency-free,
      deterministic generator (fixed layout, no metadata, no clock,
      ASCII only), with a fast-gate test pinning committed bytes to the
      generator's output, and the generator computes reconciling
      closings from opening plus sum rather than accepting them.
    why: >-
      D-3: real bytes keep pdfjs extraction and line reconstruction
      inside the tested path; computed closings make the balance
      identity hold arithmetically in the synthetic fixtures the same
      way it does in the real statement, and the byte-pin makes fixture
      drift a named red instead of a mystery.
  - decision: >-
      pdfjs-dist is declared in next.config.ts serverExternalPackages
      and loaded via dynamic import inside the adapter only.
    why: >-
      Bundled by Next, the legacy build resolves browser conditions and
      extraction throws at runtime: every PDF upload failed
      layout-unsupported in the dev server while identical bytes parsed
      in the fast gate. Externalized, the import is a plain Node module
      load; server-side only holds because only the adapter imports it
      and the adapter is only reached from server code. Found by the
      criterion 2.5 journey's first red run; recorded for the criterion
      2.8 deploy check as hazard H2.5's local twin.
  - decision: >-
      For a recognised PDF layout the confirmation screen renders the
      ask-once account declaration with the format question REMOVED (no
      format-name field, no spec editor); the spec and a
      template-id-derived profile name travel as hidden fields, and the
      stored profile is named by the template id.
    why: >-
      pulse-v0.2-pdf-addendum.md:27: only the format question
      disappears. The template id as profile name is a stable machine
      identifier, constant across languages, so (householdId, name)
      uniqueness keeps meaning one profile per source.
  - decision: >-
      Mechanism lookup (mechanism-lookup clause): the kernel
      tuition/mechanism-index.yaml is absent from this fleet home
      (/home/user/pulse-fleet/tuition does not exist, ls exit 2), so no
      mechanism entries could be read; the rules applied instead come
      from the plan, the skills and prior work histories, and the
      two-structurally-different-members witness rule was honoured in
      the mutation probes.
    why: >-
      The clause requires the lookup to be recorded even when the index
      is absent (the captured probe is the ls exit 2 above); not looking
      is not an answer, and the absence is a recordable fact.
verification-first:
  - finding: >-
      Spec seam, confirmed at 7796fc9 before any code:
      SourceProfileSpec (source-profile.ts:49) is a flat delimited-only
      record typing detect and parse (ports.ts:19 through :25),
      specEquals (source-profile.ts:217), hasNaturalKey
      (source-profile.ts:62), parseSourceProfileSpec (the Json boundary,
      consumed by import-repository.ts:113 and :169 and by
      ui/actions.ts:40 and the import detail route), and the fix-profile
      re-parse (fix-profile.ts via deps.parser.parse). Stored profile
      specs at the base carry NO kind field, so the D-2 widening must
      normalise the kind-less shape; proven by
      test/domain/spec-compat.test.ts, which parses a spec captured in
      the exact e4ea3ba shape and round-trips recognition against the
      detect-emitted spec, written and run RED against the unwidened
      parser first (expected "delimited", got undefined; 1 failed, 1
      passed).
    contradicts-plan: false
  - finding: >-
      Natural-key wiring (D-4), confirmed before any code: the
      implemented key is nat:accountId:statementNumber:sequenceNumber
      (dedup.ts:95) fed from row fields, so the Belfius template can
      emit the addendum's year-scoped key by placing the booking year in
      statementNumber and the sequence in sequenceNumber, with zero
      dedup.ts changes. Re-importing an adjacent or re-exported
      statement then maps shared year+sequence pairs onto their existing
      keys (witnessed by the criterion 2.3 overlap test and its
      statement-scoped mutation probe). Cross-statement sequence
      continuity REMAINS AN ASSUMPTION resting on the owner's format
      knowledge: the single real statement shows continuity only within
      itself, and this stays open until a second real statement is
      observed (claim M3P2-Q2).
    contradicts-plan: false
  - finding: >-
      pdfjs-dist's extraction API is Promise-based end to end
      (getDocument().promise, page.getTextContent()) with no synchronous
      entry point in the shipped package, a point the plan does not
      address, so the port's method RETURN TYPES become Promises while
      the port SHAPE that D-2 fixed (one port, detect bytes to spec,
      parse bytes plus spec to statement) stands. Blast radius:
      upload-statement, confirm-import, fix-profile and the import
      detail route gain awaits, and four test files needed mechanical
      edits (awaits and type annotations, zero assertion changes),
      declared as a deviation from the step-2 sentence that existing
      delimited tests stay unmodified.
    contradicts-plan: false
  - finding: >-
      The dispatch prose crossed the two upload file names: extraction
      shows the 0f79fa3d-* upload is the KBC-Mastercard Uitgavenstaat (2
      pages) and the 39bada64-* upload is the Belfius current-account
      statement (5 pages, fingerprint header on every page, band lines,
      two SALDO OP lines, annex last page), matching every structural
      fact the plan and scout notes record for the Belfius statement.
      Proceeded with 39bada64-* as the format reference; no plan content
      is affected. Also verified on the real statement: the page header
      carries the BANK'S OWN IBAN, so account identity must come from
      the band line only; and the bare BIJLAGE token occurs inside a
      transaction description on a transaction page, confirming
      PR2-002's trap.
    contradicts-plan: false
deviations:
  - plan-clause: >-
      Step 2, "every existing delimited test stays green unmodified".
    why: >-
      The union widening plus the async port (verification-first
      findings 1 and 3) made four existing test files fail typecheck as
      written: explicit SourceProfileSpec annotations on delimited
      literals and property accesses, and two synchronous port-detect
      calls. Edited mechanically only: kind fields added to literals,
      annotations narrowed to DelimitedSourceProfileSpec, awaits added
      (interpret, resolve-merchants), and reparse.test.ts pointed at the
      sync domain detectSourceProfile; ZERO assertion changes, zero
      deleted tests (criterion 2.4's testable half, no deleted files
      under test/, holds). Every pre-existing test runs green.
  - plan-clause: >-
      files-to-touch (phase M3-P2): the list omits files the phase in
      fact required: the application use cases beyond ports.ts
      (upload-statement.ts, confirm-import.ts, fix-profile.ts, index.ts,
      all awaiting the async port and mapping the two new failure
      reasons), the confirmation and result UI components
      (profile-confirmation.tsx, import-result.tsx: format question
      removed for recognised layouts, new failure reasons rendered), the
      import detail route (src/app/(app)/import/[id]/page.tsx, which
      re-runs detection and parsing and had to go through the composite
      parser), and next.config.ts (serverExternalPackages for
      pdfjs-dist).
    why: >-
      Each is a forced consequence of steps the plan does order
      (asyncification, D-5 reasons, the disappearing format question,
      H2.5's bundling failure). Declared here and in the notes the
      moment found so the phase declaration can be amended on the base
      branch before the scope audit.
  - plan-clause: >-
      files-to-touch lists src/modules/import/domain/dedup.ts and
      src/modules/import/ui/status-keys.ts, neither of which was
      modified.
    why: >-
      dedup.ts: the D-4 verification-first outcome routes the year
      through the existing key mechanism, so no dedup change was owed
      and its stability contract stays untouched. status-keys.ts: the
      two new failure reasons render through the import result's
      failureReason mapping, not through a ?status= selector, so no new
      whitelisted status value exists.
  - plan-clause: >-
      The dispatch prompt's file mapping (0f79fa3d as the Belfius
      statement).
    why: >-
      The mapping is swapped in the dispatch prose; verification-first
      finding 4 records the evidence, and the 39bada64-* upload was used
      as the Belfius format reference. Plan content is unaffected.
