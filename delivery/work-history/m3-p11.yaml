prompt: |
  You are the IMPLEMENTER for Pulse phase M3-P11 (optimistic naming: the
  feedback chain, decisions DR-0025 and DR-0026). Repo /home/user/pulse
  (never work in it directly). Node: export NVM_DIR=/opt/nvm &&
  . /opt/nvm/nvm.sh. Read /home/user/pulse/CLAUDE.md and ALL THREE skills
  (pulse-domain, pulse-frontend, pulse-typescript), this phase is a UI
  behavior phase over the naming action.

  Setup: git -C /home/user/pulse worktree add /home/user/wt-m3p11 -b
  claude/m3-p11-optimistic-naming origin/main, then cd there, npm install,
  and compose your role brief YOURSELF: npx --prefix /home/user/pulse-fleet
  tiphys brief compose --role implementer --phase
  delivery/plan/pulse-v02.yaml --phase-id M3-P11 (run npm install in
  /home/user/pulse-fleet first if node_modules is missing there). Read the
  composed brief IN FULL and follow its contract: mandated reading,
  work-history schema, generated gate list, push protocol, scope rules.

  Your phase section is M3-P11 in delivery/plan/pulse-v02.yaml on current
  main (branch claude/m3-p11-optimistic-naming): the naming action predicts
  its result per decision DR-0025 (optimistic update with a LOUD revert on
  failure) and DR-0026 (toast on failure). The phase's criteria are your
  spec; its steps are your order; the verification-first step runs before
  any edit. Read decisions DR-0025 and DR-0026 in delivery/decisions/,
  they are decided owner records and bind the shape.

  Environment constraints: no Docker, so no Supabase auth service: browser
  e2e journeys are AUTHORED but cannot run here; a bare Postgres 16 binary
  exists if a direct-database witness helps (throwaway cluster only,
  DATABASE_URL/DIRECT_URL pinned to 127.0.0.1 and the parsed host asserted
  first; the ambient env points at a foreign deployed pooler, never touch
  it). Record every unrunnable arm as environment-limited with the exact
  owed command.

  Gates before finishing, all recorded with exit codes: npm run typecheck,
  lint, npm test, gate:privacy, gate:decisions, gate:tokens, npm run build
  (DB env pinned to an invented localhost). Design tokens only, no literal
  colours/sizes/spacing; all copy in EN/NL/FR, English first; no em dashes
  anywhere; amounts stay integer cents; facts immutable.

  Write delivery/work-history/m3-p11.yaml per the schema (validate with
  npx --prefix /home/user/pulse-fleet tiphys validate --type work-history
  ...). Commits: English, no em dashes, no data values, no model names.
  Push -u origin claude/m3-p11-optimistic-naming (4 retries backoff,
  network failures only). No PR, no merge, no plan edits; if the plan
  section is wrong or stale against the tree (it predates several merged
  phases), STOP on the specific criterion and report rather than
  improvising, but first check whether the plan's own
  conflicts-with/amendment notes already resolve the staleness.

  Also append a delivery note to
  /home/user/pulse-fleet/notes/owner-ledger.md (read it first) and push
  that repo too.

  Return: head SHA, gates table, files changed summary, per-criterion
  status (witnessed vs environment-limited), anything stopped-on with the
  exact plan text that blocked you.
