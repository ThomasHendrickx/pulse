  - sha: "e007aea"
    subject: >-
      feat: the naming action predicts its label and reverts loudly
  - sha: "b278d87"
    subject: >-
      test: the optimistic naming measurements, prod projects, guards amended
  - sha: "45bdf01"
    subject: >-
      history: the M3-P11 work history with captured witnesses
key-decisions:
  - decision: >-
      The action's failure path returns a Result carrying only the error
      KIND; the success path keeps revalidatePath and redirect byte for
      byte. The client wrapper rethrows any rejection whose digest begins
      NEXT_REDIRECT.
    why: >-
      The plan's step pins the success path. The rethrow rule comes from a
      measured fact, not a guess: a successful redirecting action REJECTS
      the awaiting client wrapper with digest
      NEXT_REDIRECT;push;/sign-up/vf-probe;307 (verification-first probe,
      captured in m3-p11-notes.md), so a wrapper that treated every
      rejection as transport failure would raise the failure toast on
      every SUCCESS.
  - decision: >-
      The toast is ONE host per row, rendered inside the row's li by the
      client leaf, fixed to the bottom of the viewport by CSS.
    why: >-
      Decision D-32 says one host per row and parks the shared host: a
      shared host would need state above the rows and a provider, which
      ships the review list to the browser. The DOM placement inside the
      li is also what lets criteria 11.4(c) and 11.5 find the notice on
      the row it is about.
  - decision: >-
      The refusal kinds M3-P12 gave specific wording keep it in the toast
      (stale, account, unidentifiable), resolved server side and passed as
      props; empty-merchant-name and every transport failure carry the one
      new failure key.
    why: >-
      Criterion 11.4(c) requires BOTH forced failures (whitespace-only
      name and the fulfilled 500) to show exactly the failure key's
      catalogue value, which pins empty-merchant-name to the new key.
      Reusing the existing nameRefused* values for the other kinds costs
      zero new keys (the cap is four) and keeps the reload instruction a
      stale page genuinely needs, which M3-P12 shipped and this phase had
      no reason to take away.
  - decision: >-
      The difference notice (criterion 11.5) is claimed through a
      module-scope record in the leaf: the submitting row stores the typed
      string, and after the success refresh every row runs an idempotent
      claim check; a row whose label equals the typed string clears it
      silently, and a resolved row whose label equals the TRIMMED typed
      string raises the polite notice.
    why: >-
      A successful naming redirects and refreshes, which unmounts the
      predicting row (its key leaves the projection) and renders the
      server's answer in a different row, so no single component instance
      sees both strings; client state at a stable tree position survives
      that refresh (measured in the probe). String.prototype.trim here is
      detection and attachment, not prediction: the predicted label shows
      the typed string untouched, which is the half decision D-31 rules
      on. The honest limit is recorded in the leaf's own comment: a future
      use-case change that stores something other than the trimmed name is
      not recognised by this claim rule, and criterion 11.5's whitespace
      witness is the tripwire that reddens when the two drift.
  - decision: >-
      The dev-server "chromium" project ignores the new spec; it runs
      under chromium-phone-prod and chromium-prod only.
    why: >-
      Decision D-34 moves the prediction and failure measurements to the
      production build, and finding DELTA-M0P4-09 records that a third
      development pass of a spec that itself drives en, nl and fr buys
      nothing. The desktop production project (chromium-prod, Desktop
      Chrome at 1280 by 720) is the second project criterion 11.2 names.
  - decision: >-
      The unconfirmed live region is rendered with the naming form from
      the row's first render (empty while nothing is in flight) and only
      its TEXT enters at prediction time.
    why: >-
      Criterion 11.2(c) requires the spec to OBSERVE the text entering the
      region with a MutationObserver scoped to the region, which requires
      the region to exist before the click; and a live region inserted
      together with its content is less reliably announced than text
      entering an existing region. The verification-first probe captured
      the text entering and the browser exposing the description on the
      focused control.
  - decision: >-
      test/domain/merchant-review.test.ts's descriptor-surface walk gained
      the identityKey field and the exclusion moved from the review
      component to the leaf's hidden field, with the walk's new blind spot
      stated beside it (the server hands the key to the leaf inside a JSX
      spread attribute, which the walk's JsxExpression visitor does not
      visit).
    why: >-
      Without the field the walk goes blind on the one surface that is
      deliberately unmasked, which is the exact failure mode the test
      records in its own header. The counts are exact by that test's own
      rule, so the move reddened the suite until recorded: 14 sites in 7
      files, 6 masked (captured in gate evidence).
verification-first:
  - finding: >-
      (a) OWED, environment-limited. The re-run of
      test/e2e/merchants.spec.ts showing both direction totals byte
      identical across a naming requires the Supabase auth service and
      this container has no Docker. Owed command, exactly: npm run
      test:e2e -- -g "naming an unresolved counterparty". The committed
      journey's own assertions (income-total and spend-total compared to
      their pre-naming values, digit for digit) are the record this arm
      re-runs.
    contradicts-plan: false
  - finding: >-
      (b) Unit half witnessed, browser half owed. Command: npx vitest run
      test/application/vf-m3p11-scratch.test.ts (throwaway, deleted,
      transcript in m3-p11-notes.md). Captured: naming a second identity
      key with an existing merchant's name created NO second merchant
      ("merchant count: 1" with two EXACT rules on m-1), so the merge is
      real and the merged group total is a sum the browser must not
      predict. Browser half owed: npm run test:e2e --
      --project=chromium-prod -g "merge" (the spec authored in this phase
      records the merged row, its summed total and where it lands).
    contradicts-plan: false
  - finding: >-
      (c) Witnessed at the use-case boundary. Same throwaway test,
      captured: input merchantName "  Bakkerij  " stored merchant name
      "Bakkerij". The trimmed-name difference case is deterministic, which
      is the input criterion 11.5 uses.
    contradicts-plan: false
  - finding: >-
      (d) What the reader sees TODAY when a naming fails: the plan's
      grounding (read at 89ed187) says nothing at all, and at this
      phase's base e499d64 that sentence is stale, because M3-P12 merged
      in between (ordered strictly before this phase by decision D-44).
      Captured: whitespace-only name returns
      {"ok":false,"error":{"kind":"empty-merchant-name"}} (throwaway unit
      run), the shipped action redirected that kind to
      /merchants?status=empty-merchant-name
      (src/modules/merchants/ui/actions.ts:31-38 at base), the route read
      searchParams.status (src/app/(app)/merchants/page.tsx) and the
      screen rendered the mapped nameRefusedName banner under
      data-testid="naming-refused" (REFUSAL_MESSAGE map,
      merchant-review.tsx). So the failure was already loud through a
      banner; this phase replaces that mechanism with the reported Result
      and the row-anchored toast. Browser half owed: npm run test:e2e --
      -g "stale page".
    contradicts-plan: true
    stopped-and-reported: >-
      Reported in this phase's final report to the orchestrator and
      recorded in m3-p11-notes.md (staleness item 1) with the resolution
      trail: the plan's own conflicts-with for M3-P12 orders it strictly
      before this phase per decision D-44 and lists the shared files, so
      the difference is anticipated by the plan's own ordering and the
      build proceeded on the plan's step (return the Result, keep the
      success path); the stale-subject spec's assertion was amended to
      witness the refusal through the new surface and that amendment is
      carried as a deviation below.
  - finding: >-
      (e) SETTLED, first admissible form, measured in a throwaway probe
      (page + island + action under a temporary auth-path route, dev
      server with every env value pinned to invented 127.0.0.1 targets,
      transcript in m3-p11-notes.md). A returned Result object reaches an
      awaiting client wrapper (resolved:{"ok":false,"kind":"probe-fail"}).
      A route handler FULFILLING the action POST with a 500 reaches the
      wrapper as a catchable rejection (rejected:Error|vf probe forced
      500), with no framework error page and the optimistic label
      reverted; aborting the request also reaches the wrapper
      (rejected:TypeError|Failed to fetch). The spec uses the first form.
      Two adjacent measured facts the leaf is built on: a successful
      redirecting action rejects the wrapper with a NEXT_REDIRECT digest
      (so the wrapper rethrows those), and useFormStatus still reports
      pending while a client wrapper function action is in flight
      (captured: button-while-inflight PENDING, aria-busy "true"), so
      M3-P10's busy state survives the wrapping.
    contradicts-plan: false
  - finding: >-
      (f) Witnessed. A throwaway component under src/platform/ui carrying
      one bare JSX sentence fails npm run lint with exit 1 naming
      react/jsx-no-literals at the literal (captured in m3-p11-notes.md);
      the clean tree lints 0. The same red witness was repeated on the
      real toast for criterion 11.6(c) (gate evidence below).
    contradicts-plan: false
  - finding: >-
      (g) Witnessed as the ANNOUNCEMENT, not the tree. In the probe, with
      the action held 2000ms: the role="status" region's text was ""
      before the click; a MutationObserver scoped to that region captured
      the unconfirmed text ENTERING at the moment the prediction landed
      (["Not saved yet"]); separately, the browser's own tree (CDP
      Accessibility.getFullAXTree) exposed
      description "Not saved yet" with describedby on the FOCUSED submit
      control while predicted, and null before the click and after the
      response. Recorded per the criterion: the tree entry alone answers
      only the description-exposure half; the announcement evidence is the
      observed text entering the live region.
    contradicts-plan: false
deviations:
  - plan-clause: >-
      files-to-touch (the list carries src/modules/merchants/ui,
      src/platform/ui, src/app/globals.css, messages/, playwright.config.ts
      and test/e2e/ with one new spec)
    why: >-
      Three files outside that list were edited, each a mechanical
      consequence of guards merged after the plan was written, and each is
      flagged here the moment it was found per the brief's scope rule.
      test/app/client-boundary.test.ts (M3-P10) asserts the client files
      BY NAME, so the two new leaves redden it until named.
      test/domain/merchant-review.test.ts (M3-P6) pins the
      descriptor-surface walk's exact counts, and moving the review row
      into the leaf moved a counted surface. test/e2e/merchants.spec.ts is
      inside the declared test/e2e/ path but is an AMENDED existing spec
      beside the one new one: its stale-subject journey asserted the
      refusal banner rendered from the status redirect, and this phase's
      own step removes the failure redirect, so the journey now witnesses
      the same refusal through the reported failure notice. Criterion
      11.8's pins (the naming journey and the card-label describe,
      unchanged) are untouched.
  - plan-clause: >-
      criterion 11.7(a), "grep -rln \"use client\" src/ returns at most
      FIVE files"
    why: >-
      Stale against the tree, and reported rather than reinterpreted: the
      count predates M3-P14, which shipped
      src/modules/accounts/ui/account-setup-form.tsx with the directive,
      so the base already carried four directive files and this phase's
      two make six. The criterion's own literal grep additionally matches
      src/app/layout.tsx, whose only occurrence is a quoted mention
      inside the M3-P9 comment explaining why the press listener is NOT a
      client component (head -1 confirms no directive). Measured at this
      head: 6 directive files, exactly the enumerated set plus M3-P14's,
      and the named-set halves (b) through (e) all hold as written (gate
      evidence). The substance of the criterion (one module leaf, the
      toast, nothing under src/app, closed import closure) is witnessed;
      the number five is not satisfiable on any tree that contains
      M3-P14.
  - plan-clause: >-
      step "Make the naming action REPORT its outcome instead of
      redirecting a failure into a status nothing reads"
    why: >-
      The clause's premise (nothing reads the status) is stale: M3-P12
      made the route read it and render a banner. The step's instruction
      was executed as written (the action returns a Result, the success
      path is untouched), and the banner path was left renderable but
      unset, with the shipped comment corrected loudly in place (clause
      R-087) rather than deleted, since a hand-typed status URL still
      renders a sentence. The no-JavaScript limit the step asks to park is
      parked with a measured sharpening: with a client wrapper as the
      form action React renders action="javascript:throw ...", so a no-JS
      submit does nothing at all and no field value leaks into a query
      string (probe capture in m3-p11-notes.md).
