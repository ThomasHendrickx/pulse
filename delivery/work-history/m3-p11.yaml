fix-round:
  - mechanism: >-
      HZ-M3P11-02. THE MECHANISM IS A SHARED SINGLE-WRITER RECORD READ BY
      MANY INDEPENDENT CONSUMERS, not "the difference notice is wrong". One
      module slot was written by whichever row submitted last and claimed by
      whichever row matched first, so every consumer could destroy every
      other consumer's pending state. The fix is one entry per submitting
      row, additive on write, retired only by the row it belongs to, and a
      claim that must agree on the direction as well as the label.
    derivation:
      command: >-
        grep -n "recentNaming\|useFormStatus\|namingClaims" -r
        src/modules/merchants/ui/ src/platform/ui/submit-button.tsx (the
        enumeration of every writer and reader of the shared record and of
        the per-form scope that lets two rows fly at once), then npx vitest
        run test/app/naming-claims.test.ts against the ported shipped
        behaviour and again after the fix
      output: >-
        Writers and readers at b278d87: merchant-row.tsx:80 (the slot),
        :161-:174 (the claim, label-only, no row identity), :205 (write,
        unconditional overwrite), :223 and :229 (clear, on any row's
        failure); the per-form busy scope is submit-button.tsx:94
        useFormStatus, which is why two rows can be in flight. RED, against
        the shipped behaviour ported verbatim into the new module: "Tests 3
        failed | 3 passed (6)"; the three failures were "tells the FIRST row
        its answer differed even after a second row is named" (expected
        differs, received none), "tells the FIRST row its answer differed
        even after the second row FAILS" (expected differs, received none),
        and "does not raise a notice on a row in the OTHER direction
        section" (expected none, received differs). GREEN after the fix:
        "Tests 6 passed (6)", and the whole fast gate 685 passed (685),
        typecheck 0, lint 0.
    not-covered: >-
      The search covered src/modules/merchants/ui and the submit leaf, which
      is the whole of this mechanism's call graph today because the record
      is module-private to the merchants ui folder and nothing else imports
      it; it did NOT cover other surfaces, because no other surface predicts
      anything (decision D-31 lists the six pending-only ones). What the fix
      still cannot do: the row that ANSWERS is not the row that submitted,
      since naming changes a group's key from the counterparty identity to
      the merchant id and the review projection carries no link back to the
      key that was named. Building that link is a projection change and
      criterion 11.8 pins the domain and application layers to an empty
      diff, so the match stays on direction plus label. Within one direction
      a resolved group is one row per merchant and merchant names are unique
      per household, so that pair is exact today; if a later phase widens
      the projection, the two-row pin in test/app/naming-claims.test.ts is
      what keeps the replacement honest. Not measured in a browser: no arm
      of this round could run test:e2e (no Docker, CR-M3P11-01).
  - mechanism: >-
      HZ-M3P11-04. THE MECHANISM IS A CLIENT SENTENCE ASSERTING A SERVER
      FACT, not "the failure copy is blunt". The use case writes the
      declaration and only THEN awaits recompute, so the window between the
      write and the answer arriving is a window in which the client knows
      nothing and the old copy said "The name was not saved". Every place
      the client speaks about the server was re-read against what the
      client can observe.
    derivation:
      command: >-
        grep -n "upsertRule\|await deps.recompute\|return ok"
        src/modules/merchants/application/assign-merchant.ts (the order that
        makes the sentence false), then grep -n "copy.failed\|namingFailed"
        -r src/modules/merchants/ui messages/ (every raiser and every
        catalogue carrying it)
      output: >-
        The order: upsertRule at the write, "await deps.recompute(context)"
        after it, "return ok" last, so a failure between the write and the
        response leaves the declaration stored. The raisers are the catch
        arm and the refusal fallback in merchant-row.tsx, both reading
        copy.failed, resolved once in merchant-review.tsx from
        t("namingFailed"); the catalogues are the three messages files, one
        key each. All three reworded to claim only the client's own
        observation, describe the screen rather than storage, and tell the
        reader how to find out. Key count unchanged at 161 with equal key
        sets, no banned string in any new English value, npm run lint 0 and
        the fast gate 690 passed.
    not-covered: >-
      The sweep covered the merchants ui folder and the three catalogues. It
      did NOT re-audit the M3-P12 refusal wording (nameRefusedStale,
      nameRefusedAccount, nameRefusedUnidentifiable), which does say the
      naming was not saved: those are raised only from a server ANSWER that
      refused before writing anything, so the sentence is true there, and
      changing merged copy is outside this phase. The reworded sentence is
      also weaker for the one arm where the server did answer (an empty
      name), which is the price of one key serving both arms under the
      four-key cap; CR-M3P11-03 records that trade.
  - mechanism: >-
      HZ-M3P11-01. THE MECHANISM IS MANY INDEPENDENT WRITERS DRAWING INTO
      ONE FIXED RECTANGLE, not "two toasts overlap". Anything rendered
      position: fixed at one offset by more than one component collides,
      and the notice is raised per row by design.
    derivation:
      command: >-
        grep -n "position: fixed" -r src/app/globals.css and grep -n
        "<Toast" -r src/modules (every drawer into that rectangle), read
        against decision D-32, criterion 11.5 and criterion 11.9
      output: >-
        One fixed rule, .pulse-toast, with a single bottom offset and no
        stacking; two raisers, both in merchant-row.tsx, one per row
        instance. The three routes out are each closed by something already
        decided: D-32 states "ONE HOST PER ROW, not a shared one" and parks
        the shared host, so lifting or portalling the notice out of its row
        is not this phase's to take; criterion 11.5 requires the difference
        notice "present on that row", so a portal breaks a criterion; and
        criterion 11.9(b) pins the stylesheet's px and rem line count while
        11.8 pins styles/tokens.css to an empty diff, so a stacking offset
        can be neither a literal nor a new token. So the collision is made
        IMPOSSIBLE instead of survivable: one notice displayed at a time, in
        the order raised, waiting rather than covering, and nothing removed
        that the reader has not dismissed. Five fast-gate rules over the
        pure queue (5 passed), one authored browser journey raising two
        notices on two rows, and the fast gate at 690 passed.
    not-covered: >-
      NOT MEASURED IN A BROWSER: the two-notice journey is authored and
      unrun, like every browser arm of this phase (CR-M3P11-01). The queue
      orders notices GLOBALLY on this screen, so a difference notice raised
      while a failure notice is up waits behind it; that is the intended
      trade and it means criterion 11.5's "still present 5000 ms later" is
      measured, as the committed spec drives it, with one notice at a time.
      The queue is module-scope and therefore per document: it does not
      survive a navigation, which is correct, since the notices do not
      either. It coordinates the merchants screen only; if a second surface
      ever raises notices it moves beside the toast rather than being
      copied.
  - mechanism: >-
      HZ-M3P11-03 and CR-M3P11-02 and HZ-M3P11-06 and CR-M3P11-04, four
      instances of ONE mechanism: A GUARD OR A PROMISE THAT READS THE SHAPE
      IT EXPECTS RATHER THAN THE SHAPE IT HAS. The masking walk recognised
      a property access and not a destructured prop; the description was
      hung on the one control that is disabled exactly while it exists; the
      client read result.ok on the assumption that a redirect always
      rejects; and two spec assertions matched a substring or two endpoints
      where the criterion says exactly and throughout.
    derivation:
      command: >-
        node over the repository's own TypeScript AST walk, listing every
        JSX expression that renders a descriptor value from a VARIABLE
        rather than a property (the shape the walk could not see); grep -n
        "disabled" src/platform/ui/submit-button.tsx
        src/modules/merchants/ui/merchant-row.tsx (what a keyboard can
        reach during the prediction); grep -n "hasText: trimmed\|
        expectFiguresUnmoved" test/e2e/optimistic-naming.spec.ts
      output: >-
        The AST listing returned five bare-identifier candidates, of which
        exactly ONE is a rendered descriptor value (the leaf's own label);
        the other four are an object literal's key, a translation argument,
        a class-name ternary and a submit handler, which is why the walk
        now decides on the syntax tree rather than on the text. Extending
        it turned the pinned count red at 15 against 14, which is the
        witness that the surface was invisible before; green after the
        count and the declared exclusion were recorded, 29 passed. The
        disabled grep found the disabled attribute on the submit control
        ONLY, so the naming field in the same form is reachable and now
        carries the same description. The spec greps found one substring
        filter and two endpoint-only figure comparisons, all three
        replaced. Fast gate 690 passed, lint 0, typecheck 0, 114 e2e tests
        registered.
    not-covered: >-
      The AST walk covers src/**/*.tsx only, so a descriptor value rendered
      from a .ts file or reached through a JSX SPREAD attribute is still
      invisible; the spread hole was already declared at the exclusion and
      remains. CR-M3P11-02 is answered in code for the keyboard path, and
      what a reader gets is stated rather than claimed: the primary telling
      is the polite live region as the text enters, the submit control
      carries the description the criterion names, and the naming field
      carries it too so the focus-return telling is reachable; M3-P10's
      form-wide disabled busy state is a decided design and was not
      touched. HZ-M3P11-06's guard is reasoned, not measured: no browser
      ran here, and no framework version that resolves the call exists to
      test against.
  - mechanism: >-
      HZ2-M3P11-01. THE MECHANISM IS AN IDENTITY THAT IS LESS SPECIFIC THAN
      THE MATCH IT SERVES, not "the claim record has a bug". The claim was
      MATCHED on direction plus label and WRITTEN and RETIRED on the row key
      alone, and the row key is not unique on this screen: the review groups
      each direction separately over the same counterparty identity, so a
      counterparty with a spend row and a refund renders two rows carrying
      the same key. Every asymmetry of that kind reopens whatever the match
      was meant to separate.
    derivation:
      command: >-
        sed -n over src/modules/merchants/domain/merchant-review.ts (the
        per-direction grouping and the key definition), then grep -n
        "rowKey" -r src/modules/merchants/ui (every write, retirement and
        match of the identity), then npx vitest run
        test/app/naming-claims.test.ts with two cases using ONE key and TWO
        directions, before and after the fix
      output: >-
        The grouping: groupDirection is run once over the income rows and
        once over the spend rows, both keyed by the merchant id or the
        counterparty identity, so one identity yields two groups with the
        same key. The identity sites: recordNaming and forgetNaming
        filtered on rowKey alone while claimNaming filtered on direction.
        RED, with one key and two directions: "Tests 2 failed | 6 passed
        (8)", both failures "expected differs, received none", which are the
        overwrite arm and the wrong-row retirement arm of HZ-M3P11-02
        reached again. GREEN after adding the direction to the identity at
        both sites: "Tests 8 passed (8)", whole fast gate 692 passed at that
        commit and 696 at this head.
    not-covered: >-
      The two distinct-key cases were KEPT beside the two same-key ones, so
      both shapes are pinned rather than one replacing the other. What this
      does not reach: the spec addresses rows by data-group-key, so a
      FIXTURE in which one counterparty appears on both sides would make
      those locators ambiguous and the browser journeys would fail on a
      strict-mode violation rather than measure anything. No committed
      fixture does that today and none of this phase's journeys constructs
      it; if a later phase adds one, the locators need the direction too.
      Not measured in a browser, like every browser arm here (CR-M3P11-01).
  - mechanism: >-
      CR2-M3P11-02. THE MECHANISM IS AN ASSERTION READING A DIFFERENT
      ELEMENT FROM THE ONE IT NAMES. Both defects are that shape: an id read
      off the element carrying the test id rather than the element carrying
      the id, and a row filter whose predicate asks about DESCENDANTS while
      the attribute sits on the row itself. Neither is visible to any gate
      that can run here, which is why they were measured rather than
      reasoned about.
    derivation:
      command: >-
        a chromium probe over a copy of this head's own markup via
        page.setContent, evaluating the old locators and the new ones side
        by side (no server, no database, so it runs in this container)
      output: >-
        OLD id read off the testid element: null. OLD hasNot count: 2, first
        picked: k1, which is the very row the filter was meant to exclude.
        NEW namableKeys: ["k1","k2"]; NEW secondKey: k2, differs: true; NEW
        id read off .pulse-toast: n1, equal to the row's aria-describedby;
        NEW notice text read from the testid element is the message alone.
        The test id was deliberately left on the message element, because
        criteria 11.4(c) and 11.5 measure the notice's trimmed text as
        exactly the catalogue value and the wrapper also carries the dismiss
        control's label.
    not-covered: >-
      The probe evaluates LOCATORS against static markup; it does not
      exercise the queue, the action or the round trip, so it says the
      journey can now find what it names and nothing about whether the
      product behaves. That still needs the owed test:e2e run
      (CR-M3P11-01). The same probe technique was not applied to the older
      journeys in this spec, which round one read but which no browser has
      executed either.
  - mechanism: >-
      HZ2-M3P11-02 and HZ2-M3P11-03, two instances of ONE mechanism: A RULE
      DOCUMENTED AT ONE LAYER AND DEFEATED OR LEFT HALF DONE AT THE NEXT.
      The queue's re-entry was documented as keeping a row's place, and the
      leaf dropped its notice at the start of every retry, so the row left
      the queue and rejoined at the back; the answer guard was documented as
      making the client stop assuming a shape, and it checked the
      discriminant while the refusal arm dereferenced the payload.
    derivation:
      command: >-
        npx vitest run test/app/notice-queue.test.ts and
        test/app/naming-answer.test.ts, each written against the rule the
        layer claimed and run before and after the change
      output: >-
        QUEUE, RED against the old order: "Tests 3 failed | 3 passed (6)",
        the failures being the notice shown after two raises, the row that
        raises again taking the screen, and the queue's order after a
        re-raise. GREEN after the raise moves an entry to the end and the
        screen reads the end: "Tests 6 passed (6)". GUARD, RED on the
        payload case: "Tests 1 failed | 2 passed (3)", "expected true to be
        false" for an answer shaped as a refusal with no error. GREEN after
        the guard requires an error object carrying a string kind: "Tests 3
        passed (3)", eight shapes pinned.
    not-covered: >-
      The queue's order is now newest-raised-first rather than
      oldest-waiting-first, which is a CHANGE OF WHICH NOTICE IS READ FIRST
      and never of whether one is read: nothing is dropped, nothing is
      covered, and nothing leaves without the reader or an unmount. The
      coordinator's instruction was that a re-raising row keep its place;
      what is built keeps its ENTRY (one per notice, never duplicated,
      never dropped) and gives it the screen, which is the outcome the
      instruction was for and the hazard lane's own first proposal. The
      guard covers the shapes the action can produce plus the malformed
      ones enumerated; it cannot cover a shape nobody has thought of, which
      is why the caller treats a failed guard as the transport arm rather
      than throwing. Neither is measured in a browser.
