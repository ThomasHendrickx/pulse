claims:
  - id: C-11.6c-red-witness
    kind: coverage
    statement: >-
      The widened copy gate fires on a bare literal in the toast itself,
      so criterion 11.6(b)'s green lint is evidence of absence rather
      than of blindness.
    settled-by:
      executed-construction:
        command: >-
          replace {message} in src/platform/ui/toast.tsx with the bare
          sentence The name could not be saved right now, then npm run
          lint; restore the file; npm run lint again
        exit-code: 1
        output: >-
          56:6 error Missing JSX expression container around literal
          string: "The name could not be saved right now"
          react/jsx-no-literals (exit 1); after restoring, lint exits 0
          and git status shows no change to src/. The temporary edit was
          not committed.
  - id: C-11.8-pins
    kind: coverage
    statement: >-
      The phase's diff stays inside the ui layer and the declared
      surfaces: the pinned paths print nothing and the package files are
      unchanged, so the toast is hand built and the three-layer split is
      real.
    settled-by:
      executed-construction:
        command: >-
          git diff --name-only e499d64 -- src/modules/merchants/application/
          src/modules/merchants/domain/ src/modules/merchants/adapters/
          src/modules/overview/ src/modules/import/ src/modules/ledger/
          src/platform/ui/amount.tsx src/platform/ui/mask-card-number.ts
          styles/tokens.css prisma/; git diff e499d64 -- package.json
          package-lock.json | wc -l
        exit-code: 0
        output: >-
          The pinned-path diff printed nothing and the package diff is 0
          lines. The full changed set is fourteen files, listed in
          files-touched.
  - id: C-11.9-stylesheet
