claims:
  - id: M1P3-C1
    kind: coverage
    statement: >-
      The declared-set precedence, the four corrections and the surfaced
      unmatched set are guarded as classes: eight structurally different
      mutations of the ledger domain (drawdown classified INCOME,
      pot-before-reserve order swap, settlement matcher returning
      undefined, pairing content sort removed, pairing window unbound,
      refund correction defanged, cash correction defanged, unmatched set
      emptied) each reddened the domain suites and were reverted.
    settled-by:
      executed-construction:
        command: >-
          python3 mutation harness over
          src/modules/ledger/domain/{classify-flow,pair-transfers,
          corrections,interpret}.ts, each mutation followed by npx vitest
          run test/domain/classify-flow.test.ts
          test/domain/pair-transfers.test.ts
          test/domain/corrections.test.ts and a restore (full commands
          and outputs in delivery/work-history/m1-p3-notes.md)
        exit-code: 1
        output: >-
          M1 5 failed | 30 passed; M2 1 failed | 34 passed; M3b 5 failed |
          30 passed; M4 3 failed | 32 passed; M5 1 failed | 34 passed; M6
          3 failed | 32 passed; M7 2 failed | 33 passed; M8 1 failed | 34
          passed; after restore 35 passed.
  - id: M1P3-C2
    kind: coverage
    statement: >-
      The reconciliation property test guards the identity's exclusion
      accounting rather than one example: dropping unmatched transfer
      legs from surfacing, treating a mirrorless settlement debit as
      matched, and defaulting zero rows into SPEND each reddened the
      500-case property run. Category-swap mutations that move a row
      between counted sides do not break the identity (both sides of the
      equation move together); those are guarded by the unit suites of
      claim M1P3-C1, which is why both layers exist.
    settled-by:
      executed-construction:
        command: >-
          python3 mutation harness (P1, P2 over
          src/modules/ledger/domain/interpret.ts; P3 over
          classify-flow.ts), each followed by npx vitest run
          test/property/reconciliation.test.ts and a restore
        exit-code: 1
        output: >-
          P1 1 failed (1); P2 1 failed (1); P3 1 failed (1), P3 caught by
          the run-wide coverage assertion that all five flow values
          occurred; after restore 1 passed (1).
  - id: M1P3-C3
    kind: coverage
    statement: >-
      Window interpretation's two load-bearing properties (padding wide
      enough to reach partners of in-period rows, scope spanning all pot
      accounts) are each guarded: collapsing the window to the import's
      own dates and restricting the account list both reddened the
      healing suite.
    settled-by:
      executed-construction:
        command: >-
          python3 mutation harness over
          src/modules/ledger/application/interpret-window.ts (W1 padding
          removed, W2 accountIds sliced to one), each followed by npx
          vitest run test/application/interpret.test.ts and a restore
        exit-code: 1
        output: >-
          W1 2 failed | 1 passed (3); W2 2 failed | 1 passed (3); after
          restore 3 passed (3).
  - id: M1P3-C4
    kind: coverage
    statement: >-
      The re-parse path is guarded against its three failure shapes:
      stale dedup keys after rebuild, a corrected spec that is not
      persisted (declaration lost), and unparseable rows skipped instead
      of failing loud each reddened the reparse suite.
    settled-by:
      executed-construction:
        command: >-
          python3 mutation harness over
          src/modules/import/application/fix-profile.ts (R1 stale keys,
