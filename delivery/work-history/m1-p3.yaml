kind: work-history
phase: M1-P3
prompt: |
  You are the implementer for phase M1-P3 (one pot) of the Pulse delivery. Your brief is /home/user/pulse-fleet/implementer-brief-m1-p3.md: read it fully first, including the appended fleet warnings, and follow it as your contract. Your working tree is the fresh clone /home/user/pulse-fleet/worktrees/m1-p3-one-pot on branch claude/m1-p3-one-pot (based on main 12de8f5, which contains the merged M1-P2 import phase). Do all work there, never in /home/user/pulse.

  Read the three repo skills before writing code: .claude/skills/pulse-domain/SKILL.md (mandatory: flow classification, transfer pairing, the four corrections, reconciliation identity, facts vs interpretation), pulse-typescript, and pulse-frontend for any UI work. The phase spec in the brief is exact on: declared-set precedence (reserve before pot before the settlement-match step before sign), the owner's v0.2 addendum section 5 settlement matching (pattern plus amount plus date window, D-11, supersedes any declared-identifier mechanism), transfer pairing determinism with D-7's 4-day window and date-then-id tie-breaks, interpretation over the period window across accounts (never over imported rows), recompute, profile-fix re-parse from rawLine (closes hazard H1.3), and the reconciliation identity as a property test in integer cents. The charter's stop-for list covers the reconciliation identity, flow semantics and the meaning of the four corrections: implement them exactly as specified, and if you believe the spec itself is wrong, STOP and report rather than improvising.

  Two carried backlog items are assigned to this round and are in scope (src/modules/import is on files-to-touch): CR-208, a negative value inside a Debit-headed or Credit-headed directional column currently parses sign-inverted, fix by failing loud (row error, import FAILED, zero rows) on signed values in directional columns, red witness first. CR-209, parseSourceProfileSpec accepts case-colliding indicator tokens (debitValue "X", creditValue "x") making the credit token unreachable, fix by rejecting equal-after-uppercase pairs, red witness first.

  Environment facts (also in the brief's warnings): never use ambient DATABASE_URL/DIRECT_URL (they point at a foreign project), pin connection strings to the local supabase stack explicitly; the docker daemon may be dead, restart with sudo dockerd if supabase start fails; Node for tiphys commands needs export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh; npm only; integer cents; imported facts immutable (interpretation lives in its own columns/tables, the re-parse path is the ONLY facts rebuild and it must preserve declarations); every table carries householdId with RLS enabled in any new migration; no em dashes anywhere; English everywhere.

  Work in small commits pushed incrementally to origin claude/m1-p3-one-pot (git push -u origin claude/m1-p3-one-pot on first push) so nothing is lost if you are killed; if you are killed and resumed, reread your last commits and continue rather than restarting. Red witness before green for every behavior. Before reporting done: npm run typecheck, npm run lint, npm test, npm run test:e2e all exit 0 in your clone, and delivery/work-history/m1-p3.yaml written and schema-valid (npx tiphys validate --type work-history with a context containing the plan), with notes in delivery/work-history/m1-p3-notes.md. Your final message is a report: per-criterion status with executed evidence, deviations declared, open questions, head sha.

  MID-PHASE COORDINATOR MESSAGE, verbatim in substance: the session was killed by a transient connection error while starting the work history; commits through 0eec116 are safe, resume, do not restart. The escalation in f2dc75b was correct and is resolved: main DID lack the approved M1-P2 fix round (PR #9 merged the pre-fix head because the fix-round push had not landed on origin). The repair is merged: main is now 6fc43c9, whose code tree is exactly the reviewed 41ff037 state, including creditValue and the parseSourceProfileSpec needed for CR-209. Do in order: rebase onto origin/main (take incoming main in src/modules/import conflicts, re-apply CR-208 on top), re-run all gates, implement CR-209 red witness first, update the escalation note to record the resolution rather than deleting it, finish the work history, validate with tiphys, push with --force-with-lease, report per criterion with head sha.
