key-decisions:
  - decision: >-
      The settlement date window is SETTLEMENT_DATE_WINDOW_DAYS = 45, a
      named constant measured between the settlement debit's booking date
      and the card statement's period end (latest booking date in the
      import); candidate card imports tie-break by smallest date distance
      then lowest import id, the same shape as D-7's pairing tie-break.
    why: >-
      D-11 mandates "within a date window held as a named constant" and
      leaves the value open; 45 days spans a monthly statement cycle plus
      the direct-debit lag, and the match additionally requires the
      code-owned pattern AND an exact amount, so width buys robustness
      rather than false positives. One line to change plus a recompute.
  - decision: >-
      A card account is a POT account without an IBAN; a card import's
      settlement total is the sum of its debit line items (settlement
      credit rows excluded); the card-side mirror row links to the
      settlement debit within the D-7 4-day tolerance; a settlement leg
      whose other side is absent (debit without mirror row, mirror row
      without debit) joins the surfaced unmatched-internal set.
    why: >-
      The observed card export carries no own-account identifier and CSV
      statements carry no total field, so the addendum's "otherwise the
      sum of its line items" arm applies; the debit and its arrival on the
      card are one movement seen twice, so the transfer tolerance is the
      honest window; and counting a one-sided settlement as matched would
      make the reconciliation difference stop equaling the surfaced gaps.
  - decision: >-
      UNRESOLVED arises exactly for zero-amount rows: the declared-set
      checks, the settlement step and the sign fallback classify every
      nonzero row deterministically.
    why: >-
      The intake's classification order is total for nonzero amounts; a
      zero amount has no direction for the sign fallback to read, and
      defaulting it into a total is the charter's named failure. The
      property test's coverage tally reddens if this classification stops
      being reachable (mutation P3, captured in the notes).
  - decision: >-
      Interpretation for an import runs over the import's booking-date
      span padded by INTERPRETATION_WINDOW_PADDING_DAYS = 49 (settlement
      45 plus transfer 4) across all pot accounts; recompute is the same
      function with no bounds; persistence is one transaction that deletes
      links touching the interpreted set, writes flows set-based per flow
      value, inserts the new links and moves touched imports INGESTED to
      INTERPRETED. A stated residue: a pair straddling the padded edge can
      be re-marked unmatched by a window run; recompute is the canonical
      repair and the leg is surfaced rather than hidden. Recorded at the
      constant's definition in src/modules/ledger/domain/constants.ts.
    why: >-
      The architecture mandates window interpretation distinct from
      recompute; the padding makes every transfer partner and settlement
      match of an in-period row part of the loaded context, and the
      documented residue is preferred over a bespoke incremental link
      reconciliation that the deliberately-absent list warns against.
  - decision: >-
      The ledger adapter reads transactions' fact columns and writes ONLY
      interpretation state (transactions.flow, transfer_links, the
      INGESTED to INTERPRETED status move), although the transactions
      table is declared in the import module's schema file.
    why: >-
      pulse-domain's layer table assigns Transaction.flow to the
      interpretation layer written by the engine, and the ledger module
      owns the engine; the alternative (routing flow writes through the
      import module's published interface) would put interpretation
      vocabulary into the import module's contract. The boundary held is
      the facts/interpretation LAYER, stated in the adapter header.
  - decision: >-
      The import pipeline gained its interpret stage: ImportDependencies
      carries an interpret function called after every successful ingest
      claim on both the upload and confirm paths, bound in the composition
      root to the ledger module's published interpretForImport.
    why: >-
      The architecture's pipeline is parse, identify, declare, ingest,
      interpret, and criterion 2.5's healing needs interpretation to run
      on upload; the port keeps the fast gate database-free (the fake
      world binds the same use case over in-memory ports).
  - decision: >-
      The profile-fix re-parse preserves row identity: applyReparse is one
      database transaction that updates the profile spec, parks every
      touched row on a collision-free temporary dedup key derived from its
      id, then rewrites fact columns and final keys per row from the
      re-parsed rawLine. parseStatementRow is the same function the upload
      parser uses per line, extracted rather than duplicated.
    why: >-
      Two rows can exchange dedup keys under a corrected spec while the
      per-household unique index is checked per statement, so the two
      phases are what make in-place identity-preserving rebuild possible;
      one shared row parser is what stops the upload path and the re-parse
      path from drifting apart.
  - decision: >-
      fast-check 4.9.0 was added as a devDependency for criterion 2.4.
    why: >-
      The acceptance criterion names fast-check explicitly; it is
      test-only and adds no runtime dependency, so the charter's
      new-runtime-dependency stop-for is not touched.
  - decision: >-
      Mechanism lookup (mechanism-lookup clause):
      tuition/mechanism-index.yaml was read at
      node_modules/@tiphys/kernel/tuition/mechanism-index.yaml (the
      project's own delivery/tuition/ is empty). Its fifteen entries are
      kernel-process mechanisms (claim files, leases, append-only logs,
      worktree removal, reporter parsing, generated-artifact drift); it
      has no entry for flow classification, transfer pairing, settlement
      matching, interpretation windows, Prisma migrations or re-parse,
      which is a recorded answer, not a skipped lookup. Two general rules
      were still applied: assert-by-name over append-only registries (the
      RLS test derives tables from the DMMF and reddened on the new
      table) and witness-for-a-class-reddens-under-two-members (the
      mutation witnesses in the notes). gates.manifest.json's
      destructiveCommands list was read; this phase adds no destructive
      command, so the list is untouched.
    why: >-
      The clause requires stating which rules were found and how each was
      satisfied, including the honest none-found case.
  - decision: >-
      Rebase resolution policy after the base repair (coordinator
      directed): conflicts in src/modules/import took main's fix-round
      side as base with this phase's additions re-applied on top; the
      CR-208 sibling comment in parse-statement.ts was corrected in place
      under R-087 because its claim that the F2 repair was absent from
      the base was true when written and became false at 6fc43c9.
    why: >-
      Main at 6fc43c9 carries the reviewed 41ff037 tree (F1..F8);
      re-deriving those fixes independently would fork reviewed code, and
      quietly deleting the stale comment would hide that anything had
      been wrong.
  - decision: >-
      Fix round 1, CR-306 stop-for judgement: the orchestrator-approved
      exclusivity rule (at most one settlement debit per card import,
      D-7-style tie-break by date distance to the statement's period end
      then lowest transaction id then lowest import id, losers through
      the existing no-match arm) was judged a deterministic tie-break
      over an ambiguity the correction text leaves open, not a change to
      the correction's meaning: both arms keep their written semantics.
      Implemented rather than escalated, and the judgement is recorded
      here per the charter's stop-for discipline.
    why: >-
      A statement is settled once in the world the correction models; two
      debits pairing onto one import records one statement as paid twice
      and can vanish real spend on an exact-cent coincidence (hazard
      H2.6, reviewer probe P8).
  - decision: >-
      Fix round 1, CR-301 design: interpret-window loads card accounts
      UNBOUNDED (every card import whole) and windows only the other pot
      accounts, instead of adding a per-import repository read keyed by
      the imports a window slice happens to touch.
    why: >-
      Settlement totals are a property of the card IMPORT (the plan's own
      wording), and complete-by-construction loading removes the whole
      class of partial-context reclassification, including the truncated
      total variant (reviewer probe P1.d); card volumes at household
      scale make the unbounded read cheap, and the alternative would
      still need the already-linked-debit guard as a second mechanism.
  - decision: >-
      Fix round 1, CR-302 design: re-parse keys are re-derived by
      simulating ingest's cross-import insert-ignore over the FULL
      re-parse of each import's rawContent, in import creation order,
      with stored twins ranked by their existing key (numeric-aware) and
      a next-free-ordinal fallback for tuples a spec correction merges.
      The allocation helpers live in dedup.ts at the mechanism's
      definition; the key recipe itself is untouched.
    why: >-
      The stored subset is the wrong basis for ordinals whenever ingest
      skipped overlap rows: only the file carries the occurrence
      positions ingest counted, and the simulation is what makes an
      unchanged-spec re-parse a strict no-op and a corrected-spec
      re-parse converge with re-uploads adding zero.
verification-first:
  - finding: >-
      The dispatch grounding stated the branch base main 12de8f5 contains
      the merged M1-P2 import phase as reviewed. Checked before building:
      git diff 10beb40 12de8f5 --stat showed only plan and review
      documents differing, so main's code tree equaled the ROUND 0 head
      10beb40, while git diff 41ff037 12de8f5 --stat showed 29 files and
      918 deletions relative to the fix-round head both reviewers had
      approved; grep found no creditValue under src/modules/import and
      test/domain/dedup.test.ts was absent. The 12de8f5 commit message
      described the fix round as included, which the tree it carried did
      not support.
    contradicts-plan: true
    stopped-and-reported: >-
      Recorded and pushed as commit 82af1dd (escalation section in
      delivery/work-history/m1-p3-notes.md) the moment it was found; the
      CR-209 thread was stopped as unimplementable on that base while all
      unblocked phase work continued. RESOLVED mid-phase by the
      coordinator: PR #9 had merged the pre-fix head because the
      fix-round push had not landed on origin; the repair merged as main
      6fc43c9 (the reviewed 41ff037 tree), this branch was rebased onto
      it, and CR-209 was then implemented. The escalation notes are kept
      in place with the resolution appended.
  - finding: >-
      Recorded evidence check before writing the settlement matcher: the
      committed kbc-card fixtures and notes/export-format-facts.md
      confirm the card export carries no own-account identifier, no
      per-row sequence, a positive settlement row (DOMICILIERING VIA JE
      BANK), and no statement-total field, so the settlement total of a
      CSV card import must be computed from its line items, the
      addendum's fallback arm.
    contradicts-plan: false
  - finding: >-
      Criterion 2.7 names merchant rules among what re-parse must keep
      intact, and no MerchantRule table or code path exists on this base
      (they arrive with M1-P4), so that half of the criterion is vacuous
      here; the test asserts the whole declaration layer (accounts,
      profile name, profile binding) unchanged instead, and the re-parse
      writes only fact columns plus dedup keys by construction.
    contradicts-plan: false
