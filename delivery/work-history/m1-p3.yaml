fix-round:
  - mechanism: >-
      CR-208: a parser branch that derives an amount's sign from
      representation metadata while silently reinterpreting sign
      information present in the cell itself (the debitCredit arm negated
      a parsed value instead of a magnitude, flipping an explicitly
      negative debit positive).
    derivation:
      command: grep -n "parseAmountToCents(" src/modules/import/domain/parse-statement.ts
      output: |
        195:    const parsed = parseAmountToCents(
        211:      const parsed = parseAmountToCents(debitText, spec.decimalStyle);
        220:      const parsed = parseAmountToCents(creditText, spec.decimalStyle);
        226:  const parsed = parseAmountToCents(
        [reading of the four sites: 195 is the signed representation,
        where a cell sign is the declared convention; 211 and 220 are the
        two directional debitCredit sub-branches, both now guarded by
        carriesExplicitSign; 226 is the indicator-branch sibling]
    not-covered: >-
      The indicator branch (line 226): it takes Math.abs of the cell, so
      an explicitly signed cell there is absoluted with the sign authority
      staying on the marker, a different observable outcome from the
      inversion CR-208 names. Its unknown-marker fail-loud rule is the
      M1-P2 fix round's F2, which the repaired base now carries; extending
      fail-loud to signed cells under an indicator is recorded at the
      mechanism definition as a candidate follow-up rather than silently
      added, because the assigned scope names Debit-headed and
      Credit-headed columns.
  - mechanism: >-
      CR-209: a boundary validator that accepts a configuration whose
      branches are indistinguishable to the comparison the runtime
      applies (indicator tokens compared case-insensitively downstream,
      validated only for non-emptiness upstream, so a case-colliding pair
      makes the credit token unreachable).
    derivation:
      command: grep -rn "toUpperCase()" src/modules/import/domain/
      output: |
        src/modules/import/domain/dedup.ts:31:  value.toUpperCase().replace(/\s+/g, " ").trim();
        src/modules/import/domain/source-profile.ts:146:    repRecord.debitValue.toUpperCase() !== repRecord.creditValue.toUpperCase()
        src/modules/import/domain/parse-statement.ts:238:  const indicator = cellAt(fields, representation.indicatorColumn).toUpperCase();
        src/modules/import/domain/parse-statement.ts:240:  if (indicator === representation.debitValue.toUpperCase()) {
        src/modules/import/domain/parse-statement.ts:243:  if (indicator === representation.creditValue.toUpperCase()) {
        src/modules/import/domain/detect-profile.ts:460:      nonEmptyValues(table, column).map((value) => value.toUpperCase()),
        [reading of the six sites: parse-statement 238-243 is the
        case-insensitive comparison the collision defeats; source-profile
        146 is the new guard; detect-profile 460 does not emit a
        colliding pair because INDICATOR_PAIRS tokens stay distinct after
        uppercasing; dedup 31 is key normalisation, not token comparison]
    not-covered: >-
      Token pairs that collide under normalisations other than
      uppercasing (Unicode case folding, locale-dependent case rules,
      whitespace inside tokens): the runtime comparison uses exactly
      toUpperCase(), so the guard uses exactly the same normalisation;
      any future change to the comparison must change the guard with it,
      stated beside the guard.
  - mechanism: >-
      Fix round 1 (findings CR-301, CR-302, CR-303, CR-304; hazard verdict
      at f274d30): deriving cross-record context from the slice the
      current operation happened to load or store, instead of from the
      record's own full extent. Instances of the one mechanism: a card
      import's settlement total computed from window-loaded rows
      (CR-301), a re-parsed row's dedup ordinal computed from the
      import's stored subset instead of its file (CR-302), the refund
      correction's outgoing history computed from the window (CR-303),
      and the interpretation-currency marker not derived from the facts
      generation at all (CR-304: corrected facts under stale flows with
      the import still reading INTERPRETED).
    derivation:
      command: >-
        grep -rn "summarizeCardImports\|buildOutgoingHistoryKeys\|assignDedupKeys\|outgoingHistoryKeys"
        src --include=*.ts
      output: |
        src/modules/ledger/application/interpret-window.ts:64:  const outgoingHistoryKeys = new Set(historyRefs.map(counterpartyKey));
        src/modules/ledger/application/interpret-window.ts:69:    outgoingHistoryKeys,
        src/modules/ledger/domain/classify-flow.ts:37:  readonly outgoingHistoryKeys: ReadonlySet<string>;
        src/modules/ledger/domain/classify-flow.ts:107:    const refund = correctRefund(transaction, context.outgoingHistoryKeys);
        src/modules/ledger/domain/interpret.ts:15:  buildOutgoingHistoryKeys,
        src/modules/ledger/domain/interpret.ts:21:  summarizeCardImports,
        src/modules/ledger/domain/interpret.ts:61:  readonly outgoingHistoryKeys?: ReadonlySet<string>;
        src/modules/ledger/domain/interpret.ts:67:  const cardImports = summarizeCardImports(potTransactions, sets);
        src/modules/ledger/domain/interpret.ts:68:  const outgoingHistoryKeys =
        src/modules/ledger/domain/interpret.ts:69:    input.outgoingHistoryKeys ?? buildOutgoingHistoryKeys(potTransactions);
        src/modules/ledger/domain/interpret.ts:77:      outgoingHistoryKeys,
