  - id: M1P3-C7
    kind: open-question
    statement: >-
      The settlement window value (45 days) and the settlement pattern
      lists (one debit pattern, one credit pattern, code-owned) are
      grounded in the two observed statement formats only; the first real
      import of another bank's card format may need a wider pattern list,
      which is a constants-file change plus recompute. Whether 45 days is
      right for non-monthly statement cycles is unverified.
  - id: M1P3-C8
    kind: open-question
    statement: >-
      The window-interpretation rim residue stated at
      INTERPRETATION_WINDOW_PADDING_DAYS: a pair whose one leg sits in
      the outer padding rim of a window run while its partner lies beyond
      it can be re-marked unmatched until a recompute runs. Not observed
      in any test or realistic upload pattern this phase constructed; a
      periodic or post-import recompute would close it mechanically if it
      is ever observed.
  - id: M1P3-C9
    kind: open-question
    statement: >-
      Refund detection keys on counterparty IBAN, else counterparty name,
      else description (minimally normalised). A refund whose incoming
      row spells the counterparty differently from the matching outgoing
      rows will classify INCOME until M1-P4's merchant normalisation
      improves the key; the reverse over-match (an unrelated credit
      matching an outgoing description) classifies SPEND with a positive
      amount. Both are interpretation-layer outcomes, rebuildable by
      recompute after M1-P4 lands.
environment-warnings:
  - warning: >-
      The ambient shell's foreign Supabase variables reach the Playwright
      webServer too, not only Prisma: NEXT_PUBLIC_SUPABASE_URL and
      SUPABASE_SERVICE_ROLE_KEY from the environment override .env for
      the next dev process, so an e2e run with only the database URLs
      pinned signs up against the foreign project's auth and fails with
      "Sign-up did not complete". Pin all five values (DATABASE_URL,
      DIRECT_URL, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
      SUPABASE_SERVICE_ROLE_KEY) in the shell that invokes npm run
      test:e2e.
    evidence: >-
      First e2e run at ee08bdb's predecessor: 3 failed with sign-up
      errors while only DATABASE_URL/DIRECT_URL were pinned; identical
      run with all five pinned: 4 passed, exit 0. Ambient env listed
      NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (foreign
      project values).
  - warning: >-
      sudo dockerd revives the m1-p1-skeleton supabase containers with
      their data volume intact (the M1-P2 warning still holds); supabase
      start is not needed and a second stack would fight for the ports.
      npx supabase status prints the local demo keys needed for .env.
    evidence: >-
      docker ps after sudo dockerd: supabase_db/kong/auth/rest
      m1-p1-skeleton all Up within 30 seconds; psql select 1 on
      127.0.0.1:54322 succeeded.
  - warning: >-
      Session kills mid-phase remain routine (one transient connection
      kill during this phase, while the work history was being started).
      Small pushed commits plus the continuously appended notes file made
      resume lossless; the coordinator's resume message named the exact
      surviving head.
    evidence: >-
      Coordinator resume message naming 0eec116; git log at resume showed
      all ten commits present on origin.
  - warning: >-
      A squash-merge can silently land a different tree than the one
      reviewers approved when the fix-round push never reached origin:
      PR #9 merged the M1-P2 round-0 tree under a message describing the
      fix-round tree. Caught here only because the base was diffed
      against both candidate heads before building on it. Proposed as
      kernel tuition, unexecuted here: a check that the merge result's
      tree equals the approved review head, run at merge time, is the
      mechanical shape of the guard this class calls for.
    evidence: >-
      git diff 10beb40 12de8f5 --stat (three doc files) versus git diff
      41ff037 12de8f5 --stat (29 files, 918 deletions), recorded in the
      escalation section of the notes; repair merged as 6fc43c9.
