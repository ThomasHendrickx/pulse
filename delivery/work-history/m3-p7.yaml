kind: work-history
phase: M3-P7
prompt: |
  You are the implementer for phase M3-P7 of the pulse project, under the
  @tiphys/kernel orchestrated-delivery process. Severity: critical. This is
  the phase the owner is waiting on: they used the shipped month view on
  their phone and graded the product 2 out of 10 for quality and 1 out of 10
  for usability.

  WORKTREE: /home/user/wt-m3p7, branch claude/m3-p7-mobile-month-view, based
  on origin/main 5ab1680. Use `git -C /home/user/wt-m3p7` for every git
  command, never inherited cwd. node_modules is installed in this worktree
  already; do not npm install again. Run `npx prisma generate` once if
  typecheck complains about missing Prisma models.

  Node: `export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh` at the start of every
  shell running npx/npm. npm only, never pnpm or yarn.

  READ FIRST, in order:
  1. /home/user/wt-m3p7/BRIEF.md, your composed role brief, with the fleet
     warnings appended at the end. All twelve warnings bind you.
  2. /home/user/pulse-fleet/roles/_shared-dispatch-contract.md
  3. /home/user/wt-m3p7/delivery/plan/pulse-v02.yaml, phase M3-P7. Its seven
     steps, fifteen acceptance criteria and nine hazard classes are your
     contract. Read criterion 7.14 twice; it is the reason this phase exists
     and it went through two adversarial review rounds before it held.
  4. /home/user/wt-m3p7/CLAUDE.md and all three skills it names. Read
     pulse-frontend in full.
  5. /home/user/pulse-fleet/decisions/DR-0022.yaml, the owner decision you
     are implementing, and DR-0024.
  6. /home/user/wt-m3p7/delivery/design/mobile-v02/README.md and the frames
     beside it. Main.dc.html and BooksDoNotClose.dc.html are the month view.
     DenseAlternate.dc.html carries no requirement; nothing is built from it.

  WHAT THIS PHASE IS. Mobile first becomes the project's constraint and the
  month view is rebuilt against it. The pulse-frontend skill currently says
  "Desktop first. The import is a desk activity. Mobile is not a v1 target
  and no effort is spent on it." DR-0022 supersedes that and replacing the
  paragraph is a deliverable of this phase, in the same voice as the rest of
  that skill. Criterion 7.11 measures it.

  THE DEFECT, established and verified, so you do not need to rediscover it.
  src/app/globals.css carries zero media queries at any width. .month-grid is
  already a wrapping flex and collapses fine; that is NOT the problem. The
  problem is one level down: .month-columns (globals.css:756) and .month-row
  (globals.css:781) are three-track grids whose two amount tracks each carry
  min-width var(--space-14), 80px. The box chain at 390: .app-main takes 48
  of horizontal padding (globals.css:181 to :187, var(--space-12)
  var(--space-9), and --space-9 is 24px), .month-card a hairline each side,
  .month-row 32 of its own padding, so the row's border box is about 340 and
  the name gets about 116 pixels. That is the unreadable row. A viewport meta
  tag DOES exist; Next injects it and it was read off the live deployment. Do
  not spend time on it beyond criterion 7.2's regression pin.

  NON-NEGOTIABLES THAT WILL FAIL YOU IF IGNORED. No literal colour, font size
  or spacing in any component: only design tokens, and a missing token is
  added to styles/tokens.css FIRST. Criterion 7.4 names the five tokens this
  phase must add and greps for literals four ways, including Tailwind
  breakpoint prefixes and arbitrary values in className. Exactly one media
  condition may exist across all stylesheets and no fifth stylesheet may be
  added (7.3). English everywhere. No em dashes anywhere. Every user-facing
  string comes from the message catalogues; none is hardcoded. The repository
  is PUBLIC and stays public: nothing you commit may carry a real merchant
  string, place name, amount or date, and `npm run gate:privacy` must exit 0.

  THE FIXTURE, criterion 7.13. You must add exactly ONE new hand-written
  fixture, wholly invented, giving at least 20 spend groups in one month with
  descriptor-shaped labels of at least 28 characters. This exists because the
  owner's real month is 39 transactions with zero merchant rules, so every
  spend row renders a raw bank descriptor, and the committed 3-to-5-row
  fixtures cannot reproduce the screen that was graded 1 out of 10. Invent
  the labels; do not copy any from anywhere. Criteria 7.5, 7.7, 7.8, 7.9 and
  7.14 are each evaluated against it as well as the existing datasets.

  METHOD. Work the plan's seven steps in order. Step 1 is verification-first:
  answer its questions with captured command output before you build. For
  every criterion, write the spec BEFORE the implementation and watch it
  fail, then make it pass. Criterion 7.14 in particular must be red on the
  tree as it stands: the plan states the base measurements (39 percent at
  390, 33 percent at 360, name area 116 and 86 pixels, all below the 55
  percent bar and the 180 and 160 pixel floors). Capture that red run and
  paste it in your report. A criterion that was never red is a criterion that
  proves nothing.

  GATE, all of it, in the worktree, and paste the real output:
    export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh
    cd /home/user/wt-m3p7
    npm run typecheck && npm run lint && npm test && npm run gate:privacy && npm run gate:tokens
    npm run test:e2e
  Criterion 7.10 pins several directories to an empty diff. Run that check
  yourself and paste it: this is a layout phase and a printed path means it
  stopped being one. If the e2e run needs the local Postgres and auth stack,
  bring it up (`sudo dockerd` then allow about 30 seconds) rather than
  skipping the gate; if you genuinely cannot, say so plainly rather than
  reporting a pass you did not get.

  Write /home/user/wt-m3p7/delivery/work-history/m3-p7.yaml recording what
  you did, with a populated deviations list, and validate it with
  `/home/user/pulse-fleet/node_modules/.bin/tiphys validate --type
  work-history --context /home/user/pulse-fleet`. Delete BRIEF.md before
  committing. Commit on claude/m3-p7-mobile-month-view and push with `git -C
  /home/user/wt-m3p7 push -u origin claude/m3-p7-mobile-month-view`, retrying
  up to 4 times with 2s/4s/8s/16s backoff on network errors. Commit messages
  carry no amount, no counterparty, no account or card number, no data row
  and no real place name.

  REPORT BACK: criterion by criterion, met or not, with the command and its
  real output; the red run of 7.14 before your change and the green run
  after; every token you added to tokens.css; the one fixture you added and a
  sample of its invented labels; any step you could not complete and why. Do
  not claim a command passed that you did not run.
