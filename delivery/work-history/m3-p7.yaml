environment-warnings:
  - warning: >-
      npx supabase start FAILS IN THIS CONTAINER with an OCI runtime error
      naming rlimit type 7, which is RLIMIT_NOFILE, and the message arrives
      immediately after the line "Starting database from backup...", so it
      reads as a database problem. It is not the database container. The
      container's hard nofile limit is 20000 and cap_sys_resource is dropped
      from the bounding set, so nothing can raise it, and the supabase CLI
      starts the EDGE RUNTIME container with an explicit ulimit above that
      ceiling. THE WORKAROUND: set enabled = false under [edge_runtime] in
      supabase/config.toml, run npx supabase start, then revert the file
      before committing. The stack comes up in full and this app needs no
      edge function. supabase/config.toml is TRACKED, so check git status
      after starting.
    evidence: >-
      ulimit -Hn returns 20000; sudo capsh --print shows "Current IAB:
      !cap_sys_resource" and no cap_sys_resource in the bounding set; docker
      run with a nofile ulimit of 20000 on a local image succeeds and the
      same run at 65536 fails with the identical message; the CLI binary
      carries exactly two occurrences of the string nofile=65536:65536 and
      both are on the edge-runtime container.
  - warning: >-
      A Playwright measurement test that signs up, imports and then walks two
      viewports across three languages does not fit the 30 second default
      timeout, and the failure it produces is a timeout inside page.evaluate
      rather than an assertion, which reads like a hung browser rather than a
      slow test. Set an explicit test.setTimeout on any such test.
    evidence: >-
      The first run of the dense measurement test failed with "Test timeout
      of 30000ms exceeded" pointing at the clipping helper's page.evaluate,
      at 31.3s, having spent most of that on the sign-up and the import. With
      test.setTimeout(240_000) the same test passes in 29.9s of work.
  - warning: >-
      A COMMENT CAN BREAK A CRITERION THAT COUNTS PATTERNS. Criterion 7.3
      counts the distinct media conditions across the stylesheets with a grep
      over an at-media pattern. The token comment in styles/tokens.css that
      documents the breakpoint first spelled that token out in prose, and the
      grep extracted it as a second distinct condition. Prose about a pattern
      is inside the pattern as far as a grep is concerned.
    evidence: >-
      Before the reword, grep -rn "@media" over src/ and styles/ returned the
      tokens.css comment line as well as the stylesheet rule, which would
      have made the distinct-condition count 2 against a criterion that
      permits 1. After the reword the same grep returns only the rule.
  - warning: >-
      The month view's JSX separators use a NON-BREAKING SPACE, and it is
      invisible in a terminal. An edit that retypes a block containing one
      with an ordinary space silently fails to match, and the failure
      surfaces as a replacement that finds nothing rather than as a diff.
    evidence: >-
      cat -A over src/modules/overview/ui/month-view.tsx shows the separators
      as {"M-BM- "} rather than {" "}. Three planned replacements in that
      file failed to match for exactly that reason before it was found.
  - warning: >-
      Only ONE worktree's supabase stack can be up at a time and starting
      yours stops another's, so a sibling phase running e2e work loses its
      database the moment you start. This container's stack was still holding
      the m1-p1-skeleton containers when this phase began.
    evidence: >-
      docker ps at the start of this phase listed supabase_rest_m1-p1-skeleton
      and supabase_auth_m1-p1-skeleton; npx supabase start in this worktree
      refused until that project's stack was stopped explicitly.
