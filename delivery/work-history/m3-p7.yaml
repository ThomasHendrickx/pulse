key-decisions:
  - decision: >-
      The child cells of a row are PLACED explicitly on the two-track grid,
      scoped by child selectors under .month-row, rather than left to
      auto-placement.
    why: >-
      A month that is not compared renders no delta at all. Under
      auto-placement the row count would flow up into the second cell of line
      one the moment the delta went missing, which is precisely the layout
      criterion 7.14 (c) forbids, and it would only appear on the partial
      current month. The child selectors are scoped to .month-row because
      .month-row-meta is shared with the reconciliation gap rows, which are a
      different shape.
  - decision: >-
      The horizontal padding on .app-main is SMALLER at phone width than it
      was, and the desk screen widens it inside the one media condition.
    why: >-
      Criterion 7.14 (b) takes the name area as a share of the row's BORDER
      box, and that box is what the shell's padding sets. Padding the shell
      out narrows the row and would have made the ratio harder to satisfy
      while making the screen worse, which is the exact cheat the criterion's
      absolute floors exist to catch. Phone first here means the phone gets
      the generous box and the desk screen pays for its margins.
  - decision: >-
      The unresolved-counterparties pill is rebuilt at the tap-target
      minimum, against the mockup, which draws it at 32px.
    why: >-
      The mockup's own README states fix 2 as tap targets of at least 44px on
      every row that navigates, and the pill is an anchor that navigates to
      the merchant review. The mockup is breaking its own rule there. A
      control that opens the merchant review is exactly the row the owner
      taps on a phone, and criterion 7.5 names the pill.
  - decision: >-
      The measurement assertions are SOFT, so one run reports every offending
      control, row and element on every axis.
    why: >-
      The criteria require the failure message to name the offenders. A bar
      that stops at the first assertion hides the shape of a regression
      behind a single line, and the red witness for this phase is only
      legible because one run printed the tap targets, the track counts, the
      name widths and the two-line offences together.
  - decision: >-
      The dense fixture's labels were chosen so that each is a FIXED POINT of
      the shipped counterparty normaliser, and that was verified against the
      shipped function rather than assumed.
    why: >-
      Criterion 7.7 (d) compares the rendered label to the label the fixture
      defines character for character, which is the route the criterion
      exists to close: a label shortened in the COMPONENT clips nothing and
      changes textContent identically at both widths, so it passes every
      other axis. That comparison has been shown GREEN against the shipped
      component and has not been shown red against a shortening component,
      because no such component exists here to run it against. If the
      normaliser rewrote a label on the way to the screen, that comparison
      would fail for a reason that has nothing to do with truncation, and the
      criterion would be measuring the normaliser instead of the layout.
  - decision: >-
      The reconciliation panel moved ahead of the three cards in DOM order,
      and the cards are ordered income, spend, reserves in the document with
      the rail produced by grid placement.
    why: >-
      Whether the books close is the first thing the screen answers, which is
      the mockup's fix 5 and what criterion 7.8 measures against the fold.
      Producing the desk rail with the CSS order property would have made the
      visual order and the order assistive technology reads disagree, so
      criterion 7.9 greps for that property and the placement lives in the
      grid instead.
  - decision: >-
      FIX ROUND. The desk screen gets its type scale back in full and its
      density back most of the way, but it does NOT get the three-track row
      back.
    why: >-
      The four reduced font sizes were in no mockup, in no step and in no
      decision record, so they were an accident and are simply undone. The
      two-line row is not: it is the mockup's fix 1, it is the stance this
      phase wrote into the skill, and the wide screen spends the height it
      costs on the name, which went from 366px to 669px. So the row keeps
      two lines at every width and gets its height back another way, by
      dropping the phone's touch padding and tightening its leading inside
      the one media condition: 71px to 50px against a base of 45px, and the
      spend card 1735 to 1264 against a base of 1136.
  - decision: >-
      FIX ROUND. The text-scale axis is pinned at 1.5 AND at 2.0 rather than
      at the reviewer's suggested 1.5 alone.
    why: >-
      Android Chrome's text-size slider reaches 200 percent and the owner is
      on Android (DR-0021), so 1.5 would have left the top of the real
      slider unmeasured. Holding 2.0 cost three rules: the card total wraps
      like the rows do, the navigation labels break inside a word, and the
      spend card's column heads do the same. All three are inert at the
      default size.
  - decision: >-
      FIX ROUND. HZ-M3P7-08 is CLOSED by changing both viewport-height rules
      to dvh with the vh line kept above as the fallback, rather than
      recorded as a residual.
    why: >-
      The hazard lane filed it as its lowest-confidence item and published
      the measurement behind that: at 390 by 844 the shell's computed
      min-height is 844px, window.innerHeight is 844 and the document's
      scroll height is 844, because Playwright renders no browser chrome.
      So there is no harm to demonstrate in this harness and I did not
      manufacture one. I closed it rather than recording it because the cost
      is two lines and no token, because vh resolving to the LARGE viewport
      on a phone is a documented property of the unit rather than a guess,
      and because a residual in a stylesheet is the kind of note that sits
      unread. WHAT I DID NOT DO IS CLAIM A RED WITNESS FOR IT. I did not
      find a way to take one in this container, the change is made on the
      mechanism rather than on a measurement, and a reviewer should treat it
      as unwitnessed rather than as guarded.
  - decision: >-
      FIX ROUND. The header's two visual rows are kept and only the DOCUMENT
      order changes, with the sign-out control drawn back onto the identity
      row by grid placement.
    why: >-
      The reviewer's finding is about the first keystroke, not about the
      drawing: visual and document order already agreed, and the header
      looks right. Moving the form down the document and placing it back
      visually keeps every pixel and changes the thing that was wrong. It
      also keeps the phase's own rule, that placement is done with grid and
      never with the order property, which criterion 7.9 greps for.
verification-first:
  - finding: >-
      (a) VIEWPORT META TAG, read off the rendered page of the running app on
      this phase's own base. Command: curl -s http://127.0.0.1:3000/sign-in |
      grep -o '<meta name="viewport"[^>]*>' against npm run dev on the local
      stack. Output, verbatim:
      <meta name="viewport" content="width=device-width, initial-scale=1"/>
      The exact content string is "width=device-width, initial-scale=1". No
      route exports a viewport object; the framework injects it. This matches
      what the M0-P3 fix round settled (finding MPR-015) and is a
      re-observation on the phase base, not an open question.
    contradicts-plan: false
  - finding: >-
      (b) THE .month-grid RULE, current text at this phase's base, read with
      sed -n '704,719p' src/app/globals.css:
      .month-grid { display: flex; flex-wrap: wrap; gap: var(--space-10);
      align-items: start; }
      .month-grid > .month-spend { flex: 1 1 var(--layout-rail); min-width: 0; }
      .month-grid > .month-rail { flex: 0 1 var(--layout-rail);
      min-width: min(100%, var(--layout-rail)); }
      It is a WRAPPING FLEX and it collapses to one column at phone width
      already. The dispatch's stale description of it as a fixed two-column
      grid is the text at e4ea3ba, superseded by M3-P6 (commit 5f7b62c). The
      plan already records this correction in its own
      report-code-disagreement entry, so nothing here diverges from what the
      plan says.
    contradicts-plan: false
  - finding: >-
      (c) MEDIA QUERIES AND THE DESKTOP-FIRST STRINGS, at this phase's base.
      Command: grep -c "@media" src/app/globals.css -> 0 (exit 1).
      Command: grep -n "Desktop first" src/app/globals.css
      .claude/skills/pulse-frontend/SKILL.md ->
      src/app/globals.css:564: * three equal columns (pulse-frontend section 6). Desktop first.
      .claude/skills/pulse-frontend/SKILL.md:113:Desktop first. The import is a desk activity. Mobile is not a v1 target and no effort is spent on it.
      Both cited lines are exactly where the plan says they are.
    contradicts-plan: false
  - finding: >-
      (d) THE SPEND PROJECTION STILL COLLAPSES A TAG TO ONE GROUP. Command:
      grep -n "options.useTags" src/modules/overview/domain/month-projection.ts
      -> 68:      options.useTags && (exit 0). Read in context, lines 60 to 84:
      a tagged merchant row folds into ONE group keyed "tag:<name>" whose
      label is the tag, so the merchant's own total never reaches the screen.
      DR-0023 is therefore asked about the real code. This phase builds
      nothing on it.
    contradicts-plan: false
  - finding: >-
      (e) EVERY CITED MOCKUP LINE RE-OPENED AND CONFIRMED. Main.dc.html:21
      (width 390px, min-height 844px), :23 (header column), :26 (Sign out
      anchor, min-height 44px), :29 (nav anchor, flex 1, min-height 44px),
      :40 and :43 (44 by 44 month-nav anchors), :41 and :44 (inline svg
      chevrons), :51 (unnamed-counterparties anchor at min-height 32px, the
      mockup breaking its own README fix 2), :52 (12px alert svg), :60
      (font-size 40px, letter-spacing -0.02em headline figure), :63 ("compared
      with June 2026" eyebrow), :66 (12px 14px card padding), :68 (check svg
      with a hardcoded oklch stroke), :72 (the shortened part label "In"), :85
      (list item, min-height 56px, 10px 14px padding, two stacked lines), :87
      (name span with ellipsis truncation), :124 and :131 and :158 and :168
      (tag subhead and merchant rows, all ellipsizing);
      BooksDoNotClose.dc.html:62 (alert svg, hardcoded oklch stroke), :67
      ("Unexplained difference"), :79 ("What is missing"), :81 (gap 3px), :86
      (line-height 1.45); MerchantReview.dc.html:57 and :58 (input and button
      at min-height 44px, button padding 0 18px); canvas.json:3 and :4
      (artboard heights 1180 and 1010, so the approved design expects the page
      to scroll below the fold). Every citation carries the content its citing
      entry describes. No offset of the kind the M0-P3 review found in two
      frames was present in the lines this phase cites.
    contradicts-plan: false
  - finding: >-
      (f) BRANCH BASE AND THE PRIVACY CORRECTION. git merge-base --is-ancestor
      512b461 HEAD -> exit 0, so the mockup's descriptor replacement (commit
      512b461, "design: replace two real merchant descriptors in the mockup
      with invented ones") IS on this branch. git rev-parse origin/main ->
      5ab1680faf94741ab6c387c0cf27940bf597db7b, which is also this worktree's
      HEAD at dispatch, so the gate criterion 7.15(a) names is the
      scripts/gate-privacy.sh at 5ab1680.
    contradicts-plan: false
  - finding: >-
      (e, EXTRA) A REAL MERCHANT BRAND NAME SURVIVES IN A MOCKUP FRAME AND IS
      NOT IN THIS PHASE'S FILES-TO-TOUCH.
      delivery/design/mobile-v02/MerchantReview.dc.html:57 carries
      the expanded trading name of a real chain as the placeholder on the
      merchant-name input. Commit
      512b461 replaced the two descriptors that named a real shop and a real
      parking location, and the descriptor it replaced at that same section
      was the abbreviated card form of that same chain, so the placeholder is
      the expanded form of one of the two strings DR-0024 is about, left
      behind by the same correction. It is a real trading name in a PUBLIC
      repository. I did NOT edit it: delivery/design/ is not in this phase's
      files-to-touch, the scope auditor reads that declaration from the merge
      base, and R-007 forbids me improvising a change to a settled artifact.
      Raised here and in the phase report for the orchestrator to route.
    contradicts-plan: false
deviations:
  - plan-clause: >-
      Step 1's report-code-disagreement entry on the mockup resolves the icon
      question "in favour of hand-written inline SVG with stroke=currentColor
      and no new runtime dependency".
    why: >-
      The month navigation keeps the TEXT GLYPHS it already renders rather
      than gaining inline SVG. No acceptance criterion measures an icon; that
      entry settles HOW icons would be written if the mockup were copied, not
      that they must be. Introducing the product's first SVG element inside
      main would add an element class the criterion 7.7 sweep has not been
      run against: grep -rln "<svg" src/ exits 1 on this branch as it did at
      the phase base, so the product carries no SVG element at all, and an
      SVGElement is not an HTMLElement and reports its scroll geometry
      differently from the elements the sweep measures. It would buy no
      criterion. The glyphs now sit inside 44 by 44 targets and pass
      criterion 7.5.
  - plan-clause: >-
      Step 1's ordering, and the standing rule that the spec is written
      before the implementation and watched failing.
    why: >-
      The six verification-first answers WERE captured before any code and
      are their own commit, 5191c8a, ahead of everything else. The
      measurement specs were NOT: the rebuild landed in 53c7dd0 and the
      specs in 4a81b43. The red witness was therefore taken AFTER the fix, by
      writing the four layout files from the phase base back into the working
      tree and running the committed spec against them, then restoring the
      head versions. It is a real red run against the real unfixed tree and
      it reproduces the plan's own stated base numbers to the pixel, but it
      is not the same thing as having watched the spec fail before the fix
      existed, and the difference is recorded rather than glossed.
  - plan-clause: >-
      Criterion 7.14 (b) and (c) name spend-group, income-group AND
      reserve-group rows, added in the second M0-P3 fix round as finding
      MPR-018.
    why: >-
      WITHDRAWN AND CORRECTED IN PLACE IN THE FIX ROUND (clause R-087,
      finding CR-M3P7-01). THE REASON RECORDED HERE IN ROUND 0 WAS FALSE.
      What it said: that a reserve group needs a second account declared
      through the import flow, that criterion 7.13 permits exactly one new
      fixture, and that therefore the reserve arm could not be witnessed.
      The second step does not follow from the first and the criteria
      reviewer disproved it by execution. Criterion 7.13 bounds new
      FIXTURES; it says nothing about the RING an existing committed fixture
      is declared under, and the ring was simply hardcoded to POT in this
      suite's own upload helper. Declaring the already-committed
      mv-gapped-b.csv under RESERVE produces a real reserve row from zero
      new fixtures. THE ARM IS NOW WITNESSED: the fix round makes the ring a
      parameter of that helper and adds a test that measures reserve rows
      with the same three axes as spend rows, at both phone widths, red
      against the phase base's row and green against this head; the captured
      output is in claim C-M3P7-11. A wrong reason in a work history is
      worse than a gap, because it stops the next reader looking, which is
      exactly what it did here.
  - plan-clause: >-
      Step 7, "Raise DR-0023 to the owner with this plan's recommendation
      stated first".
    why: >-
      The implementer hands back a branch and a work history and does not
      write into the fleet's decision directory, which is outside this
      worktree. DR-0023 is raised here and in the phase report with the
      recommendation first, for the orchestrator to route: KEEP the shipped
      one-row-per-tag spend grouping for the rebuild. Nesting merchants under
      tag subheads is a change to the projection and to the delta keying
      rather than to the layout, it makes the spend card roughly three times
      taller on the screen the owner graded 1 out of 10 for usability, and
      with no merchant rules in the owner's data it renders nothing today
      either way. Nothing in this phase is built on the answer, and criterion
      7.10 pins both overview module layers to an empty diff.
