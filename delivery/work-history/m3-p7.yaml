fix-round:
  - mechanism: >-
      A CRITERION ADDRESSING A HAZARD CLASS BY MEASURING A DIFFERENT
      QUANTITY THAN THE ONE THE HAZARD IS ABOUT. Not "the desk font sizes
      shrank", which is the finding; the mechanism is that hazard H7.5 says
      "the phone is fixed and the desk screen is broken in the same change"
      and is discharged by criterion 7.9, which measures three
      x-coordinates, three widths and one y-ordering. Those quantities are
      disjoint from the ones a broken desk screen moves: a font size, a line
      height, a row height, a card height, a scroll length. The criterion
      could be green with the desk screen made arbitrarily worse, and it
      was. THIS IS THE SAME MECHANISM THAT PRODUCED THIS PHASE. The bar the
      phase was dispatched to replace measured horizontal overflow, which is
      disjoint from the quantities an unusable row moves, and the row the
      owner graded 1 out of 10 passed it. The fix is therefore not "restore
      the four sizes"; it is to bind the quantities the hazard is actually
      about, at both widths, which is why the phone side gained a type-size
      floor, a row-height ceiling and a scroll-length ceiling in the same
      change even though nothing was wrong with them.
    derivation:
      command: >-
        for each of the nine hazard classes declared for this phase, read the
        criterion it names and ask whether that criterion's measured
        quantities can move when the hazard occurs:
        awk '/^  - id: H7/,/addressed-by/' delivery/plan/pulse-v02.yaml
        paired with the criterion text each one names.
      output: |
        H7.1 unusable phone screen        -> 7.5  tap target heights, named offenders.  SOUND: same quantities.
        H7.2 content silently dropped     -> 7.6  testid census plus boxes at both widths. SOUND, one vacuous half closed this round (CR-M3P7-02).
        H7.3 a literal in a component     -> 7.4  the literal greps themselves.          SOUND: the measurement is the thing.
        H7.4 layout becomes a projection  -> 7.10 empty diff over the projection files.  SOUND: pinned by path.
        H7.5 desk screen broken           -> 7.9  three x-coordinates, three widths, one y-ordering.
                                                  DISJOINT. A font size, a row height, a card height and a scroll
                                                  length can all move with 7.9 unmoved, and every one of them did.
        H7.6 real data reaches an artifact-> 7.15 probe classes defined by SHAPE.
                                                  PARTLY DISJOINT. A mixed-case brand name matches no class by
                                                  construction, which is finding HZ-M3P7-01.
        H7.7 viewport tag regression      -> 7.2  the tag's own content string.          SOUND, and strengthened this
                                                  round with the half that measures whether the browser honours it.
        H7.8 masking dropped              -> 7.10 empty diff plus call-site grep.        SOUND: pinned by path.
        H7.9 the row survives untouched   -> 7.14 track count, name geometry, line placement.
                                                  PARTLY DISJOINT. Geometry only: a smaller label, a taller row or a
                                                  longer scroll satisfies all three, which is finding CR-M3P7-04.
        Three of nine. All three are closed in this round.
    not-covered: >-
      THE ENUMERATION AND WHAT IT LEFT OUT, which is the item to read first.
      I walked the nine hazard classes against their criteria by hand and
      found three where the quantities are disjoint or partly disjoint from
      the hazard: H7.5 addressed by 7.9, which is this round's finding and is
      now bound by the new desk and phone bars; H7.9 addressed by 7.14,
      which binds geometry only, so a smaller label or a taller row or a
      longer scroll satisfied it (finding CR-M3P7-04, closed here by the same
      new bars); and H7.6 addressed by 7.15, whose probe classes are defined
      by SHAPE, so a mixed-case brand name cannot match them by construction
      (finding HZ-M3P7-01, closed here by correcting the claim in place and
      by the string being fixed upstream). The other six I judged sound: H7.1
      and H7.2 measure the same quantities their hazards move, H7.3's greps
      are the literal itself, H7.4 and H7.8 are pinned diffs over the exact
      files, and H7.7's guard now measures both the tag and whether the
      browser honours it.
      WHAT THE ENUMERATION DID NOT COVER, three regions, stated because a
      search whose scope is wrong returns an empty result that looks like an
      absence of defects. FIRST, it covers this phase's nine classes and no
      others; the same mechanism may be live in any earlier phase's
      criteria, and I did not read them. SECOND, it is a reading of prose
      against prose and is therefore exactly as good as my judgement of what
      a hazard "is about"; no command decides it, and two of the three I
      found were found by reviewers rather than by me. THIRD, it says
      nothing about hazards no class names at all: the two lowest findings
      this round, a device text-size preference and the header's focus
      order, are not instances of this mechanism but of a plainer one, a
      quantity nobody had a criterion for in either direction.
environment-warnings:
  - warning: >-
      npx supabase start FAILS IN THIS CONTAINER with an OCI runtime error
      naming rlimit type 7, which is RLIMIT_NOFILE, and the message arrives
      immediately after the line "Starting database from backup...", so it
      reads as a database problem. It is not the database container. The
      container's hard nofile limit is 20000 and cap_sys_resource is dropped
      from the bounding set, so nothing can raise it, and the supabase CLI
      starts the EDGE RUNTIME container with an explicit ulimit above that
      ceiling. THE WORKAROUND: set enabled = false under [edge_runtime] in
      supabase/config.toml, run npx supabase start, then revert the file
      before committing. The stack comes up in full and this app needs no
      edge function. supabase/config.toml is TRACKED, so check git status
      after starting.
    evidence: >-
      ulimit -Hn returns 20000; sudo capsh --print shows "Current IAB:
      !cap_sys_resource" and no cap_sys_resource in the bounding set; docker
      run with a nofile ulimit of 20000 on a local image succeeds and the
      same run at 65536 fails with the identical message; the CLI binary
      carries exactly two occurrences of the string nofile=65536:65536 and
      both are on the edge-runtime container.
  - warning: >-
      A Playwright measurement test that signs up, imports and then walks two
      viewports across three languages does not fit the 30 second default
      timeout, and the failure it produces is a timeout inside page.evaluate
      rather than an assertion, which reads like a hung browser rather than a
      slow test. Set an explicit test.setTimeout on any such test.
    evidence: >-
      The first run of the dense measurement test failed with "Test timeout
      of 30000ms exceeded" pointing at the clipping helper's page.evaluate,
      at 31.3s, having spent most of that on the sign-up and the import. With
      test.setTimeout(240_000) the same test passes in 29.9s of work.
  - warning: >-
      A COMMENT CAN BREAK A CRITERION THAT COUNTS PATTERNS. Criterion 7.3
      counts the distinct media conditions across the stylesheets with a grep
      over an at-media pattern. The token comment in styles/tokens.css that
      documents the breakpoint first spelled that token out in prose, and the
      grep extracted it as a second distinct condition. Prose about a pattern
      is inside the pattern as far as a grep is concerned.
    evidence: >-
      Before the reword, grep -rn "@media" over src/ and styles/ returned the
      tokens.css comment line as well as the stylesheet rule, which would
      have made the distinct-condition count 2 against a criterion that
      permits 1. After the reword the same grep returns only the rule.
  - warning: >-
      The month view's JSX separators use a NON-BREAKING SPACE, and it is
      invisible in a terminal. An edit that retypes a block containing one
      with an ordinary space silently fails to match, and the failure
      surfaces as a replacement that finds nothing rather than as a diff.
    evidence: >-
      cat -A over src/modules/overview/ui/month-view.tsx shows the separators
      as {"M-BM- "} rather than {" "}. Three planned replacements in that
      file failed to match for exactly that reason before it was found.
  - warning: >-
      Only ONE worktree's supabase stack can be up at a time and starting
      yours stops another's, so a sibling phase running e2e work loses its
      database the moment you start. This container's stack was still holding
      the m1-p1-skeleton containers when this phase began.
    evidence: >-
