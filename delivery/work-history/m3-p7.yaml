    kind: coverage
    statement: >-
      Criterion 7.14 reddens against the tree as it stands, on all three of
      its axes and at both phone widths, and reproduces the base measurements
      the plan states.
    settled-by:
      executed-construction:
        command: >-
          for f in src/app/globals.css src/modules/overview/ui/month-view.tsx
          'src/app/(app)/layout.tsx' styles/tokens.css; do git show
          "5ab1680:$f" > "$f"; done; git status --short; PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000
          npx playwright test --project=chromium-phone -g "dense month is
          usable"
        exit-code: 1
        output: |
          git status --short listed exactly the four restored files as
          modified. The run then failed with, verbatim:

          Error: track count at 390
          + Array [
          +   "CounterpartyAmountvs July: 3 tracks",
