      container is not ready: unhealthy"}} and docker ps a minute later showed
      the database container healthy and the auth container answering. Check
      docker ps and the auth health endpoint before believing the exit code.
    evidence: >-
      curl http://127.0.0.1:54321/auth/v1/health returned 200 and
      {"version":"v2.195.0","name":"GoTrue",...} after that error.
  - warning: >-
      THE AMBIENT SUPABASE_* AND DATABASE_URL IN THIS CONTAINER POINT AT A
      DEPLOYED PROJECT, not at the local stack, and Next.js does not let a .env
      file override a variable already in the environment. They have to be
      exported explicitly in the shell that runs the e2e gate, or sign-up fails
      with signup-failed and no request reaches the local auth container, which
      reads as a broken application rather than as a wrong host.
    evidence: >-
      env showed DATABASE_URL and NEXT_PUBLIC_SUPABASE_URL pointing at a
      pooler host and a project subdomain while .env named 127.0.0.1:54322 and
      127.0.0.1:54321.
