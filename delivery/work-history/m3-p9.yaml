key-decisions:
  - decision: >-
      The pressed, disabled and busy rules are written against ELEMENT
      selectors (button, a, summary, input[type=submit], input[type=button],
      [role=button]) rather than against the list of nineteen control classes
      the plan's step 4 enumerates.
    why: >-
      The census the sweep produced found that every button, every anchor and
      the one disclosure summary in the product is one of those nineteen
      controls and that there is no twentieth button or anchor anywhere, so
      the element selector and the class list select the same set today. They
      differ tomorrow: a screen added later inherits the pressed state from
      the element rule and would ship without one from the class list, which
      is the exact failure this phase exists to answer. Where a control needs
      a different value the class selector still carries it, which is how the
      three inverse-surface submits get their own pressed step.
  - decision: >-
      styles/tokens.css declares --press-offset at 2px rather than at the 1px
      floor criterion 9.2(b)(i) sets, and it is its own token rather than a
      reference to --space-1, which happens to be 2px too.
    why: >-
      The floor is a floor. The reporter's complaint is a phone complaint and
      the travel is the half of the pressed appearance that survives a screen
      in daylight, so it is worth one more device-independent pixel. It is not
      --space-1 because a press depth and a spacing step are different things
      and re-scaling the space ramp must not change how far a control travels.
  - decision: >-
      --color-surface-pressed maps to --pulse-grey-200 rather than to the
      lighter --pulse-grey-100 the eye would reach for first.
    why: >-
      Measured, not chosen. Composited against the three resting surfaces the
      pressed rule lands on, grey-100 clears the 1.1 to 1 bar on the
      flag-coloured pill by 1.131 to 1, three hundredths of margin, while
      grey-200 clears it at 1.508 to 1. The measurement is in the
      verification-first record below with the command that produced it.
  - decision: >-
      The spec asserts that the pressed control's own bounding box moves, as
      well as that the computed transform carries the translation criterion
      9.2(b)(i) names.
    why: >-
      The computed value alone is satisfiable with nothing on screen changing.
      A non-replaced inline box is not transformable, and the measurement
      recorded below shows Chromium reporting matrix(1, 0, 0, 1, 0, 3) on such
      a box whose getBoundingClientRect().top was 8 both at rest and while
      held. CORRECTED IN FIX ROUND 1 (clause R-087, finding CR-M3P9-03): this
      said four of the nineteen controls are bare anchors, so this was a live
      hole. Four ARE bare anchors, but only TWO of them needed the rule. The
      two links on the import result screen are direct children of
      .import-screen, which declares display: flex at src/app/globals.css:299,
      and a flex item is blockified whatever display it specifies, so those
      two were already transformable. The two that needed it are the auth
      cross-links, which sit alone inside a paragraph. The hole was live, at
      two controls rather than four; the stylesheet gives anchors a block box
      and the spec is what stops that rule being dropped silently.
  - decision: >-
      Every computed-style read in the spec is taken after the running
      transition has finished, through a settle helper that awaits
      Element.getAnimations() excluding infinite ones.
    why: >-
      This phase is the first to put a transition on anything in this product,
      and a computed style read the instant after a state is applied returns
      the value the control is transitioning FROM. The first attempt at a
      green run failed with a contrast ratio of exactly 1.000 on a control
      whose disabled rule was present and correct, which is a false RED; the
      same mechanism produces a false GREEN wherever a measurement expects no
      difference.
  - decision: >-
      Four opacity values and one percentage border-radius are written as
      literals in src/app/globals.css rather than as tokens.
    why: >-
      The plan's token entry fixes the count at nine and says no further token
      is expected. An opacity and a percentage radius are none of the four
      things criterion 9.5 names (duration, curve, colour, length), the file
      already carries a percentage radius at .month-pill-dot, and CLAUDE.md
      non-negotiable 4 names colours, font sizes and spacing. Recorded as a
      deviation below rather than left for a reader to notice.
  - decision: >-
      THE MECHANISM LOOKUP the dispatch contract owes, recorded whether or not
      it changed anything. tuition/mechanism-index.yaml carries fifteen
      mechanisms and none of them is about a stylesheet, a computed style or a
      browser measurement, so most of the file is not reachable from this
      phase. Three rows were read because this phase touches what they
      describe. "Asserting a CI step is wired": assert BEHAVIOUR, not text, and
      a witness for a class must redden under at least two structurally
      different members. "Shared worktree": a run that cannot pin the source it
      ran against is not evidence and must label itself so. "Verifying access
      to a remote": push --dry-run authenticates, read operations witness
      nothing.
    why: >-
      Each is satisfied rather than merely read. The behaviour rule is the
      whole design of this phase's spec: it holds a real press and reads the
      computed style instead of grepping for ":active", which is the text
      assertion the rule forbids, and the witness reddened under two
      structurally different members before it went green, first on the
      disabled magnitude (contrast 1.000, opacity delta 0.000) and then on a
      disabled disclosure that still computed cursor: pointer because a class
      rule outranked the attribute selector. The worktree rule is satisfied by
      pinning every run in this document to a named branch and commit and by
      labelling every phone result an emulation result. The remote rule is
      satisfied by the real push recorded in the report rather than by an
      assertion that the branch would push. This phase establishes ONE new
      mechanism rule, which the index has no entry for and which is recorded at
      its definition in test/e2e/pressed-and-disabled.spec.ts with its sibling
      implementations named there: reading a computed style across a
      transitioned state change returns the value being transitioned from.

  - decision: >-
      The claim grep this brief mandates was run over this document, exactly as
      the clause writes it: grep -nEi 'cannot be|impossible|needs a|is
      covered|catches|would catch|recovers|anyway|always|never|no way to'
      delivery/work-history/m3-p9.yaml, and again over the same text with its
      whitespace flattened, because a phrase can straddle a line break in a
      wrapped block scalar.
    why: >-
      Every hit outside the verbatim prompt block sits in a record that already
      carries the captured command settling it. The hits INSIDE the prompt
      block are the dispatch's own sentences, recorded verbatim as R-052a
      requires; they are not assertions this document makes, and rewording them
      was not available. Claim M3P9-C6 states that in the claims section rather
      than leaving it to be inferred.

  - decision: >-
      A new :hover rule was added, scoped to controls carrying the disabled
      state.
    why: >-
      The four hover rules src/app/globals.css already carried and the bare
      a:hover at styles/tokens.css:201 are all more specific than a bare
      attribute selector, so the colour of a disabled control came back the
      moment a pointer crossed it. Decision D-29 parks the hover work as a
      whole and its stated reason is that changing the hover rules would move
      criterion 9.2's hover baseline; this rule applies only where the
      disabled state is present, and 9.2 measures controls that carry none, so
      the baseline it depends on does not move.
  # FIX ROUND 1
  - decision: >-
      The pressed appearance is given a SECOND route, [data-pressed], beside
      :active, and every :active selector in the phase's block carries a twin.
    why: >-
      THE MECHANISM IS A STATE APPEARANCE REACHABLE ONLY THROUGH AN
      INPUT-CONDITIONAL PSEUDO-CLASS, not "the spec pressed with a mouse".
      :active is granted by the engine's gesture pipeline, so a rule resting on
      it is delivered on exactly the input paths that engine grants it on.
      Measured here under the chromium-phone project's device options, sampling
      every animation frame: a held CDP Input.dispatchTouchEvent touchStart,
      Input.synthesizeTapGesture with gestureSourceType "touch" and
      page.touchscreen.tap each deliver pointerdown AND touchstart to the
      control and yield ZERO frames in :active, while a held page.mouse.down in
      the same context yields 22 of 28 and moves the box 2.000px. The same
      synthesized tap on a bare div outside the product, carrying only its own
      :active rule, also yielded zero, so this is the container's gesture
      pipeline rather than the stylesheet. pointerdown fires on every touch
      path, and the plan's verification-first step (e) pre-authorises exactly
      this remedy. THE HALF NOT SHIPPED: nothing in the product sets the
      attribute. Setting it takes a client listener, because no CSS selector
      observes a pointerdown, and every file that could host one is a *.tsx
      outside the six paths criterion 9.7 prints. I did not find a way to ship
      it inside this phase's declared files; that is a search that came up
      empty rather than a proof that none exists. The six lines are written out verbatim in the spec, which installs
      them and measures this rule under a real held touch press. M3-P10 opens
      the client boundary and is where they land.
  - decision: >-
      [aria-disabled="true"] gains pointer-events: none, in a rule of its own,
      and button:disabled and input:disabled are deliberately left alone.
    why: >-
      The aria branch carried the whole disabled appearance, cursor: default
      included, and removed nothing: measured on the shipped screens, a link
      marked that way navigated (/sign-in to /sign-up), a submit marked that
      way produced a POST, and the disclosure summary toggled. It is the only
      marking eight of the nineteen controls can carry. The native attribute
      already refuses activation from every input path, so pointer-events there
      would only cost the cursor the appearance rule sets.
  - decision: >-
      THE SECOND MEMBER OF THAT CLASS IS NAMED AND DELIBERATELY NOT CHANGED.
      [aria-busy="true"] and .pulse-busy also dress a control as unavailable
      (opacity 0.7, cursor: progress) and also remove no capability: a busy
      submit still accepts a pointer activation and could still post twice.
    why: >-
      Fixing the mechanism rather than the instance would mean adding
      pointer-events: none there too, and I did not, because the plan's step 5
      says exactly what a busy control does ("keeps its label and gains a
      mark") and says nothing about removing interaction, while it says
      explicitly what the disabled state removes. Substituting my design for
      the planned one is what clause R-034 forbids. It is recorded here as the
      derived second member of the class and handed to M3-P10, which decides
      whether a busy control stays operable (a cancel affordance) or refuses
      re-entry, and which owns the handler either way.
  - decision: >-
      select and textarea join the transition list and the disabled list, and
      NOT the pressed list.
    why: >-
      They are the two interactive controls the product renders that the
      criterion 9.2 census does not count, because neither is pressable: the
      Ring select and the spec editor's textarea. A form disabled while its
      submit is in flight, which is what M3-P10 builds, would otherwise leave
      those two looking untouched beside a submit that visibly changed. A form
      field is not pressed, so neither takes the pressed appearance.
  # ROUND TWO
  - decision: >-
      The listener ships as a module-scope string constant in src/app/layout.tsx
      rendered as ONE script element inside the body, carrying
      the bare attribute data-press-feedback, and NOT as a client component.
      CORRECTED IN PLACE IN ROUND THREE (clause R-087, finding CR2-M3P9-07):
      this said data-testid="press-feedback", which was true when it was
      written and stopped being true at b55a31b when the plan amendment at
      497ec49 renamed the marker.
    why: >-
      Decision D-61 settles it and it is not the implementer's to re-decide. A
      "use client" file would open the first React client boundary since
      src/platform/ui/nav-link.tsx:1, which is M3-P10's job and what hazard
      H9.5 exists to keep out; and a press listener that does not attach until
      the React bundle has hydrated is a poor answer to a complaint whose words
      are that nothing happens when the owner presses. The root layout and not
      the authenticated shell, because five of the nineteen controls live on
      the sign-in and sign-up screens, which src/app/(app)/layout.tsx never
      renders. The constant carries NO interpolation, ever, so it has no
      injection surface; the product declares no Content-Security-Policy today
      and src/middleware.ts is where one would land, so the phase that adds one
      adds a nonce for this script in the same change or turns criterion 9.9
      red.
  - decision: >-
      The clear sweeps the DOCUMENT on pointerup and on pointercancel, with no
      pointer-id table, and the cost of that is taken deliberately.
    why: >-
      A clear that sweeps the document also clears a press ANOTHER FINGER is
      still holding, so with two touches on two controls the first release
      un-draws both. That failure is a press that DISAPPEARS, it corrects
      itself at the next press, and multitouch across two controls is rare on
      this product. The STICKING failure is the one that matters and criterion
      9.9(e) measures it, including the two-presses ending that a single-slot
      clear fails. The pointercancel listener is not optional: a scroll begun
      on a control IS a pointercancel, and without it the control the reader
      scrolled from stays drawn pressed until something else is tapped, after
      which that control answers no further press because it is already in the
      pressed state.
  - decision: >-
      Criterion 9.9(c)'s :active count is taken over the frames BETWEEN the
      pointerdown and the end of the touch, and the frames after the release
      are printed beside it rather than counted in it.
    why: >-
      MEASURED, not reasoned: with the capture-phase click refusal installed,
      the compatibility MOUSE click Chromium synthesises after a raw touch
      sequence leaves the control in :active from about 14ms after touchend
      onward. Counting those frames would make the criterion assert something
      about this spec's own instrument. Frames after the touch has ended are by
      construction not the touch press, so the window is the definition rather
      than a weakening, and both numbers are printed on every path.
  - decision: >-
      The restoration half of criterion 9.9(e) is read AFTER a neutral press
      that clears the browser's active chain, and the marking half is read
      BEFORE it.
    why: >-
      Same mechanism as the entry above, and it is the one that decides whether
      ending one can be measured at all: with the activation refused, every one
      of the twenty frames sampled after the ending had the control in :active,
      so the :active half of the pressed rule kept drawing it pressed while
      document.querySelectorAll("[data-pressed]") was already empty. The
      marking is what this phase ships and a stuck marking is the defect, so
      that assertion stays on the second frame after the ending, untouched by
      the neutral press. The neutral spot is asserted not to be a control
      before it is pressed.
  # ROUND THREE
  - decision: >-
      The marker on the shipped script is the bare attribute
      data-press-feedback and deliberately not a data-testid, renamed at all
      four requirement sites the amended plan names.
    why: >-
      The escalation this branch raised was accepted and the plan amended at
      497ec49. It stays in the data-* family the vocabulary already uses for
      data-pressed, and unlike an id it cannot collide with a CSS id selector
      or a URL fragment target. Criterion 9.9(a) reads the marker out of the
      RAW RESPONSE BODY as text rather than through a Playwright locator, so
      any stable attribute serves the purpose exactly as well and the rename
      costs nothing. FOUR sites and not three: step 5, criterion 9.7(c),
      criterion 9.9(a) TWICE (the assertion sentence and the sentence about a
      tag with that attribute and no body), and criterion 9.9's falsifying
      clause. One occurrence of the old string survives in step 5 by design,
      as the historical record of what the old attribute was and what it
      broke, and it is not a requirement.
  - decision: >-
      The browser's active chain is cleared between the three touch paths in
      criterion 9.9(c), the same way it is cleared between the two halves of
      every ending.
    why: >-
      Re-running after the rename turned up ONE :active frame on the
      synthesizeTapGesture path where every earlier run had zero, and it is
      this spec's own instrument rather than the engine: the path before it
      ends with a compatibility mouse click that this spec refuses, and a
      refused click leaves Chromium's active chain set on the control until
      the next input, so one frame at the head of the next path's window
      carried :active from the previous path. Cleared, all three paths report
      zero during the press with the shipped marking on 25 of 25 and 24 of 24
      frames.
  # ROUND FOUR
  - decision: >-
      D-61's no-interpolation constraint is given a MECHANISM rather than
      softened: a test with no skip condition reads src/app/layout.tsx from
      disk, extracts the PRESS_FEEDBACK constant and fails on any template
      expression.
    why: >-
      The hazard lane found the constraint true and enforced by nothing, so
      "NO INTERPOLATION, EVER" read as a standing property when it was an
      unenforced convention: no lint rule, no test, and no
      Content-Security-Policy to make a violation visible. The constraint is
      what D-61 rests on when it permits an unchecked inline script, so it
      earns a check rather than a softer sentence. It lives in the spec and
      not the fast gate because criterion 9.7 pins this phase to one new file
      under test/e2e/ and a unit test would print an eighth path; that is a
      scope constraint and it is recorded rather than hidden. It carries no
      skip condition for the same reason the config-membership test carries
      none: a guard that runs only where touch is declared is silent in half
      the runs.
  - decision: >-
      The tap path's :active zero is RECORDED AS VACUOUS and the count of
      paths whose zero was measured over a non-empty window is asserted at two
      or more, rather than the third path's zero being counted as evidence.
    why: >-
      Criterion 9.9(c)'s liveness clause proves an input path DELIVERED
      pointerdown and touchstart; it does not prove anything was LOOKED AT
      while they were in flight, and page.touchscreen.tap dispatches its
      touchstart and touchend inside one task so no animation frame can fall
      between them. A zero over an empty window is numerically identical to a
      zero over 24 frames, which is the same argument the criterion already
      makes one level up. Choosing between naming the two held paths as the
      ones the zero binds on and replacing the third is the criterion's to
      make; the spec's job is to stop the empty one being counted silently.
  - decision: >-
      CR2-M3P9-09's concrete edit was REFUTED rather than adopted: the alpha
      floor in assertMagnitude keeps its second condition.
    why: >-
      Fleet warning 15, a review's concrete-edit is a proposal and not a
      patch, walked against the stylesheet rather than against the sentence.
      Criterion 9.2(b)(ii)'s alpha floor exists for a state that CHANGES the
      background: it stops a pressed tint clearing the contrast bar only by
      being nearly opaque. The busy rule sets opacity and cursor and NO
      background, so on a control whose resting background is transparent the
      entered background is transparent too, and an unconditional floor would
      demand an alpha of 0.08 from a background the state never touched and
      redden a magnitude that legitimately passes on an opacity delta of 0.30
      against a bar of 0.15. The reasoning is written at the line so the next
      reader does not delete the condition, and the criterion's sentence is
      recorded as the half that should carry the qualification.

verification-first:
  - finding: >-
      (a) THE SEVEN RULE COUNTS, over every file git ls-files "*.css" returns
      and not over src/app/globals.css alone. Command: for f in $(git ls-files
      "*.css"); do for p in ":hover" ":active" ":disabled" "transition"
      "animation" "@keyframes" "cursor"; do grep -c -- "$p" "$f"; done; done.
      Output: src/app/globals.css :hover 4, :active 0, :disabled 0, transition
      0, animation 0, @keyframes 0, cursor 5; styles/pulse-theme.css all zero;
      styles/pulse-tokens.css all zero; styles/tokens.css :hover 1 and the
      other six zero. The line numbers, from grep -n ":hover" over the same
      four files: src/app/globals.css:192, :243, :701, :758 and
      styles/tokens.css:201. From grep -n "cursor": src/app/globals.css:89,
      :239, :381, :439, :617. This is the state the dispatch and the plan both
      describe, at this phase's own base a4f1a94, including the fifth hover
      rule outside src/app/globals.css.
    contradicts-plan: false
  - finding: >-
      (b) THE TOKEN ABSENCE AND THE SECTION HEADING. Command: grep -niE
      "duration|ease|easing|motion|elevation|shadow|transition|transform"
      styles/tokens.css. Output, exactly three lines and not one of them a
      token: "116:   * Space, radius, elevation", "206:button:focus-visible {
      outline: none; box-shadow: var(--focus-ring); }" and "226:
      text-transform: uppercase;". The exact text of the heading at
      styles/tokens.css:116 is "Space, radius, elevation", and no elevation
      token exists under it, so the file advertises a group it does not
      have. This phase adds its tokens under a heading of their own and leaves
      that heading alone, because renaming it is outside this phase's files.
    contradicts-plan: false
  - finding: >-
      (c) THE REDUCED-MOTION SEARCH. Command: grep -rn
      "prefers-reduced-motion" src/ styles/ test/. Output: none, exit code 1.
      Nothing under those three trees asked the reader whether they wanted
      less motion.
    contradicts-plan: false
  - finding: >-
      (d) THE SWEEP. It was produced by running the criterion 9.2 selector on
      every screen the new spec reaches and collecting what it found, not by
      copying a list. Command: npx playwright test --project=chromium-phone
      test/e2e/pressed-and-disabled.spec.ts, whose spec prints the collected
      set. CORRECTED IN FIX ROUND 1 (finding CR-M3P9-06): the first two
      identities were transliterated into the words LEFT-CHEVRON and
      RIGHT-CHEVRON, and captured output is not paraphrased. The characters
      the run printed are restored below and were re-captured in the fix
      round's own run. Output, 19 identities: "a.month-nav|‹",
      "a.month-nav|›", a[data-testid=empty-state-import-link],
      a[data-testid=nav-import], a[data-testid=nav-merchants],
      a[data-testid=nav-overview], a[data-testid=unresolved-pill], a|Back to
      import, a|Create household, a|Import another file, a|Sign in,
      button.app-signout|Sign out, button.auth-submit|Create household,
      button.auth-submit|Sign in, button.import-primary|Upload,
      button.merchant-name-button|Name, button[data-testid=confirm-import],
      button|Preview again, summary|Detected format description. The spec
      asserts this collected set equals the plan's enumeration in BOTH
      directions and the assertion passes, so the sweep found no control the
      plan does not name and reached every one it does; the enumeration needed
      no amendment. Identity is by data-testid where there is one and by tag,
      class and text where there is not, which is why the five merchant naming
      submits rendered on the review screen collapse to one identity while the
      three shell nav links stay three. THE ROUTE TO EACH OF THE FIVE
      CONDITIONAL ONES: the empty-state link, by visiting the month view
      immediately after sign-up and before any import; the next month step, by
      landing on /?month=2026-08, a closed month with a later one, rather than
      on whatever month the clock gives; the preview-again submit and the
      disclosure summary, by driving the DELIMITED fixture
      test/fixtures/belfius-account-a.csv to the confirmation screen and
      clicking the details summary open, since it carries no open attribute;
      the sign-in submit and the sign-up cross-link, by visiting /sign-in and
      /sign-up BEFORE the household exists, because src/middleware.ts:44
      redirects an authenticated visitor away from both auth paths; and the
      back-to-import link, by uploading the committed
      test/fixtures/unknown-layout.pdf, which the parser rejects.
    contradicts-plan: false
  - finding: >-
      (e) HOW A HELD PRESS IS PRODUCED UNDER THE chromium-phone PROJECT, and
      whether it yields :active. Command: a standalone Playwright script run
      from the worktree against a data page carrying a button with an :active
      rule, once under a plain 1280 by 720 context and once under the
      chromium-phone project's own options (devices["Pixel 5"], isMobile
      true, hasTouch true, viewport 390 by 844). Output, both lines verbatim:
      {"label":"desktop-1280x720","rest":"rgb(238, 238,
      238)","heldMouse":"rgb(0, 0, 0)","matchesActiveMouse":true,"heldTouch":
      "rgb(238, 238, 238)","matchesActiveTouch":false} and
      {"label":"chromium-phone-390x844","rest":"rgb(238, 238,
      238)","heldMouse":"rgb(0, 0, 0)","matchesActiveMouse":true,"heldTouch":
      "rgb(238, 238, 238)","matchesActiveTouch":false}. A held
      page.mouse.down DOES produce :active under the chromium-phone project,
      so the plan's primary technique holds and the touch fallback it
      pre-authorises was not needed. The second half of each line is recorded
      because it is a real result and not the question asked: a raw CDP
      Input.dispatchTouchEvent touchStart held open did NOT put the element
      in :active in that probe. Touch emulation was not dropped anywhere; the
      whole measurement runs under the chromium-phone project with hasTouch
      set.
    contradicts-plan: false
  - finding: >-
      (f) WHETHER A REAL PHONE BROWSER IS AVAILABLE TO THE CONTAINER. Command:
      which google-chrome chromium firefox, and a search of the filesystem for
      an ms-playwright browser registry directory. Output: no result from
      either, and the browsers the suite drives come from the Playwright
      package (npx playwright --version reports 1.62.1). No mobile Safari, no
      Android system browser and no physical device is reachable from this
      container. Every phone-width result in this work history is therefore a
      Chromium emulation result under the chromium-phone project's device
      descriptor, and says so.
    contradicts-plan: false

deviations:
  - plan-clause: >-
      Step 2 and the token entry in report-code-disagreement: "no further
      token is expected, with criterion 9.5 failing the phase if a literal
      duration, curve, colour or length reaches a rule instead."
    why: >-
      Exactly the nine named tokens were added and no tenth. The consequence
      is that four opacity values (0.55 disabled, 0.7 busy, 0.72 unconfirmed,
      0.25 the low point of the busy mark's loop) and one border-radius of 50
      percent are written as literals in src/app/globals.css. None of the five
      is a duration, a curve, a colour or a length, so none is what criterion
      9.5 names; the file already carried a 50 percent radius at
      .month-pill-dot; and CLAUDE.md non-negotiable 4 names colours, font
      sizes and spacing. The alternative was to add five tokens the plan says
      it does not expect. Captured: grep -nE "^[^/*]*[0-9.]+(px|rem)" over
      every stylesheet except styles/tokens.css returns the same four lines
      with the same declarations it returned at the base, and grep -nE
      "^[^/*]*[0-9.]+m?s[;, )]|cubic-bezier|steps\(" over the same files
      returns nothing, exit code 1.
  - plan-clause: >-
      Step 5: "A disabled control changes to --color-surface-disabled and
      --color-ink-disabled and stops computing cursor: pointer."
    why: >-
      All three are done, and an opacity change was added beside them. Both
      colour changes are declared on transparent controls as well as opaque
      ones, and on a transparent control the composited magnitude depends on
      what the control sits over; the opacity branch criterion 9.3(a) offers
      does not, so the disabled appearance carries its magnitude on every one
      of the nineteen without depending on an ancestor's background. The
      colour changes are the appearance the plan asks for; the opacity is
      redundancy under the measurement.
  - plan-clause: >-
      Step 4: "Write the pressed appearance for every control the criterion
      9.2 selector finds, which at this phase's base is the seven submit
      controls, the three shell nav links, ..."
    why: >-
      The rules select the ELEMENTS rather than the enumerated classes. The
      two selections are identical over the tree the sweep measured, which the
      passing set assertion shows; they differ for a control added later,
      where the element rule gives it a pressed state and the class list would
      not. The class selectors are still used where a control takes a
      different value, which is the three inverse-surface submits.
  - plan-clause: >-
      Criterion 9.2(b)(i), the movement half.
    why: >-
      The spec asserts more than the criterion requires: the element's own
      bounding box has to move by the press offset as well as the computed
      transform carrying it. The criterion as written is satisfiable by a
      control that does not move, which the measurement in the
      verification-first record demonstrates on an inline box.
  - plan-clause: >-
      Criterion 9.2(c): grep -rn "tap-highlight" over every file matching
      *.css under src/ and styles/ returns nothing.
    why: >-
      The comment in src/app/globals.css that explains why the platform's own
      press highlight is deliberately left alone spells the property name out
      in words instead of writing it, because writing it would make the
      criterion's own grep return a line. This is the same device
      styles/tokens.css:178 already uses for the words at-media and the
      comment says so.
  - plan-clause: >-
      Step 6: "register it in playwright.config.ts under BOTH the desktop
      project and the chromium-phone project, by widening that project's
      testMatch."
    why: >-
      No deviation in substance; recorded because the desktop registration is
      by absence rather than by an edit. The chromium project declares
      testIgnore rather than testMatch, so the new spec runs there without a
      config change, and the only edit to playwright.config.ts is the phone
      project's testMatch.
  - plan-clause: >-
      files-to-touch, which does not name a base rule for the anchor element.
    why: >-
      src/app/globals.css now declares "a { display: inline-block; }". It is
      inside the phase's declared files, but it is a change to a base element
      rule rather than to a state rule, so it is called out here: TWO of the
      nineteen controls are bare anchors WITH NO FLEX PARENT (the two auth
      cross-links) and a non-replaced inline box is not transformable, so
      without it the pressed rule would leave those two unmoved while the
      computed style still reported the translation. CORRECTED IN FIX ROUND 1
      (finding CR-M3P9-03): this entry said four, counting the two import
      result links, which are flex items and were already blockified.
  # FIX ROUND 1
  - plan-clause: >-
      Step 4 and criterion 9.2, which describe the pressed appearance in terms
      of a press and do not name a selector; the plan's verification-first step
      (e) pre-authorises "a class or attribute the control carries between
      pointerdown and pointerup" only IF a held page.mouse.down fails to
      produce :active under the chromium-phone project.
    why: >-
      A held page.mouse.down DOES produce :active under that project, so the
      ladder's condition is literally not met and the attribute is literally
      not pre-authorised. It is added anyway, beside :active rather than
      instead of it, because the ladder's condition is keyed on the mouse
      question while the phase exists to answer a finger question, and the
      touch measurement the same step (e) asks for returns zero on every path.
      Nothing is removed: the mouse case keeps working with no script at all.
  - plan-clause: >-
      files-to-touch and criterion 9.7, which print no client script, so the
      pointerdown handler that sets [data-pressed] cannot ship in this phase.
    resolved: true
    why: >-
      RESOLVED IN ROUND TWO AND MARKED SO IN ROUND THREE (finding
      CR2-M3P9-01). THE ESCALATION WAS ACCEPTED: the plan amendment at
      bca2a74, "plan: M3-P9 may ship the listener that makes the press
      visible", put src/app/layout.tsx into files-to-touch as the ONE file
      matching *.tsx this phase may print, decision D-61 settled the shape as
      an inline script in the root layout rather than a client island, and
      criterion 9.9 was added as the criterion that fails when the listener is
      missing. The listener landed at 274a858 and the marker was renamed at
      b55a31b. NOTHING BELOW THIS SENTENCE IS TRUE OF THIS HEAD ANY LONGER
      AND IT IS KEPT RATHER THAN DELETED so the register reads as a decision
      taken rather than a question never asked. What it said while it was
      open: "THIS IS AN OPEN ESCALATION AND NOT A CLOSED DEVIATION, raised
      under clause R-034 rather than improvised around. The only host I found
      for the handler is a *.tsx file, which criterion 9.7 falsifies the phase
      for and hazard H9.5 names; I did not find one inside the declared files.
      So the phase ships the stylesheet half, measures it under a real held
      touch press with the handler installed by the spec, and states plainly
      that no shipped code sets the attribute yet. Whoever holds the plan
      decides: amend files-to-touch on the base branch so a follow-up round
      lands the six lines, or leave them to M3-P10, which opens the client
      boundary anyway." The plan took the first branch. The spec installs no
      handler now and criterion 9.9(a) forbids it.
  # ROUND TWO
  - plan-clause: >-
      Criterion 9.9(a): "the spec registers no addInitScript and no
      page.evaluate that adds a listener for pointerdown, touchstart or
      mousedown, with ONE exception named here and nowhere else, the
      capture-phase CLICK REFUSAL".
    why: >-
      Criteria 9.9(c) and 9.9(e) require the spec to prove pointerdown,
      touchstart, pointerup and pointercancel were DELIVERED before concluding
      anything from a zero or from an absence, and I found no way to witness a
      DOM event without registering a listener for it, so I found no way to
      obey both clauses. The
      spec installs a PASSIVE recorder on document in the capture phase whose
      handlers push a string into an array and do nothing else; it writes no
      attribute, and the grep criterion 9.9(a) names returns three lines over
      the file, one comment, one el.matches and one document.querySelectorAll.
      The spec also PRINTS the scripts it injects, which is the check the
      criterion itself asks for. The property the prohibition protects, that
      nothing the test installs can produce the pressed appearance, holds.
  - plan-clause: >-
      Criterion 9.9(e): "After EACH of the five endings, by the SECOND sampled
      animation frame following it ... the control's computed transform matrix
      and bounding rect are back at their resting values".
    why: >-
      The transform is a TRANSITIONED property and --duration-press is 90ms, so
      it is still unwinding at the second frame by construction, on every
      ending and under any implementation. The marking assertion, which is the
      one that catches a stuck press, is taken at the second frame exactly as
      written and passes on all fifteen endings. The transform and rect
      restoration is read at the end of the sampled tail instead, on a frame
      the control is not in :active for the reason the key-decision above
      records, and is 0.000px on all fifteen.
  - plan-clause: >-
      Criterion 9.9(e) ending FOUR: "by asserting that the ending's own event
      was captured on the control, pointerup for endings one, two, four and
      five".
    why: >-
      Ending four exists precisely because a MOUSE pointer has no implicit
      capture, so its pointerup is NOT delivered to the control. Asserting that
      it was would assert the opposite of what the ending measures. The spec
      asserts a pointerup was captured AND that its target was not the control,
      which is the stronger form of the same check and is the discriminator the
      criterion's own reasoning describes.
  - plan-clause: >-
      Criterion 9.9(e) ending TWO, a touch release AWAY from the control.
    why: >-
      Driving it with a touchMove produced a pointercancel rather than a
      pointerup on both screens the endings run on, because a touchMove on a
      screen that scrolls is a scroll and a scroll is ending THREE. The release
      now ends the touch at moved coordinates with no move event, which leaves
      the control at a different place from where it began, produces the
      pointerup this ending is, and lets the engine take no gesture.

