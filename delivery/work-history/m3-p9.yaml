environment-warnings:
  - warning: >-
      A COMPUTED STYLE READ ACROSS A TRANSITIONED STATE CHANGE RETURNS THE
      VALUE THE ELEMENT IS TRANSITIONING FROM. Before this phase no stylesheet
      in this product declared a transition, so no spec had to think about it;
      from this phase on, every one does. The failure it produces is a false
      red when the measurement expects a difference and a false GREEN when it
      expects sameness, and the second is the dangerous direction. Wait for the
      running transitions with Element.getAnimations(), excluding infinite
      ones, rather than for a fixed number of milliseconds.
    evidence: >-
      The first attempt at a green run failed with "disabled
      button.auth-submit|Sign in: background 1.000, colour 1.000, border 1.000,
      opacity delta 0.000" against a stylesheet whose disabled rule was present
      and correct; adding the settle helper turned the same run green with no
      other change to the rules.
  - warning: >-
      getComputedStyle RETURNS oklch() STRINGS IN THIS PRODUCT, not rgb(),
      because the ramp is declared in oklch and Chromium serialises CSS Color 4
      back unchanged. Any spec doing colour arithmetic has to parse them; the
      browser's own 2D canvas is a parser that agrees with the browser's
      painting
      (ctx.fillStyle = the string, fillRect, getImageData), and it accepts
      oklch.
    evidence: >-
      A probe run in this container returned
      {"applied":"oklch(0.91 0.005 265)","rgba":[223,225,229,1]} for
      --pulse-grey-100, so the canvas resolves the ramp correctly.
  - warning: >-
      IN PLAYWRIGHT 1.62 THE reducedMotion OPTION IS NOT A TOP-LEVEL test.use
      KEY. It is set as test.use({ contextOptions: { reducedMotion: "reduce" }
      }); the top-level form fails typecheck with TS2353 naming reducedMotion,
      which reads as the option not existing rather than as it living one level
      down.
    evidence: >-
      tsc --noEmit reported: test/e2e/pressed-and-disabled.spec.ts(492,14):
      error TS2353: Object literal may only specify known properties, and
      'reducedMotion' does not exist in type 'Fixtures<...>'.
  - warning: >-
      npx supabase start CAN REPORT A FAILURE WHILE THE STACK IS ACTUALLY UP.
