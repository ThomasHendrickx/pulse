claims:
  - id: M3P9-C1
    kind: coverage
    statement: >-
      The sweep collects exactly the nineteen controls the plan's enumeration
      names, in both directions, on both viewports and under both motion
      settings, and each of them was measured pressed, disabled and busy.
    settled-by:
      executed-construction:
        command: >-
          export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh && cd /home/user/wt-m3p9
          && npm run test:e2e
        exit-code: 0
        output: >-
          57 passed (13.7m), exit code 0, run against the committed tree at
          69fba9a. The four runs of the new spec, two projects by two motion
          settings, each printed "swept control set (19):" followed by the
          nineteen identities and then passed the assertion
          expect(found).toEqual(expected) against the plan's enumeration, which
          fails on a missing control and on an extra one alike. The four rows
          verbatim: 32 [chromium] pressed-and-disabled.spec.ts:546 full motion
          (59.2s); 33 [chromium] :557 reduced motion (30.3s); 56
          [chromium-phone] :546 full motion (1.0m); 57 [chromium-phone] :557
          reduced motion (32.3s).
  - id: M3P9-C2
    kind: remedy
    statement: >-
      Asserting the computed transform alone does not establish that a pressed
      control moved, and the bounding-box assertion the spec adds is what
      establishes it.
    settled-by:
      executed-construction:
        command: >-
          A standalone Playwright script run from the worktree, loading a page
          whose only rule is "#inl:active { transform: translateY(3px); }" on an
          inline anchor, reading getComputedStyle and getBoundingClientRect
          while a held mouse.down keeps the element in :active.
        exit-code: 0
        output: >-
          {"inlineActive":{"display":"inline","transform":"matrix(1, 0, 0, 1, 0,
          3)","matches":true,"rectTop":8},"inlineRest":8}. The computed value
          reports the translation; the box does not move. Remedy shipped: "a {
          display: inline-block; }" in src/app/globals.css, plus the
          bounding-box assertion in the spec, which is what stops that rule
          being removed silently.
  - id: M3P9-C3
    kind: open-question
    statement: >-
      Whether the pressed appearance reads on the reporter's actual phone in
      daylight is not settled by anything in this phase. I did not find a
      physical device or a mobile browser reachable from this container, so
      each phone-width result recorded here is a Chromium emulation result at
      390 by 844 under the chromium-phone device descriptor.
  - id: M3P9-C4
    kind: open-question
    statement: >-
      This phase measures that the shipped stylesheet renders a visibly
      different control when the disabled, busy or unconfirmed state is present
      on it, by applying that state through the DOM. Whether anything in the
      product ever sets one of those states is a separate question, and
      decision D-28 assigns it to M3-P10 and M3-P11 rather than here.
  - id: M3P9-C5
    kind: open-question
    statement: >-
      A raw CDP Input.dispatchTouchEvent touchStart, held open, did not put the
      element into :active in the probe recorded under verification-first (e),
      while a held page.mouse.down did, under the same chromium-phone context.
      I did not chase why, because the question the plan asks is whether the
      held mouse press yields :active under that project and it does, so the
      whole measurement runs on the technique the plan names, with hasTouch
      set. A reader wanting a touch-driven press should start from that
      captured line rather than from this sentence.
  - id: M3P9-C6
    kind: open-question
    statement: >-
      The claim-grep this brief mandates returns hits inside this document's
      verbatim prompt block. Those are the dispatch's own sentences, recorded
      verbatim as R-052a requires, and they are not assertions this work
      history makes; the settled hits outside that block are listed in the
      claim-grep record below.
  # FIX ROUND 1
