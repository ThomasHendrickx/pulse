claims:
  - id: M3P9-C1
    kind: coverage
    statement: >-
      The sweep collects exactly the nineteen controls the plan's enumeration
      names, in both directions, on both viewports and under both motion
      settings, and each of them was measured pressed, disabled and busy.
    settled-by:
      executed-construction:
        command: >-
          export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh && cd /home/user/wt-m3p9
          && npm run test:e2e
        exit-code: 0
        output: >-
          57 passed (13.7m), exit code 0, run against the committed tree at
          69fba9a. The four runs of the new spec, two projects by two motion
          settings, each printed "swept control set (19):" followed by the
          nineteen identities and then passed the assertion
          expect(found).toEqual(expected) against the plan's enumeration, which
          fails on a missing control and on an extra one alike. The four rows
          verbatim: 32 [chromium] pressed-and-disabled.spec.ts:546 full motion
          (59.2s); 33 [chromium] :557 reduced motion (30.3s); 56
          [chromium-phone] :546 full motion (1.0m); 57 [chromium-phone] :557
          reduced motion (32.3s).
  - id: M3P9-C2
    kind: remedy
    statement: >-
      Asserting the computed transform alone does not establish that a pressed
      control moved, and the bounding-box assertion the spec adds is what
      establishes it.
    settled-by:
      executed-construction:
        command: >-
          A standalone Playwright script run from the worktree, loading a page
          whose only rule is "#inl:active { transform: translateY(3px); }" on an
          inline anchor, reading getComputedStyle and getBoundingClientRect
          while a held mouse.down keeps the element in :active.
        exit-code: 0
        output: >-
          {"inlineActive":{"display":"inline","transform":"matrix(1, 0, 0, 1, 0,
          3)","matches":true,"rectTop":8},"inlineRest":8}. The computed value
