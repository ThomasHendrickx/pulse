kind: work-history
phase: M3-P9
prompt: |
  You are the implementer for phase M3-P9 of the pulse project, under the
  @tiphys/kernel orchestrated-delivery process.

  WORKTREE: /home/user/wt-m3p9, branch claude/m3-p9-pressed-and-disabled, based
  on origin/main a4f1a94. Use `git -C /home/user/wt-m3p9` for every git command,
  never inherited cwd. node_modules is symlinked; do not npm install. Run `npx
  prisma generate` if typecheck complains about missing Prisma models. Node:
  `export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh` in every shell running
  npx/npm. npm only, never pnpm or yarn.

  READ FIRST, in order:
  1. /home/user/wt-m3p9/BRIEF.md, your composed role brief, with the fleet
     warnings appended. All thirteen bind you.
  2. /home/user/pulse-fleet/roles/_shared-dispatch-contract.md
  3. delivery/plan/pulse-v02.yaml, phase M3-P9. Its steps, its eight acceptance
     criteria and its hazard classes are your contract. Read criteria 9.2, 9.3
     and 9.4 twice: they went through two adversarial review rounds before they
     held, and each one is written to fail on a cheat a previous version
     allowed.
  4. CLAUDE.md and all three skills. Read pulse-frontend IN FULL.
  5. /home/user/pulse-fleet/decisions/DR-0025.yaml and DR-0026.yaml for context
     on what M3-P10 and M3-P11 will build on top of you.

  WHY THIS PHASE EXISTS. The owner, using the deployed app on a phone,
  reported: "the total lack of feedback I get when I press something. buttons
  don't feel like button and after pressing, nothing happens in the UI untill
  the full server cycle comes back". You are answering the FIRST half of that
  sentence. The second half is M3-P10's and you must not build it.

  THE MEASURED STATE, established and verified twice, so you do not need to
  rediscover it: src/app/globals.css carries FOUR :hover rules at :192, :243,
  :701 and :758, plus a fifth bare a:hover at styles/tokens.css:201; ZERO
  :active rules, ZERO :disabled rules, ZERO transition, animation and
  @keyframes rules across all four tracked stylesheets; styles/tokens.css
  declares NO duration, easing, motion or elevation token, while its section
  heading at :116 advertises an "elevation" group that does not exist; there is
  no prefers-reduced-motion block anywhere; and five cursor: pointer rules at
  :89, :239, :381, :439 and :617, so a pointer device gets a partial cue and
  the phone the owner uses gets none. Confirm all of it in your
  verification-first step and record any disagreement in the work history.

  THE CONTROL SET IS NINETEEN, not sixteen, and criterion 9.2(a) requires your
  spec to SWEEP and COLLECT the set rather than look up a list, to fail in BOTH
  directions, and to require the plan's enumeration to be amended rather than
  the spec narrowed when the two disagree. Seventeen source sites;
  src/platform/ui/nav-link.tsx:47 renders three. Five are conditional: the
  preview-again submit renders on the DELIMITED path and not the PDF one and
  sits inside a closed details element at profile-confirmation.tsx:151; the
  next month-step Link is behind canGoNext; the empty-state link renders only
  before an import; and back-to-import at import-result.tsx:36 is on the FAILED
  branch, reachable with the committed test/fixtures/unknown-layout.pdf.

  WHAT WILL FAIL YOU, learned from the two rounds that produced these criteria:
  - A pressed appearance of `transform: translateY(0.01px)`. Criterion 9.2(b)
    requires BOTH a vertical translation of at least one device-independent
    pixel equal to --press-offset AND a composited-colour change meeting a WCAG
    contrast ratio of at least 1.1 to 1, calibrated to pass a 5 percent grey
    step and fail a 2 percent one, with an alpha floor of 0.08 AS WELL AS the
    ratio on the three controls that declare no background at all
    (.app-nav-link at globals.css:177, .app-signout at :231 with its explicit
    background: none at :236, and .empty-state-cta at :281).
  - Comparing the pressed state against the AT-REST state. 9.2 compares against
    the HOVERING state deliberately, because the five pre-existing hover rules
    would otherwise pass it with no pressed rule added at all.
  - Removing the platform's own tap highlight in the same change that claims to
    add one. 9.2's second half greps for tap-highlight and requires nothing.
  - Dropping touch emulation to make the phone measurement pass. That is
    explicitly not an admissible answer. If a held mouse.down yields no
    :active, drive the press with the touch API under hasTouch; if :active
    still does not apply, the pressed appearance is not built on :active and
    9.2 measures whatever it is built on, still at 390 by 844 under touch.

  REDUCED MOTION IS PART OF THE WORK, not a follow-up. Criterion 9.4(c) is the
  half that matters: 9.2's pressed measurement and 9.3's disabled and busy
  measurements are re-run IN FULL under a reduced-motion context and BOTH MUST
  PASS, so a reader who asked the system for less motion keeps the feedback and
  loses only the easing. Build it as one prefers-reduced-motion block in
  tokens.css redefining the durations at :root, so no rule can forget its
  variant.

  SCOPE, and criterion 9.7 measures it: this is a STYLESHEET phase. git diff
  --name-only against your base must print ONLY styles/tokens.css,
  src/app/globals.css, playwright.config.ts, one new file under test/e2e/ and
  your work-history files. No .tsx, nothing under src/modules/, nothing under
  messages/, nothing under prisma/, nothing under test/fixtures/, and
  package.json and package-lock.json byte unchanged. You open no client
  boundary, add no markup, add no copy and add no package. Nine tokens go into
  styles/tokens.css and every duration and easing curve in the product must be
  a token, which criterion 9.5(c) checks with a grep the existing gate:tokens
  cannot see.

  METHOD. Work the plan's steps in order; step 1 is verification-first and its
  five questions must be answered with captured output BEFORE you build. Write
  each spec and watch it fail before you make it pass. Criterion 9.3 applies
  the disabled and busy states through the DOM because no control enters them
  until M3-P10; that is decision D-28 and it is a real measurement of the
  shipped stylesheet, so do not weaken it into a grep.

  GATE, all of it, in the worktree, and paste the real output:
    export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh
    cd /home/user/wt-m3p9
    npm run typecheck && npm run lint && npm test && npm run gate:privacy && npm run gate:tokens
    npm run test:e2e
  The e2e stack needs the local Postgres and auth stack: `sudo dockerd`, then
  about 30 seconds. If `npx supabase start` fails on an rlimit error naming the
  database, the real cause is edge-runtime: set enabled = false under
  [edge_runtime] in supabase/config.toml, start, then REVERT that tracked file
  before committing and verify with git diff. Other agents may hold ports 3000,
  3100, 3040, 3140, 3060 and 3160; if they clash, move the webServer ports and
  RESTORE playwright.config.ts, verifying with git diff rather than asserting
  it. Ambient foreign SUPABASE_* and DATABASE_URL must be pinned or sign-up
  fails with signup-failed and no request reaches the auth container, which
  reads as a broken app rather than a wrong host.

  Write delivery/work-history/m3-p9.yaml with a populated deviations list and
  validate it with /home/user/pulse-fleet/node_modules/.bin/tiphys validate
  --type work-history --context /home/user/pulse-fleet. Delete BRIEF.md before
  committing. Commit on claude/m3-p9-pressed-and-disabled and push with `git -C
  /home/user/wt-m3p9 push -u origin claude/m3-p9-pressed-and-disabled`,
  retrying up to 4 times with 2s/4s/8s/16s backoff. The repository is PUBLIC:
  no amount, no counterparty, no account or card number, no data row and no
  real place name in any commit message.

  REPORT BACK: criterion by criterion, met or not, with the command and its
  real output; the swept control set and whether it equals nineteen; every
  token you added and its value; the red run of 9.2 before your change and the
  green run after; and anything you could not complete and why. Do not claim a
  command passed that you did not run.

