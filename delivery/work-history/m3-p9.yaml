environment-warnings:
  - warning: >-
      A COMPUTED STYLE READ ACROSS A TRANSITIONED STATE CHANGE RETURNS THE
      VALUE THE ELEMENT IS TRANSITIONING FROM. Before this phase no stylesheet
      in this product declared a transition, so no spec had to think about it;
      from this phase on, every one does. The failure it produces is a false
      red when the measurement expects a difference and a false GREEN when it
      expects sameness, and the second is the dangerous direction. Wait for the
      running transitions with Element.getAnimations(), excluding infinite
      ones, rather than for a fixed number of milliseconds.
    evidence: >-
      The first attempt at a green run failed with "disabled
      button.auth-submit|Sign in: background 1.000, colour 1.000, border 1.000,
      opacity delta 0.000" against a stylesheet whose disabled rule was present
      and correct; adding the settle helper turned the same run green with no
      other change to the rules.
  - warning: >-
      getComputedStyle RETURNS oklch() STRINGS IN THIS PRODUCT, not rgb(),
      because the ramp is declared in oklch and Chromium serialises CSS Color 4
      back unchanged. Any spec doing colour arithmetic has to parse them; the
      browser's own 2D canvas is a parser that agrees with the browser's
      painting
      (ctx.fillStyle = the string, fillRect, getImageData), and it accepts
      oklch.
    evidence: >-
      A probe run in this container returned
      {"applied":"oklch(0.91 0.005 265)","rgba":[223,225,229,1]} for
      --pulse-grey-100, so the canvas resolves the ramp correctly.
  - warning: >-
      IN PLAYWRIGHT 1.62 THE reducedMotion OPTION IS NOT A TOP-LEVEL test.use
      KEY. It is set as test.use({ contextOptions: { reducedMotion: "reduce" }
      }); the top-level form fails typecheck with TS2353 naming reducedMotion,
      which reads as the option not existing rather than as it living one level
      down.
    evidence: >-
      tsc --noEmit reported: test/e2e/pressed-and-disabled.spec.ts(492,14):
      error TS2353: Object literal may only specify known properties, and
      'reducedMotion' does not exist in type 'Fixtures<...>'.
  - warning: >-
      npx supabase start CAN REPORT A FAILURE WHILE THE STACK IS ACTUALLY UP.
      It exited 1 with
      {"_tag":"Error","error":{"code":"LegacyStatusDbNotReadyError","message":"supabase_db_...
      container is not ready: unhealthy"}} and docker ps a minute later showed
      the database container healthy and the auth container answering. Check
      docker ps and the auth health endpoint before believing the exit code.
    evidence: >-
      curl http://127.0.0.1:54321/auth/v1/health returned 200 and
      {"version":"v2.195.0","name":"GoTrue",...} after that error.
  - warning: >-
      THE AMBIENT SUPABASE_* AND DATABASE_URL IN THIS CONTAINER POINT AT A
      DEPLOYED PROJECT, not at the local stack, and Next.js does not let a .env
      file override a variable already in the environment. They have to be
      exported explicitly in the shell that runs the e2e gate, or sign-up fails
      with signup-failed and no request reaches the local auth container, which
      reads as a broken application rather than as a wrong host.
    evidence: >-
      env showed DATABASE_URL and NEXT_PUBLIC_SUPABASE_URL pointing at a
      pooler host and a project subdomain while .env named 127.0.0.1:54322 and
      127.0.0.1:54321.
  - warning: >-
      npx supabase start NEEDED [edge_runtime] enabled = false in
      supabase/config.toml in this container, exactly as the dispatch said. The
      file was reverted immediately after the stack came up and git diff
      supabase/config.toml is empty, which is how the revert was checked rather
      than asserted.
    evidence: >-
      git diff --stat supabase/config.toml printed nothing after the revert,
      and git diff --name-only against origin/main lists six paths (corrected
      from five in fix round 1, finding CR-M3P9-05), none of them
      supabase/config.toml.
  - warning: >-
      A COMMENT CAN FAIL A CRITERION'S OWN GREP. Criterion 9.2(c) greps the
      stylesheets for the webkit property that removes the platform tap
      highlight and requires nothing, and the comment explaining why the phase
      leaves that highlight alone contained the property name, so the criterion
      failed on the comment that documented compliance with it. The file
      already had this problem once, at styles/tokens.css:178, which spells
      at-media out for the same reason.
    evidence: >-
      grep -rn "tap-highlight" over the four tracked stylesheets returned
      src/app/globals.css:1359 before the comment was reworded and exits 1
      after.
  # FIX ROUND 1
  - warning: >-
      page.touchscreen.tap CANNOT MEASURE A HELD PRESS. It dispatches its
      touchstart and its touchend inside one task, so no frame ever falls
      between them and no press-driven appearance, by any mechanism, is
      observable under it: zero pressed frames for :active AND for a
      pointerdown-driven attribute alike. The instrument for a press
      measurement is a held CDP Input.dispatchTouchEvent touchStart with a
      waitForTimeout between the start and the end.
    evidence: >-
      Under the Pixel 5 context: page.touchscreen.tap on a control whose
      pointerdown handler sets the attribute produced "frames 9, framesPressed
      0"; a held CDP touchStart on the same control produced "frames 27,
      framesPressed 25, peakBoxDisplacementPx 2".
  - warning: >-
      grep -F SPLITS A PATTERN THAT CONTAINS A NEWLINE INTO SEVERAL PATTERNS,
      and an empty one among them matches every file. A probe list built with a
      \s+ join spans line breaks, and the resulting sweep reported a
      77-character probe matching .gitignore and .env.example. Build multi-word
      probes with [ \t]+ and discard any probe containing a newline.
    evidence: >-
      The same probe set returned 115 hits with the \s+ join and 19 with the
      [ \t]+ join, and the 77-character probe's file list included every
      tracked file in the repository.
  - warning: >-
      A "NON-ZERO COMPUTED WIDTH" ASSERTION ON A BORDERED PSEUDO-ELEMENT
      CANNOT REACH ZERO. Tailwind's preflight sets box-sizing: border-box on
      ::after, so width: 0 with a one-pixel border computes 2px. Criterion
      9.3's zero-width clause therefore binds against width: 0 together with
      border: none, or display: none, and not against width: 0 alone.
    evidence: >-
      A standalone probe page with nothing else on it returned
      {"zeroWidth":"2px","zeroContent":"\"\"","eightWidth":"8px"}, and the
      spec stayed green under a width-only mutation and reddened when the
      border was zeroed too.
  - warning: >-
      A NEGATIVE NAVIGATION ASSERTION AGAINST THE DEV SERVER CAN PASS WHILE THE
      NAVIGATION IS STILL IN FLIGHT, because next dev compiles a route on its
      first request. Warm the destination route before asserting that a click
      did not reach it, and always pair the negative with a positive control at
      the same coordinates.
    evidence: >-
      The first version of the aria-disabled test passed "the marked link did
      not navigate" and then failed its own positive control, because the
      unmarked click had already navigated and the marked one had too; the
      500ms wait was shorter than the first compile of /sign-up.
