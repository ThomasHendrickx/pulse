key-decisions:
  - decision: >-
      The e2e clock is fixed via PULSE_FIXED_NOW=2026-09-15T12:00:00Z set
      by the Playwright webServer config, parsed by a single accessor in
      platform/config.ts (the one home env reads are allowed) and consumed
      only by appClock in platform/clock.ts, resolved per request rather
      than at module load. September 2026 is therefore the partial current
      month mid-month (day 15 of 30), August 2026 a closed month compared
      to July 2026, and the committed absolute-month fixtures keep their
      meaning on any future date.
    why: >-
      Criterion 4.2 requires a fixed clock mid-month, the architecture
      requires an injected fixed clock for determinism, pulse-typescript
      confines env parsing to the config module, and config's own
      build-safe contract forbids module-load env reads (a Vercel build
      imports every route module), which is what made the per-request
      resolution necessary; npm run build exit 0 at 839445a is the
      evidence.
  - decision: >-
      The viewed month rides an English URL search parameter
      (/?month=YYYY-MM, validated, future months falling back to the
      current month); the default is the clock's current month, read as
      the Brussels calendar day of the instant, and prev/next links
      navigate months with next capped at the current month.
    why: >-
      URL paths stay English (non-negotiable 2), the prototype has
      prev/next navigation, and deriving "today" in Europe/Brussels
      instead of server UTC keeps the partial-month boundary from
      shifting a day around midnight, the same hazard pulse-typescript
      names for booking dates.
  - decision: >-
      The read model is the four grouped queries as raw SQL in the
      overview repository (income by merchant, spend by primary tag then
      merchant with the cash marker computed in SQL, reserve movements by
      counterparty account, the reconciliation figures aggregate), plus
      the SAME four for the previous month fetched ONLY when the viewed
      month is closed, plus two small reads the architecture's panel and
      empty state require: the gap-row detail list (so a non-zero
      difference NAMES its causes row by row) and one EXISTS for the
      empty state. Unresolved-text folding and delta attachment are pure
      domain functions, with the merchants module's published
      normaliseCounterparty injected so both screens group an unknown
      under the same key.
    why: >-
      pulse-v1-architecture.md:201-209 and :63: grouped aggregation is
      where Prisma is weak, computed on read with no materialisation; the
      panel must name causes, which counts alone cannot; and the domain
      fold stays import-free per the module dependency rule.
  - decision: >-
      Per-month reconciliation: difference = changeInPot - (income -
      spend - netToReserves) over the month's interpreted rows, which by
      construction equals the sum of the month's INTERNAL and UNRESOLVED
      amounts; an unmatched leg is an INTERNAL row with no transfer_link
      row carrying both sides (matched pairs and settled card debits with
      their mirror are exactly the complete links interpretation
      persists). The panel ships in the view in both states, alarm
      treatment only when the difference is non-zero, causes listed with
      counts, sums and named legs whenever they exist, including when the
      books close (a zero-amount UNRESOLVED row is still shown).
    why: >-
      The reconciliation identity is charter-protected and the panel is
      not a debug feature (architecture section 8); hidden unknowns are
      hazard H4.2, so visibility of gaps must not depend on the alarm
      state, which mutation M3 witnessed as a real failure mode.
  - decision: >-
      Cash withdrawals group under their own "cash" destination with
      precedence over any merchant assignment (M1-P4 open question
      M1P4-C7, resolved here): the ledger publishes its code-owned
      CASH_WITHDRAWAL_PATTERNS and a named predicate through its
      application index, the overview's SQL derives a Postgres ~*
      predicate from the same pattern list, and the sibling constraint
      (patterns stay valid in both regex dialects) is recorded at the
      patterns' definition.
    why: >-
      "Own destination, never split" must survive a user naming a
      GELDOPNAME descriptor (M1P4-C10); one pattern list consumed by two
      engines avoids the two-sources drift this project has recorded
      three times, and the mechanism-sibling clause requires the rule at
      the definition with the consumer named.
  - decision: >-
      Comparison renders as magnitude change per group (|current| minus
      |previous|) with direction glyphs from the prototype, matched by
      group key; groups present only in the previous month are not
      resurrected as zero rows, and the partial current month fetches no
      previous-month data at all, so nothing exists to render (hazard
      H4.1 addressed structurally). The compare column then carries a
      translated "not compared" marker.
    why: >-
      pulse-v1-plan.md:206: only closed months are compared; computing
      and hiding would leave the comparison one conditional away from
      leaking, while not fetching it makes mutation M1 the only way back.
  - decision: >-
      Criterion 4.4's lint rule is react/jsx-no-literals with DEFAULT
      options, enabled for src/modules/**/ui/**/*.tsx: bare JSX text
      nodes are errors; string literals inside expression containers and
      string props stay legal, which is where the view's deliberate
      glyphs (arrows, interpuncts, the euro sign) live.
    why: >-
      The criterion names this rule; default options catch exactly the
      hardcoded-copy hazard (H4.3) without forbidding className props.
      The expression-container escape is a KNOWN residue, stated rather
      than hidden, and mutation M4 (a hardcoded English verdict inside an
      expression container) shows the locale e2e reddening on NL, so the
      residue has an executable witness one layer up.
  - decision: >-
      The golden journey keeps reserves at 0,00 with the no-reserves note
      asserted: no reserve account exists in the three-file journey
      because the app has no reserve-registration surface (reserve
      accounts are registered by IBAN with statements left unimported in
      v1 per the plan's input decision, and the only declaration flow is
      the import confirmation; settled by grep -rn "RESERVE" over src/app
      and src/modules/*/ui, whose only hit is the Ring select option in
      import/ui/profile-confirmation.tsx:122).
    why: >-
      Criterion 4.1 fixes the journey at exactly three files; a
      fixture-derived known value of zero is still a known value, the
      identity still binds all four totals, and the missing registration
      surface is handed on as an open question rather than worked around
      with a fourth upload the criterion does not allow.
  - decision: >-
      Mechanism lookup (mechanism-lookup clause): no mechanism-index.yaml
      exists in the fleet root and the project's delivery/tuition/ is
      empty; the kernel's copy at
      node_modules/@tiphys/kernel/tuition/mechanism-index.yaml was read
      in full (15 entries, all kernel-process mechanisms: claim files,
      leases, append-only logs, worktree removal, reporter parsing, CI
      step assertions, guards). It has NO entry for month projections,
      raw SQL aggregation, e2e fixtures or server-component views: a
      recorded answer, not a skipped lookup. Two general rules were
      applied: assert by name over append-only registries (CR-404 IS
      that rule, and the fix pins the index name), and a class witness
      reddens under two structurally different members (the token gate
      under hex and oklch; hidden unknowns under M2 and M3).
      gates.manifest.json exists only inside the kernel package; this
      phase adds no destructive command, so destructiveCommands is
      untouched. One new mechanism rule was established and recorded at
      its definition with the sibling named (mechanism-sibling clause):
      the cash pattern list is consumed by two regex engines, so every
      pattern must stay valid Postgres ARE syntax; the rule sits at
      CASH_WITHDRAWAL_PATTERNS in ledger/domain/constants.ts and names
      the overview repository as the sibling consumer.
    why: >-
      The clause requires stating which rules were found and how each
      was satisfied, including the honest none-found case and the
      sibling enumeration for any rule the phase establishes.
verification-first:
  - finding: >-
      Base check before building: the worktree sat clean at main b54783b
      (all four prior phases merged; the plan's M1-P5 extras declaration
      for CR-404 present in its tip commit). Pristine baseline gates
      before the first edit: npm run typecheck exit 0, npm run lint exit
      0, npm test 219 passed, 0 failed, 0 skipped, exit 0 (Node v26.7.0,
      vitest run, no build step required).
    contradicts-plan: false
  - finding: >-
      Two mandated-reading paths do not exist where the brief's reading
      list names them: no tuition/mechanism-index.yaml and no
      gates.manifest.json exist in the fleet root, and the project's
      delivery/tuition/ is empty. The kernel package's copies were read
      instead, the same resolution M1-P4 recorded.
    contradicts-plan: false
  - finding: >-
      The declared files-to-touch list does not include files this
      phase's own acceptance criteria require: criterion 4.4 requires a
      lint rule, which only eslint.config.mjs can enable; criterion 4.5
      requires an npm script, which only package.json can carry;
      criterion 4.2's fixed clock needs playwright.config.ts (webServer
      env), platform/config.ts (the one module allowed to read env) and
      platform/clock.ts; and the cash-destination grouping (M1P4-C7,
      recorded at the marker's definition for this phase) needs one
      published export from the ledger module. Escalated in the notes
      (t3) the moment found, per the scope rule that the amendment must
      land on the base branch; the work continued on the unblocked
      remainder.
    contradicts-plan: true
    stopped-and-reported: >-
      delivery/work-history/m1-p5-notes.md section t3, written and pushed
      before any of the six files was touched; the orchestrator holds the
      merge-base declaration amendment.
  - finding: >-
      UNRESOLVED flow is reachable only through zero-amount rows in the
      shipped classifier (classify-flow.ts: reserve set, pot set,
      settlement step, then sign decides, and only a zero amount has no
      direction to read). Criterion 4.3's unresolvable-transaction arm is
      therefore witnessed with a zero-amount row: the visibility and
      naming assertions are exact, while the excluded-from-totals half is
      exact but zero-valued in cents; the non-vacuous exclusion witness
      for the same flow-based totals mechanism is the gapped test's
      400,00 INTERNAL leg.
    contradicts-plan: false
  - finding: >-
      The em dash carry-in named merchantsBody only; the catalog grep
      found a second key (emptySteps[0]) carrying an em dash in all three
      locales. Both were fixed, meaning unchanged, and the catalogs now
      grep clean.
    contradicts-plan: false
deviations:
  - plan-clause: >-
      M1-P5 files-to-touch (src/modules/overview/, src/app/,
      test/e2e/golden-journey.spec.ts, test/e2e/month-view.spec.ts,
      test/fixtures/, messages/en.json, messages/nl.json,
      messages/fr.json; extras test/application/resolve-merchants.test.ts)
    why: >-
      Six files outside the declared list were needed, each escalated in
      the notes (t3) before being touched so the orchestrator can amend
      the declaration on the base branch before the scope gate runs. (1)
      eslint.config.mjs: criterion 4.4 requires react/jsx-no-literals
      enabled for src/modules/**/ui, and lint rules live only there. (2)
      package.json: criterion 4.5 requires the token-purity grep wrapped
      as an npm script. (3) playwright.config.ts: criterion 4.2's fixed
      mid-month clock is pinned in the webServer env so the gate is
      deterministic in-repo instead of depending on the invoking shell.
      (4) src/platform/config.ts and (5) src/platform/clock.ts: the
      override is an env read, and pulse-typescript section 6 confines
      env reads to the config module; the Clock construction sits beside
      the existing systemClock. (6) src/modules/ledger/application/index.ts
      plus its domain/constants.ts: the cash-withdrawal patterns are
      code-owned in the ledger, and the overview may consume them only
      through the published index; duplicating the list would be a second
      source. delivery/work-history files are standing extras per the
      brief.
