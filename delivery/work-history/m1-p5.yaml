fix-round:
  - mechanism: >-
      CR-501: a user-facing verdict derived from an aggregate RESIDUAL
      while its explanation enumerates only a subset of the residual's
      contributors. Matched INTERNAL legs whose partner books outside
      the viewed month sit in the difference with no named cause (the
      recurring false alarm), and contributors of opposite sign cancel
      inside the residual so the verdict can read closed over real gaps
      (the verdict flip). The fix closes the partition (an in-transit
      cause carrying the matched-leg net, which by construction equals
      the sum over straddling legs because a pair fully inside the
      month contributes zero) and re-derives the verdict from the
      partition, not the residual: ok requires difference zero AND
      empty unmatched, unresolved, in-transit and uninterpreted causes.
    derivation:
      command: grep -rn "reconciles" src --include=*.ts --include=*.tsx
      output: |
        src/modules/overview/ui/month-view.tsx:289 (alarm on pot part)
        src/modules/overview/ui/month-view.tsx:298 (data-state)
        src/modules/overview/ui/month-view.tsx:302 (verdict copy)
        src/modules/overview/ui/month-view.tsx:319 (note selection)
        src/modules/overview/domain/month-projection.ts:184 (type)
        src/modules/overview/domain/month-projection.ts:208 (the fixed
        derivation)
        src/modules/ledger/domain/reconciliation.ts:35,42,46 (type and
        the new sibling-rule comment)
        src/modules/ledger/domain/reconciliation.ts:99 (the ledger
        report's residual-only boolean, see not-covered)
        [reading of every site at 2323645: the month view consumes
        MonthFigures.reconciles at four places, all downstream of the
        one fixed derivation; the only OTHER producer of a
        reconciles-shaped boolean in the codebase is the ledger
        window report]
    not-covered: >-
      The ledger report's own reconciles (reconciliation.ts:99) stays a
      residual-only boolean: over its window the straddling case is
      structurally absent (pairing runs inside the interpreted set, so
      both legs of a matched pair are in the window), but cancelling
      unmatched gaps DO leave it true beside non-empty gap lists. Its
      only consumers today are the fast-gate suites, no UI renders it;
      the rule that a residual-only boolean must not become a verdict
      is recorded at its definition naming the month view's derivation
      as the pattern, so the next consumer meets it. Also not covered:
      no fixture exercises TWO in-transit pairs of opposite sign in one
      month (net zero, count two); the verdict still refuses ok there
      by the inTransitCount condition, pinned in the unit suite, not in
      an e2e.
  - mechanism: >-
      CR-502: reading only rows a LATER pipeline stage has stamped, so
      a failure between two commits makes durable rows invisible rather
      than loud. Ingest commits facts, interpretation stamps flow in a
      separate transaction; the figures query filtered flow IS NOT NULL
      and so could not even count what it excluded. The fix makes the
      exclusion COUNTED: the aggregate reads all rows, every named sum
      filters on flow itself, and a non-zero uninterpreted count is a
      rendered cause that blocks the ok verdict.
    derivation:
      command: grep -n '"flow"' src/modules/overview/adapters/overview-repository.ts
      output: |
        107 (counted groups, flow = INCOME|SPEND), 156 (reserves,
        flow = RESERVE), 194-209 (the figures aggregate: every SUM and
        COUNT carries its own flow FILTER, changeInPot and rowCount
        filter flow IS NOT NULL, uninterpretedCount filters flow IS
        NULL, and the statement's WHERE carries NO flow predicate),
        258-259 and 273-276 (gap rows: flow IS NULL is the
        uninterpreted arm). [reading at 2323645: no remaining query in
        the overview module can drop a flow-NULL row without counting
        it]
    not-covered: >-
      The merchant review screen's listCountedTransactions (merchants
      module) reads flow IN (INCOME, SPEND) and stays blind to
      flow-NULL rows; its totals mirror the month view's counted sums,
      and the month view is where the household is told about the
      pending rows, so the review screen understates consistently
      rather than lying independently. Recorded as open question
      M1P5-C15 instead of widening this round into the merchants
      module. The fast gate still cannot execute the SQL itself (no
      database in the fast gate by design): the committed unit test
      covers the use case over a fake port, and the SQL half is held by
      the executed probe recorded in claim M1P5-C17, and the stricter
      reconciles refuses the ok verdict while uninterpreted rows are
      present (pinned red-then-green by the unit suite in M1P5-C19).
  - mechanism: >-
      CR-503: an environment override with no environment guard: the
      module carried the guard (isProduction) and the claim ("unset in
      production") but nothing connected them, so a leaked variable was
      honoured silently. The fix consults the guard at the read: a
      production process with the override set logs with the module
      prefix and throws.
    derivation:
      command: grep -rn "process.env" src --include=*.ts --include=*.tsx | grep -v "src/platform/config.ts"
      output: |
        src/platform/db/guard-cli.ts:10,29,30,36 (the documented
        guard-cli exemption, standalone CLI entrypoint). [reading at
        2323645: config.ts is otherwise the only module reading env;
        within it, PULSE_FIXED_NOW is the only value that OVERRIDES
        runtime behaviour, the rest are required configuration or
        boolean diagnostics, so the production refusal covers the
        entire override surface]
    not-covered: >-
      The refusal fires at the point of use (request time), not at
      boot: a production deployment with the variable set serves loud
      500s on the month view rather than failing the build, consistent
      with the module's build-safe contract that forbids module-load
      env validation. Other future overrides added to config.ts must
      copy the guard; the corrected comment at the definition says so.
  - mechanism: >-
      CR-505: a test harness trusting ambient infrastructure it did not
      configure: reuseExistingServer accepted ANY process on the port,
      including a stale dev server from another worktree running
      without the pinned clock, silently trading determinism for
      startup time. The fix refuses reuse; an occupied port now fails
      the run loudly.
    derivation:
      command: grep -n "reuseExistingServer" playwright.config.ts
      output: |
        34: reuseExistingServer: false (with the reason recorded at the
        setting). [the only webServer declaration in the repository;
        playwright.deploy.config.ts starts no server at all]
    not-covered: >-
      Nothing verifies that port 3000 is free before a run; a stale
      server now produces a loud port-in-use failure instead of a wrong
      suite, which is the intended failure mode, and the fleet warning
      about stray dev servers stays in force for humans debugging one.
  - mechanism: >-
      CR-507 (micro round): a joined row read through a relationship
      whose write path currently guarantees tenancy, with no filter of
      its own: the in-transit partner join fetched the linked
      transaction by id alone. No harm was constructible today (links
      are written only within a household), but non-negotiable 6 is the
      letter precisely so a future refactor of the writer does not
      silently become a cross-tenant read. The fix adds
      p."householdId" = t."householdId" to the JOIN's ON clause.
    derivation:
      command: >-
        npx vitest run test/application/month-overview.test.ts with the
        new SQL-shape suite, before and after the one-line fix; the
        suite pins the partner join's filter BY NAME and sweeps every
        JOIN in the repository for a householdId predicate near its ON
        clause
      output: |
        Red (pre-fix): 1 failed | 7 passed, the by-name pin
        ("toMatch /JOIN "transactions" p\s+ON p."householdId" =
        t."householdId"/") failing. Green (post-fix): 8 passed, exit 0.
        HONESTY NOTE on the sweep half: the generic
        householdId-near-the-JOIN check was green even BEFORE the fix,
        because the 300-character window after the partner join reaches
        the link's own l."householdId" predicate; it is a backstop for
        FUTURE joins, and the by-name pin is the witness that actually
        reddened on this finding.
    not-covered: >-
      The sweep is textual, over this one adapter file; a new adapter
      in another module gets no coverage from it. The existing schema
      and tenancy suites still hold the model-level half; a
      database-executed cross-tenant probe of this specific join was
      not run, since the reviewers already established no harmful
      construction exists while the link writer is household-scoped.
  - mechanism: >-
      CR-508 (micro round): user-facing remedy copy asserting a recovery
      path the system does not have: "upload the file again" cannot heal
      an uninterpreted row, because a same-file re-upload dedups to zero
      rows, importPeriod returns null and interpretForImport no-ops (the
      reviewer traced the full path). Fixed by making the copy TRUE
      rather than the false copy work: the three catalogs now say the
      rows are included when interpretation next covers their period,
      for example after the next import touching the account. The
      healing behaviour change (interpret over the parsed span even when
      zero rows are added) was considered and NOT taken: it edits the
      import module's upload path, outside this phase's surface, and is
      handed on as open question M1P5-C21.
    derivation:
      command: >-
        python3 json check over messages/{en,nl,fr}.json after the
        rewording: key count per locale, and a search for the false
        remedy phrasing in each catalog
      output: |
        en 101, nl 101, fr 101 keys (parity held);
        again-upload-remedy present: False, False, False (the false
        instruction is gone from all three locales).
    not-covered: >-
      No e2e asserts this copy (no test can construct a flow-NULL row
      through the UI); the copy's truth rests on the reviewer's traced
      path plus the wording now promising nothing the trace refutes.
      The actual healing path stays as traced: a later import touching
      the account's period, or the dev-only recompute.
