kind: work-history
phase: M1-P5
prompt: |
  You are the implementer for phase M1-P5 (the two-sided month view) of the Pulse delivery, the final walking-skeleton phase. Your brief is /home/user/pulse-fleet/implementer-brief-m1-p5.md: read it fully first, including the appended fleet warnings; it is your contract. Your working tree is the fresh clone /home/user/pulse-fleet/worktrees/m1-p5-month-view on branch claude/m1-p5-month-view (based on main b54783b, all four prior phases merged). Do all work there, never in /home/user/pulse.

  Read the three repo skills before writing code: pulse-frontend is CENTRAL this phase (server components, the mandatory money rendering, design tokens only, next-intl across EN/NL/FR, and the specific UI states: partial month, unreconciled books, unresolved counterparties, unmatched transfer legs, empty state); pulse-domain for the read model and reconciliation identity; pulse-typescript throughout. The view is built against the committed prototype design/reference/pulse-prototype.html.

  The phase spec's order is binding: write test/e2e/golden-journey.spec.ts FIRST, before the view, as the three-file journey (criterion 4.1: current account, second pot account with the other transfer leg, card fixture with line items plus settlement mirror row; assert card line items counted as spend exactly once, settlement pair excluded from both sides, income/spend/reserves/pot-change totals against fixture-derived known values, reconciliation difference zero). Then: the month projection as four grouped queries plus the same four for the previous month, computed on read, raw SQL in the repository where Prisma aggregation is weak, NO materialisation and NO cache; the view with income by source, spend by primary tag then merchant, the signed reserves block, previous-closed-month comparison; the reconciliation panel ALWAYS shipping in the view (a non-zero difference names its cause; UNRESOLVED and unmatched legs visible, never folded into totals); the partial current month rendered in progress and never compared (criterion 4.2, fixed clock mid-month in test/e2e/month-view.spec.ts); the gapped-fixture and unresolvable-transaction alarm states (criterion 4.3); all three locales without truncation or overflow, react/jsx-no-literals (or equivalent, name recorded in the work history) enabled for src/modules/**/ui with lint green (criterion 4.4); the token-purity grep gate as an npm script (criterion 4.5); and criterion 4.6, the DR-0001 release verification: fast gate plus both e2e suites green on the same commit, recorded as evidence. A change from that declared verification to anything weaker is a charter escalation, never a local call.

  Two small backlog carry-ins, both declared in scope: (1) CR-404: the partial-index assertion regex in test/application/resolve-merchants.test.ts accepts any index name; pin the name merchant_tags_one_primary_per_merchant so the migration comment's "asserted by name and predicate" claim is true. (2) The pre-existing em dash in messages/*.json merchantsBody (CLAUDE.md rule 7): remove it in all three locales without changing meaning; grep the catalogs for any other em dash while there.

  Environment facts (also in the brief's warnings): never use ambient DATABASE_URL/DIRECT_URL/SUPABASE_* (foreign project; they override .env for Prisma AND the Playwright webServer, pin ALL FIVE values local for db and e2e work); docker daemon may be dead, sudo dockerd; Node 26 for tiphys via export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh; npm only; integer cents everywhere, money rendered only the mandated way; no em dashes; English identifiers everywhere, translated content only in catalogs; no literal colours, font sizes or spacing, tokens only.

  Work in small commits pushed incrementally (git push -u origin claude/m1-p5-month-view on first push); if killed and resumed, reread your last commits and continue. Red witness before green for every behavior (the golden journey written first IS the red witness for the view). Before reporting done: npm run typecheck, npm run lint, npm test, npm run test:e2e all exit 0 in your clone; delivery/work-history/m1-p5.yaml schema-valid (npx --prefix /home/user/pulse-fleet tiphys validate --type work-history with a context containing the plan) plus m1-p5-notes.md. Confirm the final push with git ls-remote origin claude/m1-p5-month-view output in your report. Final report: per-criterion status with executed evidence, deviations declared the moment found, open questions, head sha.
