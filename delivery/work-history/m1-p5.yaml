claims:
  - id: M1P5-C1
    kind: coverage
    statement: >-
      Criterion 4.1: the golden journey was written FIRST and is the red
      witness for the whole view. Red: at 0ec6235, against the view-less
      app, the three uploads all passed (rows-added 8, 2, 4: fixtures
      parse, both profiles detect, ingest and interpretation ran) and the
      spec failed at its first view assertion (month-title on
      /?month=2026-08), 1 failed. Green: after the view landed (8dbc7ed)
      the same spec passed unmodified, and at head af759b3 the full e2e
      suite passed with it. The spec asserts, against hand-derived
      fixture arithmetic in its header: income 2.500,00, spend 1.918,97
      with each card line item appearing as exactly one spend group
      (PIZZA NAPOLI 450,00, ELEKTRO CITY 250,00), the settlement pair
      and the transfer pair absent from the whole main region (no
      "850,00", no "MASTERCARD", no "300,00" anywhere in it), reserves
      0,00 with the no-reserves note, pot change 581,03, July comparison
      deltas (income up 100,00, Supermarkt down 8,73), and the
      reconciliation panel in state ok with no difference figure and no
      cause block.
    settled-by:
      executed-construction:
        command: >-
          npx playwright test golden-journey at 0ec6235 (red), then the
          full suite at af759b3 via npm run test:e2e (env pinned, fresh
          db:reset)
        exit-code: 1
        output: >-
          Red: "1 failed ... golden-journey.spec.ts:130 ...
          getByTestId('month-title')" with all three uploads green.
          Green: "10 passed (1.9m)", exit 0.
  - id: M1P5-C2
    kind: coverage
