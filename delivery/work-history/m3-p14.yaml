        imported for an account declared RESERVE). AT THE PHASE BASE its rows
        carry NO flow, uninterpretedCount is 2, listGapRows returns both of
        them labelled "uninterpreted", and a non-zero uninterpreted count
        holds the verdict open, so the household's books never close again.
        UNDER THIS PHASE uninterpretedCount is 0, listGapRows is empty, the
        held read names the account with its row count, and every counted
        figure is unchanged: income 320000 both, reserveSigned -25000 both,
