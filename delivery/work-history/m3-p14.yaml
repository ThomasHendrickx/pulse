        and the books closing. That is hazard H15.2 observed live rather
        than argued. Under this phase's scoped reads they are already
        invisible to the totals (spendSigned 0, rowCount 1) even before the
        clearing, which is what "defence in depth" means here and is why the
        phase does not claim the verdict depends on the scoping.
      - >-
        AND THE CASE THE COUNTED READ'S RING RESTRICTION EXISTS FOR is
        visible in that same block: in ROUTE TWO before the clearing, the
        held read is EMPTY (those rows still carry a flow) and the counted
        read reports only the current account. A counted read written
        without its ring restriction would have reported the stale-flow rows
        to the household as counted money on the one screen state built to
        tell counted from held. That is hazard H14.21, and the restriction
        is not made redundant by the flow condition.
      - >-
        ROUTE TWO AFTER THE CLEARING: the phase base would report
        uninterpretedCount 2 and list both rows as gaps, which is hazard
        H15.3, the books never closing again. Under this phase the count is
        0, the listing is empty, and the held read names the account with 2
        rows. The two halves criterion 15.3 asks to be separated are
        separated, and both were observed.

