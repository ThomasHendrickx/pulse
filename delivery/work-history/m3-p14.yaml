kind: work-history
phase: M3-P14
prompt: |
  Implementer for phases M3-P14 (account registry) and M3-P15 (ring
  correction), dispatched together on one branch,
  claude/m3-p14-account-registry, in worktree /home/user/wt-m3p14, cut from
  main at 999d378.

  Both phases answer one owner question: "I have 4 bank accounts, 4 saving
  accounts and 2 credit cards. When I upload 1 bank account first, that one
  contains transfers to other accounts. Now Pulse asks me to name them as
  merchants, but they are not merchants. What do I need to do to get to that
  final state?"

  Two owner decisions bind and are not open: DR-0030 (Pulse ACCEPTS a reserve
  account's own statement; its rows are HELD, in no month total and not an
  uninterpreted gap) and DR-0028 (identity is deterministic: mod-97 plus a
  pinned country-length table; a model names, it never decides identity).

started: 2026-08-24

