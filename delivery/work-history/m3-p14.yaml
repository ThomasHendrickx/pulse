verification-first:
  - finding: >-
      declareAccount has exactly ONE caller in src, and there is no accounts
      route. Captured: `grep -rn 'declareAccount' src/` returns
      src/modules/import/application/confirm-import.ts:96 (the call),
      src/modules/import/application/index.ts:8 and :59 (the binding),
      src/modules/import/application/ports.ts:247 (the port) and
      src/modules/accounts/application/index.ts:27 (the definition). `find
      src/app -ipath '*account*'` printed nothing. So an account could come
      into existence only through the file that introduced it, which is the
      verified root cause the plan states.
    contradicts-plan: false
  - finding: >-
      Merchant resolution runs over INCOME and SPEND rows only.
      src/modules/ledger/application/interpret-window.ts:100 defines isCounted
      as flow === "INCOME" || flow === "SPEND", and it gates both the distinct
      key set at :126 and the per-row assignment at :136. Everything else
      carries no merchant.
    contradicts-plan: false
  - finding: >-
      Measured over the privacy gate's own scan scope, alternation and
      normalisation, the tree carries 24 distinct account-shaped values, of
      which 13 pass the validity test (country in the pinned table, the length
      that table assigns, and mod-97 equal to 1) and 11 fail. The plan's
      figure was 17 distinct, 7 passing and 10 failing, and the dispatch
      message said 19 with 12 failing. The phase read its own number off its
      own run, as the plan's verification-first step directs.
    contradicts-plan: false
  - finding: >-
      The canonical account form, the pinned ISO 13616 country-length table
      and the ISO 7064 mod-97 implementation ALREADY EXISTED on main, in
      src/modules/merchants/domain/counterparty-identity.ts, added by M3-P12
      after this plan was grounded at 75ec85d. The plan's step 2 and criteria
      14.3 and 14.4 describe building them in src/platform. They were MOVED
      rather than copied, on the coordinator's direction (finding PR7-001), so
      that criterion 14.4's "exactly one definition under src/" is true by
      construction. A unit test enumerates the call sites and asserts one
      definition of each.
    contradicts-plan: false
  - finding: >-
      The reserves join at src/modules/overview/adapters/overview-repository.ts
      compared the stored strings raw, and the ledger's declared sets, the
      reserve drawdown, the transfer-leg match and the import path's
      registered-account lookup all did the same. A Belgian statement prints
      account numbers spaced and the delimited parser stores the cell
      verbatim, so any of these answers "different account" for one account
      written two ways.
    contradicts-plan: false
  - finding: >-
      The delimited profile detector's account-shape test required the COMPACT
      form, so a column of spaced account numbers was not recognised as an
      account column at all. Criterion 14.4 states that the delimited parse
      stores such a cell verbatim, which is true of the PARSER, but the SPEC
      has to name that column first and detection is what names it. The test
      now runs over the canonical form, which only adds recognitions.
    contradicts-plan: false
