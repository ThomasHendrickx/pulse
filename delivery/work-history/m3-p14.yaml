key-decisions:
  - decision: >-
      The canonical account form, the pinned country-length table and the ISO
      7064 mod-97 implementation were MOVED from
      src/modules/merchants/domain/counterparty-identity.ts into
      src/platform/account-number.ts, and every consumer imports them. The
      merchants module keeps the names IBAN_LENGTH_BY_COUNTRY and
      compactAccount as aliases and keeps isTrustedCounterpartyAccount as a
      thin delegation.
    why: >-
      Criterion 14.4 asks for exactly one definition under src/ of each, in
      the platform module. All three already existed in merchants, shipped by
      M3-P12 after the plan was grounded, so writing a second copy in platform
      would have made the criterion green while two live copies of a
      money-critical validity test drifted apart. The platform module is also
      the only place the ledger domain may import from, and four modules need
      the form.
  - decision: >-
      Every COMPARISON against a transaction's stored counterparty account
      canonicalises both sides at comparison time; only the DECLARATION is
      stored canonical.
    why: >-
      The stored counterparty column is a FACT and is never rewritten to fix
      an interpretation (pulse-domain section 2, rule 1; that this branch
      keeps that rule is settled by claim C-14.8-no-fact-writes below, with
      its captured command). One account reaches
      this tree spaced on the delimited path and compact on the PDF path, so a
      raw string comparison answers "different account" for one account
      written two ways. The rule and its seven sibling call sites are recorded
      at the canonical form's definition.
  - decision: >-
      The accounts module's dependency on the ledger (the published recompute
      and the has-imported-rows read) is a PORT, bound in
      src/modules/accounts/ui/actions.ts rather than in the accounts
      composition root.
    why: >-
      The ledger's composition root already imports the accounts module's
      published interface, so binding the reverse edge in the accounts index
      would make two module indexes import each other at evaluation time. This
      is the same shape and the same reason as
      src/modules/merchants/ui/actions.ts, which binds recompute there for
      exactly this reason.
  - decision: >-
      The setup form submits through an onSubmit handler inside a transition
      rather than through a React form action.
    why: >-
      React resets a form after a form action resolves, and a reset writes
      every field back to its defaultValue. The inputs are controlled, so
      React's state still held what the owner typed while the DOM showed empty
      boxes and nothing re-rendered to put the values back. Measured: a
      refused submission cleared all three rows on screen, which is exactly
      what criterion 14.3 forbids.
  - decision: >-
      The confirmation screen declares an account only for a file with NO
      own-account column, and the role it writes is fixed to POT rather than
      read from a control.
    why: >-
      The ring is answered at setup and a second place to answer it is a
      second place to answer it wrongly (criterion 14.5). A file with no
      own-account column is a card (decision D-48), and a card is a pot
      account by definition (pulse-domain section 1 puts current accounts and
      cards in the pot ring), so the value is forced by the shape rather than
      inferred from a name.
  - decision: >-
      The shell's navigation links use --text-xs and --space-1 vertical
      padding at phone widths, and the main region's top gap is --space-6
      rather than --space-8; the desk width keeps --text-base and its own
      padding.
    why: >-
      A fourth navigation link narrows every link in the row from a third of
      the width to a quarter, and at a 200 percent device text size the
      longest label then broke onto a third line. Measured at 390: three links
      stood 88px tall and four at --text-base stood 127px, which pushed the
      reconciliation verdict from 679px to 718px against the 700px fold
      criterion 7.8 holds it to. After the change the verdict measures 688px.
      The tokens.css note for --text-xs names the nav among the things that
      token is for, and no new token was needed.
  - decision: >-
      The detector's account-shape test runs over the canonical form.
    why: >-
      A Belgian statement prints account numbers in groups of four, and the
      shape test required the compact form, so a column of spaced account
      numbers was not recognised as an account column at all and fell through
      to be read as free text. Canonicalising only ADDS recognitions, because
      canonicalisation is the identity on a compact uppercase value. Criterion
      14.1's reserve-label assertion is written against a fixture whose
      counterparty column is spaced, which is how a statement prints it.
  - decision: >-
      Two account numbers already committed in fixtures were recomputed in
      place, bodies unchanged, and the PDF fixtures regenerated from the
      builder.
    why: >-
      From this phase the household TYPES every account number at setup and a
      number failing the ISO 7064 check is refused, so a fixture whose own
      account fails the check can no longer be registered at all and its spec
      cannot import it. Only the two check digits changed on each; both are
      listed in test/fixtures/allowed-identifiers.txt with that reason.
  - decision: >-
      A household that has registered nothing is redirected from /import to
      /accounts, and the month view's empty state names setup as well as
      import.
    why: >-
      The plan's step 3 asks for it in those words, and it is what keeps the
      simple world simple: accounts used to be discovered one statement at a
      time. The consequence is recorded as a deviation, because it changes an
      assertion M3-P1's criterion 1.1 shipped.

deviations:
  - plan-clause: >-
      files-to-touch, which lists neither the merchants module nor its tests
      nor the import module's profile detector.
    why: >-
      Criterion 14.4's "exactly one definition under src/" could only be made
      true by MOVING the three definitions out of
      src/modules/merchants/domain/counterparty-identity.ts, which the plan
      could not see because it is grounded before M3-P12 merged; the
      coordinator confirmed this as finding PR7-001 and directed the move.
      src/modules/import/domain/detect-profile.ts was needed because criterion
      14.1 requires a fixture whose counterparty column is written spaced, and
      the detector refused to recognise such a column at all. Both are
      recorded here rather than fixed by editing the declaration on this
      branch.
  - plan-clause: >-
      step 5, "refused with one new machine reason on the existing union
      (src/modules/import/application/ports.ts:72 through :81)".
    why: >-
      Two reasons were added, not one, and they went on the CONFIRM REJECTION
      union in confirm-import.ts rather than on ImportFailureReason. Criterion
      14.5 needs two different messages and a payload-free tag carries one
      text each (coordinator finding PR7-002). The union at ports.ts:72-81 is
      ImportFailureReason, which routes through markImportFailed and writes a
      FAILED import row; the path the plan's own pointers name
      (src/modules/import/ui/actions.ts:93 through :102 and
      src/modules/import/ui/status-keys.ts) is the rejection union, which
      writes nothing, and criterion 14.5 requires that no row is ingested and
      no account created.
  - plan-clause: >-
      step 6, "a savings account marked spending at setup has no statement of
      its own".
    why: >-
      That premise does not hold against this phase's own import gate, which
      refuses only an account registered in the savings ring: an account
      registered POT by mistake imports normally, gains rows, and the ring
      change is then refused for good (coordinator finding PR7-004). No new
      machinery was built for it; the refusal copy says plainly what has
      happened and that the ring can no longer be changed, in all three
      languages, and an e2e test reads that copy.
  - plan-clause: >-
      the phase's silence about the empty state's existing import link.
    why: >-
      Step 3 requires a household that has registered nothing to be sent to
      the accounts screen before the import screen will accept a file, and the
      empty state's call to action lands on /import. M3-P1's criterion 1.1
      asserted that click reaches the file input. That assertion is now
      written in two halves: with nothing registered the click lands on the
      accounts screen, and once an account is registered it lands on the
      import screen with the file input visible. The change is marked in place
      in test/e2e/navigation.spec.ts rather than deleted.

