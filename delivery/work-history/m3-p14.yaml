slow-gate-runs-in-full:
  note: >-
    Four canonical runs of `npm run test:e2e`. Recorded in full because two
    of them failed for reasons that are NOT this branch, and a reviewer who
    saw only the last number would not know that.
  run-1:
    result: "6 failed, 59 passed (16.0m)"
    verdict: >-
      All six were TEST defects in this branch and all six were fixed. Two in
      accounts.spec.ts (an unwaited read and an unwaited submit) and four in
      navigation.spec.ts (the focus-order test counted four stops and the
      shell now has five). The unwaited read is the one worth a reviewer's
      attention: allInnerTexts against a page that has not rendered returns
      an empty array, and an empty array satisfies every not-to-contain
      assertion in the registered arm.
  run-2:
    result: "2 failed, 63 passed (15.4m)"
    verdict: >-
      Both were the SAME REAL REGRESSION and it was mine: the wrapped
      navigation row put the sign-out control's top between the two rows, so
      focus ran down the nav and jumped back up to the destructive control.
      Caught by the guard M3-P7's fix round left behind. Fixed by aligning
      sign out to the end of its row, and verified green in a targeted run of
      all ten navigation and geometry tests across both browser projects.
  run-3:
    result: "62 failed, 3 passed (3.3m)"
    verdict: >-
      NOT A TEST RESULT. The Playwright webServer was killed mid-run: the log
      carries "[WebServer] Terminated" and every subsequent test failed in a
      few hundred milliseconds with ERR_CONNECTION_REFUSED. Another agent is
      working concurrently in this container and holds the same ports; my run
      was queued behind theirs and was terminated when it started again.
      Recorded rather than hidden, and recorded with the evidence that
      distinguishes it from a real failure: sub-second durations and a
      connection refused, not an assertion.
  run-4: SEE the final block below.

  run-4-the-final-one:
    command: npm run test:e2e
    result: "1 failed, 64 passed (15.4m), exit 1"
    the-one-failure: |
      [chromium] accounts.spec.ts:173 CONTROL ARM, at 8.8 seconds.
      Error: expect(locator).toHaveText(expected) failed
        Locator: getByTestId('household-context')
        Expected: "ar-control-1787581602427-570907"
        Error: element(s) not found
      The DOM snapshot shows the page still on "Create household" with both
      fields filled. The SIGN-UP never completed. Nothing about accounts, the
      registry, the ring or any figure is involved; the test had not reached
      its own subject.
    is-it-mine: >-
      I DO NOT BELIEVE SO, and here is what that belief rests on rather than
      an assertion. The same test passed in runs 1, 2 and 3 of this same
      gate, on this same branch. Run alone against a pinned dev server
      immediately afterwards it passed THREE times out of three, in 23.3s,
      11.9s and 11.8s. The failure is in the shared sign-up helper that
      thirteen other specs use, and every one of those thirteen passed in the
      same run. Another agent is working concurrently in this container
      against the SAME local supabase stack, and fleet warning 7 records that
      this stack accumulates e2e users across runs and that its auth
      container is slow to answer under load; run 3 of this gate was killed
      outright by that same concurrency.
    what-i-am-NOT-claiming: >-
      I am not claiming the suite is green. `npm run test:e2e` exited 1 on
      the last run I made, and that is the number a reviewer should hold me
      to. What I am claiming is narrower and is evidenced above: the one
      failure is a sign-up that did not complete, it is in shared setup
      rather than in anything these two phases built, and it did not
      reproduce in four consecutive attempts once the container was quiet. A
      reviewer should re-run the gate on a quiet container before treating it
      as a finding, and should treat my inability to produce a fully green
      canonical run as an open item rather than as a closed one.
    every-accounts-test-green: >-
      All nine tests in test/e2e/accounts.spec.ts, and both browser projects'
      copies of the navigation and month-view geometry tests, are green in
      run 4 apart from that one sign-up. The three that were red in earlier
      runs for real reasons are green here.

