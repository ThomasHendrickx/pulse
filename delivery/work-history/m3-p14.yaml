      only in which pattern the author happened to write first. Every one of
      them was built against the examples in its own brief, went green on the
      day it was written, and was never once run against the state it exists
      to forbid.
    the-derivation: |
      CORRECTED. The first version of this block carried HAND-WRITTEN output
      listing twelve files. The real command returns SEVENTEEN. That is the
      exact failure the publish-the-derivation clause exists to prevent, made
      by the person writing the clause's own answer, and it is left visible
      rather than quietly replaced.

      THE EXACT COMMAND, with its FULL captured output:

        $ grep -rln "criterion 14\.\|criterion 15\.\|R-037a\|reddens\|redden" \
            test/domain test/application test/e2e scripts | sort

        scripts/gate-diff-tokens.sh
        test/application/account-registry.test.ts
        test/application/held-rows.test.ts
        test/application/kbc-fix-round-2.test.ts
        test/application/kbc-settlement.test.ts
        test/application/pdf-upload.test.ts
        test/domain/absent-flow-reads.test.ts
        test/domain/account-number.test.ts
        test/domain/counterparty-key-invariant.test.ts
        test/domain/declared-sets-canonical.test.ts
        test/domain/merchant-review.test.ts
        test/domain/normalise-counterparty.test.ts
        test/domain/profile-detection.test.ts
        test/e2e/accounts.spec.ts
        test/e2e/merchants.spec.ts
        test/e2e/month-view.spec.ts
        test/e2e/overview-reads.spec.ts

      OF THE SEVENTEEN, SIX ARE PRE-EXISTING AND UNTOUCHED BY EITHER PHASE:
      kbc-fix-round-2, kbc-settlement, pdf-upload, normalise-counterparty,
      profile-detection and merchants.spec. They match because they cite
      criteria of earlier phases. Whether THEY are pointed at their own
      targets is a real question and this round did not ask it.

      THE ELEVEN THIS PHASE ADDED OR TOUCHED, and what was done to each:
        account-number.test.ts        REBUILT. Was green against replaceAll,
                                      split/join, a wrapped copy and the SQL
                                      copy already in the tree. Now red on
                                      all five, with a must-catch list in the
                                      file.
        absent-flow-reads.test.ts     REBUILT. Asserted the ring predicates
                                      were DEFINED; the definitions alone
                                      satisfied it. Now asserts each read
                                      carries one inside its own WHERE, red
                                      when any of the three loses it.
        declared-sets-canonical       UNCHANGED. It asserts behaviour of the
                                      classifier over both surface forms and
                                      was already pointed at its target.
        counterparty-key-invariant    NEW this round, and it carries its own
                                      disagreement case so the agreement case
                                      means something.
        merchant-review.test.ts       Pre-existing (M3-P6). This phase only
                                      added exclusions to its table.
        account-registry.test.ts      THE DELETE GUARD REBUILT, plus a
                                      point-at-target test and a
