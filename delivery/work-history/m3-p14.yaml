key-decisions:
  - id: the-ring-correction-is-two-steps
    what: >-
      Asking to change an account's ring shows what will move; only then is
      there something to confirm.
    why: >-
      Criterion 15.7 says the control shows the three quantities BEFORE the
      change is applied. A one-step button with the preview rendered beside
      every row satisfies that wording and cost one full interpretation per
      ACCOUNT on every render of the accounts page, because a preview is a
      dry run of the whole interpretation over the whole household. Measured
      in dev while building it: 1.9 seconds with one account and 3.7 with
      five, growing with each registration, against a household that is going
      to register ten. Two steps is the same guarantee at a constant cost and
      is a more literal reading of "before they confirm".
    reversible: yes, it is one component and one query parameter.
  - id: the-navigation-row-wraps
    what: two links per line at phone widths, one row at the desk breakpoint.
    why: >-
      Forced by the measurement recorded under baseline TWO, not chosen. See
      that block and the open question about labels.
  - id: no-committed-fixture-number-was-re-invented
    what: >-
      Criterion 14.11 witness FOUR requires re-inventing each fixture account
      number a criterion requires to be REGISTERED. None needed it.
    why: >-
      Every account any criterion requires to be registered belongs to a
      fixture this phase invents, and all twelve of those numbers were
      generated against src/platform/account-number.ts and are asserted valid
      by a fast-gate test. The re-measurement (7 of 17 committed values pass)
      is what told me to generate rather than borrow. Ten committed values
      still fail the check and are left alone, which is what the criterion
      asks for; none of them is registered through the form by any test.
  - id: the-empty-account-number-is-one-of-the-four-refusals
    what: >-
      An empty submission answers with account-number-empty rather than a
      fifth reason of its own.
    why: >-
      With a separate "required" error the refusal criterion 14.12 names as
      "empty after canonicalisation" was UNREACHABLE through the use case,
      because the trimmed check fired first and answered something else. One
      refusal, one name, and its copy is the one that also says how a card is
      registered, because an empty number is what a household trying to
      register a card would submit.
  - id: the-new-card-is-bounded-separately-rather-than-the-guard-loosened
    what: >-
      The desk document-height guard subtracts the month-accounts card and
      bounds it on its own.
    why: >-
      That guard is M3-P7's protection against the month view getting taller
      through RESTYLING. Raising its factor to absorb a card the criteria
      require would have retired it for everything else it covers, silently.

pipeline-history:
  what-this-project-uses: >-
    delivery/work-history/<phase>.yaml is this project's record of where the
    pipeline stands; there is no separate state file. THIS file is that
    record for both phases, and it is in the same branch as the work, which
    is what the file-first rule asks for.
  the-plan-is-not-edited: >-
    delivery/plan/pulse-v02.yaml is untouched by this branch, per clause
    R-007. Verified: `git diff --name-only origin/main...HEAD -- delivery/plan/`
    is empty.
  two-phases-one-branch: >-
    M3-P14 and M3-P15 were dispatched together and share one branch,
    claude/m3-p14-account-registry, which is what the dispatch instructed.
    The two phases are inseparable in a release for the reason both records
    give: M3-P14 introduces a registration and a ring answer a household
    cannot undo, and every remedy its copy names lives in M3-P15. This
    history therefore covers both, and the acceptance walk is split by phase
    so a reviewer can read either half on its own.

what-was-built-and-why:
  the-owners-question: >-
    "I have 4 bank accounts, 4 saving accounts and 2 credit cards. When I
    upload 1 bank account first, that one contains transfers to other
    accounts. Now Pulse asks me to name them as merchants, but they are not
    merchants. What do I need to do to get to that final state?"
  the-answer-these-two-phases-give: |
    THE HOUSEHOLD REGISTERS ITS OWN ACCOUNTS. There is a route at /accounts,
    reachable from the shell and from the month view's empty state, where an
    account is named with a label, a bank, an account number and a ring,
    WITHOUT importing a statement for it. Registration is a declaration write
    followed by the ledger's recompute, so it also HEALS rows already
    imported: a household that uploaded first and registered afterwards
    reaches the same place with no further upload.

    ITS OWN ACCOUNTS STOP BEING OFFERED AS MERCHANTS. A transfer to a
    registered pot account is INTERNAL and a transfer to a registered reserve
    account is RESERVE, so neither reaches the naming screen. Measured on one
    fixture: the spend total falls from 1.947,75 to 197,75, and the
    difference is exactly the household's savings plus its pot-to-pot
    transfers, which together are every movement between accounts it owns.

    ITS SAVINGS STATEMENTS ARE ADMITTED. A reserve account's own statement
    imports like any other and its rows are HELD: ingested as facts, counted
    in no month, offered for no naming, and NOT an uninterpreted gap. The
    books still close. Every read that can see a row with no flow carries a
    ring predicate, and the month view NAMES each account that put rows in
    the period with whether those rows were counted or held, in words, in
    three languages.

    AND THE FIRST UPLOAD'S RING ANSWER IS SURVIVABLE. That answer decides
    whether a statement's rows are counted or held, in both directions, and
    nothing stands behind it. The import screen now states each answer's
    consequence and names where the answer can be changed; the accounts
    screen has the control; and the control says what will move before the
    owner confirms.
  the-silent-wrong-answer: >-
    A savings account answered as a SPENDING account produces a month that
    reconciles and looks correct: interest becomes income, outgoings become
    spend, both legs of every transfer pair as internal, no cause block
    appears, the reserves card reads zero and the verdict says the books
    close. Nothing on the month view's FIGURES differs from a correct month.
    That is why the counted read exists alongside the held one, why the
    month-accounts element names BOTH states, and why the state is words the
    reader sees rather than a data attribute: the element is the only
    detection either phase has for that answer.

the-navigation-row-in-full:
  why-this-has-its-own-section: >-
    Adding one link to the shell turned into the longest single thread in
    this phase, it changed a screen every route shares, and it was driven
    end to end by measurements and by guards that already existed rather
    than by preference. A reviewer reading only the diff would see a
    stylesheet change with no argument attached.
  the-sequence:
    - >-
      THE FOURTH LINK, ROW UNCHANGED. Measured against the three-link
      baseline: Overview went from one line to two at 390, and from two to
      FOUR at 360 under a 200 percent device text size, with Merchants
      alongside it. Hazard H14.8, live. Caught by the width witness this
      phase adds, which nothing before it could see, because a fourth link
      changes WIDTH and every existing instrument measured height or scanned
      the main element rather than the header.
    - >-
      WRAPPED TWO PER LINE. Every existing target came back at or below its
      baseline at every width and scale.
    - >-
      THAT BROKE THE FOLD. At a 200 percent text size two labels wrapped to
      a second line, each nav row became 88 pixels instead of 44, and the
      reconciliation verdict went below the fold M3-P7's criterion 7.8 pins.
      Caught by that criterion's own sweep.
    - >-
      THE NAV MOVED TO --text-xs at phone widths, an existing token whose
      own documentation in styles/tokens.css names the nav as one of its
      uses. Every label then fits its half of the row on one line at every
      width and scale, so the nav costs two tap-target rows and nothing
      more, and the verdict is back above the fold.
    - >-
      THAT BROKE THE FOCUS ORDER. Caught by the guard M3-P7's fix round left
      behind: with two nav rows, the centred sign-out control's top sat
      BETWEEN them, so focus ran down the nav and then jumped back UP to the
      destructive control. Reading [24, 24, 72, 72, 48].
    - >-
      SIGN OUT NOW ALIGNS TO THE END of its row at phone widths, so it is at
      or below the last row a keyboard user reaches before it. Centring was
      right while the nav was one row, because centred and top-aligned are
      the same thing there.
    - >-
      AND I CHECKED WHETHER THE SMALLER TYPE ALONE REMOVED THE NEED TO WRAP,
      because that would have avoided the last two steps entirely. It does
      not: un-wrapped with --text-xs, Overview and Merchants render on THREE
      lines at 390 at 200 percent against a baseline of two, and Import on
      two at 360 at 150 percent against a baseline of one. The wrap stays
      because the measurement says so, not because it was tried first.
  what-a-reviewer-should-weigh: >-
    The visible cost is that on a phone the navigation is two rows of two and
    the sign-out control sits at the bottom right of the header rather than
    the top right. The owner may prefer shorter navigation labels to a taller
    header. I did not put that to them: both answers produce software that
    meets the criterion, so by the standing rule it is a decision and not a
    question. It is recorded here so it can be reversed cheaply if the owner
    feels it.

the-account-shape-figure-after-this-phase:
  at-the-phase-base: "distinct=17 pass=7 fail=10 (re-measured, agrees with the plan)"
  on-this-branch: "distinct=34 pass=19 fail=15"
  what-changed-and-why: >-
    Seventeen values added, all by this phase, all invented here, all listed
    in test/fixtures/allowed-identifiers.txt with a note on how they were
    constructed. TWELVE are the working account numbers the new fixtures and
    the registration tests use, every one of them generated against
    src/platform/account-number.ts itself and asserted valid by a fast-gate
    test. FIVE are DELIBERATELY BROKEN SHAPES, one per refusal plus the
    transposed pair the browser test types, each derived from a working
    number above it by one visible mutation. So the failing count rising
    from 10 to 15 is entirely those five, and the passing count rising from
    7 to 19 is the twelve.
  the-ten-that-still-fail: >-
    Untouched, which is what criterion 14.11 witness FOUR asks for: only the
    numbers a criterion requires to be REGISTERED are re-invented, and none
    of the committed ten is registered through the form by any test in this
    branch. They go on being valid fixtures for everything that does not
