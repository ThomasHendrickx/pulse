prompt: |
  You are the tiphys IMPLEMENTER for Pulse phase M3-P14, account setup. Work only in the worktree /home/user/wt-m3p14 (branch `claude/m3-p14-account-setup`, branched from main at af3b5cb, with the phase's plan already carried onto it). Never touch /home/user/pulse or any other worktree.

  Read your brief first, in full, and follow it exactly:
  /tmp/claude-0/-home-user-pulse/e8dfc624-eaf2-5480-bcf2-af6a168fb888/scratchpad/briefs/impl-m3p14.md

  Read the phase in delivery/plan/pulse-v02.yaml on your branch. Nine criteria, 14.1 through 14.9. Read the skills the task touches: `.claude/skills/pulse-domain`, `.claude/skills/pulse-frontend`, `.claude/skills/pulse-typescript`. Read CLAUDE.md.

  WHAT THIS IS, IN THE OWNER'S WORDS, so you can tell a good implementation from a compliant one:

    "In the scenario: I have 4 bank accounts, 4 saving accounts and 2 credit cards. When I upload 1 bank account first, that one contains transfers to other accounts. Now Pulse asks me to name them as merchants, but they are not merchants. What do I need to do to get to that final state?"

    "Can't we make it that when you make a new account, we just ask to give all account numbers and say pot or saving? We explicitly say credit card is not needed to give up front."

  So: at setup the household enters every account number once, each with a label and a ring (pot or savings). Cards are explicitly not asked for; a card is declared when its statement arrives. After setup, a transfer to one of the household's own accounts is never offered as a merchant to name.

  CONTEXT YOU NEED, ALREADY ON MAIN. Merchant resolution now keys on a namespaced counterparty IDENTITY: the counterparty account where the row carries a trusted one, the normalised descriptor otherwise (src/modules/merchants/domain/counterparty-identity.ts). The trust gate is mod-97 plus a pinned country-length table. That same validity test is what criterion 14.3 requires for hand-typed numbers, and criterion 14.4 requires ONE canonical form and ONE validity test, not a second copy. Find the existing one and import it.

  A WARNING THAT WILL COST YOU A ROUND IF YOU IGNORE IT. The invented account numbers already committed in test/fixtures/allowed-identifiers.txt were NOT built to satisfy mod-97: I measured 19 account-shaped values, 12 of which fail the check. Any fixture account your tests REGISTER must pass the validity test, so you will need to generate valid invented numbers and add them to test/fixtures/allowed-identifiers.txt with their provenance in the same change. Do not weaken the validity test to accommodate an existing fixture.

  THE JOURNEY THE PHASE SHIPS ON is criterion 14.1, two arms in one spec: a registered arm where setup enters all eight accounts and the imported current-account statement's transfers to the other seven never appear as merchant groups, and a control arm where setup enters only the current account and those seven DO appear. The control is what proves the fixture can fail. Build that first, watch the registered arm go red before you build the feature, and keep the red witness.

  HOUSE RULES, NON-NEGOTIABLE.
  - npm only. Never pnpm, never yarn.
  - English everywhere in code, types, comments, commits, file and folder names, URL paths, DB columns, API routes. Dutch and French exist only as translated user-facing content, and every user-facing string needs all three.
  - Amounts are integer cents. Never a float, never a JS number for a monetary total in the database.
  - No literal colours, font sizes or spacing in components. Design tokens only. A missing token is added to tokens.css first.
  - Facts are immutable. Imported rows are never updated to fix an interpretation. Criterion 14.8 checks this.
  - Every table carries householdId and every query filters on it.
  - No em dashes anywhere.
  - No data in a commit message: no amount, no counterparty, no date from a row, no account or card number, not even an invented one.
  - Scope discipline: no queue, cron, event bus, caching, state management library, component library, per-transaction override, goal or budget feature. If the phase seems to need one, stop and say so.

  GATES, all of which must exit 0 before you report done:
    npm run typecheck && npm run lint && npm test && npm run gate:tokens && npm run gate:privacy
  then npm run test:e2e. Quote the summary line and exit code of each.

  WRITE THE WORK HISTORY the brief specifies, recording what you did, the red witness for the journey, and any criterion you could not meet with the reason. Validate it:
    export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh
    cd /home/user/pulse-fleet && npx tiphys validate --type work-history --context /home/user/wt-m3p14 <your work history file>

  Commit on `claude/m3-p14-account-setup` and push with `git push -u origin claude/m3-p14-account-setup`. Retry a failed push 4 times at 2s, 4s, 8s, 16s.

  A NOTE ON PACE, which is an instruction from the owner and not a nicety. They have been kept waiting by process while nothing they could touch changed. Build the nine criteria properly and stop there. Do not add instrumentation, mutant scoring, measurement harnesses or extra guards beyond what the nine criteria ask for. A tenth good idea is a backlog line in your report, not a commit.

  REPORT BACK: criteria met out of nine, the red witness for 14.1's registered arm before and after, each gate's exit code, anything you could not meet and why, and the pushed sha.

  [MID-TASK COURSE CORRECTION FROM THE COORDINATOR, received while step 2 was being written, quoted in full:]

  Interrupting with one thing that must reach you before you write step 2, plus three cheap ones. The plan review is in and the phase is fit to build: the reviewer traced the owner's scenario through the code and confirmed it works. These are corrections, not a redesign.

  PR7-001, HIGH, AND IT CHANGES WHAT YOU BUILD. The plan's step 2, criterion 14.3 and criterion 14.4 tell you to build a canonical account form, a pinned country-length table and an ISO 7064 mod-97 check in `src/platform`. **All three already exist and are shipped on main.** I verified it myself in `src/modules/merchants/domain/counterparty-identity.ts`: `IBAN_LENGTH_BY_COUNTRY` at :149, `compactAccount` at :174, `mod97` at :179, and `isTrustedCounterpartyAccount` at :262, whose body is exactly the four refusals step 2 describes. The plan cannot see them because it is grounded at 75ec85d, before M3-P12 merged at e87e841.

  So do NOT write a second copy. MOVE the existing definitions into the platform module and re-export or re-import them at every current call site, so criterion 14.4's "exactly one definition under src/" is true by construction rather than vacuous. That criterion is otherwise the one thing in this phase that can be green while two live copies of the money-critical validity test drift apart. The merchants files and their tests that a real dedup must touch are not in the phase's files-to-touch list; treat that as an omission in the plan, touch them, and say so in your work history.

  This also settles the fixture warning I gave you at dispatch. The 12 invented account numbers that fail mod-97 fail against THIS implementation, so any fixture account your tests register must be regenerated valid and added to test/fixtures/allowed-identifiers.txt with provenance.

  PR7-002, medium. Step 5 says one new machine reason, but criterion 14.5 needs two different messages: the account is not registered, and the account is a savings account whose statement is not imported. `ImportFailureReason` at ports.ts:71-81 is a payload-free union and status-keys.ts:6-10 maps one tag to one message key, so one tag cannot carry two texts. Add two reasons, each with copy in English, Dutch and French.

  PR7-003, medium, and it is the one that decides whether this phase's last real guard is a guard at all. Criterion 14.2 says the ring explanation renders BEFORE the ring control. As written that is DOM order, which a collapsed disclosure, a tooltip or visually-hidden text all satisfy while the reader sees nothing. The explanation is the ONLY thing standing between the owner and a savings account silently marked as spending, which produces a month that looks entirely correct and is wrong. Assert it is actually visible, with no interaction, at 390px. If the copy cannot be visible at 390 with eight rows on screen, say so rather than hiding it, and tell me.

  PR7-004, medium. Step 6's premise is wrong. It says a savings account marked as spending at setup has no statement of its own, but the phase's own import gate accepts that statement, because the account is registered POT and D-55 only refuses accounts registered as savings. The account then has rows, and D-51 refuses the ring change permanently. So the trap is reachable by one mistake plus one natural action. Do not build new machinery for it. Make the refusal copy say plainly what has happened and that the ring can no longer be changed, and cover that copy in a test.

  ONE MORE THING THE REVIEWER FOUND, not a finding but it will break your gate: `test/e2e/month-view.spec.ts:1377` declares a fixture as a reserve account through the import path this phase removes. It must be rewritten to register instead. Its reserve assertions stay as they are.

  The pace instruction stands unchanged. Nine criteria, nothing beyond them. These four corrections are inside that scope, not additions to it.

  Address this before completing your current task.

