        held-rows.test.ts             The arms now derive every figure from
                                      the shipped code rather than from a
                                      re-implementation.
        accounts.spec.ts              Gained the four rendered arms and the
                                      three-locale preview comparison.
        month-view.spec.ts            The nav width witness was ALREADY shown
                                      red in round one; the card bound it
                                      added is tightened.
        overview-reads.spec.ts        NEW this round. Executes the SQL.
        gate-diff-tokens.sh           Widened; red on five previously missed
                                      shapes.

      NOT IN THE LIST AND ADDED THIS ROUND: scripts/gate-work-history.sh. It
      matches none of those words. It was shown red on the exact defect the
      reviewer found. Its absence from its own derivation is the second
      demonstration in this block that a search's scope is the thing to
      check first.

    what-the-derivation-did-not-cover: |
      STATED PLAINLY, because a search whose scope is wrong returns an empty
      result indistinguishable from an absence of defects.

      ONE. The grep selects on files that MENTION a criterion or the word
      redden. A guard written in this phase that names neither would not
      appear. I checked the diff by hand for such a file and found none, but
      that is my reading rather than the command's output.

      TWO. It does not reach guards OUTSIDE this phase's diff. The project
      has many; test/schema/tenancy.test.ts and test/property/reconciliation
      are two. Whether they are pointed at their own targets is a question
      this round did not ask, and on the evidence of four out of four inside
      the diff it is worth someone asking.

      THREE. It does not reach the two gates this phase did not write,
      gate:tokens and gate:privacy. gate:tokens is KNOWN not to cover this
      phase's surface, which is why gate:diff-tokens exists beside it;
      gate:privacy had a real defect that the fleet fixed at dc8c505 during
      this round.

      FOUR. Pointing a guard at its target proves it reddens on the shapes I
      thought of. It does not prove there is no fifth shape. The must-catch
      lists are in the files so the next person can add to them.
  findings-addressed:
    - id: CRIT-P14-01
      done: The stray tracked file at the repository root is removed.
    - id: CRIT-P14-02
      done: >-
        The SQL copy is listed as the one permitted exception with its
