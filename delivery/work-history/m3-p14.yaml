  slow-gate:
    - command: npm run test:e2e
      first-run:
        result: "6 failed, 59 passed (16.0m)"
        failures: >-
          Two in accounts.spec.ts and four in navigation.spec.ts, all six
          test defects rather than product defects, all six fixed in the
          commit "e2e: the merchants read waits for the page ...". The
          merchants one is worth a reviewer's attention on its own: an
          unwaited allInnerTexts returns an empty array, and an empty array
