      method the step records: the file set is git ls-files with the privacy
      gate's own skip list, the pattern is that gate's IBAN alternation in
      BOTH arms, each hit is normalised by that gate's own norm(), the
      distinct values are then run through ISO 7064 mod-97.
    command: bash scratch/measure-accounts.sh | node scratch/mod97.mjs -
    output: |
