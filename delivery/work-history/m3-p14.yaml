      whitespace-removals in the tree are the platform form itself and the
      ledger's refund key, which is the one permitted exception with its
      reason recorded.
    settled-by:
      executed-construction:
        command: npx vitest run test/domain/account-number.test.ts
        exit-code: 0
        output: |
          Test Files  1 passed (1)
               Tests  16 passed (16)
  - id: C-14.8-no-fact-writes
    kind: coverage
    statement: >-
      The accounts module writes declaration rows only. Its repository names
      exactly one Prisma model, the account, and completing setup calls the
      ledger's published recompute once, after which running recompute twice
      more leaves every interpretation column identical.
    settled-by:
      executed-construction:
        command: npx vitest run test/application/account-setup.test.ts
        exit-code: 0
        output: |
          Test Files  1 passed (1)
               Tests  14 passed (14)
          including "the accounts module's repository exports no function that
          updates a transaction", "a valid submission of EIGHT accounts
          registers eight and recomputes exactly ONCE" and "running recompute
          twice afterwards leaves every interpretation column identical".

  - id: C-14.9-no-literals
    kind: universal
    statement: >-
      No line this phase adds or changes under src/app/ or src/modules/*/ui
      carries a colour literal in any notation or a px, rem or em length,
      outside a CSS or JSX comment, and no new token was needed.
    settled-by:
      counter-experiment: >-
        The added lines were extracted with `git diff -U0 af3b5cb..HEAD --
        src/app src/modules/accounts/ui src/modules/import/ui
        src/modules/overview/ui src/modules/merchants/ui`, comment lines
        dropped, and the remainder searched for oklch(, rgb(, rgba(, hsl(,
        hsla(, a hex colour of 3 to 8 digits, any number followed by px, rem
        or em, and eleven colour keywords after a colon. 940 added lines were
        searched and grep exited 1, finding none. styles/tokens.css appears in
        no diff on this branch, so nothing needed a token that did not exist.
  - id: C-privacy-human-read
    kind: coverage
    statement: >-
      Every new fixture line and every new line of user-facing copy on this
      branch was read back line by line before commit, because the privacy
      gate cannot see a merchant name, a place name, a date or an amount
      inside a file.
    settled-by:
      executed-construction:
        command: >-
          git diff af3b5cb..HEAD -- test/fixtures/setup-current.csv
          messages/en.json messages/nl.json messages/fr.json | grep -c '^+'
        exit-code: 0
        output: |
          The one new fixture is 12 lines and was written by hand for this
          phase: its account numbers are the invented run 900000000001 to
          900000000008 with computed check digits, its two counterparty
          accounts were already committed with their provenance, its merchant
          names are the invented ones the existing fixtures already use
          (Acme Salaris BV, Supermarkt Noord, Cafe Zomer) and its amounts were
          chosen to make the two arms' arithmetic legible. Every catalogue
          line added is product copy about rings, cards and refusals and
          carries no counterparty, amount or date. No real statement was open
          while any of it was written.
  - id: C-pressed-set-gap
    kind: open-question
    statement: >-
      The accounts screen's own controls are not in the pressed-feedback
      control set that test/e2e/pressed-and-disabled.spec.ts sweeps. That
      spec's journey now walks the accounts screen to register an account, but
      takes no measurement there, so the new screen contributes nothing to
      M3-P9's set. I did not close it in this phase.
    still-open-because: >-
      Closing it means adding measurements to a spec whose control set is
      M3-P9's contract and whose enumeration is asserted in both directions,
      and criterion 14.9 pins this phase to the gates it names. The gap is
      recorded at the enumeration in that file so the next phase to own it
      meets the fact.
  - id: C-fold-margin
    kind: open-question
    statement: >-
      At 390 by 844 under a 200 percent device text size the reconciliation
      verdict now measures 688px against the 700px bound criterion 7.8 sets,
      where three navigation links left it at 679px. The margin is 12px and
      the measurement is deterministic in this container; a different font
      stack could move it.
    still-open-because: >-
      The budget above main is shared between the shell header and the main
      region, and this phase spent part of it on a fourth navigation link. It
      was bought back from the nav's type size and padding and from the main
      region's top gap; buying more would mean changing where the sign-out
      control sits, which is M3-P7's finding HZ-M3P7-05 and not this phase's
      to reopen.

environment-warnings:
  - warning: >-
      The container's ambient DATABASE_URL, DIRECT_URL,
      NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY point at another
      project and override .env for `next dev` as well as for Prisma, and the
      resulting failure is a silent "signup-failed" redirect rather than a
      connection error. The anon key is NOT ambient, so the app used this
      project's key against the other project's host.
    evidence: >-
      `npm run dev` started without pinning produced `POST /sign-up 303` then
      `GET /sign-up?status=signup-failed 200` for every sign-up, while the
      same credentials posted straight to http://127.0.0.1:54321/auth/v1/signup
      returned an access token. Restarting the dev server with all five values
      sourced from .env fixed it. Fleet warnings 1 and 6 say this; what they
      do not say is what the symptom looks like.
  - warning: >-
      Playwright's first navigation against a freshly started `next dev`
      compiles the route on demand, and a sign-up can take over 8 seconds
      before the shell renders, which is longer than the default 5 second
      expect timeout. A spec that fails once on the household-context
      assertion and passes on re-run is measuring compilation, not the
      product.
    evidence: >-
      The dev log recorded `POST /sign-up 303 in 5097ms` and `GET / 200 in
      3427ms` on the first run; warming the six routes with curl and re-running
      the identical test passed in 9.4s.
  - warning: >-
      A Prisma `$queryRaw` tagged template is a JavaScript template literal
      first, so a regular-expression escape written with a backslash is eaten
      before the SQL is built: '\s' inside such a query reaches Postgres as
      's'. Use a POSIX class such as [[:space:]] instead.
    evidence: >-
      The reserves join written with the backslash form stripped the letter s
      from both sides of its comparison and matched nothing; the four savings
      rows rendered under their account numbers, and criterion 14.1's label
      assertion is what said so.
  - warning: >-
      React 19 resets a form after a form action resolves, and the reset
      writes CONTROLLED inputs back to empty without re-rendering them, so the
      component's state and the DOM disagree afterwards. A form that must keep
      what the user typed across a refused submission calls the action from an
      onSubmit handler inside a transition instead.
    evidence: >-
      With `<form action={formAction}>` the setup form's three rows survived a
      refused submission but every field read empty; the Playwright assertion
      reported `Expected: "POT" Received: ""` on a select whose React state
      still held POT.

