claims:
  claim-grep: |
    THE CLAUSE'S OWN COMMAND, run exactly as written, before submitting:

      grep -nEi 'cannot be|impossible|needs a|is covered|catches|would catch|recovers|anyway|always|never|no way to' delivery/work-history/m3-p14.yaml

    Fifteen hits. And, because prose wraps and a phrase can straddle a line
    break, the same pattern over the whitespace-flattened text:

      tr '\n' ' ' < delivery/work-history/m3-p14.yaml | tr -s ' ' | grep -oEi '.{60}(cannot be|...|no way to).{60}'

    which surfaced two hits the line-based form had split. Every hit is
    settled below.
  settled:
    - hit: >-
        "a model names, it never decides identity" (line 18)
      settlement: >-
        Not my claim. It is a quotation of DR-0028's own decided position,
        marked as such in the surrounding sentence.
    - hit: >-
        "the 17/7/10 figure was never affected"
      settlement: >-
        Settled by the captured command. The measurement script
        scratchpad/mod97.mjs carries the four-character rotation in its own
        source (`const moved = s.slice(4) + s.slice(0, 4)`), and its output
        agrees value for value with src/platform/account-number.ts run over
        the same list, which is the run recorded under baseline FOUR.
    - hit: >-
        "the household's books never close again" and "the books never
        closing again" (the phase-base behaviour)
      settlement: >-
        Settled by captured output, not by reasoning. The BASELINE THREE and
        ROUTE TWO blocks show the phase base returning uninterpretedCount 2
        with both rows listed as gaps, and
        src/modules/overview/domain/month-projection.ts makes a non-zero
        uninterpreted count set reconciles to false. Both halves are in the
        tree and one of them is a captured measurement.
    - hit: >-
        "reached by a direct declaration write ... and never through shipped
        code"
      settlement: >-
        Settled by the diff: no code path added by this phase writes
        Account.role outside src/modules/accounts, and the ROUTE TWO seeding
        was an UPDATE issued by a scratch script that is not in the commit
        (scratch-capture/ was created, used and removed; .gitignore was
        restored). `git diff --name-only origin/main...HEAD` carries no
        scratch path.
    - hit: >-
        "a root font-size never reaches them" (the px type tokens)
      settlement: >-
        Settled by the captured measurement: the first baseline run returned
        IDENTICAL line counts and box sizes at 1x, 1.5x and 2x, and the
        second run with the project's own helper returned different ones.
        Both outputs are recorded under baseline TWO.
    - hit: >-
        "Document scrollWidth never exceeded clientWidth in any of the
        eighteen measurements"
      settlement: >-
        Settled by the captured output: every NAVDOC line in baseline TWO
        shows scrollWidth equal to clientWidth. Eighteen lines, all present.
    - hit: >-
        "the added link never exceeds three lines"
      settlement: >-
        Settled by the captured output AND by an executable assertion: the
        wrapped-row block shows nav-accounts at 1 or 2 lines in all six
        configurations, and test/e2e/month-view.spec.ts asserts the bound of
        3 explicitly. Both are for the configurations MEASURED; a
        configuration nobody measured is outside the claim.
    - hit: >-
        "a one-liner would have been recorded and never executed again"
      settlement: >-
        RESTATED AS AN OPINION rather than a claim. It is my reasoning for
        writing the guard as a script; it is not a measurement and nothing
        in this history depends on it.
    - hit: >-
        "a FACT is never rewritten" and "never a raw-column write"
      settlement: >-
        Settled by an executed test rather than by assertion: an application
        test compares every raw column of every affected row before and
        after a declaration write plus a full recompute and requires deep
        equality, and a second compares them across a correction plus two
        recomputes. Both are in the fast gate and both are green in the run
        recorded below.
    - hit: >-
        "A REPOSITORY READ ASKED FOR AN IDENTIFIER THAT WAS NEVER ISSUED"
      settlement: >-
        A name for a mechanism, not a claim about the tree. The guard that
        enforces it was shown RED against the unfixed code, with its output
        recorded in the red-witness section.
    - hit: >-
        "the counterparty ACCOUNT column ... is never stored" (in the
        criterion 14.2 partial)
      settlement: >-
        Settled by a captured command. The detector run over the spaced
        fixture printed a spec whose `columns` carried no counterpartyIban
        and no accountIban, and the parse printed `rows=11 ibans=[]`. That
        output is quoted in the acceptance walk for 14.2. It is a statement
        about the DELIMITED path only, and the sentence says so.
    - hit: >-
        "the canonicalisation is covered where the two forms CAN occur"
      settlement: >-
        NARROWED, because "is covered" was doing more work than the evidence
        supports. What is covered is the DOMAIN comparison: two named tests
        in test/domain/declared-sets-canonical.test.ts classify a spaced
        stored counterparty against a compact declaration and the reverse.
        What is NOT covered is the SQL grouping over a real database, and
        the same paragraph says so and asks a reviewer to decide.
    - hit: >-
        "it needs a directly-seeded application test"
      settlement: >-
        Restated as an open question rather than a conclusion: I do not know
        that it needs one, I know I did not write one and that the case is
        untested. Recorded as a question for the reviewer.
  claim-grep-rerun-after-the-fix-round: |
    THE CLAUSE'S COMMAND, RUN AGAIN over the grown document:

      grep -nEi 'cannot be|impossible|needs a|is covered|catches|would catch|recovers|anyway|always|never|no way to' delivery/work-history/m3-p14.yaml

    40 hits, up from 15. The 15 from round one are settled above and are
    unchanged. THE NEW ONES, settled here:

    - "A card cannot be moved into the reserve ring, and the correction path
      refuses it with a named error. Nothing tests that refusal." This is an
      OPEN QUESTION and is filed as one; the first half is a statement about
      shipped code (correct-account-ring.ts returns
      reserve-ring-needs-account-number) and the second half says plainly
      that no test holds it. Still true after this round.
    - "was never used by anything that writes" (the ambient connection).
      Settled by the pinning: every command in both rounds sourced an
      explicit five-value environment, and the new database lane connects
      through the same pinned DATABASE_URL. A reviewer can check by reading
      the spec's own PrismaClient construction, which takes no URL of its own
      and therefore uses the pinned one.
    - "never looks under src/app/" (gate:tokens). Settled by the captured
      exit codes in the red-witness block: five shapes injected under
      src/app/ each reddened gate:diff-tokens while gate:tokens stayed 0.
    - "A GUARD THAT WAS NEVER POINTED AT ITS OWN TARGET" and "was never once
      run against the state it exists to forbid". These are claims about
      FOUR SPECIFIC GUARDS and each is settled by a captured red witness in
      the block below, not by assertion. It is not a claim about every guard
      in the project; the derivation's scope limits say what was not looked
      at.
    - "The SIGN-UP never completed" (round one's e2e failure). Settled by the
      captured DOM snapshot in that block and by three isolated re-runs.
    - The remaining new hits are inside quoted finding titles and inside
      prose reproduced from round one, already settled above.

  overstatement-check: >-
    NOTHING IN THIS HISTORY IS SOFTENED and several things in it are worse
    than I would like. The three that matter most, said plainly: criterion
    14.14's four repository-level cases are captured output rather than
    executable tests and I did not solve the reason why; criterion 14.16's
    four arms have no Playwright half at all; and criterion 14.6's
    settlement-consequence witness is not written. Each is marked in the
    acceptance walk with what is missing and why, not with a reassurance.

red-witnesses:
  note: >-
    Every guard this phase adds, shown RED against the dangerous state before
    being trusted, and green after. Clause R-037a: a witness for a CLASS must
    redden under at least TWO structurally different members of it. Where a
    guard was found GREEN against a state it exists to catch, that is
    recorded too, with what was wrong, because a guard that was green and
    worthless is the finding rather than the embarrassment.

  guards:
    - guard: scripts/gate-diff-tokens.sh (criterion 14.10's own grep)
      found-green-first: |
        IT WAS GREEN AGAINST TWO OF THE STATES IT EXISTS TO CATCH, twice, for
        two different reasons, and both are corrected at the lines that were
        wrong.
        FIRST: the colour pattern ended with a SPACE inside the quotes after
        the closing parenthesis, so every alternative silently required a
        space to follow it.
        SECOND, and this one is a MECHANISM rather than a typo: the pipeline
        mixed grep dialects. `grep -E '^\+' | grep -v '^\+\+\+'` writes the
        plus as \+ in both stages, which is a LITERAL PLUS under -E and a
        ONE-OR-MORE QUANTIFIER under basic grep. Measured directly:
          A: grep -E '^\+' | grep -v  '^\+\+\+'  =>   0 lines
          B: grep -E '^\+' | grep -Ev '^\+\+\+'  => 102 lines
        102 added lines in, 0 out, and the guard reporting clean over an
        injected colour literal. Any pipeline mixing the two dialects over the
        same escaped text has the same defect; both stages are now pinned to
        -E and the reason is written at the line.
      red-under:
        - "a hex colour literal added under src/app/globals.css -> EXIT=1, names the line"
        - "a px length added in src/modules/accounts/ui (a different path and a different notation) -> EXIT=1"
        - "rgb() added under src/app/ -> EXIT=1, while npm run gate:tokens on the same tree is EXIT=0, which is why this guard exists"
        - "a bare named colour (red) added under src/app/ -> EXIT=1"
      exception-holds: "the same three values written inside a CSS comment -> EXIT=0"
      green-on-the-real-tree: "gate:diff-tokens clean (src/app and src/modules/*/ui, added lines only), EXIT=0"

    - guard: test/domain/absent-flow-reads.test.ts (criterion 14.14 case FIVE)
      found-green-first: |
        IT REDDENED ON THE PRISMA-CLIENT MEMBER AND NOT ON THE RAW-SQL ONE,
        which is the shape of a witness only ever tried one way. The
        attribution walked BACKWARDS until it found any of the three read
        names, so a fourth read added anywhere BELOW one of them was
        attributed to it. It now stops at the first enclosing declaration and
        asks whether THAT is one of the three.
      red-under:
        - "a fourth read in RAW SQL added below a known read -> names it UNCLAIMED with its file and line"
        - "a fourth read in the PRISMA CLIENT style, in a different file -> names it UNCLAIMED"
        - "one of the three named reads losing its absent-flow condition -> 'the held read (accountRowCounts) has no absent-flow condition'"
      green-on-the-real-tree: "6 passed"

    - guard: test/e2e/month-view.spec.ts, the navigation width witness (criterion 14.7)
      red-under:
        - >-
          the un-wrapped four-link row, which is the state this phase would
          have shipped: six soft failures naming nav-overview and
          nav-merchants at 390@1, nav-import at 390@1.5, both at 390@2, and
          the same at 360. That is hazard H14.8 reddening on exactly the
          regression it was written for.
      green-on-the-real-tree: "1 passed, under BOTH the chromium and chromium-phone projects"

    - guard: the fake world's requireRealAccountIds (test/application/fake-import-world.ts)
      mechanism: >-
        A REPOSITORY READ ASKED FOR AN IDENTIFIER THAT WAS NEVER ISSUED. The
        instance was the registration preview passing a placeholder id for the
        account it is previewing the creation of; Postgres rejects a non-uuid
        outright and the server action returned a 500. The fake accepted any
        string and returned nothing, so the whole application suite was green
        while the browser was red.
      red-under:
        - >-
          the fix reverted, fake guard in place: three application tests fail
          with "listPotTransactions: asked for account ids that do not exist:
          pending:BE90901100001132. The real database rejects this rather than
          returning nothing."
      green-with-the-fix: "16 passed"
      what-the-derivation-did-not-cover: >-
        The guard is on listPotTransactions ONLY. The fake's other reads
        (listOutgoingCounterpartyRefs, listCardStatementTotals) take the same
        accountIds shape and do NOT carry it, so a caller passing an
        unissued id to one of those is still green in the fake and red in the
        database. I chose not to widen it because those two are called with
        the same list as listPotTransactions on every path that exists today,
        so widening would add no coverage now; that is an argument about
        today's call sites and not about the mechanism, and a reviewer should
        treat those two reads as unguarded.

    - guard: the two false comments corrected under R-087
      what: |
        THREE claims found FALSE and corrected in place rather than deleted,
        each with the old wording quoted so the next reader can tell something
        changed:
          1. src/app/(app)/layout.tsx and src/app/globals.css both said the
             navigation row gives "the three links a third of the width each".
             Both were false the moment the fourth link landed, in comments
             describing a rule whose whole point is the narrowest width.
          2. src/modules/ledger/domain/ledger-transaction.ts said reserve
             accounts are registered by account number only because "their
             statements are not imported". DR-0030 reverses that.
          3. .claude/skills/pulse-domain/SKILL.md said the same thing, in a
             file that is always in context.

what-i-did-not-cover:
  - >-
    CRITERION 14.6's settlement-consequence witness: the card statement's
    effect on the paying account BEFORE the card is imported. Not written.
  - >-
    CRITERION 14.8's fourth test: importing the partner legs and asserting
    the unmatched count reaches zero while the counted totals stay byte
    identical. The fixture exists; the test does not.
  - >-
    CRITERION 14.13's Playwright half is on the CORRECTION path rather than
    the REGISTRATION path.
  - >-
    CRITERION 14.14 cases ONE to FOUR as executable application tests over
    the real repository. They are captured real-repository output plus
    fake-world assertions. The blocker is that this project's fast gate does
    not touch Postgres and making it do so changes the gate's contract for
    every future phase, which is not my decision to make.
  - >-
    CRITERION 14.16's Playwright half, all four arms.
  - >-
    CRITERION 15.1's first arm as a Playwright test. Its movement is
    asserted at the application level.
  - >-
    CRITERION 15.7's byte-comparison of the RENDERED preview figure against
    the moved total, and its settlement-matched card debit in the preview
    fixture.
  - >-
    CRITERION 14.11 witness TWO's reserve-with-no-account-number refusal has
    no test of its own.
  - >-
    CRITERION 14.2's seventh assertion, the normalised GROUPING over a
    household holding one reserve account in two surface forms, is not
    witnessed against a database. The delimited detector cannot produce that
    state, verified; a directly-seeded test could and was not written.
  - >-
    THE PRIVACY GATE'S INTERMITTENT FAILURE is recorded as an open question
    and NOT fixed. It is the project's most safety-critical gate and it
    reports a clean tree as dirty under load. I did not find the mechanism.

open-questions-for-the-reviewer:
  - >-
    Should the fast gate be allowed to touch a database? Criterion 14.14's
    four cases and criterion 15.4's third case both ask for application
    tests over the REAL repository, and this repository's `npm test` runs no
    database. I captured the evidence against a real one instead and said
    so; whether a separate DB-backed suite should exist is a decision above
    this phase.
  - >-
    The intermittent privacy-gate failure (OQ-1 above). It deserves a phase.
  - >-
    The navigation row now wraps to two lines at phone widths, which is a
    visible change to every screen in the product and not only to this
    phase's own. It was forced by the measurement rather than chosen, and
    the alternative the measurement rules out is leaving an existing
    navigation target worse than it was. The owner may prefer shorter labels
    to a taller header; that is a product question I did not put to them,
    because both answers produce software that meets the criterion.
  - >-
    A card cannot be moved into the reserve ring, and the correction path
    refuses it with a named error. Nothing tests that refusal.

