      done: >-
        The movement is measured after the write and the recompute, the
        outcome carries both figures and says whether they differ, and a test
        proves two dry runs happen rather than one.
  a-review-edit-not-taken-as-offered:
    which: CRIT-P14-11's second half.
    offered: >-
      "Write the Tegenrekening cells of the reserve rows in ar-current.csv in
      the spaced surface form."
    why-not: >-
      MEASURED, NOT ARGUED. The delimited detector assigns the
      counterparty-account column only when EVERY non-empty value in it
      matches its own compact pattern. With the four reserve cells written
      spaced, the detected spec came back with NO counterpartyIban column at
      all and all eleven rows parsed with a null counterparty. That does not
      make the join discriminate, it removes the join's input and breaks
      every other assertion in both phases. Changing the detector is outside
      these phases.
    what-was-done-instead: >-
      The discriminating input is built in the database lane, where the
      stored column can hold what a mixed household really holds. It is a
      STRONGER witness than the one offered: it reddens on a raw join AND on
      a raw GROUPING, and a fixture-level assertion could only ever have
      caught the join.
  a-defect-this-round-introduced-and-caught: >-
    Widening the character class the reserves join strips, I wrote
    '[\s-]' inside a TypeScript template literal. Backslash-s is not a
    recognised escape there and the template collapsed it, so the database
    received a class matching the LETTER S and hyphens and left every space
    in place. It looked correct in the source and was wrong in the query, and
    the fast gate could not see it because nothing in the fast gate executes
    SQL. The new database lane caught it on its first run, which is the
    clearest argument for that lane existing. The fix is a POSIX class, which
    no template literal can eat, and the reason is recorded at the line.

fix-round-red-witnesses:
  note: >-
    THE ROUND'S OWN QUESTION, asked of every guard this round wrote or
    touched: show it failing on the state it forbids, then fix it, then show
    it passing. Each block below is a CAPTURED run at the branch head, tree
    restored between injections and `git status` verified empty after each.
    Clause R-037a: two structurally different members of the class, not one.

  guards:
    - guard: >-
        test/application/account-registry.test.ts, "no interpretation code
        path calls any delete on a MerchantRule" (criteria 14.13 and 15.6)
      was-green-against: >-
        Prisma writes the MODEL first and the pattern looked for the verb
        first, so the ordinary form of the act it forbids sailed through.
      red-under:
        - >-
          MEMBER A, the Prisma client form, injected into
          src/modules/ledger/domain/ledger-transaction.ts. EXIT=1, and the
          failure NAMES the file and the pattern that caught it, "::
          merchantRules?\\s*\\.\\s*delete". 1 failed, 17 skipped.
        - >-
          MEMBER B, the named port method in a different file and a
          different shape, injected into
          src/modules/accounts/application/correct-account-ring.ts. EXIT=1,
          named as ":: \\bdeleteRule\\b". 1 failed, 17 skipped.
      green-on-the-real-tree: "18 passed (18)"
      also-pointed-at-itself-in-the-file: >-
        A second test carries seven must-catch forms and four must-not-catch
        forms, so the guard can never again be green against the act without
        that test reddening too.

    - guard: >-
        test/domain/account-number.test.ts, "no file outside the platform
        module writes its own uppercase-plus-separator-removal" (criterion
        14.4)
      was-green-against: >-
        It matched one idiom. A copy written with replaceAll, with
        split/join, wrapped over lines, or in SQL was invisible, and one SQL
        copy was already in the tree.
      red-under:
        - "MEMBER A, .replaceAll on an account-bearing field. 1 failed, 16 skipped."
        - "MEMBER B, split then join, a different idiom entirely. 1 failed, 16 skipped."
        - >-
          MEMBER C, a SECOND SQL copy in a file that is not the one permitted
          exception. 1 failed, 16 skipped.
      green-on-the-real-tree: "17 passed (17)"
      the-one-permitted-exception: >-
        The reserves join's SQL, listed by file and shape with its reason,
        and held to the SAME character class as the platform form by a test
        beside it.

    - guard: >-
        test/domain/absent-flow-reads.test.ts, "EVERY ONE OF THE THREE READS
        CARRIES A RING PREDICATE IN ITS OWN WHERE CLAUSE" (criterion 14.14)
      was-green-against: >-
        It asserted the two predicates were DEFINED. The definitions at the
        top of the file satisfied it, so every read could lose its ring
        filter and the guard stayed green.
      red-under:
        - >-
          MEMBER A, the counted read monthFigures losing "AND ${POT_ROW}"
          from its own WHERE. EXIT=1, message "monthFigures does not carry
          ${POT_ROW} in its own body". 1 failed, 8 skipped.
        - >-
          MEMBER B, the held read accountRowCounts losing NON_POT_ROW, which
          is the opposite ring and the opposite direction of the same
          mistake. EXIT=1, message "accountRowCounts does not carry
          NON_POT_ROW in its own body". 1 failed, 8 skipped.
      green-on-the-real-tree: "9 passed (9)"

    - guard: scripts/gate-diff-tokens.sh (criterion 14.10's own grep)
      was-green-against: >-
        Round one fixed two mechanisms in it. The clean-room lane then probed
        both patterns in both directions and found them blind to six more
        shapes, because CSS units and colour keywords are case-insensitive
        and the named-colour set has 148 members where the first version
        listed sixteen.
      red-under:
        - "1PX, an upper-case unit. EXIT=1, names the file and the line."
        - "12Px, a mixed-case unit. EXIT=1."
        - "color: RED, an upper-case named colour. EXIT=1."
        - "color: navy, a named colour the short list did not carry. EXIT=1."
        - "color: lightgray, likewise. EXIT=1."
        - "color-mix(), a colour function the pattern did not know. EXIT=1."
      exception-holds: >-
        The same six values written inside a CSS comment. EXIT=0, "clean".
      green-on-the-real-tree: >-
        "gate:diff-tokens clean (src/app and src/modules/*/ui, added lines
        only)", EXIT=0.

    - guard: scripts/gate-work-history.sh
      why-it-exists: >-
        The reviewer found this file was not valid YAML. Fixing their one
        line exposed a second error and then a third, because a parser stops
        at the first. A gate rather than a promise.
      red-under:
        - "a tab character where YAML forbids one. EXIT=1, ScannerError with the line and column."
        - >-
          an unquoted colon inside a scalar, which is the EXACT shape the
          reviewer found. EXIT=1, "mapping values are not allowed here" with
          the line and column.
      green-on-the-real-tree: >-
        "gate:work-history clean (every delivery yaml parses)", EXIT=0.

  criterion-14-16-what-the-arms-ASSERT-AGAINST:
    the-defect: >-
      The four arms compared a re-implementation of the month derivation
      against itself. Two consequences, both measured rather than argued: the
      overview aggregate could lose its POT_ROW and every arm stayed green,
