  toolchain: >-
    node v26.7.0, npm 11.19.0, in the SAME shell that ran the commands
    (checked with `node --version` in that shell, not assumed). package.json
    declares engines.node 22.x and npm warns EBADENGINE on install.
    THE ENGINE GAP IS CLOSED AND THE CAVEAT IS STRUCK: a clean-room review
    ran every fast gate under the pinned engine, node v22.12.0 from /opt/nvm,
    and reported typecheck 0, lint 0, npm test 0 (37 files, 479 tests),
    gate:privacy 0 over six runs and gate:tokens 0. Nothing depends on the
    engine.
  build-state: >-
    node_modules installed with `npm ci` (exit 0, 472 packages). Prisma
    client generated (node_modules/.prisma/client present). vitest requires
    no build artifact; the e2e gate builds a production bundle in its own
    webServer, which succeeded.
  database: >-
    The LOCAL supabase stack in this container, with all five values pinned
    explicitly in the invoking shell per fleet warnings 1, 6 and 16. The
    ambient DATABASE_URL, which resolves to a different project with a
    working password, was never used by anything that writes.
  fast-gates:
    - command: npm run typecheck
      exit: 0
      output: "> tsc --noEmit   (no diagnostics)"
    - command: npm run lint
      exit: 0
      output: "> eslint .   (no findings)"
    - command: npm test
      exit: 0
      output: |
        Test Files  37 passed (37)
             Tests  479 passed (479)
          Duration  16.51s
      skipped: >-
        ZERO. The reporter prints no skipped line and a grep for "skipped"
        over the captured output returns 0, which is the third axis the
        environment warning asks for stated rather than implied.
      invocation: "npm test -> vitest run, over the whole testDir with no filter"
    - command: npm run gate:tokens
      exit: 0
      output: "(the negated grep matched nothing under src/modules/*/ui)"
      caveat: >-
        THIS GATE IS NOT THE GUARD ON THIS PHASE'S NEW SURFACE and reporting
        it green would be misleading on its own. It greps src/modules/*/ui
        only, never looks under src/app/ where the accounts route lives, and
        matches neither a spacing literal nor a colour written as rgb(),
        hsl() or a name. The next line is the guard that does.
    - command: bash scripts/gate-diff-tokens.sh
      exit: 0
      output: "gate:diff-tokens clean (src/app and src/modules/*/ui, added lines only)"
      note: >-
        Criterion 14.10's own diff-scoped grep. Shown RED against four
        structurally different offenders, including two notations
        gate:tokens matches in no path at all; see the red-witness section.
      tokens-added: >-
        NONE. Every value the new screen and the new element needed already
