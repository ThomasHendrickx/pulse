    statement: >-
      Criterion 3.1: test/domain/normalise-counterparty.test.ts covers
      uppercase, payment terminal noise, city and date fragments and
      whitespace collapse (18 tests, plus non-destructive degenerate-input
      behaviour and idempotence), written red-first against the absent
