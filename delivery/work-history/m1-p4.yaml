kind: work-history
phase: M1-P4
prompt: |
  You are the implementer for phase M1-P4 (merchants and sources) of the Pulse delivery. Your brief is /home/user/pulse-fleet/implementer-brief-m1-p4.md: read it fully first, including the appended fleet warnings; it is your contract. Your working tree is the fresh clone /home/user/pulse-fleet/worktrees/m1-p4-merchants on branch claude/m1-p4-merchants (based on main 491d3c8, which contains the merged M1-P3). Do all work there, never in /home/user/pulse.

  Read the three repo skills before writing code: .claude/skills/pulse-domain/SKILL.md (merchant resolution, facts vs interpretation vs declarations, module boundaries), pulse-typescript (branded types, results, test structure), pulse-frontend (server components, tokens, i18n en/nl/fr, money rendering) for the manual-assignment UI.

  The phase spec is exact on: normalisation before any matching (uppercase, terminal noise, city and date fragments, whitespace collapse); RuleResolver behind the MerchantResolver port, exact match then prefix and pattern, rules only, no LLM; manual assignment writes a MerchantRule DECLARATION and never a row edit, recompute applies rules retroactively to all past matching transactions, and the interpret use case must have NO rule repository dependency (asserted by construction in the tests, criterion 3.2); income sources resolve through the same resolver; freeform tags on merchants, many-to-many with one isPrimary, nothing seeded. One migration adds Merchant, MerchantRule, Tag and MerchantTag, all with non-null householdId AND ENABLE ROW LEVEL SECURITY (test/schema/rls.test.ts derives the table list from the Prisma schema and will redden otherwise). Hazard classes to design against: H3.1 (a correction stored as a row edit, silently undone by recompute) and H3.2 (merchant regrouping changing totals: resolution renames and regroups, never reclassifies flow; the e2e asserts totals unchanged).

  One backlog carry-in, declared in the plan extras: CR-308, stripCurrencyNoise in src/modules/import/domain/parse-amount.ts is a single regex pass, not a fixpoint, so an adversarial interleaved cell (EEURUR-742,10) reconstructs a signed value after one strip and slips parseUnsignedAmountToCents. Fix: reject a negative parsed magnitude in the unsigned entry (or strip to fixpoint), red witness first in test/domain/profile-detection.test.ts, and correct the fix commentary's falsified absolute claim ("can never diverge again") while you are there (R-087).

  Environment facts (also in the brief's warnings): never use ambient DATABASE_URL/DIRECT_URL/SUPABASE_* (foreign project; they override .env for Prisma AND the Playwright webServer, so pin ALL FIVE values to the local stack in the invoking shell for db and e2e work); docker daemon may be dead, restart with sudo dockerd; Node 26 for tiphys commands via export NVM_DIR=/opt/nvm && . /opt/nvm/nvm.sh; npm only; integer cents; imported facts immutable; no em dashes anywhere; English everywhere; no literal colours or spacing, tokens only.

  Work in small commits pushed incrementally (git push -u origin claude/m1-p4-merchants on first push); if killed and resumed, reread your last commits and continue. Red witness before green for every behavior. Before reporting done: npm run typecheck, npm run lint, npm test, npm run test:e2e all exit 0 in your clone; delivery/work-history/m1-p4.yaml written and schema-valid (npx --prefix /home/user/pulse-fleet tiphys validate --type work-history with a context containing the plan), notes in m1-p4-notes.md. Confirm your final push with git ls-remote origin claude/m1-p4-merchants and include the output in your report; never claim pushed without it. Your final report: per-criterion status with executed evidence, deviations declared, open questions, head sha.
