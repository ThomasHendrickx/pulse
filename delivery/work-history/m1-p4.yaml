fix-round:
  - mechanism: >-
      CR-403: a normalisation that DELETES tokens from arbitrary positions
      inside a value it is about to parse, concatenating whatever
      surrounded the deleted token. CR-308 was the signed instance
      (reconstructed sign); the class member here is the unsigned one: a
      currency token spliced into a digit run ("7EUR42,10", "1EUR2")
      fabricated a plausible amount at both entry points. The fix is
      positional, closing the family: currency tokens strip only at the
      trimmed cell's boundaries, iterated to a fixpoint at those ends, so
      a removed token can have digits on at most one side and no strip
      joins two digit runs, by construction. The CR-308 round's control
      test asserting that interleaved unsigned noise parsed was itself
      part of the defect and was REVERSED loudly at the test.
    derivation:
      command: grep -rn "stripCurrencyNoise" src test --include=*.ts
      output: |
        src/modules/import/domain/parse-amount.ts:39:const stripCurrencyNoise = (rawText: string): string => {
        src/modules/import/domain/parse-amount.ts:60:  let text = stripCurrencyNoise(rawText);
        src/modules/import/domain/parse-amount.ts:117:  const text = stripCurrencyNoise(rawText);
        [reading of every site, post-fix, at commit 566aa3d: line 39 is
        the one definition (boundary-anchored fixpoint); lines 60 and 117
        are the two entry points, parseAmountToCents and
        parseUnsignedAmountToCents, both consuming the same shared
        normalisation; no other file names the function, so no third
        parse path bypasses the positional rule]
    not-covered: >-
      Non-currency noise this normalisation does not know (a stray
      letter, a thousands separator in the wrong style) still fails
      through the format regexes rather than through the boundary rule;
      that is the pre-existing loud path, not this class. Detection's
      isAmountLike consumes the signed parser and therefore inherits the
      boundary rule; a cell like "7EUR42,10" now scores as
      not-amount-like during detection, which can only make detection
      more conservative. Widening the currency vocabulary (new tokens)
      inherits the positional constraint by construction, but a NEW
      normalisation added elsewhere in the parse path would need the
      same one-string, boundary-only discipline, stated at the
      definition.
  - mechanism: >-
      CR-402: a stored declaration whose subject is the OUTPUT of a code
      recipe, with nothing binding the recipe to the stored values: any
      recipe change silently detaches every already-stored subject. The
      dedup key documented this class one module over; the merchants
      normaliser shipped without the guard while inviting extension.
      Fixed as declaration discipline: a stability contract at the
      recipe's definition naming the re-normalisation obligation, plus a
      pinned-output regression table so an accidental change reddens the
      fast gate.
    derivation:
      command: >-
        python3 mutation: add "OXFORD" to CITY_TOKENS in
        normalise-counterparty.ts, npx vitest run
        test/domain/normalise-counterparty.test.ts, restore
      output: |
        Mutated: exit 1, Tests 2 failed | 35 passed (37), failing row
        '"STARBUCKS OXFORD" stays pinned to "STARBUCKS OXFORD"' (the
        reviewer's construction P-I reproduced in the committed suite).
        Restored: exit 0, 37 passed (37).
    not-covered: >-
      The pin table cannot make a deliberate recipe change carry its
      re-normalisation migration; it can only force the author to touch
      the pins and read the contract stating the obligation. Nothing
      mechanical yet re-normalises stored patterns (no recipe change has
      shipped and the table is empty in every environment); the
      obligation lives in the contract comment, the amended open
      question M1P4-C8, and the pin test's failure message pathway.
  - mechanism: >-
      CR-401: an invariant enforced by read-modify-write under read
      committed, stated as absolute ("one primary, always") while two
      concurrent writers can each act on a snapshot missing the other's
      uncommitted write; plus writes keyed by a unique selector that
      cannot carry householdId, with ownership of the referenced rows
      never verified. Fixed at both layers: ownership of the merchant
      AND the tag is verified under the household inside the same
      transaction before any write, every write clause carries
      householdId (updateMany-then-create replaces the upsert whose
      unique selector could not), and the invariant is held structurally
      by a partial unique index on merchant_tags(merchantId) where
      isPrimary, which no interleaving defeats.
    derivation:
      command: >-
        probe-cr401-race.ts (real adapter, real local Postgres, tsx over
        the repo tsconfig, env pinned): 20 rounds of two concurrent
        promotes of different tags on one merchant, before and after the
        fix; probe-cr401-tenancy.ts: foreign-household setMerchantTag
        and upsertRule against the real adapter
      output: |
        BEFORE (committed adapter at 2a57a64): roundsWithTwoPrimaries=19
        rejectedPromotes=0, probe exit 2 (the reviewer's static race is
        real and near-deterministic on the local stack).
        AFTER (ownership checks plus index at aff8c92):
        roundsWithTwoPrimaries=0 rejectedPromotes=20 (exactly one loser
        per round, surfacing as a loud unique violation), probe exit 0.
        Tenancy probe: both foreign calls refused
        ("merchant does not belong to the household"), links=0 rules=0,
        probe exit 0. Fast-gate reds before the fix: 4 failed | 14
        passed (three cross-household witnesses against the fake's
        mirrored contract, one migration-SQL index assertion). Live
        index: pg_indexes shows merchant_tags_one_primary_per_merchant
        ON public.merchant_tags ("merchantId") WHERE "isPrimary".
    not-covered: >-
      The losing concurrent promote now surfaces as a thrown unique
      violation with no retry wrapper; on a one-household UI with no tag
      surface wired this phase, a retry belongs to the caller that slice
      5 or later adds, stated at the adapter. The other repository
      functions take householdId in their own where clauses and create
      rows under the context household directly; the two probed
      functions were the only ones referencing rows by foreign-suppliable
      id (derivation: the adapter's function list read in full at
      aff8c92). The fake cannot interleave transactions, so the
      concurrency half lives in the migration SQL assertion plus the
      executed database probe, not in the fast gate.
