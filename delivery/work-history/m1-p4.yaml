key-decisions:
  - decision: >-
      Merchant resolution runs inside ledger interpretation through a
      MerchantResolverPort with EXACTLY ONE member
      (resolveCounterparties), bound in the ledger composition root to the
      merchants module's published rules-only resolver. Criterion 3.2's
      by-construction half is therefore double-guarded: expectTypeOf pins
      the port's key set in the typecheck gate, and the fake world counts
      declaration writes (zero across upload, interpret, recompute).
    why: >-
      pulse-domain names MerchantResolver among the ports that exist, the
      architecture puts Transaction.merchantId in interpretation, and a
      one-member read-only port is the smallest surface that lets the
      interpret use case ask a question without being able to write a
      rule.
  - decision: >-
      Manual assignment (assignMerchant) normalises the counterparty text,
      finds-or-creates the Merchant by name, upserts one EXACT MerchantRule
      on (householdId, kind, pattern), then runs recompute through an
      injected RecomputeInterpretation dependency. The dependency is bound
      to the ledger's published recomputeInterpretation AT THE UI ACTION,
      not in the merchants composition root.
    why: >-
      The ledger's composition root imports the merchants module for the
      resolver binding; binding recompute inside the merchants root would
      import the ledger back and create a module-level cycle. Composition
      at the caller keeps both roots acyclic, and the fast-gate test binds
      the same shape over fakes, so retroactivity is tested through the
      exact wiring production uses.
  - decision: >-
      Re-assigning an already-named counterparty UPDATES the one rule
      (upsert on the unique (householdId, kind, pattern)) instead of
      inserting a second rule for the same subject.
    why: >-
      Two contradictory exact rules for one normalised string would force
      the resolver to tie-break a user decision by accident of id order; a
      naming mistake must be correctable, and one subject one decision is
      the declaration semantics the unique index states.
  - decision: >-
      Merchant rows are created on the declaration path only (manual
      assignment; slice 5's accepted answers later) and recompute NEVER
      deletes or rewrites them; what recompute rebuilds wholesale is the
      transactions.merchantId assignment column, written set-based beside
      flow in replaceInterpretation, with null clearing stale assignments.
      The architecture's layer map lists Merchant under interpretation;
      the migration's schema header records why deleting Merchant rows is
      still forbidden: MerchantRule and MerchantTag declarations point at
      them, and a recompute must not destroy what a user decision
      references.
    why: >-
      Rebuildability's test (delete every interpretation VALUE and rebuild
      from facts plus declarations) holds for the assignment column; the
      merchant NAME row is the referent of declarations, so its lifecycle
      follows theirs.
  - decision: >-
      Only counted rows (flow INCOME or SPEND) get merchant assignments;
      INTERNAL, RESERVE and UNRESOLVED rows are written null even when a
      rule matches their counterparty text, asserted by a test.
    why: >-
      An internal transfer's counterparty is the household itself and a
      RESERVE leg's is its own reserve account; naming those would
      populate groups the overview must not show. UNRESOLVED stays a
      visible gap, not a named group.
  - decision: >-
      The cash-withdrawal marker is NOT consumed by resolution in this
      phase: a cash row resolves like any counted row. The stale
      prediction in ledger/domain/corrections.ts ("the marker is what the
      M1-P4 resolver groups by") was corrected in place, loudly, with the
      precedence requirement (destination cash beats merchant assignment
      in the month view's grouping) written at the marker's definition and
      carried as open question M1P4-C7.
    why: >-
      Destination grouping is projection work and no projection exists
      until the month view; special-casing cash inside resolution would
      have required either a module cycle (merchants reading the ledger's
      cash patterns) or duplicating the pattern list, both worse than a
      recorded precedence rule one slice later.
  - decision: >-
      The refund correction's counterpartyKey in the ledger deliberately
      does NOT switch to the new normaliseCounterparty; the normaliser's
      header says so and names the hazard.
    why: >-
      Changing the refund key changes flow classifications, and this
      phase's contract is that resolution renames and regroups without a
      cent moving between totals (hazard H3.2); M1-P3's open question C9
      hands that key upgrade to an explicit decision, not a side effect.
  - decision: >-
      Normalisation strips city fragments two ways: a postal-code-plus-city
      pattern anywhere, and bare city tokens from the END of the string
      only, against a named data list (Belgian cities plus the foreign
      ones the committed card fixture carries). A string that is ALL noise
      falls back to its collapsed uppercase form rather than the empty
      string.
    why: >-
      Trailing-only stripping keeps a city inside a merchant's own name
      ("BRUSSEL BROODJES BV") intact; a missed city only means the rule
      pattern includes it, so grouping stays deterministic; and an empty
      key would silently group unrelated rows together.
  - decision: >-
      CR-308 was fixed by rejecting a negative parsed result at the
      unsigned entry point's OUTPUT, not by making stripCurrencyNoise a
      fixpoint, and the falsified "can never diverge again" sentence was
      corrected in place per R-087, stating what refuted it.
    why: >-
      The brief offered either fix; the output rejection is the one that
      adds no newly-accepted inputs (a fixpoint strip would have turned
      "EEURUR-742,10" in a SIGNED column from a loud row error into a
      parsed -742,10), and it holds under any future normalisation change
      because the guarantee sits on what leaves the function.
  - decision: >-
      At most one primary tag per merchant is enforced by the application
      layer (setMerchantTag demotes existing primaries and promotes the
      new link in one transaction), stated at the MerchantTag model; the
      fake mirrors the same semantics and a mutation removing the demotion
      reddened the suite.
    why: >-
      Prisma cannot model a partial unique index, and hand-adding one to
      the migration would make the next prisma migrate dev see drift; an
      enforced-and-tested invariant beats an unmodellable constraint.
  - decision: >-
      The review screen groups counted rows per direction under merchant
      name or normalised text, renders both direction totals beside the
      groups, and offers the naming form only on unresolved groups; flag
      treatment for unresolved (not alarm), no income or spend colour,
      amounts through the shared Amount component; copy comes entirely
      from the existing message catalogs (en, nl, fr all carry the
      merchants keys from the design prototype seed; parity 88/88/88
      checked).
    why: >-
      pulse-frontend sections 3 to 5: unresolved is normal, totals must be
      visibly unmoved by naming (the e2e reads them before and after), and
      no new user-facing strings means no new translation surface this
      phase.
  - decision: >-
      Mechanism lookup (mechanism-lookup clause): the project's
      delivery/tuition/ holds only .gitkeep and no mechanism-index.yaml
      exists in the fleet root; the kernel's copy at
      /home/user/pulse-fleet/node_modules/@tiphys/kernel/tuition/mechanism-index.yaml
      was read (fifteen entries, all kernel-process mechanisms: claim
      files, leases, append-only logs, worktree removal, reporter parsing,
      generated-artifact drift). It has NO entry for merchant resolution,
      string normalisation, resolver chains, Prisma migrations or
      recompute: a recorded answer, not a skipped lookup. Two general
      rules were applied: assert-by-name over append-only registries (the
      RLS and tenancy suites derive tables from the DMMF and reddened on
      the four new tables), and a class witness reddens under two
      structurally different members (CR-308's debitCredit and indicator
      members; the five mutations of the 3.2 suite). gates.manifest.json
      exists only inside the kernel package; this phase adds no
      destructive command, so destructiveCommands is untouched. One new
      mechanism rule was established and recorded at its definition with
      its sibling derivation (mechanism-sibling clause): an existence
      check over a paginated admin list must walk all pages
      (prisma/seed.ts); grep -rn "listUsers" src prisma --include=*.ts
      returns the seed as the only call site.
    why: >-
      The clause requires stating which rules were found and how each was
      satisfied, including the honest none-found case and the sibling
      enumeration for any rule this phase establishes.
verification-first:
  - finding: >-
      Base check before building: the worktree sat clean at main 491d3c8
      whose tree carries the merged M1-P3 (git log names 343dbfc "M1-P3:
      one pot, dual-reviewed and merged" as its parent; creditValue,
      transfer_links migration and the M1-P3 suites all present). The full
      fast gate was not run pristine at the base before the first edit;
      the first full run (159 passed, exit 0) happened after the CR-308
      fix, when only parse-amount.ts and its test file had changed.
    contradicts-plan: false
  - finding: >-
      prisma/seed.ts checked for the seeded dev login with a single
      listUsers() call, which returns only the first page (50 rows);
      after prior phases' e2e runs the local auth stack held 52 users, so
      dev@pulse.local existed (psql: count 1) but sat beyond page one and
      every db:reset failed at createUser with "already been registered".
      Found by the first db:reset of this phase, fixed in scope (prisma/
      is on files-to-touch) by paginating the whole list.
    contradicts-plan: false
  - finding: >-
      messages/en.json "merchantsBody" and its nl sibling contain an em
      dash, which CLAUDE.md non-negotiable 7 forbids in user-facing copy.
      Pre-existing on main from the design-prototype copy deck; messages
      files are outside this phase's declaration, so recorded for the
      orchestrator rather than edited.
    contradicts-plan: false
  - finding: >-
      ledger/domain/corrections.ts predicted "the marker is what the
      merchant resolver (M1-P4) groups by"; this phase's resolver
      deliberately does not consume the cash marker (destination grouping
      is projection work). The stale sentence was corrected in place per
      R-087 with the precedence requirement recorded at the definition.
    contradicts-plan: false
