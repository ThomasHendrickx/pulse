  - id: R4-003
    severity: high
    evidence:
      - >-
        The correction is three writes. Step 6: the ring can be changed, and
        "the correction CLEARS the interpretation columns of that account's own
        rows, flow and merchant, in the same use case and BEFORE THE RECOMPUTE".
        So: write the declaration, clear, recompute. Nothing makes them one
        transaction and no criterion mentions the partial states.
      - >-
        The two partial states are asymmetric and both are silently wrong. If
        the declaration and the clear land and the recompute does not, the
        account is savings and its own rows are held correctly, while the
        CURRENT account's transfers into it still carry INTERNAL from the last
        stamping, so they go on pairing as internal movement, contribute nothing
        to the reserves block, and the household is told it saved nothing. If
        the declaration lands and the clear does not, that is hazard H14.15 in
        full, which is the hazard criterion 14.12 exists to address.
      - >-
        Neither state heals. Recompute is unbounded over pot accounts
        (src/modules/ledger/application/interpret-window.ts:192 calls
        interpretWindow with an empty window), so a later recompute WOULD repair
        the first state, but the household can cause no later recompute: the
        only published triggers are a merchant naming
        (src/modules/merchants/application/assign-merchant.ts:69) and a further
        import, and the dev action throws outright in production
        (src/modules/ledger/ui/actions.ts:15 through :21, "Recompute is a
        dev-only action"). The second state never heals at all, because after
        the ring change that account is never loaded by any recompute again,
        which is the whole premise of step 6.
      - >-
        The asymmetry that matters: recompute is idempotent and self-healing,
        and the clear is a ONE-SHOT keyed on a TRANSITION rather than on a
        STATE. A transition-keyed write that misses has no second chance, while
        the same write keyed on the account's CURRENT ring would be re-runnable
        and would converge.
      - >-
        The ordering the plan does state cannot fail. Criterion 14.8 says the
        change "CLEARS the interpretation columns of that account's own rows
        BEFORE RECOMPUTING, asserted at the application level", and criterion
        14.12 repeats it. The end state is identical under either order, because
        the recompute provably cannot touch those rows: the window is built from
        pot account ids alone (interpret-window.ts:35 through :39) and the
        repository writes only the ids handed to it (ledger-repository.ts:171,
        :194, :213). So an application test asserting the end state passes
        whichever order the code used, and the criterion names a property no
        observation of the system can falsify.
    concrete-edit: >-
      Replace the ordering sentence in step 6 with: "The correction is ONE unit
      of work: the ring declaration, the clear of that account's own
      interpretation, and the recompute either all land or none do, and the use
      case returns a named error rather than a partial state. The clear is keyed
      on the account's CURRENT ring rather than on the transition, so it is
      re-runnable and converges: clearing the interpretation of every row on an
      account that is not in the pot is a no-op whenever it has already been
      done. This is not the general clearing machinery earlier drafts carried,
      which cleared everything on every path; it is the same one function with a
      selector that cannot miss." Replace criterion 14.8's "before recomputing,
      asserted at the application level" with "in the same unit of work as the
      ring declaration and the recompute, asserted at the application level by a
      test in which the recompute dependency THROWS: the test asserts the
      account's ring is unchanged afterwards, that its rows still carry the flow
      they carried before, and that the household is shown a named error in all
      three catalogues, so the criterion can fail." Add to criterion 14.12,
      after the clearing assertion: "and a second application test runs the same
      use case TWICE over the same account and asserts the second run changes
      nothing and errors on nothing, which is what makes the correction
      recoverable in a product whose only recompute action throws in production
      (src/modules/ledger/ui/actions.ts:15 through :21)."
    analysis: >-
      The plan asserts an ordering that cannot be observed and leaves unasserted
      the property the ordering was standing in for. What matters about
      clear-then-recompute is not the sequence, since the recompute demonstrably
      cannot touch the cleared rows in either order, but that neither half can
      land without the other. This is the one place in the phase where a failure
      is permanent rather than repairable by re-running something, because the
      account has left the window forever and the product ships no recompute
      button. The fix is mostly a change of key: a clear that asks "is this
      account outside the pot" rather than "did this account just leave the pot"
      is idempotent, survives a crash, and can be asserted by a test that runs it
      twice.
