    concrete-edit: >-
      Add to criterion 14.6, after the sentence on the accounts list: "AND THE
      CARD IS A ROW WITH NO NUMBER, WHICH THE SCREEN MUST ADMIT. A card account
      is exactly an account whose number is absent
      (prisma/schema/accounts.prisma:16 through :20), and that absence is what
