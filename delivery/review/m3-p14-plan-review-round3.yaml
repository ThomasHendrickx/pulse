  - id: R4-006
    severity: medium
    evidence:
      - >-
        Step 6 names two columns and only two: "the correction CLEARS the
        interpretation columns of that account's own rows, FLOW AND MERCHANT".
        Criteria 14.8 and 14.12 both repeat the pair.
      - >-
        The interpretation layer is three stores, not two columns. The
        pulse-domain layer table names the merchant column, the flow column AND
        the paired-transaction relation as interpretation
        (.claude/skills/pulse-domain/SKILL.md section 2), and the schema is
        emphatic: prisma/schema/ledger.prisma:1 through :5 says of TransferLink
        "PURE INTERPRETATION: every row here is derived by the engine and fully
        rebuildable from facts plus declarations".
      - >-
        A link CAN survive the correction. replaceInterpretation deletes links
        by `outgoingTransactionId in ids OR incomingTransactionId in ids`
        (src/modules/ledger/adapters/ledger-repository.ts:173 through :182)
        where ids are the loaded pot rows, so a link BOTH of whose ends sit
        outside that set is untouched. Such a link exists: a settlement link
        carries a null incoming end whenever no mirror row was found
        (src/modules/ledger/domain/interpret.ts:200 selects the mirror from a
        candidate list that can be empty, and prisma/schema/ledger.prisma:17
        makes the field optional), so a settlement debit paid out of an account
        that then leaves the pot keeps a link nothing will ever delete.
      - >-
        That link is then unreachable by any future recompute, which is the same
        property the clear exists to remove one column over: after the ring
        change the row is never loaded again, so nothing can rebuild or delete
        it. It falsifies the schema's own stated invariant while criterion
        14.8's rebuildability test cannot see it, because that test is worded
        over "every interpretation COLUMN" and TransferLink is a table.
      - >-
        The second stale store is the Import row. replaceInterpretation moves
        imports INGESTED to INTERPRETED for `interpretedImportIds`
        (ledger-repository.ts:231 through :238), derived at
        src/modules/ledger/application/interpret-window.ts:145 through :147 from
        the loaded transactions alone. So an accepted savings statement stays at
        INGESTED forever, and after a ring change out of the pot its import
        silently reverts to meaning "not interpreted". Criterion 14.10's fifth
        assertion enumerates seven figures and none of them is a status.
      - >-
        I could not demonstrate present harm from either and I looked: the only
        delete in the entire src tree is the one at ledger-repository.ts:173, so
        no re-parse path trips the foreign key, and no read under src/ tests
        Import.status for INGESTED alone. The harm is a broken stated invariant
        and a landmine for the next read.
    concrete-edit: >-
      Replace the clearing sentence in step 6 with: "the correction CLEARS THAT
      ACCOUNT'S INTERPRETATION ENTIRELY: the flow and merchant columns of its
      own rows, and every TransferLink row naming one of those rows on either
      side, because prisma/schema/ledger.prisma:1 through :5 declares that table
      pure interpretation and fully rebuildable, and a link whose only end sits
      outside the pot is reachable by no future recompute
      (src/modules/ledger/adapters/ledger-repository.ts:173 deletes links only
      by the ids the window loaded, and a settlement link can carry a null
      incoming end)." Extend criterion 14.8's rebuildability sentence to "a test
      asserts running recompute twice afterwards leaves every interpretation
      column AND the whole transfer_links table identical, which is the
      rebuildability test the domain sets
      (.claude/skills/pulse-domain/SKILL.md:35)", and extend its clearing
      assertion to "a test asserts no raw column on any of those rows changed
      while flow and merchant became null and no transfer_links row names any of
      them". Add to criterion 14.10, as a sixth assertion: "SIX, THE IMPORT SAYS
      WHAT HAPPENED TO IT. An accepted savings statement's Import row carries a
      terminal status meaning accepted-and-held rather than awaiting
      interpretation, the phase states which value that is, and a test asserts
      it, because accepting is not interpreting and the Import row is where the
      product records the difference."
    analysis: >-
      The clear is correct about the two columns it names and incomplete about
      the layer it belongs to. The interesting part is that the plan's own
      argument generalises without change: the reason a flow goes stale on an
      account leaving the pot is that nothing loads it again, and that reason is
      a property of the ROW, not of the column, so every interpretation artifact
      keyed on that row goes stale by the same mechanism. I record this as medium
      rather than high because I could not build a present harm out of it, and I
      want that limit on the record rather than dressed up: one surviving link is
      invisible to every read in the tree today. What it costs is that the
      schema's promise stops being true, and the next person to write a read over
      that table will believe it.
