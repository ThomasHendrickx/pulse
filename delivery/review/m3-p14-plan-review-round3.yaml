  - id: R4-009
    severity: high
    evidence:
      - >-
        Criterion 14.12 hand-measures two figures: "income-total and spend-total
        have each fallen by exactly the rows concerned, against strings written
        by hand in the spec from the fixture's own arithmetic". Everything else
        about the money is qualitative: "that none of those rows appears in any
        month figure", "that the current account's transfers into it have MOVED
        OUT OF THE INTERNAL PAIRING AND INTO THE RESERVES BLOCK", and "that the
        verdict still reads as books closing".
      - >-
        The figure the correction exists to repair is net to reserves, and it is
        not among the two. Walked by hand against the code: while the account is
        wrongly in the pot, the current account's transfers into it take the pot
        arm at src/modules/ledger/domain/classify-flow.ts:73 and classify
        INTERNAL; after the correction they take the reserve arm at :62 and
        classify RESERVE, so net to reserves RISES by them. In the same movement
        the account's own transfer to the household's second savings account,
        which criterion 14.10's fixture carries and which classified RESERVE at
        :62 while the account was in the pot, becomes held and LEAVES net to
        reserves. The figure moves in both directions at once and the criterion
        asserts neither.
      - >-
        "The verdict still reads as books closing" cannot stand in for it, and
        this is arithmetic rather than opinion. From
        src/modules/overview/domain/month-projection.ts:196 through :201, income
        is the INCOME sum, spend is the negated SPEND sum, net to reserves is
        the negated RESERVE sum, and the difference is the change in the pot
        minus (income minus spend minus net to reserves). From
        src/modules/overview/adapters/overview-repository.ts:219, the change in
        the pot is the sum over every row whose flow is NOT NULL. Substituting,
        the INCOME, SPEND and RESERVE sums appear on both sides and cancel, and
        the difference reduces to the INTERNAL sum plus the UNRESOLVED sum. The
        verdict is therefore INSENSITIVE to any misallocation among income,
        spend and reserves: an implementation that puts the corrected transfers
        in the wrong one of those three buckets reconciles exactly as cleanly as
        one that puts them in the right one.
      - >-
        The reserves BLOCK is a different read from the net-to-reserves FIGURE
        and 14.12 pins neither. The block comes from the LEFT JOIN at
        overview-repository.ts:175 through :176, keyed on the account number,
        and its label falls back to the account number itself when the join
        misses (:187). So a correction that leaves the join missing still
        renders a group, 14.12's "moved into the reserves block" is satisfied,
        and what appears on the screen is the household's own account number.
        Criterion 14.1 pins exactly this trap for the setup journey, by hand and
        byte compared; 14.12 inherits none of it.
      - >-
        The reverse direction is asserted in one clause and measured in none:
        "The REVERSE direction, savings to spending, is asserted to need no
        clearing and to classify those rows on the ordinary recompute." No
        figure, no fixture, no arithmetic.
    concrete-edit: >-
      Replace criterion 14.12's assertion list with: "asserts with no further
      upload: that none of those rows appears in any month figure; that they
      render as held under criterion 14.10 with their dates and amounts; that
      income-total, spend-total AND NET-TO-RESERVES are each byte identical to
      strings written by hand in the spec from the fixture's own arithmetic, net
      to reserves being the figure this correction exists to repair and the one
      the reconciliation identity cannot check, because substituting
      src/modules/overview/adapters/overview-repository.ts:216 through :219 into
      src/modules/overview/domain/month-projection.ts:196 through :201 cancels
      the income, spend and reserve sums on both sides and leaves the difference
      equal to the internal sum plus the unresolved sum, so a misallocation
      among those three reconciles perfectly; that the reserves block renders
      one group for that account carrying the LABEL the household typed and not
      its number, which fails if the join at
      src/modules/overview/adapters/overview-repository.ts:175 through :176
      compares raw stored strings, since the label falls back to the account
      number at :187; and that the verdict still reads as books closing."
      Replace its last sentence with: "The REVERSE direction, savings to
      spending, is measured and not merely asserted: a second Playwright arm
      registers the same account as SAVINGS, imports the same statement, changes
      its ring to spending, and asserts with no further upload that the held
      block for it is gone, that its rows now carry a flow, that income-total,
      spend-total and net-to-reserves are each byte identical to hand-written
      strings, and that no clearing call was made. Neither direction is refused;
      a phase that refuses either fails this criterion."
    analysis: >-
      The criterion measures the two figures that fall and not the one that
      moves. That would be a medium if the verdict backstopped it, and the
      dispatch asked me to walk the arithmetic, so I did: the reconciliation
      identity puts the income, spend and reserve sums on both sides of the
      subtraction and they cancel, which means the difference is blind to
      exactly the misallocation this criterion is about. So the phase's most
      load-bearing correction, the remedy for its worst hazard, is measured by
      two hand-written figures neither of which is the reserves figure, and
      guarded by a verdict that provably cannot see the error. The neighbouring
      criteria show the standard the plan already holds itself to: 14.1 byte
      compares a spend total and names the raw-string join trap, and 14.10 byte
      compares seven figures. 14.12 should be written to that standard, and it
      is the criterion that needs it most.
