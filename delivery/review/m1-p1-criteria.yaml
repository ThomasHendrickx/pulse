findings:
  - id: CR-001
    severity: medium
    evidence:
      - "ROUND 1, constructed live against the local stack: created a confirmed GoTrue auth user with no users row (the state an interrupted sign-up leaves, since the pre-fix src/platform/auth/actions.ts created the household only after auth.signUp had already succeeded), signed in through the UI. Observed: 20 main-frame navigations in 10 seconds, page never settles, no UI renders; Playwright probe captured OUTCOME no-error, NAVIGATIONS in 10s: 20."
      - "ROUND 1 mechanism, reader-resolvable at f3dfdff: src/platform/auth/context.ts redirected an authenticated user without a users row to /sign-in; src/middleware.ts:44 redirects any authenticated user off /sign-in back to /; neither side could break the cycle, and sign-out only renders behind the guard, so no exit existed from inside the product."
      - "ROUND 2 RESOLUTION, verified by execution at 9928710: both arms present (src/platform/auth/context.ts:29-31 destroys the half-session via supabase.auth.signOut() before redirecting; src/platform/auth/actions.ts:33-44 signs a fresh session out when the household create fails after signUp). The new e2e spec at test/e2e/auth.spec.ts:68 reproduces this reviewer's exact construction through the admin API. Executed green at 8e5be19: npm run test:e2e EXIT=0 with the orphan-recovery test passing, not skipped. Executed red against the f3dfdff app code: the same spec with src, messages and package.json checked out at f3dfdff exited 1 (toHaveText on auth-status failed, element not found), so the witness demonstrably reddens on the pre-fix behaviour. RESOLVED."
    concrete-fix: >-
      Applied in fix round 1: signOut before redirect in requireHouseholdContext
      plus entry prevention in signUpAction, witnessed by the orphan-recovery
      e2e spec. No further action needed.
    analysis: >-
      Shipped behaviour that was at risk: any sign-up interrupted between
      Supabase auth user creation and household creation left that browser
      permanently reloading between / and /sign-in with no rendered UI and no
      reachable sign-out, recoverable only by manually clearing cookies.
      Ranked medium in round 1; resolved at 9928710 with the recovery arm, the
      prevention arm and a red-verified e2e witness.

  - id: CR-002
    severity: low
    evidence:
      - "ROUND 1, constructed in the review clone at f3dfdff: a context-free repository function exported via an export list (export { listAccounts };) under src/modules/**/adapters left npm test GREEN (exit 0) while the structurally identical inline-exported forms reddened it; cause was the analyzer visiting only FunctionDeclaration and VariableStatement nodes carrying an export modifier."
      - "ROUND 2 RESOLUTION, verified by execution at 9928710: the analyzer (test/schema/tenancy.test.ts:93-263) is fail closed: files importing the db client anywhere under src/modules, plus repository-named adapter files, must export only functions declaring a parameter typed exactly HouseholdContext; export lists are resolved to their local declarations, and every shape the analyzer cannot positively verify (object literal, wrapped factory, class, enum, default export, re-export) is a violation by construction, with 12 shape fixtures in the suite. Spot-checked by this reviewer at head: an export-list context-free function in a db-importing adapters file turned npm test to EXIT=1, the same shape in a repository-named file without a db import also EXIT=1, restore EXIT=0. The overstating comment in src/platform/tenancy.ts was corrected to state exactly what is and is not enforced. RESOLVED."
    concrete-fix: >-
      Applied in fix round 1: fail-closed analyzer with export-list resolution
      and unverifiable-shape refusal, plus the corrected contract comment. No
      further action needed.
    analysis: >-
      Shipped behaviour that was at risk: the tenancy gate shipped as H0.1's
      enforcement silently passed future adapters exporting context-free
      repository functions via an export list. Resolved at 9928710; the
      remaining non-enforced territory (call sites, injected clients in files
      not named repository, dynamic import) is now stated honestly in
      src/platform/tenancy.ts rather than claimed covered.

