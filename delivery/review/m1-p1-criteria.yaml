      - "Later additions: the only post-move token change is --border-hairline, added in styles/tokens.css (head styles/tokens.css:130-132) and consumed via var() in src/app/globals.css; no token landed anywhere else."
      - "The grep executed over src/ (the token and theme files live under styles/, outside src/): EXIT=1, no matches. Both directions: the same grep over a planted witness directory containing one hex colour and one oklch() literal returned both, EXIT=0, so the pattern demonstrably catches what it exists to catch."
