  - id: HZ-M3P7-08
    severity: low
    evidence:
      - "A mobile-first rebuild left the two viewport-height rules untouched. src/app/globals.css:12 and src/app/globals.css:90 both declare min-height 100vh, on the auth screen and on the app shell, and no file in the tree uses dvh, svh or lvh."
      - "On a mobile browser 100vh resolves to the LARGE viewport, the height with the URL bar retracted, so the shell is at least the full device height while the visible area at load is smaller by the browser chrome. The consequence is that the page is scrollable by that difference even when the content fits, which is the state the empty state is in."
      - "I could not demonstrate the harm and I say so plainly: Playwright renders no browser chrome, so in every measurement available here 100vh equals window.innerHeight exactly. Probed at 390 by 844: the shell's computed min-height is 844px, innerHeight is 844 and the document's scroll height is 844."
      - "Where I could measure a consequence, there is none worth reporting: on the sign-in screen at the same size the card's top is 239 and its bottom 605, both inside the 700 the phase itself allows for browser chrome, so the centring does not push the card out of view."
      - "This is therefore a residual, not a demonstrated defect, and it is recorded because the phase's own subject is the difference between what a harness measures and what a phone does."
    concrete-edit: >-
      Change both declarations to min-height 100dvh with the 100vh line kept
      immediately above as the fallback for browsers without dvh, and add
      one sentence to the stylesheet comment saying why: vh is the large
      viewport on a phone and dvh is the one the user can see. No token is
      needed, because both are units rather than values. If the two-line
      fallback is judged not worth the bytes, record the decision instead;
      what should not stand is a mobile-first stylesheet that never
      considered the unit.
    analysis: >-
      The lowest-confidence item in this set and labelled as such. I raise
      it because it is the one place where the harness genuinely cannot see
      what the device does, which is the class of defect this contract
      exists to look for, and because the phase touched this stylesheet
      heavily under a decision that made the phone the base width. The
      honest summary is that the mechanism is real, the fix is two lines and
      the measured impact here is small.
