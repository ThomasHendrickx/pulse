      applied.
    evidence:
      - "Witnessed: foldGroups called with the shipped counterpartyIdentity and normaliseCounterparty over two rows, one carrying whitespace-only counterparty text and no account, one carrying empty text and a whitespace-only account, returned exactly one group: {key text:descriptor:, kind unresolved, label empty string, totalCents -3500, rowCount 2}."
      - src/modules/overview/domain/month-projection.ts:99 computes the identity and src/modules/overview/domain/month-projection.ts:105 makes it the group key, with no isBareIdentityKey test anywhere in the file.
      - src/modules/merchants/domain/counterparty-identity.ts:83 through :85 lists the three places the refusal is enforced, and the overview is not among them.
      - src/modules/merchants/domain/merchant-review.ts:143 through :146 is the sibling screen's repaired behaviour, and messages/en.json carries the copy it renders.
    concrete-fix: >-
      Give the fold the same two-line treatment the review builder got. Import
      nothing from merchants: the identity already arrives structurally
      through CountedGroupIdentity at
      src/modules/overview/domain/month-projection.ts:32, so widen that
      injected shape to carry the basis it already returns plus a boolean the
      application layer fills from isBareIdentityKey, or inject the predicate
      beside the identity the same way normalise is injected. Then at
      src/modules/overview/domain/month-projection.ts:105 keep the grouping
      as it is, and mark the group so the UI can render the same sentence the
      merchant review renders instead of an empty label. Do not silently drop
      the group: its money must stay in the month, which is why refusing it
      the way the matcher refuses is wrong here.
