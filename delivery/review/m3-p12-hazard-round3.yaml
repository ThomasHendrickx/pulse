- deviation: files-to-touch, which does not name .gitignore.
  serves-plan-intent: true
  reasoning: Serves the intent and was necessary. A tracked node_modules symlink publishes an absolute
    container path into a public repository and breaks any clone, which is the repository-hygiene half
    of hazard H12.5's family. Widening the ignore pattern from a directory-only form to one that also
    matches a symlink is the fix for the mechanism rather than for the instance, which is the right shape.
- deviation: files-to-touch, which does not name src/app/globals.css, test/e2e/, messages/en.json, messages/nl.json,
    messages/fr.json or src/app/(app)/merchants/page.tsx.
  serves-plan-intent: true
  reasoning: Serves the intent. Criterion 12.18 requires a refusal to REACH THE READER, and a refusal
    that reaches a reader needs a status the route reads, a component that renders it, a string in each
    of the three catalogues and a style. Declaring the six would have been better, and the work history
    declares them now, which is the correction the clause exists for. I checked the three catalogues carry
    the same set of keys and that the French strings carry their accents.
- deviation: Criterion 12.1's composition clause, "at least 8 rows carry none", under its strict reading.
  serves-plan-intent: true
  reasoning: 'Serves the intent, and the plan has since been amended so it is no longer a deviation: the
    current criterion counts the descriptor half BY BASIS and says explicitly why an absent-field count
    would contradict the step that builds the fixture. The implementation asserts the basis count. This
    is the plan defect I was told not to penalise, and I have not.'
- deviation: Criterion 12.5's committed baseline table, test/fixtures/baseline-descriptor-keys.json.
  serves-plan-intent: true
  reasoning: Serves the intent. Adding a previously unlisted invented identifier shape to test/fixtures/allowed-identifiers.txt
    with its provenance is what non-negotiable 8 requires, and doing it in the round that touched the
    neighbouring file is the honest moment. npm run gate:privacy exits 0 on the head I reviewed, which
    I ran myself.
- deviation: Step 13, "run the full gate before calling the slice done", read as one clean run of every
    gate.
  serves-plan-intent: true
  reasoning: Serves the intent. Recording that a Playwright spec needed a re-run, rather than summarising
    it away, is the behaviour the beacon and red-witness clauses ask for. My own judgement of the Playwright
    gate is in the gates block and in the note on the e2e suite below.
- deviation: Criterion 12.23, added to the plan AFTER this implementation was built.
  serves-plan-intent: true
  reasoning: Serves the intent. The criterion says of itself that it is owed by the next change to this
    phase; this is that change and the interlock is built, tested and wired before any repository call,
    which I witnessed through the shipped command. Findings CR3-M3P12-03 and CR3-M3P12-05 are about the
    criterion's own equivalence premise and about a consequence the criterion does not ask after, not
    about the implementer having skipped it.
- deviation: files-to-touch, which does not name src/platform/db/guard-cli.ts or src/platform/db/resolve-env.ts.
  serves-plan-intent: true
  reasoning: Serves the intent. Criterion 12.23 calls an interlock that resolves differently from the
    command it guards decorative, so extracting the one reading rather than copying it is the only way
    to meet that sentence structurally. Declaring the guard-cli edit was right, because it changes a file
    this phase otherwise has no business in. Finding CR3-M3P12-03 is that the extracted reading is Prisma's
    CLI reading and not the reading of the tsx command this interlock guards, which is a defect of the
    premise rather than of the extraction.
- deviation: Criterion 12.17, the deployed run.
  serves-plan-intent: true
  reasoning: Serves the intent, and it is the same clause as the first deviation seen after the plan moved
    the deployed run to M3-P16. Recording it twice rather than editing the earlier entry is the right
    choice for a work history, which is a log and not a summary.

hazard-classes-addressed:
  - class-id: H12.1
    probed: >-
      Read the trust gate as the guard the plan says it is, then attacked the scrape it stands in
      front of. Confirmed by hand that the scrape's regex ends in a word boundary, so a COMPACT
      over-long value cannot match at all and only a SPACED one truncates; confirmed the length
      table carries exactly one entry of length sixteen, so the only truncation the length test
      cannot refuse is a Belgian-prefixed one; then measured the population that shape can reach on
      the owner's two real documents in memory, counts only, through the shipped importer: rows
      whose scrape match is followed by a further four-digit group, 0 of 39 and 0 of 22. Also
      checked that all 11 stored accounts on the current-account document pass all three tests, so
      the gate is not refusing everything.
    cleared-because: >-
      The account basis fails closed and the one residual is real, named, sized and pinned rather
      than argued away. It is stated in the derivation itself at
      src/modules/merchants/domain/counterparty-identity.ts:212 through :256, in the amended
      criterion in the plan, and in section 7 of the governing skill, and a counterexample test
      pins it at test/domain/counterparty-identity.test.ts:510. Its reachable population on the
      owner's data today is zero rows, which I measured myself rather than taking from the work
      history.
  - class-id: H12.2
    probed: >-
      Ran the committed harness myself over the two real uploads in memory and compared every
      figure criterion 12.2 names against the fixture's own numbers, in both directions, including
      the binding lower bound that catches over-collapse.
    cleared-because: >-
      The real month converges from 25 distinct keys to 20, with the account basis going from 11 to
      6 and the descriptor basis unchanged at 14, and the card document is unchanged at 16, which
      is exactly what the criterion pins. The fixture's 24-to-12 is measured beside it and the
      fixture is asserted to start from TOTAL non-convergence, so it cannot be a softer version of
      the real case.
  - class-id: H12.3
    probed: >-
      Ran the routine against my own pinned local Postgres with rules written under the baseline
      derivation, and read the before-and-after assignment sets it reports rather than the row
      count. Also read how the before-set is computed, which is where the guard could be hollow.
    cleared-because: >-
      The superset test is measured as EFFECT, computed against the working copy before any write,
      and it blocks the run rather than reporting afterwards. I saw before 2 and after 2 on a real
      table with two counted rows and three rules, and I saw a genuine loss block with applied
      false. Nothing I could construct lost an assignment silently. The related defect I did find
      runs the other way and is recorded under H12.18.
  - class-id: H12.4
    probed: >-
      Traced every write the routine can issue: applyRuleWrites at
      src/modules/merchants/application/rederive-rules.ts:618, which touches merchant_rules only,
      and the recompute at :622, which writes transactions.merchantId. Checked against a real
      database that the transaction rows' fact columns were unchanged after two runs.
    cleared-because: >-
      No fact field is written anywhere in the change. transactions.merchantId is interpretation
      output that the existing recompute owns, which is pulse-domain section 2's own division, and
      test/application/rederive-merchant-rules.test.ts:612 asserts no write against the
      transactions table is issued by the routine at all.
  - class-id: H12.5
    probed: >-
      Ran npm run gate:privacy myself (exit 0, gate:privacy clean), read the branch's commit
