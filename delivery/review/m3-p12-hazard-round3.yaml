    evidence:
      - "grep over src and scripts for updateRulePattern returns only its declaration at src/modules/merchants/application/ports.ts:80, its binding at src/modules/merchants/application/index.ts:90, its implementation at src/modules/merchants/adapters/merchant-repository.ts:121 and the unused dependency Pick at src/modules/merchants/application/rederive-rules.ts:222. There is no call in src or scripts. The only callers left are tests using it as a hand-migration helper, at test/application/rederive-merchant-rules.test.ts:1196 and inside the fake at test/application/fake-import-world.ts:436."
      - "The Playwright spec added in fix round one to cover the adapter's write path against a real database, test/e2e/merchant-rule-write.spec.ts:32, covers THIS member and not applyRuleWrites, so the real-database coverage points at the path the routine abandoned."
      - src/modules/merchants/adapters/merchant-repository.ts:125 issues updateManyAndReturn directly, outside any prisma.$transaction.
      - src/modules/merchants/application/ports.ts:75 through :79 is the false claim.
    concrete-fix: >-
      Remove updateRulePattern from the port at
      src/modules/merchants/application/ports.ts:80, from the binding at
      src/modules/merchants/application/index.ts:90, from the adapter at
      src/modules/merchants/adapters/merchant-repository.ts:121 and from the
      dependency Pick at src/modules/merchants/application/rederive-rules.ts:222,
      and delete the corresponding member from the fakes in
      test/application. If it is kept for a caller this phase cannot see,
      correct its comment to say that the re-derivation does NOT use it, that
