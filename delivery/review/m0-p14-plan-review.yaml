  - id: PR1-M0P14-03
    severity: high
    analysis: |-
      BETWEEN THE HATCH AND THE WRONG DEPLOYED DATABASE STANDS ONLY PROSE,
      AND THE PLAN ALREADY OWNS EVERYTHING NEEDED TO STAND A CHECK THERE.
      Once the hatch is set for the M3-P16 run, H16.2's own text says the
      remainder plainly: "nothing in the routine can tell one deployed
      project from another and only evidence the run leaves behind can."
      Criterion 16.6 then reads that evidence AFTER the writing invocation:
      the after pair through the ref-pinned transport must move as the
      routine printed. So the first moment the plan can NOTICE that the
      ambient foreign connection won over the operator's intention (fleet
      warning 1: the ambient DATABASE_URL names a different deployed project
      of the owner's, and shell overrides .env) is after pass one has
      already rewritten patterns in whatever database it reached. Detection
      is real; prevention is "with the deployed connection PINNED EXPLICITLY
      on that invocation", an instruction in a step, which is exactly the
      form H12.30 dismisses as "only an instruction".

      THE PRE-WRITE CHECK COSTS NOTHING NEW. The before pair is ALREADY
      taken through the management API pinned to the pulse project by its
      ref, before the run, by an existing step. The routine ALREADY has a
      real --dry-run (scripts/rederive-merchant-rules.ts:375;
      rederive-rules.ts:1009 gates every write and the recompute on it) and
      prints its counts. A dry-run invocation under the same pinned
      connection and hatches, whose printed rule counts EQUAL the
      transport's before pair, proves before any write that the connection
      the routine resolves is the database the ref names, out of evidence
      two independent transports supplied. No register, no scanner, no new
      module: this is D-62-compatible by construction.

      TWO SMALLER HOLES IN THE SAME SEAM. First, 16.6 refuses counts "taken
      only through the same connection string the run used", but the
      before-numbers step OFFERS that connection as its first choice ("over
      an explicitly named session pooler connection where a credential
      exists, and otherwise through the Supabase management API"), so a
      compliant reading of the step produces a record 16.6 rejects. Second,
      16.6's BLOCKED leg is written only for a run never made ("stating
      that no invocation was issued against any database"), so the one
      outcome the criterion exists to catch, a run MADE whose residue does
      not move as printed, satisfies neither leg and leaves the phase with
      no truthful terminal record.
    evidence:
      - |-
        H16.2 as rewritten by this port: "nothing in the routine can tell
        one deployed project from another and only evidence the run leaves
        behind can", addressed-by criterion 16.6.
      - |-
        Criterion 16.6 compares only the AFTER pair: "the after pair read
        through that ref-pinned transport moves exactly as the routine's
        own printed counts say it should"; its BLOCKED leg requires
        "stating that no invocation was issued against any database".
      - |-
        The dry run is real and total: scripts/
        rederive-merchant-rules.ts:117 ("--dry-run DECIDES AND WRITES
        NOTHING") and src/modules/merchants/application/
        rederive-rules.ts:1009 (applied = exitCode === 0 && input.dryRun
        !== true) gating updates, inserts and recompute together.
      - |-
        The before-numbers step's transport choice: "Take them over an
        explicitly named session pooler connection where a credential
        exists, and otherwise through the Supabase management API pinned to
        the pulse project by its ref", versus 16.6: "A record whose before
        and after counts were taken only through the same connection string
        the run used does not meet this criterion."
    concrete-edit: |-
      Three edits, all to M3-P16. (1) Add to criterion 16.6, after the
      residue sentence: "AND THE FIRST WRITE WAITS FOR ONE EQUALITY: before
      the invocation that writes, the routine is invoked once with
      --dry-run under the same pinned connection and the same inline
      hatches, and the work history records its printed rule counts EQUAL
      to the before pair the ref-pinned transport returned. A writing
      invocation issued before that equality is recorded does not meet this
      criterion. This builds nothing: it orders two observations the phase
      already makes." (2) Insert the matching sentence into the run step,
      before "Run the routine ONCE and WITHOUT --accept". (3) Amend the
      before-numbers step to "through the Supabase management API pinned to
      the pulse project by its ref; a session pooler read may be recorded
      BESIDE it but never in place of it, because criterion 16.6 refuses a
      pair taken only through the connection the run used", and extend
      16.6's closing leg: "Where the run was made and the after pair does
      not move as the routine printed, the record says exactly that, names
      both pairs, and the phase closes BLOCKED carrying it; that record is
      the criterion's failure witnessed, never a variant of MET."
  - id: PR1-M0P14-04
    severity: medium
    analysis: |-
      TWO OF 12.23'S ASSERTIONS ARE NOT OBSERVABLES, AND ONE OF THEM IS THE
      SHAPE THE PLAN JUST FINISHED OUTLAWING. Measurement THREE requires "a
      test that finds no second copy of that shell-first, dot-env-fallback
      reading anywhere under src, scripts or test". A second copy has no
      fixed surface form: it can read process.env and parse a .env file by
      hand with no shared token, so no grep can find it and no test can
      assert its absence; whatever the implementer writes will be a
      hand-written scan over source text that passes vacuously, which is
      the family D-62 just spent three rounds retiring, in miniature. The
      same criterion later requires "a test asserts that src, scripts and
      test carry no module recording a process-wide database-target
      approval, and none that reads source text to decide whether a
      database call site is guarded": "a module recording an approval" is a
      semantic property no test can decide either, and the second half asks
      a test to detect tests that read source text, while db-guard.test.ts
      legitimately reads source text for its comment pins, so the predicate
      as stated is either false against the tree or quietly narrowed by
      whoever implements it.

      WHAT IS ACTUALLY CHECKABLE IS STRONGER AND ALREADY HALF-BUILT. The
      single-copy property has a constructive witness: resolve-env.ts is
      the one implementation, and both consumers IMPORT it. An import is a
      fact of the module graph, assertable directly. The register-absence
      property has a finite witness: the four named paths do not exist and
      the two named exports resolve nowhere.
    evidence:
      - |-
        Measurement THREE's words: "asserted by a test that finds no second
        copy of that shell-first, dot-env-fallback reading anywhere under
        src, scripts or test".
      - |-
        Decision D-62's binding in the same iteration: "no hand-rolled
        scanner over source text", grounded in the lexer defeated four ways
        in one round.
      - |-
        The constructive half exists on the tree already:
        src/platform/db/resolve-env.ts is imported by guard-cli.ts
        ("Environment resolution mirrors Prisma's and lives in ONE place"),
        so the criterion can pin consumers rather than hunt copies.
      - |-
        db-guard.test.ts reads source files legitimately at :238 (the
        comment-pinning loop), which the "none that reads source text"
        clause would have to condemn or carve around.
    concrete-edit: |-
      Replace measurement THREE's test clause with: "asserted structurally:
      guard-cli.ts and the routine both import resolveDbEnv from
      src/platform/db/resolve-env.ts, pinned by a unit test that stubs the
      module and sees both consumers change answer together; and a
      grep-shaped test pins that no file under src or scripts other than
      resolve-env.ts opens a .env file by name." Replace the
      register-absence sentence with: "A test asserts the four withdrawn
      paths do not exist and that no module under src, scripts or test
      exports noteInterlockApproved or approvedConnection; nothing broader
      is claimed, because a semantic absence is not a testable property,
      which is the lesson D-62 records."
  - id: PR1-M0P14-05
    severity: medium
    analysis: |-
      MEASUREMENT FIVE FORBIDS PRINTING A HOST, AND THE GUARD THE ROUTINE IS
      TOLD TO CONSULT PRINTS ONE. assessDestructiveDbTarget's non-local
      refusal reason embeds the resolved hostname (guard.ts:76: points at
      non-local host, with the hostname interpolated), and guard-cli prints
      that reason verbatim on stderr. The criterion tells the routine to ask
      "the same guard the same question" and then requires "no connection
      string, password or host is printed on any path, asserted over the
      captured output of every refusal case". An implementer who wires the
      guard the way guard-cli already models it prints the ambient host,
      which in a fleet container is a real deployed pooler host, and the
      measurement goes red against the very posture the step prescribes;
      one who redacts silently diverges from the file the plan calls
      unweakened. The plan must pick one and say it.

      THE SAME VOCABULARY LEAKS INTO M3-P16'S EVIDENCE PATH. The run step
      requires capturing the WHOLE output verbatim to a file the run wrote,
      and on the BLOCKED path (guard refuses) that verbatim capture
      contains guard-cli's refusal line, hostname included, while criterion
      16.4 forbids a database host committed anywhere on any path. The
      non-production assessment in the same file already states the correct
      practice twice ("The resolved value is deliberately not printed: this
      repository is public"); the destructive assessment predates it and
      was never brought in line, which is invisible until a criterion
      starts quoting captured output into a public work history.
    evidence:
      - |-
        src/platform/db/guard.ts:76: the refusal reason template embeds the
        hostname; src/platform/db/guard-cli.ts prints verdict.reason on
        both branches.
      - |-
        Criterion 12.23 measurement FIVE: "no connection string, password
        or host is printed on any path, asserted over the captured output
        of every refusal case above".
      - |-
        M3-P16's run step: "Capture the whole of its output verbatim to a
        file the run wrote"; criterion 16.4: "NO CONNECTION STRING,
        PASSWORD OR DATABASE HOST IS COMMITTED ANYWHERE, on any path".
      - |-
        guard.ts:188 and :219: the sibling assessment's refusals
        deliberately print no resolved value, stating the public-repository
        reason inline.
    concrete-edit: |-
      Admit the one-line message change and name it in both places. In
      12.23's measurement FIVE add: "This requires one admitted edit to
      guard.ts, named here so the unweakened claim stays true: the
      destructive assessment's non-local refusal drops the interpolated
      hostname and names the VARIABLE only, matching the practice its
      sibling assessment already states twice; the refusal logic changes
      not at all, and the existing db-guard tests pin that." In the
      files-to-touch gloss, extend the admitted changes to "and that one
      refusal-message redaction". In M3-P16's run step add: "the captured
      file is read back before it is committed and can carry no host
      because the guard no longer prints one; if any line nonetheless
      carries a host, the line is quoted with the host elided and the
      elision is marked."
  - id: PR1-M0P14-06
    severity: low
    analysis: |-
      THE PHASE'S OWN INTERFERENCE ENTRY NAMES TWO FILES ITS DECLARATION
      DOES NOT CARRY. The rewritten M3-P9 entry, in the half this port
      appended, states "TWO REMAIN ...: src/app/globals.css, where this
      phase adds the refusal banner criterion 12.18 surfaces and the muted
      line an unnameable group renders; and test/e2e/, where it adds the
      pre-migration submission spec that same criterion requires." Criterion
      12.18 indeed requires an e2e witness. But M3-P12's files-to-touch
      lists neither src/app/globals.css nor test/e2e/: the gap predates
      this iteration, and this iteration re-derived the shared-file count
      in the same entry, which is exactly the moment to have closed it. A
      files-to-touch that omits files the phase's own criteria require
      editing is the defect the M0-P13 iteration existed to remove, and it
      makes the M3-P9 scheduling entry the only place the truth is
      recorded.
    evidence:
      - |-
        The appended entry text in this port: "TWO REMAIN after decision
        D-62 withdrew the target interlock ... src/app/globals.css ... and
        test/e2e/ ...".
      - |-
        M3-P12's files-to-touch after this port: prisma, package.json, the
        pulse-domain skill, src/platform/db/, scripts/, test/domain/,
        test/application/, test/db/, test/fixtures/ and the merchants and
        ledger and overview sources; no globals.css, no test/e2e/.
      - |-
        Criterion 12.18: "an e2e test asserts that submitting a
        PRE-MIGRATION un-namespaced key ... surfaces that error to the
        reader", which cannot land outside test/e2e/.
    concrete-edit: |-
      Add two entries to M3-P12's files-to-touch: "src/app/globals.css (the
      refusal banner criterion 12.18 surfaces and the muted line an
