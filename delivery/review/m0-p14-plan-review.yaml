findings:
  - id: PR1-M0P14-01
    severity: critical
    analysis: |-
      THE ONE DEPLOYED RUN THE WITHDRAWAL PRESERVES IS REFUSED BY A GUARD THE
      PLAN NEVER NAMES, AND EVERY MEASUREMENT IN CRITERION 12.23 STAYS GREEN
      WHILE IT HAPPENS. guard.ts on the tree the removal operates on carries
      TWO assessments, and the plan writes as if it carried one. The contract
      12.23 quotes is assessDestructiveDbTarget, hatch
      PULSE_ALLOW_REMOTE_DB_DESTRUCTION. The second,
      assessNonProductionDbTarget (guard.ts:159 onward), is consulted by
      client.ts at client construction (client.ts:57 through :82), refuses a
      non-local DATABASE_URL in every non-production process, and its only
      hatches are the register approval, which this port removes, and
      PULSE_ALLOW_REMOTE_DB_IN_DEV (guard.ts:191), a variable that appears
      nowhere in the plan.

      WALK THE DEPLOYED RUN AS M3-P16 NOW SCRIPTS IT. The operator invokes
      the package.json script with the deployed connection pinned and
      PULSE_ALLOW_REMOTE_DB_DESTRUCTION=1 inline. guard-cli allows (hatch).
      The routine's own consultation allows (same hatch). Then the first
      repository call constructs the client: NODE_ENV is unset under tsx, so
      the process is not production; the connection is non-local; the
      register approval no longer exists; PULSE_ALLOW_REMOTE_DB_IN_DEV is not
      set because no plan text ever mentions it. assertTargetAllowed throws.
      The run exits non-zero having done nothing, on every attempt, forever.
      M3-P16 records BLOCKED naming a refusal that is a defect in the plan's
      own account of the tree. The routine's own header already states this
      exact trap: without the recorded approval "the client's own guard
      refusing later, at the first repository call, with a message about the
      ambient environment" (scripts/rederive-merchant-rules.ts:348 through
      :352).

      AND 12.23'S MEASUREMENTS CANNOT SEE IT. Measurement FOUR, "with the
      same non-local connection and the hatch set the routine proceeds", is
      tested in process with a fake repository, so no client is constructed
      and the one guard that fires on the real run is never consulted. The
      spawned-entry-point variant of measurement TWO tests only the refusal
      direction. So the constructed implementation satisfies every word of
      the criterion and the phase it feeds still cannot run.

      THE ALTERNATIVE READING IS ALSO WRONG, WHICH IS WHY THIS IS A PLAN
      DEFECT AND NOT AN IMPLEMENTER'S CHOICE. An implementer who notices the
      trap can only escape it by removing assessNonProductionDbTarget and
      assertTargetAllowed entirely, and the plan forbids that three ways:
      12.23 names only "the register consultation" as what leaves guard.ts
      and client.ts; the files-to-touch gloss admits only the
      env-resolution centralisation as a change in src/platform/db/ (which
      is moreover already done on the tree, resolve-env.ts exists and
      guard-cli.ts imports it); and the step says the phase "does not
      weaken" guard.ts. Removing a working local-only refusal from that file
      is a weakening under any reading, and it would silently reopen the
      dev-server hazard that guard exists for.

      THE SECOND PARKED ENTRY IS FALSE FOR THE SAME ROOT CAUSE. It states
      that guard.ts "is reached today only by db:reset and db:migrate" and
      that "npm run dev resolves DATABASE_URL with no refusal at all",
      labelled MEASURED. Against main and against the implementation branch
      both claims are false: client.ts imports the non-production assessment
      from guard.ts and the dev server IS refused a non-local target, with
      its own named override. The entry describes the tree before M3-P12's
      fifth fix round. A parked entry that asserts a gap the tree closes
      will make some later phase reopen the gap to match the record.
    evidence:
      - |-
        guard.ts carries the second assessment and its separate hatch:
        src/platform/db/guard.ts:159 (export const
        assessNonProductionDbTarget), :191 (if
        (env.PULSE_ALLOW_REMOTE_DB_IN_DEV === "1")), and the register branch
        at :169 through :190. grep -c PULSE_ALLOW_REMOTE_DB_IN_DEV
        delivery/plan/pulse-v02.yaml prints 0.
      - |-
        The client consults it at construction, lazily, in every process
        that makes a repository call: src/platform/db/client.ts:3 (import),
        :57 through :77 (assertTargetAllowed), :80 through :82
        (constructClient calls it before new PrismaClient()).
      - |-
        The routine's own comment names the refusal that follows removing
        the register without settling the client guard:
        scripts/rederive-merchant-rules.ts:337 through :352, ending
        "Refusing here instead, where the reason is legible."
      - |-
        M3-P16's run step sets exactly one hatch:
        "PULSE_ALLOW_REMOTE_DB_DESTRUCTION=1 set INLINE ON THE SAME COMMAND
        LINE", and no step, criterion or decision in the plan names the
        client guard or its variable.
      - |-
        The parked entry's claims against the tree: "reached today only by
        db:reset and db:migrate" and "npm run dev resolves DATABASE_URL
        with no refusal at all", versus client.ts:3 importing
        assessNonProductionDbTarget from guard.ts on origin/main.
    concrete-edit: |-
      One disposition, stated in the plan, and three texts aligned to it.
      The disposition that removes least and matches D-62's grounds (the
      register was defeated; the host check was not): the register
      consultation alone leaves guard.ts and client.ts, meaning the
      interlockApproval field and its branch (guard.ts:154 through :190) and
      the runtime-target import plus approval construction in client.ts;
      assessNonProductionDbTarget, assertTargetAllowed and
      PULSE_ALLOW_REMOTE_DB_IN_DEV STAY. Then: (1) in criterion 12.23, after
      the hatch sentence, add: "THE CLIENT KEEPS ITS OWN SECOND REFUSAL:
      src/platform/db/client.ts consults assessNonProductionDbTarget at
      construction, its hatch is PULSE_ALLOW_REMOTE_DB_IN_DEV, and the
      deployed run therefore sets BOTH hatches inline on the one command
      line. Measurement FOUR asserts the routine proceeds past its own guard
      with the destruction hatch alone, AND that a repository-backed
      invocation with only that hatch is refused at client construction,
      which is the second guard witnessed rather than assumed." (2) In
      M3-P16's run step and criterion 16.6's first clause, name both inline
      assignments. (3) Rewrite the second parked entry to the true
      statement: the dev server IS refused a non-local target by the
      client's construction-time check with its own override; what remains
      parked is whether that check plus its override is the settled posture
      for every non-production entry point, owned by whichever phase next
      touches src/platform/db/. If the planner instead intends the
      non-production guard to leave entirely, 12.23 must say so in the
      removal naming, the files-to-touch gloss must admit it, and the
      reopened dev-server exposure must be parked as REOPENED BY THIS
      CHANGE, not recorded as a pre-existing gap.
  - id: PR1-M0P14-02
    severity: high
    analysis: |-
      THE CRITERION SAYS IT NAMES THE REMOVAL DIFF RATHER THAN LEAVING IT TO
      JUDGEMENT, AND THE DIFF IT NAMES LEAVES THE TREE RED. 12.23 names: the
      four modules with "their tests under test/db/", the register
