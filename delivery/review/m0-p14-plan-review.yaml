      four modules over the tree the removal operates on finds four more
      surfaces the criterion does not name, and an implementer who follows
      the named diff exactly, which is what naming a diff is FOR, leaves
      dangling imports that fail typecheck and a test that fails on a file
      read.

      ONE, THE ROUTINE ITSELF. scripts/rederive-merchant-rules.ts imports
      assessRederiveTarget and noteInterlockApproved (:127, :128) and calls
      both (:321, :352), and carries the expect-host, expect-ref and
      expect-port argument handling around them. The step's replacement
      wiring (ask guard.ts before the first repository call) is stated as
      intent, but the criterion's diff naming, the sentence that claims
      completeness, does not include this file, and the step's own "one line
      of package.json and no new module" actively suggests the routine is
      untouched. TWO, THE E2E GATE ASSERTIONS BEYOND THE TWO NAMED FILES:
      test/e2e/auth.spec.ts:3 and test/e2e/merchant-rule-write.spec.ts:4
      import gate-target assertions. THREE, GUARD.TS'S OWN TEST:
      test/db/db-guard.test.ts is not one of the withdrawn modules' tests,
      so "their tests under test/db/" does not cover it, yet it exercises
      the interlockApproval branch (:340 through :355 among :289 through
