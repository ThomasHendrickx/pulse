review-contract: hazard

findings:
  - id: HZ-M3P9-01
    severity: high
    evidence:
      - >-
        THE PRESSED APPEARANCE IS BUILT ON :active AND ITS ONLY WITNESS IS A
        MOUSE. The pressed rule is src/app/globals.css:1405 through :1413
        (button:active, a:active, summary:active, input[type="submit"]:active,
        input[type="button"]:active, [role="button"]:active). Every press in
        the phase's own measurement is driven by page.mouse.down at
        test/e2e/pressed-and-disabled.spec.ts:347, in BOTH projects; grep over
        that file for touchscreen, touchStart, dispatchTouchEvent or tap
        returns nothing.
      - >-
        MY WITNESS, under a context built from devices["Pixel 5"] with isMobile
        true, hasTouch true and viewport 390x844, on the shipped sign-in
        submit. Three touch-driven input paths were driven and each fired real
        events on the control. Raw CDP Input.dispatchTouchEvent touchStart held
        400ms: events seen on the control
        ["pointerdown","touchstart","touchend","mousedown","click"], frames
        with :active = 0, frames with a transform = 0. Input.synthesizeTapGesture
        with gestureSourceType "touch", duration 400ms: events
        ["pointerdown","touchstart","touchend"], frames with :active = 0,
        frames with a transform = 0. page.touchscreen.tap: events
        ["pointerdown","touchstart","touchend","mousedown","click"], frames
        with :active = 0, frames with a transform = 0. A held page.mouse.down
        in the SAME context: ":active EVER matched: true", peak box
        displacement 2.000px, background oklch(0.23 0.008 265) to
        oklch(0.35 0.01 265).
      - >-
        THE HONEST LIMIT OF MY OWN WITNESS, stated so it is not overclaimed. I
        ran the same synthesized touch tap against a bare div OUTSIDE the
        product whose only rule is its own :active declaration: "frames with
        :active on the bare control: 0", so this container cannot produce
        :active from a touch gesture on ANY element. The negative therefore
        does not show that the stylesheet fails on a real phone; it shows that
        the technique the phase chose cannot be witnessed on the input the
        complaint came from, in this container, at all.
      - >-
        THE PHASE MEASURED THIS AND DREW NO CONSEQUENCE FROM IT.
        delivery/work-history/m3-p9.yaml:361 records the same touch result
        ("a raw CDP Input.dispatchTouchEvent touchStart held open did NOT put
        the element in :active in that probe") and
        delivery/work-history/m3-p9.yaml:581 restates it as an open question
        ("I did not chase why"). The plan's own verification-first step (e)
        names the ladder for exactly this condition and ends it with: "If
        :active still does not apply under touch, then the pressed appearance
        is not built on :active at all: it is built on a class or attribute the
        control carries between pointerdown and pointerup".
      - >-
        The phase records at delivery/work-history/m3-p9.yaml:372 that no
        physical device and no mobile browser is reachable from this container,
        which I confirmed independently: there is no google-chrome, chromium or
        firefox binary on PATH.
    concrete-fix: >-
      Three parts, none of which needs a client boundary except the third. (1)
      Put the touch measurement INTO the spec instead of leaving it in a work
      history: add to test/e2e/pressed-and-disabled.spec.ts, under
      chromium-phone only, one press driven by page.touchscreen.tap or a held
      CDP touchStart on a single control, with an assertion that states the
      currently observed outcome explicitly, so an engine or emulator that
      later starts granting :active to a touch, or a stylesheet that later
      stops responding, turns the suite red instead of changing nothing. (2)
      Write beside the pressed rule at src/app/globals.css:1405 the sentence
      the rule's correctness depends on and that nothing here checks: this
      pressed appearance is delivered only where the engine applies :active to
      a touch, which is not measured by this phase and is not measurable in
      this container. (3) Carry the unresolved half forward as an explicit
      acceptance gap on M3-P10, which already opens a client boundary and may
      therefore add the pointerdown/pointerup attribute the plan's step (e)
      pre-authorises; pointerdown WAS witnessed to fire on the control under
      every touch path above, so that route is reachable and cheap, while
      criterion 9.7 forbids it inside this phase.
    analysis: >-
      This is hazard class H9.1 reached through the input device rather than
      through a grep. H9.1 says the phase can write a pressed rule the screen
      never shows because the evidence is a grep for :active rather than a
      press; what happened instead is that the evidence is a press by an input
      device the reporter does not use, taken inside a context that merely
      DECLARES touch. The plan anticipated the shape of this ("Measuring the
      phone width without touch emulation is not an admissible answer to this
      question") and its ladder is conditioned on the mouse technique FAILING,
      which it did not, so the implementer is literally compliant and the
      criteria are literally green. That is precisely what this contract exists
      to catch: the phase is severity high, its entire purpose is press
      feedback on the phone the owner reported from, and the behaviour on that
      device is unwitnessed by construction while every criterion reads met.
      Chromium on a real Android device is widely understood to apply :active
      to a tap, so the shipped rule most likely does work for the owner; this
      finding is about the phase having no evidence of the thing it was
      commissioned to deliver, and about the one measurement it did take
      pointing the other way and changing nothing.

  - id: HZ-M3P9-02
    severity: medium
    evidence:
      - >-
        THE DISABLED HALF OF THE VOCABULARY DOES NOT DISABLE. The rule at
        src/app/globals.css:1435 through :1446 gives [aria-disabled="true"],
        a[aria-disabled="true"] and summary[aria-disabled="true"] the full
        disabled appearance and cursor: default. It sets no pointer-events.
      - >-
        MY WITNESS, under Pixel 5 / isMobile / hasTouch / 390x844, reading each
        computed style only AFTER the phase's own 160ms transitions settle. An
        anchor marked aria-disabled="true" computes {"cursor":"default",
        "opacity":"0.55","bg":"oklch(0.91 0.005 265)","color":"oklch(0.7 0.007
        265)","pointerEvents":"auto"} and on activation navigated:
        http://127.0.0.1:3000/sign-in -> http://127.0.0.1:3000/sign-up,
        "the disabled-looking link STILL NAVIGATED".
      - >-
        A submit button marked aria-disabled="true" computes the same values
        and on activation produced one POST request: "POST requests after
        activating the aria-disabled submit: 1 (IT STILL SUBMITTED)".
      - >-
        A summary marked aria-disabled="true" computes the same values, "the
        aria-disabled disclosure STILL TOGGLED OPEN", and "the aria-disabled
        summary is still focusable: true".
      - >-
        The native path is sound and is the control for the above: with the
        real disabled attribute set on the submit, pressing Enter in the
        password field produced "POST requests ... : 0 (the form did not
        submit)".
      - >-
        Criterion 9.3(a) measures only the computed snapshot and that the
        computed cursor is not "pointer", so it cannot see any of this; the
        spec's disabled block at test/e2e/pressed-and-disabled.spec.ts:323
        through :332 sets the attribute, snapshots, removes it and never
        attempts an activation.
      - >-
        Eight of the nineteen enumerated controls have no disabled attribute to
        set and can only be marked this way: the seven navigating controls and
        the disclosure summary, which is why the spec itself picks
        "aria-disabled" for every non-button at
        test/e2e/pressed-and-disabled.spec.ts:323 through :324.
    concrete-fix: >-
      Split the disabled rule so the aria branch also removes the interaction:
      add "pointer-events: none;" to a rule matching [aria-disabled="true"]
      only, leaving button:disabled and input:disabled alone because the native
      attribute already blocks activation and pointer-events would only cost
      the cursor. Then write into the comment above it what pointer-events
      cannot buy, because it is the half a later phase will get wrong: a
      control marked aria-disabled is still focusable and still activates by
      Enter or Space, so the phase that SETS the attribute must also refuse the
      action in its handler. Finally add one assertion to the spec's disabled
      block that an aria-disabled control does not activate, so the rule cannot
      be dropped silently.
    analysis: >-
      Nothing in the product sets aria-disabled today (grep over src/ for
      aria-disabled, aria-busy, data-unconfirmed and disabled= returns
      nothing), so no user can reach this at this head, which is why it is
      medium and not high. It matters because this phase's deliverable IS the
      vocabulary, M3-P10's plan entry says it "consumes the state vocabulary
      M3-P9 defines and adds none of its own", and eight of the nineteen
      controls have no other way to be marked. A control that looks unusable
      and is fully usable is worse than one with no state at all, and the
      criteria as written grade the appearance and the cursor and stop.

  - id: HZ-M3P9-03
    severity: medium
    evidence:
      - >-
        THE REDUCED-MOTION MEASUREMENT NEVER LOOKS AT THE ONLY ANIMATION THIS
        PHASE SHIPS. The animation is on a pseudo-element:
        src/app/globals.css:1495 declares "animation: pulse-busy-cycle
        var(--duration-busy-cycle) var(--ease-standard) infinite" inside the
        [aria-busy="true"]::after rule that opens at :1484.
      - >-
        The spec's Snapshot takes animationName and animationDuration from
        getComputedStyle(el) on the CONTROL
        (test/e2e/pressed-and-disabled.spec.ts:186 and :187), never from
        getComputedStyle(el, "::after"); the ::after fields it does read are
        content and width only (:191 and :192). Criterion 9.4(a)'s animation half
        is asserted from those control-level fields at
        test/e2e/pressed-and-disabled.spec.ts:313 through :317.
      - >-
        MY WITNESS, same phone context, on button.auth-submit. Under
        reducedMotion "no-preference": control animation-name=none
        duration=0s; ::after animation-name=pulse-busy-cycle
        animation-duration=0.9s. Under reducedMotion "reduce": control
        animation-name=none duration=0s; ::after
        animation-name=pulse-busy-cycle animation-duration=0s. The field the
        criterion reads is identical in both settings.
      - >-
        The shipped BEHAVIOUR is correct, which is why this is a coverage
        finding and not a defect: document.getAnimations() while the submit is
        busy returned two running animations under no-preference
        ([{"state":"running","dur":160,...,"pseudo":null},{"state":"running",
        "dur":900,"iter":"Infinity","target":"BUTTON","pseudo":"::after"}]) and
        [] under reduce, and the :root tokens go 90ms/160ms/900ms to
        0s/0s/0s.
    concrete-fix: >-
      Add afterAnimationName and afterAnimationDuration to the Snapshot in
      test/e2e/pressed-and-disabled.spec.ts (read from getComputedStyle(node,
      "::after") beside the existing content and width reads) and assert them
      in the reduce branch alongside the control-level assertion; and, because
      it is the assertion that cannot be satisfied by a field that is constant,
      assert while a control is in the busy state under reduce that
      node.getAnimations({subtree: true}) contains no running animation.
    analysis: >-
      Hazard class H9.2 is the reader who asks for less motion. The phase
      answers it correctly and the check that is supposed to keep it answered
      is vacuous: deleting the --duration-busy-cycle line from the
      prefers-reduced-motion block in styles/tokens.css would leave the busy
      mark looping forever under reduce and criterion 9.4(a) would stay green,
      because the only fields it reads are none and 0s on every control at both
      settings whether the block exists or not.

  - id: HZ-M3P9-04
    severity: medium
    evidence:
      - >-
        A COMMENT DESCRIBES A DIVISION THE SHIPPED CSS DOES NOT MAKE. The
        comment at src/app/globals.css:1473 states: '[aria-busy="true"] is what
        a button carries; .pulse-busy is the class the link-shaped controls
        carry'. The selector list immediately below it, at
        src/app/globals.css:1476 through :1479, gives a[aria-busy="true"] and
        summary[aria-busy="true"] the same treatment as the button, and the
        phase's own spec applies aria-busy to all nineteen controls including
        every link (test/e2e/pressed-and-disabled.spec.ts:335).
      - >-
        .pulse-busy IS SHIPPED AND NOTHING MEASURES IT. It is declared at
        src/app/globals.css:1479 and :1485. grep for "pulse-busy" over
        test/e2e/pressed-and-disabled.spec.ts returns nothing (exit 1) and grep
        over src/ returns only the two declarations and the comment; no
        criterion names it.
    concrete-fix: >-
      Either measure it or do not ship it. Preferred: add one assertion to the
      spec that applies class "pulse-busy" to a link-shaped control and runs
      the same magnitude and mark checks criterion 9.3(b) runs for aria-busy,
      so the class M3-P10 is told to use has a red line under it. Otherwise
      delete the .pulse-busy selectors and let M3-P10 add the class together
      with the measurement that covers it. Either way correct the comment at
      src/app/globals.css:1473 so it describes the selectors beneath it: the
      attribute branch currently covers buttons, links and the summary alike.
    analysis: >-
      Raised as a finding rather than a note under clause R-087. The false half
      is small but it is exactly the shape that clause names: a comment
      asserting a present-tense fact about the code beneath it that nothing
      keeps true, sitting on the one selector in this phase that no criterion
      and no test exercises. The next phase reads that comment as the contract
      for which marking to use on a navigating control, and the vocabulary it
      names is the untested half.

  - id: HZ-M3P9-05
    severity: low
    evidence:
      - >-
        A FILE-LEVEL COMMENT CLAIMS MORE THAN THE FILE DELIVERS. The header of
        the new block, at src/app/globals.css:1340, states: "no literal
        duration, curve, colour or length appears below".
      - >-
        Literals do appear below it: border-radius 50% at
        src/app/globals.css:1493 and :1516, and opacity 0.55 at :1443, 0.7 at
        :1480, 0.72 at :1504 and 0.25 at :1525. Before this phase
        src/app/globals.css carried no opacity declaration at all; the 50%
        radius has one precedent at :765.
      - >-
        The phase DOES declare these five in
        delivery/work-history/m3-p9.yaml:379 through :396, so they were
        disclosed; the file's own comment is what contradicts them.
      - >-
        The criteria do not catch it and were not meant to: the 9.5(b) grep
        matches px and rem only, and I confirmed it returns the same four lines
        with the same declarations at a4f1a94 and at 88dbaac.
    concrete-fix: >-
      Narrow the comment at src/app/globals.css:1340 to what the file actually
      holds, for example "no literal duration, easing curve or colour appears
      below", and name the five unitless and percentage literals there so the
      next reader does not have to rediscover the exemption; or add tokens for
      them. The comment is the cheaper half and it is the half that is wrong.
    analysis: >-
      Clause R-087. The claim was true of durations, curves and colours and is
      false of lengths, and the file is the first place a later contributor
      looks to learn what this stylesheet is allowed to contain.

  - id: HZ-M3P9-06
    severity: low
    evidence:
      - >-
        EM DASHES IN A COMMITTED DOCUMENT, against CLAUDE.md non-negotiable 7
        ("No em dashes in code comments, docs, commit messages or user-facing
        copy"). Eight of them, all in section headings, at
        delivery/work-history/m3-p9-notes.md:10, :24, :52, :70, :85, :103,
        :111 and :120.
      - >-
        The four code files the phase touches are clean, and so are all five
        commit messages a4f1a94..88dbaac: git diff over styles/tokens.css,
        src/app/globals.css, playwright.config.ts and
        test/e2e/pressed-and-disabled.spec.ts returns no em dash, and git log
        --format=%B over the range returns none either.
    concrete-fix: >-
      Replace each em dash in delivery/work-history/m3-p9-notes.md with a colon
      (the headings read "## 9.1 the six verification-first answers: MET" and
      so on) and amend the notes commit.
    analysis: >-
      Mechanical and cheap. It is raised because the rule is a stated
      non-negotiable and the file is committed to a public repository, not
      because it changes any behaviour.

criteria:
  - id: "9.1"
    quote: >-
      The phase work history records an answer to each of the SIX
      verification-first questions with the command and its captured output
      beside it ... FALSIFIED BY any of the six missing, by a recorded answer
      that carries a conclusion with no captured output beside it, or by a
      sweep that returns a control the enumeration does not name with no
      amendment to the enumeration.
    evidence:
      - >-
        Six entries are present, at delivery/work-history/m3-p9.yaml:277 (a,
        the seven rule counts over every file git ls-files "*.css" returns),
        :292 (b, the token absence and the exact heading text), :304 (c, the
        prefers-reduced-motion search), :310 (d, the sweep and the route to
        each of the five conditional controls), :344 (e, how a held press is
        produced under chromium-phone) and :366 (f, whether a real phone
        browser is reachable). Each carries a command and captured output.
      - >-
        I re-ran (a) myself over the four tracked stylesheets and reproduce the
        base state exactly, and (c) over src/, styles/ and test/ at the base.
        Answer (f) I confirmed independently: no google-chrome, chromium or
        firefox binary is on PATH in this container.
      - >-
        The sweep in (d) returns nineteen identities and the spec's own
        both-directions assertion passes; I watched all four runs of that
        assertion pass in two full suite runs, and the printed set appears in
        my captured log.
      - >-
        Answer (e) is recorded honestly, including the negative touch result,
        which is what finding HZ-M3P9-01 is built on rather than against.
    met: true

  - id: "9.2"
    quote: >-
      THE PRESSED APPEARANCE, MEASURED BY PRESSING, OVER A SET THE PLAN NAMES
      AND WITH A DIFFERENCE BIG ENOUGH TO SEE ... FALSIFIED BY a collected set
      that is not those nineteen in either direction, by one control whose held
      snapshot fails either (i) or (ii) at either width, or by any tap-highlight
      declaration.
    evidence:
      - >-
        (a) The set is swept and asserted in both directions at
        test/e2e/pressed-and-disabled.spec.ts:532 and :533, and the
        assertion passed in all four runs of the spec across two full suite
        runs I executed.
      - >-
        (b) The magnitude machinery is real: at 1280x720 and at 390x844 I
        witnessed a held press move the box 2.000px and take the sign-in
        submit's background from oklch(0.23 0.008 265) to oklch(0.35 0.01 265),
        and I independently computed the composited contrast against the
        hovering surface as 1.501 on that control and 1.747 on the transparent
        anchor, both above the 1.1 bar.
      - >-
        (c) grep -rn "tap-highlight" over every *.css under src/ and styles/
        exits 1, run by me.
      - >-
        THE HALF THAT IS NOT MET AS THE CRITERION INTENDS. "MEASURED BY
        PRESSING" is satisfied here by page.mouse.down alone, in both projects.
        Under the chromium-phone project three touch-driven paths produce
        pointerdown and touchstart on the control and no :active, no transform
        and no movement at all. The criterion's own text does not name an input
        device, so it is met as written; it is not met as intended, and finding
        HZ-M3P9-01 carries that with the limits of my own instrument stated.
    met: true

  - id: "9.3"
    quote: >-
      THE DISABLED, BUSY AND UNCONFIRMED APPEARANCES, MEASURED BY ENTERING
      THEM, AND WITH A MAGNITUDE ... FALSIFIED BY one control whose disabled,
      busy or unconfirmed snapshot differs from its at-rest snapshot by less
      than the stated magnitude, by one that still computes cursor pointer
      while disabled, or by a busy or unconfirmed element whose mark has no
      content or zero width.
    evidence:
      - >-
        The spec enters each state through the DOM and asserts the magnitude at
        test/e2e/pressed-and-disabled.spec.ts:323 through :342 and the
        unconfirmed row at :496 through :506; all four runs passed in both of
        my full suite runs.
      - >-
        I reproduced the disabled and busy magnitudes by hand: a disabled
        control computes opacity 0.55 against a resting 1 (delta 0.45, above
        the 0.15 bar) with cursor "default", and the busy mark computes
        ::after content "" with width 10px and a real running animation.
      - >-
        The criterion measures appearance and the cursor and stops there, which
        is how the [aria-disabled="true"] branch can be fully green while an
        aria-disabled link navigates, an aria-disabled button submits and an
        aria-disabled summary toggles. Finding HZ-M3P9-02.
    met: true

  - id: "9.4"
    quote: >-
      THE REDUCED-MOTION PATH, AND THAT IT REMOVES THE MOTION AND NOT THE
      FEEDBACK ... FALSIFIED BY a non-zero duration under reduce, by no
      non-zero duration under no-preference, or by 9.2 or 9.3 failing under
      reduce.
