deviations-judged:
  - deviation: >-
      Step 2 and the token entry in report-code-disagreement: "no further token
      is expected, with criterion 9.5 failing the phase if a literal duration,
      curve, colour or length reaches a rule instead."
    serves-plan-intent: true
    reasoning: >-
      Adding exactly the nine named tokens and no tenth is what the plan asked
      for, and the five literals that follow from it (four opacity values and
      one 50% radius) are none of the four things criterion 9.5 names and none
      of the three CLAUDE.md non-negotiable 4 names. The disclosure is accurate
      and I verified the two greps it cites myself. The residue is that the
      file's own header comment then claims something stronger than the
      deviation admits, which is finding HZ-M3P9-05 and is a comment defect
      rather than a wrong decision.
  - deviation: >-
      Step 5: "A disabled control changes to --color-surface-disabled and
      --color-ink-disabled and stops computing cursor: pointer."
    serves-plan-intent: true
    reasoning: >-
      All three of the plan's requirements are delivered and an opacity change
      is added beside them. The stated reason is sound and I confirmed the
      mechanism it rests on: on a transparent control the composited magnitude
      depends on the ancestor's background while the opacity branch of
      criterion 9.3(a) does not, so the added opacity makes the disabled
      magnitude independent of where the control sits. It adds appearance and
      removes none.
  - deviation: >-
      Step 4: "Write the pressed appearance for every control the criterion 9.2
      selector finds, which at this phase's base is the seven submit controls,
      the three shell nav links, ..."
    serves-plan-intent: true
    reasoning: >-
      Selecting the elements rather than the enumerated classes is strictly
      wider than the plan's list and is the version that survives a screen
      added later, which is the failure this phase exists to answer. I checked
      the one place the wider selection could have gone wrong: the three
      inverse-surface controls, and there are exactly three such rules in the
      stylesheet and the class list at src/app/globals.css:1418 through :1420 names all
      three.
  - deviation: >-
      Criterion 9.2(b)(i), the movement half.
    serves-plan-intent: true
    reasoning: >-
      The spec asserts more than the criterion requires, which is the right
      direction to deviate in. The mechanism is real and I confirmed the shape
      of it independently: the computed transform alone is satisfiable without
      the box moving, and the bounding-box assertion is what makes the anchor
      display rule undroppable.
  - deviation: >-
      Criterion 9.2(c): grep -rn "tap-highlight" over every file matching *.css
      under src/ and styles/ returns nothing.
    serves-plan-intent: true
    reasoning: >-
      Spelling the property name out in words so the criterion's own grep is
      not tripped by a comment explaining why the property is deliberately
      absent is the only way to keep both the explanation and the check. The
      file already uses the same device elsewhere. I ran the grep and it exits
      1, and I read the rules and confirm nothing sets the property.
  - deviation: >-
      Step 6: "register it in playwright.config.ts under BOTH the desktop
      project and the chromium-phone project, by widening that project's
      testMatch."
    serves-plan-intent: true
    reasoning: >-
      Not a deviation in substance and correctly declared anyway. The chromium
      project declares testIgnore rather than testMatch, so the new spec runs
      there without an edit; I confirmed this in the config and, decisively, by
      watching the spec run under chromium, chromium-phone and not under
      chromium-prod in two full suite runs.
  - deviation: >-
      files-to-touch, which does not name a base rule for the anchor element.
    serves-plan-intent: true
    reasoning: >-
      This is the deviation with the widest blast radius in the phase, a global
      "a { display: inline-block; }", and declaring it was right. I probed it
      rather than accepting it: the four bare anchors are the only ones it
      reaches, since every other anchor carries its own flex or inline-flex
      display at higher specificity; there is no horizontal overflow at 390x844
      on either auth screen (scrollWidth 390 vs clientWidth 390) and each
      affected anchor occupies a single client rect; and every M3-P7 mobile
      month-view spec is green under the chromium-phone project in both of my
      full runs. Judged as serving the plan's intent, with the caveat that a
      base element rule is a wider instrument than a state phase normally
      needs and that its only guard is the bounding-box assertion in the new
      spec.

hazard-classes-addressed:
  - class-id: H9.1
    probed: >-
      Drove the shipped pressed rule with four different input paths under the
      chromium-phone project's own device options (Pixel 5, isMobile, hasTouch,
      390x844) and sampled getComputedStyle plus getBoundingClientRect every
      animation frame: a held page.mouse.down, a held CDP
      Input.dispatchTouchEvent touchStart, Input.synthesizeTapGesture with
      gestureSourceType "touch", and page.touchscreen.tap. Then ran the same
      synthesized touch tap against a bare div outside the product carrying its
      own :active rule, to test the instrument rather than the stylesheet.
    finding: HZ-M3P9-01
  - class-id: H9.2
    probed: >-
      Read the :root duration tokens and both the control's and the ::after
      pseudo-element's computed animation fields under contexts created with
      reducedMotion "no-preference" and "reduce", and enumerated
      document.getAnimations() while a control was in the busy state under
      each. Then read the spec to find which of those fields criterion 9.4(a)
      actually asserts.
    finding: HZ-M3P9-03
  - class-id: H9.3
    probed: >-
      Ran all four of criterion 9.5's checks myself, diffed the length-literal
      grep output between a4f1a94 and 88dbaac line by line, and then went past
      the criterion: read every declaration the phase adds and listed the
      values that are literals but match none of the four greps.
    finding: HZ-M3P9-05
  - class-id: H9.4
    probed: >-
      Ran grep -rn "tap-highlight" over every *.css under src/ and styles/
      (exit 1) and read the whole added block for any other property that would
      suppress the platform cue: no -webkit-tap-highlight-color, no
      touch-action, no user-select and no pointer-events on any pressed or
      resting rule. Also checked that the pressed rule adds a cue rather than
      replacing one, by confirming the five pre-existing cursor: pointer rules
      are untouched outside the disabled branch.
    cleared-because: >-
      The platform's own press highlight is not traded away anywhere in this
      diff, and the pressed appearance is added beside it rather than instead
      of it. The comment that explains the decision spells the property name
      out in words rather than writing it, which keeps the criterion's grep
      meaningful, and that is declared as a deviation rather than done
      silently.
  - class-id: H9.5
    probed: >-
      Ran git diff --name-only a4f1a94..88dbaac and checked every printed path
      against criterion 9.7's exclusion list, then grepped src/ for the three
      state attributes and the disabled attribute to see whether any component
      had been given a state after all, and read playwright.config.ts for a
      widened surface beyond the phone project's testMatch.
    cleared-because: >-
      Six paths only, all inside the phase's declared files plus its own two
      work-history files. No *.tsx, nothing under src/modules/, messages/,
      prisma/ or test/fixtures/, and package.json and package-lock.json byte
      unchanged. grep over src/ for aria-disabled, aria-busy, data-unconfirmed
      and disabled= returns nothing, so no component was edited to give one
      control a state and no client boundary was opened. The only
      playwright.config.ts change is the phone project's testMatch.
  - class-id: H9.6
    probed: >-
      Grepped src/ for every selector the new vocabulary defines to see what,
      if anything, enters these states today, and then entered each state
      through the DOM myself and tried to USE the control, which is the half
      the criteria do not measure.
    finding: HZ-M3P9-02
  - class-id: H9.7
    probed: >-
      Searched the container for the owner's real uploads by their 8-hex
      prefixes; ran npm run gate:privacy; verified the gate's blob against the
      sha the phase records; read every path in the diff for content that could
      have come from a real statement; and swept my own probe outputs and this
      verdict before writing them down.
    cleared-because: >-
      The real uploads are absent from this container, so nothing in the phase
      or in this review could have been drawn from one; half (b) of criterion
      9.8 is correctly recorded as NOT WITNESSED rather than green in both
      documents. The gate exits 0 and its blob is
      ee1cf88b2ea3b6c3993ee96a4a9841106ea8db52 as recorded. The new spec adds
      no fixture and drives two already committed synthetic ones. All five
      commit messages carry no data of any kind.
  - class-id: H9.8
    probed: >-
      Read the spec's set construction to check the denominator is collected
      rather than looked up, then watched the both-directions assertion run and
      pass in four spec runs across two full suite executions, and read the
      journey to confirm it reaches all five conditional controls by the routes
      the criterion names rather than by whatever the clock or the fixtures
      happen to give.
    cleared-because: >-
      The set is built by running the selector on every screen and collecting
      what it finds (test/e2e/pressed-and-disabled.spec.ts:229 through :243),
      never by looking up known selectors, and the assertion at :532 and :533
      fails on a missing control and on an extra one alike. The journey
      reaches the five conditional controls deliberately: the month view before
      any import, /?month=2026-08 for the next step control, the DELIMITED
      fixture with the disclosure clicked open for the preview-again submit and
      the summary, /sign-in before the household exists for the sign-in submit
      and its cross-link, and the rejected PDF for the back-to-import link.
      Nineteen collected, nineteen enumerated, no amendment needed.
  - class-id: H9.9
    probed: >-
      Recomputed the magnitudes myself rather than trusting the spec's own
      arithmetic: composited the held and hovering backgrounds over the nearest
      non-transparent ancestor in the page's own canvas and computed the WCAG
      contrast ratio, at several press durations, on both an opaque control and
      a transparent one; and measured the pressed travel as a real change in
      getBoundingClientRect().top rather than as a matrix.
    cleared-because: >-
      The differences are far above the bars and are visible rather than
      arithmetic. The press moves the box a real 2.000px, and the composited
      contrast against the hovering surface is 1.501 on the sign-in submit and
      1.747 on the transparent anchor. The magnitudes also survive a real tap
      length rather than only an indefinite hold: at 40ms the travel is already
      1.818px and the composited contrast 1.464 with held alpha 0.706, and at
      every duration from 40ms to 400ms both bars are cleared. The disabled
      state carries an opacity delta of 0.45 against a 0.15 bar.
