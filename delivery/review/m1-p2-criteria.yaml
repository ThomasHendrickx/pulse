deviations-judged:
  - deviation: >-
      M1-P2 files-to-touch (src/modules/accounts/, src/modules/import/,
      prisma/, test/domain/profile-detection.test.ts,
      test/application/ingest.test.ts, test/fixtures/,
      test/e2e/import.spec.ts)
    serves-plan-intent: true
    reasoning: >-
      Judged item by item as necessary and minimal in round 1, none as
      scope creep: the thin routes are forced by criterion 1.5 and the
      thin-routes rule; globals.css carries token-only screen classes
      (grep executed, no literal colour or px); the catalogs are forced by
      the no-hardcoded-copy rule (parity 85/85/85 in round 1, 88/88/88
      after the fix round, key sets identical, executed both times);
      vitest.config.ts adds only the @ alias mirroring tsconfig; the
      platform primitives money, plain-date, result and ui/amount are the
      shared language pulse-typescript and pulse-frontend mandate to exist
      exactly once in platform, each minimal; the amendment A to D files
      fall under the orchestrator's declared authority and were verified
      real by this reviewer's own red executions; the fake-import-world is
      the sanctioned port-fake seam for the declared ingest test. Round 2
      adds only fix-bearing files inside the same envelope (three
      fixtures, one domain test file, three catalog keys per language).
      The escalation was raised in the notes the moment it was found; the
      orchestrator's declaration amendment on the base branch remains owed
      before the scope gate runs.
  - deviation: >-
      Fix round 1 finding F1 (CR-201/CR-008, high): full remediation of the
      second-same-format-card misbinding
    serves-plan-intent: true
    reasoning: >-
      Judged, not adopted. The full fix necessarily changes the acceptance
      contract this phase was built against: criterion 1.2 requires a card
      re-upload to be recognised and ingest with nothing asked while the
      card file carries no identity, so any per-upload question or
      identity-column mechanism is a contract change, and a contract
      change is the owner's decision, which is exactly where the
      orchestrator sent it (claim M1P2-C6). Deferring it therefore serves
      the plan's intent better than an implementer silently rewriting the
      contract. The transparency arm that DID ship was verified by this
      reviewer's own executions: the re-run probe confirms the residual
      binding with the landing accountId recorded, the screens name the
      landing account, and the e2e run asserts it. This reviewer ranked
      the finding medium (CR-008); the hazard review ranked the same
      behaviour high (CR-201), and that severity disagreement, and with
      it whether the residual blocks the merge under the delegated-grant
      conditions, is the orchestrator's arbitration to record with
      evidence, not either reviewer's to wave through. Within THIS
      contract nothing high or medium remains unresolved.

