findings:
  - id: CR-008
    severity: medium
    evidence:
      - "ROUND 1, constructed and executed by this reviewer against committed code at 10beb40 (probe test, run then removed): upload card statement one (kbc-card.csv), declare account 'His card'; then upload a DIFFERENT card's statement in the same bank format (kbc-card-b.csv as the second card's file). Captured: the second upload returned kind 'ingested' with no question asked, every row of it carried the first card's accountId, and nothing anywhere named the landing account (the result screen rendered counts only). Cross-card identical tuples additionally collided on the misbound dedup key, silently dropping rows."
      - "ROUND 1 mechanism, reader-resolvable: the profile-binding account resolution in upload-statement.ts combined with structural spec equality, so two same-bank cards with byte-different files and identical detected specs resolve to one binding; the phase step's 'unknown accounts asked once, at first sight' is violated for the never-declared second card."
      - "ROUND 2 RESOLUTION as transparency plus escalation, verified by this reviewer's re-executed probe at 41ff037 (run then removed): the residual binding behaviour is UNCHANGED and now stated, the probe confirming the second card still ingests into the first card's account with the landing accountId recorded on the Import row; the transparency arm is real in the artifact: the result screen renders the landing account label (src/modules/import/ui/import-result.tsx:41-48, testid landing-account), the confirmation screen names the landing account or says a new one will be declared (src/modules/import/ui/profile-confirmation.tsx:40-49), the detail route resolves it by the SAME rule the confirm use case applies (src/app/(app)/import/[id]/page.tsx:76-88 mirrored by src/modules/import/application/confirm-import.ts:76-92), a unit test pins the bound-account resolution (the finding F1 describe in test/application/ingest.test.ts), and this reviewer's own e2e run asserts the landing-account element on both the first import and the re-upload (test/e2e/import.spec.ts:57 and test/e2e/import.spec.ts:69; npm run test:e2e EXIT=0). The residual (which account a second same-format card SHOULD land in) is escalated to the owner as open-question claim M1P2-C6 in delivery/work-history/m1-p2.yaml:435-443. RESOLVED as declared: the silent variant of the failure no longer exists; what remains is visible, recorded, and an owner decision."
    concrete-fix: >-
      Applied in fix round 1 as the visibility arm of this finding's
      original two-arm fix: the landing account is named everywhere the
      user sees an import, and the second-card question is tracked as
      M1P2-C6 for the owner alongside the still-owed real-CSV layout
      verification (M1P2-C1), where a file-carried card identity would
      supersede the profile binding. No further action needed this round.
    analysis: >-
      Shipped behaviour that was at risk in round 1: the first statement
      of a household's second card in the same bank format silently
      ingested into the first card's account, unasked and unlabeled, with
      cross-card identical rows silently dropped, and facts immutability
      making the misattribution unrepairable in-product. Ranked medium.
      After round 2 the misbind is no longer silent (named on every
      screen, asserted in e2e), the open decision is durably recorded, and
      the criteria contract itself still forces the binding design (a
      card re-upload must ask nothing and the card file carries no
      identity), so the residual is a contract-level owner decision, not
      an implementation defect left standing.

  - id: CR-009
    severity: low
    evidence:
      - "ROUND 1, constructed and executed by this reviewer at 10beb40 (probe test, run then removed): a debit-and-credit-pair export whose period contains no credits detected amountRepresentation signed on the debit column and parsed both debits POSITIVE (captured [74210, 1525]), hazard H1.1's class outside the fixture matrix, gated only by the confirm preview where the wrong sign renders as an absent minus."
      - "ROUND 2 RESOLUTION, verified by this reviewer's re-executed probe at 41ff037 with the round 1 construction VERBATIM (run then removed): detection now returns kind debitCredit with debitColumn 4 and creditColumn 5 via the header-hinted empty-sibling rule (src/modules/import/domain/detect-profile.ts:413-447), and parsing yields [-74210, -1525], negative integer cents. The committed fixture test/fixtures/generic-debits-only.csv reproduces the shape and the finding F3 describe in test/domain/profile-detection.test.ts asserts pair detection and negative parsing. Red direction executed by this reviewer: empty-sibling detection disabled (mutation D1), profile-detection EXIT=1 with exactly the 2 F3 tests failing, restored green. RESOLVED."
      - "Residual of the same class, noted rather than found: a file whose indicator column carries an unknown marker (the storno fixture) still DETECTS as a signed column when uploaded as a new source, proposing positive amounts behind the confirm gate; under an already-confirmed indicator profile the delta makes the same row fail loudly instead (finding F2, problem indicator), which is the exposure that mattered, and the headerless-signed proposal remains user-gated exactly as round 1 judged acceptable at low."
    concrete-fix: >-
      Applied in fix round 1: header-hinted empty-sibling pair detection in
      both directions with the committed single-sided fixture and tests,
      red-verified by this reviewer. No further action needed.
    analysis: >-
      Shipped behaviour that was at risk: a credits-empty month of a
      debit/credit source proposed a signed representation and one
      inattentive confirm wrote a month of expenses as positive amounts.
      Resolved at the detection layer; the storno-marker residue is
      bounded to a wrong PROPOSAL behind the confirm gate for a brand-new
      source, while a confirmed profile now fails such rows loudly with
      nothing written.

  - id: CR-010
    severity: low
    evidence:
      - "ROUND 1: src/modules/import/adapters/import-repository.ts carried an unused export countTransactionsForAccount under a comment claiming present-tense usage by the import screens and the e2e assertions; grep found no caller (exit 1). R-087 shape one."
      - "ROUND 2 RESOLUTION, verified by this reviewer's own grep at 41ff037: countTransactionsForAccount appears nowhere under src/ or test/ (grep exit 1); the export and its false comment were removed in commit d36a011. RESOLVED."
    concrete-fix: >-
      Applied in fix round 1: the dead export and its false comment are
      deleted. No further action needed.
    analysis: >-
      A comment asserting a present-tense fact that nothing checked, raised
      as a finding per R-087 and removed rather than rescued.

