findings:
  - id: CR-008
    severity: medium
    evidence:
      - "Constructed and executed by this reviewer against committed code (probe test, run then removed): upload card statement one (kbc-card.csv), declare account 'His card'; then upload a DIFFERENT card's statement in the same bank format (kbc-card-b.csv as the second card's file). Captured: the second upload returns kind 'ingested' with no question asked, every row of it carries the first card's accountId, and the set of accountIds across all stored transactions is exactly the first card's account. Probe exit 0 asserting the wrong behaviour holds."
      - "Mechanism, reader-resolvable at 10beb40: src/modules/import/application/upload-statement.ts:104-109 resolves the account for a file with no own-account column from profile.accountId; src/modules/import/application/upload-statement.ts:86-93 finds the profile by STRUCTURAL spec equality; two cards of the same bank produce byte-different files with identical detected specs (deterministic detection over the same column layout), so the second card's first-ever upload resolves to the first card's binding."
      - "Consequence beyond misattribution: dedup keys hash over the misbound accountId (src/modules/import/domain/dedup.ts:33-40), so a tuple the two cards legitimately share (same day, same amount, same merchant, empty reference) collides across cards and the second card's row is silently SKIPPED, which is row loss inside the facts layer."
      - "The phase's own step text is violated in this instance: 'unknown accounts asked once, at first sight, against parsed data, before anything reaches the ledger'. A never-declared second card is an unknown account and is never asked; nothing on the result screen names the account the rows landed in (src/modules/import/ui/import-result.tsx renders counts only)."
    concrete-fix: >-
      Two arms. Now: make the landing account visible, by rendering the
      resolved account's label and bank on the import result screen (one
      catalog key per language, account read through the published accounts
      interface), so a misbound upload is visible the moment it happens
      instead of silent. When the real card CSV layout is verified (open
      question M1P2-C1): if the export carries any card or account
      identifier (the real KBC PDF header carries the masked card number,
      delivery/intake/pulse-v0.2-pdf-addendum.md:73-74), add that column
      role to the spec and prefer file-carried identity over the profile
      binding; until then record the one-card-per-format limitation in
      pulse-domain SKILL.md section 5 so the second same-format card is a
      known hazard rather than a surprise.
    analysis: >-
      Shipped behaviour at risk: the first statement of a household's
      second card from the same bank silently ingests into the first
      card's account, unasked and unlabeled, and rows shared across the
      two cards are silently dropped by the dedup key. Facts are immutable
      by non-negotiable 5, and accountId is a fact column, so no shipped or
      planned code path (including M1-P3's re-parse, which rebuilds from
      rawLine under a fixed account) repairs the misattribution; recovery
      is manual database surgery. Ranked medium rather than high because
      the trigger requires a second same-format card the recorded household
      does not yet have (notes/export-format-facts.md records one Belfius
      account and one KBC card), and the criteria contract itself forces
      the binding design (criterion 1.2 requires a card re-upload to be
      recognised and ingest zero with nothing asked, and the card file
      carries no identity), so this is the contract's blind side realized
      faithfully, surfaced here per the brief's instruction that meeting
      every criterion is one input and never a terminal green.

  - id: CR-009
    severity: low
    evidence:
      - "Constructed and executed by this reviewer against committed code (probe test, run then removed): a debit-and-credit-pair export whose period contains no credits (two data rows, credit column entirely empty). Captured: detection returns amountRepresentation { kind: 'signed', column: 4 } (the debit column), and parseStatement then yields amountCents [74210, 1525], POSITIVE, for two rows that are debits. Probe exit 0 asserting the inverted behaviour holds."
      - "Mechanism, reader-resolvable at 10beb40: src/modules/import/domain/detect-profile.ts:183-195 admits only columns with at least one non-empty cell as amount columns, so an all-empty credit column vanishes; src/modules/import/domain/detect-profile.ts:232-245 then treats the single surviving column as signed (no indicator column exists in this layout), and unsigned debit magnitudes parse positive."
      - "The blast radius is bounded by the flow's own design: the detected spec differs from the stored debitCredit profile, so specEquals fails, the import lands AWAITING_DECLARATION and the user sees the five-row preview before anything reaches the ledger; the preview however renders the wrong sign as the mere absence of a minus, which is the least visible possible rendering of hazard H1.1's failure."
    concrete-fix: >-
      In detection, when exactly one amount column qualifies and another
      column whose header matches the debit/credit vocabulary the detector
      already knows (/debit|credit|af|bij/) exists with all cells empty,
      propose the debitCredit pair over the two columns instead of signed;
      commit a single-sided synthetic fixture and a test asserting debits
      still parse negative for it.
    analysis: >-
      Shipped behaviour at risk: a low-activity or single-sided month from
      an established debit/credit source re-asks for confirmation with a
      wrongly proposed signed representation; one inattentive confirm
      writes a whole month of expenses as positive amounts into the facts
      layer. Recoverable by design (rawLine is stored and M1-P3 ships the
      re-parse that consumes it) and gated by a human confirm over the
      preview, so low; recorded because it is a live member of hazard
      class H1.1 that the criterion 1.1 fixture matrix does not reach.

  - id: CR-010
    severity: low
    evidence:
      - "src/modules/import/adapters/import-repository.ts:215-216 states in a comment: 'Read side for the import screens and the e2e assertions: how many transaction rows an account carries.' Executed: grep -rn countTransactionsForAccount over src/ and test/ finds no caller outside its own definition (exit 1). No import screen and no e2e assertion uses it; test/e2e/import.spec.ts asserts counts through the rows-added and rows-known test ids rendered from the Import row."
    concrete-fix: >-
      Delete the unused export, or wire it to a real consumer and keep the
      comment true. Do not leave a present-tense usage claim standing over
      dead code.
    analysis: >-
      R-087 shape one, raised as a finding as the brief requires: a comment
      asserting a present-tense fact that nothing checks. It was plausibly
      true in an intermediate design and nothing keeps it true; the next
      reader will trust a read path that has never been exercised.

