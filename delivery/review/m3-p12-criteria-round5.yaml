deviations-judged:
  - deviation: >-
      Criterion 12.17, the half requiring the phase work history to record the
      command actually run AGAINST THE DEPLOYED DATABASE with its exit code and
      its printed before-and-after assignment-set sizes.
    serves-plan-intent: true
    reasoning: >-
      Judged, not accepted. Decision D-46 forbids the routine running before
      the code deploys and the branch is neither merged nor deployed while the
      phase is open, so no implementation could satisfy this half without
      violating the decision the same criterion pins. That is a plan defect
      and the plan now agrees: the deployed run moved to criterion 16.1 in the
      phase whose entry condition IS the deploy. The other half, the named
      invocation point, is met and tested. Doing this half here would have
      meant writing merchant_rules into the owner's deployed database from an
      ephemeral container while the deployed app still carried the old code,
      which is the deploy window with its halves in the wrong order.
  - deviation: >-
      Criteria 12.7, 12.8 and 12.9, which speak of "a seeded database" holding
      MerchantRule rows written under the baseline derivation.
    serves-plan-intent: true
    reasoning: >-
      The fake is this tree's standing convention for the application layer
      and it is what makes criterion 12.9's assertion possible at all, since
      "issues no write against the transactions table" is a statement about
      calls and not about rows. The judgement is qualified rather than clean,
      and the qualification is finding CR5-M3P12-04: a fake standing in for an
      adapter has to be at least as strict as it on every path, and the insert
      path is currently weaker, upserting where the adapter's create would hit
      the unique key. That does not make the deviation wrong; it makes the
      fake owe one more constraint.
  - deviation: "files-to-touch, which does not name .gitignore."
    serves-plan-intent: true
    reasoning: >-
      Removing a tracked node_modules symlink carrying an absolute container
      path out of a PUBLIC repository, and widening the ignore rule that let
      it in, is unambiguously correct and could not wait for a plan amendment.
      Verified in this worktree: git ls-files returns no node_modules entry.
  - deviation: >-
      files-to-touch, which does not name src/app/globals.css, test/e2e/,
      messages/en.json, messages/nl.json, messages/fr.json or
      src/app/(app)/merchants/page.tsx.
    serves-plan-intent: true
    reasoning: >-
      All six are the surface criterion 12.18's e2e half requires: a typed
      refusal has to reach a reader in three locales through a rendered
      screen, and none of that is reachable from the files the plan named. The
      deviation is declared with its reason rather than slipped in, and it has
      a real consequence the work history states itself: the conflicts-with
      entry for M3-P9 asserted as CHECKED that this phase touches none of
      M3-P9's files, and two of these are M3-P9's. Correcting that entry
      rather than leaving a false checked statement is the right call.
  - deviation: >-
      Criterion 12.1's composition clause, "at least 8 rows carry none", under
      its strict reading.
    serves-plan-intent: true
    reasoning: >-
      Correct to leave alone, and correctly attributed. Under the strict
      reading the criterion collides with the step that builds the fixture,
      which requires the same fixture to carry rows that DO carry an account
      field and fall to the descriptor basis. Contorting the fixture to
      satisfy the strict reading would have weakened criterion 12.16's attack
      rows, which are the guard on the phase's own critical hazard. This lane
      adds that the amended sentence has its own defect, recorded on criterion
      12.1 above: the arithmetic it now asserts does not follow either.
  - deviation: >-
      Criterion 12.5's committed baseline table,
      test/fixtures/baseline-descriptor-keys.json.
    serves-plan-intent: true
    reasoning: >-
      Adding an invented PAN-shaped substring to the allow list with its
      provenance is what the allow list is for, and the privacy gate passes in
      this lane's own run. Not a deviation from plan intent in any direction.
  - deviation: >-
      Step 13, "run the full gate before calling the slice done", read as one
      clean run of every gate.
    serves-plan-intent: true
    reasoning: >-
      The five fast gates were clean on the first run and are clean in this
      lane's independent run too. The e2e re-runs are reported with what
      failed and why rather than summarised away, which is the behaviour to
      reward, and fleet warning 18 records that the instability is
      orchestrator contention rather than an implementer defect. The phase
      later produced a first-run-green full suite, so this deviation has
      closed itself.
  - deviation: "Criterion 12.23, added to the plan AFTER this implementation was built."
    serves-plan-intent: true
    reasoning: >-
      The criterion's own text says a review at the time of relocation marks
      it not met and not yet owed. Four fix rounds later the interlock is
      built, wired ahead of every read, and covered by every refusal the
      criterion enumerates. Recording it as built in this round rather than as
      always-owed is the honest framing.
  - deviation: >-
      files-to-touch, which does not name src/platform/db/guard-cli.ts or
      src/platform/db/resolve-env.ts.
    serves-plan-intent: true
    reasoning: >-
      Criterion 12.23 requires the interlock to resolve the environment the
      way the command it guards resolves it, and calls an interlock that does
      not "decorative". Extracting the one reading into resolve-env.ts and
      having guard-cli.ts import it is the only way to make that structural
      rather than asserted, and src/platform/db/ is in files-to-touch as
      amended. Naming the guard-cli edit anyway is the right level of care.
  - deviation: "Criterion 12.17, the deployed run."
    serves-plan-intent: true
    reasoning: >-
      The same deviation as the first entry, restated after the plan moved the
      deployed run to M3-P16. Judged the same way: correct, and no longer this
      phase's.
  - deviation: >-
      Criterion 12.23's consequence: the routine cannot be rehearsed against
      any database an operator can create.
    serves-plan-intent: true
    reasoning: >-
      This is the honest cost of an interlock with no override, and the two
      alternatives are both worse: an override flag the criterion forbids, or
      a local carve-out that would be the exact hole the interlock exists to
      close. Recording it as a deviation rather than engineering around it is
      the right call. It does mean the routine's write path reaches a real
      database for the first time on the owner's deployed data, which is worth
      M3-P16 knowing; the mitigation already shipped is --dry-run, whose
      no-write behaviour is tested at
      test/application/rederive-merchant-rules.test.ts:753.
  - deviation: "files-to-touch, which does not name src/modules/overview/."
    serves-plan-intent: true
    reasoning: >-
      The overview fold is a fifth consumer of the identity, and the plan's own
      hazard H12.15 is about a bare-namespace key merging unrelated rows. A
      phase that changed four consumers and left the fifth applying no floor
      would have shipped that hazard on the month view. The deviation serves
      the plan's intent more faithfully than the file list did.
  - deviation: >-
      files-to-touch, which does not name playwright.config.ts,
      src/platform/db/gate-target.ts or src/platform/db/guard.ts.
    serves-plan-intent: true
    reasoning: >-
      The writing surface this round guards is one this phase itself added, and
      the only place early enough to refuse an unnamed target is the config's
      own module scope. Declaring the three files rather than slipping them in
      is right. The one consequence worth naming is that playwright.config.ts
      is M3-P9's file, so this phase now meets that phase in a third place;
      the conflicts-with entry was updated in the same round, which is the
      correct response.
  - deviation: >-
      Criterion 12.23, which requires the interlock to resolve the environment
      "the way the command it guards resolves it" and describes that reading as
      ".env only for a variable the shell does not carry OR carries empty".
    serves-plan-intent: true
    reasoning: >-
      The criterion's description of the Prisma CLI is false and the code is
      right to stop repeating it. The important half is that the divergence is
      shown to be fail closed in BOTH directions rather than argued: the guard
      falls back where the CLI aborts, so the guard is the stricter one, and
      test/db/db-guard.test.ts executes the CLI itself to pin the asymmetry,
      which this lane saw pass in its own npm test run (four cases, 2.7 to 2.8
      seconds each, real CLI invocations). Reporting the criterion as defective
      rather than quietly implementing the false reading is exactly the
      behaviour the contract asks for.

