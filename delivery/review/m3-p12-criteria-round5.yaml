# M3-P12 clean-room review, CRITERIA contract, ROUND FIVE, judging fix round four.
# Worktree /home/user/wt-m3p12-r5crit, branch claude/m3-p12-rev5-crit, head
# 606e3ee30ccfa44c1bbd110fbbc03b243d1025fd.
#
# HOW THIS DOCUMENT WAS PRODUCED. Written incrementally from the first minutes
# and committed as it went; the schema-shaped form below replaced the running
# notes once the walk was complete, and the notes' content is carried into the
# evidence and analysis fields rather than dropped.
#
# THE DATABASE THIS LANE USED. A database this lane created for itself,
# pulse_r5crit, on the shared local supabase Postgres at 127.0.0.1:54322,
# migrated with prisma migrate deploy and pinned explicitly on every
# invocation. The ambient DATABASE_URL in this container resolves to a
# deployed pooler in eu-north-1 belonging to a different project (fleet
# warnings 1 and 16) and was never used. No dev or production server was
# started without a pin.
#
# DECORRELATION. The sibling hazard lane's document was not opened, before or
# during this walk. The only thing this lane learned about that lane is that
# it held ports 3000 and 3100 with a running Playwright suite, which came from
# a process listing while diagnosing an occupied port, and which fleet warning
# 18 makes this lane's business.
#
# WHAT THIS CONTRACT DID NOT REACH, said here rather than left to the reader.
# The criteria contract walks what the plan wrote down. It cannot reach the
# question of whether the contract contains the phase's real defect, and this
# phase has now had a high-severity defect found FOUR rounds running by
# reading the artifact rather than the criteria: the same-merchant collision,
# the untransactional write set, the wholesale before-set exclusion, and the
# unnamed gate database. None of those was a criterion. Three of the findings
# below were likewise found by attacking the artifact and correspond to no
# criterion. "All acceptance criteria met" is one input here and is not a
# terminal green.

findings:
  - id: CR5-M3P12-01
    severity: medium
    evidence:
      - "The routine dismisses a superseded rule's claim on a row at src/modules/merchants/application/rederive-rules.ts:738, and the condition is that the row is covered by ANYTHING after the run, not that it is covered by the claimant."
      - "The check immediately above it, at src/modules/merchants/application/rederive-rules.ts:721, has already returned false when the merchant is unchanged, so every row that reaches line 738 is a row whose merchant HAS changed."
      - "Criterion 12.7 states the requirement with no exception: the after set is a SUPERSET of the before set, meaning \"no transaction that carried a merchant id loses it, and no transaction changes from one merchant to another\"."
      - "The exception is deliberate and tested: test/application/rederive-merchant-rules.test.ts:1649 asserts a descriptor-basis row that moves from merchant alpha to merchant beta reports lostAssignments [] and exit code 0."
    concrete-fix: >-
      Route the divergence back into the criterion rather than leaving it in a
      comment. Amend criterion 12.7 to state the one exception the code
      carries, in the code's own words: a claim held before the run by a rule
      the deployed matcher can no longer apply is not a loss when the row is
      covered after the run, because that claim was already dead the moment
      the code deployed. Separately, narrow the code's condition at
      src/modules/merchants/application/rederive-rules.ts:738 from "covered by
      anything" to "covered by the claimant that superseded this rule", by
      carrying the claimant id beside the superseded id. The current condition
      also dismisses the case where a THIRD rule of a THIRD merchant covers
      the row, which the comment's own justification, that a later naming the
      owner made on the screen simply won, does not cover.
    analysis: >-
      This is not a mistake in the repair; the repair is sound and its
      argument holds. It is a contract gap. Round three introduced the
      exception, round four narrowed it correctly and wrote the argument down
      at src/modules/merchants/application/rederive-rules.ts:669 to :706, and
      neither round routed it into criterion 12.7, which still reads as an
      absolute. A criteria reviewer walking 12.7 literally against this code
      would mark it not met; a reviewer reading the comment would mark it met.
      That ambiguity is the finding. The residual in the condition itself is
      narrow but real and costs one field to close.

  - id: CR5-M3P12-02
    severity: medium
    evidence:
      - "test/application/rederive-merchant-rules.test.ts:1416 is named \"the before-set excludes it, so no loss is reported for a row whose merchant the owner changed\"."
      - "test/application/rederive-merchant-rules.test.ts:1440 is named \"ONLY superseded ids are excluded: on a FIRST run every rule is un-namespaced and the before-set is the whole point of criterion 12.7\"."
      - "The before-set excludes nothing. It is computed over the whole stored rule set at src/modules/merchants/application/rederive-rules.ts:707, and the dismissal moved to the comparison at :738."
      - "The commit under review says so in its own message: \"The before-set is whole again and the artifact is filtered at the comparison instead\" (commit 606e3ee)."
      - "The inline comment at test/application/rederive-merchant-rules.test.ts:1431 to :1434 repeats it: \"Before this round the before-set also credited the DEAD un-namespaced rule\", which describes round two, not the round before this one."
    concrete-fix: >-
      Rename both tests and correct the comment so they describe the mechanism
      that exists. Suggested: at :1416, "a superseded rule's claim is not
      reported as a loss when the row is still covered, so no loss is reported
      for a row whose merchant the owner changed"; at :1440, "nothing is
      excluded from the before-set: on a FIRST run every rule is un-namespaced
      and the before-set is the whole point of criterion 12.7". Neither
      assertion needs to change; both still pass, and that is precisely why
      nothing caught the drift.
    analysis: >-
      Clause R-087's first shape exactly: a present-tense claim that was true
      when written and that nothing keeps true. The cost is concrete rather
      than cosmetic. The next reader who has to touch the loss reporting will
      go looking for a before-set exclusion, find none, and have to reconstruct
      which of the two mechanisms the tests are actually pinning.

  - id: CR5-M3P12-03
    severity: medium
    evidence:
      - "src/platform/db/gate-target.ts:101 to :109 decides \"is this a local stack\" from new URL(value).hostname alone, and consults no query parameter."
      - "The sibling interlock refuses exactly that shape by name at src/platform/db/target-guard.ts:220 to :227, and its header at src/platform/db/target-guard.ts:66 to :71 records WITNESSING it: \"a string carrying a correct pooler authority plus a host parameter naming a filesystem path was APPROVED by the field comparison, and the shipped client then tried to reach the path\"."
      - "Executed by this lane against the shipped predicate through tsx: assessGateDbTarget ALLOWS postgresql://u:p@127.0.0.1:5432/postgres?host=aws-1-eu-north-1.pooler.supabase.com, while refusing every other lookalike it was given, including localhost.evil.com, 127.0.0.1.evil.com, a userinfo trick, the decimal form of the loopback address, an ipv4-mapped bracketed form, 127.0.0.2 and 0.0.0.0."
      - "guard.ts:31 to :33 states the intent that was actually delivered: \"the gate interlock beside this one asks the same question of a hostname that this guard asks. One list, not two that agree until somebody edits one.\" The list is shared; the parameter surface is not."
    concrete-fix: >-
      Give src/platform/db/gate-target.ts the same two refusals its sibling
      already has, by extracting them rather than copying: refuse a connection
      string carrying a host query parameter, and refuse one carrying a query
      parameter the module does not understand. The natural home is a shared
      helper in src/platform/db/ that both interlocks call, which is the same
      move LOCAL_DB_HOSTS already made.
    analysis: >-
      Not a live path to a remote database: the Postgres connector reads a
      host parameter as a socket directory, so the string above opens nothing
      rather than opening the pooler. It is recorded as medium because it is
      the same defect class the same round closed one module over, with a
      witness already written down, left open in the module that round added,
      and because the file's own stated rule is that the gate must account for
      what the client will open rather than for a hostname.

  - id: CR5-M3P12-04
    severity: medium
    evidence:
      - "test/application/fake-import-world.ts:458 routes every insert of applyRuleWrites through upsertRule."
      - "upsertRule at test/application/fake-import-world.ts:467 to :497 is an UPSERT: on an existing (household, kind, pattern) it repoints that rule's merchantId and returns, adding no row."
      - "The adapter it stands in for issues tx.merchantRule.create at src/modules/merchants/adapters/merchant-repository.ts:198, which under @@unique([householdId, kind, pattern]) in prisma/schema/merchants.prisma rejects that same submission."
      - "The fake models that constraint on the UPDATE path and says why, at test/application/fake-import-world.ts:396 to :414: \"A fake that is weaker than its subject reports safe by construction.\" The insert path does not model it."
      - "Criteria 12.7, 12.8 and 12.9 are all measured against this fake, per the work history's own deviation at delivery/work-history/m3-p12.yaml:993."
    concrete-fix: >-
      Make the fake's insert path behave like a create rather than an upsert:
      on an existing (householdId, kind, pattern) throw the same unique
      constraint error test/application/fake-import-world.ts:411 already
      throws, and keep the ownership check. The tenancy wording the adapter
      uses should stay.
    analysis: >-
      Latent rather than live, and this lane checked which. The routine cannot
      submit a colliding insert today: pass two consults claimant at
      src/modules/merchants/application/rederive-rules.ts:613 against working,
      which carries the pending inserts, so a collision becomes either a
      conflict or a skip before an insert is queued. It is recorded because
      this is the THIRD round in which the seam between this fake and this
      adapter produced a finding, in alternating directions: CR2-M3P12-02 with
      the fake weaker on the unique key, CR4-M3P12-03 with the fake stricter
      on tenancy, and now the fake weaker again on the same unique key, one
      method along. Three findings on one seam is a structural signal, not
      three accidents.

  - id: CR5-M3P12-05
    severity: medium
    evidence:
      - "Fleet warning 22 and the implementer's own disclosure state that npm run dev and npx next start resolve the ambient DATABASE_URL with no refusal, deliberately."
      - "src/platform/config.ts:106 reads process.env.DATABASE_URL directly and src/platform/db/client.ts:25 constructs new PrismaClient() from it, with no gate on either path."
      - "In this container that value is a deployed pooler belonging to a different project with a working password (fleet warnings 1 and 16), and the app writes to it on sign-up and on import, not only reads."
    concrete-fix: >-
      Refuse in DEVELOPMENT only, which costs the deployed app nothing. Where
      isProduction() is false (src/platform/config.ts:47) and DATABASE_URL was
      not named by a source that exists to name it, refuse to construct the
      client, with the same no-value-printed refusal
      src/platform/db/gate-target.ts already uses. A deployed app is
      NODE_ENV=production and is untouched. If even that is judged too much,
      print the resolved HOST once at dev-server start, so a lane can see
      which database it just opened.
    analysis: >-
      The disclosure's reasoning is right as far as it goes: a deployed app
      must open a deployed database and a local-only refusal there would be
      wrong. But the line is drawn at "the app" rather than at "production",
      and production is where the reasoning actually applies. As drawn, every
      test, gate and script in this repository now refuses a database nobody
      named while the one surface a person is most likely to run by hand
      opens a stranger's database silently and writes to it. This lands
      outside every criterion of M3-P12 and should not by itself force
      another round on this phase; it is recorded so it is owed by something
      rather than by the warning list.

  - id: CR5-M3P12-06
    severity: medium
    evidence:
      - "Fleet warning 23 and the implementer's disclosure name transferLink.createMany and transaction.createMany as the two paths that write householdId without verifying the ids they reference."
      - "A third path of the same shape is not named: src/modules/ledger/adapters/ledger-repository.ts:212 to :220 issues tx.transaction.updateMany with a householdId filter in its WHERE and data: { merchantId }, and nothing verifies that merchantId belongs to the household."
      - "That is the INTERPRETATION column this whole phase moves, written by the recompute the re-derivation itself invokes."
      - "The disclosure is also imprecise in the other direction: at src/modules/import/adapters/import-repository.ts:355 to :373 the importId that transaction.createMany references IS verified in the same transaction, by the claim updateMany whose count must be exactly 1; it is accountId that is unverified there."
    concrete-fix: >-
      Correct the disclosure to name three paths and to say which reference is
      unverified on each: transferLink.createMany (both transaction ids and
      the settlement import id), transaction.createMany (accountId, not
      importId), and transaction.updateMany's merchantId. Then close them the
      way applyRuleWrites was closed: one household-filtered findMany over the
      distinct referenced ids inside the same transaction, before the write.
      That is a handful of lines per site and needs no migration, unlike the
      composite foreign key the disclosure says nobody owns.
    analysis: >-
      The disclosure asked to be checked rather than believed, so it was. The
      claim that both are unreachable today holds: each derives its ids from
      household-scoped reads in the same call. The claim that there are two of
      them does not.

  - id: CR5-M3P12-07
    severity: low
    evidence:
      - "src/platform/db/gate-target.ts:57 to :61 states that the anon key and the service role key \"travel with the pin because an anon key issued by one project is meaningless against another, so carrying a pinned URL beside an ambient key would produce a failure that looks like a product defect\"."
      - "They travel only when the naming source carries them: src/platform/db/gate-target.ts:148 to :153 assigns a variable only where the candidate defines it, and neither key is in REQUIRED_ENDPOINTS at :76 to :80."
      - "So a PULSE_GATE_* pin naming only the three endpoints leaves an ambient, possibly foreign, NEXT_PUBLIC_SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY in process.env, which is the mixture the comment says it prevents."
      - "test/e2e/auth.spec.ts:78 constructs a service-role admin client from those two variables and creates a user with it."
    concrete-fix: >-
      Either make the two keys required alongside the three endpoints, so a
      half-named pin refuses the way a half-named endpoint set already does at
      src/platform/db/gate-target.ts:131 to :138; or DELETE the assigned value
      of any pinned variable the naming source does not carry, so an ambient
      key cannot survive beside a pinned URL. Whichever is chosen, the comment
      should describe it.
    analysis: >-
      Fail-safe rather than dangerous: NEXT_PUBLIC_SUPABASE_URL is required
      and required-local, so an ambient foreign key is used against a local
      API and simply fails. Low because the consequence is a confusing test
      failure and not a write to a stranger's database, which is exactly the
      consequence the comment predicts and then does not prevent.

  - id: CR5-M3P12-08
    severity: low
    evidence:
      - "test/db/gate-target.test.ts:274 is named \"no test constructs a Prisma client without a guard beside it\" and is introduced at :271 to :273 as \"THE STANDING ANSWER to 'can anything still reach a database nobody named'. Every direct client construction outside src/ must be in a file that guards itself.\""
      - "Its body reads one hard-coded file, test/e2e/merchant-rule-write.spec.ts, at :275 to :279. It scans nothing."
      - "A second spec constructing a client would not redden it. The tree-wide fact is currently true: grep over test/, scripts/ and src/ finds one direct construction outside src/, at test/e2e/merchant-rule-write.spec.ts:64."
      - "It also does not cover a Supabase client. test/e2e/auth.spec.ts:78 constructs a service-role admin client from process.env and writes with it, and no assertion in that describe block covers it."
    concrete-fix: >-
      Make the assertion do what its name says: read every file under test/
      and scripts/, and fail on any occurrence of new PrismaClient or of
      createClient with a service role key in a file that does not also
      contain assertGateDbTargetIsLocal. The existing single-file assertions
      can stay beside it as the specific pins they are.
    analysis: >-
      The test's name states a universal that its body does not check, which
      is a claim in a test name that is false about the mechanism even though
      it is true about today's tree. Low, because the fact holds today and the
      config's own enforcement covers the runs that matter.

  - id: CR5-M3P12-09
    severity: low
    evidence:
      - "Executed by this lane against the shipped predicate: assessRederiveTarget REFUSES postgresql://postgres.<ref>:pw@<pooler host>/postgres, a connection string naming no port, both with no --expect-port and with --expect-port 5432."
      - "The first refusal reads \"the resolved connection uses a port this product's own connection strings never use, and none was given on the command line ... Pass --expect-port to name it deliberately\", and the advice cannot work: parsed.port is the empty string at src/platform/db/target-guard.ts:239 and the exact comparison at :241 refuses every value an operator could pass."
      - "So the shape is unapprovable and the refusal text tells the operator to try something that will refuse again."
    concrete-fix: >-
      Treat an absent port as the connector's default of 5432, at
      src/platform/db/target-guard.ts:239: read the port as parsed.port === ""
      ? "5432" : parsed.port, and compare that. It keeps the refusal fail
      closed for a genuinely unknown port and makes --expect-port able to
      rescue a portless string. If the shape is meant to be refused outright,
      say so in the reason and drop the advice.
    analysis: >-
      Low and probably never hit: every deployed connection string this
      product uses names a port. Recorded because it is a user-facing sentence
      that is false about the program that prints it.

  - id: CR5-M3P12-10
    severity: low
    evidence:
      - "test/domain/counterparty-identity-contracts.test.ts:161 and :164 pin two exact wordings, /Exact match on normalised counterparty string, from MerchantRule/ and /[Ee]xact match on the normalised counterparty string/."
      - "The phrase criterion 12.19 asks be gone still occurs once, at .claude/skills/pulse-domain/SKILL.md:129, inside an explicit quotation of what the document used to say and immediately negated."
      - "That surviving occurrence differs from both regexes by one word, which is why it passes; a reintroduction phrased the same way would also pass."
    concrete-fix: >-
      Assert the claim rather than two spellings of it. Fail if any sentence
      of the resolution chain section says the key is the normalised
      counterparty string, by scoping the check to the section and refusing
      the phrase "normalised counterparty string" there except where the line
      also carries the word "used to".
    analysis: >-
      Criterion 12.19 is met: a reader of the amended section is not misled,
      and the account basis and the PREFIX and PATTERN sentence are both in
      the chain. The finding is about the pin, not the document.

  - id: CR5-M3P12-11
    severity: low
    evidence:
      - "src/modules/merchants/application/rederive-rules.ts:614 handles a pass-two collision whose claimant carries the SAME merchant by falling through: no insert is queued and rulesAdded is not incremented."
      - "The decision it then pushes at :661 to :666 is outcome \"promoted\" or \"promoted-on-one-row\", the same tokens a run that actually added a rule prints."
      - "So the report tells the operator a rule was promoted on a run where none was added, and criterion 12.7 requires that report to be what the owner reads."
    concrete-fix: >-
      Give the case its own outcome token, in the shape the codebase already
      uses for the pass-one twin: something like
      "account-rule-already-held-by-same-merchant", counted separately and
      printed by scripts/rederive-merchant-rules.ts beside the other tokens.
      Criterion 12.8's byte-for-byte report comparison is unaffected, since
      the token is stable across runs.
    analysis: >-
      Small and honest to fix. It is the same distinction hazard finding
      HZ-M3P12-06 already bought one level up, where a promotion backed by one
      row was given its own token rather than being folded into "promoted".
