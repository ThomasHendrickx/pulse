criteria-walk:
  note: >-
    Every criterion of M3-P12 walked in order. The count is not inherited from
    round four. Evidence is a path with a line number, a captured command, or
    a count this lane produced. Where a criterion could only be evaluated from
    the work history because its subject is a document this repository must
    not contain, that is said rather than counted silently as met.

  - id: "12.1"
    criterion: CONVERGENCE, COUNTED.
    verdict: met
    evidence: >-
      test/domain/counterparty-identity.test.ts:72 asserts identity keys 12
      and baseline keys 24 over the fixture parsed through the shipped path,
      and prints both beside the row count. Run by this lane: the captured
      stdout line is "fixture rows 24, identity keys 12, baseline keys 24".
      The composition assertion is at test/domain/counterparty-identity.test.ts:89
      and printed "account-basis rows 16 over 4 accounts, descriptor-basis
      rows 8". The committed harness reproduces the same figures
      independently: this lane ran the harness over the fixture and captured
      rows 24, rows-with-account 18, baseline-distinct-keys 24,
      identity-distinct-keys 12, identity-account-keys 4,
      identity-descriptor-keys 8, identity-rows-account-basis 16,
      identity-rows-descriptor-basis 8.
    plan-defect: >-
      THE COMPOSITION CLAUSE'S ARITHMETIC IS FALSE, and it is the plan's
      defect and not the implementation's. The criterion asserts that "the 24
      rows and 12 counterparties this criterion also pins force the
      descriptor-basis count to exactly 8". They do not. With 24 rows, 12
      counterparties, at least 8 account-basis rows over at least 4 accounts
      and at least 8 descriptor-basis rows, a fixture of 4 account
      counterparties at 2 rows each and 8 descriptor counterparties at 2 rows
      each satisfies every pinned number and has 16 descriptor-basis rows.
      The shipped fixture is 16 account-basis rows and 8 descriptor-basis
      rows, which also satisfies every pinned number. So the sentence claiming
      the threshold and the arithmetic are one requirement replaced an earlier
      wrong clause with a wrong derivation. The implementation is not affected
      either way; the criterion should drop the derivation or pin the split
      directly. Attributed to the plan.

  - id: "12.2"
    criterion: CONVERGENCE ON THE OWNER'S OWN MONTH.
    verdict: met-on-recorded-evidence-not-independently-reproducible
    evidence: >-
      The work history records, at delivery/work-history/m3-p12.yaml:608
      onward, the command naming the COMMITTED harness path
      (test/fixtures/measure-identity-convergence.ts) and every figure the
      criterion pins: rows 39, baseline-distinct-keys 25,
      identity-distinct-keys 20, identity-account-keys 6 against a baseline of
      11, identity-descriptor-keys 14 against a baseline of 14; and for the
      card document rows 22 with 16 identity keys unchanged from a baseline
      of 16. The numbers are internally consistent (11 account-basis rows plus
      28 descriptor-basis rows is 39) and none is below its floor.
    what-this-lane-could-not-reach: >-
      The two real documents are deliberately not in the repository, so this
      lane cannot re-run the measurement against them and does not claim to
      have. What it CAN and did check is that the harness the command names is
      committed and runnable: run over test/fixtures/belfius-counterparty-identity.pdf
      and test/fixtures/kbc-statement-a.pdf it exits 0 and prints counts only,
      and its fixture figures reproduce the work history's recorded fixture
      figures exactly. Hazard H12.23, that the headline numbers are recorded
      against a harness nobody else can run, is therefore closed even though
      the numbers themselves rest on the implementer's run.

  - id: "12.3"
