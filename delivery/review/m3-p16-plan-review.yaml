kind: finding
verdict: FIX-ROUND-NEEDED
produced-by: claude-opus-5
findings:
  - id: PR-M3P16-01
    severity: high
    analysis: |-
      CRITERION 16.3 CANNOT BE MET BY OBSERVATION, SO THE SPLIT HAS REPRODUCED
      THE DEFECT IT WAS CREATED TO FIX, ONE PHASE LATER AND IN A FORM THAT
      PASSES INSTEAD OF FAILING. The criterion's whole claim is that D-46's
      order becomes "a checked fact" because the record "names the deployed
      commit the routine ran against". Nothing in the phase, and nothing in this
      repository, lets an implementer determine which commit the deployment is
      serving.

      Three instruments were looked for and none exists. The application exposes
      no build stamp: there is no route, no header and no log line carrying a
      commit sha anywhere in the tree. The deployment platform is not readable
      from the fleet: this project's own work history records the probe and its
      exit condition. And there is no deploy or release hook to leave a record,
      which decision D-46 states itself as the reason package.json gains the
      script at all.

      THE IMPLEMENTATION THAT SATISFIES EVERY WORD AND IS STILL WRONG, which is
      what this review is for. The implementer runs git rev-parse origin/main,
      writes that sha into the record as "the deployed commit", runs git
      cat-file against it to show it carries counterpartyIdentity and the
      script, and runs the routine. Criterion 16.3 is satisfied to the letter:
      the record names a commit, and shows before the run that the commit
      carries both. It proves nothing. If the deployment is lagging main, if the
      last build failed, or if the project deploys a branch rather than main,
      the routine has just rewritten the owner's stored patterns under a matcher
      still computing the old keys, which is hazard H16.4 and the one order D-46
      forbids. The criterion's own last sentence, "a record that cannot say
      which build the routine ran against does not meet this criterion", is
      unreachable: every record CAN say a sha, and none can say it was observed.

      This also answers the entry-condition question. Step 1 states the stop
      condition in operational form and in capitals, which is more than prose,
      so the condition is stated. It is the PREDICATE inside it that nothing can
      evaluate. A phase that starts when someone believes the deploy happened is
      not gated, and as written that is exactly what this is.
    evidence:
      - |-
        No build stamp exists anywhere in the tree. Run in the worktree over
        src, scripts, test and every config file, excluding node_modules and
        .next: grep for VERCEL_GIT_COMMIT_SHA, VERCEL_URL, commitSha, buildId,
        /api/version and deployed-commit returned ZERO hits. ls -a shows no
        .vercel directory and no vercel.json. The only routes under src/app/api
        are health/db and health/pdf, and neither returns a commit.
      - |-
        The platform is recorded as unreadable for THIS project, measured with
        an exit condition rather than assumed:
        delivery/work-history/m3-p2.yaml:1010 through :1013 states that the
        Vercel connector is scoped to three pre-pulse projects, that
        get_runtime_errors against the pulse project id returned 403, and that
        the deployed stack "was never read". Restated in
        delivery/work-history/m3-p2-notes.md:322 through :325.
      - |-
        The same round records the general form of the limit at
        delivery/work-history/m3-p2.yaml:1027 through :1030: what the deployed
        environment holds "is Vercel's packaging, which this fleet cannot
        observe or test".
      - |-
        There is no deploy or release hook to leave a record. Decision D-46
        states this itself, and package.json at main confirms it: the scripts
        are dev, build, start, typecheck, lint, gate:tokens, gate:privacy, test,
        test:e2e, db:reset and db:migrate, and nothing else.
      - |-
        The precedent the project ALREADY adopted for exactly this problem is in
        the tree: src/app/api/health/db/route.ts, whose header records that the
        route exists because "the fleet cannot read Vercel function logs", and
        delivery/work-history/m3-p2.yaml:1015 through :1019, which says the
        health probe "makes the deployed state directly observable after the
        next deploy". The same mechanism reaches the commit sha and is not used.
    concrete-edit: |-
      Name the instrument, in both phases, rather than leaving the predicate to
      the implementer. In delivery/plan/pulse-v02.yaml add to M3-P12's
      files-to-touch a route under src/app/api/health that returns the value of
      VERCEL_GIT_COMMIT_SHA and nothing else, no auth and no other field,
      following the precedent already in the tree at
      src/app/api/health/db/route.ts, and add one sentence to criterion 12.17
      requiring it and a test that reads it. Then replace criterion 16.3's first
      sentence with: "The record carries the response that build-stamp route
      returned FROM THE DEPLOYED ORIGIN, captured before the run, the commit sha
      it named, and the output of git cat-file against that sha showing the
      commit carries counterpartyIdentity and
      scripts/rederive-merchant-rules.ts." Add as its own sentence: "A sha taken
      from git rev-parse, from origin/main or from any local ref does not meet
      this criterion, because none of them observes what the deployment is
      serving." If the route is judged out of M3-P12's reach, the fallback that
      must then be written into 16.3 instead is: "the record carries the Vercel
      deployment id, its commit sha and its ready timestamp AS SUPPLIED BY THE
      OWNER, marked owner-supplied, because this fleet cannot read them (probe
      recorded at delivery/work-history/m3-p2.yaml:1010)". Either way the
      criterion must name where the sha came from, since that is the only thing
      separating an observation from an assumption.
  - id: PR-M3P16-02
    severity: high
    analysis: |-
      CRITERION 16.2's ESCAPE HATCH IS NOT BOUNDED, BECAUSE THE WHOLE CLAUSE IS
      CONDITIONED ON AN EXIT CODE THE IMPLEMENTER CONTROLS. Every requirement
      about --accept sits behind "Where the routine exited non-zero". The
      routine parses --accept unconditionally from argv on any invocation,
      including the first, and there is no first-run guard in the script and
      none in the criterion.

      THE IMPLEMENTATION THAT SATISFIES EVERY WORD AND IS STILL WRONG. The
      implementer runs the routine with --dry-run, reads the blocking condition
      and the rule ids it prints, then runs it for real with --accept naming
      those ids and records THAT invocation as "the run". It exits 0. The record
      reads: command, pinned pooler, exit 0, before size, after size, "the exit
      was 0 and here is the captured line". Criterion 16.2's non-zero branch
      never fires, so nothing requires the blocking condition to be named,
      nothing requires the ids to be listed, and nothing requires the owner to
      have seen anything. A merchant conflict or a lost assignment has been
      waved through with a flag nobody read, which is hazard H16.3 stated
      verbatim, and H16.3 is the class 16.2 is declared to address. The
      criterion's own guard against this, "a rerun with --accept naming an id
      nobody read does not meet this criterion", assumes there was a recorded
      first run that failed. Nothing requires one.

      WHO "THE OWNER SAW" IS CHECKABLE BY: nobody. It is a self-attestation
      written by the same implementer whose phase closes on it, and 16.2
      requires no artefact of the exchange at all, not a quoted reply, not a
      dated entry, not a reference of any kind. That is a weaker bar than the
      same plan sets for far less consequential things, and this is the one path
      in the phase that deliberately damages a declaration the owner made
      against the owner's live database. Note that asking here is legitimate
      under DR-0029 and is not the problem: a blocking condition is exactly the
      case where the two answers produce different data the owner would live
      with. The problem is that the asking leaves no trace the criterion checks.
    evidence:
      - |-
        The flag is parsed with no first-run guard:
        scripts/rederive-merchant-rules.ts at
        origin/claude/m3-p12-counterparty-identity, the argument() helper
        scanning process.argv and the accepted binding built from
        argument("accept"), both reached before any invocation of
        rederiveMerchantRules and independent of any prior run.
      - |-
        --dry-run is available on the same command line, so the ids can be
        learned without any recorded failing run. The script's own usage line
        carries all three flags together: npm run rederive:merchant-rules --
        --household <id> [--accept <ruleId,...>] [--dry-run].
      - |-
        Criterion 16.2's second sentence begins "Where the routine exited
        non-zero", and every obligation about naming the condition, listing the
        ids and the owner's acceptance is inside that conditional. The third
        sentence, "Where the exit was 0 the record says so with the captured
        line", is the entire alternative branch and asks for nothing else.
      - |-
        The hazard it is declared to close is stated in the same phase and is
        not closed: H16.3 reads "A blocking exit is cleared with the acknowledge
        flag rather than read", addressed-by criterion 16.2.
      - |-
        The routine's own contract asserts the property the criterion fails to
        enforce, which is why the gap is invisible on a reading of either alone:
        the script header states that --accept "only marks a blocking condition
        as seen by a person". On a first invocation no person has seen anything,
        and nothing in the code or the criterion notices the difference.
    concrete-edit: |-
      Key criterion 16.2 on the FLAG rather than on the exit code. In
      delivery/plan/pulse-v02.yaml replace 16.2's second sentence with: "Where
      --accept appears in ANY invocation of the routine, including a dry run,
      the record names every rule id it carried, the blocking condition each id
      was reported under BY AN INVOCATION MADE WITHOUT --accept, the exit code
      of that unaccepted invocation, and the owner's acceptance of each id by
      reference to a dated entry in the phase work history carrying the rule ids
      and nothing else." Add as its own sentence: "A record whose only reported
      invocation carried --accept does not meet this criterion, whatever its
      exit code." Add the matching sentence to step 3 so the order is instructed
      and not only judged: "The first invocation against the deployed database
      is made WITHOUT --accept, and its exit code is recorded before any
      accepted rerun is considered."
  - id: PR-M3P16-03
    severity: high
    analysis: |-
      THE SPLIT SILENTLY WEAKENED M3-P12: HAZARD CLASS H12.20 STILL RESOLVES TO
      CRITERION 12.17, WHICH NO LONGER COVERS HALF OF WHAT H12.20 STATES.
      H12.20's statement carries two harms joined by "so": the routine is
      shipped with nowhere to run from, AND the migration is described rather
      than performed and criterion 12.7's exit code is observed by nobody. The
      amendment moved the deployed run out of 12.17 and left H12.20 untouched,
      pointing at a criterion that now guards only the first harm.

      WHY THIS IS NOT BOOKKEEPING. M3-P12 is reviewed under two contracts and
      the second one is the hazard contract, whose reviewer walks the plan
      phase's declared hazard classes one by one and records, per class, either
      a finding or a cleared-because statement. That reviewer reads H12.20,
      follows addressed-by to criterion 12.17, finds the package.json script and
      the test that reads it, and clears the class. The class is then recorded
      as addressed while its stated harm, the migration being described rather
      than performed, is precisely the thing M3-P12 can no longer prevent and no
      longer points anywhere. Nothing in H12.20 mentions M3-P16, so the reviewer
      has no way to know the guard left the building. The tooling cannot catch
      it either: the Kind B check verdict-hazard-classes-addressed compares the
      verdict's class list against the plan's class list, so a class that IS
      walked and IS cleared passes regardless of whether the criterion it names
      still covers it.

      The coverage does exist. M3-P16's own hazard class H16.1 restates the
