  - id: PR-M3P16-04
    severity: high
    analysis: |-
      NO CRITERION IN M3-P16 FORCES EVIDENCE THAT COULD NOT HAVE BEEN WRITTEN
      FROM IMAGINATION, AND CRITERION 16.4 IS WHAT MAKES THAT TRUE. This is the
      answer to the question the phase has to survive, and it is stated plainly
      because a hedge here is worth nothing.

      Walk the four. 16.1 asks for a command, a pinned connection, an exit code
      and two sizes, "every number read off the run's captured output". 16.2
      asks for a comparison between two of those numbers and, on the branch that
      fires, some ids. 16.3 asks for a commit sha, which finding PR-M3P16-01
      shows nothing can check. 16.4 asks that gate:privacy exit 0 and that the
      record carry no content. Of those, exactly one clause is a real command
      with a real exit code on a real artefact: gate:privacy in 16.4. It
      certifies the ABSENCE of the owner's data. It says nothing about whether
      the run occurred.

      AND THE PHASE FORBIDS ITS OWN EVIDENCE FROM REACHING THE REPOSITORY.
      16.4's last sentence: "The captured output of the run is not committed."
      That instruction is correct on its own terms, since a stored pattern is
      derived from a real statement's text and this repository is public. Its
      consequence is that the only artefact 16.1's numbers are read off never
      leaves the ephemeral container, and the phase's entire committed output is
      a prose work history plus a branch. 16.1's distinction between a number
      captured and a number typed therefore has no residue anywhere: after the
      fact the two records are byte-identical, which is the exact property
      16.1's own last sentence says disqualifies a record, and which the phase
      guarantees by construction.

      THE IMPLEMENTATION THAT SATISFIES EVERY WORD AND IS STILL WRONG is trivial
      and needs no adversary: an implementer who cannot reach the deployed
      pooler at all, or who reaches it and the run fails, writes a plausible
      before size, a plausible after size that is larger, exit 0, a sha from
      origin/main, and commits. Every criterion is met. gate:privacy passes,
      because invented counts look exactly like measured ones, which fleet
      warning 12 and CLAUDE.md non-negotiable 8 both say in as many words.
      Nothing in the tree, now or later, can contradict the record.

      THE PHASE IS RESCUABLE AND SHOULD BE RESCUED RATHER THAN DELETED. Two
      instruments are inside its reach, cost nothing, break no rule, and are
      counts-only. First, RESIDUE THAT OUTLIVES THE CONTAINER: the deployed
      database's own state is a fact anyone with the same pinned pooler can
      re-measure at any later date, so a count taken from it by a named
      read-only query is falsifiable by a second party in a way a printed line
      is not. Second, IDEMPOTENCE: decision D-45's pass one leaves an
      already-namespaced rule alone and counts it as already-migrated, so a
      SECOND invocation after a successful first one must report zero patterns
      rewritten and zero rules added. That is a check on the routine's actual
      semantics rather than on the implementer's arithmetic, and inventing a
      consistent pair of runs is materially harder than inventing one.
    evidence:
      - |-
        Criterion 16.4's last sentence forbids committing the captured output:
        "The captured output of the run is not committed, because a stored
        pattern is derived from a real statement's text and this repository is
        public."
      - |-
        The phase commits no other artefact. files-to-touch carries exactly one
        entry, scripts/rederive-merchant-rules.ts, annotated "executed at the
        deployed head, never modified: this phase runs the committed routine and
        changes no source file"; extras is empty; migrations declares no DDL and
        no schema change.
      - |-
        Criterion 16.1 rests the whole distinction on an artefact that never
        arrives: "every number read off the run's captured output", and "one
        whose numbers are typed rather than captured" fails. After the container
        is gone the two records are indistinguishable.
      - |-
        The gate cannot separate an invented count from a measured one and says
        so itself: fleet warning 12, and CLAUDE.md non-negotiable 8, which
        states that a merchant name, a place name or an amount sitting inside a
        file "is invisible to it, because those look exactly like invented
        ones". Confirmed live on this branch: npm run gate:privacy printed
        "gate:privacy clean" and exited 0 over a tree carrying no measurement at
        all.
      - |-
        The idempotence property the fix leans on is already fixed by decision
        D-45 in this same plan: pass one rewrites "every rule whose pattern does
        not ALREADY begin with a known namespace; one that does is left alone
        and counted as already-migrated".
    concrete-edit: |-
      Give criterion 16.1 a second instrument and a residue. In
      delivery/plan/pulse-v02.yaml append to criterion 16.1: "The record also
      carries two things no later reader has to take on trust. FIRST, measured
      by a read-only query this phase NAMES in the work history and that anyone
      holding the same pinned session pooler can re-run at any later date: the
      number of merchant_rules rows in the household whose pattern begins with a
      known namespace and the number that do not, taken before the run and again
      after it, counts only. SECOND, the counts a SECOND invocation of the
      routine reports immediately after the first, which by decision D-45's
      already-migrated guard must be zero patterns rewritten and zero rules
      added; the record carries that second invocation's exit code and those two
      zeroes. A record carrying only the numbers the first run printed does not
      meet this criterion, because the captured output is not committed and
      nothing that does reach this repository can contradict it." Amend step 2,
      which currently says "Run the routine ONCE", to add that a second
      invocation follows as a read-only idempotence check and is not a second
      migration.
  - id: PR-M3P16-05
    severity: medium
    analysis: |-
      CRITERION 12.1's NEW WORDING IS CORRECT AND ITS ONLY STATED REASON CITES
      THE WRONG STEP. The reworded clause is right on the substance: it counts
      the descriptor BASIS rather than an absent field, which is what
      CR-M3P12-07 asked for and what the measured composition supports, and it
      preserves both prohibitions the original carried, a count printed without
      its row count and a baseline below 24, verbatim in the final sentence. So
      the defect the amendment was written to repair IS repaired.

      What is wrong is the citation the criterion leans its whole argument on.
      The new text says "the criterion says why rather than leaving the reading
      to chance: step 7 requires this same fixture to carry the rows that attack
      the account basis". M3-P12 has twelve steps and the step that builds the
      fixture is step 10. Step 7 is decision D-45's reversibility and broadening
      lines and carries no fixture requirement of any kind. An implementer who
      follows the pointer to settle the reading lands on a step about printed
      per-rule counts and learns nothing, and the criterion's defence against
      the strict reading, which is the entire purpose of the added sentence,
      does not resolve. The error originates in the clean-room review, whose
      CR-M3P12-07 and 12.1 walk both say "plan step 7"; the amendment copied it
      out of a finding and into normative plan text, which is where it now
      binds.

      A second, smaller looseness in the same sentence: it says this criterion's
      arithmetic "fixes the descriptor-basis count at exactly 8" while the
      requirement it justifies says "at least 8". Both are true given the 24
      rows and 12 counterparties the criterion also pins, but a reader meeting
      exactly and at least in one sentence has to derive that for themselves.
    evidence:
      - |-
        Enumerated from the plan under review: M3-P12 carries 12 steps. Step 10
        is the one that begins "Build the fixture the convergence criteria are
        measured on, wholly invented, and generate it through the committed
        generator" and is the only step that mentions the rows that attack the
        account basis. Step 7 begins "Make the run reversible and the broadening
        visible (decision D-45 ...)".
      - |-
        The numbering is identical on the implementation branch, so this is not
        a version skew: the M3-P12 phase at
        origin/claude/m3-p12-counterparty-identity also carries 12 steps with
        the fixture at 10 and D-45 at 7.
      - |-
        The error's origin, carried into the amendment: CR-M3P12-07's analysis
        on origin/claude/m3-p12-rev-crit says "the criterion collides with plan
        step 7, which requires the SAME fixture to carry the two
        truncation-attack rows", and the 12.1 criteria walk repeats it.
      - |-
        The substance of the rewording is supported by measurement, so only the
        citation is at fault: the criteria review's independent run of
        test/fixtures/measure-identity-convergence.ts over the committed fixture
        printed rows 24, identity-rows-account-basis 16 over 4 accounts,
        identity-rows-descriptor-basis 8, rows-with-account 18. Both new
        thresholds hold and the original prohibitions are preserved word for
        word.
    concrete-edit: |-
      In delivery/plan/pulse-v02.yaml, criterion 12.1, replace "step 7 requires
      this same fixture to carry the rows that attack the account basis" with
      "step 10, the step that builds this fixture, requires it to carry the rows
      that attack the account basis". In the same sentence replace "while this
      criterion's own arithmetic fixes the descriptor-basis count at exactly 8"
      with "while the 24 rows and 12 counterparties this criterion also pins
      force the descriptor-basis count to exactly 8, so the at-least-8 threshold
      and the exactly-8 arithmetic are one requirement and not two".
  - id: PR-M3P16-06
    severity: low
    analysis: |-
      THE PHASE'S OWN STOP CONDITION PRODUCES A STATE NO CRITERION ADMITS. Step
      1 is emphatic and correct: "IF THE DEPLOYED HEAD DOES NOT CARRY THE
      DERIVATION, THE PHASE STOPS HERE AND SAYS SO". An implementer who obeys it
      has done exactly the right thing and has met none of the four acceptance
      criteria: 16.1 requires the run to have happened, 16.2 compares sizes that
      do not exist, and 16.3's second half fails a run that was never made
      rather than describing a run correctly withheld. Only 16.4 can pass.

      The consequence is a small perverse incentive at the worst possible
      moment. The implementer who correctly declines to run faces a phase that
      cannot close, and the implementer who runs anyway faces a phase that can.
      That is the wrong way round for the one decision D-46 calls forced, and it
      is cheap to fix: the plan need only say what a correctly stopped phase
      looks like and that it is not a failure.
    evidence:
      - |-
        The stop condition, in M3-P16 step 1: "IF THE DEPLOYED HEAD DOES NOT
        CARRY THE DERIVATION, THE PHASE STOPS HERE AND SAYS SO: running the
        routine against a build without it is the one order D-46 forbids".
      - |-
        No criterion describes that outcome. 16.1's opening clause is "THE RUN
        HAPPENED, AGAINST THE DEPLOYED DATABASE"; 16.2 requires a recorded after
        size and a recorded before size; 16.3 closes on "a run made against a
        build that does not carry the derivation fails the phase rather than
        qualifying it", which covers a run that was WRONGLY made and not one
        rightly withheld.
      - |-
        The phase carries no other outlet: extras is empty and files-to-touch
        names only the unmodified routine, so a stopped phase's whole output is
        a work history no criterion measures.
    concrete-edit: |-
      Append one sentence to criterion 16.1 in delivery/plan/pulse-v02.yaml:
      "WHERE STEP 1's STOP CONDITION FIRES, this criterion is met instead by a
      record that names the deployed commit and the instrument that named it,
      shows that commit lacks counterpartyIdentity or the script, states that no
      invocation of the routine was made against any database, and records the
      phase as BLOCKED ON THE DEPLOY rather than met or failed; criteria 16.2
      and 16.3 do not apply to such a record and 16.4 does."
