deviations-judged:
  - deviation: "branch: claude/m3-p4-mobile-import"
    serves-plan-intent: true
    reasoning: >-
      The branch name is a delivery vehicle, not part of the phase's intent.
      The reviewed commits sit directly on 03625ee (git log shows 787055b,
      fdedf35, be990d3 on top of it) and the phase content does not depend on
      the name. No conflict declared in the plan (M3-P9 runs strictly before)
      turns on the branch name.
  - deviation: "files-to-touch (styles/tokens.css named; src/app/globals.css not named)"
    serves-plan-intent: true
    reasoning: >-
      The import screens' rules are in src/app/globals.css, so step 2's
      responsive layout could only land there. Every added value is a token
      (var(--tap-target-min), var(--text-base)), --tap-target-min already
      exists at styles/tokens.css:158, the colour grep over src/ exits 1, and
      grep -c "@media" src/app/globals.css prints 1, so no new media
      condition was introduced. This is the token-only styling step 2 asks
      for.
  - deviation: "files-to-touch (test/e2e/ (mobile import spec))"
    serves-plan-intent: true
    reasoning: >-
      All three extra files are under the declared test/e2e/ directory. The
      move of collectTestids and collectHiding into test/e2e/phone-helpers.ts
      is, on reading the diff, the same bodies with export added, and it
      makes the new spec measure with the month view's instruments, which is
      what "the three standing phone measurements M3-P7 introduced" asks. The
      enumeration change in test/e2e/pressed-and-disabled.spec.ts:113 and
      :114 re-keys the same two controls and does not narrow the sweep; the
      red run it answers (e2e-full.txt, four failures, all "the swept control
      set is not the enumeration", the diff showing exactly the two re-keyed
      links) confirms that reading.
  - deviation: "files-to-touch (src/app/layout.tsx, messages/en.json, messages/nl.json, messages/fr.json)"
    serves-plan-intent: true
    reasoning: >-
      Declared but untouched: git diff --name-only 03625ee be990d3 over
      src/app/layout.tsx, messages and styles prints nothing. Step 2 asks the
      viewport meta be "verified present or added"; no file under src/
      declares one (the grep the work history quotes exits 1 here too), and
      the phone project's innerWidth guard at
      test/e2e/mobile-import.spec.ts:117 passing under isMobile is executable
      evidence that a meta viewport is served. No user-facing copy was added,
      so no catalogue entry was needed.
