      - >-
        git diff --stat be990d3 fdedf35 prints only
        delivery/work-history/m3-p4.yaml (253 lines), and be990d3's parent
        is fdedf35, so the green run covers the reviewed code.
      - >-
        Red half: evidenced only by prose in the work history (see
        CR-M3P4-03). The criterion's green half is fully evidenced.
