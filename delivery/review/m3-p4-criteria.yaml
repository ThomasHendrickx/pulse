findings:
  - id: CR-M3P4-01
    severity: medium
    evidence:
      - >-
        src/app/globals.css:408 and src/app/globals.css:409, added by this
        phase, state in the present tense "every control on the import
        screens clears the phone tap target, the file picker included". The
        rule it sits in (src/app/globals.css:398 to :411) reaches only
        .import-field input and .import-field select.
      - >-
        The confirmation screen this phase declares mobile-first renders
        controls that no rule sizes: the format-question branch's disclosure
        summary, styled at src/app/globals.css:496 with a small font and no
        min-height or padding; the class-less "preview again" SubmitButton at
        src/modules/import/ui/profile-confirmation.tsx:203 (submit-button.tsx
        forwards a className only when one is given,
        src/platform/ui/submit-button.tsx:142, and globals.css carries no
        element-level button min-height); the inline setup link on the
        unregistered-account branch at
        src/modules/import/ui/profile-confirmation.tsx:95; and the setup link
        in the status line at src/modules/import/ui/import-status-line.tsx:34.
        Each matches the INTERACTIVE selector of test/e2e/phone-helpers.ts:14.
      - >-
        None of these branches is measured at the phone width: the only
        phone measurement of the import screens is
        test/e2e/mobile-import.spec.ts:95, whose journey takes the recognised
        PDF path (no format question) and a registered account (no
        unregistered note). The unregistered branch is exercised only for
        visibility (test/e2e/accounts.spec.ts:432) and the format-question
        disclosure only for press and busy state
        (test/e2e/pressed-and-disabled.spec.ts:1454,
        test/e2e/busy-state.spec.ts:657), never for size.
      - >-
        The same false universal is in the commit message of 787055b ("Every
        control on the import, declaration, confirmation and result screens
        now clears the 44px phone tap target"), which cannot be corrected, so
        the comment is the place where the record has to be put right.
    concrete-fix: >-
      Either (a) make the claim true: give .spec-editor summary, the preview
      SubmitButton (a class such as .import-secondary) and the two inline
      setup links a --tap-target-min box, and extend
      test/e2e/mobile-import.spec.ts with a CSV upload that reaches the
      format question and an upload of a statement whose account is not
      registered, each run through measureScreen; or (b) narrow the comment
      at src/app/globals.css:408 to what the rule does ("the file picker and
      the text fields clear the phone tap target") and record the
      unmeasured branches as owed work in the work history. Shipped
      behaviour at risk: on a phone, the owner who uploads a statement for
      an unregistered account, or a CSV with an unknown layout, meets
      controls under 44px on the screen this phase declares phone-first, and
      the comment tells the next reader that cannot happen.
    analysis: >-
      Criterion 4.1 is met as written, because it names the synthetic-PDF
      journey's screens and those are measured and green. This is a clause
      R-087 finding against a present-tense comment the phase added, and it
      is ranked medium rather than low because the comment is false in the
      direction that hides a phone usability defect on exactly the surface
      the phase intent names ("the import and confirmation screens
      redesigned mobile-first"), and because the one realistic phone case
      among them (a PDF for an account not yet registered) is the owner's
      primary import path. The heights of the unmeasured controls were not
      measured by this review (Playwright was out of bounds); that they fall
      under 44px is inferred from the CSS cited, which gives them no box
      sizing at all.

  - id: CR-M3P4-02
    severity: low
    evidence:
      - >-
        src/app/globals.css:1590 still says "Four of them are bare
        anchors" and explains that the import result screen's two anchors
        needed no display rule because they are flex items of .import-screen.
        Since this phase those two anchors carry className="import-next"
        (src/modules/import/ui/import-result.tsx:37 and :70), whose rule at
        src/app/globals.css:424 declares display: inline-flex, so at
        be990d3 only two of the swept anchors are bare, and the enumeration
        at test/e2e/pressed-and-disabled.spec.ts:113 and :114 now keys them
        a.import-next.
      - >-
        Pre-existing and not this phase's doing, recorded so the same edit
        fixes it: the same comment cites .import-screen at
        src/app/globals.css:299, but .import-screen is declared at
        src/app/globals.css:339 at both 03625ee and be990d3.
    concrete-fix: >-
      Amend the comment above the element-level a rule
      (comment from src/app/globals.css:1580, rule at src/app/globals.css:1606) to say that two of the swept
      anchors are bare (the auth cross-links), that the import result
      screen's two links carry .import-next with their own inline-flex box
      since M3-P4, and correct the .import-screen citation to line 339.

  - id: CR-M3P4-03
    severity: low
    evidence:
      - >-
        delivery/work-history/m3-p4.yaml:101 to :107 claims the new spec
        fails on the pre-phase styles (two offenders on the import screen,
        a third on the result screens) and concludes "the spec fails on the
        pre-phase tree and is not vacuous". No command, exit code or
        captured output backs it, the claims section
        (delivery/work-history/m3-p4.yaml:200 to :227) carries no entry for
        it, and no witness record exists in the tree (find over the tree for
        witness-records*.json outside node_modules printed nothing).
      - >-
        The sentence is also internally loose: the offenders it lists were
        captured in two different states (the import screen before any
        style change, the result screen "after the form fix"), so no single
        run of the pre-phase tree is described, although the 787055b commit
        message restates it as "Before the style change it failed on three
        undersized controls".
    concrete-fix: >-
      Record the red run as evidence: check out 03625ee's src/app/globals.css
      and src/modules/import/ui/import-result.tsx under the new spec, run
      npx playwright test test/e2e/mobile-import.spec.ts --project
      chromium-phone, and add the captured exit code and the soft-assertion
      offender list to the work history as a claims entry (or a red-witness
      record), replacing the prose sentence.
    analysis: >-
      The claim is plausible from the diff (the base rule for the file input
      and the result links carried no min-height), so this is not a finding
      that the spec is vacuous. It is a finding that the only red half of
      criterion 4.1 in the record is an assertion a reader cannot resolve,
      which the clean-room checklist probe test-red-without-the-fix names as
      not accepted.

criteria:
  - id: "4.1"
    quote: >-
      STRENGTHENED in the M0-P3 fix round (finding MPR-007). ... npm run
      test:e2e exits 0 including the synthetic-PDF import journey run under
      the phone project M3-P7 added, asserting as before that
      document.documentElement.scrollWidth does not exceed the viewport
      width on the import, declaration, result and month screens; and at 390
      by 844 those same screens satisfy the three standing phone
      measurements M3-P7 introduced: every element matching "a, button,
      input:not([type=hidden]), select, [role=button]" inside main with a
      non-zero bounding box has a bounding height of at least 44 CSS pixels;
      the sorted collection of every data-testid paired with its trimmed
      textContent is deeply equal at 1280 by 720 and at 390 by 844, with
      every collected element non-zero in size at the phone width; and the
      clipping sweep of criterion 7.7 returns an empty offender list on both
      axes. FALSIFIED BY one offender in any of the three, or by the journey
      failing under the phone project.
    evidence:
      - >-
        playwright.config.ts:129 adds mobile-import to the chromium-phone
        project's testMatch (project declared at playwright.config.ts:104:
        Pixel 5, isMobile, hasTouch, viewport 390 by 844 at
        playwright.config.ts:109).
      - >-
        test/e2e/mobile-import.spec.ts:95 measures upload (:118),
        declaration (:131), card result (:140), confirmation (:156), account
        result (:163) and month (:171), each through measureScreen
        (test/e2e/mobile-import.spec.ts:51 to :93), which asserts
