      balance. Nothing accumulates across months and nothing is added to the
      accounts screen. D-60's substance survives. What does not survive is
      D-60's ENFORCEMENT. The amendment converts a decision that was
      protected by two live tests (witness TWO's no-amount assertion on the
      accounts screen, witness FIVE's balance-word test on the reserves card)
      into a decision protected, on the one surface the amendment newly puts
      money on, by a sentence. An implementer who renders 'held this month:
      X' above the three rows passes witness ONE (label, count, state words
      are all still there), witness TWO (wrong screen), witness THREE (rows
      still keyed individually), witness FIVE (the sum is inside the period,
