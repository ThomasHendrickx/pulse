findings:
  - id: M0P12-A-001
    severity: high
    evidence:
      - "delivery/plan/pulse-v02.yaml criterion 15.9, added text: 'the income total has fallen by exactly its interest credits, each of the two recorded before the correction and asserted again after it'."
      - "delivery/plan/pulse-v02.yaml criterion 15.9, UNCHANGED earlier text of the same journey: 'see that account named in month-accounts with data-state counted and its rows in the month's spend'. There is no counterpart clause asserting that anything of that account is in the month's INCOME before the correction."
      - "delivery/plan/pulse-v02.yaml criterion 15.9, added text: 'THIS HALF DEPENDS ON CRITERION 14.15 WITNESS SEVEN AND SAYS SO RATHER THAN LEAVING THE COUPLING IMPLICIT: the savings statement this journey uploads is the fixture witness SEVEN requires to carry an interest credit'. The dependency is NAMED and nothing asserts it."
      - "delivery/plan/pulse-v02.yaml criterion 14.15 witness SEVEN puts its fixture assertion inside M3-P14 ('an application test asserts the fixture holds one of each'). M3-P15 conflicts-with orders it strictly after M3-P14, so the fixture exists; nothing binds the M3-P15 journey to USE it."
      - "The repository already carries a savings-statement upload an implementer can reach for instead: test/e2e/month-view.spec.ts:1377, named in M3-P14 criterion 14.11 witness FOUR as 'the existing reserve upload'."
    concrete-edit: >-
      In criterion 15.9, after 'and its rows in the month's spend', add 'AND
      AT LEAST ONE CREDIT OF THAT ACCOUNT IN THE MONTH'S INCOME', and replace
      'the savings statement this journey uploads is the fixture witness
      SEVEN requires to carry an interest credit' with 'the savings statement
      this journey uploads is THE SAME FIXTURE FILE criterion 14.15 witness
      SEVEN pins, named by path in this spec, and the spec asserts the income
      recorded before the correction is STRICTLY GREATER than the income
      asserted after it, so a fixture carrying no credit makes this criterion
      RED rather than green'.
    analysis: >-
      This is the one clause of the amendment that can be satisfied while
      asserting nothing. The income half is written as a fall: income before,
      income after, both hand-written strings. If the M3-P15 implementer
      uploads any savings statement whose credits are absent, income before
      and income after are the same value, both strings are written by hand
      from the fixture's own arithmetic exactly as the criterion requires,
      and the assertion is green having measured nothing. The spend half
      cannot fail this way, because the journey separately asserts the
      account's rows are in the month's spend BEFORE the correction, so the
      fall it later asserts is known to be non-zero. The amendment gave the
      income half no such floor. Naming the coupling to witness SEVEN is not
      enough on its own: a named dependency is a sentence in a different
      phase's criterion, and the thing that would make it bite is an
      assertion in THIS spec that the movement it measures is real. The
      ordering is not the risk (conflicts-with already runs M3-P14 first);
      fixture identity is.
  - id: M0P12-A-002
    severity: high
    evidence:
      - "delivery/plan/pulse-v02.yaml criterion 14.15 witness SEVEN, added text: 'NO TOTAL AND NO ACCUMULATED FIGURE IS ADDED HERE. The amounts are per row, the entry carries no sum of them, the accounts screen carries neither, and nothing crosses the requested period, so witness TWO and decision D-60 are held rather than reopened.' The sentence states a boundary; no assertion in the criterion tests it."
      - "Witness SEVEN's own assertions are exactly two: 'an application test asserts the fixture holds one of each' and 'A Playwright test then asserts that each of the three renders UNDER THE HELD ENTRY ... AND ITS OWN AMOUNT'. Neither can go red on a rendered subtotal."
      - "Witness TWO binds the ACCOUNTS SCREEN only: 'The account's row on the accounts screen names it ... with NO accumulated count and NO amount'. It says nothing about the month-accounts entry."
      - "Witness FIVE's balance-word test is bounded to one card: 'The reserves card's heading, eyebrow and any label rendered with reserves-net ... a test asserts the rendered strings for that card contain no word from a hand-written list of balance words'. The month-accounts held entry is not that card."
      - "Witness FIVE's grep is bounded by period, not by aggregation: 'a grep asserts that no read in the overview module AND no read in the accounts module sums or counts outside the requested period'. A sum of the three held rows INSIDE the requested period passes it."
      - "Decision D-60 in the same file: 'no heading, no eyebrow and no label in v1 may read as a balance or as a total held ... THAT BINDS THE ACCOUNTS SCREEN AS WELL AS THE MONTH VIEW'."
    concrete-edit: >-
      In criterion 14.15 witness SEVEN, replace 'The amounts are per row, the
      entry carries no sum of them, the accounts screen carries neither, and
      nothing crosses the requested period, so witness TWO and decision D-60
      are held rather than reopened.' with 'The amounts are per row and the
      entry carries no sum of them, ASSERTED RATHER THAN STATED: a Playwright
      test asserts that the held entry's own rendered text, excluding the
      three row lines it contains, carries the account label, the period row
      count and the state copy and NO monetary amount at all, and witness
      FIVE's balance-word test is extended to run over that entry's rendered
      text in each of the three locales. The accounts screen carries neither,
      which witness TWO asserts, and nothing crosses the requested period,
      which witness ONE bounds and witness FIVE's grep covers. So witness TWO
      and decision D-60 are held rather than reopened, and an implementation
      that renders a held subtotal under the entry fails here.'
    analysis: >-
      On the substance the amendment is right and I could not construct the
      misreading the attack asks for: three per-row amounts inside one
      requested period, on a screen whose month is the thing being shown,
      summed by eye give a monthly net movement on one account, which is the
      same kind of figure the reserves block already shows and is not a
      balance. Nothing accumulates across months and nothing is added to the
      accounts screen. D-60's substance survives. What does not survive is
      D-60's ENFORCEMENT. The amendment converts a decision that was
      protected by two live tests (witness TWO's no-amount assertion on the
      accounts screen, witness FIVE's balance-word test on the reserves card)
      into a decision protected, on the one surface the amendment newly puts
      money on, by a sentence. An implementer who renders 'held this month:
      X' above the three rows passes witness ONE (label, count, state words
      are all still there), witness TWO (wrong screen), witness THREE (rows
      still keyed individually), witness FIVE (the sum is inside the period,
      and it is not the reserves card), and witness SEVEN (the three amounts
      still render). That figure is precisely a per-account total held for
      the month, on the month view, which is the reading D-60 exists to
      prevent, and the next round will read 'D-60 is held rather than
      reopened' and stop looking. A claim of that weight needs a witness, and
      this is the round to add one, because the amendment is the act that
      creates the surface.
  - id: M0P12-A-003
    severity: medium
    evidence:
      - "delivery/plan/pulse-v02.yaml criterion 15.9, added text: 'the income total has fallen by exactly its interest credits'."
      - "The spend half of the same sentence is written the other way, over a CLASS rather than a category: 'The spend total has fallen by exactly the rows of that account the wrongly ringed state counted as spend'."
      - "src/modules/ledger/domain/classify-flow.ts:102-121: on a non-card account with no counterparty in any declared set, sign alone decides. EVERY positive row on the wrongly ringed savings account becomes INCOME, not only interest."
      - "src/modules/overview/adapters/overview-repository.ts:216: incomeSigned is SUM(amountCents) FILTER (WHERE flow = 'INCOME'), so the income total falls by ALL of the account's cleared credits, not by the interest subset."
      - "criterion 14.15 witness SEVEN's own premise implies the fixture carries other rows: 'Every other row a reserve statement carries has a counterpart row on a pot account'. Such a deposit row is a credit on the reserve statement and classifies INCOME in the wrongly ringed state exactly as the interest does."
    concrete-edit: >-
      In criterion 15.9, replace 'the income total has fallen by exactly its
      interest credits' with 'the income total has fallen by exactly the rows
      of that account the wrongly ringed state counted as income, OF WHICH AT
      LEAST ONE IS THE INTEREST CREDIT witness SEVEN pins'.
    analysis: >-
      The amendment diagnosed exactly this defect on the spend side and then
      committed the mirror of it on the income side. The old text lumped ALL
      the account's rows into the spend fall; the plan-writer correctly says
      that is arithmetically wrong once a credit is in the fixture, and
      rewrote the spend half over the class of rows the wrongly ringed state
      actually counted as spend. The income half was written over a
      CATEGORY (interest) instead of a class (rows counted as income), and
      the two are equal only in a fixture whose sole credit is the interest.
      The clause then contradicts its own neighbour: 'all four strings are
      written by hand in the spec from the fixture's own arithmetic' pins the
      true post-correction income, which on a fixture carrying a deposit is
      not income-before minus interest. An implementer meets a red test and
      resolves the contradiction by guesswork. The fix costs one clause and
      makes the two halves symmetric.
  - id: M0P12-A-004
    severity: medium
    evidence:
      - "delivery/plan/pulse-v02.yaml criterion 15.9, added text: 'THE TWO TOTALS, BECAUSE A RING CORRECTION OUT OF THE POT MOVES TWO AND AN EARLIER FORM OF THIS CRITERION PINNED ONE.'"
      - "src/modules/overview/adapters/overview-repository.ts:219: changeInPot is SUM(amountCents) FILTER (WHERE flow IS NOT NULL). Clearing a row's flow removes it from that sum too, so a correction OUT of the pot moves changeInPot by the net of the cleared rows whenever that net is not zero."
      - "The plan already reads this mechanism correctly one criterion earlier, and reaches the opposite conclusion for the opposite case: criterion 15.1 FIRST ARM, 'the rows move from INTERNAL to RESERVE and carry a flow either way, and src/modules/overview/adapters/overview-repository.ts:219 sums every row that has one, so it cannot move'. In 15.9 the rows are CLEARED rather than reclassified, so the same citation says it CAN move."
      - "src/modules/overview/domain/month-projection.ts:154-176: differenceCents is changeInPot minus (income - spend - netToReserves), so the three figures move together and the closing verdict 15.9 asserts is unaffected. The movement is silent, which is why nothing else catches it."
    concrete-edit: >-
      In criterion 15.9, replace 'BOTH TOTALS THE CORRECTION MOVES HAVE MOVED
      AND EACH IS PINNED' with 'ALL THREE TOTALS THE CORRECTION MOVES HAVE
      MOVED AND EACH IS PINNED', replace 'THE TWO TOTALS, BECAUSE A RING
      CORRECTION OUT OF THE POT MOVES TWO AND AN EARLIER FORM OF THIS
      CRITERION PINNED ONE' with 'THE THREE TOTALS, BECAUSE A RING CORRECTION
      THAT CLEARS ROWS MOVES THREE AND AN EARLIER FORM OF THIS CRITERION
      PINNED ONE', and after the income sentence add 'and pot-change has
      fallen by exactly the net of every row of that account the wrongly
      ringed state had stamped with a flow, because changeInPot sums every
      row carrying one (src/modules/overview/adapters/overview-repository.ts:219)
      and a cleared row carries none, which is the opposite of criterion
      15.1's first arm where the rows keep a flow either way'. Change 'all
      four strings' to 'all six strings'.
    analysis: >-
      This is the same defect the amendment exists to close, one figure
      further along. The amendment counted the totals a correction moves and
      got two because it counted the two NAMED sums; changeInPot is the third
      and it is derived by a different filter. The consequence is bounded
      rather than fatal, because criterion 15.2 asserts at the application
      level that none of those rows appears in any month figure, so a
      half-done clearing is caught somewhere in the phase. What is lost is
      what the amendment set out to buy: a journey that pins the value on
      both sides of the act for every figure the act moves. Leaving
      pot-change unpinned in the one journey that walks the whole wrong
      answer back also leaves the plan carrying a false sentence about the
      code, which the next round will inherit as settled.
  - id: M0P12-A-005
    severity: medium
    evidence:
      - "delivery/plan/pulse-v02.yaml criterion 14.15 witness SEVEN: 'THE FIXTURE THIS CRITERION RENDERS MUST CARRY ALL THREE, and an application test asserts the fixture holds one of each rather than leaving that to whoever writes it.'"
      - "The three are named as semantic categories: 'interest credited on a reserve account, a movement between two of the household's own reserve accounts, and a payment made directly out of a reserve account'."
      - "prisma/schema/import.prisma:106-118: Transaction carries bookingDate, amountCents, counterpartyName, counterpartyIban, description, reference and no marker of any kind for interest, so no test can read 'this row is interest' off a row."
      - "The witness states the discriminator itself, but as rationale rather than as the test's predicate: 'they are exactly the rows with NO COUNTERPART ROW ON ANY POT ACCOUNT'."
      - "src/modules/ledger/domain/classify-flow.ts:62-77 is the only place the product distinguishes these shapes at all, and it does so on counterpartyIban membership in the declared sets, which is the property a fixture test can actually assert."
    concrete-edit: >-
      In criterion 14.15 witness SEVEN, replace 'an application test asserts
      the fixture holds one of each rather than leaving that to whoever
      writes it' with 'an application test asserts the fixture holds one of
      each BY THE SHAPE THAT DISTINGUISHES THEM, since none of the three is a
      marked category in the data: exactly one positive row whose
      counterpartyIban is absent or belongs to no account of this household,
      which is the interest credit; exactly one row whose counterpartyIban is
      the SECOND registered reserve account; and exactly one negative row
      whose counterpartyIban belongs to no account of this household, which
      is the payment made straight out of savings. A row whose
      counterpartyIban belongs to a POT account satisfies none of the three,
      because such a row is one registration already made visible and is not
      what DR-0030 buys.'
    analysis: >-
      Witness SEVEN's argument is entirely about rows with no counterpart on
      a pot account, and then the test it demands is keyed on three names the
      database cannot see. An implementer satisfies 'holds one of each' by
      counting one positive row, one row addressed to the other savings
      account and one negative row, and can do that with a fixture whose
      positive row is an ordinary deposit from the household's own current
      account. That row HAS a counterpart on a pot account, so by the
      witness's own reasoning it is a row registration already reached and
      the household could already see: the fixture then satisfies the letter
      of the witness while delivering none of the interest axis the witness
      exists to buy. Stating the shapes costs one sentence and the witness
      already contains the rule.
  - id: M0P12-A-006
    severity: low
    evidence:
      - "delivery/plan/pulse-v02.yaml criterion 14.15 witness SEVEN: 'A movement between two reserve accounts needs the household to hold a SECOND one, so the fixture declares it'."
      - "delivery/plan/pulse-v02.yaml criterion 15.9, UNCHANGED text: 'upload a savings statement having registered nothing'."
      - "delivery/plan/pulse-v02.yaml criterion 15.9, added text: 'the savings statement this journey uploads is the fixture witness SEVEN requires to carry an interest credit'."
      - "src/modules/ledger/domain/classify-flow.ts:62-68: if the second reserve account IS in the declared reserve set at the time the journey runs, the reserve-to-reserve row classifies RESERVE and not SPEND, so reserves-net is non-zero before the correction and falls to zero after it, a fourth movement the journey pins nothing about."
    concrete-edit: >-
      In criterion 15.9, replace 'the savings statement this journey uploads
      is the fixture witness SEVEN requires to carry an interest credit' with
      'the savings statement this journey uploads is the STATEMENT FILE of
      the fixture criterion 14.15 witness SEVEN pins, and this journey
      registers nothing before uploading it, so the second reserve account
      witness SEVEN declares is NOT declared here and the reserve-to-reserve
      row on that statement is an ordinary outgoing row in the wrongly ringed
      state; the spec records reserves-net before the correction and asserts
      it byte identical after it, so a journey that inherited the whole
      fixture rather than its statement file goes red here instead of
      quietly moving a fourth figure.'
    analysis: >-
      The word 'fixture' does two jobs in this amendment. In witness SEVEN it
      is a household with two registered reserve accounts and a statement; in
      15.9's coupling sentence it must mean only the statement file, because
      15.9's journey registers nothing. Under the natural reading the
      amendment intends, everything holds and 'both totals' is correct on the
      reserve axis. Under the other reading the journey contradicts its own
      opening clause and a fourth figure moves unpinned. One sentence
      removes the ambiguity, and pinning reserves-net closes it under either
      reading.

