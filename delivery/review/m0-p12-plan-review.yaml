# R2-1. THE PATH BINDING IS REAL, which was the sharpest of the coordinator's
#    questions and the one I expected to break. A path on its own binds
#    nothing: it is a string in two specs and the file under it can be
#    edited without either spec noticing. What makes it bind here is that
#    the CONTENT at that path is asserted in the OTHER phase, by shape.
#    Criterion 14.15 witness SEVEN asserts exactly one positive row whose
#    counterpartyIban is absent or belongs to no account of the household,
#    exactly one row addressed to the second reserve account, and exactly
#    one negative row addressed to no account of the household, and it
#    asserts each of their amounts against hand-written strings. I could
#    not construct an edit to that file that leaves both phases green and
#    15.9's income half measuring nothing: remove the credit and M3-P14's
#    shape test goes red; change an amount and the hand-written strings in
#    both phases go red; add a second credit with no household counterparty
#    and the 'exactly one' goes red; point the journey at
#    test/e2e/month-view.spec.ts:1377, which 15.9 now excludes by name, and
#    the strict-inequality floor goes red. Three mechanisms where round one
#    asked for one.
#
# R2-2. THE FOUR SHAPES ARE MUTUALLY EXCLUSIVE AND THE COUNTS ARE TIGHT.
#    Checked rather than assumed: the reserve-to-reserve row carries a
#    counterpartyIban belonging to a household account, so it matches
#    neither the positive shape nor the negative shape whichever direction
#    it runs, and the three counts cannot double-count one row. The
#    'exactly one' wording buys more than the finding asked for, because
#    any extra row in that file whose counterparty belongs to no account of
#    the household breaks a count, which turns the witness's own premise
#    (that every other row has a pot counterpart) from an assumption into
#    an assertion.
#
# R2-3. THE CLASS BOUNDARY ON THE INCOME HALF IS THE RIGHT ONE. On this
#    journey's account every credit reaches classify-flow.ts:121, because
#    the reserve set is empty, the pot set holds only the account itself,
#    the settlement mirror arm and the refund arm are both guarded by
#    cardAccountIds and the account is not a card, and a settlement-pattern
#    debit with no card import returns SPEND at classify-flow.ts:98. The
#    formulation is also robust where the criterion's explanatory sentence
#    is approximate, because the class is defined by the flow the row
#    carried rather than by its sign.
#
# R2-4. THE IDENTITY REASONING IS CORRECT AS FAR AS IT REACHES, and I
#    verified it by expansion rather than by reading the sentence.
#    difference = changeInPot - (income - spend - netToReserves)
#    (month-projection.ts:201). Over the aggregate's own filters that
#    equals the signed sum of the INTERNAL and UNRESOLVED rows, which is
#    what the file's comment at :160 through :176 already states. So
#    clearing a set of rows leaves difference unchanged exactly when that
#    set carries no INTERNAL and no UNRESOLVED row. The criterion's
#    construction ('registers NOTHING before uploading') closes the
#    INTERNAL and RESERVE routes by itself. The UNRESOLVED route is the one
#    gap and it is finding M0P12-A-008; it is ranked low because it cannot
#    let a real defect pass, only make a green run's stated explanation
#    wrong.
#
# R2-5. THE NO-SUM ASSERTION IS SATISFIABLE WITH THE MARKUP THIS PHASE
#    SHIPS, which the coordinator asked separately from whether it is
#    tight. Witness THREE already requires each held row to be keyed on its
#    own rendered identity, so per-row elements exist and are addressable;
#    the money renderer is one mandatory format per the pulse-frontend
#    skill, so a monetary amount is recognisable by pattern; and the entry
#    already carries a label, a count and state copy that a no-amount
#    assertion must tolerate, which a money-format test does. Nothing in
#    the assertion is unbuildable. It is the EXCLUSION that is loose, not
#    the assertion, which is why M0P12-A-007 asks for a count rather than
#    for different markup.
#
# R2-6. HOUSE RULES AND SCOPE, re-checked on this round's added lines: zero
#    non-ASCII characters in the added plan text, so no em dash; English
#    throughout; no amount, no counterparty, no date and no account number
#    anywhere in it, the second reserve account still delegated as an
#    obligation with no identifier written into the plan; and no
#    occurrence of queue, cron, event bus, cache, redux, zustand, component
#    library, budget or goal. The migrations note of both phases is byte
#    identical to origin/main, so D-59 stands and no Flow member is added.

