      account's rows are in the month's spend BEFORE the correction, so the
      fall it later asserts is known to be non-zero. The amendment gave the
      income half no such floor. Naming the coupling to witness SEVEN is not
      enough on its own: a named dependency is a sentence in a different
      phase's criterion, and the thing that would make it bite is an
      assertion in THIS spec that the movement it measures is real. The
      ordering is not the risk (conflicts-with already runs M3-P14 first);
      fixture identity is.

