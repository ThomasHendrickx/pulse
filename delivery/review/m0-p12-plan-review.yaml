#
# 2. 14.15 IS PURELY ADDITIVE. A word-level diff of the criterion string
#    shows exactly two edits: "Six" to "Seven", and an append. No existing
#    witness lost a word.
#
# 3. NO Flow MEMBER AND NO MIGRATION. The `migrations` field of both phases
#    is byte identical to origin/main, including M3-P15's sentence that
#    adding a HELD member to the Flow enum WOULD be a migration and is
#    deliberately not done. D-59 is untouched. The added text mentions
#    neither. Nothing in it needs a column: the amounts it renders are
#    Transaction.amountCents, already stored.
#
# 4. SCOPE DISCIPLINE HOLDS. The added lines contain no occurrence of queue,
#    cron, event bus, cache, redux, zustand, component library, budget or
#    goal. The amendment adds a fixture, an account, three assertions and a
#    rendered amount.
#
# 5. HOUSE RULES HOLD. Zero non-ASCII characters in the added lines, so no em
#    dash. English throughout. No amount, no counterparty, no date and no
#    account number appears anywhere in the added text; the second reserve
#    account is delegated as an obligation and no identifier is written into
#    the plan.
#
# 6. THE DELEGATION IN WITNESS SEVEN IS REAL AND REACHABLE, which was the
#    sharpest attack available and it failed. Criterion 14.12 imposes four
#    refusals by name: empty after canonicalisation, a country code the
#    PINNED COUNTRY-LENGTH TABLE does not carry, a length differing from the
#    one that table assigns, and a failed ISO 7064 mod-97 check, each with a
#    named error in all three catalogues and an application test per
#    refusal. Criterion 14.11 witness FOUR imposes the other half: the
#    re-invented number is added to test/fixtures/allowed-identifiers.txt
#    with a WRITTEN PROVENANCE NOTE in the same commit, sibling references
#    updated, superseded entries removed. Witness SEVEN does not merely
#    point at those: it restates both obligations in its own text and adds a
#    third, that the number pass "asserted by a fast-gate unit test rather
#    than by inspection". The premise behind the clause is measured rather
#    than asserted: M3-P14 step 1 baseline FOUR records 17 distinct
#    account-shaped values, 7 passing mod-97 and 10 failing, with the method
#    written beside it. An independent mod-97 run over the identifiers in
#    test/fixtures/allowed-identifiers.txt in this worktree returns 7
#    passing, matching that numerator (my denominator is 19 rather than 17
#    because I read the allow list rather than git ls-files under the
#    privacy gate's skip list, which is the plan's stated method). The
#    obligation is also satisfiable INSIDE M3-P14: the platform module that
#    owns the validity test is built in this phase per decision D-57, and
#    test/fixtures/ and test/fixtures/allowed-identifiers.txt are both in
#    its files-to-touch.
#
# 7. THE 15.9 SPLIT'S REASONING IS CORRECT, VERIFIED IN BOTH DIRECTIONS
#    AGAINST THE CODE RATHER THAN ACCEPTED. Direction one, the old lump is
#    wrong: an interest credit on a savings account declared POT is a
#    positive row that the reserve set (classify-flow.ts:62), the pot set
#    (:73), the settlement step (:83) and the refund arm (:113) all decline,
#    so it reaches classify-flow.ts:121 and is INCOME. The spend total is
#    SUM FILTER (WHERE flow = 'SPEND') at overview-repository.ts:217, so it
#    cannot fall by a row that was never in it, and "the spend total has
#    fallen by exactly them" over ALL the account's rows is arithmetically
#    false the moment the fixture carries the credit witness SEVEN now
