    severity: low
    evidence:
      - "delivery/plan/pulse-v02.yaml criterion 14.15 witness SEVEN, round three: 'a Playwright test COUNTS the money-formatted strings rendered anywhere under the held entry, nested elements included, and asserts the count is EXACTLY the number of rows the held read returned for that account'. The identity 'a subtotal is one money-formatted string more than there are rows' is exact only when every returned row renders exactly one amount."
      - "The per-row amount assertion that would guarantee that covers three rows, not all of them: 'A Playwright test then asserts that each of THE THREE renders UNDER THE HELD ENTRY for its account with BOTH its descriptor ... AND ITS OWN AMOUNT'."
      - "The held read returns every row on that account in the period, and the fixture may carry more than three: witness SEVEN's own premise is that the file also carries rows with pot counterparts ('Every other row a reserve statement carries has a counterpart row on a pot account'), and its shape test constrains only the three ('exactly one POSITIVE row ... exactly one row whose counterpartyIban is the SECOND registered reserve account ... exactly one NEGATIVE row')."
      - "So with N rows returned and N greater than three, an implementation that omits the amount on one UNPINNED row and renders a per-account subtotal has N money-formatted strings, the count assertion is green, and witness SEVEN's three pinned amounts are all still rendered."
    concrete-edit: >-
      In criterion 14.15 witness SEVEN, after 'asserts the count is EXACTLY
      the number of rows the held read returned for that account', add 'and
      that EVERY row the held read returned renders exactly one
      money-formatted string of its own, not only the three this witness
      pins, so the count cannot be balanced by dropping an amount from an
      unpinned row while adding a subtotal'.
    analysis: >-
      Answering the coordinator's question precisely rather than generally.
      The plan-writer's claim that under-rendering is caught from the other
      side is TRUE FOR THE THREE PINNED ROWS and not for any others, and the
      fixture is not required to be exactly three rows. A compensating error
      is the only way through, and it takes two deliberate acts in the same
      commit, so this is ranked low and I say plainly that it does not need
      to hold a merge: nobody builds a screen that drops one row's amount in
      order to make room for a subtotal. It is recorded because the sentence
      in the plan reads as a general guarantee and the next round will use it
      as one. THE OTHER CLAUSE THE COORDINATOR ASKED ABOUT IS NECESSARY AND
      NOT NOISE. 'the period row count is a count and not money, so it does
      not carry that format and cannot inflate the total' is what makes the
      equality well formed, because the entry renders a count and the
      assertion's right-hand side IS that count, so a reader otherwise has to
      stop and decide whether the rendered count can match the money pattern.
      It states a fact rather than adding a constraint, and it costs one
      clause. The one residual escape from the count is an implementer who
      renders the subtotal OUTSIDE the product's mandatory money format, and
      that is not worth an edit: it is already a defect the design system
      owns, and the alternative, counting every numeric-looking string, would
      collide with the row count the same clause exists to exclude.

