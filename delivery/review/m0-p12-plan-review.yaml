      that made the spend half safe: the journey asserts 'AT LEAST ONE CREDIT OF THAT ACCOUNT IN THE
      MONTH'S INCOME' before the correction, so the fall it later measures is known non-zero for the
      same reason the spend fall always was. SECOND, the strict inequality is present: 'the spec
      asserts the income recorded BEFORE the correction is STRICTLY GREATER than the income asserted
      after it, so a statement carrying no credit makes this criterion RED rather than passing with
      two equal hand-written strings and nothing measured'. Two equal strings can no longer be
      green. THIRD, and this is the one I attacked hardest, the coupling is now by path AND the
      content at that path is pinned in the other phase. Naming a path alone would bind nothing,
      because a path is a string and a file can be edited under it. What makes it bind is that
