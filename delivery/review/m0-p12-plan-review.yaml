  - id: M0P12-A-003
    severity: medium
    evidence:
      - "delivery/plan/pulse-v02.yaml criterion 15.9, added text: 'the income total has fallen by exactly its interest credits'."
      - "The spend half of the same sentence is written the other way, over a CLASS rather than a category: 'The spend total has fallen by exactly the rows of that account the wrongly ringed state counted as spend'."
      - "src/modules/ledger/domain/classify-flow.ts:102-121: on a non-card account with no counterparty in any declared set, sign alone decides. EVERY positive row on the wrongly ringed savings account becomes INCOME, not only interest."
      - "src/modules/overview/adapters/overview-repository.ts:216: incomeSigned is SUM(amountCents) FILTER (WHERE flow = 'INCOME'), so the income total falls by ALL of the account's cleared credits, not by the interest subset."
      - "criterion 14.15 witness SEVEN's own premise implies the fixture carries other rows: 'Every other row a reserve statement carries has a counterpart row on a pot account'. Such a deposit row is a credit on the reserve statement and classifies INCOME in the wrongly ringed state exactly as the interest does."
    concrete-edit: >-
      In criterion 15.9, replace 'the income total has fallen by exactly its
      interest credits' with 'the income total has fallen by exactly the rows
      of that account the wrongly ringed state counted as income, OF WHICH AT
      LEAST ONE IS THE INTEREST CREDIT witness SEVEN pins'.
    analysis: >-
      The amendment diagnosed exactly this defect on the spend side and then
      committed the mirror of it on the income side. The old text lumped ALL
      the account's rows into the spend fall; the plan-writer correctly says
      that is arithmetically wrong once a credit is in the fixture, and
      rewrote the spend half over the class of rows the wrongly ringed state
      actually counted as spend. The income half was written over a
      CATEGORY (interest) instead of a class (rows counted as income), and
      the two are equal only in a fixture whose sole credit is the interest.
      The clause then contradicts its own neighbour: 'all four strings are
      written by hand in the spec from the fixture's own arithmetic' pins the
      true post-correction income, which on a fixture carrying a deposit is
      not income-before minus interest. An implementer meets a red test and
      resolves the contradiction by guesswork. The fix costs one clause and
      makes the two halves symmetric.

      ROUND TWO, judged at plan head d374d1d: CLOSED. The income half is now named over the class:
      'the rows of that account the wrongly ringed state counted as INCOME, of which AT LEAST ONE IS
      THE INTEREST CREDIT criterion 14.15 witness SEVEN pins', with the reason stated and the
      citation exact. I checked the class boundary rather than accepting it. In this journey the
      reserve set is empty and the pot set holds only the account itself, the account is not a card
      so neither the settlement mirror arm (corrections.ts:44, guarded by cardAccountIds) nor the
      refund arm (classify-flow.ts:113, same guard) can fire, and a settlement-pattern debit with no
      card import returns SPEND rather than INTERNAL (classify-flow.ts:98). So every credit on that
      account reaches classify-flow.ts:121 and is INCOME, and incomeSigned at overview-
      repository.ts:216 is a FILTER on that flow, so the total falls by all of them. The class
      formulation is also robust where the explanatory sentence is approximate, because it is
      defined by the flow the row carried and not by the row's sign.
