# ROUND THREE: WHAT WAS EXAMINED AND FOUND SOUND.
#
# R3-1. THE COUNT CATCHES EVERY PLACEMENT, including the one that defeated
#    the exclusion. The assertion is now arithmetic rather than structural:
#    money-formatted strings under the entry, nested included, equals the
#    number of rows the held read returned. A subtotal is one string more
#    than there are rows whether it sits above the rows, beside them, in a
#    footer, or as one more row line, and the last is the case my round-two
#    finding was entirely about. Nothing has to describe what a row line
#    is for that to hold, which was the point. It is buildable with what
#    the phase already owes, a DOM query and one regular expression over
#    the product's single mandatory money format.
#
# R3-2. THE WHOLE-FILE NON-ZERO ASSERTION IS SATISFIABLE, checked against
#    every criterion of both phases rather than reasoned about. Scanning
#    all of them for a zero-amount or UNRESOLVED requirement returns 15.9
#    and nothing else, so no criterion anywhere in either phase needs that
#    file to carry a zero-amount row. The other consumers of a savings or
#    reserve statement are 14.11 (which uses the existing upload at
#    test/e2e/month-view.spec.ts:1377, a different file 15.9 now excludes
#    by name), 14.15, 14.16 and 15.1, and the fixture pins that 14.16 and
#    15.1 carry are on the POT side, about outgoing transfers and
#    drawdowns, never about a zero amount. The assertion also does not
#    require every amount to be PINNED, only non-zero, so a criterion
#    consuming an unpinned row of that file is unaffected. This is the
#    defect class the dispatch was right to look for and it is not here.
#    ONE JUDGEMENT CALL WORTH NAMING RATHER THAN FINDING: the assertion
#    sits in 15.9 over a file M3-P14 creates, so an M3-P14 fixture carrying
#    a zero row would fail M3-P15 and point back. That is the same
#    cross-phase shape the path coupling already has and 15.9 already owns
#    the floor assertion of the same kind. Placing it beside the claim it
#    protects is defensible and I would not move it.
#
# R3-3. KEEPING BOTH THE SHAPE CLAUSE AND THE RECON-DIFFERENCE PIN IS
#    RIGHT, AND THE PIN IS NOT REDUNDANT. They fail on different things.
#    The shape clause is a property of the INPUT and the pin is a property
#    of the RUN. Under the shape clause difference cannot move however
#    badly the clearing is done, since difference is the INTERNAL plus
#    UNRESOLVED sum and every row is INCOME or SPEND, so the pin looks
#    redundant until the construction argument itself is wrong. That
#    argument, that registering nothing leaves no counterparty in any
#    declared set, is an ARGUMENT and not an assertion, and it has at least
#    one unasserted hole: the pot set on this journey contains the
#    wrongly ringed account's own number, so a row on that statement whose
#    counterpartyIban is the account's own number is INTERNAL at
#    classify-flow.ts:73 through :77. The shape clause does not exclude
#    such a row and the pin catches it. The pin costs one recorded string
#    and is the general guard behind a specific one, which is the same
#    belt-and-braces idiom decision D-56 and criterion 15.4 already use in
#    this plan.
#
# R3-4. THE REDUCED BALANCE-WORD SCOPING CANNOT REALISTICALLY MISS A
#    HEADING. The exclusion removes ROW ELEMENTS, and a heading is not a
#    row, so the text a heading is rendered in is exactly the text that
#    survives the reduction. The reduction also removes a real false red
#    rather than only tidying scope: an invented descriptor carrying a
#    balance word in one of three languages would otherwise fail a test
#    aimed at a heading, and that failure would have been met at
#    implementation time and answered by weakening the test, which is the
#    worse outcome. Witness FIVE's original balance-word test over the
#    reserves card is untouched, and the money count is independent of the
#    exclusion, so nothing D-60 protects now depends on where the exclusion
#    draws its line.
