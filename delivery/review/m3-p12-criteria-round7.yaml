findings:
  - id: CR7-M3P12-01
    severity: high
    evidence:
      - >-
        THE INSTRUMENT AND ITS CLAIM. The scan at test/db/gate-target.test.ts:361
        is titled "EVERY door in test/ and scripts/ is guarded, whatever kind of
        client opens it", and the header above it at
        test/db/gate-target.test.ts:345 calls it "THE STANDING ANSWER to 'can
        anything still reach a database nobody named'". Its walk roots are two,
        set at test/db/gate-target.test.ts:363 and :364: the test directory and
        the scripts directory. That is the whole denominator.
      - >-
        THE FILE IT NEVER READS. prisma/seed.ts constructs a Prisma client at
        prisma/seed.ts:20 and a Supabase service-role admin client at
        prisma/seed.ts:32, from process.env values read at prisma/seed.ts:23
        and :24, and then calls the admin create-user API at prisma/seed.ts:57.
        It carries neither interlock: my own scan over git ls-files, applying
        the same two patterns the test applies but over the whole tree instead
        of two directories, reports prisma/seed.ts as both an unguarded Prisma
        door and an unguarded admin door, and reports no other unguarded door
        outside the two walked roots except src/platform/db/client.ts, which is
        the application's own client and is not a gate door. It sits directly
        in prisma/, one level from the root, exactly the position the standing
        shape-not-identity error keeps occupying.
      - >-
        THE SCAN IS GREEN WHILE THAT DOOR IS OPEN, witnessed rather than
        argued: npx vitest run test/db/gate-target.test.ts -t "EVERY door"
        gives "Tests 1 passed | 26 skipped (27)", exit 0.
      - >-
        AND IT IS REACHABLE THROUGH A SANCTIONED COMMAND, which is what makes
        this high rather than tidy. prisma/seed.ts is the registered Prisma
        seed hook (package.json, the prisma.seed field), so it runs as part of
        npm run db:reset and npm run db:migrate. The guard those two scripts do
        run, src/platform/db/guard-cli.ts, builds its environment at
        src/platform/db/guard-cli.ts:17 and :18 from DATABASE_URL and DIRECT_URL
        and nothing else, and src/platform/db/guard.ts:42 confirms the checked
        set is exactly those two names. The Supabase API URL and the service
        role key are checked by nothing on that path. So an operator who does
        precisely what fleet warning 1 instructs, pin the connection strings to
        the local stack, resets a LOCAL database and creates an auth user in
        whatever project the ambient Supabase variables name. In this
        container those ambient variables are present and, per fleet warning 1,
        belong to a different project.
      - >-
        THE CLAIM IS ALSO FALSE IN THE WORK HISTORY, which is clause R-087
        territory: delivery/work-history/m3-p12.yaml describes this instrument
        in the fix-round-five gate entry as "the tree-wide scan for unguarded
        clients". It is a two-directory scan. A reader deciding whether this
        family of hazard is closed reads that sentence and closes it.
      - >-
        WHAT I DID NOT DO, said plainly: I did not run the seed, run db:reset,
        or open any connection, so I have not observed the foreign write. The
        finding rests on the code path, which is short and fully cited above.
    concrete-fix: >-
      Two edits, and the second is the one that stops this recurring. First,
      add the two interlocks to prisma/seed.ts: call assertGateDbTargetIsLocal
      before the Prisma client is used and assertGateApiTargetIsLocal before
      the admin client is constructed at prisma/seed.ts:32, or, if the seed must
      be usable against a deliberately named non-local target, give it the same
      explicit host-and-ref argument pair that src/platform/db/target-guard.ts
      already implements for the re-derivation. Second, change the scan's
      denominator from a location to a definition: walk every tracked source
      file, from git ls-files rather than from two hard-coded roots, and
      subtract an EXPLICIT allow list of files that are permitted to open an
      unguarded client, today just src/platform/db/client.ts, each with a
      written reason beside it. Rename the test accordingly and correct the
      "tree-wide" sentence in delivery/work-history/m3-p12.yaml to say which
      two directories it read. A scan that names its exclusions is auditable; a
      scan that names its inclusions silently excludes everything else.
    analysis: >-
      This is the sixteenth instance of the standing error and it is in the
      same family as the fifteenth: the check matched the SHAPE of where doors
      have historically been written, under test/ and scripts/, rather than the
      IDENTITY of a door, a file that constructs a client. The two roots were
      correct on the day they were written, and the file that falsifies them is
      older than the scan, which is exactly why an inclusion list cannot hold:
      it is not defeated by a future edit, it was already defeated when it
      shipped. I have graded it high rather than medium on one ground only,
      that the reachable consequence is a write to a stranger's deployed
      project through a command this repository documents and sanctions, which
      is the precise hazard the whole interlock family exists to answer. It is
      NOT a defect in this round's work: the scan came from fix round five and
      the seed from M1-P4, and no acceptance criterion of this phase reaches
      either. That is the criteria contract's own point about completeness, and
      it is why I am recording it here rather than letting 23 of 23 stand as a
      terminal green.
  - id: CR7-M3P12-02
    severity: medium
    evidence:
      - >-
        THE REPAIR IS REAL AND I CONFIRMED IT. measurementLabel at
        test/fixtures/measure-identity-convergence.ts:70 now returns the
        basename only for a path under the fixture directory, the leading eight
        characters only when they match the fleet handle pattern at
        test/fixtures/measure-identity-convergence.ts:67, and the fixed
        placeholder otherwise. The four call sites in
        test/fixtures/measure-fixture-token-overlap.ts, at lines 103, 108 and
        117, all go through it, and the header's own account of the old defect
        at test/fixtures/measure-fixture-token-overlap.ts:23 through :33 is
        accurate.
      - >-
        THE SHAPE NEITHER OF US TRIED, HANDED TO IT. I called the function on
        thirteen filename shapes. Three leak, and they are not exotic. A
        basename whose first eight characters are eight DIGITS passes the fleet
        handle pattern, because a digit is a hex digit, so a real export named
        with a leading statement date or a leading eight-digit document
        reference has those eight characters emitted verbatim. Fleet warning 9
        records that a real upload's file name embeds an account number plus a
        statement date on one document and a document reference on the other,
        so this is the population the guard was built for.
      - >-
        SECOND LEAK: the repair closes the account-leading case only in upper
        case. A lower-cased account-leading basename passes the pattern,
        because the letters of the country code used by these fixtures are
        themselves hex letters, and the function returns the country code, the
        check digits and the first four digits of the account. That is the
        SAME eight characters the round's own correction says it stopped
        emitting, reached through a different casing. gate:privacy folds case
        for exactly this reason, at scripts/gate-privacy.sh:109 and in the
        comment at scripts/gate-privacy.sh:58 through :69, where the same
        lower-case blind spot was found and fixed once already.
      - >-
        THIRD LEAK: the fixture-directory branch at
        test/fixtures/measure-identity-convergence.ts:72 tests a path PREFIX,
        so any file in any subdirectory below the fixture directory returns its
        FULL basename, whatever it is.
      - >-
        WHAT IS NOT WRONG: nothing in the tree trips any of this today, and
        npm run gate:privacy exits 0 with "gate:privacy clean". This is a guard
        with a hole, not a leak.
      - >-
        AND THE CLAIM ABOVE IT IS AGAIN WIDER THAN THE CODE, which is what
        makes it a finding under clause R-087 rather than a nit. The header at
        test/fixtures/measure-identity-convergence.ts:44 announces "A LABEL
        THAT CANNOT CARRY AN IDENTIFIER OUT OF A REAL DOCUMENT, and in fix
        round eight that is enforced rather than asserted". It is enforced
        against one casing of one shape.
    concrete-fix: >-
      Stop testing the shape of a handle and test its identity. The fleet
      handle is a value this fleet ASSIGNED, so the label function should
      consult the mapping rather than a pattern: keep a committed list of the
      handles in use, which fleet warning 9 already enumerates, and return the
      leading eight characters only when they are on it, placeholder otherwise.
      If a list is refused as too rigid, then at minimum require the eight
      characters to contain at least one hex LETTER and at least one digit and
      to be followed by a hyphen, which excludes a bare date and a bare
      reference, and apply the pattern to the raw basename without folding
      case so a lower-cased account-leading name falls through to the
      placeholder. Separately, change the fixture-directory test at
      test/fixtures/measure-identity-convergence.ts:72 from a prefix test to a
      test that the resolved parent directory IS the fixture directory, so a
      subdirectory does not inherit the exemption. Add the three shapes above
      to the unit test at test/application/counterparty-identity-surfaces.test.ts:365
      as the red witnesses.
  - id: CR7-M3P12-03
    severity: medium
    evidence:
      - >-
        THE PIN, at test/domain/counterparty-identity-contracts.test.ts:181
        through :190, slices the skill document from the section 7 heading to
        the next heading and asserts the forbidden phrase occurs exactly once
        inside that slice and that the one occurrence is the historical
        sentence, pinned by full text at
        test/domain/counterparty-identity-contracts.test.ts:178. Against a
        reintroduction inside section 7 it works: I injected one and it went
        red at test/domain/counterparty-identity-contracts.test.ts:188.
      - >-
        THE CRITERION IT MEASURES IS NOT SECTION-SCOPED. Criterion 12.19 says
        "grep of .claude/skills/pulse-domain/SKILL.md shows the account basis
        inside that chain and shows no remaining sentence saying the key is the
        normalised counterparty string". The first clause is about the chain;
        the second is about the file.
      - >-
        HANDED THE THING IT EXISTS TO REFUSE, FROM ONE SECTION AWAY: I
        temporarily inserted a sentence asserting that a merchant rule's
        subject is the normalised counterparty string, matched for equality,
        immediately ahead of the section 9 heading. npx vitest run
        test/domain/counterparty-identity-contracts.test.ts reported "Tests 12
        passed (12)", exit 0, while a case-insensitive grep of the document
        counted 2 occurrences of the phrase. The file was restored and git diff
        is empty.
      - >-
        The document today carries exactly one occurrence, so nothing is wrong
        with the artifact. What is wrong is that the guard would not notice the
        next one unless it lands in one particular section, and the sibling
        pins in the same describe block at
        test/domain/counterparty-identity-contracts.test.ts:146 and :154 read
        the WHOLE document, so the narrow one is the odd member.
    concrete-fix: >-
      Count over the whole document rather than over the slice. Keep both
      assertions: the phrase must occur exactly once in
      .claude/skills/pulse-domain/SKILL.md and that occurrence must be inside
      the section 7 slice and must be the pinned historical sentence. That is
      three cheap assertions on text already read, it is strictly stronger than
      what is there, and it costs nothing, since the section slice is already
      computed at test/domain/counterparty-identity-contracts.test.ts:182.
  - id: CR7-M3P12-04
    severity: medium
    evidence:
      - >-
        THE SELF-CHECK IS REAL AND IT WORKS ON THE CASE IT NAMES. I ran npm run
        test:mutants: the SELF entry breaks the module, the property file exits
        non-zero with no assertion, and the harness scores it "dies" rather
        than "caught". Exit 0 overall with six wrong predicates caught.
      - >-
        THERE IS A FIFTH OUTCOME AND THE FOUR NAMES DO NOT COVER IT. The
        outcome is decided at test/property/mutants.mts:265 through :271 from
        three values: whether the run failed, whether the string "AssertionError:"
        appears ANYWHERE in the combined output, and whether a FAIL line
        carries one of the two property titles. I replicated the summarise
        function from test/property/mutants.mts:223 through :247 exactly and
        fed it crafted reports. A report in which ONE property raises an
        assertion and the OTHER dies of a runtime error scores "caught", and
        prints the same sentence a clean double catch prints. Half the
        instrument crashing is indistinguishable from the whole instrument
        working. M5 and M4 both report red on both properties today, so that is
        the shape this collapse would hide.
      - >-
        THE DISCRIMINATOR IS ITSELF SHAPE-SCOPED. The assertion search at
        test/property/mutants.mts:237 through :241 reads the WHOLE report,
        stdout and stderr concatenated, not the failing test's own output. Fed
        a report that dies of a runtime error while its stdout merely contains
        the words, my replica scores it "unattributed" instead of "dies", and
        it would score "caught" if a FAIL line for a property were also
        present. Nothing in src/ or test/ carries that literal today outside
        test/property/mutants.mts itself, so this is latent rather than live; I
        grepped to check.
      - >-
        AND THE SELF-CHECK PASSES IN TWO STATES THAT HAVE NOTHING TO DO WITH
        THE MODULE. Its expectation is "dies", which is any non-zero exit
        without an assertion line. My replica scores "no test files found",
        which is what vitest returns if the property file is renamed or
        deleted, as "dies"; and it scores an empty report, which is what
        execFileSync produces if the runner cannot launch at all, as "dies"
        too. In both states the SELF entry passes while proving nothing. The
        harness as a whole stays loud in those states, because all six wrong
        predicates then score "dies" and the run exits 1, so this is a
        weakness in the self-check rather than in the harness.
      - >-
        ONE MORE, small: nothing asserts that a mutant actually CHANGED the
        file. The anchor check at test/property/mutants.mts:254 requires the
        anchor to occur exactly once; it never compares the mutated text to the
        original. An edit whose replacement equals its anchor would leave the
        file untouched, score "green", and be reported as "a defect in the
        properties, not a passing mutant", which is a confident and wrong
        diagnosis.
    concrete-fix: >-
      Four small edits, all inside test/property/mutants.mts. Scope the
      assertion search to the failing property's own output rather than the
      whole report, by taking the text after each FAIL line up to the next FAIL
      line and asking each block separately whether an AssertionError fired.
      Then score per property, and add the fifth outcome by name, something
      like "partial: one property asserted and another died", which is not
      "caught" and must count as a failure. Give the SELF entry a positive
      precondition so it cannot pass vacuously: assert before the loop that the
      unmutated property file runs GREEN, which fails loudly if the file is
      missing or the runner cannot launch, and makes every later "dies" mean
      the mutation. And assert mutated !== original after applying each
      mutant's edits, so a no-op edit is reported as a stale mutant rather than
      as a defect in the properties.
  - id: CR7-M3P12-05
    severity: low
    evidence:
      - >-
        test/e2e/auth.spec.ts:86 calls assertGateApiTargetIsLocal
        unconditionally once its own skip has been evaluated, and that skip, at
        test/e2e/auth.spec.ts:74, fires only when the Supabase URL or the
        service role key is ABSENT.
      - >-
        In deploy-verify mode the gate's interlock is deliberately skipped, at
        playwright.config.ts:28 and :29, and the environment legitimately
        carries a DEPLOYED Supabase URL and key. The skip therefore does not
        fire, the assertion does, and it throws because the URL is not local.
        The comment at test/e2e/auth.spec.ts:67 through :69 says the spec is
        "Skipped when no service role key is in the environment (deployed
        runs)", which was true before this guard was added and is no longer the
        whole story.
      - >-
        The direction is safe, a refusal rather than a write, which is why this
        is low. But it means the deploy-verify stage would go red on a spec
        that is supposed to skip, and nothing in the fast gate can see that.
    concrete-fix: >-
      Make the deploy-verify skip explicit in this spec the way
      test/e2e/merchant-rule-write.spec.ts:57 through :59 already does: skip
      when process.env.PLAYWRIGHT_BASE_URL is defined, before the local-target
      assertion, and correct the comment at test/e2e/auth.spec.ts:67 to say
      that the spec is a local-stack spec and is skipped in deploy-verify.
  - id: CR7-M3P12-06
    severity: low
    evidence:
      - >-
        readDotEnvValue at src/platform/db/resolve-env.ts:79 resolves its file
        as join(process.cwd(), ".env") at src/platform/db/resolve-env.ts:80.
        Every comment describing it, including
        src/platform/db/gate-target.ts:34, :61 and :229, calls it "the .env
        file at the package root". Those two are the same only when the command
        is invoked from the package root.
      - >-
        The failure direction is a refusal, so nothing unsafe follows: invoked
        from a subdirectory the gate finds no target and throws
        GateDbTargetRefused. I witnessed that refusal shape directly for the
        no-source case: with nothing pinned, npx playwright test --list in this
        worktree, which has no .env, exits 1 with "GateDbTargetRefused: gate
        database target: no source named a database for this gate", thrown at
        src/platform/db/gate-target.ts:256 from playwright.config.ts:29.
      - >-
        Raised because the sentence is a present-tense claim about behaviour
        that nothing checks, which is one of the two shapes clause R-087 names,
        and because the operator instructions at
        src/platform/db/gate-target.ts:61 tell a person to create a file at a
        location the code does not actually read.
    concrete-fix: >-
      Resolve the file from the module's own location rather than the working
      directory, the way test/fixtures/measure-identity-convergence.ts:42
      already derives its fixture directory from import.meta.url, or else
      change the three comments to say "the .env file in the current working
      directory" and add a test that pins which of the two is meant.

# ---------------------------------------------------------------------------
# WHAT THIS CONTRACT DID NOT REACH, and the completeness claim is left to
# nobody, per the criteria clause.
