      Parking is a legitimate decision and the brief puts the wiring question
      out of scope, so this finding is not about whether to wire it. It is
      about the entry's accuracy, which is what the parked entry is FOR: it
      exists so the next person can weigh the mechanism. As written it tells
      that person the mechanism is nearly toothless, when for the defect that
      actually occurred it has an exit code, and for the defect it cannot
      reach it gives no protection at all rather than weak protection. Both
      halves of the trade are misreported, in opposite directions, which is
      how a park becomes permanent.
  - id: ADV-M0P13-07
    severity: medium
    evidence:
