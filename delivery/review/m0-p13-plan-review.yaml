      "It was false from 62612ad on 2026-08-23, the commit that first changed
      src/app/globals.css, and it survived all nine of that phase's fix
      rounds."
    analysis: >-
      Trivial arithmetic, and I would not raise it in an ordinary plan entry.
      I raise it here for two reasons. The first is that this amendment's
      subject is claims that nobody measured, so a number it states about
      itself is held to its own standard, and three copies of one unchecked
      ordinal is the exact shape it is correcting. The second is that it came
      from my own review: I asserted "second working commit" without running
      git log --reverse, the author took it, and it propagated into two
      registers. That is the mechanism the parked entry describes, reproduced
      inside the round that describes it.
