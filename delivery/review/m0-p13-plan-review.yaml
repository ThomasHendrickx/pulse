    concrete-edit: >-
      Replace that sentence with one that separates the two arms: "Wired up,
      this gate would have gone RED on the first defect at the branch's
      second working commit, because a touched path with no declaration entry
      is `violations` and scope.js returns status red for it. What DR-0031
      relaxed is the other arm: an entry the branch ADDS to its own
      declaration is allowed and printed by name, so the fix would have
      landed with the phase and been signed off by a reader rather than
      refused. The second defect it would not have reached at all, in either
      arm: this gate audits paths and never reads conflicts-with."
