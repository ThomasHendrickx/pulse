        named, and which ASSIGNS the approved values into process.env for the
        whole process. src/platform/db/gate-target.ts on the phase branch
        says so in its own header: "Exporting DATABASE_URL, DIRECT_URL and
        the SUPABASE_* values in the invoking shell, which is how this gate
        was run for every round before this one, NO LONGER WORKS ... the run
        stops with GateDbTargetRefused before a single test executes."
      - >-
        M3-P9's edit widens `testMatch` on the chromium-phone project to
        include pressed-and-disabled.spec.ts, which is the spec its criterion
        9.7 pins the phase to.
      - >-
        Composed, the two are not independent: after a merge in either
        order, M3-P9's new spec runs only under a refusal that did not exist
        when M3-P9's e2e evidence was produced, and M3-P9's own operating
        instructions for the suite are invalidated by a file it also edits.
        The regions are disjoint, the merge is clean, and the OPERATING
        REQUIREMENT is shared.
    concrete-edit: >-
      Sharpen the sentence rather than deleting it, in M3-P12's
      conflicts-with entry: "The changed regions are disjoint and neither
      edit's correctness depends on the other's text. They are NOT
      independent in effect: M3-P12's call is at module scope and governs the
      whole config, so after either merge order M3-P9's added spec runs under
      a database-target refusal that did not exist when M3-P9's slow gate was
      green. Whichever merges second re-runs npm run test:e2e under the
      merged config before its phase is closed, and that run, not the merge
      exit code, is what clears this pair."
    analysis: >-
      The brief asked whether "independent in meaning" is defensible for
      these two changes. Half of it is: the edits do not read or write each
      other's text, the regions are far apart, and the merge is clean, which
      I re-ran. The other half is not, and the asymmetry is what makes it
      checkable rather than a matter of taste. One edit is LOCAL (a regex on
      one project) and the other is GLOBAL (a throw and a process.env
      assignment at module load). A local change and a global precondition in
      the same file are independent in text and composed in effect, always,
      and here the composition lands on the very spec the other phase added.
      This is not a reason to reorder anything; it is a reason to name the
      re-run that clears the pair, which no criterion of either phase
      currently requires.
