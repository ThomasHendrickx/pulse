        place the plan's vocabulary and the auditor's meet."
      - >-
        Confirmed by running the shipped stripper over the amended
        declaration: stripGloss from
        node_modules/@tiphys/kernel/dist/src/plan.js reduces the entry to the
        bare string ".gitignore", and all 42 entries of files-to-touch plus
        extras project to literal paths (isLiteralPath true for every one).
        The generated phase declaration, and therefore the auditor's printed
        line, carries ".gitignore" and nothing else.
      - >-
        The repair itself is real and correctly described, verified against
        history: 62612ad (2026-08-23 09:46:43) shows `A node_modules`,
        fc5aef4 (2026-08-23 19:19:17) shows `D node_modules` and changes
        .gitignore from "node_modules/" to "node_modules". So the branch did
        create the tracked symlink and did untrack it, and declaring it was
        the right call.
    concrete-edit: >-
      Keep the entry and its gloss, and put the precedent refusal somewhere
      that survives projection and is read before the next phase writes its
      declaration. Add to the new parked entry, or to a decision of its own:
      "M3-P12 carries one unrelated repair, .gitignore, because that branch
      created the defect it repairs (a tracked node_modules symlink whose
      content is an absolute container path, in a public repository). It is
      declared so the declaration equals the diff. It is NOT a precedent: a
      phase that did not create a defect does not repair it on its branch,
      and the glosses that say so are stripped by tiphys plan project, so
      this sentence is the one that carries the rule."
    analysis: >-
      The brief asked two things here and they separate cleanly. Declaring
      the repair: right, and the alternative (leaving it undeclared) is the
      defect the whole amendment is against. Making the repair on a phase
      branch: also right in this instance, and for the stated reason, that
      this branch created it, which I verified rather than took. The gloss
      preventing the precedent: no. A gloss is prose inside a parenthesis
      that the projector deletes by design, so it reaches humans reading the
      plan and no one else, and "no later phase reads it as a precedent" is a
      claim about a reader the artifact does not reach.
