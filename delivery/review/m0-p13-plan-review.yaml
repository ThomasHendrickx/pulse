      - >-
        The amendment inherited it in three places. D-44: "It was false from
        the phase branch's second working commit, 62612ad on 2026-08-23".
        parked[32], twice: "went undeclared from the branch's second working
        commit on 2026-08-23", and "it would have gone RED ... at the branch's
        second working commit".
      - >-
        THE WRONG FILE IS NAMED WITH IT, and the true one is in the entry's
        own list. parked[32] says "The earliest of them, src/app/globals.css".
        Taking the 23 pre-amendment uncovered paths and asking git for the
        first commit that touches each, the minimum is
        src/modules/merchants/domain/counterparty-identity.ts in 502da43 at
        2026-08-23 09:22:54, the branch's FIRST commit. globals.css and the
        three message catalogues tie for second at 62612ad, 09:46:43.
      - >-
        The correction runs in the entry's own favour twice over. The branch's
        very first commit already touched an undeclared path, so the honour
        system failed at commit one rather than commit two, and the path it
        failed on was the phase's own subject file, which parked[32] already
        names in its list.
      - >-
        It matters because of where it sits: the passage is introduced with
        "stated so that the record does not undersell what is not being
        switched on", and it undersells in that sentence.
    concrete-edit: >-
      Correct all three occurrences and take the stronger fact. In parked[32]:
      "The earliest of them is the phase's own subject file,
      src/modules/merchants/domain/counterparty-identity.ts, undeclared from
      the branch's FIRST commit, 502da43 on 2026-08-23; src/app/globals.css
      and the three message catalogues followed at 62612ad the same morning,
