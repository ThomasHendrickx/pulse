    analysis: >-
      This is the only finding that changes what the implementer builds, and it
      is worth the interruption precisely because the implementer is building
      now: the platform account-number module is step 2, near the front of the
      work, and writing it from scratch is a wasted afternoon that ends in a
      criterion that cannot be satisfied without touching six merchants files
      the phase does not declare. The phase is not wrong to want the code in
      src/platform; the ledger domain imports nothing from another module
      (.claude/skills/pulse-domain/SKILL.md:168), so platform is the only home
      four modules can reach. What changed under the plan is that the code is
      already written, in the wrong module, by a phase that shipped while the
      plan was being rewritten. The residual hazard if this is left alone is
      not immediate wrong money: a registered account's transfers classify as
      INTERNAL or RESERVE and never reach the naming screen, so the merchants
      copy is not consulted for them. It is drift. Two country-length tables
      and two mod-97 implementations, one owned by setup and one owned by
      merchant grouping, is one rule that can go two ways, and criterion 14.4
      exists in this plan for exactly that reason.
  - id: PR7-002
    severity: medium
    evidence:
      - >-
        Step 5 (delivery/plan/pulse-v02.yaml:7775) says the refusal is "one new
        machine reason on the existing union
        (src/modules/import/application/ports.ts:72 through :81) ... whose
        message names the setup screen and links to it", and then that "A
        statement whose own account is registered in the SAVINGS ring is
        refused by the same mechanism ... and its message names the ring
        correction and what that correction costs".
      - >-
        Criterion 14.5 (delivery/plan/pulse-v02.yaml:7945) requires those two
        cases to render DIFFERENT text. Case one: "the rendered message names
        the setup screen and links to it". Case two: "a message that names the
        ring correction AND WHAT IT COSTS, that the account leaves the reserves
        block and every transfer into it stops counting as money set aside; a
        message naming the remedy without its price fails this criterion".
      - >-
        ONE REASON CANNOT CARRY TWO MESSAGES IN THIS CODEBASE. Captured from
        src/modules/import/application/ports.ts:71 through :81:
        ImportFailureReason is a flat union of string literals
        ("mixed-accounts", "undetectable", "unparseable", "layout-unsupported",
        "balance-mismatch", "extraction-failed", "layout-version-mismatch")
        with no payload. Captured from src/modules/import/ui/status-keys.ts:6
        through :10: IMPORT_STATUS_KEYS maps each tag to exactly one message
        key ("no-file" to importNoFile, "bad-spec" to importBadSpec,
        "declaration-needed" to importDeclarationNeeded). One tag, one
        catalogue key, one message.
      - >-
        So an implementer following step 5 literally adds one tag and one
        catalogue key, and then 14.5 cannot go green on both cases. The
        available escape is a single message that covers both, which tells a
        household whose account was never registered at all to correct a ring,
        and tells a household whose savings account is correctly registered to
        go and register it. Both are a wrong instruction on a screen, and the
        second is the message decision D-55 exists to deliver.
    concrete-edit: >-
      In step 5, replace "Anything else is refused with one new machine reason
      on the existing union" with "Anything else is refused with TWO new machine
      reasons on the existing union, one for an own account that is registered
      nowhere and one for an own account registered in the savings ring, each
      whitelisted in src/modules/import/ui/status-keys.ts and translated
      separately in all three catalogues, because the union carries no payload
      and one tag renders one message." In the same step replace "is refused by
      the same mechanism" with "is refused by the same gate under the second of
      those reasons". Add to criterion 14.5, after its second case, the
      sentence: "The two cases must resolve to two DISTINCT machine reasons and
      two distinct catalogue keys; the test asserts the rendered text of the
      two differs and that neither message tells the household to do the other
      one's remedy."
    analysis: >-
      A one-word defect with a real consequence and a cheap edit, which is why
      it is worth sending. The savings-ring refusal is the entire user-facing
      half of decision D-55: it is the moment a household is told that the
      product will not import this statement and what to do instead. If it
      collapses into the generic not-registered message, the household is sent
      to a setup screen where the account is already listed, sees no problem,
      and has no route forward. Two tags cost one line each in the union, the
      whitelist and three catalogues.
  - id: PR7-003
    severity: medium
    evidence:
      - >-
        Hazard H14.4 (delivery/plan/pulse-v02.yaml:8050) states the failure and
        names its only guard: "A savings account is marked as a spending
        account at setup, so its transfers pair as internal instead of showing
        as money set aside, the reserves block understates what was saved, and
        nothing on any screen distinguishes that month from a correct one. The
        explanation given before the ring is answered is the only guard v1 has."
      - >-
        Criterion 14.2 (delivery/plan/pulse-v02.yaml:7886) discharges it with:
        "the copy explaining what each ring means renders BEFORE the ring
        control and is present in all three catalogues", closing with "a screen
        that asks the question without answering it first fails this
        criterion".
      - >-
        RENDERS BEFORE IS DOM ORDER, AND DOM ORDER IS SATISFIED BY HIDDEN TEXT.
        A details element, a collapsed "what do these mean?" panel, a
        visually-hidden block or a tooltip payload all sit earlier in the
        document than the ring control and all satisfy the criterion as
        written, while the owner answers eight rings having read nothing. The
        criterion goes green and the guard does not exist. That is the vacuous
        pass, and it lands on the one hazard the phase says has no second line
        of defence.
      - >-
        The frontend skill already forbids the shape this criterion permits:
        .claude/skills/pulse-frontend/SKILL.md:105, cited by this phase's own
        grounding, is the rule that a screen never hides an unknown. The
        criterion is the place that rule has to be made testable, because a
        Playwright locator that has been resolved but never asserted visible
        passes over a collapsed element.
    concrete-edit: >-
      In criterion 14.2, replace "that the copy explaining what each ring means
      renders BEFORE the ring control and is present in all three catalogues"
      with "that the copy explaining what each ring means is VISIBLE without any
      interaction, asserted with toBeVisible at 390 CSS pixels wide with no
      click, hover or expansion first, and precedes the first ring control in
      the document, and is present in all three catalogues". Add as the last
      sentence of the criterion: "A collapsed disclosure, a tooltip or a
      visually-hidden block satisfies document order and fails this criterion,
      because the guard is that the sentence was on the screen when the answer
      was given."
    analysis: >-
      This is the risk the phase itself flags as knowingly weakened, and the
      honest judgement is that the explanation is a thin guard even at its best:
      a person setting up an app reads little and the ring words are not obvious
      to a Belgian household that thinks in current and savings accounts. But
      thin and absent are different, and as written the criterion cannot tell
      them apart. Eight rows on a phone is exactly the layout where a designer
      reaches for a collapsible explainer to save vertical space, so this is not
      a contrived implementation; it is the likely one. The edit is one clause
      and one sentence and costs the implementer a toBeVisible.
  - id: PR7-004
    severity: medium
    evidence:
      - >-
        Step 6 (delivery/plan/pulse-v02.yaml:7808) rests the deletion of the
        clearing and read-scoping machinery on a stated premise: "An account's
        ring can be changed on the accounts screen WHILE THAT ACCOUNT HAS NO
        IMPORTED ROWS OF ITS OWN, which is decision D-51 as rewritten and
        covers every case the new shape can produce: a savings account marked
        spending at setup HAS NO STATEMENT OF ITS OWN, so correcting it only
        reclassifies the CURRENT account's transfers to it".
      - >-
        THE PHASE'S OWN IMPORT GATE FALSIFIES THAT PREMISE. Step 5
        (delivery/plan/pulse-v02.yaml:7775) and criterion 14.5 accept "a file
        whose own account number resolves to a REGISTERED account", and refuse
        only where the registered account is in the SAVINGS ring. A savings
        account mis-registered as spending is registered in the POT ring, so
        its own statement is ACCEPTED. The gate that would have stopped it,
        D-55, fires on the correctly registered account and not on the
        mis-registered one.
      - >-
        Once accepted, the account has imported rows of its own, and D-51
        refuses the ring change for exactly that reason. The mistake H14.4
        describes has then locked out its own only remedy, permanently, inside
        the product.
      - >-
        The end state is the one H14.4 names and is now unfixable: transfers
        between the current account and that account take the pot arm at
        src/modules/ledger/domain/classify-flow.ts:73 and are INTERNAL, so the
        reserves block understates by everything set aside there, while
        src/modules/ledger/domain/reconciliation.ts:70 through :81 forms the
        identity from spend and reserves with the same sign and reports the
        books closed. Nothing on any screen distinguishes that month from a
        correct one.
      - >-
        AND NO CRITERION SAYS WHAT THE HOUSEHOLD DOES NEXT. Criterion 14.8
        (delivery/plan/pulse-v02.yaml:7998) asserts only that "a ring change is
        refused for an account that already carries its own imported rows,
        asserted at the application level". Step 6 says "the screen says so
        rather than failing silently", but no criterion tests any screen text
        for that refusal, so the refusal is explicit in the plan and untested in
        the phase.
    concrete-edit: >-
      Two edits. ONE, correct step 6's premise: replace "a savings account
      marked spending at setup HAS NO STATEMENT OF ITS OWN, so correcting it
      only reclassifies the CURRENT account's transfers to it" with "a savings
      account marked spending at setup is corrected while it has no imported
      rows, and correcting it then only reclassifies the CURRENT account's
      transfers to it. The gate at step 5 accepts that account's OWN statement,
      because the account is registered in the pot ring, and importing it closes
      the remedy for good. v1 accepts that: the ring change is a fix for a
      mistake caught before a statement is uploaded, not after, and the screen
      must say which of the two the household is in." TWO, add to criterion 14.8,
      after its ring-change sentence: "A Playwright test asserts that on the
      accounts screen an account carrying its own imported rows renders its ring
      as unchangeable with a line of copy, present in all three catalogues,
      saying that a ring is fixed once a statement for that account has been
      imported and that the only route to change it in v1 is outside the
      product, so the refusal is visible rather than a disabled control with no
      reason."
    analysis: >-
      The plan is right to keep the ring change small and right to delete the
      clearing machinery: the sentence "no row on a non-pot account can carry a
      stale flow" survives every path this reviewer could construct, and finding
      PR7-004 does not reopen it. What it reopens is narrower and is a claim the
      plan makes in its own justification: that the D-51 window covers every
      case the new shape can produce. It does not cover the case where the
      household acts on the mistake by uploading the mis-registered account's
      statement, which the product invites by accepting it. The right answer at
      this size is not to build a way back; it is to stop the plan asserting a
      coverage it does not have and to make the refusal say plainly that the
      window has closed. A household that reaches this state must start a fresh
      household and re-import, and it is better for that sentence to be on the
      screen than to be discovered.
