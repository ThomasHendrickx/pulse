# Adversarial plan review of phase M3-P14 (account setup), the rewritten
# single-phase form of the M0-P6 iteration. Reviewer worktree wt-m0p6-adv,
# branch claude/m0-p6-plan-review, plan head origin/claude/m0-p6-plan-accounts
# merged at 5416303. The phase text read is delivery/plan/pulse-v02.yaml:7670
# through :8104.
#
# WHY THIS DOCUMENT IS A FINDING SET AND NOT A VERDICT. Unchanged from rounds
# one and two, whose headers carry the captured tiphys output: a verdict judges
# an IMPLEMENTED phase against a work history, requires phase, criteria,
# deviations-judged and review-contract, and carries concrete-fix (a fix to
# CODE) where a plan review carries concrete-edit (an edit to the PLAN). M3-P14
# has no work history. Validated as --type finding, as the three precedent
# reviews in delivery/review/ are.
#
# THIS ROUND IS DELIBERATELY SMALL. The owner's instruction of 2026-08-26 binds
# it: two phases became one, twenty-one criteria became nine, twenty-seven
# hazard classes became nine, and an implementer is building in parallel. A
# finding here has to be worth interrupting a build for. Wording, tightenable
# criteria, missing harnesses and absent instrumentation were all seen and all
# left alone. Four findings, one high and three medium.
#
# WHAT WAS WALKED. All nine criteria and all nine hazard classes from the plan
# text; the six steps; files-to-touch, migrations and conflicts-with; the
# report-code-disagreement entries for this phase (delivery/plan/pulse-v02.yaml
# :2068 through :2200); and the code the phase cites, at origin/main rather than
# only at the phase's grounding commit 75ec85d, which is what surfaced the one
# high finding. Round-two finding R2-001, the savings statement uploaded by a
# household that has registered nothing, is ANSWERED by criterion 14.5's gate
# and needs nothing further.
#
# THE OWNER'S SCENARIO WAS TRACED THROUGH THE CODE AND IT LANDS. Four bank
# accounts plus four savings accounts is the eight of criterion 14.1; two credit
# cards are excluded at setup by decision D-48 and criterion 14.6; one uploaded
# bank statement's transfers to the pot siblings take the pot arm at
# src/modules/ledger/domain/classify-flow.ts:73 and become INTERNAL, its
# transfers to the savings siblings take the reserve arm at :62 and become
# RESERVE, and merchant resolution runs over INCOME and SPEND rows only, so none
# of the seven is offered as a merchant to name. No finding disputes the shape
# of the phase. Findings 1 and 4 dispute two premises inside it.
#
# THE THREE FLAGGED RISKS, ANSWERED IN THE REPORT AND IN FINDINGS 3 AND 4.
# Risk 3, the deleted decision D-56, was tested link by link and the chain HOLDS
# for the households this phase creates. Card accounts are the link that looked
# breakable and is not: deriveDeclaredSets at
# src/modules/ledger/domain/ledger-transaction.ts:56 through :70 puts a card
# account (a POT account with no account number) into potAccountIds, so
# src/modules/ledger/application/interpret-window.ts:37 loads its rows and no
# card row can sit uninterpreted on a non-pot account. No finding is raised
# against the deletion.
#
# HOUSE RULES. No em dash in this file, checked. No amount, no counterparty, no
# date from a row and no account or card number anywhere in it or in its commit
# message. English throughout.
kind: finding
verdict: FIX-ROUND-NEEDED
produced-by: claude (Opus 5, claude-opus-5)
findings:
