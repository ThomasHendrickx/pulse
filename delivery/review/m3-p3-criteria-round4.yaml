# NO DATA IN THIS DOCUMENT. Warnings 11 and 12, PUBLIC repository: no
# amount, no counterparty, no place name, no country name, no account or
# card number, no data row, and the real uploads are never named. They are
# document A (the card statement) and document B (the account statement).

# BEACON LOG
# t0: worktree reused, fetched, checked out 9ad057e, clean, prisma generate ok.
#
# t1: GATES, all run by me at 9ad057e.
#     npm run typecheck    -> EXIT=0  no diagnostics
#     npm run lint         -> EXIT=0  no output
#     npm test             -> EXIT=0  Test Files 32 passed (32)
#                                     Tests 428 passed (428), 0 skipped
#     npm run gate:privacy -> EXIT=0  "gate:privacy clean"
#     npx prisma migrate deploy -> EXIT=0, 6 migrations, nothing pending
#     npm run test:e2e     -> EXIT=0, 22 passed (3.7m). The contended ports
#       were moved for the run only; playwright.config.ts restored and
#       git diff --quiet confirms the committed file byte-identical.
#
# t2: THE THIRD ARITHMETIC, and whether criterion 3.3 discriminates. THE
#     MEASUREMENT THAT MATTERS, run by me at BOTH heads with the same
#     mutation, the stored printed figure ignored so every import falls
#     back:
#       at 91a3abf (my previous head): Tests 1 failed | 419 passed (420),
#         the single failure in test/domain/kbc-fix-round-3.test.ts. That
#         was finding CR3-M3P3-01.
#       at 9ad057e (this head):        Tests 4 failed | 424 passed (428),
#         across THREE files, of which TWO are in criterion 3.3's own
#         witness file test/application/kbc-settlement.test.ts, one at its
#         line 231 describe and one at line 259.
#     Four, not the two the round claims for itself. The finding is closed
#     and the discrimination is back where the criterion can see it.
#
# t3: RED WITNESSES, mine, each reverted with git diff --quiet clean
#     afterwards. Selection: four KBC test files, 48 tests.
#       A row drop                    -> 16 failed | 32 passed
#       B continuation lines unfolded ->  1 failed | 47 passed
#       C bookingDate := settlement   ->  1 failed | 47 passed
#       D balance gate disabled       ->  2 failed | 46 passed
#       E dedup ordinal frozen        ->  1 failed | 47 passed
#       G identity normaliser folding digits as well as typography
#                                     ->  5 failed | 43 passed
#
# t4: IDENTITY REGRESSION CHECK, both directions, now across FOUR distinct
#     cards: one card printed on two different statements still asks once
#     and lands in one account; four different cards ask four times and
#     land in four accounts, rows 3 / 4 / 9 / 9, no absorption, and all
#     four imports carry a stored figure.
#
# t5: THE DISPUTED TOKEN, settled by LOCATING rather than counting, using
#     this repository's own extractor. Upper-cased, whole-word occurrences
#     in document A: ZERO. In document B: ZERO. Substring occurrences in
#     document B: five, and all five lie inside ONE distinct enclosing
#     word. So the whole-word method this lane used was the correct one
#     and the substring test that reported a coincidence counted a
#     fragment. Three further fragment-only tokens were found the same
#     way, each inside one or two enclosing words, none a whole word.
#
# t6: THE BANK ADDRESS, confirmed against the round's own interest: the
#     fixture builder's shared header helper does emit a bank address
#     line, an invented street with a REAL city, and that city is the one
#     token occurring as a whole word in BOTH documents. It is
#     bank-controlled boilerplate identifying the bank rather than the
#     household, so it is correctly left; the point is that it was found
#     and written down rather than argued away.

findings:
  - id: CR4-M3P3-01
    severity: medium
    evidence:
      - "The account pattern was split this round, and the two halves do not agree on case. The local shape at scripts/gate-privacy.sh line 64 takes a case-insensitive country code; the foreign shape at line 65, the one introduced this round to accept letters in the account body, is upper-case only in both its country code and its body."
      - "Executed red witnesses, six probes into a tracked file, each reverted: an UNLISTED local account number fails the gate in upper case, in lower case, and in spaced form, all EXIT=1. An UNLISTED foreign account number fails in upper case, EXIT=1, but PASSES in lower case and in mixed case, EXIT=0 both times. A foreign account number written in lower case is invisible to the gate whether or not it is on the allow list."
      - "test/fixtures/allowed-identifiers.txt line 17 now states that account shapes are matched case-insensitively and accept letters in the account body. Both properties are real but they do not hold of the same pattern: the shape that accepts letters in the body is precisely the one that is not case-insensitive. Finding CR3-M3P3-02 was that this file under-promised; it now over-promises, which is the second direction and the more dangerous one, because a reader trusts a green gate for a coverage it does not have."
      - "delivery/work-history/m3-p3.yaml records under deviation DEV-M3P3-13 that a lower-case account shape passing unlisted was closed with a red witness. That is true of the local shape and false of the foreign shape introduced in the same round, and my probes above are the demonstration."
      - "THE FIX IS NOT A ONE-LINER, measured rather than assumed. Widening the foreign pattern to accept lower case closes the hole (unlisted lower-case probe EXIT=1) but reports the clean tree as dirty, because a case-insensitive alphanumeric run of that length matches encoded blobs in a committed reference document. Upper-casing the haystack for that shape alone closes it identically and produces the same false positives on the same file. Both variants were run and reverted."
    concrete-fix: "Take the smaller half now and the larger half deliberately. Correct the sentence at test/fixtures/allowed-identifiers.txt line 17 so it says which shape is case-folded and which is not, since a claim that the gate does not keep is worse than no claim. Then, if the case hole is to be closed rather than described, exclude the encoded-blob file from rule 2 the way the lockfile and image paths already are at scripts/gate-privacy.sh line 102, and only then widen the foreign shape, re-running the clean-tree probe to confirm EXIT=0. Shipped behaviour at risk: a non-Belgian account number written in lower case reaches this PUBLIC repository with the gate green, which is the exact class this gate exists to narrow."

  - id: CR-M3P3-08
    severity: low
    evidence:
      - "CARRIED FORWARD FOR THE FOURTH TIME, still open, verified present at this head rather than assumed: delivery/intake/pulse-v0.2-pdf-addendum.md line 79 quotes a continuation line from document A verbatim, including its original-currency figure. I located it again at 9ad057e and did not edit it."
      - "It remains with the owner. The implementer is forbidden by dispatch to touch that directory and has declared the restraint in every round since."
      - "It is outside criterion 3.5 half (a)'s four named categories, so that criterion exits 1 with it present. That is why 3.5 is met and this stays open at the same time."
      - "Warning 12 and DR-0024 keep the repository public, so the line is world-readable and history retains it after any later correction."
    concrete-fix: "Owner action. Replace the quoted figure and currency at delivery/intake/pulse-v0.2-pdf-addendum.md line 79 with an invented pair; the sentence teaches a line shape and loses nothing. Recorded again so that a fourth approval does not discharge it."

  - id: CR4-M3P3-02
    severity: low
    evidence:
      - "THREE ITEMS CARRIED FORWARD TOGETHER, none a regression and none introduced by this round, recorded so that an approval is not read as deciding them. First, the round-figure amount of deviation DEV-M3P3-05 is still in the tree at this head; my sweep returns it. The disposition is unchanged since round 2: measured, judged a probable coincidence, every location listed, escalated rather than replaced."
      - "Second, the history-purge decision. Every leak found in this sequence has been fixed at HEAD and none has been purged from history, which the work history states plainly in DEV-M3P3-03 and DEV-M3P3-04. On a public repository that is the owner's call and nobody else's."
      - "Third, open question M3P3-F3-Q1, the confirm-step binding, deliberately left open by the coordinator. It now carries the sharper form: a reissued card cannot continue on its existing account, AND the account it should continue on may already hold another card's rows. I verified the mechanism rather than reading it: four genuinely different cards produce four identities, four declarations and four accounts, so nothing in the current flow can attach a new identity to an existing account."
    concrete-fix: "For the round figure, either accept the coincidence reading on the record or replace it in the locations already listed; the change is mechanical. For history, decide once whether the sequence's fixed-at-HEAD leaks need a rewrite, and record the decision where the next reviewer will find it. For the binding, let the confirm step offer an existing account as well as a new one, so a reissued card can continue where its predecessor left off; that is a phase of its own and should not be folded into this one."

