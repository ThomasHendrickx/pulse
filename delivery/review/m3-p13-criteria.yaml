deviations-judged:
  - deviation: >-
      Criterion 13.2, "the rendered HTML of /merchants contains the masked form
      and does NOT contain the unmasked account anywhere, asserted over the
      full page source; and the hidden field the naming form submits carries
      the unmasked namespaced identity key, asserted on the same page."
    serves-plan-intent: true
    reasoning: >-
      The deviation itself is right and the escalation was the correct move:
      the two halves of the clause cannot both hold for an account-basis
      group, because that group's namespaced identity key IS the namespace
      followed by that account, and the criterion demands the key be carried
      unmasked in a field that is part of the page source. Stopping, reporting
      and asserting a true weaker form serves the intent, which is that the
      account is not shown to a person; a phase that silently asserted a
      half-truth or masked the key would have served neither. The judgement
      this lane adds is on the WEAKER FORM CHOSEN rather than on the decision
      to choose one: two of the three excluded channels are forced and the
      third is not, which is finding CR-M3P13-01, and the sweep is over one
      account when the fixture holds one for which the literal clause is
      reachable, which is CR-M3P13-02. Both are findings against the work, not
      against the deviation.
  - deviation: >-
      files-to-touch, which declares test/domain/ and test/e2e/ but neither
      test/application/ nor test/property/, and which declares
      src/modules/merchants/application/merchant-review.ts but not that
      module's index.ts.
    serves-plan-intent: true
    reasoning: >-
      Witnessed and mechanical, exactly as declared. CountedTransaction and
      CountedRow gained a REQUIRED bookingDate, so every construction of those
      types had to supply one: test/application/fake-import-world.ts gains one
      line mapping the stored row's own date, and
      test/application/rederive-merchant-rules.test.ts and
      test/property/rederive-loss-reporting.test.ts gain invented dates on
      their row builders. The diff of those three files is 8 lines and adds no
      assertion and removes none. ReviewGroupRow is re-exported from
      src/modules/merchants/application/index.ts, which the module boundary
      requires because the UI may import only through the published interface.
      The declaration is read from the merge base and cannot be amended on
      this branch, so reporting is the only available move and it was taken.
  - deviation: >-
      Step 5, "Let the transactions behind a group be seen".
    serves-plan-intent: true
    reasoning: >-
      Applied to RESOLVED groups as well as unresolved ones, which is more
      than criterion 13.3 exercises. It serves the intent: the phase exists so
      that DR-0027's accepted cost, two purposes paid to one counterparty
      landing in one group, reads as two lines the owner can point at, and
      naming that group does not make the two purposes stop being two. Hiding
      the lines the moment a name is given would answer the owner's question
      and then withdraw the answer. It costs one disclosure element per
      resolved row and no query, since the rows come from the read that
      already built the groups, and it is witnessed by a fast-gate test that a
      resolved group still carries its rows.
