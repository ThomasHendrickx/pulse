findings:
  - id: CR-M3P13-01
    severity: medium
    analysis: >-
      THE SECOND OF THE THREE EXCLUDED CHANNELS IS NOT NECESSARY, AND THE
      REASON GIVEN FOR ITS NECESSITY IS CONTRADICTED BY THE CRITERION IT
      CITES. The escalation on criterion 13.2 excludes three channels from the
      page-source sweep. Two of them survive this lane's scrutiny. The hidden
      counterpartyText input is required by the criterion itself. The
      framework's serialised payload is downstream of that requirement and
      cannot be removed while the naming row is a client component, because
      the identity key must reach it as a prop and a prop is serialised
      whatever shape it is given. THE THIRD, the row's data-group-key, is a
      free choice, and the justification offered for it is that masking it
      would collide two accounts sharing a country, check digits and last four
      characters and thereby break criterion 11.3's row identity. Criterion
      11.3 says the opposite in its own text: it states that the data-group-key
      sequence is added to the row MASKED, and that "Two rows whose MASKED keys
      are equal are indistinguishable to this comparison, which is accepted and
      stated rather than left to be discovered (finding DELTA-M0P4-08)".
      Collision under masking is not a breach of 11.3; it is a limitation 11.3
      already declares and accepts, and the card mask that IS applied to this
      same expression already produces exactly that class of collision for card
      descriptors. So the strongest true form of 13.2 available at this head
      excludes TWO channels, not three, and what shipped excludes three. The
      consequence in the product is small but real and it is live: every
      account-basis row of /merchants carries the unmasked counterparty account
      in a DOM attribute, on the very screen whose headline criterion reads
      "THE ACCOUNT NEVER LEAVES THE DISPLAY LAYER UNMASKED". It is not visible
      in a screenshot, which is why this is medium and not high.
    evidence:
      - "src/modules/merchants/ui/merchant-review.tsx:185, groupKey={maskCardNumbers(group.key)}, which the client leaf renders as data-group-key (src/modules/merchants/ui/merchant-row.tsx:268). maskCardNumbers is anchored on the card-number label grammar (src/platform/ui/mask-card-number.ts) and does not touch an account number, so for an account-basis group, whose key is the account namespace followed by the compact account, the attribute is the account in full. THE OTHER SITE IS NOT THE LEAK: merchant-review.tsx:123 is the unnameable branch, and an account-basis group can never reach it, because unnameableReason is set only for a BARE namespace and the account branch emits a non-empty compact account by construction. Named here so the fix is applied for consistency rather than because that row leaks."
      - "delivery/plan/pulse-v02.yaml:6712 through :6725, criterion 11.3(b): the data-group-key sequence is added to the row element MASKED, and 'Two rows whose MASKED keys are equal are indistinguishable to this comparison, which is accepted and stated rather than left to be discovered (finding DELTA-M0P4-08)'."
      - "test/e2e/identity-on-review.spec.ts, the leak sweep: for (const row of clone.querySelectorAll('[data-group-key]')) { row.removeAttribute('data-group-key'); } is one of the three removals, and the comment beside it gives the collision argument this finding refutes."
      - "Reviewer probe, committed helpers, exit 0: maskAccountNumbers over the fixture's counterparty account returns the country code, the check digits and the last four characters, so the masked key remains a per-country, per-check-digit, per-tail identity rather than a constant."
    concrete-fix: >-
      Mask the account in the row identity as well, so the excluded set is two
      channels rather than three: merchant-review.tsx:185 becomes
      groupKey={maskAccountNumbers(maskCardNumbers(group.key))}, and :123
      matches it for consistency. Build the
      locator in test/e2e/identity-on-review.spec.ts from the masked key the
      same way the spec already builds the masked label, drop the
      data-group-key removal from the page-source sweep, and restate the
      escalation in delivery/work-history/m3-p13.yaml as two necessary
      channels with 11.3's own acceptance quoted for the third. If the
      residual collision in the client naming-claims store
      (src/modules/merchants/ui/merchant-row.tsx, rowKey: groupKey) is judged
      unacceptable at this tier, use a stable digest of the unmasked key
      instead of the masked key: it keeps the identity injective for the claims
      store and for 11.3's sequence comparison, and it removes the account from
      the attribute completely.
  - id: CR-M3P13-02
    severity: medium
    analysis: >-
      THE PAGE-SOURCE SWEEP IS OVER ONE ACCOUNT, AND THE FIXTURE CONTAINS AN
      ACCOUNT FOR WHICH THE CRITERION'S LITERAL CLAUSE IS ACHIEVABLE AND
      UNTESTED. The contradiction in 13.2 bites only on an account that IS an
      identity key: such an account must appear in the hidden subject, so it
      must appear in the source. The identity fixture carries an account for
      which that is not true. Row 20 carries TWO account-shaped tokens and the
      importer's first-wins rule stores the first, so the SECOND token's
      account is never an identity key, never a hidden subject and never a
      data-group-key. It reaches the screen only through row 20's description,
      which the new transaction lines render and which is masked there. For
      that account the criterion's literal clause, no unmasked account anywhere
      in the FULL page source with nothing excluded, should hold exactly as
      written, and asserting it is strictly stronger than what shipped: it
      shows the exclusion set is forced by the contradiction rather than
      chosen for convenience, and it is the only assertion on this screen that
      can demonstrate that. The same gap applies more weakly to the other three
      trusted counterparty accounts, which the sweep does not name at all: the
      sweep proves masking for counterparty1 and infers it for the rest.
    evidence:
      - "test/fixtures/generate-pdf-fixtures.ts:1268 through :1289: 'Row 20 carries TWO distinct account-shaped tokens, and the record below says which one the generator wrote FIRST, so criterion 12.16 pins the importer's first-wins rule', and IDENTITY_FIXTURE_TWO_TOKEN exports rowOrdinal 20 with firstTokenSpaced and secondTokenSpaced; IDENTITY_FIXTURE_ACCOUNTS exports a secondToken entry described as existing 'only as row 20's SECOND token and must therefore never appear in any identity key'."
      - "test/e2e/identity-on-review.spec.ts: the sweep is parameterised on `account` and `spacedAccount` derived from IDENTITY_FIXTURE_ACCOUNTS.counterparty1 alone; test/e2e/identity-fixture-facts.ts restates only `own` and `counterparty1`, so no other account is reachable from the spec at all."
      - "src/modules/merchants/ui/merchant-review.tsx:84, the transaction line: maskAccountNumbers(maskCardNumbers(row.description)), which is the only surface row 20's second token reaches."
    concrete-fix: >-
      Add the second-token account to test/e2e/identity-fixture-facts.ts (and
      to the derived agreement test in test/domain/identity-on-review.test.ts,
      which compares that module to the generator per key and will pick it up
      with no edit), then assert in the same spec, over `await page.content()`
      with NOTHING removed, that neither its compact nor its spaced shape
      appears, while the masked shape does. That is criterion 13.2's page-source
      clause met literally for the account it can be met for, beside the
      escalated form for the account it cannot.
  - id: CR-M3P13-03
    severity: medium
    analysis: >-
      THE RESIDUE ENUMERATION IN THE NEW MASKER IS INCOMPLETE, AND THE SURFACE
      IT OMITS IS THE ONE THE OWNER ALREADY PHOTOGRAPHED. The masker's header
      states its residue "rather than left to be found" and names the month
      view's gap and held rows. It does not name the import confirm-format
      preview, which renders the RAW parsed descriptor through the card mask
      only, and which src/platform/ui/mask-card-number.ts identifies as "the
      screen the owner photographed" when the card number leaked. Nor does it
      name the month view's own group label, a third site in that file. All
      five sites render descriptor text through maskCardNumbers alone, and this
      phase has now demonstrated, in its own fast-gate test, that a transfer
      descriptor carries the counterparty account exactly as the statement
      prints it. So the defect this phase found and fixed on /merchants is
      still live on /import and on the month view. This is outside criterion
      13.2, which names /merchants, and it is therefore not a reason to call
      13.2 unmet; it is a reason the phase's own statement of what is left is
      wrong, and a claim of that kind is the thing a reader will trust and be
      misled by.
    evidence:
      - "src/modules/import/ui/profile-confirmation.tsx:143 and :148: maskCardNumbers over the parsed counterparty and description cells, with no account mask."
      - "src/modules/overview/ui/month-view.tsx:109, :313 and :351: maskCardNumbers over the group label, the reconciliation gap row and the held row, with no account mask. Only :313 and :351 are described in the residue note."
      - "src/platform/ui/mask-card-number.ts, the enumeration comment: profile-confirmation.tsx's two cells 'render the RAW parsed descriptor. This is the screen the owner photographed.'"
      - "src/platform/ui/mask-account-number.ts, the RESIDUE paragraph, which names the month view's gap rows and held rows and nothing else."
      - "Reviewer probe, committed helpers, exit 0: maskCardNumbers over a normalised transfer descriptor carrying the fixture's counterparty account returns the account in its spaced shape unchanged."
    concrete-fix: >-
      Either apply maskAccountNumbers at the five sites beside the card mask
      that is already there, which is a four-line change in two files and needs
      no new token, no new copy and no domain change; or, if that is judged
      out of this phase's scope, correct the RESIDUE paragraph in
      src/platform/ui/mask-account-number.ts to name all five sites with their
      file and line, and record the remainder as a defect on the fleet backlog
      so the next reader meets a true statement rather than a partial one.
  - id: CR-M3P13-04
    severity: low
    analysis: >-
      THE MASKER'S WHITESPACE RULE IS MIS-DOCUMENTED, AND THE RULE IT ACTUALLY
      IMPLEMENTS IS ASYMMETRIC IN A WAY THE COMMENT HIDES. The comment says
      "Exactly ONE space is tolerated between characters". The loop skips each
      space character individually with no counter, so ANY number of consecutive
      spaces is tolerated: a double-spaced account masks. In the other
      direction the tolerated separator is U+0020 alone, so an account split by
      a tab, a newline or a non-breaking space is left in full. The shipped
      path is safe today and this is why the finding is low: the Belfius
      template joins its description lines with a single space
      (src/modules/import/domain/belfius-current-account-template.ts:269), so a
      wrapped account arrives space-separated. But the transaction lines this
      phase adds render the RAW description rather than the whitespace-collapsed
      normalised form, which is the first surface in this product where a
      separator the template did not choose can survive to the screen, and a
      comment that misstates the rule is how the next reader concludes the case
      is covered.
    evidence:
      - "src/platform/ui/mask-account-number.ts, accountSpanAt: the branch `if (character === \" \" && taken > 0 && taken < expected) { at += 1; continue; }` has no counter, and the comment above it reads 'Exactly ONE space is tolerated between characters, and only between them'."
      - "Reviewer probe, committed helper, exit 0: the fixture account written with two spaces between every group masks to the country, check digits and last four; the same account with a single newline between the eighth and ninth character is returned unchanged, every character intact."
      - "src/modules/merchants/ui/merchant-review.tsx:84 renders row.description, the raw stored fact, rather than normaliseCounterparty's collapsed output."
    concrete-fix: >-
      Correct the comment to say that whitespace between characters is skipped
      without limit, and widen the tolerated separator from the literal space to
      /\s/ so a tab, a newline or a non-breaking space cannot defeat the mask;
      add the newline shape to the mask's own describe block in
      test/domain/identity-on-review.test.ts beside the spaced and compact
      shapes it already pins. If U+0020 alone is deliberate, say at the branch
      which separator the shipped parsers can emit and why the others cannot
      reach a rendered description.
  - id: CR-M3P13-05
    severity: low
    analysis: >-
      TWO COMMENTS IN THE CLIENT LEAF ARE WRONG AT THIS HEAD, in a repository
      whose clause R-087 treats a comment as a claim to be corrected rather
      than quietly rewritten. The `detail` prop's own documentation names a
      slot `detail.aboveForm` that does not exist; the three declared slots are
      beforeForm, inForm and afterForm. The same paragraph gives the reason for
      the reach line twice in two consecutive clauses, which reads as an
      unfinished edit. And the comment introducing the predicted-label render
      still says every label the row renders "has been through maskCardNumbers",
      which stopped being the whole truth in this phase: the label now arrives
      through the account mask as well.
    evidence:
      - "src/modules/merchants/ui/merchant-row.tsx, the `detail` prop comment: 'Two slots rather than one: `detail.aboveForm` sits between the totals and the naming form', against the declared type `{ beforeForm?, inForm?, afterForm? }` immediately below it; and 'because the reach is a sentence about the control the reader is deciding whether to press' followed by 'because the reach is a statement about the control the reader is deciding whether to press'."
      - "src/modules/merchants/ui/merchant-row.tsx:228: 'row renders has been through maskCardNumbers, so the typed string is', against src/modules/merchants/ui/merchant-review.tsx:201 and :202, where the label expression is maskAccountNumbers(maskCardNumbers(group.label)) or maskAccountNumbers(group.accountAlias)."
    concrete-fix: >-
      Rename `aboveForm` to `beforeForm` in the comment, delete the duplicated
      clause and keep one reason, and extend the line 228 comment to name both
      masks the label has been through.
  - id: CR-M3P13-06
    severity: low
    analysis: >-
      AN INTERMITTENT IN A SHARED SLOW-GATE HELPER, WHICH THIS LANE MET AND THE
      IMPLEMENTER DID NOT, AND WHICH IS NOT THIS PHASE'S. In my run of the whole
      suite at this head the wrapper exited 1 on a single test,
      test/e2e/accounts.spec.ts:509, failing inside test/e2e/setup-accounts.ts's
      registerAccounts helper on the five-second default wait for the
      accounts-status element after the register submit. Four things say
      intermittent rather than regression: the line is untouched by this branch;
      the same helper was used successfully by every other spec in the same run,
      including the three this phase adds; the retained error context shows the
      setup form correctly filled, so what did not happen is the status
      rendering; and the test passes in isolation at the same head. It is
      recorded because a gate that fails once every few runs on a helper that
      almost every journey calls will cost some later lane an hour, and because
      a review that saw a red gate and said nothing would be the worse error.
      It is explicitly NOT a reason to hold this phase.
    evidence:
      - "My npm run test:e2e at 936fcda: EXIT 1, 32.1 minutes, '1 failed / 1 skipped / 120 passed', the failure list naming only '[chromium] test/e2e/accounts.spec.ts:509:5 a card statement, which carries no own-account column, is accepted and declared at first sight'."
      - "The failing assertion, from the run's own output: 'at setup-accounts.ts:58 ... await expect(page.getByTestId(\"accounts-status\")).toBeVisible()', Timeout 5000ms, 'element(s) not found'."
      - "test-results/accounts-a-card-statement--9fa4c-and-declared-at-first-sight-chromium/error-context.md: the accessibility snapshot shows the /accounts setup form with Label, Bank, Account number and Ring all correctly filled for the household under test, and no status element."
      - "Isolated re-run in this worktree at this head, same pinned loopback environment: 'npx playwright test test/e2e/accounts.spec.ts --project=chromium -g \"a card statement, which carries no own-account column\"' PASSED, 1 passed in 51.6s, test duration 14.7s, exit 0."
      - "git diff 975d0ce..936fcda -- test/e2e/accounts.spec.ts: the only change is the control-arm label assertion near line 241, nowhere near :509."
    concrete-fix: >-
      Give the status wait in test/e2e/setup-accounts.ts:58 an explicit timeout
      matched to the server action's own budget rather than the five-second
      default, the way the other post-submit waits in this suite do, so a slow
      round-trip in a loaded container is waited out instead of failing a helper
      that almost every journey depends on. Nothing in src/ needs to change: the
      product rendered the form correctly and the action is the same one the
      other twenty journeys drove successfully in the same run. If a fix round
      runs for CR-M3P13-01 anyway, re-run the whole suite after that change and
      record the exit code, which is the cheapest way to confirm the
      classification.
criteria:
  - id: "13.1"
    quote: >-
      npm run test:e2e exits 0 with a spec that loads /merchants for a household
      imported from test/fixtures/belfius-counterparty-identity.pdf at a 390 by
      844 viewport and asserts, by testid, that the group holding 3 transactions
      of one counterparty renders a count of 3 and a basis line whose text is the
      catalogue string for the shared-account basis, and that a descriptor-basis
      group renders the catalogue string for the shared-description basis.
      Asserting that the strings exist in the catalogue does not meet this
      criterion; the assertion is on the rendered page.
    evidence:
      - "MET. test/e2e/identity-on-review.spec.ts, first test: page.setViewportSize({ width: 390, height: 844 }), sign-up, registerCurrentAccount on the fixture's own account, then the committed fixture test/fixtures/belfius-counterparty-identity.pdf uploaded through the real /import flow with rows-added asserted to be 24, then page.goto('/merchants')."
      - "The count is asserted BY TESTID on the rendered page: await expect(group.getByTestId('group-count')).toHaveText('3 rows'), where `group` is located by the account-basis identity key. The testid is new on both row branches (src/modules/merchants/ui/merchant-row.tsx:274 and src/modules/merchants/ui/merchant-review.tsx:128); before this phase the count span carried no testid."
      - "The basis is asserted by testid against the CATALOGUE STRING and not against its presence in the catalogue: await expect(group.getByTestId('group-basis')).toHaveText('Grouped on a shared counterparty account.'), which is messages/en.json's groupBasisAccount verbatim. The descriptor arm is asserted on the rendered page too, by filtering the unresolved-group rows on hasText 'Grouped on a shared description.' and requiring the count to be greater than zero."
      - "The value rendered is M3-P12's basis read off the identity and not re-derived (src/modules/merchants/domain/merchant-review.ts, ...(merchantId === undefined ? { basis: identity.basis } : {})), pinned in the fast gate by test/domain/identity-on-review.test.ts, which also pins that a RESOLVED group reports no basis."
      - "Witnessed in my own slow-gate run at 936fcda: 122 discovered, 120 passed, 1 failed, 1 skipped, and the reporter's failure list names only test/e2e/accounts.spec.ts:509, so this test passed."
    met: true
  - id: "13.2"
    quote: >-
      THE ACCOUNT NEVER LEAVES THE DISPLAY LAYER UNMASKED AND NEVER ENTERS THE
      KEY. For an account-basis group whose rows carry no counterparty name, the
      rendered HTML of /merchants contains the masked form and does NOT contain
      the unmasked account anywhere, asserted over the full page source; and the
      hidden field the naming form submits carries the unmasked namespaced
      identity key, asserted on the same page. A test asserts the same masking
      function is not called anywhere in src/modules/merchants/domain or
      src/modules/merchants/application.
    evidence:
      - "NOT MET, and NOT because the criterion is self-contradictory. The contradiction is real and is the orchestrator's ruling, not a miss: for an account-basis group the namespaced identity key IS the namespace followed by that account, so a page source that carries the key unmasked cannot also be free of the account. This walk therefore judges the criterion against the STRONGEST TRUE FORM available at this head, and what shipped is not it. Findings CR-M3P13-01 and CR-M3P13-02."
      - "THE THREE HALVES THAT ARE MET, each witnessed. (a) The masked form is on the page: await expect(group.getByTestId('group-label')).toHaveText(`${account.slice(0,4)} **** ${account.slice(-4)}`), and the label expression is maskAccountNumbers applied in the display layer only (src/modules/merchants/ui/merchant-review.tsx:201 and :202). (b) The hidden field carries the unmasked namespaced key: await expect(group.locator('input[name=\"counterpartyText\"]')).toHaveValue(THREE_ROW_KEY). (c) The derivation half is met and is STRONGER than the criterion asks: test/domain/identity-on-review.test.ts walks every .ts and .tsx under src/modules/merchants/domain and src/modules/merchants/application, asserts the walk found more than five files first so a broken path cannot pass by scanning nothing, and requires zero call sites of maskAccountNumbers OR maskCardNumbers, where the criterion names only 'the same masking function'."
      - "THE SWEEP IS NON-VACUOUS, which was the first thing I checked and it holds: the spec asserts leak.masked is true on the same cloned markup the two negative assertions read, and separately asserts that `await page.content()` on the UNTOUCHED source DOES contain the account, so the three removals are demonstrably doing work rather than emptying the document."
      - "WHY IT IS STILL NOT MET. Of the three channels excluded from the sweep, two are forced and one is not. The hidden counterpartyText input is required by the criterion itself. The framework's serialised payload is forced by the first: the naming row is a client component (src/modules/merchants/ui/merchant-row.tsx:1, 'use client'), the identity key must reach it, and a prop is serialised whatever shape it is given, including as pre-rendered children. THE ROW IDENTITY IS NOT FORCED, and the reason given for it is refuted by criterion 11.3's own text, which states the attribute is added MASKED and that masked-key collision is 'accepted and stated rather than left to be discovered'. See CR-M3P13-01."
      - "AND THE SWEEP IS NARROWER THAN THE FIXTURE ALLOWS. It runs on one account. The same fixture carries an account that is never an identity key at all, so for that one the criterion's literal page-source clause is reachable with nothing excluded, and it is not asserted. See CR-M3P13-02."
