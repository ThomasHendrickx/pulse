      criterion 2.4 requires) are each the minimal enabling change for a
      declared step of this phase, none moves business logic outside the
      declared modules, and the plan's extras list at the phase already
      carries all four (the brief's extras section names them), so the
      declaration and the tree agree. Judged from the artifact: the
      accounts diff adds one read method and no behaviour change
      (src/modules/accounts/adapters/account-repository.ts:42).

hazard-classes-addressed:
  - class-id: H2.1
    probed: >-
      Constructed the double count three ways by executed probe over the
      committed engine: (1) full-context interpretation of a card import
      plus its settlement debit (correctly INTERNAL, P1.a); (2) the same
      database state re-interpreted through the exact window
      interpretForImport derives for a later checking import, which
      loads the debit without its card rows and flips it to SPEND (P1.b),
      with reconcile over the merged persisted flows closing the books at
      difference 0 while spend is double counted (P1.c, captured
      spend=204500 against true 104500); (3) a window cutting the card
      import in half, so the truncated total fails the exact-amount match
      (P1.d). Also verified the in-window matcher itself holds: the
      corrections suite plus probe P6 window bounds, and probe P8's
