  - class-id: H2.3
    probed: >-
      Re-executed the order-independence suite
      (test/domain/pair-transfers.test.ts:92, every insertion order) and
      ran probe P7: 25 seeded shuffles of a world carrying transfers,
      settlements, a mirror, refund history and income against the pure
      engine, identical canonical output every round, plus a re-run fixed
