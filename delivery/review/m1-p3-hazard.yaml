findings:
  - id: CR-301
    severity: critical
    evidence:
      - >-
        Executed probe P1 over the committed engine: a March card import
        (rows 2026-03-05 and 2026-03-20, total 100000 cents) plus its
        settlement debit on checking booked 2026-04-14 classifies the
        debit INTERNAL with a settlement link under full context
        (captured: flow=INTERNAL, settlements=[{debitTransactionId:
        t-settle, cardImportId: imp-card-march}]).
      - >-
        Executed probe P1.b: the identical engine run over the window
        [2026-04-13, 2026-08-18], which is exactly the window
        interpretForImport derives for a June checking import
        (src/modules/ledger/application/interpret-window.ts:92 pads the
        import period by INTERPRETATION_WINDOW_PADDING_DAYS = 49), loads
        the debit but none of the March card rows and returns flow=SPEND
        for the settled debit. replaceInterpretation then persists SPEND
        over the stored INTERNAL and deletes the settlement link
        (src/modules/ledger/adapters/ledger-repository.ts:99 and :120).
      - >-
        Executed probe P1.c: reconcile over the merged persisted state
        (window rows new generation, March card rows old generation)
        captured reconciles=true, differenceCents=0, spendCents=204500
        where true spend is 104500. The books close while every card
        month is double counted: the silently swallowed difference.
      - >-
        Executed probe P1.d: a window cutting a card import in HALF
        (from 2026-03-13) computes a truncated settlement total (70000,
        not 100000), so the equality check at
        src/modules/ledger/domain/corrections.ts:60 fails and the debit
        flips to SPEND through the unitemised fallback at
        src/modules/ledger/domain/corrections.ts:65.
      - >-
        Root cause by reading: src/modules/ledger/domain/interpret.ts:58
        computes summarizeCardImports over potTransactions, which
        interpret-window loaded date-bounded
        (src/modules/ledger/adapters/ledger-repository.ts:38), so a card
        import's settlement total is the sum of the rows THE WINDOW
        HAPPENED TO LOAD, not of the import. The padding comment at
        src/modules/ledger/domain/constants.ts:30 declares only the
        transfer-pair rim residue, whose failure mode keeps flow INTERNAL
        and is surfaced (probe P2 confirmed that contrast); the
        settlement variant flips a counted total and surfaces nothing
        once the mirror row is absent or outside the window.
      - >-
        Reachability under normal use, derived: a KBC settlement debit
        lags its statement period end by roughly two weeks, so it sits 14
        to 45 days after the last card row; any later import whose padded
        window starts between the card rows and the debit (for monthly
        checking uploads, the import two months after the card statement)
        performs exactly probe P1.b's flip. No later upload's window
        reaches back far enough to heal it, and recompute is a dev-only
        action (src/modules/ledger/ui/actions.ts:16).
    concrete-fix: >-
      Compute card import summaries from the COMPLETE import, never from
      the window slice: either have listPotTransactions include every row
      of any card import that intersects the window (a second query by
      importId over the card imports seen in the slice), or load
      settlement totals per import with a dedicated repository read
      keyed by importId, and only allow the INTERNAL to SPEND
      reclassification of a previously settled debit when the full card
      import context is present. Add a regression test that interprets a
      later import's window over a database state containing an
      out-of-window card import and asserts the settled debit's flow
      survives.
    analysis: >-
      Hazard H2.1 realized through the window mechanism rather than the
      matcher: classification of a settlement debit is a function of how
      much context the window loaded, and criterion 2.8's honest-SPEND
      fallback is the flip destination, so the destructive outcome is the
      exact double count the phase calls the single biggest trap. The
      reconciliation identity cannot catch it because the identity is
      algebraically blind to INCOME/SPEND/RESERVE reclassification (the
      by-hand derivation in the work log above), which is also why the
      500-case property test stays green: it interprets one consistent
      set, never a window slice against persisted state from a wider run.
  - id: CR-302
    severity: high
    evidence:
      - >-
        Executed probe P3.a over committed dedup code: file A stores a
        keyless identical twin pair (keys h:...#0 and h:...#1); an
        overlapping file B carrying the same pair plus a THIRD occurrence
        stores only that third row under key h:...#2 (ingest computes
        ordinals over the full file). The re-parse recomputes keys over
        the STORED SUBSET (src/modules/import/application/fix-profile.ts:88
        passes only the import's stored rows to assignDedupKeys), so
        import B's row renumbers to h:...#0, a key import A's row already
        holds.
      - >-
        Executed probe P10 (probe2.ts) end-to-end through the committed
        use cases: upload A, overlap upload B (captured added 2 known 3),
        then fixSourceProfile with the spec UNCHANGED returned ok and
        left duplicate dedup keys in the store; the next re-upload of
        file B then reported added 1 and the household held FOUR copies
        of a fact it has three of. Captured output in the work log above.
      - >-
        Against the real adapter the same operation aborts instead: the
        per-household unique index (prisma/schema/import.prisma, the
        unique on householdId and dedupKey) rejects the second h:...#0 in
        applyReparse's transaction
        (src/modules/import/adapters/import-repository.ts:253), nothing
        is rewritten, and fixSourceProfile throws. The H2.5 repair path
        is then permanently unavailable for any household whose imports
        overlap around a keyless twin, which the committed fixtures
        themselves present as the observed real card shape (two identical
        STARBUCKS rows in test/application/reparse.test.ts:25).
      - >-
        The divergence exists because the committed fake's applyReparse
        enforces no key uniqueness
        (test/application/fake-import-world.ts:148) while its own header
        claims it reproduces the real insert semantics the schema
        enforces (test/application/fake-import-world.ts:3), so no fast
        gate test can see either outcome.
      - >-
        R-087 false claims, named precisely: the comment at
        src/modules/import/application/fix-profile.ts:87 states that any
        deterministic row order yields the same key SET as a fresh parse
        of the file, which is false whenever an import stored a proper
        subset of its file's rows; the port contract at
        src/modules/import/application/ports.ts:127 states that dedup
        keys are recomputed so re-uploads keep mapping onto the same
        rows, which probe P10 falsifies by executed construction.
    concrete-fix: >-
      Recompute re-parse dedup keys from the same basis ingest used: for
      hash-path rows, preserve each stored row's existing ordinal suffix
      and recompute only the content hash (the ordinal was assigned
      against the full file at ingest and is part of the row's stored
      identity), or re-derive ordinals per import by ranking stored twins
      by their stored ordinal rather than by subset position. Make the
      fake's applyReparse enforce the unique key the way its ingestRows
      already does, correct the two false comments, and add a reparse
      test with two overlapping imports sharing a keyless twin.
    analysis: >-
      Continuation of H2.5: the one sanctioned facts rebuild fails
      exactly on the data shape (overlapping card re-exports with
      legitimate identical rows) that the dedup design treats as normal.
      Loud in production (denied repair, wrong facts stand), silent in
      the fast gate (fact duplication through sanctioned paths), and the
      test double diverges from the schema on the one constraint this
      path depends on.
  - id: CR-303
    severity: medium
    evidence:
      - >-
        Executed probe P9: an outgoing payment booked 2026-01-10 and its
        refund booked 2026-06-15 classify the refund SPEND under a full
        recompute and INCOME under the June import's window (captured:
        full-history flow=SPEND, June-window flow=INCOME), because
        src/modules/ledger/domain/interpret.ts:59 builds
        outgoingHistoryKeys from the window-loaded transactions only.
      - >-
        The plan's refund rule is scope-free: incoming from a
        counterparty that has outgoing history is SPEND with a positive
        amount (delivery/intake/pulse-v1-plan.md:113); the implementation
        narrows history to the loaded window, undeclared. The
        work-history open question M1P3-C9
        (delivery/work-history/m1-p3.yaml:517) names key spelling as the
        refund residue and does not name window scoping.
      - >-
        Consequence, derived and identity-checked: income and spend both
        inflate by the refund amount relative to the recompute reading,
        the identity holds either way (probe P9 note), and which reading
        is persisted depends on which run last touched the row, the same
        mixed-generation class as CR-301 with a milder outcome.
    concrete-fix: >-
      Build outgoingHistoryKeys from the household's full outgoing
      history (a dedicated repository read over counterparty keys, cheap
      at this scale), or at minimum document and test the window bound as
      a deliberate narrowing and make window runs and recompute agree on
      it. Add a test with an outgoing row older than the padding and a
      refund inside the window.
  - id: CR-304
    severity: medium
    evidence:
      - >-
        src/modules/import/application/fix-profile.ts:100 commits the
        facts rewrite (applyReparse, one database transaction), and
        src/modules/import/application/fix-profile.ts:108 then rebuilds
        interpretation per affected import in separate, later
        transactions. A crash or error between the two leaves corrected
        facts under stale flows.
      - >-
        Unlike the upload path, where a failed interpret leaves the
        import in status INGESTED as a visible marker
        (src/modules/import/application/confirm-import.ts:129 runs after
        ingestRows set INGESTED, and replaceInterpretation is what moves
        it to INTERPRETED), applyReparse does not reset the affected
        imports' status: they remain INTERPRETED
        (src/modules/import/adapters/import-repository.ts:218 touches
        sourceProfile and transactions only), so nothing records that the
        stored interpretation no longer derives from the stored facts.
      - >-
        Destructive shape, concrete: a re-parse that flips signs (the
        criterion 2.7 scenario) can leave a row whose stored flow is
        INCOME while its corrected amount is negative; every read of the
        persisted flow column until some later window run happens to
        cover that row reports a wrong month, with no surfaced gap and no
        marker that a recompute is needed. Recompute is dev-only
        (src/modules/ledger/ui/actions.ts:16).
    concrete-fix: >-
      Inside applyReparse's transaction, downgrade every affected import
      from INTERPRETED to INGESTED (interpretation invalidated with the
      facts rewrite, restored by the interpret step that follows), so a
      death between the two phases leaves the same visible
      needs-interpretation marker the ingest path already has. Add a test
      that fails the interpret dependency after a re-parse and asserts
      the affected import is not left INTERPRETED.
  - id: CR-305
    severity: low
    evidence:
      - >-
        Executed probe P4.b: under the indicator representation the cell
        -742,10 with marker C parses to +74210
        (src/modules/import/domain/parse-statement.ts:239 takes Math.abs
        of the parsed value), so sign information present in the cell is
        silently discarded where the sibling debitCredit branch now fails
        loud on the same input (probe P4.a, CR-208 fix verified at
        src/modules/import/domain/parse-statement.ts:208 and :217).
      - >-
        The residue is declared, not hidden: the comment at
        src/modules/import/domain/parse-statement.ts:181 and the
        work-history not-covered at delivery/work-history/m1-p3.yaml:331
        both name it as a candidate follow-up. It remains the one parser
        branch where a cell that contradicts the declared sign authority
        is reinterpreted instead of refused, the exact mechanism class
        CR-208 names.
    concrete-fix: >-
      Extend carriesExplicitSign to the indicator branch: a signed
      amount cell under an indicator representation is a row error
      (problem "amount"), same discipline as the directional columns; on
      observed exports where signed cells legitimately co-exist with
      markers, require the sign to AGREE with the marker instead of
      absoluting it. One red-witness test beside the CR-208 block.
  - id: CR-306
    severity: low
    evidence:
      - >-
        Executed probe P8: two settlement-pattern debits of the same
        amount (accounts acc-checking and acc-b) against ONE imported
        card statement both classify INTERNAL and both link to the same
        card import (captured links t-settle to imp-card-march and
        t-settle-2 to imp-card-march), because
        src/modules/ledger/domain/corrections.ts:57 filters candidates
        by amount, window and account only, and each debit is classified
        independently with no exclusivity across debits.
      - >-
        Consequence for hazard H2.6: a settlement debit paying a card
        whose statements are NOT imported, whose amount coincides to the
        cent with another card's imported total inside the 45-day
        window, classifies INTERNAL instead of the honest aggregate
        SPEND: that spend leaves the spend side. It is not silent (both
        debits surface as unmatched, captured in P8) and it requires an
        exact-cent collision between two settlement debits, but it never
        heals and the month's spend stays understated while it stands.
      - >-
        The persisted shape is also two TransferLink rows carrying the
        same settlementImportId (the schema's uniques are per leg only,
        prisma/schema/migrations/20260819152307_transfer_links/migration.sql),
        recording one statement as paid twice.
    concrete-fix: >-
      Make settlement matching exclusive per card import inside
      interpretLedger the way mirror matching already is (usedMirrors at
      src/modules/ledger/domain/interpret.ts:85): allocate each card
      import to at most one settlement debit by the same deterministic
      tie-break, and let the loser fall through to the unitemised SPEND
      fallback. Add a two-debits-one-import test.

