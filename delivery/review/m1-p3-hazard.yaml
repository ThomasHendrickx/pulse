findings:
  - id: CR-307
    severity: medium
    evidence:
      - >-
        Executed probe D4.b at head: under the indicator representation
        the cell 'EUR -742,10' beside marker C parses OK and stores
        -74210, a credit stored negative; beside marker D it stores
        +74210, a debit stored positive. Captured output in the work log
        above.
      - >-
        Executed probe D4.c: the same cell inside a debitCredit DEBIT
        column parses OK and stores +74210, the exact CR-208 inversion,
        reachable at this head.
      - >-
        Root cause by reading: the guard carriesExplicitSign
        (src/modules/import/domain/parse-statement.ts:186) tests the RAW
        cell's first character, while parseAmountToCents first strips
        currency noise and THEN reads a sign
        (src/modules/import/domain/parse-amount.ts:26-34, the EUR and
        euro-symbol replace runs before the startsWith('-') check). So a
        sign written after a currency prefix passes every directional
        guard (the CR-208 pair at parse-statement.ts:208 and :217, and
        the CR-305 guard at parse-statement.ts:230) and the parser signs
        the value anyway; the directional branches then negate or trust
        it, silently inverting the stored amount. The currency strip
        exists precisely because observed exports carry EUR noise in
        amount cells, so the combination is not a fantasy shape.
      - >-
        Trailing signs are safe (the amount grammars at
        src/modules/import/domain/parse-amount.ts:19-20 admit digits and
        separators only), so the prefix-noise path is the one hole; the
        signed representation is unaffected (there the cell sign IS the
        declared convention).
    concrete-fix: >-
      Align the guard with the parser: either normalise before guarding
      (strip the same currency noise, then test for a sign) or, cleaner,
      give parse-amount an unsigned entry point (parseUnsignedMagnitude
      that REJECTS any sign it finds after normalisation) and call it
      from the debitCredit and indicator branches, so the two functions
      cannot drift again. One red-witness test per branch with an
      'EUR -' cell, beside the existing CR-208 and CR-305 blocks.
    analysis: >-
      Same mechanism class as CR-208 and CR-305 (sign information in the
      cell silently reinterpreted where the column or marker is the
      declared sign authority), found by sweeping the delta that hardened
      that exact guard: the guard and the parser disagree about what
      string they are judging. Filed medium because the outcome is a
      silent full inversion of affected rows (H1.1 class) while the
      triggering shape (currency prefix plus sign in a directional or
      indicator column) is not yet observed in a real export.

