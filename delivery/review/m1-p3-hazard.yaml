findings:
  - id: CR-308
    severity: low
    evidence:
      - >-
        Executed probe V6 at head: parseUnsignedAmountToCents of
        'EEURUR-742,10' returns PARSED -74210, and the same cell in a
        debitCredit DEBIT column stores +74210 (a signed value through
        the unsigned entry point, the CR-208 inversion shape). Plain
        parseAmountToCents on the identical input returns a row error,
        so the unsigned entry is strictly WEAKER than the signed one on
        this input. Captured output in the work log above.
      - >-
        Root cause by reading: stripCurrencyNoise removes currency
        tokens in one global regex pass
        (src/modules/import/domain/parse-amount.ts:25), which is not
        idempotent ('EEURUR' reconstructs 'EUR' after one removal);
        parseUnsignedAmountToCents strips once and checks the sign on
        that once-stripped string (parse-amount.ts:79-81), then
        delegates to parseAmountToCents, which strips AGAIN
        (parse-amount.ts:32) and reads a sign the unsigned check never
        saw. The comment at parse-amount.ts:71-72 states the two can
        never diverge again; this construction is an executed
        divergence, so the absolute claim is false as written (R-087).
      - >-
        Reachability, honestly bounded: the input requires interleaved
        currency letters that reconstruct a token after one removal
        pass. No observed or plausible bank export writes such a cell;
        it cannot arise from any combination of the shapes the fixtures
        model (currency prefix, sign, whitespace, trailing sign, all of
        which the fix refuses, probes W1-W2 and V1-V5).
    concrete-fix: >-
      Close the gap at the value, not the text: in
      parseUnsignedAmountToCents, after delegation, reject a parsed
      value below zero (a magnitude can never be negative), or
      equivalently loop stripCurrencyNoise to a fixpoint before the sign
      check; then soften the comment's absolute claim or make it true.
      One red-witness test with the self-reconstructing token beside the
      existing CR-307 block.
    analysis: >-
      Filed low, not medium: unlike CR-307 the triggering shape is not a
      plausible export cell, the outcome is deterministic and loud to
      construct, and the household-scale exposure is nil; what makes it
      worth recording is that the fix's stated invariant (guard and
      parser judge one string) is one delegation away from being
      structural, and the one-line value-side check would make the
      invariant hold by construction instead of by input shape.

