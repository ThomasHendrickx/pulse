findings:
  - id: CR-M3P17-01
    severity: high
    evidence:
      - "src/app/api/health/version/route.ts:34 reads: export const UNSTAMPED = \"unstamped\"; which is a named export from a Next.js App Router route module. Next's build-time route type check admits only its whitelisted export names (GET, runtime, dynamic and the other route segment config fields), and UNSTAMPED is not one of them."
      - "WITNESSED. npm run build (prisma generate && next build, Next.js 15.5.23) at 12c20f3 in this worktree, database env pinned to a bogus localhost target, EXIT 1, with the captured error: Type error: Route \"src/app/api/health/version/route.ts\" does not match the required types of a Next.js Route. \"UNSTAMPED\" is not a valid Route export field. Compilation succeeded first (Compiled successfully in 14.4s); the route-export type check is what fails."
      - "The slow gate cannot pass at this head in ANY environment, not merely in a container without Docker: playwright.config.ts:155 runs npm run build && npx next start -p 3100 as the prod webServer command, so npm run test:e2e dies at the build before a single spec is collected. The new smoke assertion in test/e2e/prod-smoke.spec.ts has therefore never executed anywhere, which is hazard H17.3 live rather than hypothetical."
      - "The implementer's container never reached this failure: delivery/work-history/m3-p17.yaml:208 records the e2e run refused EARLIER, at playwright config load (GateDbTargetRefused, no Docker, no .env), so the recorded environment limitation sits in front of a head defect the record does not know about."
      - "A deploy fails the same way: Vercel runs next build, so merging this branch would break the production deploy, and the instrument this phase exists to put in production could never arrive there. M3-P16's entry condition would then be undecidable by exactly the route built to decide it."
      - "The fast gates cannot see it, witnessed: npm run typecheck exits 0 at this same head, because tsc --noEmit does not run Next's generated route-type validation. Both consumers of the export are type-level fine: test/app/health-version.test.ts:2 and test/e2e/prod-smoke.spec.ts:4 import UNSTAMPED from the route module."
    concrete-fix: "Move the marker into a non-route module beside the route, for example src/app/api/health/version/build-stamp.ts exporting UNSTAMPED (still inside the phase's declared files-to-touch, src/app/api/health/), import it from the route instead of exporting it there, and point test/app/health-version.test.ts:2 and test/e2e/prod-smoke.spec.ts:4 at the new module, which as a side effect stops the Playwright process importing next/server transitively through the route. Witness npm run build exit 0 as the cheap local check, then run npm run test:e2e to green in a container with Docker and capture its output in the work history, which is what criterion 17.3 requires and what this head cannot produce."
    analysis: "The unit test, the smoke assertion and the handler are all correct about behaviour; my own probe confirms every branch. The defect is that sharing the marker constant was done by exporting it from the one module Next forbids extra exports from, and the only check that sees that rule lives in a gate nobody could run: the implementer's e2e attempt died at config load before the build, so the record honestly says environment-limited while the head is actually unbuildable. The criteria contract catches it only because criterion 17.3 refuses to let the fast gate certify an e2e spec, which is exactly the certification hole that criterion was written against."
  - id: CR-M3P17-02
    severity: low
    evidence:
      - "npm run gate:decisions at 12c20f3 in this worktree EXITS 1, naming six review lanes over the two-round cap: m0-p6-plan-review 5, m3-p14-criteria 3, m3-p14-plan-review 4, m3-p16-plan-review 5, m3-p3-criteria 3, m3-p3-hazard 3."
      - "PRE-EXISTING, witnessed rather than read: bash scripts/gate-decisions.sh in a detached worktree at the merge base f19984b exits 1 with the identical six lanes, so none of it is introduced by this branch's diff."
      - "Honestly recorded by the phase: delivery/work-history/m3-p17.yaml:199 records the gate red, the claim at line 253 shows the same merge-base construction, and the open question at line 285 hands the remediation decision to the orchestrator."
      - "CLAUDE.md's done-definition includes npm run gate:decisions passing, and no acceptance criterion of M3-P17 names that gate, so the criteria contract can neither clear the phase on it nor fail the phase for it; it is recorded here so the merge decision is made with it in view rather than around it."
    concrete-fix: "Outside this branch's file scope, deliberately: before or alongside merging, whoever is authorized to touch delivery/review/ clears the six over-cap lanes, or the owner records a waiver in a decision record naming them. This branch itself needs no change for this finding."
    analysis: "Not this phase's defect and not clearable from this phase's declared files. It is a finding rather than a comment because the fast-gate rule it breaks is CLAUDE.md's own, and a merge that walks past a red gate silently is the habit the gate exists to prevent."
  - id: CR-M3P17-03
    severity: low
    evidence:
      - "src/app/api/health/version/route.ts:17 through :18 states: The marker carries no hexadecimal-only characters, so it can never be mistaken for a commit sha. Read literally that is false: the marker unstamped carries the characters a, d and e, each of which IS a hexadecimal digit."
      - "The plan's own phrasing is the true one: the marker carries characters that are NOT hexadecimal digits (u, n, s, t, m, p), which is why /^[0-9a-f]+$/i cannot match the whole word, exactly as test/app/health-version.test.ts:68 asserts and as my probe reproduced (is-hex false)."
    concrete-fix: "Correct the sentence in place at src/app/api/health/version/route.ts:17 to the plan's phrasing: the marker carries characters that are not hexadecimal digits, so no reader and no test can take it for a commit."
    analysis: "Raised under clause R-087, which asks for a false comment claim as a finding rather than a nit. The property the comment reaches for is real, tested and probe-confirmed; only the sentence stating it is wrong, and a later reader deciding whether a new marker is safe will reason from the sentence."

criteria:
  - id: "17.1"
    quote: "THE ROUTE ANSWERS WITH THE BUILD'S FACTS OR SAYS IT HAS NONE, AND THE TWO CANNOT BE CONFUSED. A unit test asserts both branches of both fields over the handler: with the platform variables set, the response is 200 and its two fields are exactly the commit the build was built from and the deployment environment it runs in; with either unset or empty, that field is exactly the marker unstamped. THE MARKER IS THE LITERAL WORD unstamped ... it is lowercase, it is one word, and it carries characters that are not hexadecimal digits ... A route that returns an empty string, a zero, a placeholder that is hexadecimal, or an omitted field does not meet this criterion."
    evidence:
      - "test/app/health-version.test.ts covers every named branch over the handler directly: both set with exact values and status 200 at lines 34 through 44, both unset at lines 46 through 53, both empty-string at lines 55 through 64, one set and one absent at lines 71 through 79, and the marker's literal value and non-hexness at lines 66 through 69. My own run: npx vitest run test/app/health-version.test.ts, exit 0, 6 passed."
      - "WITNESSED INDEPENDENTLY of the test file, driving the shipped handler under node via tsx: UNSET and EMPTY both answer 200 with both fields exactly unstamped; SET answers the exact forty-character sha and production; MIXED stamps only the unset field; the key set is always exactly two. No branch produced an empty string, a zero, a hexadecimal placeholder or an omitted field."
      - "The marker is the literal lowercase word unstamped (src/app/api/health/version/route.ts:34) and /^[0-9a-f]+$/i over it is false, probe-confirmed."
