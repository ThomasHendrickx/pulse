        delivery/plan/pulse-v1.yaml:729-737 (M1-P5 step): UNRESOLVED
        visibility appears in step prose only; no criterion in any phase
        asserts an UNRESOLVED row renders.
    concrete-edit: >-
      Extend criterion 4.3 with: "and with a fixture containing a
      transaction no rule can classify, the view renders it as a visible
      UNRESOLVED gap, its amount appears in no income, spend or reserves
      total, and the reconciliation difference names it", so both halves of
      the charter constraint (unmatched legs and UNRESOLVED rows) are
      asserted by a test.
    analysis: >-
      The construction: the view queries filter to the four counted flows,
      UNRESOLVED rows vanish from the screen entirely, criterion 4.3 still
      passes because its gapped fixture only produces unmatched legs, and
      every phase merges while a binding charter constraint is violated.
  - id: PR-007
    severity: medium
    evidence:
      - >-
        charter.yaml:65 and CLAUDE.md non-negotiable 3: integer cents end to
        end, never a float for a monetary total in the database.
      - >-
        delivery/plan/pulse-v1.yaml:226-232 (criterion 0.4) asserts
        householdId via DMMF but nothing about monetary column types;
        criteria 1.1 and 2.4 mention cents only inside test data, not
        storage.
    concrete-edit: >-
      Extend criterion 0.4's schema test clause with: "and the same DMMF
      test asserts every model field whose name matches
      /amount|balance|total|cents/i has Prisma type Int or BigInt, never
      Float or Decimal", and extend criterion 1.1 with "parsed amounts are
      asserted to be integers (whole cents) for every decimal-style
      fixture".
    analysis: >-
      The construction: store amounts as Decimal or Float, parse "1.234,56"
      to 1234.56, and every criterion in the plan still passes, because no
      test looks at the column type or the parsed value's integrality. The
      non-negotiable is enforced only by reviewer attention, which is
      exactly what a schema-reading test in the phase that owns the pattern
      would replace.
