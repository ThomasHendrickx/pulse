kind: finding
verdict: revise
produced-by: claude (Fable 5, claude-fable-5)
findings:
  - id: PR-001
    severity: critical
    evidence:
      - >-
        delivery/plan/pulse-v1.yaml:336-344 (M1-P2 step): dedup key is
        "natural key where present, otherwise hash of accountId, bookingDate,
        amount, normalisedCounterparty, reference", unique index, duplicate
        skipping.
      - >-
        delivery/plan/pulse-v1.yaml:368-373 (criterion 1.2): only asserts
        overlapping re-import adds the non-overlapping rows; no fixture
        contains two legitimately identical rows.
      - >-
        /home/user/pulse-fleet/notes/export-format-facts.md:52-54: "Duplicate
        same-day same-amount same-merchant rows occur legitimately (observed
        twice in one statement), which any dedup key must not collapse."
      - >-
        notes/export-format-facts.md:44-46: the KBC Mastercard format has no
        per-row sequence number, so these rows are exactly the rows that take
        the hash path.
      - >-
        .claude/skills/pulse-domain/SKILL.md:121-123 carries the same hash
        recipe, so the defect is inherited from a project rule, not invented
        by the plan; the plan may not silently follow it into data loss.
    concrete-edit: >-
      In M1-P2, rewrite the ingest step's hash fallback to include a
      per-import occurrence ordinal: the dedup key for a hash-path row is the
      content hash plus the ordinal of that row among identical-content rows
      within the same file, so two legitimate identical rows get distinct
      keys while re-uploading the same file still maps each row to the same
      key. Extend criterion 1.2 with: "a fixture containing two identical
      same-day same-amount same-merchant rows stores two Transaction rows,
      and re-uploading that fixture adds zero", and add a report-code
      disagreement entry (phase M1-P2, verified false) recording that
      pulse-domain SKILL.md section 6 specifies a key that collapses
      legitimate duplicates, escalating the skill correction to the
      orchestrator rather than editing it.
    analysis: >-
      The construction that passes every criterion and is still wrong: an
      importer with the plan's exact key imports the real KBC statement, the
      second identical coffee-shop row hashes to the same key, duplicate
      skipping silently drops it, and criterion 1.2's "already known" count
      even reports it as a feature. Reconciliation cannot catch it, because
      both sides of the identity are computed from the stored facts, so the
      books close while a real spend row is gone. Silent loss of a fact row
      is the single failure the facts-are-immutable spine exists to prevent.
  - id: PR-002
    severity: critical
    evidence:
      - >-
        delivery/plan/pulse-v1.yaml:469-476 (M1-P3 step): "card settlement
        (the direct debit paying the card account is INTERNAL, card
        transactions are the spend)"; classification reaches INTERNAL only
        via "counterparty in the declared pot set" (plan lines 461-468).
      - >-
        delivery/plan/pulse-v1.yaml:477-485 (pairing): a pair requires "each
        leg's counterparty account matching the other leg's account".
      - >-
        notes/export-format-facts.md:33-35: the account-side leg is a
        European direct debit "MASTERCARD AFREKENING NUMMER nnn"; its
        counterparty is the issuer's collection identity, not the declared
        card account reference.
      - >-
        notes/export-format-facts.md:43-46 and 50-52: KBC card rows carry no
        counterparty-account column at all, and the statement contains a
        positive mirror row "DOMICILIERING VIA JE BANK" for the settlement.
      - >-
        delivery/plan/pulse-v1.yaml:522-526 (criterion 2.3) only requires "a
        named passing test per correction", which synthetic fixtures with a
        conveniently matching counterparty satisfy.
      - >-
        delivery/intake/pulse-v1-plan.md:113: card settlement is "the single
        biggest trap in the model".
    concrete-edit: >-
      In M1-P3, extend the corrections step to specify the recognition
      mechanism as a declaration: the card Account carries user-declared
      settlement-counterparty identifiers (creditor IBAN and/or a
      description pattern such as the card statement reference), declared at
      first sight like everything else, and BOTH settlement legs classify
      INTERNAL: the account-side direct debit and the card-side positive
      settlement row. Extend criterion 2.3's card settlement clause to:
      "the card settlement fixtures mirror the observed real shapes: the
      account-side debit carries a counterparty that does not equal the
      declared card account identity and names the card statement number in
      its description; the card-side fixture carries a positive settlement
      row with no counterparty account column; the test asserts both legs
      are INTERNAL and the card line items are the only counted spend."
    analysis: >-
      Two constructions pass criterion 2.3 as written and are wrong on the
      first real month. (1) The account-side debit: its counterparty IBAN is
      not in the declared pot set (it is KBC's collection account, not the
      card reference the card was declared under), so rule 2 never fires,
      sign classifies it SPEND, and every month double counts card spending,
      the exact hazard H2.1 claims to address. (2) The card-side mirror row:
      positive, no counterparty account exists in the format, so sign
      classifies it INCOME and income inflates by the full settlement amount
      every month. Pairing cannot rescue either leg because condition 4
      (counterparty matches the other leg's account) is unsatisfiable in
      these formats. The plan's fixtures are free to encode the convenient
      world; the fresh evidence shows the real world is not it.
  - id: PR-003
    severity: high
    evidence:
      - >-
        delivery/plan/pulse-v1.yaml:527-532 (criterion 2.4): "a fast-check
        property test over generated datasets asserting income minus spend
        minus net-to-reserves equals change in pot ... across at least 500
        generated cases". Nothing constrains how change in pot is computed
        or what the generators must cover.
      - >-
        delivery/intake/pulse-v1-architecture.md:19: the reconciliation
        check is meant to be "a pure function over facts".
      - >-
        charter.yaml:29-30: the identity "holds exactly or the difference is
        shown".
    concrete-edit: >-
      Rewrite criterion 2.4 to pin both ends: "change in pot is computed
      from the facts side only, as the sum of raw transaction amounts over
      pot accounts, while income, spend and net-to-reserves come from the
      interpretation output; generators produce datasets covering all five
      flow values, unmatched internal legs, and all four correction shapes;
      the property asserts the identity holds exactly when no UNRESOLVED
      rows or unmatched legs exist, and that otherwise the computed
      difference equals the sum of the surfaced gaps, in integer cents,
      across at least 500 generated cases."
    analysis: >-
      The tautological construction: compute change in pot as income minus
      spend minus reserves over the same classified rows. The identity then
      holds by arithmetic for every implementation, including one that
      inverts every sign or classifies everything INCOME, and 500 cases of
      it prove nothing. The test only bites when the right-hand side is
      anchored in raw facts and the generators are forced through the states
      where the model can actually break. Criterion 4.1 partially
      compensates via fixture totals, but the property test is the artifact
      the intake calls the quality bar, so it must not be satisfiable by a
      tautology.
  - id: PR-004
    severity: high
    evidence:
