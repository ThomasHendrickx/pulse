    analysis: >-
      The construction for both: a gate that greps for a pattern that can
      never occur (or greps the wrong directory) exits 1 forever, the
      criterion is green on day one and green after the violation lands.
      A criterion that names a gate without naming its pattern delegates
      its own falsifiability to the implementer it is supposed to bind.
