        delivery/plan/pulse-v1.yaml:510-542: none of M1-P3's criteria 2.1
        through 2.6 mentions re-parse, rawLine, or a profile fix; every one
        can pass with no re-parse code existing.
    concrete-edit: >-
      Add to M1-P3 an acceptance criterion: "2.7: test/application/
      interpret.test.ts (or test/application/reparse.test.ts) asserts that
      after correcting a SourceProfile with a wrong amount representation,
      the re-parse action rebuilds the affected import's fact rows from
      stored rawLine with corrected amounts, without re-upload, and with
      account declarations, merchant rules and dedup behaviour intact", and
      change H1.3's addressed-by in M1-P2 to name that criterion via
      later-phase M1-P3 as it does now, with M1-P3's H-list carrying the
      hazard against criterion 2.7.
    analysis: >-
      The construction: implement M1-P3 exactly to its criteria, skip the
      re-parse entirely, merge green. The hazard chain then points at a
      phase that never tested the thing, and the one declaration that
      crosses into the facts layer (the intake calls it out as needing
      explicit handling) ships with zero coverage. A later-phase discharge
      is only honest if the later phase's acceptance actually carries it.
  - id: PR-005
    severity: high
    evidence:
      - >-
        delivery/plan/pulse-v1.yaml:716-722 and 759-766 (M1-P5 step 1 and
        criterion 4.1): the golden journey uploads account A and account B
        fixtures with a transfer leg pair; no card fixture, no settlement.
      - >-
        delivery/intake/pulse-v1-plan.md:113: card settlement "is the reason
        the card export has to be in v1 rather than after it".
      - >-
        notes/export-format-facts.md:60-62: two banks means at least two
        source profiles from the first real import, and the settlement
        pairing appears on both sides.
      - >-
        delivery/intake/pulse-v1-architecture.md:243: the golden journey is
        "the strongest spec artifact in the project".
    concrete-edit: >-
      Extend M1-P5 step 1 and criterion 4.1 to a three-file journey: sign
      in, upload the current-account fixture (profile 1), upload the second
      pot account fixture containing the other transfer leg, upload a card
      fixture (profile 2: no counterparty account column, no sequence
      numbers, containing line items plus the settlement mirror row), then
      assert on the month view that card line items are counted as spend
      exactly once, the settlement pair is excluded from both sides, and
      income, spend, reserves, pot-change and the zero reconciliation line
      match the fixtures' known values.
    analysis: >-
      The construction: a golden journey with two same-bank current
      accounts passes 4.1 while the product's stated hardest problem (card
      settlement across two banks, two profiles) is never exercised
      end to end. Given DR-0001 has made golden journey plus fast gate the
      binding release verification, whatever the journey does not cover is
      not verified at release at all. The strongest spec artifact should
      walk the trap the intake spent its longest paragraph on.
  - id: PR-006
    severity: medium
    evidence:
      - >-
        charter.yaml:72-74: "UNRESOLVED transactions and unmatched transfer
