findings:
  - id: CR-201
    severity: high
    evidence:
      - "Executed construction P5 against the committed use cases and real parser: confirm a first KBC-shaped card file with a declared account, then upload a SECOND physical card's file with the same structure. Captured output: 'P5 upload card B (a DIFFERENT physical card): {\"kind\":\"ingested\",\"importId\":\"import-4\",\"added\":1,\"known\":1}' and 'P5 accounts declared: [ account-2 ]' with all four stored rows carrying accountId account-2. The second card's rows were silently ingested into the FIRST card's account, no question asked, and its PIZZA NAPOLI row (a real transaction on card B, same day, amount and merchant as a card A row) was reported known: 1, meaning it was silently dropped by the dedup key, which hashes over the shared accountId (src/modules/import/domain/dedup.ts:33-40)."
      - "Mechanism in the shipped code: src/modules/import/application/upload-statement.ts:109 resolves a card-shape file's account from the spec-matching profile's binding, and the match is pure structural spec equality (src/modules/import/application/upload-statement.ts:92, src/modules/import/domain/source-profile.ts:205-206). Two cards of the same bank product produce byte-different files with IDENTICAL detected specs (detection is deterministic over structure, src/modules/import/domain/detect-profile.ts:1-6), and the card shape carries no own-account identifier at all (notes/export-format-facts.md, KBC section), so nothing in the system can tell the second card from a re-upload of the first. The confirm path reinforces it: src/modules/import/application/confirm-import.ts:75-82 reuses any spec-identical stored profile, so a second same-spec profile bound to a second account can never be created through the UI. The result screen (src/modules/import/ui/import-result.tsx) does not even name the account the rows landed in."
    concrete-fix: >-
      Make account attachment explicit for files that carry no own-account
      identifier. Minimum sound shape: (a) when an upload resolves its
      account through a profile binding, the outcome and the result screen
      must NAME the target account label; (b) the confirm flow must accept
      attaching to an EXISTING account (an accountId in the confirm input)
      as an alternative to declaring a new one, and when a declaration
      creates a new account, create a NEW profile row bound to it even if a
      spec-identical profile exists (drop the unconditional reuse at
      confirm-import.ts:75-82; the unique (householdId, name) index already
      distinguishes the twins); (c) on upload, when MORE than one stored
      profile matches the detected spec, return awaiting-declaration with
      the candidate accounts listed instead of silently picking the first
      (listProfiles orders by createdAt, upload-statement.ts:92 takes
      find()'s first hit). With exactly one match, current behaviour stands
      and criterion 1.5's ask-nothing re-upload is preserved.
    analysis: >-
      Shipped behaviour at risk: a Belgian household with two cards of the
      same bank product (his and hers KBC Mastercard, exactly the owner's
      recorded bank mix) has the second card's entire history silently
      booked onto the first card's account, and every same-day same-amount
      same-merchant coincidence ACROSS the two cards is silently dropped as
      already-known, losing real facts. Both corruptions survive every
      recompute (account attribution and row existence are facts, not
      interpretation), the drop is not recoverable by M1-P3's re-parse
      because the row was never stored, and the import report actively
      misstates the drop as known rows. This passes every acceptance
      criterion: 1.5 only exercises one account per shape.

  - id: CR-202
    severity: medium
    evidence:
      - "Executed construction P3: parseStatement with a confirmed indicator spec (debitValue D) over a file whose rows carry indicators D, STORNO and empty. Captured output: 'P3 amounts for D / STORNO / empty indicator: [ -1850, 9999, 1200 ]'. The unknown STORNO row and the missing-indicator row were both silently stored as POSITIVE amounts."
      - "Mechanism: src/modules/import/domain/parse-statement.ts:193-197 signs the amount negative when the indicator equals debitValue and positive OTHERWISE, with no closed vocabulary; the stored spec cannot even express one because it carries only debitValue (src/modules/import/domain/source-profile.ts:24-29). Detection pins a closed indicator pair over the sampled file (detect-profile.ts:54-59), but parse runs over every FUTURE file of that source with the stored spec, where a third token or a blank cell parses silently. The real KBC CSV column layout is still unverified (work history claim M1P2-C1), so unknown tokens are live, not hypothetical."
    concrete-fix: >-
      Store creditValue alongside debitValue in the indicator
      representation (detection already knows the pair it matched), and
      make parseStatement return a row-error for any indicator cell that is
      neither, failing the whole file loudly like an unparseable amount
      does today.
    analysis: >-
      Shipped behaviour at risk: a future statement of an already-confirmed
      card source containing any indicator token outside the sampled pair
      (reversal, correction, or an empty cell on a malformed line) books
      that row as money ENTERING the pot. Sign errors on facts survive
      recompute and misstate spend and income until a human notices one row.
      This is hazard class H1.1's harm arriving through the parse path
      rather than the detection path the fixtures cover.

  - id: CR-203
    severity: medium
    evidence:
      - "Executed construction P4: detectSourceProfile over a debit-and-credit-pair export whose credit column happens to be empty this month (three debit rows, header row 'Date,Counterparty account,Name,Details,Debit,Credit,Account' identical to the committed generic-debit-credit.csv fixture). Captured output: 'P4 detected representation: {\"kind\":\"signed\",\"column\":4}' then 'P4 stored cents for three debits: [ 74210, 1525, 8800 ]'. Every debit proposed as a POSITIVE amount: a 742.10 invoice payment previews and would be stored as +74210 cents."
      - "Mechanism: an all-empty credit column has no non-empty values so it never qualifies as an amount column (src/modules/import/domain/detect-profile.ts:187-195), leaving one amount column with no negatives, no indicator pair, and the silent fallback to kind signed at detect-profile.ts:245. The header tokens 'Debit' and 'Credit' are consulted only to ORDER an already-found pair (detect-profile.ts:227), never to recognise that a pair exists."
    concrete-fix: >-
      In the single-amount-column branch, before falling back to signed,
      look for a sibling column whose HEADER matches the debit/credit
      vocabulary already used at detect-profile.ts:227 (credit|bij, plus
      debit|af) and whose cells are all empty; when found, propose
      debitCredit over the pair. When the single amount column itself
      carries a debit-flavoured header and no negative values, refuse with
      an undetectable ambiguous-amount-columns error instead of proposing
      signed, so the user is asked rather than handed an inverted proposal.
    analysis: >-
      Shipped behaviour at risk: the first month a household imports a
      debit/credit-pair export that happens to contain only spend (a
      low-activity account, a short overlap export), the proposed profile
      silently inverts every sign; the five-row preview does show positive
      amounts, but positive numbers next to merchant names do not read as
      wrong to a user who has never seen the convention. If confirmed, the
      wrong facts land and, worse, the confirmed signed spec no longer
      structurally equals the spec a fuller month detects, so the source
      forks into two profiles. Recoverable via M1-P3 re-parse (rawLine kept),
      which with the preview mitigation is why this is medium, not high.

  - id: CR-204
    severity: medium
    evidence:
      - "Executed construction P6: two confirmImport calls for the SAME awaiting card import racing under Promise.all, each carrying a declaration, against the committed use case and fakes. Captured output: 'P6 confirm outcomes: ingested ingested', 'P6 accounts created: 2', 'P6 transaction rows stored (file has 3 rows): 6'. Every row of the file was stored TWICE, once per freshly declared account."
      - "The real write path has the same read-then-act shape with no guard: confirm-import.ts:35-41 reads the status and proceeds; ingestRows' status transition is an unconditional updateMany filtered only on id and householdId (src/modules/import/adapters/import-repository.ts:201-210), so it cannot detect that a rival confirm already moved the import to INGESTED; account creation cannot collide for card accounts because iban is null and the (householdId, iban) unique index treats nulls as distinct (migration.sql:79). The only accidental guard is the (householdId, name) unique index on source_profiles when both racers carry the same profile name AND the loser's findProfileBySpec runs before the winner's createProfile commits; the interleaving where it runs after reuses the winner's profile and double-ingests under the loser's account."
    concrete-fix: >-
      Make the status transition the guard: inside ingestRows' transaction,
      updateMany with where status in (PARSED, AWAITING_DECLARATION) and
      throw when the update count is 0 so the whole transaction (including
      createMany) rolls back; have confirmImport map that to the existing
      not-awaiting-declaration rejection. Belt: disable the confirm button
      on submit in profile-confirmation.tsx.
    analysis: >-
      Shipped behaviour at risk: a double-clicked confirm button (the form
      has no double-submit guard) can duplicate an entire card statement
      under a ghost second account plus a twin profile. The facts layer is
      append-only by design, so the product ships no operation that can
      repair it; cleanup is manual SQL. Probability is a race window
      spanning several sequential awaits, consequence is unrepairable
      duplicated money, hence medium. Note the upload path does NOT share
      this defect: racing uploads of a known source converge on the same
      dedup keys and ON CONFLICT DO NOTHING makes the second add zero.

  - id: CR-205
    severity: low
    evidence:
      - "Executed construction P1: a natural-key profile file where one row carries statement and sequence numbers and an identical-content row misses them, then an overlapping re-export carrying only the keyless row. Captured output: 'P1 fileA keys: [ nat:acc-1:7:0319, h:d32a48e0...#1 ]', 'P1 fileB keys: [ h:d32a48e0...#0 ]', 'P1 keyless row keyed h:#1 in A but h:#0 in B (cross-import duplicate): true'. The same physical transaction gets key #1 in one import and #0 in the other, so the insert-ignore stores it twice."
      - "The comment at src/modules/import/domain/dedup.ts:50-51 states the fallback ordinal counts 'its position among equally-keyless identical rows'; the loop at dedup.ts:69-74 counts ALL earlier identical-content rows including ones that took the natural key. A false present-tense claim in a comment is itself a finding under R-087."
    concrete-fix: >-
      In the hasNaturalKey branch, compute the hash ordinal only over
      earlier rows that themselves lack the natural key (filter before
      counting, or pass the keyless subset to hashKey), making the comment
      true; keep the pure-hash branch as is. This changes no stored key for
      any pure-card profile, so the frozen-inputs stability contract at
      dedup.ts:18-22 is not violated for the shipped card path.
    analysis: >-
      Shipped behaviour at risk: for a natural-key source that
      occasionally emits rows without statement or sequence values, an
      overlapping re-export duplicates such a row whenever its
      identical-content keyed sibling is present in one file and absent in
      the other. Requires a keyless row content-identical to a keyed one,
      so low; filed loudly because the comment claims the safe semantics
      while the code ships the unsafe one.

  - id: CR-206
    severity: low
    evidence:
      - "Executed construction P2: two structurally DIFFERENT rows, counterparty 'FOO|BAR' with reference 'X' versus counterparty 'FOO' with reference 'BAR|X', same date and amount. Captured output: 'P2 distinct rows, colliding keys: true h:87117cbe...#0'. contentTuple at src/modules/import/domain/dedup.ts:33-40 joins the five hash inputs with an unescaped '|', so field content containing the separator shifts the boundaries and two different transactions hash identically; across two imports the second is silently dropped as known."
    concrete-fix: >-
      Canonicalise the tuple unambiguously before hashing: length-prefix
      each field (or JSON.stringify the array) inside contentTuple. This
      changes every stored hash key, so it must land BEFORE first real use,
      while the frozen-inputs contract at dedup.ts:18-22 is still cheap to
      re-freeze; shipping it later costs a full duplicate re-import.
    analysis: >-
      Shipped behaviour at risk: a counterparty or reference string
      containing a pipe character (free-text fields from real exports)
      can collide two distinct facts into one dedup key, dropping a real
      row on a later overlapping import. Probability is low but the fix
      window is closing: the key recipe is declared frozen at first use.

  - id: CR-207
    severity: low
    evidence:
      - "src/modules/import/application/upload-statement.ts:80 and src/modules/import/application/confirm-import.ts:91 both fill a missing dedup key with the empty string (keys[index] ?? ''). assignDedupKeys returns exactly rows.map(...) (src/modules/import/domain/dedup.ts:46-58) so the branch is unreachable today, but if any future edit ever de-synchronises the arrays, every affected row shares dedupKey '' and the (householdId, dedupKey) unique index (migration.sql:94) makes skipDuplicates keep ONE of them and silently drop the rest, reported as known."
    concrete-fix: >-
      Replace the '?? \"\"' fallback with a thrown invariant error (a bug,
      so an exception per pulse-typescript section 5), or have
      assignDedupKeys return rows zipped with their keys so the index
      lookup disappears from the type.
    analysis: >-
      Shipped behaviour at risk: none today; the finding is that the
      chosen appeasement of noUncheckedIndexedAccess converts a future
      programming error from a loud crash into silent row loss on the
      facts layer, which is the exact failure class this product exists to
      avoid. One line to make it fail loud.

