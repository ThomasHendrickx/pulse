findings:
  - id: CR-208
    severity: low
    evidence:
      - "Executed construction P7 against the 41ff037 tree: a file whose Debit-headed column carries explicitly NEGATIVE values (-742.10, -15.25) with an empty Credit sibling detects as debitCredit via the new empty-sibling pairing and parses to [ 74210, 1525 ]: every debit stored POSITIVE, a full sign inversion. Captured detection output {\"kind\":\"debitCredit\",\"debitColumn\":3,\"creditColumn\":4}."
      - "Executed construction P7b: the same inversion exists on the ORIGINAL two-populated-column pair path (-742.10 in a Debit column next to a filled Credit column parses to +74210), so the defect predates the delta; the delta's findEmptySiblingPair (src/modules/import/domain/detect-profile.ts) only widens the family of files that reach the negating branch. Mechanism: the debitCredit branch of amountOf (src/modules/import/domain/parse-statement.ts) negates the parsed value instead of negating a magnitude, so a value already carrying a minus flips positive; the indicator branch by contrast takes Math.abs before signing."
    concrete-fix: >-
      In the debitCredit branch of amountOf, return a row error when the
      cell text carries an explicit sign (equivalently, when the parsed
      value is negative), the same fail-loud discipline F2 established for
      unknown indicator markers: a signed value inside a directional
      column is a convention the profile did not declare, and a sign is
      never guessed. One conditional per sub-branch plus a red fixture.
    analysis: >-
      Shipped behaviour at risk: an export convention writing signed
      negatives inside a debit column would have every debit silently
      inverted into apparent income. Low, not medium, because neither
      recorded real format (Belfius signed column, KBC indicator) nor any
      observed pair export uses signed values in directional columns, the
      five-row preview shows the flipped signs before confirm, and the fix
      is one loud refusal; filed so the pair branch reaches the same
      never-guess bar the fix round set everywhere else.

  - id: CR-209
    severity: low
    evidence:
      - "Executed construction P3b against the 41ff037 tree: parseSourceProfileSpec ACCEPTS an indicator representation whose two tokens are case-variants of one value (debitValue X, creditValue x), captured 'accepted: true'; parseStatement then compares case-insensitively (amountOf uppercases both sides in src/modules/import/domain/parse-statement.ts), so the credit token is unreachable and an 'x' row the user meant as credit parses to -1850, silently signed debit."
      - "Reachability: detection can never produce such a pair (INDICATOR_PAIRS tokens stay distinct after uppercasing), but the confirm form's editable spec JSON goes through parseSourceProfileSpec and nothing rejects the degenerate pair (the indicator arm in src/modules/import/domain/source-profile.ts checks only that each token is a non-empty string)."
    concrete-fix: >-
      In parseSourceProfileSpec's indicator arm, reject the spec when
      debitValue.toUpperCase() equals creditValue.toUpperCase()
      (invalid-spec at amountRepresentation), so the degenerate pair
      bounces at the boundary with the existing bad-spec status instead of
      parsing with an unreachable credit token.
    analysis: >-
      Shipped behaviour at risk: a hand-edited spec with case-colliding
      indicator tokens signs every matching row as debit with no error.
      Requires the user to type a self-contradictory pair into the spec
      textarea, so low; filed because the fix round's own rule is that a
      sign is never guessed, and a spec whose credit token cannot match
      makes every sign a foregone conclusion the validator should refuse.

