hazard-classes-addressed:
  - class-id: H1.1
    probed: >-
      Attacked the amount pipeline from text to stored cents with executed
      constructions rather than reading alone: verified no float touches
      the path (parse-amount assembles digits with integer arithmetic;
      Number.isSafeInteger guards overflow; probing '1.234' comma-style and
      both misdeclared-style crossings fails loudly); flipped
      representation shapes against detection (P4: a debit/credit export
      with an all-empty credit column detects as signed and proposes every
      debit POSITIVE, captured output in CR-203); fed a confirmed indicator
      profile unknown and empty indicator tokens (P3: both silently stored
      positive, captured output in CR-202); checked the fixtures' Windows-
      1252 bytes decode through the detected encoding without corrupting
      rawLine. The criterion 1.1 fixture families are real and green, and
      the two constructions above name what still slips through them.
    finding: CR-203
  - class-id: H1.2
    probed: >-
      Walked both write paths for a partial-write escape. Upload path:
      the mixed check runs on parsed data before any transaction write and
      the FAILED Import row is the only write (upload-statement.ts:50-52,
      28-36); confirm path re-parses under the CONFIRMED spec and re-checks
      before ingest (confirm-import.ts:43-52). ingestRows wraps the row
      createMany and the status transition in one prisma.$transaction
      (import-repository.ts:178-212), so a crash mid-batch rolls both
      back; a crash between createImport(PARSED) and ingest leaves a
      zombie PARSED import with ZERO transaction rows, which is a stuck
      state, not a partial ledger. Executed: both mixed-account tests green
      under npm test here; the work history's defang witness reddens both
      together. Residual, named and inherent: a concatenation of two CARD
      files is undetectable because the card shape carries no own-account
      identifier; nothing in this phase can close that.
    cleared-because: >-
      No path writes a subset of a mixed-account file: the mixed check
      precedes every transaction write on both paths, the ingest is
      transactional with the status transition inside it, and the only
      writes on failure paths are the FAILED Import row. The undetectable
      card-shape concatenation is an input-identity limit, not a partial
      write.
  - class-id: H1.3
    probed: >-
      This class is declared addressed-by M1-P3; what this phase must
      deliver is the preserved input. Verified: every stored row carries
      rawLine equal to its decoded source line (criterion 1.4 test,
      executed green here; parse-statement.ts:115), the original BYTES ride
      Import.rawContent (import.prisma:64), and immutability holds at this
      head: grep over src/ finds no update, delete or upsert on
      Transaction anywhere; the only updateMany calls touch Import status
      fields (import-repository.ts:163, 201). The ingest write is
      createMany with skipDuplicates, never an upsert, so a re-upload can
      not overwrite an existing fact row. Named residue for the M1-P3
      re-parse to mind: rows a wrong profile caused to be silently DROPPED
      (CR-201's cross-card collision, CR-206's tuple collision) were never
      stored, so a re-parse from stored Transaction.rawLine cannot recover
      them; recovery needs Import.rawContent, which is kept.
    cleared-because: >-
      The phase's half of the hazard is delivered: rawLine verbatim on
      every stored row, original bytes on the Import, no Transaction
      update path in the diff, and the ingest upsert shape is insert-with-
      skip, never update. The re-parse that consumes it ships with M1-P3
      as the plan declares; the dropped-row recovery caveat is recorded
      above and in CR-201.
