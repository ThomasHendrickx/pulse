deviations-judged:
  - deviation: >-
      Criterion 12.17, the half requiring the phase work history to record the command actually run
      AGAINST THE DEPLOYED DATABASE with its exit code and its printed before-and-after assignment-set
      sizes.
    serves-plan-intent: true
    reasoning: >-
      The deviation is forced by decision D-46, which the same criterion pins: the routine imports the new
      derivation, so it cannot run against a build that does not carry it, and this branch is neither
      merged nor deployed. Running it now would write merchant_rules while the deployed application still
      carries the old code, which is D-46's window with its halves in the wrong order. The plan has since
      moved the deployed run to criterion 16.1 in M3-P16, whose entry condition IS the deploy, so nothing
      is dropped. The half this phase owed, an invocation point with a test that finds it and a header
      carrying the order and its reason, is delivered.
  - deviation: >-
      Criteria 12.7, 12.8 and 12.9, which speak of "a seeded database" holding MerchantRule rows written
      under the baseline derivation.
    serves-plan-intent: true
    reasoning: >-
      The subject is the in-memory fake at test/application/fake-import-world.ts rather than live
      Postgres, which is this tree's standing convention for the application layer. It serves the intent
      and in one place exceeds it: criterion 12.9's assertion that the routine issues no write against the
      transactions table AT ALL is observable on a port and would need a query log against a real
      database. The one thing a fake cannot witness, that a rejection rolls the whole batch back, is
      covered separately by test/e2e/merchant-rule-write.spec.ts against real Postgres, which passed in my
      own run. The fake was also taught the table's unique key, so it now refuses what the schema refuses.
  - deviation: >-
      files-to-touch, which does not name .gitignore.
    serves-plan-intent: true
    reasoning: >-
      Removing a tracked node_modules symlink that published an absolute container path into a public
      repository is squarely in the plan's intent, and widening the ignore rule so the next worktree
      cannot repeat it is the minimum honest fix. The correction the implementer then made to its own
      sentence, that the blob is still reachable in this branch's pushed history and only the squash merge
      keeps it off main, is the part that matters and it is stated rather than left to be inferred.
  - deviation: >-
      files-to-touch, which does not name src/app/globals.css, test/e2e/, messages/en.json,
      messages/nl.json, messages/fr.json or src/app/(app)/merchants/page.tsx.
    serves-plan-intent: true
    reasoning: >-
      Criterion 12.18 requires a naming refusal to REACH THE READER, which cannot be met inside the
      declared file set: it needs a status the route reads, a component that renders it, a message in each
      of the three catalogues, a style and a browser witness. The consequence the implementer draws is the
      one that matters and it corrected the plan for it: the conflicts-with entry for M3-P9 asserted as
      CHECKED that this phase touches none of M3-P9's four files, and two of them are src/app/globals.css
      and test/e2e/. A false checked statement is worse than an unchecked one and it is fixed in
      delivery/plan/pulse-v02.yaml on this branch.
  - deviation: >-
      Criterion 12.1's composition clause, "at least 8 rows carry none", under its strict reading.
    serves-plan-intent: true
    reasoning: >-
      This is the plan's defect and leaving it alone is correct. Under the strict reading "none" means no
      account FIELD, which collides with the step that requires the same fixture to carry the truncation
      and two-token attack rows: those rows DO carry an account field and fall to the descriptor basis
      when the trust gate refuses them. The shipped test asserts 8 DESCRIPTOR-BASIS rows, which is the
      only reading the plan admits, and my own run measured 16 account-basis rows over 4 accounts and 8
      descriptor-basis rows against thresholds of 8, 4 and 8. No code was contorted. I record separately,
      under criterion 12.1, that the criterion's arithmetic claim that 24 rows and 12 counterparties
      "force the descriptor-basis count to exactly 8" does not follow, and that the amendment is owed by
      the orchestrator rather than by this phase.
  - deviation: >-
      Criterion 12.5's committed baseline table, test/fixtures/baseline-descriptor-keys.json.
    serves-plan-intent: true
    reasoning: >-
      Not a departure from the plan at all: one invented PAN-shaped substring already present in another
      form was added to the identifier allow list with its provenance. That is the allow list working as
      designed, and gate:privacy passes with exit 0 in my own run.
  - deviation: >-
      Step 13, "run the full gate before calling the slice done", read as one clean run of every gate.
    serves-plan-intent: true
    reasoning: >-
      The four fast gates plus gate:tokens exit 0 on the first run, which I reproduced. The Playwright
      gate did not, and the implementer names both failures rather than summarising them, which is the
      right disposition. I reached the same red independently, with a different set of ten failures and a
      captured ENOSPC on the same filesystem, so the honest statement is that this gate has no green run
      on record anywhere and criterion 12.14 is marked not met on that basis rather than waved through.
  - deviation: >-
      Criterion 12.23, added to the plan AFTER this implementation was built.
    serves-plan-intent: true
    reasoning: >-
      The criterion says of itself that it is owed by the NEXT change to the phase, and this is that
      change, so building it rather than claiming the exemption is right. I attacked the shipped guard
