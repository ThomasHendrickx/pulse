      same way and for the same reason.
  - deviation: >-
      Criterion 12.23's consequence: the routine cannot be rehearsed against any database an operator can
      create.
    serves-plan-intent: true
    reasoning: >-
      I verified the consequence is real: assessRederiveTarget refuses a local connection because it
      carries a project ref in neither its username nor its host, and I witnessed that refusal against
      postgresql://postgres:PW@localhost:5432/postgres. The alternatives are an override flag criterion
