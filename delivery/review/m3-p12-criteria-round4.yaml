findings:
  - id: CR4-M3P12-02
    severity: high
    evidence:
      - "test/e2e/merchant-rule-write.spec.ts:35 constructs its own client with `const prisma = new PrismaClient();` and then WRITES with it at :43, :46, :49, :52, :71 (through applyRuleWrites), :100, :124 and :145 through :149. Nothing in the file, in playwright.config.ts or in the npm script names a target."
      - "WITNESSED, that new PrismaClient() reads process.env and nothing else: with a .env at the package root carrying DATABASE_URL and DIRECT_URL and both cleared from process.env, `new PrismaClient(); await client.$connect()` threw 'error: Environment variable not found: DATABASE_URL.' So the spec's target is whatever the shell carries."
      - "WITNESSED, that the shell wins over .env for the SERVERS too: playwright.config.ts:104 and :127 spread `...process.env` into both webServer env objects, and Next's own loader does not override a shell-carried variable. Running `loadEnvConfig(process.cwd(), true, ...)` from @next/env in this worktree, with PULSE_ENV_PROBE set BOTH in the shell and in .env, printed 'PULSE_ENV_PROBE resolves to: from-shell' and 'DATABASE_URL hostname prefix after loadEnvConfig: aws-1-eu'."
      - "WITNESSED, that the ambient value in this fleet container is a remote pooler and not a local stack: `env | grep -c '^DATABASE_URL='` returns 1 and the value's host begins aws- with port 6543. Fleet warnings 1 and 16 record that it belongs to a DIFFERENT Supabase project of the owner's, with a working password."
      - "WITNESSED END TO END, by my own first e2e attempt in this worktree: I started `npm run test:e2e` with a .env pinned to a private local database pulse_r4crit, and every app-driven spec failed while the servers came up, because the app was talking to the ambient remote target rather than to the pinned one. I aborted that run. Repeating the identical command with the environment explicitly pinned (`set -a; . ./.env; set +a; npm run test:e2e`) turned the same specs green."
      - "The plan already names this exact shape as a hazard class it must guard: H12.30, 'an invocation made with whatever the environment happens to hold writes a migration into a database nobody named. It is not a remote possibility in this fleet'. Criterion 12.23 buys the guard for scripts/rederive-merchant-rules.ts only. This phase then added a second writing surface, in test/e2e/merchant-rule-write.spec.ts, and left it unguarded."
    concrete-fix: "Make the writing e2e surface refuse a non-local target before its first write, reusing the pure predicate this tree already has rather than writing a second one: import assessDestructiveDbTarget from src/platform/db/guard.ts (its LOCAL_HOSTS set is at src/platform/db/guard.ts:31) and, in a beforeAll in test/e2e/merchant-rule-write.spec.ts, assert the verdict allows before any create. Better still because it covers the app-driven specs too, add a Playwright globalSetup that resolves process.env.DATABASE_URL and throws when its host is not local, and drop DATABASE_URL, DIRECT_URL and the SUPABASE_* names from the `...process.env` spreads at playwright.config.ts:104 and :127 so the committed .env is what the gate runs against. Either way, add the refusal's own test beside test/db/target-guard.test.ts."
    analysis: "THIS IS THE FINDING MY CONTRACT DID NOT REACH THROUGH ANY CRITERION, and I am recording it as the criteria contract's own clause requires. Criterion 12.14 asks only that the e2e gate exit 0; nothing asks what database it exits 0 against. The unguarded app-driven specs predate this phase and the vulnerability is therefore partly inherited, which is why the fix I propose covers both. What is NEW here is a spec whose entire content is direct writes through a client nobody pointed anywhere, added by the same phase that shipped an interlock against exactly that. I did not and will not query the foreign project to establish whether rows from my aborted run reached it; the anon key the app used came from the pinned .env and would not have been valid there, and every app spec failed, but I cannot turn that into a proof and I am not claiming one."
  - id: CR4-M3P12-01
    severity: medium
    evidence:
      - "src/platform/db/resolve-env.ts:12 through :17 states, as a present-tense fact about the Prisma CLI: 'A variable the shell carries as the EMPTY STRING falls back too'. Witnessed FALSE against the pinned CLI in this worktree."
      - "Captured, in /home/user/wt-m3p12-r4crit with a .env carrying DATABASE_URL and DIRECT_URL: `env -u DIRECT_URL DATABASE_URL=\"\" npx prisma validate` printed 'Environment variables loaded from .env' and then 'error: Error validating datasource `db`: You must provide a nonempty URL. The environment variable `DATABASE_URL` resolved to an empty string.' Prisma CLI Version 6.19.3, Validation Error Count 1."
      - "Control, so the finding is about the EMPTY case and not about .env loading: `env -u DATABASE_URL -u DIRECT_URL npx prisma validate` printed 'The schemas at prisma/schema are valid'. The fallback for an ABSENT variable is real; the fallback for an empty one is not."
      - "resolveDbEnv at src/platform/db/resolve-env.ts:57 through :60 implements the misdescribed reading and src/platform/db/guard-cli.ts consumes it."
      - "The plan repeats the same false sentence inside criterion 12.23: 'the .env file only for a variable the shell does not carry OR carries empty, which is the resolution src/platform/db/guard-cli.ts already implements and is named here because the two readings differ on the empty case'."
    concrete-fix: "Rewrite src/platform/db/resolve-env.ts:12 through :17 to say what is true: the Prisma CLI loads .env only for a variable the shell does not carry AT ALL, and resolveDbEnv deliberately treats a shell-EMPTY value as absent, which is STRICTER than the CLI and fails closed in both directions (the guard resolves a .env value and refuses a non-local target the CLI would have aborted on anyway). Add one case to test/db/db-guard.test.ts pinning that stated asymmetry, so the sentence stops being a claim nothing checks. Separately, the orchestrator should amend criterion 12.23 to state the asymmetry rather than to assert an equivalence that does not hold; this is a plan defect, not an implementer omission."
    analysis: "R-087: a false present-tense claim in a comment, load-bearing because criterion 12.23's word 'decorative' rests on it. No shipped behaviour defect follows for guard-cli: both divergent directions leave the guard stricter than the command it guards. The rederive interlock is unaffected, because it reads resolveClientDbUrl and I witnessed that this matches what new PrismaClient() reads."
  - id: CR4-M3P12-03
    severity: medium
    evidence:
      - "src/modules/merchants/application/rederive-rules.ts:459 through :467 justifies leaving a superseded rule in place with: 'The shipped matcher can never apply an un-namespaced pattern again: every key carries a lowercase namespace, EXACT is equality, and PREFIX and PATTERN would need a pattern that is a strict prefix of a lowercase namespace, which the uppercasing normaliser cannot emit.' The same claim is in the branch's commit message and in the printed-report comment at scripts/rederive-merchant-rules.ts:150 through :153."
      - "THE EXACT AND PREFIX HALVES ARE TRUE AND I VERIFIED THE PROPERTY THEY REST ON EXHAUSTIVELY: over every Unicode code point 0x0000 to 0x10FFFF excluding surrogates, ZERO uppercase to a string containing an ASCII lowercase letter, and over every BMP code point fed through the shipped normaliser, ZERO outputs contain one."
      - "THE PATTERN HALF IS FALSE, witnessed against the shipped matcher. Calling matchRules from src/modules/merchants/domain/merchant-rule.ts with a single un-namespaced rule: kind PATTERN, pattern '*ACME BV' MATCHED the key 'descriptor:ACME BV'; kind PATTERN, pattern '*' MATCHED 'descriptor:ACME BV' and 'descriptor:X'. A glob is not required to be a prefix of the namespace, so the stated reason does not cover PATTERN at all."
      - "The PREFIX half's escape is also reachable in principle rather than closed: kind PREFIX, pattern 'd' MATCHED 'descriptor:ACME BV' and 'descriptor:X', and pattern 'descripto' matched both. The comment names this case and dismisses it on the ground that the normaliser cannot emit such a pattern, which is true of a rule assignMerchant wrote and not true of one written by hand or by a later slice, which is exactly what src/modules/merchants/domain/merchant-rule.ts:28 says PREFIX and PATTERN exist for."
    concrete-fix: "Replace the sentence at src/modules/merchants/application/rederive-rules.ts:459 through :467 with what actually holds: a superseded EXACT rule is dead by construction, because a bare pattern can never equal a namespaced key; a superseded PREFIX or PATTERN rule is dead only while the table holds no rule of either kind, which is a MEASURED fact about today's data (src/modules/merchants/domain/merchant-rule.ts:15 through :21) and not a structural one. Then either restrict the superseded treatment to kind EXACT and keep the round-two blocking behaviour for a colliding PREFIX or PATTERN rule, or add one assertion to test/application/rederive-merchant-rules.test.ts pinning that the superseded set contains only EXACT rules, so the day a PREFIX rule is written the assumption goes red rather than silent."
    analysis: "No shipped defect today: assignMerchant writes EXACT and only EXACT, the deployed table holds zero rows of either other kind, and for the PATTERN shapes I could construct, the namespaced claimant is longer and wins the specificity tie-break, so the dead row is shadowed. What is wrong is the reason, and the reason is what a later reader will rely on. R-087's second shape exactly: a claim of impossibility with nothing keeping it true."
  - id: CR4-M3P12-04
    severity: low
    evidence:
      - "src/platform/db/target-guard.ts:76 through :81 admits four query parameters by name, pgbouncer, sslmode, connection_limit and schema, and checks only the NAME. I attacked the refusals against the shipped function and every hostile shape I could build was refused fail-closed EXCEPT the values of the admitted names."
      - "Captured, my own run of assessRederiveTarget over 24 constructed strings: REFUSED for a host parameter, an uppercase HOST parameter, a mixed-case Host parameter, a percent-encoded %68ost parameter name, an options parameter, a trailing-slash pathname, an empty pathname, a percent-encoded pathname, an uppercase database name, a different database name, a trailing-dot host, a mismatched ref in either field, a connection with no ref in either field, and a percent-encoded username. ALLOWED for the two baseline shapes and for `?schema=someone_elses_schema`, `?sslmode=disable`, `?connection_limit=1` and duplicated occurrences of those names."
      - "The module's own reason for checking the database name applies verbatim to the schema parameter: src/platform/db/target-guard.ts:201 through :203 calls the database 'the third thing that decides which data a write lands on'. The Postgres connector's schema parameter is a fourth, and it is admitted with any value."
    concrete-fix: "In src/platform/db/target-guard.ts, stop admitting a parameter by name alone where its value moves the write. Pin schema to absent or to the literal 'public' with the same refusal shape the database-name check uses at :204 through :209, and add the two cases to test/db/target-guard.test.ts beside 'a DIFFERENT DATABASE NAME is refused'. sslmode and connection_limit do not change where a write lands and can stay value-free; say so in the comment at :73 through :75 so the distinction is deliberate rather than accidental."
    analysis: "Bounded: a hostile schema value still lands inside the named project and the named database, and the tables would have to exist in that schema for anything to be written at all. It is a low finding because the guard's own stated reasoning covers the case and stops one field short."
  - id: CR4-M3P12-05
    severity: low
    evidence:
      - "The exit-4 contract is real in the code: scripts/rederive-merchant-rules.ts:277 through :296 catches RederiveRecomputeError, prints the full report through the one printReport function, prints three true sentences about the committed state, and returns 4."
      - "Nothing keeps the 4 true. The only test of that path is test/application/rederive-merchant-rules.test.ts:1455 through :1470, which reads the script as TEXT and asserts expect(script).toContain('EXIT 4, A FAILURE AFTER THEM'), a string that lives in the file's own header comment. Changing `return 4;` at scripts/rederive-merchant-rules.ts:296 to `return 1;` leaves every assertion in that test green while the header keeps promising 4."
      - "main() is not exported from scripts/rederive-merchant-rules.ts, so no test can call it; the process-level tests in test/db/target-guard.test.ts spawn the command and assert non-zero exits on the REFUSAL paths only, which never reach the recompute."
    concrete-fix: "Export main from scripts/rederive-merchant-rules.ts (or move its body into src/modules/merchants/application so the script is three lines) and add one test that drives it with a recompute that throws and asserts the returned code is 4 and that the printed report carries applied yes. That turns a comment nothing checks into a behaviour something checks, which is what the rest of this file's contract already gets."
    analysis: "The path is CORRECT as shipped and I verified it by reading it: RederiveRecomputeError carries writesCommitted true and buildReport(true), the script prints the same record it prints on success, and the three sentences it then prints are all true of a committed write set with a failed recompute. Every other exit path is also true: 3 on a refused target with nothing read, 2 on a missing household with nothing read, 1 on a blocked run whose report describes work that did not happen, 0 on a dry run that says so, and 1 from the top-level handler whose 'nothing was written' is scoped to failures before or inside the one transaction. The single residual falsehood I could construct is a throw from printReport itself after a successful run, which would reach the top-level handler and print 'nothing was written'; that needs console.log to throw and I am not raising it as its own finding."
