findings:
  - id: CR9-M3P12-HZ-01
    severity: high
    evidence:
      - >-
        THE SCAN'S ONE EXEMPTION RESTS ON A CLAIM THAT IS FALSE, AND THE
        SUBSTITUTE GUARD IT NAMES IS A NO-OP IN BOTH CONTEXTS WHERE THE EXEMPT
        MODULE IS ACTUALLY REACHED. The exemption is declared at
        test/db/gate-target.test.ts:431 and its reason at
        test/db/gate-target.test.ts:433 says, verbatim, "No test and no script
        CONSTRUCTS it. The one test that imports it,
        test/application/rederive-script-exit-codes.test.ts, replaces the
        module with a stub through vi.mock".
      - >-
        WITNESS A, THE FAST GATE. src/platform/db/client.ts:13 logs a
        diagnostic at MODULE SCOPE, before it constructs the client at
        src/platform/db/client.ts:51, so its own output is the witness that
        the module was evaluated. One run of npm run test:e2e's fast sibling,
        npm test, printed that line 14 times. Counting the stdout owner of
        each occurrence gives THIRTEEN distinct test files, not one:
        test/domain/merchant-review.test.ts,
        test/application/rederive-merchant-rules.test.ts,
        test/application/counterparty-identity-surfaces.test.ts,
        test/application/resolve-merchants.test.ts,
        test/application/kbc-fix-round-2.test.ts,
        test/application/reparse.test.ts, test/application/ingest.test.ts,
        test/domain/month-projection.test.ts,
        test/application/interpret.test.ts,
        test/application/kbc-settlement.test.ts,
        test/application/month-overview.test.ts,
        test/application/counterparty-identity-journey.test.ts,
        test/application/pdf-upload.test.ts and
        test/application/pdf-module-unavailable.test.ts. Command:
        grep -c "pulse:db" over the captured npm test log, then
        grep -n -B4 "pulse:db" to attribute each line to its file.
      - >-
        WITNESS B, THE PRODUCTION MIGRATION SCRIPT. Run in this worktree with
        DATABASE_URL pinned to an invented pooler string and a deliberately
        mismatched --expect-host, the captured output was, in this order and
        with nothing between them, "[pulse:db] DATABASE_URL present, scheme
        ok" then "rederive-merchant-rules: the resolved connection's host is
        not the host given on the command line. Refusing." The first line is
        src/platform/db/client.ts:13; the second is
        scripts/rederive-merchant-rules.ts:309. So the application's Prisma
        client is constructed from the ambient environment BEFORE
        assessRederiveTarget is called at scripts/rederive-merchant-rules.ts:297.
        The import chain is scripts/rederive-merchant-rules.ts:112 ->
        src/modules/merchants/application/index.ts:15 ->
        src/modules/merchants/adapters/merchant-repository.ts:14 ->
        src/platform/db/client.ts:51.
      - >-
        WITNESS C, WHY THE SUBSTITUTE GUARD COVERS NEITHER CONTEXT.
        assessDevServerDbTarget returns allowed for every environment whose
        NODE_ENV is not exactly "development" (src/platform/db/guard.ts:129
        through :135). vitest sets NODE_ENV=test and a tsx entry point sets
        none, so in the two contexts above it approves by construction before
        looking at DATABASE_URL at all. The module's own comment says so at
        src/platform/db/guard.ts:116, "What remains unguarded by this is an
        arbitrary tsx entry point with no NODE_ENV", which is exactly the
        re-derivation command.
      - >-
        THE RESIDUAL IS BOUNDED AND THE BOUND IS WITNESSED RATHER THAN
        ASSUMED, so this finding is not reported as a data breach. Prisma
        constructs lazily: with DATABASE_URL absent, new PrismaClient()
        returned normally; with DATABASE_URL pointing at a closed port it
        constructed in 5 ms and the FIRST QUERY was what failed, with
        PrismaClientInitializationError. No socket is opened at construction,
        so a refused run still opens nothing today. Nothing in this tree
        pins that property of an external dependency.
      - >-
        THE ARTIFACT ALREADY KNOWS THE FACT IN ONE PLACE AND CONTRADICTS IT IN
        ANOTHER, which is what makes this a finding rather than a nit:
        test/application/rederive-script-exit-codes.test.ts:4 states plainly
        that "The command under test imports the merchants module, which
        imports the Prisma adapter, which builds a client at import time",
        and mocks the module for exactly that reason.
      - >-
        THE SAME CHANGE RECORDS THE TRUE FACT IN A THIRD PLACE, which makes
        this a contradiction inside one artifact rather than an oversight
        anyone could have made. The work history's sixteenth declared
        deviation, at delivery/work-history/m3-p12.yaml:1974, argues for
        narrowing the dev-server predicate precisely because "vitest sets
        NODE_ENV=test and the fast gate imports this module transitively" and
        because "a tsx entry point carries no NODE_ENV at all, including the
        re-derivation command". Those are the two contexts the exemption's
        reason denies exist.
    concrete-fix: >-
      Two edits, and the first is the mechanism. ONE, make importing the
      application client open nothing: replace the eager
      src/platform/db/client.ts:51 binding with a lazy accessor (a getter or a
      function the adapters call) so module evaluation constructs no client,
      which also removes the reason the exemption exists. TWO, correct the
      exemption's reason at test/db/gate-target.test.ts:433 to say what is
      true, that thirteen fast-gate files and the re-derivation script reach
      this module transitively, and that the substitute guard
      assessDevServerDbTarget is inert whenever NODE_ENV is not exactly
      "development". If the lazy accessor is judged too wide a change for a
      fix round, the minimum honest alternative is to add an assertion to
      test/db/gate-target.test.ts that no file OUTSIDE the Next.js server
      imports @/platform/db/client without also carrying
      assertGateDbTargetIsLocal, which would fail today on
      scripts/rederive-merchant-rules.ts and on the thirteen test files, and
      to record the laziness of new PrismaClient() as a pinned assumption.
    analysis: >-
      Fleet warning 18's own stated lesson is that a guard's stated scope is
      not its reach, and that when a scan claims EVERY you read its
      denominator before believing it. Round eight widened the denominator
      correctly and then left the ONE exemption's justification unverified.
      The exemption is not a small hole: it covers the single module every
      repository in the tree imports to get a client, which is the shape a
      transitive door takes. The phase's own writing command reaches it, and
      the safety of that today rests entirely on a property of @prisma/client
      that no test in this tree asserts.

  - id: CR9-M3P12-HZ-02
    severity: medium
    evidence:
      - >-
        TWO PRESENT-TENSE CLAIMS IN THE MIGRATION COMMAND ARE FALSE AS
        WRITTEN, and clause R-087 names this shape exactly. The file header at
        scripts/rederive-merchant-rules.ts:86 says "Before this command reads
        or writes ANYTHING it requires --expect-host AND --expect-ref", and
        the inline comment at scripts/rederive-merchant-rules.ts:295 says "THE
        INTERLOCK RUNS FIRST, before the household argument is even read and
        before any repository call. A refused run has read nothing and written
        nothing."
      - >-
        Both are contradicted by the captured ordering in finding
        CR9-M3P12-HZ-01's witness B: the module-scope diagnostic from
        src/platform/db/client.ts:13 printed before the refusal from
        scripts/rederive-merchant-rules.ts:309, so a Prisma client resolved
        from the ambient environment already existed when the interlock spoke.
      - >-
        The narrower sentence is true and the wider one is not: no repository
        CALL is made before the interlock, which is what
        test/db/target-guard.test.ts asserts with a call-recording fake. The
        header generalises that to ANYTHING, which is the half that is wrong.
    concrete-fix: >-
      Rewrite both sentences to the claim the code actually supports, and
      quote the old text in place rather than deleting it, which is the
      convention this file already follows elsewhere. The true statement is
      that no repository call and no query is made before the interlock, that
      the application Prisma client IS constructed at import time by the
      module graph this command pulls in, and that no connection is opened by
      that construction because Prisma connects on first query. If finding
      CR9-M3P12-HZ-01's lazy accessor is taken, the original sentences become
      true and only the ordering note needs keeping.

  - id: CR9-M3P12-HZ-03
    severity: medium
    evidence:
      - >-
        THE SCAN IS CAREFUL ON THE DOOR AND CARELESS ON THE GUARD. scanDoors
        blanks line comments and quoted spans before testing for a door
        (codeOnly at test/db/gate-target.test.ts:455, applied at
        test/db/gate-target.test.ts:471), and then decides whether that door is
        guarded from the RAW text: test/db/gate-target.test.ts:475 reads
        guarded from raw.includes("assertGateDbTargetIsLocal"), and
        test/db/gate-target.test.ts:483 does the same for the admin client.
      - >-
        WITNESSED with a replica of scanDoors' two predicates, run outside
        this worktree over a synthetic file that constructs a client in code
        and names the assertion only inside a line comment. Captured output:
        "detected as prisma door: true" and "scan says guarded     : true".
        So a real door passes the scan on the strength of a comment.
      - >-
        Two smaller gaps in the same function. codeOnly strips only line
        comments and never a block comment, so the same trick works with a
        block comment on the DOOR side too. And guarded proves only that the
        NAME appears somewhere in the file: it does not prove the assertion is
        called, is reachable, or runs before the constructor. The one place
        ordering is proved is the seed-specific test at
        test/db/gate-target.test.ts:520, which compares indexOf positions, and
        that test covers prisma/seed.ts alone.
    concrete-fix: >-
      Compute guarded from source rather than from raw at
      test/db/gate-target.test.ts:475 and :483, extend codeOnly to strip block
      comments as well as line comments, and generalise the indexOf ordering
      assertion that test/db/gate-target.test.ts:520 already applies to
      prisma/seed.ts so that EVERY door in the scan's result must show its
      assertion before its constructor. All three are edits inside one test
      file and none of them changes product code.

  - id: CR9-M3P12-HZ-04
    severity: low
    evidence:
      - >-
        WHAT THE WIDENED DENOMINATOR STILL CANNOT SEE, answered by reading it
        rather than by trusting its title. trackedSourceFiles at
        test/db/gate-target.test.ts:415 runs git ls-files and then keeps only
        names matching a JavaScript or TypeScript extension.
      - >-
        THE DISPATCH'S OWN PREMISE IS HALF WRONG AND THE CORRECTION MATTERS:
        git ls-files reads the INDEX, not HEAD, so a file added in the same
        commit IS listed and IS scanned. It is the UNTRACKED file that is
        invisible, which is a real and ordinary case: an operator's own
        one-off script sitting in the working tree is exactly the thing that
        runs with whatever the shell holds, and it is exactly what fleet
        warning 1 is about.
      - >-
        Three further blind spots, each a door shape rather than a location.
        A door reached TRANSITIVELY rather than constructed in place is
        invisible, which is finding CR9-M3P12-HZ-01. A NON-JavaScript door is
        invisible: scripts/gate-privacy.sh and scripts/sync-branches.sh are
        never read (they open no database today, checked with grep for psql,
        supabase, DATABASE_URL and prisma, which returned nothing), and
        neither would a future shell script, a SQL file or a supabase CLI
        invocation. And a Supabase admin client whose service key reaches it
        under any name other than the literal SUPABASE_SERVICE_ROLE_KEY is
        invisible, because that literal is half the predicate at
        test/db/gate-target.test.ts:479.
    concrete-fix: >-
      Keep git ls-files as the denominator, and add one assertion beside it
      that the WORKING TREE carries no untracked file matching the same
      extensions and the same door patterns, so an operator's scratch script
      is red in the fast gate rather than silent. Separately, narrow the
      claim: the test's title at test/db/gate-target.test.ts:495 says EVERY
      door in the tracked tree, which is true, while the file header at
      src/platform/db/gate-target.ts:5 says "nothing in this repository may
      open a database nobody named", which the four gaps above make wider than
      the instrument. State the instrument's limits in that header.

  - id: CR9-M3P12-HZ-05
    severity: low
    evidence:
      - >-
        The re-derivation declares a wider capability than it uses.
        RederiveDependencies at
        src/modules/merchants/application/rederive-rules.ts:321 Picks four
        members of MerchantRepositoryPort including upsertRule, and the
        routine never calls it: grep for deps.merchants. over that file
        returns exactly three call sites, listRules at
        src/modules/merchants/application/rederive-rules.ts:471,
        listCountedTransactions at :472 and applyRuleWrites at :1052.
      - >-
        It is not free. upsertRule is the one port member that will quietly
        REPOINT an existing declaration rather than reject a collision, which
        is the behaviour test/application/fake-import-world.ts:451 records as
        the reason the fake stopped routing inserts through it. A routine
        whose declared dependency set includes it reads as a routine that may
        use it, in the one module whose whole contract is that it deletes and
        overwrites nothing.
    concrete-fix: >-
      Drop "upsertRule" from the Pick at
      src/modules/merchants/application/rederive-rules.ts:321 so the type says
      what the routine actually needs. Test fakes are unaffected, since they
      implement the full port.

