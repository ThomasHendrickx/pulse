deviations-judged:
  - deviation: >-
      Criterion 12.17, the half requiring the phase work history to record the
      command actually run AGAINST THE DEPLOYED DATABASE with its exit code and
      its printed before-and-after assignment-set sizes.
    serves-plan-intent: true
    reasoning: >-
      Decision D-46 forbids the routine running before the code deploys and the
      criterion itself hands the deployed run to 16.1. Doing it here would
      break the decision the same criterion pins. The half this phase owes, an
      invocation point with a test that finds it, is met at
      test/domain/counterparty-identity-contracts.test.ts:121.
  - deviation: >-
      Criteria 12.7, 12.8 and 12.9, which speak of "a seeded database" holding
      MerchantRule rows written under the baseline derivation.
    serves-plan-intent: true
    reasoning: >-
      The subject is the in-memory fake at test/application/fake-import-world.ts
      rather than Postgres, and that is declared rather than hidden, including
      in the test file's own header. It serves the intent and in one direction
      exceeds it: criterion 12.9's "issues no write against the transactions
      table" is observable on a port and would need a query log against a real
      database. The one thing a fake cannot answer, the adapter's real
      transaction and its tenancy checks, is covered where a real database
      exists, test/e2e/merchant-rule-write.spec.ts:76, which passed in this
      reviewer's own slow-gate run. The fake is also held to the adapter's
      behaviour rather than being conveniently weaker: it models the unique key
      the adapter's create hits (test/application/fake-import-world.ts:451
      onward), which is the seam this codebase has already got wrong three
      times and now writes out.
  - deviation: "files-to-touch, which does not name .gitignore."
    serves-plan-intent: true
    reasoning: >-
      The change is one character and it closes the hole that let a worktree
      node_modules SYMLINK, carrying an absolute container path, be tracked into
      a public repository. Leaving the accident fixed and the pattern open would
      invite the next worktree to repeat it. The record also corrects its own
      earlier wording about reachability in history rather than leaving the
      softer claim standing, which is the right handling of a claim that was
      true of the tree and false of the repository.
  - deviation: >-
      files-to-touch, which does not name src/app/globals.css, test/e2e/,
      messages/en.json, messages/nl.json, messages/fr.json or
      src/app/(app)/merchants/page.tsx.
    serves-plan-intent: true
    reasoning: >-
      Criterion 12.18 requires a refusal to REACH THE READER, which cannot be
      built inside a set that excludes a route, a stylesheet, three message
      catalogues and a browser witness. The e2e witness exists and passed:
      test/e2e/merchants.spec.ts:276. The declaration should have named them and
      the amendment in flight is the right route; the work is correct.
  - deviation: >-
      Criterion 12.1's composition clause, "at least 8 rows carry none", under
      its strict reading.
    serves-plan-intent: true
    reasoning: >-
      Reading "none" as "no account FIELD" collides with the plan step that
      requires the same fixture to carry the truncation-attack rows, which DO
      carry an account field and fall to the descriptor basis. The shipped test
      asserts 8 DESCRIPTOR-BASIS rows, which is the reading the criterion's own
      arithmetic forces and the one the criterion's later sentence spells out.
      Contorting the fixture for the strict reading would have weakened the
      attack rows, which is the wrong trade.
  - deviation: >-
      Criterion 12.5's committed baseline table,
      test/fixtures/baseline-descriptor-keys.json.
    serves-plan-intent: true
    reasoning: >-
      Adding an already-invented identifier shape to the allow list with its
      provenance is exactly what fleet warning 11 requires. gate:privacy exits 0
      in this worktree.
  - deviation: >-
      Step 13, "run the full gate before calling the slice done", read as one
      clean run of every gate.
    serves-plan-intent: true
    reasoning: >-
      Recording that the Playwright run needed a re-run of one spec, with the
      cause kept in the gate-evidence entry rather than summarised away, is the
      honest handling. This reviewer's own slow-gate run in this container is
      reported in the header and needed no per-spec re-run.
  - deviation: "Criterion 12.23, added to the plan AFTER this implementation was built."
    serves-plan-intent: true
    reasoning: >-
      The criterion says a review of the implementation under review at
      relocation time marks it NOT MET AND NOT YET OWED, and that it is owed by
      the next change. This is that change and it is built, so the right verdict
      now is met rather than not-yet-owed, and this review marks it met. The one
      qualification is finding CR9-M3P12-HZ-01, which is about the module graph
      around the interlock and not about the interlock.
  - deviation: >-
      files-to-touch, which does not name src/platform/db/guard-cli.ts or
      src/platform/db/resolve-env.ts.
    serves-plan-intent: true
    reasoning: >-
      Criterion 12.23 calls an interlock that resolves differently from the
      command it guards decorative, so one shared reader is the only structural
      way to meet it. src/platform/db/resolve-env.ts is that reader and
      guard-cli.ts now imports it with no behaviour change.
  - deviation: "Criterion 12.17, the deployed run."
    serves-plan-intent: true
    reasoning: >-
      Same judgement as the first deviation. It is now the plan's, assigned to
      M3-P16, and the invocation point ships with an interlock in front of it,
      which is more than the criterion asked for.
  - deviation: >-
      Criterion 12.23's consequence: the routine cannot be rehearsed against any
      database an operator can create.
    serves-plan-intent: true
    reasoning: >-
      The two alternatives are an override flag the criterion forbids and a
      local carve-out that reopens the hole. Accepting the consequence and
      moving the sentence into the command's own header, where the person who
      runs it at deploy time meets it, is the right call. The rehearsal exists
      where it can: the application tests and
      test/e2e/merchant-rule-write.spec.ts:76 against a real database.
  - deviation: "files-to-touch, which does not name src/modules/overview/."
    serves-plan-intent: true
    reasoning: >-
      The overview fold was the fifth consumer of the identity and applied no
      floor, so two rows carrying no counterparty information at all merged into
      one month-view group with an empty label, which is hazard H12.15's exact
      outcome on the screen the owner actually reads. Repairing one screen and
      not its sibling would have been the defect this phase exists to remove.
      The predicate is injected rather than imported, so the overview module
      still imports nothing from merchants.
  - deviation: >-
      files-to-touch, which does not name playwright.config.ts,
      src/platform/db/gate-target.ts or src/platform/db/guard.ts.
    serves-plan-intent: true
    reasoning: >-
      The gate's configuration is the only place early enough to refuse an
      unnamed target before two web servers start, so a per-spec guard could not
      have met it. This reviewer exercised the consequence directly: with
      DATABASE_URL exported the slow gate now refuses, and the run had to be
      pinned through PULSE_GATE_* names instead, which is the documented
      behaviour at src/platform/db/gate-target.ts:67 onward rather than a
      surprise.
  - deviation: >-
      Criterion 12.23, which requires the interlock to resolve the environment
      "the way the command it guards resolves it" and describes that reading as
      ".env only for a variable the shell does not carry OR carries empty".
    serves-plan-intent: true
    reasoning: >-
      The criterion's description of the Prisma CLI is false, the code says so
      in place rather than repeating it
      (src/platform/db/resolve-env.ts:14 onward), and the divergence is checked
      in both directions and leaves the guard STRICTER than the command, which
      is the only direction a fail-closed interlock may err in. Routing the
      wording fix is the orchestrator's.
  - deviation: >-
      CRITERIA finding CR5-M3P12-11, which asks that a pass-two promotion adding
      no rule get its own outcome token.
    serves-plan-intent: true
    reasoning: >-
      Building it, watching four idempotence tests go red including criterion
      12.8's own byte-for-byte comparison, and REVERTING is the correct
      resolution of a finding that contradicts a criterion. The conflict is
      structural: run one inserts the account rule and run two finds it already
      held, so a token separating the two differs across runs by construction,
      which is hazard H12.27's shape. Recording the experiment rather than the
      conclusion alone is what lets the next reader check it.
  - deviation: >-
      CRITERIA finding CR5-M3P12-05 and the dispatch that accepted it, both of
      which describe the development-server refusal as gated on isProduction()
      being false.
    serves-plan-intent: true
    reasoning: >-
      The narrower predicate is right and the reasoning recorded for it is
      right: the wider one would make the fast gate refuse to run in any
      container with a remote ambient DATABASE_URL, to guard a server the fast
      gate never starts. THIS REVIEW ENDORSES THE NARROWING AND FLAGS ITS
      UNGUARDED REMAINDER SEPARATELY. The same record states, correctly, that
      the fast gate imports the client module transitively and that a tsx entry
      point carries no NODE_ENV, which is precisely why the exemption reason at
      test/db/gate-target.test.ts:433 is false; that is finding
      CR9-M3P12-HZ-01, and it is a defect in the SCAN'S justification rather
      than in this narrowing.

