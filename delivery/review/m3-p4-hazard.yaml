findings:
  - id: HZ-M3P4-01
    severity: medium
    evidence:
      - >-
        src/app/globals.css:408 and src/app/globals.css:409 state, present
        tense: "Criterion 4.1: every control on the import screens clears the
        phone tap target, the file picker included." Commit 787055b repeats it
        ("Every control on the import, declaration, confirmation and result
        screens now clears the 44px phone tap target"). The rule it sits on
        sizes only .import-field input and .import-field select; .import-primary
        and .import-next are sized separately. Nothing else on the import
        screens is.
      - >-
        Import-screen controls that carry no tap-target sizing at this head:
        (a) the account-not-registered refusal's link to the setup screen,
        src/modules/import/ui/import-status-line.tsx:34, rendered on the
        confirmation screen by src/modules/import/ui/profile-confirmation.tsx:86,
        an inline anchor inside p.import-status at --text-sm with no
        min-height (the only rules reaching it are the element-scope
        a display rule at src/app/globals.css:1606 and the transition list);
        (b) the spec editor's "Preview again" button,
        src/modules/import/ui/profile-confirmation.tsx:203, a SubmitButton with
        no className, so no rule sets its height; (c) the spec editor's
        disclosure summary, src/modules/import/ui/profile-confirmation.tsx:195,
        styled only by .spec-editor summary at src/app/globals.css:496 (font
        size and colour, no height). All three sit inside the same .import-form
        this phase restyled, or on the same screen.
      - >-
        Why every gate is green anyway: the phone journey in
        test/e2e/mobile-import.spec.ts:95 uploads only recognised PDF layouts
        for a card and a registered account, so it never renders a ?status=
        refusal, never renders the CSV format question and never opens the
        spec editor. The only callers of tapTargetOffenders are
        test/e2e/month-view.spec.ts, test/e2e/accounts.spec.ts and
        test/e2e/mobile-import.spec.ts (grep), and none reaches those states.
        (c) is outside criterion 4.1's selector (summary is not in INTERACTIVE
        at test/e2e/phone-helpers.ts:14) but inside the comment's "every
        control".
      - >-
        Why it matters beyond the wording: .claude/skills/pulse-frontend/SKILL.md:113
        makes the import a phone stance and says phone-width evidence
        "measures reachable tap targets". The account-not-registered refusal
        is a likely first-import path from the phone, and its one way forward
        is the undersized link in (a). Reasoned from the stylesheet, not
        measured, because this review may not run Playwright: an inline-block
        anchor at 12px text with no min-height and no padding cannot reach
        44 CSS pixels.
    concrete-fix: >-
      Either make the claim true or narrow it. To make it true: give the
      status-line link, the Preview again button and the spec editor summary
      min-height var(--tap-target-min) (the status link as inline-flex with
      align-items center, as .import-next does), and extend
      test/e2e/mobile-import.spec.ts with a second, short phone journey that
      uploads a CSV of unknown layout, opens the spec editor, and reaches the
      account-not-registered refusal, calling measureScreen on each. To narrow
      it instead: rewrite src/app/globals.css:408 to name what the rule
      actually sizes (the file picker and the text fields) and record the
      three unsized controls as owed work in the work history.
    analysis: >-
      This is clause R-087's first shape (a present-tense comment nothing
      keeps true) on top of a real gap in the phase's own intent (step 2:
      "the upload, declaration and result screens laid out for a phone
      viewport ... touch-target sizing via tokens"). It passes criterion 4.1
      because the criterion's journey is the PDF happy path. Ranked medium
      rather than low because the false sentence is the one a later phase
      will read to decide the import screens need no further tap-target work.

  - id: HZ-M3P4-02
    severity: low
    evidence:
      - >-
        This phase moved collectTestids and collectHiding out of
        test/e2e/month-view.spec.ts into test/e2e/phone-helpers.ts (diff;
        bodies byte-identical, checked with diff against 03625ee, exit 0 for
        both). Two comments in src/ still send the reader to the old home:
        src/platform/ui/link-pending.tsx:36 ("the helper collectTestids at
        test/e2e/month-view.spec.ts sweeps every data-testid") and
        src/app/layout.tsx:59 ("the pre-existing helper collectTestids at
        test/e2e/month-view.spec.ts:650"). Neither file was changed by the
        phase; src/app/layout.tsx is in its files-to-touch.
      - >-
        Those two comments carry a load-bearing reason (why a transient
        marker must not carry a data-testid), and after this phase the same
        sweep also runs on the import screens through
        test/e2e/mobile-import.spec.ts:69, which the comments do not say.
    concrete-fix: >-
      In src/platform/ui/link-pending.tsx:36 and src/app/layout.tsx:59 replace
      the month-view.spec.ts reference with test/e2e/phone-helpers.ts (no line
      number, since the old one was already stale), and add that the sweep
      is now shared by the month view and phone import specs.

  - id: HZ-M3P4-03
    severity: low
    evidence:
      - >-
        The new .import-next rule at src/app/globals.css:423 sets font-size
        var(--text-base) (13px, styles/tokens.css:85) and align-self
        flex-start on the two result-screen links. Before the phase no
        ancestor set a font size (body at styles/tokens.css:305 has none;
        .import-screen, .app-main and .app-shell have none), so the links
        rendered at the browser default size, and as flex items of
        .import-screen (display flex, column, no align-items) they spanned the
        column. Both changes apply at every width, the desk included.
      - >-
        Neither change is declared. The CSS comment above the rule says only
        "sized to the phone tap target and no wider than its label"; work
        history key-decisions[1] and key-decisions[4] do not mention the text
        size; and test/e2e/pressed-and-disabled.spec.ts:106 to :110 says "the
        class adds no new appearance", which is true of the pressed, disabled
        and busy vocabulary (a:active at src/app/globals.css:1670 is element
        scope) and false of appearance in general.
    concrete-fix: >-
      Either drop font-size from .import-next so the links keep the size they
      had, or keep it and declare the change in the work history as a
      deliberate move onto the type scale. In either case reword
      test/e2e/pressed-and-disabled.spec.ts:109 and :110 to "so the class adds
      no new pressed, disabled or busy appearance".

  - id: HZ-M3P4-04
    severity: low
    evidence:
      - >-
        test/e2e/mobile-import.spec.ts:14 says the journey runs "under the
        chromium-phone project", and the guard comment at
        test/e2e/mobile-import.spec.ts:115 rests on "this project's isMobile
        emulation". The spec also runs under the desk project: the chromium
        project at playwright.config.ts:76 ignores only prod-smoke and
        optimistic-naming, and the green log shows "[chromium] ›
        test/e2e/mobile-import.spec.ts:95:5" as test 38 beside
        "[chromium-phone]" as test 85.
      - >-
        Under the desk project the guard at test/e2e/mobile-import.spec.ts:117
        cannot fail: setViewportSize makes window.innerWidth 390 whether or not
        a meta viewport exists, so in one of the two runs the witness named
        in work history verification-first[1] witnesses nothing. Commit
        787055b does say it runs under both projects; the spec's own header
        does not.
    concrete-fix: >-
      Say in the header at test/e2e/mobile-import.spec.ts:14 that the spec
      runs under both the desk and the phone projects, and make the guard
      conditional on the project (test.info().project.use.isMobile) with a
      comment that it is only meaningful there, or restrict the spec to the
      phone project if the desk run adds nothing the 1280 half of
      measureScreen does not already cover.

