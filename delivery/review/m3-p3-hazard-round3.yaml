  - id: HZ3-M3P3-04
    severity: low
    evidence:
      - "A masked card number is not a unique card identity, and the corrected comment claims it is. src/modules/import/domain/kbc-mastercard-template.ts:141 states that two genuinely different numbers still differ, because only the separators and the glyph character are normalised away, never a digit and never a position."
      - "That is true of the NORMALISER and false of the IDENTITY it produces. The identity is the masked form, and two different cards that share the visible digits and the mask positions print the same masked form. DEMONSTRATED: two card numbers presented as different cards with the same visible head and tail collapse to one identity, while cards differing in the head, the tail or a mask position correctly stay distinct."
      - "The consequence of a collision is precisely the defect round 1 raised and round 2 fixed: two cards share one profile, one account and one dedup scope, and a row on one card matching a day, an amount and a merchant on the other is absorbed as already known. It is silent."
      - "Reachability is low and I say so: it needs two cards of one household sharing an issuer prefix AND the same trailing digits, which is roughly a one-in-ten-thousand coincidence for two cards on the same product. The normalisation itself adds almost nothing to it, since folding the mask glyph only merges cards that print different glyph characters, and one product prints one glyph."
    concrete-edit: >-
      Correct the sentence at
