      that screen knows the account it binds to may already hold another
      card's rows.
    analysis: >-
      Low in consequence and worth naming precisely, under R-087, because the
      sentence is the justification a future reader will use to decide the
      identity question is settled. On the separate question the orchestrator
      asked me to judge rather than re-file, leaving the confirm-step binding
