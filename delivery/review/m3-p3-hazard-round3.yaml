findings:
  - id: HZ3-M3P3-01
    severity: medium
    evidence:
      - "The new fallback is WORSE than the one it replaced when a card statement's settlement credit is worded so the one code-owned pattern does not match it, and the comment above the fallback asserts the opposite. src/modules/ledger/domain/ledger-transaction.ts:116 states the derivation is never worse than the sum it replaced, the two being equal unless the statement carries a positive row that is not the settlement credit, in which case the old one is certainly wrong."
      - "A settlement credit the pattern does not recognise IS a positive row the code treats as not the settlement credit, so the escape clause fires on the very case that breaks the claim. DEMONSTRATED, pure domain, invented values, eight scenarios run through the real summariser and the real interpreter. Scenario 7, a credit that exactly cancels the opening balance but whose wording misses the pattern: printed figure versus OLD fallback CORRECT, versus NEW fallback WRONG, new-vs-old NEW WORSE, and the account-side debit falls from INTERNAL to SPEND so the month double counts and the books open."
      - "The pattern is a single Dutch regex, src/modules/ledger/domain/constants.ts:26, observed on one real statement. The fallback is BY CONSTRUCTION the path for sources the stored-figure path does not cover, so the population it serves is exactly the population whose wording has not been observed. Every card fixture in the tree, the delimited one this round added included, uses the observed wording, so nothing measures the case."
      - "The loudness claim holds where the round makes it, and I checked rather than assuming. Underpayment, overpayment and a settlement credit that arrives after the statement's cut-off all leave the debit at SPEND with zero settlement links and the books open: LOUD in all three. The round's comment names only underpayment, so the enumeration is incomplete, but no silent case was found among them."
      - "Two settlement credits in one document, and a first statement with no opening balance and no credit at all, both derive CORRECTLY. The derivation is right wherever the credits cancel the opening, which is what the round argues and which I confirm."
    concrete-edit: >-
