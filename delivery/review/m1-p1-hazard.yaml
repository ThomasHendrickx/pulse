# EXECUTED AT THIS HEAD in this clone (exit codes): npm run typecheck 0,
# npm run lint 0, npm test 0 (Test Files 2 passed, Tests 25 passed, 0
# skipped), criterion 0.5 grep over src/ exit 1 (no matches), em-dash count
