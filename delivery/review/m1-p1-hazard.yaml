#   whole script line); host tricks (127.0.0.1.evil.com, empty hostname,
#   case, bracketed ::1) handled; .env divergences from Prisma's dotenv
#   (export-prefixed lines, inline comments, prisma/.env) all land on the
#   refusing side; the override variable is absent from this fleet's
#   ambient env (checked). Executed here: npm test exit 0 including
#   test/db/db-guard.test.ts (assessment tests plus two process-level CLI
#   spawns, foreign host exit 1, local exit 0). RESIDUAL, acceptable and
#   stated where required: a direct npx prisma migrate reset bypasses the
