findings:
  - id: CR-006
    severity: low
    evidence:
      - "src/app/(auth)/auth-status.tsx:18 implements the status whitelist as value in STATUS_KEYS over a plain object literal; the in operator walks the prototype chain, so inherited keys pass the guard. Executed probe: node -e with the same four-key object printed constructor true function, toString true function, hasOwnProperty true function, valueOf true function."
      - "For an admitted prototype key, src/app/(auth)/auth-status.tsx:31 passes STATUS_KEYS[status] (a Function object, not a message key) to t(), so a crafted link such as /sign-in?status=constructor drives the translator with a non-string key during render; the comment at src/app/(auth)/auth-status.tsx:3 claims the parameter is whitelisted, which the prototype chain makes narrowly false."
    concrete-fix: >-
      Replace the membership test with an own-property check:
      Object.hasOwn(STATUS_KEYS, value) (or build STATUS_KEYS with
      Object.create(null), or test against an explicit array of the four
      literals). One line, and the existing type predicate keeps compiling.
    analysis: >-
      Shipped behaviour at risk: a crafted status query parameter on the
      public auth screens escapes the whitelist and reaches the translator
      with a function value, at worst rendering an error page instead of
      sign-in for whoever follows the link. No injection surface (React
      escapes text and the value never reaches HTML raw) and no open
      redirect (the parameter never feeds a redirect target), so low; but
      the mechanism is exactly the whitelist the fix round introduced, so it
      should close all the way.

  - id: CR-007
    severity: low
    evidence:
      - "Executed construction against the hardened analyzer, extracted verbatim from test/schema/tenancy.test.ts lines 103-111 and 113-263 (sha256 8f10775fe6c6f020bcd59de02ae996aac2f0d2d8f338f80f3a46443a80ff9d41): a dynamic import of the db client (await import inside an adapters file not named repository) yields [], an import-equals form (import db = require) yields [], and an exported namespace wrapping context-free functions in a held file yields []; for contrast an exported async generator missing the context is correctly flagged."
      - "test/schema/tenancy.test.ts:20-23 and src/platform/tenancy.ts:13-15 state that export shapes the analyzer cannot positively verify are violations; an exported namespace is such a shape and passes silently (ts.isModuleDeclaration has no arm in the statement chain ending at test/schema/tenancy.test.ts:262), and a file reaching the client only through dynamic import or import-equals is never held to the rule at all (test/schema/tenancy.test.ts:124-129 inspects only ImportDeclaration statements), so the corrected comment still claims slightly more than the gate enforces (R-087)."
    concrete-fix: >-
      Invert the statement chain's default: after the explicit arms, flag any
      remaining exported statement kind (module and namespace declarations
      and exported import-equals included) as unverifiable, and detect
      held-to-rule membership with a source-text scan for the client module
      specifiers in addition to ImportDeclaration walking, so dynamic import
      and import-equals hold the file to the rule. Add the three shapes as
      red fixtures, and add the residue that remains (call sites, injected
      clients) to the tenancy.ts comment's not-enforced list, which already
      names injection.
    analysis: >-
      The idiomatic escapes round 0 demonstrated are all closed and each now
      has its own red fixture; what remains are unidiomatic shapes a
      deliberate evader would reach for, and a static gate cannot beat a
      determined adversary anyway (the comment honestly routes that to
      review). Low, filed so the gate's own description and its behaviour
      converge and the next phase inherits an accurate contract.

