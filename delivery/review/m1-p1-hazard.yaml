#   is the new LOW finding CR-006 below.
# - CR-005 (orphan seed row, low): RESOLVED at 3ba1778. Without the service
#   role key the seed writes the household only, returns before the user
#   upsert, and the warning says plainly that no dev login was created.
#   Honest output verified by reading prisma/seed.ts:26-31 and 70-74.
