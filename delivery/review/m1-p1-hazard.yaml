# FIX ROUND 1 RESOLUTION LEDGER (per finding; the findings[] array below
# carries only findings that APPLY to head 8e5be19, because the verdict
# schema has no resolved-marker field and an APPROVE cannot sit beside a
# high finding):
# - CR-001 (auth redirect live-lock, high): RESOLVED at 9bafc77. Both arms
#   verified by reading: the entry arm (src/platform/auth/actions.ts:36-46)
#   wraps the household create in try/catch covering BOTH the unique-email
#   collision and any transient failure, signs the half-session out in the
#   catch, and handles the no-session email-confirmation branch separately;
#   the recovery arm (src/platform/auth/context.ts:29-30) destroys the
#   session BEFORE redirecting, so the middleware's bounce partner is gone
#   on the next request. Redirect call-site walk re-done at this head: every
#   redirect target is reachable in the redirecting state. One mechanism
