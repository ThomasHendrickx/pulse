# - CR-003 (fail-open tenancy analyzer, medium): RESOLVED at 9928710 for
#   every shape round 0 demonstrated: re-ran the verbatim-extracted NEW
#   analyzer (sha256 8f10775fe6c6f020) against the round 0 bypass shapes;
#   object literal, cache() wrapper, class and re-export are now violations,
#   export lists resolve to their local declarations, db-client import
#   outside adapters/ is itself a violation, exact type-text match required.
#   A residue of three unidiomatic shapes remains and the corrected comment
#   still slightly overclaims; that is the new LOW finding CR-007 below,
#   not a reopening of CR-003.
# - CR-004 (silent auth failure, low): RESOLVED at 9bafc77. Distinct
#   whitelisted status values render localized lines in EN NL FR; the
#   confirm-email branch exists; the new CSS is tokens only (--color-flag-bg
