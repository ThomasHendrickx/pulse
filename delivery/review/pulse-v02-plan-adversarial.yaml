      - >-
        delivery/plan/pulse-v02.yaml:634-637: the probe list "is read from
        the container uploads at review time", an artifact outside the
        repository that a future phase's clean-room container is not
        guaranteed to carry.
    concrete-edit: >-
      Two-part edit to criteria 2.6 and 3.5: (a) scope a full-strength
      probe (identifiers, names, merchants, AND thousands-form amounts and
      dates from the real statements) to the files the phase itself adds or
      modifies, "git diff --name-only against the phase base", so D-3's
      whole promise becomes testable without false-alarming on the
      pre-existing M1 collisions, keeping the identifier-only grep for the
      whole tree; (b) add to each criterion the honesty clause: "if the
      real PDFs are absent from the executing container, the gate is
      recorded as not-witnessed in the work history and the review
      escalates for a container that has them, never marked green by
      vacuity."
    analysis: >-
      Two quiet gaps in an otherwise strong privacy posture. First, the
      decision promises five categories and the gates test three, and the
      untested two are exactly the ones a fixture author copies by
      accident; scoping to phase-touched files removes the false-positive
      reason the plan dropped them. Second, both gates presume the real
      PDFs are readable at review time; in a container without the uploads
      the grep of an empty probe list exits 1 and the criterion goes green
      having probed nothing, the vacuous-gate shape PR-008 flagged in v1.
