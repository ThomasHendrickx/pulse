findings:
  - id: PR2-001
    severity: high
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:615-623 (criterion 2.4): the
        spec-compatibility test only "feeds parseSourceProfileSpec a JSON
        object in the exact e4ea3ba delimited shape ... and asserts it
        parses to the delimited variant".
      - >-
        delivery/plan/pulse-v02.yaml:669-674 (hazard H2.4): "the spec
        widening silently invalidating stored delimited profiles, turning
        every existing source unrecognised on the next upload", addressed-by
        criterion 2.4.
      - >-
        src/modules/import/application/upload-statement.ts:101-107:
        recognition is findProfileBySpec, which compares the STORED parsed
        spec against the freshly DETECTED spec with specEquals.
      - >-
        src/modules/import/domain/source-profile.ts:217: specEquals is
        canonical-JSON string equality, so one side carrying kind
        "delimited" and the other side not carrying the property compare
        unequal.
      - >-
        prisma/schema/import.prisma:30-39: stored specs are Json in the
        e4ea3ba shape (no kind discriminant) and are parsed at the
        repository boundary; the production database is live with M1 usage,
        so kindless stored specs exist.
    concrete-edit: >-
      Extend criterion 2.4 with a recognition assertion, not only a parse
      assertion: "and the same test round-trips recognition: a spec JSON in
      the exact e4ea3ba stored shape, run through parseSourceProfileSpec,
      compares specEquals-true against the spec the delimited parser's
      detect emits for a matching CSV file, so a profile stored before the
      widening is recognised by findProfileBySpec on the next upload without
      re-asking the declaration."
    analysis: >-
      The construction that passes 2.4 as written and still realises H2.4
      exactly: define the delimited variant with an optional discriminant,
      have parseSourceProfileSpec preserve the stored kindless shape (the
      parse test passes, the result is the delimited variant), and have
      detect emit kind "delimited". specEquals then canonicalises different
      key sets, every profile stored before the migration goes unrecognised,
      the ask-once declaration refires for every existing source and
      duplicate profiles accumulate. Every existing delimited test stays
      green because tests create profiles through the new detect path, where
      both sides carry the same shape; only pre-migration database rows take
      the broken path, which is exactly the population the hazard names and
      the test suite cannot see unless a test feeds the old stored shape
      into one side of specEquals, which is the demanded edit.
  - id: PR2-002
    severity: medium
    evidence:
      - >-
        Executed in-container against the real Belfius statement (structure
        only): page index 2 carries the bare token BIJLAGE at line 35,
        between the transaction starts at lines 34 and 36, i.e. inside a
        transaction description block on a transaction page, and that line
        does not carry the full BIJLAGE BIJ VERRICHTING phrase; the annex
        page's full-phrase marker sits at line index 7, after the repeated
        7-line header block. Probe scripts in the reviewer scratchpad;
        counts reproduced in this file's work-log.
      - >-
        delivery/plan/pulse-v02.yaml:536-546 (Belfius template step): "skip
        annex pages whose body starts with the BIJLAGE marker"; the
        fixture step at :554-563 requires "an annex page" but no annex
        reference inside a transaction description.
      - >-
        delivery/plan/pulse-v02.yaml:590-598 (criterion 2.1): asserts only
        "the annex page contributes zero rows"; a parser that skips any
        page CONTAINING the marker passes it against the synthetic fixture.
      - >-
        delivery/intake/pulse-v0.2-pdf-addendum.md:52-54: the addendum
        states the body-starts-with semantics but does not record that the
        marker word also occurs inside a real transaction description.
    concrete-edit: >-
      Extend the M3-P2 fixture step and criterion 2.1: the synthetic
      Belfius fixture's transaction pages include one transaction whose
      description block contains the annex marker text (the BIJLAGE
      phrase) as a description line, and criterion 2.1 additionally asserts
      that transaction parses as a row with the phrase verbatim in its
      rawLine while the annex page still contributes zero rows, so
      marker-anywhere page skipping is distinguishable from
      body-starts-with skipping.
    analysis: >-
      The construction: implement annex skipping as "skip any page whose
      text contains the marker phrase", a natural sloppy reading of the
      addendum. Every criterion passes, because the synthetic fixture's
      only marker sits on the annex page. On the owner's real statement the
      transaction page carrying the in-description reference is skipped,
      its rows vanish, and the balance gate FAILS the import. The failure
      is loud, not silent, so no facts corrupt; but the phase merges green
      and the first real statement, the exact file this plan was verified
      against and the owner's essential path, is rejected. The fixture
      exists to encode the real file's traps; this one was observed and not
      encoded.
  - id: PR2-003
    severity: medium
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:607-614 (criterion 2.3): idempotency
        is witnessed only by "uploading the same Belfius fixture twice".
      - >-
        delivery/plan/pulse-v02.yaml:1101-1112 (decision D-4): "the year as
        the statement-scope component ... The year-scoped key is strictly
        safer against re-exported or overlapping statements", with the
        wiring delegated to M3-P2's verification-first step (:493-:507).
      - >-
        src/modules/import/domain/dedup.ts:95: the natural key is
        nat:accountId:statementNumber:sequenceNumber, so a template that
        emits the PDF's own statement number instead of the year satisfies
        every stated test while producing statement-scoped keys.
      - >-
        delivery/intake/pulse-v0.2-pdf-addendum.md:68-69: the addendum
        mandates account plus year plus sequence.
    concrete-edit: >-
      Extend criterion 2.3 with a cross-file witness of the year-scoped
      key: "the fixture generator also emits a second Belfius-style
      statement file with a different statement identity whose rows
      re-carry some of the first fixture's year-and-sequence pairs (a
      re-exported overlap); importing it after the first reports those rows
      as known and adds only the genuinely new rows", so a template
      emitting statement-scoped key components fails the test.
    analysis: >-
      The construction: the Belfius template emits the statement's own
      number as the statementNumber key component. Uploading the same file
      twice still deduplicates perfectly, criterion 2.3 passes, every other
      criterion passes. The first re-exported or overlapping real statement
      then stores every shared row twice under a second statement number,
      and the books still close per file, so nothing downstream alarms.
      That is precisely the failure D-4 says the year-scoped key exists to
      prevent, and the plan currently proves the decision only in prose.
      The verification-first step records the wiring but no criterion can
      fail on it.
  - id: PR2-004
    severity: medium
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:726-738 (KBC template step): "booking
        date is the transaction date, settlement date kept in the raw
        description block".
      - >-
        delivery/plan/pulse-v02.yaml:770-779 (criterion 3.1): asserts row
        count, FX folding, the DOMICILIERING sign, the space-thousands
        parse and the balance gate; no criterion in M3-P3 asserts which of
        the two dates becomes bookingDate.
      - >-
        delivery/intake/pulse-v0.2-pdf-addendum.md:76-78: "Booking date is
        the transaction date (spend lands in the month it happened)".
      - >-
        Executed in-container: all 22 real KBC rows carry two DD-MM-YYYY
        dates per line, so both choices parse cleanly and the balance
        identity holds under either.
    concrete-edit: >-
      Extend the KBC fixture spec and criterion 3.1: the synthetic KBC
      fixture includes at least one row whose transaction date and
      settlement date fall in different months, and criterion 3.1
      additionally asserts that row's stored bookingDate equals the
      transaction date (equivalently, the month view books it in the
      transaction month, not the settlement month).
    analysis: >-
      The construction: parse the settlement date as bookingDate. Row
      count, amounts, duplicate pair, balance identity and the settlement
      pairing all still pass, because none of them reads the date choice,
      and a fixture whose two dates always share a month cannot tell the
      difference. On real statements, purchases near month end then land in
      the wrong month, the exact defect the addendum's parenthesis exists
      to rule out, and it ships witnessed by nothing.
  - id: PR2-005
    severity: medium
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:1001-1008 (M3-P5 step 2): "An
        unauthenticated share lands on sign-in and continues to the import
        flow after it."
      - >-
        delivery/plan/pulse-v02.yaml:1046-1051 (hazard H5.2): "the share
        route accepting files outside the authenticated household context,
        turning the share endpoint into an unauthenticated write path",
        addressed-by criterion 5.1.
      - >-
        delivery/plan/pulse-v02.yaml:1021-1028 (criterion 5.1): tests only
        the authenticated happy path (POST, redirect chain, rows added); no
        criterion exercises an unauthenticated share.
    concrete-edit: >-
      Rewrite step 2's last sentence to decide the mechanism explicitly and
      make it witnessable: either "an unauthenticated share redirects to
      sign-in and the file is NOT preserved; after signing in the user
      shares again (the share sheet is one tap away)", or name a bounded
      server-side handoff with an explicit lifetime and binding if the
      owner wants continuity. Then add criterion 5.4: "a test POSTs the
      fixture PDF to the share route with no session and asserts no Import
      row is created and no uploaded bytes are persisted (or, if the
      handoff variant is chosen, only the specified short-lived handoff
      record exists and is unreadable by any other session), with the
      redirect landing on sign-in", and re-point H5.2's addressed-by at it.
    analysis: >-
      As written the step promises continuity through sign-in, and the
      natural implementation of that promise stores the uploaded bytes
      before any household context exists, which is H5.2's exact failure
      built to spec. Criterion 5.1 cannot see it because it only walks the
      authenticated path, so the hazard's addressed-by is decorative for
      the unauthenticated half. The phase is DR-0021-gated with an unfilled
      fill-in, so the edit costs nothing now and prevents the contradiction
      from reaching an implementer's lap where it will be resolved silently
      in whichever direction is easiest.
  - id: PR2-006
    severity: low
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:421-426 (hazard H1.1): "navigation
        bolted onto individual pages instead of the shell, so a route added
        later ships without it", addressed-by criterion 1.1.
      - >-
        delivery/plan/pulse-v02.yaml:395-402 (criterion 1.1): asserts the
        nav links are present on /, /import and /merchants; per-page nav on
        exactly those three routes passes it identically.
    concrete-edit: >-
      Extend criterion 1.1 (or add 1.5): "and the nav element is rendered
      by the authenticated shell: the nav's data-testid occurs in exactly
      one component file under src/, src/app/(app)/layout.tsx, asserted by
      a grep counting matches, so a page cannot carry its own copy."
    analysis: >-
      The construction: paste the nav into each of the three page
      components and never touch the shell. Criterion 1.1 passes on all
      three routes, the diff even touches layout.tsx trivially to look
      conforming, and the next route added ships without navigation, which
      is the owner's original complaint recurring. Cheap grep-shaped pin,
      same falsifiability style the plan already uses in 1.3 and 4.2.
