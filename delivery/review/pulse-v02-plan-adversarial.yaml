  - id: PR4-001
    severity: high
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml, criterion 6.1 as revised: "A separate
        row in the same fixture carries a legitimate long structured
        reference that is NOT a card number, and the test asserts that
        reference survives in its key".
      - >-
        delivery/plan/pulse-v02.yaml, criterion 6.3 as revised: "a
        card-number run is 13 to 19 consecutive digits after spaces, dots
        and dashes are REMOVED ... tests asserting no normalised key
        produced from the card fixture contains a card-number run under
        that test", and the e2e half asserts the same over rendered group
        labels.
      - >-
        Executed the revised 6.3 predicate myself against both real shapes,
        taken from the emulated shipped template: the printed card number
        (length 19, shape "9999 9999 9999 9999") returns TRUE, which is the
        fix working; the real non-card structured reference (length 15, all
        digits) ALSO returns TRUE.
      - >-
        Measured digit-run length histogram over the 39 descriptors with
        separators removed: 13 digits on 1 run, 14 on 15 (IBAN digits), 15
        on 9, 16 on 17 (card numbers). Every real structured reference sits
        inside 6.3's 13-to-19 window, so no faithful fixture reference can
        avoid it.
      - >-
        Both criteria are scoped to the same artifact: 6.1 puts the
        reference row "in the same fixture" and 6.3 sweeps "no normalised
        key produced from the card fixture".
    concrete-edit: >-
      Make 6.3's sweep exact rather than shape-general, and name the one
      permitted exception. Replace 6.3's two assertions with: "no normalised
      key produced from the card fixture, and no rendered group label,
      contains the fixture's invented card number under the
      separator-insensitive test above; and no key or label contains ANY
      13-to-19-digit run except the key of the row 6.1 declares as carrying
      a legitimate structured reference, which the test names explicitly, so
      the sweep stays broad without contradicting 6.1." Add to 6.1: "the
      structured reference is 13 to 19 digits long, the length the real
      statement carries, so it exercises 6.3's exception rather than
      dodging it."
    analysis: >-
      The fix round closed PR3-001 and PR3-003 with two guards that cannot
      both hold. An implementer meeting 6.1 and 6.3 together has exactly one
      escape: make the fixture's structured reference twelve digits or
      fewer. Every criterion then passes, and the guard PR3-003 bought is
      disarmed in the same motion, because a 12-digit reference is not the
      shape the real statement carries and a length-anchored strip aimed at
      13-plus runs sails past it. That is an implementation satisfying every
      acceptance criterion as written while the defect it was written for
      ships. The alternative escape, dropping the reference row, fails 6.1
      outright, so the plan does not merely permit the weak resolution; it
      pushes toward it. The fix is small because the intent of each
      criterion is right: 6.3 wants the card number gone, not every long
      digit run, and saying so exactly removes the collision.
