      separators, which is the form the real statement prints.
    analysis: >-
      The construction that passes 6.3 as written and ships the reported
      exposure intact: leave the grouped card number in the label and test
      for a contiguous 16-digit run. The regex matches nothing, both the
      unit clause on keys and the e2e clause on labels go green on day one
