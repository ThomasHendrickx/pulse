  - id: PR2-008
    severity: low
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:1091-1100 (decision D-3): "No
        identifier, name, amount, date or merchant string from the real
        statements appears in any fixture."
      - >-
        delivery/plan/pulse-v02.yaml:632-638 and :800-805 (criteria 2.6 and
