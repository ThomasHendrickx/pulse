  - id: PR3-005
    severity: medium
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml, criterion 6.6: "if the count was
        nonzero, npm test exits 0 with a migration test asserting every
        stored EXACT and PREFIX pattern re-normalises to a value that still
        matches the transactions it matched before". Nothing pins how the
        test obtains its stored patterns.
      - >-
        src/modules/merchants/domain/normalise-counterparty.ts:29 (the
        CR-402 contract): "the pipeline is idempotent over its own output,
        so re-normalising stored patterns is safe". Idempotency is
        new(new(x)) equals new(x); what the migration needs is that
        new(old(x)) still equals new(raw), a different property that
        idempotency does not imply.
      - >-
        The contract's own worked example (normalise-counterparty.ts:23 to
        :26) is a stored pattern ceasing to match when a token joins the
        city list, which is precisely a new-versus-old composition
        failure.
      - >-
        Hazard H6.3 ("The recipe change silently detaching stored
        MerchantRule patterns ... so the owner's namings quietly stop
        applying while totals stay right") is addressed-by criterion 6.6.
    concrete-edit: >-
      Extend criterion 6.6's migration clause: "the migration test's input
      patterns are produced by the PRE-change recipe, either by pinning the
      pre-change outputs as literals captured before the recipe is edited
      or by running the previous implementation, never by calling the new
      normaliser; for each such pattern the test asserts that its
      re-normalised value equals the NEW normalisation of the raw
      descriptor it was created from, so a strip that only fires in the
      presence of a prefix the old recipe already removed is caught."
    analysis: >-
      The construction that passes 6.6 and detaches every stored rule: write
      the migration test after the recipe change, seed its stored patterns
      by calling the new normaliser over fixture descriptors, and assert
      they re-normalise to matching values. Idempotency makes that assertion
      true by construction for any recipe whatsoever, so the test is green
      and the old-to-new transition, the only transition the migration
      exists for, is never exercised. The failure it hides is concrete: any
      new strip pattern anchored to a token the old recipe already removed
      leaves the stored pattern un-stripped while fresh transactions get
      stripped, and the owner's namings silently stop applying, which is
      H6.3 word for word.
