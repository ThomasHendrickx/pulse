      check that cannot see its own hazard. The fixture step makes this the
      LIKELY implementation rather than a perverse one, because it directs
      the author to reproduce the real grammar, and the real grammar is
      grouped. The unit clause's "(whitespace-insensitive)" parenthetical
      shows the author saw the risk on one half and not the other.
