  - id: PR5-003
    severity: low
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml, M3-P6 step 3 as revised: the
        partially-masked pattern is "anchored to the CARD-TAIL GRAMMAR, the
        tail's position after the card-number label and the holder text that
