      - >-
        Measured over the emulated shipped template: the card-number label
        token occurs in 15 of 15 card descriptors and in 0 of the 11
        X-token descriptors, so that half of the conjunction separates them
        cleanly.
      - >-
        The other half does not: holder-like text follows the token in 8 of
        the 11 X descriptors as well as in 15 of 15 card descriptors, so an
        implementation of the holder half without the label half fires on 8
        real non-card rows.
      - >-
        No criterion witnesses the anchor. The fixture spec asks only for "a
        non-card row that must be unaffected", with no shape stated, so a
        non-card row without an X token satisfies it.
    concrete-edit: >-
      Extend the fixture step and criterion 6.1: "the non-card row that must
      be unaffected carries an X-masked token followed by holder-like text
      and NO card-number label, the shape 8 of the 11 real non-card X rows
      have, and criterion 6.1 asserts its key is unchanged by the strip", so
      a partially-masked pattern anchored on the holder text alone fails.
    analysis: >-
      The prose is right and the plan reached it by measurement, so this is
      a witness gap rather than a design error. The construction it admits:
      implement the masked-tail strip as "an X run followed by a name",
      which reads like the card-tail grammar and passes every criterion,
      then watch 8 non-card descriptors lose a distinguishing token on the
      owner's real statement. Since the phase already commits to a non-card
      control row, giving that row the measured shape costs nothing and
      turns step 3's most easily mis-implemented sentence into something a
      test can fail on.
