findings:
  - id: PR2-001
    severity: high
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:615-623 (criterion 2.4): the
        spec-compatibility test only "feeds parseSourceProfileSpec a JSON
        object in the exact e4ea3ba delimited shape ... and asserts it
        parses to the delimited variant".
      - >-
        delivery/plan/pulse-v02.yaml:669-674 (hazard H2.4): "the spec
        widening silently invalidating stored delimited profiles, turning
        every existing source unrecognised on the next upload", addressed-by
        criterion 2.4.
      - >-
        src/modules/import/application/upload-statement.ts:101-107:
        recognition is findProfileBySpec, which compares the STORED parsed
        spec against the freshly DETECTED spec with specEquals.
      - >-
        src/modules/import/domain/source-profile.ts:217: specEquals is
        canonical-JSON string equality, so one side carrying kind
        "delimited" and the other side not carrying the property compare
        unequal.
      - >-
        prisma/schema/import.prisma:30-39: stored specs are Json in the
        e4ea3ba shape (no kind discriminant) and are parsed at the
        repository boundary; the production database is live with M1 usage,
        so kindless stored specs exist.
    concrete-edit: >-
      Extend criterion 2.4 with a recognition assertion, not only a parse
      assertion: "and the same test round-trips recognition: a spec JSON in
      the exact e4ea3ba stored shape, run through parseSourceProfileSpec,
      compares specEquals-true against the spec the delimited parser's
      detect emits for a matching CSV file, so a profile stored before the
      widening is recognised by findProfileBySpec on the next upload without
      re-asking the declaration."
    analysis: >-
      The construction that passes 2.4 as written and still realises H2.4
      exactly: define the delimited variant with an optional discriminant,
      have parseSourceProfileSpec preserve the stored kindless shape (the
      parse test passes, the result is the delimited variant), and have
      detect emit kind "delimited". specEquals then canonicalises different
      key sets, every profile stored before the migration goes unrecognised,
      the ask-once declaration refires for every existing source and
      duplicate profiles accumulate. Every existing delimited test stays
      green because tests create profiles through the new detect path, where
      both sides carry the same shape; only pre-migration database rows take
      the broken path, which is exactly the population the hazard names and
      the test suite cannot see unless a test feeds the old stored shape
      into one side of specEquals, which is the demanded edit.
