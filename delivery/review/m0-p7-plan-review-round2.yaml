      - >-
        No criterion in the phase measures this, and the proposed ending five
        under R2-04 asserts the state after the LAST ending, so it does not
        measure it either.
    analysis: >-
      A consequence of the mandated design rather than a defect in it. The
      document-wide clear is the right choice, it is what makes the listener
      one handler rather than a pointer-id table, and its price is that a
      second finger's release also clears the first finger's still-held press.
      The failure it produces is a press that DISAPPEARS, not one that sticks,
      it self-corrects at the next press, and multitouch across two controls
      is rare on this product. It is worth one recorded sentence and not worth
      a criterion: what is expensive is not the behaviour, it is a later fix
      round rediscovering it and rebuilding the listener around pointer ids to
      chase it.
    concrete-edit: >-
      Add to the step at :4656, after "clear every data-pressed in the
      document": "WHAT THAT COSTS, recorded here so a later round does not
      rediscover it and rebuild the listener around pointer ids to chase it: a
      clear that sweeps the document also clears a press another finger is
      still holding, so with two touches on two controls the first release
      un-draws both. The failure is a press that disappears rather than one
      that sticks, it corrects itself at the next press, and it is the price
      of one handler with no pointer-id table. The sticking failure is the one
      that matters and criterion 9.9(e) measures it."

