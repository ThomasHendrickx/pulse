findings:
  - id: R2-01
    severity: high
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:5019 (criterion 9.7(c), rewritten in this
        revision to close round one's ADV-M3P9A-02): 'grep -rn ^"use client"
        over src/, THE PATTERN ANCHORED at the start of the line, returns
        exactly ONE line, src/platform/ui/nav-link.tsx:1'.
      - >-
        Captured in /home/user/wt-m0p7-adv, the command exactly as the
        criterion writes it: `grep -rn ^"use client" src/` produces NO OUTPUT
        and exits 1.
      - >-
        Why: `printf '%s\n' ^"use client"` prints `^use client`. The shell
        removes the double quotes before grep is invoked, so the pattern is
        ^use client, and the line it must match is `"use client";`, whose
        first character is a double quote.
      - >-
        The correctly quoted form works: `grep -rn '^"use client"' src/`
        returns `src/platform/ui/nav-link.tsx:1:"use client";` and exits 0.
      - >-
        Round one's proposed edit placed the anchor INSIDE the quoting,
        `grep -rn '^\"use client\"'`; the revision moved it outside.
      - >-
        Every other grep in this phase's criteria is written as a runnable
        command with working quoting, including the one two clauses later at
        :5096, `grep -nE "data-pressed|dataset\.pressed|toggleAttribute"`, so
        an implementer will paste this one and run it.
    analysis: >-
      Round one's finding was that 9.7(c) could not pass because the grep it
      named returned two lines where it demanded one. The repair took the
      right idea, anchoring on the directive, and shipped it with the anchor
      outside the quotes, so the criterion still cannot pass and now returns
      ZERO where it demands one. The prose in the same clause states the
      intent correctly, twice, which is what makes this a transcription defect
      rather than a reasoning defect and is why it is cheap. It is high all
      the same, because a criterion nobody can satisfy is the same round trip
      whether it fails high or low, and because the failure mode is worse than
      the one it replaced: two lines invited an implementer to look at the
      tree and think, zero lines invites them to conclude the anchor is wrong
      and remove it, which puts the original defect straight back.
    concrete-edit: >-
      In criterion 9.7(c) at :5019 replace `grep -rn ^"use client"` with
      `grep -rn '^"use client"'`, single quotes around the whole pattern so
      the shell does not strip the double quotes the pattern needs, and add
      the captured result beside it so the next reader can check the command
      rather than the sentence: "which returns
      src/platform/ui/nav-link.tsx:1:\"use client\"; and exits 0, where the
      unquoted form `grep -rn ^\"use client\"` returns nothing at all because
      the shell removes the quotes and leaves the pattern ^use client."
  - id: R2-02
    severity: high
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:4904-4914 (criterion 9.3(a), the clause
        added in this revision to close round one's ADV-M3P9A-05): "a click
        dispatched at the control's centre fires no click event on the
        control, and the SAME click at the SAME coordinates does fire one once
        the aria-disabled marking is removed ... The activation itself is
        stopped by the capture-phase click refusal criterion 9.9(a) permits
        the spec to install".
      - >-
        The refusal, in the prior round's own spec,
        /home/user/wt-m3p9/test/e2e/pressed-and-disabled.spec.ts:815-822:
        `document.addEventListener("click", (event) => { event.preventDefault();
        event.stopPropagation(); }, true);` Capture phase, on document, with
        stopPropagation.
      - >-
        DOM standard, the stop-propagation flag: once set, the event is
        dispatched to no further object in the propagation path. document sits
        at the head of the capture path, so the control's own listeners never
        run, in the disabled condition and in the control condition alike.
      - >-
        delivery/plan/pulse-v02.yaml:5096-5100 (criterion 9.9(a)) names this
        refusal as the spec's ONE permitted injected mutation, "which half (e)
        and criterion 9.3(a) both need", so the two clauses are bound to each
        other by the same revision that wrote them.
      - >-
        Separately, `pointer-events: none` removes the control from hit
        testing, so Playwright's locator.click() fails its actionability check
        rather than producing a clean assertion; only a raw coordinate click,
        page.mouse.click(x, y), reaches the point at all.
    analysis: >-
      The obvious implementation of this clause is a listener on the control
      element. Under the refusal the criterion itself names, that listener
      fires in NEITHER condition: the first half then passes vacuously, "no
      click event on the control" being trivially true, and the second half,
      the control experiment that is the entire point, fails. So the criterion
      is red for a reason that has nothing to do with the stylesheet. Worse is
      the repair an implementer reaches for under that red. Moving the
      observation to the refusal listener and asserting only that a click was
      CAPTURED is vacuous in the other direction: with pointer-events none the
      click still fires, on the ancestor behind the control, and is still
      captured at document, so "a click was captured" is true in both
      conditions and the experiment proves nothing. Exactly one observable
      works, and the criterion does not name it: the TARGET of the click as
      seen by the document capture listener, which is the ancestor when the
      marking is present and the control when it is removed. That is a real
      discriminator, it survives stopPropagation because the document listener
      is first in the path, and it isolates the marking rather than the
      coordinates. The fix is to say so. On the coordinator's question, does
      the control experiment isolate the marking rather than the coordinates:
      yes in principle and only once the observable is named, and it needs one
      more guard, that the control's bounding rect is identical across the two
      attempts, because the second click is only the SAME click if nothing
      moved between them.
    concrete-edit: >-
      In criterion 9.3(a) replace "a click dispatched at the control's centre
      fires no click event on the control, and the SAME click at the SAME
      coordinates does fire one once the aria-disabled marking is removed"
      with: "a REAL HIT-TESTED click at the control's viewport centre,
      page.mouse.click at raw coordinates and never element.dispatchEvent,
      which bypasses hit testing and would fire regardless of pointer-events,
      is OBSERVED AT THE CAPTURE-PHASE CLICK REFUSAL ITSELF and not at a
      listener on the control, because that refusal calls stopPropagation on
      document and no listener below it ever runs. The observable is the
      click's TARGET: with the marking present the target is an ANCESTOR of
      the control and the control neither is nor contains it, and with the
      marking removed and the control's bounding rect unchanged, the SAME
      click at the SAME coordinates targets the control. Asserting only that a
      click was captured proves nothing, because a click at those coordinates
      is captured in both conditions; it is the target that moves, and it
      moves because of the marking rather than because of the coordinates,
      which is what the unchanged rect pins."
  - id: R2-03
    severity: high
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:5100-5112 (criterion 9.9(a), the clause
        added in this revision to close round one's ADV-M3P9A-03): "the spec
        FAILS rather than skips when no project it can run under matched it,
        so a testMatch that stops matching reddens the suite instead of
        silently emptying it."
      - >-
        A spec file that no project's testMatch matches is never loaded by
        Playwright. No test in it is collected, none runs, and none can fail.
        The clause describes a behaviour the file cannot have.
      - >-
        The clause beside it is documentary, not mechanical: "The phase work
        history records the captured tail of npx playwright test
        --project=chromium-phone naming this spec, with that project's PASSED
        and SKIPPED counts side by side". A work-history record binds the
        round that writes it and no later round.
      - >-
        /home/user/wt-m3p9/test/e2e/pressed-and-disabled.spec.ts:803:
        `test.skip(({ hasTouch }) => hasTouch !== true, "touch paths need the
        phone project");` The skip is correct and necessary, because the same
        spec runs under the desktop project where the CDP touch path does not
        exist.
      - >-
        /home/user/wt-m3p9/playwright.config.ts:94: the phone project's
        membership is a filename regex,
        `/(month-view|navigation|pressed-and-disabled)\.spec\.ts/`.
      - >-
        M3-P10's criterion 10.7 (delivery/plan/pulse-v02.yaml, M3-P10) permits
        playwright.config.ts to be touched, "for the new project and the
        testMatch widenings", and does not pin src/app/layout.tsx to an empty
        diff. M3-P4's new conflicts-with entry (:2923) covers the root layout
        for that phase; nothing covers the config for M3-P10.
    analysis: >-
      This is round one's ADV-M3P9A-03 half closed. The documentary half is
      real and worth having: it makes THIS round prove the measurement ran.
      The durable half, the one that was supposed to survive into later
      phases, cannot be built as described, so what is actually shipped is a
      record in a work history plus a skip that is still invisible in an exit
      code. And this is the SAME GAP the plan-writer declared as the one
      remaining thing it could see, arriving from the other side. Taking the
      coordinator's question directly: it is acceptable to leave M3-P10
      unopened, and it is not acceptable to leave this clause as it stands,
      because the two are one thing. M3-P10's real protection is 10.7's
      requirement that every pre-existing spec pass under EVERY project, and
      that protection is strong where it bites: a client-island refactor that
      moved the listener into a useEffect would emit no script tag, and
      criterion 9.9(a)'s raw-response-body assertion would go red, which is
      exactly the property D-61's second reason depends on and is now guarded.
      What 10.7 cannot catch is a phone project that no longer contains this
      spec, because then 9.9 is not a spec that fails, it is a spec that is
      not there. Make the ran-guard an assertion the suite carries rather than
      a sentence a work history carries, and M3-P10 needs nothing added to it:
      10.7 plus a self-checking spec is a real interlock. Leave it, and both
      gaps stay open and the plan is trusting a record written one phase
      earlier.
    concrete-edit: >-
      In criterion 9.9(a) replace "and the spec FAILS rather than skips when
      no project it can run under matched it, so a testMatch that stops
      matching reddens the suite instead of silently emptying it" with: "AND
      THE SPEC CHECKS ITS OWN MEMBERSHIP, in a test that carries NO skip
      condition and therefore runs under every project the file is collected
      by: it reads playwright.config.ts, by import or from disk, and asserts
      that a project exists whose use options carry hasTouch true and whose
      testMatch matches this spec's own filename, taken from test.info().file.
      A spec that no project matches is never loaded by Playwright and cannot
      fail from inside itself, which is why the guard is written as a claim
      about the CONFIG rather than about the run: a later phase that widens or
      narrows testMatch, and playwright.config.ts is a file M3-P10's criterion
      10.7 expressly permits it to touch, then reddens this spec under the
      projects that still collect it instead of silently emptying the phone
      project. This is what makes M3-P10's requirement that every pre-existing
      spec pass under every project into a real interlock rather than a
      requirement about a spec that is no longer there."
  - id: R2-04
    severity: medium
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:5185-5215 (criterion 9.9(e), added in
        this revision): four endings, "a touch release ON the control", "a
        touch release AWAY from the control", "a POINTERCANCEL", and "a MOUSE
        press begun on the control and released elsewhere". Each is driven on
        one control, one press at a time.
      - >-
        The assertion after each ending is
        `document.querySelectorAll("[data-pressed]") has length ZERO`, which
        is the right assertion and is only ever evaluated after a SINGLE press
        has ended.
      - >-
        delivery/plan/pulse-v02.yaml:4656-4666 (the step) mandates "capture-phase
        pointerup and pointercancel listeners that clear every data-pressed in
        the document", so the step already specifies the correct
        implementation. The criterion is what falsifies, and the criterion
        cannot see the difference.
      - >-
        A single-slot clear, a module-scope variable holding the last pressed
        element and a clear that removes the attribute from that variable,
        passes all four endings on all three shapes.
    analysis: >-
      Answering the coordinator's question, can a listener pass all four
      endings and still leave something drawn pressed: yes, and the
      implementation that does it is the most natural wrong one. Remember the
      pressed element in a variable, clear that element on pointerup and
      pointercancel. Ending one clears it, ending two clears it, ending three
      clears it, ending four clears it, because in every one of the four
      exactly one control has been pressed and the variable holds it. Now put
      two fingers down. Finger A presses control X, the variable holds X.
      Finger B presses control Y before A lifts, the variable now holds Y. A
      lifts, Y is cleared, X is not, and X stays drawn pressed with nothing
      left that will ever clear it. That is round one's stuck-pressed defect
      surviving the criterion written to catch it, and 9.9(e) cannot see it
      because it never has two presses in flight. On the mouse ending itself,
      which the coordinator asked me to check rather than agree with: the
      reasoning is CORRECT. A direct-manipulation pointer gets implicit
      capture to its pointerdown target, so a touch pointerup fires on the
      control however far the finger travelled, and endings one through three
      genuinely cannot separate a target-scoped clear from a document-wide
      one; a mouse pointer has no implicit capture, so ending four separates
      them. One nuance worth stating and not worth changing: what ending four
      protects is the DESK screen and any future non-capturing pointer, since
      under touch a target-scoped clear leaves nothing stuck at all. It earns
      its place, and it was not in my edit.
    concrete-edit: >-
      Add a fifth ending to criterion 9.9(e), after ending FOUR: "FIVE, TWO
      PRESSES IN FLIGHT. A touch begins on one control and, before it ends, a
      second touch begins on a different control; then the FIRST touch ends
      and then the second. After the last of the two endings,
      document.querySelectorAll(\"[data-pressed]\") has length ZERO. This
      ending exists because the four above drive one press at a time and
      therefore cannot see the most natural wrong implementation: a clear that
      remembers the pressed element in a single slot passes endings one
      through four and, under two presses, overwrites the slot and leaves the
      first control drawn pressed with nothing left that will clear it. The
      clear this phase specifies sweeps the document, and this ending is what
      makes the specification falsifiable rather than merely written down."
      And extend the FALSIFIED BY clause from "after ANY of half (e)'s four
      endings" to "after ANY of half (e)'s five endings".
  - id: R2-05
    severity: medium
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:5118-5127 (criterion 9.9(b), rewritten in
        this revision from round one's ADV-M3P9A-06): "Over the frames sampled
        while the touch is held: (i) the control under test carries
        [data-pressed] on EVERY sampled frame except at most the FIRST". The
        window, "frames sampled while the touch is held", is not defined
        against any recorded timestamp.
      - >-
        /home/user/wt-m3p9/test/e2e/pressed-and-disabled.spec.ts:761-794:
        holdTouch starts the requestAnimationFrame sampler and THEN sends the
        CDP Input.dispatchTouchEvent touchStart. Frames therefore tick between
        the sampler starting and the pointerdown arriving, and the number of
        them is a function of round-trip latency.
      - >-
        That is exactly why the measured runs read 28 of 29 and 26 of 27: one
        leading frame, on an idle container. Two leading frames make the same
        correct implementation read 27 of 29 and FAIL "every frame except at
        most the first".
      - >-
        The sampler already records the anchor this needs:
        /home/user/wt-m3p9/test/e2e/pressed-and-disabled.spec.ts:725-727 sets
        `state.pressAt = performance.now()` on the first pointerdown.
      - >-
        Criterion 9.9(b)(iv), in the same clause, DOES anchor correctly: "the
        FIRST OR SECOND sampled frame at or after the pointerdown".
      - >-
        Captured in this container: `uptime` load average 11.29 on `nproc` 4,
        against fleet environment warning 18's measured 5.8 to 9.44.
    analysis: >-
      This one is mine and I will own it. Round one's complaint against the 60
      percent floor was that it tightens as the sample thins, and the edit I
      proposed replaced it with an all-but-the-first rule over a window I did
      not define. Taken literally against the sampler that exists, that rule
      is MORE load-fragile than what it replaced, not less: the frames it
      cannot tolerate are the pre-press ones, and the number of pre-press
      frames is precisely what a busy box inflates. So the answer to the
      coordinator's question, did tightening the floors introduce a new flake,
      is yes, in (i), and the fix is one phrase rather than a retreat, because
      the sampler already records the pointerdown timestamp and the sibling
      clause (iv) already uses it. Anchored at pressAt the rule is both
      stricter and load-robust: the handler runs synchronously inside event
      dispatch and no animation frame can interleave with it, so every frame
      at or after the pointerdown should carry the attribute and the tolerance
      for one is margin rather than necessity. The other two floors are now
      safe. The eight-frame minimum is 20 frames per second against a measured
      68, a factor of three, and it fails LOUDLY as unmeasured rather than
      passing thin, which is the right direction; what it lacks is a sentence
      saying what the round does when it fires, and without one the fix round
      will lower the eight.
    concrete-edit: >-
      In criterion 9.9(b) replace "Over the frames sampled while the touch is
      held:" with "Over the frames sampled AT OR AFTER THE RECORDED POINTERDOWN
      TIMESTAMP and before the touch ends, which is the window and not merely
      the hold: the sampler starts before the press is dispatched, so frames
      tick before the pointerdown arrives and their number is a function of
      how busy the machine is, which is the one thing no floor here may
      depend on:". And add to the eight-frame sentence: "A run that fails this
      floor is a MACHINE result and is recorded as one, retaken with the load
      captured beside it; it is never repaired by lowering the floor, because
      the floor is what separates a thin sample from a measurement."
  - id: R2-06
    severity: low
    evidence:
