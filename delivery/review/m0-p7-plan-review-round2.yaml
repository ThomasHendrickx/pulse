      not be applied unevenly inside one clause, since unevenness is what a
      later reader copies.
    concrete-edit: >-
      In criterion 9.9(e), after "the spec drives FOUR endings and keeps
      sampling frames after each one", insert: "EVERY ending is shown to have
      happened before anything is concluded from it, the way half (c)
