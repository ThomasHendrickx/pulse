# Clean-room review verdict for phase M3-P12, counterparty identity.
# CRITERIA contract. Reviewed head fc5aef4 on branch
# claude/m3-p12-counterparty-identity, baseline 7f4aafb.
#
# WHAT THIS CONTRACT DID NOT REACH, said here rather than left to nobody.
# Walking twenty-two criteria is a statement about the CONTRACT and never a
# terminal green. Three things this walk could not settle. The re-derivation
# has never run against a real database, so nothing here says it behaves on
# the owner's deployed data as it does against a fake. The account basis is a
# regex scrape out of free text, and the trust gate closes shape, length and
# mod-97 but not WHICH of several account-shaped tokens a description means:
# first-wins is pinned and parked, and independently measured here, 4 of the
# owner's 39 rows carry two or more such tokens, so that parked question is
# live rather than theoretical. And no criterion in this phase measures what
# the owner sees on the screen after the change; M3-P13 owns that, and this
# phase's proof is a count.
kind: verdict
phase: M3-P12
verdict: FIX-ROUND-NEEDED
produced-by: claude-opus-5
framing: acceptance-criteria-walk
review-contract: criteria
findings:
- id: CR-M3P12-01
  severity: medium
  analysis: |-
    Criterion 12.7 requires the acknowledge path to exit 0 for exactly the ids it names AND to print them as accepted. The routine does both for a merchant conflict but only the first for a lost assignment. An accepted lost assignment is removed from the report and recorded nowhere else, so the run prints lost-assignments 0 and is byte-indistinguishable from a run that lost nothing. This is the quiet-green shape the whole phase's contract is written against, and it fires on the one path where a person has deliberately said they accept losing one of the owner's namings against the owner's live database.
  evidence:
  - |-
    The filter that drops it: src/modules/merchants/application/rederive-rules.ts:423, which removes accepted lost assignments from the list and puts them nowhere.
  - |-
    The report type carries acceptedConflicts but has no counterpart for lost assignments: src/modules/merchants/application/rederive-rules.ts:140 through :147.
  - |-
    The script prints accepted conflicts and nothing for accepted losses: scripts/rederive-merchant-rules.ts:112 through :120.
  - |-
    The test asserts only the empty list and therefore does not notice: test/application/rederive-merchant-rules.test.ts:481 through :489.
  concrete-fix: |-
    Add an acceptedLostAssignments field to RederiveReport at src/modules/merchants/application/rederive-rules.ts:140, populate it in the same pass that filters at :423 by partitioning rather than filtering, print each entry as accepted-lost-transaction with its holding rule id beside the accepted-conflict-rule lines at scripts/rederive-merchant-rules.ts:114, and extend the assertion at test/application/rederive-merchant-rules.test.ts:485 to require the accepted loss to appear in that new list.
- id: CR-M3P12-02
  severity: medium
  analysis: |-
    The re-derivation's only production write path against the real database is exercised by nothing. Criteria 12.7 and 12.8 asked for a seeded database and would have forced this coverage; the in-memory fake answered instead, and the fake reimplements the adapter method independently rather than calling it, so the adapter's updateManyAndReturn call, its household filter and its foreign-rule throw are all unverified. This is the one function standing between the owner's existing declarations and the migration, and this tree already has a live-Postgres test lane in the same fast gate, so the coverage was available.
  evidence:
  - |-
    The uncovered function: src/modules/merchants/adapters/merchant-repository.ts:121 through :138.
  - |-
    Every reference to it in the tree is a type, a binding, a call from the routine, or the fake's own reimplementation; no test reaches the adapter. The fake's independent copy is at test/application/fake-import-world.ts:392 through :406.
  - |-
    The database lane that was available and unused: test/schema/rls.test.ts and test/db/db-guard.test.ts, both green inside the same npm test run that exits 0.
  concrete-fix: |-
    Add one test in the existing live-Postgres lane, beside test/db/db-guard.test.ts, that inserts a MerchantRule for household A, calls updateRulePattern from src/modules/merchants/adapters/merchant-repository.ts:121 with household A's context and asserts the returned row, then calls it with household B's context for the same rule id and asserts it throws and that the row is unchanged.
- id: CR-M3P12-03
  severity: medium
  analysis: |-
    A false present-tense claim in a comment, which clause R-087 requires be raised as a finding rather than as a note. The header of the re-derivation test states that the routine runs against a SEEDED DATABASE holding MerchantRule rows. It does not: the subject is an in-memory fake and no database is involved. The work history's deviations list is honest about this, which makes the comment the only place in the tree that says the false thing, and it is the place the next implementer reads first when deciding whether the routine has database coverage.
  evidence:
  - |-
    The false sentence: test/application/rederive-merchant-rules.test.ts:25 through :27, which says the re-derivation runs against a SEEDED database holding MerchantRule rows written under the BASELINE derivation.
  - |-
    What actually answers it: the fake bound at test/application/rederive-merchant-rules.test.ts:23 and constructed at :45.
  - |-
    The honest record one document over, which is what makes this a comment defect rather than a concealment: delivery/work-history/m3-p12.yaml:508 through :519.
  concrete-fix: |-
    Rewrite test/application/rederive-merchant-rules.test.ts:25 through :27 to say the subject is the in-memory fake repository at test/application/fake-import-world.ts, that the criteria say database and this is the deviation recorded in the work history, and that the adapter's own write path is covered separately once finding CR-M3P12-02 is closed.
- id: CR-M3P12-04
  severity: medium
  analysis: |-
    Criterion 12.20's record is incomplete. The criterion asks for the residue for each real document AND for the committed corpus; the work history gives it for the two real documents and for the single new fixture, and for none of the other 36 parsable committed fixtures. The point of the criterion is that the size of the problem this phase does NOT solve is a number rather than a decision's prose, and for the corpus that number does not exist anywhere.
  evidence:
  - |-
    The only residue entry, covering two real documents and one fixture: delivery/work-history/m3-p12.yaml:360 through :371.
  - |-
    The corpus the entry does not cover: 37 fixtures parse, verified by running the committed harness over test/fixtures/*.pdf and test/fixtures/*.csv, which printed counts for 37 and status unparsed for 4.
  - |-
    The harness already emits the two numbers the criterion wants, per file: test/fixtures/measure-identity-convergence.ts:114 and :115.
  concrete-fix: |-
    Run the committed harness over every parsable committed fixture and append to delivery/work-history/m3-p12.yaml, beside entry (j) at :360, one corpus line carrying the summed identity-singleton-keys and identity-singleton-rows against the same two counts under the baseline, counts only.
- id: CR-M3P12-05
  severity: medium
  analysis: |-
    Criterion 12.17 cannot be satisfied by any implementer of this phase. Its third clause requires the work history to record a command run against the DEPLOYED database, while decision D-46 forbids the routine from running before the code deploys and the plan calls that order forced rather than chosen. The branch is not deployed and is not merged, so the required artefact cannot exist while the phase is open, and producing it would require violating D-46. The criterion is written against a state outside the phase's reach. The implementer's qualification is correct and its record of the absence is the right behaviour; the defect is in the plan.
  evidence:
  - |-
    The criterion's third clause, which names the deployed database, is quoted in full in this document's criteria walk for 12.17.
  - |-
    The order it collides with, stated in the script's own contract: scripts/rederive-merchant-rules.ts:6 through :15.
  - |-
    The implementer's record of the absence rather than a claim of completion: delivery/work-history/m3-p12.yaml:495 through :507, and the open question at delivery/work-history/m3-p12.yaml:544 through :552.
  concrete-fix: |-
    Split criterion 12.17 in the plan at delivery/plan/pulse-v02.yaml: keep the invocation point and the stated order as M3-P12's criterion, and move the deployed run with its exit code and its before-and-after assignment-set sizes into the deploy-verify phase that owns post-deploy evidence, so the phase closes on what it can reach and the deployed run is owed by a phase that can produce it.
- id: CR-M3P12-06
  severity: low
  analysis: |-
    The remediation of the tracked node_modules symlink is complete at the tip and incomplete in history, and neither the work history nor the commit message says so. The blob whose whole content is a machine-local absolute container path is still reachable from the pushed public branch at two commits, so removing it from the tip did not remove it from the public repository. The commit message says the blob is untracked and the work history says it is removed with git rm --cached; both are true of the tip and neither is true of what a clone of this branch can read.
  evidence:
  - |-
    The blob is still reachable at two commits on the pushed branch: git ls-tree d62b63d -- node_modules returns mode 120000 blob b620da47, and git log --diff-filter=A -- node_modules names 62612ad as the commit that added it.
  - |-
    Its content is a machine-local absolute path, confirmed with git cat-file -p on that blob.
  - |-
    The branch is pushed: git ls-remote origin returns fc5aef4 for refs/heads/claude/m3-p12-counterparty-identity, so both ancestors are public.
  - |-
    The claim that reads as complete: delivery/work-history/m3-p12.yaml:187 through :199.
  - |-
    The gate cannot see it and is not expected to: npm run gate:privacy exits 0 on this tree.
  concrete-fix: |-
    Either squash-merge the branch so the merged history carries only the tip, or rebase 62612ad and d62b63d to drop the blob before merge; and in either case add one sentence to delivery/work-history/m3-p12.yaml:187 stating that the blob remains reachable in the branch's own history and which of the two routes was taken.
- id: CR-M3P12-07
  severity: low
  analysis: |-
    Criterion 12.1's composition clause is ambiguous and, on its strict reading, unsatisfiable against the rest of its own plan. The sentence ends at least 8 rows carry none, where none elides a trusted account on the natural reading but reads as no account field at all on the strict one. Under the strict reading the criterion collides with plan step 7, which requires the SAME fixture to carry the two truncation-attack rows: those rows carry an account field and take the descriptor basis, so rows carrying no account field cap at 6 while the criterion's own arithmetic fixes the descriptor-basis count at exactly 8. An implementer reading it strictly would either drop the attack rows the plan mandates or hand-build a row the shipped importer cannot emit.
  evidence:
  - |-
    Measured on the committed fixture with the committed harness: rows 24, rows-with-account 18, identity-rows-descriptor-basis 8. Six rows carry no account field; eight take the descriptor basis.
  - |-
    The generator's own arithmetic derivation of the unique composition, which reaches n = 4, D = 8, A = 16 exactly: test/fixtures/generate-pdf-fixtures.ts:1235 through :1243.
  - |-
    The attack rows that make the strict reading unreachable, declared in the same fixture: test/fixtures/generate-pdf-fixtures.ts:1245 through :1254.
  - |-
    The assertion as shipped, on the descriptor basis: test/domain/counterparty-identity.test.ts:96 through :99.
  concrete-fix: |-
    Reword criterion 12.1 in delivery/plan/pulse-v02.yaml to say at least 8 rows take the DESCRIPTOR basis, whether by carrying no account or by carrying one the trust gate refuses, so the sentence states what its own arithmetic forces and cannot be read against plan step 7.
- id: CR-M3P12-08
  severity: low
  analysis: |-
    The re-derivation applies every non-blocking write and runs the recompute BEFORE it returns a blocking exit code, and nothing says so. A person reading the script's contract, which frames exit 1 as blocking and as stopping the deploy, would reasonably believe a blocked run left the database untouched. It did not: pass one's rewrites, pass two's additions and the full recompute have already happened. The behaviour is defensible under D-45, because every write is additive or invertible by stripping a constant prefix and the routine deletes nothing, but it is undocumented and unpinned, so a later change in either direction is silent.
  evidence:
  - |-
    The recompute runs unconditionally, before the report is built and before the exit code is computed: src/modules/merchants/application/rederive-rules.ts:427.
  - |-
    The exit code is decided after all writes: src/modules/merchants/application/rederive-rules.ts:436.
  - |-
    The script's contract frames the two conditions as blocking without saying what is already written: scripts/rederive-merchant-rules.ts:27 through :31.
  - |-
    No test pins the post-blocked-run state; the blocking tests at test/application/rederive-merchant-rules.test.ts:415 and :452 assert the report and the exit code only.
  concrete-fix: |-
    State it in the script's own contract at scripts/rederive-merchant-rules.ts:27, that a blocking exit leaves every non-blocking write applied and the recompute run and is undone by stripping the namespace and deleting the added rules, and add one assertion to the blocking test at test/application/rederive-merchant-rules.test.ts:427 that the non-conflicting rules were still rewritten on the run that exited 1.
- id: CR-M3P12-09
  severity: low
  analysis: |-
    Two unit tests shell out to git with the branch point hardcoded as a literal SHA. They pass here and will go red or throw for reasons unrelated to the code they guard: a rebase, a squash-merge, a shallow clone or a checkout without that object all break them, and the failure will read as a regression in the thing they pin rather than as a broken fixture. The properties they assert are real and worth pinning; the mechanism is the problem.
  evidence:
  - |-
    The enum pin: test/domain/counterparty-identity-contracts.test.ts:58 through :67, which runs git diff against the literal 7f4aafb.
  - |-
    The corrections pin: test/domain/counterparty-identity-contracts.test.ts:83 through :90, same mechanism.
  - |-
    Both are green in this worktree inside npm test exit 0, which is exactly why the brittleness is invisible today.
  concrete-fix: |-
    Replace both git shell-outs with content pins in the same style the rest of this tree uses: assert the MerchantRuleKind enum block of prisma/schema/merchants.prisma equals a literal restated in the test, and assert a hash or the full text of src/modules/ledger/domain/corrections.ts's counterpartyKey against a committed pin, so the assertion survives a rebase and names the file rather than the branch point.
criteria:
- id: '12.1'
  quote: |-
    CONVERGENCE, COUNTED. A test in test/domain/counterparty-identity.test.ts parses test/fixtures/belfius-counterparty-identity.pdf through the shipped path and counts DISTINCT counterpartyIdentity keys over its rows. The fixture carries 24 rows representing 12 invented counterparties, and the test asserts the distinct-key count is exactly 12, printing both 12 and 24, and separately asserts that the BASELINE derivation (normaliseCounterparty(counterpartyText(row))) over the same rows yields EXACTLY 24 distinct keys, one per row, printing that number too, so the fixture is proven to reproduce the TOTAL non-convergence the owner's month shows on its account-carrying rows (11 rows, 11 baseline keys, measured) rather than a partly converged version of it. The fixture's composition is also asserted, so neither basis can carry the proof alone: at least 8 rows carry a trusted account over at least 4 distinct accounts, and at least 8 rows carry none. A test that asserts only that a rule exists, that asserts a count without printing the row count beside it, or that admits a baseline count below 24, does not meet this criterion.
  met: true
  evidence:
  - |-
    Reproduced independently, not read off the suite: npx tsx test/fixtures/measure-identity-convergence.ts test/fixtures/belfius-counterparty-identity.pdf, exit 0, printed rows 24, baseline-distinct-keys 24, identity-distinct-keys 12, identity-account-keys 4, identity-rows-account-basis 16, identity-rows-descriptor-basis 8, rows-with-account 18.
  - |-
    The count and the row count are printed beside each other by the test itself: test/domain/counterparty-identity.test.ts:70 prints fixture rows, identity keys and baseline keys on one line, and the suite run captured it verbatim as fixture rows 24, identity keys 12, baseline keys 24.
  - |-
    The baseline floor is asserted, not admitted below 24: test/domain/counterparty-identity.test.ts:80 asserts the baseline key count is exactly 24.
  - |-
    The composition assertion is at test/domain/counterparty-identity.test.ts:96 through :99 and reads account rows at least 8, distinct accounts at least 4, descriptor-basis rows at least 8; the captured line was account-basis rows 16 over 4 accounts, descriptor-basis rows 8.
  - |-
    THE READING AMBIGUITY THE IMPLEMENTER FLAGGED, decided here on the criterion's own sentence. Measured: 18 of the 24 rows carry a counterparty account field, so only 6 carry none at all, while 8 take the descriptor basis. The elliptical reading is the one the sentence requires: in at least 8 rows carry a trusted account over at least 4 distinct accounts, and at least 8 rows carry none, the pronoun none elides the object of the preceding carry, which is a trusted account. The strict reading is additionally UNSATISFIABLE against the rest of this plan, and that settles it: the criterion also fixes 24 rows, 12 counterparties and a baseline of 24, from which k = n + D and r = A + D force n = 4, D = 8, A = 16 exactly, while plan step 7 requires the SAME fixture to carry the two truncation-attack rows, which carry an account field and fall to the descriptor basis. Rows carrying no account field are therefore at most 6 and cannot reach 8 without dropping the attack rows the plan mandates. Met on the only reading the plan admits; the wording is raised as finding CR-M3P12-07.
- id: '12.2'
  quote: |-
    CONVERGENCE ON THE OWNER'S OWN MONTH, so the fixture cannot be built to pass a bar the real data fails. The phase work history records, with the exact command that produced each number, the command naming the COMMITTED harness path rather than a scratchpad path, and with no descriptor content, the result of running the SHIPPED pipeline over the real Belfius document in memory: total rows 39, distinct identity keys EXACTLY 20 against a recorded baseline of 25, of which the account basis contributes EXACTLY 6 (baseline 11) and the descriptor basis EXACTLY 14 (baseline 14); and the same run over the real KBC card document records 22 rows and EXACTLY 16 identity keys, unchanged from its baseline of 16. BOTH BOUNDS ARE BINDING AND THE LOWER ONE MATTERS MOST: over-collapse drives the count DOWN, so a ceiling alone would pass hardest exactly when the critical defect is worst, and a run producing fewer than 20 is treated as an over-collapse and stops the phase until it is explained. Any number differing in either direction is reported with the measured value rather than the plan's.
  met: true
  evidence:
  - |-
    Reproduced independently against the two real documents in memory, counts only, nothing written to disk: npx tsx test/fixtures/measure-identity-convergence.ts over both, exit 0. Current-account document: rows 39, rows-with-account 11, baseline-distinct-keys 25, identity-distinct-keys 20, identity-account-keys 6, identity-descriptor-keys 14, identity-rows-account-basis 11, identity-rows-descriptor-basis 28. Card document: rows 22, rows-with-account 0, baseline-distinct-keys 16, identity-distinct-keys 16, identity-account-keys 0, identity-descriptor-keys 16.
  - |-
    Every figure the criterion pins is hit exactly and none is below its floor: 20 is not below 20, account 6, descriptor 14, card 16 unchanged from a baseline of 16.
  - |-
    The work history records the same numbers with the committed harness path rather than a scratchpad path, at delivery/work-history/m3-p12.yaml:220 through :239, and quotes no descriptor content.
  - |-
    The harness itself is committed and prints integers and a label only, with the label truncated to eight characters for any path outside test/fixtures: test/fixtures/measure-identity-convergence.ts:45 through :48.
- id: '12.3'
  quote: |-
    NAMED ONCE, MATCHED AGAIN. A test in test/application/counterparty-identity-journey.test.ts imports test/fixtures/belfius-counterparty-identity.pdf, asserts that a designated counterparty of that fixture appears as ONE unresolved group whose count is 3, calls assignMerchant EXACTLY ONCE against that group's identity key (asserted by a call counter on the fake merchants port, which must read 1 at the end of the test), runs interpretation, and then asserts that a DIFFERENT transaction of the same counterparty, which the naming was not made from and which differs from it in booking date, in amount and in free-text communication, now carries that merchant id. The test names both transaction ids and the fixture in its assertions. A test that names each transaction separately, or that asserts only the group count, does not meet this criterion.
  met: true
  evidence:
  - |-
    The journey test is at test/application/counterparty-identity-journey.test.ts:81 and imports the named fixture at :42 through :45.
  - |-
    ONE unresolved group whose count is 3 is asserted at test/application/counterparty-identity-journey.test.ts:154 and :157.
  - |-
    The call counter on the fake merchants port is installed at test/application/counterparty-identity-journey.test.ts:90 through :97 and asserted to read 1 at :175.
  - |-
    The two transactions the naming was NOT made from are named by id and asserted to carry the merchant id at test/application/counterparty-identity-journey.test.ts:183 and :184; the designated rows are asserted to differ in booking date, in amount and in description at :118 through :126.
  - |-
    The row ordinals are taken from the generator's input record rather than from any derivation output: test/application/counterparty-identity-journey.test.ts:76 through :78.
  - |-
    Green in the captured suite run: test/application/counterparty-identity-journey.test.ts, 1 test, 404ms, inside npm test exit 0.
- id: '12.4'
  quote: |-
    DIFFERENT COUNTERPARTIES STAY DIFFERENT WHERE THE STORED VALUES DIFFER. Over the same fixture, a test asserts that no two rows carrying different TRUSTED counterparty accounts share an identity key, that no account-basis key is equal to any descriptor-basis key, and that the 12 identity keys partition the 24 rows exactly as THE GENERATOR'S OWN INPUT RECORD says, row by row, so a merge shows up as a failed row rather than as a count that still happens to be 12. That record is EMITTED BY test/fixtures/generate-pdf-fixtures.ts as the list of row ordinal to invented counterparty ordinal pairs it generated the fixture FROM, written in the same run that writes the PDF; the test imports it from the generator, and a check asserts regenerating the fixture reproduces both files byte for byte so the record cannot have been hand-edited. A mapping transcribed from counterpartyIdentity's own output does not meet this criterion, because it would certify the function against itself. STATED PLAINLY: this criterion is NOT the guard on H12.1. In every mechanism that reaches H12.1 the two rows end up carrying the SAME stored value, so this criterion's antecedent is false and it passes vacuously; criterion 12.16 is the guard.
  met: true
  evidence:
  - |-
    The oracle's independence was checked in the source rather than accepted: the only imports in test/fixtures/generate-pdf-fixtures.ts are node:fs, node:path and node:url, at test/fixtures/generate-pdf-fixtures.ts:34 through :36, so nothing from src and therefore no derivation can reach it.
  - |-
    The record is built from the generator's INPUT field, the per-row counterparty ordinal declared beside each description, at test/fixtures/generate-pdf-fixtures.ts:1606 through :1612, and serialised in the same run that writes the PDFs at :1614 through :1641.
  - |-
    Regeneration reproduces every emitted file byte for byte, verified independently: md5sum of the 14 committed PDFs plus test/fixtures/belfius-counterparty-identity-map.json taken before, then npx tsx test/fixtures/generate-pdf-fixtures.ts, then md5sum -c, which reported 15 of 15 OK and git status --porcelain listed no fixture as modified.
  - |-
    The row-by-row partition against the record is asserted at test/domain/counterparty-identity.test.ts:134 through :169, failing per row rather than on a count.
  - |-
    The disjointness assertions are at test/domain/counterparty-identity.test.ts:121 and :128 through :131.
  - |-
    The criterion states itself that it is not the guard on H12.1 and passes vacuously there; that is accepted, and criterion 12.16 was walked as the guard.
- id: '12.5'
  quote: |-
    THIS PHASE STRIPS NOTHING NEW. For every row of every committed fixture that takes the descriptor basis, the identity key produced by this branch is exactly the lowercase literal "descriptor:" followed by a suffix BYTE-IDENTICAL to the key the baseline commit produces for the same row, asserted by a test that reads a committed table of baseline keys generated at the baseline commit and compares key.slice("descriptor:".length) against it. A separate test asserts normaliseCounterparty never emits a lowercase letter, so no descriptor key can ever begin with either namespace and the two key spaces cannot collide by construction. And git diff of the baseline against this branch shows no change to CARD_RAIL_PREFIX, CARD_NUMBER_LABEL, CARD_NUMBER_TAIL, CARD_AMOUNT_BEFORE_LABEL, ANGLE_COUNTRY_MARKER, TERMINAL_NOISE_PATTERNS, DATE_FRAGMENT_PATTERNS, POSTAL_CODE_BEFORE_CITY or CITY_TOKENS in src/modules/merchants/domain/normalise-counterparty.ts, and the pinned regression table in test/domain/normalise-counterparty.test.ts is unchanged.
  met: true
  evidence:
  - |-
    The recipe is unchanged, verified by diff rather than by inspection: git diff 7f4aafb..fc5aef4 -- src/modules/merchants/domain/normalise-counterparty.ts produced EMPTY output, so none of the nine named constants can have moved.
  - |-
    git diff 7f4aafb..fc5aef4 -- test/domain/normalise-counterparty.test.ts also produced empty output, so the pinned regression table is unchanged.
  - |-
    The committed pin is at test/fixtures/baseline-descriptor-keys.json and covers 37 fixtures; the comparison is at test/domain/counterparty-identity.test.ts:215 through :245.
  - |-
    The pin was checked independently against every row rather than only the descriptor-basis ones the test compares: a scratch script parsed all 37 fixtures through the shipped path and compared the baseline derivation to the table for every row, reporting files 37, rows checked 204, mismatches 0. Because the whole import path and the normaliser are byte-identical to the baseline commit, that is the baseline commit's own output.
  - |-
    The no-lowercase property is asserted over the real corpus plus invented lowercase inputs at test/domain/counterparty-identity.test.ts:180 through :205.
- id: '12.6'
  quote: |-
    A ROW MATCHING NO FAMILY IS NOT GUESSED AT. A test asserts that for a row carrying no counterparty account whose descriptor the card predicate does not recognise, the identity key is "descriptor:" followed by exactly normaliseCounterparty(counterpartyText(row)), whose suffix after the namespace is equal character for character to the baseline key, and that its basis is reported as descriptor. A test asserts the same of a row whose stored counterparty account is empty or whitespace only, so no row is ever keyed on a bare namespace, which is the hazard src/modules/merchants/domain/normalise-counterparty.ts:462 through :464 already guards on the descriptor side and which this phase must not reintroduce on the account side. The plan and the code state, and a test asserts, that no truncation, no opening-prefix key and no fallback bucket is ever produced: two such rows share a key only when their full normalised descriptors are equal.
  met: true
  evidence:
  - |-
    A row with no account whose descriptor matches no family keeps exactly its baseline key: test/domain/counterparty-identity.test.ts:249 through :260.
  - |-
    An empty or whitespace-only stored account takes the descriptor basis and is never keyed on a bare namespace: test/domain/counterparty-identity.test.ts:262 through :275.
  - |-
    No truncation, no opening-prefix key and no fallback bucket: test/domain/counterparty-identity.test.ts:277 through :287.
  - |-
    The code says the same at the definition and produces no shorter key on the refused path: src/modules/merchants/domain/counterparty-identity.ts:217 through :225.
  - |-
    Reproduced independently on the pure function with invented values: empty and whitespace-only accounts both returned basis descriptor.
- id: '12.7'
  quote: |-
