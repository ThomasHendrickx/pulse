deviations-judged:
- deviation: |-
    Criterion 12.17, the half requiring the phase work history to record the command actually run AGAINST THE DEPLOYED DATABASE with its exit code and its printed before-and-after assignment-set sizes.
  serves-plan-intent: true
  reasoning: |-
    The implementer's qualification was tested rather than accepted, and it holds. The script does import the new derivation, at scripts/rederive-merchant-rules.ts:37 through :43, so it genuinely cannot run against a build that does not carry it and D-46's order is forced rather than preferred; and running it now from a worktree against the owner's live database would write merchant_rules while the deployed application still carries the old code, which is the deploy window with its two halves in the wrong order. No implementer of this phase can produce the required artefact without violating D-46, so recording the absence is the only behaviour open. The deviation serves the plan's intent; the criterion is what needs changing, and that is finding CR-M3P12-05.
- deviation: |-
    Criteria 12.7, 12.8 and 12.9, which speak of "a seeded database" holding MerchantRule rows written under the baseline derivation.
  serves-plan-intent: false
  reasoning: |-
    The reasoning offered is that the fake is this tree's standing convention for the application layer and that it is what makes 12.9's no-write assertion observable at all. The first half is true; the second is weaker than it looks, because the fake makes the FACT VALUES observable rather than the writes, so a write that rewrote the same values would still pass. And this tree is not short of a database: test/schema/rls.test.ts and test/db/db-guard.test.ts run against live Postgres inside the same fast gate, so the database was available and this was a choice. The measurable cost is that the adapter method the routine's only production write goes through, src/modules/merchants/adapters/merchant-repository.ts:121, has no coverage at all, because the fake reimplements it independently at test/application/fake-import-world.ts:392 rather than calling it. Recording the deviation openly was right; taking it was not necessary, and the criterion's word was chosen deliberately. Finding CR-M3P12-02, and the comment that states the opposite is finding CR-M3P12-03.
- deviation: |-
    files-to-touch, which does not name .gitignore.
  serves-plan-intent: true
  reasoning: |-
    One of the three changes the second implementer made to inherited work, and verified here independently rather than inherited. The blob was added by 62612ad, is present at d62b63d, is absent at fc5aef4, git check-ignore now reports node_modules ignored by .gitignore line 2, and git cat-file confirms the blob's whole content was a machine-local absolute container path. Fixing the accident and closing the recurrence in one change is right, and dropping the trailing slash is the correct fix rather than a special case, since a trailing slash matches directories only and a worktree's node_modules is a symlink. It serves the plan's intent and CLAUDE.md non-negotiable 8. What it does not reach is the pushed public history, where both ancestor commits still carry the blob, which is finding CR-M3P12-06.
- deviation: |-
    Step 13, "run the full gate before calling the slice done", read as one clean run of every gate.
  serves-plan-intent: true
  reasoning: |-
    Reported rather than summarised away, which is the behaviour the process asks for. I reproduced the SHAPE and not the instance: my own full Playwright run was 53 passed and 1 failed in 10.7m, and the failure was a DIFFERENT spec under a different project, chromium-phone month-view.spec.ts:252 timing out on the shared upload helper at test/e2e/month-view.spec.ts:73, where the implementer reported auth.spec.ts:11. In my run all three auth specs passed on the first try, auth.spec.ts:11 in 9.0s, and the failing spec passed alone on re-run in 20.3s and passed under the desktop project in the same full run. Two different first-run flakes on the same upload-then-assert shape across two containers says the flake surface is real and is not this phase's code. Declaring the gate green on a warm re-run is honest given that, but it is worth saying plainly that the e2e green is a second-run green in both containers. THE OTHER TWO INHERITED CHANGES were verified here too and neither needed a deviation: the previously uncommitted test/e2e/merchants.spec.ts is finished work, it is the only witness anywhere for criterion 12.18's e2e half, every selector it uses exists on the shipped component at src/modules/merchants/ui/merchant-review.tsx, and it passed in 9.7s in my own run; and the work history, written from a placeholder, has had its numbers re-derived rather than read, with every convergence figure, all 37 per-fixture pairs, the four unparsable fixtures, the residue for both real documents and the 5-of-21 red run all reproducing exactly, the single shortfall being the corpus residue at finding CR-M3P12-04.
