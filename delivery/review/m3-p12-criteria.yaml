    THE ACCOUNT BASIS FAILS CLOSED, AND THIS IS THE GUARD ON H12.1 RATHER THAN CRITERION 12.4. A unit test over WHOLLY INVENTED inputs asserts that each of the following yields a DESCRIPTOR-basis key and never an account-basis one: an account that is empty or whitespace after uppercasing and whitespace removal; an account whose country code the pinned country-length table does not carry; an account whose length differs from the length that table assigns its country code; and an account that fails the ISO 7064 mod-97 check. The TRUNCATION case is asserted end to end rather than only as a predicate: the fixture row whose description carries a longer-than-Belgian account written spaced is parsed through the SHIPPED importer, the test asserts the stored account is a strict PREFIX of the invented source value, and asserts that row takes the descriptor basis, so two rows whose sources differ only after the twelfth digit can never share an identity key. THE TABLE CLOSES TRUNCATION DETERMINISTICALLY RATHER THAN PROBABILISTICALLY, and the reason is one sentence: truncation can only ever emit a SIXTEEN-CHARACTER value, so it only reaches accounts whose true length exceeds sixteen, and such a value always carries a country code whose table length is not sixteen. mod-97 alone would leave a residual of roughly one in ninety-seven, measured uniform across source lengths, which is why both tests are required and not either. FIFTH CASE, pinning a behaviour rather than a guard: the fixture row whose description carries two distinct account-shaped tokens is asserted end to end, the test stating which token the generator wrote FIRST and asserting the stored account, and therefore the identity key, is that one, so the first-wins rule at src/modules/import/domain/belfius-current-account-template.ts:266 through :272 is PINNED rather than incidental. The assertion names the parked item that owns the question, so a later change from first-wins to last-wins or longest-wins is red here before it silently moves 4 of the owner's 39 rows. Measured on the real month before this criterion was written, so it is known to cost nothing: all 11 stored accounts pass all three tests and the trusted distinct count is still 6. Every value used is invented and listed in test/fixtures/allowed-identifiers.txt.
