n left as an unreachable green: the routine accepts a flag naming the specific rule ids whose conflict or lost assignment a person has seen and accepted, exits 0 for exactly those, and prints them as accepted; a test asserts the flag clears only the ids it names and clears nothing else. No criterion in this phase is met by a run that removed a rule row or lost an assignment.
