findings:
  - id: HZ-M3P13-01
    severity: high
    analysis: >-
      THE DISPLAY MASK FAILS OPEN ON EVERY SEPARATOR EXCEPT THE ASCII SPACE,
      and one of the separators it does not tolerate is the exact character
      this tree has already witnessed inside stored account renderings. The
      scan in src/platform/ui/mask-account-number.ts consumes registry-length
      alphanumerics and tolerates a separator only where the character equals
      a plain ASCII space (mask-account-number.ts:97). Anything else breaks
      the run, the run is then short of the registry length, accountSpanAt
      returns undefined and the whole token is copied through UNMASKED. This
      is the failure direction that costs: an unrecognised rendering is
      PRINTED rather than redacted. Measured in probe P1 for the no-break
      space U+00A0, the narrow no-break space U+202F, the thin space U+2002,
      a tab, a newline, a full stop and a hyphen, both bare and inside a
      transfer descriptor. The same file imports canonicalAccountNumber from
      src/platform/account-number.ts, whose whitespace removal is the
      JavaScript \s class and therefore DOES strip all three of those spaces,
      so the phase's own file holds two different answers to what separates
      an account number. That U+00A0 in particular is not hypothetical here
      is recorded in this repository by M3-P18's own hazard finding
      HZ-M3P18-01, quoted at src/platform/account-number.ts: U+00A0 is the
      single byte 0xA0 in Windows-1252, "the encoding common for Belgian
      exports", and stored account renderings carrying it were witnessed
      live. Windows-1252 is one of exactly two encodings the importer
      accepts (src/modules/import/domain/source-profile.ts:11, decoded at
      src/modules/import/domain/delimited-text.ts:11), so a statement whose
      descriptor groups the account with that byte lands in the database
      carrying U+00A0 and renders in full on the screen this phase built.
      The phase's own slow-gate sweep cannot see it: it compares against a
      spaced form built with ASCII spaces
      (test/e2e/identity-on-review.spec.ts:106) and reads the visible text
      through innerText, so an account spaced with U+00A0 satisfies both
      not-toContain assertions while being fully legible on the screen.
    evidence:
      - "probe P1: npx tsx on a scratchpad script calling maskAccountNumbers over nineteen renderings of one account, run in /home/user/wt-m3p13-haz; MASKED=false and the input returned verbatim for the U+00A0, U+202F, U+2002, tab, newline, full stop and hyphen separated forms, and for the same forms embedded in a transfer descriptor"
      - "src/platform/ui/mask-account-number.ts:97, the separator test, character === \" \" and nothing else"
      - "src/platform/account-number.ts, canonicalAccountNumber, value.replace(/\\s/g, \"\"), which strips all three no-break spaces, and the M3-P18 HZ-M3P18-01 note above it recording U+00A0 as byte 0xA0 in Windows-1252 in this project's own exports"
      - "src/modules/import/domain/source-profile.ts:11 (windows-1252 is an accepted encoding) and src/modules/import/domain/delimited-text.ts:11 (TextDecoder over it)"
      - "test/e2e/identity-on-review.spec.ts:106, the spaced form the sweep compares against, built with ASCII spaces by /(.{4})(?=.)/g"
    concrete-fix: >-
      In src/platform/ui/mask-account-number.ts, replace the separator test
      at line 97 with a class rather than a literal space, and make it the
      SAME class the canonical form removes plus the two punctuation
      separators the sibling card mask already tolerates: accept a character
      matching /[\s.-]/ between run characters, still refusing one at the
      start or the end of the run. Then pin it in
      test/domain/identity-on-review.test.ts with a table over the
      separators, U+00A0, U+202F, U+2002, tab, full stop and hyphen at
      minimum, asserting the masked form comes back for each, and add the
      U+00A0-spaced rendering to the e2e sweep's not-toContain list so the
      slow gate can see this class of leak at all.
  - id: HZ-M3P13-02
    severity: high
    analysis: >-
      A FOURTH RENDERING SURFACE CARRIES THE COUNTERPARTY ACCOUNT IN FULL,
      AND THE PHASE'S OWN RESIDUE STATEMENT SAYS THERE IS ONLY ONE. The new
      mask's header enumerates what it does not reach and names exactly one
      remaining surface: the month view's gap rows and held rows. Probe P3
      finds a second. src/modules/import/ui/profile-confirmation.tsx renders
      the import preview table, and its counterparty column prints
      row.counterpartyName ?? row.counterpartyIban through maskCardNumbers
      only (:143 through :146), with the descriptor column beside it doing
      the same (:148). So for every previewed row that carries no
      counterparty name, that column is the counterparty ACCOUNT, printed
      whole, in a table cell of its own. This is not a leak this phase
      introduced, but it is a leak the phase's own enumeration denies, and
      the denial is what makes it a finding against this work: a later reader
      of mask-account-number.ts is told the month view is the residue, and
      will not look here. It matters more than the disclosed one, on the
      screen's own evidence: the comment directly above the leaking cell
      (profile-confirmation.tsx:136 through :141) records that this is "the
      screen the owner photographed", which is hazard H13.2's scenario
      stated as something that already happened once on this exact page.
      Every import passes through it.
    evidence:
      - "probe P3: grep -rn \"maskCardNumbers|maskAccountNumbers\" src/ in /home/user/wt-m3p13-haz, five call sites outside the merchants review, none of them the account mask"
      - "src/modules/import/ui/profile-confirmation.tsx:143 through :146, the counterparty column, maskCardNumbers over counterpartyName ?? counterpartyIban"
      - "src/modules/import/ui/profile-confirmation.tsx:148, the descriptor column, maskCardNumbers only"
      - "src/modules/import/ui/profile-confirmation.tsx:136 through :141, the comment recording that this screen was photographed by the owner"
      - "src/platform/ui/mask-account-number.ts, the WHERE THIS IS APPLIED note, whose RESIDUE paragraph names the month view and nothing else"
      - "src/modules/overview/ui/month-view.tsx:109, :313 and :351, the disclosed surface, for comparison"
    concrete-fix: >-
      Wrap the two import-preview cells in maskAccountNumbers exactly as
      src/modules/merchants/ui/merchant-review.tsx:84 already does:
      maskAccountNumbers(maskCardNumbers(...)) at
      profile-confirmation.tsx:143 and :148. It is a display-layer change
      only, the previewed row and the stored rawLine stay untouched, and the
      mask is already in src/platform/ui where that module may import from.
      Then correct the RESIDUE paragraph in
      src/platform/ui/mask-account-number.ts to enumerate what actually
      remains after that change (the three month-view call sites), and pin
      the enumeration with a fast-gate test of the same shape as the existing
      "the account mask is not called anywhere in the merchants domain or
      application" test, but inverted: every call site that renders
      unnormalised counterparty text must call the account mask.
  - id: HZ-M3P13-03
    severity: high
    analysis: >-
      THE REACH SENTENCE PROMISES A MONTH THE SCREEN DOES NOT HAVE. This
      phase's own reason for existing is decision D-36's question, what does
      a naming match, and the answer it puts on screen is a sentence
      containing the words "of this month" in all three languages. The screen
      has no month. Probe P4: listCountedTransactions filters on householdId
      and flow only, with no period bound of any kind; listMerchantReview
      passes no period; the route at src/app/(app)/merchants/page.tsx reads
      only the status query parameter and passes no month. So group.count,
      which the reach line renders, is the count of that counterparty's
      counted transactions across EVERY month the household has ever
      imported. With one statement imported the two readings coincide, which
      is why the fixture-driven spec asserting the number 3 passes; with two
      statements imported the sentence is simply false, and the product
      plainly supports two, since the month view compares one closed month
      against the one before it. This is declared hazard H13.6 landing: not
      that the number is a guess, it is an honest count, but that the screen
      makes a promise about a scope it does not carry, and the reader's
      trust in the number is exactly what the phase set out to buy. It is
      also the more dangerous direction of the two: the naming actually
      applies to every matching row in every month, so a reader told "this
      month" understates what they are about to do.
    evidence:
      - "probe P4: src/modules/merchants/adapters/merchant-repository.ts:320 through :330, prisma.transaction.findMany with where { householdId, flow: { in: [INCOME, SPEND] } } and no date bound"
      - "src/modules/merchants/application/merchant-review.ts, listMerchantReview takes a HouseholdContext and nothing else"
      - "src/app/(app)/merchants/page.tsx, the route reads only searchParams.status"
      - "messages/en.json groupReach, messages/nl.json groupReach, messages/fr.json groupReach, each carrying the month claim"
      - "test/e2e/identity-on-review.spec.ts asserts the English, Dutch and French sentences verbatim against a household with exactly one imported statement, so the gate cannot separate the two readings"
    concrete-fix: >-
      Change the copy rather than the read, because scoping the review to a
      month is a projection change this phase's plan does not carry and
      criterion 13.5's totals depend on the read as it is. Replace the three
      groupReach values with a sentence that states what is true of the
      screen: the naming applies to this many transactions now in the review,
      with no month word, keeping the ICU plural. Then add a fast-gate
      assertion over the three catalogues that the reach string contains no
      month token, so the claim cannot come back, and record in
      src/modules/merchants/application/merchant-review.ts that this read is
      household-wide and that any copy written against it must not name a
      period.
  - id: HZ-M3P13-04
    severity: low
    analysis: >-
      AN ACCOUNT WHOSE COUNTRY THE REGISTRY DOES NOT CARRY IS PRINTED IN
      FULL. accountSpanAt returns undefined when
      ACCOUNT_NUMBER_LENGTH_BY_COUNTRY has no entry for the two leading
      letters (mask-account-number.ts:80 through :85), and the caller then
      copies the token through unchanged. For the VALIDITY test in
      src/platform/account-number.ts that behaviour is right, because
      refusing an unknown country is what DR-0028 asks for and the cost of
      being wrong is a refused registration the owner can see. Here the cost
      of being wrong is the opposite sign: the value is shown. The registry
      is currently complete against ISO 13616 as published, so the exposure
      today is narrow, a country that joins the registry before this table is
      updated or a SEPA-adjacent code that never joins it; probe P1
      confirmed two such codes pass through whole. It is recorded low rather
      than dismissed because the failure is silent, and because the file's
      own stated rule, identify by grammar and never by shape, admits a fix
      that does not weaken it.
    evidence:
      - "src/platform/ui/mask-account-number.ts:80 through :85, the registry lookup returning undefined and the caller leaving the token untouched"
      - "probe P1: two country codes absent from the registry returned MASKED=false with the value verbatim"
      - "src/platform/account-number.ts, the pinned table and its note that a country code the table does not carry is refused"
    concrete-fix: >-
      In accountSpanAt, when the registry has no length for the country,
      fall back to a GRAMMAR test rather than to silence: consume the maximal
      run of alphanumerics allowing the separator class from HZ-M3P13-01,
      and mask it only if its length is between the registry's smallest and
      largest entries AND it satisfies ISO 7064 mod-97. That is a checksum,
      not a shape, so it cannot fire on a mandate reference, a card number
      or a phone number, and it leaves the pinned table as the fast path.
      Pin it in test/domain/identity-on-review.test.ts with an
      unregistered-country value that passes mod-97 (masked) and one that
      does not (untouched).
  - id: HZ-M3P13-05
    severity: low
    analysis: >-
      data-group-key IS EXCLUDED AS NECESSARY AND IT IS NOT NECESSARY. The
      work history's resolution of criterion 13.2 names three channels that
      must carry the unmasked account, and gives for this one that two
      accounts sharing country, check digits and last four characters would
      mask to one string and collide. That argument refutes MASKING the key,
      which is right and is hazard H13.1, but it does not establish that the
      RAW key must be the attribute's value. Every consumer of the attribute
      needs stability and uniqueness and nothing else: criterion 11.3's
      sweep compares the sequence to itself
      (test/e2e/busy-state.spec.ts:561 through :581), the optimistic-naming
      spec captures a key and uses it to re-find its own row, the client's
      claim record uses it only as half of an equality
      (src/modules/merchants/ui/naming-claims.ts isSameRow), and the new
      spec's use of it as a locator is that spec's own choice. A stable
      one-way digest of the key satisfies all four and collides no more often
      than the key does. The practical gain is small while the hidden field
      stands one element away, which is why this is low rather than medium;
      what it buys is that the account stops being in the markup of rows the
      naming form is not on, and that the excluded set shrinks from three to
      two, which is the direction a screen carrying an account should move.
    evidence:
      - "src/modules/merchants/ui/merchant-review.tsx:123 and :185, data-group-key set to maskCardNumbers(group.key), which leaves an account key untouched"
      - "test/e2e/busy-state.spec.ts:561 through :581, the criterion 11.3 sequence read, which compares the sequence to itself"
      - "src/modules/merchants/ui/naming-claims.ts, isSameRow, an equality on rowKey and direction"
      - "delivery/work-history/m3-p13.yaml, the criterion 13.2 deviation, which asserts the collision argument for this channel"
    concrete-fix: >-
      Render data-group-key as a stable digest of group.key rather than the
      key itself: a hex SHA-256 computed in the server component beside the
      existing maskCardNumbers call, so the value stays constant across
      renders of the same group, stays unique where the key is unique, and
      carries no account. Update the two specs that read the attribute as a
      value (test/e2e/identity-on-review.spec.ts, which addresses the group
      by THREE_ROW_KEY, to address it by the same digest or by a testid), and
      state at the attribute that its value is deliberately opaque so a later
      phase does not helpfully restore the key.

criteria:
  - id: "13.1"
    quote: >-
