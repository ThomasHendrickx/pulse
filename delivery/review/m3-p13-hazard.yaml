deviations-judged:
  - deviation: >-
      Criterion 13.2, "the rendered HTML of /merchants contains the masked form
      and does NOT contain the unmasked account anywhere, asserted over the
      full page source; and the hidden field the naming form submits carries
      the unmasked namespaced identity key, asserted on the same page."
    serves-plan-intent: true
    reasoning: >-
      The contradiction is real and was settled by the orchestrator before
      this lane ran; what this lane judged is the RESOLUTION, and the
      resolution serves the intent. Reporting the contradiction rather than
      quietly asserting the weaker half is the behaviour the plan wants, and
      the asserted form is genuinely strong: the sweep is over rendered
      markup rather than raw source, it removes exactly three named channels,
      and it carries two anti-vacuity assertions so it cannot pass on an
      empty clone. Two of the three exclusions are necessary and this lane
      could not refute them (attack direction A14); the third is not, which
      is recorded as HZ-M3P13-05 against the WORK rather than against the
      resolution. What the resolution does not reach, and what keeps
      criterion 13.2 unmet, is a different question from the contradiction:
      the mask itself fails open on renderings the sweep never tries
      (HZ-M3P13-01).
  - deviation: >-
      files-to-touch, which declares test/domain/ and test/e2e/ but neither
      test/application/ nor test/property/, and which declares
      src/modules/merchants/application/merchant-review.ts but not that
      module's index.ts.
    serves-plan-intent: true
    reasoning: >-
      Checked rather than accepted. The four files are exactly the ones a
      REQUIRED new field on CountedTransaction forces: three construct that
      type in a test and one re-exports ReviewGroupRow through the module's
      published interface, which is the only route the UI may import through
      under pulse-domain section 9. The diff of all four was read; none
      changes behaviour, and the alternative, an optional bookingDate, would
      have let a row reach the screen dated by nothing, which is the defect
      the repository change at merchant-repository.ts:332 exists to fix.
      Reporting it rather than amending a declaration read from the merge
      base is the right handling.
  - deviation: >-
      Step 5, "Let the transactions behind a group be seen".
    serves-plan-intent: true
    reasoning: >-
      Applying the disclosure to resolved groups as well as unresolved ones
      goes beyond what criterion 13.3 exercises, and it serves the intent
      rather than stretching it: DR-0027's accepted cost is that two purposes
      paid to one counterparty land in one group, and that cost does not stop
      applying once the group has been named. The extra surface costs no new
      client component and no new server action, and it was checked for the
      one thing it could have cost: the rows on a resolved group go through
      the same two masks as the rows on an unresolved one
      (src/modules/merchants/ui/merchant-review.tsx:84 is reached from both
      branches), so it opens no channel the unresolved case does not already
      have.

