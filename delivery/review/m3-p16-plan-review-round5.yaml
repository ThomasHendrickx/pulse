      equivalence claim, "resolves the connection it would actually use ... the
      way the command it guards resolves it", and an equivalence claim that is
      true in every case but one should name the one.

      The named precedent parses with the WHATWG URL parser, which does not
      percent-decode the username. Prisma's connection-string parser does. So a
      connection string whose username carries a percent-encoded character is
      seen by the guard as the encoded text and used by the client as the
      decoded text. The guard's extracted ref then does not equal the operator's
      bare ref, so it refuses a connection the client would have opened
      correctly.

      WHY IT IS LOW RATHER THAN HIGHER. The direction is safe: it refuses a
      legitimate target rather than approving an illegitimate one, so the harm
      is a blocked phase and a round trip rather than a migration in the wrong
      place. Nobody percent-encodes a dot on purpose. It is worth one clause
      because the failure presents as an unexplained interlock refusal, which
      M3-P16 step 5 correctly instructs the implementer NOT to work around, so
      without a note the phase blocks and the reason looks like a mystery.
    evidence:
      - |-
        Measured in this worktree with the parser the precedent uses: over a
        pooler-shaped string whose username is written with a percent-encoded
        dot, `new URL(...).username` returns "postgres%2Eabcdefghijklmnopqrst",
        the encoded form, so an extraction splitting on a literal dot finds none.
      - |-
        The same run confirms the other shapes the equivalence has to survive,
        and all of them are safe: an unencoded "@" inside the password still
        yields the correct username because the authority splits on the LAST
        "@"; a bracketed IPv6 literal host yields a host carrying no ref, which
        12.23 already refuses as unparseable; a trailing space is trimmed by the
        parser; and a single space or an empty string throws, which refuses.
      - |-
        The equivalence claim this qualifies: 12.23, "resolves the connection it
        would actually use ... shell first, and the .env file only for a variable
        the shell does not carry OR carries empty ... an interlock that resolves
        differently from the command it guards is decorative."
      - |-
        The step that turns the refusal into a stop rather than a debugging
        session: M3-P16 step 5, "If the interlock refuses, that refusal is the
        answer and not an obstacle to work around."
    concrete-edit: |-
      In delivery/plan/pulse-v02.yaml, criterion 12.23, add after the
      unparseable refusal case: "A CONNECTION WHOSE USERNAME OR HOST IS
      PERCENT-ENCODED IS DECODED BEFORE THE REF IS EXTRACTED, because the URL
      parser this guard uses does not decode those fields while the client's own
      parser does, and an interlock that compares the encoded text refuses a
      target the client would have opened correctly. A unit test asserts one
      percent-encoded username matching its bare ref." And add to M3-P16 step 5,
      beside the instruction not to work around a refusal: "a refusal whose
      cause is not obvious is recorded and raised as a finding against the phase
      that owns the interlock, not diagnosed by loosening it."
