findings:
  - id: R5-M3P12-01
    severity: high
    analysis: |-
      CRITERION 12.23 FIXES WHICH FIELD CARRIES THE PROJECT REF AND NOT HOW TO
      GET THE REF OUT OF IT, AND ONE PLAUSIBLE EXTRACTION APPROVES EVERY PROJECT
      IN THE REGION WHILE PASSING EVERY TEST THE CRITERION LISTS. This is the
      single thing standing between this plan and dispatch, and it is one
      sentence wide.

      The criterion took last round's correction and states the field per
      endpoint shape: on a session pooler the ref is in the USERNAME, on a
      direct connection inside the host. What it does not say is that the ref is
      not the whole of either field. A pooler username is the literal word
      postgres, a dot, and then the ref. A direct host is db, a dot, the ref, a
      dot, and the Supabase domain. Both require an extraction, and the
      criterion leaves both to the implementer.

      THE EXTRACTION THAT BREAKS IT IS AN OFF-BY-ONE, NOT A BLUNDER. Told the
      ref is in the username, an implementer splits the username on the dot and
      takes a side. Taking the second gives the ref. Taking the FIRST gives the
      literal word postgres, which is identical for every Supabase project that
      exists. The operator, who is a different agent in a different phase, is
      then told to pass whatever that resolver calls the ref, so the invocation
      carries a target ref of postgres, the resolver resolves postgres from any
      pooler URL whatever, and both match. The host half cannot save it, because
      the criterion itself establishes that a pooler host proves the region and
      not the project. The interlock then approves the owner's other project in
      the same region, which is hazard H12.30 exactly, and it approves it while
      reporting a confirmation line naming the target the operator gave.

      AND EVERY TEST THE CRITERION REQUIRES STILL PASSES, which is why this is a
      criterion defect and not an implementation risk. 12.23 requires a refusal
      case for "project ref mismatched with the ref in the username" and one
      matching case per endpoint shape. Under the broken convention the mismatch
      case is a username of postgres.wrongref against a given ref of rightref:
      the resolver yields postgres, postgres is not rightref, it refuses, the
      test is green. The matching case is a username of postgres.rightref
      against a given ref of postgres: it matches, the test is green. One
      implementer writes both the resolver and the tests, so the convention is
      self-consistent throughout and nothing in the phase can notice.

      THIS IS THE THIRD TIME THE SAME PATTERN HAS APPEARED AND THE PLAN HAS
      TWICE FIXED IT THE SAME WAY. The absent-value marker was fixed to the
      literal word unstamped in the plan, with the stated reason that M3-P16
      decides a terminal state by comparing against it. The two platform
      variable names were fixed to VERCEL_GIT_COMMIT_SHA and VERCEL_ENV in the
      plan, with the stated reason that a wrong name is invisible to a test that
      sets whatever the handler reads. A value that one phase produces and
      another phase must pass on a command line is the same shape a third time,
      and it is the one with a safety consequence rather than a coordination
      one.
    evidence:
      - |-
        The criterion names the field and stops there: 12.23, "THE REF IS READ
        FROM WHICHEVER FIELD CARRIES IT ... on a session pooler the ref is in
        the USERNAME and the host is regional pooler infrastructure shared by
        every project in that region, and on a direct connection the ref is
        inside the host and the username carries none."
      - |-
        The field is not the ref, measured with the parser the named precedent
        uses. Run in this worktree over a pooler-shaped string, `new URL(...)`
        returns username "postgres.abcdefghijklmnopqrst", not the ref; over a
        direct-shaped string it returns host "db.abcdefghijklmnopqrst.supabase.co"
        and username "postgres". Each field carries the ref plus fixed
        decoration, so each needs an extraction the criterion does not state.
      - |-
        The decoration is identical across projects, which is what makes the
        wrong half dangerous rather than merely wrong: every Supabase pooler
        username begins with the same literal word, and every direct connection
        username IS that word.
      - |-
        The host cannot compensate, by the criterion's own finding: "THE HOST
        MATCH IS NEVER SUFFICIENT ALONE ... on the endpoint this routine must
        use a matching host proves the REGION and not the project, and an
        interlock that approves on host alone approves every project the owner
        has in that region."
      - |-
        The test list cannot catch it: 12.23 requires "project ref mismatched
        with the ref in the username, project ref mismatched with the ref in the
        host, and a connection carrying no ref in either field ... plus one
        matching case PER ENDPOINT SHAPE that proceeds". All of them are written
        by the implementer against the implementer's own convention.
      - |-
        The precedent for the fix exists twice in the same plan and was applied
        in the last two rounds: M3-P17 step 2 fixes the marker "BY THIS PLAN AND
        NOT CHOSEN BY AN IMPLEMENTER", and M3-P17 step 1 TWO fixes the variable
        names for the same reason.
      - |-
        The hazard it leaves open is the one the whole interlock exists for:
        H12.30, "an invocation made with whatever the environment happens to
        hold writes a migration into a database nobody named".
    concrete-edit: |-
      In delivery/plan/pulse-v02.yaml, criterion 12.23, replace "THE REF IS READ
      FROM WHICHEVER FIELD CARRIES IT, and this criterion says where rather than
      leaving it to an implementer, because the two endpoint shapes put it in
      different places: on a session pooler the ref is in the USERNAME and the
      host is regional pooler infrastructure shared by every project in that
      region, and on a direct connection the ref is inside the host and the
      username carries none." with:

      "THE REF IS READ FROM WHICHEVER FIELD CARRIES IT, AND THIS CRITERION FIXES
      BOTH THE FIELD AND THE EXTRACTION, because a field is not a ref and an
      implementer left to split one will sometimes take the wrong half. On a
      SESSION POOLER the ref is in the USERNAME, which is the literal word
      postgres, a dot, and then the ref: the ref is the part AFTER the first
      dot, and the host is regional pooler infrastructure shared by every
      project in that region. On a DIRECT CONNECTION the ref is inside the HOST,
      which is db, a dot, the ref, a dot, and the provider domain: the ref is
      the second dot-separated label, and the username carries no ref at all,
      being the same literal word for every project. THE VALUE THE OPERATOR
      PASSES IS THE BARE REF AND NEVER A DECORATED FIELD, so the same argument
      is correct against either endpoint shape, and a resolver whose extracted
      value is equal for two different projects does not meet this criterion
      whatever its tests say. A unit test asserts that the extracted value
      DIFFERS for two invented connection strings of the same shape that differ
      only in their ref, one per shape, which is the assertion that fails a
      resolver taking the fixed half."

      Add to M3-P16 step 5, so the operator in the consuming phase is written
      against the same value: "the target ref given on the command line is the
      BARE project ref that criterion 12.23 fixes, never a username, a host or
      any decorated form of it."
  - id: R5-M3P12-02
    severity: high
    analysis: |-
      CRITERION 12.23 POSTDATES THE IMPLEMENTATION IT WILL BE JUDGED AGAINST,
      AND NOTHING IN THE PHASE RECORDS THAT. M3-P12's implementation is merged
      on an implementer branch and under clean-room re-review as this is
      written, against the plan as it stood WITHOUT 12.23. The criterion was
      added afterwards. Nothing anywhere in M3-P12 says so.

      WHAT A REVIEW LANE DOES WITH THAT. A clean-room reviewer's contract is to
      walk every acceptance criterion of the phase and report each met or not
      met, and the verdict schema forbids counting an unevaluable criterion as
      met. That reviewer reads the plan it is handed, walks 12.23, greps for
      src/platform/db/target-guard.ts, finds nothing, finds no target arguments
      in the routine, and reports 12.23 NOT MET. That report is correct and it
      is also indistinguishable, to everyone downstream, from a report that an
      implementer skipped a criterion it was given. The implementer never saw
      it. There is no artefact anywhere that lets the next reader tell those two
      apart.

      THIS IS THE SHAPE THAT STARTED THIS THREAD, ARRIVING FROM THE OTHER SIDE.
      Finding CR-M3P12-05 was a criterion no implementer of the phase could
      satisfy because the artefact it required could not exist while the phase
      was open. This is a criterion no implementer of the phase DID satisfy
      because it did not exist while the phase was open. In both cases the plan
      asks a review to judge an implementation against a bar the implementation
      could not have been built to, and in both cases the repair is to say so in
      the plan rather than to let a lane discover it as a defect.

      THE RELOCATION ITSELF WAS RIGHT, and this finding is not an argument
      against it. Round four asked for the argument half in M3-P12 and the
      matcher in M3-P17. The fix round refused that split, on the ground that a
      half-guard in one phase plus a matcher in another leaves two versions of
      the same refusal to reconcile. That reasoning is correct and I withdraw
      the edit: two refusal paths for one question is how a guard acquires a
      second answer, the second answer is the one nobody tests, and the whole
      interlock exists because a partial answer was treated as an answer.
      Shipping it whole in the same merge as the routine is better than what I
      proposed. What the relocation needs is the note that it happened late.
    evidence:
      - |-
        The criterion is new in this revision and nothing else in the phase
        moved with it: comparing the plan at the previous review commit against
        this one, M3-P12's acceptance gained exactly 12.23 with every
        pre-existing criterion byte-identical, hazard-classes gained exactly
        H12.30 with every pre-existing statement byte-identical, and the steps
        gained one entry by pure insertion at position 7 with all twelve
        pre-existing step texts unchanged.
      - |-
        The phase carries no acknowledgement of the timing. Searched the whole
        of M3-P12 for "mid-flight", "in-flight", "in flight", "postdates",
        "added after", "fix round", "re-review", "already built", "not yet
        built" and "later than": no match on any of them.
      - |-
        The criterion requires artefacts the in-flight implementation cannot
        contain: 12.23 requires the assessment module, the two target arguments,
        the refusal-before-any-repository-call test with a call-recording fake,
        and per-shape matching tests. M3-P12's files-to-touch and extras gained
        src/platform/db/, test/db/, src/platform/db/target-guard.ts and
        test/db/target-guard.test.ts in this same revision.
      - |-
        The contract the lane runs under forbids the graceful outcome: the
        verdict schema's own comment records that a review "cannot count an
        unevaluable criterion as met", and the criteria walk requires one entry
        per acceptance criterion with a met-or-not-met verdict.
      - |-
        The precedent for how this plan handles a superseded expectation exists
        and is a parked entry: the register already carries an item recording a
        dispatch criterion as SUPERSEDED with the instruction that "A phase
        review evaluating M0-P4 against its own dispatch should mark criterion 6
        SUPERSEDED and read this entry, not mark it met."
    concrete-edit: |-
      In delivery/plan/pulse-v02.yaml, append to criterion 12.23: "THIS
      CRITERION WAS ADDED AFTER THIS PHASE'S IMPLEMENTATION WAS BUILT, and it
      says so rather than letting a review lane discover it as a defect: the
