findings:
  - id: HZ-M3P18-01
    severity: high
    analysis: >-
      The migration's SQL expression is not the mirror of
      canonicalAccountNumber its own comment declares it to be, and the
      divergence turns the phase's central remedy into a new lockout for
      exactly the households it exists to let back in. The platform
      canonical form strips every character JavaScript \s matches
      (src/platform/account-number.ts:67); the committed SQL strips the
      POSIX class [[:space:]] (the migration at
      prisma/schema/migrations/20260827120000_canonical_account_iban_backfill/migration.sql:53,
      the detection grouping at scripts/detect-account-collisions.ts:77,
      and the reserves join it inherited the class from). Witnessed live
      on Postgres 16.13 with a C.utf8 database: the SQL class does not
      match U+00A0, U+202F or U+FEFF, all three of which the platform
      function strips. U+00A0 is not exotic here: it is the single byte
      0xA0 in Windows-1252, the encoding the domain skill names as common
      for Belgian exports, and the narrow variant U+202F is the standard
      French-locale group separator, so a pre-P14 stored rendering
      carrying one is exactly the population this migration was written
      for. For such a household the phase makes things strictly WORSE
      than the head it builds on, witnessed end to end with the repo's
      own functions: the migration leaves the stored value at its SQL
      fixed point still carrying the character (UPDATE matched nothing,
      idempotently, on both runs), the import lookup canonicalises its
      probe and exact-matches the stored column
      (src/modules/accounts/adapters/account-repository.ts:114), so the
      statement is still refused as account-not-registered, closing
      nothing of finding P14-001 for them; and the one workaround that
      existed before this phase, retyping the number canonically at
      setup, is now REFUSED by the phase's own canonical duplicate check
      (src/modules/accounts/application/register-accounts.ts:60 and :64
      canonicalise both sides with the TS function, which says the two
      renderings are the same account). Refused as a duplicate on the
      typed side, unmatched on the import side: a full lockout with no
      remedy any screen names. The detection script cannot see it either,
      witnessed against the seeded cluster: a household holding the
      U+00A0 rendering beside its compact twin, rings disagreeing, is one
      account to the application layer (deriveDeclaredSets and the
      register check) and two unrelated rows to the script's SQL
      grouping, so the post-deploy check reports no collision while the
      exact harm hazard class H18.6 names, which row future imports land
      on deciding held versus counted, is live in that household. The
      criteria cannot catch any of this: criterion 18.4 pins mirror
      agreement over every rendering THE SEED HARNESS writes, and every
      rendering the harness writes is spaced with ASCII spaces only
      (test/e2e/seed-pre-phase-household.ts:55 through :111), so the
      mirror-agreement arm (test/e2e/canonical-backfill.spec.ts:201) is
      green over a character set on which the two expressions happen to
      agree. Clause R-087 attaches to the migration comment's sentence
      that the expression is an SQL mirror of canonicalAccountNumber
      (migration.sql:17) and to the sibling list's claim that the mirrors
      agree by test (src/platform/account-number.ts:55): both state an
      equivalence that is false as stated and untested where it is false.
    evidence:
      - >-
        Live probe P2: a psql VALUES sweep over twelve characters against
        regexp_replace with [[:space:]] on the throwaway PG 16.13
        (C.utf8), beside the same sweep through String.replace with \s in
        node. SQL retains U+00A0, U+202F, U+FEFF and U+200B; JS strips
        all but U+200B. Commands and full output captured in this lane's
        session at run time.
      - >-
        Live probe P3/P4: the committed migration.sql run twice via psql
        over nine seeded households; the U+00A0-spaced rendering was left
        untouched by both runs while every ASCII rendering outside the
        collision pairs was canonicalised, and the second run updated
        zero rows with a byte-identical dump.
      - >-
        Live probe P5 via npx tsx against src/platform/account-number.ts:
        the U+00A0 rendering passes accountNumberProblem, its TS
        canonical equals the compact form, the migrated stored value does
        not equal the canonical probe, and a set built the way
        register-accounts.ts:60 builds it refuses the canonical retype.
      - >-
        Live probe P6: the grouping SQL of
        scripts/detect-account-collisions.ts:77 run verbatim emits the
        ASCII collision groups and not the U+00A0-beside-compact
        household.
      - >-
        The blindness of the committed test: every iban the harness
        writes at test/e2e/seed-pre-phase-household.ts:55, :67, :87, :94,
        :104 and :111 uses ASCII spaces or none, and the mirror arm at
        test/e2e/canonical-backfill.spec.ts:201 iterates exactly those.
    concrete-fix: >-
      Make the SQL strip exactly what the platform function strips, in
      all three SQL sites, and make the harness prove it where it was
      blind. Concretely: replace the class [[:space:]] in the migration,
      in scripts/detect-account-collisions.ts and in the reserves join
      with a bracket expression that unions the POSIX class with the
      JavaScript-only whitespace characters, written with Postgres ARE
      escapes so the source stays visible: the class opening bracket,
      then the POSIX space class, then backslash-u00A0,
      backslash-u1680, backslash-u2000 through backslash-u200A as a
      range, backslash-u2028, backslash-u2029, backslash-u202F,
      backslash-u205F, backslash-u3000 and backslash-uFEFF, then the
      closing bracket; pin the exact set to the ECMAScript WhiteSpace
      plus LineTerminator list the JavaScript class is defined over,
      and mind the template-literal escape lesson at the reserves join
      site, where a backslash must be doubled to survive JavaScript
      string processing. Add to the seed harness one rendering spaced with
      U+00A0 and one carrying U+202F, allow-listed with provenance, so
      the mirror-agreement arm and the door-opens arm actually traverse
      the divergent characters; assert the detection script sees a
      U+00A0-beside-compact pair as one collision group. Since a new
      migration file rather than an edit is the deployable form once the
      original has shipped anywhere, deliver the corrected class as a
      follow-up migration with the same collision guard, and correct the
      two false mirror sentences (migration comment and
      account-number.ts sibling list) in the same change.
  - id: HZ-M3P18-02
    severity: high
    analysis: >-
      Removing the savings-ring refusal opens a one-way trap that did
      not exist before this phase: a household that answered a CURRENT
      account as savings at setup, one wrong dropdown on the setup
      screen, now has that mistake made permanent by the first upload
      instead of being pointed at the fix. Before this phase the upload
      was refused account-in-savings-ring and the refusal message named
      the ring correction; the correction itself, changeAccountRing, is
      guarded by a refusal of any account carrying own imported rows
      (src/modules/accounts/application/change-account-ring.ts:45
      returning account-has-own-rows at :46), and the import refusal was
      precisely what kept that guard satisfiable, because a reserve-ring
      account could never acquire own rows. This phase removes the
      refusal (src/modules/import/application/confirm-import.ts:118
      through :124) and touches neither the guard nor its justifying
      comment. The chain is short and every link is in the head: confirm
      accepts the statement onto the reserve-ring account, ingestRows
      writes its rows as transactions on that account, hasImportedRows
      is flow-agnostic
      (src/modules/ledger/adapters/ledger-repository.ts:148), so the
      ring correction is refused from the first confirm onward, forever.
      The household's real spending month is silently empty, its rows
      rendered as held under a savings heading with copy telling the
      reader they are no part of income or spend, and the only control
      that could make them count is permanently closed with no remedy
      any screen names; nothing at confirm time warns that the ring
      decides counting, and no criterion of this phase exercises a
      ring-corrected account, so the phase passes its contract with the
      trap armed. The guard's own stated rationale no longer holds and
      states a falsehood besides, which clause R-087 makes a finding in
      its own right: change-account-ring.ts:7 justifies the guard's
      sufficiency with the sentence that savings statements are not
      imported in v1, the exact sentence DR-0030 superseded, and the
      phase corrected that sentence in the domain skill and in
      ledger-transaction.ts but not here, in the one place where it is
      load-bearing for a refusal. Under the guard's own reasoning at
      change-account-ring.ts:12 through :16, a stale flow is what the
      guard exists to make unreachable, and a held row carries NO flow,
      so a reserve-to-pot correction over held rows is safe by that very
      argument: the guard is now stricter than its rationale and the
      strictness is the trap.
    evidence:
      - >-
        The accept arm with no ring test:
        src/modules/import/application/confirm-import.ts:118 through
        :124, with ingest at :153 writing rows on the resolved account.
      - >-
        The guard and its false justification:
        src/modules/accounts/application/change-account-ring.ts:45 and
        :7 (the sentence that savings statements are not imported in v1,
        superseded by DR-0030 in this same phase).
      - >-
        hasImportedRows counts any transaction row regardless of flow:
        src/modules/ledger/adapters/ledger-repository.ts:148 through
        :152.
      - >-
        The phase corrected the equivalent sentence elsewhere
        (src/modules/ledger/domain/ledger-transaction.ts:35 through :41
        and the domain skill), which shows the correction pass ran and
        missed the one load-bearing site; change-account-ring.ts appears
        nowhere in the diff at 85da7f6 (git diff origin/main...HEAD name
        listing).
    concrete-fix: >-
      Relax the guard along its own rationale: in changeAccountRing,
      refuse only when the account carries own rows THAT HOLD A FLOW
      (replace hasImportedRows with a hasInterpretedRows read testing
      flow IS NOT NULL on the account's rows), so a reserve-to-pot
      correction over held rows is allowed and the recompute that
      already follows at change-account-ring.ts:54 classifies the
      newly-pot rows from facts plus declarations; the pot-to-reserve
      direction keeps the strict refusal, because those rows carry
      flows. Correct the comment at change-account-ring.ts:4 through :16
      to the DR-0030 world in the same change, and add one application
      test walking the trap: register reserve by mistake, confirm the
      account's own statement, change the ring to pot, assert the change
      succeeds and the recomputed month counts the rows. If the fix
      round prefers not to touch the guard, the minimum honest change is
      a confirm-time interstitial naming the ring before first ingest
      onto a reserve-ring account, but that leaves the guard's false
      comment standing and D-51's correction unreachable for a real
      mistake, so the guard change is the fix this finding demands.
  - id: HZ-M3P18-03
    severity: low
    analysis: >-
      A savings import can never leave the INGESTED status. The
      INGESTED-to-INTERPRETED flip happens only inside
      replaceInterpretation for imports whose rows entered the
      interpretation window
      (src/modules/ledger/adapters/ledger-repository.ts:252 over the ids
      collected at src/modules/ledger/application/interpret-window.ts:156),
      and a savings import's rows never enter the window, so its status
      is terminal at INGESTED. No current surface renders the
      difference, which is why this is low, but the codebase documents
      INGESTED as the pipeline's visible needs-interpretation marker
      (src/modules/import/adapters/import-repository.ts:302 through
      :303), so the state machine now carries a permanently-pending
      state that its own comments say means work is owed, and the first
      future consumer that acts on that meaning, a re-parse sweep, a
      pending-work badge, a retry loop, will act on every savings import
      forever. Clause R-087 applies to the marker comment the moment
      DR-0030 landed.
    evidence:
      - >-
        src/modules/ledger/adapters/ledger-repository.ts:246 through
        :253 flips only imports in interpretedImportIds;
        interpret-window.ts:156 derives those from the pot-window
        transactions; a savings import's id is never among them, while
        confirm-import.ts:173 runs interpretation for every accepted
        import including a savings one.
      - >-
        src/modules/import/adapters/import-repository.ts:302 through
        :303 documents INGESTED as the visible needs-interpretation
        marker that reinterpretation restores to INTERPRETED.
    concrete-fix: >-
      Decide the terminal status explicitly: either flip a held import
      to INTERPRETED in the same transaction that ingests it when the
      target account's ring is savings (interpretation of a held import
      is vacuously complete), or amend the status-machine comments at
      import-repository.ts:302 and the enum's documentation to record
      that INGESTED is terminal for savings imports, and add one unit
      test pinning whichever meaning is chosen so the first
      pending-work consumer meets a tested contract instead of a stale
      comment.
  - id: HZ-M3P18-04
    severity: low
    analysis: >-
      For the parked collision pair whose rings disagree, the refusal
      removal changes the failure mode from a named refusal to a silent
      hold, and nothing on any screen names the pair. The import lookup
      exact-matches the canonical probe against the stored column, so
      for a spaced-beside-compact pair every statement upload
      deterministically lands on the COMPACT member (witnessed in this
      lane's cluster: only the compact stored form equals the canonical
      probe). Where the compact member is the reserve-ring row, the
      household's current-account statement, refused with a named
      reason before this phase, is now accepted and held: counted
      nowhere, flagged nowhere as a gap (the uninterpreted count is
      pot-scoped by design), visible only as a held block under the
      other row's label. Criterion 18.5 measures the pair
      migration-relative (imports behave after the migration exactly as
      before it), which is satisfied; phase-relative the pair's owner
      lost the named refusal that was the only signal pointing at the
      duplicate registration, and the committed detection script runs
      only when an operator runs it. Low because the pair requires a
      pre-P14 double registration, the held block is at least visible
      on screen, and the phase explicitly parks the merge; recorded
      because the criteria's no-worse-off framing hides a real
      signal-for-silence trade this phase made without naming it.
    evidence:
      - >-
        Probe P3: in the seeded pair household only the compact stored
        form equals the canonical probe, so resolution is deterministic
        onto the compact member; with that member reserve-ringed the
        upload is accepted and held under confirm-import.ts:118 through
        :124 where before the phase it returned the named refusal.
      - >-
        The pot-scoped uninterpreted count at
        src/modules/overview/adapters/overview-repository.ts:257 means
        the held rows raise no gap and hold no verdict open, by design,
        so no counting surface signals the situation.
    concrete-fix: >-
      Record the trade where the operators will meet it: the work
      history names one run of the detection script as the post-deploy
      check; extend that recorded procedure to state that a
      rings-disagreeing pair now manifests as silently held statements
      rather than a refusal, so the script run is not optional after
      deploy. If a later phase adds any surface listing a household's
      accounts with their rings, list both members of a detected pair
      there; the merge itself stays parked as the phase decided.
