findings:
  - id: HZ-001
    severity: medium
    evidence:
      - >-
        Probe-executed (esbuild bundle over the phase head, node v26.7.0).
        Construction 1, fabricated row: a transaction whose description
        block contains a line in the exact transaction-start shape with a
        zero amount parses OK with gate green: rows=2, the fabricated row
        stores amountCents 0 and sequenceNumber 0099, and the true row's
        description is truncated at the injected line. Construction 2,
        dropped row: a genuine zero-amount transaction whose start line is
        corrupted (glued sequence and date) vanishes silently, parse OK,
        rows=1. Construction 3: two corrupted rows of plus 5,00 and minus
        5,00 both vanish silently (compensating pair), parse OK.
        Construction 4: a description line in the exact SALDO OP balance
        shape closes the open block, silently truncating the stored
        description and rawLine while the gate stays green.
      - >-
        Mechanism: src/modules/import/domain/belfius-current-account-template.ts:56
        matches any full line in the transaction-start shape, line 54
        matches any full line in the balance shape, and lines 117 to 163
        run these matchers over description lines inside an open block;
        lines 158 to 162 silently ignore lines outside any block. The gate
        at src/modules/import/domain/parse-pdf-statement.ts:56 compares
        sums only, so any construction that changes the sum by zero passes.
      - >-
        Key poisoning consequence, probe-executed: the fabricated row's
        dedup key equals the natural key of a genuine future transaction
        with the same booking year and sequence (the nat key built at
        src/modules/import/domain/dedup.ts:95), so ingest's insert-ignore
        would report that genuine row as known and never store it: a
        silently missing real amount in a later month, which the later
        file's own balance gate cannot catch because the drop happens at
        dedup, not at parse.
      - >-
        False claim, R-087: the comment at
        src/modules/import/domain/parse-pdf-statement.ts:8 states a
        template that drops or duplicates a line fails loudly instead of
        feeding a silently wrong fact into the ledger. The three
        constructions above are drops and a fabrication that pass
        silently; the claim holds only for sum-changing errors.
      - >-
        Reachability caveat, stated honestly: the constructions were
        demonstrated at reconstructed-line level. Whether a real Belfius
        rendering can place a free-form payment communication on its own
        visual line in the exact start-line shape (including the VAL.
        parenthesis and a trailing signed zero amount) was not witnessed
        on the single real statement; payment communications are
        counterparty-controlled text, so the vector is adversarial rather
        than accidental.
    concrete-edit: >-
      Add a second structural gate to the Belfius template (or the shared
      path): within one file, require the parsed sequence numbers to be
      strictly increasing, and fail the parse loudly on any violation; the
      fleet's own format facts record consecutive sequences on the real
      statement (notes/export-format-facts.md:69 in the fleet home). This
      closes constructions 1 to 3: a fabricated mid-block sequence breaks
      monotonicity and a dropped row leaves a gap. Close construction 4 by
      treating a balance line while a block is open as a structure error
      (the real layout carries balances only outside blocks). Correct the
      overbroad comment at src/modules/import/domain/parse-pdf-statement.ts:8
      to name the zero-sum residue explicitly.
    analysis: >-
      The balance contract is the phase's central safety claim (hazard
      H2.2) and it is genuinely strong against everything that changes the
      sum; these probes are the honest boundary of what it holds. The
      worst chain is fabrication plus natural-key poisoning, because it
      converts a crafted description in one statement into a silently
      missing real transaction in a later one.
  - id: HZ-002
    severity: medium
    evidence:
      - >-
        Probe-executed: parsing the committed Belfius fixture under a
        declared spec with templateVersion 999 succeeds and produces
        byte-identical output to templateVersion 1, though no such
        template version exists. The registry lookup matches id only
        (src/modules/import/domain/pdf-template.ts:76), the shared path
        receives only the id (src/modules/import/domain/parse-pdf-statement.ts:40,
        called from src/modules/import/adapters/statement-parser.ts:80
        which discards spec.templateVersion), so the stored version is
        validated at the Json boundary
        (src/modules/import/domain/source-profile.ts:125) and then never
        consulted again.
      - >-
        Probe-executed: specEquals between the version 1 and version 999
        specs is false (canonical JSON,
        src/modules/import/domain/source-profile.ts:270), so when a future
        template bumps its version, detect emits the new version,
        findProfileBySpec at
        src/modules/import/application/upload-statement.ts:125 stops
        recognising the stored profile, the owner is re-asked the ask-once
        declaration, and a twin profile row is created.
      - >-
        Corruption path when a version bump changes row emission: the
        fix-profile re-parse
        (src/modules/import/application/fix-profile.ts:125) parses stored
        rawContent through the CURRENT template code regardless of the
        stored version. A rawLine-shape change throws loudly there, but a
        key-emission change (for example a different statementNumber rule)
        rewrites every stored dedup key through the sanctioned applyReparse
        with an unchanged spec, breaking the unchanged-spec no-op contract
        with no signal, because the field that exists to witness code
        identity is inert.
    concrete-edit: >-
      In parsePdfStatement (or the adapter branch at
      src/modules/import/adapters/statement-parser.ts:70), compare
      spec.templateVersion against the registry template's version and
      refuse a mismatch loudly with the existing unknown-template error
      shape extended with the version, so a future version bump makes
      stored pdf-layout profiles fail closed until a deliberate migration
      is written; document the bump procedure next to the registry.
    analysis: >-
      Today only version 1 exists, so nothing is wrong at this head; the
      finding is that the versioning mechanism the spec design names is
      shipped inert, and the first future bump silently changes what
      stored imports re-parse to. Fail-closed is cheap now and impossible
      to retrofit silently later.
  - id: HZ-003
    severity: low
    evidence:
      - >-
        The extraction adapter catches every throwable including the
        dynamic module load
        (src/modules/import/adapters/pdf-text-extractor.ts:37 inside the
        try opened at line 33, catch at line 72), and detect maps any
        extraction failure to layout-unsupported
