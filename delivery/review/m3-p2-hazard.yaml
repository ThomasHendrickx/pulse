findings:
  - id: HZ-001-R
    severity: low
    evidence:
      - >-
        Probe-executed at 22f717b (esbuild bundle, node v26.7.0). Residue
        construction, exactly as the implementer declared: a corrupted
        margin-level line in the exact transaction-start shape positioned as
        the VERY FIRST transaction (before any block opens) with a zero
        amount drops silently. Result: ok=true, rows=1, only the second
        (genuine) transaction is stored; the first transaction and its
        indented description lines vanish, and the balance gate stays green
        because the dropped amount is zero.
      - >-
        Mechanism: belfius-current-account-template.ts:206 to 214 treats a
        margin line that matches no structure as an unrecognized-line error
        only when a block is OPEN; before the first block it falls through to
        the furniture branch (the holder block legitimately sits at the
        margin above the band line) and is ignored. The sequence-continuity
        gate (lines 219 to 233) checks only that PARSED sequences are
        internally consecutive, so it has no anchor for a missing FIRST
        sequence: a dropped 0001 leaves 0002, 0003, ... internally
        consecutive and passes. The residue is bounded to the conjunction
        first-transaction position AND margin-level extraction corruption
        matching no structure AND exactly-zero amount.
      - >-
        Reachability, judged honestly: this is not adversarially reachable.
        Counterparty-controlled description text is INDENTED and therefore
        classified as data (probe FV1), so statement content cannot trigger
        it; it requires a genuine PDF extraction corruption that mangles
        specifically the first transaction's start line while leaving it at
        the margin and preserving the surrounding structure, and only bites
        when that transaction carries a zero amount. On a well-formed bank
        PDF extraction is deterministic and complete (the real 39bada64
        statement parses all 39 rows and reconciles), so the residue never
        fires in normal operation.
      - >-
        The limitation is DOCUMENTED, not hidden
        (belfius-current-account-template.ts:43 to 47 and
        parse-pdf-statement.ts:21 to 23), which is the honest disposition;
        note that the runtime still drops silently in this corner, so
        "documented" describes the comment, not a loud runtime.
    concrete-edit: >-
      Accept as a tracked low with the bound above (DR-0012 condition 2), OR,
      if closing it is wanted, anchor the sequence-continuity gate to the
      statement's expected first sequence rather than only to internal
      consecutiveness: the opening context of a Belfius statement carries the
      prior closing state, so the first parsed sequence can be checked
      against an expected start, which also catches a dropped first row of
      any amount. The tradeoff to weigh first is that the holder block
      legitimately sits at the margin before the band line, so a
      pre-first-block margin line matching no structure cannot simply be made
      an error without a way to tell holder furniture from a corrupted first
      row.
    analysis: >-
      This is the one remaining silent facts-drop path and it is genuinely
      narrow: not adversarially reachable, no key poisoning (a drop
      fabricates no key), and invisible only in the first-position
      zero-amount corner that a well-formed statement never reaches. It is a
      low, and the fix round declared it openly rather than leaving it for
      the review to find, which is the behaviour the claim-grep discipline
      wants.
