        own record shows the consequence live: while pdfjs-dist was
        bundled, every PDF upload failed layout-unsupported in the dev
        server (the rationale comment at next.config.ts:7). A future
        serverExternalPackages regression therefore fails loudly per
        import but under a reason that tells the owner the bank layout is
        unsupported, which reads as bank drift, not build breakage.
        Reproduced during this review: a probe harness whose module
        resolution broke reported both real uploads layout-unsupported.
      - >-
        Probe-executed labelling nit: a constructed non-Belfius document
        carrying the fingerprint string and a balance line matches the
        fingerprint (matches-anywhere includes,
        src/modules/import/domain/belfius-current-account-template.ts:236)
        and then fails page structure; the upload maps that pdf-structure
        error to unparseable
        (src/modules/import/application/upload-statement.ts:31), while a
        cleanly unrecognised PDF reports layout-unsupported. Zero rows are
        written in both cases.
    concrete-edit: >-
      Separate infrastructure failure from format failure: let the
      extraction adapter rethrow (or return a distinct error kind for)
      module-load failures so they surface as a server error with a stack
      rather than as layout-unsupported, keeping the Result path for
      corrupt bytes only; optionally map a fingerprint-matched
      pdf-structure failure at upload to layout-unsupported rather than
      unparseable so the two user-facing reasons track their translated
      meanings.
    analysis: >-
      No facts corruption is reachable (zero rows on every path), so this
      is diagnosability, not integrity: the criterion 2.8 deploy check
      catches a regression shipped today, but only because a human runs
      it; the failure reason itself points away from the cause.
