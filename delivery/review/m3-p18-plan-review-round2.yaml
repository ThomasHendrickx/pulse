findings:
  - id: R2-M3P18-01
    severity: low
    evidence:
      - >-
        Step 5 specifies the detection script's selection as "lists every
        household's rows whose stored number is not its canonical form,
        paired by shared canonical form, by row id and nothing else".
      - >-
        The seeded pair the script must name is "one spaced as the
        delimited parse stores a cell and one compact" (step 2 and
        criterion 18.5): the compact member's stored string IS its
        canonical form, so it is outside the stated selection, and a
        script implementing the sentence as written outputs ONE row id
        over the seeded household while criterion 18.5 asserts the output
        is "exactly the pair's two row ids".
      - >-
        The same holds for the post-deploy run the work history owes:
        after the backfill, every non-pair row is canonical, and each
        surviving pair consists of one non-canonical member and one
        canonical member, so the not-canonical filter can never emit a
        complete pair.
    analysis: >-
      Self-correcting at build time, which is why it is low: the slow-gate
      assertion reddens on the one-row output and forces the correct
      implementation, a grouping of ALL of a household's rows by canonical
      form emitting groups larger than one. But the criterion is the
      measure and the step is the instruction, and an instruction the
      measure contradicts costs the implementer a red run to discover.
      Carried into the implementer's brief as work if not fixed in the
      dispatch edit.
    concrete-edit: >-
      In step 5, replace "lists every household's rows whose stored number
      is not its canonical form, paired by shared canonical form, by row
      id and nothing else" with "groups every household's rows by the
      canonical form of their stored number and lists each group of two or
      more, by row id and nothing else, which is the only selection that
      emits BOTH members of a pair whose compact member is already stored
      canonically".
  - id: R2-M3P18-02
    severity: medium
    evidence:
      - >-
        Step 5 and criterion 18.5 cite scripts/rederive-merchant-rules.ts
        as the precedent for the new detection script. That script's guard
        wiring imports the machinery the just-merged descope text
        withdraws: assessRederiveTarget from @/platform/db/target-guard
        (scripts/rederive-merchant-rules.ts:127) and noteInterlockApproved
        from @/platform/db/runtime-target (:128).
      - >-
        Criterion 12.23 as merged names those modules as leaving:
        "src/platform/db/target-guard.ts, src/platform/db/runtime-target.ts,
        src/platform/db/gate-target.ts and
        src/platform/db/connection-string.ts leave the branch together
        with their tests under test/db/", with only guard.ts's own
        contract, assessNonProductionDbTarget, assertTargetAllowed, the
        two hatches and resolve-env.ts staying, plus a grep-shaped pin
        that no file under src or scripts other than resolve-env.ts opens
        a .env file by name.
      - >-
        M3-P18's only wiring instruction for the new script is "runnable
        against any target the db guard admits". It does not say which
        half of the precedent to copy, and the precedent's visible
        structure is the withdrawn half: an implementer copying it makes
        detect-account-collisions.ts a THIRD consumer of target-guard and
        runtime-target, which either breaks when 12.23's removal lands or
        strands the removal, and 12.23's removal enumeration, written
        before this script existed, names only guard.ts and client.ts as
        register consumers to clean.
    analysis: >-
      A cross-lane coupling created by the fix round itself, since the
      script and the withdrawal merged within two commits of each other
      and neither text knows the other. The right wiring is available and
      cheap to name: the surviving contract is sufficient for a read-only
      script (resolution through resolve-env.ts, the non-production
      assessment and its hatch at client construction). One sentence in
      the plan keeps the implementer off the precedent's dead half; left
      unsaid, it is a latent build break in whichever of the two lanes
      merges second. Carried into the implementer's brief as work if not
      fixed in the dispatch edit.
    concrete-edit: >-
      In step 5, after "runnable against any target the db guard admits",
      add: "Its guard wiring follows the SURVIVING contract criterion
      12.23 keeps, not the precedent's: it resolves DATABASE_URL and
      DIRECT_URL through src/platform/db/resolve-env.ts, is admitted or
      refused by the client's own assessNonProductionDbTarget and the
      PULSE_ALLOW_REMOTE_DB_IN_DEV hatch, and imports NOTHING from
      target-guard.ts, runtime-target.ts, gate-target.ts or
      connection-string.ts, the modules criterion 12.23 sends off the
      branch, so the withdrawal does not strand on a third consumer; the
      rederive precedent is cited for the script's read-only shape and
      committed home, not for its target-interlock wiring, which predates
      the withdrawal."
