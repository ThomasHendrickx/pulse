  - id: CR2-M3P11-01
    severity: medium
    evidence:
      - "NEW IN ROUND TWO, and it is a half that WEAKENED against an assertion round one witnessed green. Criterion 11.7(e) requires the merchants client leaf to import nothing outside src/platform/ui/ and React. At ec4779d src/modules/merchants/ui/merchant-row.tsx:44 through :57 imports ./notice-queue and ./naming-claims, two sibling modules in the merchants ui folder."
      - "THE DESIGN IS RIGHT AND THE LETTER IS WRONG. Both new modules are pure and carry no import statement at all, so the leaf import closure re-walked at depth is still free of every forbidden path and of next-intl. Their extraction is what lets the fast gate exercise criterion 11.5s claim rules without a browser, which is the single most valuable thing in this delta given that no browser gate can run. Putting them under src/platform/ui instead would break the platform placement test, since they know what a merchant group and a direction are."
      - "THE RECORD IS THE ACTUAL DEFECT. The work history claim C-11.7-boundary still asserts the merchants leaf imports react and three platform/ui modules only, with a captured output listing exactly those three. I re-ran that claim own command at this head and it does not reproduce: the leaf now imports react, FOUR platform modules and the two siblings. The fix round changed the thing the claim measures and left the claim, and its captured output, standing."
    concrete-fix: "Two lines of record, no code change. Update the C-11.7-boundary claim and its captured output to the leafs actual import list at this head, and add a declared deviation against criterion 11.7(e) saying what the two sibling modules are, why they are not under src/platform/ui, and that the closure walk is unchanged. If the owner would rather the criterion stayed literally true, the only alternative is inlining both modules back into the leaf, which would trade a witnessed fast-gate rule for an unwitnessable browser one and should not be done."
    analysis: "The kind of drift a fix round produces and a clean-room round two exists to catch: the change improved the product and quietly invalidated a criterion half and a captured output. Recorded against the work, with the criterion marked not met on its letter and the substance stated plainly so the owner is not misled into thinking the boundary leaked. It does not leak."
  - id: CR2-M3P11-02
    severity: medium
    evidence:
      - "NEW IN ROUND TWO, AND WITNESSED IN A REAL BROWSER, not reasoned. The fix round added test/e2e/optimistic-naming.spec.ts:562, the two-notice journey that witnesses the queue (hazard finding HZ-M3P11-01) and the row-points-at-its-notice fix (HZ-M3P11-05). TWO of its assertions are FALSE at this head, so the spec cannot pass, and nothing caught that because no browser gate can run here."
      - "HOW I WITNESSED IT WITHOUT A SERVER: Playwright needs no Supabase to evaluate a locator, only a page. I ran chromium with page.setContent carrying a minimal copy of this head's own markup (a row li with data-group-key and aria-describedby, a .pulse-toast div carrying the id, a p.pulse-toast-message carrying data-testid=naming-failed, and a second namable row) and queried it with the spec's own locators. PROBE EXIT 0."
      - "DEFECT ONE, the notice id. The spec reads the id from the TESTID element: page.getByTestId(\"naming-failed\").getAttribute(\"id\") at optimistic-naming.spec.ts:624, and compares it to the row's aria-describedby. But src/platform/ui/toast.tsx:59 puts the id on the WRAPPER div and the data-testid on the message p inside it. Captured: getByTestId(naming-failed).id = null, .pulse-toast id = \"n1\", row aria-describedby = \"n1\". So the assertion compares null with a non-null id and fails. THE PRODUCT IS CORRECT; the assertion reads the wrong element."
      - "DEFECT TWO, the second row is not a second row. The spec picks it with .filter({ hasNot: page.locator(`[data-group-key=\"${firstKey}\"]`) }) at optimistic-naming.spec.ts:592. hasNot excludes rows that CONTAIN a match, and the attribute sits on the row element itself, not inside it. Captured on the two-row page: count after hasNot = 2, first picked key = \"k1\", the very row meant to be excluded. The first row is still namable after its own failure (a refusal neither redirects nor revalidates, so the row reverts and keeps its form), so .first() returns it again and the guard on the next line, expect(secondKey).not.toBe(firstKey), fails."
      - "CONSEQUENCE FOR CRITERION 11.8, and it is the same shape as the precedent CR-M3P17-01: npm run test:e2e cannot exit 0 at ec4779d anywhere, environment or no environment, because two assertions in a spec registered under both prod projects are false against this head's own DOM. The environment limitation was hiding a head defect, exactly as it did in M3-P17."
    concrete-fix: "Two lines. Read the notice id from the notice element that carries it, page.locator(\".pulse-toast\").getAttribute(\"id\"), or move the data-testid onto the wrapper div in toast.tsx and leave the spec alone. And pick the second row by key rather than by hasNot: capture the namable keys before the first submit and take the first key that is not firstKey, which is the identity-addressed style the rest of this spec already uses everywhere. Both fixes are in the spec; no product code is wrong."
    analysis: "The two most valuable assertions in the delta, the ones witnessing the queue and the row-to-notice pointer, are the two that cannot execute. They are cheap to fix and they must be fixed before the owed test:e2e run, or that run will report a red that is not a product defect and the real question, whether the queue and the pointer behave, will stay unanswered a third time."
  - id: CR-M3P11-05
    severity: low
    evidence:
      - "ROUND ONE FINDING, CLOSURE NOT YET WALKED."
    concrete-fix: "Carried from round one."
    analysis: "NOT YET WALKED."

