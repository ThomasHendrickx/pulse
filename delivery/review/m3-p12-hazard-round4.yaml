findings:
  - id: CR4-M3P12-03
    severity: medium
    analysis: >-
      THE INSERT HALF OF applyRuleWrites NEVER VERIFIES THE MERCHANT IT
      POINTS AT BELONGS TO THE CALLING HOUSEHOLD, THE EXACT CHECK ITS OWN
      UPDATE HALF JUST GAINED THREE LINES ABOVE IT. Fix round three's repair
      of CR3-M3P12-04 moved the tenancy check for the UPDATE loop inside the
      interactive transaction so it throws before the commit. The INSERT
      loop, in the same function and the same transaction, writes
      { householdId: context.householdId, merchantId: insert.merchantId }
      with no check at all that insert.merchantId is a merchant belonging to
      context.householdId. prisma/schema/merchants.prisma's foreign key on
      MerchantRule.merchantId references Merchant.id only, with no household
      component, so nothing in the schema catches this either: a row can be
      created whose declaration (household A) points at a merchant owned by
      a different household (B), which is a tenancy violation in the sense
      CLAUDE.md non-negotiable 6 exists to prevent, even though the ROW
      itself carries the correct householdId column and every read query
      that filters on householdId would still find it. upsertRule, two
      functions above applyRuleWrites in the same file, makes exactly this
      check explicitly and calls a foreign merchantId a sign of "a bug or an
      attack". applyRuleWrites' insert path has never had it, not before
      this round and not after it. This is not reachable through the
      shipped rederiveMerchantRules caller today, because every merchantId
      it ever inserts is copied from a rule already read via the
      household-scoped listRules(context), which is why this is medium and
      not high: the same shape CR3-M3P12-07 named for updateRulePattern
      ("the hazard is not what it does today, it is that... one call site
      away from being lost again") applies here to a different guarantee.
      What makes it sharper than an ordinary latent gap is that the FAKE
      repository used by every fast-gate test of this function delegates
      its insert path to upsertRule, which DOES check ownership, so the fast
      gate would refuse a foreign merchantId that the real adapter accepts:
      the fake is stronger than its subject, which is precisely the failure
      mode the fake's own comment two members away warns against, realized
      one function later. The one real-Postgres spec covering this function
      never isolates the insert path from the update path, so it cannot see
      the gap either.
    evidence:
      - "src/modules/merchants/adapters/merchant-repository.ts:151-160 is the insert loop: `tx.merchantRule.create({ data: { householdId: context.householdId, merchantId: insert.merchantId, kind: insert.kind, pattern: insert.pattern } })`, no lookup or filter on insert.merchantId anywhere before it."
      - "src/modules/merchants/adapters/merchant-repository.ts:80-91 (upsertRule) makes the comparison finding explicit: it looks up `tx.merchant.findFirst({ where: { id: input.merchantId, householdId: context.householdId } })` and throws \"upsertRule: merchant does not belong to the household\" when it is null, before writing anything."
      - "prisma/schema/merchants.prisma:85: `merchant Merchant @relation(fields: [merchantId], references: [id])` carries no householdId component, so the database's own foreign key permits a cross-household merchantId."
      - "test/application/fake-import-world.ts:442-459: the fake's applyRuleWrites inserts by calling `merchantsPort.upsertRule(context, insert)` for each insert (line ~453), which runs the SAME ownership check upsertRule makes for real. Every fast-gate assertion made against this fake for applyRuleWrites is therefore made against a stand-in that is stricter than the adapter it stands in for."
      - "test/e2e/merchant-rule-write.spec.ts:124-134, the one real-Postgres case naming a foreign household, submits an update AND an insert together; the update's own household check (the loop that runs first) throws before the insert statement is ever reached, so this case cannot distinguish 'the insert was refused' from 'the whole batch never got there'. No case in the file submits inserts only."
      - "WITNESSED LIVE against my own local Postgres database (pulse_r4haz, migrated with `npx prisma migrate deploy`, 6 migrations applied), via a throwaway tsx script calling the real applyRuleWrites directly with updates:[] and one insert whose merchantId belonged to a different household than the calling context's householdId. Captured output: threw undefined; the row was created with householdId equal to the CALLING household and merchantId equal to the OTHER household's merchant; printed line 'RESULT: threw = false ; row created with foreign merchantId = true'. Script written, run, then deleted; git status --short showed a clean tree afterward; the created rows were deleted by the same script before it exited."
