      run (12.19, 13.84, 11.27 on 4 cores) was WORSE than what fleet
      warning 18 itself measured (5.8-9.44), and disk was at 94% used.
    evidence:
      - "My own run: npm run test:e2e, all five values pinned per fleet warning 6, 1 worker: 55 discovered, 48 passed, 7 failed, 19.7m."
      - "[chromium] test/e2e/merchant-rule-write.spec.ts:41:5, applyRuleWrites is atomic, stays within the household, and rolls back the whole batch on any rejection, PASSED in 370ms."
      - "[chromium] test/e2e/golden-journey.spec.ts:79:5 PASSED in 27.1s; [chromium] test/e2e/merchants.spec.ts:276:5 PASSED in 18.3s. Both are this phase's own coverage and both are green."
      - "7 failed: [chromium] import.spec.ts:170, [chromium] month-view.spec.ts:120, [chromium] month-view.spec.ts:1371, [chromium] navigation.spec.ts:117, [chromium-phone] month-view.spec.ts:120, [chromium-phone] month-view.spec.ts:211, [chromium-phone] month-view.spec.ts:275. None is a file this round's diff (f3bfd66..0d41c3b) touches."
