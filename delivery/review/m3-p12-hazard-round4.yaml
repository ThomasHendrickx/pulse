      Add the same lookup upsertRule already makes, inside the SAME
      transaction, before the insert loop (or per insert, mirroring the
      per-update check): collect the distinct merchantIds in input.inserts,
      run `tx.merchant.findMany({ where: { id: { in: [...] }, householdId:
      context.householdId }, select: { id: true } })`, and throw the same
      wording pattern the update loop uses ("applyRuleWrites: one or more
      inserted rules point at a merchant that does not belong to the
      household") when the returned set is smaller than the distinct id
      set, before any tx.merchantRule.create call runs. Add a real-Postgres
      case to test/e2e/merchant-rule-write.spec.ts that submits an INSERT
      ALONE (no update in the same call) whose merchantId belongs to a
      household different from the calling context's, and assert it throws
      and that no row with that pattern exists afterward, so the two write
      paths are proven independently rather than only together. Then correct
      the fake or, better, delete its separate upsertRule delegation and
      have it perform the SAME narrower ownership check applyRuleWrites
      itself will now make, so the fake's strength cannot again exceed the
      adapter's for this member.

