    concrete-fix: >-
      Do not touch a test on the strength of this run alone. Re-run npm run
      test:e2e once on a quiet machine (no concurrent fleet lane driving
      Playwright, disk below the 90 percent threshold fleet warning 10
      names) on the committed ports, and record the exit code in the phase
      work history under criterion 12.14. If it exits 0 there the criterion
      is met and this finding closes with it. If failures recur on a quiet
      machine, they are then a real signal and the next reviewer should
      start from the shared shape (a 5000ms/30000ms default timeout against
      a route or a network idle wait) rather than from this finding's
      conclusion that it is fleet contention.

