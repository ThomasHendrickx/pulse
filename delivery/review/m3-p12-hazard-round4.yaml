#    (updateMany where {id, householdId}, throw on count 0) is now INSIDE
#    prisma.$transaction's callback, so a foreign rule id throws before
#    anything commits. Confirmed CR3-M3P12-07's fix is real too:
#    updateRulePattern is gone from the port, the adapter and the fakes; the
#    comment at merchant-repository.ts:120-124 records its removal.
