findings:
  - id: CR2-M3P4-01
    severity: low
    evidence:
      - >-
        delivery/work-history/m3-p4.yaml:297 to :304 (claim
        C-4.1-red-at-base) says the red run had "everything else at the fix
        round 1 tree". The captured log does not match the committed spec.
        witness-red.txt:9 and :10 name the tests at
        test/e2e/mobile-import.spec.ts:115:5 and :194:5, and its call sites
        for measureScreen are :138, :151, :160, :176, :183, :215, :219, :229
        and :239 (witness-red.txt:36, :60, :82, :104, :126, :162, :210, :257,
        :281). At dd6adff the tests are at test/e2e/mobile-import.spec.ts:116
        and :195 and the calls at :139, :152, :161, :177, :184, :216, :228,
        :238 and :248; the green log names :116 and :195
        (e2e-full3.txt:549 and :550).
      - >-
        The offset is one line above line 79 plus eight lines between the
        "format question" and "format question, description open" calls:
        the witness has them four lines apart (:215 to :219), the committed
        spec twelve (test/e2e/mobile-import.spec.ts:216 to :228). The eight
        missing lines are exactly the direct summary height assertion at
        test/e2e/mobile-import.spec.ts:218 to :225, and the one line is
        consistent with the TAP_MIN import it needs
        (test/e2e/mobile-import.spec.ts:8). So the only guard for the
        disclosure toggle, which is part of how CR-M3P4-01 was closed, was
        added after the red run and has no red witness. It is a hard
        expect, so had it been present and red at base the second test
        would have stopped there, and witness-red.txt:236 to :281 shows it
        carried on to the unregistered and refusal screens.
      - >-
        delivery/work-history/m3-p4.yaml:302 says the run named "undersized
        controls on all eight measured screens". The two journeys measure
        ten screens (six in the first, test/e2e/mobile-import.spec.ts:139 to
        :192; four in the second, :216 to :248), and the captured log names
        tap-target offenders on nine of them (all but month).
      - >-
        delivery/work-history/m3-p4.yaml:313 to :323 is presented as the
        command's output but is a paraphrase of it: it reads "file picker
        30px tall" and "two fields 30px tall" where the log reads ": 30px
        tall" (witness-red.txt:24, :47, :48), and "the same" for a screen
        the log reports in full (witness-red.txt:188 to :234). The fix-round
        derivation output at delivery/work-history/m3-p4.yaml:187 to :200 is
        annotated the same way, although there no hit was dropped (the
        command re-run in the tree returns the same 16 lines, exit 0).
    concrete-fix: >-
      Re-run the red construction against the committed spec (restore
      src/app/globals.css and src/modules/import/ui/import-result.tsx from
      03625ee, run npx playwright test mobile-import --project=chromium-phone),
      paste the verbatim tail of the output into the claim's output field,
      and expect the second test to stop at "description toggle height"
      (test/e2e/mobile-import.spec.ts:222). If it does not stop there, the
      summary assertion is not guarding what its comment says. Correct
      "all eight measured screens" to "nine of the ten measured screens (all
      but month)". Carry this into the next brief as work; it does not need a
      review round.
    analysis: >-
      Clause R-087: a record states a provenance ("everything else at the
      fix round 1 tree") that its own captured output contradicts, and a
      count that is wrong. Ranked low under DR-0027 because the shipped
      behaviour at risk is narrow: every measureScreen assertion that the
      witness shows red is textually the same in the committed spec, and the
      unwitnessed summary assertion is by construction a height comparison
      on a boundingBox that returns 0 (and so fails) when the element is
      absent, and at 03625ee the summary had no min-height at all
      (git show 03625ee:src/app/globals.css, .spec-editor summary carries
      cursor, font-size and color only). What is missing is the evidence,
      not, on reading, the redness.

  - id: CR2-M3P4-02
    severity: low
    evidence:
      - >-
        src/app/globals.css:420 to :422 says the .import-next link is "sized
        to the phone tap target and no wider than its label". Fix round 1
        removed align-self: flex-start from the rule (git show 593c2e5, the
        hunk at .import-next), and the rule now at src/app/globals.css:423
        to :427 sets only display, align-items and min-height.
      - >-
        Both links are direct children of section.import-screen
        (src/modules/import/ui/import-result.tsx:34 and :37, :46 and :70),
        which is a flex column with no align-items
        (src/app/globals.css:339 to :344), so the default stretch applies
        and the link, blockified as a flex item, spans the column. The work
        history says as much: "the two links keep the size and the column
        width they had before this phase" (delivery/work-history/m3-p4.yaml:88
        to :90). The comment and the record contradict each other, and the
        comment is the false one.
    concrete-fix: >-
      Amend the comment at src/app/globals.css:420 to :422 to say the link
      keeps the column width it had before M3-P4 and only its height grows to
      the tap target, e.g. "a link, so it keeps the link colour; as a flex
      item of .import-screen it spans the column, and only its height is
      raised to the phone tap target".
    analysis: >-
      Clause R-087, a present-tense comment made false by the fix round
      that answered hazard finding HZ-M3P4-03. No behaviour is at risk (a
      full-width tap area is the more forgiving direction on a phone); the
      next reader is told the opposite of what the page does.

