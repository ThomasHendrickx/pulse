      screens, and DR-0022's decided consequence is that phone-width
      evidence measuring usability becomes a standing criterion on EVERY UI
      phase and not only on the two being rebuilt. Nothing is removed: the
      journey and the overflow assertion stay. npm run test:e2e exits 0
      including the synthetic-PDF import journey run under the phone project
      M3-P7 added, asserting as before that
      document.documentElement.scrollWidth does not exceed the viewport width
      on the import, declaration, result and month screens; and at 390 by 844
      those same screens satisfy the three standing phone measurements M3-P7
      introduced: every element matching "a, button, input:not([type=hidden]),
