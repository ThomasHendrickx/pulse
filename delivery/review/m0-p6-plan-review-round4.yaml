      - >-
        Titles in this plan are read as the criterion's summary by anyone
        scanning it, and this one now says the opposite of case FIVE's whole
        content.
    concrete-edit: >-
      Retitle criterion 14.14 to "EVERY READ THAT CAN SEE A ROW WITH NO FLOW
      IS SCOPED BY THE RING, AND THE THREE AGREE", and change the opening
      paragraph's last sentence to "at the phase base that grep returns three
      lines in TWO reads, the count and the gap listing; this phase adds a
