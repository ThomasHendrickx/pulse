#
# A verdict judges an IMPLEMENTED phase against a work history and demands
# `concrete-fix`, a fix to CODE. Neither phase has been built. Validated as
# `--type finding`.
#
# EVERY ROUND-THREE FINDING IS ANSWERED, and four of them well. R3-001 by the
# two named arms of criterion 14.16, which is the right repair and whose
# second arm I walked again below. R3-003 by the re-invention clause now
