# ATTACK 3/4 (three null-flow reads; held vs uninterpreted). Grep for every
# occurrence of an absent-flow test in a database query under src/
# (`flow"\s+is\s+null` case-insensitive for raw SQL, `flow\s*:\s*null` in
# adapters/ for the Prisma client form) finds occurrences in EXACTLY the
# three reads the plan names: the uninterpreted count inline in
# monthFigures, listGapRows, and accountRowCounts (serving both
# listCountedAccountRows and listHeldAccountRows via a ring parameter). No
# fourth read exists in the shipped tree. Traced the two TypeScript-only
# absent-flow tests the criterion deliberately excludes
# (interpret-window.ts's isCounted check and reconciliation.ts's flow ===
# undefined skip) and confirmed neither is a database query. Role is a
# required two-value enum (POT/RESERVE, prisma/schema/accounts.prisma:5-8)
# with no third state and no nullable column, so POT_ROW/NON_POT_ROW
# genuinely partition every account including cards (a card account is
# role=POT with iban=null, confirmed at
# src/modules/ledger/domain/ledger-transaction.ts:83-89) -- "an account
# with no resolvable ring" is not a reachable state.
#
# ITEM 4, held vs a genuine gap on a reserve account: probed and NOT
# reached. Held is "no flow, on a non-pot account" by construction, and
# interpretation never attempts to classify a non-pot account's rows at
# all (interpret-window.ts's `heldRows` path unconditionally nulls them;
# `interpretLedger` is only ever given pot+card transactions). Since no
# mechanism in the shipped tree can leave a reserve-account row with a
# flow OR with a flow-classification attempt that failed, there is no
# state left for "held" to be confused with; the ring-derived rule cannot
# hide a gap that the interpreter never tries to detect in the first
# place. This is a hard invariant of the design (every null-flow row on a
# non-pot account is, by construction, exactly the held state) rather than
# a soft rule a code path could violate. Recorded as a probed hazard, not
# a defect.
