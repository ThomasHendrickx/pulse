findings:
  - id: HZ-M3P14-04
    severity: high
    evidence:
      - "src/modules/accounts/application/correct-account-ring.ts:60-62 (CorrectAccountRingOutcome.moved's doc comment): \"What ACTUALLY moved, recomputed after the change rather than restated from the preview, so the two can be compared and criterion 15.7's 'byte identical' is a fact rather than a tautology.\""
      - "The implementation directly below (correct-account-ring.ts:110-130): `const movement = await previewAccountRingChange(context, deps, input);` runs FIRST, before any write. Then `await deps.accounts.updateAccountRole(...)` writes the declaration, then `await deps.recompute(context)` runs the real recompute, and the function returns `ok({ account, moved: movement.value })` -- `movement.value` is the untouched result of the EARLIER preview call, never re-read or re-derived after the write or the recompute."
      - "The comment's claim is false of the code exactly as written: `moved` is restated from the preview, which is the one thing the comment says it is not."
      - "test/application/account-registry.test.ts:508-558 (criterion 15.7's own test) does verify, in a single-threaded fake-world test with no concurrent writes, that preview.value equals the independently-measured before/after totals AND that outcome.value.moved equals preview.value -- so the VALUES are correct in every case this review or the test suite exercises. What is false is the MECHANISM the comment describes, not (as far as this review could find) any observed number."
      - "The gap the false comment hides: nothing stands between the preview call and the write+recompute (no transaction, no lock, no re-check), so a concurrent write landing in that window (another import, another registration, another correction on the same household, all real possibilities on a real deployed server serving one request per action) would make the real post-recompute movement differ from the previewed one, and the household would be shown the STALE previewed figure as if it were freshly measured -- exactly the class of silent wrong figure this review was dispatched to hunt for, and exactly what the false comment claims cannot happen (\"recomputed after the change\")."
    concrete-edit: >-
      Either correct the comment to say what the code does ("moved is the
      previewed movement, computed before the write; it is not re-derived
      after the recompute, so a concurrent write between preview and
      recompute can make it stale") and accept the narrow race as a known
      limitation, or make the code match the comment: re-derive `moved`
      from a genuine post-recompute measurement (e.g. a second preview call
      against the now-current declared set, or a direct read of the actual
      delta) rather than echoing the pre-write preview value, so criterion
      15.7's "byte identical" claim is checked against a fresh number on
      every request and not only in the single-threaded test.
    analysis: >-
      Filed HIGH under clause R-087, which requires a false present-tense
      claim to be raised loudly rather than as a nit, and because the
      specific claim being false is precisely about protection against the
      silent-wrong-figure hazard this review's dispatch names as the
      central concern of the phase. The values are correct in every
      configuration this review could exercise (this review's own live
      database probe of the ring-correction path, and criterion 15.7's own
      test, both found preview and actual movement equal), so this is not
      demonstrated as a live numeric defect; it is a false claim about a
      guarantee on a code path that moves money between totals, with a
      real (if narrow, single-request-window) mechanism by which the claim
      could be violated in production and nothing would catch it.

  - id: HZ-M3P14-03
    severity: high
    evidence:
      - "test/domain/account-number.test.ts:162-189, the criterion 14.4 guard against a second private copy of the account-number canonicalisation transformation reappearing anywhere under src/."
      - "The duplicate detector's pattern requires the literal substring \".replace(\" (account-number.test.ts:176: /\\.replace\\(\\s*\\/.../), so it is blind to the identical transformation written as `.replaceAll(...)`."
      - "MUTATION-VERIFIED: appended `export const scratchProbeSecondCopy = (iban: string): string => iban.replaceAll(/\\s/g, \"\").replaceAll(/-/g, \"\").toUpperCase();` to src/modules/ledger/domain/corrections.ts (a live account-bearing field, the exact shape the guard exists to catch) and ran `npx vitest run test/domain/account-number.test.ts`: 15 passed (15), EXIT=0, with the duplicate present. Reverted with `git checkout -- src/modules/ledger/domain/corrections.ts`; `git status` confirmed clean again."
      - "This is the same failure shape as the two guards the implementer's own work history discloses as having been green against the states they exist to catch (delivery/work-history/m3-p14.yaml red-witnesses section: gate-diff-tokens.sh's stray-space bug and its grep-dialect-mixing bug), and it is not named anywhere in that section or in the overstatement-check."
      - "The phase's own commit message for bf3e001 states as a design goal: \"Two private second copies of the same transformation are removed rather than tolerated ... A fast-gate test enumerates the definitions and reddens on a third.\" The guard does not redden on a third definition that uses .replaceAll."
    concrete-edit: >-
      Broaden test/domain/account-number.test.ts's duplicate-detector regex
      (or replace it with an AST-free but more general string match) so it
      catches both `.replace(` and `.replaceAll(` -- e.g. match
      `\.replace(All)?\(` instead of `\.replace\(` -- and add a regression
      case that asserts a `.replaceAll`-based duplicate reddens the test,
      mirroring the existing positive case for `.replace`. Apply the same
      widening to any other guard in this phase or M3-P12 that walks source
      text for this specific JS idiom, since the same blind spot likely
      recurs wherever a hand-rolled pattern was built against one call and
      never tried against its ES2021 sibling.
    analysis: >-
      Filed HIGH rather than MEDIUM because this guard is the ONLY
      mechanical enforcement of decision D-47/D-57 ("one canonical form,
      one module, everyone imports it") and the hazard it is meant to catch
      is exactly the one criterion 14.4 names as costly: a second copy that
      "agreed with the platform form on the day it was written and was a
      second copy of one transformation from then on." A reviewer or
      implementer relying on this guard's green result to conclude no
      duplicate exists is relying on a guard demonstrated here to admit
      the dangerous state silently. The dispatch's own framing (two
      disclosed guard failures of this shape, asking for a third) suggests
      this class of defect is a known recurring pattern in this project
      worth a systematic sweep, not only a one-line fix.

  - id: HZ-M3P14-01
    severity: medium
    evidence:
      - "src/platform/account-number.ts's canonicalAccountNumber only normalises (uppercases, strips whitespace/hyphens) a value when the result matches CANONICAL_SHAPE; otherwise it returns the value completely unchanged, including original case and whitespace."
