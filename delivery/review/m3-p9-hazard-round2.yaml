findings:
  - id: R2H-01
    severity: high
    evidence:
      - >-
        Criterion 9.7(c)'s own verification command, run exactly as the plan
        writes it: `grep -rn '^"use client"' src/` returns exactly
        `src/platform/ui/nav-link.tsx:1:"use client";` and exits 0, matching
        the plan's claim.
      - >-
        The grep matches the DOUBLE-QUOTE shape of the directive, not its
        identity. I built two throwaway files outside the tracked tree (never
        committed, never touching the reviewed worktree's source) containing
        only `'use client';` and `"use client";` respectively as their first
        line. The same command against the single-quoted file returns nothing
        and exits 1; against the double-quoted file it returns the line and
        exits 0. A single-quoted `'use client';` is a syntactically identical,
        functionally real Next.js/React client directive (the directive
        prologue's value is the string "use client" regardless of which quote
        character encodes it); it would open a real client boundary and
        criterion 9.7(c)'s check would report "exactly one line, same as
        base" and PASS.
      - >-
        This is the same guard the plan's own text says has "now been wrong
        twice" (delivery/plan/pulse-v02.yaml, criterion 9.7(c): the first
        version counted an unanchored grep matching a comment, the second
        anchored the pattern outside the quoting and matched nothing at all).
        A third gap in the same guard, in the same direction the first two
        errors ran (the check reporting a false "clean" state), is the
        pattern clause 27/29 of this fleet's environment warnings names
        directly: a guard that matches the SHAPE of the thing rather than its
        IDENTITY.
      - >-
        Not currently exploited: I confirmed no single-quoted `'use client'`
        directive exists anywhere in this diff or in `src/` at this head (the
        double-quote grep and a manual read of `src/app/layout.tsx` both
        confirm the only directive in the tree is the pre-existing one at
        `nav-link.tsx:1`). The finding is about the INSTRUMENT, which is the
        sole guard hazard H9.5 relies on to keep this and every future phase
        from silently reopening a second React client boundary, not about a
        violation present in this diff.
    concrete-fix: >-
      Widen criterion 9.7(c)'s verification command to match the directive's
      VALUE rather than one of its two legal spellings, e.g.
      `grep -rnE "^['\"]use client['\"]" src/` (still anchored, still
      excluding the nav-link.tsx:7 comment that caused round one's defect,
      still returning exactly one line at this head), or replace the grep
      with a check that parses the directive prologue rather than matching a
      quote character. Land the corrected command as the literal, runnable
      text of criterion 9.7(c) in the next plan amendment, the same way the
      current wording insists its own quoting is "load-bearing, part of the
      criterion and not typography" — the fix should carry the same
      guarantee for the character it currently misses.

  - id: R2H-02
    severity: medium
    evidence:
      - >-
        `src/app/layout.tsx:34-40`'s comment states "NO INTERPOLATION, EVER
        (D-61's standing constraint)" and "A later phase that needs a value
        inside it does not add one: it moves the listener to a client island
        and reopens D-61." I confirmed the constant itself currently carries
        no `${` (grep -n '\${' src/app/layout.tsx exits 1) and that nothing
        in the diff feeds a request-derived, locale-derived or user-derived
        value into `PRESS_FEEDBACK`; RootLayout is an async server component
        that reads only `getLocale()`, used for the `<html lang>` attribute
        and never passed into the constant.
      - >-
        Nothing in the tree ENFORCES the "ever" going forward. There is no
        eslint rule targeting this file or this identifier, no fast-gate
        test asserting the constant contains no template expression, and no
        CSP/nonce infrastructure (`src/middleware.ts` sets no headers at all;
        confirmed by reading the whole file, 57 lines, no
        Content-Security-Policy or Set-Header call of any kind). A future
        phase's implementer, reading the comment's normative "does not add
        one" as description rather than as an unenforced convention, could
        add a `${...}` to this exact constant without any of the five
        mandated gates or criterion 9.5's checks (which are scoped to *.css
        and *.tsx colour/length literals, not to a JS template string in the
        one permitted *.tsx file) ever turning red for it.
    concrete-fix: >-
      Either add a cheap, mechanical check for the constraint (a fast-gate
      unit test asserting `PRESS_FEEDBACK` contains no `${` substring, or an
      eslint rule scoped to this file forbidding template-literal
      interpolation), or soften the comment's own claim so it reads as the
      decision it actually is rather than as a guarantee nothing backs: "this
      phase adds no interpolation and no later phase should add one to this
      constant without reopening D-61" is true; "NO INTERPOLATION, EVER" as
      currently written reads as a standing, binding property, and it isn't
      one yet.

  - id: R2H-03
    severity: low
    evidence:
      - >-
        Criterion 9.9(a)'s prose states plainly: "the spec registers no
        addInitScript and no page.evaluate that adds a listener for
        pointerdown, touchstart or mousedown, with ONE exception named here
        and nowhere else, the capture-phase CLICK REFUSAL". The shipped spec's
        `INSTALL_RECORDER` (test/e2e/pressed-and-disabled.spec.ts:304-425)
        registers capture-phase listeners for `pointerdown`, `touchstart`,
        `pointerup`, `touchend`, `pointercancel`, `mousedown` AND `click`
        (the `TRACKED_TYPES` array at line ~306), which is a second and third
        exception beyond the one the prose names.
      - >-
        This is necessary, not sloppy: criteria 9.9(c) and 9.9(e) both
        require the spec to prove pointerdown and touchstart (and the ending
        events) were actually DELIVERED before concluding anything from a
        zero or an absence, which is impossible without a listener for
        exactly those types. The implementer disclosed this openly as a
        declared deviation (delivery/work-history/m3-p9.yaml, "ROUND TWO"
        deviations, first entry: "I found no way to obey both") and the
        comment at spec line 293 names it "THE PASSIVE EVENT RECORDER IS A
        DECLARED DEVIATION and is written here rather than hidden." I judge
        this deviation sound; see deviations-judged below.
      - >-
        The formal FALSIFIED BY list at the end of criterion 9.9 does not
        actually forbid this: it says only "by ANY injected script that
        WRITES data-pressed", which the recorder does not do (verified: every
        line matching `data-pressed|dataset\.pressed|toggleAttribute` in the
        spec is a comment, an `el.matches(...)` read, or a
        `document.querySelectorAll(...)` read — I ran the exact grep myself
        and it returns the same three lines the work history quotes). So the
        criterion's descriptive prose sets a stricter bar than its own
        enforceable falsification clause actually enforces, and the two
        disagree with each other inside the SAME criterion.
    concrete-fix: >-
      Amend criterion 9.9(a)'s prose to explicitly carve out a read-only,
      non-mutating event-recording listener alongside the click-refusal
      exception, matching what the FALSIFIED BY clause already, correctly,
      permits. As written, a future reader who takes the prose literally
      either concludes the shipped spec violates 9.9(a) (it does not, by the
      criterion's own enforceable text) or is left to rediscover the same
      declared-deviation reasoning from scratch.

  - id: R2H-04
    severity: low
    evidence:
      - >-
        Criterion 9.7's check is "git diff --name-only against this phase's
        base prints ONLY [six named paths]." Run literally as `git diff
        --name-only 89ed187 HEAD`, it prints a SEVENTH path,
        `scripts/gate-privacy.sh`, which is not on the list and is not one of
        the two standing pre-authorized extras
        (test/behaviors.json and delivery/work-history/m3-p9*).
      - >-
        Investigated: that file's one touching commit (dc8c505) belongs to a
        different phase's branch (claude/m0-p8-plan-testid) and reached this
        branch only through a main-merge (84fe83a); it is not M3-P9's own
        work, alongside a long run of unrelated `delivery/plan/pulse-v02.yaml`
        amendment commits (accounts, savings, promotion phases) that are also
        merge-inherited rather than M3-P9's own. So there is no actual scope
        violation, but the CHECK as literally specified cannot tell the
        difference between a phase's own commits and commits merged in from
        main between its base and its head; a reader who runs exactly the
        command criterion 9.7 gives, with no further step, would flag a
        phantom violation here.
    concrete-fix: >-
      State explicitly, next to criterion 9.7's diff check, that a path
      appearing in the raw diff must additionally be traced to a commit on
      the phase's own branch (not merge-inherited from main) before it counts
      against the criterion, and give the one-line technique for doing that
      (`git log --all --source | grep <hash>` plus `git merge-base
      --is-ancestor <hash> origin/main`). This is a general property of every
      phase in this fleet that merges main before its own head, not unique to
      M3-P9; recording the technique once here saves the next reviewer from
      redoing the provenance check that this document had to do to withdraw
      what looked, at first, like a high finding.

  - id: R2H-05
    severity: low
    evidence:
      - >-
        The five endings criterion 9.9(e) enumerates and the shipped spec
        drives (touch release on the control, touch release away, a real
        engine-taken scroll pointercancel, a mouse press released elsewhere,
        two presses in flight) are all endings the DOCUMENT ITSELF delivers
        an event for, and the document-wide `clear()` sweep handles all five
        correctly by design: it fires on any pointerup/pointercancel
        anywhere, which is why a control that unmounts mid-press cannot stay
        visibly stuck (the node is gone) and why a client-side route change
        cannot interrupt a press before its own pointerup fires (Next.js
        navigates on click, after pointerup, and the root layout hosting the
        listener never remounts across a client-side transition).
      - >-
        What is NOT witnessed by any of the five, and could not be witnessed
        in this container: whether a real mobile engine reliably fires
        `pointercancel` when the OS intercepts a touch for its own gesture
        mid-press and never hands a corresponding DOM event back to the page
        at all (a long-press context/share-sheet gesture, an edge-swipe-back
        gesture, or the app backgrounding while a finger is still down). If
        an engine ever fails to deliver EITHER pointerup or pointercancel for
        such a gesture, the control marked at pointerdown has no ending event
        to answer to and stays visibly pressed until an unrelated touch
        elsewhere clears the whole document — which is exactly the residual,
        lower-severity version of the round-one stuck-pressed defect, on a
        path none of the five enumerated endings exercises.
      - >-
        Confirmed unreachable from here rather than assumed: `which
        google-chrome chromium firefox` finds nothing in this container,
        matching the work history's own recorded answer to verification-first
        step (f) ("none reachable; every phone result is emulation and says
        so"). This is reported as a hazard probed and not reached, per the
        dispatch's own instruction that such a result is worth recording so
        the next reviewer does not spend budget re-deriving it, not as a
        demonstrated defect in the shipped mechanism.
    concrete-fix: >-
      No code change is demanded by this finding; it is a residual risk
      outside what any Playwright-only instrument in this container can
      reach. Record it explicitly in the plan (a hazard-class addendum or a
      note beside H9.11) so a future round with access to a real device farm
      knows to spend a manual pass here: hold a press, then trigger the
      platform's long-press context menu / edge-swipe-back gesture without
      lifting the finger, and confirm the control's pressed appearance
      clears.

