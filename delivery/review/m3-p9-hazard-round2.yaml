deviations-judged:
  - deviation: >-
      Step 2 and the token entry in report-code-disagreement: "no further
      token is expected, with criterion 9.5 failing the phase if a literal
      duration, curve, colour or length reaches a rule instead."
    serves-plan-intent: true
    reasoning: >-
      Verified the captured claim myself: the length-literal and duration/
      easing greps over every stylesheet but tokens.css are unchanged from
      base and empty respectively. The five literals this deviation names
      (four opacities, one 50% radius) are none of duration, curve, colour or
      length in the sense criterion 9.5 defines them (colour meaning a
      colour value, not a unitless opacity multiplier), and adding five
      single-use tokens for values with no reuse anywhere else in the file
      would be token-system bloat for its own sake. I agree with the
      implementer's own reading that the plan's "no further token is
      expected" describes intent rather than an exhaustive enumeration of
      every literal a state rule could ever need.

  - deviation: >-
      Step 5: "A disabled control changes to --color-surface-disabled and
      --color-ink-disabled and stops computing cursor: pointer."
    serves-plan-intent: true
    reasoning: >-
      Read the rule (src/app/globals.css:1563-1587): both token-backed colour
      changes are present exactly as specified, and the added opacity change
      is additive redundancy that gives the disabled appearance a magnitude
      on transparent controls too, where the colour-composite bar the
      criterion offers as an alternative would otherwise depend on whatever
      the control happens to sit over. It strengthens the criterion's own
      guarantee rather than substituting for it.

  - deviation: >-
      Step 4: "Write the pressed appearance for every control the criterion
      9.2 selector finds, which at this phase's base is the seven submit
      controls, the three shell nav links, ..."
    serves-plan-intent: true
    reasoning: >-
      Confirmed the rules select by ELEMENT (button:active, a:active, etc.)
      rather than by the enumerated class list, and that the two selections
      are identical over the tree the sweep measures (the passing
      both-directions set assertion is the proof). An element-scoped rule is
      MORE robust to a future control added under the same tags than a
      hand-maintained class list would be, and does not weaken anything the
      criterion measures today.

  - deviation: "Criterion 9.2(b)(i), the movement half."
    serves-plan-intent: true
    reasoning: >-
      The spec asserts the element's own bounding box moves in addition to
      the computed transform, which is a strictly stronger check than the
      criterion's literal text (satisfiable in principle by a transform a
      non-replaced inline box never visually renders). Strengthening a
      criterion beyond its letter, in the direction the criterion's own
      intent points, is not a deviation that needs forgiving; it is the
      correct reading of "a difference big enough to see."

  - deviation: >-
      Criterion 9.2(c): grep -rn "tap-highlight" over every file matching
      *.css under src/ and styles/ returns nothing.
    serves-plan-intent: true
    reasoning: >-
      Confirmed the comment explaining the -webkit-tap-highlight-color
      decision spells the property name out in words rather than writing it
      literally, and that styles/tokens.css:178 already uses the same device
      for a different word. This keeps both the explanation and the
      criterion's own grep meaningful; I ran the grep and it exits 1.

  - deviation: >-
      Step 6: "register it in playwright.config.ts under BOTH the desktop
      project and the chromium-phone project, by widening that project's
      testMatch."
    serves-plan-intent: true
    reasoning: >-
      Not a substantive deviation. Confirmed the chromium project declares
      testIgnore (playwright.config.ts:57) rather than testMatch, so the new
      spec is collected there with no config edit; only the phone project's
      testMatch needed widening, which is the only playwright.config.ts
      change in the diff.

  - deviation: >-
      files-to-touch, which does not name a base rule for the anchor
      element.
    serves-plan-intent: true
    reasoning: >-
      `a { display: inline-block; }` (src/app/globals.css:1438-1439) is
      inside the phase's declared files but changes a base element rule
      rather than a state rule. I judged the blast radius the same way round
      one's reviewer did: it is needed because a non-replaced inline box is
      not transformable, so without it the two bare auth cross-links would
      report a translated computed transform with no visible movement, which
      is exactly the "rounding error that satisfies the letter" failure
      hazard H9.9 exists to catch. The deviation is declared rather than
      silent, and the fix-round-1 correction (finding CR-M3P9-03, narrowing
      the claimed count from four controls to two after the import-result
      links turned out to already be flex items) shows the implementer
      checked rather than asserted the blast radius.

  - deviation: >-
      Step 4 and criterion 9.2, which describe the pressed appearance in
      terms of a press and do not name a selector; the plan's
      verification-first step (e) pre-authorises "a class or attribute the
      control carries between pointerdown and pointerup" only IF a held
      page.mouse.down fails to produce :active under the chromium-phone
      project.
    serves-plan-intent: true
    reasoning: >-
      This deviation is from FIX ROUND 1, before the plan amendment that
      formally added the listener step and criterion 9.9. Its own
      description is honest about the ladder's condition not being literally
      met (mouse DOES get :active) while adding [data-pressed] anyway because
      the phase exists to answer a finger question and the touch measurement
      returns zero on every path. The amendment that followed adopted exactly
      this reasoning as the phase's own step 5 and D-61, which is the
      strongest evidence available that the deviation served the plan's
      intent: the plan itself was rewritten to agree with it.

  - deviation: >-
      files-to-touch and criterion 9.7, which print no client script, so the
      pointerdown handler that sets [data-pressed] cannot ship in this
      phase.
    serves-plan-intent: true
    reasoning: >-
      An open escalation under R-034 rather than an improvised workaround,
      correctly labelled as such in the work history. This is precisely the
      instance hazard H9.11 was later added to name, and the amendment that
      followed resolved it by adding the listener to files-to-touch rather
      than leaving it parked. Escalating an unresolvable tension between two
      of the phase's own clauses, instead of silently picking one side, is
      the behaviour R-034 exists to produce.

  - deviation: >-
      Criterion 9.9(a): "the spec registers no addInitScript and no
      page.evaluate that adds a listener for pointerdown, touchstart or
      mousedown, with ONE exception named here and nowhere else, the
      capture-phase CLICK REFUSAL".
    serves-plan-intent: true
    reasoning: >-
      Judged in detail above (finding R2H-03). The recorder is read-only
      about the mechanism under test (pushes event names to an array, writes
      no attribute), is required by 9.9(c)/(e)'s own text, and the property
      the prohibition actually protects (nothing installed produces the
      pressed appearance) holds under my own re-run of the grep the criterion
      names. I agree the deviation was unavoidable given the plan's two
      clauses as literally written, and record the plan-text inconsistency
      itself as R2H-03 rather than holding it against the implementation.

  - deviation: >-
      Criterion 9.9(e): "After EACH of the five endings, by the SECOND
      sampled animation frame following it ... the control's computed
      transform matrix and bounding rect are back at their resting values".
    serves-plan-intent: true
    reasoning: >-
      --duration-press is 90ms (styles/tokens.css:207), so a transform still
      unwinding at the second animation frame after an ending is a
      consequence of the transition existing at all, on any correct
      implementation, not a defect being excused. The marking assertion
      (data-pressed cleared), which is the half that actually catches a
      stuck press, is still taken at exactly the second frame as written; only
      the transform/rect restoration check is moved to the end of the sampled
      tail, where it is 0.000px on every ending. This reads as a genuine gap
      in the criterion's own timing assumption rather than a corner cut.

  - deviation: >-
      Criterion 9.9(e) ending FOUR: "by asserting that the ending's own event
      was captured on the control, pointerup for endings one, two, four and
      five".
    serves-plan-intent: true
    reasoning: >-
      Ending four exists specifically because a mouse pointer lacks implicit
      capture, so asserting its pointerup landed ON the control would assert
      the opposite of the property the ending is built to demonstrate. The
      spec's actual assertion (a pointerup was captured, and its target was
      NOT the control) is the stronger, correct form of the same "this
      ending really happened" requirement half (e)'s own preamble states, and
      matches the criterion's own explanatory prose describing the ending
      one paragraph earlier.

  - deviation: >-
      Criterion 9.9(e) ending TWO, a touch release AWAY from the control.
    serves-plan-intent: true
    reasoning: >-
      Verified the stated mechanical conflict makes sense: a touchMove on a
      screen that scrolls IS ending three by the criterion's own definition
      ("a touch that begins on the control and then moves far enough that the
      engine takes the gesture"), so driving ending two with a move would
      make it indistinguishable from ending three on a scrollable screen. Ending
      the touch at moved coordinates with no move event produces a real,
      distinct pointerup away from the control without manufacturing a scroll,
      which is what ending two is actually for.

hazard-classes-addressed:
  - class-id: H9.1
    probed: >-
      Read every pressed-rule selector in src/app/globals.css:1478-1520 and
      confirmed each has a [data-pressed] twin beside its :active form, so
      the appearance answers an attribute a listener can set rather than only
      a pseudo-class the engine may withhold from touch. Cross-checked the
      spec's own measurement technique (matrix f-component plus rect delta,
      not a single computed-style grep) against the exact failure mode this
      hazard names ("a grep for :active rather than a press").
    cleared-because: >-
      The mechanism no longer depends on the engine granting :active to a
      touch at all; it depends on pointerdown firing, which every touch path
      the spec drives does. I did not re-execute the frame-sampled proof
      myself this round (see criterion 9.9 evidence); on the code alone this
      hazard reads as closed.

  - class-id: H9.2
    probed: >-
      Read styles/tokens.css:273-278 for what the reduced-motion block
      actually zeroes (three durations only, not --press-offset or any
      colour token) and read criterion 9.4(c) and criterion 9.9(d)'s
      requirement to re-run the full pressed/disabled/busy measurement under
      reduce. Checked specifically for the "no transition and no pressed
      appearance either" failure shape this hazard names.
    cleared-because: >-
      The appearance-bearing tokens (--press-offset, the four colour tokens)
      have no reduced-motion variant at all, so a reader who asks for less
      motion loses only the easing, never the state. This is structurally
      the failure-resistant shape the criterion asks for (one block at
      :root, no per-rule variant to forget) rather than a per-rule opt-out
      that a future rule could omit.

  - class-id: H9.3
    probed: >-
      Ran all four of criterion 9.5's checks myself and read every
      declaration this phase adds to see whether any literal value that is
      NOT a colour or font-size (the repository's own gate:tokens blind spot,
      confirmed by reading its grep) slipped through the plan's own
      supplementary greps.
    cleared-because: >-
      The four opacity/radius literals the implementer declared as a
      deviation (see deviations-judged) are, on my own reading, genuinely
      outside what criterion 9.5 names (duration, curve, colour, length), and
      the duration/easing/colour/length checks I ran by hand all pass. The
      one gap I found in this area is not a literal that slipped through but
      gate:tokens itself never scanning this phase's files at all, recorded
      above as a header note rather than a finding since criterion 9.5(a)-(c)
      already covers the actual paths.

  - class-id: H9.4
    probed: >-
      Ran grep -rn "tap-highlight" over every *.css under src/ and styles/
      (exit 1) and read the whole pressed/disabled rule block for any
      property that removes the platform cue (-webkit-tap-highlight-color,
      touch-action, user-select, or pointer-events on a resting rule).
    cleared-because: >-
      Nothing traded away; the platform highlight is not suppressed anywhere
      in this diff, and the comment explaining the decision uses the
      word-spelled-out device so the criterion's own grep stays meaningful,
      declared as a deviation rather than done silently.

  - class-id: H9.5
    probed: >-
      Ran criterion 9.7's own commands, then went past them: constructed a
      single-quoted 'use client' directive in a scratch file outside the
      tracked tree and ran the exact same grep against it, to test whether
      the guard matches the directive's IDENTITY or only one of its two
      legal spellings.
    finding: R2H-01

  - class-id: H9.6
    probed: >-
      Grepped src/ for every selector the new state vocabulary defines
      (aria-busy, aria-disabled, data-unconfirmed) to see what, if anything,
      enters these states in the product today, then read the busy/
      unconfirmed rules to check whether a control that DOES carry them
      (none does yet) could still be double-activated, which is the half the
      appearance criteria do not measure.
    cleared-because: >-
      Confirmed nothing in the product sets any of the three attributes yet,
      so H9.6's "the state vocabulary is never entered" risk is exactly the
      known, disclosed, M3-P10-owned gap the plan already names rather than
