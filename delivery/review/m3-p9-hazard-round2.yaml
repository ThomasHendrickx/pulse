  - id: "9.3"
    quote: >-
      THE DISABLED, BUSY AND UNCONFIRMED APPEARANCES, MEASURED BY ENTERING
      THEM, AND WITH A MAGNITUDE ... an activation is REFUSED, observed at
      the refusal, with the CLICK'S TARGET as the observable ... FALSIFIED BY
      one control whose disabled, busy or unconfirmed snapshot differs from
      its at-rest snapshot by less than the stated magnitude, by one that
      still computes cursor pointer while disabled, by one that still
      computes pointer-events other than none while carrying aria-disabled,
      by one that still activates under it, or by a busy/unconfirmed element
      whose mark has no content or zero width.
    evidence:
      - >-
        `assertActivationRefused` (test/e2e/pressed-and-disabled.spec.ts:
        1097-1150) uses `page.mouse.click` at raw coordinates (never
        `dispatchEvent`), pins the bounding rect identical across the marked
        and unmarked attempts, and reads the CLICK'S TARGET via
        `clickedTargetRelation`, asserting "ancestor" while marked and
        "control" while unmarked — this is exactly the isolation the
        criterion demands (coordinates held fixed, only the marking toggled),
        and it is observed at the document-level capture refusal, not at a
        listener on the control (the recorder's click handler is registered
        on `document` at line ~319, ahead of any control-level listener in
        the capture order).
      - >-
        The stylesheet backs it: `[aria-disabled="true"]` sets
        `pointer-events: none` alongside the surface/ink change
        (src/app/globals.css:1563-1587), and a class-plus-attribute override
        (`button:disabled:active`, `[aria-disabled="true"][data-pressed]` at
        :1582-1587) stops a disabled control from also rendering the pressed
        rule, so a control does not look both "cannot be used" and "being
        used" at once.
      - >-
        Busy and unconfirmed marks are drawn as ::after pseudo-elements with
        non-"none" content and non-zero width (src/app/globals.css:1619-1624,
        :1643-1652), matching 9.3(b) and 9.3(c); the busy loop is a real
        `@keyframes` (pulse-busy-cycle) rather than a static opacity, and
        stands still under reduced motion because --duration-busy-cycle
        redefines to 0s there (no per-rule variant to forget, matching
        criterion 9.4's stated intent).
      - >-
        NOT INDEPENDENTLY RE-MEASURED BY ME: same disclosure as 9.2 above,
        the exact contrast/opacity numbers are the work history's captured
        run, not my own execution.
    met: true

