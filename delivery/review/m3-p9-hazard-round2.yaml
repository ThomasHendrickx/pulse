      resembles content drawn from a real statement. Half (b) of criterion
      9.8 is correctly recorded NOT WITNESSED.

  - class-id: H9.8
    probed: >-
      Read the set-construction code (sweep vs. enumeration, both directions
      asserted) rather than trusting the criterion's own description of it,
      and read the journey helpers for how each of the five conditional
      controls is actually reached (month view before import, the query-
