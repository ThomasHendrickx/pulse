      strongest clearance I can give without my own execution.

  - class-id: H9.12
    probed: >-
      Read the scoping-deviation clause in criterion 9.9(b) (halves (ii)-(v)
      may be taken on a named subset if the sweep does not fit) and checked
      whether the shipped spec actually uses that escape hatch or ran the
      full nineteen-control sweep, by reading the describe blocks and the
      controls each measurement loop iterates over.
    cleared-because: >-
      On my reading the spec runs the frame-sampled halves over the full
      collected set rather than a named subset (no DEVIATION comment
      invoking this clause appears anywhere in the file or the work
      history's deviations list), so this round did not need the fallback
