hazard-classes-addressed:
  - class-id: H4.1
    probed: >-
      The partial current month compared against a full month. Probed
      three ways: (1) structurally, the comparison read does not
      execute for the partial month
      (src/modules/overview/application/month-overview.ts:106-128
      fetches the previous-month four only when partial is false), so
      there is no computed comparison to leak into the view; (2) by
      executed probes P-F5 to P-F7 on the committed Brussels-day and
      month arithmetic, including the month rolling at 22:30 UTC in
      summer and 23:30 UTC in winter and the January-to-December
      comparison join; (3) by reading the e2e partial-month
      assertions (zero delta nodes, not-compared head) and the work
      history's executed mutation M1 that forced partial false and
      reddened the test. The one reachable inversion path found is a
      wrong clock, filed as CR-503 (a leaked PULSE_FIXED_NOW freezes
      the current month in production, silently making a partial
      month render as closed or a closed month as current).
    finding: CR-503
  - class-id: H4.2
    probed: >-
      Hidden unknowns making totals lie: UNRESOLVED rows or unmatched
      legs silently folded in or dropped. Probed by construction over
      the committed code: the partition probe P-D shows every
      flow-non-null row in exactly one surface and unmatched or
      unresolved amounts in no income, spend or reserves total (never
      folded in); the classifier battery P-C pins UNRESOLVED to zero
      amounts only; the fold probe P-E shows group totals summing to
      row totals with cash precedence intact. The class then produced
      findings on its two remaining edges: rows DROPPED from every
      surface (the flow-NULL shape, probe P-D3, finding CR-502,
      medium), and unknowns visible in the list but contradicted by
      the verdict line above them, including the verdict flipping to
      "Books close" over real gaps under cancellation and the
      recurring straddling-pair false alarm naming no cause (probes
      P-A and P-B, finding CR-501, high). The class's fixture-level
      guard (criterion 4.3) holds for what it asserts; the findings
      are the constructions it does not reach.
    finding: CR-501
  - class-id: H4.3
    probed: >-
      Hardcoded user-facing strings bypassing the catalogs. Probed by
      reading every JSX text node in
      src/modules/overview/ui/month-view.tsx (all user-facing copy
      goes through t() or t.rich(); the remaining literals are glyph
      expression containers: the euro sign, arrows, separators, the
      nav chevrons), by reading the full messages diff for en, nl, fr
      (the phase's new keys present in all three, no em dashes), by
      executing npm run lint at head (react/jsx-no-literals active
      over module UI, exit 0), and by relying on the work history's
      executed red witnesses (a literal text node reddened lint;
      mutation M4's hardcoded English verdict inside an expression
      container reddened the NL e2e assertion). One residue noted,
      not filed: GapList renders the raw ISO bookingDate
      (month-view.tsx:253), which is unlocalized DATA rather than a
      catalog bypass; a display-polish point for a later phase.
    cleared-because: >-
      Every user-facing string in the phase's UI resolves through the
      next-intl catalogs in all three locales, enforced by an active
      named lint rule witnessed red, and the executed locale e2e
      walks all three languages against the longest copy the view
      renders; no construction reached a hardcoded string a user
      would see.
  - class-id: H4.4
    probed: >-
      Literal colours or sizes drifting from the token system. Probed
      by executing the criterion 4.5 grep myself at the review head
      over src/modules/*/ui and src/modules/**/ui (exit 1, no
      literal oklch, hex or px font-size), by checking the phase's
      globals.css delta stays in the tokens-and-classes layer, and by
      relying on the work history's two structurally different red
      mutations (a hex in a style prop, an oklch in a comment, each
      exit 1, each restored). The alarm colour is asserted in the
      e2e as the COMPUTED resolved value of --color-alarm rather than
      a class name (test/e2e/month-view.spec.ts:117-131), which is
      the strongest form of the token discipline this phase could
      show.
    cleared-because: >-
      The executed token grep is clean at head, the gate wrapping it
      is green, and the one alarm treatment the design system allows
