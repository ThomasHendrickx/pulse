findings:
  - id: CR-506
    severity: low
    evidence:
      - >-
        The uninterpreted cause's user-facing remedy is false for the
        primary scenario it addresses (R-087 applied to copy): all
        three catalogs instruct "Upload the file again to complete
        the interpretation" (messages/en.json:112, messages/nl.json:113,
        messages/fr.json:113), but a re-upload of the SAME file
        cannot re-run interpretation: ingest inserts with
        skipDuplicates so the stuck rows keep their original importId
        and the new import gains zero rows
        (src/modules/import/adapters/import-repository.ts:347-366),
        importPeriod over the new import then finds no rows and
        returns null
        (src/modules/ledger/adapters/ledger-repository.ts:104-120),
        and interpretForImport returns null without interpreting
        (src/modules/ledger/application/interpret-window.ts:149-162).
        Traced through the committed path by this review; not
        executed against a database (the mechanism is three null
        checks in sequence).
      - >-
        No user-reachable alternative exists in the product: the
        recompute action throws in production as a dev-only surface
        (src/modules/ledger/ui/actions.ts:16-21), so the household's
        only organic heal is a FUTURE import whose 49-day padded
        window happens to cover the stuck dates. The CR-502 mechanism
        itself is unaffected: the rows stay visible and keep blocking
        the ok verdict, so nothing lies; the offered remedy just does
        not work.
    concrete-fix: >-
      Either make the words true or say true words. Truest fix: in
      upload-statement.ts and confirm-import.ts, when ingest reports
      zero rows added but the file's parsed rows exist, run
      interpretWindow over the PARSED rows' date span (padded) instead
      of skipping via the empty new import, which makes a re-upload
      genuinely re-interpret the covered window. Smallest fix: reword
      the three catalog entries to name what works, e.g. "Import a
      newer export that covers these dates to complete the
      interpretation." One sentence per locale either way.
    analysis: >-
      Filed under R-087's rule that a false present-tense claim
      nothing checks is a finding stated loudly; here the claim ships
      to the household in three languages as the remedy for a defect
      state. Low because the state remains visible and
      verdict-blocking either way, the scenario requires a failed
      interpretation to arise at all, and time heals it through any
      later overlapping import.
  - id: CR-507
    severity: low
    evidence:
      - >-
        The in-transit predicate joins the partner transaction row by
        id alone: src/modules/overview/adapters/overview-repository.ts:62-64
        joins "transactions" p ON p."id" = CASE ... with the
        household filter applied only to the LINK row
        (overview-repository.ts:65), so the joined partner row is the
        one read in this module whose query does not filter the
        transactions table on householdId, against CLAUDE.md
        non-negotiable 6 (every query filters on it). Harm is not
        constructible today: link rows are written solely by
        replaceInterpretation from the household's own interpreted
        set (src/modules/ledger/adapters/ledger-repository.ts:185-193),
        so a link can only name same-household transaction ids, and
        the predicate reads nothing from the partner row but its
        bookingDate. Verified static; noted rather than constructed
        because no committed write path produces the cross-household
        shape.
    concrete-fix: >-
      Add the defense-in-depth filter to the JOIN: AND p."householdId"
      = t."householdId" inside inTransitExists
      (overview-repository.ts:63), one line, restoring the letter of
      the tenancy rule so a future write-path bug cannot make a
      foreign row's booking date steer a household's verdict.
    analysis: >-
      Low and preventive: today the link table's own household filter
      transitively scopes the partner, and the only readable fact is
      a date; but the tenancy rule exists precisely so no query needs
      that transitive argument, and the fix is one line in the
      predicate the fix round introduced.

