findings:
  - id: CR-501
    severity: high
    evidence:
      - >-
        The verdict line is difference === 0 and nothing else:
        src/modules/overview/domain/month-projection.ts:183 sets
        reconciles from the derived difference alone, and
        src/modules/overview/ui/month-view.tsx:292-296 renders
        data-state ok and the "Books close" verdict from that flag.
        The difference includes every INTERNAL row booked in the
        month, matched or not (the changeInPot sum at
        src/modules/overview/adapters/overview-repository.ts:170 has
        no matched-leg exclusion), while the named causes cover only
        unmatched INTERNAL and UNRESOLVED rows
        (overview-repository.ts:171-176, month-view.tsx:323-346).
      - >-
        Executed construction 1 (probe P-A, captured): a matched
        settlement pair with the card-side mirror booked 2026-08-31
        and the settlement debit booked 2026-09-02 gives August
        difference=85000 with unmatchedCount=0 and unresolvedCount=0;
        the panel renders BROKEN with the alarm difference and NOT
        ONE cause block (both cause conditions false), and September
        renders the same alarm with the opposite sign. The committed
        matcher links a mirror within 4 days of the debit
        (src/modules/ledger/domain/interpret.ts:156-157), and the
        direct-debit lag is the documented reason the two legs book
        days apart (src/modules/ledger/domain/constants.ts:13-15), so
        this fires every time a card settlement's lag crosses a month
        end: a recurring false alarm on correct books, with the
        promised cause line (delivery/intake/pulse-v1-architecture.md:209)
        naming nothing. The implementer's open question M1P5-C12
        (delivery/work-history/m1-p5.yaml:581-591) names this half
        but calls the class rare, reading it as pot-to-pot transfers
        only; the settlement shape is monthly-recurring.
      - >-
        Executed construction 2 (probe P-B1, captured): two genuine
        unmatched INTERNAL legs of +40000 and -40000 (two different
        missing exports) give difference=0, so the panel renders
        data-state ok and the verdict "Books close" while two real
        export gaps exist; the unmatched cause block below it then
        reads "2 transfer legs ... totalling 0,00". Probe P-B2
        reaches the same ok verdict over ONE real gap by cancelling
        it against a matched straddling leg. Probe P-B3: a
        zero-amount UNRESOLVED row (the only UNRESOLVED-reachable
        shape, classify-flow.ts:115, probe P-C1) always leaves the
        verdict at "Books close" above a listed unresolved gap, a
        state the phase's own mv-unresolved fixture ships and whose
        data-state the spec deliberately does not assert
        (test/e2e/month-view.spec.ts:153-181 asserts cause visibility
        only).
      - >-
        R-087, a false present-tense comment: the derivation comment
        at src/modules/overview/domain/month-projection.ts:157-160
        states the difference "equals the sum of the month's INTERNAL
        and UNRESOLVED amounts, which is exactly what the named
        causes below account for". The first half is true; the second
        half is false, since matched INTERNAL legs whose partner
        books outside the month are in the sum and in no named cause,
        which is exactly probe P-A.
    concrete-fix: >-
      Close the identity so the causes sum to the difference by
      construction, then make the verdict require empty causes. (1)
      Add one FILTER to monthFigures: matchedInternalCents = SUM
      FILTER (WHERE flow = 'INTERNAL' AND the existing
      MATCHED_LINK_EXISTS predicate), carried through RawMonthFigures
      and MonthFigures; by the derivation already in the file,
      difference = unresolvedCents + unmatchedInternalCents +
      matchedInternalCents identically. (2) Render a third cause
      block, the "in transit across the month boundary" line the
      implementer's M1P5-C12 already names as the natural extension,
      shown when matchedInternalCents is non-zero, in the normal (not
      alarm) treatment since both legs are matched and correct. (3)
      Define reconciles as difference === 0 AND unmatchedInternalCount
      === 0 AND unresolvedCount === 0, so "Books close" can never
      render above a listed gap and cancelling gaps can never flip
      the verdict. (4) Correct the month-projection.ts:157-160
      comment to the new true sentence. (5) Extend
      test/e2e/month-view.spec.ts with a straddling-pair fixture
      asserting the in-transit line, and assert data-state=ok is
      REFUSED in the unresolved test (the current fixture already
      constructs the dangerous state).
    analysis: >-
      One root cause, three symptoms: the reconciliation verdict is a
      projection-identity residual, not a statement about gaps. The
      false-alarm half erodes the trust this screen exists to earn
      (a monthly alarm naming nothing teaches the household to ignore
      the alarm); the verdict-flip half is the M1-P3 CR-301 class at
      the presentation layer, books LOOKING closed over a real gap,
      which the review brief's escalation discipline puts at high.
      High, not critical, because every committed cent in income,
      spend, reserves and pot change stays correct and the gap rows
      themselves remain listed below the lying verdict line.
  - id: CR-502
    severity: medium
    evidence:
      - >-
        transactions.flow is nullable
        (prisma/schema/import.prisma:115) and rows are committed with
        flow NULL by the ingest transaction
        (src/modules/import/adapters/import-repository.ts:347-366);
        interpretation runs afterwards as a SEPARATE database
        transaction (src/modules/import/application/confirm-import.ts:114-129,
        upload-statement.ts:74-92 await deps.interpret AFTER
        ingestRows commits; the write is
        src/modules/ledger/adapters/ledger-repository.ts:136). A
        crash or error between the two commits leaves durable
        flow-NULL facts.
      - >-
        The month read model is blind to such rows in every surface:
        monthFigures filters flow IS NOT NULL
        (src/modules/overview/adapters/overview-repository.ts:180),
        so they are absent even from rowCount and changeInPotCents,
        and the grouped queries filter named flows
        (overview-repository.ts:83,132,228-231). Executed probe P-D3:
        figures with and without a committed 777,00 flow-NULL row are
        byte-identical, rowCount blind, panel green. Probe P-D2: the
        flow-NULL row is the only shape in ZERO surfaces of the
        partition.
      - >-
        The only needs-interpretation marker is the import status
        staying INGESTED, and no persistent screen shows it: the
        import status line renders from a transient ?status= redirect
        parameter (src/modules/import/ui/import-status-line.tsx:4-5),
        and the month view queries nothing about imports. The
        household sees a clean month view with a green panel and
        silently missing money, the exact H4.2 shape (hidden unknowns
        making totals lie, here dropped rather than folded in) and
        the charter's never-invisible rule (charter.yaml:72-74).
    concrete-fix: >-
      Make the read model count what it excludes: drop the flow IS
      NOT NULL where-clause from monthFigures, keep changeInPot and
      the named sums filtered by flow as they are, and add
      uninterpretedCount = COUNT(*) FILTER (WHERE flow IS NULL) to
      RawMonthFigures; when it is non-zero, render a visible
      awaiting-interpretation warning in the reconciliation panel (a
      third gap kind naming the count and the affected accounts) so a
      failed interpretation is loud on the screen the household
      trusts instead of invisible. A vitest fake-repository test
      plus one e2e assertion pin it.
    analysis: >-
      Arming requires a mid-pipeline failure (crash between the two
      transactions, or interpret throwing after a committed ingest),
      so this does not fire on the happy path; but once armed it is
      durable (nothing re-runs interpretation on its own, by the
      project's own no-queue no-cron scope discipline) and the month
      view then lies silently with a green panel until an unrelated
      re-import happens to re-cover the window. Medium: real
      reachability, silent durable harm on the trusted screen, but
      needs a failure event to arm.
  - id: CR-503
    severity: medium
    evidence:
      - >-
        Executed probe (probe-clock.cjs, captured): with
        NODE_ENV=production and PULSE_FIXED_NOW=2020-01-01T00:00:00Z,
        appClock().now() returned 2020-01-01T00:00:00.000Z while
        isProduction() returned true in the same process. The
        override (src/platform/config.ts:59-69, consumed at
        src/platform/clock.ts:24-27) has no environment guard: a
        deployed environment where the variable leaks (a copied env
        set, a preview env promoted) silently freezes the month
        view's notion of the current month forever, which freezes the
        partial-month flag, the comparison target and the
        never-compared rule, with no log line and no visible symptom
        beyond the wrong month rendering as in progress.
      - >-
        R-087, an unchecked present-tense claim: the comment at
        src/platform/config.ts:54-58 states "set by the Playwright
        webServer and nothing else" and "Unset everywhere else, so
        production runs on the system clock". Nothing checks either
        sentence; the probe above shows production honouring the
        variable when it IS set. The unused guard sits one screen up:
        isProduction() at src/platform/config.ts:47.
    concrete-fix: >-
      Refuse the override in production at the point of use: in
      fixedNowOverride, when isProduction() is true and the variable
      is set, throw the same loud config error the module already
      uses (or log-and-ignore with the [pulse:config] prefix; the
      throw is truer to the module's stated contract). This cannot
      affect the committed e2e flow, whose webServer runs npm run dev
      (playwright.config.ts:29) under NODE_ENV=development. One
      vitest case pins the refusal.
    analysis: >-
      The brief's press point 7 verbatim: a deployed fixed clock
      would freeze the month view silently, and the probe shows the
      production build honours it. Medium because arming requires an
      operator-side env mistake, but the failure is silent, durable
      and lands on the exact mechanism (the partial-month rule) the
      phase exists to get right, and the refusal is a three-line
      change beside an already-imported guard.
  - id: CR-504
    severity: low
    evidence:
      - >-
        The phase ships its entire pure projection layer with zero
        fast-gate coverage: npm test at head af759b3 discovers 219
        tests, the same count as the M1-P4 head, and the phase's test
        delta is e2e-only plus an 8-line edit to
        test/application/resolve-merchants.test.ts (git diff
        b54783b..af759b3 over test/). No unit or property test
        exercises foldGroups, attachDeltas, sumGroups,
        deriveMonthFigures (src/modules/overview/domain/month-projection.ts)
        or previousMonth, nextMonth, monthBounds, daysInMonth,
        brusselsDayOf, parseMonth (src/modules/overview/domain/month.ts).
      - >-
        Consequently the year-boundary comparison path (January
        compared to the previous year's December) and the leap-year
        bounds have NO executed coverage anywhere in the repository's
        gates: both committed e2e specs pin August/July 2026 only
        (test/e2e/golden-journey.spec.ts:128-171,
        test/e2e/month-view.spec.ts:5-7). This review's probes P-F1
        to P-F10 executed those paths green, so this is a coverage
        gap, not a defect; the gate registry's
        unit-tests-for-changed-service-methods row is the standing
        expectation it falls short of.
    concrete-fix: >-
      Add one fast-gate spec (test/domain/month-projection.test.ts or
      similar) covering the fold partition (group totals sum to row
      totals; cash precedence over a named merchant), attachDeltas
      joining by key across the year boundary, deriveMonthFigures'
      identity, previousMonth and monthBounds across January and leap
      February, and brusselsDayOf at a UTC month edge. The
      constructions in this review's probe suite are a ready-made
      basis, and CR-501's fix lands new derivation logic that needs
      exactly this file to be pinned red-first.
    analysis: >-
      Low: everything probed came back correct, and the e2e suite
      covers the composed happy paths. Filed because the projection's
      pure half is precisely where the next regression would be
      silent (a sign flip or an off-by-one month survives typecheck
      and lint, and the e2e fixtures see two months of one year), and
      the magnitude-delta semantics under a sign-flipping net-refund
      group (probe P-F11, delta -10,00 when the true spend swing is
      70,00 less) deserves a pinned decision rather than an accident.

