findings:
  - id: CR3-M3P12-01
    severity: medium
    analysis: |-
      A FALSE CLAIM IN OPERATOR-FACING OUTPUT ON A REACHABLE PATH (clause R-087 shape). scripts/rederive-merchant-rules.ts wraps the WHOLE main() function
      in one top-level rejection handler (void main().then(...)), and the handler's second console.error line, at :249, unconditionally states: "the
      rule writes are applied in ONE transaction, so a failure inside them wrote nothing and the table is as this run found it." That sentence is true
      for a rejection coming from applyRuleWrites itself (I witnessed this: a real Postgres constraint violation injected into that call rolls the whole
      batch back, see evidence). It is FALSE for a rejection coming from deps.recompute(context), which is awaited immediately afterward, OUTSIDE the
      transaction, by design (rederive-rules.ts:611-622, and the design is right: recompute writes interpretation output, is idempotent, and holding a
      transaction open across it would cost a long write lock for no benefit). If applyRuleWrites succeeds and commits, and recompute then throws for any
      reason (a query timeout, a bug, contention), the SAME error handler fires and prints the SAME sentence, which now asserts the table is unchanged
      when merchant_rules has, in fact, already been rewritten and/or had rules inserted. The handler has no way to distinguish which of the two awaits
      threw, so it cannot help but print the wrong claim on this path. The consequence is bounded, not a data-loss hazard: pass one and pass two are both
      idempotent (already-namespaced and already-present rules are recognised and left alone or not re-inserted on a subsequent run, per criteria 12.8
      and 12.21), so re-running heals the state and the report's OTHER sentence, "re-running is safe and converges", remains true throughout. But an
      operator who trusts the specific sentence printed, rather than re-deriving the true state independently, is told something false about a database
      they were just warned repeatedly (by this same script, by criterion 12.23, by the whole phase) to treat with extreme care. No acceptance criterion
      in this phase asks about this specific message, which is why this is reported as a defect of the artifact rather than as a criterion miss, in
      exactly the shape the criteria contract's own instructions describe.
    evidence:
    - "scripts/rederive-merchant-rules.ts:224-252, the whole rejection handler; the false sentence is at line 249."
    - "src/modules/merchants/application/rederive-rules.ts:601-623: applied gate at :601, the transactional write at :618-621, deps.recompute(context) awaited immediately after at :622, OUTSIDE the transaction and with no local try/catch separating the two failure sources from each other or from the outer handler."
    - "My own witness that applyRuleWrites really is atomic (so the sentence IS true for that source): an uncommitted local script (deleted before any commit, never staged) seeded one household, two merchants and two MerchantRule rows in a database I created for this review (pulse_r3crit, local supabase Postgres at 127.0.0.1:54322), then called applyRuleWrites with a batch of one UPDATE plus one INSERT whose pattern collides with an existing row's (householdId, kind, pattern) unique key. Captured output: \"THREW (expected): PrismaClientKnownRequestError\", the table's patterns identical before and after, \"threw: true table unchanged: true row count before/after: 2 2\"."
    - "No test in test/application/rederive-merchant-rules.test.ts or scripts/rederive-merchant-rules.ts exercises a recompute-only failure (confirmed by reading the full CR2-M3P12-04 describe block at lines 1207-1260 of the test file, which asserts the handler's WORDING and the existence of the transactional write, but never injects a failure from the recompute dependency specifically to check what the handler then prints)."
    concrete-fix: >-
      In scripts/rederive-merchant-rules.ts, wrap the two awaits in rederive-rules.ts's apply block (or the call site in the script) so the two failure
      sources are distinguishable, and change the top-level handler to print a claim scoped to which one actually failed: something like "the rule writes
      committed before this failure; merchant_rules may have been rewritten and recompute has not run to completion" when the failure follows a
      successful applyRuleWrites, versus the current sentence when applyRuleWrites itself is what rejected. A minimal version: have
      rederiveMerchantRules catch a recompute failure specifically and rethrow a distinguishable error (or attach a flag such as
      { writesCommitted: true }) that the script's handler branches on before choosing which sentence to print.
  - id: CR3-M3P12-02
    severity: low
    analysis: |-
      CRITERION 12.14's E2E HALF IS NOT MET ON ANY RUN PRODUCED SO FAR, INCLUDING MINE, AND THE CAUSE IS ENVIRONMENTAL RATHER THAN THIS ROUND'S CODE.
      This is not a correction of the implementer's own honesty: delivery/work-history/m3-p12.yaml already records its last test:e2e attempt as
      result: red with a detailed, well-evidenced argument that the three failures (golden-journey.spec.ts:79, import.spec.ts:170,
      month-view.spec.ts:275) are contention artifacts, not this phase's doing, and names a concurrent fleet lane hitting the same four tests on the
      same local stack at the same time. I independently reproduced the SAME class of failure three separate times today, from an unedited working
      tree and default (non-moved) ports, including two consecutive runs of the identical isolated golden-journey test producing two DIFFERENT
      failure symptoms (a button-click timeout at :64, then a household-context timeout at :91) - which is strong evidence against a deterministic
      code defect and for load-induced flakiness, and rules out the implementer's own port move (3200/3300) as the cause, since I never touched the
