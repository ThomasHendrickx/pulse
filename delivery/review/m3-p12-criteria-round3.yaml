      STANDING GATE as worded has no allowance for a shared, contended CI-like environment, so a phase can be everywhere correct and still never
      produce the green e2e run criterion 12.14 asks for, on this fleet, at this load level, which is the same shape of gap the criteria contract's
      own instructions warn about (a contract that cannot see the defect it needs to see). This is reported as a defect of the fleet's standing gate
      practice, not of this implementation.
