findings:
  - id: R2-001
    severity: high
    evidence:
      - >-
        The criterion claims a third red: "AND IT IS RED A THIRD WAY, which is
        why the seed carries two reserve accounts and not one: a read that
        normalises the join and then GROUPS ON THE JOINED ACCOUNT'S OWN COLUMN,
        or on the joined label alone, returns one group per account over a
        one-account seed and satisfies a thinner assertion completely while it
        has not normalised the grouping key at all."
      - >-
        The seed as now specified is three rows on the POT account, all flow
        RESERVE, all in period: two naming the first reserve account (one
        compact, one spaced) and one naming the second. Every one of the three
        JOINS a registered account.
      - >-
        Walked by hand against that seed, a read that normalises the join and
        writes GROUP BY ra."iban", ra."label" returns exactly TWO groups; each
        label is that account's typed label; each group's own
        counterparty-account field is ra."iban", which step 3 requires to be
        stored canonical ("Registration normalises what the owner typed BEFORE
        storing it"), so it is BYTE IDENTICAL to the canonical form of that
        account's number; and the totals split correctly. All four assertions
        PASS. The claimed third red does not fire.
      - >-
        The reason is structural: on every row that joins, ra."iban" and the
        canonical form of t."counterpartyIban" are the same string by
        construction. The two expressions can only differ on a row that does
        NOT join, and the seed contains no such row. GROUP BY ra."id" passes
        identically, since a Postgres group by primary key functionally
        determines both label and iban.
      - >-
        The criterion itself names the defect that variant carries and then
        does not seed it: "Grouping on the joined column collapses every
        reserve row whose counterparty matches no registered account into a
        single group whose key and label are both null, against a key the read
        declares as a string (src/modules/overview/adapters/overview-repository.ts:186)."
      - >-
        The same seed also cannot tell a LEFT JOIN from an INNER JOIN, because
        all three rows match. Switching src/modules/overview/adapters/overview-repository.ts:175
        to an inner join silently drops every reserve movement whose
        counterparty is not a registered account, and passes every assertion
        this criterion makes.
      - >-
        HONESTY NOTE. The group-key assertion was round one's own concrete
        edit, adopted verbatim, and round one claimed it "pins the GROUPING KEY
        itself". It does not, for the reason above. The error is this
        reviewer's and the criterion inherited it.
    concrete-edit: >-
      In criterion 14.2's seventh assertion, extend the seed and the assertion
      together. After "and the third names the second reserve account", add:
      "and TWO FURTHER ROWS name two DIFFERENT counterparty account numbers the
      household has NOT registered, seeded below the importer for the same
      declared reason as the spaced row, because a row that FAILS to join is
      the only row on which the canonical form of the stored column and the
      joined account's own column differ, and without one every candidate key
      is still one-to-one with every other." Then replace "asserts that exactly
      TWO reserve movement groups come back, one per reserve account; that each
      group's label is byte identical to that account's typed label and carries
      no account-shaped token" with: "asserts that exactly FOUR reserve movement
      groups come back; that the two groups keyed to a registered account carry
      labels byte identical to those accounts' typed labels and carry no
      account-shaped token; that the two groups keyed to an unregistered
      counterparty are SEPARATE groups and not one, each keyed by the canonical
      form of its own stored value and each falling back to that value as its
      label (src/modules/overview/adapters/overview-repository.ts:187); and that
      no group's key is null." Add, to the list of reds: "AND IT IS RED A FOURTH
      WAY, on an INNER JOIN, which returns two groups and silently drops the
      household's reserve movements toward anything it has not registered."
      Replace the existing third-red paragraph's claim that two accounts make
      the joined-column variant red with the true statement: two accounts kill
      grouping on the joined LABEL alone, and only an unjoined row kills
      grouping on the joined account's identity.
    analysis: >-
      This is the same class of defect the amendment exists to fix, one level
      down: a criterion asserting a discrimination it does not have. The seed
      was thickened along the wrong axis. Adding a second ACCOUNT separates
      keys that differ per account, and the joined account's identity is not
      one of those, because it agrees with the correct key on every joining
      row. What separates them is a row with no account behind it, and that is
      also the row on which the variant's real defect (a null key against a
      declared string, and an inner join dropping money) becomes visible. Two
      rows and one reworded assertion close both.
  - id: R2-002
    severity: high
    evidence:
      - >-
        The criterion's claim: "a fast-gate test enumerates the write paths that
        can reach the stored counterparty account column and asserts that the
        reachable set is upper-case, compact and account-shaped, so on the day
        an importer change makes the seeded state reachable, something goes red
        on its own."
      - >-
        The criterion's requirement: "It DISCOVERS the writers of that column by
        walking src/ rather than by naming files; it fails when a writer appears
        that no shape gate covers; and it carries a red-witness note recording
        the state it was shown red against."
      - >-
        The importer change that makes the seeded state reachable is not a new
        WRITER. It is a widening of the GATE at
        src/modules/import/domain/detect-profile.ts:45, the one line that
        decides which values the existing writer may store. Adding a space to
        that character class changes no writer, adds no file, and changes no
        write shape, so an enumeration of writers is green through exactly the
        edit it is required to survive.
      - >-
        Measured against the artifact in the tree. test/domain/counterparty-key-invariant.test.ts
        on claude/m3-p14-account-registry at 837dfce does assert the gate, and
        asserts it as SOURCE TEXT: expect(detector).toMatch(/const IBAN = \/\^\[A-Z\]\{2\}/)
        and expect(detector).toContain("values.every((value) => IBAN.test(value))").
        The first matches only the first twelve characters of the pattern, which
        sit BEFORE the character class; the second is untouched by widening it.
        A detector rewritten to accept a spaced value passes both.
      - >-
        So the artifact the criterion now requires is, on the one edit the
        criterion names, exactly the guard the shared dispatch contract records
        as the measured failure: green and worthless.
    concrete-edit: >-
      In criterion 14.2, replace "it fails when a writer appears that no shape
      gate covers" with: "it fails when a writer appears that no shape gate
      covers, AND it asserts each gate's BEHAVIOUR rather than its source text,
      by executing the gate against values rather than by matching its spelling:
      the gate must ACCEPT an upper-case compact account number and REJECT the
      same number spaced, the same number with a lower-case country code, and
      the same number carrying a tab or a non-breaking space. A source-text
      assertion on the gate does not meet this clause, because the importer
      change this test exists to survive is a widening of the gate's character
      class, which changes no writer, adds no file, and leaves every spelling
      the assertion matches intact: measured against the artifact in this
      phase, /const IBAN = \/\^\[A-Z\]\{2\}/ and a toContain of the every-guard
      both pass a detector rewritten to admit a spaced value. The gate is
      exported, or the detector is called, so that this assertion can be made
      against behaviour at all."
    analysis: >-
      Round one's finding was that the sentence required nothing. It now
      requires an artifact, and the artifact as specified cannot hold the claim
      attached to it. The enumeration answers "who writes this column", the
      claim needs "what may reach this column", and those come apart precisely
      at the gate. This is one clause and the artifact already exists to carry
      it; what has to change is that the gate is executed rather than spelled.
  - id: R2-003
    severity: medium
    evidence:
      - >-
        The criterion requires the enumeration to DISCOVER writers and to fail
        "when a writer appears that no shape gate covers". It states no lower
        bound on what discovery must find, so a discovery that finds NOTHING
        satisfies the failure clause vacuously and is green.
      - >-
        The artifact in the tree does carry the lower bound, by exact set
        equality against the two known producers, but no criterion requires it,
        so an implementation that drops it still meets 14.2 as written.
      - >-
        "walking src/" is unpinned. Measured on this tree, src/ carries exactly
        one top-level file, src/middleware.ts, and that is the file a
        glob-shaped walk drops: src/**/*.ts misses it in the glob dialects
        where ** requires at least one directory segment, which is the blind
        spot a sibling plan-writer found in another phase today. The artifact
        in the tree walks with a readdirSync recursion and does reach it, by
        the implementer's choice rather than by the criterion's requirement.
    concrete-edit: >-
      In criterion 14.2, after "It DISCOVERS the writers of that column by
      walking src/ rather than by naming files", add: "The discovered set is
      asserted by EXACT EQUALITY against the producers known at the time it is
      written, so a discovery that finds nothing, or finds one where there are
      two, is RED rather than vacuously green: a test whose only assertion is
      that no undiscovered writer lacks a gate passes by discovering nothing.
      And the WALK's own coverage is asserted, because src/ carries exactly one
      top-level file, src/middleware.ts, and a glob-shaped walk drops it: the
      test asserts that the file set it walked contains that file."
    analysis: >-
      Both halves are the same failure with different causes: an enumeration is
      only as good as the set it enumerated, and neither the floor nor the reach
      of that set is currently required. Each is one assertion.
  - id: R2-004
    severity: medium
    evidence:
      - >-
        The header clause: the seeded test's header states four things, the
        fourth being "the NAME of the write-path enumeration test that holds the
        unreachability claim, so that deleting either test leaves a dangling
        reference in the other."
      - >-
        Only the SEEDED test's header is required to name the other. Nothing
        requires the write-path enumeration to name the seeded test back. So
        deleting the seeded test leaves no dangling reference anywhere, and the
        clause's stated purpose, "deleting either test", is delivered in one
        direction only.
      - >-
        In the direction it does work, the deterrent is prose. Nothing greps a
        header, so a reader who deletes the write-path enumeration leaves a
        stale name in a comment that no gate reads.
    concrete-edit: >-
      In criterion 14.2, replace "so that deleting either test leaves a dangling
      reference in the other" with: "and the write-path enumeration's own header
      names the seeded test back, so the reference is mutual rather than
      one-directional. One direction is made MECHANICAL rather than left to
      prose, because nothing greps a comment: the write-path enumeration, which
      already reads source files as text, asserts that the seeded test exists at
      its recorded path and that its header carries the unreachability
      statement, so deleting the seeded test reddens the FAST gate. Deleting the
      enumeration then leaves the seeded test's header naming a file that is
      gone, which is the dangling reference this clause asks for, and the
      criterion states plainly that this half is prose and the other half is
      enforced."
    analysis: >-
      Round one's diagnosis was that the defence sat in the wrong file, and
      moving it into the test header is the right fix. What is left is that the
      deterrent points one way and is unenforced in both. One readFileSync in a
      test that already does exactly that kind of read makes the half that
      matters real, and says honestly which half is not.
  - id: R2-005
    severity: medium
    evidence:
      - >-
        Criterion 14.4 now reads: "Every entry on it is named here and it
        carries exactly two: the SQL copy of the canonical form ... and
        compactIban, if it survives."
      - >-
        "carries exactly two" and "if it survives" cannot both hold. The second
        clause makes the count conditional and the first states it absolutely.
      - >-
        Measured: compactIban does NOT survive. On
        claude/m3-p14-account-registry at 837dfce, git grep -c compactIban over
        src/ and test/ returns two hits, both inside COMMENTS recording that the
        helper used to exist (src/platform/account-number.ts and
        test/domain/account-number.test.ts). The permitted list in that test
        carries ONE entry. So a criterion demanding exactly two entries fails
        against the tree that satisfies its intent.
      - >-
        And the criterion states no remedy for a legitimate third copy: an
        unnamed entry FAILS the criterion, which is the intended teeth, but with
        no named route the next implementer's cheapest move is the one this
        clause was written to stop, widening the list in silence.
    concrete-edit: >-
      In criterion 14.4, replace "Every entry on it is named here and it carries
      exactly two" with: "Every entry on it is named here and it carries NO
      entry this criterion does not name. This criterion names two candidates
      and the list carries whichever of them exist in the tree: the SQL copy of
      the canonical form that criterion 14.2's normalising reserves join and
      grouping key require inside
      src/modules/overview/adapters/overview-repository.ts, which that criterion
      makes mandatory and which cannot import the platform function because the
      join compares column to column; and compactIban, if it survives replacement
      by the platform form. A list carrying one of the two because the other was
      replaced meets this criterion; a list carrying an entry this criterion does
      not name does not." Then add: "A THIRD copy is not added to this list by
      whoever needs it. It is an amendment to THIS criterion, made in the commit
      that needs it and naming it here, because the failure this clause exists
      against is a list that grew without a criterion recording that it grew."
    analysis: >-
      The closing is right and the count is wrong, in the direction that fails a
      correct tree. Naming the entries is what makes the list checkable against
      the plan; fixing the count to the named SET rather than to a cardinality
      keeps that property and stops the criterion going red because an
      implementer did the better thing and deleted the private helper.
  - id: R2-006
    severity: low
    evidence:
      - >-
        The enumeration in the tree recognises three write shapes: an object
        property, a direct assignment, and the named optionalText call. A write
        reaching the column through an object SPREAD, or through a computed
        key, is invisible to all three and would not be discovered at all, so
        the clause "it fails when a writer appears that no shape gate covers"
        would not fire for it.
      - >-
        Spread writes of a parsed row are an idiom already present in this
        repository's test doubles, so the shape is not hypothetical.
      - >-
        The criterion requires a red-witness note but does not say what the
        witness must have been, so a witness added as a plain object property
        satisfies it while leaving the shapes the discovery cannot see untested.
    concrete-edit: >-
      In criterion 14.2, replace "and it carries a red-witness note recording
      the state it was shown red against" with: "and it carries a red-witness
      note recording the state it was shown red against, which includes a
      producer written in a shape that is NOT a literal property assignment, an
      object spread or a computed key, because a text-scanning discovery sees
      only the shapes it was written for; where such a shape cannot be
      discovered, the note records that limit in the test rather than leaving it
      for the next reader to find as a gap."
    analysis: >-
      The honest limit of a text-scanning enumeration, stated in the test rather
      than discovered later. Low because the shapes it does cover are the ones
      this codebase writes today, and the edit is a sentence in a note.
