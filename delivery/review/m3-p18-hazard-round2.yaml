findings:
  - id: HZ2-M3P18-01
    severity: low
    analysis: >-
      The pin that claims to keep the migration's inlined whitespace
      class byte-equal to the platform constant does not hold all four
      inlined sites, and single-site drift is exactly the failure the
      migration's own safety argument cannot survive. The migration
      text carries four occurrences of the class (the SET expression,
      the IS DISTINCT FROM guard, and both sides of the NOT EXISTS
      collision comparison); the collision guard's soundness, proven in
      round one and re-proven here, rests on ALL FOUR being one
      expression, because the skip condition and the rewrite must agree
      on what a canonical form is. The fast-gate pin
      (test/domain/canonical-backfill.test.ts:63 through :68) asserts
      one containment, satisfied by any one of the three a-side
      occurrences, plus the absence of the bare POSIX class. Witnessed
      by experiment over copies: dropping one escape from any single
      occurrence leaves both pin assertions green, and running the copy
      mutated in the collision comparison over the NBSP twin pair
      fires the unique index mid-statement, the exact H18.6 deploy
      death the guard exists to prevent. The vector is narrow, a
      future edit to a migration file that convention treats as
      append-only, which is why this is low; but this same fix round
      edited this same migration in place while it was unmerged, so
      the vector is not hypothetical on an unmerged branch, and the
      window stays open until merge. Clause R-087 attaches to two
      sentences that state the guarantee as broader than it is: the
      test comment saying this assertion is what keeps the inlined
      copy byte-equal to the constant
      (test/domain/canonical-backfill.test.ts:56 through :60), and the
      fix-round notes' sentence that the migration pin now asserts
      byte equality between the inlined class and the platform
      constant (delivery/work-history/m3-p18-notes.md, the fast-gate
      paragraph of the HZ-01 section). Both are true of one
      occurrence and false of the artifact.
    evidence:
      - >-
        Occurrence count: four, counted by splitting the
        comment-stripped committed migration text on the exact constant
        value in node.
      - >-
        Drift experiment R2-P7: with one escape removed from the b-side
        occurrence, and separately from the second and third a-side
        occurrences, the two pin assertions evaluated verbatim over the
        mutated text remain green in every case.
      - >-
        Harm witnessed: the copy mutated in the NOT EXISTS a-side,
        run via psql over a household holding the NBSP-spaced rendering
        beside its compact twin, fails with a duplicate key violation
        on the per-household unique account index, the deploy-killing
        outcome hazard class H18.6 names; the committed unmutated
        migration over the same seed spares the pair and exits clean.
    concrete-fix: >-
      Strengthen the pin to hold the artifact, not a witness: in
      test/domain/canonical-backfill.test.ts, extract every
      regexp_replace pattern literal from the comment-stripped
      migration text (a match-all over regexp_replace calls), assert
      the extraction finds exactly four, and assert each extracted
      pattern is byte-equal to ACCOUNT_NUMBER_SQL_WHITESPACE_CLASS.
      Correct the two overbroad sentences (the test comment and the
      notes paragraph) to say the pin holds every occurrence, in the
      same change. Three lines of test and two of prose; no product
      code moves.
