findings:
  - id: CR-M3P9-01
    severity: medium
    evidence:
      - "delivery/work-history/m3-p9-notes.md:125 records criterion 9.8(b) as NOT WITNESSED, on the ground that the owner's real statements are absent from this container so the probe set could not be built here. It is the only place in the phase's two work-history documents where 9.8(b) is recorded at all."
      - "That ground is false for the container this branch is reviewed in. Both real statement uploads, the two whose 8-hex prefixes fleet warning 9 records, are on disk under /root/.claude/uploads/, which is the only uploads directory in the container. The file names are deliberately not reproduced here because they embed identifiers."
      - "delivery/review/m3-p6-criteria.yaml:47 records an earlier fleet clean-room reviewer parsing one of those same two uploads through the shipped pipeline, in this same container, so the availability is not new and not specific to this session."
      - "Criterion 9.8(b) assigns probe construction to review time, in the words built in the container at review time from the real uploads, so the NOT WITNESSED branch was taken before the branch that owns the work was tried."
      - "What I did witness here: 11 identifier and date probes built at review time from the two upload file names, kept outside the repository and never committed, return no hit over git ls-files tracked content, no hit over styles/tokens.css, src/app/globals.css, playwright.config.ts, test/e2e/pressed-and-disabled.spec.ts, delivery/work-history/m3-p9.yaml or delivery/work-history/m3-p9-notes.md, and no hit over the commit messages on a4f1a94..88dbaac. Every one exits 1, which is the direction the criterion requires."
      - "What I could not witness: the holder-name, merchant-string and thousands-form amount probe families. Two attempts to extract text from the two PDFs were refused by this container's tool policy, so those three families could not be constructed at all."
    concrete-fix: "Correct delivery/work-history/m3-p9-notes.md:125 to say that the real uploads are present in the executing container, and replace the NOT WITNESSED record with the two halves that are now separable: witnessed and exit 1 for the identifier and date probe families, unwitnessed for the three content-derived ones with the refusal named as the reason. Then build the three remaining families from the uploads, referring to them by 8-hex prefix only, and record their exit codes beside the command."
    analysis: >-
      The substance is clean as far as anything here could measure it, and this
      phase's diff is two stylesheets, one config line and one spec, which is
      close to the smallest surface a statement leak could use. The finding is
      not that content leaked. It is that the one criterion this fleet has
      already lost a round to was recorded as unwitnessable on a premise that is
      false in the container the work runs in, and that a reviewer who accepted
      the sentence would have skipped the check exactly as it was skipped. Clause
      R-087 names precisely this shape: a document sentence asserting an
      impossibility with no captured command behind it. There is no captured ls,
      no captured find and no captured exit code behind absent from this
      container anywhere in either work-history document.
  - id: CR-M3P9-02
    severity: low
    evidence:
      - "Criterion 9.3 is falsified by, among other things, a busy or unconfirmed element whose mark has no content or zero width, so the zero-width half binds the unconfirmed mark as well as the busy one."
      - "The busy mark's width is asserted at test/e2e/pressed-and-disabled.spec.ts:341, which reads parseFloat(busy.afterWidth) and requires it above zero."
      - "The unconfirmed mark has only one assertion, test/e2e/pressed-and-disabled.spec.ts:505, and it checks content alone. afterWidth is captured into the snapshot at test/e2e/pressed-and-disabled.spec.ts:189 and then never read for that element."
      - "Substantively the mark is not zero width today: src/app/globals.css:1513 declares width: var(--space-4) on the unconfirmed pseudo-element and styles/tokens.css:121 declares --space-4: 8px, on an li element (src/modules/merchants/ui/merchant-review.tsx:26). So the clause is unmeasured rather than violated, and a later phase restyling merchant-row could zero it without turning the suite red."
    concrete-fix: "Add one assertion after test/e2e/pressed-and-disabled.spec.ts:505: expect(parseFloat(rowMarked.afterWidth), \"unconfirmed mark has zero width\").toBeGreaterThan(0)."
  - id: CR-M3P9-03
    severity: low
    evidence:
      - "src/app/globals.css:1391 justifies the new base rule with the sentence that four of the nineteen controls are bare anchors, naming the two auth cross-links and the two links on the import result screens, and delivery/work-history/m3-p9.yaml:193 repeats it as four of the nineteen controls are bare anchors, so this was a live hole rather than a hypothetical one."
      - "Two of those four never needed the rule. src/modules/import/ui/import-result.tsx:36 and src/modules/import/ui/import-result.tsx:66 render their anchors as direct children of the import-screen section, and src/app/globals.css:299 declares display: flex on it. A flex item is blockified whatever its specified display is, and a block box is transformable."
      - "Measured, not reasoned. A probe run here with @playwright/test on a page carrying only a:active { transform: translateY(3px) } and NO anchor display rule returned, for an anchor inside a paragraph, display inline with transform matrix(1, 0, 0, 1, 0, 3) and rectTop 16 both at rest and while held; and for an anchor that is a direct child of a display:flex section, display block with the same matrix and rectTop moving from 50 to 53."
      - "The two that genuinely needed it are the auth cross-links, which sit alone inside a paragraph (src/app/(auth)/sign-in/page.tsx:36 through :38 and src/app/(auth)/sign-up/page.tsx:36 through :38, styled at src/app/globals.css:92)."
      - "It matters because the count is the entire justification offered for changing a bare element selector that reaches every anchor in the product, and the deviation record at delivery/work-history/m3-p9.yaml:449 itself flags that rule as outside what files-to-touch anticipated."
    concrete-fix: "Correct the count to two in the comment at src/app/globals.css:1391 and in the deviation at delivery/work-history/m3-p9.yaml:449, naming the import-screen flex context at src/app/globals.css:299 as why the other two never needed it. Then either keep the base rule with the corrected justification, or narrow it to the anchors that need it."
  - id: CR-M3P9-04
    severity: medium
    evidence:
      - "The entire pressed appearance is built on :active and on nothing else: src/app/globals.css:1405 through :1414 and src/app/globals.css:1418 through :1422."
      - "The phase's own verification-first answer (e), at delivery/work-history/m3-p9.yaml:341, records as captured output that under the chromium-phone project a raw CDP Input.dispatchTouchEvent touchStart held open did NOT put the element into :active, with matchesActiveTouch false on both the desktop line and the chromium-phone line, while matchesActiveMouse is true on both."
      - "Every press in the shipped spec is a mouse press: test/e2e/pressed-and-disabled.spec.ts:344 moves the pointer, :347 presses, :350 moves away, :351 releases. page.touchscreen is never used anywhere in the file."
      - "Claim M3P9-C3 in delivery/work-history/m3-p9.yaml records that no physical device and no mobile browser is reachable from the container, so every phone-width result is a Chromium emulation result."
      - "The phase's grounding is an owner report made on a phone, which the plan's intent quotes as the first half of buttons don't feel like button."
    concrete-fix: "Carry this forward as a named open risk on M3-P10 and give that phase an acceptance criterion that drives a press through the touch pipeline, page.touchscreen or a dispatched full tap gesture rather than a raw touchStart, under hasTouch, and reads the same computed style. Until such a measurement exists, the phase report should say the pressed appearance is measured under a held mouse press at phone width, not that it is measured on the phone."
    analysis: >-
      This is the defect the contract could not contain, and it is worth saying
      plainly rather than leaving in a claims list. The plan's step (e) ladder
      turns on one question, whether a held page.mouse.down produces :active
      under the chromium-phone project. It does, so the ladder terminates and
      the touch branch it pre-authorises is never entered, even though the
      implementer ran the touch probe anyway and got a negative. No criterion in
      this phase can therefore fail on the touch question, and mine is the first
      document to name it as a gap rather than as an aside. I do not read the
      negative probe as proof the appearance is missing on a real phone: a raw
      dispatched touchStart bypasses the gesture recognition that actually sets
      the active flag on a tap, so the probe most likely measures the probe. What
      is true is that after this phase nobody has measured a finger, on a phase
      whose whole grounding is a finger. The mitigation the phase does ship is
      real and I verified it: the platform's own tap highlight is not removed, so
      a touch device that never reaches :active still keeps the cue it had.
  - id: CR-M3P9-05
    severity: low
    evidence:
      - "delivery/work-history/m3-p9-notes.md:113 states that git diff --name-only against origin/main prints five paths and then lists six of them."
      - "delivery/work-history/m3-p9.yaml:662 repeats the same count in an environment-warning entry."
      - "Measured here: git diff --name-only a4f1a94 88dbaac prints six paths, exactly the six the notes list."
    concrete-fix: "Change five paths to six paths at delivery/work-history/m3-p9-notes.md:113 and at delivery/work-history/m3-p9.yaml:662."
  - id: CR-M3P9-06
    severity: low
    evidence:
      - "delivery/work-history/m3-p9.yaml:315 presents the swept set under the words Output, 19 identities, but two of the nineteen entries are written as a.month-nav|LEFT-CHEVRON and a.month-nav|RIGHT-CHEVRON."
      - "The spec prints the element's own textContent (test/e2e/pressed-and-disabled.spec.ts:159 through :160, and the console line at test/e2e/pressed-and-disabled.spec.ts:528), and the enumeration it is compared against carries the characters themselves at test/e2e/pressed-and-disabled.spec.ts:54 and :55. My own run printed those characters, not those words."
      - "The dispatch contract's incremental-output clause names reconstructing captured output afterwards as exactly how a work history ends up carrying hand-written strings instead of real captured output, and criterion 9.1 is falsified by a recorded answer whose captured output is not there."
    concrete-fix: "Put the two characters the run actually printed back into the verification-first (d) entry at delivery/work-history/m3-p9.yaml:315, or state beside the block that two characters were transliterated and why."
  - id: CR-M3P9-07
    severity: low
    evidence:
      - "The plan's intent for this phase says every interactive control in the product gains a pressed, a disabled and a busy appearance built only from those tokens."
      - "Two interactive controls the product renders are outside the shipped vocabulary: src/modules/import/ui/profile-confirmation.tsx:181 renders a select and src/modules/import/ui/profile-confirmation.tsx:154 renders a textarea."
      - "src/app/globals.css:1373 through :1378 puts the transition on button, a, summary, submit inputs, button inputs and the button role only. src/app/globals.css:1435 through :1439 puts the disabled appearance on button:disabled, input:disabled and the three attribute selectors only. Neither list reaches select or textarea."
      - "This cannot fail a criterion, because criterion 9.2(a) pins the measured set at the nineteen the enumeration names and neither element is in it."
      - "It bites in M3-P10: a form disabled while its submit is in flight would leave the Ring select and the spec-editor textarea looking exactly as before, beside a submit button that visibly changed."
    concrete-fix: "Add select and textarea to the transition selector list at src/app/globals.css:1373 and add select:disabled and textarea:disabled to the disabled selector list at src/app/globals.css:1435, or record in the plan that form fields are deliberately outside this state vocabulary so M3-P10 does not have to rediscover it."
  - id: CR-M3P9-08
    severity: low
    evidence:
      - "Four opacity literals and one percentage radius are written into rules rather than tokens: src/app/globals.css:1443 opacity 0.55 on the disabled state, src/app/globals.css:1480 opacity 0.7 on the busy state, src/app/globals.css:1504 opacity 0.72 on the unconfirmed state, src/app/globals.css:1525 opacity 0.25 as the low point of the busy loop, and src/app/globals.css:1493 border-radius 50 percent."
      - "Three of them are load-bearing under the criteria rather than decorative. Criteria 9.3(a) and 9.3(b) accept a difference in opacity of at least 0.15 as an alternative to the contrast branch, and the deviation at delivery/work-history/m3-p9.yaml:397 states plainly that the opacity is what carries the magnitude on the controls whose composited contrast depends on an ancestor."
      - "No criterion and no non-negotiable is violated. Criterion 9.5's four checks all pass here, exit 1, four lines equal to base, exit 1 and exit 0; CLAUDE.md non-negotiable 4 names colours, font sizes and spacing and none of the five is one of those; and src/app/globals.css:765 already carried a percentage radius at the month pill dot before this phase."
      - "The cause is the plan and not the implementer: the plan's token entry fixes the count at nine and says no further token is expected, so declaring five more tokens would itself have been a deviation."
    concrete-fix: "When M3-P10 next opens styles/tokens.css, add the three state opacities as named tokens and amend the plan's nine-token entry to say the count was a floor rather than a cap. Do not change it inside this phase, where the nine-token clause is what forbids it."

criteria:
  - id: "9.1"
    met: true
    quote: >-
      The phase work history records an answer to each of the SIX
      verification-first questions with the command and its captured output
      beside it: the seven rule counts over every file git ls-files "*.css"
      returns, the token absence and the exact text of the styles/tokens.css
      section heading, the prefers-reduced-motion search over src/, styles/ and
      test/, the SWEEP that enumerates the nineteen controls criterion 9.2(a)
      pins together with every control the 9.2 selector finds that this plan
      does not name and the route by which the spec reaches each of the five
      conditional ones, the captured result of how a held press is produced
      under the chromium-phone project and whether it yields :active, and
      whether a real phone browser is available to the container at all.
      FALSIFIED BY any of the six missing, by a recorded answer that carries a
      conclusion with no captured output beside it, or by a sweep that returns a
      control the enumeration does not name with no amendment to the
      enumeration.
    evidence:
      - "All six answers are present as separate entries under verification-first in delivery/work-history/m3-p9.yaml, at :283 for (a), :292 for (b), :303 for (c), :309 for (d), :341 for (e) and :362 for (f), each carrying its command and its output."
      - "(a) re-measured by me at the base a4f1a94 over the four files git ls-files \"*.css\" returns, and it reproduces: src/app/globals.css carries four hover rules at :192, :243, :701 and :758 and five cursor rules at :89, :239, :381, :439 and :617; the fifth hover rule is at styles/tokens.css:201; active, disabled, transition, animation and keyframes counts are zero across all four files."
      - "(b) re-measured: styles/tokens.css:116 reads Space, radius, elevation and no elevation token exists under it."
      - "(c) re-measured at base: the prefers-reduced-motion search over src, styles and test exits 1."
      - "(d) is recorded with the route to each of the five conditional controls and with the statement that the enumeration needed no amendment. I re-derived the census independently before reading it and got the same nineteen, and the spec's own printed set in my run is the same nineteen, so the sweep returns no control the enumeration does not name and no amendment was owed."
      - "(e) is recorded with both the mouse line and the touch line verbatim and states that touch emulation was not dropped anywhere."
      - "(f) is recorded as no device and no mobile browser reachable, with every phone result labelled an emulation result."
      - "Two blemishes are raised as findings rather than as a not-met, because neither is one of the three things this criterion is falsified by: two characters in (d)'s output block are transliterated (CR-M3P9-06), and (f)'s container claim is contradicted for the privacy question by the uploads being on disk (CR-M3P9-01, which lands on criterion 9.8 and not on this one, because (f) asks about a phone BROWSER and not about the uploads)."
  - id: "9.2"
    met: true
    quote: >-
      THE PRESSED APPEARANCE, MEASURED BY PRESSING, OVER A SET THE PLAN NAMES
      AND WITH A DIFFERENCE BIG ENOUGH TO SEE. ... (a) THE SET IS THE ONE THE
      PLAN NAMES, AND IT IS SWEPT RATHER THAN LOOKED UP. The spec builds the set
      by running the selector on every screen it reaches and COLLECTING what it
      finds, never by looking up a list of known selectors, and asserts that the
      collected set equals the enumeration below ... THE ENUMERATION IS NINETEEN
      ... (b) THE PRESSED DIFFERENCE. At 1280 by 720 and again at 390 by 844,
      for every control in that set: the spec captures getComputedStyle for
      background-color, color, border-color, box-shadow, transform, opacity and
      text-decoration-line in TWO states, first with the pointer resting on the
      control and NOT pressed, then with the pointer held down on the control's
      centre, and the held snapshot differs from the HOVERING snapshot in BOTH
      of the following. (i) MOVEMENT: the computed transform carries a vertical
      translation whose magnitude is at least 1 device-independent pixel and
      equals the computed value of --press-offset, and styles/tokens.css
      declares --press-offset at 1px or more. (ii) SURFACE ... The spec
      COMPOSITES the held background-color over the nearest ancestor's
      non-transparent background-color, does the same for the hovering value,
      and requires the two composited colours to differ by a WCAG contrast ratio
      of at least 1.1 to 1 ... Where the hovering background-color is fully
      transparent, the held one must ALSO carry an alpha of at least 0.08 ... The
      hovering state is the baseline and not the at-rest state, deliberately ...
      Each held press is RELEASED AWAY FROM THE CONTROL ... (c) THE PLATFORM'S
      OWN CUE IS NOT TRADED AWAY. grep -rn "tap-highlight" over every file
      matching *.css under src/ and styles/ returns nothing ... FALSIFIED BY a
