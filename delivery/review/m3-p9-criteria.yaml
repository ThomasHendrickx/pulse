#      measurement in this phase, at both widths, is a held MOUSE press under
#      touch emulation. The phase's own probe recorded that a held touch event
#      did NOT put the element into :active. Criterion 9.2's step-(e) ladder is
#      keyed on the mouse question, which passes, so no criterion can fail on
#      the touch question. Finding CR-M3P9-04.
#   2. Whether a { display: inline-block } at src/app/globals.css:1397, a base
#      element rule reaching every anchor in the product, regressed any layout.
#      No criterion measures layout. The only evidence is that the pre-existing
#      phone and desk specs still pass, which is indirect.
#   3. Whether anything ever ENTERS the disabled, busy or unconfirmed states.
#      Decision D-28 assigns that to M3-P10 and M3-P11 and the phase says so.
#   4. Three of criterion 9.8(b)'s five probe families. PDF text extraction was
#      refused twice by this container's tool policy, so the holder-name,
