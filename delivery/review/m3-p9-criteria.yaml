deviations-judged:
  - deviation: >-
      Step 2 and the token entry in report-code-disagreement: "no further
      token is expected, with criterion 9.5 failing the phase if a literal
      duration, curve, colour or length reaches a rule instead."
    serves-plan-intent: true
    reasoning: >-
      Judged against the plan's intent and against CLAUDE.md non-negotiable 4,
      not against the implementer's argument. Non-negotiable 4 names colours,
      font sizes and spacing; an opacity is none of the three, and a percentage
      border-radius is a radius, which src/app/globals.css:765 already carried
      before this phase. Criterion 9.5's four checks all pass as measured here.
      The plan's own token entry fixes the count at nine and says no further
      token is expected, so adding five more would itself have been the
      deviation, and the implementer took the branch the plan authorises. I
      accept it. I do record, as finding CR-M3P9-08, that three of the five
      literals are the exact values criterion 9.3's opacity branch is measured
      against and therefore belong in styles/tokens.css the next time that file
      is opened; that is a correction the plan owes M3-P10, not a defect here.
  - deviation: >-
      Step 5: "A disabled control changes to --color-surface-disabled and
      --color-ink-disabled and stops computing cursor: pointer."
    serves-plan-intent: true
    reasoning: >-
      All three things the step asks for are done and an opacity change is added
      beside them. The reason given is checkable and I checked it: on the three
      controls that declare no background, the composited contrast depends on
      whichever ancestor is painting, so the colour branch of criterion 9.3(a) is
      ancestor-dependent while the opacity branch is not. Adding redundancy under
      a measurement, rather than substituting for what the plan asked, is
      strictly closer to the intent. It also adds nothing the reduced-motion path
      can forget, because the opacity transition consumes --duration-state like
      every other transitioned property.
  - deviation: >-
      Step 4: "Write the pressed appearance for every control the criterion
      9.2 selector finds, which at this phase's base is the seven submit
      controls, the three shell nav links, ..."
    serves-plan-intent: true
    reasoning: >-
      The rules select elements rather than the enumerated classes. I verified
      the two selections are identical over this tree with my own census: every
      button, every anchor carrying an href and the one disclosure summary in
      src/**/*.tsx is one of the nineteen, and there is no twentieth. The element
      form is strictly better for the failure this phase exists to answer,
      because a screen added later inherits a pressed state instead of shipping
      without one, and the class form is kept exactly where a control takes a
      different value, at src/app/globals.css:1418 through :1422. It does widen
      the blast radius to any anchor or button added later, which is the point
      rather than an accident, and criterion 9.2(a)'s both-directions set
      assertion is what would catch a control that appears and does not belong.
  - deviation: "Criterion 9.2(b)(i), the movement half."
    serves-plan-intent: true
    reasoning: >-
      This is one of the two self-found holes and I checked the patch rather than
      the account. The hole is real and I reproduced it: on a page with no anchor
      display rule, an inline anchor held in :active reported the translation
      matrix while its bounding-box top stayed at 16 both at rest and while held.
      The assertion that closes it is present at
      test/e2e/pressed-and-disabled.spec.ts:369 through :372; it sits inside the
      per-control loop that begins at test/e2e/pressed-and-disabled.spec.ts:292
      and therefore binds on all nineteen controls, all four bare anchors
      included; and it is not gated on the reduced flag, so it binds under reduce
      too. Asserting more than a criterion requires cannot fail the plan's
      intent, and this is the assertion that stops the anchor display rule being
      deleted silently. Accepted. Two caveats are recorded rather than waved
      through: the justification's arithmetic is off by two (finding
      CR-M3P9-03), and the layout consequence of the base rule it defends is
      reached by no criterion in this phase.
  - deviation: >-
      Criterion 9.2(c): grep -rn "tap-highlight" over every file matching
      *.css under src/ and styles/ returns nothing.
    serves-plan-intent: true
    reasoning: >-
      The comment at src/app/globals.css:1359 through :1365 spells the property
      name out in words so that the criterion's own grep does not fire on the
      comment documenting compliance with it. I checked the substance rather than
      the wording: the property is genuinely not set anywhere, and the only
      webkit declaration in the four tracked stylesheets is the font-smoothing
      one at styles/tokens.css:289, which predates the phase. So the criterion's
      purpose, that the platform's own press cue is not traded away, is served
      exactly, and what was worked around is a false positive in the criterion's
      instrument rather than the criterion itself. The file already used the same
