  - id: ADV-M0P4-10
    severity: medium
    evidence:
      - >-
        Criterion 11.2 makes the prediction's marking `aria-busy="true"`:
        "that row carries the unconfirmed marking, being aria-busy='true' and
        the busy mark M3-P9 shipped".
      - >-
        D-30 claims what that marking buys: "a prediction is shown MARKED as
        a prediction, using the busy vocabulary M3-P9 ships ... so no reader
