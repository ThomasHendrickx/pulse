  - id: ADV-M0P4-04
    severity: high
    evidence:
      - >-
        Every interval measurement in M3-P10 and M3-P11 is taken under the
        chromium-phone project, whose baseURL is the dev server:
        playwright.config.ts webServer entry two is `command: "npm run dev"`,
        and the only production-mode server in the config is bound to
        prodBaseURL and is matched exclusively by /prod-smoke/.
      - >-
        Viewport prefetching, which criterion 10.5 turns on, is switched off
        in development. node_modules/next/dist/client/components/links.js:194
        through :199: "if (process.env.NODE_ENV !== 'production') { //
        Prefetching on viewport is disabled in development for performance
        reasons, because it requires compiling the target page. return; }".
      - >-
        The owner's report is about the deployed build. dispatch-plan-feedback.yaml
        standing-context: "The owner is now using the deployed app on a
        phone."
      - >-
        Criterion 10.5 offers two admissible answers, "either the destination
        has rendered or the pressed control carries the pending marker".
    analysis: >-
      The two branches of 10.5 are each unreachable in the environment where
      the other one is real. In the gate, prefetch is off and the
      destination's response is held for 2000 milliseconds, so the
      destination cannot render inside 200 milliseconds and only the marker
      branch can ever pass: the criterion is in effect single-branch there.
      In the owner's deployed build, prefetch is on, a link in the viewport
      is already in the router cache and the navigation completes with no
      pending state, so the marker the gate proved is the branch that never
      shows. The criterion's stated reason for having two branches, "whether
      a prefetched navigation ever reaches a pending state is a property of
      the framework's prefetching and not of this phase", is exactly right
      and is the reason the measurement cannot be taken where prefetching is
      absent. The same environment gap sits under 10.2 and 10.3 more weakly:
      a dev server compiles routes on demand, so the absolute millisecond
      figures the criteria pin are measured against a server that behaves
      differently from the one the owner presses.
    concrete-edit: >-
      Add to criterion 10.5, after the two admissible answers: "and the same
      measurement is repeated under the chromium-prod project against the
      production-mode server (playwright.config.ts, prodBaseURL), where
      viewport prefetching is ON (node_modules/next/dist/client/components/links.js:194
      disables it in development only). In the production run the admissible
      answers are the same two, and the phase work history records WHICH
      branch each of the seven controls took in each run; a control that
      takes the marker branch in dev and neither branch in production fails
      this criterion." Add to M3-P10's files-to-touch note that registering
      the new spec under chromium-prod means widening that project's
      testMatch as well, and add the production run to criterion 10.7's
      "exits 0 under every project".
  - id: ADV-M0P4-05
    severity: high
    evidence:
