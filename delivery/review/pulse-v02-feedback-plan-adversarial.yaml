      but it is genuinely open, and if the answer turns out to be no then
      half of the phase's headline criterion is unsatisfiable with nothing
      in the plan saying what to do. That is the one place in three phases
      where a "stop and say so" is missing and the pressure to improvise
      instead is highest, because the alternative on the day is to reach for
      a test-only hook in product code.
