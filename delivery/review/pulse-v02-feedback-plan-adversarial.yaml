        hovering snapshot in at least one of those seven properties"
        (background-color, color, border-color, box-shadow, transform,
        opacity, text-decoration-line). It states no magnitude and no
        direction.
      - >-
        Criterion 9.3(a) requires the disabled snapshot to differ "in at
        least one of background-color, color, border-color and opacity", also
        with no magnitude.
      - >-
        The magnitude requirement exists only in M3-P9's step 4, which is not
        an acceptance criterion: "A pressed control moves by --press-offset
        and changes its surface, and it does BOTH rather than either".
    analysis: >-
      `button:active { transform: translateY(0.01px); }` satisfies 9.2 at
      both widths, on every control, under reduced motion (9.4(c) re-runs 9.2
      and it still differs), and against the hover baseline the criterion
      correctly insists on. It is a difference no eye can see. `[disabled] {
      opacity: 0.995 }` does the same against 9.3(a) on every control that
      does not carry one of the five cursor: pointer rules, and on those five
      it costs one extra declaration. This is the phase's
      whole first half reduced to a rounding error, and the phase would be
      green. The plan is right that comparing against at-rest rather than
      hover would let the five pre-existing hover rules pass the criterion;
      it then stops one step short of pinning the size of the difference it
      demands.
    concrete-edit: >-
      Replace 9.2's difference clause with: "and the held snapshot differs
      from the hovering snapshot in BOTH of the following: its computed
      transform contains a vertical translation whose magnitude is at least 1
      device-independent pixel and equals the computed value of
      --press-offset, and its computed background-color differs from the
      hovering background-color by at least 3 percent in relative luminance.
      styles/tokens.css declares --press-offset at 1px or more." Replace
