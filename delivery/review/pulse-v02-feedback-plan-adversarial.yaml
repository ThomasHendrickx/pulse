# Adversarial plan review of the M0-P4 amendment to delivery/plan/pulse-v02.yaml
# (phases M3-P9, M3-P10, M3-P11), reviewed at b045d7d against the tree at
# 89ed187. Input report: pulse-fleet/dispatch-plan-feedback.yaml. Decisions
# read: DR-0025, DR-0026. The reviewer edited nothing.
#
# Method: every acceptance criterion in the three new phases was read against
# the code it names, and for each one the question asked was "what could an
# implementer ship that satisfies this sentence literally while the owner
# still presses a control and feels nothing". Where a cheat exists it is
# written out. Where none could be constructed, the criterion is not
# mentioned, which is most of criterion 10.3, 10.4, 10.8, 9.5, 9.6, 9.7,
# 10.7, 11.6 and every privacy criterion.
kind: finding
verdict: >-
  Reject and return for one fix round. The amendment is unusually well
  grounded: every one of the sixteen new report-code-disagreement entries
  that names a file and line was spot-checked and every line number is
  correct, the plan validates dispatchable, it needs no package, and it
  found three real things the dispatch had wrong. But the criterion the
  round exists for, 10.2, is satisfiable by a single line that changes
  nothing a reader can see; the criteria in M3-P9 and 10.5 are evaluated
  over a control set the implementer's own spec decides the size of; 11.3
  is not satisfiable as written because the DOM identity it asserts on does
  not exist; and the whole interval measurement is taken against a
  development server whose behaviour differs from the owner's deployed
  build in exactly the dimension 10.5 turns on. Four of those are
  correctable with sentence-level edits and none of them requires
  re-planning the round or changing the three-phase split, which is sound.
produced-by: Anthropic Claude (Opus 5)
findings:
  - id: ADV-M0P4-01
    severity: critical
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml criterion 10.2: "the spec installs a
        MutationObserver on document with childList, subtree, attributes and
        characterData before the press, records the timestamp of the click
        event and the timestamp of the first mutation after it, and asserts
        BOTH of the following. (a) The interval from the click to the first
        mutation is at most 200 MILLISECONDS."
      - >-
        The criterion places no constraint on WHERE the mutation occurs, on
        WHAT changed, or on the mutation being caused by the press. The
        observer's target is the whole document with subtree true, so every
        mutation from every source in the page qualifies.
      - >-
        The gate that would run it is a development server:
        playwright.config.ts webServer entry two is `command: "npm run dev"`,
        and the chromium-phone project 10.2 names uses that baseURL.
      - >-
        Framework bookkeeping is present in that tree and is observable from
        a document-scoped observer. In the installed next 15.5.23:
        `grep -o 'createElement("nextjs-portal")' node_modules/next/dist/compiled/next-devtools/index.js`
        returns 2 and `grep -o 'document.body.appendChild'` on the same file
        returns 4. The dev tools host element is appended to and removed from
        document.body in the light DOM; only its shadow content is hidden
        from an observer.
      - >-
        The plan already knows the shape of the guard this criterion is
        missing and uses it twice elsewhere: criterion 10.11(b) "THE RED
        WITNESS ... Without half (b) this criterion would pass on a glob
        that matches nothing", and criterion 11.6(c) for the same reason.
        10.2, which the phase calls "THE CRITERION THE PHASE EXISTS FOR",
        has no control run and no red witness.
    analysis: >-
      The concrete cheat needs no framework noise at all and takes one line.
      Build the shared submit leaf as a client component whose onClick does
      `document.body.dataset.pulsePressed = "1"` and which renders exactly
      what the server rendered before. Under a 2000 millisecond route delay,
      the attribute mutation lands within a frame of the click, so 10.2(a)
      passes at every one of the seven controls, and because it lands at
      roughly 5 milliseconds it also precedes the released response by far
      more than 1500, so 10.2(b) passes too. The owner presses the control
      and nothing changes on screen. Criterion 10.3 would catch that
      particular implementation at 1000 milliseconds, which is the only
      reason the phase as a whole is not defeated; but 10.3 is a different
      criterion measuring a different thing, and 10.2 is the one carrying the
      claim that the dead interval is gone. A criterion whose failure is
      covered only by a neighbouring criterion is not measuring what its own
      text says it measures. Whether the dev tools portal alone fires inside
      200 milliseconds of every click in this app is a SUSPICION and not
      demonstrated here: the mechanism is captured above but no browser run
      was made. The text-level defect does not depend on it.
    concrete-edit: >-
      Replace criterion 10.2's observer clause with: "the spec installs a
      MutationObserver whose target is the pressed control's nearest ancestor
      form (childList, subtree, attributes, characterData) and DISCARDS any
      record whose target is not the pressed control or a node inside it,
      records the timestamp of the click and of the first surviving record,
      and asserts (a) that interval is at most 200 MILLISECONDS." Add a third
      half: "(c) THE CONTROL RUN. The identical measurement is run once with
      the phase's submit leaf replaced by the plain server-rendered button it
      replaces, on the same page under the same delay, and NO surviving
      record appears within 2000 milliseconds of the click; the captured
      output of both runs is recorded in the phase work history. Without (c)
      this criterion passes on a mutation the phase did not cause." Add to
      (b): "and the spec asserts the route handler's request counter for that
      action is at least 1 before evaluating (a) or (b), so a handler that
      never matched the action's request cannot make (b) vacuous."
