  - id: ADV-M0P4-06
    severity: medium
    evidence:
      - >-
        M3-P9 verification-first step (e): "THE ONE THING THAT COULD
        INVALIDATE THE MEASUREMENT TECHNIQUE: whether a held page.mouse.down
        produces the :active state under the chromium-phone project, which
        sets isMobile and hasTouch ... If it does not, record that, and
        measure the pressed appearance at 390 by 844 in a context without
        touch emulation rather than dropping the phone half of criterion 9.2".
      - >-
        The phase's own report-code-disagreement entry establishes that the
        touch case is the one that matters: "a POINTER device already gets
        one pressability cue on the controls that carry those rules and a
        TOUCH device gets none of it, because a cursor does not exist on a
        phone. The owner's report is a phone report."
      - >-
        playwright.config.ts chromium-phone sets `isMobile: true, hasTouch:
        true`.
    analysis: >-
      The escape hatch is pre-authorised, so an implementer may take it with
      no review, and taking it converts the phone half of 9.2 into a
      measurement of a desktop browser sized to 390 pixels. That is a width
      measurement standing in for a touch measurement, which is the M3-P7
      error the phase cites in its own grounding. It matters more than a
      procedural point because the risk the step names is real: whether
      :active applies to a tap is a touch-platform behaviour, and a pressed
      appearance built entirely on :active can be correct in the gate and
      invisible on the owner's phone. The fallback the plan authorises is the
      one fallback that cannot detect that.
    concrete-edit: >-
      Replace the second half of step (e) with: "If a held page.mouse.down
      does not produce :active under that project, the fallback is NOT to
      drop touch emulation. Drive the press with the touch API instead
      (page.touchscreen or a dispatched touchstart held open) under
      hasTouch, and record the captured result. If :active still does not
      apply under touch, the pressed appearance is not built on :active at
      all: it is built on a class or attribute the control carries between
      pointerdown and pointerup, and criterion 9.2 is measured against that,
      still under hasTouch at 390 by 844. Measuring the phone width without
      touch emulation is not an admissible answer to this question."
