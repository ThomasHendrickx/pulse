  - id: ADV-M0P4-08
    severity: medium
    evidence:
      - >-
        Criterion 10.6(c) forbids, in every client file, `grep -nE "from
        \"(@/modules/|\.\./(application|domain|adapters))"` matching. That
        bans any import from @/modules at all.
      - >-
        Criterion 11.7(c) restates the same guard with a narrower pattern:
        `grep -nE "from
        \"(@/modules/[a-z]+/(application|domain|adapters)|\.\./(application|domain|adapters))"`.
        It applies to "every file that carries it", which includes the two
        leaves M3-P10 pinned under the wider pattern.
      - >-
        Neither criterion looks past the files that carry the directive. In
        Next.js a module imported by a "use client" file joins the client
        bundle without carrying the directive itself, so `grep -rln "use
        client" src/` counts client FILES and not client MODULES.
      - >-
        The claim the two criteria are asked to support is D-23's: "what does
        not cross at all: no domain type, no application function, no
        repository, no projection and no household context".
    analysis: >-
      Two separate holes. First, M3-P11 silently relaxes a criterion a merged
      phase established: after 11.7 lands, `src/platform/ui/<submit leaf>.tsx`
      may import `@/modules/overview/ui/month-view` and 11.7(c) exits 1 while
      10.6(c) would have failed it. A later phase weakening an earlier
      phase's guard while its own headline says "THE BOUNDARY STILL DOES NOT
      LEAK" is the shape this plan is otherwise careful about (D-14, D-22).
      Second, and the one the greps cannot reach at all: a client leaf that
      imports a shared helper under src/platform/ which itself imports a
      domain module ships that module to the browser and neither grep sees
      it. Today no such helper exists (src/platform/ui carries only
      amount.tsx and mask-card-number.ts, both self-contained, checked), so
      this is a hole in the guard rather than a live defect.
    concrete-edit: >-
      Replace 11.7(c)'s pattern with 10.6(c)'s pattern verbatim, so the later
      phase cannot be greener than the earlier one on the same files. Add a
      new half to 10.6, carried forward into 11.7: "(e) THE IMPORT CLOSURE,
      not just the file. A script under test/ walks the import specifiers of
      every file carrying 'use client' and of every file those reach,
      transitively, and asserts that the closure contains no path under
      src/modules/*/application/, src/modules/*/domain/, src/modules/*/adapters/
      or src/platform/auth/, and no non-type import of @/platform/tenancy.
      No package is added for this; the walk is a regex over import lines and
      a resolver over the tsconfig paths alias."
  - id: ADV-M0P4-09
    severity: medium
    evidence:
      - >-
        Criterion 11.4 requires the forced failure "twice by two different
        causes ... and a transport failure, a route handler that fulfils the
        action's request with a 500", in three languages at two viewports,
        with all five sub-assertions holding "In both cases".
      - >-
        Whether that reaches the client is open by the plan's own account:
