      - >-
        D-27 caps the round's copy: "M3-P11 adds AT MOST THREE keys", and
        criterion 11.6(a) enforces "at most three". The three are spent on
        the failure message, the dismiss label and the difference notice, so
        there is no key left for a non-visual reader to be told a value is
        unconfirmed.
      - >-
        D-27 already parks the adjacent gap for M3-P10 ("aria-busy is
        supported unevenly by screen readers, so between M3-P10 and M3-P11 a
        non-visual reader gets a non-pressable control and not the word
        busy") but does not carry the park forward to the prediction, where
        D-30 makes the stronger claim about every reader.
    analysis: >-
      The marking works for a sighted reader and inverts for a non-visual
      one: they are told less about the predicted row than they would have
      been with no optimism at all, and D-30's sentence "no reader ever has
      to guess" is then false for exactly the reader H11.3 was written to
      protect. The fix is small and the plan's own copy budget is what blocks
      it, which is why this needs deciding in the plan rather than on the day.
    concrete-edit: >-
      Raise 11.6(a)'s cap from three keys to four and add to M3-P11's copy
      step: "the fourth key is the unconfirmed marking's accessible text,
      rendered as visually-hidden text inside the predicted row and
      referenced by aria-describedby, so a non-visual reader is told the
      value is not yet stored." Add to criterion 11.2: "and the predicted row
      carries an accessible description whose trimmed text is the catalogue
      value of the unconfirmed key for the language under test, present from
      within 200 milliseconds of the click until the response is released."
      Amend D-30 to say that aria-busy alone is a visual marking and that the
      described text is what carries the claim for a non-visual reader.
  - id: ADV-M0P4-11
    severity: low
    evidence:
      - >-
        Criterion 10.2: "And on the merchant naming submit, which is the
        control the owner presses most, the same measurement is taken FIVE
        consecutive times and the MEDIAN interval is at most 100
        MILLISECONDS."
      - >-
        A successful naming removes the row that carried the control:
        test/e2e/merchants.spec.ts:71 through :74 assert the named group's
        unresolved row is gone and the unresolved count drops.
      - >-
        The committed fixture yields exactly five unresolved groups:
        test/e2e/merchants.spec.ts:54, `await
        expect(page.getByTestId("unresolved-group")).toHaveCount(5)`.
    analysis: >-
      "The same measurement five consecutive times" on "the merchant naming
      submit" cannot mean the same control, because after the first press
      succeeds that control does not exist. It has to mean five different
      unresolved rows, which the fixture supplies exactly five of, so the
      criterion is executable but only just and only on that fixture. The
      cheap misreading is to press one row five times with the action forced
      to fail, which measures a failure path rather than the press the
      criterion names, and would still produce a median.
    concrete-edit: >-
      Replace with: "And the same measurement is taken on FIVE DIFFERENT
      unresolved rows' naming submits, each named successfully, and the
      MEDIAN of the five intervals is at most 100 MILLISECONDS. Five is what
      the committed fixture supports: test/e2e/merchants.spec.ts:54 asserts
      exactly five unresolved groups, and a successful naming consumes one.
      Pressing one control five times, or measuring a naming that fails, does
      not satisfy this."
  - id: ADV-M0P4-12
    severity: low
    evidence:
      - >-
        Criterion 10.2(b) and its rationale: "That first mutation occurs at
        least 1500 MILLISECONDS before the route handler releases the
        response, so no measurement here can be satisfied by the server
        merely being fast ... the 1500 margin is seven and a half times the
        ceiling."
      - >-
        The arithmetic holds and has 300 milliseconds of slack: with a 2000
        millisecond delay and a first mutation at the 200 millisecond
        ceiling, the gap is 1800.
      - >-
        Because the delay is a fixed 2000 and (a) already caps the mutation
        at 200, (b) cannot fail whenever (a) passes AND the delay actually
        applied. Its only real failure mode is the delay not applying, and in
        that case "the route handler releases the response" never happens, so
        the criterion has no defined value to compare.
      - >-
        The 1500 figure is described as "seven and a half times the ceiling",
        which is 1500 over 200; that is correct arithmetic on the ceiling but
        the quantity that has to clear 1500 is 2000 minus the measured
        interval, not the ceiling itself.
    analysis: >-
      The threshold is not wrong and nothing in the round fails because of
      it. What is wrong is that its stated purpose, catching a measurement
      satisfied by a fast server, is served only in the case the criterion
      leaves undefined. This is the same gap ADV-M0P4-01's edit closes from
      the other side, and it is recorded separately because it is worth
      fixing even if that finding is rejected.
    concrete-edit: >-
      Replace 10.2(b) with: "(b) The route handler recorded at least one
      request carrying the server-action header for that action, and the
      response it released arrived at least 1500 MILLISECONDS after the
      click, so no measurement here can be satisfied by the server merely
      being fast or by a route handler that never matched the request. With a
      2000 millisecond delay and a 200 millisecond ceiling on (a) the slack
      is 300 milliseconds, which is stated so a later reader tuning either
      number sees what it costs."
  - id: ADV-M0P4-13
    severity: low
    evidence:
      - >-
        The dispatch's acceptance criterion 6 (pulse-fleet/dispatch-plan-feedback.yaml):
        "DR-0025 appears in open-questions with both options and their
        consequences, is referenced by at least one phase, and no acceptance
        criterion anywhere changes with its answer", guarding hazard H3.
      - >-
        The amended plan's open-questions field carries DR-0002 and DR-0023
        only; DR-0025 is absent (delivery/plan/pulse-v02.yaml, open-questions
        block).
      - >-
        Criteria 10.6(d), 10.10, 11.2, 11.3, 11.4 and 11.5 all change with
        DR-0025's answer; M3-P11 exists only because of it.
      - >-
        The amendment explains the deviation in prose (the plan's header
        comment, "TWO OWNER DECISIONS ARRIVED WHILE THE ROUND WAS BEING
        WRITTEN and both are planned on rather than raised", and D-30), but
        the plan's `parked` list carries only the cross-format dedup item and
        no entry naming the superseded dispatch criterion.
    analysis: >-
      The deviation is correct on the merits: the owner decided DR-0025 and
      DR-0026 on 2026-08-23 and a plan that raised a decided question as open
      would be worse. The problem is procedural and lands on the next reader:
      a phase review evaluating M0-P4 against its own dispatch has a
      criterion it must mark failed, with the reason spread across a header
      comment and a decision rather than recorded in the field the criterion
      reads. This plan is careful about exactly this elsewhere, D-24 records
      why criterion 7.3's count changes rather than letting a later reader
      find a contradiction, and the same courtesy is owed here.
    concrete-edit: >-
      Add to the plan's `parked` list: "item: Dispatch M0-P4 acceptance
      criterion 6, which required DR-0025 to appear in open-questions
      undecided and no criterion to depend on its answer. reason: The owner
      decided DR-0025 and DR-0026 in session on 2026-08-23, after the
      dispatch was written and while this round was being written. A decided
      question is not an open question, so DR-0025 is deliberately absent
      from open-questions and is recorded as decisions D-30, D-31 and D-32
      instead; criteria 10.10, 11.2, 11.3, 11.4 and 11.5 depend on the
      decided answer by design. Hazard H3 of the dispatch, that DR-0025 is
