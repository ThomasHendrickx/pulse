deviations-judged:
  - deviation: "files-to-touch, which does not carry prisma/seed.ts. Declared in fix round ten under CRITERIA finding CR9-M3P12-05, which found this set and the one below missing from a block that had declared eleven others."
    serves-plan-intent: true
    reasoning: "I confirmed prisma/seed.ts is a door of two kinds in my own reading: prisma/seed.ts:63 constructs a Prisma client and prisma/seed.ts:80 constructs a service-role admin client. Leaving the tree's one unguarded door open to stay inside a declaration list would trade a real exposure for a paperwork match. The plan amendment is routed on a separate branch rather than edited under review, which is the right handling."
  - deviation: "files-to-touch, which does not carry test/property/, though criteria 12.7 and 12.21 both name a property test in that directory BY PATH."
    serves-plan-intent: true
    reasoning: "Two acceptance criteria name files in that directory by path, so honouring the declaration would make both unmeetable. Both files exist and both are green in my run: test/property/rederive-loss-reporting.test.ts and test/property/pass-one-preserves-meaning.test.ts."
  - deviation: "Criterion 12.17, the half requiring the phase work history to record the command actually run AGAINST THE DEPLOYED DATABASE with its exit code and its printed before-and-after assignment-set sizes."
    serves-plan-intent: true
    reasoning: "D-46 forbids the routine running before the code deploys and this branch is not deployed, so producing the evidence would violate the decision the same criterion pins. The criterion's own final clause assigns the deployed run to criterion 16.1. Owed, not done, and recorded that way."
  - deviation: "Criteria 12.7, 12.8 and 12.9, which speak of \"a seeded database\" holding MerchantRule rows written under the baseline derivation."
    serves-plan-intent: true
    reasoning: "The in-memory fake is what makes criterion 12.9's no-write-against-transactions assertion observable at all. The fake is not toothless: 'THE FAKE ENFORCES THE UNIQUE KEY, so these tests can see what the schema refuses' is green, and the work history records the same-merchant collision reproduced against real Postgres, which is the one place the fake could have hidden a schema-level defect."
  - deviation: "files-to-touch, which does not name .gitignore."
