findings:
  - id: CR13-M3P12-01
    severity: high
    evidence:
      - "src/platform/db/runtime-target.ts:96 re-runs assessRederiveTarget over TWO VALUES THE CALLER SUPPLIED: the connection string at parameter two and the expectation at parameter three. Nothing ties either to an operator, to a command line, or to work the caller did. The assessment therefore proves only that the caller's two arguments agree with each other."
      - "ATTACK, EXECUTED, and it is three lines. Probe importing the shipped modules under NODE_ENV=test. It took an invented deployed pooler, postgresql://postgres.qqqqwwwweeeerrrrtttt:pw@aws-9-eu-west-9.pooler.supabase.com:6543/postgres, and DERIVED the expectation from that same string with new URL: host aws-9-eu-west-9.pooler.supabase.com, projectRef qqqqwwwweeeerrrrtttt, port 6543. noteInterlockApproved('a module that checked nothing', DEPLOYED, derived) returned TRUE."
      - "The guard then admitted it. assessNonProductionDbTarget from src/platform/db/guard.ts, called with NODE_ENV test, that DATABASE_URL and that approval, returned allowed=true with reason 'a module that checked nothing resolved THIS connection and matched it against a host and project ref named on its own command line'. src/platform/db/guard.ts:180 is where that sentence is written, and it is FALSE of the caller in the attack: nothing was named on any command line."
      - "src/platform/db/runtime-target.ts:53 states 'A caller that resolved nothing cannot produce a pair that passes, so the probe that defeated round ten's version is refused here.' The probe above resolved nothing and its pair passed."
      - "THE TEST THAT CLAIMS TO CLOSE THIS DOES NOT REACH IT. test/db/runtime-target.test.ts:35, named 'A CALLER THAT DID NO WORK IS REFUSED, which is the probe that defeated round ten', exercises five cases: no connection, a blank connection, a connection with an EMPTY expectation, and two expectations that name a DIFFERENT project or a different ref from the connection. The one shape that matters, an expectation derived from the connection, is not among them."
      - "THE FILE'S OWN CONTROL DEMONSTRATES THE HOLE. test/db/runtime-target.test.ts:82 asserts that noteInterlockApproved('a later interlock', OTHER, {host, projectRef matching OTHER}) returns TRUE and that the register then names 'a later interlock'. That caller does no work either; it is my attack with a friendlier source string, written down as expected behaviour."
      - "SECONDARY, from the same probe: last-writer-wins runs in BOTH directions. After the real interlock recorded its approval, one further call from 'anything at all, later in the run' replaced it, and approvalSource() then read 'anything at all, later in the run'. The comment at src/platform/db/runtime-target.ts:62 argues last-writer-wins only in the direction where a later caller is the real interlock."
      - "THE CALLER ALLOW LIST DOES NOT CATCH AN ALIAS. test/db/gate-target.test.ts:995 selects callers with the literal regex /\\bnoteInterlockApproved\\s*\\(/ over code-only text. An importer writing import { noteInterlockApproved as approve } and then approve(...) is not selected. The DOOR scan one function above learned to resolve exactly that shape in this same round: aliasesOf at test/db/gate-target.test.ts:812 exists because of HZ11-M3P12-06."
    concrete-fix: "Stop taking the expectation from the caller. The register cannot re-verify anything while both halves of the evidence come from the same untrusted source. Give noteInterlockApproved a fourth parameter carrying the raw argv slice the operator typed, and have the register parse --expect-host and --expect-ref out of it ITSELF, so the expectation is an observation about the process rather than a value a module can invent; then re-run assessRederiveTarget over that. Alternatively drop the register entirely and pass the approval down the call chain from main() as a parameter, which is what makes it unforgeable: the module graph cannot reach a local. Whichever is taken, correct src/platform/db/runtime-target.ts:53 in place under clause R-087, add the derived-expectation shape to test/db/runtime-target.test.ts:35 so it is red forever, and extend the caller sweep at test/db/gate-target.test.ts:995 with the aliasesOf resolution the door scan already has."
    analysis: "This is round ten's defect with one more step in front of it. Round ten's register took a label and validated nothing; round twelve's takes a pair and validates that the pair is internally consistent. An attacker supplies both halves, so consistency is free. The property the client's widened guard is bought with, that only code which has actually done the interlock's work can open a deployed database from a non-production process, still does not hold, and the module still asserts that it does. What HAS improved is real and worth keeping: the approval now names a connection, so an approval obtained for one target no longer admits another, which I verified refuses."

  - id: CR13-M3P12-02
    severity: high
    evidence:
      - "test/db/gate-target.test.ts:614 reads: if (previous === ')' || previous === ']') { return false; } so a slash after a closing parenthesis is DIVISION. In JavaScript the closing parenthesis of an if, while or for HEAD is followed by a statement, and a slash there opens a REGULAR EXPRESSION. TypeScript itself parses it that way; this lexer does not."
      - "METHOD. The lexer and the door detector were extracted BYTE FOR BYTE out of test/db/gate-target.test.ts, lines 561 to 724 and 739 to 875, into a scratch module and driven from strings. Nothing in the worktree was edited and git status carries only this review file."
      - "ATTACK, GUARD INVENTED. Source: an import of PrismaClient, then a function whose body is 'if (s.length > 0) / assertGateDbTargetIsLocal() /.test(s);' followed by 'const client = new PrismaClient();'. The slash after the if head is read as division, so the regex text survives into the code-only output verbatim, and doorsInSource reports {kind: prisma, guarded: TRUE, guardsBeforeConstructing: TRUE}. The only occurrence of the guard name in the whole file is inside a regular expression."
      - "ATTACK, SAME SHAPE ON while. 'while (s.length > 99) / assertGateDbTargetIsLocal() /.test(s);' above an unguarded constructor: guarded TRUE, guardsBeforeConstructing TRUE."
      - "ATTACK, DOOR HIDDEN SILENTLY. 'if (s.length > 0) /[/*]/.test(s);' above 'const client = new PrismaClient();'. The slash is emitted as code, scanning resumes inside the character class, the slash-star opens a PHANTOM BLOCK COMMENT, no star-slash follows, and the remainder of the file is blanked. doorsInSource returns []. NO exception is thrown: the round-twelve loud failure covers an unterminated TEMPLATE only, and a block comment running to end of file blanks silently."
      - "ATTACK, DOOR HIDDEN, backtick variant. 'if (s.length > 0) /[`]/.test(s);' above the constructor, with an ordinary double-quoted string later in the file containing one backtick. The phantom template opens at the regex backtick, closes at the string's, and the constructor between them is blanked. doorsInSource returns []. Again no exception, because the phantom did NOT reach end of file."
      - "THE CONTROL, so these are not an artefact of the extraction: the same file with the regex moved to a position the heuristic reads correctly, 'const re = /[/*]/;', reports {kind: prisma, guarded: FALSE}. The detector works; the heuristic is what fails."
      - "THE CLAIM THIS REFUTES. test/db/gate-target.test.ts:555 through :560 states the honest limit as 'a construction where the previous token is a keyword this list does not carry would be read as division; the failure direction there is UNDER-stripping, which invents no guard and hides no door but can leave regex text in the code-only output.' Both halves of that sentence are false for the direction it names: reading a regex as division INVENTED a guard in two attacks and HID a door in two more, because the surviving regex text re-enters the comment and template states."
      - "The four attacks round twelve lists as closed at test/db/gate-target.test.ts:531 through :544 include 'the guard name written only inside a regex literal counted as a guard' and the two phantom-state shapes. They are closed only where the heuristic decides the slash is a regex. After a control-flow head it does not, and all four come back."
    concrete-fix: "The closing parenthesis is not one token, it is two kinds of token. Track brace and paren nesting in the same pass codeOnly already makes and remember, for each open parenthesis, whether the identifier immediately before it was if, while, for, with or switch; when that parenthesis closes, a following slash opens a REGEX rather than dividing. The same applies to a closing brace that ends a block rather than an object literal, which is the sibling case. Add all four constructs above to the 'the shapes that used to pass' describe at test/db/gate-target.test.ts:1091 as string-driven cases so they are red forever, and correct the limits paragraph at test/db/gate-target.test.ts:555 in place: the under-stripping direction is not safe, it is the direction that invents guards. Separately, make the loud failure fire for an unterminated BLOCK COMMENT as well as an unterminated template, since a phantom comment reaching end of file blanks exactly as much and says nothing."
    analysis: "The lexer is one state better than round ten's and fails for the same reason: it does not parse the language it reads, and the place every hand-written scanner gets this wrong is the one place this one was not taught about. What makes it a high finding rather than a limit is the direction: the paragraph that states the residue asserts the remaining gap is harmless, so a reader who checks the residue before trusting the scan is told the thing my four attacks disprove. This is the third consecutive round in which this instrument has been repaired and left reachable, which is worth reading as evidence about the instrument rather than about any one round."

  - id: CR13-M3P12-03
    severity: medium
    evidence:
      - "src/platform/db/client.ts:172 through :190, bindOnce, caches a bound method per client and per property and NEVER invalidates the entry. Line 183 reads the cache and line 184 returns the cached value without ever comparing it against the CURRENT value the get trap just read from the client."
      - "MEASURED against a real PrismaClient, with the probe holding a reference to the very instance the proxy wraps. prisma.hook = function first(){return 'FIRST'}. Read through the proxy: FIRST, and the underlying client agrees. prisma.hook = function second(){return 'SECOND'}. Read through the proxy: FIRST. Read on the underlying client: SECOND. The proxy also reports p.hook.name as 'bound first'."
      - "It survives delete. delete prisma.hook, then prisma.hook = function third(){return 'THIRD'}: the underlying client returns THIRD and the proxy returns FIRST."
      - "It survives defineProperty. Object.defineProperty(prisma, 'dp', {value: dp1}) then again with dp2: underlying DP2, proxy DP1."
      - "It reaches the client's own methods. After one read of prisma.$transaction populates the cache, assigning a replacement to prisma.$transaction changes the underlying client, and the proxy keeps returning the old bound $transaction."
      - "THE TEST THAT WOULD HAVE CAUGHT IT USES A NUMBER. test/db/client-singleton.test.ts:183 is titled 'the binding enumerates and round-trips a write like the client it wraps' and its write at line 189 is writable['marker'] = 7. Every function-valued write is outside it, which is the one shape the get trap treats specially."
      - "The commit message for 28f8179 states 'The proxy also enumerates, serialises and round-trips a write like the object it wraps, which it did not.' It round-trips a write of a non-function. It does not round-trip a write of a function, and the divergence is worse than the swallow it replaced: the write now succeeds on the object while the read lies about it."
      - "COSMETIC, from the same mechanism and recorded because it is a real difference from a real client: prisma.$transaction.name is 'bound $transaction' where the client's is '$transaction'. Length is preserved at 2 on both."
    concrete-fix: "Key the cache on the VALUE as well as the property, or invalidate on write. The smallest correct change is to make the cache a Map from property to a {source, bound} pair and, in bindOnce, return the cached bound only when cached.source === value, rebinding otherwise; that costs one identity comparison per read and makes staleness unrepresentable. Then change the write in test/db/client-singleton.test.ts:189 to assign a FUNCTION, read it back, assign a second function and read it back, asserting the second one comes out."
    analysis: "The finding is not that anything in src writes a function onto the binding today; nothing does. It is that the round-twelve repair created an interaction between its two new features, the set trap and the bind cache, that neither has alone, and the test written to pin the repair chose the value type that cannot exhibit it. The implementer's own standard for the identity finding it was fixing was 'a defect waiting for its first caller', and this is the same shape."

  - id: CR13-M3P12-04
    severity: medium
    evidence:
      - "src/platform/db/client.ts:192 through :228 declares get, set, deleteProperty, has, ownKeys, getOwnPropertyDescriptor, getPrototypeOf and defineProperty. It declares NO preventExtensions, isExtensible or setPrototypeOf trap, so all three operate on the empty object at line 192 instead of on the client."
      - "MEASURED. Object.preventExtensions(prisma) is ACCEPTED and returns normally, while the underlying client remains extensible (Object.isExtensible on it is still true). The next Object.keys(prisma) then THROWS: TypeError, \"'ownKeys' on proxy: trap returned extra keys but proxy target is non-extensible\". A real client would have become non-extensible and continued to enumerate. Object.freeze reaches the same state."
      - "MEASURED. Object.setPrototypeOf(prisma, null) is ACCEPTED and returns the object, and the prototype the getPrototypeOf trap reports is UNCHANGED, because the write landed on the empty target. That is a silently swallowed write, which is the exact defect class round twelve fixed for ordinary properties."
      - "Nothing in src does either of these today, which is why this is medium and not high."
    concrete-fix: "Forward the three remaining traps to the client, the way the other eight already are: preventExtensions to Reflect.preventExtensions(client()), isExtensible to Reflect.isExtensible(client()) and setPrototypeOf to Reflect.setPrototypeOf(client(), proto). Note that a preventExtensions trap forwarding to the client will still leave the proxy's own empty target extensible, so the ownKeys invariant holds and the TypeError above disappears. Add each to the comparison test beside the enumeration case."
    analysis: "The header at src/platform/db/client.ts:139 says the traps are 'FAITHFUL rather than minimal' and lists what round ten got wrong. Three trap names are still absent and two of the three produce behaviour a real client does not have, one of which permanently bricks enumeration of the binding for the life of the process. The list of what was wrong is accurate; the claim of faithfulness is what overreaches."

  - id: CR13-M3P12-05
    severity: medium
    evidence:
      - "REFUSAL_PROVEN at test/db/gate-target.test.ts:943 is keyed on PATH alone. Every other door predicate in the same file is keyed on (path, kind): exemptKey at test/db/gate-target.test.ts:877, and the exempt sets at :976 and :1011 use it."
      - "prisma/seed.ts holds TWO doors of different kinds, which the file itself asserts at test/db/gate-target.test.ts:900. One table row covers both. That row's reason states 'This is the one door whose guard call is at module scope, so executing the file executes the guard', which is true of the prisma door at prisma/seed.ts:61 and FALSE of the supabase-admin door, whose guard sits inside seedAuthUser at prisma/seed.ts:78."
      - "WHAT THE ENFORCING TEST ACTUALLY CHECKS, at test/db/gate-target.test.ts:1005 through :1025: that every non-exempt door's PATH is in the table, that every table path is still a door, and that entry.reason.length is greater than 60. That is the whole of it."
      - "WHAT IT DOES NOT CHECK: that executedBy names a test that EXISTS. The one non-undefined value, at test/db/gate-target.test.ts:947, is the free-text string \"test/db/gate-target.test.ts, 'the seed REFUSES a target nobody named, executed rather than read'\". Nothing resolves it. Renaming that test at test/db/gate-target.test.ts:1029 leaves the table green and stale."
      - "WHAT IT ALSO DOES NOT CHECK: that a row with executedBy undefined is honest about why. Two of the three rows are in that state, at test/db/gate-target.test.ts:956 and :962, and the only machine condition on either is a prose length of 61 characters or more."
      - "SO THE ANSWER TO THE QUESTION ASKED. The table is CHECKABLE on exactly one axis, coverage: a new door cannot be added without a row appearing, and a row cannot outlive the door it names. On every other axis it is a list someone maintains by hand, and the two rows carrying the honest 'not executed here' answer are the two doors the phase most wants proved."
    concrete-fix: "Key the table on (path, kind) as its siblings already are, so the seed's two doors carry two rows and the module-scope sentence attaches to the door it is true of. Make executedBy resolvable rather than prose: a {file, title} pair, with a test asserting the named title appears in that file's source, which is the cheapest thing that turns a rename red. And record what is honestly not provable HERE as an owed item rather than only as a reason: the two Playwright doors can be proved by the slow gate spawning each spec once with a deliberately wrong target and requiring a non-zero exit, which is the same shape the seed row already uses and the only reason it is not done is that the fast gate cannot start a web server."
    analysis: "The replacement is a real improvement on the rejected static rule, because it moves the claim from 'a guard is spelled' to 'a refusal was observed' for the one door where observing it is cheap. What it does not do is make the other two rows anything but a promise. The criteria contract's own standard applies: the green half is always present, and here the green half is the coverage check while the half that carries the claim, that a refusal was actually proved, is unenforced."

  - id: CR13-M3P12-06
    severity: low
    evidence:
      - "src/platform/db/gate-target.ts:50 and test/db/gate-target.test.ts:796 both state that the rejected top-level rule 'reddens two of this tree's three real doors, both of which call their guard inside a callback'. I checked the tree: prisma/seed.ts:61 is at module scope, test/e2e/merchant-rule-write.spec.ts:86 is inside test.beforeAll, test/e2e/auth.spec.ts:104 is inside a test body, and prisma/seed.ts:78 is inside seedAuthUser. That is THREE of FOUR door instances, not two of three, and the seed is only half top-level. The conclusion survives; the count does not."
      - "test/db/client-singleton.test.ts:197 is titled 'THE CONTROL: two separate module instances construct two clients, so the counter counts' and asserts toBe(1) twice, at lines 203 and 204, because freshModule resets counter.constructions at test/db/client-singleton.test.ts:107. The counter is never shown reaching two. What the test actually establishes is that a fresh module registry constructs again, which is worth having under a name that says it."
      - "test/db/runtime-target.test.ts:35 is titled 'A CALLER THAT DID NO WORK IS REFUSED, which is the probe that defeated round ten'. Finding CR13-M3P12-01 above executes a caller that did no work and is not refused. The title is a claim of impossibility with no captured command behind it, which is the second shape clause R-087 names."
      - "src/platform/db/client.ts:139 through :141 calls the trap set 'FAITHFUL rather than minimal'. Three traps are missing and two of the three diverge from a real client, per CR13-M3P12-04."
    concrete-fix: "Correct all four in place, quoting the superseded text as this repository already does elsewhere in these same files. The count in the two gate-target files should say three of the tree's four door instances and should note that the seed's API guard is not at module scope either, which strengthens the argument rather than weakening it. Rename the control test to what it measures, or assert the counter reaching two by NOT resetting it between the two module instances. The runtime-target test title should be narrowed to the cases it exercises until the derived-expectation case is added, at which point it can have the name back."
    analysis: "Clause R-087 asks for these as findings rather than notes. Three of the four are claims a reader uses to decide how much to trust an instrument, and the fourth is a test name that asserts an impossibility this review disproved. None of them is expensive to correct and none requires the corresponding mechanism to change first."

