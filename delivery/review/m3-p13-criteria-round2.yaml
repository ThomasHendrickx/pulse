deviations-judged:
  - deviation: >-
      Criterion 13.2, "the rendered HTML of /merchants contains the masked form
      and does NOT contain the unmasked account anywhere, asserted over the
      full page source; and the hidden field the naming form submits carries
      the unmasked namespaced identity key, asserted on the same page."
    serves-plan-intent: true
    reasoning: >-
      The deviation stands and is now as narrow as it can be made. The
      contradiction is real for an account that IS an identity key, and this
      round removed everything that was not forced by it: the row identity is
      an opaque digest, the transaction rows no longer cross as an element
      carrying raw data, and the literal clause is asserted with nothing
      excluded on the production build for the one account the contradiction
      does not reach. Two channels remain and I re-derived both as forced
      rather than accepting the claim. That is the strongest true form, which
      is what round one said was missing.
  - deviation: >-
      files-to-touch, which declares test/domain/ and test/e2e/ but neither
      test/application/ nor test/property/, and which declares
      src/modules/merchants/application/merchant-review.ts but not that
      module's index.ts.
    serves-plan-intent: true
    reasoning: >-
      Unchanged from round one and still mechanical, and the fix round widened
      it further in the same reported-rather-than-worked-around way: it also
      touched src/modules/overview/ui/month-view.tsx,
      src/modules/import/ui/profile-confirmation.tsx and
      src/platform/account-number.ts, none of which the declaration names. Each
      is forced by a finding this review raised: the first two are two of the
      six surfaces CR-M3P13-03 named, and the third is where the separator
      question had to be answered once rather than twice. A phase that fixed
      only the surfaces inside its declaration would have left the account
      printed in full on two screens in order to keep a file list tidy, which
      no reading of the plan's intent supports.
  - deviation: >-
      Step 5, "Let the transactions behind a group be seen".
    serves-plan-intent: true
    reasoning: >-
      Unchanged from round one: applied to resolved groups as well as
      unresolved ones, which is more than criterion 13.3 exercises and which
      serves the intent, since naming a group does not make the two purposes
      behind it stop being two.
  - deviation: >-
      Step 4, "the form states, before it is submitted, how many transactions
      of this month the naming will apply to right now."
    serves-plan-intent: true
    reasoning: >-
      NEW IN THE FIX ROUND, and it is a deviation from the plan's own words in
      order to keep the plan's own promise. The step says "of this month" and
      the copy no longer does, because the read behind the count carries no
      period: the count spans every month the household has imported, and
      assignMerchant's recompute carries the rule to all of them. Step 4's
      binding half is "a fact computed from the rows and never a prediction",
      and a month-scoped sentence over a household-wide count is exactly the
      prediction it forbids. The screen now states what the number is. I judge
      this as serving the intent without qualification, and note that it is the
      hazard lane's finding rather than mine.
