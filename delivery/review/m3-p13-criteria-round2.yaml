  - id: CR2-M3P13-03
    severity: low
    analysis: >-
      LIVE IN PRODUCTION: yes, in the safe direction, as over-redaction.
      THE FAIL-CLOSED BRANCH IS RIGHT AND ITS STATED REASON IS NOT. Redacting
      an unregistered country when the checksum holds is the correct direction
      and it closes a real fail-open hole. But the justification written at
      both the platform predicate and the masker is that a checksum "is a
      grammar test rather than a shape test, so it cannot fire on a mandate
      reference, a card number or a phone number". Card numbers and phone
      numbers are safe, because the scan needs two letters followed by two
      digits at a word boundary and they have none. A mandate or creditor
      reference is not safe, and one family of them is not merely possible but
      certain: the ISO 11649 structured creditor reference is literally RF plus
      two check digits plus an alphanumeric body, and its check is the SAME
      mod-97-equals-1 over the same rearrangement that this predicate applies.
      Every valid RF reference whose length falls inside the registry's own
      length bounds will therefore be redacted as though it were an account
      number. That is the safe direction and it costs nothing that matters
      against printing an account, so this is low; what is wrong is the
      sentence, which tells the next reader the branch cannot do the thing it
      will reliably do, on a screen whose whole purpose is letting the owner
      recognise what they are looking at.
    evidence:
      - "src/platform/account-number.ts at 2a0cc03, accountNumberChecksumHolds: /^[A-Z]{2}[0-9]{2}[A-Z0-9]+$/ over the canonical form and mod97(compact) === 1, with the comment 'it cannot fire on a mandate reference, a card number or a phone number'. The same claim is restated in src/platform/ui/mask-account-number.ts at accountSpanAt."
      - "ISO 11649 assigns the structured creditor reference the form RF, two check digits, then up to twenty-one alphanumeric characters, and computes those check digits by moving RF and the digits to the end and requiring mod 97 to equal 1, which is the IBAN rearrangement this predicate implements. Such a reference satisfies both the pattern and the arithmetic by construction."
      - "src/platform/ui/mask-account-number.ts, accountSpanAt: for an unregistered country the loop tries every length from ACCOUNT_NUMBER_LENGTH_BOUNDS.longest down to .shortest and accepts the first run whose checksum holds, so any RF reference whose length lies in that window is redacted."
      - "The existing negative test does not reach this: test/domain/identity-on-review.test.ts asserts maskAccountNumbers('REFERTE 9000000101 20260302') is unchanged, which is a digit run with no country grammar and therefore never a candidate at all."
    concrete-fix: >-
      Refuse the ISO 11649 prefix in the unregistered-country branch, which is
      two characters and one comparison: if the first two letters are RF, do
      not take the checksum path. Then correct both sentences to say what is
      true, that the fallback cannot fire on a value carrying no country
      grammar and that the one family sharing this checksum is excluded by
      name, and pin it with a test that builds a valid RF reference the same
      way the unregistered helper builds its ZZ value and asserts it is left
      alone. If redacting an RF reference is judged acceptable, say so at the
      branch instead and delete the claim that it cannot happen.
