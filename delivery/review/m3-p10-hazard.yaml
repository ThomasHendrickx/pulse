      input still carries the UNMASKED group.counterpartyText, and
      maskCardNumbers is applied only to the display span, exactly as decision
      D-12 requires. Neither spec that guards the screen was edited, so no
      assertion was weakened to accommodate the change.
  - class-id: H10.8
    probed: >-
      Checked that the measurements are a committed spec rather than a
      one-time run, and that it is registered under every project M3-P8 will
      have to keep green: playwright.config.ts:72 (chromium, testIgnore
