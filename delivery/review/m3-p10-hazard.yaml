  - class-id: H10.11
    probed: >-
      Read the observer's scope and filter before reading the criterion.
      test/e2e/busy-state.spec.ts:111 through :160 scopes the
      MutationObserver to the pressed control's nearest ancestor form,
      discards every record whose target is not the pressed control or inside
      its subtree, restricts the surviving attribute records to aria-busy,
      aria-disabled, disabled and class, and then requires the control's
      computed appearance to differ from a pre-click snapshot inside the
      callback that stopped the clock.
    cleared-because: >-
      The defeat the class describes is closed. A data attribute set on
      document.body would be discarded twice over: its target is outside the
      form scope and outside the pressed control's subtree. The appearance
      check inside the stopping callback means the record must have changed
      what is on screen. What that check does NOT ask is whether the changed
      appearance is the RIGHT one, which is how finding HZ-M3P10-01 passes
      every criterion while rendering the wrong state.
  - class-id: H10.12
    probed: >-
      Read playwright.config.ts in full. Confirmed chromium-phone-prod exists
      at :127 through :137 with the same mobile descriptor, isMobile, hasTouch
