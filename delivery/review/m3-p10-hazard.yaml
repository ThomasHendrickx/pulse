findings:
  - id: HZ-M3P10-01
    severity: high
    analysis: >-
      LIVE IN PRODUCTION TODAY. The phase exists to make a press visibly
      acknowledged. What it actually renders is the product's own DISABLED
      appearance, and the busy mark that is supposed to say "working" is
      below any visibility threshold. src/platform/ui/submit-button.tsx sets
      disabled={pending} at :98 and aria-busy at :99 on the SAME element.
      M3-P9's stylesheet declares those as two different states with two
      different appearances, and their selectors are not equal: button:disabled
      at src/app/globals.css:1590 has specificity (0,1,1) and
      [aria-busy="true"] at :1687 has (0,1,0), so the disabled rule wins every
      property they share. Measured in chromium on a button carrying the
      shipped .merchant-name-button class, the busy control computes opacity
      0.55, cursor default, background --color-surface-disabled and colour
      --color-ink-disabled; the busy appearance the stylesheet designed
      (opacity 0.7, cursor progress, the control's own colours) is unreachable
      through the shipped leaf. The mark then inherits currentColor, which is
      now the disabled ink, sits inside an element painted at 0.55, and
      animates its own opacity between 0.25 and 1, giving a measured contrast
      against the button it sits on of 1.09:1 at the cycle's low point and
      1.43:1 at its peak, against a 3:1 floor for a meaningful non-text
      graphic. So the owner, who complained twice about this exact surface,
      presses and sees the control go flat pale grey with no perceptible
      motion in it: the product's own vocabulary for UNAVAILABLE, on a control
      that is in fact working. Every criterion stays green because 10.3 asks
      only that ::after content is not "none" and 10.2(c) asks only that the
      computed appearance CHANGED, and it does change, into the wrong state.
      Nothing in the phase work history mentions specificity, cursor, contrast
      or the collision at all.
    evidence:
      - "src/platform/ui/submit-button.tsx:98 and :99 set disabled and aria-busy on one element"
      - "src/app/globals.css:1590 button:disabled (0,1,1) versus :1687 [aria-busy=\"true\"] (0,1,0); the disabled rule is declared first and still wins on specificity"
      - "chromium over the head's real stylesheet, probe P9: at rest opacity 1 / cursor pointer / bg oklch(0.23 0.008 265); busy opacity 0.55 / cursor default / bg oklch(0.91 0.005 265) / color oklch(0.7 0.007 265); aria-busy alone opacity 0.7 / cursor progress"
      - "chromium colour compositing through a canvas 2D context, probe P10: page rgb(252,250,247), button as painted rgb(236,236,237), mark rgb(227,227,228) at animation opacity 0.25 and rgb(199,199,201) at 1.0, contrast 1.09:1 and 1.43:1"
      - "grep -in \"specificity|cursor: progress|contrast\" over delivery/work-history/m3-p10.yaml and m3-p10-notes.md returns nothing"
    concrete-fix: >-
      Stop letting the disabled rule dress the busy control. Two edits, both
      small and both in files this phase already owns the relationship with.
      (1) In src/app/globals.css raise the busy selector above the disabled
      one for the properties they share, by qualifying it the same way the
      disabled rule is qualified: add button[aria-busy="true"],
      button:disabled[aria-busy="true"] to the busy rule's selector list so it
      carries at least (0,2,1), and give it an explicit background-color and
      color so a busy control keeps its own surface instead of taking
      --color-surface-disabled. (2) Give the mark a colour that does not
      depend on currentColor resolving to a disabled ink: set background-color
      on [aria-busy="true"]::after to a token that contrasts at 3:1 or better
      against the busy control's own surface, adding it to styles/tokens.css
      first, and raise the animation's floor from 0.25 so the low point of the
      cycle stays above that threshold. Then add to
      test/e2e/busy-state.spec.ts, inside the existing 1000ms settle window
      the spec already opens, an assertion that the pressed control's computed
      background-color is NOT --color-surface-disabled and that the composited
      contrast between getComputedStyle(control, "::after").backgroundColor
      and the control's own background is at least 3:1, so this cannot
      regress silently. Note that this fix touches the stylesheet, which
      criterion 10.7 pins to an empty diff for M3-P10; that pin belongs to the
      merged phase and the fix round should record the stylesheet edit as its
      own deliberate change rather than pretend the pin still holds.

  - id: HZ-M3P10-02
    severity: medium
    analysis: >-
      LIVE IN PRODUCTION TODAY. Every press of every submit control in the
      product destroys keyboard focus. The leaf sets disabled={pending} on the
      control that was just activated; a focused element that becomes disabled
      is removed from the tab order and the browser moves focus to
      document.body. Measured in chromium: activeElement goes from the button
      to BODY and the control is no longer tabbable. Nothing in the leaf, in
      any caller, or in the spec restores it. The worst case is the merchant
      naming submit, which is both the control the owner presses most and the
      only one whose action revalidates in place rather than navigating: after
      each name the keyboard user is at document.body and must tab from the
      top of the document to reach the next row, and there are five unresolved
      groups in the committed fixture. On the assistive-technology path the
      phase therefore delivers the opposite of its purpose: aria-busy on an
      unfocused, disabled control is not a live region and is announced to
      nobody, so the press produces no acknowledgement at all. M3-P9's
      stylesheet comment at src/app/globals.css:1616 through :1626 explicitly
      handed M3-P10 the keyboard half of this state and the phase answered
      only the activation half of it.
    evidence:
      - "src/platform/ui/submit-button.tsx:98, disabled={pending} on the control that was pressed"
      - "chromium, probe P11: focus a button then set disabled = true; activeElement before \"focusme\", after \"BODY\", stillTabbable false"
      - "src/modules/merchants/ui/merchant-review.tsx:51, the naming form posts assignMerchantAction and the screen revalidates in place; test/e2e/merchants.spec.ts:54 pins five unresolved groups"
      - "src/app/globals.css:1616 through :1626, M3-P9 naming the keyboard half as M3-P10's to own"
      - "grep -in \"focus|activeElement\" over delivery/work-history/m3-p10.yaml and m3-p10-notes.md returns nothing"
    concrete-fix: >-
      In src/platform/ui/submit-button.tsx keep the control FOCUSABLE while
      refusing the activation, rather than using the native disabled
      attribute alone. Replace disabled={pending} with aria-disabled={pending
      ? "true" : undefined} plus an onClick that calls preventDefault and
      returns when pending is true, which is exactly the split M3-P9's comment
      at globals.css:1618 through :1621 describes and which keeps the element
      in the tab order and focused. Because aria-disabled alone does NOT stop
      the browser's own implicit form submission from Enter on a focused
      submit button, ALSO keep a guard in the same handler for the keyboard
      path, and verify the request count stays at one. Then extend
      test/e2e/busy-state.spec.ts's existing per-control measurement with two
      assertions inside the 1000ms window: document.activeElement is still the
      pressed control, and the route handler's request count is still exactly
      1 after a second Enter press. If the fix round judges aria-disabled too
      risky against criterion 10.4, the alternative that keeps disabled is to
      move focus deliberately rather than lose it: focus a live region that
      announces the busy state, and return focus to the control (or to the
      next row's field, on the naming form) when pending clears.

  - id: HZ-M3P10-03
    severity: medium
    analysis: >-
      LIVE IN PRODUCTION TODAY, as an unguarded deployment rather than a
      witnessed misbehaviour. Criterion 10.3's second half asks that, for EACH
      submit control, after the response is released and the resulting
      navigation or revalidation settles, no element in the document carries
      aria-busy="true". The spec contains exactly one assertion of that shape
      and it cannot fail. It sits at test/e2e/busy-state.spec.ts:444, at the
      very end of the nine-press sequence, immediately after the SIGN-IN
      submit, whose server action redirects into the application shell. By the
      time the locator is evaluated the document has been replaced and holds
      no control that was ever pressed, so the assertion passes whatever the
      leaf does. This is the vacuity class this project has already been
      bitten by twice, in a different disguise: not a spec excluded by project
      membership, but an assertion placed where its subject cannot exist. The
      consequence is that the entire "busy state that never clears" hazard is
      unmeasured for all nine controls, and it is unmeasured precisely on the
      controls where it would matter, the ones that revalidate in place
      (merchant naming, the ring switch) rather than navigating away.
    evidence:
      - "grep -n 'aria-busy' test/e2e/busy-state.spec.ts returns four lines: :159 (the observed attribute list), :255 and :302 (asserting busy IS present at 1000ms) and :444, the only clears-assertion"
      - "test/e2e/busy-state.spec.ts:444, await expect(page.locator('[aria-busy=\"true\"]')).toHaveCount(0), preceded at :412 through :419 by the sign-in press whose action redirects"
      - "test/e2e/busy-state.spec.ts:262, pressAndMeasure waits DELAY_MS + 500 after each press and returns no post-response reading, so no per-control clears value is ever collected"
      - "plan criterion 10.3 asks for this \"for each of the seven submit controls\""
    concrete-fix: >-
      Move the check inside the per-control measurement instead of leaving it
      at the end of the journey. In pressAndMeasure, after the existing
      page.waitForTimeout(DELAY_MS + 500) that lets the delayed response
      through, read and return two more values: whether the PRESSED control
      still carries aria-busy and is still unpressable (guarded for the case
      where it has been detached by a navigation, which is a pass), and the
      document-wide count of [aria-busy="true"]. Then assert both in
      assertAcknowledged, so every one of the nine controls is checked rather
      than none. Add one control specifically for the revalidate-in-place
      path: press the merchant naming submit, let the response through, and
      assert the newly rendered naming control for the NEXT row is pressable
      and carries no aria-busy.

  - id: HZ-M3P10-04
    severity: medium
    analysis: >-
      LIVE IN PRODUCTION TODAY. The one submit control that does not render
      through the shared leaf ties its busy and disabled state to a promise
      whose rejection path is unwritten. src/modules/accounts/ui/account-setup-form.tsx
      submits through an onSubmit handler and startTransition(async () => {
      setState(await registerAccountsAction(INITIAL, data)); }) with no catch
      and no finally, and the button at :291 through :295 reads disabled={pending}
      and aria-busy={pending ? "true" : undefined} off that transition. If the
      call rejects rather than returning a refusal, which on the owner's phone
      means a dropped connection mid-submit, setState is never reached and
      whether pending clears is the framework's business rather than this
      file's. There is nowhere for that error to land either: find over
      src/app for error.tsx, global-error.tsx and loading.tsx returns nothing,
      so no route-level boundary exists. Nothing exercises the path: the only
      press of this control in the suite is on the happy path at
      test/e2e/busy-state.spec.ts:353, and the only clears-assertion in the
      file is the vacuous one finding HZ-M3P10-03 describes. This lane could
      NOT witness what React actually does with a rejected async transition
      here, because that needs a running server and an auth service this
      container has no Docker for; the finding is that the phase shipped a
      busy state whose failure path is neither written nor tested, not that a
      stuck spinner was observed.
    evidence:
      - "src/modules/accounts/ui/account-setup-form.tsx:148 through :154, the onSubmit handler and the uncaught async transition"
      - "src/modules/accounts/ui/account-setup-form.tsx:291 through :295, disabled={pending} and aria-busy driven by that transition"
      - "find src/app -name error.tsx -o -name global-error.tsx -o -name loading.tsx returns nothing (probe P17)"
      - "test/e2e/busy-state.spec.ts:353, the sole press of register-accounts, on the happy path only"
    concrete-fix: >-
      Give the transition an explicit failure path in
      src/modules/accounts/ui/account-setup-form.tsx: wrap the awaited call in
      try/catch inside the transition, set a refusal state the form already
      knows how to render on catch, and let the transition end either way, so
      pending clears on both branches by construction rather than by
      framework behaviour. Then add a test that presses the control with the
      action made to reject (a Playwright route handler fulfilling the
      server-action POST with a 500), and assert that within a bounded window
      the control is pressable again and carries no aria-busy. If the fix
      round would rather not add a case to the e2e suite, the same assertion
      is reachable in the fast gate against the component with the action
      stubbed to reject.

  - id: HZ-M3P10-05
    severity: low
    analysis: >-
      A documentation and instrument defect, live only in the record. Criterion
      10.6(a) names `grep -rln "use client" src/` as its own instrument, and on
      the deployed head that command returns FIVE paths while only FOUR files
      open the boundary: src/app/layout.tsx matches on the phrase inside
      M3-P9's comment "WHY A SCRIPT AND NOT A CLIENT COMPONENT ... a \"use
      client\" file would open", not on a directive. This lane's own first
      pass read the grep at face value and was wrong, which is the point: the
      criterion's stated instrument cannot answer the criterion's question,
      and any later phase re-running it will reach the same wrong answer. The
      phase itself replaced the grep with a directive-aware closure walk in the
      fast gate (test/app/client-boundary.test.ts), which is the right
      instrument and is the reason the phase's own count is correct, but the
      criterion text was never updated to say so and the work history's third
      deviation records "FOUR files carry the directive" without noting that
      the criterion's own command disagrees.
    evidence:
      - "grep -rln \"use client\" src/ returns five paths on e499d64"
      - "per-file directive check (head -1 of each match): four DIRECTIVE, src/app/layout.tsx MENTION ONLY, its first occurrence at line 25 with six non-comment lines above it"
      - "test/app/client-boundary.test.ts:166 through :171 asserts the client file list BY NAME as exactly four, and src/app/layout.tsx is correctly absent"
      - "delivery/work-history/m3-p10.yaml, third deviation, claims four without reconciling the grep"
    concrete-fix: >-
      In delivery/plan/pulse-v02.yaml, criterion 10.6(a), replace the `grep
      -rln` instrument with the closure walk the phase actually shipped: state
      that the client file list is the one asserted by name in
      test/app/client-boundary.test.ts and that a bare grep over the tree is
      not admissible because it counts comments. Because 10.6(a) belongs to a
      merged phase, the honest place for that edit is the next plan revision
      rather than a silent rewrite; at minimum add a sentence to
      delivery/work-history/m3-p10.yaml's third deviation recording that the
      criterion's own command returns five and why the fifth is not a client
      file, so the next reader does not re-derive it.

  - id: HZ-M3P10-06
    severity: low
    analysis: >-
      Criterion 10.9(b) is still NOT WITNESSED, and the escape clause the
      criterion provides does not cover the reason it was skipped. The
      criterion says the whole-worktree probe grep may be recorded as not
      witnessed "if the real statements are ABSENT from the executing
      container". The work history's fifth deviation records something
      different: the real uploads WERE present and the implementing agent's
      environment refused the read. So the criterion's condition for a
      not-witnessed record was not the condition that occurred, and the work
      history itself calls half (b) "a review-time task". This lane cannot
      close it either: it has no access to the owner's real statements. What
      this lane did run is the mechanical half, npm run gate:privacy at exit 0,
      and a read of the phase's own added lines and notes for data shapes,
      which found only millisecond figures. CLAUDE.md non-negotiable 8 says
      plainly that the gate does not see a merchant name or a place name and
      that two real merchant descriptors have already reached this public
      repository that way, so recording the residue precisely matters more
      than the gate's exit code.
    evidence:
      - "npm run gate:privacy EXIT=0, \"gate:privacy clean\", run by this lane at e499d64 with DATABASE_URL pinned to an invented localhost"
      - "delivery/work-history/m3-p10.yaml, fifth deviation, records half (b) as NOT WITNESSED with the reason that the read was blocked, not that the statements were absent"
      - "grep for identifier, card-number, thousands-form amount and date shapes over delivery/work-history/m3-p10-notes.md returns only the millisecond measurement table at :180 through :189"
      - "plan criterion 10.9(b) admits a not-witnessed record only when the real statements are absent from the executing container"
    concrete-fix: >-
      Run half (b) once, in a container that can read the owner's real
      statements, and record the result against phase M3-P10 in
      delivery/work-history/m3-p10.yaml: build the identifier, holder-name,
      merchant-string, thousands-form amount and date probes from those files,
      grep the whole worktree and the phase's added lines with them, and
      record exit 1 with the command beside it. Do not commit the probes. If
      no container can read them, change criterion 10.9(b)'s escape clause in
      the next plan revision so it names the blocked-read case as well as the
      absent-file case, rather than leaving a criterion whose only admissible
      answers are green and a condition that did not occur.

  - id: HZ-M3P10-07
    severity: low
    analysis: >-
      LIVE IN PRODUCTION TODAY, cosmetic. The busy mark is a pseudo-element
      added to the control's inline flow, with width --space-5 and margin-left
      --space-4 and no space reserved for it at rest, so a submit control
      grows when it is pressed: measured in chromium, a shipped
      .merchant-name-button goes from 64.36 to 82.36 CSS pixels wide. On the
      merchant review screen, which renders one such control per unresolved
      row on a 390 pixel viewport, a press reflows the row it sits in at the
      moment the owner is looking at it. The navigating controls do not have
      this problem because .month-nav is a fixed 46 by 46 tap target and the
      18 by 10 marker fits inside it.
    evidence:
      - "src/app/globals.css:1695 through :1708, the ::after mark with width var(--space-5) and margin-left var(--space-4), present only while aria-busy is set"
      - "chromium, probe P2 geometry: .merchant-name-button at rest 64.359375 px wide, the same control busy 82.359375 px, both height 29 px, overflow visible"
      - "chromium, probe P2: .month-nav 46 by 46 both with and without the marker; the marker's box is 18 by 10 with markRight 35.59 inside linkRight 46"
    concrete-fix: >-
      Reserve the mark's box at rest instead of inserting it on press. In
      src/app/globals.css give the controls that can become busy a
      ::after that is always laid out at the same width, margin and height and
      is merely invisible until aria-busy is set (opacity 0 plus the existing
      transition, rather than content: none), so the control's width is the
      same in both states. Then assert it: in test/e2e/busy-state.spec.ts read
      the pressed control's bounding rect immediately before the click and
      again inside the 1000ms window and require the width to be unchanged.

