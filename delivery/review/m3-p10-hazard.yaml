deviations-judged:
  - deviation: >-
      The phase intent and step 3: "all seven submit controls", enumerated as
      the upload submit, the preview-again and confirm submits, the merchant
      naming submit, the sign-in and sign-up submits and the sign-out submit.
    serves-plan-intent: true
    reasoning: >-
      Confirmed independently: nine submit controls exist at the head, not
      seven, because M3-P14's accounts screen merged after the plan section
      was written at 89ed187. Leaving the newest screen as the one place a
      press still goes quiet would have defeated the phase's own intent. The
      spec asserts the set by name in both directions at
      test/e2e/busy-state.spec.ts:422 through :433, so a control the spec
      never reaches fails rather than being skipped, which is the guarantee
      criterion 10.2(a) exists for. The one control outside the leaf has a
      mechanical reason that this lane checked and agrees with: that form
      submits through onSubmit and a transition, so useFormStatus would report
      nothing. The residue it left is finding HZ-M3P10-04.
  - deviation: >-
      Step 4 and criterion 10.5(a): "the seven navigating controls",
      enumerated as nav-overview, nav-import, nav-merchants, unresolved-pill,
      empty-state-import-link and the two month step controls.
    serves-plan-intent: true
    reasoning: >-
      Same cause and same judgement. Nine exist in the plan's own categories
      and the spec measures nine. The four Links outside the plan's categories
      (the two back-to-import links at src/modules/import/ui/import-result.tsx
      and the two alternate-auth links) are covered by the same leaf without
      being measured, and the work history says so rather than leaving it as
      an unstated difference, which is the honest shape.
  - deviation: >-
      Criterion 10.6(a), "grep -rln 'use client' src/ returns AT MOST three
      files, all of them under src/platform/ui/", and 10.6(b), "no file under
      any module's ui/ directory carries use client".
    serves-plan-intent: true
    reasoning: >-
      The judgement is that recording the letter as UNMET, rather than
      reinterpreting it, was correct, and this lane verified the underlying
      facts independently at probes P1 and P2: the offending file predates the
      phase and the phase added two files, both under src/platform/ui/. The
      substance the criterion protects, that no domain type, application
      function, repository or message catalogue reaches the browser, is not
      just met but is now enforced better than the criterion asked, by a
      transitive closure walk in the fast gate. What the deviation does not
      say, and should, is that the criterion's own instrument returns five on
      this tree because it counts a comment: finding HZ-M3P10-05.
  - deviation: "Criterion 10.6(e), the five rules for the closure walk."
    serves-plan-intent: true
    reasoning: >-
      The sixth rule, treating a "use server" module as a boundary rather than
      entering it, is correct on the mechanism: the bundler never puts an
      action module's body in a client bundle, so entering it would report a
      leak that exists in no bundle. The rule is not a widening that hides
      anything, because the walk PINS which modules it treated as action
      boundaries (test/app/client-boundary.test.ts:190, exactly
      src/modules/accounts/ui/actions.ts), so a new one is visible the moment
      it appears, and the cost is written at the rule rather than left to be
      found. That is the shape a guard's own exception should have.
  - deviation: >-
      Criterion 10.9(b), the whole-worktree grep for probes built from the
      real statements.
    serves-plan-intent: false
    reasoning: >-
      Recording it rather than hiding it was right, and the shape-grep
      substitute was better than nothing. But the criterion admits a
      not-witnessed record only when the real statements are ABSENT from the
      container, and the work history says they were PRESENT and the read was
      refused, so the branch taken is not the branch the criterion offers. The
      work history itself calls half (b) a review-time task and this review
      cannot close it either, so it is carried rather than cleared: finding
      HZ-M3P10-06. Judged against the plan's intent, a privacy criterion left
      open across a merge and a deploy does not serve it.
  - deviation: >-
      The plan's branch name for this phase, claude/m3-p10-pending-feedback.
    serves-plan-intent: true
    reasoning: >-
      A naming difference with no behavioural consequence, flagged by the
      implementer precisely because clause R-031 makes the branch name
      load-bearing for the scope auditor. The work is on the dispatched
      branch and is now merged to main, so the plan's name is stale rather
      than violated. Recording it was the right call.
  - deviation: >-
      Criterion 10.7, "Two files outside the surfaces and the test rig may be
      touched, and only these two: playwright.config.ts and eslint.config.mjs".
    serves-plan-intent: true
    reasoning: >-
      The second test file exists because criterion 10.6(e) requires the
      closure walk to run in the FAST gate, and the fast gate does not run
      test/e2e. Two criteria of the same plan pulled in opposite directions
      and the implementer read them together rather than choosing one
      silently, which is what a deviation record is for. This lane confirmed
      the boundary the criterion actually protects is intact: git diff over
      every pinned path (styles/, globals.css, messages/, prisma/, fixtures/,
      application, domain, adapters, amount.tsx, mask-card-number.ts) prints
      nothing, and both package files are untouched.

hazard-classes-addressed:
  - class-id: H10.1
    probed: >-
      Read the spec's measurement construction before reading criterion 10.2.
      test/e2e/busy-state.spec.ts installs a route handler that identifies a
      server-action POST by the framework's next-action header (:60 through
      :71), holds it 2000ms, and asserts the response was released at least
      1500ms after the click (:296 through :299), so the interval cannot be
      satisfied by a fast server or by a handler that never matched. The DOM
      change is timed by a MutationObserver scoped to the pressed control's
      own form. This is a real interval measurement rather than a transition,
      and the phase's own numbers (2.30 to 4.80 ms, notes :180 through :189)
      are consistent with React's synchronous pending render.
    cleared-because: >-
      The interval itself is genuinely measured and genuinely short. The
      hazard as stated, an animation shipped while the dead interval remains,
      is not what happened: the DOM changes within single-digit milliseconds
      of the press. What the phase got wrong is WHICH state it changes into,
      which is finding HZ-M3P10-01 and belongs to H10.4's neighbourhood rather
      than here.
  - class-id: H10.2
    probed: >-
      Counted the directive-carrying files by hand rather than by the
      criterion's grep (probes P1 and P2), read all four, and read the closure
      guard the phase added. Checked that no page.tsx, layout.tsx or route.ts
      carries the directive, that src/modules/overview/ui/month-view.tsx and
      src/modules/merchants/ui/merchant-review.tsx are still server
      components, and that npm run build reports 103 kB shared first-load JS
      with the largest route at 106 kB.
    cleared-because: >-
      The boundary is as small as the job allows. The phase added exactly two
      client files, both under src/platform/ui/, neither importing a domain
      type, an application function, a repository or a message catalogue, and
      the guard against a transitive leak is stronger than the criterion asked
      for: a closure walk that follows re-exports and type-only imports and
      fails closed. The month projection and the merchant review projection
      stay on the server. The letter of 10.6(a) fails only on a file this
      phase did not create.
  - class-id: H10.3
    probed: >-
      grep -rn "useOptimistic" src/ (nothing), and read the spec's
      before-and-after testid collection at test/e2e/busy-state.spec.ts:240,
      :261 and :277, which compares every rendered data-testid and its trimmed
      text across the delay window for eight of the nine controls.
    cleared-because: >-
      Nothing is predicted. No optimistic API is imported anywhere, and the
      one surface DR-0025 will make predict is the one the spec deliberately
      exempts, with the reason written. The busy mark carries no testid, being
      a pseudo-element, so nothing had to be exempted by name to make the
      comparison pass.
  - class-id: H10.4
    probed: >-
      Read every aria-busy occurrence in the spec, then traced where its only
      clears-assertion sits in the journey, then measured the busy appearance
      itself in chromium over the head's real stylesheet.
    finding: HZ-M3P10-03
  - class-id: H10.5
    probed: >-
      Read the guard, then tested the two candidate mechanisms in chromium
      (probe P12): an element carrying only aria-busy="true" computes
      pointer-events auto and delivers a click, while the native disabled
      attribute the leaf actually uses refuses activation from every input
      path. Confirmed the spec forces a second click past actionability
      (:248) and asserts the request count is exactly 1 for all nine controls.
    cleared-because: >-
      The control is guarded, not merely decorated. The leaf uses the native
      disabled attribute rather than the aria-disabled route M3-P9's own
      comment warns takes nothing away, so a second press inside the window
      cannot produce a second import or a second merchant rule. The cost of
      that choice is paid on the keyboard, which is finding HZ-M3P10-02, but
      the double-submission hazard itself is closed.
  - class-id: H10.6
    probed: >-
      git show --stat 785e611 d7db0ff -- package.json package-lock.json, and
      read every import in the two new client leaves.
    cleared-because: >-
      Neither package file is touched by either commit of the phase. The
      leaves import only useFormStatus from react-dom and useLinkStatus from
      next/link, both built into the framework the repository already depends
      on. No spinner component, no form library, no toast library and no state
      store entered the tree.
  - class-id: H10.7
    probed: >-
      Read the whole of the phase's change to
      src/modules/merchants/ui/merchant-review.tsx, then read the current
      hidden field and the display span, then checked that the merchants and
      golden-journey specs were not touched.
    cleared-because: >-
      The submitted value is untouched. The phase's entire change to that file
