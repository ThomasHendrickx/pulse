      its own criterion 8.7 rather than silently spending this phase. The one
      way this guard is weaker than it looks is the clears-assertion, which is
      finding HZ-M3P10-03 rather than this class.
  - class-id: H10.9
    probed: >-
      Read both work-history files for a captured server-action request line
      or any FormData body, and grepped them for identifier, card-number,
      thousands-form amount and date shapes. Re-ran npm run gate:privacy at
      e499d64 with the database environment pinned to an invented localhost.
    cleared-because: >-
      No captured request line reached the repository. The only measurements
      quoted are millisecond figures, produced against the committed synthetic
      fixture, and gate:privacy is clean at exit 0. The hazard as stated, a
      request line carrying real counterparty text reaching a public
      repository, did not occur. The separate residue is that criterion
      10.9(b)'s probe grep was never run at all, which is finding HZ-M3P10-06
      against criterion 10.9 rather than against this class.
  - class-id: H10.10
    probed: >-
      Read the glob, then read the red witness the phase captured, which is
      the half that decides this class. The witness at
      delivery/work-history/m3-p10-notes.md:11 through :22 names the file and
      the react/jsx-no-literals rule at exit 1 with a literal temporarily
      added to src/platform/ui/submit-button.tsx, and exit 0 with it reverted.
      Re-ran npm run lint at EXIT=0.
    cleared-because: >-
      The glob matches something and is proved to fire. It was widened to
      cover exactly where the new leaves live and where M3-P11's toast will
      live, the red witness is against a real file inside the new half of the
      glob rather than the old half, and the src/app/** omission is parked
