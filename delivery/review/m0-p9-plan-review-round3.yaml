# Adversarial plan review, ROUND THREE, of delivery/plan/pulse-v02.yaml phase
# M3-P12 criterion 12.7 as revised by 1c24ead, carried into this branch at
# bd0bf6f. A CONFIRMATION PASS, scoped to the four things the dispatch named.
# Rounds one and two are delivery/review/m0-p9-plan-review.yaml and
# delivery/review/m0-p9-plan-review-round2.yaml on this branch; all sixteen of
# their findings were taken. I did not re-walk the rest of the criterion.
#
# work-log (incremental, newest last):
# - storage check on the revision: criterion 12.7 reads back at 18842 chars,
#   0 newlines, 0 double spaces, no hyphen-space artifact, no em dash.
# - read the four passages named by the dispatch and nothing else.
#
# THE FOUR, EACH SOUND OR NOT.
#
# 1. THE FIRST BICONDITIONAL, licence conjunct struck. SOUND. It now reads
#    'IF AND ONLY IF the merchant it carried before the run differs from the
#    merchant it carries after AND the merchant it carries after is not the one
#    carried by the claimant of the rule it previously resolved through'. I
#    traced the fourth mutant against it: a run publishing a promotion pair
#    whose holder carries a third merchant licenses the row under the routine's
#    own descent predicate, so the routine does not report it, while the
#    biconditional's own terms say it must be, because the after merchant is
#    neither the before one nor the claimant's. Red. The strike does what it
#    was asked to do. See APR3-M0P9-01 for the one inaccuracy in the sentence
#    that describes it, which does not touch this result.
#
# 2. THE SECOND BICONDITIONAL and its added first conjunct. SOUND, and it does
#    exactly what it claims. In the same-merchant twin shape the claimant
#    carries the merchant the row already had, so before and after are equal,
#    so the new conjunct is false and the row is out of the class; without it
#    the other two conjuncts are both satisfied by a row nothing happened to.
#    It also makes shapes one and six disjoint, since shape one is a row whose
#    merchant does not change and the class now requires a change. I checked
#    the other direction too, that the conjunct excludes nothing that belongs:
#    a row that belongs in the class moved from the superseded rule's merchant
#    to the claimant's through a rule outside the lineage, so it changed by
#    construction.
#
# 3. THE BASIS-AGNOSTIC CLAUSE and THE PRECEDENCE CLAUSE. SOUND, both, and
#    keeping the within-space sentence beside the new precedence sentence is
#    the right call rather than a hedge: my finding was that within-space was
#    the wrong half, not that it was wrong. The ordering fixed is the one that
#    makes the exception reachable. Pre-phase space first means the row of the
#    mixed seed is credited to the superseded rule before the run and to the
#    claimant after it, which is a change of hands and is what the exception
#    exists to carry; identity space first would credit the claimant on both
#    sides, nothing would ever change hands, and shapes four, five and six
#    would be unreachable at once. The test named on that exact seed asserts
#    the before merchant is the superseded rule's, which is the assertion that
#    fails on the wrong order. The basis-agnostic clause carries its own test
#    on one rule and two rows, one per basis, asserting both are in the before
#    set and both resolve to that rule's merchant.
#
# 4. THE MUTANT REQUIREMENT. SOUND, and the fourth mutant's pin to the FIRST
#    biconditional is the best clause in the revision: it makes the deletion
#    falsifiable by a reader rather than visible only in a diff, which is the
#    thing no count and no prose can do. On the dispatch's specific question,
#    whether 'a mutant that leaves EVERY property green is a defect in the
#    properties and is fixed before this criterion is met' can be satisfied by
#    weakening a mutant: not silently. The clause obliges the record to carry,
#    per mutant, WHICH property went red and ITS ASSERTION MESSAGE, so a mutant
#    made feeble enough to leave everything green cannot be recorded as passing
#    and a mutant reddening something irrelevant is legible as such in the
#    record. What the clause does leave is a missed sharpening rather than a
#    hole, and it is APR3-M0P9-02: all four mutants redden the first
#    biconditional, not only the fourth, and pinning each of them would replace
#    'went red somewhere' with 'went red on the named property' for all four.
#
# THE RESIDUE ON THE TWO NON-BLOCKING CLASSES, judged as asked. ACCEPTABLE,
# and I raise no finding on it. A forged promotion pair can still move a row
# between 'licensed' and the claimant-merchant class, because the second
# biconditional does read the lineage. What makes that acceptable is the
# direction and the boundary, both of which I checked rather than assumed. The
# boundary: the first biconditional does not read the promotion relation at
# all, so no forged pair can move a row into or out of the LOSS set, and the
# residue therefore cannot cross into the blocking half. The direction: both
# classes end at the claimant's own merchant, so the owner-visible outcome is
# identical either way and the only thing at stake is whether one row is
# printed. The cost is that the claimant-merchant count criterion 16.2 records
# on the deployed run can under-report under a lineage defect; it is a count of
# rows that landed where the owner's current naming points, it is not a
# blocking signal, and the lineage tests check the relation in its own right.
# That is a bounded loss of visibility on a merchant-neutral class, and buying
# it back would mean putting the lineage into the first biconditional, which is
# the exact thing this round removed.
kind: finding
verdict: proceed
