findings:
  - id: APR3-M0P9-01
    severity: low
    evidence:
      - "The sentence describing the first biconditional overstates it: 'THE FIRST BICONDITIONAL NAMES NO LINEAGE AND THAT IS THE POINT OF IT: it is this criterion's top-level invariant written as a test, it is decided FROM MERCHANT IDENTITY ALONE'."
      - "It does name one of the two published relations. Its third term is 'the one carried by the claimant of the rule it previously resolved through', and the claimant relation is the supersededBy relation the routine publishes."
      - "The substantive claim survives and I verified why: the claimant relation is pinned uniquely by the seed, because the same criterion requires the claimant to be 'a rule of the same kind whose pattern is exactly the namespaced form of the superseded rule's pattern' and the declaration table's unique key is (householdId, kind, pattern), so at most one rule can be that claimant. The relation that is NOT uniquely pinned, the promotion, is the one the first biconditional does not read. That is why a forged pair cannot move a row out of the loss set."
      - "The overstatement pulls against a neighbouring sentence in the same criterion, 'THE CHECK COMPARES PUBLISHED IDENTITIES AND NEVER RE-DERIVES ONE', which binds the ROUTINE. An implementer told the test is decided from merchant identity alone, and separately told never to re-derive a published identity, has to work out for themselves which actor each sentence binds, and this criterion's whole history is implementers working things out for themselves."
    concrete-edit: >-
      Replace 'THE FIRST BICONDITIONAL NAMES NO LINEAGE AND THAT IS THE POINT OF
      IT' with: "THE FIRST BICONDITIONAL READS NO PROMOTION AND THAT IS THE
      POINT OF IT. Its three terms are two merchant identities and the merchant
      carried by the claimant, and the TEST determines that claimant from the
      SEED, as the one rule of the same kind whose pattern is the namespaced
      form of the superseded rule's, which the declaration table's unique key
      makes unique; it does not read it from the report. That is not in tension
      with the rule above that the check never re-derives a published identity,
      which binds the ROUTINE and not the test, and the two are written out
      separately here because an implementer holding both sentences at once has
      to be told which actor each one binds."
    analysis: >-
      Accuracy rather than mechanism. The property the sentence is selling is
      real and I confirmed it; the sentence sells slightly more than it has, and
      in this criterion an overstatement is the raw material of the next round.
      Low, and absorbable by the implementer without another plan round.
  - id: APR3-M0P9-02
    severity: low
    evidence:
      - "The clause pins one mutant to one property: 'the fourth must go red on the FIRST biconditional, which is what striking the licence conjunct buys and is how a reader checks that the strike was actually made'. The other three are recorded with 'which property went red and its assertion message' and are pinned to nothing."
      - "All four in fact redden the first biconditional, because the criterion also requires both sides of both biconditionals to be computed from the generated world and never from the routine, so the test's own before and after merchants are correct under every one of the four mutants while the routine's report is not."
      - "Traced one by one. Mutant one reports every change, so a row whose after merchant IS the claimant's is reported while the biconditional says it must not be: red. Mutant two excludes a superseded rule's whole claim from the before set, so a row the test still resolves to that rule's merchant goes unreported: red. Mutant three asks only whether the row is covered afterwards, so a row moving to a third merchant goes unreported: red. Mutant four is already pinned."
      - "Mutant two matters most here. Left unpinned it can be recorded as red on a SHAPE COUNT instead, since excluding the claim puts shapes four, five and six out of reach, and a count reaching zero is a weaker and more fragile catch than a biconditional failing: a later change to the generator can restore the count while the defect stands."
    concrete-edit: >-
      Replace 'and the fourth must go red on the FIRST biconditional, which is
      what striking the licence conjunct buys and is how a reader checks that
      the strike was actually made' with: "and EACH OF THE FOUR must go red on
      the FIRST biconditional, which is what striking the licence conjunct buys
      and is how a reader checks that the strike was actually made rather than
      taking the diff for it. All four reach it, because both sides of both
      biconditionals are computed from the generated world rather than from the
      routine, so the test's own before and after merchants stay correct under
      every mutant while the report does not. A mutant recorded as red on a
      SHAPE COUNT alone does not discharge this: a count reaching zero is a
      catch a later generator change can silently restore, and the second
      mutant, which is round three's defect, is the one that lands there."
    analysis: >-
      A sharpening rather than a repair. The clause as written already makes
      each mutant falsifiable and records the evidence, so nothing wrong ships
      green because of this. What it buys is that the instrument stops depending
      on a count for the one defect that hid a real loss. Low, and cheap enough
      that the implementer can take it inside the fix round.
