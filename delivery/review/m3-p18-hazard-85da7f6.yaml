kind: verdict
phase: M3-P18
verdict: FIX-ROUND-NEEDED
produced-by: anthropic-claude-opus
framing: hazard-classes-first
review-contract: hazard

findings:
  - id: CR-HAZ-P18-01
    severity: high
    evidence:
      - "The refusal arm is removed at src/modules/import/application/confirm-import.ts:118 through :124, so a statement whose own account is registered in the reserve ring is now accepted and its rows ingested."
      - "The guard that decides whether a ring may still be corrected is at src/modules/accounts/application/change-account-ring.ts:45, and it consults hasImportedRows."
      - "hasImportedRows is any transaction on that account at all, with no flow condition and no ring condition: src/modules/ledger/adapters/ledger-repository.ts:144 through :153 returns true for a single row."
      - "The accepted rows keep no flow, because the interpretation window is built from the pot account ids alone at src/modules/ledger/application/interpret-window.ts:37, and the uninterpreted count is now ring scoped at src/modules/overview/adapters/overview-repository.ts:257, so those rows do not hold the verdict open (src/modules/overview/domain/month-projection.ts:281 through :286)."
      - "The message that used to name this remedy is deleted from all three catalogues in this diff (messages/en.json, messages/nl.json, messages/fr.json), including the sentence that told the household to change the ring on the accounts screen first."
      - "No test in the phase exercises the sequence. test/application/account-setup.test.ts:277 asserts the refusal that now bites, written under M3-P14 when a savings statement could not be imported at all."
    concrete-fix: "Scope the guard to what it says it protects. change-account-ring.ts:45 exists so that no row can carry a flow computed against the old ring; a held row carries no flow at all, so the guard should consult rows with a non null flow rather than every row, or equivalently permit a RESERVE to POT change while every row on the account is held, letting the recompute that already follows at change-account-ring.ts:53 bring them into the window. If the ring change must stay refused, then the acceptance path owes the household a named remedy in its place, because this phase removed the only one that existed."
    analysis: "The dangerous sequence needs no unusual step. A household registers its current account and answers the ring question wrongly, which is one control at setup. It uploads that account's statement. Before this phase the upload was refused by name, the message named the ring correction, and the correction succeeded because the account had no rows of its own. After this phase the upload is accepted, the rows land, and hasImportedRows is now true, so the ring correction is refused for the rest of the account's life. What the household then sees is a month whose income, spend and net to reserves omit an entire current account, whose uninterpreted count is zero because the count is ring scoped, and whose banner reads as books closing, with the statement's rows sitting in a held block that states in three languages that they are no part of this month's income, spend or reserves. That statement is true of the code and false of the household's money, and nothing on any screen can undo it. There is a second route to the same state that this phase's own harness constructs: for the collision pair the migration deliberately preserves, findAccountByIban canonicalises the probe and exact matches the stored column (src/modules/accounts/adapters/account-repository.ts:107 through :117), so only the compact member can ever match, and where that member is the RESERVE one every statement for that real account lands held on it while the POT row the household also registered never receives a row. Criterion 18.5 asserts that imports for the paired account behave after the migration exactly as they behaved before it, which is true and is not the comparison that matters: the behaviour changed across the PHASE, from a visible refusal to a silent hold."

  - id: CR-HAZ-P18-02
    severity: high
    evidence:
      - "The migration expression is upper(regexp_replace(iban, '[[:space:]]', '', 'g')) at prisma/schema/migrations/20260827120000_canonical_account_iban_backfill/migration.sql, and the file's own header calls it an SQL MIRROR of canonicalAccountNumber."
      - "canonicalAccountNumber is value.replace(/\\s/g, \"\").toUpperCase() at src/platform/account-number.ts:100, and src/platform/account-number.ts:53 through :57 lists the migration and the collision script as mirrors that must agree with it by test."
      - "WITNESS, per codepoint, over the local Postgres 17 stack and Node 26. Postgres, SELECT regexp_replace(chr(cp),'[[:space:]]','','g') = '' : U+FEFF returns f, U+0085 returns t. Node, String.fromCharCode(cp).replace(/\\s/g,'') === '' : U+FEFF returns true, U+0085 returns false. Every other codepoint in the JS \\s set agreed."
      - "WITNESS, end to end, against the committed migration.sql executed as committed. A stored value of 17 characters carrying a U+FEFF prefix: canonicalAccountNumber returns 16 characters, and after the migration the stored value is still 17 characters (19 bytes) and the migration's own IS DISTINCT FROM filter reports it as already canonical. A stored value of 17 characters carrying a U+0085 separator: canonicalAccountNumber returns 17 characters, and the migration rewrote it to 16."
      - "Nothing in the import path strips a byte order mark: a grep for BOM and for feff over src/modules/import returns no match, and the delimited parser stores the cell as it is at src/modules/import/domain/parse-statement.ts:114 through :124."
      - "The test that is supposed to prove the agreement iterates the seed harness's rows only, at test/e2e/canonical-backfill.spec.ts:216, and every rendering the harness writes uses ASCII spaces (test/e2e/seed-pre-phase-household.ts:52 through :112), so the population cannot falsify the claim."
      - "The same expression is committed twice more in this phase, at scripts/detect-account-collisions.ts:79, and it stands already at src/modules/overview/adapters/overview-repository.ts:194."
    concrete-fix: "Stop calling two different character classes a mirror and write one class on both sides. Either replace [[:space:]] in the migration, in scripts/detect-account-collisions.ts and in the reserves join with an explicit class matching exactly what canonicalAccountNumber strips, or narrow canonicalAccountNumber to exactly the POSIX space set and record that choice at src/platform/account-number.ts:100. Then extend test/e2e/seed-pre-phase-household.ts to write one stored rendering carrying U+FEFF and one carrying U+0085, so the arm at test/e2e/canonical-backfill.spec.ts:216 runs over a population that can see the divergence."
    analysis: "The two directions fail differently and both are quiet. In the U+FEFF direction the migration leaves the row alone because its own filter reports the value already canonical, so the account stays permanently unmatchable by the canonical lookup and the household goes on being refused as unregistered with no remedy any screen names. That is exactly the live exposure the migration exists to close, surviving the migration and reported by nothing: the collision script does not list it, because it is not a collision. The reachability is ordinary, not exotic: a UTF-8 byte order mark on a bank export whose own account column is the first cell, and no code in the import path removes one. In the U+0085 direction the migration itself rewrites a stored value into a form canonicalAccountNumber can never produce, and because the original rendering is gone the row cannot be repaired by re-running anything. This is the least reversible surface in the phase and its correctness rests on a comment asserting an agreement that is false, with a test whose population was chosen such that it cannot see it."

  - id: CR-HAZ-P18-03
    severity: high
    evidence:
      - "WITNESS, against the committed expression of listReserveMovements at src/modules/overview/adapters/overview-repository.ts:194 through :208, over one household holding the collision pair the seed harness writes and one pot side row with flow RESERVE. The LEFT JOIN matched both members of the pair and the query returned two groups, each carrying the full amount of the single row and a rowCount of 1."
      - "The same row through the monthFigures expression at src/modules/overview/adapters/overview-repository.ts:245 returned the amount once."
      - "The month view's reserves total is reserveGroups.reduce over those groups at src/modules/overview/application/month-overview.ts:176, while the reconciliation panel reads figures.netToReservesCents at src/modules/overview/ui/month-view.tsx:382, so the two disagree and only the second decides the verdict."
      - "The pair is not hypothetical in this phase: test/e2e/seed-pre-phase-household.ts:82 through :98 constructs one, and the migration is specified to leave both of its rows exactly as they are."
      - "No test in the phase reads a figure over a household holding the pair. test/e2e/held-and-gap-rows.spec.ts:97 asserts listReserveMovements returns an empty array, over a household with no RESERVE flow row at all."
    concrete-fix: "Make the reserves join fan out at most once per transaction: aggregate the matching account rows before joining, or join on a DISTINCT ON over accounts keyed by household and canonical number, so one transaction contributes its amount once whatever the number of account rows sharing a canonical form. Then add an arm over the harness's own pair asserting that the reserves block total equals figures.netToReservesCents, which is the invariant the fan out breaks."
    analysis: "This is the quiet wrong answer in its plainest form: a money figure on the screen is twice the money, and the reconciliation banner above it still reads as books closing, because the banner is computed from a different query that does not join. The join predates this phase. What belongs to this phase is that the phase's entire migration half is a decision about what to do with a collision pair, and it decided to preserve the pair permanently and detect it out of band, without ever asking what a preserved pair does to a displayed figure. The detection script's output is row ids and nothing else, so an operator running it learns that a pair exists and learns nothing about the doubled reserves total it is already producing. Hazard class H18.2 names the same euro appearing under two headings on one screen and the phase addressed it only through the held block; the pair reaches it by another road and the phase does not look down that road."

  - id: CR-HAZ-P18-04
    severity: medium
    evidence:
      - "src/modules/accounts/application/change-account-ring.ts:7 states that savings statements are not imported in v1 and cites pulse-domain section 1 for it. DR-0030 and this phase made that false."
      - "The sentence is load bearing rather than decorative: the paragraph at src/modules/accounts/application/change-account-ring.ts:12 through :17 concludes from it that a stale flow is unreachable and that therefore no clearing and no read scoping is needed."
      - "The phase corrected the same superseded sentence in the two other places it stands, at .claude/skills/pulse-domain/SKILL.md:22 and at src/modules/ledger/domain/ledger-transaction.ts:35 through :41, and missed this one."
      - "The grep that criterion 18.1 relies on reads the skill file only: test/domain/savings-decision.test.ts:75 asserts the sentence is absent from .claude/skills/pulse-domain/SKILL.md and nothing sweeps src."
    concrete-fix: "Rewrite the comment at src/modules/accounts/application/change-account-ring.ts:7 through :17 to what the product now does under DR-0030, stating plainly that a reserve account CAN now carry its own imported rows and what that means for this guard, and widen the assertion at test/domain/savings-decision.test.ts:75 from the skill file to a sweep of src so a superseded sentence cannot survive in a comment that carries a safety argument."
    analysis: "Raised as a finding and not a note, per clause R-087. The claim was true when written and this phase made it false, which is the first of the two shapes that clause names. It matters more than the usual instance because the next reader of this file is deciding whether the guard can be relaxed, and the file tells them the case they are looking at cannot happen."

  - id: CR-HAZ-P18-05
    severity: medium
    evidence:
      - "The uninterpreted count is now ring scoped at src/modules/overview/adapters/overview-repository.ts:257, and the null flow arm of the gap listing at src/modules/overview/adapters/overview-repository.ts:335."
      - "In the same query, changeInPot at src/modules/overview/adapters/overview-repository.ts:246 and rowCount at src/modules/overview/adapters/overview-repository.ts:258 filter on the flow alone and carry no ring predicate, although changeInPot is by name the change in the POT."
      - "In the same listing, the UNRESOLVED and INTERNAL arms at src/modules/overview/adapters/overview-repository.ts:336 through :339 carry no ring predicate either."
      - "The held read at src/modules/overview/adapters/overview-repository.ts:371 is keyed on the ring alone and carries no flow condition, which criterion 18.3 requires."
    concrete-fix: "Scope changeInPot and rowCount by a.role = 'POT' alongside the uninterpreted count, and either scope the UNRESOLVED and INTERNAL arms of listGapRows the same way or record at src/modules/overview/adapters/overview-repository.ts:336 why those two arms are deliberately ring blind. The point is that one query should hold one answer to what the pot is."
    analysis: "Probed and NOT currently reachable, which is why it is medium and not high: interpretation stamps a flow only over the pot account ids (src/modules/ledger/application/interpret-window.ts:37), so no reserve ring row carries a non null flow today and the unscoped sums and the scoped count happen to agree. It is written down because the agreement is a coincidence of one other file, not a property of this query, and because the two things that would break it are both on the near horizon. A ring change from POT to RESERVE over an account that already carries stamped rows would put those rows into changeInPot and rowCount, into the reserves and spend sums, AND into the held block whose visible text says they count in none of them; the only reason that is unreachable is the guard at change-account-ring.ts:45, which finding CR-HAZ-P18-01 asks to be relaxed. Whoever relaxes it must scope these reads in the same change."

  - id: CR-HAZ-P18-06
    severity: low
    evidence:
      - "The held rows render the booking date raw at src/modules/overview/ui/month-view.tsx:322, outside any locale-aware formatting."
      - "The Playwright arm pins the raw ISO form, asserting a row filtered by the literal date text at test/e2e/month-view.spec.ts:1494."
    concrete-fix: "If the raw ISO date is the deliberate house form for a row meta line, say so at src/modules/overview/ui/month-view.tsx:322; otherwise render it through the same path the rest of the month view uses. Either way the choice should be recorded rather than inherited."
    analysis: "Recorded as low and as a consistency question rather than a defect: the gap list beside it renders its booking date the same way at src/modules/overview/ui/month-view.tsx:356, so the held block follows the house practice rather than departing from it. Named because the phase's own criterion 18.2 arm four is about the mandatory rendering path and stops at the amount."

criteria:
  - id: "18.1"
    quote: "A SAVINGS STATEMENT IS ACCEPTED AND THE REFUSAL IS GONE ROOT AND BRANCH."
    evidence:
      - "The refusal arm is gone from src/modules/import/application/confirm-import.ts:118 through :124 and the reason is gone from the union at src/modules/import/application/confirm-import.ts:27 through :33."
      - "Routing gone at src/modules/import/ui/actions.ts:103 through :110, whitelist gone at src/modules/import/ui/status-keys.ts:11 through :14, SETUP_LINKED membership gone at src/modules/import/ui/import-status-line.tsx:16 through :18, and the message gone from messages/en.json, messages/nl.json and messages/fr.json."
      - "The refusal test is rewritten rather than deleted at test/e2e/accounts.spec.ts:452, and the unregistered and card arms stand at test/e2e/accounts.spec.ts:407 and test/e2e/accounts.spec.ts:500."
      - "The skill sentences are rewritten at .claude/skills/pulse-domain/SKILL.md:22 and .claude/skills/pulse-domain/SKILL.md:98, with the grep at test/domain/savings-decision.test.ts:69."
      - "NOT MET on the last arm: the same superseded sentence survives in a live safety argument at src/modules/accounts/application/change-account-ring.ts:7, and the criterion's grep reads the skill file only (test/domain/savings-decision.test.ts:75). See finding CR-HAZ-P18-04."
