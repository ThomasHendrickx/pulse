  - id: "18.3"
    quote: "BOTH READS THAT CAN SEE A DELIBERATELY UNINTERPRETED ROW ARE SCOPED THE SAME WAY, AND A GAP ON A SPENDING ACCOUNT IS STILL A GAP."
    evidence:
      - "My own independent sweep over src returned exactly the two reads, at src/modules/overview/adapters/overview-repository.ts:257 and src/modules/overview/adapters/overview-repository.ts:335, both scoped by the ring predicate and neither written by dropping the null flow condition; no third read and no Prisma client null form exists anywhere under src."
      - "The held read carries no flow condition at src/modules/overview/adapters/overview-repository.ts:359 through :385, so it is correctly outside the enumeration."
      - "The spending row still holds the verdict open: uninterpretedCount is 1 and reconciles is false at test/e2e/held-and-gap-rows.spec.ts:110 through :113."
      - "The listing alone assertion and the whole port sweep are present at test/e2e/held-and-gap-rows.spec.ts:57 through :160."
    met: true
  - id: "18.4"
    quote: "THE STORED DECLARATIONS BECOME CANONICAL, AND THE HOUSEHOLD THE BUILT GATE LOCKED OUT IS LET BACK IN."
    evidence:
      - "Only the declaration moves: one UPDATE of accounts and no transaction column, pinned at test/domain/canonical-backfill.test.ts:39 and confirmed by reading the committed migration.sql."
      - "Validity is not smuggled in: no validation appears in the migration and the checksum failing row is backfilled like any other, asserted at test/e2e/canonical-backfill.spec.ts:224 through :229."
      - "IDEMPOTENT, verified by me rather than accepted: I executed the committed migration three times against an isolated database seeded with the harness's shapes. Run one reported UPDATE 4, runs two and three reported UPDATE 0, and a per row snapshot after run one and after run three was identical. A card account's null number was untouched throughout and rows already canonical did not move."
      - "NOT MET on the mirror arm: the committed expression and canonicalAccountNumber disagree in BOTH directions, on U+FEFF and on U+0085, and the spec that is meant to prove agreement runs over a population of ASCII spaced renderings that cannot see it. See finding CR-HAZ-P18-02."
    met: false
  - id: "18.5"
    quote: "ONE REAL ACCOUNT CANNOT BECOME TWO ROWS, AND A PAIR THAT ALREADY EXISTS IS LEFT DETECTABLE, NEVER GUESSED AT."
    evidence:
      - "The typed half compares canonical forms at src/modules/accounts/application/register-accounts.ts:53 through :65, asserted both directions at test/application/account-setup.test.ts:497 and test/application/account-setup.test.ts:524."
      - "THE MIGRATION HALF, verified by me. Against an isolated database I seeded a collision pair spaced and compact under one household, plus a row in a SECOND household whose stored value canonicalises to the same form. The committed migration completed, left BOTH members of the pair byte identical, and canonicalised the second household's row. The collision detection is therefore per household and correct, and it BLOCKS rather than reports and proceeds: the NOT EXISTS sits in the WHERE of the single UPDATE, so both members are evaluated against the statement's own snapshot and no write is issued for either. This is not the M3-P12 shape where the blocking conditions ran after the writes."
      - "The detection script groups by canonical form and emits groups of two or more, printing row ids only, at scripts/detect-account-collisions.ts:74 through :86."
      - "NOT MET on the no worse off arm. The criterion compares behaviour across the MIGRATION and the phase changed it across the PHASE: for a pair whose compact member sits in the reserve ring, the statement that was refused by name before this phase is now silently accepted and held, because findAccountByIban exact matches the stored column and only the compact member can match (src/modules/accounts/adapters/account-repository.ts:107 through :117). And a preserved pair makes the reserves block report twice the money while the banner reads as closing, which I witnessed against the committed join expression. See findings CR-HAZ-P18-01 and CR-HAZ-P18-03."
    met: false
  - id: "18.6"
    quote: "npm run typecheck, npm run lint, npm test, npm run gate:tokens, npm run gate:privacy and npm run gate:decisions all exit 0, and npm run test:e2e exits 0 with the new specs reporting their tests as passed."
    evidence:
      - "Run by me in this worktree: npm run typecheck exit 0; npm run lint exit 0; npm test exit 0 with Test Files 50 passed (50), Tests 678 passed (678); npm run gate:privacy exit 0, gate:privacy clean."
      - "Every identifier the phase adds is on the allow list and the privacy gate passes over the whole tree, which is the arm review finding P17-007 asks for."
      - "Run by me against the local Supabase stack, ONE slow-gate spec that drives no browser: npx playwright test --project=chromium -g \"every port method sees the pot gap\" exited 0, reporting 1 passed (44.5s). That is criterion 18.3's whole-port sweep against the real repository over a real database, and it is the only slow-gate arm I was able to close."
      - "NOT MET as a whole: npm run test:e2e has still not been shown to exit 0 anywhere. The work history records it honestly as an error with no wrapper exit code, and I could not close the gap here. A database WAS reachable in my container and the migration applied cleanly under prisma migrate deploy, but the suite needs the reset and seed that npm run db:reset performs, and prisma migrate reset is refused by Prisma's agent consent guard which I have no consent to override. Every browser test I did start failed identically at sign up against my hand built environment, which is an environment result and not a code result, and I am recording it as such rather than as a pass or a failure of the phase."
    met: false

deviations-judged:
  - deviation: "files-to-touch (M3-P18 declaration)"
    serves-plan-intent: true
    reasoning: "src/modules/overview/application/index.ts is the overview module's composition root and the new port method cannot be bound anywhere else; the declaration names ports.ts for the held read and plainly intended the application layer. The edit is three lines of wiring at src/modules/overview/application/index.ts:26 and :57 and adds no behaviour of its own."
  - deviation: "files-to-touch (M3-P18 declaration)"
    serves-plan-intent: true
    reasoning: "Both undeclared edits are comment only and both are required by standing clauses rather than chosen: src/modules/ledger/domain/ledger-transaction.ts:35 carried a sentence DR-0030 falsified, which clause R-087 requires correcting in place, and src/platform/account-number.ts:48 through :57 is the mechanism sibling list that must name a new consumer and the new SQL mirror sites. I confirmed neither file changed behaviour by reading the whole diff of each. The deviation is judged sound and it is also incomplete, because the same clause obliged a third file the implementer did not reach: see finding CR-HAZ-P18-04."
  - deviation: "step 1 ordering (capture before any other edit)"
    serves-plan-intent: true
    reasoning: "The database dependent captures could not precede editing because no database existed in the implementer's container, and the static captures were taken first as ordered. The order was broken by the environment rather than for convenience, the work history says so plainly, and the substance the step existed to obtain, a baseline the nothing moves arms assert against, is present and pinned at test/e2e/held-and-gap-rows.spec.ts:100 through :112. Judged sound. Recorded alongside it: the same environment left criterion 18.6's slow gate arm unmet, which is finding territory for the round rather than a fault in this deviation."

hazard-classes-addressed:
  - class-id: H18.1
    probed: "Followed an accepted savings statement from confirm-import through ingest to the screen, asking whether the three shapes the class names can actually be seen. Read the port method, the projection type, the grouping fold and the rendered block, and checked the Playwright arms that pin each shape by amount rather than by row count. Then asked the inverse question the class does not ask: whether the rows appear on a screen the household would reach, and whether the block survives when the account holds rows in no other month."
    cleared-because: "The rows reach the screen. listHeldRows at src/modules/overview/adapters/overview-repository.ts:359 is keyed on the ring alone with no flow condition, so nothing about interpretation can make the block vanish, which is the property this class needed. The block renders one line per row with date, counterparty text and amount at src/modules/overview/ui/month-view.tsx:281 through :330, and the interest credit, the transfer to the household's other savings account and the payment straight out of savings are each asserted present with their own amount, compared byte for byte, at test/e2e/month-view.spec.ts:1480 through :1491. The household is materially better off than under the refusal DR-0030 rejected."
  - class-id: H18.2
    probed: "Two separate probes. First, searched the added code for any arithmetic over held amounts: read groupHeldRows, the MonthOverview field, the port type and the rendered block, and checked the assertion that no card total element exists. Second, took the class at its word about the same euro under two headings and looked for OTHER roads to it, which led to the collision pair the migration preserves: I executed the committed listReserveMovements expression against an isolated database holding that pair and one pot side RESERVE row."
    finding: CR-HAZ-P18-03
  - class-id: H18.3
    probed: "Ran my own occurrence sweep over src for every spelling of an absent flow test, the SQL string form, a COALESCE or CASE over the flow column, and the Prisma client forms, rather than reading the phase's own grep. Then read both reads in full and traced the verdict path from the count to reconciles, and separately checked that the scoping is written by a ring predicate and not by dropping the null flow condition."
    cleared-because: "My sweep returned exactly two reads, at src/modules/overview/adapters/overview-repository.ts:257 and src/modules/overview/adapters/overview-repository.ts:335, and no third anywhere under src in any spelling. Both carry the null flow condition intact and add the ring predicate beside it, which is finding CR-502 held rather than undone. A null flow row on a POT account is still counted, is still listed, and still forces reconciles false through src/modules/overview/domain/month-projection.ts:286. The two reads move together, so the cause block cannot vanish while the repository goes on returning its rows. The related concern that the OTHER arms of the same two queries are ring blind is real but is not this class, and it is written down as finding CR-HAZ-P18-05."
  - class-id: H18.4
    probed: "Greped the whole tree for the refusal reason and its message key rather than the files the criterion enumerates, and separately read each of the six consumer sites the root cause names to confirm the removal is at the site and not merely at the gate. Then asked what the removal exposed rather than what it left behind, and walked the ring correction path the deleted message used to point at."
    finding: CR-HAZ-P18-01
  - class-id: H18.5
    probed: "Read the committed migration.sql in full and counted its statements, then executed it as committed three times against an isolated database and compared a full row snapshot of a transactions table seeded beside the accounts table, to see whether anything outside the declaration column moved."
    cleared-because: "The migration is exactly one UPDATE of the accounts table. It names no transaction column and no counterparty column, and my executed runs left every seeded transaction row untouched. The pin at test/domain/canonical-backfill.test.ts:39 additionally fails on any INSERT, DELETE, DROP, ALTER or TRUNCATE appearing in the file, so a second statement cannot be added quietly. No fact is rewritten."
  - class-id: H18.6
    probed: "Seeded an isolated database with the harness's collision pair under one household plus a row in a SECOND household whose stored value canonicalises to the same form, then executed the committed migration once, twice and three times, snapshotting every row between runs, to answer three questions the class raises: does it die on the index, does it pick a winner, and is the blocking evaluated before or after the write is issued."
    finding: CR-HAZ-P18-03
  - class-id: H18.7
    probed: "Ran the typed duplicate check's two directions against the application tests, then attacked the half the typed check cannot reach: what happens once a pair exists and a statement arrives for it. Read findAccountByIban to see which member a canonical probe can match after the migration has deliberately left both alone, and traced that member's ring through confirm-import to the month's totals."
    finding: CR-HAZ-P18-01
  - class-id: H18.8
    probed: "Ran npm run gate:privacy myself over the whole tree, read the new fixture files, the seed harness and the allow list entries line by line against each other, and checked that every account shaped value the phase introduces appears in test/fixtures/allowed-identifiers.txt with a provenance note in the same commit. Also read the phase's commit messages on the branch for data values."
    cleared-because: "npm run gate:privacy exits 0 and prints gate:privacy clean. Every account shaped value the harness and the savings fixture introduce is on the allow list with a written note saying how it was invented, and the fixtures carry invented merchant and place strings rather than anything a real document could supply. The gate cannot see a merchant name inside a file, which is why I read the new fixtures rather than trusting it, and I found nothing in them that reads as taken from a real statement."
