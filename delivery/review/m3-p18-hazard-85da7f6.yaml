      - "The visible note is catalogue text at messages/en.json and is asserted visible and per locale at test/e2e/month-view.spec.ts:1504 and test/e2e/month-view.spec.ts:1547."
      - "Nothing is summed: groupHeldRows performs no arithmetic at src/modules/overview/domain/month-projection.ts:331 through :348, and the absence of a card total is asserted at test/e2e/month-view.spec.ts:1510."
      - "Amounts go through the one path at src/modules/overview/ui/month-view.tsx:314 and are counted at test/e2e/month-view.spec.ts:1516."
