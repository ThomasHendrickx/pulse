findings:
  - id: R2-M0P14-01
    severity: medium
    analysis: |-
      CRITERION 16.1 NOW REQUIRES QUOTING FROM THE CAPTURED OUTPUT A LINE
      THE CAPTURED OUTPUT CANNOT CONTAIN. The pluralisation changed "the
      per-run escape hatch ... shown as the literal assignment it was
      given, quoted from the captured output" into "the per-run escape
      hatches ... shown as the literal assignments they were given, quoted
      from the captured output". The first hatch's literal assignment does
      reach the captured output: guard-cli prints its verdict reason on
      allow, and the destructive assessment's hatch reason begins with the
      literal string PULSE_ALLOW_REMOTE_DB_DESTRUCTION=1. The second
      hatch's does not and cannot: client.ts's assertTargetAllowed prints
      ONLY on refusal (console.error under !verdict.allowed) and prints
      nothing when it allows, and no other line in the process names
      PULSE_ALLOW_REMOTE_DB_IN_DEV. So the MET record is asked for a quote
      that no run can produce. The implementer's escapes are all bad:
      modify client.ts to print an allow line (not admitted by the
      files-to-touch gloss, which admits the removal and one refusal-message
      redaction), modify the routine to echo its environment (M3-P16 runs
      the committed routine "never modified"), or transcribe the assignment
      by hand into the record, which is exactly the retyped-transcript
      shape the run step forbids.
    evidence:
      - |-
        Criterion 16.1 as fixed: "the per-run escape hatches M3-P12's
        criterion 12.23 requires shown as the literal assignments they
        were given, quoted from the captured output".
      - |-
        src/platform/db/client.ts:70 through :77 on main: assertTargetAllowed
        raises console.error and throws only when !verdict.allowed; the
        allowed branch returns silently, so an allowing construction prints
        nothing.
      - |-
        The only output lines naming a hatch name the first one:
        src/platform/db/guard.ts's destruction-hatch reason begins
        "PULSE_ALLOW_REMOTE_DB_DESTRUCTION=1 is set", printed by guard-cli
        on both branches; no reason string in guard.ts or client.ts names
        PULSE_ALLOW_REMOTE_DB_IN_DEV outside the refusal advice text.
    concrete-edit: |-
      In criterion 16.1 replace the quoted-from-captured-output clause
      with: "shown as the literal assignments they were given IN THE
      RECORDED COMMAND LINE, in the placeholder form criterion 16.4 fixes;
      the destruction hatch is additionally witnessed by the guard's
      captured allow line, which is the only hatch any output line names,
      because the client prints nothing when it allows." No other text
      changes; criterion 16.4 already carries the matching command-line
      wording and needs none.
  - id: R2-M0P14-02
    severity: low
    analysis: |-
      MEASUREMENT FIVE'S NEW SENTENCE MAKES A FALSE CLAIM ABOUT THE TESTS
      IT LEANS ON. It says the hostname redaction changes no refusal logic
      "and the existing db-guard tests pin that". The existing db-guard
      test pins the OPPOSITE: it asserts the non-local refusal reason
      CONTAINS the resolved hostname, so the redaction turns that
      assertion red and the test must be inverted, not left standing as a
      pin. An implementer sent to the suite expecting green will read the
      red as their own defect, and one who trusts the sentence over the
      tree might keep the hostname to keep the test green, which quietly
      un-fixes finding PR1-M0P14-05.
    evidence:
      - |-
        test/db/db-guard.test.ts:31 on main:
        expect(verdict.reason).toContain("aws-1-eu-north-1.pooler.supabase.com"),
        an invented fixture host asserted INTO the destructive
        assessment's non-local refusal reason.
      - |-
        Criterion 12.23 measurement FIVE as fixed: "the refusal logic
        changes not at all, and the existing db-guard tests pin that".
    concrete-edit: |-
      Replace "and the existing db-guard tests pin that" with: "the
      db-guard assertion that today quotes the fixture hostname into the
      reason (test/db/db-guard.test.ts:31) is INVERTED in the same change,
      asserting the variable name present and the hostname absent, and the
      refusal LOGIC tests around it stay untouched."
  - id: R2-M0P14-03
    severity: medium
    analysis: |-
      MEASUREMENT THREE'S STRUCTURAL PIN NAMES ONE READING WHERE THE TREE
      DELIBERATELY HAS TWO IN ONE MODULE, AND THE ONE IT NAMES IS WRONG
      FOR THE ROUTINE. The fixed text requires that "both consumers import
      that shell-first, dot-env-fallback reading from
      src/platform/db/resolve-env.ts". The routine does not and must not
      use that reading: it resolves through resolveClientDbUrl, the
      module's OTHER export, which reads process.env only, and the comment
      at its call site records why as a closed finding: "THE STRING THE
      CLIENT WILL OPEN, not the one the Prisma CLI would resolve (fix
      round three, finding CR3-M3P12-03). new PrismaClient() reads
      process.env only, so the interlock reads process.env only." The
      shell-first, dot-env-fallback reading is the PRISMA CLI's, correct
      for guard-cli because guard-cli guards prisma migrate commands. An
      interlock resolves the way the thing it guards resolves, which is
      the criterion's own principle; as fixed, the criterion instructs the
      routine to resolve the way a DIFFERENT program resolves. The
      damage is bounded, which is why this is medium and not high: the
      wrong wiring stays fail-closed (the divergence cases are a shell
      value both readings see identically, or an absent-or-empty shell
      value on which the client constructs nothing), so this reintroduces
      the incoherence CR3-M3P12-03 removed rather than a live hole. But a
      criterion that contradicts a recorded fix-round finding and the
      pinned comment beside the call site will lose the argument with the
      tree in front of some future implementer, one way or the other.
    evidence:
      - |-
        scripts/rederive-merchant-rules.ts:126 on main: import {
        resolveClientDbUrl } from "@/platform/db/resolve-env"; and the
        productionDeps comment: "THE STRING THE CLIENT WILL OPEN, not the
        one the Prisma CLI would resolve (fix round three, finding
        CR3-M3P12-03)".
      - |-
        resolve-env.ts's own contract on main: "resolveDbEnv matches the
        PRISMA CLI, and guards prisma migrate reset and prisma migrate
        dev, which is what guard-cli.ts does", with the client's
        process.env-only reading distinguished beside it.
      - |-
        Measurement THREE as fixed: "both consumers import that
        shell-first, dot-env-fallback reading from
        src/platform/db/resolve-env.ts, where it already lives".
    concrete-edit: |-
      Rewrite measurement THREE's middle clause to: "the resolution lives
      in ONE module, src/platform/db/resolve-env.ts, and each consumer
      imports the reading that matches what it guards: guard-cli.ts
      imports resolveDbEnv, the Prisma CLI's shell-first, dot-env-fallback
      reading, and the routine imports resolveClientDbUrl, the client's
      process.env-only reading, because an interlock resolves the way the
      thing it guards resolves (finding CR3-M3P12-03) and the client never
      reads a .env file. The unit test stubs the MODULE and sees both
      consumers change answer together; the grep-shaped test pinning that
      no file under src or scripts other than resolve-env.ts opens a .env
      file by name stands unchanged."
  - id: R2-M0P14-04
    severity: low
    analysis: |-
      THE DRY-RUN EQUALITY NAMES NO MAPPING, AND ONE OF THE OBVIOUS
      READINGS IS WRONG ON A SEED THE PLAN ITSELF GUARDS. Criterion 16.6
      and the run step require the dry run's "printed rule counts EQUAL to
      the before pair the ref-pinned transport returned", the pair being
      the namespaced and un-namespaced merchant_rules counts. The routine
      prints, in its totals block, rules-before, patterns-rewritten and
      already-namespaced. The sound mapping is: already-namespaced equals
      the transport's namespaced count, and rules-before minus
      already-namespaced equals its un-namespaced count. The tempting
      mapping, patterns-rewritten as the un-namespaced count, is FALSE
      exactly where criterion 12.7 says pass one leaves an un-namespaced
      rule untouched: a stored EMPTY pattern is left as it is and
      reported, so it is un-namespaced in the transport's count and absent
      from patterns-rewritten, and the equality would fail on a correct
      run, which is the shape that teaches an operator to stop trusting
      the gate that protects them.
    evidence:
      - |-
        The routine's totals block on main,
        scripts/rederive-merchant-rules.ts:189 through :193: rules-before,
        rules-after, patterns-rewritten, already-namespaced are the
        printed counts available for the comparison.
      - |-
        Criterion 12.7's pass-one exception: "A rule whose pattern is the
        EMPTY string is also left as it is and reported", so
        patterns-rewritten undercounts the un-namespaced population on
        exactly that seed.
      - |-
        Criterion 16.6 as fixed: "the work history records its printed
        rule counts EQUAL to the before pair the ref-pinned transport
        returned", with no mapping named.
    concrete-edit: |-
      In criterion 16.6's pre-write clause, after "EQUAL to the before
      pair the ref-pinned transport returned", add: "the mapping named
      rather than left to choice: the dry run's printed already-namespaced
      equals the transport's namespaced count, and its printed
      rules-before minus already-namespaced equals the un-namespaced
      count; patterns-rewritten is NOT the comparison, because a stored
      empty pattern is un-namespaced, left untouched and reported, so that
      number legitimately undercounts." Mirror the one sentence in the run
      step's FIRST clause.
