#
# ============================================================
# DOCUMENT TYPE AND VALIDATION
# ============================================================
# This is a `verdict` instance and it validates as one. Round 0's hazard lane
# used `finding` and recorded a reason: the verdict schema makes `criteria`
# required and filling it from the hazard lane would duplicate the walk this
# contract exists not to duplicate. I took the other choice, because the
# schema's own Branch B exists for exactly this contract and because the walk
# is recorded LAST here, after the hazard probes, rather than used as the
# frame.
#   tiphys validate --type verdict --context <ctx>  -> schema VALID, and the
#     three Kind B completeness checks pass: verdict-criteria-complete over
#     the plan's fifteen criteria, verdict-deviations-judged over the work
#     history's four declared deviations, and verdict-hazard-classes-addressed
#     over the phase's nine hazard classes.
#   The one check that does not pass is dual-review-decorrelation, and it is
#     not mine to satisfy: it reports that only one verdict document exists
#     under delivery/review for this phase and that a delegated grant needs
#     two independent clean-room reviews of the exact head. The criteria lane
#     of this round has not landed here. Recorded rather than worked around.
#   tiphys validate --type finding                  -> INVALID, as expected,
#     on kind, on the four fields the verdict type adds, and on concrete-fix
#     against the finding type's concrete-edit.
#
# ============================================================
# THE CENTRAL CLAIM, REPRODUCED INDEPENDENTLY
# ============================================================
# I did not read the round's numbers and agree with them; I rebuilt the
# measurement. The phase base 5ab1680 was extracted into a scratch tree and
# served on one port, this head on another, both under the frozen clock, both
# against the same local database, each seeded through the app's own sign-up
# and import flows with the SAME committed dense fixture (25 rows added on
# both). One browser, 1280 by 720, computed styles and bounding boxes for
# every element carrying a data-testid plus a fixed list of class selectors.
#
#   quantity            base 5ab1680     head fca1a61     round's claim
#   month title             32px             32px             32 -> 32   MATCHES
#   card heading            18px             18px             18 -> 18   MATCHES
#   card total              24px             24px             24 -> 24   MATCHES
#   reconciliation parts    14px             14px             14 -> 14   MATCHES
#   pot figure              32px             32px             32 -> 32   MATCHES
#   spend row height         45px             50px             45 -> 50   MATCHES
#   spend card height      1136px           1264px          1136 -> 1264 MATCHES
#   document height        1490px           1635px          1490 -> 1635 MATCHES
#   spend row name track    566px            669px            366 -> 669 DOES NOT
#
# EIGHT OF NINE REPRODUCE TO THE PIXEL. The type scale is genuinely and
# fully restored on the month view at desk width: I diffed the computed
# font-size of every element carrying a testid between the two servers and
# there is NOT ONE font-size difference anywhere inside main. That is a
# stronger result than the round claims for itself and I record it as such.
# The ninth is finding HZ2-05: the base's name TRACK is 566px, which is what
# this head's own stylesheet comment says at src/app/globals.css:1141; 366px
# is the base's label BOX inside that track, and the work history reports it
# under the name of the track, twice, inside a captured-output block.
#
# ============================================================
# THE THIRD AXIS. What changed on the desk screen that neither the
# old criteria nor the new bar measures.
# ============================================================
# The dispatch asked for it and the answer is LEADING, and after it, THE
# SHELL. Both are findings below; the summary is here because the shape
# matters more than either instance.
#
# Criterion 7.9 measures three x-coordinates, three widths and one ordering.
# The new desk bar measures five font sizes and one card height. Between
# those two sets sits everything else a rendered screen is made of. I took
# the full computed-style diff between the two servers at 1280 rather than
# guessing which property to look at, and counted what actually moved:
#
#   RECT y 163 | RECT h 129 | LINE-HEIGHT 116 | RECT w 89 | RECT x 71
#   rowGap 36 | columnGap 32 | minHeight 31 | display 31
#   gridTemplateColumns 30 | padding* 70 | whiteSpace 25 | fontFamily 25
#   flexWrap 11 | textAlign 9 | justifyContent 9 | FONT-SIZE 8
#   alignItems 8 | fontWeight 2 | COLOR 2
#
# Font size, the quantity the new bar was built around, is the FOURTEENTH
# most-changed property on the desk screen and accounts for 8 of the roughly
# 800 differences. Line-height accounts for 116, and 111 of those are
# REDUCTIONS of about 23 percent. The density the round reports as restored
# was bought with leading, not given back: base .month-row inherits 24px of
# line-height, and this head sets --leading-tight (1.15) on it inside the
# media condition, so 14px row text is led at 16.1px on the desk screen and
# at 21px on the phone. That is finding HZ2-02.
#
# And the bar's five probes are all month-view selectors, so the SHELL is
# outside it at every width. The shell is where a desk regression survived
# this round: the household identity is 16px ink at the base and 12px muted
# ink at this head, at 1280 as well as at 390. That is finding HZ2-01, and
# it is hazard H7.5 still live in the round whose subject was H7.5.
#
# ============================================================
# THE SOFT ASSERTIONS. Can the new desk bar fail the build?
# ============================================================
# YES, and it is not theatre. I did not reason about it, I ran it. A
# temporary spec carrying one deliberately failing expect.soft was placed in
# test/e2e/, run against a live server, then deleted:
#
#   $ PLAYWRIGHT_BASE_URL=http://127.0.0.1:3210 \
#       npx playwright test --project=chromium -g "soft probe"
#   > 3 |   expect.soft(1, "this soft assertion is meant to fail").toBe(2);
#     1 failed
#   REAL_EXIT=1
#
# A Playwright soft assertion records the failure, lets the test continue so
# every offender is reported in one run, and marks the test failed at the
# end. The run is red and the process exits 1. The round's key decision to
# make the measurement assertions soft is sound and buys exactly what it
# says it buys.
# THE RESIDUE IS NOT THE SOFTNESS, IT IS A SENTINEL: three of the new
# measurements return -1 when their element is absent, and -1 satisfies a
# <= bound. That is finding HZ2-04, demonstrated on the empty state.
#
# ============================================================
# THE THRESHOLDS, each measured against this head
# ============================================================
#   labelFontMin      >= 14      measured 14      HEADROOM 0
#   spendCardHeight   <= 1420    measured 1264    headroom 12.3 percent
#   documentHeight    <= 3700    measured 3178    headroom 14.1 percent (390)
#   documentHeight    <= 3900    measured 3367    headroom 15.8 percent (360)
#   rowHeightMax      <= 140     measured 112     headroom 25.0 percent
#
# NONE OF THEM IS SO LOOSE THAT IT WOULD HAVE MISSED ROUND 0's REGRESSION.
# I checked that rather than assuming it: round 0's desk spend card was
# 1735px against a 1420 ceiling, and its four reduced type sizes were 24, 15,
# 18 and 13 against floors of 32, 18, 24 and 14. Every one reddens. The base
# phone document was 4236px at 390 and 5135px at 360 against ceilings of
# 3700 and 3900, and the base phone row ran to 147px against a 140 ceiling,
# so the phone ceilings also redden against the screen the phase replaced.
# THE ONE WITH NO HEADROOM IS labelFontMin, and it is worse than a tight
# floor: the same constant is asserted as an EQUALITY at
# test/e2e/month-view.spec.ts:1132, so raising the label to 15px, an
# improvement, turns the suite red. That is finding HZ2-06, with the desk
# row height and the desk document height, neither of which is bounded at
# all.
#
# ============================================================
# WHAT I LOOKED FOR AND DID NOT FIND, recorded so the next
# reviewer does not spend the budget again
# ============================================================
# THE PHONE SIDE WAS NOT TRADED AWAY. This is the classic fix-round loss and
# it did not happen. Measured at this head on the dense month, against the
# criteria lane's round-0 figures: the spend-row name area is 247 to 273px
# raw and 69 to 77 percent at 390, character for character the round-0
# numbers; with the column gap now subtracted (finding CR-M3P7-03) it is 235
# to 261px and 66 to 73 percent, against floors of 180px and 55 percent. At
# 360 it is 205 to 231px and 63 to 71 percent against 160px and 55 percent.
# The phone document is 3178px at 390 and 3367px at 360, both identical to
# round 0. Row heights 91 to 112, identical. Label font 14px, identical.
# Phone type sizes identical. Nothing on the phone moved.
# THE FLOORS WERE NOT RELAXED TO PAY FOR THE GAP SUBTRACTION. NAME_RATIO_MIN
# is 0.55 and NAME_FLOOR is 180 at 390 and 160 at 360 at
# test/e2e/month-view.spec.ts:357 and :358, byte-identical to round 0 and to
# the criterion's own text.
# THE SHELL HEADER'S REBUILD FROM FLEX TO GRID IS CLEAN. The fix round
# changed .app-header from a flex column to a two-track grid to draw the
# sign-out control back onto the identity row, which invalidates the round-0
# lane's header measurement. I re-ran it: at 390, 360 and 320 in each of en,
# nl and fr, the document's scrollWidth equals the viewport in all nine
# cases, every nav target and the sign-out button are 44px tall in all nine,
# and the only overflowing element in the header is the household identity,
# which is the deliberate M3-P1 ellipsis. Under a 1.5 and a 2.0 text scale at
# 390 and at 360 the header still fits the document, again with the identity
# as the only internal overflow. No finding.
# THE dvh FALLBACK ORDERING WORKS. Verified by construction rather than by
# reading: in the rendering browser, min-height:100vh followed by
# min-height:1px computes to 1px, followed by an unparseable unit computes to
# the vh value, and followed by 100dvh computes to the dvh value, with
# CSS.supports("min-height","100dvh") true. So a browser without dvh drops
# the second declaration at parse time and keeps 100vh, and a browser with it
# takes 100dvh. The two declarations are in that order at
# src/app/globals.css:19 and :20 and again at :99 and :100, and no other vh
# usage survives in the tree. The harness still cannot show the harm, for the
# reason the round states.
# THE STRUCTURAL KEY OF THE HIDDEN CHECK IS NOT A ROUTE BACK TO VACUITY. It
# encodes DOM position, which is what the dispatch flagged, but the two
# collections it compares are taken from the SAME server-rendered document at
# two widths, and the view is a server component with no width-dependent
# branch, so the paths align by construction. A future change that DID make
# the DOM differ by width produces an array mismatch and a loud red, not a
# silent pass, which is the opposite of vacuous. The round's own red witness
# names twenty-five rows carrying no testid, which is the population the old
# comparison could not reach.
# THE REAL TRADING NAME IS GONE. I extracted the removed string from commit
# 33a9cd6 without printing it and grepped the whole tree for it and for its
# first word alone: zero files at this head, zero occurrences in the work
# history, zero in delivery/review/. Findings HZ-M3P7-01 and HZ-M3P7-02 are
# both closed, the second by the merge of origin/main rather than by an edit
# this phase was not permitted to make.
# THE MASKING, THE PROJECTION AND THE TENANCY ARE UNTOUCHED. The criterion
# 7.10 pinned diff prints nothing against the base, mask-card-number.ts has
# an empty diff, and maskCardNumbers still has its call sites in the rebuilt
# view. No arithmetic entered the component.
# A LITERAL, A SECOND MEDIA CONDITION, A FIFTH STYLESHEET: none. The tsx
# literal grep exits 1, the css literal grep outside tokens.css returns
# exactly the four permitted lines, the distinct media conditions number
# exactly 1, and git ls-files "*.css" returns exactly the four files.
#
# ============================================================
# VERDICT
# ============================================================
# APPROVE. The round did what it was dispatched to do and it did it
# reproducibly: eight of its nine headline numbers come back to the pixel on
# a measurement I built independently, the month view's desk type scale is
# not merely restored but restored EXACTLY, with zero font-size differences
# anywhere inside main against the phase base; the phone side is untouched to
# the pixel, which is the loss a fix round usually takes; both round-0 high
# findings are closed, one of them by merging the upstream correction rather
# than by improvising an edit outside files-to-touch; the reserve arm's red
# witness reproduces here from the two existing committed fixtures with zero
# new ones; and the soft assertions the whole new bar rests on do fail the
# build, demonstrated rather than argued.
# Three medium findings and three low ones stand, none high, so this is
# APPROVE by choice and not by the schema's escalation rule. All six are the
# same shape and it is the shape this round was convened about: a quantity
# that moved with nothing able to see it. The round closed that hole for font
# size and closed it well; leading, colour and the shell are still outside
# it, and the accessibility axis the round volunteered was applied to two of
# the phase's seven phone measurements and not to the one the phase exists
# for. Each fix is a few lines and none of them is a redesign.
