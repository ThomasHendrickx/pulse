#
# ============================================================
# GATES RE-RUN HERE AT fca1a61 (Node v26.7.0 via nvm)
# ============================================================
#   npm run typecheck    -> no output, EXIT 0
#   npm run lint         -> no output, EXIT 0
#   npm test             -> 28 files, 377 passed (377), 4.93s, EXIT 0
#   npm run gate:privacy -> "gate:privacy clean", EXIT 0
#   npm run gate:tokens  -> no output, EXIT 0
#   npm run test:e2e     -> recorded at the foot of this document
# The ambient foreign SUPABASE_* and DATABASE_URL variables (fleet warning 1
# and 6) had to be pinned before any server would sign a user up: with them
# unpinned the sign-up action redirects to signup-failed and no request ever
