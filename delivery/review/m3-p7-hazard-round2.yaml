deviations-judged:
  - deviation: >-
      Step 1's report-code-disagreement entry on the mockup resolves the icon
      question "in favour of hand-written inline SVG with stroke=currentColor
      and no new runtime dependency".
    serves-plan-intent: true
    reasoning: >-
      The entry settles how an icon would be written if one were introduced,
      not that one must be. I reproduced the reason: grep -rln "<svg" src/
      exits 1 at this head as it does at the phase base, so the product still
      carries no SVG element, and an SVGElement is not an HTMLElement and
      reports its scroll geometry differently from every element the
      criterion 7.7 sweep measures. Introducing the first one inside main in a
      phase whose subject is a clipping and overflow bar would have added an
      element class the bar has never been run against, for no criterion. The
      glyphs sit inside 44 by 44 targets and I measured them there. The
      deviation is smaller than the plan's own risk appetite, not larger.
  - deviation: >-
      Step 1's ordering, and the standing rule that the spec is written
      before the implementation and watched failing.
    serves-plan-intent: true
    reasoning: >-
      It is a real departure and the round says so in its own words rather
      than glossing it: the rebuild landed in 53c7dd0 and the specs in
      4a81b43, so the red witness was taken afterwards by writing the base's
      layout files back into the working tree. What matters for the plan's
      intent is whether the red is real, and it is: I reproduced the same
      class of witness at this head without editing a single file, by running
      the head's spec against the phase base served on its own port, and got
      exit 1 with the track count, name width and two-line arrays all
      populated and the same 116px name area the round reports. The fix round
      then wrote its new bars FIRST and captured them red before changing the
      code, which is the ordering the rule asks for, so the round moved
      toward the rule rather than away from it. Recorded rather than glossed
      is the whole of what this rule can buy after the fact.
  - deviation: >-
      Criterion 7.14 (b) and (c) name spend-group, income-group AND
      reserve-group rows, added in the second M0-P3 fix round as finding
      MPR-018.
    serves-plan-intent: true
    reasoning: >-
      WITHDRAWN IN THIS ROUND, and correctly. Round 0 declared the reserve arm
      unwitnessable and gave a reason that did not follow; the criteria lane
      disproved it by execution and the round has now retracted it in place at
      delivery/work-history/m3-p7.yaml:393 through :415 rather than deleting
      it, which is the right handling of a false statement in a committed
      document. The arm is genuinely witnessed: the upload helper's ring
      became a parameter at test/e2e/month-view.spec.ts:53 through :71 and the
      new test at :1143 declares the second existing committed fixture under
      RESERVE. I verified the fixtures diff against the base still prints one
      file, so criterion 7.13 is untouched, and I reproduced the red witness
      myself with the reserve row named in its own right. There is no
      surviving deviation here; there is a retraction.
  - deviation: >-
      Step 7, "Raise DR-0023 to the owner with this plan's recommendation
      stated first".
    serves-plan-intent: true
    reasoning: >-
      The implementer does not write into the fleet's decision directory,
      which is outside this worktree, so the recommendation is stated in the
      work history for the orchestrator to route. I checked the half that
      matters to this phase's hazards rather than the routing: nothing is
      built on the answer. The criterion 7.10 pinned diff over both overview
      module layers prints nothing against the base, so the projection and the
      delta keying are untouched, which is hazard H7.4's own address.
hazard-classes-addressed:
  - class-id: H7.1
    probed: >-
      Whether the replacement bar can be green on a screen that is unusable.
      I re-measured the tap targets myself on the shell header at 390, 360 and
      320 in each of en, nl and fr after the fix round rebuilt that header
      from a flex column into a two-track grid, which invalidated the round-0
      lane's measurement of the same region: every nav target and the
      sign-out button is 44px in all nine cases, no document overflows, and
      the only overflowing element is the deliberate identity ellipsis. I then
      re-ran the same sweep under a 1.5 and a 2.0 device text scale at both
      phone widths and found no offender. The row itself I measured on two
      live servers rather than reading: 235 to 261px of name area at 390 and
      205 to 231px at 360, against a base of 116px and 86px.
    cleared-because: >-
      The bar measures the quantities the hazard moves, the screen clears them
      with margin, and the specific region the fix round rebuilt was
      re-measured here rather than inherited from round 0's verdict.
  - class-id: H7.2
    probed: >-
      Whether anything says less on the phone. I diffed the full computed
      style and bounding box of every element carrying a testid between the
      phase base and this head at 1280, and separately confirmed the testid
      census over src/modules/overview/ui/ differs from the base by four
      additions and no removal. The hidden-state half that the criteria lane
      found vacuous is now over main.querySelectorAll("*"); I probed its
      structural key for the vacuity route the dispatch named and it is not
      one, because both collections come from the same server-rendered
      document and a structural divergence produces a loud array mismatch
      rather than a silent pass.
    cleared-because: >-
      Nothing is dropped, the census is a superset of the base's, and the half
      of criterion 7.6 that could not reach an untestidded element now
      reaches every element inside main.
  - class-id: H7.3
    probed: >-
      Re-ran all four pinned checks of criterion 7.4 at this head, including
      the two className-scoped Tailwind greps, plus the distinct-media-
      condition count and the four-stylesheet pin. I also checked the two new
      viewport-unit declarations the fix round added, since a unit in a
      stylesheet is the shape this hazard is about: 100dvh and 100vh are units
      rather than values and neither is tokenisable, which the comment at
      src/app/globals.css:11 through :17 says out loud.
