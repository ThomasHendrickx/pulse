findings:
  - id: HZ2-01
    severity: medium
    evidence:
      - "A desk-screen type and colour reduction from round 0 survives this round untouched and unmeasured, in the one region the new desk bar does not look at. src/app/globals.css:207 through :215 gives .app-household a font-size of --text-sm and a colour of --color-ink-muted, on the base rule, at every width; the phase base declares neither, so the identity inherited 16px and --color-ink."
      - "Measured, not read. Two live servers, the phase base 5ab1680 extracted to a scratch tree on one port and this head on another, same local database, same committed dense fixture seeded through the app's own flows, one browser at 1280 by 720: the element carrying testid household-context computes fontSize 16px and colour oklch(0.23 0.008 265) at the base and fontSize 12px and colour oklch(0.46 0.008 265) at this head. Its line box falls from 24px to 18px with it."
      - "The media condition restores neither. src/app/globals.css:1089 through :1120 restores the header's grid tracks, its column gap and its padding at the breakpoint and touches no type property on any shell element, so 12px muted is the desk value."
      - "The new desk bar cannot see it by construction. test/e2e/month-view.spec.ts:407 through :453 reads five selectors, month-title, .month-card-header h2, .month-card-total, .recon-parts and .month-pot-figure, and every one of them is inside the month view. No assertion in this suite reads a computed font size or a computed colour on any element of the app shell at any width."
      - "This is hazard H7.5's own statement, still true after the round convened to close it: the phone was fixed and one region of the desk screen was made smaller and greyer in the same change, and the criterion addressing H7.5 measures three x-coordinates."
      - "It is also undeclared in both rounds. The work history's key-decisions list records the explicit child placement, the reduced shell padding, the pill's tap target, the soft assertions, the fixture's fixed points and the panel move; neither it nor the fix-round section mentions restyling the household identity."
    concrete-fix: >-
      Either move the two declarations at src/app/globals.css:213 and :214
      inside the media condition's inverse, that is leave the identity at the
      inherited size and colour and give the phone the smaller muted
      treatment, or restore both at src/app/globals.css:1097 alongside the
      grid placement already there. Then widen the desk bar so it cannot
      happen again: add .app-household and .app-nav-link to the selector list
      in typeAndDensity at test/e2e/month-view.spec.ts:407, capture their
      computed fontSize and colour, and assert the size against the base's
      16px in the same shape as DESK_BASE_TYPE. Two selectors and two
      constants.
    analysis: >-
      Filed medium rather than low because of where it sits rather than how
      big it is. The round's whole subject is a hazard class whose criterion
      measured the wrong quantity; it answered by measuring the right
      quantities on the month view and left the shell, which is the other
      half of every screen in the product and is on the same page at the same
      time. A 12px muted household name is a small harm; a desk bar with a
      hole exactly the shape of the region nobody looked at is the same
      defect the round was called to fix, one region to the left. Filed
      against this round and not round 0 because the fix round is where the
      desk screen was audited and this is what the audit missed.
  - id: HZ2-02
    severity: medium
    evidence:
      - "The desk density was not restored, it was re-bought with leading, and the comment saying otherwise is false. src/app/globals.css:1136 reads \"MOBILE FIRST IS NOT DESK LAST. Every value below is the value measured at this phase's base, 5ab1680, on the same dataset at 1280 by 720\"."
      - "Two of the four declarations in the rule at src/app/globals.css:1174 through :1179 are not base values. line-height var(--leading-tight), 1.15, is not a value the base has at all: the base .month-row declares no line-height and inherits 1.5, computing to 24px. padding var(--space-3), 6px, is not the base's var(--space-5), 10px; that half is disclosed by the comment two lines above it, the leading is disclosed nowhere."
      - "Measured across the whole desk screen on the two servers: of roughly 800 computed differences between base and head, 116 are line-height and 111 of those are reductions. The transitions are 24px to 18.4px on 77 elements, 21px to 16.1px on 27, 18px to 13.8px on 2 and 16.5px to 12.65px on 2. Every one is the same 1.5 to 1.15 change inherited down from the row."
      - "It reaches wrapped body text, not just single lines. At 1280 the income and reserve rows sit in a 372px rail and their labels wrap: the first group-label element measures 48px tall at this head, three lines led at 16.1px on 14px type."
      - "--leading-tight was a heading token until this round. Its other three uses in the tree are the auth heading (src/app/globals.css:44), the month title (src/app/globals.css:668) and the pot figure (src/app/globals.css:767). src/app/globals.css:1178 is the first time it is applied to a block of body text and everything inside it."
      - "Nothing measures leading. The new desk bar reads five font sizes and one card height; there is no line-height assertion at any width in this suite, and criterion 7.14's two-line check compares bounding tops, which a tighter leading satisfies more easily rather than less."
      - "Under clause R-087 the sentence at src/app/globals.css:1136 is a present-tense claim that nothing checks and that the measurement contradicts."
    concrete-fix: >-
      Correct the sentence at src/app/globals.css:1136 to say what is true:
      the type sizes below are the base's, and the row's padding and leading
      are deliberately tighter than the base's because the row now carries
      two lines. Say the 1.5-to-1.15 change out loud in the same comment, so
      the next reader knows the desk density was bought and not returned.
      Then bind it: capture getComputedStyle(row).lineHeight in
      typeAndDensity at test/e2e/month-view.spec.ts:407 and assert a floor on
      it at both widths, in the same shape the font sizes already use. If the
      1.15 is judged too tight for a wrapping counterparty name at desk
      width, --leading-normal on .month-group-label inside the media
      condition costs about 12px of card height and nothing else.
    analysis: >-
      This is the answer to the dispatch's own question about a third axis,
      and I file it as a finding rather than an observation because of the
      comment. The round found a hazard whose criterion measured a disjoint
      quantity, replaced it with a bar over font size and height, and then
      moved a third quantity, leading, to make the height come out right,
      under a sentence asserting that every value in the block was the base's.
      That is the mechanism the round itself names in its work history,
      running one level down. The harm on the screen is small and arguable;
      the false sentence is not arguable, and it is the sentence a future
      reader will trust instead of measuring.
  - id: HZ2-03
    severity: medium
    evidence:
      - "The text-scale axis the round added to close finding HZ-M3P7-04 is applied to two of the phase's phone measurements and not to the one the phase exists for. test/e2e/month-view.spec.ts:786 through :801 loops the two scales and checks exactly two things: the document's scrollWidth against its clientWidth, and the horizontal half of the clipping sweep."
      - "Criterion 7.8, the reconciliation answer above the fold, is not among them, and it does not survive the scale the round itself chose as its bar. Probe, at 390 by 844 on a household seeded through the app's own flows with the two committed gapped fixtures so the books do not close, applying the round's own one-shot scaling to every element: at scale 1 the element with testid recon-verdict has bottom 371 and recon-difference bottom 477; at 1.5 they are 470 and 651; at 2.0 they are 687 and 947."
      - "The criterion's own bound is 700, being 844 less an allowance for the browser chrome Playwright does not render. At 2.0 the verdict clears it by 13 CSS pixels and the difference figure, which the criterion names in its own text, is 247 pixels below it."
      - "The gap is not the fold alone. The vertical half of the clipping sweep and the tap-target sweep are also outside the scaled block, although round 0's concrete edit for this finding asked for the tap-target sweep by name. I checked the tap targets myself under both scales and found no offender, so that half is a hole rather than a defect."
      - "The round did exceed its brief on the factor and I say so: 2.0 genuinely passes on the axes it does check. Measured at this head, scales 1.3, 1.5 and 2.0 at 390 and at 360 each give a document scrollWidth equal to the viewport and an empty offender list; the same probe against the phase base gives 399, 449 and 574 at 390 with five to eight offenders. The corrected helper is right about its mechanism too: it snapshots every element's own computed size before writing any, which is one multiplication per element rather than the compounding the round discloses."
    concrete-fix: >-
      Move the recon-verdict and recon-difference fold assertion into the
      scaled block at test/e2e/month-view.spec.ts:786, on the non-reconciling
      dataset, so the reconciliation answer is required to be above the fold
      at the text sizes a real device offers and not only at the default. Run
      the vertical clipping half and the tap-target sweep inside the same
      loop while it is open. If 2.0 cannot clear 700 with the verdict AND the
      difference, that is a layout answer rather than a test answer: the
      reconciliation strip's own row-gaps are the first place to look, and a
      recorded decision that the difference figure may fall below the fold at
      200 percent type is an acceptable outcome, but it should be a decision
      rather than an absence.
    analysis: >-
      Filed medium because of what the phase is. This is the phase that
      exists because a bar measured a quantity disjoint from the harm, and
      its own replacement stance, written into the skill in this same change,
      says phone-width evidence measures content that survived the narrowing.
      A device text-size preference is the narrowing, the round agreed it is,
      built the axis, and then pointed it at horizontal overflow, which is
      the exact quantity the phase was convened to stop treating as the
      measurement. The verdict clearing the fold by 13 pixels at 2.0 is the
      thinnest margin anywhere in this phase and nothing watches it.
  - id: HZ2-04
    severity: low
    evidence:
      - "Three of the new measurements return a -1 sentinel when their element is absent, and -1 satisfies a less-than-or-equal bound. test/e2e/month-view.spec.ts:428, :436 and :442 return -1 for labelFontMin, rowHeightMax and spendCardHeight when the collection is empty or the selector matches nothing."
      - "Demonstrated on a real page rather than argued. A probe signed up through the app's own flow and read the empty state at 390 by 844 with the shipped expressions: labelFontMin -1, rowHeightMax -1, spendCardHeight -1, and the two selector reads used by the desk bar also -1."
      - "The floors are safe: -1 fails >= 14 and >= 32 loudly. The CEILINGS are not: -1 <= 140 and -1 <= 1420 both pass. The ceilings are the half that guards against round 0's regression shape, which was everything growing."
      - "One of the two is guarded in situ and one is not. rowHeightMax is preceded by a hard assertion that 23 spend groups render (test/e2e/month-view.spec.ts:756), so an empty collection reddens first. spendCardHeight is read at test/e2e/month-view.spec.ts:1120 from a testid the desk test never asserts is present; the only hard count in that test is over spend-group at :1101, which stays green if the spend-card testid moves or is renamed."
    concrete-fix: >-
      Make the sentinel unreachable rather than harmless: throw inside
      typeAndDensity when a queried element is null, so an absent element is
      an error rather than a number, or return null and assert not-null
      before comparing. If the sentinel is kept, add
      expect(page.getByTestId("spend-card")).toBeVisible() before line 1120
      of test/e2e/month-view.spec.ts, which is one line and closes the only
      unguarded instance.
    analysis: >-
      Low because both routes need a second change to open, and the phase
      pins the three card testids in criterion 7.9 at both widths in another
      test. Raised because the failure shape is this project's own recurring
      one: a check that reports green when the thing it measures is not
      there. The measurement most exposed is the desk card height, which is
      the single number that would have caught round 0's regression.
  - id: HZ2-05
    severity: low
    evidence:
      - "A number inside a captured-output block is not the number the command printed, and the same round's stylesheet says so. delivery/work-history/m3-p7.yaml:964 and :975 both read \"nameTrack 366 -> 669\", inside the output of the executed-construction settling claim C-M3P7-12, once in the before table and once in the after."
      - "Measured on the same two servers, same dataset, same width: the base's spend row is grid-template-columns 566px 80px 80px and its name track is 566px; this head's is 668.938px 77.0625px. The base's first group-label ELEMENT is 366px wide, because at the base the label sits inside a wrapping flex and shrinks to its content, so 366 is a real number about a different box."
      - "This head's own stylesheet gives the other figure. src/app/globals.css:1141 reads \"the name, which grew from 566px to 669px\". The two artifacts of one commit range disagree by 200px about one named quantity, and delivery/work-history/m3-p7.yaml:226 repeats the 366 in prose."
      - "Round 0's hazard verdict, which the fix round is answering, also recorded 566 to 669."
      - "The block it sits in is an executed-construction output, which is the one place this process forbids a hand-written string, because after the fact a transcribed figure and a pasted one are indistinguishable. A digit that differs from the command's own output is the evidence that the block was retyped."
    concrete-fix: >-
      Correct both table lines at delivery/work-history/m3-p7.yaml:964 and
      :975 and the prose at :981 and :226 to 566 -> 669, matching
      src/app/globals.css:1141, or relabel the row as the label BOX and give
      this head's label box beside it. Either is right; the two documents
      saying different numbers under one name is not.
    analysis: >-
      Small in consequence and filed under clause R-087 because of the block
      it is in. Every other figure in that claim reproduces here to the pixel,
      which is what makes this one worth naming rather than shrugging at: the
      claim is overwhelmingly true, and the one wrong digit is in the field
      that is supposed to be beyond the author's typing. A reader who checks
      one number and finds it wrong has to re-check all nine, which is the
      cost the paste rule exists to avoid.
  - id: HZ2-06
    severity: low
    evidence:
      - "One of the five new thresholds is a floor that is also a ceiling, and two quantities the round measured at desk width are bounded in neither direction. PHONE_LABEL_MIN_FONT is 14 at test/e2e/month-view.spec.ts:395 and the label renders at exactly 14px at both phone widths, so the floor has zero headroom, which is correct for a floor."
      - "The same constant is then asserted as an EQUALITY at test/e2e/month-view.spec.ts:1132, expect(phone.labelFontMin).toBe(PHONE_LABEL_MIN_FONT). Raising the group label to --text-lg, an improvement, turns the suite red for the wrong reason. expect(phone.potFigure).toBe(40) at :1130 has the same shape."
      - "The desk row height is unbounded. The round reports it moving from 45px to 50px and measures the card that contains it, but no assertion reads a row height at 1280; I measured 50px minimum and 81px maximum at this head against 45 and 105 at the base."
      - "The desk document height is unbounded. Round 0's regression took it from 1490px to 2089px and the round quotes that as part of the harm, but the new desk bar asserts only the spend card. A future change that grows the header, the reconciliation panel and the two rail cards while leaving the spend card alone is invisible to it; I measured 1635px at this head against 1490px at the base."
      - "Every ceiling that IS set would have caught round 0. Checked rather than assumed: the desk spend card was 1735px against 1420, the four type sizes 24, 15, 18 and 13 against floors of 32, 18, 24 and 14, and the base phone document 4236px at 390 and 5135px at 360 against 3700 and 3900."
    concrete-fix: >-
      Change the two equalities at test/e2e/month-view.spec.ts:1130 and :1132
      to toBeGreaterThanOrEqual, which is the assertion the comment beside
      them describes. Add two constants beside DESK_BASE_SPEND_CARD_HEIGHT at
      test/e2e/month-view.spec.ts:388, a desk row-height ceiling and a desk
      document-height ceiling, both taken from the base measurement times the
      same 1.25 factor the card already uses, and assert them in the desk
      test. Four lines, and they close the two quantities the round names in
      its own account of the harm and then does not bind.
    analysis: >-
      Low because nothing is wrong on the screen today and the thresholds
      that exist are well chosen: I could not find one that is too loose to
      have caught the regression it was written for, which is a better result
      than this class of after-the-fact bar usually gets. Raised because a
      floor written as an equality punishes the improvement it exists to
      protect, and because the two desk quantities left unbounded are two of
      the four the round's own finding text quotes as the damage.
  - id: HZ2-07
    severity: low
    evidence:
      - "The fix for finding HZ-M3P7-05 bought the tab sequence and spent a property round 0 had recorded as holding. Round 0's finding states, of the header it was reporting on, that document order and visual order do agree at both widths and that this is what the phase's own stance sentence promises. At this head they do not agree at 390."
      - "Measured. A probe signed up through the app's own flow, loaded the overview at 390 by 844, pressed Tab and recorded document.activeElement with its bounding box each time: nav-overview at y 50, nav-import at y 50, nav-merchants at y 50, then the sign-out button at y 6. Focus runs along the second visual row and then jumps back up to the first."
      - "At 1280 by 720 the same probe gives all four stops at y 8, left to right, so the two orders agree there and the finding is at phone width only."
      - "The mechanism is grid placement: src/app/globals.css:118 through :135 puts .app-header-identity and the sign-out form on grid row 1 and .app-nav on grid row 2, while src/app/(app)/layout.tsx:47 through :68 has the document read identity, nav, form."
      - "The phase's own step 5 says the rail is produced by grid placement and never by the order property so that the DOM order assistive technology reads is the order the phone shows, and src/app/globals.css:111 through :119 invokes that same reason for this header. For this header at 390 the DOM order is now NOT the order the phone shows."
      - "Nothing measures it. The new spec at test/e2e/navigation.spec.ts:212 through :251 asserts the tab sequence and reads no position, and criterion 7.9's order grep still exits 1 because grid placement is not the order property."
    concrete-fix: >-
      Extend the new focus-order test at test/e2e/navigation.spec.ts:220 to
      record each stop's bounding top alongside its identity and assert the
      tops are non-decreasing at both widths, which is the property the
      comments claim and the assertion that would have caught this. Then
      pick one of two answers and record it: either draw the sign-out control
      on the navigation row at phone width so the two orders agree again, or
      write one sentence into the header comment saying that the destructive
      control is deliberately read last and drawn first and that the two
      orders differ at phone width by design, so the next reader does not
      have to re-derive which promise was kept.
    analysis: >-
      Low, and I nearly cleared it. The trade is defensible on its merits: a
      keyboard user meeting Sign out as the first stop on every route is a
      worse problem than a focus ring that moves up one row, and the project
      has already blessed placement diverging from document order for the
      three month cards in criterion 7.9. It is filed because it is the exact
      thing a fix round loses, because the round-0 verdict recorded the
      property as holding and this round silently ended it, and because both
      new comments assert the promise in the register of a general rule while
      the header at 390 is now the counterexample.
