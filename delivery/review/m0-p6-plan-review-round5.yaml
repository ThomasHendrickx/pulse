findings:
  - id: R5-001
    severity: high
    evidence:
      - >-
        The counted read is specified twice and the two do not agree. The
        ACCEPT step: "THE COUNTED READ is rows WITH a flow, counted per
        account over the same period, and it carries NO null-flow condition at
        all". No ring restriction. Criterion 14.15 witness ONE: "fed by the
        TWO reads the ACCEPT step names, the counted read FOR POT ACCOUNTS and
        the held read for the rest". A ring restriction.
      - >-
        Under the step's reading an account can appear in two entries, and the
        state that produces it is one this plan names itself. M3-P15 step 4
        scopes its reads as "defence in depth against A CLEARING THAT MISSES A
        ROW", which is a row on an account that has left the pot and still
        carries the flow it was last stamped with. Such a row is caught by an
        unrestricted counted read, while the same account's cleared rows are
        caught by the held read, so the account renders once as counted and
        once as held.
      - >-
        Criterion 14.15 witness ONE claims that is caught: "so an account
        appearing in two entries is a defect case FIVE of criterion 14.14
        catches". It is not. Case FIVE's two assertions are an enumeration of
        reads carrying the SQL string flow" IS NULL, and a row-class test over
        "one null-flow row on a POT account and one on a RESERVE account". The
        counted read carries no null-flow condition, so it is absent from the
        enumeration by the case's own words, and it returns no null-flow rows,
        so it is absent from the row-class test too. Nothing in case FIVE
        touches the counted read at all.
      - >-
        Nor is it caught downstream. M3-P15 step 4's scoping list is "the
        counted reads, the month aggregate, the reserves read and the merchant
        review's read", which names the pre-existing counted groups and not
        this new read, and criterion 15.3's enumeration of what a cleared row
        must not reach names "not income, spend, reserves or changeInPot, not
        the merchant review's counted read, not the reserves block, and NOT
        listGapRows" and does not name month-accounts.
      - >-
        The consequence lands on the element the plan calls its only
        detection. A stale-flow row on an account the household has just moved
        out of the pot would be reported to them as COUNTED, on the one screen
        state built to tell counted from held, which is hazard H15.2's shape
        arriving through the surface built to prevent H14.18.
    concrete-edit: >-
      Replace the counted read's sentence in the ACCEPT step with: "THE
      COUNTED READ is rows WITH a flow ON POT ACCOUNTS, counted per account
      over the same period. It carries NO null-flow condition, which is why it
      sits outside the partition criterion 14.14 case FIVE governs; it carries
      the SAME ring predicate as the uninterpreted count and the gap listing,
      which is why an account can never hold both a counted entry and a held
      entry. The ring restriction is not redundant with the flow condition: a
      row on a non-pot account that still carries a flow is exactly the
      clearing-that-missed-a-row state M3-P15 step 4 scopes against, and
      without the restriction this read would report it to the household as
      counted." Then correct criterion 14.15 witness ONE's safety claim to:
      "so an account can appear in at most one entry BY CONSTRUCTION, the two
      reads carrying complementary ring predicates, and a test asserts it: an
      application test over a household holding, on ONE non-pot account, both
      a cleared row and a row that still carries a flow, asserts that account
      renders exactly ONE month-accounts entry, that its state is held, and
      that the stale-flow row is counted by neither read. Case FIVE of
      criterion 14.14 does not reach this, because the counted read carries no
      null-flow condition and returns no null-flow rows, so this assertion is
      the only one that sees it." And add hazard class H14.21: "The counted
      read is written without a ring restriction, so an account whose rows
      were not fully cleared when it left the pot renders both a counted entry
      and a held entry, and a stale flow is reported to the household as
      counted money on the one screen state built to tell counted from held",
      addressed-by criterion 14.15.
    analysis: >-
      The repair for round four's R4-002 is right in shape: the counted side
      needed its own read, and a read with no null-flow condition genuinely
      does sit outside the partition argument, which is the question the
      dispatch asked and the answer is yes. What the repair did not settle is
      the OTHER predicate. Being outside the null-flow partition does not put
      a read outside the question of which account owns which rows, and the
      step and the criterion answer that question differently one screen
      apart. The criterion's version is the correct one and an implementer
      reading both would probably pick it, which is why this is high rather
      than critical; but the criterion also carries a false statement about
      which case protects it, and a false statement about a guard is worse
      than no guard, because the next person to touch this reads it and stops
      looking.
  - id: R5-002
    severity: medium
    evidence:
      - >-
        A pot-side row referencing a reserve account takes one of THREE paths
        across the declaration that creates that account, and criterion 14.16
        asserts two of them.
      - >-
        Path one, a negative row: SPEND at
        src/modules/ledger/domain/classify-flow.ts:102 before, RESERVE at :62
        after. Arm two, asserted.
      - >-
        Path two, a positive row with no outgoing history to that counterparty:
        INCOME at classify-flow.ts:121 before, RESERVE at :66 after. Arm
        three, asserted.
      - >-
        Path three, a positive row WITH outgoing history to that counterparty:
        the refund correction fires, because the key is the account number when
        the row carries one
        (src/modules/ledger/domain/corrections.ts:197 through :200) and the
        history is read across every pot account
        (src/modules/ledger/application/interpret-window.ts:80 through :82), so
        the row is SPEND with a positive amount before
        (corrections.ts:165 through :174) and RESERVE after. Asserted by no
        arm.
      - >-
        Both existing arms exclude it deliberately and by different means, so
        neither can drift into covering it: arm two's fixture "CARRIES OUTGOING
        TRANSFERS TO THAT ACCOUNT ONLY" and arm three's household "has no prior
        outgoing transfer to it". The second arm's own text describes path
        three, in the clause beginning "before it is SPEND or INCOME depending
        on whether the outgoing history carries that counterparty", and then
        excludes it.
      - >-
        Path three is the ordinary shape of a household savings account, one
        that is paid into and drawn from in the same period. Its figures are
        spend falling and net to reserves rising by the NET of the two
        movements rather than by the outgoing alone, which is the same
        assertion shape as arm two at a different magnitude, so an
        implementation cannot fail it in a new way, but nothing measures that
        it does not.
    concrete-edit: >-
      Add to criterion 14.16, after the third arm: "FOURTH ARM, THE ORDINARY
      SAVINGS ACCOUNT, which is the one the first three exclude between them.
      Over a fixture carrying BOTH outgoing transfers to that account and a
      drawdown from it in the same period, so the refund correction fires on
      the drawdown and it is SPEND with a positive amount before the
      declaration (src/modules/ledger/domain/corrections.ts:165 through :174
      and :197 through :200), the test asserts that after the reserve import
      spendCents FALLS and netToReservesCents RISES by the same hand-written
      string, that string being the NET of the outgoing transfers and the
      drawdown rather than the outgoing alone, while incomeCents,
      changeInPotCents, differenceCents and rowCount are byte identical,
      reconciles is still true and uninterpretedCount is unchanged. This arm
      is why the second arm's fixture pin is a pin and not a restriction of
      scope: the three classification paths a declaration can move a row along
      are each asserted once, and the arm that would otherwise be missing is
      the one every real savings account produces."
    analysis: >-
      The third arm the last round added is a real addition and its arithmetic
      is exact, which I verified rather than assumed. What the pinning
      exercise did was make each arm's fixture narrow enough to be certain,
      and the narrowing left a hole between them that is wider than either arm.
      The risk is not that the engine gets path three wrong today, it is that
      the criterion set reads as exhaustive over a declaration's effects when
      it covers two thirds of them, and the missing third is the case the
      owner's own four savings accounts will produce in the first month that
      has a withdrawal in it.
  - id: R5-003
    severity: medium
    evidence:
      - >-
        Criterion 14.14 case FIVE now enumerates against a stated pattern,
        which is right and closes the round-four defect: "a grep for the SQL
        string flow\" IS NULL under src/ records every occurrence, and the test
        asserts each occurrence sits in one of exactly THREE reads".
      - >-
        The pattern is SQL-only, and this codebase does not write all its
        transaction queries in SQL. Six reads go through the Prisma client:
        src/modules/overview/adapters/overview-repository.ts:327,
        src/modules/ledger/adapters/ledger-repository.ts:36, :81 and :144,
        src/modules/import/adapters/import-repository.ts:216, and
        src/modules/merchants/adapters/merchant-repository.ts:229, which is one
        of the reads this same criterion discusses. In that style the condition
        is written "where: { flow: null }" and matches nothing the grep looks
        for.
      - >-
        The pattern is also case-sensitive, and Postgres accepts lowercase "is
        null". Every occurrence in the tree today is upper case, so the base
        measurement is right, but nothing holds the next one to that.
      - >-
        The consequence is confined to the enumeration and not to this phase's
        behaviour, because case FIVE's second assertion tests row classes and
        would catch a wrongly scoped held read however it is written. What the
        enumeration guards is a FOURTH read appearing later, which is the
        failure this criterion exists against, and that guard has a blind spot
        exactly where the codebase already writes queries.
    concrete-edit: >-
      Replace case FIVE's pattern sentence with: "a grep records every
      occurrence under src/ of a test for an absent flow in a database query,
      in BOTH styles this codebase writes: the SQL string flow\" IS NULL,
      matched case-insensitively because Postgres accepts lower case, and the
      Prisma client form in which the same condition is written as a null flow
      in a where clause, which six transaction reads in this tree already use
      (src/modules/merchants/adapters/merchant-repository.ts:229 among them).
      The test asserts each occurrence sits in one of exactly THREE reads, the
      uninterpreted count, the gap listing and the held read, and it fails on a
      fourth wherever and however it is written, because a guard that sees only
      raw SQL would be blind to the style half this repository's transaction
      reads are written in." Keep the rest of the case unchanged, including the
      sentence naming the two TypeScript sites, which the widened pattern still
      correctly excludes since neither is a database query.
    analysis: >-
      This is the smallest kind of finding that is still worth making: the
      criterion does the right thing and does it over half the surface. It
      matters because the enumeration is the only forward-looking guard in
      either phase, the one instrument aimed at a defect that has not happened
      yet, and its whole value is that a later phase adding a read cannot do so
      quietly. Written against one query style in a repository that uses two,
      it can be walked past without anyone meaning to.
