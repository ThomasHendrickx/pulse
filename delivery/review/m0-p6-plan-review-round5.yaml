# ==========================================================================
# THE REJECTION OF MY OWN WORDING, CHECKED FIRST BECAUSE IT IS THE THING A
# REVIEWER IS LEAST LIKELY TO CHECK HONESTLY.
#
# The fix round rejected my proposed title for criterion 14.14, "EVERY READ
# THAT CAN SEE A ROW WITH NO FLOW IS SCOPED BY THE RING, AND THE THREE
# AGREE", on the ground that the three reads do NOT agree: two carry one ring
# predicate and the third carries its inverse, so a title saying they agree
# would reintroduce my own error one level up.
#
# THE REJECTION IS CORRECT AND I SAY SO WITHOUT QUALIFICATION. My round-four
# finding was that the RINGS partition and the READS do not. "The three
# agree" says of the reads exactly the thing that finding disproved: it reads
# as three reads behaving the same way, which is the same mistake as
# expecting each row in exactly one read, moved from the body of the case
# into its title where it would be read first and by everyone. Two of the
# three MUST agree with each other, which is case FOUR, and the third must
# disagree with both, which is what makes a held row a held row. A title
# asserting agreement across all three would have licensed an implementer to
# scope the held read the same way as the other two and to find the whole
# criterion green except for one case. The title the fix round wrote instead,
# "EVERY READ THAT CAN SEE A ROW WITH NO FLOW IS SCOPED BY THE RING, SO A
# HELD ROW IS NEVER REPORTED AS A GAP AND A GAP IS NEVER REPORTED AS HELD",
# states the property without asserting the false symmetry, and it is better
# than what I proposed. Case FIVE as rewritten is correct: it partitions the
# rows by ring across two classes, restates case THREE rather than
# contradicting it, names its grep pattern, and explicitly stops claiming a
# count of occurrences.
#
# I also confirm the two dropped and added clauses. Dropping my "each
# occurrence sits in one of exactly three reads" duplicate was right, the
# surviving sentence says it once. Adding the sentence about the counted read
# carrying no null-flow condition and therefore being "correctly absent from
# this enumeration" was right and I had omitted it. The R4-005 addition, the
# third arm, is a genuine addition rather than a restatement, which I verify
# by walking its arithmetic below.
#
# ==========================================================================
# THE THREE ARMS OF 14.16, WALKED BY HAND, ALL THREE, AS THE DISPATCH ASKED.
# Household income +I, outside spend -A, and rows referencing the savings
# account S.
#
#   FIRST ARM, S registered before anything is imported. The declaration set
#   is identical across the act measured, the reserve statement's rows carry
#   no flow, and every projection in monthFigures except uninterpretedCount
#   filters on the flow column (overview-repository.ts:216 through :231),
#   which the ring scoping handles. Nothing moves. CORRECT and not vacuous:
#   it is the arm that reddens if an implementation reaches for a Flow member
#   or lets a held row into a sum.
#
#   SECOND ARM, outgoing transfers -X only, S declared BY the reserve import.
#   Before: transfers miss classify-flow.ts:62 and :73 and take :102 as
#   SPEND. spendSigned = -(A+X), reserveSigned = 0, changeInPot = I-A-X,
#   difference = (I-A-X) - (I - (A+X) - 0) = 0.
#   After: they take classify-flow.ts:62. spendSigned = -A, reserveSigned =
#   -X, changeInPot = I-A-X unchanged, difference = (I-A-X) - (I - A - X) = 0.
#   So spend falls by exactly X, netToReserves rises by exactly X, income and
#   changeInPot and difference and rowCount are byte identical. EXACT.
#
#   THIRD ARM, one POSITIVE row +Y referencing S and no prior outgoing
#   transfer to it. Before: correctRefund does not fire, because
#   outgoingHistoryKeys carries no key for S (corrections.ts:165 through
#   :174, key from the account number at :197 through :200, history over
#   every pot account at interpret-window.ts:80 through :82), so the row is
#   INCOME at classify-flow.ts:121. incomeSigned = I+Y, changeInPot = I+Y-A,
#   difference = (I+Y-A) - ((I+Y) - A - 0) = 0.
#   After: classify-flow.ts:66 and corrections.ts:129 through :137 give
#   RESERVE with a positive amount. incomeSigned = I, reserveSigned = +Y,
#   netToReserves = -Y, changeInPot = I+Y-A unchanged,
#   difference = (I+Y-A) - (I - A + Y) = 0.
#   So income falls by exactly Y, netToReserves falls by exactly Y, spend and
#   changeInPot and difference and rowCount are byte identical. EXACT, and it
#   pins the case rather than restating the second arm: the pair that moves is
#   income and reserves rather than spend and reserves, and both move DOWN.
#
# WHAT THE THREE ARMS LEAVE UNASSERTED, which is finding R5-002. A pot-side
# row referencing S can take THREE paths across a declaration, not two. A
# negative row is SPEND then RESERVE, which is arm two. A positive row with
# no history is INCOME then RESERVE, which is arm three. A positive row WITH
# history is SPEND-positive then RESERVE, because the refund correction fires
# on the account-number key, and NO arm asserts it: arm two's fixture is
# "OUTGOING TRANSFERS TO THAT ACCOUNT ONLY" and arm three's household "has no
# prior outgoing transfer to it". That third path is the ordinary shape of a
# household savings account, one that is paid into and drawn from, and its
# figures are spend falling and reserves rising by (X-Y) rather than by X.
#
# ==========================================================================
# THE GREP, RUN RATHER THAN QUOTED.
#
#   $ grep -rn 'flow" IS NULL' src/
#   overview-repository.ts:230, :280, :295
#
# Three occurrences in two reads, exactly as case FIVE's preamble now says,
# and the case correctly refuses to claim the occurrence count will stay
# three. The two TypeScript sites case FIVE names are genuinely excluded by
# the stated pattern, verified: interpret-window.ts:153 reads "flow ===
# undefined" and reconciliation.ts:62 reads "if (flow === undefined)".
# Neither contains the SQL string, so naming them is accurate and the pattern
# does keep them out rather than merely mentioning them.
#
# WHERE THE PATTERN CAN MISS A FOURTH READ, which is finding R5-003. It is
# case-sensitive and SQL-only. Postgres accepts lowercase "is null", and this
# codebase writes six transaction queries through the PRISMA CLIENT rather
# than raw SQL (overview-repository.ts:327, ledger-repository.ts:36, :81,
# :144, import-repository.ts:216 and merchant-repository.ts:229, the last
# being one of the reads this very criterion discusses), where the same
# condition is written "where: { flow: null }" and matches nothing the grep
# looks for.
#
# THE RENDERED COPY, checked against the mechanism rather than the wording.
# Witness ONE now requires "ITS STATE RENDERED AS WORDS THE READER CAN SEE"
# with a test on "the VISIBLE TEXT of each entry", and witness SIX requires
# it "RENDERED IN THAT ENTRY in the reader's own language, asserted against
# each of the three catalogues by running the test in each locale rather than
# by checking that a key exists". That is reachable and it is real: the
# locale rides a cookie (src/i18n/request.ts:22) so a Playwright test can set
# it per run, and messages are imported per locale with no fallback chain
# (request.ts:26), so a missing Dutch or French string cannot silently render
# English. Witness FOUR's key-completeness test closes the remaining door.
# ONE RESIDUAL I LOOKED AT AND DECIDED NOT TO RAISE: visible text does not
# formally exclude visually hidden text, so an sr-only span would satisfy the
# assertion. I judged that not worth a finding, because unlike a data
# attribute, which is invisible by nature and was the round-four defect,
# sr-only text is invisible only by a deliberate act nobody has a reason to
# take here. It is named in the dispatch warnings instead.
#
# THE FIFTH SWEEP for evidence that cannot exist in the phase's own tree.
# This round added two port methods, one MonthOverview field, rendered copy
# in three locales and a third arm. Each was checked for a baseline or a
# reason it needs none: the two reads, the field and the copy do not exist at
# the phase base, so there is no base state to capture and correctly none is
# asked for; the third arm records MonthFigures within its own test run and
# computes its two hand-written strings from fixture arithmetic; 14.14 case
# TWO still carries both of its captures and step 1 baseline ONE still
# provides them. NO NEW INSTANCE, the second consecutive round with none.
#
# SCOPE DISCIPLINE. No queue, cron, event bus, cache, state library,
# component library, per-transaction override, goal or budget. Two port
# methods and one rendered element. Nothing to report.
#
# HOUSE RULES. `git diff 9353ce5 291b30e -- delivery/plan/pulse-v02.yaml |
# grep '^+' | grep -c '—'` returns 0. The fix-round commit message carries no
# amount, no counterparty, no date from a row and no identifier. English
# throughout. No identifier shape appears in this document.
kind: finding
verdict: FIX-ROUND-NEEDED
