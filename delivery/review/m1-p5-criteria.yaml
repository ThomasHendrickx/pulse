findings:
  - id: CR-501
    severity: low
    evidence:
      - >-
        playwright.config.ts:33 sets reuseExistingServer: true. In this
        fleet's shared container, several worktrees can run npm run dev
        on port 3000; a stale server started WITHOUT
        PULSE_FIXED_NOW=2026-09-15T12:00:00Z (or from another worktree's
        code) would be silently reused by the whole e2e gate, and every
        month assertion would then depend on the wall clock and on
        foreign code. Verified port 3000 was free before my runs, so the
        executions above are unaffected; the hazard is to future runs.
    concrete-fix: >-
      Set reuseExistingServer to false in playwright.config.ts (or gate
      reuse on an explicit opt-in env var), so the release-verification
      gate always boots the server whose env and code it pinned.
    analysis: >-
      Today a stale real-clock server fails loudly (August 2026 is the
      real current month, so the golden journey's closed-August
      assertions redden), but from 2026-10-01 the golden journey would
      pass against a real-clock server while only the partial-month test
      reddens, which is a slower, more confusing failure. Low because
      the gate cannot silently pass end to end either way today, and no
      criterion text is violated.

