deviations-judged:
  - deviation: files-to-touch (M3-P18 declaration)
    serves-plan-intent: true
    reasoning: "The first declared deviation is src/modules/overview/application/index.ts, the overview module's composition root, edited to bind the new listHeldRows port method. I diffed it: three added lines, two type re-exports and one binding at src/modules/overview/application/index.ts:57. The declaration names src/modules/overview/application/ports.ts as the held read's home, and a port method that is declared but not bound does not compile, so the omission is a gap in the declaration rather than a widening of scope. No behaviour beyond the declared held read arrives with it."
  - deviation: files-to-touch (M3-P18 declaration)
    serves-plan-intent: true
    reasoning: "The second covers comment-only edits to src/modules/ledger/domain/ledger-transaction.ts and src/platform/account-number.ts. I diffed both: src/modules/ledger/domain/ledger-transaction.ts:35 through :44 rewrites the sentence saying reserve statements are not imported, which DR-0030 made false and clause R-087 requires correcting in place loudly; src/platform/account-number.ts:51 through :60 grows the mechanism-sibling list with the new consumer and the two new SQL mirrors. Neither changes a line of executable code, and both are obligations the phase's own clauses impose. Serving the intent, and the tree would be worse without them. I note against the second that the list it grows now names two mirrors that measurably do not mirror, which is finding CR2-M3P18-01 rather than a fault of the deviation."
  - deviation: step 1 ordering (capture before any other edit)
    serves-plan-intent: true
    reasoning: "The database-dependent captures could not precede editing because no database existed in the implementer's container at the time; the static captures were taken first as ordered and the database captures were taken later against a locally started Postgres. I judge the deviation itself sound: the ordering exists so a baseline is not measured against already-changed code, and the later captures were taken over the COMMITTED harness and the COMMITTED migration text, which is the property the ordering protects, and I reproduced most of them myself at this head. What the deviation does not excuse is the three baselines never captured in any order, and that is recorded as criterion 18.6 not met rather than as a fault of this deviation."
