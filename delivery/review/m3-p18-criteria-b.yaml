findings:
  - id: CR2-M3P18-01
    severity: high
    evidence:
      - "The migration's canonical expression is at prisma/schema/migrations/20260827120000_canonical_account_iban_backfill/migration.sql:53, upper over regexp_replace with the class [[:space:]], repeated at :55, :62 and :63, and the same expression is the detection script's grouping key at scripts/detect-account-collisions.ts:77. The platform function it claims to mirror is at src/platform/account-number.ts:67 and applies a JavaScript backslash-s replace before upper-casing."
      - "MEASURED, not read. Against PostgreSQL 16.13, database UTF8 with C.UTF-8 collation, regexp_replace over [[:space:]] removes U+0020, U+0009, U+1680, U+2000, U+2009, U+205F and U+3000, and DOES NOT remove U+00A0 (no-break space), U+2007 (figure space), U+202F (narrow no-break space) or U+FEFF. Captured, one row per codepoint with X and Y bracketing the character: U+00A0 gave X Y, U+2007 gave X Y, U+202F gave X Y, U+FEFF gave X then the mark then Y, while the other seven gave XY."
      - "MEASURED on the other side. A node one-liner over the same eleven codepoints, testing whether the JavaScript replace collapses X plus the character plus Y to XY, returned true for ALL ELEVEN, U+00A0, U+2007, U+202F and U+FEFF included. The two expressions therefore disagree on four characters, and U+00A0 is the one a bank export realistically prints between account-number groups."
      - "WHAT THAT COSTS, in the exact mechanism criterion 18.4 exists to close. src/modules/accounts/adapters/account-repository.ts:107 canonicalises the PROBE with the JavaScript function and exact-matches the STORED column. A stored declaration separated with U+00A0 is rewritten by this migration into an upper-cased value that STILL contains U+00A0, so the probe (which strips it) still never matches, the statement is still refused account-not-registered, and the row now LOOKS canonical to anyone inspecting it. Review finding P14-001's live exposure survives for that rendering class, silently, after the least reversible artifact in this project has run."
      - "AND THE DETECTION MISSES IT TOO. scripts/detect-account-collisions.ts:77 groups by the same SQL expression, so a pair consisting of a U+00A0-separated row and its compact twin does not group together and is never named, while the typed duplicate check at src/modules/accounts/application/register-accounts.ts:57 canonicalises both sides in JavaScript and treats them as one account. The two halves of criterion 18.5 disagree about what a collision is."
      - "THE PHASE'S OWN TEST CANNOT FAIL ON THIS. Criterion 18.4 arm one asks for equivalence over every rendering the seed harness writes, and test/e2e/canonical-backfill.spec.ts:216 asserts exactly that, over the renderings declared at test/e2e/seed-pre-phase-household.ts:48 through :113, which are ASCII spaces only. The criterion is literally satisfied while the guarantee it was written to buy is not established for any non-ASCII separator."
      - "AND IT IS ASSERTED AS TRUE IN THREE PLACES (clause R-087). The migration header states at migration.sql:24 through :26 that the expression IS an SQL mirror of the platform function; scripts/detect-account-collisions.ts:18 through :22 repeats it; src/platform/account-number.ts:54 through :59 lists both as SQL mirrors that must agree with it by test. Measured, they do not agree."
      - "Locale-dependence makes it worse rather than better: POSIX character classes in Postgres depend on the server's ctype, so the set of characters this migration strips is a property of the deployed cluster and not of the committed SQL. My cluster is C.UTF-8; the deployed Supabase cluster's ctype was not read here."
    concrete-fix: "Make the two expressions agree explicitly rather than by name. Either write the SQL class out so it covers what the JavaScript class covers, pinning the exact codepoint set in the migration and in the detection script, or narrow src/platform/account-number.ts:67 to the same ASCII class the SQL strips, which is the smaller change and is defensible because an account number carrying an exotic separator is no more matchable for having it stripped. Either way, add at least one U+00A0 rendering and one U+FEFF rendering to test/e2e/seed-pre-phase-household.ts:48 so the equivalence arm at test/e2e/canonical-backfill.spec.ts:216 can fail, and add a fast-gate test that walks a fixed codepoint list through the platform function so the JavaScript half is pinned too. The reserves join at src/modules/overview/adapters/overview-repository.ts:193 carries the same expression and must move with them, or the three mirrors will disagree in a fourth way."
    analysis: "This is the phase's central promise and the promise is scoped by a test whose input alphabet cannot contradict it. The defect is not the choice of class: [[:space:]] over the backslash form was a deliberate and correct fix for the template-literal escaping trap recorded at src/modules/overview/adapters/overview-repository.ts:166 through :180. The defect is that the class was then DECLARED a mirror in three comments and pinned by a spec that only ever feeds it ASCII spaces. I have not witnessed U+00A0 in the owner's data and cannot from this tree, which is why this is high rather than critical; but the migration is the artifact the brief calls least reversible, and a rendering it silently fails to repair leaves the household exactly where P14-001 found them, holding a row that now looks fixed."
  - id: CR2-M3P18-02
    severity: high
    evidence:
      - "MEASURED. I executed the COMMITTED listReserveMovements SQL (src/modules/overview/adapters/overview-repository.ts:192 through :211) against a real PostgreSQL 16.13, over a household holding exactly the collision pair the phase's own harness writes (test/e2e/seed-pre-phase-household.ts:82 through :95: one row spaced and POT, one row compact and RESERVE, one real account) plus one pot-account row with flow RESERVE whose counterparty is that account. Captured output, two rows where one movement exists: BE54910000000003 with label Buffer account, total -50000, count 1; and BE54910000000003 with label Buffer savings, total -50000, count 1."
      - "The cause is the LEFT JOIN at src/modules/overview/adapters/overview-repository.ts:200 through :203, which joins the transaction to EVERY account row whose canonical number matches, together with the GROUP BY on number and label at :210, so a pair carrying two labels yields two groups each holding the full amount."
      - "The screen figure is the SUM OF THE GROUPS: src/modules/overview/application/month-overview.ts:175 through :177 sets the reserves block's netCents to a reduce over the groups' parkedCents. So the block reads 1.000,00 where the reconciliation's own netToReservesCents, taken from the single-row aggregate at src/modules/overview/adapters/overview-repository.ts:245, reads 500,00. The same euro appears under two headings on one screen, the two figures on that screen disagree, and the verdict still computes from the aggregate and can still say the books close."
      - "This phase is the one that decides such a pair STAYS: prisma/schema/migrations/20260827120000_canonical_account_iban_backfill/migration.sql:56 through :64 leaves both members exactly as they are, deliberately, and criterion 18.5 asserts only that the pair is no worse off for the migration having run. It is no worse off; it was already this bad, and nothing in the phase looks."
      - "Hazard H18.2 in the phase's own text names this shape exactly, the same euro under two headings on one screen, and is addressed-by criterion 18.2, which forbids summing HELD rows. The held rows are indeed never summed, witnessed at test/domain/savings-decision.test.ts:179 and by my reading of src/modules/overview/ui/month-view.tsx:280 through :331. The hazard arrives through the reserves block instead, which no criterion of this phase covers."
      - "Reachability is not hypothetical for this household: the phase exists because pre-M3-P14 rows carry non-canonical renderings, and the whole reason the migration refuses to merge a pair is that such pairs are expected in exactly the owner's data."
    concrete-fix: "Make the reserves join match at most one account row per canonical number: join through a de-duplicated subquery over accounts (one row per household and canonical number, chosen by lowest id) instead of joining the accounts table directly at src/modules/overview/adapters/overview-repository.ts:200, and group on the canonical number and the one surviving label. Then add a slow-gate arm to test/e2e/canonical-backfill.spec.ts that seeds the harness pair, books one RESERVE-flow transfer to it, and asserts listReserveMovements returns exactly one group whose parkedCents equals the transfer and that the reserves block net equals figures.netToReservesCents. Note in passing that the surviving label is then arbitrary between the pair's two rows, which is a second reason to name the pair to the household rather than only to an operator who happens to run the script."
    analysis: "The phase asked whether HELD rows could double count and answered it well. It did not ask whether the population it deliberately leaves behind already double counts through the block that was already there. The mechanism is M3-P14's, so this is not a regression introduced by the diff; it is a defect this diff decides to live with without measuring it, and the measurement is one query. I rate it high because it is a wrong money figure on the month view, visible to the owner, in exactly the household shape this phase is built for, and because the phase's own hazard register names the shape and then checks only one of the two places it can arrive from."
  - id: CR2-M3P18-03
    severity: medium
    evidence:
      - "Criterion 18.1 requires the three superseded sentences to be gone, with a grep asserting each one gone. The sweep at test/domain/savings-decision.test.ts:69 through :83 reads ONE file, the domain skill, so the sentences survive elsewhere in the tree with nothing going red."
      - "SURVIVOR ONE, and it is load-bearing: src/modules/accounts/application/change-account-ring.ts:7 states that savings statements are not imported in v1 and cites pulse-domain section 1, the very section this phase rewrote. It is not decoration: that sentence is the ARGUMENT for why the ring guard's scope is sufficient, made at src/modules/accounts/application/change-account-ring.ts:5 through :18."
      - "SURVIVOR TWO, verbatim one of the three sentences: test/e2e/month-view.spec.ts:1333 through :1337 states that the savings account's statement is never imported and that a reserve account is registered for its account number only, citing pulse-domain section 1 and decision D-55, the decision DR-0030 superseded."
      - "A THIRD FALSE CLAIM, about where a witness lives: test/application/savings-held.test.ts:15 states that the browser-level witness lives in test/e2e/import.spec.ts, and delivery/work-history/m3-p18-notes.md:97 repeats it. MEASURED: git diff --stat dee3d32..85da7f6 over test/e2e/import.spec.ts is EMPTY, the file is untouched by this branch, and a case-insensitive grep over it for savings, held, RESERVE or DR-0030 returns one unrelated hit at test/e2e/import.spec.ts:159. The browser witness actually lives at test/e2e/accounts.spec.ts:452."
      - "A FOURTH, and this one is about evidence rather than prose: delivery/work-history/m3-p18.yaml:420 through :422 states of the temporary witness run that there were 42 assertion lines, all prefixed ok, none failing, and that the full verbatim output is preserved in the notes under a named heading. MEASURED: that section, delivery/work-history/m3-p18-notes.md:205 through :231, carries a prose summary beginning Highlights and NO assertion lines at all, and a grep for lines beginning ok over the whole notes file returns 0. The witness script was deleted, so the settled-by evidence for claim M3P18-C3 is a restatement of its conclusion, which is the shape the red-witness rule exists to refuse."
    concrete-fix: "Correct all four in place rather than deleting them (clause R-087). Rewrite the rationale at src/modules/accounts/application/change-account-ring.ts:5 through :18 to say that a savings account's own statement IS imported and that importing it is therefore what closes the ring-correction window (see CR2-M3P18-04). Rewrite test/e2e/month-view.spec.ts:1333 to say the statement is simply not imported BY THIS TEST. Point test/application/savings-held.test.ts:15 and delivery/work-history/m3-p18-notes.md:97 at test/e2e/accounts.spec.ts:452. And either paste the 42 captured lines into the notes under that heading or downgrade the claim at delivery/work-history/m3-p18.yaml:420 to say the output was not preserved. Then widen the sweep at test/domain/savings-decision.test.ts:69 from the one skill file to the whole tree, excluding delivery, so a fifth copy cannot appear."
    analysis: "Raised under clause R-087, loudly rather than as a nit, because criterion 18.1's whole argument is that a sentence contradicting shipped behaviour is read BEFORE the plan by whoever works next, and the phase then checked exactly one file for it. The change-account-ring survivor is the worst of the four: a reader deciding whether that guard is still sufficient reasons from a sentence this phase made false. The fourth is the one that matters to this review's own trust: a work history claiming preserved captured output that does not exist is indistinguishable, after the fact, from one that never captured it."
  - id: CR2-M3P18-04
    severity: medium
    evidence:
      - "Before this phase, a household that declared a spending account as SAVINGS by mistake had its statement REFUSED, and the refusal message named the remedy and its price. That message is deleted by this phase: the importAccountInSavingsRing key is gone from messages/en.json, messages/nl.json and messages/fr.json in commit 4ef4c01, which criterion 18.1 requires."
      - "After this phase the same upload is ACCEPTED (src/modules/import/application/confirm-import.ts:117 through :125), so the account acquires imported rows of its own."
      - "And the ring can then never be corrected: src/modules/accounts/application/change-account-ring.ts:45 through :47 refuses with kind account-has-own-rows once the account carries any imported row, and the plan parks the ring correction rather than carrying it here."
      - "The resulting state misreports money with no in-product remedy: transfers into that account keep classifying RESERVE, so they read as money set aside, while every row of the account's own statement is held and counted in no total, so the household's real spending through it is invisible. Both are permanent in v1."
      - "The phase text knows the general shape, its grounding paragraph records that the ring is correctable only while the account has no imported rows of its own and parks the correction, but nothing records that ACCEPTING the statement is what closes the window, and no criterion, no copy and no screen state says so to the household before the upload."
    concrete-fix: "Two options, and the cheap one is enough for this round. To say it, add one line of copy to the three catalogues on the import confirmation for a statement whose own account sits in the savings ring, stating that importing it fixes that account's ring, and assert it in test/e2e/accounts.spec.ts:452 beside the acceptance. To hold it, exempt a RESERVE-ring account whose only imported rows are its own held rows from the has-own-rows refusal at src/modules/accounts/application/change-account-ring.ts:45, which is safe by that guard's own argument because those rows carry no flow and a recompute rewrites nothing about them. Whichever is chosen, record it as a decision rather than leaving it implied."
    analysis: "This is downstream of the owner's own decision and the plan parks the repair, so it is not a criterion failure. It is a finding because the phase removes the only screen that named the remedy in the same change that makes the remedy unreachable, and because the guard's justification still argues from the world before DR-0030 (finding CR2-M3P18-03). The owner would feel this one: four of their ten documents land on accounts whose ring answer becomes final at upload."
  - id: CR2-M3P18-05
    severity: low
    evidence:
      - "Criterion 18.2 arm THREE requires a grep asserting that no read the phase adds sums the amount column OR READS OUTSIDE THE REQUESTED PERIOD. The static arm at test/domain/savings-decision.test.ts:155 through :180 asserts only the two halves it names: that the held read carries no flow text (line 175) and that it carries no SUM (line 179). Nothing asserts the period bounds."
      - "The property itself HOLDS in the shipped read: src/modules/overview/adapters/overview-repository.ts:395 and :396 bound the held read by period.from and period.to. So this is an unasserted true property rather than a defect, and a later edit that dropped the bounds would go red nowhere."
    concrete-fix: "Add one expectation beside the two already at test/domain/savings-decision.test.ts:179, asserting the held read's SQL slice contains both bookingDate comparisons against the period bounds, so the period bound is pinned by the same sweep that pins the absent sum."
    analysis: "Small, and recorded because the criterion states two obligations for its grep and the tree carries one. A held read that lost its period bounds would show a savings account's whole history under a month heading, which is precisely the kind of quiet wrong the rest of this criterion is unusually careful about."

criteria:
  - id: "18.1"
    quote: "A SAVINGS STATEMENT IS ACCEPTED AND THE REFUSAL IS GONE ROOT AND BRANCH. A Playwright test over a household that has completed setup uploads a statement whose own account is registered in the SAVINGS ring and asserts it is ACCEPTED, its rows ingested and shown as held under criterion 18.2 ... A grep asserts the reason account-in-savings-ring is gone from the union, from the routing, from the whitelist, from the SETUP_LINKED membership and from all three catalogues ... The Playwright test shipped by M3-P14's criterion 14.5 that asserts the refusal is REWRITTEN into the acceptance test this criterion specifies rather than deleted ... The other two arms of the built gate stand unchanged and are asserted still standing ... And the skill is corrected in the same commit."
    evidence:
      - "THE REFUSAL IS GONE at every one of the six named sites, read by me: the union member is gone at src/modules/import/application/confirm-import.ts:25 through :33, the refusal arm is gone at src/modules/import/application/confirm-import.ts:117 through :125 (an unregistered account is now the only refusal there), the routing is gone at src/modules/import/ui/actions.ts:103 through :110, the whitelist entry is gone at src/modules/import/ui/status-keys.ts:10 through :14, the SETUP_LINKED member is gone at src/modules/import/ui/import-status-line.tsx:15 through :17, and the importAccountInSavingsRing key is gone from messages/en.json, messages/nl.json and messages/fr.json."
      - "THE SWEEP IS THE FULL ENUMERATION, not a sample, and I ran it myself over the whole tree: a recursive grep for the reason, its camel-case form and its catalogue key outside node_modules, .git and delivery returns eleven hits, and every one is a COMMENT recording the removal or the sweep's own regex source. No string literal, no key, no set member. The phase's own sweep at test/domain/savings-decision.test.ts:44 through :67 encodes exactly that distinction and is green in my npm test run."
      - "ACCEPTANCE IS WITNESSED, at the application level rather than the browser: test/application/savings-held.test.ts:40 through :80 uploads the savings fixture through uploadStatement and confirmImport over the fake world, asserts kind ingested with 6 rows added, and asserts every ingested row's flow is undefined. That file is inside my green npm test run of 678 tests. The mechanism behind it is real: src/modules/ledger/application/interpret-window.ts:34 through :40 builds the window from potAccountIds alone, so a RESERVE account's rows are never loaded and keep no flow."
