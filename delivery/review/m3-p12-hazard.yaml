kind: finding
verdict: >-
  CHANGES REQUESTED. The phase does what it says it does: the derivation is one
  pure function, the four grouping surfaces call it, no transaction row is
  written, every new read filters householdId, the reconciliation identity is
  untouched, and the whole fast gate is green on this head. The hazard contract
  is not satisfied, and the reason is the direction the phase itself names as
  the one that matters. Three demonstrated defects open a SILENT merge or a
  silent write that no screen and no exit code stops, and all three sit exactly
  where the plan says the danger is: at the account scrape (finding
  HZ-M3P12-05), at the bare namespace the descriptor branch can now emit
  (HZ-M3P12-01), and at the migration blocking conditions, which block nothing
  because they are computed after the writes and after the recompute
  (HZ-M3P12-03). A fourth, HZ-M3P12-02, ships a documented --dry-run flag that
  performs the whole migration. None of the four is caught by any acceptance
  criterion, which is the measurement this contract exists to make.
  ---
  GATES, RUN BY THIS REVIEW ON fc5aef4, real output. npm run typecheck exit 0,
  no output. npm run lint exit 0, no output. npm test exit 0, Test Files 38
  passed (38), Tests 493 passed (493), duration 8.71s. npm run gate:privacy exit
  0, printed gate:privacy clean. npm run gate:tokens exit 0, no output. npm run
  test:e2e exit 1: 1 failed, 53 passed, 10.7m. The failure is
  test/e2e/import.spec.ts:247, at 390x844 the PDF confirm step shows the
  declaration with no page-level horizontal scroll, on Error: expect(locator)
  .toHaveText(expected) failed, Locator: getByTestId('rows-added'), Expected
  "9", Timeout 5000ms, element(s) not found. That spec is UNCHANGED by this
  phase, git log 7f4aafb..fc5aef4 -- test/e2e/import.spec.ts is empty, and
  re-running it alone passed in 10.9s, 1 passed (35.9s). I judge it the same
  first-request dev-server flake the work history records for a different spec,
  and I record it rather than dropping it. Ports were moved to 3200 and 3300 for
  a concurrent reviewer and playwright.config.ts was restored; git diff on it is
  empty.
  ---
  WHAT I PROBED AND DID NOT FIND, which is a result and is written down so the
  next reviewer does not spend the budget again. No path writes a transaction
  row: the routine touches merchant_rules only, through updateRulePattern and
  upsertRule, and the criterion 12.9 test asserts it. No money moves: the
  overview's added GROUP BY column at
  src/modules/overview/adapters/overview-repository.ts:117 splits SQL groups
  more finely and the fold re-aggregates them, the four key spaces in
  src/modules/overview/domain/month-projection.ts:73 through :112 stay disjoint,
  and flow classification is not reachable from this change, since
  interpret-window resolves merchants after the flows are already computed and
  the ledger's own counterparty key in corrections.ts is untouched. Tenancy
  holds: updateRulePattern carries householdId in the same where clause at
  src/modules/merchants/adapters/merchant-repository.ts:123, listCountedTransactions
  filters it at src/modules/merchants/adapters/merchant-repository.ts:254, and
  the raw SQL filters it at
  src/modules/overview/adapters/overview-repository.ts:131. The two screens do
  agree: both derive the label as the lexicographically smallest normalised
  text over the same set of texts, so the minimum is the same on both. Pass one
  is meaning-preserving as claimed, including for a key that normalises to
  empty, which the property test's generator excludes but which I checked by
  hand. A descriptor rule and an account rule cannot both fire on one key, since
  a key carries exactly one namespace and matchRules short-circuits PREFIX and
  PATTERN for account keys at src/modules/merchants/domain/merchant-rule.ts:102.
  Two genuinely different accounts cannot collide under compaction, which only
  uppercases and drops whitespace. I inspected all 89 entries of the country
  table against the ISO 13616 registry as I know it and found no wrong entry,
  but I could not fetch the registry to verify it mechanically and say so rather
  than implying I did. I could not run the re-derivation against the deployed
  database, which the work history itself records as owed.
