        no file and no hazard.
      - >-
        The reading that resolves it in M3-P14's favour needs the criterion
        reworded, because "with what to do" cannot be satisfied by "nothing".
    concrete-edit: >-
      Replace that clause of criterion 17.2 with: "and an existing account
      whose stored number would FAIL the validity test of M3-P14 criterion 14.3
      is SHOWN AS IT IS, marked as created before the check existed and
      explicitly not a problem to fix, in copy present in all three catalogues,
      because M3-P14 criterion 14.12's second claim already establishes that
      such an account goes on working and the migrations note of both phases
      deliberately leaves stored values alone. This phase adds NO control that
      edits a stored account number: doing so is a declaration edit that
      changes which rows classification matches at
      src/modules/ledger/domain/classify-flow.ts:62 and :73 and would need its
