      settles the question and M3-P17 still asks it, and the gap between them
      is a control nobody has costed that would reach into classification. The
      honest answer is the boring one: the stored number is fine, say so, and
      say why no button is offered, because "named to the household with what
      to do" with no answer is how an implementer talks themselves into
      building the button.
  - id: P17-005
    severity: medium
    evidence:
      - >-
        M3-P17. Step 3 carries the property that makes the correction
        recoverable: "the clear is KEYED ON THE ACCOUNT'S CURRENT RING so it is
        re-runnable and converges."
      - >-
        Criterion 17.1's test cannot distinguish that from the alternative: "A
        second application test runs the same use case TWICE over the same
        account and asserts the second run changes nothing and errors on
        nothing."
      - >-
        A clear keyed on the TRANSITION passes that test. On the second run the
        account is already in the target ring, so no transition occurs, so a
        transition-keyed implementation does nothing, errors on nothing, and
        the assertion holds. The two implementations are indistinguishable by
        this test and only one of them survives a failed first run, which is
        the whole point of the property.
      - >-
        The criterion also retains the ordering clause the previous round asked
        to have replaced: "asserts the same use case CLEARS the flow and
        merchant of that account's own rows BEFORE RECOMPUTING". The end state
        is identical under either order, because the recompute cannot touch
        those rows once the account has left the pot
        (src/modules/ledger/application/interpret-window.ts:35 through :39 and
        src/modules/ledger/adapters/ledger-repository.ts:171), so no
        observation of the system can falsify it.
    concrete-edit: >-
      Replace criterion 17.1's second application test with: "A second
      application test asserts the clear is keyed on the account's CURRENT ring
      rather than on the transition, by running the correction over an account
      that is ALREADY in the target ring and whose rows still carry a stale
      flow, the state a first run that died between its writes would leave, and
      asserting the run clears them and converges. Running the use case twice
      over the same account and finding the second run quiet does not satisfy
      this, because a transition-keyed clear passes it too by doing nothing."
      Replace the ordering clause "CLEARS the flow and merchant of that
      account's own rows before recomputing" with "CLEARS the flow and merchant
      of that account's own rows in the same unit of work as the declaration
      and the recompute", since the relative order of the clear and the
      recompute is unobservable and the property that matters is measured by
      the tests P17-001 adds.
    analysis: >-
      The right property was written into the step and the test that would
      witness it was written to observe the wrong thing. Running a converging
      operation twice from a good state proves nothing about convergence; the
      test has to start from the BAD state, which is exactly the state a
      half-completed correction leaves and exactly what P17-001's failure
      injection produces. The two edits are worth applying together, since one
      manufactures the state the other needs.
