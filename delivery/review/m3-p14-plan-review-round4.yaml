  - id: P14-003
    severity: high
    evidence:
      - >-
        M3-P14, and a standing-sweep instance. Criterion 14.6 requires a
        SUBMIT: "A Playwright test over a household HOLDING A CARD ACCOUNT
        asserts SETUP SUBMITS without touching that row and that its stored
        number is still absent afterwards."
      - >-
        Criterion 14.12 removes the submit for exactly that household: "THE
        SETUP ROUTE IS HONEST FOR THEM: it lists every account they already
        hold ... READ ONLY ... It DOES NOT OFFER THEM A BLANK FORM, because a
        household that retyped an account it already holds would create a
        second row for one real account, and the check that would prevent that
        belongs to M3-P17."
      - >-
        A household holding a card account is a household that holds accounts,
        so 14.12 selects it and the route renders read only. There is no
        household in this phase that both holds a card account and can submit
        the setup form: a fresh household holds nothing until it submits, and
        after it submits it holds accounts and becomes read only.
      - >-
        This was satisfiable before the split. In the single-phase form the
        pre-existing household could add accounts and submit, so 14.6's arm had
        a household to run over. 14.12's read-only rule is new with the split
        and is what removes it. That is the defect class this plan has now
        produced ten times: a criterion satisfiable while its precondition sat
        in the same phase, unsatisfiable once the precondition moved or
        changed.
      - >-
        The application arm of 14.6 is unaffected and correct: "an application
        test asserts the setup use case rejects any submission that would write
        a number onto an account bound to a SourceProfile" runs below the UI.
        Only the Playwright arm has no household.
    concrete-edit: >-
      Replace criterion 14.6's Playwright arm with: "A Playwright test over a
      FRESH household completes setup, then imports a card statement so a card
      account is declared at first sight, then RETURNS to the accounts route
      and asserts the card is listed with its ring and WITHOUT a number, that
      the route offers no control that could give it one, and that its stored
      number is still absent; the household holds accounts by then, so the
      route is in the listing state criterion 14.12 describes and this arm
      asserts the listing rather than a submission." If instead the seam is
      redrawn as this review proposes, restore the original wording, since a
      pre-existing household regains its submit.
    analysis: >-
      The split moved a rule about what the route offers and did not re-read
      the criterion that needed the route to offer it. The repair is cheap
      because 14.6's real subject is the LISTING, not the submission: what it
      wants proved is that a card survives contact with the accounts screen
      without gaining a number, and that is observable in the state the phase
      actually ships. It is worth noticing that this is the second time a card
      row has been the thing a criterion about accounts failed to admit, which
      says the phase's model of an account still has a number in it by default.
  - id: P14-004
    severity: high
    evidence:
      - >-
        M3-P14. Criterion 14.12's third claim states the protection as a
        property of the SCREEN: the route is "READ ONLY, and says in copy
        present in all three catalogues that adding and changing accounts
        arrives in the next phase. It does not OFFER them a blank form".
      - >-
        The reason given is a data-integrity reason, not a presentation one: "a
        household that retyped an account it already holds would create a
        second row for one real account, and the check that would prevent that
        belongs to M3-P17."
      - >-
        The setup submission action must exist and must accept writes in this
        phase, because criteria 14.1, 14.2 and 14.3 require a fresh household
        to submit eight accounts through it. So the write path is live and the
        only thing standing between a pre-existing household and a duplicate
        Account row is that the route did not render a form.
      - >-
        A server action in this codebase is an HTTP endpoint. It is reachable
        without the screen that renders its control, and the phase itself
        treats that as the standard elsewhere: the ring refusal in the same
        phase is enforced BOTH ways, with step 7 requiring that "the accounts
        route offers no control that changes a ring, THE SERVER REFUSES ANY
        ATTEMPT with a named error in all three catalogues", and criterion 14.8
        asserting the server half. 14.12 has no server half at all.
      - >-
        The asymmetry is exactly backwards with respect to consequence. A
        refused ring change costs the household a feature they are told is
        coming. An accepted duplicate submission costs them a second Account
        row for one real account, which is the corruption the plan names in
        H17.4 and whose detection it defers by design, so nothing in the
        shipped product would notice.
    concrete-edit: >-
      Replace criterion 14.12's third claim's final sentence with: "It does not
      offer them a blank form, AND THE SERVER REFUSES A SUBMISSION FROM THEM
      RATHER THAN RELYING ON THE ABSENT CONTROL: the setup use case refuses any
      submission that would create an Account for a household that already
      holds one, with a named error in all three catalogues saying adding
      accounts arrives in the next phase, and an application test asserts the
      refusal by calling the use case directly with a household that already
      holds accounts, never through the screen. This is enforced the same way
      the ring refusal of criterion 14.8 is enforced, in both places rather
      than one, because the reason for it is a data-integrity reason: a
      household that retyped an account it already holds would create a second
      row for one real account, and the check that would prevent that belongs
      to M3-P17."
    analysis: >-
      The phase knows how to write this, because it writes it correctly twelve
      lines earlier for the ring. What happened is that the read-only mode was
      introduced as a description of a screen rather than as a rule about a use
      case, and a screen is not where an invariant lives. The finding is not
      that someone will maliciously post a form; it is that the plan states an
      integrity guarantee and then locates it in the one layer that cannot hold
      one, in a phase whose whole purpose is to be safe to deploy alone.
  - id: P14-005
    severity: high
    evidence:
      - >-
        M3-P14. Step 3 ends: "A household that HAS REGISTERED NOTHING is sent
        here before the import screen will accept a file."
      - >-
        Criterion 14.12's third claim makes the destination of that redirect
        READ ONLY for a pre-existing household, with no submit and no way to
        complete anything.
      - >-
        The word "registered" is used in this phase for two different things
        and is never defined. In criteria 14.1, 14.2 and 14.5 it means "entered
        through the setup form". In 14.12's first claim it must mean "holds an
        Account row", because that claim's whole point is that the gate "admits
        an account that already exists HOWEVER IT WAS CREATED". Step 3's
        predicate is the same word with neither meaning fixed.
      - >-
        If an implementer reads step 3's predicate as setup-completion, which
        is the reading four of the phase's criteria support, a pre-existing
        household is redirected to a read-only route it can never complete and
        is therefore permanently unable to import. That is the live instance
        stopping, which is the exact hazard H14.20 names.
      - >-
        Criterion 14.12's first claim would catch it ONLY if exercised through
        the UI, and the criterion never says it is. It says "A test builds a
        household the pre-phase way ... a test asserts the import completes and
        its rows are ingested and classified exactly as they are today". Its
        second claim reads as an application test, its fourth claim needs the
        month view. Nothing pins the first claim to the browser, so an
        application-level test calling confirmImport directly passes with the
        route guard fully in place.
      - >-
        Criterion 14.5's own wording pushes the wrong way too: it describes the
        gate as admitting "a statement whose own account number is ... among the
        REGISTERED ones", which an implementer building the gate reads before
        they reach 14.12.
    concrete-edit: >-
      Replace step 3's last sentence with: "A household that HOLDS NO ACCOUNT
      ROW is sent here before the import screen will accept a file. The
      predicate is the existence of an Account row and never setup completion,
      because a household created before this phase holds accounts it never
      entered here and must not be redirected to a route criterion 14.12 makes
      read only for it." Restate criterion 14.5's gate predicate as "a file
      whose own account number, canonically compared, matches an Account row
      this household holds, however that row was created" wherever it currently
      says "registered". Add to criterion 14.12's first claim: "asserted
      THROUGH THE BROWSER over that seeded household, navigating to the import
      screen and uploading, so that a route guard or a redirect implementing
      step 3 is exercised rather than bypassed; an application-level assertion
      on the confirm use case alone does not satisfy this claim, because the
      failure this claim exists to catch is a household being sent away from
      the import screen before the use case is ever reached."
    analysis: >-
      One undefined word carrying two meanings, in the one sentence that
      decides whether a live household can reach the import screen at all. The
      criterion that would catch the wrong reading is the right criterion and
      is simply not pinned to the layer where the failure happens, which is a
      pattern worth naming on its own: a guarantee about a live instance has to
      be measured at the outermost layer that instance actually touches, and
      three of 14.12's four claims can be satisfied below it.
  - id: P14-006
    severity: high
    evidence:
      - >-
        M3-P14. Criterion 14.12's second claim is a scoping promise: "the
        validity test of criterion 14.3 is applied ONLY to a number typed into
        the setup form, NEVER TO A STORED ONE, so an existing account whose
        stored number would fail it goes on working".
      - >-
        Criterion 14.4 pushes toward a single entry point: "a unit test
        enumerates the call sites and asserts EXACTLY ONE DEFINITION under src/
        of the canonical form, of the pinned country-length table and of the
        mod-97 implementation, all three in the platform module, WITH EVERY
        CONSUMER IMPORTING THEM."
      - >-
        The conventions of this codebase then close the trap. The
        pulse-typescript skill mandates branded types for identifiers and
        validation at the boundary, so the idiomatic shape for "one canonical
        form and one validity test in one platform module" is a single
        constructor that canonicalises AND validates and returns a branded
        value, with every consumer taking the branded type. That is what "every
        consumer importing them" reads as.
      - >-
        The moment the declared-set derivation or the gate takes a branded
        value, EVERY STORED NUMBER MUST PASS VALIDATION TO BE USABLE, and the
        phase's own measurement is that 10 of the 17 distinct account-shaped
        values in the tree fail the mod-97 check. For a live household the
        consequence is not a rejected form: it is that an account whose stored
        number is invalid drops out of reserveIbans and potIbans at
        src/modules/ledger/domain/deriveDeclaredSets, so every transfer to it
        falls to the sign rule at classify-flow.ts:102 and lands in spend or
        income. That is the phase's own root cause, reintroduced by its own
        repair.
      - >-
        Nothing forbids it. 14.12's second claim is stated as a property of the
        SETUP FORM ("applied only to a number typed into the setup form"), not
        as a property of the platform module, so a module whose only export
        validates satisfies the sentence as written while breaking the promise
        behind it.
    concrete-edit: >-
      Add to criterion 14.4, after the one-definition sentence: "AND THE TWO
      ARE SEPARABLE, which is what criterion 14.12's second claim rests on. The
      platform module exports canonicalisation and validation as two
      INDEPENDENT functions; canonicalisation is TOTAL and returns a string for
      any input, never a Result and never a branded value that only a valid
      number can inhabit, so that a stored number which fails the validity test
      can still be canonicalised and compared. A unit test asserts
      canonicalisation of a number that FAILS the mod-97 check returns its
      canonical form rather than an error, and a grep asserts that no read
      path, the declared-set derivation and the import gate named explicitly,
      calls the validity test at all; only the setup form's write path does."
      Add to criterion 14.12's second claim: "and this is a property of the
      platform module rather than of the form: a tree in which the canonical
      form can only be obtained by first passing the validity test fails this
      claim, however the setup form is written."
    analysis: >-
      The dispatch asked me to find the path where a stored number reaches the
      validity test, and the path is not an oversight in the gate but the
      shape this codebase's own conventions produce when told to put one
      canonical form and one validity test in one module and have every
      consumer import them. A branded identifier with a validating constructor
      is the right pattern for a value a user types and the wrong one for a
      value already sitting in a column that predates the rule. The separation
      costs one sentence and it has to be stated at the module, because that is
      where the coupling would be introduced, and 14.12's promise is written
      one layer too far out to prevent it.
  - id: P14-007
