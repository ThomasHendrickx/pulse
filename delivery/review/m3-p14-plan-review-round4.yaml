# FOURTH adversarial plan review of the M0-P6 iteration, now TWO phases:
# M3-P14 (the household starting fresh) and M3-P17 (account migration).
#
# WHAT THIS REVIEWS. delivery/plan/pulse-v02.yaml at a6972e7, read in the
# reviewer worktree /home/user/wt-m0p6-adv on branch claude/m0-p6-plan-review
# at 9b24e40. M3-P14 at plan line 7687, TWELVE criteria and THIRTEEN hazard
# classes; M3-P17 at plan line 8480, THREE criteria and SIX hazard classes.
# The predecessor is delivery/review/m3-p14-plan-review-round3.yaml, six high,
# five medium and one low against the single thirteen-criterion phase.
#
# HOW THE FINDINGS ARE LABELLED. P14-nnn belongs to M3-P14, P17-nnn to
# M3-P17. Two findings are one mechanism divided by the seam and say so.
#
# ==========================================================================
# THE THREE PLAIN ANSWERS FIRST, because the rest is why.
#
# IS M3-P14 SAFE TO DEPLOY ALONE ON A LIVE HOUSEHOLD WITH EXISTING DATA?
# NO, not as written, and the reason is not a gap in criterion 14.12's
# ambition but a state it does not seed. Finding P14-001: the owner's
# household can already hold TWO Account rows for ONE real account, because
# the delimited parse stores an account cell VERBATIM
# (src/modules/import/domain/parse-statement.ts:114 through :123, the
# optionalText call for accountIban) while the Belfius PDF template COMPACTS
# it (src/modules/import/domain/belfius-current-account-template.ts:90), and
# the lookup that decides whether an account already exists is an EXACT match
# (src/modules/accounts/adapters/account-repository.ts:56 through :58,
# findFirst on the stored string). Today those two rows never collide and each
# import lands on its own row deterministically. M3-P14 changes that
# comparison to a CANONICAL one, which MERGES them, and findFirst carries no
# orderBy, so which row an import lands on becomes arbitrary, and that row's
# RING decides whether the imported statement is counted or held. Criterion
# 14.12 promises the household "keeps working EXACTLY AS IT DOES TODAY" and
# on this pair the phase makes it strictly worse than today. The plan already
# knows both renderings reach storage: criterion 14.4 says so in as many
# words. It draws the duplicate conclusion only for a number a household
# TYPES, and never for the pair the import path itself has already been able
# to create since before this work started.
#
# Two further reasons, each on its own enough to hold the deploy: finding
# P14-002, the card's ring has no answerer once criterion 14.5's grep deletes
# the ring control, while NewAccount.role is a REQUIRED field
# (src/modules/accounts/application/ports.ts:16 through :21) and
# .claude/skills/pulse-domain/SKILL.md:20 forbids defaulting it in as many
# words; and finding P14-005, nothing in 14.12 requires its first claim to be
# exercised THROUGH THE UI, so a route guard implementing step 3's "a
# household that has registered nothing is sent here before the import screen
# will accept a file" can lock a pre-existing household out of importing while
# an application-level test of the same claim passes.
#
# IS THE SEAM RIGHT? The CONSTRAINT is right and is the best thing in this
# round: making M3-P14 safe to deploy while M3-P17 does not exist is exactly
# the question, and criterion 14.12 is a real attempt at a real guarantee. The
# CUT is defensible and I can make it work, but I think a different one is
# better and it does not reopen DR-0030. See THE SEAM, below.
#
# IS EITHER PHASE DISPATCHABLE NOW? No, neither. M3-P14 has six highs, three
# of which break a live instance. M3-P17 has five, of which two leave its
# riskiest mechanism measured by prose alone.
#
# ==========================================================================
# WHAT THE SPLIT GOT RIGHT, said before the attack.
#
# Round three's R4-001 (a criterion whose household could not be built),
# R4-002 (the clear with no legal home), R4-005 (the false backstop claim) and
# R4-009 (the reconciliation identity cannot see a reserves misallocation) are
# all genuinely repaired, and three of the four are repaired in the artifact
# rather than in a summary. Step 2 of M3-P14 now states the index is a
# backstop only for rows written from this phase onward and says why. Step 3
# of M3-P17 puts the clear in the ledger, beside replaceInterpretation, on the
# ledger port, injected exactly as assign-merchant receives recompute. 17.1
# now byte compares NET TO RESERVES and carries the identity argument in full.
# And M3-P14's verification-first step now captures, from the phase base and
# before any edit, the full MonthFigures of a seeded pre-phase household,
# which is the fourth thing the dispatch asked me to check and which is
# PRESENT and correctly placed. Criterion 14.9 carries it too, in the clause
# requiring one captured block per claim AND PER BASELINE. That is the sweep
# defect's favourite hiding place and it is not hiding there this time.
#
# ==========================================================================
# THE FIVE ATTACKS ON CRITERION 14.12, in the order they were put to me.
#
# ONE, THE CANONICAL GATE. The stored form that does NOT resolve is the one
# that resolves TWICE, which is finding P14-001 above. I also probed the
# single-row case and could not break it: canonicalisation as specified,
# uppercase with whitespace removed, maps both a spaced Belgian rendering and
# a compact one onto the same string, and no path in the tree stores an
# account with any other separator, measured. The one narrowing worth writing
# down is that the privacy gate's own normalisation strips SPACES AND DASHES
# while the platform canonical form as specified strips whitespace only, so
# the two normalisations in this repository will not agree on a hyphenated
# value; nothing stores one today, so it is a note and not a finding.
#
# TWO, THE VALIDITY TEST ON A STORED NUMBER. There is a path and it is the
# one this codebase's own conventions push an implementer down. Finding
# P14-006.
#
# THREE, THE WAYS INTO A READ-ONLY ROUTE THAT ARE NOT READ ONLY. There is no
# server-side refusal anywhere in 14.12, which is finding P14-004, and the
# predicate that selects read-only mode cannot be expressed against a schema
# the phase's own migrations note freezes, which is finding P14-009.
#
# FOUR, THE MONTHFIGURES CAPTURE. Present, correctly placed in the
# verification-first step, and enforced by 14.9. No finding. This is the one
# attack the dispatch named that came back empty, and that is worth as much as
# the ones that did not.
#
# FIVE, THE CARD IN M3-P14 ALONE. It cannot acquire a number: criterion 14.6
# forbids any control that would give one, and its application arm asserts the
# use case rejects such a submission, which is server side and correct. It
# cannot be refused for its absent number: 14.12's second claim scopes the
# validity test to typed numbers only. Both halves hold. What does NOT hold is
# what ring a NEW card gets when it is declared at first sight with the ring
# control deleted, which is finding P14-002, and whether a household holding a
# card can reach the submit that criterion 14.6's own Playwright arm requires,
# which is finding P14-003.
#
# ==========================================================================
# THE STANDING SWEEP. A criterion satisfiable while its precondition sat in
# the same phase, no longer satisfiable once the precondition moved.
#
# COUNT FOUND THIS ROUND: THREE, taking the running count for this plan to
# TEN.
#
#   1. Criterion 14.6's Playwright arm requires a household HOLDING A CARD
#      ACCOUNT to SUBMIT the setup form. Criterion 14.12 makes that route read
#      only for any household that holds accounts and says outright it "does
#      not offer them a blank form". No household can satisfy both. Finding
#      P14-003.
#   2. Criterion 14.12's third claim, the read-only route and its temporary
#      copy in three catalogues, is a STANDING acceptance criterion of M3-P14
#      that M3-P17's step 4 is required to violate, and no supersession is
#      recorded anywhere in either phase. Finding P17-003.
#   3. The seed harness. The plan-writer reports this as one of two fixes and
#      the intended shape is right, M3-P14 seeding inline and M3-P17
#      promoting, but that is not what the artifact says: M3-P17 step 2 says
#      BUILD, its files-to-touch marks the file "(new, the seed harness)", and
#      M3-P14 lists no helper at all. Finding P17-006.
#
# THE PLAN-WRITER'S OWN TWO, verified as asked. The E2E MIGRATION fix is
# GENUINE and complete: the migration step stayed in M3-P14, all six uploading
# specs including prod-smoke are in its files-to-touch, and criterion 14.9
# still requires the per-spec record. The SEED HARNESS fix is stated in the
# dispatch and absent from the plan, which is item 3 above.
#
# ==========================================================================
# THE SEAM, judged as the coordinator's decision.
#
# THE CONSTRAINT IS RIGHT. "M3-P14 must be safe to deploy while M3-P17 does
# not exist, on a household that already holds imported data" is the correct
# question to have made load-bearing, and criterion 14.12 is a real guarantee
# rather than a gesture at one. Nothing below takes that back.
#
# THE CUT LEAKS IN THREE PLACES, and the leaks are why five of M3-P14's six
# highs exist. The seam is drawn on the POPULATION, fresh against
# pre-existing, and the population is not separable: the pre-existing
# household's files flow through M3-P14's gate, so M3-P14 must handle them
# (14.12 claim one); the duplicate pair is created by the IMPORT path rather
# than by typing, so it is in M3-P14's half by origin and in M3-P17's half by
# assignment (findings P14-001 and P17-009); and M3-P14 must build a
# pre-phase seed to prove 14.12 at all, which is M3-P17's named deliverable.
#
# A DIFFERENT SEAM, offered because the dispatch asked for one rather than a
# complaint, and it does not touch DR-0030. CUT ON THE MECHANISM, NOT THE
# POPULATION. M3-P14 keeps everything with NO interpretation write behind it,
# which is everything it has now PLUS the two declaration-layer pieces
# currently in M3-P17: the pre-existing household may ADD the accounts it
# never imported, and a typed row whose canonical form equals one the
# household already holds is refused. Both are pure declaration-layer
# comparisons with zero ledger involvement, and putting them in M3-P14 puts
# the duplicate check in the phase that CREATES the ambiguity. M3-P17 then
# shrinks to exactly ONE mechanism, the ring correction with its ledger clear,
# atomicity, idempotence and transfer links, which is what a second phase
# ought to be.
#
# WHAT THAT SEAM BUYS, item by item: the read-only mode disappears, and with
# it finding P14-003 (14.6 has a submit again), finding P14-004 (no read-only
# state to enforce server side), finding P14-009 (no unexpressible predicate),
# finding P17-003 (no standing criterion for the next phase to violate) and
# the temporary copy in three catalogues plus its removal. Finding P14-001
# still needs its seeded duplicate pair, but it is answered in the same phase
# that introduces canonical comparison rather than one phase later. WHAT IT
# COSTS: M3-P14 grows by an add-accounts flow for a household that already has
# some, which is the same form it already builds for a household that has
# none, plus one canonical uniqueness check in the use case. That is smaller
# than what it removes.
#
# I do not think the chosen seam is WRONG in the sense of unworkable. I think
# it costs five highs that the mechanism seam does not, and the coordinator
# asked to be told which.
#
# ==========================================================================
# THE MEASUREMENTS, RUN IN THIS WORKTREE.
#
#   $ grep -n "findAccountByIban" -A 8 src/modules/accounts/adapters/account-repository.ts
#   52: export const findAccountByIban = async (
#   56:   const row = await prisma.account.findFirst({
#   57:     where: { householdId: context.householdId, iban },
#
# findFirst, exact string, no orderBy. This is the whole of finding P14-001.
#
#   $ grep -n "NewAccount" -A 5 src/modules/accounts/application/ports.ts
#   16: export type NewAccount = {
#   19:   readonly role: AccountRole;      <- required, not optional
#   20:   readonly iban?: string;
#
#   $ sed -n '20p' .claude/skills/pulse-domain/SKILL.md
#   `Account.role` is `POT` or `RESERVE`. The user declares it at first sight.
#   Never infer it, never guess it from the account name, never default it.
#
# Together these are finding P14-002: a required field, its only answerer
# deleted, and a governing document forbidding the obvious substitute.
#
#   $ sed -n '90p' src/modules/import/domain/belfius-current-account-template.ts
#   const compactIban = (text: string): string => text.replace(/\s/g, "");
#
# against parse-statement.ts's optionalText("accountIban"), which stores the
# cell as it stands. Two writers, two renderings, one exact-match reader.
#
# M3-P17 files-to-touch, checked for the allow list the phase's own criterion
# 17.3 requires: ABSENT. Finding P17-007.
#
# HOUSE RULES. No long dash anywhere in this document. No account number, no
# card number, no amount, no counterparty and no date from any row appears in
# it. English throughout, npm throughout. Scope discipline was checked against
# CLAUDE.md's list across both phases: no queue, no cron, no event bus, no
# cache, no state library, no component library, no per-transaction override,
# no goal and no budget. The one place scope could grow unbudgeted is finding
# P17-004, where one reading of criterion 17.2 requires a control that edits a
# stored account number, which carries a recompute behind it.
# THE VERDICT FIELD carries the closed vocabulary of the verdict contract,
# APPROVE or FIX-ROUND-NEEDED, and not a sentence, because the finding schema
# leaves it a free string precisely so that a second vocabulary is not invented
# here. Read per phase it is FIX-ROUND-NEEDED for M3-P14 and FIX-ROUND-NEEDED
# for M3-P17, and M3-P14 additionally does not meet the deploy-alone constraint
# its own criterion 14.12 sets. Findings P14-nnn belong to M3-P14 and P17-nnn to
# M3-P17.
