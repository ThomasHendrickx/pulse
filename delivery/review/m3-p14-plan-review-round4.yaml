findings:
  - id: P14-001
    severity: high
    evidence:
      - >-
        M3-P14. Criterion 14.12's first claim rests on one comparison: "the
        gate of criterion 14.5 compares CANONICAL forms and admits an account
        that already exists however it was created, so a stored spaced
        rendering and a file's compact one resolve to the same account".
      - >-
        A pre-existing household can already hold TWO Account rows for ONE real
        account, and the plan's own criterion 14.4 states both halves of the
        cause without joining them: "the delimited parse stores such a cell
        verbatim (src/modules/import/domain/parse-statement.ts:114 through
        :123) and the PDF path compacts it
        (belfius-current-account-template.ts:90)". Confirmed at this head:
        parse-statement's optionalText call writes the accountIban cell as it
        stands, and belfius-current-account-template.ts:90 is
        `text.replace(/\s/g, "")`.
      - >-
        Nothing stops the pair existing. The uniqueness index
        `@@unique([householdId, iban])` at prisma/schema/accounts.prisma:28
        compares stored strings, so a spaced row and a compact row of the same
        account do not collide, and the lookup that decides whether an account
        already exists is an EXACT match:
        src/modules/accounts/adapters/account-repository.ts:56 through :58 is
        `prisma.account.findFirst({ where: { householdId, iban } })`. So the
        same real account imported once through a delimited export and once
        through the Belfius PDF template produces two rows today.
      - >-
        TODAY THAT IS STABLE AND M3-P14 MAKES IT UNSTABLE. Under the exact
        match, a spaced file finds the spaced row and a compact file finds the
        compact row, deterministically, every time. Under the canonical
        comparison this phase introduces, both rows match one file, findFirst
        carries NO orderBy, and Postgres returns rows in no guaranteed order,
        so which Account an import lands on becomes arbitrary between runs.
      - >-
        The consequence is money and it is silent. The winning row's RING
        decides everything downstream: if the pair was declared once as POT and
        once as RESERVE, which is entirely possible because each was answered
        by hand at first sight on the screen this phase deletes, then the same
        statement is INGESTED AND COUNTED on one run and INGESTED AND HELD on
        the next, with income, spend and the reserves block all moving and the
        reconciliation identity closing either way (the argument criterion 17.1
        spells out: a misallocation among income, spend and reserves cancels on
        both sides of the difference).
      - >-
        Criterion 14.12 does not seed the pair. Its harness carries "stored
        numbers left in whatever rendering they carry including a non-canonical
        one, at least one CARD account with no number at all" and no second row
        for one account, so no test in the phase ever sees the state, and the
        criterion that promises "EXACTLY AS IT DOES TODAY" is measured over a
        household that cannot exhibit the one behaviour the phase changes for
        the worse.
    concrete-edit: >-
      Extend criterion 14.12's harness to "stored numbers left in whatever
      rendering they carry including a non-canonical one, at least one CARD
      account with no number at all, AND A PAIR OF ACCOUNT ROWS THAT ARE ONE
      REAL ACCOUNT, one written spaced as the delimited parse stores it
      (src/modules/import/domain/parse-statement.ts:114 through :123) and one
      written compact as the Belfius template stores it
      (belfius-current-account-template.ts:90), answered with two different
      rings, because the exact-match lookup at
      src/modules/accounts/adapters/account-repository.ts:56 through :58 lets
      that pair exist today and the canonical comparison this phase introduces
      is what first makes them collide". Add to the same criterion, as a fifth
      claim: "FIVE, AN AMBIGUOUS ACCOUNT IS NAMED, NEVER GUESSED. Where two
      Account rows of one household share a canonical number, the gate REFUSES
      the import with a named machine reason in all three catalogues saying the
      household holds the same account twice and that repairing it arrives in
      M3-P17, rather than resolving to whichever row the database returns
      first; a test asserts the refusal, asserts no rows were ingested, and
      asserts the refusal is stable across repeated runs. Silently picking one
      row is refused because the row's ring decides whether the statement is
      counted or held, so the same file would produce two different months."
      Add hazard class H14.21: "A household already holds one real account as
      two rows because one import wrote it spaced and another compact, and the
      canonical comparison this phase introduces makes the two collide, so
      which account an import lands on, and therefore whether its rows are
      counted or held, depends on the order the database returns rows in",
      addressed-by criterion 14.12.
    analysis: >-
      This is the finding that answers the dispatch's actual question, and it
      is not a gap in what criterion 14.12 tries to do but a state it never
      constructs. The plan has the two halves of the cause written down in
      criterion 14.4 and reads them as an argument for canonical comparison,
      which they are; what it does not do is turn round and ask what canonical
      comparison does to a household that has been running against the exact
      match for months. The answer is that a distinction the old code enforced
      accidentally becomes a collision the new code resolves arbitrarily. The
      right behaviour here is a refusal rather than a repair, because repairing
      it means merging two Account rows and their transactions, which is real
      migration work and belongs where the plan already put the duplicate
      question; but a refusal has to be WRITTEN, because the default behaviour
      of findFirst is to pick one and say nothing.
  - id: P14-002
