  - id: P14-009
    severity: medium
    evidence:
      - >-
        M3-P14. Criterion 14.12 requires the accounts route to behave in two
        different ways for two populations: read only, with temporary copy, for
        a household that already holds accounts, and, per its last sentence, "A
        household with NO ACCOUNTS is unaffected by this criterion and gets the
        full setup flow of criteria 14.2 and 14.3."
      - >-
        The migrations note forecloses any column that could record which
        population a household is in: "none. The Account model already carries
        label, bank, role and an optional account number ... so setup needs no
        new column, no new table and no enum change."
      - >-
        So the predicate must be structural, and the only structural signal
        available is whether the household holds any Account row.
      - >-
        Under that predicate the read-only mode is not scoped to pre-existing
        households at all: a FRESH household that completes setup under
        criterion 14.2 holds accounts from that moment and the route becomes
        read only for it too, permanently, until M3-P17. So the household that
        opens a ninth account next month has no way to add it, and the copy
        they are shown says adding arrives in the next phase, which is at least
        honest but is nowhere stated as an outcome of this phase.
      - >-
        No criterion catches the flip, because every setup submission in the
        phase happens exactly once per household: 14.1's two arms, 14.2 and
        14.7 all submit and never return.
    concrete-edit: >-
      Add to criterion 14.12, before its last sentence: "THE PREDICATE IS
      NAMED, because the schema cannot record which population a household is
      in and the migrations note keeps it that way: the route is in its LISTING
      state exactly when the household holds at least one Account row, and in
      its ENTRY state exactly when it holds none. This is not scoped to
      households that predate the phase, and the plan states the consequence
      rather than discovering it: a household that completes setup under
      criterion 14.2 is in the listing state from then on, so ADDING A NINTH
      ACCOUNT AFTER SETUP ALSO ARRIVES IN M3-P17, and the copy that says adding
      and changing accounts arrives next is shown to them for the same reason
      it is shown to a pre-existing household. A Playwright test asserts a
      fresh household that has completed setup sees the listing state and that
      copy."
    analysis: >-
      A rule written for one population that the data model cannot restrict to
      that population. The outcome is defensible and probably even correct for
      a phase that ships alone, since adding accounts and changing rings are
      the same deferred capability, but it is a real product consequence of
      M3-P14 that appears in no criterion, no hazard and no copy decision, and
      it was reachable only by asking what predicate the read-only mode could
      possibly be built on given the phase's own migrations note.
  - id: P17-001
    severity: high
    evidence:
      - >-
        M3-P17. Step 3 states the atomicity requirement clearly: "THE
        CORRECTION IS ONE UNIT OF WORK: declaration, clear and recompute all
        land or none do, with a NAMED ERROR rather than a partial state."
      - >-
        No criterion measures it. Criterion 17.1 carries three tests and all
        three are happy paths: a Playwright journey that succeeds, an
        application test asserting the clear happened and the rows are null,
        and a second application test that runs the use case twice and asserts
        the second run "changes nothing and errors on nothing". Nothing injects
        a failure into any of the three writes.
      - >-
        Hazard H17.2 names the failure precisely: "The change lands its
        declaration and then fails before its clear or its recompute, leaving
        an account whose ring says one thing and whose rows say another, WITH
        NO PATH THAT HEALS IT", and points at criterion 17.1, which never
        exercises it.
      - >-
        The hazard is not theoretical in this product. The published recompute
        throws outright in production (src/modules/ledger/ui/actions.ts:15
        through :21, "Recompute is a dev-only action"), so a household that
        lands in the split state has no button that re-runs anything, which is
        the sentence 17.1 itself alludes to in "a product whose recompute can
        throw" without testing.
      - >-
        A requirement that lives only in a step is a requirement an implementer
        may satisfy or not without any criterion turning red, and the round
        three review asked specifically for a test in which the recompute
        dependency throws. The atomicity half of that edit landed in the step
        and the test it named did not land anywhere.
    concrete-edit: >-
      Add to criterion 17.1, after the run-twice test: "AND THE UNIT OF WORK IS
      MEASURED BY BREAKING IT. Three application tests, one per write, each
      making that write throw and asserting the household is left in the state
      it started in and is shown a named error in all three catalogues: with
      the CLEAR throwing, the account's ring is unchanged and its rows still
      carry the flow they carried before; with the RECOMPUTE throwing, the same;
      with the DECLARATION throwing, nothing was cleared. A tree in which the
      declaration is committed and the clear or the recompute is not fails this
      criterion, because src/modules/ledger/ui/actions.ts:15 through :21 throws
      in production and no household can re-run anything by hand."
    analysis: >-
      The single riskiest mechanism in the plan has its safety property written
      in prose and its correctness measured only where it works. This is the
      thing a second phase exists to get right: M3-P14 was split off precisely
      so this one could be built carefully, and the criterion that carries it
      tests the happy path twice and the failure path never. The edit is three
      tests and they are cheap, because the dependency is already injected: the
      clear arrives as an injected port member by step 3's own design, so
      making it throw is a fake, not a fault injection framework.
  - id: P17-002
    severity: high
    evidence:
      - >-
        M3-P17. Step 3 makes the transfer links half of the clear explicit and
        gives the reason: "OUT OF the pot clears that account's interpretation
        ENTIRELY, the flow and merchant of its own rows AND EVERY TRANSFERLINK
        NAMING ONE OF THEM ON EITHER SIDE, because
        prisma/schema/ledger.prisma:1 through :5 declares that table pure
        interpretation while ledger-repository.ts:173 deletes links only by the
        ids the window loaded."
      - >-
        Criterion 17.1's application test measures only the two columns: it
        "asserts the same use case CLEARS THE FLOW AND MERCHANT of that
        account's own rows before recomputing, that every one of those rows
        carries a null flow afterwards, and that no raw column on any of them
        changed." No assertion mentions transfer_links.
      - >-
        M3-P14's criterion 14.8 does not cover it either: its rebuildability
        test is scoped to columns, "a test asserts running recompute twice
        afterwards leaves every interpretation COLUMN identical". A table is
        not a column, and the round three review's edit asking for "every
        interpretation column AND the whole transfer_links table" landed in
        neither phase.
      - >-
        So the half of the clear that is genuinely hard is measured nowhere in
        either phase. The link that survives is reachable: replaceInterpretation
        deletes by `outgoingTransactionId in ids OR incomingTransactionId in
        ids` (src/modules/ledger/adapters/ledger-repository.ts:173 through
        :182), and a settlement link can carry a null incoming end
        (prisma/schema/ledger.prisma:17), so a link whose only end is on the
        departing account matches neither term and is left behind, unreachable
        by every future recompute because that account is never loaded again.
      - >-
        No hazard class names it. H17.1 names the stale FLOW, H17.2 the partial
        write, H17.3 the reserves figure, H17.4 the duplicate, H17.5 the card.
        The links have neither a criterion nor a hazard.
    concrete-edit: >-
      Extend criterion 17.1's application test to: "asserts the same use case
      clears the flow and merchant of that account's own rows, THAT NO
      TRANSFER_LINKS ROW NAMES ANY OF THOSE ROWS ON EITHER SIDE AFTERWARDS,
      that every one of those rows carries a null flow, and that no raw column
      on any of them changed. The link half is asserted over a household seeded
      so that the departing account carries a link that replaceInterpretation
      cannot reach, a settlement link whose incoming end is null
      (prisma/schema/ledger.prisma:17), because
      src/modules/ledger/adapters/ledger-repository.ts:173 deletes links only
      by the ids the window loaded and such a link matches neither term. A
      further test asserts that after the correction a full recompute leaves
      the transfer_links table identical, which is the rebuildability the
      schema claims for it at prisma/schema/ledger.prisma:1 through :5." Add
      hazard class H17.7: "The clear removes the flow and the merchant and
      leaves a transfer link naming a row on the departed account, which no
      future recompute can reach or rebuild, so a table the schema declares
      fully rebuildable stops being so and the next read written over it
      believes the claim", addressed-by criterion 17.1.
    analysis: >-
      The step is right, names the mechanism, cites both lines and gives the
      reason, and then the criterion measures two thirds of what the step
      describes. The pattern is the same one as P17-001 and they are worth
      reading together: the split gave this phase the hard mechanism and the
      hard parts of the mechanism are the parts that stayed in prose. What
      makes this one worth a high rather than a medium is that the seeded state
      needed to catch it is not obvious, so an implementer writing tests from
      the criterion alone will not stumble into it, and the failure is
      permanent by construction.
  - id: P17-003
    severity: high
    evidence:
      - >-
        A standing-sweep instance, spanning both phases. M3-P14's criterion
        14.12 asserts, as a permanent acceptance criterion of that phase, that
        the accounts route for a pre-existing household is "READ ONLY, and says
        in copy present in all three catalogues that adding and changing
        accounts arrives in the next phase."
      - >-
        M3-P17's step 4 is required to make that false: "Open the setup route
        to a pre-existing household: it MAY ADD the accounts it never imported
        and CHANGE THE RING of any it holds ... The temporary copy M3-P14
        rendered, saying adding and changing arrive next, IS REMOVED in the
        same change."
      - >-
        Nothing records the supersession. M3-P14's criterion 14.12 carries no
        note that its third claim expires; M3-P17 carries no statement that it
        supersedes it; decision D-51 is cited by both for the ring refusal and
        says nothing about the read-only listing or its copy.
      - >-
        The mechanical consequence is a red suite. M3-P14 commits a test
        asserting that copy and that read-only state, in three catalogues.
        M3-P17's criterion 17.3 requires "npm run test:e2e exits 0", and its
        step 5 scopes the migration to "what its own work touches", which does
        not obviously include deleting a sibling phase's committed assertions.
      - >-
        The human consequence is worse than the mechanical one. A criterion
        that is not marked as expiring is read as a standing guarantee: the
        cheapest way to a green suite in M3-P17 is to leave the copy in and
        keep the route read only for the pre-existing household, which is
        precisely the phase's reason for existing.
    concrete-edit: >-
      Add to M3-P14's criterion 14.12, at the end of its third claim: "THIS
      CLAIM IS TEMPORARY AND EXPIRES WITH M3-P17, which opens the route and
      removes this copy under decision D-51; the test that asserts it is
      written so that M3-P17 deletes it rather than edits it, and is marked in
      the spec with the phase that retires it." Add to M3-P17's step 4, after
      the sentence removing the copy: "and the assertions M3-P14 committed for
      its criterion 14.12 third claim, the read-only listing and the temporary
      copy in three catalogues, are DELETED in the same change rather than
      worked around; criterion 14.12's other three claims are permanent and
      stay." Add to M3-P17's criterion 17.2: "and a grep asserts no assertion
      of the read-only state or of the temporary copy survives anywhere in the
      suite, because leaving them green is the cheapest way to a passing gate
      and is the one outcome this phase exists to prevent."
    analysis: >-
      The split created a criterion whose truth has a scheduled end and did not
      write the end down. This is the same defect class as the other two sweep
      hits, running in the other direction: instead of a criterion losing its
      precondition, a criterion becomes an obstacle to the phase that owes it.
      It is the most dangerous of the three, because the failure mode is not a
      test that cannot be written but a test that stays green by the work not
      being done, and the plan's own gate criterion rewards exactly that.
  - id: P17-004
    severity: high
    evidence:
      - >-
        M3-P17. Criterion 17.2 requires: "an existing account whose stored
        number would FAIL the validity test of M3-P14 criterion 14.3 is NAMED
