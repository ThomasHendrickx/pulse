  - id: P17-009
    severity: high
    evidence:
      - >-
        M3-P17, and the other half of finding P14-001. Criterion 17.2's
        duplicate check is scoped to numbers a household TYPES: "a typed row
        whose CANONICAL form equals the canonical form of an account the
        household already holds is refused with a named error ... rather than
        creating a second Account for one real account".
      - >-
        Hazard H17.4 scopes it the same way: "A pre-existing household RE-TYPES
        its own account number canonically, the stored row holds a spaced
        rendering, the unique index does not fire, and one real account becomes
        two rows whose rings may disagree."
      - >-
        The duplicate does not need anyone to type. It is produced by the
        import path itself: the delimited parse stores an account cell verbatim
        and the Belfius PDF template compacts it
        (belfius-current-account-template.ts:90), while
        src/modules/accounts/adapters/account-repository.ts:56 through :58
        matches the stored string exactly, so importing one real account
        through both paths has created two Account rows since long before this
        work started.
      - >-
        Neither phase detects or repairs a pair that already exists. M3-P14
        refuses the import if finding P14-001's edit is taken, which stops the
        harm and does not remove it. M3-P17 refuses new typed duplicates and
        says nothing about the pair the household is already holding, so the
        household ends the second phase still holding one account as two rows,
        with no path to merge them, and the ring of whichever row wins still
        deciding what its statements mean.
      - >-
        This is the population the split exists to serve, and it is the one
        state in that population that neither phase's criteria construct.
    concrete-edit: >-
      Add to M3-P17's criterion 17.2, after the typed-duplicate clause: "AND A
      DUPLICATE THAT ALREADY EXISTS IS FOUND AND REPAIRED, because the import
      path can create one with nobody typing anything: the delimited parse
      stores an account cell verbatim
      (src/modules/import/domain/parse-statement.ts:114 through :123) while the
      Belfius template compacts it
      (belfius-current-account-template.ts:90) and the lookup at
      src/modules/accounts/adapters/account-repository.ts:56 through :58
      matches stored strings exactly, so one real account imported through both
      paths is two rows today. Over a household seeded with such a pair, the
      accounts route NAMES the pair to the household as one account held twice
      and offers to merge them into the row the household chooses, moving the
      other row's transactions onto it and deleting the emptied row, in one
      unit of work followed by the published recompute; an application test
      asserts the merge moves every transaction, leaves no Account row without
      transactions behind it, writes no raw transaction column other than the
      account reference, and that the resulting month figures equal those of a
      household that only ever held one row. A phase that only refuses NEW
      duplicates fails this criterion." Restate hazard H17.4 to cover both
      origins, typed and imported, and add H17.8: "The two phases ship, the
      household stops being able to create a duplicate, and the duplicate it
      was already holding is never named, so one real account stays two rows
      whose rings decide differently what its statements mean", addressed-by
      criterion 17.2.
    analysis: >-
      The plan reasoned about the duplicate from the direction it was
      discovered, which was a household typing a number at a new screen, and
      assigned it to the phase that owns typing. Its actual origin is two
      writers of one column that have disagreed since before this work started,
      which puts an instance of it in the owner's data now rather than
      hypothetically. Naming it is cheap and the merge is real work, and I would
      rather see the merge scoped and costed here than see both phases ship
      with the pre-existing pair unmentioned, because after P14-001's refusal
      lands the household will meet it as a blocked import with no remedy.
