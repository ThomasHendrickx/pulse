    concrete-edit: >-
      Add to criterion 14.6, after the sentence on cards never being entered at
      setup: "AND A CARD'S RING IS NOT AN ANSWER, IT IS A DEFINITION, which is
      what lets criterion 14.5's grep delete the ring control without leaving
      `NewAccount.role` (src/modules/accounts/application/ports.ts:16 through
