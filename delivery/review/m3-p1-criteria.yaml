      same aria-current attribute the e2e asserts, so the visible and
      accessible states cannot drift. Both extras were declared in the
      work history the moment found and the plan was amended on main
      BEFORE the scope gate (commit fe9bafd, "plan: declare M3-P1
      deviation extras before the scope gate", adding exactly these two
      paths to the phase's extras), matching the cf8d772 and 95c7241
