      not modified.
    serves-plan-intent: true
    reasoning: >-
      The plan's own step 1 makes the listing conditional: "a missing
      token is added to styles/tokens.css first". No token was missing;
      every declaration in the new chrome resolves to an existing token,
      which I verified by reading the diff hunk by hunk
