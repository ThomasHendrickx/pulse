      npm run build EXIT=1, the next/headers Server Component error),
      so the island is forced, and it is built exactly the way the
      criterion's pin demands: no literal testid, no copy, props only,
      which my four grep-pin runs confirm. globals.css: the file where
      every existing app-shell class lives; the new rules are
