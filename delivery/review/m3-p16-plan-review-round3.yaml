  - id: R3-M3P16-02
    severity: high
    analysis: |-
      CRITERION 16.3 DEMANDS A PROOF THAT CRITERION 17.2 FORBIDS THE INSTRUMENT
      FROM CARRYING, SO THE PROOF IS NECESSARILY A SENTENCE THE IMPLEMENTER
      WRITES. This is a tension between the two phases introduced by the split,
      and neither phase can see it alone.

      16.3 refuses a preview or branch deployment by name and requires the record
      to "name the origin, state that it is the production origin and not a
      preview, and state where that origin came from". 17.2 requires the route's
      body to carry the commit "and no other: no OTHER environment value", with a
      test over the parsed key set and a grep showing the route reads exactly one
      environment variable. The platform value that distinguishes a production
      deployment from a preview is an environment value, and M3-P17's own
      grounding names it in the grep it ran. So the one field that could settle
      16.3's question is the one field 17.2 makes it a defect to add.

      THE NEXT-EASIEST WRONG WAY, which is what was asked for, and it is easier
      than the intended path rather than harder. The implementer pushes its own
      branch, `claude/m3-p16-rederivation-deployed-run`, cut from a trunk that
      already carries the M3-P12 merge. The platform builds a preview for it
      automatically. The implementer fetches that preview's URL, receives a 200
      and a sha, and that sha IS a descendant of the M3-P12 merge, so
      `git merge-base --is-ancestor` passes in the correct argument order with a
      real quoted command line and a real exit code. The record then names the
      origin, states it is production, and states where it came from. Every
      clause of 16.3 is satisfied with genuine captured artefacts and no
      fabrication anywhere, while production may still be serving a build that
      predates the merge, which is hazard H16.4 and the run then rewrites the
      owner's patterns under a matcher computing the old keys.

      THE CRITERION ALREADY DESCRIBES THIS ATTACK AND ANSWERS IT WITH AN
      ATTESTATION. Its own text says "A preview deployment of a branch cut from a
      trunk that already carries the M3-P12 merge answers with a descendant sha
      while production may still be serving a build that predates it, which is
      hazard H16.4 passing this criterion." Naming the attack and then requiring
      the implementer to assert it did not happen is not closing it. Compare what
      the same criterion does with the ancestor test, where it refuses to accept
      an exit code without the argument order attached: that is a real check, and
      it shows the criterion knows the difference.

      AND THE ORIGIN'S PRIMARY SOURCE IS EMPTY. Step 1 TWO says the production
      origin "is taken from the phase work history where a previous deploy-verify
      recorded it, and otherwise obtained from the owner". Searched: no
      deploy-verify anywhere in delivery/work-history records a production
      origin. Every PLAYWRIGHT_BASE_URL in the tree is a loopback address. So the
      plan offers two sources where there is one, and the one that exists is an
      unrecorded conversation.
    evidence:
      - |-
        The demand: criterion 16.3, "A RESPONSE FROM A PREVIEW OR BRANCH
        DEPLOYMENT DOES NOT MEET THIS CRITERION, and the record must show which
        it was rather than leaving the URL to imply it: it names the origin,
        states that it is the production origin and not a preview, and states
        where that origin came from, since this repository records none and this
        fleet cannot read the platform."
      - |-
        The prohibition: criterion 17.2, "The response body carries that one
        field and no other: no OTHER environment value, no host, no connection
        string, no header dump, asserted by a test over the parsed response's key
        set, and grep of the route shows it reads exactly one environment
        variable."
      - |-
        M3-P17's own grounding names the deployment-environment variable among
        the values it grepped for and did not find, so the plan is aware of it
        and excludes it: the grep list is VERCEL_GIT_COMMIT_SHA, VERCEL_URL,
        VERCEL_ENV, commitSha and buildId.
      - |-
        The criterion states the attack against itself in its own text: "A
        preview deployment of a branch cut from a trunk that already carries the
        M3-P12 merge answers with a descendant sha while production may still be
        serving a build that predates it, which is hazard H16.4 passing this
        criterion."
      - |-
        The primary source named for the origin does not exist. Searched over
        delivery/work-history for a recorded deployed origin: every
        PLAYWRIGHT_BASE_URL occurrence is http://127.0.0.1:3000 (m3-p6-notes.md,
        m3-p7.yaml at several lines), and no entry records a production URL. The
        deployed URL is referred to but never written down (m1-p1.yaml:385,
        m3-p2.yaml:849 and :1019).
      - |-
        The comparison that shows the criterion can do better when it wants to:
        the same criterion refuses "an exit code with no arguments attached to
        it" for the ancestor test and requires the command line as run. It applies
        that standard to git and an attestation standard to the origin.
    concrete-edit: |-
      Make the instrument carry the discriminator instead of the implementer
      asserting it. In delivery/plan/pulse-v02.yaml:

      In criterion 17.1, replace "its single field" with "its two fields" and add:
      "The response also carries the DEPLOYMENT ENVIRONMENT the build is running
      in, read from the platform's environment variable for it, with the same
      documented absent-value marker when it is unset. It is a build-level fact
      exactly as public as the commit sha and names nothing about any household."
      In criterion 17.2, replace "carries that one field and no other" with
      "carries those two fields and no others" and replace "reads exactly one
      environment variable" with "reads exactly two environment variables, the
      build commit and the deployment environment, and no third". In criterion
      17.4 leave the file count unchanged, since this is one more line in the same
      route.

      In criterion 16.3, replace "it names the origin, states that it is the
      production origin and not a preview, and states where that origin came
      from" with: "the response body's deployment-environment field reads
      production, quoted from the captured body beside the sha, and a body whose
      environment field reads preview or development, or carries the absent-value
      marker, does not meet this criterion whatever the URL was; the record names
      the origin and where it came from beside it."

      In step 1 TWO, delete the work-history source, which does not exist:
      replace "it is taken from the phase work history where a previous
      deploy-verify recorded it, and otherwise obtained from the owner and
      recorded there with the answer" with "no deploy-verify in this delivery has
