findings:
  - id: R3-M3P16-01
    severity: critical
    analysis: |-
      THE PHASE'S CENTRAL ACT IS PROBABLY NOT EXECUTABLE FROM A FLEET CONTAINER,
      THIS IS MEASURED RATHER THAN PREDICTED, AND IT IS MEASURED IN THIS
      REPOSITORY BY A CLOSED PHASE THAT FILED A DEVIATION AGAINST THE EXACT
      CLAUSE M3-P16 NOW REPEATS.

      Every database step of this phase is pinned the same way: "a connection
      string pinned explicitly to the pulse deployed project's session pooler".
      M3-P6 was given that identical sentence, and its work history declares a
      deviation against it with the reason stated flatly: no pulse database
      password exists in this container or in the repository. It measured what
      it needed through the Supabase management API instead, pinned to the
      project by its ref, and recorded that this is the route every previous
      deployed-schema step in this delivery used. That deviation was accepted
      and the phase closed on it.

      THE HALVES SEPARATE, AND THAT IS WHY THIS IS CRITICAL RATHER THAN A
      REPEATED WORDING DEFECT. The read-only halves of M3-P16, step 4's BEFORE
      counts, step 8's AFTER counts and criterion 16.1's named query, can
      deviate to the management API exactly as M3-P6 did: they are SQL, and the
      management API runs SQL. The writing half cannot. Steps 5 and 7 invoke the
      routine through the package.json entry point, that routine reaches the
      database through Prisma, and Prisma takes a connection string with a
      password. There is no management-API transport for it. So the one act the
      phase exists to perform is the one act the recorded credential state does
      not permit, and no step, criterion or hazard class in either phase says so.

      NOW COMBINE IT WITH THE TERMINAL STATES, WHICH IS WHERE IT BECOMES A HOLE
      RATHER THAN A RISK. Criterion 16.1's blocked branch fires on exactly one
      thing: the entry condition, which is the build stamp. The build stamp is
      fetched over HTTPS, this container has proxied HTTPS, and the stamp will
      answer. So the likely real sequence is that the fetch succeeds, the sha is
      a descendant, THE ENTRY CONDITION IS MET, and the blocked branch is
      therefore expressly inapplicable by its own opening words, "WHERE THE
      ENTRY CONDITION IS NOT MET". The implementer then cannot open a connection
      and the phase has no branch at all: not met, not blocked, not failed. That
      is the same terminal-state hole this thread has now produced three times,
      reappearing at a boundary nobody was watching because the last two
      instances were about the deploy.

      THE PHASE ALSO NAMES THE WRONG UNVERIFIED PREMISE. Step 1 THREE declares
      one premise it cannot settle and picks the platform build stamp, which is
      genuinely unsettleable from here. It does not name the credential, which
      is not merely unsettled but already SETTLED IN THE NEGATIVE by a closed
      phase's declared deviation. Naming the harder unknown while omitting the
      known blocker is how an implementer arrives at step 5 with no warning.
