      this container at all. M3-P6 filed a deviation against this phase's own
      pinning clause because no pulse database password exists in this container
      or in the repository (delivery/work-history/m3-p6.yaml, deviations[0]), and
      every previous deployed-schema step in this delivery measured through the
      Supabase management API pinned by project ref instead. Establish which of
      the two transports this container actually has BEFORE anything else, and
      record it with the command."

      TWO, split the transports explicitly in criterion 16.1: "The read-only
      counts this criterion requires MAY be taken through the Supabase
      management API pinned to the pulse project by its ref, which is the
      transport M3-P6's accepted deviation established and which runs the named
