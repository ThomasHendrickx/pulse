    concrete-edit: |-
      Three edits in delivery/plan/pulse-v02.yaml, all in M3-P16.

      ONE, add a fourth establish-item to step 1, before the others, and demote
      the premise it currently names: "FOUR, AND IT IS SETTLED IN THE NEGATIVE
