  - id: R3-M3P16-03
    severity: high
    analysis: |-
      CRITERION 16.1's BLOCKED BRANCH ENUMERATES ITS OWN TRIGGERS, AND AN
      ENUMERATION IS A LIST OF THE FAILURES SOMEONE THOUGHT OF. The branch opens
      "WHERE THE ENTRY CONDITION IS NOT MET, which is either that the build stamp
      returned a sha that is not a descendant of the M3-P12 merge OR that it
      returned no sha at all (a 404, any non-200, or the absent-value marker)".
      The words "which is either ... OR" are definitional, so a failure outside
      the pair is outside the branch.

      THE STATE THE COORDINATOR ASKED ABOUT IS CLOSED AND THE ONE BESIDE IT IS
      NOT. An ask answered with "it will deploy tomorrow" IS handled: step 2
      bounds the wait at one ask and then fetches again, and a route still
      returning no sha lands on the second enumerated trigger. That is genuinely
      fixed. But the wait that has no bound is the OTHER ask, in step 1 TWO,
      where the production origin is obtained from the owner. Nothing bounds it,
      no criterion mentions it, and an owner who does not answer leaves the
      implementer with no origin to fetch, therefore no fetch, therefore no 404,
      no non-200 and no marker. The record can truthfully carry "every fetch
      made" because none was. Neither enumerated trigger fires and the phase is
      open with no branch.

      TWO ASKS, ONE BOUND. The phase bounds the deploy ask in two places, step 2
      and criterion 16.3, each explaining why a wait nobody ends is
      indistinguishable from a phase that quietly stopped. That reasoning applies
      word for word to the origin ask, and the origin ask did not get it. Finding
      R3-M3P16-01 supplies a third instance from a different direction, an
      unreachable database with a reachable stamp, which shows the shape is not
      one oversight but a consequence of enumerating.

      A FOURTH INSTANCE, cheap to state: the route answers 200 with a string that
      is neither the marker nor an object this clone can resolve, for example a
      sha from a build of a fork or a truncated value. `git merge-base
      --is-ancestor` then exits 128 with a fatal error rather than 0 or 1. It did
      not return "no sha at all", and it did not return "a sha that is not a
      descendant", because nothing was tested. A conscientious implementer will
      read it into the first trigger; the criterion should not require charity.
    evidence:
      - |-
        The enumeration, quoted from criterion 16.1: "WHERE THE ENTRY CONDITION
        IS NOT MET, which is either that the build stamp returned a sha that is
        not a descendant of the M3-P12 merge OR that it returned no sha at all (a
        404, any non-200, or the absent-value marker) after the one ask criterion
        16.3 bounds the wait with".
      - |-
        The deploy ask is bounded twice. Step 2: "THE WAIT IS BOUNDED BY THAT ONE
        ASK, because neither the merge, the deploy, nor the platform setting that
        stamps a build is in this phase's power". Criterion 16.3: "THE WAIT IS
        BOUNDED AND ITS BOUND IS RECORDED".
      - |-
        The origin ask is bounded nowhere. Step 1 TWO: the production origin "is
        taken from the phase work history where a previous deploy-verify recorded
        it, and otherwise obtained from the owner and recorded there with the
        answer". No sentence in the phase says what happens if that answer does
        not come, and no criterion names the state.
      - |-
        The citation the phase uses to justify bounding the deploy ask supports
        bounding this one identically: delivery/work-history/m1-p1-notes.md:26
        records "gh CLI unauthenticated; per dispatch: no push, no deploy from
        here. Criterion 0.6 and every deployed-environment assertion is deferred
        to deploy-verify after merge." Verified: the citation resolves and says
        what the phase uses it for.
      - |-
        The 128 case is real: `git merge-base --is-ancestor` exits 0 or 1 for two
        resolvable commits and errors otherwise, so an unresolvable value
        produces neither of the criterion's two outcomes.
    concrete-edit: |-
      Stop enumerating. In delivery/plan/pulse-v02.yaml, criterion 16.1, replace
      "WHERE THE ENTRY CONDITION IS NOT MET, which is either that the build stamp
      returned a sha that is not a descendant of the M3-P12 merge OR that it
      returned no sha at all (a 404, any non-200, or the absent-value marker)
      after the one ask criterion 16.3 bounds the wait with," with: "WHERE THE
      RUN IS NOT MADE, FOR ANY REASON AT ALL, this criterion is met instead by a
      blocked record and the reason is named in it rather than matched against a
      list. The list below is what was foreseen and is not the boundary: a sha
      that is not a descendant of the M3-P12 merge; no sha at all, meaning a 404,
      any non-200 or the absent-value marker, after the one ask criterion 16.3
      bounds the wait with; a returned value this clone cannot resolve, so the
      ancestor test errors rather than answering; no production origin to fetch
      from; and no database credential to run through (finding R3-M3P16-01). ANY
      OTHER REASON IS ALSO THIS BRANCH, and a phase left open because its
      situation was not on a list is the failure this sentence replaces."

      And bound the second ask in step 1 TWO, in the phase's own words: append
      "THIS ASK IS BOUNDED EXACTLY AS THE DEPLOY ASK IS, at one: the origin is
      asked for once and recorded with the answer, and where no answer comes the
      phase records BLOCKED ON THE DEPLOY under criterion 16.1 naming the missing
      origin as the reason, because a wait nobody ends is indistinguishable from
      a phase that quietly stopped."
  - id: R3-M3P16-04
    severity: medium
    analysis: |-
      STEP 7 MAKES A FALSE STATEMENT ABOUT A WRITE AGAINST THE OWNER'S LIVE
      DATABASE, IN THE PHASE WHOSE WHOLE SUBJECT IS BOUNDED WRITES. It says of
      the idempotence invocation: "This is not another migration and not another
      chance to write". Read against the routine, the second half is wrong.

      The routine's write gate is one boolean, and the recompute is inside it.
      `applied` is true whenever the exit code is 0 and the run is not a dry run,
      and the block it guards performs the pattern updates, the rule inserts AND
      a full `deps.recompute(context)`. The idempotence invocation is by
      construction a clean, non-dry run, so it is `applied yes`, it enters the
      write block, and it runs a second complete recompute against the owner's
      deployed data. What is zero on that invocation is patterns rewritten and
      rules added, which is exactly what criterion 16.1 asks for and gets. What
      is not zero is writes.

      WHY IT MATTERS BEYOND ACCURACY. The recompute rebuilds interpretation
      wholesale and a null write is how an assignment no rule supports stops
      applying, which is decision D-46's own account of the deploy window. If the
      owner uses the application between the two invocations, the second
      recompute is a real write over live state that the phase has told its
      implementer is not a write at all, so nobody times it, nobody records it,
      and it appears in no count. The related behaviour was already flagged once
      against the routine, as CR-M3P12-08, for being undocumented; the plan has
      now documented it backwards.
    evidence:
      - |-
        The gate and what it guards:
        src/modules/merchants/application/rederive-rules.ts:528, `const applied =
        exitCode === 0 && input.dryRun !== true;`, then the block at :529 through
        :537 performing updateRulePattern for each pending update, upsertRule for
        each pending insert, and `await deps.recompute(context);` as its last
        statement, all inside `if (applied)`.
      - |-
        The step's claim: M3-P16 step 7, "This is not another migration and not
        another chance to write: under decision D-45's already-migrated guard
        every pattern now carries a namespace, so this invocation must report
        zero patterns rewritten and zero rules added."
      - |-
        The invocation qualifies as applied by construction: step 7 anchors it
        after the invocation reporting applied yes and criterion 16.1 requires it
        to report zeroes, which is a clean non-dry run, which is exactly
        `exitCode === 0 && dryRun !== true`.
      - |-
        The consequence is decision D-46's own, in the plan: a recompute rebuilds
        interpretation wholesale and "a null write is how an assignment no rule
        supports stops applying (src/modules/ledger/application/ports.ts:53
        through :56)".
      - |-
        The behaviour has been raised before as undocumented, in the clean-room
        criteria verdict on origin/claude/m3-p12-rev-crit, finding CR-M3P12-08,
        which records that the recompute runs unconditionally before the report
        is built at src/modules/merchants/application/rederive-rules.ts:427.
    concrete-edit: |-
      In delivery/plan/pulse-v02.yaml, M3-P16 step 7, replace "This is not
      another migration and not another chance to write" with: "This is not
      another migration, and it is not a second chance to change a DECLARATION:
      under decision D-45's already-migrated guard every pattern now carries a
      namespace, so this invocation rewrites no pattern and adds no rule. IT DOES
      WRITE, and the step says so rather than letting an implementer believe a
      read is happening: the routine's write gate is one boolean covering the
      updates, the inserts AND the recompute
      (src/modules/merchants/application/rederive-rules.ts:528 through :537), so
      a clean non-dry invocation runs a second full recompute over the deployed
      household. Record that it did, beside the two zeroes, and take the AFTER
      counts of criterion 16.1 after THIS invocation rather than between the two,
      so the numbers describe the state the phase actually leaves behind."
  - id: R3-M3P16-05
    severity: medium
    analysis: |-
      BLOCKED ON THE DEPLOY IS A TERMINAL STATE WITH NO SUCCESSOR, SO A CORRECTLY
      BLOCKED PHASE CLOSES AND THE MIGRATION IT OWNS BECOMES UNOWNED AGAIN. This
      is the thread's original defect in its final form: an obligation with no
      phase that can meet it. Round one moved the obligation into a phase that
      could. This round gave that phase an honest way to stop. Nothing yet says
      what stopping leaves behind.

      Trace it. M3-P16 is the only phase in this plan that owns the deployed run.
      It records BLOCKED ON THE DEPLOY, which criteria 16.1 and 16.3 make a
      legitimate met outcome and not a failure, and the phase closes. Hazard
      H16.1, the routine shipped and never run so the owner's naming matches
      nothing, is live and now belongs to nobody: no criterion in any phase
      requires it to be re-entered, no open-question in the plan records it, and
      the phase gate has been passed. The window decision D-46 describes stays
      open indefinitely and the record of that is inside a closed phase's work
      history, which is the one place nobody rereads.

      This is cheap to close and it must be closed in the plan rather than in
      dispatch mechanics, which DR-0029 puts outside the owner's concern. What
      the owner would feel is the difference between a naming that starts working
      and one that never does; what remains owed is a delivery fact, not a
      scheduling one.
    evidence:
      - |-
        The blocked outcome is a met outcome: criterion 16.1's branch ends "the
        phase recorded as BLOCKED ON THE DEPLOY rather than met or failed", and
        step 3 states "a correctly stopped phase is not a failed one".
      - |-
        Nothing carries the remainder. Searched the plan: no open-questions entry
        names the deployed run, no other phase's criteria mention it, and
        M3-P16's conflicts-with names only ordering against M3-P12, M3-P17,
        M3-P9 and M3-P13.
      - |-
        The hazard that stays live is declared in the phase itself and addressed
        by the criterion whose blocked branch does not perform it: H16.1, "The
        routine is shipped and never run, so the migration is described rather
        than performed", addressed-by criterion 16.1.
      - |-
        The likelihood is not small on the evidence of this round: finding
        R3-M3P16-01 gives a measured reason the run may be impossible from a
        fleet container, and hazard H16.8 already contemplates a platform that
        never stamps a build at all.
    concrete-edit: |-
      In delivery/plan/pulse-v02.yaml, append to criterion 16.1's blocked branch:
      "A BLOCKED RECORD ALSO STATES WHAT REMAINS OWED AND WHAT WOULD DISCHARGE
      IT, in one paragraph and by name: that the deployed run of the routine is
      still owed, that hazard H16.1 is live until it is made, the exact condition
      whose change would let this phase be entered again, and the owner-visible
      consequence of leaving it, which is that the naming the owner already made
      goes on matching nothing. A blocked record that reads as a closed phase
      does not meet this criterion." And add one entry to the plan's
      open-questions naming the deployed run as owed by M3-P16, to be struck when
      a work history records the run as MET, so the remainder lives in the plan
      rather than only in a closed phase's history.
  - id: R3-M3P17-06
    severity: low
    analysis: |-
      NEITHER PHASE NAMES THE MARKER, AND THE TWO PHASES HAVE TO AGREE ON IT
      ACROSS A MERGE BOUNDARY. M3-P17 calls it "the documented marker" and
      constrains its shape: a fixed lowercase word containing a character that is
      not a hexadecimal digit. M3-P16 calls it "the absent-value marker" and
      makes it one of the triggers for a terminal state. No plan text fixes the
      string, so M3-P17's implementer chooses it and M3-P16's implementer must go
      and read the deployed route to learn what to compare against.

      This is small and it is not nothing. The two phases are implemented by
      different agents at different times, and M3-P16's implementer is deciding a
      terminal state on a string equality against a value the plan never states.
      The shape constraint means a mistaken value cannot be read as a commit,
      which is the important half and it holds; what does not hold is that
      M3-P16's implementer can write its comparison before the route exists. The
      cost of fixing it is one word in each phase.
    evidence:
      - |-
        M3-P17 criterion 17.1 constrains the shape and never states the value:
        "its single field is exactly the documented marker, which is a fixed
        lowercase word containing a character that is not a hexadecimal digit".
      - |-
        M3-P17 step 2 does the same: "a documented absent-value marker when the
        variable is unset or empty" with the non-hexadecimal constraint restated.
      - |-
        M3-P16 depends on the value in a terminal state without naming it:
        criterion 16.1's blocked branch names "the absent-value marker" among its
        triggers, and step 2 does likewise.
      - |-
        Searched both phases and the whole plan: no literal candidate string is
        given anywhere, so the value exists only in code that has not been
        written.
    concrete-edit: |-
      Fix the string in the plan so both phases can be written against it. In
      delivery/plan/pulse-v02.yaml, criterion 17.1, replace "exactly the
      documented marker, which is a fixed lowercase word containing a character
      that is not a hexadecimal digit" with "exactly the marker `unstamped`,
      which this plan fixes here so both this phase and M3-P16 are written
      against one value rather than against each other's code: it is lowercase,
      it is a fixed word, and it contains `u`, `n`, `s`, `t`, `m` and `p`, none
      of which is a hexadecimal digit, so no test and no reader can take it for a
      commit". Make the same substitution in M3-P17 step 2, and in M3-P16
      criterion 16.1 and step 2 replace "the absent-value marker" with "the
      absent-value marker `unstamped` that criterion 17.1 fixes".
