      - Green in this review's npm test run on b324d87.
    met: true
  - id: "12.4"
    quote: >-
      DIFFERENT COUNTERPARTIES STAY DIFFERENT WHERE THE STORED VALUES DIFFER
      ... the 12 identity keys partition the 24 rows exactly as THE
      GENERATOR'S OWN INPUT RECORD says, row by row ... A mapping transcribed
      from counterpartyIdentity's own output does not meet this criterion.
    evidence:
      - test/domain/counterparty-identity.test.ts:109 and test/domain/counterparty-identity.test.ts:140 carry the two halves.
      - test/domain/counterparty-identity.test.ts:178 asserts regenerating the fixture reproduces the PDF and the record byte for byte, which is what stops the record being hand-edited.
    met: true
  - id: "12.5"
    quote: >-
      THIS PHASE STRIPS NOTHING NEW ... the identity key produced by this
      branch is exactly the lowercase literal "descriptor:" followed by a
      suffix BYTE-IDENTICAL to the key the baseline commit produces for the
      same row ... And git diff of the baseline against this branch shows no
      change to CARD_RAIL_PREFIX ... or CITY_TOKENS.
    evidence:
      - test/domain/counterparty-identity.test.ts:217 compares against the committed baseline table over every parsable committed fixture.
      - test/domain/counterparty-identity.test.ts:187 asserts normaliseCounterparty never emits a lowercase letter, which is what makes the two key spaces disjoint by construction.
      - >-
        git diff 7f4aafb..b324d87 -- src/modules/merchants/domain/normalise-counterparty.ts
        run by this review shows changes to the header comment only and no
