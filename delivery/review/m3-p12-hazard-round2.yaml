deviations-judged:
  - deviation: >-
      Criterion 12.17, the half requiring the phase work history to record the
      command actually run AGAINST THE DEPLOYED DATABASE with its exit code
      and its printed before-and-after assignment-set sizes.
    serves-plan-intent: true
    reasoning: >-
      The plan's own decision D-46 makes the order forced rather than chosen:
      the routine imports the new derivation, so it cannot run against a build
      that does not carry it, and this branch is not deployed. Running it now
      would open exactly the window D-46 describes with its halves reversed.
      Declaring the run as owed at deploy time is the only honest state, and
      the invocation half of the criterion is met and asserted.
  - deviation: >-
      Criteria 12.7, 12.8 and 12.9, which speak of "a seeded database" holding
      MerchantRule rows written under the baseline derivation.
    serves-plan-intent: true
    reasoning: >-
      The in-memory fake is what makes criterion 12.9's assertion, that the
      routine issues no write against transactions at all, observable; against
      a real database it would need a query log. The deviation is declared
      rather than implied, and the fix round added the one thing the fake
      cannot witness, the adapter's own write path, at
      test/e2e/merchant-rule-write.spec.ts:32. The residual cost is real and is
      finding HZ-M3P12-R2-01: the fake models no unique key, so the one
      constraint that can make a decided write fail is invisible to every test
      in the fast gate.
  - deviation: "files-to-touch, which does not name .gitignore."
    serves-plan-intent: true
    reasoning: >-
      Widening the ignore rule is the only thing that stops the next worktree
      repeating the tracked-symlink accident, and the fix round's correction is
      the part that matters: it says plainly that the blob is still reachable
      in the branch's pushed history and names the orchestrator's decision not
      to rewrite. A reader can no longer conclude from the word removed that
      the path is gone.
  - deviation: >-
      files-to-touch, which does not name src/app/globals.css, test/e2e/,
      messages/en.json, messages/nl.json, messages/fr.json or
      src/app/(app)/merchants/page.tsx.
    serves-plan-intent: true
    reasoning: >-
      Criterion 12.18 requires a refusal to REACH THE READER, which cannot be
      built inside the declared set. Declaring the six files is right, and so
      is correcting the plan's conflicts-with entry for M3-P9, which asserted
      as CHECKED an overlap-free set that the built change contradicts. I read
      the plan edit at delivery/plan/pulse-v02.yaml in this branch: it changes
      a conflicts-with note and touches no acceptance criterion and no hazard
      class, which is the line an implementer must not cross and did not.
  - deviation: >-
      Criterion 12.1's composition clause, "at least 8 rows carry none",
      under its strict reading.
    serves-plan-intent: true
    reasoning: >-
      The collision with plan step 7 is arithmetic and the implementer shows
      it: the two truncation-attack rows carry an account field and take the
      descriptor basis, so rows with no account field cap at 6 while the
      criterion fixes the descriptor-basis count at 8. Asserting 8
      descriptor-basis rows is the only reading the plan admits, no code was
      contorted, and the orchestrator owns the amendment.
  - deviation: >-
      Criterion 12.5's committed baseline table, test/fixtures/baseline-descriptor-keys.json.
    serves-plan-intent: true
    reasoning: >-
      Adding an already-invented PAN-shaped substring to the allow list with
      its provenance is what the privacy rule requires, and recording it
      beside the environment warning about the gate's alternation is more
      useful than the entry itself.
  - deviation: >-
      Step 13, "run the full gate before calling the slice done", read as one
      clean run of every gate.
    serves-plan-intent: true
    reasoning: >-
      The re-run of one spec is recorded with what failed and why rather than
      summarised away, which is the standard this project asks for. This
      review's own full Playwright run on b324d87 exits 0 with 54 passed and
      no retries, so the gate is clean on this head without a re-run.

hazard-classes-addressed:
  - class-id: H12.1
    probed: >-
      I attacked the account basis rather than reading its gate. I ran the
      shipped trust predicate over invented values, confirmed the three tests
      compose as claimed (empty after compaction, unknown or wrong country
      length, mod-97), and confirmed the derivation consults nothing else on
      the account branch
      (src/modules/merchants/domain/counterparty-identity.ts:299 through
      :306). I then looked for a way to reach the account branch with a value
      that is not a whole account: the only producer is the importer's scrape,
      and the branch's own pinned counterexample at
      test/domain/counterparty-identity.test.ts:510 is the one that survives.
    cleared-because: >-
      Every enumerated mechanism fails closed to the descriptor basis, which
      is today's behaviour for that row, and refusal costs nothing. The one
      surviving mechanism is the BE-prefixed over-long spaced token, which the
      length test cannot reach and mod-97 catches only 96 times in 97; it is
      carried under H12.14 with finding HZ-M3P12-R2-06 rather than cleared
      here.
  - class-id: H12.2
    probed: >-
      I checked that the fixture is not the only witness and that the real
      numbers come from the same committed code path. The harness is
      test/fixtures/measure-identity-convergence.ts, it is exercised over the
      committed fixtures by the fast gate
      (test/application/counterparty-identity-surfaces.test.ts:329), and the
      work history quotes its output for both real documents with the command.
      I did not open the real documents.
    cleared-because: >-
      The real-month figures are recorded against a path anyone can run, both
