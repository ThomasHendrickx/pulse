kind: verdict
phase: M3-P12
verdict: FIX-ROUND-NEEDED
produced-by: claude-opus-5
framing: fix-round
review-contract: hazard

findings:
  - id: HZ-M3P12-R2-01
    severity: high
    evidence:
      - >-
        Pass one decides its rewrite against an in-memory array that does not
        model the declaration table's own unique key. The collision test at
        src/modules/merchants/application/rederive-rules.ts:352 blocks only
        when the claimant belongs to a DIFFERENT merchant
        (src/modules/merchants/application/rederive-rules.ts:353); a claimant
        of the SAME merchant falls through to
        src/modules/merchants/application/rederive-rules.ts:365, which queues
        an update to a pattern another rule of the same kind already holds.
        prisma/schema/merchants.prisma:90 is @@unique([householdId, kind,
        pattern]), so Postgres refuses that update.
      - >-
        WITNESS, run by this review against the shipped routine with a fake
        repository that enforces the same unique key the schema declares and
        nothing else. Seed, all invented: rule R1 EXACT pattern ACME merchant
        M (a naming made before the deploy) and rule R2 EXACT pattern
        descriptor:ACME merchant M (a naming made inside decision D-46's
        window, which the routine's own header at
        src/modules/merchants/application/rederive-rules.ts:41 calls not
        hypothetical). Captured output, verbatim - THREW during apply: Unique
        constraint failed on the fields: (householdId, kind, pattern);
        repository calls: ["update R1 -> REJECTED unique(kind,pattern)
        already held by R2"].
      - >-
        WITNESS, partial application. Same routine, seed of three invented
        rules where the first rewrite is clean and the second collides.
        Captured output, verbatim - calls: ["update A-clean ->
        descriptor:FIRST COMMITTED","update B-clash REJECTED by
        unique(kind,pattern)"]; recomputes run: 0; and the table was left
        holding one migrated pattern and one un-migrated one. The apply block
        at src/modules/merchants/application/rederive-rules.ts:529 through
        :537 is a bare loop with no transaction around it, and the recompute
        at src/modules/merchants/application/rederive-rules.ts:536 is the
        last statement, so it never runs.
      - >-
        Nothing in the tree can see this. The fake the application tests bind
        reimplements the write rather than calling it and enforces no unique
        key (test/application/fake-import-world.ts:392 through :406), and the
        one live-Postgres test of the write path,
        test/e2e/merchant-rule-write.spec.ts:32, exercises the household
        filter and not the unique key.
    concrete-fix: >-
      In pass one, when the claimant found at
      src/modules/merchants/application/rederive-rules.ts:352 belongs to the
      SAME merchant, do not queue the update: the target pattern is already
      held by a live rule of the same kind and merchant, so the rewrite is
      redundant and the two rules are already one declaration in effect.
      Record the outcome with its own token (for example
      already-held-by-sibling) so the case is printed and counted rather than
      silent, and leave the source rule's pattern alone; it stays inert
      exactly as an unmatched pre-migration pattern already is, and deleting
      it is forbidden by decision D-39. Separately, wrap the apply block at
      src/modules/merchants/application/rederive-rules.ts:529 through :537 in
      one database transaction so that any write failure leaves the table as
      the run found it, which is what the routine's own contract at
      scripts/rederive-merchant-rules.ts:33 through :38 already promises for a
      blocked run and does not deliver for a failed one.
    analysis: >-
      This is the fix round's own shape turned against it. The round moved
      every decision onto a working copy so the routine could block before it
      writes, and the working copy is a plain array: it models rule identity,
      kind and pattern, and it does not model the one constraint the real
      table enforces on exactly those three fields. So the routine can reach
      the end of its decision phase clean, report exit 0 and applied, and then
      fail inside the write it promised was safe. The reachable seed is not
      exotic. Decision D-46 forces the code to deploy before the routine runs,
      assignMerchant writes a namespaced subject from the moment it deploys,
      and finding a merchant is by NAME
      (src/modules/merchants/application/assign-merchant.ts:126), so an owner
      who names the same group again inside that window lands a second rule on
      the same merchant with the exact pattern pass one is about to write.

  - id: HZ-M3P12-R2-02
    severity: medium
    evidence:
      - >-
        The write boundary validates the subject under compaction and stores
        it uncompacted. isTrustedCounterpartyAccount compacts internally
        (src/modules/merchants/domain/counterparty-identity.ts:266), so the
        gate at src/modules/merchants/application/assign-merchant.ts:120
        accepts a spaced or lowercase account, while
        src/modules/merchants/application/assign-merchant.ts:86 keeps the
        submitted string VERBATIM and
        src/modules/merchants/application/assign-merchant.ts:131 stores that
        string as the rule pattern. counterpartyIdentity only ever emits the
        compact uppercase form
        (src/modules/merchants/domain/counterparty-identity.ts:303), so the
        stored rule cannot match any key the derivation produces.
      - >-
        WITNESS, run by this review against the shipped use case with a
        recording fake. Invented account only. Captured output, verbatim -
        trust(ACCOUNT) = true; derived key from a spaced lowercase stored
        account = "account:BE68539007547034"; assignMerchant(spaced lowercase
        account subject).ok = true; stored pattern = "account:be68 5390 0754
        7034"; matchRules(derivedKey, [storedRule]) = undefined.
      - >-
        The descriptor basis has the same hole, because normaliseCounterparty
        uppercases. Captured output, verbatim - assignMerchant(lowercase
        descriptor subject).ok = true; stored pattern = "descriptor:acme
        bakery"; matchRules(descriptor:ACME BAKERY, [storedRule]) = undefined.
      - >-
        No test covers it. The write-boundary block at
        test/application/counterparty-identity-surfaces.test.ts:220 through
        :312 tests an un-namespaced subject, an empty remainder on both bases,
        a mod-97 failure and a valid subject, and every account subject it
        submits is already compact and uppercase
        (test/application/counterparty-identity-surfaces.test.ts:293).
    concrete-fix: >-
      Make the subject the writer stores the subject the writer validated. At
      src/modules/merchants/application/assign-merchant.ts:116 through :124,
      after the trust gate passes, rebuild the pattern as ACCOUNT_NAMESPACE
      plus compactAccount(account) and store that, so the stored key is the
      key counterpartyIdentity would derive. On the descriptor branch, refuse
      rather than repair: a descriptor subject that is not byte-identical to
      normaliseCounterparty of itself did not come from a rendered group, so
      return the existing unnamespaced-counterparty error or a new
      non-canonical-counterparty one. Add a test beside
      test/application/counterparty-identity-surfaces.test.ts:275 that submits
      a spaced lowercase form of a valid invented account and asserts either a
      refusal or a stored pattern equal to the derived key.
    analysis: >-
      Criterion 12.18 is met as written, and that is the point of raising it
      under the hazard contract rather than the criteria one: the criterion
      names the empty remainder and the trust gate, and this value fails
      neither. What it defeats is the criterion's stated PURPOSE, that the
      boundary refuse rather than silently write a rule that can never match
      anything. Ranked medium rather than high on reach: the only submitter in
      the shipped product is the hidden field at
      src/modules/merchants/ui/merchant-review.tsx:50, which carries the
      derived key, so the value has to arrive from a hand-made post or from a
      caller that does not exist yet. It will exist: the resolver header at
      src/modules/merchants/domain/merchant-rule.ts:19 reserves both broad
      kinds for the slice-5 accepted-answer path, which is precisely a writer
      that will hand this boundary a subject it did not render.

  - id: HZ-M3P12-R2-03
    severity: medium
    evidence:
      - >-
        The superset test's before-set is computed with the BASELINE key at
        src/modules/merchants/application/rederive-rules.ts:260, and
        baselineKey is the bare normalised text
        (src/modules/merchants/application/rederive-rules.ts:220). After the
        first run every stored pattern carries a namespace, and no namespaced
        pattern can match a bare key: EXACT compares unequal, PREFIX cannot
        start with a longer string, and PATTERN is anchored
        (src/modules/merchants/domain/merchant-rule.ts:118 through :140). So
        assignmentsBefore is empty on every run after the first, allLost at
        src/modules/merchants/application/rederive-rules.ts:500 is empty by
        construction, and the exit code at
        src/modules/merchants/application/rederive-rules.ts:517 can no longer
        be reached by the lost-assignment half of the condition.
      - >-
        WITNESS, run by this review. Same routine, invented seed, run twice.
        Captured output, verbatim - run 1 assignmentsBefore/After: 1 1 exit 0;
        run 2 assignmentsBefore/After: 0 1 exit 0; run 2 lostAssignments: 0.
      - >-
        The run still writes: applied is true on the second run
        (src/modules/merchants/application/rederive-rules.ts:528) and the
        recompute at src/modules/merchants/application/rederive-rules.ts:536
        is issued again, so the second run is not a read-only operation that
        happens to be safe, it is a write-authorised operation whose only
        safety check is dead.
    concrete-fix: >-
      Compute the before-set under the key each stored pattern is actually
      written against rather than under one fixed key. The smallest form that
      works: for each rule in the before set, use baselineKey when
      identityBasisOfKey(rule.pattern) is undefined and identityKey when it is
      not, so a fully migrated table's before-set is the live assignment set
      and the superset test keeps its meaning on every run. Assert it: extend
      the criterion 12.8 test at test/application/rederive-merchant-rules.test.ts
      so the second run's assignmentsBefore equals the first run's
      assignmentsAfter, which is the property the routine's own contract
      implies and which currently reads 0.
    analysis: >-
      No loss is reachable on a second run today, because pass one has nothing
      left to rewrite and pass two only adds a key no other rule of its basis
      can match. So this is not a merge or a loss; it is a guard that reports
      safe by construction, which is the shape this contract is asked to find.
      It matters when the table is not in the clean post-run state the routine
      assumes: a partially migrated table, which finding HZ-M3P12-R2-01 shows
      is reachable, or a hand-edited one. In both, the operator is told exit 0
      and the routine checked nothing.

  - id: HZ-M3P12-R2-04
    severity: medium
    evidence:
      - >-
        A bare-namespace group is rendered with no naming form and no reason.
        src/modules/merchants/ui/merchant-review.tsx:45 renders the form only
        when counterpartyText is present, and the review builder withholds
        that field for a bare key
        (src/modules/merchants/domain/merchant-review.ts:129 through :133).
        The label for such a group is the normalised counterparty text, which
        for these rows is the empty string
        (src/modules/merchants/domain/merchant-review.ts:103), so the row
        renders a blank label at
        src/modules/merchants/ui/merchant-review.tsx:36.
      - >-
        WITNESS, run by this review against the shipped builder with three
        invented rows, two carrying no counterparty text. Captured output,
        verbatim - the first group is {"key": "descriptor:", "label": "",
        "totalCents": -4000, "count": 2} with NO counterpartyText field, and
        unresolvedCount = 2. So the group is counted in the number the screen
        prints at src/modules/merchants/ui/merchant-review.tsx:144 as work the
        reader is being asked to do, and it is the one group the screen gives
        them no way to do it for.
      - >-
        It is reachable from the shipped importer, and the work history says
        so in its not-covered entry: optionalText at
        src/modules/import/domain/parse-statement.ts:120 stores a cell when it
        is not the empty string, so a blank counterparty-name cell is stored
        as whitespace and normalises away.
      - >-
        The refusal copy for this exact case already exists and is unreachable
        from this state: messages/en.json:127 explains it in one sentence, and
        the only route to it is a submission the screen offers no way to make
        (src/modules/merchants/ui/actions.ts:37).
      - >-
        The test that covers this asserts the withholding and not the
        explanation: test/domain/counterparty-identity.test.ts:344.
    concrete-fix: >-
      Render the reason where the form would have been. Give ReviewGroup a
      second optional field, for example unnameableReason, set by the builder
      at src/modules/merchants/domain/merchant-review.ts:129 in the same
      branch that withholds counterpartyText, and render it at
      src/modules/merchants/ui/merchant-review.tsx:45 as the else arm using
      the message already written at messages/en.json:127 and its two
      siblings. Give the group a non-empty label in the same place, since the
      normalised text is empty and a blank row is not a group a reader can
      recognise. Extend the test at
      test/domain/counterparty-identity.test.ts:344 to assert the reason is
      present, so the explained refusal is pinned rather than the silence.
    analysis: >-
      The round's own commit message states the intent, that the reader is not
      offered a naming that would be refused, and the code does exactly that.
      What it does not do is the other half: the reader meets a blank-labelled
      row carrying money, counted in the unresolved total, with no control and
      no sentence. That is a worse answer than the dead control only in the
      sense that it is quieter; it is the same failure to explain. No money
      moves and no merge happens, which is why this is medium and not high.

  - id: HZ-M3P12-R2-05
    severity: low
    evidence:
      - >-
        test/application/rederive-merchant-rules.test.ts:38 states, as a
        present-tense fact and inside a paragraph whose whole purpose is
        correcting an earlier false claim, that the adapter's write path is
        covered in the live-Postgres lane at
        test/db/merchant-rule-write.test.ts. That path does not exist: ls
        test/db returns db-guard.test.ts, redact.test.ts and triage.test.ts,
        and grep over the tree for the string test/db/merchant-rule-write
        returns that one comment line and nothing else.
      - >-
        The coverage is real and lives elsewhere, at
        test/e2e/merchant-rule-write.spec.ts:32, whose own header at
        test/e2e/merchant-rule-write.spec.ts:13 through :22 says at length
        that this tree has no live-Postgres lane in the fast gate and that the
        spec therefore lives in the Playwright gate. The two comments
        contradict each other.
    concrete-fix: >-
      Correct the path at test/application/rederive-merchant-rules.test.ts:38
      to test/e2e/merchant-rule-write.spec.ts and say the lane is the
      Playwright gate rather than a live-Postgres lane, matching the sentence
      the spec itself carries.
    analysis: >-
      Clause R-087. The sentence is the one a next implementer reads when
      deciding whether the routine's production write path has database
      coverage, which is exactly the question the paragraph exists to answer,
      and following it leads to nothing.

  - id: HZ-M3P12-R2-06
    severity: low
    evidence:
      - >-
        The two open residuals are named honestly and neither is sized in
        rows. The truncation residual is described at
        src/modules/merchants/domain/counterparty-identity.ts:234 through :252
        and in the work history's fix-round decision block, and no count
        appears anywhere: the number that would bound it, how many of the
        owner's rows carry a description token that continues the scrape's
        group grammar past three groups, is not measured. What IS recorded
        (work history finding (a)) bounds it: rows-with-account 11 of 39, and
        the phase's own root-cause block records 4 accounts appearing on 2 or
        more rows covering 9 rows, so at most 11 of 39 rows can hold a
        truncated value and at most 9 of 39 can be a merge caused by one.
      - >-
        The promotion-on-one-row residual is visible per run
        (src/modules/merchants/application/rederive-rules.ts:479 through :488)
        and is not sized against the owner's own table. The work history at
        the fix-round decision block records the deployed declaration as a
        single EXACT rule written from one row, so the size is 1 of 1: every
        declaration the owner has will be promoted on one row of evidence,
        and the account it is keyed on is whichever token the first-wins
        scrape chose, which hazard H12.16 measures at 4 of the owner's 39
        rows and leaves unanswered.
      - >-
        The first-wins residual IS sized, at 4 of 39 rows, in the plan's
        hazard class H12.16 and pinned end to end by
        test/domain/counterparty-identity.test.ts:568.
    concrete-fix: >-
      Add two counts to the work history's residue entry, both producible from
      the committed harness with no content: the number of rows whose stored
      account came from a description token whose scrape match is followed by
      a further four-digit group, which is the exact population the truncation
      residual can reach, and the number of deployed rules the routine would
      promote on one row, obtainable from a dry run once the code deploys. A
      residual stated in prose and a residual stated as a count of the owner's
      own rows are read differently, and criterion 12.20 already sets that
      standard for the descriptor side.

  - id: HZ-M3P12-R2-07
    severity: low
    evidence:
      - >-
        The new French refusal string at messages/fr.json:127 is written
        without accents throughout, while its three siblings added in the same
        change at messages/fr.json:124 through :126 carry them. Witnessed by
        this review with cat -A over the two lines: line 124 renders the
        accented e as the two-byte sequence, line 127 renders the same words
        as plain ASCII. The user-facing copy of one refusal therefore reads as
        degraded French beside the other three.
    concrete-fix: >-
      Restore the accents in messages/fr.json:127 to match
      messages/fr.json:124 through :126.

criteria:
  - id: "12.1"
    quote: >-
      CONVERGENCE, COUNTED. A test in test/domain/counterparty-identity.test.ts
      parses test/fixtures/belfius-counterparty-identity.pdf through the
      shipped path and counts DISTINCT counterpartyIdentity keys over its rows.
      The fixture carries 24 rows representing 12 invented counterparties, and
      the test asserts the distinct-key count is exactly 12 ... and separately
      asserts that the BASELINE derivation ... yields EXACTLY 24 distinct keys.
    evidence:
      - test/domain/counterparty-identity.test.ts:72 asserts 12 against a baseline of 24 and prints both.
      - test/domain/counterparty-identity.test.ts:89 asserts the composition, at least 8 rows on a trusted account over at least 4 accounts and at least 8 on the descriptor basis.
      - >-
        The composition clause's strict reading is a plan defect the
        orchestrator owns and is under repair on another branch; per the
        review dispatch it is not held against this implementer, and the work
        history declares it as a deviation with the arithmetic that shows the
        collision with plan step 7.
      - npm test run by this review on b324d87 exits 0, Test Files 38 passed (38), Tests 510 passed (510).
    met: true
  - id: "12.2"
    quote: >-
      CONVERGENCE ON THE OWNER'S OWN MONTH ... total rows 39, distinct identity
      keys EXACTLY 20 against a recorded baseline of 25, of which the account
      basis contributes EXACTLY 6 (baseline 11) and the descriptor basis
      EXACTLY 14 (baseline 14); and the same run over the real KBC card
      document records 22 rows and EXACTLY 16 identity keys.
    evidence:
      - >-
        The work history's finding (a) records every figure the criterion pins
        and the command that produced it, naming the committed harness
        test/fixtures/measure-identity-convergence.ts rather than a scratchpad
        path, with counts only and no parsed string.
      - >-
        NOT RE-RUN BY THIS REVIEW, and said rather than implied: the real
        documents are the owner's and this clean room does not open them. What
        I checked is that the harness is committed and runnable and that the
        fast gate exercises it over the committed fixtures
        (test/application/counterparty-identity-surfaces.test.ts:329).
    met: true
  - id: "12.3"
    quote: >-
      NAMED ONCE, MATCHED AGAIN ... calls assignMerchant EXACTLY ONCE against
      that group's identity key (asserted by a call counter on the fake
      merchants port, which must read 1 at the end of the test) ... and then
