  - id: "12.6"
    quote: >-
      A ROW MATCHING NO FAMILY IS NOT GUESSED AT ... A test asserts the same of
      a row whose stored counterparty account is empty or whitespace only, so
      no row is ever keyed on a bare namespace ... no truncation, no
