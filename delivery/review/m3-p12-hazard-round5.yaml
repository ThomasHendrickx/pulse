findings:
  - id: HAZ5-1
    severity: high
    analysis: >-
      THE NARROWED allLost FILTER STOPS HIDING A ROW A SUPERSEDED RULE'S
      CLAIMANT CANNOT REACH, BUT IT ALSO STOPS FLAGGING A ROW THAT SILENTLY
      CHANGES MERCHANT VIA A COMPLETELY UNRELATED RULE. Round four's fix for
      CR4-M3P12-01 replaced "exclude the whole superseded rule from the
      before-set" with a comparison-time filter: a row held by a superseded
      rule is dismissed as "not a loss" when `after !== undefined`, i.e.
      when SOMETHING resolves the row afterward. The reasoning given in the
      code (rederive-rules.ts:724-737) is "If the row is still covered
      AFTER this run, by the claimant or by anything else, then no naming
      has been discarded: a later naming the owner made on the screen
      simply won." That argument is sound for the CLAIMANT specifically,
      because the claimant's pattern is by construction the row's own
      rewritten identity, so its coverage is not a coincidence. It is NOT
      sound for "anything else": the code never checks that `after`'s rule
      is the claimant, or even that `after.merchantId` equals the
      claimant's merchant. It accepts ANY non-undefined resolution as proof
      nothing was lost. My witness (work log entry 2 above) demonstrates
      the gap directly: a row (tx-X) held by a superseded EXACT rule
      (merchant M1) moves to the ACCOUNT basis (because it carries a
      trusted account), so the claimant that superseded its old rule -- a
      DESCRIPTOR-basis rule -- can never match it at all (decision D-40
      forbids a descriptor-namespaced pattern matching an account-
      namespaced key). Instead the row is picked up by a THIRD, unrelated,
      pre-existing account-basis rule (merchant M3) that has no
      relationship whatsoever to the rule that used to cover it or to its
      claimant. The filter sees `after !== undefined` and drops it from
      `allLost` unconditionally. Criterion 12.7 states its own guarantee in
      two explicit halves: "no transaction that carried a merchant id
      loses it, and no transaction changes from one merchant to another."
      My witness is a live, reproduced instance of the SECOND half failing
      while the tool that exists to catch it (the superset/lost-assignment
      check) reports clean. This is not a corner case invented against the
      grain of the domain: an already-namespaced descriptor rule and an
      already-namespaced account rule for the SAME underlying stale bare
      pattern are both exactly the shape decision D-46's deploy window
      produces (an owner naming an unresolved descriptor-basis group one
      way and an unresolved account-basis group another way, without
      realizing the two groups used to be one merchant's declaration),
      which the plan's own language anticipates repeatedly for the twin/
      claimant mechanism in general. The dispatch that commissioned this
      round asked, in as many words, whether "the narrowing that stopped
      hiding losses has reintroduced a false one" -- this is that false
      one, in the more dangerous direction: not a false LOSS report (which
      would merely block a clean run), but a false SAFE report over a real,
      silent cross-merchant reassignment.
    evidence:
      - "WITNESSED against the shipped rederiveMerchantRules (606e3ee), via a throwaway vitest file (test/application/ZZZ-scratch-witness-collision.test.ts, written, run, then deleted; `git status --short` confirmed a clean tree afterward). Seed: rule R1 {merchant M1, EXACT, pattern P (bare)}; rule C {merchant M2, EXACT, pattern \"descriptor:\"+P}; rule Rz {merchant M3, EXACT, pattern \"account:\"+compactAccount(A)}. Rows tx-X {baseline key P, trusted counterparty account A = IDENTITY_FIXTURE_ACCOUNTS.counterparty2}, tx-Y {baseline key P, trusted counterparty account B = IDENTITY_FIXTURE_ACCOUNTS.counterparty3}, both invented values already listed in test/fixtures/allowed-identifiers.txt under their own provenance."
      - "Captured report (full JSON printed by the test): assignmentsBefore 2, assignmentsAfter 1, decisions include {ruleId: R1, outcome: superseded-by-namespaced-rule} and {ruleId: C, pass: two, outcome: not-promoted-several-accounts}, supersededByNamespacedRule [\"R1\"], lostAssignments EXACTLY [{transactionId: tx-Y, ruleId: R1}], exitCode 1 (from tx-Y alone). tx-X does not appear in lostAssignments, acceptedLostAssignments, broadened, or anywhere else in the report."
      - "src/modules/merchants/application/rederive-rules.ts:718-743 is the allLost filter; the specific line that swallows the case is :738 (`if (supersededRuleIds.has(held.ruleId) && after !== undefined) { return false; }`), which reads only whether `after` is defined, never which rule or merchant it names."
      - "Criterion 12.7's own quoted text (\"the after set is a SUPERSET of the before set: no transaction that carried a merchant id loses it, and no transaction changes from one merchant to another\") is in this phase's plan; the second half is what this witness shows failing."
      - "Decision D-40 (src/modules/merchants/domain/merchant-rule.ts, matchRules' account-basis refusal) is what makes the claimant structurally unable to cover tx-X once it takes the account basis, which is why the row's coverage necessarily comes from an unrelated rule rather than from the claimant the supersede reasoning is written about."
    concrete-fix: >-
      Narrow the exemption to what the comment already argues for: a row is
      only exempt from being reported lost when what covers it afterward IS
      the specific claimant that superseded its old rule (or that
      claimant's own pass-two promotion), not merely something. Concretely,
      thread the claimant's ruleId (already computed in pass one as
      `collision.ruleId` or equivalent) alongside `supersededRuleIds`, as a
      Map from superseded rule id to claimant rule id, and change the
      allLost filter to `if (supersededRuleIds.get(held.ruleId) ===
      after?.ruleId) return false;` (or, if pass two's own promotion of
      the claimant should also count as coverage, compare against the
      promoted rule's id too, which is derivable from the claimant's id).
      Add a test seeding exactly this shape -- a superseded rule, its
      claimant, and a THIRD, unrelated rule that also happens to cover one
      of the superseded rule's rows on the account basis -- and assert that
      row IS reported as a lost assignment (or, if the team judges an
      account-basis reassignment from an unrelated declaration acceptable,
      say so explicitly in the comment and in criterion 12.7's own text,
      rather than leaving the guarantee's second half silently narrower
      than its own stated wording).
  - id: HAZ5-2
    severity: medium
    analysis: >-
      RATED MEDIUM, MATCHING ROUND4'S OWN RATING FOR THE SAME UNDERLYING
      RISK, BECAUSE WHAT I AM REPORTING IS THAT A MEDIUM FINDING WAS NOT
      FULLY CLOSED RATHER THAN A NEW, DIFFERENT DEFECT: round4 rated
      CR4-M3P12-02 medium rather than high specifically because the ref stays
      pinned to the project the operator named, so the worst case is a same-
      project pooling-mode mismatch rather than the cross-project hazard
      H12.30 is about, and because the transactional-degradation consequence
      is a DOCUMENTED risk rather than one reproduced end to end in this
      sandboxed environment (no reachable transaction-mode pooler here
      either, this round or last). Both of those bounds still hold for what
      I found. THE PORT CHECK CR4-M3P12-02 ADDED SILENTLY ADMITS BOTH POOLING MODES
      BY DEFAULT, WHICH IS THE EXACT AMBIGUITY IT WAS COMMISSIONED TO
      CLOSE. Round four's own hazard finding CR4-M3P12-02 raised port as an
      unchecked field specifically because Supabase's pooler infrastructure
      exposes one project's database in more than one pooling mode on
      different ports from the SAME shared host, and because this routine's
      write path (applyRuleWrites' prisma.$transaction, an interactive
      multi-statement transaction) depends on the connection behaving
      consistently across statements the way transaction-mode pooling is
      documented not to guarantee. Its own concrete-fix named two
      acceptable resolutions: default to 5432 (session mode, the one
      endpoint fleet warning 5 actually documents as reachable from this
      product's IPv4-only deployment), or explicitly document port as out
      of scope. The shipped fix took a third path neither option named:
      KNOWN_PORTS = {"5432","6543"}, so a connection on EITHER port is
      approved identically whenever the operator does not pass
      --expect-port, which test/db/target-guard.test.ts:419-429 pins as the
      INTENDED behaviour of the fix ("AN UNKNOWN PORT is refused, and the
      two this product uses are not"). This is not a hypothetical default:
      .env.example:3-10 states the product's own documented architecture
      rule in as many words -- "DATABASE_URL = the pooled string (port
      6543, pgbouncer)" in a standard deployed environment -- and
      RederiveTargetEnv checks only DATABASE_URL (target-guard.ts:118-124
      says so explicitly, "DIRECT_URL is deliberately not checked"), which
      is also the only variable `new PrismaClient()` reads
      (resolve-env.ts's resolveClientDbUrl). So the routine's own
      unpinned-port default path is, by this product's own documented
      wiring, the port associated with transaction-mode pooling, and the
      interlock built to force a decision on that ambiguity instead makes
      the ambiguous case pass silently. An operator who runs the migration
      exactly as documented (naming host and ref, the two REQUIRED
      arguments) without also remembering the OPTIONAL --expect-port gets
      no refusal, no warning, and no signal that the connection they
      opened may not honour the atomicity guarantee criterion 12.7's
      superset test depends on.
    evidence:
      - "src/platform/db/target-guard.ts:116 (`const KNOWN_PORTS: ReadonlySet<string> = new Set([\"5432\", \"6543\"]);`) and :240-254 (the port branch: when `expectation.port` is unset, the check is `!KNOWN_PORTS.has(port)`, so both 5432 and 6543 pass without a mismatch)."
      - "test/db/target-guard.test.ts:419-429, \"AN UNKNOWN PORT is refused, and the two this product uses are not\": asserts `check(...:9999/postgres).allowed` is false AND `check(...:6543/postgres).allowed` is true, using the SAME zero-argument `check()` helper (no --expect-port), pinning silent dual-port acceptance as the shipped, intended behaviour rather than an oversight."
      - ".env.example:3-10: \"# Connection string rule (architecture section 3): runtime uses the POOLED connection string (DATABASE_URL), migrations use the DIRECT connection string (DIRECT_URL)... On Vercel against a deployed Supabase project: DATABASE_URL = the pooled string (port 6543, pgbouncer), DIRECT_URL = the direct string (port 5432).\""
      - "src/platform/db/target-guard.ts:118-124 (RederiveTargetEnv's comment): \"DIRECT_URL is deliberately not checked: it is the migration endpoint and this routine runs no migration.\""
      - "src/platform/db/resolve-env.ts's resolveClientDbUrl (what `new PrismaClient()` actually reads) reads only `process.env[\"DATABASE_URL\"]`."
      - "Round4 hazard finding CR4-M3P12-02 (origin/claude/m3-p12-rev4-haz:delivery/review/m3-p12-hazard-round4.yaml), whose own concrete-fix text is: \"Add a port to... RederiveTargetExpectation as an optional --expect-port, defaulting to 5432 (the session pooler's documented port per fleet warning 5) when not given... If the team judges port out of scope for this criterion... say so explicitly in the routine's own header... rather than leaving the gap undocumented the way it is today.\" Neither option is what the shipped code does."
    concrete-fix: >-
      Either default the unnamed-port case to 5432 (session mode) rather
      than admitting both known ports, requiring --expect-port explicitly
      to reach 6543 (mirroring how --expect-port already lets an operator
      "reach one" deliberately per the comment at target-guard.ts:134-138);
      or, if 6543 must stay admitted by default because some real
      deployment topology legitimately needs it, add the missing half of
      CR4-M3P12-02's own concrete-fix: state in target-guard.ts's own
      header, in the same explicit voice the file already uses for its
      other accepted risks (the percent-encoded-username exception, the
      no-override-flag design), that a transaction-mode-pooled connection
      is knowingly admitted and why the atomicity guarantee is believed to
      hold there regardless (or is not depended upon). Add a test that
      would fail under the FIRST option (an unnamed port defaulting to
      6543 is refused) so the decision is enforced rather than merely
      documented, matching the shape of every other accepted-risk case in
      this same file.
  - id: HAZ5-3
    severity: medium
    analysis: >-
      "THE APPLICATION DELIBERATELY REMAINS UNGUARDED" OVERSTATES WHAT IS
      ACTUALLY REQUIRED, AND A NARROWER GUARD THAT COSTS NOTHING AGAINST
      THE STATED REQUIREMENT IS ALREADY BUILDABLE FROM PARTS THIS TREE
      ALREADY HAS. The work history's open question C-M3P12-12 states
      flatly: "npm run dev and npx next start resolve DATABASE_URL from the
      ambient environment with no refusal... That is not a hole this
      mechanism may close: the deployed app must open a deployed database,
      so a local-only refusal would be wrong." This conflates two commands
      that do not need the same posture. `npx next start` (via `npm run
      start`, or the equivalent Vercel-managed production start) is the
      ONLY command that ever serves real production traffic, and Next.js
      sets NODE_ENV=production for it automatically; a local-only refusal
      there would indeed be wrong, exactly as the claim says. `npm run dev`
      (`next dev`) is NEVER used to serve real production traffic -- it is
      exclusively a local development server, and Next.js sets
      NODE_ENV=development for it automatically. Nothing about the
      requirement "the deployed app must open a deployed database" applies
      to `npm run dev` at all, so a guard scoped to non-production mode
      would refuse exactly the case fleet warning 22 documents as the live,
      unaddressed gap ("npm run dev... in a fleet container... reaches a
      deployed project... never start the dev... server in a fleet
      container without pinning DATABASE_URL yourself") while never firing
      for `next start` in any deployment context, local prod-smoke
      included (the Playwright gate's own chromium-prod project already
      pins DATABASE_URL to local before starting next start via
      gate-target.ts, so a redundant dev-mode-only check there would be a
      no-op, not a break). The distinguishing predicate this needs already
      exists and is already imported by the very file that would need it:
      src/platform/config.ts:47's `isProduction()` (`process.env.NODE_ENV
      === "production"`) is already read by src/platform/db/client.ts:38
      two lines below where the client is constructed, for an unrelated
      purpose (whether to cache the client on globalThis). The local-host
      predicate this would also need (LOCAL_DB_HOSTS / isLocal) is already
      exported from guard.ts for exactly this kind of reuse and is already
      imported a second time by gate-target.ts. Composing the three -- not
      production, DATABASE_URL present, host local -- into a refusal at
      client construction time is a small, mechanical change reusing
      primitives this tree already has three copies of the pattern for
      (guard.ts, target-guard.ts, gate-target.ts), each with its own
      documented escape hatch for a deliberate remote use. The claim that
      closing this is "a product decision with a deployment change behind
      it and no criterion covering it" is true of `next start` and not of
      `next dev`, and the open question does not draw that line.
    evidence:
      - "delivery/work-history/m3-p12.yaml:1694-1708, open-question C-M3P12-12: \"`npm run dev` and `npx next start` resolve DATABASE_URL from the ambient environment with no refusal... That is not a hole this mechanism may close: the deployed app must open a deployed database, so a local-only refusal would be wrong.\""
      - "package.json: \"dev\": \"next dev\", \"build\": \"prisma generate && next build\", \"start\": \"next start\" -- confirming `npm run dev` invokes `next dev` and nothing else, distinct from the build/start pair used for any production-mode serving, local or deployed."
      - "src/platform/config.ts:47: `export const isProduction = (): boolean => process.env.NODE_ENV === \"production\";`"
      - "src/platform/db/client.ts:36-40: `export const prisma: PrismaClient = globalForPrisma.prisma ?? constructClient(); if (!isProduction()) { globalForPrisma.prisma = prisma; }` -- the exact predicate needed is already read in this file, for a different purpose, on the two lines immediately after client construction."
      - "src/platform/db/guard.ts:34-38: `export const LOCAL_DB_HOSTS: ReadonlySet<string> = new Set([\"127.0.0.1\", \"localhost\", \"::1\"]); // EXPORTED so the gate interlock beside this one (gate-target.ts, M3-P12 fix round four) asks the same question of a hostname that this guard asks.` -- already exported for reuse and already reused once."
      - "Fleet environment warning 22 (this session's brief): \"npm run dev and npx next start do NOT [refuse]. They resolve the ambient DATABASE_URL with no refusal, and the ambient value in a fleet container is the owner's hemma-dev project. That is deliberate, because the deployed app must open a deployed database and a local-only refusal there would be wrong. So: never start the dev or production server in a fleet container without pinning DATABASE_URL yourself.\" -- the warning itself states the manual-discipline-only posture as a live, standing operational risk with no mechanical backstop, which a dev-mode-scoped guard would close for the dev half."
    concrete-fix: >-
      In src/platform/db/client.ts, before constructClient() is called,
      add: when !isProduction(), read process.env.DATABASE_URL and refuse
      (throw, in the same voice constructClient's own catch block already
      logs in) unless its host is in LOCAL_DB_HOSTS, with a single
      documented escape hatch env var (mirroring
      PULSE_ALLOW_REMOTE_DB_DESTRUCTION's naming and posture) for the
      deliberate case of a developer debugging against a remote database on
      purpose. Add a test alongside test/db/db-guard.test.ts constructing
      this predicate directly (not the full Next.js dev server, which the
      fast gate cannot start) and asserting it refuses a non-local
      DATABASE_URL when NODE_ENV is not "production" and does not refuse
      when it is. If the team judges this out of scope for this phase
      specifically, narrow C-M3P12-12's own text to say why the `next dev`
      half is deliberately left open too, rather than resting the whole
      open question on an argument that only covers `next start`.
  - id: HAZ5-4
    severity: low
    analysis: >-
      GATE-TARGET.TS'S NEW RESOLUTION SILENTLY BREAKS THE STANDING
      OPERATIONAL INSTRUCTION FOR RUNNING THE E2E GATE, THOUGH IT FAILS IN
      THE SAFE DIRECTION. Fleet environment warning 6 (present verbatim in
      this and every prior round's dispatch) instructs: "pin all five
      values (DATABASE_URL, DIRECT_URL, NEXT_PUBLIC_SUPABASE_URL, the
      publishable key and the secret key) to the local stack in the
      invoking shell." Every prior round's review (round3, round4 hazard
      and criteria both) followed this instruction successfully. This
      round's gate-target.ts deliberately does not read shell
      DATABASE_URL/DIRECT_URL/NEXT_PUBLIC_SUPABASE_URL as a naming source
      at all (by design -- its whole point is that the ambient shell value
      is not a value anyone named for this purpose), so exporting the five
      values directly in the shell exactly as warning 6 instructs now
      produces an immediate GateDbTargetRefused ("no source named a
      database for this gate") before a single test runs. This is not a
      hazard in the sense this contract is about -- it fails LOUD and
      CLOSED, which is the correct direction, and I confirmed it myself
      (work log entry 6) by hitting the refusal on my first attempt and
      working around it with a gitignored .env file, which is the gate's
      own documented second source. It is, however, a real regression
      against the standing dispatch instruction that every future reviewer
      and every future implementer will hit in exactly the same way until
      either the instruction or the mechanism changes, and it costs wall
      clock the same way a silent failure does, except here the failure is
      loud and the cost is a reviewer re-deriving the workaround from the
      error message each time rather than the workaround being written
      down anywhere.
    evidence:
      - "My own first e2e attempt this round: `export DATABASE_URL=... DIRECT_URL=... NEXT_PUBLIC_SUPABASE_URL=... NEXT_PUBLIC_SUPABASE_ANON_KEY=... SUPABASE_SERVICE_ROLE_KEY=...` then `npm run test:e2e`, captured in my own scratch log, printed: `GateDbTargetRefused: gate database target: no source named a database for this gate. The gate does not fall back to an ambient DATABASE_URL...` and exited before a single test ran, with a stack trace rooted at playwright.config.ts:29 calling gate-target.ts:207."
      - "src/platform/db/gate-target.ts:163-189 (gateDbCandidates): the two sources are literally \"the PULSE_GATE_* variables\" and \"the .env file at the package root\"; there is no third source reading plain shell DATABASE_URL/DIRECT_URL/NEXT_PUBLIC_SUPABASE_URL, by the file's own stated design (:28-49, \"THE RESOLUTION ORDER, and why the ambient DATABASE_URL is not in it\")."
      - "Fleet environment warning 6 (this session's brief, unchanged from the warning round3 and round4 reviewers both followed successfully): \"pin all five values... in the invoking shell.\""
    concrete-fix: >-
      Update fleet warning 6's own text (or the dispatch template that
      carries it forward) to say that, as of this phase, a plain shell
      export of the five values no longer satisfies the e2e gate's own
      target guard, and that a .env file at the package root (or the
      PULSE_GATE_* variables) is required instead. This is an orchestrator-
      level documentation fix, not a code fix; naming it here so the next
      reviewer does not lose the same few minutes rediscovering the
      workaround from the refusal message.

