hazard-classes-addressed:
  - class-id: H11.1
    probed: >-
      Read every value the leaf renders looking for a figure derived in the
      browser, and traced the merge case's arithmetic to its source, as
      part of attack direction G. The leaf renders the total from its
      server prop and predicts the label alone; the summing lives only in
      the use case (src/modules/merchants/application/assign-merchant.ts:167).
    cleared-because: >-
      No money figure is computed on the client. The layers where a domain
      rule could have been copied into the browser are pinned to an empty
      diff and are empty: git diff --stat origin/main...HEAD over
      src/modules/merchants/application and src/modules/merchants/domain
      printed nothing at all.
  - class-id: H11.2
    probed: >-
      Attack direction D, the toast under DR-0026: dismiss-only, no timer,
      role alert versus status, and per-row or global collisions. Read the
      per-row rendering against the single fixed rectangle the stylesheet
      draws, and looked for the states in which two notices exist at once.
    finding: HZ-M3P11-01
  - class-id: H11.3
    probed: >-
      Checked the non-visual path for presence and for the role split:
      whether the failure is announced assertively and the difference
      politely, and whether the notice says anything a reader who is not
      looking at that corner of the screen can act on.
    finding: HZ-M3P11-05
  - class-id: H11.4
    probed: >-
      Read every string the leaf and the notice can render and traced each
      to its origin, then read the new English copy against what the client
      raising it can actually know, including the order in which the use
      case writes and then recomputes.
    finding: HZ-M3P11-04
  - class-id: H11.5
    probed: >-
      Attack direction A and attack direction B: whether the predicted
      label can differ from what the server persists through trimming,
      normalisation or identity-key versus descriptor grouping, and whether
      the record that carries the server's answer back survives a second
      submit, a second failure, or a merchant with rows in both directions.
    finding: HZ-M3P11-02
  - class-id: H11.6
    probed: >-
      Read package.json against the base and walked the import closure of
      both new client files to see whether a toast package, a component
      library or a state store had been added to make a dismissible
      accessible notice easier.
    cleared-because: >-
      Nothing was added. The notice is hand-built
      (src/platform/ui/toast.tsx:39 through :62), the leaf's closure is
      react plus src/platform/ui only
      (src/modules/merchants/ui/merchant-row.tsx:32 through :35), and the
      cross-row state is a plain module value rather than a provider, which
      is also what keeps the merchant review list a server component.
  - class-id: H11.7
    probed: >-
      Looked for any window in which the predicted label is on screen
      without its marking: before the marking is applied, between its
      visual and non-visual halves, and after the response is released.
    cleared-because: >-
      The marking is derived from the same value as the prediction, so the
      two cannot disagree: the row's unresolved treatment, the
      data-unconfirmed attribute, the region's content and the description
      are all conditioned on one predicted flag computed from the
      optimistic label, and there is no ordering in which one appears
      without the other.
  - class-id: H11.8
    probed: >-
      Compared the merchants module's domain and application directories
      against the base, looking specifically for a sort changed so a
      renamed row does not move, or a projection widened so the client can
      predict more of it.
    cleared-because: >-
      git diff --stat origin/main...HEAD over
      src/modules/merchants/application and src/modules/merchants/domain
      printed nothing at all, which is criterion 11.8's own pin, met.
  - class-id: H11.9
    probed: >-
      Ran the privacy gate over this head with this document in the tree,
      and read what the phase's new DOM attribute and its new spec put into
      failure messages and retained traces, since the config sets trace
      retain-on-failure.
    finding: HZ-M3P11-03
  - class-id: H11.10
    probed: >-
      Checked specifically for aria-busy on the row, the group label or the
      live region, which is the inversion this class names, and for the
      weaker form of the same error, a description attached where nothing
      announces or reaches it. This was attack direction E.
    cleared-because: >-
      aria-busy appears only on the submit control
      (src/platform/ui/submit-button.tsx:105), the spec asserts its absence
      on the other three elements, and the description is present exactly
      while the prediction is and absent otherwise
      (src/modules/merchants/ui/merchant-row.tsx:268), so no reader meets
      the predicted name with less indication of its status than they would
      have had without the optimism.
  - class-id: H11.11
    probed: >-
      Attack direction H: whether the new spec goes vacuous through project
      membership, testIgnore or prod-only projects, which is the shape a
      criterion takes when it is quietly reinterpreted rather than reported
      red. Measured with npx playwright test --list rather than read.
    cleared-because: >-
      Not vacuous. The listing enumerates 112 tests in 14 files, with nine
      optimistic-naming tests under chromium-prod and nine under
      chromium-phone-prod, and the widened testMatch did not drop the
      prod-smoke journey it replaced a looser pattern for. The spec's own
      failure modes are loud rather than silent: a missed interception
      would redden the mid-flight assertions, and a locale cookie that did
      not take would redden the three catalogue-text assertions.

