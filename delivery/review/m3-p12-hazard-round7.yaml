      - "No entry in `mutants` or `selfCheck` is constructed to make an assertion fire that neither FIRST nor SECOND owns, so the 'unattributed' branch is reached only incidentally if a real mutant's shipped bug happens to produce one, never by a dedicated self-check the way crash-vs-catch now has one"
      - "npm run test:mutants transcript in this run: M1-M4 and M6 all scored 'caught' attributed to a named property, M5 scored caught on both properties; none exercised 'unattributed' in this run, consistent with there being no dedicated case for it"
    concrete-edit: >-
      Add a second self-check entry (SELF2 or similar) that throws an
      assertion from inside the property file's own harness code, outside
      both named property blocks (for example, an assertion in a shared
      setup helper both properties call), with expect: "unattributed", the
