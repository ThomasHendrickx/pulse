  - id: CR7-M3P12-01
    severity: high
    evidence:
      - "test/fixtures/measure-identity-convergence.ts:67 defines FLEET_HANDLE = /^[0-9a-f]{8}$/ (lowercase-only hex class, no anchor on what follows the eighth character)"
      - "test/fixtures/measure-identity-convergence.ts:70-77 measurementLabel: for a path outside test/fixtures, returns name.slice(0,8) verbatim whenever FLEET_HANDLE matches it, else UNLABELLED"
      - "Live witness run in the worktree (file written, executed with npx tsx, then deleted; git status --porcelain empty before and after): measurementLabel(\"/uploads/BE68539007547034-2026-06-statement.pdf\") === \"unlabelled\" (true, the committed regression test's own case, uppercase); measurementLabel(\"/uploads/be68539007547034-2026-06-statement.pdf\") === \"be685390\" (the SAME invented account digits, lowercased only) -- the guard returns the country code, both IBAN check digits and four digits of the account instead of refusing"
      - "test/application/counterparty-identity-surfaces.test.ts:364-390 (test title: 'a path OUTSIDE test/fixtures survives only as a fleet handle, and a bank-shaped name is refused outright') pins only the uppercase form of the bank-shaped basename as refused; no lowercase, mixed-case, or other-hex-adjacent variant is asserted anywhere in the suite (grepped the whole file for the string, one occurrence)"
      - "test/fixtures/measure-identity-convergence.ts:52-56 states the guard's own intended contract: eight characters is safe only for a file carrying 'this fleet's renaming convention, an eight-hex handle followed by a hyphen' -- the implementation checks the eight hex characters but never checks that a hyphen follows, so it accepts the shape of a fleet handle without checking the one thing (actual fleet provenance) that would make it an identity check rather than a shape check"
    concrete-edit: >-
      measurementLabel must not infer fleet-handle provenance from the shape
      of the leading eight characters, because that shape is not unique to a
      fleet-assigned handle: Belgium's own IBAN country code (BE) lowercases
      into the hex alphabet, and this phase's owner banks with Belgian
      institutions whose real export filenames lead with the account number
      (the file's own header comment says so). Replace the regex-shape check
      with a real identity check: either require the caller (the CLI
      entrypoint invoked against a real upload) to pass an explicit,
      out-of-band label rather than deriving one from the path at all, or
      maintain a committed allowlist of the fleet's actually-issued handles
      and test membership in it, or at minimum also require the character
      immediately after the eight leading characters to be exactly a hyphen
      AND (since a bank-shaped name can also happen to carry a hyphen at
      that position, as the committed test's own fixture
      "BE68539007547034-2026-06-statement.pdf" demonstrates) treat any match
      as provisional and refuse it whenever the same eight characters, read
      as an IBAN prefix, pass the ISO 7064 mod-97 check the phase's own
      counterparty-identity trust gate already implements (src/modules/merch
      ants/domain/counterparty-identity.ts) -- i.e. ask "is this NOT a
      plausible account prefix" rather than "does this look like hex", since
      the former is the actual identity distinction this file needs and the
      latter is exactly the shape-not-identity error this round's own commit
      message (14360e2) already names as the class of bug being fixed
      elsewhere in the same file.
    analysis: >-
      This is a live regression of the exact defect fix round eight's commit
      14360e2 states it closed ("Eight characters is safe only for a file
      carrying this fleet's hex renaming handle; a real bank export leads
      its name with an account number... The claim is now enforced rather
      than asserted"). It is not enforced: it is enforced for one specific
      case (uppercase-led bank filenames) and silently open for a case one
      case-fold away, which is realistic rather than contrived, because
      lowercase-normalised filenames are common (many download and upload
      pipelines lowercase names) and the Belgian country code is exactly
      within the accepting alphabet. This is the shape-versus-identity
      pattern named explicitly in the dispatch for this round: FLEET_HANDLE
      tests whether a string LOOKS LIKE eight hex digits (a shape any bank
      account number partially shares, for a subset of real country codes)
      rather than testing whether the string IS the fleet's own assigned
      handle (an identity the code has no way to check because it discards
      everything about the file except its leading eight characters). The
      module's own committed regression test only proves the uppercase case
      is refused and never states or tests the lowercase one, so this gap
      shipped past its own dedicated coverage.

