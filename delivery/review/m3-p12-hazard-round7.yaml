      the one remaining outcome the discriminator's own self-check does not
      yet cover, following the same reasoning fix round eight already used
      for the dies/caught confusion: an outcome nothing exercises is code
      nothing takes, which is how that defect arrived in the first place.
    analysis: >-
      Not a live defect: reading the outcome computation, I could not
      construct a plausible regression that mis-scores an attributable
      assertion as unattributed or vice versa without also breaking one of
