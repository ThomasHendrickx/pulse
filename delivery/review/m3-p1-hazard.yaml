deviations-judged:
  - deviation: >-
      files-to-touch (phase M3-P1): the list does not name
      src/platform/ui/nav-link.tsx or src/app/globals.css, both of
      which the phase in fact requires.
    serves-plan-intent: true
    reasoning: >-
      The client island is forced by the platform: the layout resolves
      the household through next/headers (verified by this review at
      src/platform/auth/supabase-server.ts:2) so it cannot carry "use
      client", and a server-computed marker goes stale across App
      Router navigations; the implementer settled this by an executed
      build probe (M3P1-C5, exit 1 with the next/headers error), not
      by assertion. The island keeps every testid literal and every
      label in the layout, preserving criterion 1.1's grep pin, and
      passes pulse-frontend's platform/ui test (knows an href, not a
      transaction). globals.css is where every existing app-shell
      class lives; putting component rules in styles/tokens.css would
      have been the actual violation. Declared the moment found, per
      the phase-scope clause.
  - deviation: >-
      files-to-touch (phase M3-P1): styles/tokens.css is listed but
      was not modified.
    serves-plan-intent: true
    reasoning: >-
      The plan's own step 1 makes the file conditional (a missing
      token is added there first), and no token was missing: this
      review verified independently that every var(--*) referenced in
      src/app/globals.css is defined in styles/tokens.css (comm over
      the two sorted sets is empty). Not touching it is the
      non-negotiable followed, not skipped.

