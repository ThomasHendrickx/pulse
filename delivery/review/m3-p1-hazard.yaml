findings:
  - id: CR-601
    severity: low
    evidence:
      - "src/platform/ui/nav-link.tsx:30 computes the marker as pathname === href, exact match only"
      - "src/app/(app)/import/[id]/page.tsx exists: the import confirm and result step is a real sub-route in the core journey (its own comment: thin route for one import, dispatch on the status machine)"
      - "test/e2e/navigation.spec.ts:63-73 (expectNavOn) is asserted only on /, /import and /merchants; no assertion visits /import/[id], so the gap is invisible to the phase's e2e"
    concrete-fix: >-
      In src/platform/ui/nav-link.tsx, widen the active test to const
      active = pathname === href || (href !== "/" &&
      pathname.startsWith(href + "/")), and extend expectNavOn coverage
      to the confirm step (after the upload in the seeded journey,
      assert nav-import carries aria-current on the /import/[id] page).
    analysis: >-
      On /import/[id], the page a user lands on in the middle of the
      import journey, no nav link carries aria-current: the visible
      current-route state the owner asked for goes dark exactly where
      orientation matters most. Nothing is wrongly marked and every
      route stays reachable, so this is low, not a recurrence of the
      owner's complaint. It passes criterion 1.1 as written because
      the criterion names only the three top routes, which is the
      hazard-contract shape: green criteria, and the shipped behaviour
      at risk is the marker's promise on a route the criteria never
      visit.
  - id: CR-602
    severity: low
    evidence:
      - "test/app/catalog-parity.test.ts:26 compares new Set(Object.keys(parsed)) per locale: top-level key NAMES only"
      - "messages/en.json carries three array-valued top-level keys (prevMonth, steps, emptySteps; counted by node: 103 string values, 3 arrays)"
      - "reconstruction executed by this review, tree never edited: the committed test's logic against an in-memory nl copy with the last steps entry dropped stays GREEN (captured output: witness parity STAYS GREEN on dropped array entry: true), while a deleted top-level key reds as the work history witnessed"
      - "the test's own header comment (test/app/catalog-parity.test.ts:5) claims every user-facing string lives in all three catalogs, which is wider than what the check reaches"
    concrete-fix: >-
      In test/app/catalog-parity.test.ts, flatten each catalog to deep
      key paths before comparing (array values contribute
      key.<index>), or add a second assertion that array-valued
      entries have equal lengths across locales; and narrow the header
      comment to what the test checks until then.
    analysis: >-
      This is H1.2's guard, and its blind spot is the class's exact
      recurrence path: a later phase shipping steps or emptySteps with
      one entry fewer in nl or fr ships untranslated or missing copy
      with the fast gate green. Criterion 1.2 says key, and array
      entries are strictly values, so the criterion is met as written;
      the finding is that the guard's reach is narrower than both its
      own comment and the intent of the step that ordered it (so this
      and every later phase cannot ship an untranslated key). Current
      catalogs are aligned (2/2/2, 3/3/3, 3/3/3 entries), so nothing
      is broken today.

