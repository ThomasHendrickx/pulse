  - >-
    The cause of witness TWO: the guard has no comment-stripping pass, which is the error
    fleet environment warning 27 names as the sixth instance in one session.
  - >-
    The cause of witness THREE: the guard locates the WHERE clause with body.search(/\bWHERE\b/),
    and the FIRST match inside monthFigures is the FILTER (WHERE ...) at overview-repository.ts:281
    in the SELECT list, so the slice it calls the WHERE begins at the top of the projection
    and inside-the-WHERE degenerates to anywhere-in-the-query.
  analysis: >-
    This is the guard the fix round rebuilt precisely because round one found it asserting
    that the ring predicates were DEFINED rather than USED, and it is still not a guard on
    the act. Its own comment states two things about itself that are false, which is R-087's
    first shape: it says it now reads each read's OWN body and requires the predicate to be
    inside it, and it says the counted and held arms share one body so BOTH ARMS are asserted
    rather than only the one the enumeration names. Witness THREE defeats the first sentence
    and witness ONE defeats the second. Two of the three states above are the two hazards
    criterion 14.14 exists to address and the third is criterion 14.15's own hazard H14.21.
    test/e2e/overview-reads.spec.ts does catch witnesses ONE and THREE when it runs, so the
    product defect is not undetected; what is wrong is that the fast gate's dedicated structural
    guard reports clean over all three, the slow gate exits 1 at this head, and the guard's
    comment tells the next reader it has checked something it has not.
  concrete-fix: >-
    Assert the counted arm by its own token rather than by a substring: require the accountRowCounts
    body to match a line carrying POT_ROW that does not also carry NON_POT_ROW, or assert
    the ternary shape itself. Add a comment-stripping pass covering both the double-slash
