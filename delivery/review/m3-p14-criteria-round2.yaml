    is real rather than contrived because the delimited parse stores the cell verbatim while
    the PDF path canonicalises.
  analysis: >-
    THE REFUSAL THIS LANE WAS ASKED TO JUDGE IS RIGHT, and its measurement reproduces: writing
    the reserve rows spaced in the CSV really would leave the detector assigning no counterparty-account
    column, so all eleven rows would parse with a null counterparty and the join would lose
    its input rather than discriminate. Building the discriminating input by seeding the stored
    column directly is the correct move and the seventh assertion at test/e2e/overview-reads.spec.ts:264
    does discriminate a raw GROUPING as well as a raw join, which a fixture-level assertion
    could only ever have done for the join. The refusal goes further than it claims, though.
    The mechanism it offers for how a mixed household arises does not work either, because
    detection runs on every upload. No shipped path can put a spaced value in Transaction.counterpartyIban,
    and this branch's own invariant test asserts exactly that. The two comments cannot both
    be true and the invariant test's version is the one the code supports. So criterion 14.2's
    premise that the stored column really does hold two surface forms for one account is false
    at this tree, the separate fixture clause requiring the spaced surface form is unsatisfiable
    through the delimited path and stays unmet, and the seventh assertion is honest defence
    in depth against a state the product cannot currently produce. This is a plan finding
    as much as an implementation one.
  concrete-fix: >-
    Correct the comment at test/e2e/overview-reads.spec.ts:250 to say the state is seeded
    because no shipped path produces it, and raise the criterion's premise to the plan for
    the next round, either by dropping the fixture clause or by deciding whether the delimited
    detector should accept a spaced account cell at all.
