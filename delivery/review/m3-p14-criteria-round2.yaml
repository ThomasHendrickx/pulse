findings:
  - id: CRIT2-01
    severity: high
    title: >-
      The rebuilt ring-predicate guard is still self-passing, in three distinct
      ways, and its own comment states two things about itself that are false
    criteria: ["14.14", "14.15", "14.16"]
    hazards: ["H14.10", "H14.14", "H14.19", "H14.21"]
    where: >-
      test/domain/absent-flow-reads.test.ts:271 through :330, the test named
      EVERY ONE OF THE THREE READS CARRIES A RING PREDICATE IN ITS OWN WHERE
      CLAUSE, against src/modules/overview/adapters/overview-repository.ts:257,
      :337 and :435.
    what-the-guard-claims: >-
      Its comment at test/domain/absent-flow-reads.test.ts:271 records that the
      previous version was shown green against the state it forbids and says it
      "now reads each read's OWN body and requires the predicate to be inside
      it". Its last three lines claim the counted and held arms "share one body,
      selected by a ternary, so BOTH ARMS are asserted rather than only the one
      the enumeration names". Both sentences are false, demonstrated below.
    red-witnesses-derived-by-this-lane: >-
      Each edit below was applied to the worktree, the guard was run, the whole
      fast gate was run, and the edit was reverted. In all three the guard
      reported 9 passed of 9 and the fast gate reported Test Files 38 passed
      (38) / Tests 489 passed (489), exit 0.
      ONE, THE COUNTED ARM LOSES ITS RING RESTRICTION ENTIRELY, which is hazard
      H14.21 verbatim. Replace overview-repository.ts:454, AND
      ${ring === "counted" ? POT_ROW : NON_POT_ROW}, with
      ${ring === "counted" ? Prisma.empty : Prisma.sql`AND ${NON_POT_ROW}`}.
      The counted read now reports every flow-carrying row in the household
      regardless of ring, so a stale flow on an account that left the pot is
      rendered to the household as counted money on the one screen state built
      to tell counted from held. The guard stays green because POT_ROW is a
      SUBSTRING of NON_POT_ROW, so expect(shared).toContain("POT_ROW") is
      satisfied by the held arm's own predicate. The claim that both arms are
      asserted is therefore false for every possible edit to the counted arm.
      TWO, THE GAP LISTING LOSES ITS RING PREDICATE, which is hazard H14.19
      verbatim. Delete AND ${POT_ROW} from the WHERE of listGapRows at
      overview-repository.ts:366 and leave the token behind on a SQL comment
      line, for example "-- the ring scoping used to read AND ${POT_ROW} here".
      Postgres comments the interpolated fragment out, so the listing now hands
      the reconciliation panel held rows under a verdict that says the books
      close. The guard has no comment-stripping pass, which is the exact error
      fleet environment warning 27 names as the sixth instance in one session.
      THREE, THE UNINTERPRETED COUNT LOSES ITS RING PREDICATE, which is hazard
      H14.10 and H14.14. Delete AND ${POT_ROW} from the WHERE of monthFigures
      at overview-repository.ts:297 and add it inside an existing aggregate
      filter in the SELECT list, for example
      COUNT(*) FILTER (WHERE t."flow" IS NOT NULL AND ${POT_ROW}). The
      uninterpreted count now counts a reserve account's held rows and the
      month never closes again. The guard stays green because it locates the
      WHERE clause with body.search(/\bWHERE\b/), and the FIRST match in
      monthFigures is the FILTER (WHERE ...) at overview-repository.ts:281,
      inside the SELECT list: the slice it calls "the WHERE" begins at the top
      of the projection, so "inside the WHERE" degenerates to "anywhere in the
      query".
    why-it-matters: >-
      This is the guard the fix round rebuilt precisely because round one found
      it asserting that the predicates were DEFINED rather than USED. It is
      still not a guard on the act. Two of the three states above are the two
      hazards criterion 14.14 exists to address, and the third is criterion
      14.15's own hazard H14.21. test/e2e/overview-reads.spec.ts does catch
      states ONE and THREE when it runs, so the product defect is not
      undetected; what is wrong is that the fast gate's dedicated structural
      guard reports clean over all three, and its comment tells the next reader
      it has checked something it has not.
    fix: >-
      Assert the counted arm by its own token rather than by a substring, for
      example by requiring the body to match /\bPOT_ROW\b/ on a line that does
      not also carry NON_POT_ROW, or better by asserting the ternary shape
      itself. Strip line comments before matching, both // and SQL --. Locate
      the WHERE clause by the LAST top-level WHERE in the body, or by the WHERE
      that follows the FROM, rather than by the first occurrence of the word.
    evidence-command: >-
      npx vitest run test/domain/absent-flow-reads.test.ts, and npm test, run
      by this lane after each of the three edits above.

  - id: CRIT2-02
    severity: high
    title: >-
      Criterion 14.4's duplicate detector is green against a private second copy
      of the canonical transform written in the commonest idiom, which is the
      exact shape the criterion names M3-P12's counterpartyIdentity as
    criteria: ["14.4"]
    hazards: ["H14.5"]
    where: >-
      test/domain/account-number.test.ts:182 through :186, the REMOVES_SEPARATORS
      patterns, used by the test at test/domain/account-number.test.ts:224.
    the-criterion-clause: >-
      Criterion 14.4 requires the enumeration test to be "written so that a
      SECOND implementation of the same transformation reddens it wherever it
      lives, including one written inline inside another module's identity
      derivation", and says in its own words that this "is what stops M3-P12's
      counterpartyIdentity, which lands after this pin has already gone green,
      from growing a private copy".
    red-witness-derived-by-this-lane: >-
      Prepend to src/modules/ledger/domain/corrections.ts the four lines
      const counterpartyIdentityProbe = (counterpartyIban: string): string =>
      counterpartyIban.toUpperCase().replace(/[^A-Z0-9]/g, ""); and run
      npx vitest run test/domain/account-number.test.ts. Result: 17 passed
      (17), exit 0. That function IS a working second copy of
      canonicalAccountNumber for every input the codebase hands it, it lives in
      a module whose own file the criterion names as the risk, and it is
      written in the way an IBAN normaliser is most often written.
    why-the-pattern-misses-it: >-
      The JavaScript detector's first pattern requires the regex literal's
      character class to begin with one of backslash, s, hyphen or space, so a
      NEGATED class such as [^A-Z0-9] or [^a-zA-Z0-9] matches nothing. Probed
      by this lane over the guard's own predicate, extracted verbatim: the two
      negated-class forms MISS, and so do two SQL forms, regexp_replace(upper(x,
      ...)) with the two functions in the other order and upper(translate(x, ...)),
      because SQL_CANONICALISATION at test/domain/account-number.test.ts:188
      pins one nesting order and two function names.
    what-still-holds: >-
      The detector's self-test at test/domain/account-number.test.ts:294 is real
      and its five mustCatch shapes are genuinely caught, so this is a gap in
      COVERAGE rather than a guard that catches nothing. The one-definition
      tests for canonicalAccountNumber, ACCOUNT_NUMBER_LENGTHS and the mod-97
      loop are separate and unaffected.
    fix: >-
      Detect the ACT rather than the idiom: match any .replace/.replaceAll whose
      second argument is the empty string and whose first argument is a regex
      literal at all, then decide by proximity as it already does; and for SQL,
      match upper and a replace-family function within one expression in either
      order rather than one nesting.
    verdict-on-the-criterion: >-
      14.4 NOT MET as stated. The three one-definition halves are met; the
      inline-second-copy half, which the criterion writes out at length and
      names its purpose for, is not.

  - id: CRIT2-03
    severity: medium
    title: >-
      The MerchantRule delete guard is defeated by any string containing a
      double slash earlier on the same line, because its comment stripper is
      naive
    criteria: ["14.13", "15.6"]
    hazards: ["H15.5"]
    where: >-
      test/application/account-registry.test.ts:392, the stripComments helper
      used by rulesDeletedIn at test/application/account-registry.test.ts:395.
    both-directions-derived-by-this-lane: >-
      GREEN HALF CONFIRMED. Prepending an ordinary
      await tx.merchantRule.deleteMany({ where: { householdId } }); to
      src/modules/ledger/application/interpret-window.ts reddens the guard:
      1 failed of 1 run, which is the fix round's claimed red witness and it
      holds.
      RED HALF, THE HOLE. Prepending the SAME call on a line that also carries
      a string with a double slash in it, for example
      const auditUrl = "https://audit.example/rules"; const probeB = async (tx)
      => { await tx.merchantRule.deleteMany({ where: { householdId } }); };
      leaves the guard GREEN: 1 passed of 1 run. stripComments treats the
      double slash inside the string literal as the start of a line comment and
      discards the rest of the line, taking the delete with it.
    why-it-matters: >-
      The guard's own comment at test/application/account-registry.test.ts:381
      says this is "the ONE guard in either phase that holds an ABSOLUTE rule of
      the domain rather than a criterion's own assertion", and decision D-49
      rests on it twice. A guard on an absolute rule should not be defeatable by
      a URL.
    honest-scope: >-
      The construction is contrived; nothing in the tree writes a delete after a
      double slash on the same line today, and the ordinary forms are all
      caught. Rated medium rather than high for that reason, not because the
      hole is theoretical: the same flaw fires for any string or regex literal
      containing a double slash ahead of code on that line.
    fix: >-
      Strip comments with a scanner that tracks string and template state, or
      match on the un-stripped text and exclude a hit whose line begins with a
      comment marker, which is what the criterion actually needs.

  - id: CRIT2-04
    severity: medium
    title: >-
      gate:diff-tokens is blind to a named colour written the way a TSX file
      writes one, and to any literal that follows a double slash on its line
    criteria: ["14.10"]
    hazards: ["H14.9"]
    where: >-
      scripts/gate-diff-tokens.sh:60 (the NAMED alternation and the COLOUR
      pattern) and scripts/gate-diff-tokens.sh:84 (the comment stripper).
    probes-run-by-this-lane: >-
      Each probe was appended as one line to src/app/(app)/accounts/page.tsx,
      which is inside the gate's own path filter, and npm run gate:diff-tokens
      was run and the file restored. CAUGHT, exit 1: a hex literal; a length
      written "1PX"; the CSS form "color: red;"; "border: 1px solid red".
      MISSED, exit 0 and the clean line printed: { color: "red" };
      { color: "navy" }; { borderColor: "lightgray" };
      <div style={{ color: "crimson" }} />;
      <div className="text-[red] border-[navy]" />;
      and const probe = "https://x.example/a"; const p2 = { padding: "12px" };
    why: >-
      The named-colour arm is :[[:space:]]*(NAMED)[[:space:];] so it requires
      the keyword to sit immediately after a colon and to be followed by
      whitespace or a semicolon. Every JavaScript and JSX way of writing a
      named colour puts a quote there instead, and the Tailwind arbitrary-value
      form has no colon at all. The gate is scoped to src/app and
      src/modules/*/ui, which is overwhelmingly TSX, so the arm that was
      widened this round is the one arm that cannot fire in the file type the
      gate mostly reads. The last miss is the same naive comment stripper as
      CRIT2-03: sed 's|//.*$||' discards everything after a double slash
      inside a string.
    the-false-claim: >-
      The script's own comment at scripts/gate-diff-tokens.sh:47 records that a
      clean-room review "found them blind to ... color: RED, color: navy,
      color: lightgray" and that "the colour list is the full CSS named set" as
      the remedy. Adding 148 keywords did not close the blindness for TSX,
      which is what the guard's readers will take from that sentence. R-087.
    honest-scope: >-
      This lane also scanned the branch's added lines for these shapes and
      found none, so the gate's green on THIS tree is a true statement, exactly
      as the script says of the earlier widening. The finding is that the guard
      does not hold for the next change, which is what criterion 14.10 makes it
      the whole guard for.
    fix: >-
      Add a quoted arm to the colour pattern, for example
      ["\x27][[:space:]]*(NAMED)[[:space:]]*["\x27] and a Tailwind
      arbitrary-value arm \[(NAMED)\], and strip comments with a scanner that
      knows about string literals rather than with a bare sed.

