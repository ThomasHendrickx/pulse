  against-the-branch-s-own-count: >-
    The branch reports 21 met, 4 partial, 0 not met. This lane reaches 14 met,
    8 partial, 3 not met. The gap is entirely accounting rather than
    disagreement about the artifact: seven of the eight partials are states the
    branch's own document describes accurately somewhere, and the two gate
    criteria turn on a slow-gate exit code the branch records honestly two
    blocks before it counts them green. The one substantive disagreement is
    14.4, where this lane derived a red witness the branch did not have.
  round-one-comparison: >-
    Round one recorded 12 of 25 and this lane reaches 14 of 25, which
    understates the round's real progress: 14.14, 14.16 and 15.4 moved from
    evidence that did not support them to executable tests against a real
    database, and three of the four guards round one broke now redden on the
    ordinary form of what they forbid. The count moves little because the fix
