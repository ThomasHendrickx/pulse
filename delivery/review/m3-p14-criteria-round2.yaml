- id: CR-P14C2-02
  severity: high
  evidence:
  - >-
    test/domain/account-number.test.ts:182 through :186, the REMOVES_SEPARATORS patterns,
    used by the test at test/domain/account-number.test.ts:224.
  - >-
    RED WITNESS. Prepended to src/modules/ledger/domain/corrections.ts: const counterpartyIdentityProbe
    = (counterpartyIban: string): string => counterpartyIban.toUpperCase().replace(/[^A-Z0-9]/g,
    ""); Ran npx vitest run test/domain/account-number.test.ts: 17 passed (17), exit 0. Reverted.
  - >-
    Probed the guard's own predicate extracted verbatim into a standalone script over six
    samples: MISSED .replace(/[^A-Z0-9]/g, ""), MISSED .replace(/[^a-zA-Z0-9]/g, ""), MISSED
    the SQL form regexp_replace(upper(x), ...) with the two functions in the other order,
    MISSED upper(translate(x, ' -', '')); CAUGHT the guard's own self-test shape and CAUGHT
    .replace(/\W/g, "").
  - >-
    Criterion 14.4's own words: the test must be written so that a SECOND implementation of
    the same transformation reddens it wherever it lives, including one written inline inside
    another module's identity derivation, and that this is what stops M3-P12's counterpartyIdentity
    from growing a private copy.
  analysis: >-
    The first JavaScript pattern requires the regex literal's character class to begin with
    one of backslash, s, hyphen or space, so a NEGATED class matches nothing, and the negated
    class is how an IBAN normaliser is most often written. SQL_CANONICALISATION at test/domain/account-number.test.ts:188
    pins one nesting order and two function names. The probe function is a working second
    copy of canonicalAccountNumber for every input this codebase hands it, it lives in the
    ledger domain, and the scope note at delivery/work-history/m3-p14.yaml:375 records that
    this very file carried one before the phase removed it. The detector's five mustCatch
    shapes are genuinely caught, so this is a coverage gap rather than a guard that catches
    nothing, and the three one-definition tests are unaffected. But the clause the criterion
    writes out at length, and names its purpose for, does not hold.
  concrete-fix: >-
    Detect the ACT rather than the idiom: match any .replace or .replaceAll whose second argument
    is the empty string and whose first argument is a regex literal at all, then decide by
    the existing proximity window; and for SQL, match upper together with any replace-family
    function inside one expression in either nesting order rather than one fixed order and
    two names.
- id: CR-P14C2-03
  severity: medium
  evidence:
  - >-
    test/application/account-registry.test.ts:392, the stripComments helper, used by rulesDeletedIn
    at test/application/account-registry.test.ts:395.
  - >-
    GREEN HALF CONFIRMED. Prepending an ordinary await tx.merchantRule.deleteMany({ where:
    { householdId } }); to src/modules/ledger/application/interpret-window.ts reddens the
    guard: npx vitest run test/application/account-registry.test.ts -t "no interpretation
    code path" gave 1 failed of 1 run. Reverted.
  - >-
    RED HALF, THE HOLE. Prepending the SAME call on a line that also carries const auditUrl
    = "https://audit.example/rules"; leaves the guard GREEN: 1 passed of 1 run, exit 0. Reverted.
  - >-
    The guard's own comment at test/application/account-registry.test.ts:381 calls it the
    ONE guard in either phase that holds an ABSOLUTE rule of the domain rather than a criterion's
    own assertion, and decision D-49 rests on it twice.
  analysis: >-
    stripComments treats the double slash inside a string literal as the start of a line comment
    and discards the rest of the line, taking the delete with it. The construction is contrived
    and nothing in the tree writes a delete after a double slash on the same line today, which
    is why this is rated medium; the ordinary forms are all caught and the guard is a real
    improvement on the one round one broke. The flaw fires for any string or regex literal
    containing a double slash ahead of code on that line, so it is a property of the stripper
    rather than of the example.
  concrete-fix: >-
    Strip comments with a scanner that tracks string and template-literal state, or keep the
    naive strip only for deciding whether a MATCH sits inside a comment, by matching the un-stripped
    text and rejecting a hit whose line begins with a comment marker.
- id: CR-P14C2-04
  severity: medium
  evidence:
  - >-
    scripts/gate-diff-tokens.sh:60 (the NAMED alternation and the COLOUR pattern) and scripts/gate-diff-tokens.sh:84
    (the comment stripper).
  - >-
    Each probe was appended as one line to src/app/(app)/accounts/page.tsx, inside the gate's
    own path filter, then npm run gate:diff-tokens was run and the file restored. CAUGHT,
    exit 1: const probe = "#b22222"; const probe = { padding: "1PX" }; const probe = "color:
    red;"; const probe = "border: 1px solid red".
  - >-
    MISSED, exit 0 and the clean line printed: const probe = { color: "red" }; const probe
    = { color: "navy" }; const probe = { borderColor: "lightgray" }; const probe = <div style={{
    color: "crimson" }} />; const probe = <div className="text-[red] border-[navy]" />; and
    const probe = "https://x.example/a"; const p2 = { padding: "12px" };
  - >-
    The script's own comment at scripts/gate-diff-tokens.sh:47 records that a clean-room review
    found the pattern blind to color: RED, color: navy and color: lightgray, and gives the
    full 148-keyword set as the remedy.
  analysis: >-
    The named-colour arm is :[[:space:]]*(NAMED)[[:space:];] so it requires the keyword to
    sit immediately after a colon and to be followed by whitespace or a semicolon. Every JavaScript
    and JSX way of writing a named colour puts a quote there instead, and the Tailwind arbitrary-value
    form has no colon at all. The gate is scoped to src/app and src/modules/*/ui, which is
    overwhelmingly TSX, so the one arm the fix round widened is the arm that cannot fire in
    the file type the gate mostly reads; adding 148 keywords did not close the blindness the
    comment says it closed, which is R-087. The last miss is the same naive comment stripper
    as CR-P14C2-03. This lane also scanned the branch's added lines for these shapes and found
    none, so the gate's green on THIS tree is a true statement; the finding is that it does
    not hold for the next change, which is what criterion 14.10 makes it the whole guard for.
  concrete-fix: >-
    Add a quoted arm to the colour pattern and a Tailwind arbitrary-value arm, so a named
    colour is caught whether it follows a colon, a quote or an opening bracket, and replace
    the sed comment strip with one that does not fire inside a string literal.
