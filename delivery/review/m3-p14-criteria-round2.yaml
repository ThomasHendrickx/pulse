    and leave the token on a SQL comment line reading -- the ring scoping used to read AND
    ${POT_ROW} here, which Postgres comments out. Ran the guard: 9 passed (9). Ran npm test:
    489 passed (489), exit 0. Reverted.
  - >-
    WITNESS THREE, hazards H14.10 and H14.14. Delete AND ${POT_ROW} from the WHERE of monthFigures
    at overview-repository.ts:297 and add it inside an existing aggregate filter in the SELECT
    list, COUNT(*) FILTER (WHERE t."flow" IS NOT NULL AND ${POT_ROW}), so the uninterpreted
    count now counts a reserve account's held rows. Ran the guard: 9 passed (9). Ran npm test:
    489 passed (489), exit 0. Reverted.
  - >-
    The cause of witness ONE: POT_ROW is a substring of NON_POT_ROW, so expect(shared).toContain("POT_ROW")
    at test/domain/absent-flow-reads.test.ts:329 is satisfied by the held arm's own predicate
