  - id: CRIT2-11
    severity: medium
    title: >-
      The reserves two-surface-form state is not reachable through any shipped
      ingest path, so the seventh assertion witnesses a state the product cannot
      produce and the branch's own invariant test asserts the opposite
    criteria: ["14.2", "14.4"]
    where: >-
      test/e2e/overview-reads.spec.ts:246 through :262 (the comment justifying
      the seeded fixture) against test/domain/counterparty-key-invariant.test.ts:32
      through :48 (the reachable-set comment and its list), with
      src/modules/import/domain/detect-profile.ts:45 and :313.
    the-judgement-this-lane-was-asked-for: >-
      THE REFUSAL IS RIGHT, AND ITS MEASUREMENT REPRODUCES. detect-profile.ts:45
      defines IBAN as /^[A-Z]{2}\d{2}[A-Z0-9]{8,30}$/, anchored and compact, and
      detect-profile.ts:313 assigns a counterparty-account column only when
      values.every((value) => IBAN.test(value)). A spaced cell therefore drops
      the whole column, and because the test is EVERY rather than SOME, a MIXED
      column drops it too. So there is no way to write any spaced counterparty
      cell into a delimited fixture, and the review's suggested second half
      would indeed have removed the join's input rather than made it
      discriminate. The implementer was right to refuse it and right to build
      the discriminating input by seeding the column directly.
      IT GOES FURTHER THAN THE REFUSAL CLAIMS. The justification given is that
      "the delimited parse stores the cell verbatim while the PDF path
      canonicalises, so one household really can hold both forms for one
      account". That mechanism does not work either. Every upload re-detects
      (src/modules/import/application/upload-statement.ts:84 through :86 matches
      a stored profile by specEquals over a freshly detected spec), so a later
      file whose cells are spaced detects a spec with no counterparty column and
      matches no stored profile; it never reaches the verbatim store. The PDF
      path canonicalises at src/modules/import/domain/belfius-current-account-template.ts.
      So no shipped path can put a spaced value in Transaction.counterpartyIban.
      THE BRANCH SAYS SO ITSELF, IN THE OTHER DIRECTION.
      test/domain/counterparty-key-invariant.test.ts:32 states that "the
      reachable set is upper-case, compact, and account-shaped" and builds its
      whole assertion on that, citing the same two producers. The two comments
      cannot both be true, and the invariant test's version is the one the code
      supports.
    consequence: >-
      The seventh assertion is satisfied literally and is worth keeping as
      defence in depth, but it does not discriminate a state a household can be
      in, and criterion 14.2's own premise, that "the stored column really does
      hold two surface forms for one account", is false at this tree. The
      separate clause "the fixture writes its counterparty accounts in the
      spaced surface form precisely so that a join over raw values cannot pass"
      is unsatisfiable through the delimited path and remains unmet.
    fix: >-
      Correct the comment at test/e2e/overview-reads.spec.ts:250 to say the
      state is seeded because no shipped path produces it, and correct the
      criterion's premise, or record it as a plan defect for the next round.
      This is a plan finding as much as an implementation one and the plan is
      where it should land.

  - id: CRIT2-12
    severity: low
    title: >-
