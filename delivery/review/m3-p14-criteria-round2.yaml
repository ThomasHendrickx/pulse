deviations-judged:
- deviation: >-
    src/modules/ledger/domain/corrections.ts and src/modules/ledger/domain/pair-transfers.ts,
    touched although files-to-touch does not name them
  serves-plan-intent: true
  reasoning: >-
    It serves the intent directly. Criterion 14.4 names an inline copy inside another module's
    identity derivation as the exact shape to catch, and corrections.ts carried one in counterpartyKey;
    leaving it would have made 14.4 unreachable. pair-transfers.ts compares a stored counterparty
    column against the declared-set map, so canonicalising one side and not the other would
    have half-applied the change. Both files are inside src/modules/ledger/domain, whose sibling
    layers the declaration does list. The change is additionally pinned by an invariant test
    at test/domain/counterparty-key-invariant.test.ts, whose enumeration claim is separately
    a finding (CR-P14C2-12) but whose two behavioural assertions do hold.
- deviation: >-
    src/modules/merchants/adapters/merchant-repository.ts, listed by M3-P15's declaration
    and not by M3-P14's
  serves-plan-intent: true
  reasoning: >-
    M3-P15 step 5 names that read explicitly and M3-P14's conflicts-with records that the
    two phases reach a household together on one branch. The file is in scope for the pair,
    the edit is the pot-account scoping that step asks for, and no M3-P14 criterion is affected
    by it.
- deviation: scripts/gate-diff-tokens.sh is new and is not in files-to-touch
  serves-plan-intent: true
  reasoning: >-
    Criterion 14.10 requires the phase to assert by its own diff-scoped grep that no added
    line carries a colour literal or a length, and to record that grep's output. Writing it
    as a committed script rather than a one-liner is what let it be shown red against injected
    offenders and is what lets a reviewer re-run it, which this lane did. The deviation serves
    the criterion. It does not follow that the script is adequate: finding CR-P14C2-04 shows
    it blind to the notation its own file type uses.
