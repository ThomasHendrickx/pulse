what-this-contract-did-not-reach:
  - >-
    THE SLOW GATE WAS NOT RUN BY THIS LANE. Every statement about browser-level
    behaviour rests on the branch's recorded canonical run, not on an
    independent execution. If that run is wrong in either direction, so is this
    document.
  - >-
    THE ONE FAILURE'S CAUSE IS NOT INVESTIGATED HERE. This lane judged only what
    it undermines. Whether the registration path carries a race is open.
  - >-
    THE CRITERIA DO NOT REACH THE COUNTED READ'S RING PREDICATE IN A GREEN GATE.
    Criterion 14.15 asserts the one-entry property by construction and criterion
    14.14 case FIVE explicitly excludes the counted read from its enumeration.
    The only executable guard on it is in the slow gate. That is a gap in the
    CONTRACT and not only in the artifact, and finding CRIT2-01 is what it costs.
  - >-
    NO CRITERION IN EITHER PHASE ASKS WHETHER THE TWO-SURFACE-FORM STATE IS
    REACHABLE. Both phases assume it is, and CRIT2-11 shows it is not. A review
    that executed both contracts faithfully would not have asked.
  - >-
    THE PRIVACY GATE'S OWN INTERMITTENCY, disclosed by the branch as OQ-1, was
    not reproduced here: this lane ran gate:privacy once and it exited 0. That
    is one sample and it is not evidence about the intermittency either way.
  - >-
    "ALL ACCEPTANCE CRITERIA MET" WOULD NOT BE A TERMINAL GREEN EVEN AT 25 OF
    25. The four guards this round rebuilt were all green over the states they
    forbid before it, and three of them are green over a state they forbid now.
    The count is a statement about the contract; the red witnesses above are the
    statement about the artifact.

