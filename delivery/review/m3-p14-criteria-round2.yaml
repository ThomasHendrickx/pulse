    leading clause quoted verbatim from the phase contract; the full text runs
    to several hundred words per criterion and is not reproduced, and the
    verdict below names the specific clause it turns on in every case where the
    verdict is not met.
  M3-P14:
    - id: "14.1"
      quote: "THE OWNER'S SCENARIO, END TO END, AND THE FIXTURE IS PROVED CAPABLE OF FAILING."
      verdict: met
      evidence: >-
        test/e2e/accounts.spec.ts:188 (control arm) and :215 (registered arm),
        both reported passed in the branch's canonical run. The control arm
        keys on a hand-written list of the seven counterparty texts, so the
        registered arm's zero is a set difference. Every fixture account number
        is asserted valid in the fast gate by test/domain/account-number.test.ts,
        which this lane re-ran green.
    - id: "14.2"
      quote: "THE SAVINGS CASE, WHICH NO EXISTING TEST CAN CATCH."
      verdict: partial
      evidence: >-
        Six of the seven assertions are made in the registered arm. The seventh
        is now made, at test/e2e/overview-reads.spec.ts:264, over a household
        holding one reserve account in two surface forms, and it does
        discriminate a raw GROUPING as well as a raw join. What is not met is
        the criterion's own fixture clause, that the fixture "writes its
        counterparty accounts in the spaced surface form", which findings
        CRIT2-11 shows to be unsatisfiable through the delimited path. The
        branch's own entry carries a partial block for this criterion and
        counts it met anyway (CRIT2-05).
    - id: "14.3"
      quote: "ADOPTION, NOT DUPLICATION."
      verdict: met
      evidence: >-
        Three cases at test/application/account-registry.test.ts:144 onward,
        including a spaced lower-case registration adopted by a compact import,
