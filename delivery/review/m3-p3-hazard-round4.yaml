findings:
  - id: HZ4-M3P3-01
    severity: low
    evidence:
      - "The second candidate doubles the accidental-match surface and I found a wrong-statement link it uniquely enables. Construction, invented values: card statement A carries an unclaimed positive row so it offers two totals, its debit-sum candidate coincides with card statement B's only total, and A's period end is nearer the debit than B's, so the tie-break at src/modules/ledger/domain/interpret.ts:114 prefers A."
      - "DEMONSTRATED: the debit classifies INTERNAL and is linked to statement A, and the coinciding value is the candidate ROUND 4 ADDED, so this is a link round 3 could not have made. With the same construction against the candidate round 3 already offered, the collision exists in both rounds, so only the debit-sum arm is new."
      - "EVERY CONSEQUENCE I COULD CONSTRUCT IS LOUD, and I say so as plainly as I say the defect. In the collision the books come back OPEN and the debit surfaces in the unmatched internal legs. Adding the debit that truly belonged to the mis-credited statement gives one INTERNAL and one SPEND with a single link, again with the books open. The design's own claim at src/modules/ledger/domain/interpret.ts:97, that a loser falls through to honest unitemised SPEND so an exact-cent coincidence can never make real spend vanish, holds in every case I built."
      - "What the mis-credit costs is the settlement RECORD rather than the month: an import is consumed by a debit that did not pay it, so the debit that did will find it already allocated and fall to SPEND, moving a loud gap into a later month than the coincidence that caused it."
      - "The exposure is bounded by construction and I measured the bound: never more than two candidates over 4000 randomised statements, exactly one whenever a printed figure is stored, and the two differ by exactly the unclaimed positive rows, which can be as little as one cent."
    concrete-edit: >-
      Add one term to the settlement tie-break at
      src/modules/ledger/domain/interpret.ts:114, before the import-id
      fallback: prefer a candidate import whose settlementTotalsCents has ONE
      entry over one that has two, so an unambiguous statement always outranks
      an ambiguous one at the same date distance. That removes the collision
      demonstrated here without touching the candidate design, and it costs a
      comparison. Pin it with the two-import construction above, which is red
      against the current tie-break.
    analysis: >-
      Low, deliberately. The candidate design is the right answer to the
      ambiguity and I am not arguing against it: a debit equal to one of two
      derivations really is evidence of which the document meant. This is the
      price it charges, it is bounded, it is loud everywhere I could push it,
      and the fix is one clause in a comparator. I raise it because the round
      asked to be attacked on exactly this point and because a mis-credited
      statement is a real defect in the settlement record even when the
      month's totals survive it.
  - id: HZ4-M3P3-02
    severity: low
    evidence:
      - "The paragraph this round added to the allow list to make that file describe the script now overstates it again. test/fixtures/allowed-identifiers.txt:16 says account shapes are matched case-insensitively and accept letters in the account body. Each half is true of one pattern and the conjunction is true of neither."
      - "The two patterns split the space and neither covers the overlap. scripts/gate-privacy.sh:64 takes either case but requires a digits-only body in the Belgian grouping; scripts/gate-privacy.sh:65 accepts letters in the body but is upper-case only and compact only. Both restrictions are deliberate and the round documents why, base64 asset fragments and a separator-tolerant match running past the account into the next word, and I accept both as measured engineering choices."
      - "DEMONSTRATED, with the probe tracked so the scan actually reads it: an unlisted account carrying letters in its body slips both patterns when written in lower case, when written with spaces, and when written with hyphens. All three exit 0. The same value in compact upper case is caught, which is the round's own red witness and it works."
      - "The benign direction is affected too and shows the same hole from the other side: a LISTED foreign account written in the spaced form is never compared at all, so the allow list's older promise that spaces and dashes are ignored when matching does not reach a non-Belgian account number in any form."
      - "Nothing in the tree currently slips: the three newly listed published examples are compact and upper case, they are compared, and the gate is clean. This is a latent documentation defect rather than a live exposure."
    concrete-edit: >-
      Correct test/fixtures/allowed-identifiers.txt:16 to say what the two
      patterns actually cover: an account number in the Belgian digits-body
      shape is matched in either case and in either the compact or the spaced
