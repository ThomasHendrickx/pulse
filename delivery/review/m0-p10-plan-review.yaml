  - id: PR142-005
    severity: high
    evidence:
      - "Criterion 14.2's seventh assertion seeds ONE reserve account, ONE label, and TWO rows, and asserts exactly three things: 'that exactly ONE reserve movement group comes back, that its label is byte identical to the household's typed label and carries no account-shaped token, and that its parked total is the sum of both rows'."
      - "The group's own key is never asserted. src/modules/overview/adapters/overview-repository.ts:186 returns `counterpartyIban: row.counterpartyIban` as a field of ReserveMovementGroup, and :187 uses it as the label fallback, so it is observable and is the value the grouping key produces."
      - "An implementation that joins on the normalised value and writes `SELECT ra.\"iban\" AS \"counterpartyIban\", ra.\"label\" ... GROUP BY 1, 2` satisfies all three clauses over this seed: one group, the typed label, the sum of both rows. It has NOT normalised the grouping key, it has replaced it with the joined account's column, and it collapses every reserve row whose counterparty matches no registered account into a single group whose key and label are both null, against a declared type of `counterpartyIban: string`."
      - "An implementation grouping on the label alone likewise satisfies all three clauses over this seed, and merges two reserve accounts a household happened to give the same typed label into one line with their money summed."
    concrete-edit: >-
      In criterion 14.2's seventh assertion, replace "The test creates a
      household holding one reserve account" through "and writes TWO
      transaction rows" with: "The test creates a household holding TWO reserve
      accounts with DIFFERENT account numbers and DIFFERENT typed labels, each
      stored in the canonical form of the number the household would type, and
      writes THREE transaction rows directly to the transactions table", and
      replace the assertion clause with: "asserts that exactly TWO reserve
      movement groups come back, one per reserve account; that each group's
      label is byte identical to that account's typed label and carries no
      account-shaped token; that each group's own counterparty-account field is
      byte identical to the canonical form of that account's number, which is
      what pins the GROUPING KEY itself rather than a property that happens to
      be one-to-one with it in a thinner seed; and that the first group's
      parked total is the sum of its two rows and the second group's is its one
      row, each compared against a string written by hand in the test from the
      seed's own arithmetic and never read back from the implementation."
      Keep the two-surface-forms clause on the first account's pair of rows.
    analysis: >-
      This is the construction the adversarial stance asks for: an
      implementation that satisfies every clause as written and is still wrong.
      The criterion's entire stated purpose is to pin the grouping key, and
      over a seed with one account, one label and one number, every candidate
      key is one-to-one with every other, so the assertion cannot tell them
      apart. Grouping on the joined account's column is the more natural wrong
      answer and is invisible here; grouping on the label is the more damaging
      one and is invisible here too. Adding a second account with a distinct
      label and asserting the group's own key costs the seed one row and closes
      both.
