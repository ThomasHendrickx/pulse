  - id: PR142-007
    severity: medium
    evidence:
      - "src/platform/account-number.ts on claude/m3-p14-account-registry: `export const canonicalAccountNumber = (value: string): string => { const stripped = value.replace(/[\\s -]/g, \"\").toUpperCase(); return CANONICAL_SHAPE.test(stripped) ? stripped : value; };` The form is SHAPE GATED and returns a non-account-shaped value UNCHANGED, and the file's own comment says why: the stored counterparty column 'often holds a free-text descriptor', and upper-casing one is 'a silent change of meaning in the one place this codebase is most careful about'."
      - "The SQL copy at overview-repository.ts:115 carries NO shape guard and transforms unconditionally, so the two copies disagree on exactly the input class the platform module singles out."
      - "The agreement test on that branch, 'the permitted SQL copy strips the SAME character class as the platform form', asserts the CHARACTER CLASS only and not the shape guard, and no criterion requires either test."
    concrete-edit: >-
      In criterion 14.2, after the sentence requiring both halves of the read
      to normalise, add: "The SQL copy of the canonical form is held to the
      platform form's BEHAVIOUR and not only to its character class: a test
      asserts the two agree over an enumerated corpus that includes at least
      one value which is NOT account shaped, because the platform form is shape
      gated and returns such a value unchanged
      (src/platform/account-number.ts) while an unguarded SQL expression
      upper-cases it and strips its separators, which merges two descriptors
      that differ only in case or spacing into one group and mangles the value
      the read hands back. Either the SQL copy carries the same shape guard or
      the test records, with its reason, the input class on which the two are
      allowed to differ."
    analysis: >-
      14.2 mandates a second copy of a transformation whose defining subtlety
