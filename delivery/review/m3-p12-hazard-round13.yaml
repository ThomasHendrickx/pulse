    nothing for a second caller to call. In the same change correct the three sentences quoted above,
    per clause R-087, keeping the old wording rather than deleting it. If neither construction is affordable,
    say in runtime-target.ts's header that the register proves consistency between two caller-supplied
    values and NOT that an operator named a target, and change guard.ts:180's reason line so it does
    not assert a command line.
  analysis: 'FINDING: The approval register is still a flag, because the evidence it re-runs comes from
    the caller on both sides. This is round eleven''s HZ11-M3P12-02 and round eleven''s CR11-M3P12-04,
