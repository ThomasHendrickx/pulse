deviations-judged:
  - deviation: >-
      M3-P3 "migrations: none, template and fixtures only."
      (delivery/plan/pulse-v02.yaml, phase M3-P3).
    serves-plan-intent: true
    reasoning: >-
      Judged on the merits and on an executed construction rather than on
      the argument as written. The claim to test is that every
      storage-free alternative re-derives the settlement figure and breaks
      when the previous statement was not paid in full. I built two
      synthetic card documents in memory, identical except that in one the
      settlement credit cancels the previous balance and in the other it
      does not, and compared three candidate definitions against the
      figure each document itself prints. On the fully paid document the
      row-sum derivation is already wrong, by exactly the refund, while
      the minus-sum-excluding-the-credit derivation is right. On the
      underpaid document BOTH derivations are wrong and only the stored
      figure is right. The argument holds as stated, and the phase's own
      refund fixture is the weaker of the two cases rather than the
      stronger. The deeper reason stands on its own: the settlement figure
      is printed by the document, so it is a fact, and CLAUDE.md
      non-negotiable 5 with pulse-domain's facts-versus-interpretation
      split make storing a fact the rule and recomputing it the exception.
      ON THE TWO-CODE-PATHS QUESTION, which is the real risk in a nullable
      column with a fallback, and which I checked rather than reasoned
      about: there is exactly ONE branch, at
      src/modules/ledger/domain/ledger-transaction.ts line 143, and it
      sits at the boundary where the fact is read. Everything downstream,
      including the candidate filter at
      src/modules/ledger/domain/corrections.ts line 99, sees a single
      resolved value and has no null to consider. The fallback arm is not
      dead and not merely theoretical: the repository reads back only rows
      whose column is not null (src/modules/ledger/adapters/ledger-repository.ts
      line 123), so a card account fed by a delimited card export, which
      prints no such figure, takes it, and the pre-existing corrections
      tests exercise that arm because they call the summary without the
      map. So the shape is one branch with both arms covered, not two
      paths one of which can rot. The residual risk is a card import whose
      statement DID print a figure but whose column is null, which can
      only arise from rows written before this migration; that is
      measurably impossible here, since the card template does not exist
      on origin/main at all. One migration, one nullable column, written
      once with the rows and never updated, is the smallest change that
      closes the finding, and escalating it rather than deciding it
      quietly was correct.
  - deviation: >-
      M3-P3 files-to-touch: src/modules/import/domain/, test/fixtures/,
      test/domain/, test/application/, test/e2e/import.spec.ts; extras [].
      Reinforced by decision D-19, which describes M3-P3 as changing no UI
      file.
    serves-plan-intent: true
    reasoning: >-
      Each of the eight extra paths is owed by a finding rather than
      chosen, and I checked the UI claim specifically because it is the
      one that could quietly collide with the mobile rebuild phases. The
      UI delta is exactly a new constant module, one export line, a slice
      that reads the constant and two message strings that interpolate a
      count. No stylesheet and no layout is touched, and no overview
      surface appears in the delta at all. The ledger and persistence
      paths are unavoidable: the settlement figure has to travel from the
      parse to the stored row and be read where a card import is
      summarised, and none of those files sit in the declared list.
      Declaring it rather than letting D-19's now-false sentence stand is
      the right handling.
  - deviation: >-
      Fix-round dispatch: "Do not touch anything under delivery/intake/."
    serves-plan-intent: true
    reasoning: >-
      Correct restraint, and I verified the underlying fact rather than
      the account of it: the real continuation line is still present at
      delivery/intake/pulse-v0.2-pdf-addendum.md line 79, and I left it
      alone. This is finding CR-M3P3-08 and it remains OPEN. Escalating an
      owner-authored document instead of editing it under a dispatch that
      forbids it is the only defensible move, and the deviation names both
      halves the owner has to decide: the line itself, and whether history
      needs the same purge the phase's own earlier leak received.
  - deviation: >-
      CLAUDE.md non-negotiable 8 and fleet warning 12: nothing from a real
      statement is committed, in any form, and the repository is public.
    serves-plan-intent: true
    reasoning: >-
      Reaching into two files this phase does not own to remove a
      non-round, seven-significant-digit figure that occurs in a real
      document was right, and the judgement that its coincidence is not
      plausible is one I share: a value of that precision matching a real
      statement, and appearing in a source comment as an illustrative
      example, is what transcription looks like. Verified at this head:
      the figure occurs in the real document and returns zero hits in the
      tree in every rendering form probed. The honest limit is recorded
      too, that HEAD is clean and history is not, and that the purge is
      the owner's call. Leaving a real amount in a public tree for the
      phase that happens to own the file would have been the worse
      reading of the rule.
  - deviation: >-
      Same clause as DEV-M3P3-04, recorded separately because the decision
      went the other way.
    serves-plan-intent: true
    reasoning: >-
      The asymmetry between this and the previous deviation is the part
      worth judging, and it is defensible. The distinguishing property is
      not convenience but information content: a round figure of few
      significant digits carries almost none, and both review lanes
      independently reached the same reading in round 1. Replacing it
      would churn three committed fixtures and the merged records that
      quote totals derived from them, which is real cost against a
      coincidence. What makes the disposition acceptable rather than
      merely comfortable is that it is not a silent hold: the gate entry
      is corrected from 341 of 341 to 340 and 1, the judgement is written
      where the count used to hide it, every location is listed, and the
      decision is handed to the owner. That is the shape my round-1
      finding CR-M3P3-05 asked for.
  - deviation: >-
      Same clause again, for a class no gate and neither review lane
      reached.
    serves-plan-intent: true
    reasoning: >-
      This one goes beyond the findings and is the most valuable thing in
      the round. Sweeping the tree for multi-word capitalised runs is the
      shape of the class that actually leaked twice, and doing it
      unprompted is the right instinct. I reproduced the two results that
      matter. The place-token count is exactly two, one per document, each
      in six tracked files, each a bare single token inside an otherwise
      invented descriptor and each already present in the codebase's own
      generic city vocabulary; leaving them and recording them is
      proportionate, because a bare town name identifies nobody. The
      choice to change the one token this round had itself authored, on
      the ground that measured-absent is free for new content, is the
      correct asymmetry and is exactly the reverse of the habit that
