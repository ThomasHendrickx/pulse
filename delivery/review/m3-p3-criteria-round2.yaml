findings:
  - id: CR2-M3P3-01
    severity: low
    evidence:
      - "The card template's registered version is unchanged at src/modules/import/domain/kbc-mastercard-template.ts line 345, while this round changed both what the template RETURNS (a settlement total, and a spec-borne account identifier) and what it ACCEPTS (a document carrying no card number, or two different ones, is now a loud structure error where it previously parsed)."
      - "src/modules/import/domain/parse-pdf-statement.ts states at line 25 that a declared templateVersion must equal the registered one or the parse fails closed, and that a version bump is a migration, never a silent reinterpretation of stored bytes. That guard is the mechanism the codebase names for exactly this change, and it does not fire, because the number did not move."
      - "Executed probe: a stored spec of the pre-round shape parses successfully through parseSourceProfileSpec, and specEquals against a fresh detection of the SAME card returns false. A pre-existing profile would therefore be treated as an unknown source, asked for a fresh declaration, and given a second account for a card that already has one, with the earlier rows left behind in the first."
      - "EXPOSURE IS NIL TODAY, measured rather than assumed: git cat-file confirms the card template does not exist on origin/main, so no deployed database can hold a spec of this template at all, and the Belfius spec is unaffected because it carries no identifier and absent stays absent through canonicalisation."
    concrete-fix: "Bump the version at src/modules/import/domain/kbc-mastercard-template.ts line 345 to 2 before this phase merges, while the bump is free because no stored declaration names version 1 anywhere outside this branch. The behaviour at risk is not today's data but the next template that gains a spec field: the version guard is the only thing that distinguishes a stored declaration this build can still honour from one it cannot, and leaving it at 1 through a change of this size teaches the next reader that it does not have to move."
    analysis: "Filed low rather than higher only because the deployed exposure is measurably zero. The discipline point stands on its own: the round changed the meaning of a version-1 declaration, and the repository's own stated rule is that meaning changes come with a number."

  - id: CR-M3P3-08
    severity: low
    evidence:
      - "CARRIED FORWARD FROM ROUND 1, still open, verified present at this head rather than assumed: delivery/intake/pulse-v0.2-pdf-addendum.md line 79 quotes a continuation line from the real 0f79fa3d document verbatim, including its original-currency figure. My whole-tree sweep at cf4738e returns it as a hit; I did not edit it."
      - "The implementer could not close it: the fix-round dispatch forbids touching delivery/intake/, and the file is owner-authored. It is declared as deviation DEV-M3P3-03, which states both halves the owner has to decide."
      - "It sits outside criterion 3.5 half (a)'s four named categories, so the criterion still exits 1 with it present; that is why the criterion is met and this finding is still open at the same time."
      - "Fleet warning 12 makes it materially worse than it looked in round 1: the repository is public by owner decision DR-0024, so the line is world-readable now and history keeps it after any later correction."
    concrete-fix: "Owner action, not implementer action. Replace the quoted figure and currency in the example at delivery/intake/pulse-v0.2-pdf-addendum.md line 79 with an invented pair, since the sentence teaches a line shape and loses nothing by it, and decide separately whether main's history needs the purge this phase's own earlier leak received. Recorded here so that approving the phase does not close the item: nothing in this verdict discharges it."

