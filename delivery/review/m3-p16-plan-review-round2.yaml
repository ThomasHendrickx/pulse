findings:
  - id: R2-M3P16-01
    severity: high
    analysis: |-
      THE INSTRUMENT'S MOST LIKELY ANSWER IS ONE NO CRITERION ADMITS, SO THE
      PHASE HAS NO TERMINAL STATE. This is the brief's first and second
      questions and they have one answer, because the absent-value marker and
      the 404 fail in the same way.

      START WITH WHAT THE FIX ROUND GOT RIGHT, because the finding is not that
      the marker is a hole through which "absent" becomes a pass. It is not.
      Criterion 16.3 is explicit and correct: "Where the fetch returns 404, any
      non-200 or the absent-value marker ... no invocation of the routine is
      made against any database until the fetch succeeds." An implementer
      cannot proceed on a marker. The distinction the fix round drew is real in
      the direction it was drawn.

      THE HOLE IS THE OTHER DIRECTION: THE PHASE CANNOT STOP EITHER. Criterion
      16.1's escape branch is keyed on one specific non-entry, "WHERE THE ENTRY
      CONDITION FAILS, meaning the sha the build stamp returned is not a
      descendant of the M3-P12 merge", and it requires a record that "carries
      that fetch and that sha, shows the ancestor test failing". A 404 returns
      no sha. A non-200 returns no sha. The marker is defined precisely as NOT
      a sha. In every one of those cases there is no sha to record, no ancestor
      test to run, and therefore nothing to show failing, so the BLOCKED ON THE
      DEPLOY branch does not apply. 16.3 says wait. 16.1 says nothing. The
      phase is neither met, nor failed, nor blocked.

      AND THE MARKER CAN BE PERMANENT, WHICH IS WHAT MAKES THE WAIT UNBOUNDED
      RATHER THAN MERELY LONG. The plan asserts the marker means one thing:
      "the deployment is not yet serving a build that carries the route". It
      means one of two things and the phase cannot tell them apart. Either the
      deploy has not landed, which resolves by waiting, OR the deploy HAS
      landed and the platform does not set that variable for this project,
      which never resolves by waiting. The second is not hypothetical here.
      Nothing in this repository has ever read a platform build variable: zero
      hits for VERCEL_GIT_COMMIT_SHA, VERCEL_URL, VERCEL_ENV, commitSha or
      buildId anywhere under src, scripts, test or the config files, no
      vercel.json and no .vercel directory. Whether the variable is exposed to
      this project's builds is a project setting, and this fleet cannot read
      this project's settings: the phase's own verified-root-cause records the
      connector returning 403. So the single load-bearing premise of the whole
      instrument is the one premise nobody in the phase can check.

      LOOK AT WHAT STEP 1 ACTUALLY VERIFIES AND THE GAP IS STARK. It is a
      verification-first step and it verifies TWO claims: that nothing in the
      tree can name the deployed build today, and that the deployed database is
      reachable over a pinned pooler. Both are already known. The THIRD claim,
      that the platform will supply a build commit for this project at all, is
      the only one the phase actually rests on, and it is not in the list.

      THE FIRST-RUN 404, ASKED SEPARATELY IN THE BRIEF, IS THE SAME HOLE PLUS
      ONE MORE THING. The fix round's non-circularity argument is sound as far
      as it goes: a build without the route cannot answer, so the instrument
      does report its own presence and cannot be faked into existence. What the
      argument does not reach is what an implementer DOES in the interval. Step
      3 says "Merge and deploy the instrument". The merge is in the phase's
      power. THE DEPLOY IS NOT: this repository's own record establishes that
      deploys are not performed from a fleet container and are deferred to a
      deploy-verify stage after merge (delivery/work-history/m1-p1-notes.md:26,
      "no push, no deploy from here ... deferred to deploy-verify after
      merge"), and the connector that would let an implementer even OBSERVE a
      deploy returns 403. So step 3 mandates an act outside the phase, the
      criteria describe no state in which that act has not happened, and the
      implementer's honest options are to wait indefinitely on something they
      can neither trigger nor check, or to write something. This is the same
      structure round one's PR-M3P16-06 named, moved to a new trigger and made
      worse: there the correct implementer merely could not close the phase,
      here they cannot close it and cannot say why in any form a criterion
      recognises.

      A SECOND-ORDER CONSEQUENCE OF THE MID-PHASE MERGE, noted because it falls
      out of the same step. Criterion 16.5 asserts scope "by git diff
      --name-only against the phase base". Step 3 merges the branch into the
      trunk partway through the phase and step 9 then keeps the branch open for
      the run's numbers. After that merge "the phase base" is ambiguous, and
      the tightest clause in the newest criterion is the one that loses its
      referent. The fix is the same fix: say what the phase does across the
      merge.

      THE STEP 9 CITATION IS ALSO NOT THE SHAPE IT CLAIMS. It says the branch
      staying open is "in the shape M3-P2's criterion 2.8 already uses for an
      after-merge production check". Read side by side they are opposite
      mechanics. 2.8 reads "After merge, the DR-0001 release verification
      extended by one production check passes", which closes the phase and puts
      the check in a later release stage. M3-P16 merges mid-phase and keeps the
      branch taking commits afterwards. Nothing in the plan describes how a
      branch that has already merged continues and merges again.
