      the M3-P12 merge OR that the fetch did not return a sha at all (404, any
      non-200, or the absent-value marker) after the wait criterion 16.3
      bounds, this criterion is met instead by a record that carries every
      fetch made, each with its URL, status and body, the ancestor test and its
      output where a sha was returned, a statement that NO invocation of the
      routine was made against any database, and the phase recorded as BLOCKED
      ON THE DEPLOY rather than met or failed; criteria 16.2 and 16.3 do not
      apply to such a record, and criteria 16.4 and 16.5 do."

      TWO, bound the wait and name who ends it. Append to criterion 16.3: "The
      wait is bounded and its bound is recorded: where the route has not
      returned a sha after the deploy the phase asked for, the phase records
      BLOCKED ON THE DEPLOY under criterion 16.1 rather than waiting further,
      because neither the deploy nor the platform setting that stamps it is in
      this phase's power (delivery/work-history/m1-p1-notes.md:26) and an
      unbounded wait is indistinguishable from a phase that stopped."

      THREE, add the missing premise to step 1 and the merge mechanics to step
      3. To step 1's list add: "THREE: whether the deployment platform supplies
      a build commit to this project's builds at all. This cannot be settled
      from inside this container (the connector returns 403 for this project),
      so it is recorded as the phase's one UNVERIFIED premise, named as such,
      and the absent-value marker returned by a deployed build is the
