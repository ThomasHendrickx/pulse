  - id: R2-M3P16-08
    severity: medium
    analysis: |-
      CRITERION 16.5 ASSERTS A PRODUCTION-SMOKE ASSERTION AND THEN GREEN-LIGHTS
      ON THREE COMMANDS THAT NEVER EXECUTE IT. The criterion's own gate list is
      the wrong gate, so an implementer can add the assertion, never run it, and
      satisfy every command the criterion names.

      16.5 requires that "The production smoke spec asserts the route answers
      200 and that its field is either a lowercase hexadecimal string of at
      least seven characters or that marker, and, when the spec runs against a
      deployed origin, that it is the hexadecimal one", and then closes with
      "npm run typecheck, npm run lint and npm test exit 0 with those tests in
      them".

      npm test IS NOT THE GATE THAT RUNS THAT SPEC. The fast gate is Vitest over
      test/** minus e2e; the smoke spec lives in test/e2e and runs only under
      npm run test:e2e, which the criterion does not name. CLAUDE.md's standing
      gate line does require test:e2e before a slice is closed, so the spec is
      not wholly unguarded, but 16.5 is the criterion that asserts something
      ABOUT this spec and it certifies itself with commands that cannot see it.

      THE DEPLOYED HALF IS WEAKER STILL. The interesting assertion, that the
      field is the hexadecimal one, fires only "when the spec runs against a
      deployed origin". In this repository that condition is PLAYWRIGHT_BASE_URL
      being set: unset, playwright.config.ts falls back to a local server and
      runs the prod project against a locally built next start, where no
      platform variable is set and the marker branch is the branch that passes.
      No committed script sets PLAYWRIGHT_BASE_URL. So every gate this
      repository can run green-lights the permissive branch, and the one
      assertion that would actually witness the instrument working on the
      platform is never executed by anything the criterion or the standing gate
      line invokes. That assertion is also the only automated thing in the whole
      phase that could refute R2-M3P16-01's unverified premise, which is why it
      is worth forcing rather than leaving to a variable nobody sets.

      A SMALLER THING IN THE SAME CRITERION, folded in because the edit is one
      edit. "The response carries that one field and nothing else: no
      environment value, no host, no connection string, no header dump"
      contradicts itself: the one field IS an environment value, read from the
      platform's own build-time environment variable two clauses earlier. The
      intent is obvious and an implementer will read past it, but this is a
      criterion whose whole job is to be read literally.
    evidence:
      - |-
        Criterion 16.5's gate list omits the only gate that runs the spec it
        asserts: "npm run typecheck, npm run lint and npm test exit 0 with those
        tests in them".
      - |-
        npm test does not reach test/e2e. M1-P1's record of the config it wrote,
        delivery/work-history/m1-p1-notes.md:43: "vitest.config.ts (test/**
        minus e2e), playwright.config.ts (testDir test/e2e, local webServer npm
        run dev, PLAYWRIGHT_BASE_URL overrides for deployed runs)".
      - |-
        The deployed-origin condition is an unset-by-default environment
        variable. playwright.config.ts:6, "const externalBaseUrl =
        process.env.PLAYWRIGHT_BASE_URL", and the prod project's base at :17,
        "const prodBaseURL = externalBaseUrl ?? \"http://127.0.0.1:3100\";".
        With it unset the config starts its own production server, "command:
        \"npm run build && npx next start -p 3100\"", where no platform build
        variable exists and the marker branch is the one that passes.
      - |-
        No committed script sets it: grep for PLAYWRIGHT_BASE_URL across the
        tree outside node_modules returns only playwright.config.ts reading it,
        m1-p1-notes.md describing it, and two work-history lines using it
        interactively with a 127.0.0.1 value or an ellipsis.
      - |-
        The self-contradiction, criterion 16.5: the route "returns the commit
        the running build was built from, read from the platform's own
        build-time environment variable", and three clauses later "The response
        carries that one field and nothing else: no environment value, no host,
        no connection string, no header dump."
    concrete-edit: |-
      In delivery/plan/pulse-v02.yaml, criterion 16.5, replace the gate sentence
      with: "npm run typecheck, npm run lint, npm test AND npm run test:e2e exit
      0 with those tests in them, and the record carries ONE run of the
      production smoke spec against the deployed origin, made with
      PLAYWRIGHT_BASE_URL pinned to that origin, with its command and exit code
      quoted; without that run the deployed half of this assertion is never
      executed by anything, because npm test does not reach test/e2e and the
      local prod project runs against a server where no platform build variable
      exists and the marker branch is the one that passes." In the same
      criterion replace "The response carries that one field and nothing else:
      no environment value, no host, no connection string, no header dump" with
      "The response carries that one field and nothing else: no OTHER
      environment value, no host, no connection string, no header dump."
