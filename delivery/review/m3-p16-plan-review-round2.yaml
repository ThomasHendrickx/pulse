  - id: R2-M3P16-02
    severity: high
    analysis: |-
      "THE DEPLOYED ORIGIN" IS NOT PINNED TO PRODUCTION, AND THE ORIGIN AN
      IMPLEMENTER CAN REACH WITHOUT WAITING IS THE ONE THAT PROVES NOTHING.
      This is the satisfying-and-wrong implementation for criterion 16.3, and
      it is not a stretch: it is strictly easier than the intended path, which
      is what makes it the one that gets taken.

      THE CONSTRUCTION. The implementer writes the route, commits it, and
      pushes the branch. A preview deployment of that branch exists within
      minutes and is served over HTTPS from a real deployed origin, with no
      merge and no waiting for anything. They fetch the build stamp from it. It
      returns a sha, because the preview build carries the route. That sha is a
      descendant of the M3-P12 merge, because the branch was cut from a trunk
      that already carried the merge. Its tree carries counterpartyIdentity and
      scripts/rederive-merchant-rules.ts, because everything in the merge is in
      it. They record the URL, the status 200, the body, the sha and the
      ancestor test exiting 0.

      NOW READ 16.3 AGAINST THAT RECORD, CLAUSE BY CLAUSE. "The record carries
      the response the build-stamp route returned FROM THAT ORIGIN, captured
      BEFORE the run, with the request URL and the HTTP status beside it" is
      met. "the commit sha that response named" is met. "the output of a
      command anyone can re-run showing that sha is a descendant of the commit
      that merged M3-P12" is met. "together with the check that the sha's own
      tree carries counterpartyIdentity and scripts/rederive-merchant-rules.ts"
      is met. The disqualification list names only local sources: "A SHA TAKEN
      FROM git rev-parse, FROM origin/main OR FROM ANY LOCAL REF DOES NOT MEET
      THIS CRITERION". A preview response is none of those. Every word is
      satisfied.

      AND THE THING THE CRITERION EXISTS TO ESTABLISH IS NOT ESTABLISHED. The
      routine then runs against the PRODUCTION database, whose rows are read by
      the PRODUCTION build, and nothing has been observed about the production
      build at all. If production is still serving a pre-M3-P12 build, the
      routine rewrites every stored pattern into namespaced form under a
      matcher still computing the old keys, and every rewritten rule stops
      matching. That is hazard H16.4 stated verbatim, and H16.4's addressed-by
      is criterion 16.3. The criterion declared to close the hazard is
      satisfiable by an implementation that opens it.

      THE AGGRAVATING FACT, and the reason this is high rather than medium: the
      production origin is not written down anywhere the implementer can read
      it. Grepped over the whole tree for a vercel.app host, a production
      domain, or any recorded deployed URL: nothing. playwright.config.ts takes
      the deployed origin from PLAYWRIGHT_BASE_URL, an environment variable the
      config never defaults and no committed script sets. So the criterion
      demands a fetch from an origin it does not name, from a phase that cannot
      ask the platform which origin is production (connector 403). A preview
      URL is the only deployed origin an implementer can produce unaided, and
      the criterion accepts it.

      WHY A CAREFUL IMPLEMENTER STILL LANDS HERE. Step 3's prose does say
      "Merge and deploy the instrument" first, so the intent is production. But
      the phase is judged on its criteria, not its prose, and 16.3's own
      wording invites the shortcut by defining the standard as "FETCHED FROM
      THE DEPLOYED ORIGIN" while spending its whole disqualification clause on
      local git refs. An implementer who has just been told in capitals that a
      local ref is unacceptable and a fetch is acceptable has been pointed
      directly at the nearest fetchable thing.
    evidence:
      - |-
        Criterion 16.3's standard is an origin, unqualified: "THE DEPLOY ORDER
        IS OBSERVED RATHER THAN ASSUMED, AND OBSERVED MEANS FETCHED FROM THE
        DEPLOYED ORIGIN. The record carries the response the build-stamp route
        returned FROM THAT ORIGIN". The words production, primary and household
        appear nowhere in the criterion.
      - |-
        Its disqualification list is entirely about local git, so a preview
        response is not excluded: "A SHA TAKEN FROM git rev-parse, FROM
        origin/main OR FROM ANY LOCAL REF DOES NOT MEET THIS CRITERION, because
        none of them observes what the deployment is serving, and neither does
        a record that names a sha without the response it came from."
      - |-
        The hazard the criterion is declared to address is opened by the
        construction, not closed: H16.4 reads "The routine runs against a build
        that does not carry the derivation, which is the one order D-46
        forbids, so patterns are rewritten under a matcher still computing the
        old keys and every rewritten rule stops matching", addressed-by
        criterion 16.3.
      - |-
        The production origin is nowhere in the tree. grep -rniE
        "vercel\.app|PLAYWRIGHT_BASE_URL|deployed URL" over every .md, .yaml,
        .ts and .json outside node_modules returns no host and no domain: the
        only PLAYWRIGHT_BASE_URL hits are playwright.config.ts reading it,
        m1-p1-notes.md describing it, and two work-history lines using it with
        a local 127.0.0.1 value or an ellipsis.
      - |-
        playwright.config.ts:6 through :7 takes the deployed origin from an
        unset-by-default environment variable and falls back to localhost:
        "const externalBaseUrl = process.env.PLAYWRIGHT_BASE_URL;" then "const
        baseURL = externalBaseUrl ?? \"http://127.0.0.1:3000\";".
      - |-
        The phase cannot ask the platform which origin is production: its own
        verified-root-cause records "the Vercel connector is recorded as
        returning 403 for this project".
    concrete-edit: |-
      In delivery/plan/pulse-v02.yaml, criterion 16.3, replace the first
      sentence with: "THE DEPLOY ORDER IS OBSERVED RATHER THAN ASSUMED, AND
      OBSERVED MEANS FETCHED FROM THE PRODUCTION ORIGIN THE OWNER'S OWN
      HOUSEHOLD IS SERVED FROM, which is the only deployment whose build reads
      the database this phase writes to." Add as its own sentence: "A RESPONSE
      FROM A PREVIEW OR BRANCH DEPLOYMENT DOES NOT MEET THIS CRITERION, and the
      record must show which it was rather than leaving it to the URL to imply:
