      question under DR-0029 because the two answers put the run against
      different data."
  - id: R2-M3P16-03
    severity: high
    analysis: |-
      THE IDEMPOTENCE LEG IS KEYED TO THE WRONG INVOCATION, SO ON THE ONE PATH
      THAT DAMAGES DATA THE CRITERION CANNOT BE MET. The instrument round one
      asked for was added and it works; what it is attached to is wrong, and
      the reason is a property of the routine the parallel fix round introduced
      after this criterion's wording was settled.

      READ THE ROUTINE FIRST, because the defect is invisible without it. At
      origin/claude/m3-p12-counterparty-identity b324d87, the routine DECIDES
      BEFORE IT WRITES: both passes run against an in-memory working copy, the
      blocking conditions and the exit code are computed against that copy, and
      only then, if the run is neither blocked nor a dry run, are the updates,
      the inserts and the recompute issued. So a blocked run writes NOTHING and
      the database is exactly as it was found. The script prints this in one
      word: "applied no", followed by "nothing was written: the run is blocked,
      and the database is exactly as it was found".

      NOW WALK THE SEQUENCE THE PLAN ITSELF MANDATES ON THE BLOCKING PATH. Step
      5: run once WITHOUT --accept. Step 6: read the exit code, and where one of
      criterion 12.7's two blocking conditions fired, put the rule ids to the
      owner and "only then rerun with --accept naming exactly the ids the owner
      accepted". Step 7: "Invoke the routine a SECOND time immediately after the
      first has completed", which must report zero patterns rewritten and zero
      rules added.

      COUNT THE INVOCATIONS. Invocation one: no --accept, blocked, exit 1,
      nothing written. Invocation two: the accepted rerun, which is the run that
      actually WRITES, and it reports patterns-rewritten N and rules-added M,
      both non-zero, because the database it found was untouched. That is "a
      SECOND invocation made immediately after the first" by the criterion's own
      words, and it reports the opposite of the two zeroes the criterion
      demands. The zeroes only appear on a THIRD invocation, which no step
      requires and no criterion mentions.

      SO THE BLOCKING PATH MEETS NO BRANCH OF 16.1. The zeroes clause is
      unconditional; the only alternative branch is the entry-condition failure
      that R2-M3P16-01 discusses, which is about the deploy and not about a
      blocked run. An implementer who follows the plan exactly, on the one path
      where a person's decision damages a declaration the owner made, ends with
      a record that cannot satisfy the criterion.

      AND THE OTHER READING IS WORSE. The same ambiguity lets an implementer
      argue the reverse: that the zeroes clause simply does not apply because
      "the second invocation" was the accepted rerun and it wrote. Then the
      idempotence check, the whole point of round one's PR-M3P16-04, silently
      does not happen on the exact path where the routine did the most work. One
      reading blocks a correct implementer, the other excuses an incomplete one,
      and the criterion does not choose.

      THIS IS CHEAP TO FIX BECAUSE THE ROUTINE ALREADY PRINTS THE
      DISCRIMINATOR. "applied yes" versus "applied no" is exactly the
      distinction the criterion needs and it is a single printed line the
      implementer already has in the captured output.
    evidence:
      - |-
        The routine blocks before it writes, so a blocked first run leaves
        nothing behind for a second run to find already done. Header of
        scripts/rederive-merchant-rules.ts at
        origin/claude/m3-p12-counterparty-identity b324d87: "WHAT A BLOCKED RUN
        LEAVES BEHIND ... NOTHING. The routine decides everything against an
        in-memory copy of the rule set and issues no write at all unless the run
        is clean, so exit 1 means the database is exactly as it was found and
        the printed report describes work that did NOT happen."
      - |-
        The same property in the application module,
        src/modules/merchants/application/rederive-rules.ts at b324d87: "Both
        passes run against an in-memory working copy of the rule set and record
        the writes they would make; the superset test, the conflicts and the
        exit code are computed against that copy; and only then, if the run is
        neither BLOCKED nor a DRY RUN, are the updates, the inserts and the
        recompute issued."
      - |-
        Criterion 16.1's idempotence leg is unconditional and names the first
        invocation as its anchor: "a SECOND invocation made immediately after
        the first reports zero patterns rewritten and zero rules added, which is
        what decision D-45's already-migrated guard forces, and the record
        carries that invocation's exit code and those two zeroes."
      - |-
        M3-P16's own steps put the accepted rerun between the first invocation
        and the idempotence check. Step 6: "only then rerun with --accept naming
        exactly the ids the owner accepted". Step 7, the next step: "Invoke the
        routine a SECOND time immediately after the first has completed."
      - |-
        The zeroes themselves ARE producible by the code, which is why the leg
        is worth keeping rather than deleting: pass one counts an
        already-namespaced rule into alreadyNamespaced and leaves it, and pass
        two's insert is guarded by claimant("EXACT", accountPattern, rule.id),
        which on a second run finds the rule the first run inserted, matches
        merchantId and skips the insert, so rulesAdded is 0.
      - |-
        The discriminator the fix needs is already printed by the script, one
        line, by name: the console.log emitting "applied yes" when
        report.applied is true and "applied no" when it is false.
    concrete-edit: |-
      In delivery/plan/pulse-v02.yaml, criterion 16.1, replace the idempotence
      sentence with: "SECOND, IDEMPOTENCE, which is a property of the routine
      and not of anybody's arithmetic: the invocation made immediately after THE
      FIRST INVOCATION THAT WROTE, which is the one whose captured output
      reports applied yes, reports zero patterns rewritten and zero rules added,
      which is what decision D-45's already-migrated guard forces, and the
      record carries that invocation's exit code, those two zeroes, and which
      numbered invocation it was. THE ANCHOR IS THE WRITING RUN AND NEVER THE
      FIRST RUN, because a blocked run writes nothing (it reports applied no and
      leaves the database exactly as it was found), so on the acknowledge path
      the run that writes is the accepted rerun and the invocation after THAT is
      the one whose zeroes mean anything." Amend step 7 to match: replace
      "Invoke the routine a SECOND time immediately after the first has
      completed" with "Invoke the routine once more immediately after the
      invocation that actually WROTE, which is the one reporting applied yes: on
      a clean run that is the second invocation, and on the acknowledge path it
      is the third, because the blocked first run wrote nothing."
  - id: R2-M3P16-04
    severity: medium
    analysis: |-
      THE ANCESTOR TEST'S ARGUMENT ORDER IS NOT PINNED, AND THE REVERSED ORDER
      EXITS 0 IN PRECISELY THE CASE THE CRITERION EXISTS TO REFUSE. The
      criterion names a command and an exit code and leaves the argument order
      to the implementer, and this particular command's meaning is entirely in
      its argument order.

      git merge-base --is-ancestor A B exits 0 when A is an ancestor of B. The
      criterion wants the returned sha to be a DESCENDANT of the M3-P12 merge,
      which is git merge-base --is-ancestor <m3p12-merge> <returned-sha>.
      Written the other way round, git merge-base --is-ancestor <returned-sha>
      <m3p12-merge>, it exits 0 exactly when the deployed build is an ANCESTOR
      of the merge, which is to say when the deployment is still serving a build
      that PREDATES M3-P12. That is hazard H16.4, and the implementer's record
      shows the command the criterion names, exiting 0 as the criterion
      requires.

      THE CRITERION'S PROSE IS UNAMBIGUOUS about the direction, "showing that
      sha is a descendant of the commit that merged M3-P12", so this is a slip
      rather than a loophole, and it is caught by a reviewer who checks which
      sha is in which position. But the criterion does not require the record to
      carry the command line as run, only "the output of a command anyone can
      re-run ... exiting 0", and git merge-base --is-ancestor prints nothing on
      success. So the artefact the criterion asks for is an exit code with no
      arguments attached to it, and the one fact that decides whether it means
      anything is the one fact it does not have to carry.

      THIS IS MEDIUM AND NOT HIGH for one reason and it is worth stating: an
      implementer has to write both shas into the record anyway (16.3 requires
      the returned sha, and the M3-P12 merge is recorded in step 1), so a
      reviewer holding a repository can redo the test. The defect is that
      nothing forces the record to be self-checking, and this phase's whole
      design premise is that its record outlives the container it was made in.
    evidence:
      - |-
        Criterion 16.3 names the command and its exit code but not its
        arguments: "the output of a command anyone can re-run showing that sha
        is a descendant of the commit that merged M3-P12, which is git
        merge-base --is-ancestor exiting 0".
      - |-
        git merge-base --is-ancestor exits 0 for the ancestor relation in the
        direction of its arguments, and prints nothing on success, so the exit
        code alone carries no record of which sha was in which position.
      - |-
        The reversed order succeeds precisely in the forbidden case, which is
        stated as this phase's own hazard H16.4: "The routine runs against a
        build that does not carry the derivation, which is the one order D-46
        forbids, so patterns are rewritten under a matcher still computing the
        old keys and every rewritten rule stops matching."
      - |-
        The identity case is already correct under either reading and needs no
        special handling: a commit is its own ancestor, so a deployment serving
        exactly the M3-P12 merge exits 0 both ways, which is the desired answer.
    concrete-edit: |-
      In delivery/plan/pulse-v02.yaml, criterion 16.3, replace "which is git
      merge-base --is-ancestor exiting 0" with "which is `git merge-base
      --is-ancestor <the M3-P12 merge commit> <the sha the route returned>`
      exiting 0, IN THAT ARGUMENT ORDER AND WITH THE COMMAND LINE AS RUN QUOTED
      IN THE RECORD BESIDE ITS EXIT CODE, because this command's meaning is
      entirely its argument order: reversed, it exits 0 exactly when the
      deployment is serving a build that PREDATES the merge, which is hazard
      H16.4 passing this criterion, and it prints nothing on success so the exit
      code alone cannot say which way round it was asked."
  - id: R2-M3P16-05
    severity: medium
    analysis: |-
      THE RE-RUNNABLE QUERY IS THE RIGHT INSTRUMENT AND THE CRITERION
      OVERSTATES WHAT IT PROVES, WHILE 16.4 NEVER RULES ON THE ONE VALUE THAT
      MAKES IT RUNNABLE. Both halves are small on their own and they compound,
      because together they let an implementer satisfy the leg while producing a
      query nobody else can run.

      FIRST, WHICH NUMBERS SURVIVE. Criterion 16.1 says the query is written out
      in full "so that anyone holding the same pinned session pooler can re-run
      it at any later date and get the same two numbers", and it asks for the
      pair "taken before the run and again after it". Only ONE of those two
      pairs is ever reproducible. The run rewrites the patterns, so the BEFORE
      pair describes a state that no longer exists and is unrecoverable the
      moment the run completes; a later re-run yields the AFTER pair, and only
      while merchant_rules is otherwise untouched, which the owner's next naming
      or next import ends. So the residue checks the after pair alone and has a
      shelf life. That is still worth having, and it genuinely does catch a
      fabricated after pair, which is the more consequential half. But the
      criterion as written promises a check on both, and an implementer reading
      "get the same two numbers" cannot tell which two.

      SECOND, THE ONE VALUE THAT MAKES THE QUERY RUNNABLE IS UNRULED. Every
      table in this codebase carries householdId and every query filters on it
      (CLAUDE.md non-negotiable 6), so the query 16.1 demands "IN FULL" is only
      the query that produced those numbers if it carries the household id.
      Criterion 16.4 now states an EXPLICIT permitted list, "The build stamp's
      sha, the queries this phase names and every count it records ARE committed
      and are not data", and the household id is in none of its categories and
      is excluded by none of its prohibitions. So an implementer faces a choice
      the plan does not make for them: redact it, and the query is no longer
      re-runnable, which is the entire leg; or write it, and no criterion says
      they may. The gate does not decide it either: gate:privacy matches
      IBAN-shaped and PAN-shaped identifiers, and a hyphenated UUID matches
      neither, so the gate is silent in both directions. This repository has
      already leaked twice on exactly this shape of unruled judgement, which is
      why an ambiguity here is worth an explicit sentence rather than a shrug.

      THIRD, THE SAME OMISSION APPLIES TO THE ORIGIN. Criterion 16.3 now
      requires the record to carry "the request URL", and 16.4's new explicit
      list does not mention it either. The deployed origin is the application's
      public address and discloses nothing about the household, so the answer is
      easy, but the list is now the thing implementers will read as exhaustive.
    evidence:
      - |-
        Criterion 16.1's promise: the query is written out "so that anyone
        holding the same pinned session pooler can re-run it at any later date
        and get the same two numbers", for counts "taken before the run and
        again after it".
      - |-
        The run destroys the before state by construction. Decision D-45, pass
        one: it rewrites "every rule whose pattern does not ALREADY begin with a
        known namespace", so after the run no rule is in the un-namespaced state
        the before pair counted.
      - |-
        Every query in this codebase filters on householdId, so the query cannot
        be written out in full without it: CLAUDE.md non-negotiable 6, "Every
        table carries householdId. Every query filters on it."
      - |-
        Criterion 16.4's permitted list is explicit and does not reach the
        household id or the origin URL: "The build stamp's sha, the queries this
        phase names and every count it records ARE committed and are not data: a
        commit sha of a public repository (DR-0024) identifies a build and
        nothing about the household."
      - |-
        The gate is silent on a UUID, so nothing decides it in the implementer's
        place. scripts/gate-privacy.sh:76 through :78 defines IBAN_LOCAL as a
        two-letter, two-digit, three-times-four-digit shape and IBAN_FOREIGN as
        two letters, two digits and ten to thirty alphanumerics unbroken; a
        hyphenated UUID's longest unbroken run is twelve characters and matches
        neither. Run on this branch: "gate:privacy clean", exit 0.
    concrete-edit: |-
      Two edits in delivery/plan/pulse-v02.yaml.

      In criterion 16.1, replace "so that anyone holding the same pinned session
      pooler can re-run it at any later date and get the same two numbers" with:
      "so that anyone holding the same pinned session pooler can re-run it. WHAT
      THAT RE-RUN CHECKS IS THE AFTER PAIR AND THE CRITERION SAYS SO RATHER THAN
      IMPLYING BOTH: the run rewrites the patterns, so the before pair describes
      a state that no longer exists, while the after pair is re-derivable from
      the deployed database until the household's next write to merchant_rules.
      That is the half a fabricated record cannot survive, and it is the reason
      the query is named rather than described."

      In criterion 16.4, extend the permitted list to settle both values: "The
      build stamp's sha, the deployed origin the fetch was made against, the
      household id the named query and the recorded command filter on, the
      queries this phase names and every count it records ARE committed and are
      not data: a commit sha and a public application origin identify a build
      and an address, and a household id is a database key that names no
      account, no counterparty, no place, no amount and no date. The household
      id is written out because criterion 16.1's query is worthless redacted,
      and it is the only identifier of the deployed household this phase
      commits."
  - id: R2-M3P16-06
    severity: medium
    analysis: |-
      CRITERION 12.1 NOW DECLARES A RULE THAT ITS OWN PHASE BREAKS FOUR TIMES,
      SO A READER CANNOT TELL WHICH STEP REFERENCES ARE TRUSTED. This is the
      brief's question about ordinals, answered directly: the ordinal is gone
      from 12.1, and four survive elsewhere in M3-P12.

      The fix round did more than round one's PR-M3P16-05 asked. It replaced the
      wrong ordinal with a content reference, which was the ask, and then added
      a general prohibition: "THE STEP IS NAMED BY WHAT IT DOES AND NEVER BY ITS
      ORDINAL, because a step list is renumbered by any insertion and a stale
      ordinal sends the reader to a step about something else, which is the
      failure this sentence was added to repair." That reasoning is right and
      the generalisation is the correct instinct.

      It is also now false of the phase it sits in. Four ordinal step references
      remain inside M3-P12: three citations of "step 2" for the trust gate and
      one of "step 4" for the guard removal, one of them inside a hazard class's
      addressed-by. Checked rather than assumed: all four currently RESOLVE.
      Step 2 is the step that adds counterpartyIdentity and it does define
      TRUSTWORTHY as "three pure tests in the merchants domain beside the
      normaliser"; step 4 is the step that carries the identity through the four
      call sites and it is where the assign-merchant guard goes. So nothing is
      stale today and this is not a correctness defect in any of the four.

      WHAT IT COSTS IS THE RULE'S FORCE. A reader who meets 12.1's prohibition
      and then four violations of it in the same phase has to decide for
      themselves whether the survivors were deliberate exceptions, oversights,
      or references someone has verified. The prohibition is either the phase's
      convention or it is not, and right now the plan says both.

      AND THE MECHANISM IS LIVE IN THIS VERY ROUND. The fix round inserted two
      steps into M3-P16, taking it from six to nine. M3-P16 happened to carry no
      ordinal references and survived intact. The next insertion into M3-P12
      shifts four references at once, and the sentence warning about exactly
      that is already in the file.

      SCOPE, STATED HONESTLY: the round was correctly scoped to 12.1, so this is
      a follow-on rather than a regression the round introduced. It is raised
      because the round's own new sentence is what creates the inconsistency,
      and because the cheapest moment to convert four references is the round
      that already establishes the convention.
    evidence:
      - |-
        The new rule in criterion 12.1: "THE STEP IS NAMED BY WHAT IT DOES AND
        NEVER BY ITS ORDINAL, because a step list is renumbered by any insertion
        and a stale ordinal sends the reader to a step about something else,
        which is the failure this sentence was added to repair."
      - |-
        Four survivors inside M3-P12, located by grep "step [0-9]" over
        delivery/plan/pulse-v02.yaml and read in context. Line 6138: "On the
        account side the hazard is answered by the trust gate in step 2 and
        measured by criterion 12.16". Line 6212: "carries a TRUSTED account
        under step 2's gate". Line 6737: "This replaces the guard at
        src/modules/merchants/application/assign-merchant.ts:54 through :57 that
