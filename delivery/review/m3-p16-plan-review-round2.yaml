  - id: R2-M3P16-07
    severity: low
    analysis: |-
      THE NARROWED H12.20 QUOTES DECISION D-39 FOR A PHRASE D-39 DOES NOT
      CONTAIN. The narrowing itself is correct and closes round one's
      PR-M3P16-03; this is about the one clause inside it that a reader would
      follow.

      H12.20's new statement reads "so it cannot be invoked at all and decision
      D-39's 'stops the deploy' is unfounded". D-39's statement says the
      declarations are re-derived rather than dropped, that the routine deletes
      nothing and overwrites no declaration, that every rule either keeps its
      meaning or gains a rule beside it, and that any rule whose effect cannot
      be carried across is reported by id and reason. The words "stops the
      deploy" are not in it, in any form. A hazard reviewer who follows the
      quotation to D-39 to understand what H12.20 is protecting finds nothing to
      anchor on.

      PROVENANCE, RECORDED RATHER THAN QUIETLY OMITTED, because it is this
      reviewer's own. The phrase entered H12.20 verbatim from round one's
      concrete-edit for PR-M3P16-03. It was not invented there either: it
      already existed at two other sites in the plan, M3-P12's step 6 and
      decision D-46, both of which attribute the same phrase to D-39. So the
      plan carried a quotation error at two sites, round one copied it into a
      demanded edit without checking it, and the fix round faithfully applied it
      to a third. That is exactly how a wrong citation becomes normative text,
      which is the same mechanism PR-M3P16-05 described one round ago about a
      step ordinal.

      LOW because nothing depends on the phrase being a quotation: the hazard's
      substance is that a routine with no invocation point cannot be invoked,
      which is true and which criterion 12.17 does cover.
    evidence:
      - |-
        H12.20's narrowed statement, delivery/plan/pulse-v02.yaml around line
        6913: "The routine is shipped with nowhere to run from, so it cannot be
        invoked at all and decision D-39's \"stops the deploy\" is unfounded."
      - |-
        D-39's statement contains no such phrase. It reads, in full on this
        point: "it DELETES NOTHING and it OVERWRITES no declaration; every rule
        either keeps its meaning or gains a rule beside it; and any rule whose
        EFFECT cannot be carried across is reported by id and reason rather than
