      and the justification is one I verified by reproduction rather than by
      reading: reverting the stylesheet reddens the phone spec at 462 on the
      merchant review and, with only the month grid reverted, at 424 on the
      month view. The edits are wrapping-only and token-only and the desk
      layout is preserved.
