      Unchanged in shape and now stronger. One spec sweeps three surfaces
      with one helper, and I tested that each surface is genuinely covered
      rather than nominally: unmasking the month view label reddens the
      month-view sweep, and unmasking the preview cell reddens the preview
      sweep, at two different lines of the same spec. Placing them in
      separate files would add undeclared paths for no coverage.
