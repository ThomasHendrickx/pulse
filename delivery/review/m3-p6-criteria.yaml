      connection string pinned explicitly to the pulse deployed project's
      session pooler (never the ambient DATABASE_URL, fleet warnings 1 and
      5)".
    serves-plan-intent: true
    reasoning: >-
      Unchanged from round 0 and my judgement is unchanged: I re-took the
      measurement myself through the same substitute transport at the
      round-0 head and got the same zero, and I confirmed the project ref
      resolves to the project named pulse rather than to the ambient
      credentials fleet warning 1 forbids. The transport is not a read-only
      connection and the read-only property comes from the statement text;
      that is sufficient for a SELECT count and should be said out loud by
      any future step reusing the route.
  - deviation: >-
      files-to-touch, which does not list src/app/globals.css.
    serves-plan-intent: true
