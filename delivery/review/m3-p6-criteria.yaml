        scratch copy).
    concrete-fix: >-
      Unchanged: regenerate package-lock.json with the npm that ships with
      the pinned engine, or move the engines range to match the lockfile, on
      a base-branch chore commit outside this phase.
    analysis: >-
      Carried in findings[] rather than dropped, because it is still open.
      It is low and delegated, so it does not stand against the verdict.

