      the existing fakes without modifying them; git diff --name-only
      77da0c6..2f8b62d still lists no test/application path. The cost is a
      file named domain that drives the import use cases, which is named in
      the deviation rather than hidden.
  - deviation: >-
      Criterion 6.3's e2e half, "the merchant review and month view specs
      asserting the same two sweeps over rendered group labels", and
      criterion 6.7's phone spec covering both screens.
    serves-plan-intent: true
