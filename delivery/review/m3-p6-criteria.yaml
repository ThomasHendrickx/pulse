deviations-judged:
  - deviation: >-
      Step 1(a): the deployed MerchantRule count is measured "over a
      connection string pinned explicitly to the pulse deployed project's
      session pooler (never the ambient DATABASE_URL, fleet warnings 1 and
      5)".
    serves-plan-intent: true
    reasoning: >-
      Judged by me rather than accepted: I re-took the same measurement
      myself through the same substitute transport and got the same number,
      zero, and I confirmed the project ref ygsarzjqosqmkqibqogk resolves to
      the project named 'pulse' rather than to the Hemma project the ambient
      credentials point at, which is the failure fleet warning 1 exists
      against. No pulse database password exists in this container, so the
      pinned-pooler route was not available to either of us, and the
      substitute preserves what the plan cared about: the right project, a
      read-only count, and no use of the ambient DATABASE_URL. One property
      is weaker and I record it rather than let it pass silently: the
      management API session is not a read-only connection
      (current_setting('transaction_read_only') returned 'off'), so the
      read-only guarantee comes from the statement text and not from the
      transport. For a SELECT count that is sufficient; for anything that
      touched rows it would not be, and a future step reusing this route
      should say so.
  - deviation: >-
      files-to-touch, which does not list src/app/globals.css.
    serves-plan-intent: true
    reasoning: >-
      Discharged rather than merely reasonable: commit 29c4745 on main,
