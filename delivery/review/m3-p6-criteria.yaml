  - id: CR-M3P6-04
    severity: low
    evidence:
      - >-
        src/platform/ui/mask-card-number.ts:46 defines DIGIT_RUN as
        /\d(?:[\s.-]?\d)*/g, at most ONE separator character between two
        digits. Executed against the head: maskCardNumbers('4000  1234 5678
        9010'), two spaces after the first group, returns the input
        unchanged, while every single-separator form (space, dot, dash,
        mixed, contiguous) masks to '**** 9010'.
      - >-
        Boundaries verified independently by me at the head: 12 digits
        unchanged, 13 digits -> '**** 0123', 19 digits -> '**** 6789', 20
        digits unchanged; grouped forms of 13 and 19 mask, grouped 12 and 20
        do not.
      - >-
        Not currently reachable on the two enumerated surfaces, because
        normaliseCounterparty collapses whitespace before the label is built
        (src/modules/merchants/domain/normalise-counterparty.ts:226), and
        measured over the real statement all 15 raw card descriptors are
        still fully covered: 0 of 15 retain a 13-to-19-digit run after
        masking. So this is a latent edge, not a live one.
    concrete-fix: >-
      Change DIGIT_RUN to /\d(?:[\s.-]*\d)*/g, keeping the maximal match and
      the window check that follow it, and add the double-separator form to
      the helper's own boundary test in test/domain/merchant-review.test.ts.
      The comment at src/platform/ui/mask-card-number.ts:41 that justifies
      the single separator ('so this can never join two distant numbers into
      one run') should then be rewritten to say what the window check
      already guarantees, since a joined run outside 13 to 19 digits is left
      alone anyway.
    analysis: >-
      Raised because the fix demanded by CR-M3P6-01 points this helper at
      RAW descriptors, where whitespace has not been collapsed by anything.
      On the owner's real file that turns out to be safe, measured, but the
      reason it is safe is a property of one bank's extraction gap rule
      rather than a property of the helper.
