findings:
  - id: CR-M3P6-10
    severity: low
    evidence:
      - >-
        The comment at test/domain/merchant-review.test.ts:709 records
        "NINE leaf sites in FOUR files at this head". The walk it
        describes returns TEN.
      - >-
        PROVEN ON THEIR OWN TEST rather than argued: replacing the floor
        assertion with expect(surfaces.length).toBe(9) gives
        "AssertionError: expected 10 to be 9", and toBe(10) passes with
        Tests 28 passed (28).
      - >-
        MY OWN INDEPENDENT AST WALK, written from the intent rather than
        copied, also returns 10 sites in 4 files, 5 masked and 5 unmasked
        (the two declared account labels on the import route, the hidden
        rule subject, the reserves label and the recon part label).
      - >-
        The number is unchecked by construction: the assertion at
        test/domain/merchant-review.test.ts:712 is
        toBeGreaterThanOrEqual(9), a floor, so the recorded count can
        drift from the measured one without anything going red. The test's
        other two assertions, masked === 5 and unmasked.length ===
        EXCLUSIONS.length === 5, force the total to be 10 and are the
        arithmetic that makes the comment's 9 impossible.
      - >-
        The wrong number propagated: the round reported the derivation as
        finding nine sites.
    concrete-fix: >-
      Change test/domain/merchant-review.test.ts:712 from
      toBeGreaterThanOrEqual(9) to toBe(10) so the recorded count is the
      checked count, and correct the comment at test/domain/merchant-
      review.test.ts:709 to say ten leaf sites in four files. If the floor
      was deliberate so that a newly added masked surface does not redden
      the test, say that in the comment and keep the exact number in a
      separate assertion over the masked and unmasked splits, which is where
      the real content is.
    analysis: >-
      Small, and raised anyway because of what it is an instance of. This
      test exists precisely because round 1 recorded a derivation whose
      number did not reproduce, and the replacement records a number that
      does not reproduce either. The mechanism is the same one twice: a
      count written into prose beside an assertion that does not check it.
      The guard itself is sound and I verified it independently, so nothing
      is at risk beyond the record.
  - id: CR-M3P6-11
    severity: low
    evidence:
      - >-
        The round reports gap rows guarded across all four gap-row test
        ids. Measured by me on the fixture that spec actually imports, at
        390x844 through a real import: uninterpreted-row 0, unmatched-leg
        0, in-transit-leg 0, unresolved-gap 0 for 2026-08, and the same
        four zeros for 2026-09.
      - >-
        The sweep sits behind if (gapTexts.length > 0) at
        test/e2e/merchants.spec.ts:238, so with no gap rows it never runs.
      - >-
        CONSTRUCTED: removing maskCardNumbers from the gap row at
        src/modules/overview/ui/month-view.tsx:266 and running the
        committed spec gives 1 passed. The e2e does not catch it.
      - >-
        The site is NOT unguarded, and I checked that rather than assuming
        the worst: the same mutation reddens the derivation test, Tests 2
        failed | 26 passed, because the gap row becomes an unmasked
        descriptor surface that is not a declared exclusion.
    concrete-fix: >-
      Either give the card fixture a row that lands in a gap list, which is
      one zero-amount row for the unresolved-gap id
      (src/modules/ledger/domain/classify-flow.ts:115 assigns UNRESOLVED to
      a zero amount), so the sweep it added actually executes; or drop the
      conditional and assert the gap lists are non-empty before sweeping, so
      a fixture that stops producing gap rows reddens instead of skipping.
      Do not simply delete the sweep: the derivation test covers the site
      but not the rendered output, and a masker that is applied and returns
      the wrong string would pass the derivation and fail a real sweep.
    analysis: >-
      Raised as a claim about a guard rather than as an unguarded surface,
      which is why it is low. The dispatch contract names the shape exactly:
      a guard that reports success and then says nothing is green and
      worthless, and this one is skipped in silence on the only fixture it
      runs against.
  - id: CR-M3P6-12
    severity: low
    evidence:
      - >-
        The lookbehind shipped at src/modules/merchants/domain/normalise-
        counterparty.ts:302 is (?<!\d ), which disqualifies a postal code
        preceded by ANY digit and a space. The rule its own comment
        states, at src/modules/merchants/domain/normalise-
        counterparty.ts:284, is narrower: "A FOUR-DIGIT GROUP THAT FOLLOWS
        ANOTHER FOUR-DIGIT GROUP IS NOT A POSTAL CODE".
      - >-
        MEASURED CONSEQUENCE, on synthetic shapes: "W W D P4 W" (a house
        number before a postal code before a city) keys as "... 12 9000"
        at this head where round 1 and the phase base gave "... 12". The
        postal code now survives in the key whenever a short numeric token
        precedes it.
      - >-
        I TESTED THE TIGHTER ALTERNATIVE rather than proposing it
        untested. With (?<!\d{4} ): rows whose key is not a fixed point on
        the owner's real file, 0; corpus members that are not a fixed
        point, 0 of 19; distinct keys on the real file, 25, unchanged; the
        IBAN run case unchanged; the house-number case back to "SUPERMARKT
        NOORD 12"; and the full suite green.
      - >-
        No real-file impact today: the owner's file carries no descriptor
        of that shape, which is why every count I confirmed for this round
        is unaffected either way.
    concrete-fix: >-
      Change the lookbehind at src/modules/merchants/domain/normalise-
      counterparty.ts:302 from (?<!\d ) to (?<!\d{4} ) so the pattern says
      what its comment says, and add the house-number shape to the pinned
      regression table in test/domain/normalise-counterparty.test.ts and to
      CLOSURE_CORPUS, so both the postal behaviour and the closure property
      are held by a pin. If the broader form is deliberate, say so at the
      pattern and state the accepted cost, that a postal code following any
      numeric token stays in the key.
    analysis: >-
      The pipeline is closed either way, which is the property that carries
      the hazard, so this is low. What makes it worth a line of work is that
      the recipe is under a stability contract: the pattern's behaviour on a
      shape nobody pinned is exactly what CR-402 exists to stop drifting,
      and today the only record of what it does is a comment that describes
      a different rule.
  - id: CR-M3P6-05
    severity: low
    evidence:
      - >-
        OPEN AND DELEGATED, unchanged at 23196fe and out of this phase's
        diff by the coordinator's instruction. npm ci still fails under
        npm 10 with Node 22 ("Missing: @swc/helpers@0.5.23 from lock
        file") and passes under npm 11.19 with Node 26; package.json still
