deviations-judged:
  - deviation: >-
      Step 1's report-code-disagreement entry on the mockup resolves the icon
      question "in favour of hand-written inline SVG with stroke=currentColor
      and no new runtime dependency".
    serves-plan-intent: true
    reasoning: >-
      Judged on facts I re-measured, not on the argument. grep -rln "<svg"
      src/ exits 1 at the phase base AND at this head, so the deviation's
      central claim, that the product carries no SVG element at all, is
      true in both directions. No acceptance criterion measures an icon;
      the entry it deviates from settles HOW an icon would be written, not
      that one must exist. What the icons had to buy is criterion 7.5, and
      the glyphs buy it: my own red run against the base measured the two
      month-step controls at 24px each, and at this head they sit inside
      44 by 44 boxes (src/app/globals.css:647 and :648) and the tap-target
      sweep is empty. The stated risk, that an SVGElement is not an
      HTMLElement and reports its scroll geometry differently from the
      elements the criterion 7.7 sweep measures, is real: the sweep at
      test/e2e/month-view.spec.ts:437 skips anything that is not an
      HTMLElement, so an inline SVG inside main would be silently outside
      it. Avoiding that is the conservative choice and it serves the
      intent.
  - deviation: >-
      Step 1's ordering, and the standing rule that the spec is written
      before the implementation and watched failing.
    serves-plan-intent: true
    reasoning: >-
      This is the deviation I was told not to accept on the implementer's
      word, and I did not: I reconstructed the red half myself, from the
      phase base, against the committed spec, on my own server, and it
      reproduces the plan's stated base numbers to the pixel (340px border
      box at 39 percent, 310px at 33 percent, 24 three-track elements, 52
      two-line offences, the five named tap-target offenders by name). Two
      independent reconstructions now agree, so what the rule exists to
      guarantee, that the bar can go red against the unfixed tree, is
      established. It is not the same thing as having watched it fail
      before the fix existed, and the residual cost is real: a bar written
      after the code can be shaped to the code it was written against, and
      no reconstruction can rule that out. What bounds it here is that the
      bar's numbers were fixed in the PLAN, across two adversarial rounds,
      before the implementer saw the phase. I judge it as serving the
      intent because of that, and I record the disclosure itself as the
      reason the judgement was possible at all.
  - deviation: >-
      Criterion 7.14 (b) and (c) name spend-group, income-group AND
      reserve-group rows, added in the second M0-P3 fix round as finding
      MPR-018.
    serves-plan-intent: false
    reasoning: >-
      DOES NOT SERVE THE INTENT, and the reason given for it is false. See
      finding CR-M3P7-01, which carries the executed evidence. The
      deviation says the reserve arm cannot be witnessed because criterion
      7.13 permits exactly one new fixture. Criterion 7.13 bounds new
      FIXTURES and says nothing about the ring an EXISTING committed
      fixture is declared under, and I produced a reserve group at 390 by
      844 from two existing committed fixtures alone, by declaring the
      second with ring RESERVE instead of the ring the shared upload helper
      hardcodes at test/e2e/month-view.spec.ts:63. The arm that MPR-018
      added on purpose, because a criterion bound to spend rows alone
      "would have proved nothing for two of the three cards", is still
      proving nothing for one of them. The product is not at risk: I
      measured a reserve row myself and it satisfies all three axes. The
      guard is what is missing, and the fix is roughly ten lines of spec.
  - deviation: >-
      Step 7, "Raise DR-0023 to the owner with this plan's recommendation
      stated first".
    serves-plan-intent: true
    reasoning: >-
      The implementer cannot write into the fleet's decision directory,
      which is outside the worktree, and inventing a path inside the
      repository for it would have been worse. The recommendation is
      stated first and in full at delivery/work-history/m3-p7.yaml:345
      through :355, with the three reasons step 7 asks for, so the
      orchestrator has what it needs to route it. Nothing is built on the
      answer, and I confirmed that independently: git diff --name-only over
      src/modules/overview/application/ and src/modules/overview/domain/
      prints nothing, so neither the projection nor the delta keying moved.

# =====================================================================
# WHAT THIS CONTRACT DID NOT REACH
#
# "All fifteen acceptance criteria met" is ONE INPUT and it is not a
# terminal green. It is a statement about the contract, not about the
# screen. Here is what I checked, what I could not check, and where the
# contract has no reach at all.
#
# 1. NOBODY HAS OPENED THIS SCREEN ON A PHONE. Every measurement in this
#    phase, mine included, is Playwright in a headless chromium at a
#    declared viewport. The phone project makes the meta viewport tag
#    load-bearing, which is the improvement, and criterion 7.8 subtracts
#    a generous 144 pixels for browser chrome. It is still a model of a
#    phone. The grade that started this phase, 2 out of 10 and 1 out of
#    10, came from a person holding a device, and nothing in these
#    fifteen criteria can return that number.
#
# 2. NO CRITERION MEASURES SCROLL LENGTH, TYPE SIZE OR CONTRAST. I
#    measured them anyway (3.8 screenfuls at 390, 4.5 at 360, labels at
#    14px) and record them as findings CR-M3P7-03 and CR-M3P7-04 rather
#    than as verdicts, because the contract gives me no bar to compare
#    them against. A future change that halves the label size or doubles
#    the scroll passes all fifteen.
#
# 3. THE WIDTHS BETWEEN 391 AND 767 ARE MEASURED BY NOTHING. The one
#    breakpoint is 768px and the criteria measure 390, 360 and 1280. A
#    tablet, or a phone in landscape, gets the one-column layout stretched
#    to 767px wide with no criterion pointed at it. I did not find a
#    defect there; I am recording that nobody looked.
#
# 4. THE HIDDEN-ELEMENT HALF OF 7.6 IS NARROWER THAN ITS TEXT
#    (CR-M3P7-02). I closed it by hand for this head with three greps.
#    Nothing keeps it closed.
#
# 5. THE RESERVE ARM OF 7.14 IS UNMEASURED BY THE SUITE (CR-M3P7-01). I
#    measured it by hand and it passes. Nothing keeps it passing.
#
# 6. THE PRIVACY GATE STILL CANNOT SEE A NAME. My own probe, built from
#    both real uploads, is clean on every file this phase touches, and
#    that is the strongest statement available. It is not a proof: a
#    merchant name, a place name or an amount inside a file looks exactly
#    like an invented one, which is how the two descriptors DR-0024 is
#    about reached a public repository and how the residue at
#    delivery/design/mobile-v02/MerchantReview.dc.html:57 survived the
#    correction that was aimed at it (CR-M3P7-05). I read the new fixture
#    line by line myself, which is the only instrument that reaches this,
#    and I am one reader.
#
# 7. WHAT I DELIBERATELY DID NOT DO. I edited nothing and I committed no
#    change to any file this phase touches. Four temporary constructions
#    were made and every one was reverted with git checkout HEAD -- and
#    verified with git status --porcelain: the four base layout files for
#    the red run, a one-character label truncation for the 7.7 (d) red
#    witness, and two uncommitted probe specs under test/e2e/ which were
#    deleted. test-results/ produced by the failing runs was removed and
#    is gitignored in any case. The tree at the end of this review is the
#    tree at 90afaa4 plus this document.
#
# 8. VALIDATION OF THIS DOCUMENT, recorded because the dispatch asked
#    which type the schema accepts. It is `verdict`: the phase reviews
#    under delivery/review use --type verdict and the plan review used
#    --type finding, and this is a phase review.
#      tiphys validate --type verdict <this file>            -> no
#        INVALID line: the four cross-document checks report SKIPPED for
#        want of a context directory, and the CLI exits 1 on a skip. The
#        accepted M3-P6 criteria verdict in this same directory produces
#        that identical output and that identical exit, so this is the
#        CLI's behaviour without a context and not a defect here.
#      tiphys validate --type verdict --context <ctx> <file> -> the two
