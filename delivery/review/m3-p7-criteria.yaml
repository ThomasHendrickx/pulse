findings:
  - id: CR-M3P7-01
    severity: medium
    evidence:
      - >-
        The declared deviation at delivery/work-history/m3-p7.yaml:329
        through :343 leaves the reserve-group arm of criterion 7.14 (b) and
        (c) unwitnessed and gives this reason: a reserve group needs a
        second account declared through the import flow, and "criterion
        7.13 permits exactly ONE new fixture, so the dense dataset cannot
        also declare a second account as a reserve, and no committed e2e
        dataset renders a reserve group either".
      - >-
        THE REASON IS FALSE, and I settled it by execution rather than by
        argument. Criterion 7.13 bounds new FIXTURES; it says nothing about
        which ring an EXISTING committed fixture is declared under. The
        ring is chosen in the import flow at test/e2e/month-view.spec.ts:63,
        where the shared helper hardcodes selectOption("POT"), and a
        reserve group is produced by the counterparty IBAN landing in the
        declared reserve set (src/modules/ledger/domain/classify-flow.ts:5
        and :64).
      - >-
        MY PROBE, an uncommitted spec run against my own dev server and
        then deleted: sign up, upload the existing committed gapped-A
        fixture with ring POT and the existing committed gapped-B fixture
        with ring RESERVE, open the closed month at 390 by 844. Result,
        verbatim from the run: "RESERVEPROBE count=1
        [{border:356, dist:257, pct:72, sameLine:true, countBelow:true,
        tracks:2}]", exit 0. One reserve-group row rendered, from ZERO new
        fixtures.
      - >-
        So the arm could have been witnessed inside this phase without
        touching criterion 7.13 at all. What is at risk is the measurement
        and not today's screen: that same probe shows the reserve row
        PASSES all three axes at this head (two tracks, 257px of a 356px
        border box at 72 percent, amount on line one, count beneath).
      - >-
        Nothing else covers it. grep -rn "RESERVE" over test/e2e/ returns
        no match at this head, so no committed spec declares a reserve ring
        anywhere.
    concrete-fix: >-
      Add one test to test/e2e/month-view.spec.ts that uploads the existing
      gapped-A fixture with ring POT and the existing gapped-B fixture with
      ring RESERVE, then runs the existing rowOffenders helper
      (test/e2e/month-view.spec.ts:462) at 390 by 844 and at 360 by 740 over
      the resulting reserve-group rows. It needs no new fixture, so
      criterion 7.13's one-file diff is untouched. Then correct the
      deviation text at delivery/work-history/m3-p7.yaml:329, which
      currently states an impossibility that is not one.
    analysis: >-
      Raised at medium rather than low because of what it is an instance of.
      The reserve arm was added to 7.14 deliberately in the second M0-P3 fix
      round as finding MPR-018, precisely because a criterion bound to spend
      rows alone "would have proved nothing for two of the three cards". One
      of those two cards is still proving nothing, and the reason recorded
      for that is a claim of impossibility with no captured command behind
      it, which is exactly the shape clause R-087 names. Raised at medium
      rather than high because I measured the row myself and it passes, so
      no shipped behaviour is at risk today; what is missing is the guard
      against tomorrow.
  - id: CR-M3P7-02
    severity: low
    evidence:
      - >-
        Criterion 7.6 ends "No element inside main has computed display none
        or visibility hidden, or carries the visually-hidden class, at 390
        by 844 unless it also does at 1280 by 720", and its FALSIFIED BY
        list names "any element hidden at one width and not the other".
      - >-
        The shipped check evaluates that only over elements carrying a
        data-testid. The collector at test/e2e/month-view.spec.ts:398
        selects document.querySelectorAll("[data-testid]") and computes the
        hidden flag at :406 through :410; the comparison at
        test/e2e/month-view.spec.ts:709 through :713 runs over that
        collection alone. An element with no testid is outside it.
      - >-
        Currently vacuous, and I checked that rather than assuming it: grep
        for "display: none" and "visibility: hidden" across
        src/app/globals.css, src/modules/overview/ui/month-view.tsx and
        src/app/(app)/layout.tsx returns nothing at this head, and the one
        media block, src/app/globals.css:1039 through :1129, changes only
        flex-direction, padding, gap, grid-template-columns and grid
        placement.
    concrete-fix: >-
      In the collector at test/e2e/month-view.spec.ts:398, collect the
      hiding state over main.querySelectorAll("*") as a second array keyed
      by a stable path rather than by testid, and compare that array across
      the two widths alongside the testid comparison. Keep the testid
      collection as it is; it is doing a different job.
    analysis: >-
      Small today and worth writing down because the gap is exactly the
      shape hazard H7.2 names: the phone is tidy because it says less. The
      testid floor list can only ever reach what carries a testid, and the
      criterion's own last sentence was written to cover the rest.
  - id: CR-M3P7-03
    severity: low
    evidence:
      - >-
        Criterion 7.14 (b) measures "the horizontal distance from the left
        edge of its group-label to the left edge of its group-total", and
        the spec implements exactly that at
        test/e2e/month-view.spec.ts:496. Any horizontal space between the
        two boxes counts as name area although the name cannot use it.
      - >-
        Measured by me at the phase base: the spec printed 132px where the
        name track is 116px, the difference being the row's 16px column
        gap. Measured at this head: 247 to 273px printed where the track is
        12px narrower (--space-6 at src/app/globals.css:848).
      - >-
        The route is therefore live: raising the row's column-gap raises
        the measured number with no benefit to the name. It is NOT taken
        here, and both the ratio and the absolute floors are cleared with
        the gap subtracted (235px narrowest label box at 390, 205px at 360,
        against floors of 180 and 160).
    concrete-fix: >-
      Where this bar is inherited by a later UI phase, measure the
      group-label element's own border-box width rather than the distance
      to the total, or subtract the computed column-gap of the row from the
      distance before comparing. Both are one line in
      test/e2e/month-view.spec.ts:496.
    analysis: >-
      This is the third denominator-shaped route in a criterion that has
      already had two closed (the content-box denominator, MPR-017, and the
      spend-rows-only scope, MPR-018). It is a hole in the criterion rather
      than a defect in this artifact, and it is recorded so the next round
      does not have to find it again.
  - id: CR-M3P7-04
    severity: low
    evidence:
      - >-
        Criterion 7.14 bounds track count, horizontal name area and line
        placement. It bounds neither the label's type size nor the row's
        height, so a smaller label font or a much taller row satisfies all
        three axes while making the screen worse.
      - >-
        Measured at this head, so the routes are named and shown unused:
        every group label renders at 14px (--text-md), the same size as the
        row amount; row heights run 91 to 112px against a
        --row-min-height of 56px; the dense month is 3178px at 390 by 844,
        3.8 screenfuls, and 3367px at 360 by 740, 4.5 screenfuls.
      - >-
        Nothing in the fifteen criteria measures scroll length, so how long
        the owner's real month is on a phone is unmeasured by this
        contract at any width.
    concrete-fix: >-
      Add to whichever phase inherits this bar a floor on the group label's
      computed font-size (it can read --text-md through getComputedStyle and
      compare, which is a measurement rather than a mirror because the
      component could have been given any token), and a recorded ceiling on
      the rendered document height for the dense dataset so a later change
      that doubles the scroll is visible rather than silent.
    analysis: >-
      Raised as low because neither route is taken and the screen I measured
      is a real improvement. Raised at all because the dispatch asked
      whether 7.14 can be satisfied by a screen that is still bad, and the
      honest answer is yes, by two routes it does not close.
