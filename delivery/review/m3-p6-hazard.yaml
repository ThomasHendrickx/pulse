findings:
  - id: HZ-M3P6-12
    severity: low
    evidence:
      - "A NEW over-strip class introduced by the label widening at src/modules/merchants/domain/normalise-counterparty.ts:183. The label alternation is matched on a word boundary followed by whitespace and four four-character groups, so a label word standing alone as an ORDINARY NOUN immediately before four such groups is consumed together with everything after it."
      - "Probe-executed with invented values. A French restaurant descriptor whose name ends in the ordinary French idiom containing the label word, followed by a sixteen-digit reference, normalises to a key with the last three words of the merchant name REMOVED. It kept its full key at 2f8b62d. A second shape, an administrative descriptor carrying the label word plus the optional single-letter number token before a reference, normalises to its first word alone."
      - "The same two strings are MASKED on screen, rendering a non-card reference as a four-star mask plus four digits, which is the display class round 0 filed as HZ-M3P6-01 returning in a narrow form."
      - "NOT REACHABLE ON ANY OBSERVED TEXT, measured: descriptors newly matched by the three-language grammar over the Dutch-only one are 0 of 39 on 39bada64, 0 of 22 on the real 0f79fa3d through M3-P3's template, and 0 of 154 strings across every committed fixture, CSV and PDF."
      - "Word boundaries do hold where they matter: the label word inside a longer word does not fire, probed in both the English and the French form, and the hyphenated rail token that opens a French card descriptor is already pinned as surviving at test/domain/normalise-counterparty.test.ts:281."
      - "The regression table gained POSITIVE pins for the French and English card labels but carries no NEGATIVE pin for a label word occurring inside a merchant name, so nothing would redden if the anchor were later loosened."
    concrete-edit: >-
      Add one regression-table row pinning that a descriptor whose merchant
      name ends in a standalone label word, followed by four four-character
      groups, keeps that merchant name in its key, and add the mirror
      assertion for the masker. Make it pass by requiring the label to sit
      at a FIELD boundary rather than at any word boundary, which is how
      both real statements print it: preceded by the start of the
      descriptor or by a separator token, never by an ordinary word. That
      keeps every one of the 23 real card rows matching, verified here, and
      removes the ordinary-noun case.
    analysis: >-
      Filed low because the collapse needs a conjunction that no observed
      row supplies: a label word standing alone at the end of a merchant
      name AND four four-character groups immediately after it. It is
      raised at all because the widening was made FOR French exports and
      the French label word is a far more common ordinary noun than the
      Dutch one, so the class the change opens is largest exactly where the
      change is aimed. The cost of the pin is one line and it fixes the
      anchor rather than the instance.
  - id: HZ-M3P6-13
    severity: low
    evidence:
      - "The comment at src/modules/merchants/domain/normalise-counterparty.ts:284 states that a four-digit group following another four-digit group is not a postal code, and that the lookbehind is what says so. The lookbehind at :302 does not say that: it refuses the strip whenever ANY digit followed by a space precedes the candidate, whatever the length of that digit run."
      - "Probe-executed with invented values: a descriptor carrying a single digit before a genuine postal-code-and-city pair keeps the postal code in its key, and so does one carrying a two-digit token. Only the case with no preceding digit strips."
      - "The consequence is benign in the direction that matters and I checked it rather than assuming: every one of those keys is a FIXED POINT, and the rule only ever leaves MORE text in a key, so it can under-strip but can never collapse two merchants."
      - "The same imprecision is in the round-2 dispatch's own description of the change, so the sentence has already propagated once beyond the file."
      - "No pinned row covers the single-digit case, so the gap between the sentence and the guard is not measured anywhere."
    concrete-edit: >-
      Correct the sentence at src/modules/merchants/domain/normalise-counterparty.ts:284
      to say that a candidate preceded by a digit and a space is not treated
      as a postal code, which is what the lookbehind does, and add one
      pinned row for a descriptor carrying a single digit before a genuine
      postal-code-and-city pair so the difference between the two readings
      is measured rather than argued. If the narrower rule was actually
      intended, change the lookbehind to require four digits and pin both
      cases.
    analysis: >-
      Raised as a finding rather than a nit under clause R-087: it is a
      present-tense claim about what a guard does, sitting directly above
      that guard, and it is more precise than the guard is. The behaviour
      is fine; the record of it is not, and the record is what the next
      implementer will change the guard from.
