findings:
  - id: HZ-M3P6-09
    severity: low
    evidence:
      - "A NEW collapse introduced by this fix round, probe-executed with invented values. The dash-token drop at src/modules/merchants/domain/normalise-counterparty.ts:315 removes standalone dash tokens from a card descriptor, so two second-rail descriptors whose merchant names differ ONLY by a standalone dash produce DIFFERENT keys at e0704a5 and the SAME key at 2f8b62d."
      - "It is the same class as HZ-M3P6-03, a strip that merges two distinct descriptors, and it arrived in the change that fixed HZ-M3P6-03 and HZ-M3P6-06."
      - "NOT REACHABLE ON OBSERVED DATA: no second-rail merchant span in either real statement carries a standalone dash token, and the hyphenated branch suffixes that do occur are intra-word hyphens the drop cannot touch, confirmed by the two sibling fuel branches staying two keys."
      - "The regression table gained pins for the rail alternation and the contactless token but none for this behaviour, so nothing would redden if the drop were later widened from standalone tokens to hyphens generally."
    concrete-edit: >-
      Add one regression-table row pinning that a card descriptor whose
      merchant span contains a standalone dash keeps that span distinct from
      the same span without it, so a later widening of the drop from whole
      tokens to characters reddens. No behaviour change is needed: the
      current whole-token drop is the right scope and only lacks its pin.
    analysis: >-
      Filed low because the collapse needs a merchant name carrying the
      character the second rail uses as its own field separator, which is
      ambiguous in the source format before it is ambiguous in the key.
      The value of the pin is that it fixes the scope, not that it changes
      it.
  - id: HZ-M3P6-10
    severity: low
    evidence:
      - "The declared open question at delivery/work-history/m3-p6.yaml:747 states the residue as a card number printed with NO card-number label. Probed against the shipped helper and the shipped normaliser, the residue is wider than that sentence: a card number behind a NON-DUTCH label is equally unmasked AND unstripped. With invented values, a descriptor carrying a French card-number label and one carrying an English card-number label both leave the full sixteen-digit run in the normalised key, and therefore in the EXACT rule pattern assign-merchant.ts would store."
      - "That is not a variant of the declared case: those descriptors DO carry a card-number label, just not the Dutch one the two definitions pin."
      - "REACHABILITY, traced rather than assumed. The PDF path cannot reach it today: the only merged template is the Dutch Belfius one and a French statement fingerprints as layout-unsupported. The DELIMITED path can: it is generic and spec-driven with no language in the profile, and it already accepts an invented bank's CSV in this phase's own fixture."
      - "Pulse ships French user-facing content (messages/fr.json), so a French Belgian export is a near-term shape rather than a hypothetical one."
      - "The remedy sentence in the same open question is already correct: a new pinned label shape in both definitions, not a length test. Only the statement of the residue is narrow."
    concrete-edit: >-
      Correct the statement at delivery/work-history/m3-p6.yaml:747 to say a
      card number printed with no DUTCH card-number label, naming the French
      and English label forms as the same case, so a later reader cannot
      conclude that a French export is covered. If the label alternation is
      widened in the same breath, widen it in BOTH definitions
      (src/platform/ui/mask-card-number.ts:83 and
      src/modules/merchants/domain/normalise-counterparty.ts:167) and pin
      each new label shape in the regression table, because a label pinned
      in only one of the two puts a card number on screen or in a stored
      rule depending on which one was missed.
    analysis: >-
      The trade the round asks me to judge is right: anchoring to the
      grammar is what keeps an IBAN, a mandate reference and a phone number
      legible, and I measured that it does. The residue is honestly
      DIRECTED, in that the remedy named is the correct one. It is not
      honestly BOUNDED, because the boundary drawn is narrower by one class
      than the code's actual boundary, and that class is the second national
      language of the product's own market.
  - id: HZ-M3P6-11
    severity: low
    evidence:
      - "A FALSE TEST NAME (clause R-087). test/domain/normalise-counterparty.test.ts:86 is named for a postal code plus city tail being stripped wherever it sits. After this round's change at src/modules/merchants/domain/normalise-counterparty.ts:261 that is no longer true: only the postal CODE is removed and the city is left for the trailing-city loop, which by definition only reaches the end of the string."
      - "Probe-executed with invented values: a descriptor whose postal-city pair sits mid-string normalises to a key that KEEPS the city at 2f8b62d and dropped it at both 07a052e and e0704a5. A second invented shape behaves the same way."
      - "The test BODY only exercises the trailing case, which still passes, so the suite cannot catch the name going false: the assertion and the sentence above it no longer describe the same rule."
      - "The behaviour change itself is a repair, not a defect: measured on 39bada64 it moved 11 non-card keys and every one became more distinguishing, because the old pattern was consuming the final IBAN group together with the counterparty name behind it. Zero merges resulted."
    concrete-edit: >-
      Rename the test at test/domain/normalise-counterparty.test.ts:86 to
      say that a postal code is removed and the city it introduces is left
      to the trailing-city rule, and add one assertion for the mid-string
      case showing the city survives there. Add the same pair to the pinned
      regression table, because the change moved real non-card keys and the
      table is what makes the next such move loud.
    analysis: >-
      Raised as a finding rather than a nit because the review contract
      treats a false present-tense claim in a test name exactly as it treats
      one in a comment, and because this particular sentence is the only
      description in the tree of a rule that just changed for every
      descriptor in the corpus, card or not.
