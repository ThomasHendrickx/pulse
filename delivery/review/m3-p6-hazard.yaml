findings:
  - id: HZ-M3P6-01
    severity: high
    evidence:
      - "FALSE CLAIM IN A SHIPPED COMMENT (clause R-087). src/platform/ui/mask-card-number.ts:41 states: the separator may appear at most ONCE between two digits, so this can never join two distant numbers into one run. Probe-executed against that exact function, invented values: input SHOP REF 07 24681357913 S renders as SHOP REF **** 7913 S, while each of the two numbers alone renders unchanged. One space is enough, and one space is exactly what separates two adjacent fields after the normaliser has collapsed whitespace."
      - "THE JOIN EATS CHARACTERS OUT OF AN ALPHANUMERIC TOKEN. Probe, invented values: SHOP Q82B07 24681357913 S renders as SHOP Q82B**** 7913 S, so four characters of a merchant token are replaced by a mask on the screen the user reads to decide what to name."
      - "REACHED ON REAL DATA, structurally, no content reproduced. Over the 22 rows the real 0f79fa3d yields once M3-P3's template merges, exactly 1 head key is changed by maskCardNumbers, and the change is of this shape: a two-digit tail of an alphanumeric token joined across one space to an eleven-digit reference, rendered as a four-star mask plus four digits. That row is a merchant, not a card row."
      - "THE HELPER FIRES ON THE WRONG SET. Over the 27 head keys of the real 39bada64, maskCardNumbers changes 5; 0 of the 5 are card rows and 5 of 5 are not. Over the 16 head keys of the real 0f79fa3d it changes 1, also not a card row. Zero card numbers are masked on either real statement because the normaliser removed them from the keys first."
      - "WHAT IT DOES MASK, probed with invented values in the real grammar: a Belgian IBAN inside a transfer descriptor renders as BE**** 7034; a hyphenated SEPA mandate reference of the form ten digits, a hyphen and three digits renders as a four-star mask plus four digits; a Belgian phone number renders as **** 3456. All three are identities the user reads to tell one unresolved group from another, and all three now render as something that looks like a masked card number and is not."
      - "Gates are green at the head and do not see this: npx vitest run gives 28 files, 322 passed (322), EXIT=0. The unit assertions at test/domain/merchant-review.test.ts:254 exercise only single-run inputs, so the join case has no test."
    concrete-edit: >-
      Narrow the run pattern at src/platform/ui/mask-card-number.ts:46 so a
      run cannot begin or end adjacent to a letter and cannot cross a
      field boundary: require the run to be preceded by a start-of-string
      or a space and followed by an end-of-string or a space, and allow the
      internal separator only between GROUPS OF FOUR, which is how a card
      number is printed, rather than between any two digits. Then either
      delete the sentence at :41 or restate it as the property the new
      pattern actually has. Add unit assertions for the three probed cases:
      two short numeric fields one space apart must stay unmasked, a digit
      tail of an alphanumeric token must stay unmasked, and a spaced IBAN
      must stay unmasked. If masking an IBAN is intended, say so in the
      comment and cover it with its own pin, because today the comment
      names only a long reference as the cost.
    analysis: >-
      This is display-only, so it moves no total, detaches no stored rule
      and never reaches a fact: the reverse closure proves the helper is
      reachable from seven files, all of them UI. It is filed high anyway
      because it is a LIE SURFACE on both money screens, because it
      degrades the identity the owner reads at the exact moment of naming,
      and because a present-tense safety sentence in a shipped comment is
      falsified by a probe, which clause R-087 says to raise loudly rather
      than as a nit. Two distinct references sharing four trailing digits
      now render as the same label while remaining two distinct groups.
