findings:
  - id: HZ-M3P17-01
    severity: critical
    analysis: >-
      The head cannot produce a production build, which defeats the
      phase's entire purpose and would break every deploy of the
      application if merged. The route file exports a constant besides its
      handler, and Next's route export validation refuses it during
      "checking validity of types": next build exits 1 naming UNSTAMPED as
      an invalid Route export field. Three consequences chain from the one
      line. First, Vercel runs this same build, so the deploy that M3-P16
      exists to observe can never land; the production origin keeps
      serving the previous build, the new route answers 404 there, and the
      consumer phase waits forever on a stamp that cannot arrive, while
      every OTHER change to the product is also blocked from deploying.
      Second, npm run test:e2e cannot pass in any container at this head,
      because the chromium-prod web server's command is npm run build
      followed by next start, so criterion 17.3 is unsatisfiable, not
      merely unwitnessed in a Dockerless container. Third, the defect is
      invisible to every gate the implementer ran: tsc --noEmit is green
      in a worktree that has never built, and goes red with TS2344 on the
      generated route type the moment .next/types exists, so any developer
      tree that has ever run a build or the dev server sees typecheck fail
      too. The fix was validated by a reverted experiment in this
      worktree: with the marker moved to a sibling non-route module and
      the three imports adjusted, npm run build exits 0, the six route
      unit tests pass, and the built server answers exactly the two-field
      body.
    evidence:
      - >-
        npm run build at 12c20f3, Next 15.5.23 from the tree's own
        untouched lockfile, DATABASE_URL and DIRECT_URL pinned local:
        EXIT=1, Type error, Route "src/app/api/health/version/route.ts"
        does not match the required types of a Next.js Route, "UNSTAMPED"
        is not a valid Route export field.
      - >-
        The offending line is the export at
        src/app/api/health/version/route.ts:34; the unit test imports it
        from the route at test/app/health-version.test.ts:2 and the smoke
        spec at test/e2e/prod-smoke.spec.ts:4, which is why the export
        exists.
      - >-
        npm run typecheck immediately after the failed build: EXIT=2,
        TS2344 in the generated type file under .next/types naming
        property UNSTAMPED, because tsconfig.json includes .next/types. In
        the fresh worktree with no .next the same command exits 0, which
        is exactly the state the implementer's green typecheck was
        measured in per the work history's gate-evidence block.
      - >-
        npm run test:e2e cannot pass at this head anywhere: the
        chromium-prod project's web server command at
        playwright.config.ts:155 is npm run build then npx next start on
        port 3100, and the build half exits 1. Criterion 17.3 requires
        that command to exit 0 with these tests in it.
      - >-
        Fix validated and reverted in this worktree: marker moved to a
        sibling module under src/app/api/health/version/, three imports
        adjusted, npm run build EXIT=0, npx vitest run
        test/app/health-version.test.ts EXIT=0 with 6 passed, GET on the
        built server answered 200 with exactly the two fields. git status
        after reversion carries only this review file.
    concrete-fix: >-
      Move the marker into a sibling non-route module, for example
      src/app/api/health/version/unstamped.ts carrying export const
      UNSTAMPED = "unstamped", which stays inside the phase's declared
      files-to-touch (src/app/api/health/). Import it in the route and
      remove the export from route.ts; point
      test/app/health-version.test.ts and test/e2e/prod-smoke.spec.ts at
      the new module. The marker keeps one source of truth, which is what
      the plan pinned. Then witness npm run build EXIT=0 in the fix round
      and run the full slow gate where a local stack exists, capturing the
      output in the work history, since criterion 17.3 is currently
      unwitnessed as well as unsatisfiable.
  - id: HZ-M3P17-02
    severity: low
    analysis: >-
      The route's 200 carries no cache-control header at all, witnessed
      against the built server. force-dynamic stops Next's own static
      caching but emits no freshness header in this Next version, so what
      an intermediary may do is decided by defaults the route does not
      control: HTTP caching rules permit a shared cache to apply heuristic
      freshness to a 200 with no explicit directive, and the dispatch
      names a stale sha as the attack, since M3-P16's terminal decision
      turns on exactly this body. On the deployed platform the edge adds
      its own non-cacheable default for function responses, which is why
      this is low rather than higher, but the instrument's freshness
      should be its own property rather than a platform default,
      especially for a route whose whole job is telling a waiting phase
      which build is live.
    evidence:
      - >-
        curl -i against the built server on 127.0.0.1: the 200 response
        headers are vary, content-type, date, connection and keep-alive;
        no cache-control header is present.
      - >-
        src/app/api/health/version/route.ts:40 returns the JSON body with
        no headers argument, and a case-insensitive grep for cache over
        the route file returns no hits.
    concrete-fix: >-
      Return the body with an explicit cache-control no-store header via
      the second argument of NextResponse.json, and add one unit
      assertion that the handler's response carries it, so a later edit
      cannot drop it silently.
  - id: HZ-M3P17-03
    severity: low
    analysis: >-
      npm run gate:decisions exits 1 at this head, and CLAUDE.md's gate
      sentence includes it in what must pass before a slice is done. This
      lane re-ran the gate at the phase base f19984b and got the identical
      six over-cap lanes, so the phase introduced none of it, and the work
      history records the red honestly with an open question for the
      orchestrator. It is a finding at low because the condition is real
      at the head under review and has a mechanical resolution the branch
      can take without touching any review record itself: origin/main's
      tip dc18484 already prunes the over-cap rounds, and the merge base
      of this branch with origin/main is f19984b, one commit behind that
      fix.
    evidence:
      - >-
        npm run gate:decisions at 12c20f3: EXIT=1, six lanes named
        (m0-p6-plan-review 5 rounds, m3-p14-criteria 3, m3-p14-plan-review
        4, m3-p16-plan-review 5, m3-p3-criteria 3, m3-p3-hazard 3).
      - >-
        The same command at f19984b in the same worktree, clean checkout:
        EXIT=1 with the identical six lanes, so pre-existing at the branch
        point.
      - >-
        git merge-base origin/main 12c20f3 is f19984b, and origin/main's
        tip is dc18484, whose subject says it keeps at most two rounds per
        lane on main, removing the over-cap files.
    concrete-fix: >-
      In the fix round HZ-M3P17-01 already requires, rebase the branch
      onto current origin/main (or merge it in) so the pruned
      delivery/review/ state is in the tree, then witness npm run
      gate:decisions EXIT=0 at the new head and capture it in the work
      history beside the other gates.
