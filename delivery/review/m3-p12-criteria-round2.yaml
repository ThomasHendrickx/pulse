# worktree /home/user/wt-m3p12-r2crit on branch claude/m3-p12-rev2-crit.
# Baseline for every "unchanged since the baseline" claim: 7f4aafb.
#
# THIS IS NOT A DELTA REVIEW. Every criterion was walked again from zero. The
# fix round changed the matcher, the write boundary, the review surface and
# the re-derivation routine, so a criterion met in round one can have been
# broken by the repair, and two of them were re-measured for exactly that
# reason (12.1 and 12.2 recount, 12.21's property test was re-run against the
# reshaped refusal).
#
# WHAT THIS CONTRACT DID NOT REACH, said here rather than left to nobody.
# Walking twenty-two criteria is a statement about the CONTRACT, never a
# terminal green. Four things this walk could not settle. The re-derivation
# still has never run against the OWNER'S deployed database, so nothing here
# says it behaves on real deployed rows as it does against a fake and against
