findings:
- id: CR2-M3P12-01
  severity: high
  analysis: |-
    THE SHIPPED MIGRATION SCRIPT HAS NO TARGET CHECK, and this repository already carries the interlock it should be
    using. scripts/rederive-merchant-rules.ts resolves its connection entirely from ambient environment, through the
    shared Prisma client, and issues UPDATE against every merchant_rules pattern of a household plus INSERT of new
    rules plus a full recompute. It takes a household id on the command line and nothing else; there is no check of
    any kind that the database it is about to rewrite is the intended one. This is not hypothetical in this fleet.
    Measured in this container while writing this review, the ambient DATABASE_URL resolves to a deployed Supabase
    transaction pooler for a DIFFERENT project than Pulse, with a working password, and shell environment overrides
    .env for Prisma. A person following the script's own documented invocation, on a machine in the state this one
    is in, rewrites another project's rows. The tree already contains the answer: src/platform/db/guard.ts is a
    fail-closed local-host interlock with an explicit per-run override, wired into db:reset and db:migrate through
    src/platform/db/guard-cli.ts, and its own header instructs the next author in as many words that anyone adding a
    destructive entry point must route it through the same guard. M3-P12 added an entry point that writes and did
    not. The script's header answers the question with a definition rather than a check, asserting that the command
    destroys nothing because it issues no DELETE, which is true of the statements and irrelevant to the target: an
    UPDATE that prefixes a namespace onto every rule pattern of a household in a foreign database is destruction of
    that database's data whatever the verb is. No acceptance criterion in this phase asks about the connection,
    which is why this is reported as a defect of the artifact rather than as a criterion miss, and it is this walk's
    clearest instance of the sentence the criteria contract exists to carry.
  evidence:
  - |-
    The script takes a household id and a dry-run flag and reads no connection argument and performs no target
    check: scripts/rederive-merchant-rules.ts:68 through :102, with the repository bound unconditionally at :98.
  - |-
    The guard that exists and is not used, fail closed on both connection strings with one explicit override:
    src/platform/db/guard.ts:35 through :70.
  - |-
    Its sibling-reader instruction, which this phase is the first to meet and the first to skip:
    src/platform/db/guard.ts:16 through :19.
  - |-
    The two scripts that do route through it and the new one that does not, three lines apart: package.json:15
    through :17.
  - |-
    The measured ambient state in this container: DATABASE_URL resolves to a deployed pooler host on
    aws-1-eu-north-1 whose project ref is neither of the two the fleet environment warnings name for Pulse. I did
    not connect to it. Every database command in this review was pinned explicitly to 127.0.0.1:54322.
  - |-
    The claim that stands in place of a check: scripts/rederive-merchant-rules.ts:17 through :25.
  concrete-fix: |-
    Route the new entry point through the existing interlock rather than inventing a second rule. Either add the
    guard invocation to the npm script at package.json:17 the way db:reset does at package.json:15, so the run
    refuses a non-local target unless PULSE_ALLOW_REMOTE_DB_DESTRUCTION=1 is set for that run, or, since this script
    is meant to run against the deployed database exactly once, add a required --expect-host argument parsed at
    scripts/rederive-merchant-rules.ts:68 and compared against the resolved DATABASE_URL hostname before any
    repository call, refusing on mismatch. Widen the sentence at src/platform/db/guard.ts:16 in the same change so
    it says WRITING entry point rather than destructive one, because that sentence is what this phase read and
    complied with literally.
- id: CR2-M3P12-02
  severity: high
  analysis: |-
    A SAME-MERCHANT PATTERN COLLISION IS NOT A CONFLICT, IS NOT REPORTED, AND CRASHES THE MIGRATION MID-APPLY. Pass
    one treats a collision as blocking only when the claiming rule belongs to a DIFFERENT merchant. When the
    claimant belongs to the SAME merchant the routine proceeds and queues an UPDATE onto a pattern that already
    exists, which the table's unique key on (householdId, kind, pattern) refuses. The decide-before-you-write
    property then does not hold, because the decision phase reports a clean run and the write phase throws. The
    shape that produces it is not exotic, it is the one decision D-46's own deploy window induces: between the code
    deploy and this script's run, the owner's pre-migration rules match nothing and their rows show as unresolved,
    which is exactly what invites the owner to name those groups again. Naming one with the same merchant name
    reuses the merchant through findMerchantByName and writes a namespaced EXACT rule beside the old un-namespaced
    one, for the same merchant. The migration then dies on it. This is hazard H12.25's own shape reaching the
    routine through a door criterion 12.21 does not cover, because H12.25 is about not DOUBLE-namespacing the new
    rule and this is about the OLD rule colliding with it.
  evidence:
  - |-
    The collision test that only blocks on a different merchant:
    src/modules/merchants/application/rederive-rules.ts:352 through :363, where the guard is collision !== undefined
    && collision.merchantId !== rule.merchantId, so a same-merchant claimant falls through to the update queued at
    :365.
  - |-
    The unique key that refuses the update: prisma/schema/merchants.prisma:90, one household decision per (kind,
    pattern).
  - |-
    WITNESSED. On a real Postgres database I created and pinned, pulse_r2crit on the local supabase stack, seeded
    with an un-namespaced EXACT rule and a namespaced EXACT rule for the SAME merchant on the same descriptor, the
    dry run reported the run CLEAN: exit 0, conflicts 0, lost-assignments 0, applied no. The identical command
    without --dry-run then exited 1 with no decision report, no totals and no applied line, printing only: Invalid
    prisma.merchantRule.updateManyAndReturn() invocation ... Unique constraint failed on the fields: (householdId,
    kind, pattern).
  - |-
    The acknowledge path cannot clear it, because it is not a reported condition: only ids in conflicts or
    lostAssignments are learnable from a report, at scripts/rederive-merchant-rules.ts:126 through :138, and this
    condition appears in neither list.
  - |-
    The tests do not reach it: test/application/rederive-merchant-rules.test.ts:434 seeds a merchant conflict
    between DIFFERENT merchants and there is no same-merchant collision case in the file, and the in-memory fake has
    no unique key to violate.
  concrete-fix: |-
    Treat a same-merchant claimant as a decision rather than as a silent fall-through, at
    src/modules/merchants/application/rederive-rules.ts:352. When claimant returns a rule with the SAME merchantId,
    do NOT queue the update: the target pattern already exists and already carries the same meaning for the same
    merchant, so leaving the old rule un-namespaced loses no assignment, which the superset test at :495 will
    confirm. Report it with a new outcome token beside empty-pattern-left-alone, for example
    already-covered-by-a-namespaced-twin, so the operator sees it and the second run prints the same decision. Add a
    test at test/application/rederive-merchant-rules.test.ts beside :434 seeding exactly the D-46 window shape, an
    un-namespaced rule and a namespaced rule for one merchant on one descriptor, asserting zero updates against the
    colliding rule and exit 0.
- id: CR2-M3P12-03
  severity: medium
  analysis: |-
    THE SCRIPT'S OWN CONTRACT SAYS EXIT 1 MEANS THE DATABASE IS EXACTLY AS IT WAS FOUND, AND THAT IS FALSE ON THE
    ERROR PATH. The sentence is written about a blocked run and then generalised to the exit code, and exit 1 is
    also what the top-level rejection handler sets. The apply block issues its updates one statement at a time with
    no transaction, so a repository error partway through leaves some patterns rewritten, no rules inserted, no
    recompute run, and no report printed at all: not the decision report, not the totals, not the applied line. An
    operator reading the file's contract concludes nothing happened, and something did. Clause R-087: a
    present-tense claim in a document that is false in a reachable case is a finding, and this one sits on the
    single command that is meant to run against the owner's live database.
  evidence:
  - |-
    The claim: scripts/rederive-merchant-rules.ts:33 through :42, WHAT A BLOCKED RUN LEAVES BEHIND ... NOTHING ...
    so exit 1 means the database is exactly as it was found.
  - |-
    The other path to exit 1, which prints only the error message and no report:
    scripts/rederive-merchant-rules.ts:169 through :177.
  - |-
    The un-transacted apply loop: src/modules/merchants/application/rederive-rules.ts:529 through :537, three
    sequential awaits with no interactive transaction around them.
  - |-
    WITNESSED on the pinned pulse_r2crit database. I added a CHECK constraint refusing one of the three patterns
    pass one would write, then ran the applying command. Exit 1, no report of any kind, and the snapshot afterwards
    showed TWO of the three rule rows rewritten, with new xmin and new pattern hashes, while the third was
    unchanged. The database was not as it was found.
  concrete-fix: |-
    Either make the claim true or narrow it. The narrow fix is to wrap the apply block at
    src/modules/merchants/application/rederive-rules.ts:529 through :537 in one interactive transaction so a
    mid-apply failure rolls back, which also makes the recompute and the rule writes atomic. The honest-wording fix,
    if the transaction is judged out of scope, is to change scripts/rederive-merchant-rules.ts:38 to say that a
    BLOCKED run leaves nothing behind and that an ERRORED run may have applied part of pass one, and to print, in
    the rejection handler at :173, how many pending updates had been issued before the failure, so an operator knows
    whether to re-run. Re-running is safe and converges, because a rule the first attempt namespaced is left alone
    by the second, and saying so in the same place would close the question.
- id: CR2-M3P12-04
  severity: medium
  analysis: |-
    THE ONE COMMAND POINTED AT THE OWNER'S REAL DATA PRINTS A DATABASE ERROR VERBATIM, AND A POSTGRES ERROR CARRIES
    THE FAILING ROW. The same file's header states that it prints no pattern content, and gives the reason: this
    repository is public and a stored pattern is derived from a real statement's text. The rejection handler prints
    the caught error's message, and for a Prisma query error that message embeds the driver's ConnectorError
    including Postgres's DETAIL, which names the whole failing row. That is descriptor content on an operator's
    console, and this fleet's own history is that such output reaches a work history or a note before anyone thinks
    about it. Two real merchant descriptors reached this public repository exactly that way.
  evidence:
  - |-
    The contract the file states for itself: scripts/rederive-merchant-rules.ts:48 through :50, IT PRINTS NO PATTERN
    CONTENT ... this repository is public and a stored pattern is derived from a real statement's text.
  - |-
    The line that breaks it: scripts/rederive-merchant-rules.ts:174, which prints error.message for any thrown
    error.
  - |-
    WITNESSED on the pinned pulse_r2crit database, with an invented pattern so nothing real is quoted here: the
    check-constraint run printed, inside the error message, Failing row contains ( ... , EXACT, descriptor:SHOP
    ALFA-style pattern, timestamp), that is the rule id, the household id, the merchant id, the kind, THE WHOLE
    PATTERN and the created-at timestamp.
  - |-
    Every other output path in the file is disciplined and prints ids, passes, bases, outcomes and integers only:
    scripts/rederive-merchant-rules.ts:104 through :165.
  concrete-fix: |-
    Print a redacted failure at scripts/rederive-merchant-rules.ts:174 rather than the raw message. This tree
    already has the mechanism: src/platform/db/redact.ts, with its own test at test/db/redact.test.ts, exists for
    exactly this. Route the caught error through it, or at minimum print only the error's constructor name and, for
    a Prisma error, its code, and tell the operator to read the database log for the detail. Add an assertion beside
    the existing script-source tests at test/application/rederive-merchant-rules.test.ts:734 that the rejection
    handler does not print a raw message.
