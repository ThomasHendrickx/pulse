- id: CR2-M3P12-07
  severity: low
  analysis: |-
    A BARE-NAMESPACE GROUP NOW RENDERS AS A ROW WITH NOTHING ON IT AND NOTHING TO DO. The fix round correctly
    withholds the naming form from a group keyed on a bare namespace. The consequence on screen is a list item whose
    label is the empty string, because the label is the normalised counterparty text and there is none, carrying a
    row count and an amount and no control and no explanation. The reader sees what looks like a broken row rather
    than a deliberate refusal, and the refusal message that WOULD explain it exists already and is only reachable by
    submitting a form that is no longer there. This is a smaller thing than the merge it prevents and I raise it as
    low, but it is the one place where the fix is visible to the owner and it is visible as an absence.
  evidence:
  - |-
    The form is withheld on the group's own missing subject field: src/modules/merchants/ui/merchant-review.tsx:45,
    and the group is still rendered with its label, count and amount at :36 through :44.
  - |-
    The label is empty for such a group by construction: src/modules/merchants/domain/merchant-review.ts:103 and
    :115 through :118, where the unresolved label is normaliseCounterparty(counterpartyText(row)).
  - |-
    The message that would explain it, which is only reachable through a refused submission: messages/en.json,
    nameRefusedUnidentifiable, mapped at src/modules/merchants/ui/merchant-review.tsx:120.
  - |-
    Witnessed: buildMerchantReview over two rows carrying no counterparty text returned one group with key
    descriptor:, count 2, total -3000 and no counterpartyText, which is what the component renders.
  concrete-fix: |-
    Render the reason in place of the form rather than nothing, at src/modules/merchants/ui/merchant-review.tsx:45:
    when an unresolved group has no counterpartyText, show the nameRefusedUnidentifiable copy, or a shorter form of
