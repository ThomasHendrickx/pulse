- id: CR2-M3P12-08
  severity: medium
  analysis: |-
    THE WRITE BOUNDARY VALIDATES A COMPACTED SUBJECT AND STORES THE UNCOMPACTED ONE, so it can accept a subject and
    write a rule that can never match. isTrustedCounterpartyAccount compacts and uppercases internally before
    testing, and assignMerchant then stores the submitted string VERBATIM, with a comment saying that normalising it
    again would uppercase the namespace. Both halves are right on their own and the pair is not: a subject carrying
    the account in lowercase spaced groups passes the gate and is stored as written, while the derivation the
    matcher is fed always produces the compacted uppercase form, so the two can never be equal. That is precisely
    the outcome criterion 12.18 names in its own reasoning, silently writing a rule that can never match anything,
    arriving through a door the criterion's enumeration does not cover: the criterion refuses an empty remainder and
    a remainder that fails the trust gate, and this remainder passes the trust gate. Today the only writer is a
    hidden field carrying a derived key, so this is not reachable from the shipped form without tampering; it
    becomes reachable the moment anything else writes a subject, which is exactly what the slice-5 accepted-answer
    path the schema reserves PREFIX and PATTERN for will do.
  evidence:
  - |-
    The gate compacts before testing: src/modules/merchants/domain/counterparty-identity.ts:262 through :278, where
    compactAccount is applied at :266 and every later test reads the compacted value.
  - |-
    The boundary stores the raw submission: src/modules/merchants/application/assign-merchant.ts:86, with the
    verbatim-storage decision stated at :83 through :85 and the rule written from it at :128 through :132.
  - |-
    WITNESSED. Submitting an account-basis subject whose remainder is the fixture-shaped account written lowercase
