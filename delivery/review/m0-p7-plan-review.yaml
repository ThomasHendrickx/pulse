  - id: ADV-M3P9A-09
    severity: medium
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:12057-12086 (D-61), third reason: "And
        it costs ONE file rather than two, so criterion 9.7 can name the
        permitted path and falsify on a second, which a criterion permitting
