      - >-
        delivery/plan/pulse-v02.yaml:4968-4972 (criterion 9.7(b)) already
        enumerates SIX forbidden path prefixes in one sentence. A criterion
        that can name six prefixes can name two permitted paths and falsify
        on a third.
      - >-
        Captured in /home/user/wt-m0p7-adv: `grep -rn "dangerouslySetInnerHTML"
        src/ test/` returns nothing, and `grep -rn
        "Content-Security\|script-src\|nonce"` over src/, next.config.ts and
        middleware.ts returns nothing; there is no middleware.ts. The tree
        has neither the API nor a policy that would block it.
      - >-
        D-61 records the cost as "the handler is a string constant and is not
        typechecked" and stops there. It sets no standing constraint on the
        constant, and criterion 9.7(c) constrains only THIS phase's diff.
    analysis: >-
      The CONCLUSION is right and one of its three legs is not, and the leg
      that is not is the one the brief suspected. Reason one is the criterion
      driving the architecture: it says the shape was chosen so a criterion
      could be written a particular way, and that is the inversion this whole
      process exists to prevent, made worse by being false on its own terms
      since naming two paths is no harder than naming one. Reasons two and
      three stand on their own and are enough. Reason two is real: the client
      boundary count is the only thing that keeps H9.5 measurable and the
      M3-P9 and M3-P10 split meaning anything, and it is a property of the
      architecture rather than of the criterion. Reason three is the
      strongest and is a product property, not a process one: a listener that
      attaches at parse time answers a complaint whose words are that nothing
      happens when the owner presses, and a listener that waits for the React
      bundle to hydrate on a phone does not. On safety, the shape is safe as
      specified: the content is a static module-scope constant with no
      interpolation, no user input and no request data, so there is no
      injection surface, and 9.7(c) pins that for this phase. What is missing
      is that nothing carries the constraint FORWARD: a later phase that
      wants a duration or a selector list from a token can interpolate into
      the constant and no gate in this repository would see it, since
      gate:privacy cannot read intent and the eslint glob does not reach
      src/app. And no CSP exists today, so nobody has to think about a nonce
      until someone adds one and the press dies silently.
    concrete-edit: >-
      In D-61, strike the third reason entirely, from "And it costs ONE file"
      to "could not do", and replace it with a recorded standing constraint:
      "THE COST TAKEN KNOWINGLY, AND WHAT HOLDS IT. The handler is a string
      constant and is not typechecked, and dangerouslySetInnerHTML appears
      nowhere else in the tree. Two things bound that. The constant carries
      NO interpolation, ever: no template expression, no token read, no
      request value and no locale. A later phase that needs a value inside it
      does not add one, it moves the listener to a client island and reopens
      this decision, and criterion 9.7(c) pins the constant's shape for this
      phase only. And the product declares no Content-Security-Policy today,
      confirmed by grep over src/, next.config.ts and the absent middleware,
      so a phase that later adds one adds a nonce for this script in the same
      change or turns criterion 9.9 red, which is the right place for it to
      be noticed. The file-count argument is deliberately NOT among the
      reasons: a criterion can name two paths as easily as one, and choosing
      an architecture to fit a criterion's shape is the inversion this plan's
      own process exists to prevent."
