    analysis: >-
      A criterion that cannot pass is the same defect as a criterion that
      cannot fail, and this one cannot pass as written. The escape routes are
      both bad. Editing the comment at nav-link.tsx:7 to satisfy the count
      prints a SECOND file matching *.tsx and falsifies 9.7(a) in the same
      motion, which is a nice demonstration that the two halves of 9.7 are
      not independent. Rewriting the criterion mid-round is what the
      amendment's own preamble says it is trying to stop. And the third hit
      is not hypothetical: this codebase comments every non-obvious choice
      and R-087 requires corrections to be annotated rather than erased, so a
      layout file carrying a six-line script with no explanation would be the
      unusual outcome. The guard the amendment wants is a count of the
      DIRECTIVE, and the directive has a shape a grep can pin: it is the
      first statement of a file and it is a bare string literal.
    concrete-edit: >-
      Replace the first sentence of criterion 9.7(c) with: "grep -rn
      '^\"use client\"' over src/ returns exactly ONE line,
      src/platform/ui/nav-link.tsx:1, the same single line it returned at
      this phase's base. The anchored pattern is deliberate and is not a
      loosening: an unanchored grep for the phrase returns TWO lines at the
      base, because src/platform/ui/nav-link.tsx:7 is a comment explaining
      the directive, and a criterion that counts prose cannot be satisfied
      without editing a file criterion 9.7(a) forbids this phase to print.
      What is counted is the DIRECTIVE, which is a bare string literal at the
      head of a file, and src/app/layout.tsx must not gain one."
