  - id: ADV-M3P9A-04
    severity: high
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:5049-5058 (criterion 9.9(c)): "On every
        touch input path the spec drives, and it drives at least three of
        them, the frame count in :active is exactly ZERO. This is an
        ASSERTION and not an observation, and it is kept deliberately: it
        pins the measurement to the mechanism that actually ships, so an
        engine version that later begins granting :active under a synthesized
        touch turns this suite RED".
      - >-
        Nothing in 9.9(c) requires any of the three paths to have delivered
        an event. A path that dispatches nothing, or a synthetic
        page.dispatchEvent("touchstart") that produces no compatibility
        pointerdown, reports a frame count in :active of exactly zero and
        counts toward "at least three".
      - >-
        /home/user/wt-m3p9/test/e2e/pressed-and-disabled.spec.ts:836-845:
        the prior round's spec asserts the captured event list
        `toContain("pointerdown")` and `toContain("touchstart")` on the
        control BEFORE asserting the zero :active count, with the failure
        messages "no pointerdown reached ${probe} under a held touch press"
        and "no touchstart reached ${probe} under a held touch press".
      - >-
        /home/user/wt-m3p9/test/e2e/pressed-and-disabled.spec.ts:654-657: the
        three paths actually measured are CDP Input.dispatchTouchEvent
        touchStart, Input.synthesizeTapGesture with gestureSourceType
        "touch", and page.touchscreen.tap. The criterion names none of them.
    analysis: >-
      The criterion states its own purpose out loud and then fails to buy it.
      A tripwire that reports zero because nothing walked into it is not a
      tripwire, and the future reader who sees a green 9.9(c) five phases
      from now will read it as "this engine still does not grant :active
      under touch" when what it may mean is "this spec no longer drives
      touch". What makes this finding sharp rather than theoretical is that
      the implementer ALREADY wrote the guard: the code asserts the path is
      live before it asserts the state is absent. The plan is therefore
      weaker than the artifact written against it, which is the direction of
      drift that costs the most, because the next round has the plan and not
      the reasoning.
    concrete-edit: >-
      Replace the second sentence of criterion 9.9(c) with: "On every touch
      input path the spec drives, and it drives at least three of them, named
      here so a dead path cannot be counted as a live one, a held CDP
      Input.dispatchTouchEvent touchStart, Input.synthesizeTapGesture with
      gestureSourceType touch, and page.touchscreen.tap: each path is FIRST
      shown to have delivered input, by asserting that the events captured on
      the control under test contain both pointerdown and touchstart, and
      only then is the frame count in :active asserted to be exactly ZERO.
      The order is the criterion, not a convenience: a zero from a path that
      delivered nothing is the same number as a zero from an engine that
      grants no :active, and the whole value of this half is that the two can
      be told apart. The spec prints the per-path event list beside the
      per-path frame counts."
  - id: ADV-M3P9A-05
    severity: high
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:4686-4694 (the state-vocabulary step):
        'the rule for [aria-disabled="true"] sets pointer-events to none
        alongside the surface and ink change, so a control that has been made
        to look unusable does not navigate when it is pressed'.
      - >-
        delivery/plan/pulse-v02.yaml:4850-4891 (criterion 9.3(a)): with
        aria-disabled="true" applied through the DOM the criterion measures
        background-color, color, border-color, opacity and cursor. It does
        not measure pointer-events, and it does not attempt an activation.
      - >-
        delivery/plan/pulse-v02.yaml:5159-5174 (hazard H9.10) defers the
        aria-busy refusal on the ground that "nothing in the product enters
        aria-busy until M3-P10, a refusal written here would guard a state
        that cannot occur".
      - >-
        Captured in /home/user/wt-m0p7-adv: `grep -rn "aria-busy" src/ test/`
        returns nothing AND `grep -rn "aria-disabled" src/ test/` returns
        nothing. Both states are equally unreachable in the product today.
      - >-
        /home/user/wt-m3p9/delivery/work-history/m3-p9.yaml:818-822 records a
        remedy construction M3P9-C11 that DID measure it: "A control marked
        aria-disabled no longer activates from a pointer, and the same click
        at the same coordinates does activate it when the marking is
        removed."
    analysis: >-
      My judgement, asked for rather than agreement. The trade is not
      acceptable, for three reasons that compound. First, the stated reason
      is a process reason and not a technical one: 9.3 having been through
      two fix rounds is a fact about the plan's history, and this same
      amendment reopened criterion 9.7, which had also been through two fix
      rounds, plus H9.5, D-22, the intent, the root cause and the file set.
      The scope argument does not survive its own document. Second, the
      marginal cost is one property name in a snapshot the criterion already
      takes: 9.3(a) already calls getComputedStyle on exactly those elements
      with exactly that attribute applied, so adding pointer-events is a word
      in a list, not a measurement. Third, and this is the part that makes it
      a defect rather than an omission, the plan asserts a BEHAVIOUR here,
      "does not navigate when it is pressed", and ships it with no witness at
      all, which is precisely hazard H9.1's class, a rule the stylesheet
      carries and the screen never shows. And H9.10's own argument cuts the
      other way once the tree is checked: nothing enters aria-disabled today
      either, so the reason given for deferring the busy refusal applies
      unchanged to the disabled refusal the phase is shipping. Either the
      unreachable-state argument is good, in which case both go, or it is
      not, in which case the one being shipped gets measured. The prior round
      already measured it, so the cost is known to be small.
    concrete-edit: >-
      Extend criterion 9.3(a), inside the existing clause and after "AND the
      computed cursor is not \"pointer\"": "AND, where the state was applied
      as aria-disabled=\"true\", the computed pointer-events is \"none\" and
      an activation is REFUSED: a click dispatched at the control's centre
      does not navigate, does not submit and fires no click on the control,
      and the SAME click at the SAME coordinates does reach it once the
      aria-disabled marking is removed, so the refusal is shown to be the
      marking's doing and not the coordinates'." Extend the FALSIFIED BY
      clause with "by a control that still computes pointer-events other than
      none while carrying aria-disabled, or by one that still activates under
      it". And add one sentence to H9.10 so the asymmetry is recorded rather
      than left to be noticed: "Nothing in the product enters aria-disabled
      today either, so what separates the two cases is not reachability but
      ownership: the refusal on the link-shaped control is the whole of what
      this phase can give it, and criterion 9.3(a) measures it here rather
      than trusting it."
  - id: ADV-M3P9A-06
    severity: medium
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:5031-5048 (criterion 9.9(b)): the hold
        is "at least 150ms"; (i) the attribute is carried by "at least 60
        percent" of sampled frames; (iv) the time to first moved frame is "at
