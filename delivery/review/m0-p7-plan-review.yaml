  - id: ADV-M3P9A-01
    severity: high
    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:5031-5048 (criterion 9.9(b)): the press
        is sampled "while the touch is held" and is released "AWAY FROM THE
        CONTROL by moving the touch point off it before the touch ends". No
        half of 9.9 samples a single frame AFTER the touch ends.
      - >-
        delivery/plan/pulse-v02.yaml:4746-4849 (criterion 9.2(b)): the
        computed snapshot is captured in exactly TWO states, hovering and
        held, and 9.2 releases away from the control for the same reason. No
        post-release snapshot exists there either.
      - >-
        delivery/plan/pulse-v02.yaml:4627-4653 (the new step): the clear is
        specified as "capture-phase pointerup and pointercancel listeners
        that clear every data-pressed in the document", which is correct and
        is a STEP, not a criterion. Nothing in the acceptance set falsifies
        its absence.
      - >-
        /home/user/wt-m3p9/test/e2e/pressed-and-disabled.spec.ts:687-693: the
        prior round's handler clears with
        document.querySelectorAll("[data-pressed]") on BOTH pointerup and
        pointercancel, so the correct shape is known and is simply not
        measured.
      - >-
        Pointer Events implicit capture: for pointerType touch the user agent
        captures the pointer to the pointerdown target, so a touch pointerup
        fires on the control even when the finger has moved off it. The
        release-away technique therefore cannot distinguish a document-wide
        clear from a target-scoped one, and cannot exercise pointercancel at
        all.
    analysis: >-
      THE IMPLEMENTATION THAT PASSES EVERY CRITERION AND LEAVES THE PRODUCT
      WORSE THAN TODAY. Ship the listener exactly as criterion 9.7(c)
      describes it: a module-scope string constant, one script element with
      data-testid="press-feedback", a capture-phase pointerdown that sets
      data-pressed on the closest matching ancestor. Give it a pointerup
      listener and no pointercancel listener. Every criterion in the phase is
      green. 9.9(a) finds the script element in both served documents.
      9.9(b) counts the attribute on 96 percent of held frames, a transform
      on 93 percent, 2.000px of peak displacement and 30ms to first movement.
      9.9(c) reports zero frames in :active. 9.9(d) repeats it under reduce.
      9.2 and 9.3 and 9.4 never touch the question. Now the owner uses it. He
      puts a finger on the month view and drags to scroll, which is the most
      common gesture on the surface this whole round exists for. The browser
      takes the gesture for scrolling and fires pointercancel, not pointerup.
      Nothing clears data-pressed. The control he started the scroll on stays
      drawn pressed, moved by --press-offset and tinted, until he happens to
      tap something. Every subsequent press of that control produces no
      change at all, because it is already in the pressed state, so the
      complaint the phase was dispatched against is not merely unanswered on
      that control, it is answered backwards. This is H9.11's own class,
      green and inert, arriving through the END of the press instead of the
      beginning of it, and the amendment closed one end and left the other
      open. The release-away trick is what hides it: it was adopted so no
      measurement submits a form, which is right, and its cost is that the
      only moment that could witness the clear is the one moment the
      measurement never reaches.
    concrete-edit: >-
      Add a fifth half to criterion 9.9, before the FALSIFIED BY clause:
      "(e) THE PRESS ENDS WHEN THE FINGER DOES. For at least one control of
      each of the three shapes in the enumeration, a submit button, a
      link-shaped control with no background of its own, and the disclosure
      summary, the spec drives THREE endings and samples frames after each
      one. First a release ON the control, with the activation refused by a
      capture-phase click handler the spec installs, which is the one thing
      the spec may install and is not a mechanism under measurement. Second a
      release away from the control. Third a POINTERCANCEL, produced by a
      touch that begins on the control and then moves far enough that the
      engine takes the gesture, which is what a scroll begun on a control is
      and is the ending the owner produces most often. After each ending, and
      within 200 milliseconds of it, document.querySelectorAll('[data-pressed]')
      has length ZERO and the control's computed transform and bounding rect
      are back at their resting values. FALSIFIED BY any element still
      carrying data-pressed after any of the three endings, or by a control
      that does not return to rest." And add the ending to the step at
      :4627 in words that name the failure: "the pointercancel listener is
      not optional and is not a nicety, because a scroll begun on a control
      IS a pointercancel and there are more of those on this product's month
      view than there are taps."
