    evidence:
      - >-
        delivery/plan/pulse-v02.yaml:5031-5048 (criterion 9.9(b)(iii)): "the
        PEAK VERTICAL DISPLACEMENT of the control's bounding rect from its
        resting top is at least the computed value of --press-offset and at
        least 1.0 device-independent pixel".
      - >-
        /home/user/wt-m3p9/test/e2e/pressed-and-disabled.spec.ts:701-744, the
        sampler this wording describes: `const restTop =
        el.getBoundingClientRect().top;` is read ONCE before the press, and
        each frame computes `Math.abs(el.getBoundingClientRect().top -
        restTop)`. getBoundingClientRect is viewport relative.
      - >-
        Criterion 9.9(b) counts (i) attribute frames, (ii) transform frames
        and (iii) peak displacement as three INDEPENDENT tallies over the
        sampled set. No sentence requires one frame to satisfy two of them.
      - >-
        The gesture under measurement is a touch that is deliberately MOVED
        off the control before it ends, so the run contains pointer movement
        by construction.
    analysis: >-
      Two holes in the same half. First, a viewport-relative rect makes any
      scroll or reflow during the hold read as movement, and the criterion's
      own release-away technique guarantees pointer movement during the run;
      a page that scrolls one pixel hands every control in the enumeration a
      free pass on the half the criterion calls non-negotiable. Second, the
      three tallies float free of each other, so an implementation whose
      attribute is set by the shipped listener and whose movement comes from
      somewhere else entirely, a sticky :hover under touch emulation being
      the obvious candidate on this engine, satisfies all three without the
      attribute ever having moved anything. Criterion 9.2 catches the hover
      case at the desk width by comparing against a hovering baseline, which
      is good design and is why this is medium rather than high, but 9.9 is
      the criterion that claims to witness the press in the shipped product
      under a finger, and it should not need a sibling to be sound.
    concrete-edit: >-
      Replace criterion 9.9(b)(iii) with: "(iii) the PEAK VERTICAL
      DISPLACEMENT is at least the computed value of --press-offset and at
      least 1.0 device-independent pixel, taken from the control's OWN
      computed transform matrix, the f component of the 2d matrix, and not
      from the bounding rect alone: a rect read against the viewport moves
      when the page scrolls, and this measurement deliberately moves the
      touch point before the touch ends. The bounding rect delta is captured
      as well and must agree with the matrix to within 0.5 device-independent
      pixels after correcting for window.scrollY, so a transform that the
      compositor never draws is still caught." And add a new clause after
      (iv): "(v) THE THREE TALLIES ARE THE SAME EVENT. At least one sampled
      frame carries, SIMULTANEOUSLY, [data-pressed] on the control under test
      and a computed transform whose vertical translation meets (iii). Counts
      taken separately can be met by two unrelated mechanisms, and the one
      this phase ships is a single attribute answered by a single rule."
