        `grep -rn "use client" src/ | wc -l` returns 2.
      - >-
        src/platform/ui/nav-link.tsx:7 is a COMMENT explaining the directive,
        not a second directive, and it was there at the phase base.
      - >-
        D-61 (delivery/plan/pulse-v02.yaml:12057-12086) explains the choice
        in the words 'a "use client" file would make this phase open the
        first React client boundary', which is the sentence an implementer
        following this repository's commenting convention will paste into
