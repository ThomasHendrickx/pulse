      - >-
        /home/user/wt-m3p9/delivery/work-history/m3-p9.yaml:805-816, the
        measurement the floors were set from: "carrying [data-pressed] 28,
        with a transform 27, peak box displacement 2.000px" and "press to
        first visible change" 29.2ms and 31.4ms.
      - >-
        /home/user/wt-m3p9/test/e2e/pressed-and-disabled.spec.ts:759:
        `const TOUCH_HOLD_MS = 400;`. The 27 to 29 sampled frames were taken
        over 400ms, which is about 68 frames per second: an UNSTARVED run.
        The criterion permits a hold of 150ms, which at the same frame rate
        is 9 frames and under contention is 2 or 3.
      - >-
        Captured in this container now: `uptime` reports "load average:
        11.29, 9.83, 9.15" with `nproc` 4.
      - >-
        Fleet environment warning 18: the e2e gate is not reliably green
        under fleet contention, measured at load 5.8 to 9.44 on the same four
        cores, with two different failure symptoms on two consecutive
        isolated runs of one spec.
    analysis: >-
      The magnitudes have real margin and the TIMING does not. 2.000px
      against a 1.0px floor and 96 percent against a 60 percent floor are
      comfortable as ratios, but the 60 percent floor is fragile in its
      DENOMINATOR rather than its numerator: the measured runs carry one
      leading frame without the attribute, which is correct and unavoidable,
      and one leading frame out of three is 67 percent while one out of two
      is 50 percent. So the floor tightens as the box gets busier, which is
      exactly backwards. The 100ms floor is worse because it is a wall clock
      assertion: 29ms was measured at 68fps, and a single delayed animation
      frame on a box at load 11 exceeds the whole budget. Neither is set
      dishonestly; both are set from one healthy run and asserted on a
      machine warning 18 already says is not healthy. A criterion that
      reddens for load rather than for code is the thing that gets weakened
      in the fix round, and the half most likely to be weakened is (iii), the
      pixel half the criterion calls non-negotiable.
    concrete-edit: >-
      In criterion 9.9(b), replace "for at least 150ms" with "for at least
      400 milliseconds, the hold the first round actually measured, so the
      sample is not thinned to the point where its own ratio is noise"; add
      before (i): "the run samples at least EIGHT animation frames during the
      hold, and a run that samples fewer FAILS as unmeasured rather than
      passing on a thin sample"; replace (i) with "(i) the control under test
      carries [data-pressed] on every sampled frame except at most the FIRST,
      which is the shape the first round measured, 28 of 29 and 26 of 27, and
      which does not tighten as the sample thins the way a percentage does";
      and replace (iv) with "(iv) the movement arrives at the FIRST or SECOND
      sampled frame at or after the pointerdown, and the spec PRINTS the wall
      clock milliseconds from pointerdown to that frame beside the frame
      index. The assertion is on the frame index and not on the millisecond
      count, deliberately: 29.2ms and 31.4ms were measured on an idle
      container and this fleet's own environment warning 18 records the gate
      running at load 5.8 to 9.44 on four cores, where one delayed animation
      frame exceeds any hundred-millisecond budget and would redden this
      criterion for the machine rather than for the code."
  - id: ADV-M3P9A-07
