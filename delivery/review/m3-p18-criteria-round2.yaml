    concrete-fix: "Unchanged from round one: run npm run test:e2e in a container with the Docker-based local Supabase stack, capture the output into the phase work history, and reopen only if it is not green. This is the slice-close condition CLAUDE.md already states; no code change is demanded."
    analysis: "Left open deliberately in the closing round: it rides the next brief as work. The approval above is of the artifact; this finding is the named condition between the artifact and slice close."
