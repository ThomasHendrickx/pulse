    concrete-fix: "At slice close, in a context holding the real documents: read every line of the two fixtures, the harness strings and the three catalogues' new lines against them, then append the one-paragraph record the notes file already reserves for it."
    analysis: "The round-one demand was written on the assumption the documents were reachable; the fix round's answer is the honest correction of that assumption, recorded precisely rather than performed nominally. Accepted as the environment's best truthful disposition, residue carried."

