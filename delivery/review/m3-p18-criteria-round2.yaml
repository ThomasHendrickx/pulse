    severity: low
    evidence:
      - "CARRIED FROM ROUND ONE, disposition verified and residue named. The demanded record now exists in the form this environment can honestly produce: delivery/work-history/m3-p18-notes.md (fix round section, CR-M3P18-01) states the real documents were never available to the session, that every new fixture line, harness string and catalogue line was invented in-session, names the only reused strings as earlier committed inventions, and records the read-back as OWED before slice close with the exact file list to read. The work history's claim M3P18-C10 records the same as an open question."
