    the keyboard arm is red, the leaf's onClick guard is where the repair goes. No code change is demanded
    by this finding; execution is.
  analysis: 'LIVE IN PRODUCTION. This is the criteria contract''s own sentence rather than a discovery:
    an arm that has never run cannot be counted as met, and here the arm was RE-OPENED by the fix round
    rather than merely left unexecuted. The merged phase measured a guard built on the native disabled
