    checks, true when written and false now. It costs nothing today and it is the shape that has already
    misled a reader in this repository once, which is why it is raised as a finding and not as a nit.
    The file''s OWN guard is fine: the closure walk asserts the list by name, and its comment says so.'
criteria:
