deviations-judged:
- deviation: 'The phase intent and step 3: "all seven submit controls", enumerated as the upload submit,
    the preview-again and confirm submits, the merchant naming submit, the sign-in and sign-up submits
    and the sign-out submit.'
  serves-plan-intent: true
  reasoning: 'The plan''s seven was measured at 89ed187 and M3-P14 shipped two more submit controls before
    this phase started; leaving the newest screen as the one place a press goes quiet would defeat the
    phase''s own intent. I verified the count independently: the spec asserts nine by name and the ninth,
    the accounts register submit, genuinely cannot use the shared leaf, because that form submits through
    onSubmit and a transition rather than a form action and useFormStatus reports nothing for it (src/modules/accounts/ui/account-setup-form.tsx:325
    through :348 carries the same aria-busy and aria-disabled vocabulary from the transition''s own flag).
    Widening the set makes every criterion that quantifies over it strictly harder.'
- deviation: 'Step 4 and criterion 10.5(a): "the seven navigating controls", enumerated as nav-overview,
    nav-import, nav-merchants, unresolved-pill, empty-state-import-link and the two month step controls.'
  serves-plan-intent: true
  reasoning: 'Same cause, same judgement: nav-accounts and empty-state-accounts-link are M3-P14''s and
    the spec measures all nine by name. The four further Links outside the plan''s categories are covered
    by the leaf and recorded as unmeasured rather than left unstated, which is the honest half. The two
    month step controls are matched by data-testid, which criterion 10.5(a) explicitly permits this phase
    to add, and the cost, two identity lines in M3-P9''s enumeration, is recorded with the failures that
    produced it.'
- deviation: Criterion 10.6(a), "grep -rln 'use client' src/ returns AT MOST three files, all of them
    under src/platform/ui/", and 10.6(b), "no file under any module's ui/ directory carries use client".
