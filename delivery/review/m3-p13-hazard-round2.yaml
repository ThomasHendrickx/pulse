findings:
  - id: HZ2-M3P13-02
    severity: medium
    analysis: >-
      THE FIX FOR HZ-M3P13-04 RE-OPENED THE GREEDINESS THIS FILE WAS REWRITTEN
      TO AVOID, and the test that claims otherwise does not reach the new
      path. The header of src/platform/ui/mask-account-number.ts states the
      design in its own words: a greedy pattern followed by a validity test
      does not work here, because it swallows the following word, so the
      registry decides the length BEFORE any consuming happens. The
      known-country branch still obeys that. The new unregistered-country
      branch does not: it loops from the registry's longest length down to
      its shortest, calling runOfLength at each, and accepts the first run
      that satisfies ISO 7064. runOfLength tolerates separators between
      characters, so on space-separated text SEVERAL lengths reach a legal
      end and each gets a 1-in-97 draw, and the longest is tried FIRST, which
      is precisely the direction that consumes past the token. Measured
      rather than reasoned: over 40,000 constructed reference-shaped
      descriptors of the form "MANDAAT" plus an unregistered two-letter
      prefix, two digits, five space-separated four-character groups and two
      trailing words, 2,047 were masked although no account was present, and
      418 of those had a following word CONSUMED INTO THE MASK, leaving
      output of the shape "MANDAAT ZZnn **** WORD" where the descriptor's own
      reference and one whole word are gone. The direction of failure is safe
      for privacy, which is why this is medium rather than high, and the
      population is synthetic, so the rate on real Belgian descriptors is
      unmeasured. What it costs is real all the same: the screen silently
      deletes text the reader needs, on /merchants, on the import preview and
      on the month view, which is the pulse-frontend rule that a screen never
      hides an unknown, failing quietly. The fast-gate test named "a
      separator at the start or the end of the run does not extend it, so the
      mask cannot swallow a neighbouring word" exercises only two
      known-country cases and cannot see this at all.
    evidence:
      - "probe: npx tsx on a scratchpad script in /home/user/wt-m3p13-haz calling maskAccountNumbers over 40,000 constructed descriptors; trials=40000 masked=2047 of which swallowed a following word=418, with three captured samples of the shape MANDAAT ZZnn **** WORD"
      - "src/platform/ui/mask-account-number.ts, accountSpanAt, the descending loop from ACCOUNT_NUMBER_LENGTH_BOUNDS.longest to .shortest accepting the first span whose compact form satisfies accountNumberChecksumHolds"
      - "src/platform/ui/mask-account-number.ts, runOfLength, which skips any number of separators between run characters, so more than one length can reach a legal end on separated text"
      - "src/platform/ui/mask-account-number.ts header, the paragraph beginning THE SCAN IS LENGTH-DIRECTED, NOT GREEDY, which states the property the fallback breaks"
      - "test/domain/identity-on-review.test.ts:394, the swallow test, whose two cases are both known-country and neither reaches the fallback"
    concrete-fix: >-
      Make the fallback consume the WHOLE token or nothing, so exactly one
      length is ever a candidate and the scan cannot end inside a longer run
      of groups. Concretely: in accountSpanAt's unregistered-country branch,
      first walk forward from `from` over alphanumerics and separators to the
      end of the maximal run, counting the alphanumerics as `total`; refuse
      unless `total` lies within ACCOUNT_NUMBER_LENGTH_BOUNDS; then call
      runOfLength once with `total` and accept only if the checksum holds.
      That restores the header's stated property, drops the spurious rate
      from about one in twenty of these shapes to one in ninety-seven, and
      makes word-swallowing impossible rather than rare. Then widen
      test/domain/identity-on-review.test.ts:394 with at least one
      unregistered-country case followed by a word, asserting the word
      survives, so the test's name becomes true of both branches.
  - id: HZ2-M3P13-01
    severity: low
    analysis: >-
      THE SEPARATOR SET IS NOW ONE ANSWER, BUT IT IS AN ENUMERATION RATHER
      THAN A CLOSURE, AND IT STILL FAILS OPEN OUTSIDE ITSELF. The derived
      agreement is exact and this lane confirmed it independently over all
      65536 BMP code points: every character canonicalAccountNumber removes
      is tolerated, zero gaps. But the rule the mask now holds is "whitespace,
      full stop or hyphen", and a grouping character outside that set still
      returns the account VERBATIM. Measured at 2a0cc03: the zero-width space
      U+200B, the word joiner U+2060, the soft hyphen U+00AD, the en dash
      U+2013, the underscore and the solidus each leave the account fully
      legible. Two shapes from round one's own sweep also still leak and were
      not part of that finding's fix: a country code separated from its check
      digits, which the candidate pattern refuses because it requires two
      letters immediately followed by two digits, and an account glued to a
      preceding word, which has no word boundary to start at. None of these
      rests on in-tree evidence the way U+00A0 did, so this is low rather
      than a repeat of the high finding; the one worth noting is U+00AD,
      which is byte 0xAD in Windows-1252, the same encoding whose byte 0xA0
      produced the original defect.
    evidence:
      - "probe: the twenty-five case sweep at 2a0cc03, in which ZERO-WIDTH U+200B, WORD-JOINER U+2060, SOFT-HYPHEN U+00AD, EN-DASH U+2013, UNDERSCORE, SLASH, country-space-check and glued-prefix all returned MASKED=false with the input verbatim, while all fourteen round-one separator cases returned the masked form"
      - "the same script's derivation sweep: characters canonicalAccountNumber removes 25, of those not tolerated by the mask 0, tolerated but not removed exactly the full stop and the hyphen"
      - "src/platform/ui/mask-account-number.ts, isSeparator, the union of isAccountNumberWhitespace with the two literals"
      - "src/platform/ui/mask-account-number.ts, CANDIDATE_START, which requires two letters immediately followed by two digits at a word boundary"
    concrete-fix: >-
      Invert the rule so it closes rather than enumerates: between run
      characters, tolerate ANY single non-alphanumeric character, and bound
      the tolerance to ONE consecutive separator rather than the unbounded
      run isSeparator currently permits. That covers every character above
      and every one nobody has thought of, and the bound is what keeps the
      scan from reaching across arbitrary text, which is the property
      HZ2-M3P13-02 is about. Keep isAccountNumberWhitespace exported and
      keep the derived-agreement test, since it is the thing that would catch
      a future divergence in the canonical form. Separately, allow one
      separator between the country code and the check digits in
      CANDIDATE_START, and record the glued-prefix shape at the definition as
      a known limit rather than leaving it to be rediscovered.
  - id: HZ2-M3P13-03
    severity: low
    analysis: >-
      THE ROW DIGEST IS NOT A PRIVACY BOUNDARY AND NOTHING SAYS SO. The new
      data-group-key is an unsalted sha256 of the group key truncated to
      sixteen hex characters. As an identity it is correct and this lane
      verified it: 2,000,000 distinct account keys produced 2,000,000
      distinct digests, and it is stable across calls, so no naming claim can
      land on a sibling row. As a redaction it is weak, because the value
      hashed has low entropy and the same row displays the masked label:
      round one measured that the masked Belgian label leaves about 1.03e6
      candidate accounts, and hashing a million candidates is seconds of
      work, so anyone holding the markup can recover the account from the
      digest. That costs nothing TODAY, because the same row also carries the
      account in plaintext in the hidden naming field by design. It becomes
      the whole exposure the moment a later phase removes or opaques that
      field, believing the row is then clean, and the comment at groupDomId
      warns a future reader not to restore the key while saying nothing about
      what the digest does and does not buy.
    evidence:
      - "probe: node script in /home/user/wt-m3p13-haz hashing 2,000,000 distinct account-namespaced keys through the same createHash sha256 truncated to sixteen hex characters, collisions 0, and stability asserted across repeated calls"
      - "src/modules/merchants/ui/merchant-review.tsx, groupDomId, createHash sha256 with no salt, digest hex sliced to sixteen"
      - "round one's narrowing computation, delivery/review/m3-p13-hazard.yaml probe P2: 1,030,927 candidates consistent with the masked Belgian label"
      - "src/modules/merchants/ui/merchant-row.tsx, the naming form's hidden counterpartyText input, which carries the same key unmasked on the same row"
    concrete-fix: >-
      Do not change the digest, which is right for what it is asked to do.
      Add two sentences at groupDomId in
      src/modules/merchants/ui/merchant-review.tsx recording what it is and
      is not: it is a stable opaque row identity, and it is NOT a redaction,
      because the value hashed is low entropy and the masked label on the same
      row narrows it to about a million candidates. State that if a later
      phase makes the hidden identity field opaque, this digest must gain a
      per-household salt held server side in the same change, or the account
      simply moves from one attribute to another.

