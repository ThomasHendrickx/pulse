deviations-judged:
  - deviation: >-
      Criterion 13.2, "the rendered HTML of /merchants contains the masked form
      and does NOT contain the unmasked account anywhere, asserted over the
      full page source; and the hidden field the naming form submits carries
      the unmasked namespaced identity key, asserted on the same page."
    serves-plan-intent: true
    reasoning: >-
      Round one judged the resolution sound but recorded that one of its three
      excluded channels was not necessary. The fix round removed two of the
      three, which is more than that finding asked for: data-group-key is now
      an opaque digest, and the raw rows no longer cross the client boundary
      at all, so the serialised payload no longer carries them. What remains
      excluded is the hidden field the criterion itself requires, which is the
      irreducible half of the contradiction. The literal clause is now
      asserted against the production build, which is the only place it can
      mean anything, since next dev serialises every server component's props.
      The deviation is smaller than it was and serves the intent.
  - deviation: >-
      files-to-touch, which declares test/domain/ and test/e2e/ but neither
      test/application/ nor test/property/, and which declares
      src/modules/merchants/application/merchant-review.ts but not that
      module's index.ts.
    serves-plan-intent: true
    reasoning: >-
      Unchanged by the fix round in substance, and round one's judgement
      stands: the files outside the declaration are exactly the ones a
      required new field forces, none changes behaviour, and reporting rather
      than amending a declaration read from the merge base is right. The fix
      round touches two further undeclared files, src/modules/overview/ui/
      month-view.tsx and src/modules/import/ui/profile-confirmation.tsx, and
      that is this lane's own finding HZ-M3P13-02 being fixed where it lives;
      a fix confined to the declared list would have left the leak standing.
  - deviation: >-
      Step 5, "Let the transactions behind a group be seen".
    serves-plan-intent: true
    reasoning: >-
      Unchanged, and now safer than when round one judged it. The disclosure
      still renders on resolved groups as well as unresolved ones, and the
      serialisation defect that made the extra surface cost something, the
      raw rows crossing into the flight payload, is fixed for both branches by
      the same change, because both now call groupRowsMarkup rather than
      placing an element in a client component's props.

