findings:
  - id: R1-M3P18-01
    severity: medium
    evidence:
      - >-
        The full sweep for the refusal reason on the merged head returns SIX
        consumers: the union (confirm-import.ts:27 through :32), the arm
        (confirm-import.ts:121), the routing (actions.ts:109 through :110),
        the whitelist (status-keys.ts:16), the SETUP_LINKED set at
        src/modules/import/ui/import-status-line.tsx:14 through :17, and the
        shipped Playwright test asserting the refusal at
        test/e2e/accounts.spec.ts:446 through :475.
      - >-
        Criterion 18.1 (plan :10105) greps four of them: union, routing,
        whitelist, three catalogues. Step 3 (:9997) enumerates the same
        four. import-status-line.tsx appears nowhere in the phase, including
        files-to-touch (:10080 through :10103), which lists actions.ts and
        status-keys.ts but not import-status-line.tsx.
      - >-
        The e2e refusal test is implied dead by 18.1's acceptance arm ("a
        tree in which a savings statement is refused for its ring fails this
        criterion") but is never named as removed or rewritten, and
        files-to-touch's test/e2e/accounts.spec.ts entry does not say why
        that file is touched.
    analysis: >-
      The criterion's own theory is that a dead reason left wired is how a
      refusal comes back, and its instrument is an enumeration presented as
      complete. The enumeration is not complete. The SETUP_LINKED member
      happens to be caught by tsc today, because removing the key from
      IMPORT_STATUS_KEYS narrows KnownImportStatus and the literal in the
      Set generic stops compiling; but the criterion does not get to lean on
      an accident it never states, and a later refactor of the set to plain
      strings removes the accident while the criterion stays green. The
      refusal test is the exact "tree in which a savings statement is
      refused" the criterion fails, sitting in the tree the implementer
      starts from; naming it costs one clause and saves the implementer
      rediscovering why the e2e gate is red.
    concrete-edit: >-
      In step 3 and criterion 18.1, extend the enumeration with two entries:
      "the SETUP_LINKED membership at
      src/modules/import/ui/import-status-line.tsx:14 through :17" and "the
      Playwright test shipped by criterion 14.5 that asserts the refusal
      (test/e2e/accounts.spec.ts:446 through :475), which this phase
      REWRITES into the acceptance test 18.1 specifies rather than deletes,
      so the three-arm structure of the gate keeps its coverage". Add
      src/modules/import/ui/import-status-line.tsx to files-to-touch.
  - id: R1-M3P18-02
    severity: high
    evidence:
      - >-
        The fast gate is in-process by design: vitest.config.ts's header
        reads "The fast gate: unit, schema and property tests. In-process,
        no network, no browser." Application tests run over in-memory fakes
        of the ports (test/application/month-overview.test.ts:24 through
        :27: "The month overview use case over an in-memory fake of the
        repository port"; test/application/fake-import-world.ts:1). No test
        under test/domain, test/application, test/db or test/schema opens a
        database connection.
      - >-
        Criterion 18.3 (:10192) assigns to "an application test" the
        row-class assertion (a null-flow row on a SPENDING account counted
        and listed and holding the verdict open, a null-flow row on a
        SAVINGS account in neither) and to "the test" a sweep that "calls
        EVERY method src/modules/overview/application/ports.ts publishes".
        Over a fake port both assert the fake. The ring scoping under test
        lives in SQL at overview-repository.ts:256, :306 and :321.
      - >-
        The construction that satisfies 18.3 as written and is still wrong:
        scope the FAKE's count and listing by ring, scope the real SQL COUNT
        at :256, leave the listing WHERE at :321 unscoped. The grep arms
        pass (both reads still carry their occurrences), the application
        tests pass (they see the fake), and every e2e arm passes, because
        the cause block is gated on the scoped count (month-view.tsx:366),
        so the unscoped listing's savings rows are returned by the
        repository and rendered nowhere. That is verbatim the defect D-56
        calls worse than scoping neither, and no assertion in the phase can
        see it.
      - >-
        Criterion 18.4 (:10239) arm ONE assigns to "a unit test" the
        assertion that "the migration's own expression and
        canonicalAccountNumber produce identical results over every
        rendering the seed harness writes". Executing the migration's SQL
        expression requires Postgres; a fast-gate unit test can only satisfy
        this by reimplementing the SQL in TypeScript, and a reimplementation
        agreeing with the platform function says nothing about the committed
        migration.sql, which is the exact lesson the criterion itself cites
        from overview-repository.ts:160 through :176.
      - >-
        Criterion 18.4 arm FOUR ("asserted by an application-level test over
        both populations") and criterion 18.5's migration half (:10288, "an
        application-level test asserts the backfill of criterion 18.4
        COMPLETES, leaves both rows of the pair byte identical") both test
        Postgres behaviour: idempotency of SQL statements and the firing or
        non-firing of the unique index at accounts.prisma:28. A fake carries
        no index; an in-process test cannot run the statements.
      - >-
        The tree already holds the precedent for the right level:
        test/e2e/merchant-rule-write.spec.ts:2 and :75 through :87
        constructs a PrismaClient inside a Playwright spec and asserts
        database state directly, under the slow gate against the local
        Docker stack. The seed harness is itself placed at
        test/e2e/seed-pre-phase-household.ts (:9979) and "writes Account
        rows directly", which only a database-connected test can use, while
        step 2 says "every test and capture in this phase" constructs
        through it.
    analysis: >-
      One property, five instances: the phase's database-behaviour
      assertions are assigned to gate levels that run on fakes or in
      process, so each can be greened without the SQL it exists to measure
      ever executing. The most dangerous instance is the unscoped gap
      listing, because it is invisible from the page by the plan's own
      argument. This is fixable in one round because it is a re-levelling,
      not a redesign: every assertion is right, only the word naming where
      it runs is wrong.
    concrete-edit: >-
      Re-level the database-behaviour assertions to the slow gate and name
      the mechanism, citing the precedent: in criterion 18.3, replace "an
      application test" and the port-sweep's implicit level with "a spec
      under test/e2e that constructs a PrismaClient directly (the
      test/e2e/merchant-rule-write.spec.ts:75 pattern), seeds through the
      harness, and calls the REAL repository methods", and add one
      assertion that listGapRows itself returns no savings-account row over
      the seeded household, stated as the only witness that can see an
      unscoped listing because the cause block is gated on the count. In
      criterion 18.4, replace arm ONE's "unit test" with "a slow-gate test
      that executes the committed migration.sql's expression via the direct
      client against the local stack and compares its result to
      canonicalAccountNumber over every harness rendering", and arm FOUR's
      "application-level test" likewise. In criterion 18.5, replace the
      migration half's "application-level test" the same way. In step 2,
      replace "every test and capture in this phase" with "every
      database-connected test and capture in this phase", and state that
      fast-gate tests over fakes do not construct households through the
      harness. Leave at the fast gate what is genuinely in-process: the
      grep arms, the typed-half duplicate check over the accounts fakes,
      and the domain folds.
  - id: R1-M3P18-03
    severity: high
    evidence:
      - >-
        Step 5 (:10039) requires the migration to detect a colliding pair,
        leave it, and "name the pair in its output by row id and nothing
        else"; criterion 18.5 repeats "names the pair in its output by row
        id". No sentence in the phase names what "its output" is or who
        reads it.
      - >-
        The migration's application path to the deployed database is npx
        prisma migrate deploy (recorded across work histories, for example
        delivery/work-history/m3-p3.yaml and m3-p12.yaml; the build script
        runs prisma generate only). The migrations note forbids the one
        durable channel: "no new column, no new table, no enum change".
      - >-
        The tree contains no client that can capture a Postgres NOTICE or
        WARNING: package.json's dependencies carry @prisma/client and no pg
        driver, and the Prisma raw API returns rows only. So the
        criterion's test, which "executes the migration's statements over" a
        seeded household, cannot assert on the naming either, and "names
        the pair in its output" is satisfiable only by a hand-read of the
        migration source, which asserts nothing.
      - >-
        The state the naming exists for is the one the phase says it cannot
        rule out: whether the deployed rows carry such a pair "cannot be
        read from this tree (report-code-disagreement, verified false)"
        (step 1, :9956 region). After the migration, the pair household's
        statement is still refused account-not-registered (stored rows left
        non-canonical, probe canonical at account-repository.ts:114), and
        the setup retype is refused by 18.5's canonical duplicate check.
        Both refusals are correct and named, but the operator signal that a
        manual merge is owed exists only in "output" nothing captures.
    analysis: >-
      The plan's own ground for leaving the pair untouched is "refusing to
      guess is what it carries", and refusing to guess only works if the
      refusal is heard. As specified, the naming lands in a channel that
      does not exist: migrate deploy surfaces nothing the plan points at, a
      table is forbidden, and no driver in the tree can catch a notice. An
      implementer can satisfy the criterion with a notice nobody will ever
      see, every test green, and the one deployed household the phase
      exists for stays locked out silently if it holds a pair. The fix is
      not to carry the merge, which DR-0031's small-migration cut excludes;
      it is to make the detection re-runnable after the fact, which the
      pair's left-as-is property already guarantees is possible.
    concrete-edit: >-
      Replace "names the pair in its output by row id and nothing else" in
      step 5 and criterion 18.5 with: "leaves the pair DETECTABLE: a
      committed read-only script under scripts/ (the
      rederive-merchant-rules.ts precedent), runnable against any target
      the db guard admits, lists every household's rows whose stored number
      is not its canonical form, paired by shared canonical form, by row id
      and nothing else, and the slow-gate test over the seeded pair
      household asserts the script's output names exactly the pair's two
      row ids and no account number. The migration itself stays silent; the
      phase work history records that the post-deploy check for the parked
      merge is one run of this script." Add the script to files-to-touch.
