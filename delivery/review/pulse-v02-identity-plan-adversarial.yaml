# Adversarial review of the M0-P5 amendment to delivery/plan/pulse-v02.yaml.
#
# ROUND 1 reviewed 63b6e6f against the tree at a4f1a94 and returned fifteen
# findings, AF-01 through AF-15, one critical. That document is commit
# 1d6ea10 on this branch and is the record of what was found; it is not
# restated here, because every one of its findings has been applied and
# closed and a closed finding left in an open list reads as open.
#
# ROUND 2, THIS DOCUMENT, reviews 2e709da against the same tree. It carries
# the verification of round one's closure in the verdict and six new
# findings, DF-01 through DF-06, all specific and none structural.
#
# Every count below was produced IN MEMORY over the real documents in the
# container, read-only over the deployed database, or by a randomised
# in-memory experiment over invented values. COUNTS ONLY: no descriptor,
# counterparty, place, amount, date, account or card number appears here.
kind: finding
verdict: >-
  ACCEPT, with six corrections that are applied in the same edit and need no
  further review pass. The design is now sound and the structural attack
  surface I opened in round one is closed.

  ROUND ONE IS CLOSED, VERIFIED RATHER THAN TAKEN ON REPORT. All fifteen
  findings are applied, none declined. I re-checked the load-bearing ones
  against the tree: the diff is additions only against a4f1a94 (1664
  insertions, 0 deletions, plan file alone, and 63b6e6f is an ancestor of
  2e709da); criterion 12.2 now states EXACTLY 20 identity keys, account 6,
  descriptor 14, KBC 16, and I re-measured all four independently through the
  shipped pipeline and they are the right figures; the namespaces are pinned
  lowercase against the uppercasing at
  src/modules/merchants/domain/normalise-counterparty.ts:457, which is
  verbatim `const uppercased = collapseWhitespace(rawText.toUpperCase());`, so
  collision-freedom is structural; the AF-03 oracle is genuinely independent,
  because test/fixtures/generate-pdf-fixtures.ts imports exactly three modules
  and all three are node builtins (node:fs, node:path, node:url), so it shares
  no code with counterpartyIdentity or with the normaliser, and it contains no
  Math.random, Date.now or PDF date field, so the byte-for-byte regeneration
  check is achievable; the three corrected citations resolve
  (merchant-review.ts:88 through :91 is the label assignment,
  normalise-counterparty.ts:452 is the trailing-city strip, and the stability
  block does begin at :72); and the verified flags are now applied on one
  principle, the three still true being pure code readings and every
  measurement-derived entry false.

  THE COUNTRY-LENGTH TABLE IS RIGHT AND ITS ARGUMENT IS RIGHT. The
  1-in-97 claim is sound for a truncated prefix specifically, which was worth
  testing rather than assuming, because truncation could in principle
  correlate with the check. It does not: over 200000 randomly generated valid
  values per length, truncated to sixteen characters, the mod-97 pass rate is
  1 in 96, 1 in 98 and 1 in 97 for source lengths 22, 27 and 20. Uniform, no
  bias, so mod-97 alone would leave exactly the residual the plan-writer
  claims. The table closes it DETERMINISTICALLY and the reason is stronger
  than the plan states: truncation can only ever produce a sixteen-character
  value, so it only reaches accounts whose true length exceeds sixteen, and
  such a value always carries a country code whose table length is not
  sixteen. Refusing an unknown country code is also right, and cheaper than
  the plan argues on the path the owner uses, because the scrape at
  src/modules/import/domain/belfius-current-account-template.ts:88 can only
  emit sixteen characters, so on that path the table's only reachable entries
  are countries of length sixteen. It is NOT cheap on the delimited path, and
  that is finding DF-03.

  THE TWO-PASS MIGRATION IS RIGHT AND IT DISSOLVES THE TENSION RATHER THAN
  MOVING IT. Pass one is genuinely meaning-preserving for all three kinds. I
  worked each against the shipped matcher: EXACT because equality survives a
  common prefix; PREFIX because (N+K).startsWith(N+P) holds exactly when
  K.startsWith(P) for a constant N; PATTERN because the glob at
  src/modules/merchants/domain/merchant-rule.ts:44 through :53 anchors ^ and
  $, escapes everything but *, and the namespace contains no * and no
  character in that escape set, so a namespaced glob against a namespaced key
  compiles to the same decision. No PREFIX or PATTERN rule can reach an
  ACCOUNT key after pass one, because every pattern then begins with one
  namespace and every account key with the other. And criterion 12.8 no
  longer contradicts 12.7: it requires the SAME exit code and the same report
  rather than a quiet one, and it names and forbids the two-database cheat I
  found in round one. That is a better fix than the one I proposed. Its one
  defect is DF-02, and pass one has one gap, DF-01.

  WHAT REMAINS. DF-01 and DF-02 are gaps in the new migration design, DF-03
  is an unpinned data table, DF-06 is a reversal guarantee that does not hold
  in an ephemeral container and for which a strictly better and already
  available mechanism exists, and DF-04 and DF-05 are two fixture rows that
  cannot exist and that test nothing. All six are one-paragraph edits and
  none changes a decision.
produced-by: claude-opus-5 (Anthropic)
findings:
  - id: DF-01
    severity: medium
    evidence:
      - >-
        Decision D-45 and M3-P12's migration step describe pass one as
        unconditional: "PASS ONE, MECHANICAL AND TOTAL: every rule's pattern
        becomes the descriptor namespace followed by its old pattern. That
        consults no transaction, has no failure branch". Applied to a pattern
        that ALREADY carries a namespace it produces a doubly namespaced
        pattern, which matches nothing.
      - >-
        THIS IS REACHABLE ON THE FIRST RUN, not only on a second one, and
        D-46 is what makes it reachable. D-46 states the routine runs AFTER
        the code deploy and names the window: "for its duration the stored
        patterns are pre-migration while the matcher computes namespaced
        keys". A naming made by the owner during that window goes through
        assignMerchant, which by criterion 12.18 now writes a namespaced
        subject. That rule is correct and already migrated. Pass one then
        namespaces it a second time and it is dead, and no criterion sees it:
        criterion 12.8 catches double namespacing only between run one and
        run two, and this is a first-run condition.
      - >-
        Nothing else guards it. The only empty-or-shape guard on a rule
        subject in the tree is in assignMerchant; upsertRule itself has none
        (src/modules/merchants/adapters/merchant-repository.ts:72 through
        :101 verifies only that the merchant belongs to the household).
      - >-
        A related instance of the same missing guard: a rule whose stored
        pattern is the EMPTY string is currently inert, because matchRules
        filters it out at src/modules/merchants/domain/merchant-rule.ts:65
        (`rules.filter((rule) => rule.pattern !== "")`). After pass one its
        pattern is the bare namespace, which is non-empty, so as a PREFIX
        rule it would match EVERY descriptor-basis key. Not reachable through
        assignMerchant, which guards at :55, and not present on the deployed
        database; reachable through upsertRule, which does not.
    concrete-edit: >-
      Replace D-45's pass-one sentence and the same sentence in M3-P12's
      migration step with: "PASS ONE, MECHANICAL AND TOTAL OVER THE RULES IT
      APPLIES TO: every rule whose pattern does NOT already begin with a known
      namespace has its pattern rewritten to the descriptor namespace followed
      by its old pattern, and a rule already carrying a namespace, which is
      what a naming made in D-46's window looks like, is left exactly as it is
      and counted as already-migrated. A rule whose pattern is the empty
      string is left as it is and reported, because the bare namespace is
      non-empty and a PREFIX rule carrying it would match every
      descriptor-basis key, where the empty pattern it replaced was inert
      under src/modules/merchants/domain/merchant-rule.ts:65. Pass one still
      consults no transaction and still has no failure branch." Add to
      criterion 12.21: "and the property test's generator includes the empty
      pattern and an already-namespaced pattern among the cases it produces,
      so both are red rather than unreached."
  - id: DF-02
    severity: medium
    evidence:
      - >-
        Criterion 12.8 requires that a second run "prints the SAME report as
        the first run, byte for byte". Criterion 12.7 fixes what is in that
        report: "one line per rule it touched carrying the rule id, the pass,
        the new basis, the number of transactions the old pattern matched and
        the number the new pattern matches".
      - >-
        The matched counts cannot be equal between the two runs for the case
        the plan most wants covered. Take a rule whose pre-migration pattern
        matched 3 rows, of which 2 acquire a trusted account and 1 does not.
        Pass two refuses promotion, correctly, because the accounts are not
        unanimous. Run one reports old-matched 3 against the BASELINE key and
        new-matched 1, since only the descriptor-basis row still resolves
        through the descriptor pattern. Run two's "old pattern" IS the
        namespaced descriptor pattern, so it reports old-matched 1 and
        new-matched 1. Same decision, same exit code, different bytes.
      - >-
        So a correct implementation fails 12.8, and the implementer's cheap
        way out is to seed 12.8's database with only rules whose rows do not
        split across bases, which is the dataset-choosing that criterion was
        rewritten to forbid. The failure is specific to the counts: the
        decision half of the report, rule id, pass and resulting basis, IS
        stable across runs.
      - >-
        It does not bite the owner's deployed database today, measured: the
        single MerchantRule row matches one transaction, that transaction
        carries an account, and the account appears on exactly one row, so old
        and new matched counts are both 1 in both runs.
    concrete-edit: >-
      Replace criterion 12.8's comparison clause with: "prints the same
      DECISION REPORT as the first run, byte for byte, that report being the
      rule id, the pass that touched it, the resulting basis and the outcome
      for every rule, and returns the SAME exit code. The matched-count
      columns criterion 12.7 requires are excluded from that comparison and
      the criterion says why: on the second run a rule's old pattern is the
      pattern the first run wrote, so for any rule whose rows split across the
      two bases the counts legitimately differ while the decision does not.
      Comparing counts would make a correct run red and would push the
      implementer toward a seed with no split rule, which is the
      dataset-choosing this criterion exists to forbid. The full
      merchant_rules table is still compared in full."
  - id: DF-03
    severity: medium
    evidence:
      - >-
        Decision D-43 and step 2 require the account's "length is exactly the
        length the pinned country-length table assigns its country code, and a
        country code the table does not carry is REFUSED rather than
        admitted". Criterion 12.16 asserts the BEHAVIOUR of the table on four
        invented inputs. Nothing in the plan pins the table's CONTENTS: no
        criterion names the entries it must carry, no source is cited for
        them, and no regression pin makes an accidental edit red.
      - >-
        This codebase's own rule for exactly this situation is one tier down
        in the file the gate sits beside:
        src/modules/merchants/domain/normalise-counterparty.ts:127 through
        :132, "PIN the accepted shapes, never widen", with
        test/domain/normalise-counterparty.test.ts as the pin that makes an
        accidental change red. The trust table is the same kind of object and
        gets neither treatment.
      - >-
        COMPLETENESS MATTERS MORE THAN THE PLAN ARGUES, because the plan
        measured the cost only on the PDF path. The delimited path stores
        accounts of ANY length: src/modules/import/domain/detect-profile.ts:45
        is `const IBAN = /^[A-Z]{2}\d{2}[A-Z0-9]{8,30}$/`, so a CSV import can
        store a full foreign account of up to 34 characters, which reaches the
        same trust gate. A country code the table omits then sends every row
        of that counterparty to the descriptor basis, where it never
        converges: the exact defect this phase exists to remove, reintroduced
        silently for that counterparty, and D-43's "measured before deciding,
        so the gate is known to cost nothing" does not cover it because all 11
        measured accounts came from the PDF path.
      - >-
        The gate's own asymmetry argument still holds, so refusing remains the
        right default: the failure it produces is visible non-convergence, not
        a silent merge. What is missing is the pin and the honesty about which
        path pays.
    concrete-edit: >-
      Add criterion 12.22: "THE TRUST TABLE IS PINNED AND SOURCED. The
      country-length table is a committed constant in the merchants domain,
      each entry carrying the country code and the length, with the ISO 13616
      registry named as its source in a comment beside it; a regression test
      pins its full contents so an accidental edit is red, in the shape
      test/domain/normalise-counterparty.test.ts pins the strip patterns; and
      a test asserts the entry for the country of the committed fixtures
      resolves to the length those fixtures use, so a wrong entry fails the
      FAST gate rather than only the work-history measurement in criterion
      12.2." Add to D-43, after the sentence measuring the gate on the real
      month: "That measurement covers the PDF path only. The delimited path
      stores accounts of any length (src/modules/import/domain/detect-profile.ts:45
      admits twelve to thirty-four characters), so on that path a country the
      table omits costs a real convergence loss rather than nothing, and the
      table is therefore populated from the ISO 13616 registry rather than
      from the countries seen so far. Criterion 12.15's whole-corpus record is
      where such a loss would show, as a fixture whose new group count is
      HIGHER than its baseline count."
  - id: DF-04
    severity: low
    evidence:
      - >-
        M3-P12's fixture step requires the committed fixture to carry three
        rows that attack the account basis, the third being "one row whose
        stored account is empty or whitespace only", and the same step
        requires the fixture to be generated "through the committed generator
        ... so it arrives through the shipped importer rather than being
        handed to the domain directly".
      - >-
        The shipped Belfius importer cannot produce that row. counterpartyIban
        is set only inside a successful match of DESCRIPTION_IBAN
        (src/modules/import/domain/belfius-current-account-template.ts:266
        through :272), the value is passed through compactIban, which is
        `text.replace(/\s/g, "")` at :90, and the field is omitted entirely
        when no match is found (:281). There is no path through that template
        to a stored account that is empty or whitespace.
      - >-
        The only path that can is the delimited one, and only for whitespace:
        src/modules/import/domain/parse-statement.ts:120 guards `if (value !==
        "")` on the raw cell, so a cell of one space is stored and an empty
        cell is not.
      - >-
        Criterion 12.16 already covers the case correctly, as a unit test over
        invented inputs, and criterion 12.6 covers it again. Only the fixture
        step asks for something unbuildable, so an implementer either fakes it
        by handing the domain a row directly, which the same step forbids, or
        drops it silently.
    concrete-edit: >-
      Replace the third attack row in M3-P12's fixture step with: "and, NOT in
      the PDF fixture because the shipped Belfius template cannot produce it,
      the empty-or-whitespace account case is covered where criterion 12.16
      already puts it, as a unit test over invented inputs on the pure
      identity function. The template sets the account only inside a
      successful pattern match and passes it through compactIban
      (src/modules/import/domain/belfius-current-account-template.ts:90, :266
      through :272, :281), so no PDF row can carry an empty or whitespace
      account; the delimited path can, for whitespace only, because
      src/modules/import/domain/parse-statement.ts:120 guards the empty cell
      and not the blank one, and a committed CSV fixture carries that row
      instead."
  - id: DF-05
    severity: low
    evidence:
      - >-
        The second attack row in M3-P12's fixture step is "one row whose
        description carries two distinct account-shaped tokens". No criterion
        asserts anything about that row: criterion 12.16 lists four cases and
        this is not among them, and criterion 12.4 compares the partition
        against the generator's record.
      - >-
        Because the generator authors both the description and the record, the
        row is satisfied by writing the intended counterparty's token first,
        which is what the template picks
        (src/modules/import/domain/belfius-current-account-template.ts:266
        through :272 take the first non-own match and stop). The row then
        passes without testing anything, and the behaviour it was put there to
        expose stays unpinned.
      - >-
        The behaviour is measured and real: 4 of the owner's 39 rows carry
        more than one distinct account-shaped token, which is why the plan
        parks the question. Parking the DECISION is right. Leaving the
        BEHAVIOUR unasserted means the day someone changes :266 through :272
        from first-wins to last-wins or longest-wins, nothing goes red and 4
        of 39 real rows silently change counterparty.
    concrete-edit: >-
      Add to criterion 12.16, as a fifth case: "and the fixture row whose
      description carries two distinct account-shaped tokens is asserted end
      to end: the test states which token the generator wrote FIRST and
      asserts the stored account, and therefore the identity key, is that one,
      so the first-wins rule at
      src/modules/import/domain/belfius-current-account-template.ts:266
      through :272 is PINNED rather than incidental. The assertion names the
      parked item that owns the question, so a later change to that rule is
      red here before it reaches 4 of the owner's 39 rows."
  - id: DF-06
    severity: medium
    evidence:
      - >-
        D-45 rests reversibility on one mechanism: the routine "writes the
        pre-migration patterns to a timestamped uncommitted file, so any run
        is reversible". That file is written in whatever container the routine
        runs in. The routine runs against the DEPLOYED database and, per D-46,
        after a deploy; the containers this project runs work from are
        ephemeral, and the file cannot be committed because it is data in a
        public repository. So the guarantee is a file that by construction
        cannot be kept anywhere durable and cannot be kept in the one place
        the project keeps things. It is better than nothing and it is not a
        reversal guarantee.
      - >-
        A strictly better mechanism already exists in the schema and is
        already used. MerchantRule's unique key is (householdId, kind,
        pattern) (prisma/schema/merchants.prisma:70), so one merchant can
        carry several rules, and assignMerchant already relies on exactly that
        by finding-or-creating the merchant and then upserting a rule against
        it (src/modules/merchants/application/assign-merchant.ts:58 through
        :65). Pass two can therefore ADD an account-basis rule pointing at the
        same merchant instead of REWRITING the descriptor one.
      - >-
        Under that design nothing is destroyed at any point: pass one's
        rewrite is mechanically invertible by stripping a constant prefix, and
        pass two becomes purely additive, so reversal is deleting the rules
        the run added and stripping the namespace, with no external file
        needed. The two rules can never both fire on one key, because one
        begins with the account namespace and the other with the descriptor
        namespace, so matchRules' tie-break at
        src/modules/merchants/domain/merchant-rule.ts:34 through :42 is never
        even reached between them.
      - >-
        It also removes the objection that made AF-07 a finding in the first
        place, which the plan accepted rather than answered: pulse-domain
        section 2 classifies MerchantRule as a declaration the user writes and
        marks it not rebuildable, and an engine OVERWRITING one is in tension
        with that. An engine ADDING a rule beside it, on the owner's own
        decision recorded in DR-0027, leaves what the owner declared exactly
        where they left it.
    concrete-edit: >-
      Replace D-45's promotion sentence with: "Pass two ADDS an account-basis
      rule pointing at the SAME merchant when every transaction the old
      pattern matched carries a TRUSTED account and they all carry the same
      one. It does not rewrite the descriptor rule pass one produced, and
      nothing in the migration destroys a declaration at any point: pass one's
      rewrite is invertible by stripping a constant prefix and pass two is
      purely additive, so a run is undone by deleting the rules it added.
      MerchantRule's unique key is (householdId, kind, pattern)
      (prisma/schema/merchants.prisma:70) and assignMerchant already attaches
      several rules to one merchant
      (src/modules/merchants/application/assign-merchant.ts:58 through :65),
      so this needs no schema change; and the two rules can never both fire on
      one key, because their namespaces differ." Replace the timestamped-file
      sentence with: "The routine still prints per rule the old and new
      matched counts so a broadening is a number the owner can read, and it no
      longer depends on an uncommitted file for reversibility, which an
      ephemeral container cannot keep and a public repository cannot hold."
      Add to criterion 12.7: "and a test asserts the re-derivation issues no
      UPDATE and no DELETE against any pattern written under the account
      namespace, so promotion is additive and the declaration the owner made
      survives the run verbatim."
