  - id: AF-07
    severity: high
    evidence:
      - >-
        pulse-domain section 2 classifies MerchantRule as a DECLARATION,
        "written by the user, explicitly", Rebuildable "No". D-39 has an
        engine routine OVERWRITE the content of that row: "rewrites the
        pattern to the identity those transactions now produce".
      - >-
        The rewrite can BROADEN what the user declared. The owner named one
        transaction; where that transaction carries an account, the rewritten
        rule means "everything ever seen from this account". DR-0027
        authorises that key going FORWARD; nothing in it or in D-39
        authorises reinterpreting a declaration the owner already made, and
        no criterion asks the owner or tells them it happened.
      - >-
        Nothing preserves the pre-migration pattern. D-39's defence is that
        "It DELETES NOTHING", which is true of ROWS and not of CONTENT: after
        the run there is no record anywhere of what the owner actually
        declared, so a wrong re-derivation is not reversible. Criterion 12.7
        prints only the rules it could NOT re-derive.
      - >-
        Measured, so the severity is calibrated rather than asserted: on the
        deployed database the owner's single named row's counterparty account
        appears on exactly ONE row, so today's rewrite broadens the naming by
        nothing. The defect is structural and lands on the next naming, not
        on this one.
    concrete-edit: >-
      Add to criterion 12.7: "and the routine prints, for every rule it
      rewrites, the rule id, the BASIS the new pattern has, the number of
      transactions the old pattern matched and the number the new pattern
      matches, so a naming that BROADENS is visible as a number rather than
      inferred; the phase work history records that table for the real run
      with no pattern content in it. A rewrite that increases the matched
      count by more than zero is listed separately under the heading the
      owner reads." Add a step to M3-P12: "Write the pre-migration pattern of
      every rewritten rule to a timestamped file the routine emits beside
      itself, uncommitted and named in the work history, so the run is
      reversible; the file is data and never enters the repository."
