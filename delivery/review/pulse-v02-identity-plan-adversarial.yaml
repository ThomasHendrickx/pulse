# Adversarial review of the M0-P5 amendment to delivery/plan/pulse-v02.yaml.
# Plan head 63b6e6f, tree baseline a4f1a94 (the amendment touches only the
# plan file, so every code reading below is a reading of a4f1a94).
#
# Every count in this document was produced IN MEMORY over the real
# documents in the container or read-only over the deployed database.
# COUNTS ONLY: no descriptor, counterparty, place, amount, date, account or
# card number appears anywhere in this file.
kind: finding
verdict: >-
  REJECT AS WRITTEN, on four findings that a conforming implementation would
  pass through. The amendment is unusually well measured: I reproduced every
  segment number it claims, independently, through the shipped pipeline, and
  all 45 of its path:line citations resolve to lines that support the claim
  attached to them. Its three corrections to the dispatch all hold. What it
  gets wrong is the part it is most confident about. Its central claim, that
  the over-collapse hazard is "structurally absent from this phase rather
  than merely watched" because the descriptor key is unchanged, is FALSE:
  the hazard does not live in the stripping, it lives in the new account
  basis, which is a regex scrape out of the same free text the phase exists
  to escape, is validated by nothing, is chosen positionally when a
  description offers more than one candidate (measured: 4 of the owner's 39
  rows), and truncates a longer account form to a shared prefix
  (demonstrated). Criterion 12.4, the criterion that is supposed to be the
  guard, cannot see any of it, because after the scrape the two rows carry
  the SAME stored value and 12.4 only separates DIFFERENT ones. Beside that:
  criterion 12.5 as written contradicts the derivation the phase's own step
  specifies; criterion 12.4's expected mapping is authored from the
  implementation's own output and is therefore self-certifying; and
  criteria 12.7 and 12.8 cannot both be satisfied against any database
  holding one rule the routine cannot re-derive. Fix findings AF-01 through
  AF-07 and the plan is dispatchable; the rest are cheap.
produced-by: claude-opus-5 (Anthropic)
findings:
  - id: AF-01
    severity: critical
    evidence:
      - >-
        THE CLAIM UNDER ATTACK. M3-P12 step 3: "Add NO new stripping and NO
        new descriptor family ... so the hazard of collapsing two genuinely
        different counterparties by over-stripping is structurally absent
        from this phase rather than merely watched, and criterion 12.5 pins
        it." The word "over-stripping" is doing all the work: the hazard is
        real and it enters through the branch the phase ADDS, not the branch
        it leaves alone.
      - >-
        THE ACCOUNT IS NOT A STRUCTURED FIELD ON THE PDF PATH. The phase's
        verified-root-cause calls it "the structured counterparty account the
        importer already stores". It is a regex scrape out of the free-text
        description: src/modules/import/domain/belfius-current-account-template.ts:88
        declares DESCRIPTION_IBAN as a global regex, and :266 through :272
        take the FIRST match in the joined description lines that is not one
        of the file's own accounts. The plan's own report-code-disagreement
        entry says as much ("scrapes an account out of the description") and
        then the phase reasons about the result as though it were structured.
      - >-
        POSITIONAL SELECTION IS REACHABLE ON THE OWNER'S OWN MONTH. Measured
        in memory through the shipped pipeline over the real Belfius
        document, counting only: 4 of the 39 rows carry MORE THAN ONE
        distinct account-shaped token inside a single description. For those
        rows the identity is decided by which token the bank printed first,
        which is a property of the free-text communication. Command:
        npx tsx <scratchpad>/adv/measure2.ts <belfius doc>, printing
        "rows whose description contains >1 distinct account-shaped token: 4".
      - >-
        TRUNCATION TO A SHARED PREFIX, DEMONSTRATED. DESCRIPTION_IBAN is
        anchored \b, opens with two letters and two digits and then takes
        EXACTLY three groups of four digits. Against a longer account form
        written spaced, the trailing \b succeeds at the group boundary, so
        the pattern matches a 16-character PREFIX of it. Executed with two
        wholly invented longer-form strings differing only after their
        twelfth digit: both scrape to one identical 16-character value
        (printed "scraped keys equal: true length: 16"). Under D-37 both rows
        then carry the same account-basis identity key and merge into one
        counterparty group. The own-account exclusion at :268 does not help,
        because a truncated value never equals a registered own account.
      - >-
        NOTHING VALIDATES THE SCRAPED VALUE. grep -rni "mod97|mod 97|
        checkDigit|iban.*valid" over src/ returns nothing at a4f1a94: no
        checksum, no length class, no country rule. Today that is harmless,
        because the value is only tested for SET MEMBERSHIP against declared
        own accounts (src/modules/ledger/domain/classify-flow.ts:63 and :74)
        and for EQUALITY against the other leg's account
        (src/modules/ledger/domain/pair-transfers.ts:76), and a wrong value
        simply fails both. This phase promotes the same unvalidated value to
        the thing that decides which transactions are one merchant, where a
        wrong value MERGES instead of failing.
      - >-
        CRITERION 12.4 IS BLIND TO ALL THREE. It asserts "that no two rows
        carrying DIFFERENT counterparty accounts share an identity key". In
        every mechanism above the two rows end up carrying the SAME stored
        counterpartyIban, so the antecedent is false and the assertion passes
        vacuously. Its other two clauses (account key never equals a
        descriptor key; the 12 keys partition the 24 rows) are equally blind,
        and the fixture is invented and will not contain a mis-scrape.
      - >-
        THE PARKED ITEM STATES THE MECHANISM BACKWARDS. Parked entry 2:
        DESCRIPTION_IBAN "matches a two-letter country code plus two check
        digits plus exactly three groups of four and therefore cannot see a
        foreign counterparty account inside a description." The first half is
        right and the "therefore" is wrong: it cannot see a foreign account
        WHOLE, and it CAN see a truncated prefix of one, which is the
        dangerous case rather than the safe one. The item's measurement is
        sound and I reproduced it (0 of the 28 no-account rows carry any
        token of IBAN shape even under a permissive pattern), so the claim is
        true of today's document and false of the mechanism.
    concrete-edit: >-
      Four edits, and the split between them matters because only two of the
      three mechanisms can be answered inside this phase. (1) Add to M3-P12
      step 2, after "the key is \"account:\" followed by that account
      uppercased with whitespace removed": "and the account basis is taken
      ONLY when that value is non-empty and passes the IBAN mod-97 check,
      which is a pure predicate in the merchants domain beside the
      normaliser; a row whose stored account fails either test takes the
      DESCRIPTOR basis and reports basis descriptor. mod-97 is what closes
      the truncation case, because a 16-character prefix of a longer account
      form passes the check only by coincidence." (2) Add criterion 12.16:
      "THE ACCOUNT BASIS FAILS CLOSED. A unit test over wholly invented
      inputs asserts that an account which is empty or whitespace after
      uppercasing and whitespace removal, and an account that fails the
      mod-97 check, each yield a DESCRIPTOR-basis key and never an
      account-basis one; and that two rows whose stored accounts are
      different valid accounts never share an identity key. Every value used
      is invented and listed in test/fixtures/allowed-identifiers.txt." (3)
      The AMBIGUITY case cannot be answered here and must not be pretended
      away: deciding which of two account-shaped tokens in one description is
      the counterparty is an IMPORTER decision about a fact column, which is
      a template version bump and a re-parse rather than a recompute
      (src/modules/import/domain/parse-pdf-statement.ts:25 through :30, and
      the plan's own parked item 1 says exactly this about counterpartyName).
      Add it as a parked item in its own right: "Choosing between multiple
      account-shaped candidates in one Belfius description. Measured: 4 of
      the owner's 39 rows carry more than one distinct candidate, and
      src/modules/import/domain/belfius-current-account-template.ts:266
      through :272 takes the first non-own one, so for those rows the
      identity is decided by print order inside the free-text communication.
      Reason for parking: correcting it changes what the importer writes into
      a fact column, which is a template version bump and a re-parse, not a
      derivation change, and no evidence yet says the first candidate is ever
      the wrong one. Revisit with the phase that bumps the Belfius template."
      (4) Rewrite the existing parked item about DESCRIPTION_IBAN so its
      reason says that the pattern matches a 16-character PREFIX of a longer
      spaced account form rather than failing to match it, that the failure
      mode is therefore a silent merge and not a miss, and that the mod-97
      check in edit (1) is what stands between the two until the template is
      widened.
    analysis: >-
      This is the one finding that survives every criterion as written and is
      still wrong, and it is the hazard the plan names as its worst (H12.1,
      "silently merges the owner's money and is worse than today because
      today's failure is visible and this one is not"). The plan reasons
      about the hazard entirely on the descriptor side, where it has genuinely
      changed nothing, and never asks whether the value it is now trusting is
      trustworthy. Note the asymmetry the change introduces: today a bad
      scrape costs nothing because every consumer tests it for membership or
      equality against a known set and a bad value simply misses; after this
      phase a bad scrape is an identity, and identity failures merge.
  - id: AF-02
    severity: high
    evidence:
      - >-
        M3-P12 step 2 specifies the derivation: "Where it does not, the key
        is \"descriptor:\" followed by normaliseCounterparty(counterpartyText(row)),
        unchanged from the baseline. The namespace is what keeps an account
        key and a descriptor key from ever colliding".
      - >-
        Criterion 12.5 then asserts the opposite: "For every row of every
        committed fixture that carries no counterparty account, the
        descriptor-basis key produced by this branch is BYTE-IDENTICAL to the
        key the baseline commit produces for the same row". A key of the form
        "descriptor:" + X is not byte-identical to X. The two cannot both be
        met.
      - >-
        Criterion 12.6 carries the contradiction inside ONE sentence: "the
        identity key is \"descriptor:\" followed by exactly
        normaliseCounterparty(counterpartyText(row)), equal character for
        character to the baseline key".
      - >-
        THE ESCAPE THIS OPENS. An implementer resolving the contradiction in
        12.5's favour drops the namespace from descriptor keys. D-37's
        collision argument then rests on nothing, and criterion 12.4's clause
        "no account-basis key is equal to any descriptor-basis key" becomes a
        property of the data rather than of the derivation. It is not
        academic: the namespace is also what D-40's refusal reads to decide
        whether a key is account-basis, and what criterion 13.2 asserts the
        naming form submits.
      - >-
        The namespace's CASE is also unpinned anywhere in the plan.
        normaliseCounterparty uppercases its input at
        src/modules/merchants/domain/normalise-counterparty.ts:457
        (rawText.toUpperCase()), so a LOWERCASE namespace is collision-proof
        by construction and an uppercase one is not. Nothing says which.
    concrete-edit: >-
      Replace criterion 12.5's first clause with: "For every row of every
      committed fixture that carries no counterparty account, the identity
      key produced by this branch is exactly the lowercase literal
      \"descriptor:\" followed by a suffix BYTE-IDENTICAL to the key the
      baseline commit produces for the same row, asserted by a test that
      reads a committed table of baseline keys generated at the baseline
      commit and compares key.slice(\"descriptor:\".length) to it; and a test
      asserts normaliseCounterparty never emits a lowercase letter, so no
      descriptor key can ever begin with either namespace." Replace 12.6's
      clause "equal character for character to the baseline key" with "whose
      suffix after the namespace is equal character for character to the
      baseline key".
