  - id: AF-05
    severity: high
    evidence:
      - >-
        Criterion 12.7 ends: "Every rule that cannot be re-derived is left
        byte-identical and printed on its own line naming the rule id and one
        of three reasons (no-matching-transaction, multiple-identities,
        merchant-conflict), and the script exits non-zero when that list is
        non-empty."
      - >-
        Criterion 12.8 requires: "Running the script a second time against
        the same database rewrites zero patterns, prints zero reasons and
        exits 0". Since the routine "DELETES NOTHING, ever" (D-39) and leaves
        an unmigratable rule untouched, the second run reproduces the same
        reason line and the same non-zero exit. The two criteria are
        mutually unsatisfiable against any database holding one unmigratable
        rule, and are jointly satisfiable only by running the 12.7 test and
        the 12.8 test against two DIFFERENT seeded databases, which is what
        an implementer will do.
      - >-
        AN UNMIGRATABLE RULE IS NOT HYPOTHETICAL. D-40 keeps PREFIX and
        PATTERN live in the matcher
        (src/modules/merchants/domain/merchant-rule.ts:74 through :79 and :81
        through :88, verified). D-39's routine finds "the transactions whose
        BASELINE key equals the stored pattern", which is an EQUALITY test: a
        PREFIX pattern is by definition not equal to any row's key, so every
        PREFIX rule reports no-matching-transaction forever. The stability
        contract this phase is discharging names both kinds explicitly
        (src/modules/merchants/domain/normalise-counterparty.ts:65: "a
        one-off re-normalisation of stored MerchantRule patterns (EXACT and
        PREFIX ...)").
      - >-
        COUNT(*) EQUALITY PROVES NOTHING ABOUT LOSS. 12.7's opening test is
        "SELECT COUNT(*) FROM merchant_rules before and after are equal and
        both are printed." A rule left byte-identical survives as a row and,
        once the key has changed under it, matches nothing at all: the row
        count is preserved and the naming is dead. The criterion's
        "still resolves the same transactions afterwards" clause is scoped to
        REWRITTEN rules only and says nothing about left-alone ones, so a run
        in which every rule is left alone and every naming is dead satisfies
        12.7 as written.
      - >-
        THE FAILURE MODE IS WRONG FOR THIS OWNER. Read-only against the
        deployed project on this date: merchant_rules 1 row (EXACT 1, PREFIX
        0, PATTERN 0), merchants 1, transactions 39 of which 1 carries an
        assignment. A permanently non-zero exit on an unmigratable rule turns
        a recoverable declaration condition into a deploy that can never go
        green again, and the plan offers the owner no command to acknowledge
        one. It does not bite today: the owner's single rule is on a row that
        DOES carry an account, so the routine finds exactly one transaction
        and exactly one identity and exits 0.
      - >-
        The equality-based re-derivation is also needlessly fragile for the
        case that dominates. Since criterion 12.5 forbids any change to
        normaliseCounterparty, EVERY descriptor-basis rule's new pattern is
        mechanically the old pattern under the namespace, computable with no
        transaction lookup at all. Only account-basis promotion needs the
        facts.
    concrete-edit: >-
      Four edits to criterion 12.7 and D-39. (1) Replace the COUNT(*) clause
      with: "the ASSIGNMENT SET is preserved: against a seeded database whose
      MerchantRule rows were written under the baseline derivation, the set
      of (transactionId, merchantId) pairs produced by recompute AFTER the
      re-derivation is a superset of the set produced BEFORE it, printed as
      both sizes, and no transaction that carried a merchant id loses it.
      SELECT COUNT(*) equality is reported beside it and is not by itself
      sufficient." (2) Add to D-39 and to 12.7: "a rule whose stored pattern
      is a DESCRIPTOR-basis key is rewritten MECHANICALLY to that pattern
      under the descriptor namespace, with no transaction lookup and
      therefore no failure branch; only promotion to an ACCOUNT basis
      consults the facts." (3) Split the exit code: "the script exits
      non-zero ONLY on merchant-conflict, which is a genuine ambiguity a
      person must settle; no-matching-transaction and multiple-identities are
      printed, counted and exit 0, because a rule left in place is safe and a
      blocked deploy is not." (4) Rewrite 12.8 as: "Running the script a
      second time rewrites zero patterns and prints the SAME reason list as
      the first run, byte for byte, and returns the same exit code, asserted
      by a test that runs it twice against a database seeded to contain at
      least one unmigratable rule and compares both the full merchant_rules
      table and the full printed output between the two runs."
  - id: AF-06
