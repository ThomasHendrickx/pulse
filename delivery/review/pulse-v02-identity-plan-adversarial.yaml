  - id: AF-15
    severity: medium
    evidence:
      - >-
        Criterion 12.1 asserts "that the BASELINE derivation
        (normaliseCounterparty(counterpartyText(row))) over the same rows
        yields 21 or more distinct keys".
      - >-
        The implementer authors the fixture (step 6), so both sides of that
        comparison are chosen by the party the criterion is meant to
        constrain. A 24-row fixture whose descriptors differ per row yields
        24 baseline keys with no effort, so 21 is a floor no honest fixture
        can fall below and the criterion discriminates nothing. It is also
        loose in the direction that flatters the result: a fixture yielding
        exactly 21 has already partly converged at baseline and understates
        the defect it is supposed to reproduce.
      - >-
        The shape that IS falsifiable is the real month's, which I measured:
        the 11 account-carrying rows produce 11 distinct baseline keys, one
        per row, total non-convergence. That is the property a fixture must
        reproduce, and "21 or more" over all 24 rows does not require it.
