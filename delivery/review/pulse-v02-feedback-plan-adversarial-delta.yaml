# Delta re-review of the M0-P4 fix round: the amendment at 432d5f1 against the
# adversarial review at 53abf4b. Round 1 is the sibling file
# pulse-v02-feedback-plan-adversarial.yaml and is left byte-unchanged, because
# the plan cites it at that sha.
#
# Scope: git diff b045d7d..432d5f1 -- delivery/plan/pulse-v02.yaml, read
# against the tree at 89ed187. Nothing round 1 passed is re-reviewed.
#
# Additions-only, verified rather than assumed: git diff --stat 89ed187
# 432d5f1 -- delivery/plan/pulse-v02.yaml reports "1 file changed, 2720
# insertions(+)"; git diff 89ed187 432d5f1 -- delivery/plan/pulse-v02.yaml |
# grep -c '^-[^-]' returns 0; git diff --name-only 89ed187 432d5f1 prints one
# path. So no merged phase's criteria were reworded, no phase id was
# renumbered, and package.json and package-lock.json are untouched. The
# coordinator's figure of 2715 is 2720 by measurement; nothing turns on it.
#
# THE CORRECTION TO ROUND 1'S EVIDENCE IS ACCEPTED. ADV-M0P4-02 stated that
# the preview-again submit "is behind isPdfLayout ... so it does not render at
# all for the CSV fixture that journey imports". Read at 89ed187: the ternary
# at src/modules/import/ui/profile-confirmation.tsx:136 opens with
# "{isPdfLayout ? (" whose TRUE arm is two hidden inputs (:141 and :142) and
# whose ELSE arm, opening at :144, holds the profile-name field and the spec
# editor carrying the submit at :160. The control therefore renders for the
# DELIMITED path and not for a PDF, which is the opposite of what round 1
# said. The rest of that evidence line stands: the details element at :151
# carries no open attribute, so the control's bounding box is zero until the
# disclosure is toggled. The plan's D-35 records the correction and criterion
# 9.2(a) acts on it by requiring the CSV confirmation screen with the
# disclosure opened, which is cheaper than the PDF fixture round 1's wording
# would have driven someone to build. Round 1's conclusion survives its own
# wrong premise, which is luck rather than method, and it is recorded here as
# an error of the reviewer's.
#
# CRITERION 10.2: THE CHEAT IS DEAD, AND I TRIED FOUR WAYS. Recorded here
# because it is the question this delta exists to answer and it produced no
# finding, which is a stronger statement than silence.
#  (1) Can a surviving record come from something the phase did not build?
#      No route I can construct. The observer's target is the pressed
#      control's own form, and every record whose target is not the control
#      or inside it is discarded, which removes the whole document including
#      the next dev tools portal that round 1 raised; the survivors are then
#      narrowed again to an attribute record naming aria-busy, aria-disabled,
#      disabled or class ON the control, or a childList or characterData
#      record inside it. Nothing in the browser writes those: focus, :active
#      and :focus-visible are pseudo-classes and produce no mutation record,
#      and React does not reset a form until the action returns, which under
#      a 2000ms delay is outside the window. And half (e) tests exactly this
#      by running the same measurement with the leaf removed. NOT WITNESSED:
#      no browser was run for this delta, so (1) is reasoning from the
#      criterion's text and the framework's source, and half (e) is the thing
#      that settles it empirically when the phase runs.
#  (2) Can (c)'s appearance check be satisfied by an invisible change, an
#      0.01 opacity step or a transparent-to-transparent transition? Not in
#      composition, and this is the answer that took the longest. (c) borrows
#      criterion 9.3's property set and states no magnitude of its own, so
#      read alone it is satisfiable by opacity 1 to 0.999. It is not read
#      alone: criterion 10.7 pins styles/ and src/app/globals.css to an empty
#      diff for the whole phase, so M3-P10 cannot add a rule and can only
#      ENTER a state M3-P9 already shipped, and criterion 9.3 now puts a
#      magnitude on every one of those states. There is no invisible rule
#      left for the leaf to enter. The only latent way it opens is if M3-P9
#      ships an appearance rule 9.3 does not measure, and the five focus
#      rules that exist today touch outline, box-shadow, border-radius and
#      outline-offset only (src/app/globals.css:197, :289, :367 through :369,
#      :605, plus styles/tokens.css:206), none of which is in 9.3's set.
#  (3) Can the control run be gamed from the stylesheet, or by a replacement
#      button that is not the control? Not usefully. A stylesheet-only
#      "feedback" produces no mutation record at all, so it fails (b) and (c)
#      in the main run before it reaches (e); and every way of weakening the
#      replacement button makes (e) MORE likely to pass, which is the
#      direction a cheater does not need, since a cheater's problem is (c) in
#      the main run.
#  (4) Does (a)'s set assertion bind? For 10.2 the seven submit controls are
#      enumerable and the answer is yes. For 9.2 it does not, and that is
#      finding DELTA-M0P4-01.
#
kind: finding
verdict: >-
  Do not accept yet, and the gap is small. Every one of the thirteen findings
  is answered on the merits and eleven are answered cleanly; the critical one
  is genuinely closed, and I could not reconstruct the document.body cheat or
  any variant of it against the rewritten criterion 10.2. Two of the fixes
  introduce defects of their own that a third pass has to clear, and both are
  one-sentence corrections. Criterion 11.2(d) now forbids aria-busy anywhere
  on the predicted row while criterion 10.3 requires it on the naming submit,
  which sits inside that row, so the two criteria cannot both pass on the
  control the owner presses most. And criterion 9.2(a), the set assertion that
  answers the denominator finding, enumerates sixteen controls where the tree
  carries nineteen inside the screens the journey already reaches, so the
  criterion the fix turns on is falsified by the code it was written against.
  Four medium findings follow: the alpha branch of the new pressed magnitude
  is satisfiable by an invisible change, the unconfirmed description is
  present in the accessibility tree but nothing announces it, the import
  closure walk under-reports through the barrels this repository actually has,
  and 10.5(a) asserts on testids that two of its seven controls do not carry.
  Three low findings close the set. Nothing here reopens the three-phase
  split, the grounding, or the production-project decision, which is the right
  call and is argued correctly even though one of its stated premises is not
  true of this app's routes.
produced-by: Anthropic Claude (Opus 5)
findings:
  - id: DELTA-M0P4-01
    severity: high
    evidence:
      - >-
        Criterion 9.2(a): "The spec builds the set it measures and asserts
        that it equals, by testid or by selector and text where a control has
        no testid, the SIXTEEN controls this plan enumerates: the seven submit
        controls, the seven navigating controls, the spec editor's disclosure
        summary and the sign-up link on the sign-in screen. A control the spec
        does not reach FAILS this criterion rather than being skipped."
        FALSIFIED BY "a measured set that is not those sixteen".
      - >-
        A census of the elements the 9.2 selector matches, at 89ed187:
        `grep -rn "<Link|<a |<button|<summary|role=\"button\"" --include='*.tsx' src/`
        returns seventeen source sites, which render NINETEEN distinct controls
        because src/platform/ui/nav-link.tsx:47 renders three. Three of the
        nineteen the plan's sixteen does not name: src/modules/import/ui/import-result.tsx:36
        (a Link back to /import), src/modules/import/ui/import-result.tsx:66
        (a Link to import again) and src/app/(auth)/sign-up/page.tsx:37 (the
        sign-in link on the sign-up screen, the mirror of the sign-up link on
        the sign-in screen that the plan does count).
      - >-
        All three are inside the elements 9.2's selector scopes to. The two
        import-result links render under the (app) shell's main
        (src/app/(app)/layout.tsx:71); the sign-up screen's link is inside
        `<main className="auth-screen">` at src/app/(auth)/sign-up/page.tsx:15.
      - >-
        Two of the three are on screens the journey already reaches, and the
        third is a FIFTH conditional control the plan's list of four does not
        include. The committed journey signs UP
        (test/e2e/merchants.spec.ts:26 through :30), so
        src/app/(auth)/sign-up/page.tsx:37 renders; and it asserts the import
        result screen (test/e2e/merchants.spec.ts:44 and :45, the
        import-result and rows-added testids), which is the success branch at
        src/modules/import/ui/import-result.tsx:41 through :67 carrying the
        link at :66. The link at :36 is inside the FAILED branch
        (import-result.tsx:30 through :39, the import-failed screen), so it
        needs a failing import to reach, exactly like the four conditional
        controls criterion 9.2(a) already routes to.
      - >-
        The plan's own new hazard H11.11, added in this same round, states the
        consequence: "A criterion that cannot pass as written is not reported
        as red; it is quietly reinterpreted by whoever implements it, and the
        guard it was written to be stops existing without anyone deciding to
        remove it."
    analysis: >-
      Two readings and both are bad. If the spec builds its set by running the
      selector over every screen it reaches, the set is nineteen and 9.2(a) is
      falsified on the first run, with the cheapest repair being to stop the
      spec visiting the import result screen and the sign-up screen, which
      restores exactly the denominator hole ADV-M0P4-02 was written to close.
      If instead the spec builds its set by looking up sixteen known
      selectors, the assertion compares the list to itself and is vacuous,
      which is the same hole through the other door. The criterion does not say
      which, and "builds the set it measures" reads naturally as the second.
      This is the one place where the fix to the denominator finding is weaker
      than the finding, and it is weak in a way the tree decides rather than a
      way a reviewer has to argue about.
    concrete-edit: >-
      Change the count to NINETEEN and name the three additions in 9.2(a)'s
      enumeration: "the seven submit controls, the seven navigating controls,
      the spec editor's disclosure summary, the sign-up link on the sign-in
      screen, the sign-in link on the sign-up screen
      (src/app/(auth)/sign-up/page.tsx:37), the import-again link
      (src/modules/import/ui/import-result.tsx:66) and the back-to-import link
      on the failed-import screen (src/modules/import/ui/import-result.tsx:36),
      which is a FIFTH conditional control and needs its own route: an import
      the parser rejects, for which test/fixtures/unknown-layout.pdf already
      exists." Then state how
      the set is built, which the criterion currently leaves open: "The set is
      built by running the selector on every screen the spec reaches and
      collecting what it finds; the assertion is that the COLLECTED set equals
      the enumeration, so a control the spec fails to reach and a control the
      enumeration fails to name both fail this criterion. If the
      verification-first sweep in step (d) finds a control this plan does not
      name, the enumeration is amended to include it and the spec is not
      narrowed to avoid it."
  - id: DELTA-M0P4-02
    severity: high
    evidence:
      - >-
        Criterion 11.2(d), added in this round: "no element of that row
        carries aria-busy=\"true\", so nothing holds back the announcement of
        the predicted value", with FALSIFIED BY "aria-busy anywhere on the
        predicted row".
      - >-
        Criterion 10.3, unchanged in this round: "for each of the seven submit
        controls ... at 1000 milliseconds after the click and before the
        response is released, the pressed control carries aria-busy=\"true\"".
        The merchant naming submit is one of the seven.
      - >-
        The naming submit is INSIDE the row. src/modules/merchants/ui/merchant-review.tsx:26
        opens the `<li>`, :45 opens the form, :60 is the submit button, and
        the li closes after it. There is one row element and the button is a
        descendant of it.
      - >-
        Both criteria are evaluated at the same instant on the same control:
        10.3 at 1000 milliseconds after the click with the action delayed
        2000, criterion 11.2(e) at 1000 milliseconds after the click with the
        action delayed 2000.
      - >-
        M3-P11 is required to keep 10.3 passing: criterion 11.8 requires "npm
        run test:e2e exits 0 under every project", and M3-P10's spec is
        committed by then; M3-P11's third step has the leaf consume M3-P10's
        submit leaf rather than replace it.
    analysis: >-
      The fix over-corrected by one word. The reasoning behind removing
      aria-busy from the ROW is right and is better than the edit round 1
      asked for: aria-busy on the row is what suppresses the announcement.
      But the naming submit is a descendant of the row, so "no element of that
      row" also removes it from the CONTROL, where it is correct, where
      M3-P10 put it, and where it does no harm at all, because aria-busy
      scopes to its own subtree and the button's subtree is just its label.
      As written the phase has to choose which of its own two criteria to
      fail. The likely resolution on the day is the quiet one: the implementer
      reads 11.2(d) as "not on the row element itself", ships that, and the
      criterion stops saying what it says.
    concrete-edit: >-
      Replace 11.2(d) with: "(d) neither the row element itself, nor the
      group-label element, nor the visually-hidden description carries
      aria-busy=\"true\", so nothing holds back the announcement of the
      predicted value. aria-busy on the naming SUBMIT CONTROL inside the row
      is required by criterion 10.3 and is correct there: it scopes to that
      control's own subtree, which carries only its label, and it is what
      tells a reader the action is running." Change the FALSIFIED BY clause
      from "by aria-busy anywhere on the predicted row" to "by aria-busy on
      the row element, the group-label or the description". Add the same
      carve-out to D-30's amended sentence, which currently reads "aria-busy
      is forbidden on the predicted row and stays on the control that is
      working" and is self-contradictory once the control is inside the row.
  - id: DELTA-M0P4-03
    severity: medium
    evidence:
      - >-
        Criterion 9.2(b)(ii): "the computed background-color or color differs
        from the hovering value by at least 3 percent in relative luminance
        over the resolved sRGB values; where the hovering background-color is
        fully transparent, an alpha increase of at least 0.08 satisfies this
        half instead."
      - >-
        The alpha branch constrains the ALPHA and not the COLOUR. The page's
        own background is var(--color-surface) (styles/tokens.css:194,
        resolving to --pulse-paper-300 at styles/tokens.css:43), so a pressed
        background of that same colour at alpha 0.09 clears the branch and
        composites to exactly the surface it sits on.
      - >-
        The three rules the refinement was built for do declare no background,
        checked at 89ed187: .app-nav-link (src/app/globals.css:177 through
        :190), .app-signout (:231 through :241, with an explicit "background:
        none" at :236) and .empty-state-cta (:281 through :287). So the
        refinement's PREMISE is correct and round 1's clause would indeed have
        been unsatisfiable on them.
      - >-
        The 3 percent figure is round 1's own and is scale-dependent. A
        relative-luminance difference of 0.03 near white is a contrast ratio
        of 1.05/1.02, about 1.03 to 1: white against sRGB 252. Near black the
        same 0.03 is a ratio of about 1.4 to 1. One number cannot serve both
        ends, and the light end is where this product's surfaces live.
    analysis: >-
      Asked directly whether the refinement is equivalent in visibility: the
      reasoning is sound and the replacement is not. Making the clause
      satisfiable on a transparent background was necessary; measuring the
      alpha instead of the result is what opens it. And round 1 handed the
      plan a bar that is too weak at the light end even on the opaque branch,
      which is a defect of the review before it is a defect of the plan. The
      other three magnitudes hold up: 1 device-independent pixel equal to
      --press-offset is a floor a real pressed state clears easily and is
      buildable; 0.15 of opacity for disabled is mild but perceptible and well
      short of the 0.4 to 0.5 a normal disabled treatment uses, so it is a
      floor rather than a target; and 9.2(b)(i) is the half that carries the
      criterion, which is why this finding is medium and not high.
    concrete-edit: >-
      Replace 9.2(b)(ii) with: "(ii) SURFACE. The spec composites the held
      background-color over the nearest ancestor's non-transparent
      background-color, does the same for the hovering value, and requires the
      two composited colours to differ by a WCAG contrast ratio of at least
      1.1 to 1; where the control declares its own colour rather than a
      background, the same bar applies to computed color. Where the hovering
      background-color is fully transparent, the held one must ALSO carry an
      alpha of at least 0.08, so a tint that clears the ratio by being nearly
      opaque and a tint that is the page's own colour both fail. A contrast
      ratio rather than a luminance difference because relative luminance is
      scale-dependent: 0.03 of it is about 1.03 to 1 near white, which nothing
      can see, and about 1.4 to 1 near black. 1.1 to 1 is calibrated to pass a
      five percent grey step on a light surface and to fail a two percent
      one." Apply the same replacement to criterion 9.3's "3 percent in
      relative luminance" clause, which inherits the same problem.
  - id: DELTA-M0P4-04
    severity: medium
    evidence:
      - >-
        Criterion 11.2(c) requires "the row carries an accessible description,
        through aria-describedby pointing at visually-hidden text inside it".
        Criterion 11.1(g) verifies it by reading "the browser's own
        accessibility snapshot".
      - >-
        The row is an `<li>` (src/modules/merchants/ui/merchant-review.tsx:26)
        and is neither focusable nor interactive. A description on a
        non-focusable element is surfaced when the element is focused or
        traversed; nothing focuses or traverses it at the moment the
        prediction lands.
      - >-
        At that moment focus is on the naming submit
        (merchant-review.tsx:60), which the reader has just pressed, and that
        control is not what carries the description.
      - >-
        The row carries no live region. The plan reserves the live regions for
        the toast: D-32, "a failure is assertive (role=\"alert\") and a
        non-failing difference is polite (role=\"status\")", and D-27 as
        amended still parks the running-state announcement.
      - >-
        11.1(g)'s check cannot distinguish the two cases. A description
        attached with aria-describedby appears in the Chromium accessibility
        tree whether or not any assistive technology would speak it, so the
        question is answerable yes by a mechanism that proves nothing about
        announcement.
    analysis: >-
      The fix does the right thing about aria-busy and then puts the
      replacement somewhere it cannot be heard. The visually-hidden text does
      buy something, because it sits in the row's content and a reader
      traversing the list later will read it; what it does not buy is the
      thing D-30 now claims, that "with both parts present, no reader has to
      guess whether a value on a finance screen has been stored". At the
      moment the prediction appears, the non-visual reader hears nothing,
      because nothing announced it and their focus is on a button that says
      only its own label. Note also that the aria-describedby relationship is
      doing no work here: the text is announced, when it is announced at all,
      because it is in the flow, not because it is referenced.
    concrete-edit: >-
      Change the third step of M3-P11 so the non-visual part is announced
      rather than merely present: "the non-visual part is the fourth
      catalogue key rendered inside a polite live region (role=\"status\")
      within the row, so it is announced when it appears, AND referenced by
      aria-describedby from the naming submit control inside that row, which
      is where focus sits when the prediction lands, so a reader who moves
      focus back to it is told again." Change 11.2(c) to assert both: the
      live region exists with that text in the language under test, and the
      submit control's accessible description resolves to the same text.
      Change 11.1(g) from an accessibility-tree read to an announcement
      observation: "capture that the text enters a live region at the moment
      the prediction lands, by observing the region's textContent change with
      a MutationObserver scoped to it, and record separately that the
      accessibility tree exposes the description on the focused control. An
      accessibility-tree entry alone does not answer this question, because
      any attached description appears there whether or not it is spoken."
  - id: DELTA-M0P4-05
    severity: medium
    evidence:
      - >-
        Criterion 10.6(e): "A script under test/ walks the import specifiers
        of every file carrying \"use client\" and of every file those reach,
        transitively ... No package is added for this: the walk is a regex
        over import lines and one alias, @/* to ./src/*, which is the only
        path mapping tsconfig.json declares (tsconfig.json:28 through :32)."
      - >-
        The alias claim is correct: tsconfig.json:28 through :32 declares
        exactly `"paths": { "@/*": ["./src/*"] }` and nothing else.
      - >-
        This repository routes module boundaries through re-export barrels,
        which are not import lines. `git ls-files 'src/**/index.ts'` returns
        eight, among them src/modules/merchants/ui/index.ts, whose whole body
        is `export { MerchantReviewScreen } from "./merchant-review";` and
        which sits in the directory M3-P11's client leaf is placed in.
      - >-
        The criterion states no resolution rules. It does not say to stop at
        bare package specifiers (next/link, react), does not say how a
        specifier without an extension resolves to .ts, .tsx or a directory
        index, and does not say what happens when a specifier does not
        resolve.
      - >-
        It is silent on type-only imports, while D-23 intends to ban even
        those ("no domain type ... crosses") and 10.6(e) itself carves out
        only "no value import of @/platform/tenancy", implying type-only is
        acceptable for that one path and leaving every other path ambiguous.
    analysis: >-
      Asked whether a hand-written closure walk can be trusted and whether it
      belongs in a plan: it can and it does. It is roughly forty lines, adds
      no package, and guards the one architectural invariant this round is
      most likely to break, which is more than the greps beside it do. It is
      not scope creep. What it needs is the three sentences that stop a walk
      from passing by failing to look. A walk that silently skips an
      unresolvable specifier is the classic green-and-worthless guard this
      fleet has already shipped once in another form, and the barrels are not
      hypothetical: they are how every module in this tree publishes itself.
    concrete-edit: >-
      Extend 10.6(e), and 11.7(d) which re-runs it, with: "The walk follows
      `export ... from` re-exports as well as `import` and `import type`
      statements, because this repository publishes every module through a
      barrel (eight under src/**/index.ts at the phase base) and a walk that
      follows only imports stops at the first one. It follows ONLY relative
      specifiers and specifiers beginning @/; a bare package specifier is
      recorded and not entered. It resolves an extensionless specifier by
      trying .ts, .tsx and then /index.ts, and it FAILS THE CRITERION on any
      specifier it cannot resolve rather than skipping it, because a walk that
      skips what it cannot read reports a clean closure for a tree it never
      opened. Type-only imports count: D-23's rule is that no domain type
      crosses, so `import type` from a forbidden path fails the same as a
      value import, and @/platform/tenancy is the single stated exception. The
      script runs in the fast gate (npm test) and not only as a criterion, so
      the guard survives the phase that introduced it."
  - id: DELTA-M0P4-06
    severity: medium
    evidence:
      - >-
        Criterion 10.5(a): "The spec builds the set it measures and asserts
        that it equals, by testid, the SEVEN navigating controls this plan
