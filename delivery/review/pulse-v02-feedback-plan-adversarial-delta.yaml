      in files-to-touch, but nothing says so and nothing says the value. The
      alternative repair, matching on the aria-label, is fine and needs
      saying, because the glyph these Links carry ("‹" and "›") is
      not text a spec should be matching on.
    concrete-edit: >-
      Replace "by testid" in 10.5(a) with: "by testid, and by aria-label for
      the two month step controls, which carry none
      (src/modules/overview/ui/month-view.tsx:455 and :464 render only a
      className, an aria-label and a glyph child). If this phase gives them a
      testid instead, it says so and the value is pinned here; either answer
