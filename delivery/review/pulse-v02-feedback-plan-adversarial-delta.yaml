  - id: DELTA-M0P4-09
    severity: low
    evidence:
      - >-
        D-34: "The gate's wall clock grows by the interaction specs' own
        runtime a second time, not by a build, because the production server
        was already being started on every run."
      - >-
        The matrix is larger than "a second time". 10.2, 10.3 and 10.4 MOVE to
        the production project rather than doubling; 10.5 runs in both; and
        M3-P11's last step registers its spec "under the desktop, the
        chromium-phone and the chromium-phone-prod projects", which is three
        runs of a spec that itself drives en, nl and fr.
      - >-
        M3-P11's criteria name two projects, not three: 11.2 says "Under the
        chromium-phone-prod project at 390 by 844 and again under the desktop
        project", and 11.4 names two viewports without naming a project. So
        the step and the criteria disagree about where that spec runs.
      - >-
        The cost is not theoretical in this container: criterion 11.4 alone is
        two causes by three languages by two viewports, each carrying a 2000
        millisecond delay and a 5000 millisecond wait, and the fleet has
        already lost a round to moving chromium renderer crashes on long runs
        (playwright.config.ts:35 through :47).
    analysis: >-
      Neither half changes what the round should do; both are the kind of
      understatement that becomes a surprise on the day the gate is run. The
      project disagreement is the one worth correcting on its own merits,
      because a spec registered under a project no criterion evaluates is
      runtime spent for nothing, and because M3-P11 running under
      chromium-phone as well would put its prediction measurements in the
      development build that D-34 just moved them out of.
    concrete-edit: >-
      Replace M3-P11's last step's project list with "under the
      chromium-phone-prod project and the desktop project, which are the two
      criteria 11.2 names; NOT under chromium-phone, because decision D-34
      moves the prediction and failure measurements to the production build
      and running them in development as well buys nothing 10.5(c) does not
      already record." And replace D-34's wall-clock sentence with: "The
      gate's wall clock grows by roughly the interaction specs' own runtime,
      not by a build, because the production server was already being started
      on every run: criteria 10.2, 10.3 and 10.4 MOVE to the production
      project rather than doubling, 10.5 is the one criterion that runs twice,
      and M3-P11's spec runs in two projects across three languages. The
      largest single cost is criterion 11.4, two causes by three languages by
      two viewports each carrying a two second delay and a five second wait."
