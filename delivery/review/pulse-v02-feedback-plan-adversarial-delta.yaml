  - id: DELTA-M0P4-07
    severity: low
    evidence:
      - >-
        D-34 states as established: "In the owner's deployed build, prefetch
        on, the destination renders from the router cache with no pending
        state at all, so the branch the gate proved was the branch the owner
        never sees." Criterion 10.5 repeats it.
      - >-
        The App Router prefetches a DYNAMIC route only as far as its nearest
        loading boundary. This application has none: `find src/app -name
        "loading.tsx" -o -name "loading.js"` returns nothing at 89ed187.
      - >-
        Every destination the seven navigating controls point at is
        dynamically rendered: / at src/app/(app)/page.tsx:14, /merchants at
        src/app/(app)/merchants/page.tsx:8 and /import at
        src/app/(app)/import/page.tsx:12 all await requireHouseholdContext()
        before rendering.
      - >-
        The fact the decision actually rests on is correct and is quoted
        correctly: node_modules/next/dist/client/components/links.js:194
        through :199, "Prefetching on viewport is disabled in development for
        performance reasons".
    analysis: >-
      The decision is right and the premise under half of it is not. With no
      loading boundary anywhere, a prefetch of these routes caches nothing the
      router can render, so in production the navigation still waits for the
      server and the marker branch will be exercised there too. That is better
      news than the decision expects, and it does not change what to do: the
      measurement still belongs in the production build, because that is where
      the prefetching behaviour is real whatever it turns out to be, and
      because a phase that never builds the production bundle cannot say
      anything about the build the owner presses. What it changes is that
      10.1(c)'s verification question must be allowed to DISCOVER the answer
      rather than confirm a stated one, and that a later reader should not
      inherit a sentence about the router cache that this app's route shapes
      do not support.
    concrete-edit: >-
      Replace D-34's sentence "In the owner's deployed build, prefetch on, the
      destination renders from the router cache with no pending state at all,
      so the branch the gate proved was the branch the owner never sees" with:
      "In the owner's deployed build viewport prefetching is ON, and whether
      that makes the destination render from the router cache with no pending
      state depends on route shape: the App Router prefetches a dynamically
      rendered route only as far as its nearest loading boundary, and this
      application declares none (no loading.tsx under src/app at 89ed187),
      while every destination calls requireHouseholdContext() and is therefore
      dynamic. So the production run may well take the marker branch too. That
      is not known until it is run, which is the point: the branch each
      control takes is a property of the build and the route shape and is
      recorded by criterion 10.5(c) rather than predicted here." Add to
      criterion 10.1(c): "and record whether any loading boundary exists under
      src/app at the phase base, since that is what decides whether a
      prefetched dynamic route can render without waiting."
