      false (HZ-M3P4-R2-02). (2) .import-note a, .import-status a,
      inline-flex at all widths: no overflow path (atomic inline shrinks to
      the line), but uneven leading on the desk and an orphan break after
      "l'" in French (HZ-M3P4-R2-03). (3) .spec-editor summary min-height with
      align-content: center keeps display list-item, so the marker is
      unaffected; it shares no property with summary:active,
      summary[aria-disabled] or summary[aria-busy] (src/app/globals.css:1698,
      :1754, :1847), so the specificity balance recorded at
      src/app/globals.css:1727 to :1747 is untouched. (4) .spec-editor button
      at (0,1,1) sets align-self, min-height and padding; none of those is set
      by button:active, button:disabled or [aria-busy] rules, so no state rule
      is overridden, and the busy sweep's "pressing preview-again submit"
      passes in e2e-full3.txt. The align-self may be inert if the engine
      slots the details children into a ::details-content box, which is
      harmless: the button is label-width either way. (5) field-sizing:
      content on the textarea: at the desk, with .import-form at
      align-items: flex-start inside the one media block, the details is
      shrink-to-fit, so a long unbreakable line could widen it; the spec is
      serialised with JSON.stringify(spec, null, 2) at
