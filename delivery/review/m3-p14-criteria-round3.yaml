deviations-judged:
- deviation: 'THREE PATHS THIS PHASE TOUCHED THAT ITS files-to-touch DOES NOT NAME, item 1: src/modules/ledger/domain/corrections.ts
    and src/modules/ledger/domain/pair-transfers.ts'
  serves-plan-intent: true
  reasoning: It serves it and could not have been avoided. Criterion 14.4 names 'one written inline
    inside another module's identity derivation' as the shape to catch, and src/modules/ledger/domain/corrections.ts
    carried exactly one in counterpartyKey. Leaving it would have failed 14.4; changing it required
    touching a path files-to-touch does not list. The change is held by a dedicated invariant
    test at test/domain/counterparty-key-invariant.test.ts:47, which asserts the new shape-gated
    key equals the old unconditional one on every value the known producers can emit AND that
    the two disagree outside that shape, so the migration is pinned in both directions rather
    than assumed. src/modules/ledger/domain/pair-transfers.ts had to canonicalise its own side
    or the canonicalisation would have been half applied, which is worse than not applying it.
- deviation: 'item 2: src/modules/merchants/adapters/merchant-repository.ts is listed by M3-P15''s
    declaration and not by M3-P14''s'
  serves-plan-intent: true
  reasoning: The two phases ship together on one branch, which decision D-53 and this phase's
    conflicts-with both record, so the union of the two declarations is the honest scope for the
    branch. The edit is eight added lines and it is declared rather than discovered.
- deviation: 'item 3: scripts/gate-diff-tokens.sh is new and is not in files-to-touch'
  serves-plan-intent: true
  reasoning: 'Criterion 14.10 requires the phase to assert by its OWN diff-scoped grep that no
    line it adds carries a colour literal or a length, and requires that grep''s output in the
    work history. Writing it as a script rather than a one-liner is what let it be shown RED against
    four structurally different offenders before being trusted, and it is what let ME re-run it:
    I ran npm run gate:diff-tokens myself and it exits 0. A one-liner recorded in a document and
    never executed again is the guard shape the dispatch contract calls green and worthless.'
