  - 'Criterion 14.2 specifies the seed exactly: a household holding TWO reserve accounts with
    different numbers and different typed labels AND a pot current account; THREE rows naming
    the first reserve account twice (compact and spaced) and the second once; AND TWO FURTHER
    rows naming two DIFFERENT unregistered counterparty numbers; five rows in all, all flow RESERVE,
    all on the pot account. It then requires exactly FOUR groups, the two unregistered ones SEPARATE
    and each keyed by the canonical form of its own stored value, NO group key null, and each
    group''s parked total against a hand-written string.'
  - 'What is in the tree is at test/e2e/overview-reads.spec.ts:282: two accounts, two rows, one
    group asserted. There is no second reserve account, no unregistered counterparty, no four-group
    count, no null-key assertion and no per-group hand-written totals beyond the one sum.'
  - 'The consequence is exactly what the criterion predicts. Its third red, a read GROUPING on
    the joined account''s identity or on the joined label, and its fourth red, an INNER join that
    silently drops every reserve movement toward anything the household has not registered, both
    require a row that FAILS TO JOIN. No seeded row fails to join, so neither red has a witness
    anywhere in the tree. The criterion names this trimming in advance: "A later reader trimming
    that pair back to one is removing the count''s discrimination, not a duplicate row."'
  - The two reds that ARE witnessed are the raw join and the raw grouping key, both by the spaced
    row at test/e2e/overview-reads.spec.ts:333.
  concrete-fix: Extend that seed to the five rows and three accounts the criterion writes out,
    and assert the four groups, the two canonical unregistered keys, the non-null key and the
    four hand-written totals.
