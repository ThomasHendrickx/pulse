  - id: CR-H2-03
    severity: medium
    evidence:
      - "src/modules/ledger/domain/classify-flow.ts:75-81 (reserve-set branch) versus :131-135 (the zero-amount fallback, 'A zero amount has no direction to read'): for a transaction whose counterparty is NOT YET in the declared reserve set, a zero-amount row reaches neither the negative-amount branch (:113, amountCents < 0) nor the positive-amount branch (:120, amountCents > 0), so it falls through to UNRESOLVED. After the same account is declared RESERVE, the reserve-set branch at :75 fires first and, because `transaction.amountCents > 0` is false for a zero-amount row, returns RESERVE directly (the `: { flow: 'RESERVE' }` arm), never reaching the zero-amount fallback."
      - "Demonstrated with a domain-level probe run against the shipped classifyFlow and deriveDeclaredSets directly (test run in this review, deleted before commit per the reviewer's no-edits rule -- the tree is clean, `git status --short` empty): a zero-amount transaction whose counterparty is BE24902200001138 classifies UNRESOLVED against a declared-set containing only the pot account, and RESERVE against the same declared set once BE24902200001138 is added as a RESERVE account. `npx vitest run` on that probe: '2 passed (2)'."
      - "src/modules/overview/domain/month-projection.ts:206-210 (deriveMonthFigures): `reconciles` requires `raw.unresolvedCount === 0` among its four conditions, so a household holding this one zero-amount row has its verdict held open (a genuine, counted UNRESOLVED gap) before the declaration, and the verdict can close on that account after the declaration purely because the row silently became RESERVE, contributing 0 cents either way -- a transition none of criterion 14.16's four arms exercises, since none of their fixture rows are zero-amount (checked test/application/held-rows.test.ts: zero matches for `amountCents: 0`)."
    concrete-edit: >-
      Add a fifth arm to criterion 14.16's suite (or a case inside the
      existing declaration-arm test): a fixture carrying one zero-amount
      pot-side row whose counterparty is the account being declared RESERVE,
      alongside at least one ordinary non-zero row so the arm is not
      vacuous. Assert unresolvedCount falls by exactly one and reconciles
      flips from false to true across the declaration, with every other
      MonthFigures field unchanged, matching the byte-identical-elsewhere
      pattern the other four arms already use.
    analysis: >-
      Medium rather than low because it is a real, demonstrated state
      transition that a declaration can silently produce in the
      reconciliation VERDICT (open before, closed after, with the row
      contributing zero cents) that no criterion in the round pins down; a
      household's books flipping from "not closing" to "closing" as a side
      effect of registering an account, on a row that never moved a single
      cent, is exactly the kind of DR-0030-adjacent surprise this whole
      round exists to close off elsewhere. Not rated higher because a
      genuine zero-amount transfer row is an unusual, though real,
      statement shape (a reversed or cancelled transfer, or an export format
      that emits a zero-amount confirmation line) rather than the
      household's everyday journey.
  - id: CR-H2-04
    severity: low
    evidence:
      - "scripts/gate-diff-tokens.sh's own LENGTH pattern: LENGTH='[0-9.]+(px|rem|em|vw|vh|vmin|vmax|ch|ex|pt|pc|cm|mm|in|q)\\b', run directly against two candidate added lines in this review: `echo 'style={{ padding: 4 }}' | grep -qiE \"$LENGTH\"` and `echo 'style={{ marginTop: 12 }}' | grep -qiE \"$LENGTH\"`, both NO MATCH (captured in this review's own session), alongside the same two lines against the script's COLOUR pattern, also NO MATCH."
      - "React's inline `style` prop treats a bare numeric value as a pixel length for most CSS properties (React's own documented convention: `style={{padding: 4}}` renders `padding:4px`), so a literal spacing value can enter the tree as a JS number with no 'px', 'rem' or 'em' substring anywhere in the source line, which is exactly the text both of gate-diff-tokens.sh's patterns require to fire."
      - "Not currently exploited: `grep -rn \"style={{\" src/app src/modules/*/ui` in this tree returns no results, so no line in the current diff takes this shape. This is a coverage gap in the instrument, demonstrated by handing it the shape it is meant to refuse, not a live defect in the shipped screen."
    concrete-edit: >-
      Add a third pattern to scripts/gate-diff-tokens.sh alongside COLOUR
      and LENGTH: a bare numeric literal inside a `style={{...}}` object
      (e.g. `style=\\{\\{[^}]*:\\s*[0-9]`), since that is the one shape in
      this codebase's own stack (React inline styles) where a spacing
      literal carries no unit suffix in its source text at all. Name the one
      permitted exception explicitly if the codebase ever needs a genuinely
      unitless CSS value (line-height, flex-grow, z-index, opacity) inside
      an inline style, the same way the two existing exceptions are named.
    analysis: >-
      Low because the gap is not currently reachable: this codebase's own
      convention (no literal colour, font size or spacing in components;
      className plus tokens.css only) already keeps inline `style` props out
      of src/app and src/modules/*/ui entirely, so nothing in the tree hits
      this shape today. Raised because the brief for this round asks
      explicitly for a seventh instance of the "matches the shape, not the
      identity" defect family fleet warnings 27 and 29 already name six
      instances of in this project, and because a guard whose blind spot is
      undocumented is a guard the next author cannot know to avoid tripping
      when React's own convention is exactly the kind of idiom this defect
      family keeps finding.
