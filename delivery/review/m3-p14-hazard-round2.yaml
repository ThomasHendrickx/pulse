      - "src/modules/ledger/application/preview-declaration-change.ts:161-179 (realAccountIds / loadIds construction) and :190/:196 (the two totalsFor calls): the preview's own cost is a full interpretation pass over every pot transaction the union of the current and proposed declared sets can see, run twice per call."
