  - id: CR-H2-01
    severity: high
    evidence:
      - "delivery/work-history/m3-p14.yaml:2089-2126, run-2-the-correctly-targeted-one: canonical `npm run test:e2e` at 2026-08-24 18:23:54 UTC, pinned local stack, preflight green on all three variables, result '82 tests, 1 failed, 81 passed (17.0m), exit 1', the one failure being test/e2e/accounts.spec.ts:274 HEALING, 'expect(locator).toBeVisible() failed, Locator: getByTestId(accounts-status), Timeout: 30000ms, element(s) not found', with the redirect itself having already succeeded (the page snapshot shows the shell fully rendered with an empty main for the full 30s budget)."
      - "This review reproduced the same HEALING sequence twice against its own pinned local stack (project m1-p1-skeleton, DATABASE_URL/DIRECT_URL/NEXT_PUBLIC_SUPABASE_URL pinned and preflight-verified before each run) and could NOT reproduce the failure: a standalone Playwright script driving the same seven-registration sequence completed every step in 2.0-3.1s (24.1s total), and `PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000 npx playwright test test/e2e/accounts.spec.ts -g HEALING --project=chromium` reported '1 passed (57.2s)' with the test itself completing in 56.1s, both runs comfortably inside the 30s-per-assertion and 180s-per-test budgets (test/e2e/accounts.spec.ts:43)."
      - "src/modules/accounts/ui/actions.ts:33-79, registerAccountAction: awaits registerAccount fully (including its recompute call) before calling redirect(); nothing in the literal code path lets the browser navigate before the declaration write and the recompute are both complete, which weighs against hypothesis 1 (a genuine ordering race) in its strong form."
      - "src/modules/accounts/application/register-account.ts:119-143: every registerAccount call computes a full DeclarationChangePreview via deps.preview (line 119-137) and then reads exactly one field of it, merchantRulesStoppedMatching (line 143); rowsOnAccount, spendDeltaCents, reservesDeltaCents and incomeDeltaCents are computed and discarded on every registration."
      - "src/modules/ledger/application/preview-declaration-change.ts:190 and :196: previewDeclarationChange runs totalsFor (which calls interpretLedger, the same domain interpretation the real recompute runs) TWICE per call, once over the current declared set and once over the proposed one, each pass loading every pot transaction the union of both sets can see -- 'Unbounded, exactly like the recompute this previews' per the file's own comment at that call site."
      - "Consequence: every one of the seven registrations the HEALING helper drives pays for three full-household interpretation passes (two thrown away except for one integer, plus the real recompute at register-account.ts:140), and this cost scales with the household's registered-account and transaction count, both of which grow across the seven calls -- the seventh call's preview and recompute each see more rows than the first's. This is the concrete, cited mechanism behind hypothesis 3 ('something about the seventh'), though I could not push it over the 30s budget myself in this review's own isolated and lightly-contended runs against this spec's 12-row fixture."
    concrete-edit: >-
      Two changes, either sufficient to close the open question and both
      worth doing regardless of which turns out to be the actual cause of
      the one canonical failure. FIRST, stop computing the unused preview
      inside registerAccount: either derive merchantRulesStoppedMatching
      from a cheaper targeted comparison (the rules a MerchantRule query can
      already tell stopped matching after the recompute, rather than a full
      declaration-change dry run computing four other quantities nothing
      reads), or, if D-58's argument that only a dry run of the real
      interpretation can be trusted for this number is meant to bind
      registration too, say so explicitly in a comment at
      register-account.ts:119 rather than leaving the three unused fields as
      an apparent oversight. SECOND, before closing this finding, get one
      more canonical `npm run test:e2e` run recorded (this review started
      one against its own pinned stack; its result belongs in whichever
      round is open when it lands) and, if the HEALING test fails again,
      capture server-side timing (a `console.time` bracket around the
      preview and recompute calls, or the Next.js request-duration log) on
      that specific run so the next reviewer has a number rather than a
      hypothesis.
    analysis: >-
      Rated high rather than medium because the schema's own rule requires
      it: an EXIT=1 canonical slow-gate result that this branch's own work
      history reports and that no round has closed with a confirmed cause is
      not something an APPROVE can stand beside, independent of whether my
      candidate mechanism is the actual cause. I am explicit about what this
      finding is and is not: it is not a confirmed root cause (I did not
      reproduce the failure, and neither did the implementer in isolation),
      and it is not nothing (the wasted double-preview computation is real,
      cited, demonstrated waste on the exact code path the failure sits on,
      growing in exactly the direction the growing-set hypothesis asks
      about). The honest reading, matching the implementer's own work
      history at delivery/work-history/m3-p14.yaml:2127-2133, is that this
      remains an open item against the branch and should be treated as one
      by the next round rather than waved through as a flake.
