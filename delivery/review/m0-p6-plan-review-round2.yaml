# Round TWO adversarial plan review of the M0-P6 plan iteration: phases
# M3-P14 and M3-P15 of delivery/plan/pulse-v02.yaml, reviewer worktree
# wt-m0p6-adv, branch claude/m0-p6-plan-review, plan head fee97e5 carrying
# the fix-round plan d3c0bcb. Round one (delivery/review/m0-p6-plan-review.yaml,
# commit 5455c35) returned FIX-ROUND-NEEDED with seven high, seven medium and
# one low.
#
# WHY THIS DOCUMENT IS AGAIN A FINDING SET AND NOT A VERDICT. The dispatch
# asked for `tiphys validate --type verdict` first. The captured failure and
# the reason it is not reachable for a PLAN review in this repository are in
# round one's header and are unchanged at this head: the kernel's three
# verdict completeness checks read plan.yaml and work-history.yaml from FIXED
# relative paths in the context directory, this repository keeps its plan at
# delivery/plan/pulse-v02.yaml, and a verdict judges an IMPLEMENTED phase
# against a work history that does not exist because M3-P14 and M3-P15 have
# not been built. The verdict attempt was re-run at this head before falling
# back, and its output is the sharper statement of the two: the verdict TYPE
# is a different document altogether, not a stricter version of this one.
# Captured:
#
#   $ npx tiphys validate --type verdict --context /home/user/wt-m0p6-adv \
#       delivery/review/m0-p6-plan-review-round2.yaml
#   INVALID #/criteria required property criteria is missing
#   INVALID #/deviations-judged required property deviations-judged is missing
#   INVALID #/framing required property framing is missing
#   INVALID #/phase required property phase is missing
#   INVALID #/review-contract required property review-contract is missing
#   INVALID #/kind value "finding" does not equal the required constant
#     "verdict"
#   INVALID #/findings/0/concrete-edit property concrete-edit is not permitted
#     here
#   INVALID #/findings/0/concrete-fix required property concrete-fix is missing
#   (the last pair repeated for each of the eleven findings)
#
# A verdict carries `phase`, `criteria`, `deviations-judged` and a
# `review-contract`, and its findings carry `concrete-fix`, a fix to CODE. A
# plan review demands `concrete-edit`, an edit to the PLAN. The two are
# different artifacts and this is the second one. Validated as
# `--type finding`, exactly as round one and the precedent reviews in
# delivery/review/ are.
#
# THIS WAS NOT A DELTA REVIEW. All 21 criteria were walked again from the
# text in the plan file, not from round one's notes: 14.1 through 14.13 and
# 15.1 through 15.8, plus the 19 hazard classes, the four new decisions D-55
# through D-58, the two migrations notes and both conflicts-with blocks.
#
# EVERY ROUND-ONE FINDING IS ANSWERED IN PLACE. PR6-001 by D-55, D-56,
# criterion 14.11 and hazard H14.10; PR6-002 by the two-arm rewrite of 15.1;
# PR6-003 by the rewritten last sentence of 14.8; PR6-004 by criterion 14.12,
# decision D-57 and hazard H14.11; PR6-005 by the sixth assertion in 14.2 and
# its twin in 14.5; PR6-006 by criterion 14.13 and hazard H14.12; PR6-007 by
# the rewritten second witness of 15.4; PR6-008 by the counterparty-text
# rewrite of 14.1; PR6-009 by the decomposition clause of 14.2; PR6-010 by
# the width witness in 14.7; PR6-011 by the own-grep clause of 14.10; PR6-012
# by the second-implementation clause of 14.4 and the new sentence in M3-P12's
# step at plan line 6386; PR6-013 by the rewritten 15.7 and decision D-58;
# PR6-014 by the canonical-store sentence in step 2 and the third case of
# 14.3; PR6-015 by the verification-first clauses in 14.10 and 15.8 and by
# H15.7 now naming criterion 15.8. Nothing is parked without a reason and
# nothing is silently dropped. The repairs are real repairs. What this round
# reports is what the repairs BROKE and what they left standing.
#
# WHAT WAS EXECUTED RATHER THAN READ. Three probes, all read-only, in this
# worktree at fee97e5:
#
#   1. ISO 7064 mod-97 over every account-shaped token in the tree:
#        $ node -e '<walk the tree, match [A-Z]{2}[0-9]{2}([ ]?[0-9]{4}){3},
#                    compute mod-97>'
#        total distinct: 16 valid: 4 invalid: 12
#      Twelve of the sixteen distinct invented account numbers committed to
#      this repository FAIL the check criterion 14.12 makes a refusal. That
#      is finding R2-003 and it is the reason that finding is high rather
#      than a note. No identifier is reproduced in this document: gate:privacy
#      scans the tree, and prose in a report is covered by the same rule.
#
#   2. The reads that can see a row with no flow:
#        $ grep -rn 'flow" IS NULL' src/
#        src/modules/overview/adapters/overview-repository.ts:230
#        src/modules/overview/adapters/overview-repository.ts:280
#        src/modules/overview/adapters/overview-repository.ts:295
#      Line 230 is the uninterpreted COUNT that decision D-56 scopes. Lines
#      280 and 295 are listGapRows, a SECOND read, with no account filter,
#      that D-56 states does not exist. That is finding R2-002.
#
#   3. The rendering of the reserves total, because round one asserted it was
#      absent when a household has no reserve movement and that was wrong:
#      src/modules/overview/ui/month-view.tsx:223 renders reserves-net
#      unconditionally in the card header and :249 through :253 adds the
#      no-reserves note beside it. reserves-net is ALWAYS on the page. Round
#      one's PR6-002 evidence was wrong on that point; the criterion rewrite
#      it produced is still correct for the other reason it gave, and 15.1's
#      new hedge "reserves-net or its absence" is merely dead wording, which
#      is finding R2-011 and is the only low.
#
# THE ARITHMETIC OF 15.1, WALKED BY HAND AGAINST classify-flow.ts AND
# month-projection.ts, BOTH ARMS, BOTH DIRECTIONS, BECAUSE THE DISPATCH ASKED.
# Let the household's outside spend sum to -A, its transfers to the six
# accounts it did NOT register sum to -B, its transfers to the mis-ringed
# account S sum to -X, and its income to +I, all in the fixture's own
# invented units.
#   FIRST ARM BEFORE the correction, S registered POT: rows to S take
#   classify-flow.ts:73 and are INTERNAL, so spendSigned = -(A+B),
#   reserveSigned = 0, changeInPot = I-A-B-X, and month-projection.ts:201
#   gives difference = (I-A-B-X) - (I - (A+B) - 0) = -X, which is the
#   unmatched INTERNAL sum and renders as recon-difference.
#   FIRST ARM AFTER, S corrected to RESERVE: rows to S take
#   classify-flow.ts:62 and are RESERVE, so reserveSigned = -X,
#   netToReserves = +X, spendSigned unchanged, changeInPot unchanged, and
#   difference = (I-A-B-X) - (I - (A+B) - X) = 0. So reserves-net rises by
#   exactly X, recon-cause-unmatched falls to zero, spend-total is byte
#   identical and pot-change does not move. The criterion's three assertions
#   are each true and each reachable. THE ARM IS CORRECT.
#   SECOND ARM: an ordinary current account C registered POT, its own rows
#   ordinary outside spend summing to -A. Before: spend = A, changeInPot =
#   -A, difference = -A - (0 - A - 0) = 0, books close. Correct C to RESERVE:
#   M3-P15 step 3 clears the interpretation columns of rows on non-pot
#   accounts, so those rows have a null flow, leave spendSigned AND leave
#   changeInPot (overview-repository.ts:219 filters on flow IS NOT NULL), so
#   spend-total falls by exactly A, changeInPot becomes 0, difference is
#   0 - (0 - 0 - 0) = 0 and the books still close. Correct back to POT and
#   every figure returns. THE ARM IS CORRECT, and it is the only construction
#   in which a ring correction moves the spend total, exactly as the criterion
#   now claims. Round one's PR6-002 is properly closed.
#
# WHAT I COULD NOT CONSTRUCT A DEFEAT FOR, said because it is a stronger
# statement than silence. Criterion 14.3's three cases: I could not find an
# implementation that adopts on one surface form, refuses the reverse order
# and canonicalises the import declaration and is still wrong. Criterion
# 14.9 and 15.5: the rebuildability pair is tight, and the grep over the diff
# for a raw-column write is a real instrument on a real column list.
# Criterion 14.13 and 15.6: the kept-counted-named triple with the delete
# grep is falsifiable and the mechanism it rests on
# (interpret-window.ts:123-128) does what the criterion says. Criterion
# 14.8 as rewritten: I walked the companion-fixture arithmetic and every one
# of its five assertions holds for a correct implementation, and the three
# that must not move genuinely cannot. Criterion 15.4 as rewritten: the
# phase-base capture is obtainable in this phase's own tree and the third
# case does distinguish a scoping that works from one that does nothing.
#
# SCOPE DISCIPLINE. Checked against CLAUDE.md's list. The fix round adds no
# queue, no cron, no event bus, no cache, no state management library, no
# component library, no per-transaction override, no goal and no budget. The
# dry run D-58 requires is a second CALL of an existing pure domain function
# (src/modules/ledger/domain/interpret.ts), not a new mechanism. Nothing to
# report here.
#
# HOUSE RULES. Checked and clean: `git diff d3c0bcb~1 d3c0bcb -- <plan> |
# grep '^+' | grep -c '—'` returns 0, so no em dash entered the plan;
# the fix-round commit message carries no amount, no counterparty, no date
# from a row and no identifier; everything added is English.
kind: finding
verdict: FIX-ROUND-NEEDED
produced-by: claude (Opus 5, claude-opus-5)
findings:
  - id: R2-001
    severity: high
    evidence:
      - >-
        Decision D-55 narrows the import confirmation screen's ring control
        to the pot ring only, and defines the server refusal as firing on
        "an import whose own account number RESOLVES TO an account in the
        reserve ring", plus a declaration naming the reserve ring. Both
        conditions require the reserve account to ALREADY EXIST.
      - >-
        src/modules/import/application/confirm-import.ts:86 through :101 is
        the path a first import takes: findAccountByIban returns nothing for
        an account the household has never registered, so accountId is
        undefined and the branch at :96 calls declareAccount with
        input.declaration. With the control offering one option, that
        declaration is POT. No refusal condition is met, because nothing
        resolves to a reserve account and no declaration names the reserve
        ring.
      - >-
        So a household that does what the product currently teaches, upload
        the statements, gets its four savings accounts declared POT
        SILENTLY. Their transfers then take
        src/modules/ledger/domain/classify-flow.ts:73 through :77 and are
        INTERNAL, not :62 through :68 and RESERVE. The partner legs are
        present because the savings statements were imported, so the legs
        PAIR, the unmatched cause is absent, and
        src/modules/overview/domain/month-projection.ts:208 through :213
        returns reconciles true.
      - >-
        src/modules/overview/ui/month-view.tsx:223 renders reserves-net
        unconditionally and :249 through :253 renders the no-reserves note
        when there is no group, so the end state is a month view that shows
        a zero reserves total, the empty-reserves note, and a verdict that
        the books close, for a household that saved money in four accounts
        that month.
      - >-
        Nothing in criteria 14.1 through 14.13 exercises that order.
        Criterion 14.11's first witness registers the reserve account FIRST
        and then uploads; its second witness is a grep that the option is
        gone. No criterion imports a savings statement into a household that
        has registered nothing, which is the order every household is in
        before it has ever seen the accounts screen.
      - >-
        At 75ec85d the owner could at least pick RESERVE on that control
        (src/modules/import/ui/profile-confirmation.tsx:181 through :184),
        which produced the never-closing month D-55 exists to remove. After
        D-55 the choice is gone and NOTHING replaces it: criterion 14.11 TWO
        requires only that the option be absent, not that any copy take its
        place.
    concrete-edit: >-
      Add a FOURTH witness to criterion 14.11: "FOUR, THE ORDER A HOUSEHOLD
      IS ACTUALLY IN. A Playwright test signs up, registers NOTHING, and
      uploads a statement whose own account is a savings account, which is
      the first thing a household does. It asserts that the import
      confirmation screen, at the place the ring control used to stand,
      renders a line of catalogue copy present in all three catalogues
      saying that a savings account's statement is not imported in v1 and
      naming the accounts screen as where a savings account is registered,
      with a link to it; and it asserts that if the owner confirms anyway
      the month view does not render a verdict that the books close while
      the reserves block renders no-reserves, because a household that saved
      money that month must not be told both." Add hazard class H14.13: "The
      ring control loses its reserve option and nothing takes its place, so
      a household that uploads its savings statements before it has ever
      seen the accounts screen has them declared pot accounts silently, its
      saving disappears from the reserves block, and the books close over
      it", addressed-by criterion 14.11. And amend D-55's REJECTED paragraph
      to record that removing the option is not by itself the whole of the
      decision: the screen must say what the removed option meant.
    analysis: >-
      This is the defect the repair created and it is worse than the one it
      replaced. The state D-55 closes, an imported reserve statement holding
      a month open forever, is LOUD: the month never closes and the owner
      knows something is wrong. The state D-55 opens is SILENT and it
      reconciles: four savings accounts folded into the pot, saving reported
      as zero, and a green verdict over it. The owner's original complaint
      was that Pulse called their own transfers spend; this would have Pulse
      call their savings nothing at all and then certify the books. And it is
      reached by a household that has done nothing wrong, on the only order
      the product currently offers, because the accounts screen this phase
      builds is not where anybody starts.
  - id: R2-002
    severity: high
    evidence:
      - >-
        Decision D-56 rests its choice of WHICH READ on a factual claim: "of
        everything the month projects, exactly one can see a row the engine
        deliberately never interprets ... The uninterpreted count at
        overview-repository.ts:230 is the one that sees it."
      - >-
        Executed: grep -rn 'flow" IS NULL' src/ returns THREE lines, 230,
        280 and 295 of src/modules/overview/adapters/overview-repository.ts.
        Lines 263 through 310 are listGapRows, whose WHERE at :294 through
        :299 admits t."flow" IS NULL and whose CASE at :280 labels such a row
        'uninterpreted'. It joins accounts at :290 for the label and applies
        NO ring filter. It is a second read, it sees exactly the row D-56
        says only one read sees, and D-56 does not mention it.
      - >-
        The consequence of scoping only the count: the cause block is gated
        on the count, at src/modules/overview/ui/month-view.tsx:354
        ("figures.uninterpretedCount > 0"), and the rows it lists come from
        overview.uninterpretedRows
        (src/modules/overview/application/month-overview.ts:167). Scope the
        count and the block disappears WITH ITS ROWS while the repository
        goes on returning them. The rows are then in no total, in no gap
        list, on no screen, and the verdict reads that the books close.
      - >-
        Criterion 14.11's third witness REQUIRES that outcome: "asserts that
        uninterpretedCount excludes those rows and that the month's verdict
        reads as reconciling". Nothing in 14.11 requires the household to be
        told those rows exist. The household has uploaded a file, the import
        record still reports its row count
        (src/modules/import/ui/import-result.tsx:54 through :56), and the
        month says everything is accounted for.
      - >-
        That construction is the one D-55 itself REJECTS in its own words:
        "REJECTED: admitting the import and letting the rows sit invisible,
        which is a screen hiding an unknown
        (.claude/skills/pulse-frontend/SKILL.md:105) and leaves an uploaded
        file with nothing to show for it." D-56's healing path for a
        household that imported before this round produces exactly the
        rejected state, one phase earlier, for rows already on disk.
      - >-
        M3-P15 inherits the error. Its step 4 enumerates what it scopes,
        "the counted reads, the month aggregate, the reserves read and the
        merchant review's read", and listGapRows is in none of them; its
        verified-root-cause repeats D-56's claim as "the remaining reads each
        filter on the flow column and therefore cannot see a cleared row
        either", which is false of listGapRows. Criterion 15.3's enumeration,
        "not income, spend, reserves or changeInPot, not the merchant
        review's counted read, not the reserves block", omits it too, so an
        implementation that leaves listGapRows unscoped passes 15.3 while
        every cleared row is still in what the repository hands the screen.
    concrete-edit: >-
      Correct D-56's WHICH READ paragraph to: "of everything the month
      projects, TWO reads can see a row the engine deliberately never
      interprets, and both are in the overview repository: the uninterpreted
      COUNT at overview-repository.ts:230, and listGapRows at :263 through
      :310, whose WHERE at :294 admits a null flow and which carries no ring
      filter. Both are scoped by the account's ring in M3-P14, because
      scoping one and not the other leaves the repository handing the screen
      rows the verdict has already declared absent." Add to criterion 14.11's
      third witness: "and an application test asserts that listGapRows over
      the same household returns no gap row for a transaction on a non-pot
      account, and returns the gap row for a null-flow transaction on a POT
      account, so the two reads agree." Add a fourth witness to 14.11: "FOUR,
      THE ROWS ARE NOT SWALLOWED. A household that imported a reserve
      statement before this phase must be TOLD what became of those rows
      rather than have them vanish: the accounts screen names the account and
      the number of imported rows Pulse does not interpret for it, in copy
      present in all three catalogues, and a Playwright test asserts that
      line renders. A verdict that the books close over rows no screen
      mentions is the screen hiding an unknown that decision D-55 rejects in
      its own text." And add listGapRows to criterion 15.3's enumeration.
    analysis: >-
      The claim is load-bearing rather than decorative: D-56 uses "exactly
      one read" to justify doing the work in M3-P14 and leaving M3-P15's
      scoping as defence in depth, and M3-P15 then repeats it to justify
      calling its own scoping optional. One executed grep falsifies it. The
      product consequence is the one this whole round exists against: a
      household is shown a green verdict over money the software has quietly
      decided not to look at. It differs from the original defect only in
      which direction the silence runs.
  - id: R2-003
    severity: high
    evidence:
      - >-
        Criterion 14.12 makes the ISO 7064 mod-97 check a REFUSAL at
        registration: an account number that fails it produces a named error
        and no account row.
      - >-
        Criterion 14.11 TWO requires that "the existing reserve upload at
        test/e2e/month-view.spec.ts:1377 is rewritten in this phase to
        register that account on the accounts screen instead, with its
        reserve-group count and its reserves-net and no-reserves assertions
        unchanged and still passing". That test declares the savings account
        from the own-account column of a COMMITTED fixture,
        test/fixtures/mv-gapped-b.csv, and the sibling fixture
        test/fixtures/mv-gapped-a.csv references the same value as a
        counterparty, which is what produces the single reserve-group the
        test asserts.
      - >-
        Executed over the whole tree: of the 16 distinct account-shaped
        tokens committed to this repository, 4 pass the mod-97 check and 12
        FAIL it. The savings account 14.11 TWO requires be registered is one
        of the twelve. So criterion 14.12 refuses the registration criterion
        14.11 TWO requires, over a fixture neither criterion may change
        without changing the other fixture that references it.
      - >-
        The collision is not confined to that pair. Committed invented
        account numbers that fail the check appear in
        test/fixtures/generic-debit-credit.csv,
        test/fixtures/generic-debits-only.csv, test/fixtures/gj-pot-b.csv,
        test/fixtures/belfius-account-a.csv, three PDF fixtures, and in
        test/domain and test/application unit tests. Every one of them was
        invented before any criterion required validity, which is the honest
        explanation and also the warning: criteria 14.1, 14.2, 14.5, 14.8 and
        15.1 all require SEVEN NEW invented account numbers to be REGISTERED
        through the very form 14.12 guards, and no step and no criterion says
        those numbers must pass the check. Invented the way all sixteen
        existing ones were invented, roughly three quarters of them will not.
      - >-
        M3-P12 criterion 12.16 records the measurement that makes this
        specific to invented values: "Measured on the real month before this
        criterion was written, so it is known to cost nothing: all 11 stored
        accounts pass all three tests." Real account numbers pass. The
        repository's invented ones mostly do not.
    concrete-edit: >-
      Add to M3-P14 step 1, as a fourth baseline: "and CAPTURE, from the
      phase base, which committed fixture account numbers pass the ISO 7064
      mod-97 check and which do not, because criterion 14.12 turns that check
      into a refusal and criterion 14.11 TWO requires one of the committed
      fixtures' accounts to be registered through it." Add to criterion
      14.11 TWO: "and, because that fixture's account number predates this
      check, the phase re-invents it to a mod-97 valid value, updates the
      counterparty references in the sibling fixture in the same commit, adds
      both entries to test/fixtures/allowed-identifiers.txt with a written
      provenance note, and removes the superseded entries; the test's
      reserve-group count, reserves-net and no-reserves assertions are
      unchanged." Add to criterion 14.1: "every account number the fixture
      introduces passes the platform validity test, and a unit test in the
      fast gate asserts that for each of them, so a fixture built the way
      every existing fixture was built reddens at the fixture rather than in
      the middle of a Playwright run."
    analysis: >-
      Two criteria of the same phase contradict each other over a file
      neither of them may quietly edit, and the contradiction is invisible
      from the plan because it lives in the data. The pressure this puts on
      an implementer is the worst kind: the cheap way out is to make the
      registration form skip the mod-97 check "for fixtures", or to relax
      14.12 to a warning, and either move restores hazard H14.11 in full,
      which is the hazard that a mistyped account number registers
      successfully and matches nothing. Finding it costs one script; finding
      it after the phase is built costs the phase.
  - id: R2-004
    severity: high
    evidence:
      - >-
        D-55 presents the refusal as following from what the engine already
        is: "the engine already assumes it: interpretation builds its window
        from the pot accounts alone
        (src/modules/ledger/application/interpret-window.ts:37 through :39)
        ... so every row of an imported reserve statement keeps a null flow
        forever."
      - >-
        The construction that admits the import without holding the month
        open is built by this very plan, one phase later. M3-P15 step 3
        already makes interpretation "CLEAR the interpretation columns of
        rows on accounts that are not pot accounts, using the null write the
        port already defines"
        (src/modules/ledger/application/ports.ts:51 through :57), and M3-P14
        already scopes the gap read so a cleared row has a landing place
        (D-56). Admitting a reserve statement therefore needs no engine
        change at all after M3-P15: it needs the rows to be cleared, which
        M3-P15 does, plus ONE named non-alarming surface saying those rows
        are held on a reserve account and not counted. The plan builds the
        mechanism and then forbids the act that would use it.
      - >-
        D-55's second rejection is over-broad: "REJECTED: interpreting both
        sides of a reserve transfer in v1, which is a far larger domain
        change and would double count the movement." Double counting is a
        property of the TRANSFER, which has a pot-side leg. It says nothing
        about the rows only a reserve statement carries and which have NO
        pot-side leg at all: an interest credit posted by the bank, and a
        transfer between two of the household's own savings accounts. Those
        cannot double count anything, because no other row in the household
        describes them. The rejection reason does not reach the rows the
        decision costs the household.
      - >-
        The escape D-55 names is not neutral and no criterion makes it
        honest: "an owner who wants a savings account's own rows interpreted
        corrects its ring to POT on the accounts screen ... and the refusal
        message says exactly that." Move the account to the pot ring and
        src/modules/ledger/domain/classify-flow.ts:62 stops firing for it and
        :73 fires instead, so every transfer to it becomes INTERNAL rather
        than RESERVE, the reserves block loses that account's group entirely
        and reserves-net falls by all of it. Criterion 14.11 ONE requires the
        message to "name correcting the ring on the accounts screen as what
        changes it" and requires nothing about stating that consequence.
      - >-
        The owner's scenario, quoted in this plan's own standing-context, is
        four bank accounts, four saving accounts and two credit cards. D-55
        refuses four of those ten documents, and D-48 already excludes the
        two cards from registration. The decision text records the cost of
        rewriting one e2e test and does not record the cost to the household.
    concrete-edit: >-
      Amend D-55 to say plainly that it is CHOSEN and not forced, and to
      carry both halves it currently omits. Add: "THIS IS A SCOPE BOUNDARY,
      NOT A CONSEQUENCE OF THE ENGINE. The construction that would admit a
      reserve statement is the one M3-P15 step 3 already builds: interpretation
      clears the interpretation columns of rows on non-pot accounts, M3-P14
      has already scoped the gap read so a cleared row has a landing place,
      and what remains is ONE named non-counted surface saying those rows are
      held on a reserve account and enter no total. That is a screen and three
      catalogue entries, not a domain change, and v1 declines it rather than
      being unable to do it." Add: "WHAT THE HOUSEHOLD LOSES, stated so the
      owner does not discover it. A reserve statement carries rows that no
      pot-side row describes and that registration alone can never supply: the
      interest the bank credits to a savings account, and a transfer between
      two of the household's own savings accounts. Neither has a pot-side leg,
      so neither can double count, and under this decision neither is in Pulse
      at all. The reserves block is what the household MOVED to savings this
      month, never what is IN savings and never what savings earned." And
      amend criterion 14.11 ONE to: "the message rendered comes from all three
      catalogues, names correcting the ring on the accounts screen as what
      changes it, AND states the consequence of doing so, that an account moved
      to the pot ring stops appearing in the reserves block and its transfers
      stop counting as money set aside."
    analysis: >-
      The decision may well be the right call for v1. What it may not do is
      present itself as forced when the mechanism that would make the other
      answer cheap is specified twelve lines further down the same document,
      because a decision recorded as forced is never revisited and a decision
      recorded as chosen is. And a refusal that names an escape without naming
      what the escape costs is the same shape of surprise as the defect this
      round exists to remove: the owner does the thing the message told them
      to do and their savings quietly stop being savings.
  - id: R2-005
    severity: high
    evidence:
      - >-
        Criterion 14.11 ONE requires the refusal message to name "correcting
        the ring on the accounts screen as what changes it", and D-55 builds
        its whole "THE ESCAPE IS NAMED RATHER THAN HIDDEN" paragraph on the
        same control.
      - >-
        That control does not exist in M3-P14. M3-P15's verified-root-cause
        states it: "the accounts module publishes createAccount, listAccounts,
        findAccountByIban and getAccountById and nothing else
        (src/modules/accounts/application/ports.ts:23 through :38) ... so a
        wrong first answer is permanent", and M3-P15 step 2 is the phase that
        adds "one published use case that updates Account.role". No criterion
        14.1 through 14.13 requires a ring correction and M3-P14's
        files-to-touch carries no path for one.
      - >-
        M3-P14 is dispatchable on its own by this plan's own decision: D-53
        says "The registry answers the owner's question on its own and is
        dispatchable without the correction". So the plan permits a state in
        which the product ships a refusal whose stated remedy is a control the
        product does not have.
      - >-
        The trap closes from the other side too. Criterion 14.3's second case
        requires that a registration attempt for an account number already
        held "is refused with a named error rather than creating a second
        account", and no accounts port publishes a delete or an update. So a
        household that registers an account under the wrong ring in M3-P14 can
        neither correct it nor remove it nor re-register it, and the refusal
        message tells them to use a screen control that will not be built
        until the next phase.
    concrete-edit: >-
      Add to M3-P14's conflicts-with: "M3-P15 is a SHIPPING prerequisite, not
      only an ordering successor: M3-P14 introduces a refusal and a
      registration that a household cannot undo, and the ring correction is
      the only remedy for either, so the two phases reach a household
      together or M3-P14's refusal copy may not name a control that does not
      exist." Amend D-53's last sentence to record that, replacing "The
      registry answers the owner's question on its own and is dispatchable
      without the correction" with "The registry answers the owner's question
      on its own and is BUILDABLE without the correction, but not SHIPPABLE
      without it: every remedy M3-P14's refusals name lives in M3-P15." And
      add to criterion 14.11 ONE: "and a grep asserts the accounts screen
      renders the ring-correction control the message names, so a refusal
      cannot ship pointing at a control that is not there."
    analysis: >-
      Criterion 14.11 ONE asserts the presence of a SENTENCE, and a sentence
      naming a control is green whether or not the control exists, so the
      phase's own witness cannot catch this. What the owner would meet is a
      dead end with instructions: an upload refused, a message telling them to
      change a setting, and no setting on the screen it names. That is a worse
      experience than the refusal not existing, and it is entirely a
      sequencing statement the plan can make in one sentence.
  - id: R2-006
    severity: medium
    evidence:
      - >-
        Criterion 15.7 and decision D-58 require THREE quantities and require
        every one of them to come from one place: "Each quantity is produced
        by a DRY RUN of the same domain interpretation the recompute runs,
        over the proposed declaration set, writing nothing, and never by a
        separate query."
      - >-
        The first quantity is "how many transactions ON the account will stop
        being counted at all". For a correction OUT of the pot those rows are
        cleared, and the clearing is an APPLICATION act added by M3-P15 step
        3, not a domain one: the domain function interpretLedger is called at
        src/modules/ledger/application/interpret-window.ts:85 through :90 over
        a transactions list built at :37 through :60 from pot accounts only,
        so rows on the proposed reserve account are not in its input and it
        returns nothing about them.
      - >-
        So the first quantity cannot be produced by "the same DOMAIN
        interpretation" over the proposed set. It is a count of rows on one
        account that currently carry a non-null flow, which is precisely the
        "separate query" the same sentence forbids.
      - >-
        The other two quantities do not have the problem: the movement between
        the spend total and the reserves block is exactly what a dry run over
        the proposed declared sets produces, and the merchant-rule count falls
        out of the same run through the null-merchant rule at
        interpret-window.ts:123 through :128.
    concrete-edit: >-
      Replace the quoted sentence in 15.7 and in D-58 with: "The two
      quantities that describe a RECLASSIFICATION, the movement between the
      spend total and the reserves block and the number of merchant rules that
      stop matching, are produced by a DRY RUN of the same interpretation the
      recompute runs over the proposed declaration set, writing nothing, and
      never by a second rule that sums rows whose counterparty account
      matches. The third quantity, the count of rows ON the account that stop
      being counted at all, is the count of rows on that account carrying a
      non-null flow today, because clearing them is an application act and no
      domain interpretation is asked about a row it never loads; the criterion
      names it that way so an implementer does not fake a dry run for it. An
      application test asserts all three against the actual movement over a
      fixture carrying a settlement-matched card debit and a matched transfer
      pair as well as ordinary rows."
    analysis: >-
      An absolute that cannot be met is a criterion an implementer negotiates
      with, and the negotiation will be conducted alone at the end of the
      phase. The substance of D-58 is right and worth keeping: a second rule
      that sums counterparty matches diverges from the engine at four named
      places. What needs saying is which of the three quantities that argument
      actually applies to, so the one it does not apply to is specified rather
      than smuggled.
  - id: R2-007
    severity: medium
    evidence:
      - >-
        Criterion 14.2's sixth assertion, added in the fix round, pins the
        reserve-group LABEL: "each reserve-group's rendered label is byte
        identical to the LABEL the household typed when it registered that
        account ... which fails if the reserves join at
        src/modules/overview/adapters/overview-repository.ts:175 through :176
        compares raw stored strings".
      - >-
        The label comes from the LEFT JOIN at :175 through :176. The GROUPING
        does not: the query groups by t."counterpartyIban" and a."label"
        (GROUP BY 1, 2 at :182) over the RAW stored fact column. Normalising
        only the ON clause leaves the grouping raw.
      - >-
        The stored column really does carry more than one surface form for one
        account, which is criterion 14.4's own measured ground: the delimited
        parse stores the cell verbatim
        (src/modules/import/domain/parse-statement.ts:114 through :123) while
        the PDF path compacts it
        (src/modules/import/domain/belfius-current-account-template.ts:90). A
        household importing both a CSV export and a PDF statement for the same
        current account therefore holds both forms.
      - >-
        The failure is invisible to every assertion 14.2 makes. With a
        normalised join and a raw grouping, one savings account written in two
        surface forms produces TWO reserve-group elements carrying the SAME
        typed label and splitting the total between them. 14.2's first
        assertion, "reserve-group elements number exactly the distinct reserve
        accounts the fixture references", passes only because the fixture is
        written in one surface form throughout, which criterion 14.2 requires
        for a different reason.
    concrete-edit: >-
      Add to criterion 14.2, as a seventh assertion: "and the reserves read
      GROUPS on the canonical form as well as joining on it: an application
      test over a household whose stored counterparty account column carries
      the SAME reserve account in two surface forms, one spaced and one
      compact, asserts exactly ONE reserve-group is returned, carrying the
      household's typed label and the sum of both rows. The fixture for that
      case is written deliberately mixed, because a fixture uniform in one
      surface form cannot tell a normalised join from a normalised grouping."
    analysis: >-
      Round one caught the join and the fix round repaired the join. The
      grouping is the half of the same SQL statement that the repair did not
      reach, and it fails in a way that looks like a data problem rather than
      a code problem: the owner sees their savings account twice, under the
      right name both times, with the money split. The mixed-form fixture is
      the only instrument that separates the two, and it costs one extra row.
  - id: R2-008
    severity: medium
    evidence:
      - >-
        D-57 places the validity predicate in the platform module: "M3-P14
        OWNS THE PLATFORM ACCOUNT-NUMBER MODULE INCLUDING DR-0028'S
        DETERMINISTIC VALIDITY TEST, AND M3-P12 IMPORTS IT."
      - >-
        M3-P12's step now contradicts itself across nine lines. At plan line
        6388 through 6390 the fix round added "the three trust tests below
        live beside it in that same module for the same reason (decision
        D-57)". At plan line 6393 through 6395 the pre-existing sentence still
        reads "TRUSTWORTHY is three pure tests IN THE MERCHANTS DOMAIN beside
        the normaliser, decided by decision D-43 and measured by criterion
        12.16". An implementer reading the step top to bottom is told both.
      - >-
        No criterion pins the predicate to one definition. Criterion 14.4's
        anti-duplication grep is written against the TRANSFORMATION only: "no
        file under src/ other than the platform module contains an uppercase
        plus whitespace-removal expression applied to an account-bearing
        field". A second implementation of the pinned country-length table or
        of the ISO 7064 loop, written in the merchants domain, matches nothing
        in that grep.
      - >-
        The existing tree shows how a second copy actually appears: the
        whitespace-removal half of the canonical form ALREADY exists outside
        the platform module, as compactIban at
        src/modules/import/domain/belfius-current-account-template.ts:90, used
        at :169 and :267. Read strictly, 14.4's grep spares it, because it
        removes whitespace and does not uppercase; read loosely, 14.4's grep
        reddens on a file the phase does not intend to change. Either reading
        leaves criterion 14.4 not doing what D-47 and D-57 need.
    concrete-edit: >-
      Delete "in the merchants domain beside the normaliser" from M3-P12's
      step at plan line 6393 and replace it with "in the platform
      account-number module M3-P14 owns (decision D-57), imported here". Add
      to criterion 14.4: "and the same enumeration test pins the VALIDITY
      predicate, not only the canonical form: it asserts that the pinned
      country-length table and the ISO 7064 mod-97 implementation each have
      exactly one definition under src/, in the platform module, and that
      every consumer imports it. The existing whitespace-removal helper at
      src/modules/import/domain/belfius-current-account-template.ts:90 is
      NAMED in this phase and is either replaced by the platform form or
      recorded in the test as the one permitted exception with the reason, so
      the enumeration is a list a reader can check rather than a grep that
      passes by accident."
    analysis: >-
      D-57 is a good decision and it is the one thing the fix round left
      half-written into the phase that consumes it. A contradiction inside a
      single step is the cheapest kind to fix and the most expensive to
      discover, because the implementer who resolves it does so silently and
      the second copy is then a fact. Naming the copy that already exists is
      what turns 14.4's grep from a hope into an enumeration.
  - id: R2-009
