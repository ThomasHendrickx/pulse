  - id: R2-010
    severity: medium
    evidence:
      - >-
        Criterion 14.7's width witness asserts that "every element with
        data-testid nav-overview, nav-import, nav-merchants and nav-accounts
        renders its label on at most the number of lines the verification-first
        step recorded FOR IT at the phase base, those numbers written into the
        spec by hand from that captured output".
      - >-
        Step 1 captures that baseline "for every navigation link the shell
        renders TODAY". src/app/(app)/layout.tsx:48 through :58 renders three:
        nav-overview, nav-import and nav-merchants. nav-accounts is the link
        this phase ADDS, so no baseline exists for it and the criterion's
        bound is undefined for the only new element it names.
      - >-
        The same undefined bound applies to its tap-target half only by
        accident: "each link's border box measures at least the tap-target
        minimum in BOTH dimensions" is an absolute and does bind nav-accounts.
        The line-count half, which is the half round one's PR6-010 was written
        to add, does not.
    concrete-edit: >-
      Add to criterion 14.7, after the sentence naming the four testids: "and
      because nav-accounts does not exist at the phase base and therefore has
      no recorded baseline, its bound is stated as an absolute in the spec: at
      390 and at 360 and at both text scales it renders its label on at most
      the largest line count the verification-first step recorded for any
      existing link, and the spec carries that number by hand from the
      captured output. A criterion that bounded only the three existing links
      would leave the added one free to be the offender."
    analysis: >-
      Round one's finding was that the phase's instruments were blind to the
      width axis. The fix round added the right instrument and then left the
      new link outside its reach, which is a smaller version of the same
