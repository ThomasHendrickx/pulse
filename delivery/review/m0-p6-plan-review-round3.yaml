  - id: R3-005
    severity: high
    evidence:
      - >-
        The phase describes one population, a household that completes setup
        before importing anything. Criterion 14.1's two arms, 14.2, 14.3, 14.5
        and 14.10 all begin from sign-up.
      - >-
        A household that imported before this phase ships is in a different
        state: its accounts exist, created one file at a time through
        src/modules/import/application/confirm-import.ts:96, with rings
        answered on an import screen this phase deletes, and it has never seen
        the setup explanation criterion 14.2 makes the only guard.
      - >-
        Every one of those accounts carries its own imported rows, because
        that is how each came into existence. So under the rule in step 6 and
        criterion 14.8, EVERY ring in a pre-existing household is frozen the
