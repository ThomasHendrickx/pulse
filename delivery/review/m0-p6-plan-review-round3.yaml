    concrete-edit: >-
      Add criterion 14.12a: "THE HOUSEHOLD THAT ALREADY IMPORTED IS NOT LEFT
      BEHIND, AND THE OWNER IS ONE. A Playwright test builds a household the
      pre-phase way, with accounts created through the import path and rows
      already ingested, then loads the setup screen and asserts: that every
      existing account is listed with its label, its number and its ring,
      marked as already known rather than as a blank row; that the household
      can add the accounts it has not imported and submit; that the ring
      explanation renders for them too, since they never saw it; that after
      submission the gate accepts an import for any listed account; and that
      an existing account whose stored number would fail the validity test of
