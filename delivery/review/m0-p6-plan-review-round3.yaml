    analysis: >-
      Round two found this collision in M3-P14 and the fix round closed it
      there, thoroughly, with a hazard class and a fourth baseline. It closed
      it in the phase where it was reported rather than in the class where it
      lives, and the same collision is sitting one phase later on a criterion
      that was not part of the reported finding. The pressure is unchanged and
      so is the cheap way out: weaken criterion 14.12, which restores hazard
