    concrete-edit: >-
      Add to step 4, after the sentence naming criterion 14.10: "THE HELD
      BLOCK NEEDS A READ AND THE PLAN NAMES IT RATHER THAN LEAVING IT TO BE
      INVENTED. Scoping the two null-flow reads to pot accounts leaves nothing
      that can return a held row, so this phase adds ONE method on the
      overview port and ONE field on MonthOverview: the rows of the requested
      period on accounts whose ring is savings, returned per account with
      booking date, counterparty text and amount. IT CARRIES NO FLOW CONDITION
      AT ALL, keyed on the ring alone, which is sound because a savings
      account's rows never enter the interpretation window and are therefore
      held by construction, and which is why it does not appear in the
      enumeration criterion 14.11 makes." Add
      src/modules/overview/application/ports.ts and
      src/modules/overview/application/month-overview.ts to files-to-touch.
      And add to criterion 14.11, after "no third read appears": "The read
      criterion 14.10 adds is correctly absent from this enumeration because
      it carries no flow condition, being keyed on the account's ring alone; a
      held read written instead as an absent flow on a non-pot account is a
