  - id: R3-008
    severity: medium
    evidence:
      - >-
        Criterion 14.2 makes the explanation load-bearing in its own words:
        "The explanation is the ONLY guard against a savings account answered
        as a spending account, which hazard H14.4 records, so a screen that
        asks the question without answering it first fails this criterion."
      - >-
        Hazard H14.4 states the consequence: "nothing on any screen
        distinguishes that month from a correct one. The explanation given
        before the ring is answered is the only guard v1 has, and the ring
        change is the only remedy." Finding R3-001 shows the remedy is
        unreachable once the statement is imported, so the explanation is not
        merely the only guard, it is the only thing at all.
      - >-
        The guard as specified is a paragraph rendered once, above eight rows,
        on a screen where the owner is simultaneously transcribing eight
        account numbers from paper on a phone (criterion 14.3's own stated
        ground), each of which the form may reject and send them back.
        Attention is on the numbers, which fail loudly, not on the rings,
        which fail silently.
      - >-
        Nothing confirms the answers. Criterion 14.2 requires the copy before
        the control and one submit; there is no review step, no summary naming
        each account and the ring it was given in words, and no assertion that
        the household is shown what they chose before it becomes permanent.
      - >-
        A guard is proportionate to the reversibility of what it guards. This
        one guards an outcome that finding R3-001 shows is irreversible and
        that hazard H14.4 says is undetectable.
    concrete-edit: >-
      Add to criterion 14.2, as a further assertion: "AND THE ANSWERS ARE
      CONFIRMED BEFORE THEY BECOME PERMANENT. Submission shows a review step
      listing every account the household entered with its label and its ring
      RENDERED AS WORDS rather than as a control state, in all three
      catalogues, grouped so the savings accounts are visible as a set, with a
      line saying what the household is about to be told about their money:
      that these accounts' rows will be counted in income and spending and
      those accounts' will not. A Playwright test asserts the review step
      renders before anything is written, that going back preserves every row
      typed, and that no account row exists in the database until the review is
      confirmed. This is required because the ring answer is the one entry on
      this screen that fails silently: a mistyped number is refused by
      criterion 14.3 and a wrong ring is refused by nothing, and hazard H14.4
      records that no screen afterwards distinguishes the result."
    analysis: >-
      Judged as the load-bearing guard the plan says it is rather than as
      copy, an explanation shown before the question is a good first half and
      an incomplete guard, because it acts on the reader's attention at the
      moment their attention is committed elsewhere. The cheap addition is not
      more explanation, which the reader has already skipped, but a
      confirmation that makes them read back what they actually chose. Taken
      with the ring change restored by finding R3-001, the pair is
      proportionate; without either, the phase rests its worst outcome on one
      paragraph.
  - id: R3-009
    severity: medium
    evidence:
      - >-
        Criterion 14.10 introduces a second new fixture: "One new invented
        fixture, a savings account's own statement, carrying the four things
        the current-account side cannot carry".
      - >-
        For that statement to be imported at all, its own account must be
        REGISTERED, because step 4's gate accepts only a file whose own
        account number resolves to a registered account or a file with no
        own-account column. So its number goes through the setup form and must
        pass criterion 14.3's validity test.
      - >-
        Criterion 14.10 does not say so. The validity requirement is stated
        only in criterion 14.1, and only of its own fixture: "every account
        number it introduces passes the validity test of criterion 14.3 with a
        fast-gate unit test asserting it".
      - >-
        The same criterion omits the allow-list requirement, which 14.1 also
        carries and which the privacy gate enforces on the tree rather than on
        one fixture, so a savings fixture added without it fails
        npm run gate:privacy and therefore criterion 14.9.
      - >-
        The fixture also introduces at least two account numbers rather than
        one, since it must carry "a TRANSFER TO ANOTHER of the household's own
        savings accounts", and both are counterparties the reserves join and
        the classification order will compare against registered values.
    concrete-edit: >-
      Add to criterion 14.10, after the sentence naming the fixture: "Every
      account number this fixture introduces, its own and the second savings
      account it transfers to, is invented, passes the validity test of
      criterion 14.3 with a fast-gate unit test asserting it, and is added to
      test/fixtures/allowed-identifiers.txt with a written provenance note,
      because the gate in step 4 means this statement can only be imported if
      its own account was registered through the form criterion 14.3 guards,
      and because npm run gate:privacy scans the tree rather than one fixture."
    analysis: >-
      An omission by inheritance rather than by oversight: criterion 14.1 was
      written when it introduced the only new fixture, and criterion 14.10
      arrived with DR-0030 and did not inherit its two conditions. Both
      conditions are cheap and both fail late, one at the setup form in the
      middle of a Playwright run and one at the privacy gate, which is the
      gate that stops a build rather than a test.
  - id: R3-010
    severity: low
    evidence:
      - >-
        Criterion 14.10's third assertion forbids every sum, and gives the
        reason: "because a total of the rows Pulse happens to hold looks like
        a balance and is not one, which is decision D-60".
      - >-
        The rule is right. The stronger reason, which the plan does not give,
        is that the money is already on the page under another heading: a
        transfer into a savings account is classified RESERVE on the
        current-account side and rendered in the reserves block
        (src/modules/overview/adapters/overview-repository.ts:157 through
        :193), so a per-account total of held rows would present the same euro
        twice on one screen, once as money set aside and once as a line in the
        savings account's own list.
      - >-
        The difference matters for how the rule survives contact with a future
        request. The stated reason invites the reply "then label it clearly as
        a partial total", which sounds reasonable and is wrong; the unstated
        reason refuses that reply, because labelling does not stop double
        presentation.
    concrete-edit: >-
      Extend criterion 14.10's third assertion with: "and the reason is not
      only that a partial total resembles a balance, which a label might be
      argued to fix, but that the money would appear twice on one screen: a
      transfer into a savings account is already counted on the
      current-account side and rendered in the reserves block
      (src/modules/overview/adapters/overview-repository.ts:157 through :193),
      so any per-account or grand total of held rows presents the same euro
      under two headings. A clearly labelled partial total does not fix that
      and is refused for the same reason as an unlabelled one."
    analysis: >-
      The only low, and it strengthens a rule rather than correcting one. I
      was asked to judge whether the reader is worse off than with a clearly
      labelled partial total and the answer is no, on both counts: they get
      dated rows with amounts, which carries strictly more information than
      one number, and the one number they might otherwise be given is the one
      that would contradict the reserves block beside it. Writing the real
      reason down is what stops the rule being traded away later by someone
      who reads only the weaker one.
