# Round THREE adversarial plan review of the M0-P6 plan iteration, now ONE
# phase, M3-P14, of delivery/plan/pulse-v02.yaml. Reviewer worktree
# wt-m0p6-adv, branch claude/m0-p6-plan-review at edf6938, carrying
# claude/m0-p6-plan-accounts at fdf205b. Round one returned 7 high, 7 medium,
# 1 low; round two returned 5 high, 5 medium, 1 low.
#
# THIS IS NOT A DIFF AGAINST ROUND TWO. The plan changed SHAPE: the owner cut
# the design to setup-first on 2026-08-26, M3-P15 was deleted, and twenty-one
# criteria across two phases became eleven in one. Every one of the eleven
# was walked from the composed brief, with all twelve hazard classes, the
# migrations note and the conflicts-with block. DR-0030 was read in full
# before anything touching savings was judged.
#
# WHY THIS IS A FINDING SET AND NOT A VERDICT. `--type verdict` was attempted
# first and refused for the same structural reason as in both earlier rounds.
# Captured at this head:
#
#   $ npx tiphys validate --type verdict --context /home/user/wt-m0p6-adv \
#       delivery/review/m0-p6-plan-review-round3.yaml
#   INVALID #/criteria required property criteria is missing
#   INVALID #/deviations-judged required property deviations-judged is missing
#   INVALID #/framing required property framing is missing
#   INVALID #/phase required property phase is missing
#   INVALID #/review-contract required property review-contract is missing
#   INVALID #/kind value "finding" does not equal the required constant
#     "verdict"
#   INVALID #/findings/0/concrete-edit property concrete-edit is not permitted
#     here
#   INVALID #/findings/0/concrete-fix required property concrete-fix is missing
#   (the last pair repeated for each finding)
#
# A verdict judges an IMPLEMENTED phase against a work history and demands
# `concrete-fix`, a fix to CODE. M3-P14 has not been built.
#
# ==========================================================================
# WHAT THE CUT GOT RIGHT, said first because most of this document is about
# what it took with it.
#
# Setup-first genuinely closes round two's R2-001 at the root, and I could
# not construct a way round it. Under the old shape the damage came from
# ORDER: a household uploaded before it had ever declared anything, and the
# ring answer rode on the import screen with nothing behind it. With every
# account entered before any file is accepted, the declaration set is
# complete at the moment the first statement lands, so importing a statement
# no longer changes how any other row is classified. That is why criterion
# 14.10's fifth assertion is not only satisfiable but exactly right: I walked
# it, and with the savings account already registered, importing its own
# statement moves none of the seven figures, because every projection in
# monthFigures except uninterpretedCount filters on the flow column
# (src/modules/overview/adapters/overview-repository.ts:216 through :231),
# the held rows carry no flow, and uninterpretedCount is scoped by ring under
# criterion 14.11. The whole class of finding that dominated round two, an
# import that silently reclassifies rows it does not contain, is gone by
# construction rather than by a guard. Deleting the clearing machinery is
# correct for the same reason.
#
# DR-0030 is also the right call and the record is honest about its ground.
# I confirm the arithmetic the decision rests on: a savings figure built only
# from the current-account side is a running sum from an assumed zero, and
# the three things the record names as otherwise invisible really are
# invisible, because a savings account's rows never enter the interpretation
# window (src/modules/ledger/application/interpret-window.ts:34 through :39
# builds it from the pot account ids alone) and no current-account row
# describes an interest credit or a movement between two savings accounts.
#
# ==========================================================================
# THE MEASUREMENTS, RUN RATHER THAN QUOTED.
#
#   $ grep -rn 'flow" IS NULL' src/
#   overview-repository.ts:230, :280, :295
#   $ grep -rn "flow: null" src/
#   (no output)
#
# THREE occurrences in TWO reads, exactly as criterion 14.11 states, and the
# third site is accounted for: :280 is the CASE label and :295 the WHERE of
# the SAME read, listGapRows, so the count of occurrences and the count of
# reads differ for a reason the criterion states correctly. No Prisma-client
# form exists today, so 14.11's decision to grep both styles is forward
# cover rather than present necessity, which is the right way round.
#
# THE MOD-97 MEASUREMENT, with the privacy gate's own scan scope, both
# pattern arms and its normalisation:
#   TREE distinct=17 pass=7 fail=10
#   ALLOWLIST entries=19 pass=7 fail=12
# BOTH FIGURES IN CIRCULATION ARE CORRECT AND THEY MEASURE DIFFERENT THINGS.
# The plan's 17 with 7 passing is the TREE; the dispatch's 19 with 12 failing
# is the ALLOW LIST, which carries two entries the gate's scan scope no
# longer reaches. There is no dispute to settle this round, only a scope to
# state, and the phase should say which it means. What matters is the
# consequence, which is finding R3-004: setup-first turns every one of these
# from a value a fixture contains into a value a household TYPES through a
# form that now refuses ten of the seventeen.
#
# THE EXISTING SURFACE THE GATE LANDS ON:
#   $ grep -rln "uploadPotFile\|setInputFiles" test/e2e/
#   prod-smoke, golden-journey, navigation, import, merchants, month-view
#   $ grep -rc "uploadPotFile(" test/e2e/*.ts
#   month-view.spec.ts:16   navigation.spec.ts:1
#   $ grep -c "accountLabel\|accountRole\|account-declaration" \
#       test/e2e/import.spec.ts
#   6
# Six specs upload files, seventeen calls go through the two uploadPotFile
# helpers, whose signature still takes a ring the phase deletes
# (test/e2e/month-view.spec.ts:55 through :61), and import.spec.ts fills the
# declaration fieldset in six places. All of it sits downstream of the new
# gate.
#
# ==========================================================================
# THE SCOPE QUESTION THE DISPATCH ASKED ME TO KEEP HONEST.
#
# The round-two quote said the cost of accepting savings statements was one
# screen state, its copy and its tests; the dispatch corrects it by one item,
# the ring-scoping of the two reads. Measured against the phase as written,
# the true cost is those two items PLUS ONE MORE, and the phase has absorbed
# it without naming it: THE READ THAT FEEDS THE BLOCK. Criterion 14.10
# requires held rows rendered per account with date, counterparty and amount,
# and nothing in the tree can return them once criterion 14.11 scopes both
# null-flow reads away from savings accounts. So the honest quote is: one
# screen state, its copy in three languages, its tests, the ring-scoping of
# two existing reads, and one new read with a port method and a MonthOverview
# field behind it. That is finding R3-003. It has not grown beyond that, and
# I looked: no queue, no cron, no event bus, no cache, no state library, no
# component library, no per-transaction override, no goal and no budget.
#
# THE HELD-ROWS BLOCK SUMS NOTHING, judged as asked. THE RULE IS RIGHT AND
# THE STATED REASON IS THE WEAKER OF THE TWO AVAILABLE, which is finding
# R3-010. The plan's reason is that a total of whatever statements happen to
# have been imported looks like a balance and is not one, which is true. The
# stronger reason, and the one that makes the rule un-arguable, is that the
# transfer INTO a savings account is already counted on the current-account
# side and rendered in reserves-net
# (src/modules/overview/adapters/overview-repository.ts:157 through :193), so
# a per-account total of held rows would put the same euro twice on one
# screen under two headings. A clearly labelled partial total would not fix
# that; it would make it legible and still wrong. The reader is NOT worse off
# without it: they get the rows, with dates and amounts, which is strictly
# more than a single number, and the one figure they might add up is the one
# figure they must not.
#
# HOUSE RULES. The plan diff from 00c3fc3 to fdf205b over
# delivery/plan/pulse-v02.yaml was filtered to added lines and counted for the
# long dash character: zero. No identifier shape appears in this document, and
# no long dash appears in it either, which is why the check above is described
# rather than quoted. English throughout.
kind: finding
verdict: FIX-ROUND-NEEDED
produced-by: claude (Opus 5, claude-opus-5)
findings:
  - id: R3-001
    severity: high
    evidence:
      - >-
        Step 6 rewrites decision D-51 to one rule: "An account's ring can be
        changed on the accounts screen WHILE THAT ACCOUNT HAS NO IMPORTED ROWS
        OF ITS OWN", and criterion 14.8 enforces it: "A ring change is refused
        for an account that already carries its own imported rows, asserted at
        the application level".
      - >-
        The justification given for that rule is a sentence DR-0030 falsified.
        Step 6: "a savings account marked spending at setup HAS NO STATEMENT
        OF ITS OWN, so correcting it only reclassifies the CURRENT account's
        transfers to it". That was true on 2026-08-26, when savings statements
        were refused. DR-0030, decided 2026-08-27, accepts them.
      - >-
        So the sequence the plan's own hazard H14.4 fears now ends in a locked
        door. A household marks savings account S as SPENDING at setup, which
        H14.4 says nothing on any screen will reveal; it then imports S's
        statement, which criterion 14.5's second case requires to be ACCEPTED;
        S now has imported rows of its own; criterion 14.8 refuses every
        subsequent ring change for S. The ring is frozen wrong, permanently,
        in v1.
      - >-
        The cost is not cosmetic and it compounds. Because S is in the pot
        ring, its rows DO enter the interpretation window
        (src/modules/ledger/application/interpret-window.ts:34 through :39),
        so its interest credits classify INCOME at
        src/modules/ledger/domain/classify-flow.ts:121, its outgoing payments
        classify SPEND at :107, and the current account's transfers into it
        take the pot arm at :73 and pair as INTERNAL with the arriving leg,
        so no unmatched cause appears. reserves-net reads zero beside
        no-reserves and the verdict reads that the books close. The household
        is told it saved nothing, its income and spending are both inflated by
        a savings account's internal life, and the month reconciles.
      - >-
        The rule is exactly inverted with respect to risk. It permits the ring
        change precisely where the mistake is cheapest to detect and least
        damaging, an account with no rows, and forbids it precisely where the
        mistake has already done its damage and is invisible.
      - >-
        No criterion admits the state. Criterion 14.8 asserts the refusal
        happens; no criterion asserts what the household is told, what they
        can do instead, or that the state is survivable.
    concrete-edit: >-
      Replace the rule in step 6 and in criterion 14.8 with one that turns on
      whether the rows were INTERPRETED rather than on whether they exist: "An
      account's ring can be changed on the accounts screen while that account
      carries no rows that interpretation has stamped, which is every account
      in the pot ring with no statement of its own AND every account in the
      savings ring whatever it has imported, because a savings account's rows
      never enter the interpretation window
      (src/modules/ledger/application/interpret-window.ts:34 through :39) and
      therefore carry no flow to go stale. The one direction v1 refuses is a
      change OUT of the pot for an account whose own rows have been
      interpreted, because that would leave a stale flow with no clearing
      machinery to remove it, and the screen says so in all three catalogues
      naming what the household can do instead." Then add criterion 14.12: "A
      RING ANSWERED WRONGLY AT SETUP IS RECOVERABLE IN THE DIRECTION THAT
      MATTERS. A Playwright test marks a savings account as a SPENDING account
      at setup, imports its statement, confirms its rows are counted in the
      month's income and spend, then changes its ring to savings on the
      accounts screen and asserts with no further upload that those rows are
      no longer counted in any figure, that they render as held under
      criterion 14.10, that the current account's transfers into it move into
      the reserves block, and that the verdict still reads as books closing.
      An application test asserts the change is refused, with a named error in
      all three catalogues, only for the reverse direction, an account leaving
      the pot whose own rows carry a flow." Amend hazard H14.4's last sentence
      accordingly, since the explanation is no longer the only remedy.
    analysis: >-
      Two owner decisions one day apart pull in opposite directions and the
      plan carries both. The freeze was written when a savings account could
      never have rows of its own, which made it a narrow and defensible rule;
      DR-0030 made rows of its own the normal case, and nobody re-read the
      rule against it. What the deletion of M3-P15 took with it is precisely
      the remedy for the phase's own worst hazard, and it took it on the
      strength of an argument that was true for one day. The repair is cheap
      because the asymmetry is real: rows on a savings account are never
      interpreted, so moving an account INTO the savings ring can never strand
      a stale flow, and that is the only direction this finding needs.
  - id: R3-002
    severity: high
    evidence:
      - >-
        Criterion 14.8 ends: "A ring change is refused for an account that
        already carries its own imported rows ... which is what keeps a stale
        flow on a non-pot account unreachable AND IS WHY THIS PLAN CARRIES NO
        CLEARING AND NO READ SCOPING."
      - >-
        Criterion 14.11 requires read scoping in its title and in its body:
        "BOTH READS THAT CAN SEE A DELIBERATELY UNINTERPRETED ROW ARE SCOPED
        THE SAME WAY ... the test asserts BOTH are scoped by the account's
        ring and that no third read appears."
      - >-
        Step 4 says the same as 14.11 ("Both reads that could mistake such a
        row for a gap are scoped by the account's ring, which is decision D-56
        and criterion 14.11"), and step 6 says the same as 14.8 ("why the
        clearing and read-scoping machinery earlier drafts of this plan
        carried is deleted rather than rewritten"). The plan asserts both
        halves of a contradiction twice each.
      - >-
        The two are not interchangeable and only one is dispensable. CLEARING
        is genuinely unnecessary under the ring freeze, because no account
        outside the pot ever had its rows interpreted, so nothing needs
        unstamping. READ SCOPING is unavoidable under DR-0030, because held
        rows carry a null flow and
        src/modules/overview/adapters/overview-repository.ts:230 counts every
        null flow as uninterpreted while
        src/modules/overview/domain/month-projection.ts:208 through :213 makes
        a non-zero count deny the verdict. Without the scoping every household
        that imports a savings statement has a month that never closes, which
        is the exact defect DR-0030's own record names as real.
      - >-
        An implementer who reads criterion 14.8 as the statement of scope and
        skips the scoping finds 14.11 red at the end of the phase; one who
        reads 14.11 first finds 14.8's closing clause false in their own diff.
        Either way the phase's two criteria cannot both be quoted honestly in
        a work history.
    concrete-edit: >-
      Replace criterion 14.8's closing clause with: "which is what keeps a
      stale flow on an account outside the pot unreachable and is why this
      plan carries no CLEARING machinery: nothing needs unstamping, because no
      account outside the pot ever had its rows interpreted. READ SCOPING IS A
      DIFFERENT THING AND THIS PLAN DOES CARRY IT, under criterion 14.11,
      because DR-0030 makes held rows exist in every household that imports a
      savings statement and a held row carries a null flow that
      src/modules/overview/adapters/overview-repository.ts:230 would otherwise
      count as an uninterpreted gap." Make the same correction in step 6,
      replacing "the clearing and read-scoping machinery earlier drafts of
      this plan carried is deleted rather than rewritten" with "the CLEARING
      machinery earlier drafts carried is deleted rather than rewritten; the
      read scoping is kept and is criterion 14.11, because DR-0030 makes held
      rows a normal state rather than an impossible one."
    analysis: >-
      This is the fossil the shape change left, and it is the same item the
      dispatch already knows its own round-two quote was short by. The plan
      does carry the scoping, correctly, in the one criterion that measures
      it, and then denies carrying it in the criterion an implementer reads
      when deciding what the phase is. A false statement about what a phase
      does not contain is worse than an omission, because it is read as a
      decision rather than as a gap, and the thing it denies is the only
