  - id: R3-004
    severity: high
    evidence:
      - >-
        Criterion 15.9 names the failure the product cannot catch, in its own
        words: the household answers "the ring question with the SPENDING ring,
        which is the mistake the product cannot otherwise catch".
      - >-
        Walked: a savings statement answered POT creates a pot account with an
        account number
        (src/modules/import/application/confirm-import.ts:95 through :99), so
        every row ON it is interpreted. The interest the account earns is a
        positive row with an outside counterparty and takes
        src/modules/ledger/domain/classify-flow.ts:121 as INCOME; anything paid
        out of it takes :107 as SPEND. The transfer from the current account
        arrives on both sides as a row whose counterparty is now in potIbans,
        so both legs take classify-flow.ts:73 as INTERNAL and PAIR, leaving no
        unmatched cause. reserves-net renders 0,00 and no-reserves renders
        (src/modules/overview/ui/month-view.tsx:223 and :249 through :253), and
        src/modules/overview/domain/month-projection.ts:208 through :213
        returns reconciles TRUE.
      - >-
        So the household is shown a month that closes, with income and spend
        inflated by a savings account's internal life and with "set aside this
        month" reading zero. Nothing on the month view differs from a correct
        month. This is the state round two reported as R2-001, and the reversal
        did not remove it: it removed the refusal that would have made it
        unreachable, so the file is now accepted and the wrong answer injects a
        whole statement into the counted month instead of injecting nothing.
      - >-
        The protection the plan puts in its place is entirely at the moment of
        answering: criterion 14.11 witness ONE requires consequence copy beside
        each answer, witness TWO forbids a defaulted ring, witness THREE
        requires the screen to name where the answer can be changed. All three
        are good and none of them is a detection. A household that reads the
        copy and answers wrongly anyway, or answers before understanding it,
        gets no second signal from any screen at any later time.
      - >-
        The asymmetry is the point. Criterion 14.15 gives the RIGHT answer a
        screen state: held rows are named, per account, on the month view and
        on the accounts screen. The WRONG answer, which criterion 15.9 calls
        uncatchable, gets nothing. The one element DR-0030 pays for surfaces
        the case that was already safe and stays silent on the case that is
        not.
    concrete-edit: >-
      Add a sixth assertion to criterion 14.15: "SIX, THE COUNTED SIDE IS
      NAMED TOO, BECAUSE THE WRONG ANSWER IS THE ONE NOTHING ELSE CATCHES. The
      held-rows element has a counterpart: the month view names, per account,
      which accounts contributed COUNTED rows to this month and which are held,
      so a household whose savings account was answered as a spending account
      sees it named among the counted accounts on the screen it actually looks
      at rather than only on the accounts screen it has no reason to open. A
      Playwright test over a household that answered the SPENDING ring for a
      savings statement asserts that account appears among the counted accounts
      with its row count, that the copy naming it is present in all three
      catalogues, and that the same copy links to the accounts screen where the
      ring is changed. The test is the mirror of witness ONE and it exists
      because criterion 15.9 names this answer as the mistake the product
      cannot otherwise catch; a phase that surfaces only the correct answer has
      built the easy half."
    analysis: >-
      The reversal made this worse rather than better, and honestly so, because
      DR-0030 traded a refusal for an answer. That trade is the owner's and it
      is right for the reasons the record gives. What does not follow from it is
      leaving the wrong answer invisible. Every ingredient is already in the
      phase: the accounts screen lists each account with its ring, the held-rows
      element already groups rows by account for the month, and criterion 15.9
      already knows which answer is dangerous. What is missing is that the
      dangerous one is the one that renders nothing.
  - id: R3-005
    severity: medium
    evidence:
      - >-
        The fourth sweep for the defect shape this plan has now carried three
        times, a criterion resting on evidence that cannot exist in the phase's
        own tree, finds a fourth instance in a criterion added this round.
      - >-
        Criterion 14.14 witness TWO reads: "over a household whose accounts are
        ALL pot accounts, every field of MonthFigures is byte identical to the
        values the verification-first step captured from the phase base ... and
        listGapRows returns the same rows it returned at the base."
      - >-
        Step 1 captures four baselines and the listGapRows output for an
        all-pot household is not among them. Baseline ONE is "the full
        MonthFigures of a household whose accounts are ALL pot accounts over a
        committed fixture". Baseline THREE captures "whether listGapRows returns
        them" for a DIFFERENT household, the one with an imported reserve
        statement. Baseline TWO is the navigation geometry and baseline FOUR is
        the mod-97 measurement.
      - >-
        So "the same rows it returned at the base" for the all-pot household is
