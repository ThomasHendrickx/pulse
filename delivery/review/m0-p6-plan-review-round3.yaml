    concrete-edit: >-
      Add to M3-P14's ACCEPT step: "AND THE ONE CASE THE REVERSAL REOPENS. A
      file that carries no own-account column can now be declared in the
      reserve ring, producing an account with role RESERVE and no account
      number, which sits in no declared set
      (src/modules/ledger/domain/ledger-transaction.ts:57 through :62) and
      which the per-household uniqueness constraint cannot deduplicate because
      Postgres does not collide NULLs. The confirm path therefore refuses the
      reserve ring for a declaration carrying no account number, with the same
      named-error shape as the missing-ring refusal of criterion 14.11 witness
      TWO, and the copy says a card is a spending account whose statement is
      imported, which is what decision D-48 already tells the owner on the
      accounts screen." Add to criterion 14.11 witness TWO: "and the same
      application test asserts a declaration naming the reserve ring with no
      account number is refused with a named error, because such an account
      would sit in no declared set, would hold its rows forever, and would be
      duplicated rather than adopted on the next upload of the same file."
    analysis: >-
      This is a hole the earlier plan closed for the wrong reason and reopened
      by removing that reason. The refusal was there to stop reserve statements
      being imported; it also happened to stop a numberless reserve account
      being created, and the reversal took both. The consequence is small in
      probability and unbounded in effect: an account Pulse can never match,
      never deduplicate and never correct into anything useful, whose rows are
      held with no way for the household to learn that holding them is not what
      they wanted.
  - id: R3-007
    severity: medium
    evidence:
      - >-
        Criterion 14.15 witness TWO requires the accounts screen to give "the
        count of imported rows held for it". Nothing in that phrase bounds the
        count to a month, and "imported rows held for it" reads as all of them.
      - >-
        Decision D-60 forbids exactly that shape: "no figure anywhere is
        accumulated across months", and criterion 14.15 witness FIVE enforces
        it with "a grep asserts no read in the overview module sums outside the
        requested period".
      - >-
        The guard cannot see the thing. The accounts screen is the accounts
        module (M3-P14 files-to-touch: src/modules/accounts/ui/ and
        src/modules/accounts/adapters/account-repository.ts), and the grep is
        scoped to the overview module. An all-time held count read by the
        accounts repository is outside it.
      - >-
        The two readings have different consequences and the criterion picks
        neither. Month-scoped: the accounts screen shows a number that changes
        as the household browses months, on a screen with no month control,
        which reads as a property of the account and is not one. All-time: it
        is an accumulated figure of exactly the kind D-60 exists to forbid,
        and the household will read a count of held rows as a proxy for how
        much is in savings, which is the misreading DR-0030's whole argument is
        about.
    concrete-edit: >-
      Replace criterion 14.15 witness TWO with: "TWO, THE ACCOUNTS SCREEN SAYS
      SO, AND SAYS IT WITHOUT A NUMBER THAT LOOKS LIKE A TOTAL. The account's
      row on the accounts screen names it as an account whose rows are held and
      states that its statements are kept but counted in no month, with no
      accumulated count and no amount, so nothing on that screen can be read as
      how much is in savings, which is decision D-60. The per-month count lives
      on the month view, where a month is what is being shown, and criterion
      14.15 witness ONE bounds it to the requested period." And widen witness
      FIVE's grep from "no read in the overview module" to "no read in the
      overview module or the accounts module", so the guard covers both screens
      the phase touches.
    analysis: >-
      D-60 is the best thing the reversal added: it names the boundary that
      keeps an accepted statement from becoming a savings dashboard built on the
      wrong arithmetic. It is undercut by one clause in a sibling criterion
      asking for a count with no period on a screen with no month, and by a
      guard whose grep stops at the module boundary the count sits on the far
      side of.
  - id: R3-008
    severity: medium
    evidence:
      - >-
        Criterion 14.15 witness THREE requires "over a household holding BOTH a
        held row on a reserve account AND a null-flow row on a pot account, the
        two render in different places with different copy, the pot row under
        recon-cause-uninterpreted and the reserve row under held-rows, and a
        test asserts neither string appears in the other's element".
      - >-
        "Neither string" has two readings. Read as the COPY string, the test
        asserts the two blocks carry different wording, which is true of any
        implementation that writes two different sentences and catches nothing.
        Read as the ROW's rendered text, it asserts the two rows do not appear
        in each other's element, which is the assertion that matters.
      - >-
        Only the second reading catches the failure finding R3-002 describes: a
        held read written as "flow IS NULL" with no ring filter returns the POT
        account's genuine gap as well, so that row renders under held-rows AND
        under recon-cause-uninterpreted. Under the copy reading, both blocks
        still carry different wording and the test is green.
      - >-
        The stake is that held-rows renders outside the reconciliation panel
        beside a verdict criterion 14.15 witness ONE requires to read as books
        closing, so a genuine gap listed there is a gap described to the reader
        as a normal state.
    concrete-edit: >-
      Replace the last clause of criterion 14.15 witness THREE with: "and a
      test asserts, by transaction, that the row on the pot account appears
      under recon-cause-uninterpreted and NOT under held-rows, and that the row
      on the reserve account appears under held-rows and NOT under
      recon-cause-uninterpreted, keyed on each row's own rendered identity and
      not on the two blocks carrying different wording, which any
      implementation satisfies. A held read written without a ring filter
      returns both rows and fails here, and this is the assertion that catches
      it."
    analysis: >-
      One word carrying two meanings, in the assertion that is the last line of
      defence for the read finding R3-002 says the plan has not specified. The
      weaker reading is the one an implementer under time pressure will take,
      because it is the one that passes first. Naming what is compared costs a
      clause and turns the witness into an instrument.
