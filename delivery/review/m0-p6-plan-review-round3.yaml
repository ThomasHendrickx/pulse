    analysis: >-
      This is the item the dispatch asked me to watch for and it is the one
      the phase absorbed without naming. It is not scope creep in the bad
      sense, because the block cannot exist without it and the block is what
      DR-0030 bought; it is scope creep in the dangerous sense, which is
      unnamed work with two criteria pointing in opposite directions about
      whether it is allowed to exist. The resolution costs one sentence and
      turns a contradiction into a design note, and the design note is worth
      having on its own, because keying the read on the ring rather than on
      the flow is the thing that keeps the enumeration in 14.11 meaningful for
      whoever adds a read next.
