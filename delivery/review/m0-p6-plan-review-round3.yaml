        is not a card account, so settlement matching at
        src/modules/ledger/domain/classify-flow.ts:83 never sees it and the
        card's settlement debit stays aggregate SPEND.
      - >-
        prisma/schema/accounts.prisma:28 declares @@unique([householdId, iban])
