      recompute exactly once and writes no transaction row." Add hazard class
      H14.14: "The phase is written for a household that starts at setup, so a
      household that already imported finds its rings frozen by a rule it
      never had a chance to answer, on a screen that was removed, with no
      criterion describing what it sees", addressed-by criterion 14.12a.
    analysis: >-
      Setup-first is a clean design for a household that does not exist yet
      and the plan reasons entirely about that household. The one household
      that certainly exists, and whose data the phase's own root cause is
      measured on, arrives at this phase with every account already declared
      and every ring already frozen. That is not a migration problem in the
      database sense, since the migrations note is correct that no column
      changes; it is a product problem, and the shape change made it worse by
      deleting the screen where a wrong ring used to be answerable and by
      adding a rule that locks the answer for exactly the accounts that have
      rows.
