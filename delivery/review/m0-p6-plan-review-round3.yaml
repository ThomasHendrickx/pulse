      - >-
        Such an account sits in NO declared set:
        src/modules/ledger/domain/ledger-transaction.ts:57 through :62 takes
        the RESERVE branch, finds no iban and continues, so it is absent from
        reserveIbans, potIbans, potAccountIds and cardAccountIds. Its rows are
