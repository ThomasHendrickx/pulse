  - id: APR-M0P9-01
    severity: high
    evidence:
      - "delivery/plan/pulse-v02.yaml:7485, criterion 12.7 first sentence: 'the test compares the set of (transactionId, merchantId) pairs recompute produces BEFORE the re-derivation with the set it produces AFTER'."
      - "Word search over the stored criterion text: 'baseline' occurs once, in 'rows written under the baseline derivation'; 'written against' 0 occurrences; 'own key' 0 occurrences. The criterion never says which key space the before set is read under."
      - "/home/user/wt-m3p12/src/modules/merchants/application/rederive-rules.ts:337 through :350, comment on keyForRule, recording fix round two finding HZ-M3P12-R2-03 as a measured fact: 'the before-set came back EMPTY, the lost-assignment set was empty by construction, and the lost-assignment half of the exit code could not be reached at all, while the run still wrote and still recomputed.'"
      - "The same file at :811 computes assignmentsBefore as assignmentSet(rows, before) with NO key argument, which at :374 through :378 reads each rule under keyForRule, that is, an un-namespaced pattern under the pre-phase normalised-descriptor key and a namespaced pattern under the identity key. That per-rule reading is the only reason the before set is non-empty, and it appears nowhere in the criterion."
      - "The shipped recompute resolves through the shipped matcher, which is handed identity keys only, so a before set literally produced by 'recompute' over a seed of baseline-derivation rules is empty for every un-namespaced rule."
    concrete-edit: >-
      Insert into criterion 12.7, immediately after the first sentence and
      before 'THAT SUPERSET PROPERTY HAS EXACTLY ONE ADMITTED EXCEPTION':
      "THE BEFORE SET IS NOT WHAT THE SHIPPED RECOMPUTE PRODUCES, and the
      criterion fixes it here because a before set read under one key space is
      empty by construction and makes every clause below vacuous. Each stored
      rule is read under the key space its own pattern is written against: a
      pattern carrying no known namespace against the pre-phase normalised
      counterparty key, a namespaced pattern against the identity key, with the
      matcher's own tie-break applied within each space. A test asserts, over a
      seed of un-namespaced rules, that the before set is NON-EMPTY and that its
      size equals the number of rows those rules reached under the pre-phase
      key, so an implementation whose before set is empty is red here rather
      than green everywhere."
    analysis: >-
      This is the amendment's own structural defect, one level below the one it
      repairs. The criterion now defines the EXCEPTION with great care and
      leaves undefined the SET the exception is an exception to. An
      implementation that reads the before set with the shipped recompute
      satisfies every word of criterion 12.7 as written, produces an empty
      before set over a seed of baseline rules, reports no loss for any input,
      exits 0 always, and passes the biconditional vacuously for every row. The
      code already carries the right reading, and it carries it in a comment
      citing a fix-round finding, which is precisely the shape the amendment's
      own opening sentence says caused four rounds of re-derivation.
  - id: APR-M0P9-02
    severity: high
    evidence:
      - "Criterion 12.7 names two published relations and verifies one: 'a test checks every published claimant pair against the seeded table, that the claimant is a rule of the same kind whose pattern is exactly the namespaced form of the superseded rule's pattern'. There is no corresponding sentence for the promotion relation."
      - "The licence itself reads BOTH relations. Criterion 12.7: 'the rule holding the row AFTER the run must BE that specific claimant, or must be the rule carrying that claimant's own promotion into the account key space'."
      - "/home/user/wt-m3p12/src/modules/merchants/application/rederive-rules.ts:436, lineageRoot(ruleId) = promotionSource.get(ruleId) ?? ruleId; :852 through :857, the exemption is lineageRoot(after.ruleId) === claimantOfHeld. The promotion map is the second and unverified branch of the licence."
      - "The only merchant guard on that map lives in the code and not in the criterion: rederive-rules.ts:695 refuses the promotion when collision.merchantId !== rule.merchantId, and :746 records promotionSource only past that guard. Criterion 12.7 nowhere requires a promoted rule to carry its source rule's merchant."
      - "The shipped test's promotion check is existence only: test/property/rederive-loss-reporting.test.ts:299, expect(promotableIds.has(link.sourceRuleId)).toBe(true)."
    concrete-edit: >-
      Replace the sentence beginning 'THE PUBLISHED LINEAGE IS NOT
      SELF-CERTIFYING EITHER' with: "THE PUBLISHED LINEAGE IS NOT
      SELF-CERTIFYING EITHER, AND BOTH RELATIONS ARE CHECKED, because the
      licence reads both and a verification covering one of them leaves the
      other as the escape hatch. A test checks every published claimant pair
      against the seeded table, that the claimant is a rule of the same kind
      whose pattern is exactly the namespaced form of the superseded rule's
      pattern. A test checks every published promotion pair the same way: the
      source rule is a descriptor-namespaced rule the run could promote, the
      promoted rule carries the SAME merchant id as its source rule, and its
      pattern is the account namespace followed by the single trusted compacted
      account carried by every row the source rule matched under the pre-phase
      key. A run that publishes a promotion pair failing any of those does not
      meet this criterion, and a run that licenses a change through a pair it
      published but did not make is the same defect as inventing a claimant."
    analysis: >-
      This is round four's defect surviving one relation over, and it is exactly
      the shape H12.31 names. Take an implementation that records a promotion
      link whenever a rule already holds the account pattern computed from a
      source rule's rows, without the merchant guard the shipped code happens to
      apply. Row R resolved through superseded rule S carrying merchant M1; S's
      claimant is C carrying M2; the account pattern for R's account is already
      held by an unrelated rule X carrying M3. The run publishes the promotion
      pair X to C, the licence fires because lineageRoot(X) equals C, R comes out
      of the run carrying M3, no loss is reported and the exit is 0. Every word
      of criterion 12.7 is satisfied. This is the plain answer to the brief's
      third question: yes, a run can still license a change by publishing a
      relationship that is not the relationship that happened, because the
      relation that grants the licence in the harder half of the exemption is
      the relation nothing checks.
  - id: APR-M0P9-03
    severity: high
    evidence:
      - "Criterion 12.7 requires exactly three counted shapes: 'a row whose merchant does not change at all, a row whose coverage ends at nothing, and a row that ends held by a rule which is neither the claimant nor the carrier of the claimant's promotion'."
      - "None of the three is a LICENSED change. The biconditional's right-hand side is 'the merchant it carried before the run differs from the merchant it carries after AND that change is not licensed by the published lineage'; the conjunct 'not licensed' is exercised by no counted shape."
      - "Worse, all three counts are reachable in worlds containing NO claimant at all. Shape three is phrased as 'neither the claimant nor the carrier of the claimant's promotion', which every rule satisfies when no claimant exists; shape two needs only a declined promotion; shape one is the common case. The shipped generator makes the claimant optional: test/property/rederive-loss-reporting.test.ts:85 through :88, claimant: fc.option(..., { nil: undefined })."
      - "The one clause that does demand a claimant is not counted: 'The generated worlds include one in which a superseded rule's rows SPLIT across the two bases' carries no assertion, so unlike the three shapes it is not red when the generator cannot reach it. A split world also does not imply a licensed change, since a same-merchant claimant short-circuits before the licence is consulted (rederive-rules.ts:824 through :826)."
    concrete-edit: >-
      Replace 'how many exhibited each of three shapes, prints the three counts
      and asserts each one is greater than zero' with 'how many exhibited each
      of FIVE shapes, prints the five counts and asserts each one is greater
      than zero', and replace the list of three with: "a row whose merchant does
      not change at all; a row whose coverage ends at nothing; a row that ends
      held by a rule which is neither the claimant nor the carrier of the
      claimant's promotion; A ROW WHOSE MERCHANT CHANGES AND WHOSE CHANGE IS
      LICENSED BECAUSE IT ENDS HELD BY THE CLAIMANT ITSELF; and A ROW WHOSE
      MERCHANT CHANGES AND WHOSE CHANGE IS LICENSED BECAUSE IT ENDS HELD BY THE
      RULE CARRYING THAT CLAIMANT'S PROMOTION. The last two are the exception
      this criterion exists to admit, and a generator that reaches neither
      leaves the words AND THAT CHANGE IS NOT LICENSED unexercised, so a run
      that reports EVERY change as a loss, which is round two's defect exactly,
      passes the biconditional and all the other counts."
    analysis: >-
      The amendment's stated purpose is to stop the fourth oscillation by
      pinning the exception. The test it mandates does not require the exception
      to be exercised even once. The three counted shapes are the three failure
      witnesses of rounds two, three and four restated; the shape that is new in
      this amendment, the licensed change, is the one shape no count demands.
      A generator that never builds a claimant satisfies all three counts, and
      against such a generator the biconditional collapses to 'reported if and
      only if changed', which is round two's implementation. This is the plain
      answer to the brief's second question: the three shapes are not the right
      three, and the fourth and fifth shapes the biconditional covers are the
      two the exception is made of.
  - id: APR-M0P9-04
    severity: high
    evidence:
      - "Criterion 12.7 gives the biconditional's two terms no definition a test can compute independently: 'the merchant it carried before the run' and 'licensed by the published lineage as defined above'. 'As defined above' is the production predicate."
      - "/home/user/wt-m3p12/src/modules/merchants/application/rederive-rules.ts:352 through :360 exports assignmentSet and identityKeyOfRow with the comment 'EXPORTED FOR THE PROPERTY TEST ... it must ask that question the way the routine asks it or the two are not comparing the same thing'."
      - "test/property/rederive-loss-reporting.test.ts:223 computes the before term as assignmentSet(seed.rows, seed.rules), the module under test's own function, and :260 through :263 computes licensed as (sourceOf.get(nowHeldBy.ruleId) ?? nowHeldBy.ruleId) === claimant, which is a line-for-line restatement of the production predicate at rederive-rules.ts:436 and :852 through :857."
      - "The same phase already carries the vocabulary that forbids this, at criterion 12.4: 'A mapping transcribed from counterpartyIdentity's own output does not meet this criterion, because it would certify the function against itself.' Criterion 12.7 does not use it."
      - "Fleet environment warning 24: 'when a check and the thing it checks can fail together, the check proves nothing'."
    concrete-edit: >-
      Append to the biconditional sentence: "BOTH SIDES OF THE BICONDITIONAL ARE
      COMPUTED FROM THE GENERATED WORLD AND NEVER FROM THE ROUTINE. The merchant
      a row carried before and after is decided by the generator's own record of
      which rule was intended to hold which row, or by a resolver written in the
