      the test's own reading of the published lineage. A test that imports the
      routine's assignment-set helper, its identity-key helper or its lineage
      predicate to compute either side does not meet this criterion, for the
      reason criterion 12.4 already gives: it would certify the function against
      itself, and this predicate has been wrong three times in a row."
    analysis: >-
      This is the brief's question about decidability, and the answer is that
      the biconditional is decidable but the criterion permits, and the shipped
      test takes, the degenerate reading in which the test restates the
      implementation. With licensed computed by the same expression the filter
      uses, the property reduces to asserting that the filter equals itself, and
      the only residual content is whichever way assignmentSet happens to read
      the before set, which finding APR-M0P9-01 shows is itself unspecified. Two
      unspecified things checked against each other is the exact instrument this
      fleet's warning 24 was written about.
  - id: APR-M0P9-05
    severity: medium
    evidence:
      - "Criterion 12.7 states the cost of its deliberate over-report as one flag: 'A row that ends at the claimant's merchant through an unrelated rule is reported too, and that over-report is deliberate rather than sloppy, because it costs one flag while its opposite is a row changing hands in silence.'"
      - "Constructed against the shipped mechanism. Seed: rule S, EXACT, un-namespaced pattern P, merchant M1, the pre-deploy naming. Rule C, EXACT, descriptor-namespaced P, merchant M2, the deploy-window renaming. Rule U, EXACT, an account-namespaced pattern, merchant M2, the deploy-window naming of the same counterparty's account group. Rows: R1 whose descriptor normalises to P and which carries the trusted account U names, and R2 whose descriptor normalises to P and which carries no account."
      - "Pass one supersedes S with claimant C (rederive-rules.ts:601 through :609). Pass two declines C's promotion, because not every row C matches under the pre-phase key carries a trusted account (:665 through :674, outcome not-promoted-untrusted-account), so no promotion link is recorded for C."
      - "Before set: R1 and R2 both held by S at M1. After set: R2 held by C at M2, licensed; R1 held by U at M2, lineageRoot(U) is U and not C, so R1 is a LOST assignment, it blocks, and it clears only through the acknowledge path."
      - "Under the deployed code and the pre-migration table, R1 already resolves through U to M2 and R2 already resolves through C to M2, so the run changes neither row and the reported loss is of a merchant R1 never carried."
      - "The mixed-basis group is not exotic: criterion 12.1 requires the phase's own fixture to carry at least 8 account-basis and at least 8 descriptor-basis rows, and criterion 12.15 prescribes naming both halves of a split group with the same merchant name as the owner's recovery path."
      - "The cost is not one flag. Phase M3-P16 criterion 16.2 (delivery/plan/pulse-v02.yaml:10583) requires, for every rule id any invocation carried under --accept, the blocking condition it was reported under by an invocation made WITHOUT --accept, that invocation's exit code, and the owner's acceptance of each id by reference to a dated work-history entry. M3-P16 hazard H16.3 is the hazard that the acknowledge flag gets used rather than read."
    concrete-edit: >-
      Replace 'because it costs one flag while its opposite is a row changing
      hands in silence' with: "because its opposite is a row changing hands in
      silence. WHAT IT COSTS IS STATED RATHER THAN ESTIMATED, because it is not
      one flag: the shape reaches an ordinary run, where a mixed-basis group
      declines the claimant's promotion and the account half of that same
      counterparty is held by the owner's own later naming, and clearing it
      costs a blocked migration plus the whole acceptance ceremony criterion
      16.2 imposes, which is an owner decision recorded in the work history.
      SO THIS OUTCOME IS ITS OWN CLASS AND IS NOT A LOST ASSIGNMENT: a row that
      ends at the CLAIMANT'S OWN MERCHANT through a rule outside the lineage is
      REPORTED, PRINTED AND COUNTED under its own name, and exits 0; only a row
      that ends at a merchant the claimant does not carry, or at nothing,
      blocks. A run that reports the two under one name does not meet this
      criterion, because it spends the acknowledge path that hazard H16.3
      exists to keep expensive on the outcome that is not a loss."
    analysis: >-
      This is the brief's first question from the false-loss side, and the
      answer is yes: the exception rejects a legitimate case, and the case is
      the mixed-basis group the phase exists to serve rather than a corner.
      Round two's defect is reporting losses that had not happened; the
      construction above is that defect, narrowed to one shape and made
      deliberate. Making it deliberate is defensible. Calling it one flag is
      not, because criterion 16.2 turns every accepted rule id into an owner
      conversation, and an over-report that trains the operator to reach for
      --accept is the direct feed for H16.3. An alternative fix the plan may
      prefer, and it should choose one rather than leave both open: extend the
      licence with a third published relation, the rule already holding the
      account pattern of a row the claimant matched under the pre-phase key and
      carrying the claimant's merchant, verified against the seed exactly as
      APR-M0P9-02 requires of the promotion relation.
