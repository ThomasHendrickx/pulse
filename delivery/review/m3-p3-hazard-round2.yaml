findings:
  - id: HZ2-M3P3-01
    severity: high
    evidence:
      - "The settlement double count that finding HZ-M3P3-01 named is fixed only for a card import that carries a stored figure. Every card import whose source prints none keeps the row-sum derivation at src/modules/ledger/domain/ledger-transaction.ts:144, and that derivation is wrong by exactly any ordinary merchant refund, which is the whole reason this round exists."
      - "DEMONSTRATED, pure domain, invented values, one month interpreted twice. Case A, the stored figure present: the account-side direct debit classifies INTERNAL, one settlement link is made, no leg is left unmatched, and the identity closes. Case B, the SAME transactions with no stored figure: the flows come back r1:SPEND r2:SPEND r3:SPEND r4:SPEND d1:SPEND m1:INTERNAL, zero settlement links, the card-side mirror is left as an unmatched internal leg, the month's spend total is exactly TWICE the true figure, and the books do not close by exactly the settlement figure."
      - "It is reachable on the product's other card path, not only in theory. A card account is a pot account with no IBAN (src/modules/ledger/domain/ledger-transaction.ts:62), and the tree ships four delimited card-export fixtures whose layout carries no IBAN column, so a household importing card statements as delimited exports declares exactly such an account. A delimited parse never sets the figure: only the PDF path does (src/modules/import/domain/parse-pdf-statement.ts:113)."
      - "It is also reachable for any card import made before this column existed, which the migration comment asserts is an empty set. That assertion is about the deployed database and nothing in the round measures it: prisma/schema/migrations/20260822070000_import_settlement_total/migration.sql:14 states existing rows are pre-PDF-card imports without a captured check behind it."
      - "The round documents the fallback as correct for exactly the case where it is wrong. prisma/schema/migrations/20260822070000_import_settlement_total/migration.sql:12 says every delimited export leaves the column null and the ledger keeps its documented row-sum fallback for exactly that case, and the summariser's own corrected comment at src/modules/ledger/domain/ledger-transaction.ts:88 calls the row-sum arm the fallback it was always described as. Neither says that for a delimited CARD export with a refund the fallback is the number this round proved wrong."
      - "The reason the round gives for not deriving the figure does not apply to the derivation that would fix this. DEV-M3P3-01 at delivery/work-history/m3-p3.yaml rejects deriving it from the balances, because that holds only while the settlement credit cancels the previous balance. Netting the LINE ITEMS is a different derivation and is the definition of the printed figure under that same ordinary condition, while the current fallback is wrong under every condition once a refund exists."
    concrete-edit: >-
      Change the fallback at src/modules/ledger/domain/ledger-transaction.ts:144
      from the magnitude of the debit rows to the NET of the statement's line
      items excluding the settlement credit, which is what the printed figure
      is; keep the stored figure winning wherever there is one. Add the
      mirror of this round's own red witness on the delimited path: a card
      fixture with one refund row and a companion debit equal to the net, and
      assert the debit classifies INTERNAL and links. Then correct
      prisma/schema/migrations/20260822070000_import_settlement_total/migration.sql:12
      and the summariser comment so neither says the fallback covers a
      delimited export without saying under what condition. Finally, either
      capture the check behind the migration's claim about existing rows or
      soften the sentence to what was actually verified.
    analysis: >-
      Filed high, the same severity round 1 gave the same defect, because it
      is the same defect on a path the round did not close and did not
      record as open. It is mitigated by being LOUD: the month does not
      close, so the owner sees a reconciliation gap rather than a quietly
      wrong total, and I say so plainly. It is not mitigated by rarity: a
      refund on a card statement is ordinary, and the delimited card export
      is the path v0.1 shipped.
  - id: HZ2-M3P3-02
    severity: high
    evidence:
      - "Account identity is now the printed identifier string taken VERBATIM, and the template says so: the value is captured by the pattern at src/modules/import/domain/kbc-mastercard-template.ts:121, returned unchanged at src/modules/import/domain/kbc-mastercard-template.ts:180, and placed in the profile spec, where equality is byte equality over canonical JSON (src/modules/import/domain/source-profile.ts:294)."
      - "The pattern deliberately tolerates separator and glyph variation, so ONE physical card printed or extracted five different ways yields five different identities. DEMONSTRATED, invented values, output verbatim: DISTINCT IDENTITIES FOR ONE CARD: 5 (1 would be correct), and specEquals false for all ten pairs of those five. A control with two genuinely different cards also returns false, so the discrimination the round wanted is intact; what is missing is the normalisation that stops one card being many."
      - "This is not a hypothetical variation. The phase's own grounding records that extraction word spacing on these documents is tolerance-sensitive, and the line reconstructor decides word gaps against a numeric threshold, so a hair of kerning difference between two statements of one card flips a separator in or out of the captured string."
      - "The consequence is a NEW ACCOUNT, with no way to refuse it. When a card file's spec matches no stored profile the only branch available creates one: src/modules/import/application/confirm-import.ts:96 calls declareAccount, and declareAccount is an unconditional create (src/modules/accounts/application/index.ts:30). There is no path in the confirmation flow that binds a card file to an account that already exists, and the accounts table constrains uniqueness on IBAN only, which a card account does not have."
      - "A second account is a second dedup scope, so the same facts are stored twice. The key tuple begins with the account id (src/modules/import/domain/dedup.ts:39) and the uniqueness index is per household on the key. DEMONSTRATED: same file, two accounts: 3 keys each, 0 shared, so insert-ignore stores 6 rows for 3 facts. The month then counts the same card statement twice."
      - "The round therefore traded one silent failure for another. Round 1's HZ-M3P3-02 was two cards collapsing into one account; the shape introduced here is one card splitting into two accounts, and the second is the direction that double counts. The reissue case the brief names lands the same way: a card reissued with a new number and the same account continuing has no way to continue on that account."
    concrete-edit: >-
      Normalise the captured value before it becomes an identity: strip
      spaces and hyphens and fold the mask glyphs to one form, inside
      src/modules/import/domain/kbc-mastercard-template.ts:180, so the
      identity is the digits and the mask positions rather than the
      typography. Pin it with a test that the printings of one card give ONE
      identity and that two different cards still give two, which is the
      pair this round's own second-card witness only covers one half of.
      Separately, and this is the reissue half rather than the normalisation
      half, give the confirmation flow a way to bind a card file to an
      existing account instead of always creating one; until that exists a
      reissued card cannot continue on its account by any route.
    analysis: >-
      High because the harm is a silently doubled month, because the trigger
      is outside the household's control, and because the product offers no
      recovery once the second account exists. The normalisation half is a
      few characters and closes the accidental split entirely. The binding
      half is a real piece of work and I raise it as the thing the identity
      change makes necessary rather than as something this round should have
      built; what should not stand is the current state, where the only
      answer to a changed printing is a duplicate account.
  - id: HZ2-M3P3-03
    severity: medium
    evidence:
      - "The round's own privacy measurement is recorded as complete and is not. DEV-M3P3-06 at delivery/work-history/m3-p3.yaml:326 states that exactly TWO bare place tokens coincide with the real documents, one with each, both inside otherwise invented merchant descriptors in fixtures that PREDATE this round, and that they were LEFT ALONE."
      - "MEASURED HERE, by taking every capitalised token of four characters or more out of the PUBLIC tree and asking the two real documents whether it occurs. Over the files this round adds or modifies: 484 distinct candidate tokens, 44 coincide. Over the whole tree: 1407 candidates, 66 coincide. Almost every one of the 66 is Dutch banking vocabulary or an English code word, which is the bank-controlled layout vocabulary the round sanctions and which I agree is sanctioned."
      - "Three of them are place tokens, not two, and the distribution is not one per document: two coincide with the same one. The round's sweep could not have seen the third, because it probed multi-word capitalised runs and this is a single token, but DEV-M3P3-06 separately reports a bare-token result and that result is the one that is incomplete."
      - "The tokens are not confined to fixtures that predate this round. All three PDFs this round newly commits carry at least one of them, and one carries two. Checked byte by byte against the three added files test/fixtures/kbc-statement-refund.pdf, test/fixtures/kbc-statement-second-card.pdf and test/fixtures/belfius-settlement-companion-refund.pdf; every one is positive. So the round did not leave those tokens alone: it re-published them into three new binary artefacts."
      - "The round also authored a NEW descriptor line carrying one of them, at test/fixtures/generate-pdf-fixtures.ts:761, after stating in the same deviation that for new content the measured-absent choice is free and that it had already changed the one authored row which picked such a token up. It changed one and wrote another."
      - "I judge the disclosure itself small and I say so: the merchant halves of these descriptors are invented and are long-standing house vocabulary in this tree, and a bare city token beside an invented merchant identifies nobody. The finding is the FALSE COMPLETENESS of a measurement the orchestrator will otherwise rely on to close hazard H3.1, which is raised loudly under clause R-087 rather than as a note."
    concrete-edit: >-
      Correct DEV-M3P3-06 at delivery/work-history/m3-p3.yaml:326 to the
      measured count and the measured per-document distribution, and drop the
      sentence saying the tokens sit only in fixtures that predate the round,
      naming the three added files instead. Re-generate those three fixtures
      with place tokens measured absent from both documents, which is a
      one-word change per row in the generator because the PDFs are built
      from it rather than hand-written, and change the authored line at
      test/fixtures/generate-pdf-fixtures.ts:761 in the same pass. Add the
      single-token sweep to the method the work history records, beside the
      multi-word run sweep, so the next round measures both classes.
    analysis: >-
      Medium rather than high because I could construct no disclosure from
      what is there, and the round's own reasoning about bare city tokens is
      sound. It is not low because this is the exact file class in which this
      project has already lost two rounds, because the round set itself a
      stricter standard for authored content and then missed it, and because
      a completeness claim that is wrong is worse than no claim: it is the
      sentence that stops the next person looking.
  - id: HZ2-M3P3-04
    severity: low
    evidence:
      - "The new column is declared a FACT of the imported document, in the schema comment at prisma/schema/import.prisma:71 and in the migration, and the fact-rewrite path does not rewrite it. applyReparse at src/modules/import/adapters/import-repository.ts:231 rewrites every other fact column of every touched row from the corrected re-parse and never writes the column, and its input type has no field for it."
      - "The corrected figure is in hand and discarded. fixSourceProfile re-parses the whole stored document under the corrected spec and reads only its rows (src/modules/import/application/fix-profile.ts:157), while the parse result it holds carries the re-parsed figure."
      - "NOT REACHABLE TODAY, and I say so rather than dressing it up. For a PDF layout the spec has exactly three fields, and the only one a re-parse will accept changing is the account identifier, which does not change the parsed figure; a changed template id or template version is refused whole and rewrites nothing. So the stale-figure state is closed by the accident that every parse-affecting spec field also fails the re-parse, not by design."
      - "The consequence if a future template ever gains a parse-affecting spec field is the harm of HZ2-M3P3-01 arriving through the repair path: rows rewritten to one reading of the document, the settlement figure still describing another, the account-side debit matching nothing."
    concrete-edit: >-
      Carry the re-parsed figure through applyReparse and write it in the
      same transaction as the rewritten rows, so the fact column is rebuilt
      by the same operation that rebuilds the facts it belongs to. If the
      intent is instead that this column is write-once for the life of the
      import, say that in the column comment at prisma/schema/import.prisma:71
      and add a test that a re-parse leaves it untouched, so the next reader
      finds a decision rather than an omission.
    analysis: >-
      Low because I could not reach it and I did try. Filed because a column
      that the schema calls a fact, sitting beside a path whose entire job is
      to rebuild facts from the same parse, and skipped by it silently, is
      the kind of asymmetry that is cheap to settle now and expensive to
      discover from a wrong month later.
  - id: HZ2-M3P3-05
    severity: low
    evidence:
      - "Three comments document the new column's range as positive integer cents: prisma/schema/import.prisma:71, src/modules/import/application/ports.ts:93 and src/modules/ledger/application/ports.ts:78. The value written can be non-positive: the template returns the negated closing balance at src/modules/import/domain/kbc-mastercard-template.ts:339, and the comment two lines above at src/modules/import/domain/kbc-mastercard-template.ts:336 acknowledges that a card standing in credit yields a non-positive total. Nothing on the way to the column rejects or clamps it."
      - "The same comment credits the wrong mechanism for the safety of that case: it says such a total matches no direct debit because of the candidate filter in the corrections module. Measured by mutation, the positive-total guard in that filter can be deleted with the whole fast gate still green, 408 of 408, because the filter's equality against a strictly positive magnitude already excludes every non-positive total. The guard is redundant and the sentence points at it."
      - "No fixture and no test anywhere exercises a card statement standing in credit, so the one state the round newly made reachable in this column is the one state nothing measures."
    concrete-edit: >-
      Pick one and pin it. Either validate at the write path that the stored
      figure is positive and fail the import loudly when a statement prints a
      credit balance, keeping the three comments true; or change the three
      comments to say signed integer cents and keep the candidate filter's
      positive-total guard as the deliberate thing that makes the sign safe,
      correcting the sentence at
      src/modules/import/domain/kbc-mastercard-template.ts:336 to credit the
      equality rather than the guard. Either way add one fixture for a card
      statement in credit, because that is now a state the column can hold.
    analysis: >-
      Low in consequence: I could construct no wrong number from it, because
      the equality that matters excludes the value anyway. Raised under
      clause R-087 because a documented range that the code can violate and a
      comment that credits a redundant guard are both present-tense claims
      nothing keeps true, and because the credit-balance statement is a real
      shape this round made storable and nobody measured.
