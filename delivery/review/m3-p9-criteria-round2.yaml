    discipline of this phase is that a pressed appearance is measured by pressing rather than reasoned
    about. This is a gap in the contract rather than a defect in the code, and it is the one that sits
    closest to the owner''s actual gesture.'
deviations-judged:
- deviation: 'Step 2 and the token entry in report-code-disagreement: "no further token is expected,
    with criterion 9.5 failing the phase if a literal duration, curve, colour or length reaches a rule
    instead."'
  serves-plan-intent: true
  reasoning: 'Exactly the nine named tokens were added and no tenth, which I verified by name at styles/tokens.css:207
    through :247. The five literals the entry discloses are four opacity values and one border-radius
    of 50 percent, and none of them is a duration, a curve, a colour or a length, which are the four
    things criterion 9.5 greps for; CLAUDE.md non-negotiable 4 names colours, font sizes and spacing.
    I re-ran both greps the entry quotes: the length grep returns the same four lines with the same
    declarations at HEAD and at a4f1a94, and the time and easing grep returns nothing and exits 1. The
    alternative would have been to add five tokens the plan''s own token entry says it does not expect,
    which would itself have been the larger deviation.'
- deviation: 'Step 5: "A disabled control changes to --color-surface-disabled and --color-ink-disabled
    and stops computing cursor: pointer."'
  serves-plan-intent: true
  reasoning: 'The opacity change is added BESIDE the two colour changes and the cursor change, not instead
    of them, and I confirmed all four in the shipped rule at src/app/globals.css:1520 through :1527.
