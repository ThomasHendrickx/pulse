- deviation: Criterion 9.9(e) ending TWO, a touch release AWAY from the control.
  serves-plan-intent: true
  reasoning: 'Measured rather than assumed, and the substitution keeps the ending being the ending it
    claims to be: a touchMove on a screen that scrolls is a scroll and a scroll is ending THREE, so
    driving ending two with a move would have collapsed two endings into one. Ending two now ends the
    touch at moved coordinates with no move event, which produces the pointerup this ending is and lets
