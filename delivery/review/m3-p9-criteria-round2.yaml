hazard-classes-addressed:
- class-id: H9.1
  probed: 'Whether the pressed rule is proved by a grep for :active rather than by a press. I read every
    assertion in the new spec and ran the suite: criterion 9.2(b) reads getComputedStyle with the pointer
    down against a HOVERING baseline taken at test/e2e/pressed-and-disabled.spec.ts:1277, and criterion
    9.9(b) samples every animation frame of a held CDP touch press. No selector grep stands in for a
    measurement anywhere in the phase.'
