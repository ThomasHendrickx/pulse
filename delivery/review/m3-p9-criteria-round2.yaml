findings:
- id: CR2-M3P9-01
  severity: high
  evidence:
  - 'src/app/globals.css:1469 through :1477 states, in a comment sitting directly above the pressed
    rule: "THE HALF THIS PHASE DOES NOT SHIP: nothing in the product sets the attribute yet, because
    setting it needs a client listener and criterion 9.7 pins this phase''s diff to two stylesheets,
    the Playwright config and one spec. The six lines that set it are written out verbatim in test/e2e/pressed-and-disabled.spec.ts,
    which installs them and then measures this rule under a real held touch press; M3-P10 opens the
    client boundary and is where they land in the product. Until they do, a finger reaches this appearance
    only where the engine grants :active to a touch."'
  - 'All three of its assertions are false at 6517703. The product DOES set the attribute: the listener
    is src/app/layout.tsx:72 through :98 and it is shipped at src/app/layout.tsx:109.'
  - 'The diff is NOT pinned to two stylesheets plus the config plus one spec: criterion 9.7(a) as amended
    permits src/app/layout.tsx by name at delivery/plan/pulse-v02.yaml:5063.'
  - 'The spec does NOT install the lines that set the attribute and must not: criterion 9.9(a) forbids
    it, and the criterion''s own grep over the spec returns three read-shaped lines and no write, run
    by me and captured above.'
  - The neighbouring comment at src/app/globals.css:1447 through :1463 IS up to date, so this is round-one
    text the amendment left behind rather than a whole stale block, which is why a reader will not notice
    it is stale.
  - THE SOURCE OF THE STALE COMMENT IS STILL LIVE IN THE WORK HISTORY. delivery/work-history/m3-p9.yaml:661
    through :674 is a deviation entry, not marked resolved, whose plan-clause reads "files-to-touch
    and criterion 9.7, which print no client script, so the pointerdown handler that sets [data-pressed]
    cannot ship in this phase" and whose body reads "THIS IS AN OPEN ESCALATION AND NOT A CLOSED DEVIATION",
    "the phase ships the stylesheet half, measures it under a real held touch press with the handler
