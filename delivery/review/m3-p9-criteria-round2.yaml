- id: CR2-M3P9-02
  severity: high
  evidence:
  - test/e2e/pressed-and-disabled.spec.ts:1513 through :1519 defines matchesSpec over testMatch only,
    and :1542 filters the hasTouch projects by matchesSpec(p.testMatch, file). Nothing anywhere in that
    test reads testIgnore.
  - 'Playwright 1.62.1, the version this suite runs, decides collection with BOTH: node_modules/playwright/lib/runner/index.js:2218
    reads "const isTest = !testIgnore(file) && testMatch(file);", and node_modules/playwright/lib/common/index.js:638
    falls a project''s testIgnore back to the top-level config testIgnore, so even a top-level change
    reaches the phone project.'
  - 'The mechanism is already present in the very file this check reads: playwright.config.ts:57 gives
    the chromium project a project-level testIgnore.'
  - 'CONSTRUCTED RATHER THAN REASONED ABOUT, per fleet warning 29. I copied matchesSpec and the filter
    verbatim into a scratch script and handed them a phone project carrying the shipped testMatch AND
    a testIgnore for this spec. Captured output: "shipped config -> GREEN: chromium-phone", "phone project
    testIgnored -> GREEN: chromium-phone", "phone project glob-narrowed -> RED: not collected".'
  - 'Criterion 9.9(a) states the property this check exists to buy, at delivery/plan/pulse-v02.yaml:5199:
    a later phase that widens or narrows testMatch "then REDDENS this spec under the projects that still
    collect it instead of silently emptying the phone project".'
  concrete-fix: 'Amend criterion 9.9(a)''s membership half to require the assertion to resolve COLLECTION
    rather than match a pattern, and change test/e2e/pressed-and-disabled.spec.ts:1513 through :1546
    to match. The minimum is to read each hasTouch project''s testIgnore as well as its testMatch and
    require !testIgnore(file) && testMatch(file), falling a missing project testIgnore back to the top-level
    config testIgnore and treating an ABSENT testMatch as the Playwright default that DOES collect this
    file rather than as no match. The form that cannot drift with Playwright''s own resolution order
    is to shell out to "npx playwright test --list --project=<name>" for every hasTouch project and
    assert this spec''s own file appears in the listing: that resolves the thing instead of matching
    words near it.'
  analysis: 'This is the shape-not-identity family the dispatch asked for, and it is the instance that
    matters, because this check is the one round two ADDED so the phone measurement could not be silently
    emptied. It validates the SHAPE of the config, whether a pattern textually contains this file''s
    name, rather than the IDENTITY of the fact it cares about, whether a touch project actually collects
    and runs this file. It also carries a second, quieter direction: a phase that removes testMatch
    from the phone project entirely, which makes the project collect MORE, turns this assertion red,
    so the check is wrong in both directions and only one of them fails safe.'
