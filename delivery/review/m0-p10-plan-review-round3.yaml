findings:
  - id: R3-001
    severity: medium
    evidence:
      - >-
        The criterion now states what each axis buys: "The second reserve
        account with a DISTINCT typed label kills grouping on the joined LABEL
        alone, which would otherwise merge two reserve accounts a household
        happened to give the same label into one line with their money summed."
      - >-
        Walked against the seed, that is not what kills it. With DISTINCT
        labels, grouping on the joined label AGREES with the correct read on
        every registered row: the first account's two rows group under its
        label, the second account's row under its own, exactly as a normalised
        grouping key would. Distinct labels make the two candidates coincide
        rather than separate.
      - >-
        What actually kills label grouping in this seed is the SAME axis that
        kills grouping on the joined identity: both unregistered rows carry a
        null joined label, so they collapse into one group and the count comes
        back three against four asserted. Remove the unregistered rows and
        label grouping is indistinguishable from the correct read over any
        number of accounts with distinct labels.
      - >-
        The harm the sentence names, "two reserve accounts a household happened
        to give the same label ... merged into one line with their money
        summed", is the case the seed EXCLUDES by construction, because the
        criterion requires the two typed labels to differ.
      - >-
        This is the third rationale sentence in this criterion to claim a
        discrimination the seed does not have, after the spaced-fixture premise
        and the joined-column third red. The protection is not affected: every
        candidate read named is red, including this one. What is wrong is the
        stated reason, in the one spot that has now been wrong twice before.
    concrete-edit: >-
      In criterion 14.2, replace "The second reserve account with a DISTINCT
      typed label kills grouping on the joined LABEL alone, which would
      otherwise merge two reserve accounts a household happened to give the
      same label into one line with their money summed" with: "The two rows
      naming UNREGISTERED counterparties kill grouping on the joined LABEL as
      well as on the joined identity, and by the same mechanism: both carry a
      null joined label and collapse into one group, three against the four
      asserted. Distinct typed labels do NOT separate label grouping from a
      normalised grouping key, because over registered rows the two agree; what
      the second reserve account buys is the PER-ACCOUNT SPLIT, that the read
      divides the household's registered reserve money between two accounts
      rather than pooling it under one entry, which is the assertion that the
      first registered group's total is the sum of its two rows while the
      second's is its single row. The merge this criterion warns of, two
      reserve accounts a household gave the SAME typed label summed into one
      line, is a state this seed excludes by construction and is left to the
      grouping key being pinned by the assertion on each group's own key
      rather than by a label collision the seed does not contain."
    analysis: >-
      Non-blocking, and it changes nothing an implementer builds: the seed, the
      assertions and every red are unaffected, because the criterion catches
      label grouping either way. It is worth an edit anyway, and worth it in
      this criterion more than in most, because a rationale that says which
      axis buys which kill is exactly what the next person trimming this seed
      will read before deciding which row is redundant, and a reader who
      believes the distinct labels are load bearing may drop an unregistered
      row and take three reds with it.
  - id: R3-002
    severity: low
    evidence:
      - >-
        The floor clause reads "the discovered set is asserted by EXACT
        EQUALITY against the producers known when it is written, so a discovery
        that finds nothing, or finds one where there are two, is RED rather
        than vacuously green".
      - >-
        It does not say the expected set is written by hand. An expected list
        derived from the walk itself, or from a second pass of the same
        discovery, satisfies "exact equality" and is a tautology that passes
        against any discovered set including the empty one, which is the state
        the clause exists to redden.
      - >-
        This phase already carries the idiom that closes it, used in criterion
        14.14 and in this criterion's own arithmetic clauses: "written into the
        test by hand from that captured output and never read back from the
        implementation".
    concrete-edit: >-
      In criterion 14.2, after "asserted by EXACT EQUALITY against the
      producers known when it is written", add: "that expected set being
      written into the test BY HAND and never derived from the walk or from a
      second pass of the same discovery, on the same terms this phase sets for
      every other recorded baseline, because an expected set computed by the
      code under test is an equality that holds against any discovered set
      including the empty one."
    analysis: >-
      One clause, in the phase's own established vocabulary, closing the only
      way the floor can rot into the vacuity it was added to prevent.
