  - id: PR6-013
    severity: medium
    evidence:
      - >-
        M3-P15 criterion 15.7 requires the control to show, before the change
        is applied, "the number of transactions it will reclassify and the
        amount that will move between the spend total and the reserves
        block", and a Playwright test that the shown amount is byte identical
        to the amount the totals actually move by.
      - >-
        For the case criterion 15.2 covers, an account LEAVING the pot, the
        rows on that account are cleared entirely (M3-P15 step 3), so they
        leave the spend total and enter NOTHING. The reserves block gains a
        different set of rows: the counterparty rows on the household's OTHER
        pot accounts, which move from INTERNAL to RESERVE by
        src/modules/ledger/domain/classify-flow.ts:62-68. Two distinct
        movements, and the criterion names one.
      - >-
        Nothing in the criterion requires the preview to be produced by the
        function that produces the totals. A hand-rolled query that sums rows
        whose counterparty account equals the account's number satisfies the
        byte-identity assertion on a simple fixture and diverges wherever the
        engine applies a correction: the settlement match at
        classify-flow.ts:80-98, the reserve drawdown at :62-68, the refund
        arm at :110-118, and the unmatched or in-transit leg accounting at
        src/modules/overview/adapters/overview-repository.ts:222-229.
    concrete-edit: >-
      Replace 15.7's first sentence with: "The correction control shows,
      before the change is applied, three quantities and not one: how many
      transactions ON the account will stop being counted at all, how much
      will move from the spend total into the reserves block (or the reverse
      direction for a correction into the pot), and how many merchant rules
      will stop matching. Each is produced by a DRY RUN of the same domain
      interpretation the recompute runs, over the proposed declaration set,
      writing nothing, never by a separate query. An application test asserts
      the preview equals the actual movement over a fixture that contains a
      settlement-matched card debit and a matched transfer pair as well as
      ordinary rows, so a preview computed by a second rule diverges rather
      than agrees."
    analysis: >-
      H15.6 is the hazard that the owner is offered a control that silently
      moves money with no statement of what will move. A preview that names
      one of two movements is a statement that is wrong in the case the
      sibling criterion 15.2 is built on, and the owner would be told an
      amount moved into reserves while a different amount silently left the
      books. Requiring the dry run rather than a query is what makes the
      preview and the outcome the same computation, which is what the step's
      own sentence, "neither number is an estimate", already claims.
