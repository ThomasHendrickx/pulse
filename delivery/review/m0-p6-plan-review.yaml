findings:
  - id: PR6-001
    severity: high
    evidence:
      - >-
        M3-P14 criterion 14.3 makes a later import of an already registered
        account ADOPT it ("the household holds exactly one account
        afterwards, that the ingested rows carry that account's id"), and
        names no ring. Registration reaches the RESERVE ring by criterion
        14.2. So "register the savings account, then upload its statement"
        becomes a supported path in this phase.
      - >-
        src/modules/ledger/application/interpret-window.ts:35-39 builds
        windowedAccountIds from sets.potAccountIds only, and
        src/modules/ledger/domain/ledger-transaction.ts:56-60 puts a RESERVE
        account in neither potAccountIds nor cardAccountIds, so rows on a
        reserve account are never loaded and never interpreted.
      - >-
        src/modules/overview/adapters/overview-repository.ts:230 counts
        every row with a NULL flow as uninterpretedCount with no account
        filter, and src/modules/overview/domain/month-projection.ts:208-213
        makes reconciles require uninterpretedCount === 0. The month
        therefore never closes again, for every month those rows fall in.
      - >-
        messages/en.json uninterpretedCause tells the owner "Pulse includes
        them when interpretation next covers the period, for example after
        the next import touching this account". For a reserve account that
        sentence is false forever: no import ever makes interpretation cover
        it.
      - >-
        The state is already reachable at the head and nothing measures it:
        test/e2e/month-view.spec.ts:1377 uploads a second file declaring a
        RESERVE account and the spec asserts nothing about the verdict, the
        uninterpreted count or the cause block.
      - >-
        No criterion in 14.1 through 14.10 mentions the verdict, the
        uninterpreted count or an import onto a reserve account, and no
        hazard class H14.1 through H14.9 names it. M3-P15 step 4 and
        criterion 15.3 fix it, and M3-P15 runs strictly AFTER M3-P14 by this
        phase's own conflicts-with entry.
    concrete-edit: >-
      Add criterion 14.11 to M3-P14: "AN IMPORT ONTO A REGISTERED RESERVE
      ACCOUNT DOES NOT LEAVE THE BOOKS OPEN FOREVER. A Playwright test
      registers a reserve account, then uploads a statement whose own account
      number is that account, and asserts the state the owner is left in.
      EITHER the confirm path refuses the import with a named error whose
      catalogue copy, present in all three catalogues, says a reserve
      account's statements are not imported in v1 and names correcting the
      ring as what changes that, and the existing reserve upload at
      test/e2e/month-view.spec.ts:1377 is updated in the same phase because
      it performs exactly this act today; OR the import is admitted and the
      test asserts the month view's verdict still reads as books closing and
      recon-cause-uninterpreted is absent, which requires the pot-scoping of
      uninterpretedCount that M3-P15 step 4 describes to be brought forward
      into this phase. The phase picks one and records which in a decision."
      Add hazard class H14.10: "A household registers a savings account and
      then uploads its statement, the rows land uninterpreted because
      interpretation loads pot accounts only, and the month never closes
      again while the cause copy promises a healing that cannot happen",
      addressed-by criterion 14.11.
    analysis: >-
      This is the dispatch's third attack and the answer is that the plan
      does not face it. Registering four reserve accounts and importing
      nothing is safe: no rows exist, so uninterpretedCount stays zero. The
      damage arrives one natural act later, and M3-P14 is the phase that
      makes that act frictionless: before it, a reserve account could only
      come into existence by declaring RESERVE at import time, which is a
      wrong answer on a form; after it, the owner has deliberately
      registered four savings accounts, has the statements, and the adoption
      rule of 14.3 quietly turns "upload them too" into rows on an account
      the engine will not look at. Every acceptance criterion of M3-P14 can
      be green in that state. The phase order makes this worse rather than
      better, because the fix lives in the phase that runs next.
  - id: PR6-002
    severity: high
    evidence:
      - >-
        M3-P15 criterion 15.1 reads: "registers a savings account in the POT
        ring by mistake, imports the M3-P14 fixture, records spend-total and
        reserves-net as strings, corrects the ring to RESERVE ... and asserts
        with no further upload that spend-total has fallen and reserves-net
        has risen by exactly the fixture's movements to that account".
      - >-
        The M3-P14 fixture is a CURRENT-ACCOUNT fixture (criterion 14.1: "one
        new invented current-account fixture whose rows carry transfers to
        seven distinct other accounts"), so the mis-declared savings account
        owns no rows in it; it appears only as a counterparty.
      - >-
        src/modules/ledger/domain/classify-flow.ts:73-77 returns INTERNAL for
        any row whose counterparty account is in the declared POT set, and it
        runs BEFORE the sign fallback at :102. An account registered POT
        carrying an account number (which M3-P14 criterion 14.6 makes
        mandatory: the form has no path that submits an account without one)
        therefore makes those rows INTERNAL, never SPEND.
      - >-
        src/modules/overview/adapters/overview-repository.ts:217 sums
        spend-total over flow = 'SPEND' only, so spend-total is identical
        before and after the correction and cannot fall.
      - >-
        Before the correction the household has no RESERVE row at all, so
        reserves-net is not rendered: test/e2e/month-view.spec.ts:1402-1403
        pins that the reserves card shows no-reserves until it has a row, and
        the criterion asks the test to record reserves-net as a string at
        that moment.
    concrete-edit: >-
      Replace 15.1's first sentence with: "A Playwright test registers a
      savings account in the POT ring by mistake, imports the M3-P14 fixture,
      records spend-total, pot-change, reserves-net-or-its-absence and
      recon-cause-unmatched as strings, corrects the ring to RESERVE, and
      asserts with no further upload that the rows referencing that account
      have moved from the unmatched-internal cause to the reserves block:
      reserves-net rises by exactly the fixture's movements to that account,
      recon-cause-unmatched falls by exactly those rows, and spend-total is
      byte identical before and after, all compared against strings written
      by hand in the spec from the fixture's own arithmetic." Then add a
      second arm for the direction the criterion was reaching for and which
      the fixture cannot produce on its own: "A second case imports a
      statement for an account declared RESERVE by mistake whose own rows are
      ordinary outside spend, corrects it to POT, and asserts spend-total
      RISES by exactly those rows", which is the only construction in which a
      ring correction moves the spend total.
    analysis: >-
      The criterion was written from the intent ("a wrong ring moves money
      between spend and reserves") without walking the classification order
      it lands on. Two independent failures, either fatal: an account
      declared POT never contributes to spend through its counterparty rows,
      and the figure the test is told to record before the correction is not
      on the page. An implementer meeting this criterion honestly must
      rewrite it, and the danger is the other repair: making a wrongly ringed
      account's transfers SPEND so the criterion goes green, which would put
      the household's own transfers back in the spend total, that is, exactly
      the defect this whole round exists to remove.
  - id: PR6-003
    severity: high
    evidence:
      - >-
        M3-P14 criterion 14.8 ends: "A fourth test imports a companion
        fixture carrying the partner legs and asserts the cause block
        disappears, the count reaches zero and no money figure on the screen
        moves."
      - >-
        src/modules/overview/adapters/overview-repository.ts:219 defines
        changeInPot as SUM(amountCents) FILTER (WHERE flow IS NOT NULL) over
        the whole household. The partner legs are new rows with a non-null
        flow, so importing them changes changeInPot by their sum, which is
        the negation of the first account's legs.
      - >-
        src/modules/overview/ui/month-view.tsx:514 renders changeInPot as a
        money figure with data-testid pot-change, and M3-P15 criterion 15.4
        names pot-change among the golden journey's asserted strings, so it
        is a money figure on the screen by this plan's own reckoning.
      - >-
        src/modules/overview/domain/month-projection.ts:201 computes
        difference as changeInPot - (income - spend - netToReserves). Before
        the companion import the difference equals the unmatched leg total
        and renders as recon-difference (month-view.tsx:312, alarm: true);
        after it the difference is zero and the element is absent. That is a
        money figure moving, and it is the figure the criterion's own first
        half is about.
    concrete-edit: >-
      Replace the last sentence of 14.8 with: "A fourth test imports a
      companion fixture carrying the partner legs and asserts that
      recon-cause-unmatched is absent, that the unmatched count reaches zero,
      that income-total, spend-total and reserves-net are byte identical to
      the strings recorded before that import, that pot-change moves by
      exactly the sum of the partner legs (a string written by hand in the
      spec), and that recon-difference is absent where it previously rendered
      the unmatched total. The three counted totals are the figures that must
      not move; pot-change and the difference MUST move, because the household
      gained the other side of its own transfers, and a test that asserted
      otherwise would be asserting the identity is broken."
    analysis: >-
      As written a correct implementation cannot pass this criterion, so the
      implementer will discover it red at the end of the phase and weaken it
      under time pressure, which is how a criterion stops being a contract.
      The wording also teaches the wrong invariant: pairing an internal
      transfer is supposed to move changeInPot and close the difference, and
      a plan that says otherwise invites someone to make changeInPot ignore
      pairs.
  - id: PR6-004
    severity: high
    evidence:
      - >-
        M3-P14 step 3 specifies the form as "a label, a bank, a ring and an
        account number" and no criterion 14.1 through 14.10 requires the
        typed account number to be VALID. Criterion 14.4 requires only
        idempotence, one canonical form across surface renderings, and that
        "a string that is not an account number is returned unchanged rather
        than mangled".
      - >-
        src/modules/ledger/domain/classify-flow.ts:62-77 matches a
        counterparty account by set membership, so a registration carrying
        one wrong character matches nothing at all. The result is
        indistinguishable from not having registered: the transfer falls
        through to the sign rule at :102, lands in the spend total, and is
        offered on the naming screen, with no message anywhere.
      - >-
        The determinism the fix needs is already decided and already
        specified in this same plan: DR-0028, and M3-P12 step at plan line
        6328-6336, define a trustworthy account as non-empty after
        uppercasing and whitespace removal, of exactly the length the pinned
        country-length table assigns its country code (a country the table
        does not carry is REFUSED), and passing the ISO 7064 mod-97 check.
        M3-P12 criterion 12.16 tests exactly those four refusals.
      - >-
        The owner types seven of these by hand from paper documents on a
        phone-first product (DR-0021, the owner is on Android), which is the
        population where a transposed pair of digits is expected rather than
        unlikely.
    concrete-edit: >-
      Add to M3-P14 step 2, after the sentence about normalising a
      declaration on the way in: "The same platform module carries the
      DETERMINISTIC validity test DR-0028 settles, the pinned country-length
      table and the ISO 7064 mod-97 check, because a canonical form that
      cannot say whether a string is an account number can only be applied
      blindly." Add criterion 14.11a: "A REGISTRATION THE ENGINE CANNOT USE
      IS REFUSED AT THE FORM, NOT ACCEPTED SILENTLY. The server action
      refuses an account number that is empty after canonicalisation, whose
      country code the pinned table does not carry, whose length differs from
      the length that table assigns its country code, or that fails the ISO
      7064 mod-97 check, with a named error rendered in all three
      catalogues; an application test asserts each of the four refusals over
      wholly invented inputs, and a Playwright test asserts the owner sees
      the message and no account row is created." Add hazard class H14.11:
      "The owner mistypes one character of an account number, registration
      succeeds, and the account is silently never matched by anything, which
      is the original defect with a new cause", addressed-by criterion
      14.11a.
    analysis: >-
      This is the difference between a plan that makes the end state possible
      and one that delivers it. Every other criterion in the phase is written
      over a fixture whose account numbers are correct by construction, so
      the entire suite is green in a world where the owner's registration
      does nothing. The cost of the fix is near zero because the predicate is
      already decided, already specified one phase away, and DR-0028 makes it
      explicitly deterministic rather than a model's judgement; the only
      question the plan has to answer is which phase owns the module, and
      M3-P14 runs first.
  - id: PR6-005
    severity: high
    evidence:
      - >-
        src/modules/overview/adapters/overview-repository.ts:175-176 joins
        the accounts table with a."iban" = t."counterpartyIban", raw string
        equality in SQL, and :187 falls back to row.counterpartyIban as the
        group label when the join finds nothing.
      - >-
        M3-P14 step 2 names that join as a site that must normalise both
        sides, and NO criterion witnesses it. Criterion 14.4's third sentence
        pins the TypeScript side only ("a ledger domain test asserts that a
        transaction whose stored counterparty account is written spaced
        classifies as RESERVE"), and criterion 14.2 asserts reserve-group
        counts, the absence of no-reserves and the reserves-net and
        spend-total strings, none of which changes when the join misses:
        grouping is by t."counterpartyIban", so the count and the total are
        right and only the LABEL degrades.
      - >-
        Criterion 14.4 records the measurement that makes this the expected
        case rather than an edge: "every one of the 26 account-shaped tokens
        in the owner's own current-account document is written spaced", while
        registration stores the canonical form.
      - >-
        The degraded label is an account number rendered on screen:
        src/platform/ui/mask-card-number.ts names "month-view.tsx's reserves
        group label, which is the user's own declared account label or a
        counterparty IBAN" as a DELIBERATE exclusion from masking, so nothing
        downstream softens it.
    concrete-edit: >-
      Add to criterion 14.2, as a sixth assertion: "and each reserve-group's
      rendered label is byte identical to the LABEL the household typed when
      it registered that account, and no reserve-group label contains any
      account-shaped token, which fails if the reserves join at
      src/modules/overview/adapters/overview-repository.ts:175-176 compares
      raw stored strings; the fixture writes its counterparty accounts in the
      spaced surface form so that a join over raw values cannot pass." Add
      the same assertion to criterion 14.5's third test, where the account is
      registered after the rows already exist.
    analysis: >-
      The end state the owner asked for is not only "not offered as a
      merchant", it is "recognised as my account". Four savings accounts
      appearing in the reserves block under their raw account numbers
      instead of "Holiday savings" is the visible half of the same defect,
      and it is the half this criterion set cannot see, because every
      assertion it makes about the reserves block is a count or a total. A
      correct implementation that normalises everywhere in TypeScript and
      forgets the one comparison written in SQL passes 14.1 through 14.10.
      The codebase has been bitten by exactly this asymmetry before, which is
      why normalise-counterparty.ts:24-42 carries a whole paragraph about the
      SQL copy of the counterparty rule and a test that pins it.
  - id: PR6-006
    severity: high
    evidence:
      - >-
        M3-P14 step 7 and decision D-49 promise that a MerchantRule the owner
        already wrote against what turns out to be their own account is
        "KEPT, is never deleted by any engine path, and is counted and named
        to the owner at the moment of registration", and that "the
        registration result names how many of their merchant rules stopped
        matching and which accounts absorbed them".
      - >-
        No acceptance criterion of M3-P14 mentions a MerchantRule, a naming,
        or a count of rules that stopped matching: 14.1, 14.2, 14.3, 14.4,
        14.5, 14.6, 14.7, 14.8, 14.9 and 14.10 read end to end without one.
        No hazard class H14.1 through H14.9 names it either.
      - >-
        Criterion 14.5, the phase's healing witness, imports the fixture and
        then registers, but never NAMES a merchant in between, so the
        already-named case is not exercised anywhere in the phase.
      - >-
        The equivalent promise in M3-P15 IS witnessed, by criterion 15.6,
        which shows the shape is available and was simply not applied to the
        phase where the owner meets it first. M3-P14 runs strictly before
        M3-P12 precisely because, per decision D-52 at plan line 9362, the
        owner's own-account counterparties would otherwise "become nine tidy
        groups that invite a naming", so this phase's whole ordering argument
        assumes namings exist before registration.
      - >-
        The mechanism the step relies on is real but partial:
        src/modules/ledger/application/interpret-window.ts:120-128 writes a
        null merchant for every row that is not INCOME or SPEND, so the
        assignment stops applying. Nothing in that path tells the owner it
        happened, and the merchants module keeps the rule row, so the naming
        the owner made disappears from every screen with no statement.
    concrete-edit: >-
      Add criterion 14.11b to M3-P14: "A NAMING THAT STOPS APPLYING IS
      COUNTED AND NAMED, NEVER SILENTLY GONE. A Playwright test imports the
      fixture, names one own-account group as a merchant on /merchants,
      registers the account that group belongs to, and asserts three things:
      the registration result names the number of merchant rules that stopped
      matching and the account that absorbed them, in copy present in all
      three catalogues; the transactions concerned carry no merchant; and the
      MerchantRule row still exists, asserted at the application level. A
      grep asserts no code path in the accounts module or in interpretation
      calls any delete on a MerchantRule, which is
      .claude/skills/pulse-domain/SKILL.md:41 held mechanically." Add hazard
      class H14.12: "A naming the owner made before registering the account
      stops applying with no statement, so a decision they made appears to
      have been thrown away", addressed-by criterion 14.11b.
    analysis: >-
      This is the dispatch's second attack, the half-imported world, in the
      direction the plan left open. Rows already imported are handled by
      14.5. Rows already NAMED are handled by a step and a decision with no
      criterion under them, which means an implementation that does nothing
      at all about merchant rules passes this phase unchanged. The rows heal
      by themselves, so the defect is not arithmetic; it is that the owner's
      own declaration vanishes from the interface without a word, which is
      the same class of surprise as the one that started this round.
  - id: PR6-007
    severity: high
    evidence:
      - >-
        M3-P15 criterion 15.4 requires "an application test builds a
        household whose accounts are all pot accounts, runs the month
        projection before and after the scoping change is applied, and
        asserts every field of MonthFigures is identical".
      - >-
        After the phase, the tree contains ONE month projection: the scoped
        one. "Before the scoping change is applied" is a state of the
        repository that no longer exists, so the test can only be written by
        keeping a second, unscoped copy of the four reads
        (overview-repository.ts:128-131, :175-176, :219-235 and
        merchant-repository.ts:231-234) alive in the shipped tree solely to
        be compared against, or by hand-writing the expected numbers and
        calling that the before state.
      - >-
        This is the same defect shape the dispatch reports was just found in
        M3-P12 criterion 12.17: evidence that exists only outside the phase's
        own tree.
      - >-
        The first half of 15.4 does not have the problem and is the model:
        "the committed golden journey (test/e2e/golden-journey.spec.ts)
        passes unchanged, and its asserted strings ... are untouched in the
        diff" is checkable inside the phase, because the strings were
        committed before it.
    concrete-edit: >-
      Replace 15.4's second witness with one obtainable in the phase's own
      tree: "A second witness makes the claim mechanical rather than
      incidental. The verification-first step records, from the phase base
      before any edit, the full MonthFigures of a household whose accounts
      are ALL pot accounts, over a committed fixture, as captured output in
      the phase work history. An application test in the phase's diff then
      asserts the scoped projection over that same fixture returns each of
      those recorded values, written into the test by hand from the captured
      output and never read back from the implementation. A third case, over
      a household that also holds one non-pot account with rows, asserts the
      figures differ ONLY in the fields the scoping is meant to change, so
      the test can distinguish a scoping that works from a scoping that does
      nothing."
    analysis: >-
      The criterion asks the implementer to measure a counterfactual, and the
      two ways to satisfy it are both bad: dead code kept alive for a test,
      or a hand-written before that is really an after. H15.4 is the hazard
      that a shipped figure changes silently on data that already exists, and
      it is the hazard that decides whether this phase is a defect fix or the
      charter stop-for at charter.yaml:86-88, so it deserves a witness that
      can actually be produced.
  - id: PR6-008
