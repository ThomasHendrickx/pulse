findings:
  - id: CR-M3P18-01
    severity: medium
    evidence:
      - "Criterion 18.6's closing arm reads: And the work history records that every new fixture and every new line of copy was read back line by line against the real documents before commit, because the privacy gate cannot see a merchant name, a place name, a date or an amount inside a file. The phase adds two fixtures (test/fixtures/savings-statement.csv, test/fixtures/pre-phase-current.csv), a seed harness full of merchant-shaped strings, and six new catalogue lines."
      - "WITNESSED ABSENT: grep -in over delivery/work-history/m3-p18.yaml and delivery/work-history/m3-p18-notes.md for read back, read-back, line by line, real document: zero hits. No equivalently worded record exists either; the privacy-related lines in both files concern the gate run and invented env values only."
      - "CLAUDE.md rule 8 names the live precedent: two real merchant descriptors reached this public repository exactly through content the gate cannot see, which is why the criterion demands the record and not merely the gate's exit 0."
    concrete-fix: "Perform the read-back if it has not been done, and append the record to delivery/work-history/m3-p18.yaml (or the notes file the history points at) naming the files read back: the two fixtures, the seed harness's labels, banks and descriptions, and the three catalogues' new lines. One paragraph closes the criterion arm."
    analysis: "The fixture strings read as invented (Demobank, the 91-run bodies, Acme Salaris BV) and the amounts are hand-derived, so the residual risk is likely low; but the criterion asks for the record precisely because a reviewer cannot tell an invented merchant string from a copied one, and no record exists. This is the R-087 shape: a required present-tense fact about process, unstated."
  - id: CR-M3P18-02
    severity: medium
    evidence:
      - "Criterion 18.6 requires npm run test:e2e exits 0 with the new specs reporting their tests as passed. delivery/work-history/m3-p18.yaml:334 through :346 records suite-e2e as error: not spawned, no Supabase auth service in the implementer container. Not witnessable here either: the same service is absent in this container, so every browser-driving arm has executed NOWHERE at this head."
      - "The unexecuted arms, named: the DR-0030 acceptance journey (test/e2e/accounts.spec.ts:452 in the rewritten test), the criterion 18.2 held-block test with three locales and the nothing-moves byte-compare (test/e2e/month-view.spec.ts:1390 onward), and the browser arms of test/e2e/canonical-backfill.spec.ts (the door-opens journey, the August baseline byte-compare, the retype-trap through the screen)."
      - "Everything short of the browser IS green, witnessed by me: npm run build exit 0; npx playwright test held-and-gap-rows --project=chromium exit 0 (1 passed, prod bundle built and served by the webServer array); the migration, detection script, repository reads and reconciliation figures all witnessed against a real local Postgres (the probe log in this file's header). No counter-evidence of a browser-arm defect exists; what is missing is execution, not plausibility."
    concrete-fix: "Run npm run test:e2e in a container with the Docker-based local Supabase stack, capture the output into the phase work history, and re-review only if it is not green. No code change is demanded by this finding."
    analysis: "This is the criterion's own sentence and CLAUDE.md's slice-close rule, not a discovery: the implementer recorded it honestly as an open question (M3P18-C4). It is a finding because the criteria contract cannot count an arm as met that has never run, and because M3-P17's round showed exactly this hole hiding a head defect the fast gates could not see. The build witness here removes the P17 failure mode specifically; the remaining exposure is the browser assertions themselves."
  - id: CR-M3P18-03
    severity: low
    evidence:
      - "test/e2e/canonical-backfill.spec.ts:231 states in a comment: ARM: no fact moved. The seeded transactions are byte identical. The code beneath (lines 232 through 237) selects counterpartyIban, amountCents and description and asserts only expect(transactions).toHaveLength(4). No before-snapshot is taken and no field is compared, so a migration that rewrote every counterparty column while deleting nothing would pass this arm."
      - "The property itself is TRUE at this head, witnessed independently: my probe took a full snapshot of every transaction column before the migration and byte-compared after two runs, identical (probe line: ok no transaction column moved (full byte compare)). The fast-gate text pin (test/domain/canonical-backfill.test.ts:39 through :50) also confines the SQL to the accounts table. The defect is the spec's claim-versus-assertion gap, not the migration."
    concrete-fix: "In test/e2e/canonical-backfill.spec.ts, snapshot the household's transactions (all columns, ordered by id) before the first migration run and deep-compare after the second, replacing the length-only assertion; or reword the comment to what is asserted. The snapshot is one findMany and one toEqual."
    analysis: "Clause R-087's first shape: a present-tense comment claim nothing checks. It was true when written and my probe proves it true today; nothing in the spec keeps it true, and this spec is the one criterion 18.4 names as the executable witness that only the declaration moves."
  - id: CR-M3P18-04
    severity: low
    evidence:
      - "Criterion 18.2 arm three reads: and a grep asserts no read the phase adds sums the amount column or reads outside the requested period. The committed sweep (test/domain/savings-decision.test.ts:155 through :180) asserts the held read carries no flow token, carries the RESERVE ring predicate, and matches no SUM(; it makes NO assertion about the period bounds."
      - "The bounds are present in the SQL (src/modules/overview/adapters/overview-repository.ts:395 through :396, bookingDate >= and <= the period), witnessed by reading and exercised by every database witness in this review; but the criterion asks for the grep pin so a later edit that widens the read reddens a fast test, and that pin is absent."
    concrete-fix: "Add two assertions to the held-read block test in test/domain/savings-decision.test.ts: the sliced heldRead source matches a bookingDate lower-bound and upper-bound comparison (the same textual pin style the file already uses for the ring predicate)."
    analysis: "Half of a named grep arm delivered. Low because the behaviour is correct and SQL-witnessed; the missing piece is the regression tripwire the criterion explicitly ordered."
  - id: CR-M3P18-05
    severity: low
    evidence:
      - "delivery/work-history/m3-p18-notes.md:97 states the step-1 baseline refusal is covered by the new specs in test/e2e/import.spec.ts (savings acceptance). No such spec exists: git diff dee3d32..85da7f6 -- test/e2e/import.spec.ts is empty, and the savings acceptance test lives in test/e2e/accounts.spec.ts:452, which the same notes file names correctly at line 200."
    concrete-fix: "Correct the pointer at delivery/work-history/m3-p18-notes.md:97 to test/e2e/accounts.spec.ts (and test/e2e/canonical-backfill.spec.ts for the refusal baseline arm), in place, loudly."
    analysis: "Clause R-087: a false claim in a document, raised as a finding rather than a nit. Small, but this is the record a capable container will follow to find the specs it must run, and it points at a file the phase never touched."

