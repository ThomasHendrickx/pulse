hazard-classes-addressed:
  - class-id: H12.1
    probed: >-
      Ran the SHIPPED scrape and the SHIPPED trust gate over invented adversarial
      inputs and looked for two different counterparties reaching one key. Found
      exactly one mechanism, the recorded sixteen-character truncation, and
      confirmed its bound: only a Belgian-prefixed spaced over-long source can
      reach it, because BE is the sole sixteen-length entry in the country table,
      a compact over-long token does not scrape at all, and every other country's
      truncation is refused on length.
    cleared-because: >-
      The trust gate is the guard the criterion says it is and it fails closed on
      every other input this lane could construct. The residual is real, bounded,
      recorded as open with mod-97 as its only remaining filter, and closing it
      needs an importer re-parse, which this phase correctly refuses to do.
