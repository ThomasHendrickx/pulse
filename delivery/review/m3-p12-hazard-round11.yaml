findings:
  - id: HZ11-M3P12-01
    severity: high
    evidence:
      - "src/platform/db/client.ts:87 through :97. client() reads globalForPrisma.prisma, and assigns it back only inside `if (!isProduction())` at :93. In PRODUCTION the cache is therefore NEVER populated, so every call to client() runs constructClient() and `new PrismaClient()` at :76."
      - "src/platform/db/client.ts:103 through :116. The Proxy holds no instance of its own. Its get trap calls client() inside Reflect.get and AGAIN inside .bind(client()), so a function-valued property costs two constructions."
      - "WITNESSED. A probe under scripts/ (created, run, deleted; git status clean after) read five properties off the exported binding while counting the module's own `[pulse:db] DATABASE_URL ...` startup line. NODE_ENV=production: after 1 model read constructions = 1; after 2 = 2; after 3 = 3; after 1 method read = 5; after 2 method reads = 7; 'cached on globalThis at end? false'. NODE_ENV unset: 1, 1, 1, 1, 1; 'cached on globalThis at end? true'."
      - "REGRESSION, not pre-existing. The version before this branch's client rewrite ends `export const prisma: PrismaClient = globalForPrisma.prisma ?? constructClient();` followed by `if (!isProduction()) { globalForPrisma.prisma = prisma; }` (git show of the prior revision of src/platform/db/client.ts). A module binding holds one instance for the life of the process in EVERY environment, production included. The lazy rewrite removed the only memo production had."
      - "TWO CLAIMS IN THE FILE ARE NOW FALSE (clause R-087). src/platform/db/client.ts:6 says 'One PrismaClient per process.' src/platform/db/client.ts:99 through :102 says 'EXPORTED WITH THE SAME TYPE AND THE SAME SHAPE AS BEFORE ... behave exactly as they did.'"
      - "COST. src/platform/db/target-guard.ts:225 records that port 5432 is 'the endpoint where one client connection is one server connection'. Fleet warning 5 records the session pooler as the only endpoint reachable from an IPv4 environment, which is what the deployed application uses. Each construction carries its own connection pool, and the startup diagnostic (client.ts:43 through :48) prints once per property access."
      - "NOTHING IN THE TREE SEES IT. The fast gate constructs zero clients, measured above, so no test exercises the production branch of client() at all."
    concrete-fix: >-
      Memoise the constructed client in a module-level variable regardless of
      NODE_ENV, keeping the globalThis cache as the additional dev-server hot
      reload cache rather than as the only one: `let instance: PrismaClient |
      undefined;` set inside client() before the isProduction() branch, and
      returned on every later call. In the same edit, call client() ONCE per
      get-trap invocation and bind to that value rather than calling it twice.
      Then pin it: a test that sets NODE_ENV=production, reads several
      properties off the binding, and asserts the module's construction count
      is 1. The two false comment claims at client.ts:6 and :99 through :102
      are corrected in the same change, quoting what they said, per clause
      R-087.
    analysis: >-
      Production is the one environment this phase deliberately leaves
      unguarded, on the stated ground that it is the server that serves real
      traffic. It is also the only environment the lazy rewrite made worse,
      and it is the environment holding the owner's real household finances.
      The defect is invisible to every instrument this phase built: the door
      scan exempts this file, the fast gate never constructs a client, and the
      slow gate's production web server serves a handful of pages against a
      local Postgres that will not exhaust anything. It surfaces first on the
      deployed app under load.

  - id: HZ11-M3P12-02
    severity: high
    evidence:
      - "src/platform/db/runtime-target.ts:43 through :47. noteInterlockApproved is a plain exported function taking a free-text label. It compares nothing, resolves nothing, and validates nothing. src/platform/db/guard.ts:164 through :169 then returns allowed for ANY non-production process whose approval is set."
      - "src/platform/db/runtime-target.ts:25 states 'Only code inside this process that has actually done that work can call this.' That sentence is FALSE and this finding is raised loudly under clause R-087."
      - "WITNESSED. scripts/zz-probe4.ts (created, run, deleted; git status clean after) imported exactly what scripts/rederive-merchant-rules.ts imports, called noteInterlockApproved(\"zz-probe4, which checked absolutely nothing\") having resolved nothing and matched nothing, then read prisma.account with DATABASE_URL pointing at a NON-LOCAL host and NODE_ENV unset. Output: 'approval after : zz-probe4, which checked absolutely nothing' then '[pulse:db] DATABASE_URL present, scheme ok' then 'prisma.account => object'. No refusal."
      - "CONTROL, same environment, same file, without the noteInterlockApproved line: 'prisma.account => THREW [pulse:db] this process is not production and DATABASE_URL points at a non-local host'."
      - "NOTHING CONSTRAINS THE CALLERS. grep over the tracked tree for noteInterlockApproved returns exactly two hits outside its own definition: a comment at scripts/rederive-merchant-rules.ts:113 and the call at scripts/rederive-merchant-rules.ts:346. No test names the symbol at all, so a second caller is red nowhere."
      - "THE DOOR SCAN CANNOT SEE THIS SHAPE. test/db/gate-target.test.ts:577 through :592 defines a door as `new PrismaClient(`, `createClient(` or `create(Server|Browser)Client(`. A module that reaches the database through the shared binding plus one call to noteInterlockApproved matches none of them, and the shared binding is the one door the scan exempts (test/db/gate-target.test.ts:454 through :457), on the stated ground that 'the interlock it carries is assessNonProductionDbTarget'."
      - "WRITE-ONCE HOLDS, and it is not the protection it reads as. A second call is ignored (witnessed: 'approval is still: <the first source>'). The consequence is that the FIRST writer wins, and module-graph evaluation runs before any main(), so a caller at import scope silently pre-empts the real interlock and the real interlock's later call becomes a no-op that nothing reports."
    concrete-fix: >-
      Make the register take evidence instead of a label. Have
      noteInterlockApproved accept the resolved connection string and the
      operator's expectation, re-run assessRederiveTarget inside
      runtime-target.ts, and record the approval only if that assessment
      passes; the label then names the caller rather than standing in for the
      work. Failing that, at minimum add to test/db/gate-target.test.ts a scan
      of the tracked tree for a CALL to noteInterlockApproved with an
      allow-list of exactly one path and a reason, in the shape
      ALLOWED_UNGUARDED already has, plus a test asserting that an approval
      written by any other caller does not make assessNonProductionDbTarget
      return allowed. Correct runtime-target.ts:25 in the same change,
      quoting what it said.
    analysis: >-
      This is hazard H12.30's shape reopened one module over. The interlock
      that criterion 12.23 bought is real and it works; what round ten added
      beside it is a one-line, unguarded, process-wide off switch for the
      client's own guard, reachable by any module in the import graph, with no
      test, no scan and no reviewer instrument pointed at it. The exemption of
      src/platform/db/client.ts from the door scan is justified in the tree by
      the guard this switch disarms.

  - id: HZ11-M3P12-03
    severity: high
    evidence:
      - "test/db/gate-target.test.ts:509 through :558. The codeOnly lexer has three states, line comment, block comment and quoted string, and no state for a REGULAR EXPRESSION LITERAL. A regex literal is therefore scanned as ordinary code, and any quote character inside it opens a string state."
      - "THE BACKTICK IS THE CROSS-LINE VECTOR. A template-literal state runs to the next backtick anywhere in the FILE (the newline break at :541 is guarded by `ch !== \"`\"`). A regex literal holding an odd number of backticks therefore blanks everything from that point to the next backtick or to end of file."
      - "THE CONSTRUCT IS IN THE TRACKED TREE TODAY. src/platform/db/redact.ts:15 is `.replace(/`[^`]*`/g, \"<redacted>\")`, three backticks. Running the lexer verbatim over that file renders line 16 entirely blank."
      - "WITNESSED, DIRECTION ONE, A DOOR HIDDEN. codeOnly and doorsInSource were copied verbatim into a scratchpad probe and driven from strings. Source: a regex line holding an odd number of backticks, then `const client = new PrismaClient();`. Result: doors: []. Control, the same file without the regex line: doors: [{kind: prisma, guarded: false}]."
      - "WITNESSED, DIRECTION TWO, AN UNGUARDED DOOR REPORTED GUARDED. Source: the same regex line, then a template literal whose PROSE contains 'assertGateDbTargetIsLocal()', then a second such regex line, then `const client = new PrismaClient();`. Result: doors: [{kind: prisma, guarded: true, guardsBeforeConstructing: true}]. The prose is lexed as code because the swallow consumed the template's opening backtick."
      - "WITNESSED, DIRECTION THREE, A DOOR INVENTED FROM PROSE. Source: the regex line, then a template literal whose prose contains 'new PrismaClient()'. Result: an unguarded door is reported for a file that has none, which contradicts the header claim at test/db/gate-target.test.ts:485 through :487 that 'PROSE IS NOT A DOOR'."
      - "A CALL IS NOT AN EXECUTED CALL. The guarded side is `new RegExp(`\\b${entry.guard}\\s*\\(`).exec(source)` at test/db/gate-target.test.ts:628. Witnessed green on two shapes that guard nothing: `const unused = () => assertGateDbTargetIsLocal();` above a constructor, and `expect(() => assertGateDbTargetIsLocal()).toThrow();` above a constructor. Both report guarded: true, guardsBeforeConstructing: true. The second is the realistic one: test/db/gate-target.test.ts itself is full of calls written to assert a REFUSAL."
      - "ONLY THE FIRST CONSTRUCTION PER KIND IS EXAMINED (test/db/gate-target.test.ts:626). Witnessed: a guard call, then two `new PrismaClient()` constructions, reports one door, guarded and in order."
    concrete-fix: >-
      Add a regex-literal state to codeOnly, entered on a `/` that is not `//`
      or `/*` and that follows a token position where a regex may legally
      start, and exited on the closing unescaped `/`; and make the
      template-literal state refuse to run past end of file, treating an
      unterminated one as a lexer failure that FAILS the scan loudly rather
      than blanking the remainder. Separately, require the guard call to be at
      statement position in the module's own top-level or in the enclosing
      function of the construction rather than anywhere in the file, or accept
      the weaker check and say so in the header instead of claiming a CALL.
      Add the five probe strings above to the 'the shapes that used to pass'
      describe block so they stay red.
    analysis: >-
      Fleet warning 18 is written about exactly this instrument: a guard's
      stated scope is not its reach, and a scan claiming EVERY must have its
      denominator read before it is believed. Round ten fixed the denominator
      and the mention-versus-call defect on the guarded side, and left the
      lexer able to manufacture both a missing door and a present guard out of
      ordinary source text. The construct that does it is already in the tree.

  - id: HZ11-M3P12-04
    severity: medium
    evidence:
      - "delivery/work-history/m3-p12.yaml:2007 through :2024, the EIGHTEENTH and LAST declared deviation, states in the present tense: 'The refusal is gated on NODE_ENV being exactly \"development\". The wider predicate is not implementable without two carve-outs that amount to the same thing.'"
      - "src/platform/db/guard.ts:154 through :205. assessNonProductionDbTarget gates on `env.NODE_ENV === \"production\"` returning allowed and refuses everything else that is non-local. The wider predicate IS what shipped, and src/platform/db/guard.ts:100 through :136 quotes and retracts the very argument the deviation still advances."
      - "The deviation is not superseded anywhere: it is the last entry in the deviations block, so it is this branch's final recorded word on the predicate, and it contradicts the tip."
      - "This lane measured the cost the deviation calls unpayable and it is not paid: npm test EXIT=0, 681 tests, with a non-local ambient DATABASE_URL and zero client constructions."
    concrete-fix: >-
      Rewrite that deviation to state what shipped: the predicate is 'not
      production', the two costs it names were removed rather than traded
      away, laziness removes the first and the runtime approval register
      removes the second, and quote the superseded sentence rather than
      deleting it, in the shape the rest of this branch uses for an R-087
      correction.
    analysis: >-
      The work history is what the next implementer reads to learn why a
      predicate has the shape it has. This one argues, with observed evidence
      behind it, for a predicate the code no longer has, and the argument is
      persuasive enough that a reader could narrow the guard back.

  - id: HZ11-M3P12-05
    severity: medium
    evidence:
      - "MEASURED: npm test constructs ZERO Prisma clients (grep -c of the module's own startup line over a full run: 0). No test in this repository reaches src/modules/merchants/adapters/merchant-repository.ts against a database."
      - "delivery/work-history/m3-p12.yaml declares this for criteria 12.7, 12.8 and 12.9: 'The seeded subject is the in-memory fake repository ... not a live Postgres.' The declaration is honest; the residue it leaves is that idempotence, the atomic write set, the loss report and the superset property are all properties of the ROUTINE checked against a MODEL of the adapter."
      - "test/application/rederive-merchant-rules.test.ts:659 through :681 compares world.rules, an in-memory array, before and after."
      - "THIS LANE CLOSED THE GAP AND IT HOLDS. On a scratch database created and dropped on the local Postgres, migrated with prisma migrate deploy, seeded with invented rows and rules and driven through the REAL merchantRepository: run one exit 0, patterns rewritten 2, rules added 1, applied true, assignmentsBefore 3, assignmentsAfter 3, lost 0; run two exit 0, rewritten 0, added 0, TABLE IDENTICAL true, DECISION REPORT BYTE-IDENTICAL true, EXIT CODE SAME true; run three identical again. A dry run reported exit 0, applied false, table unchanged."
      - "AND A BLOCKED RUN WRITES NOTHING, also against the real adapter: a seed producing a genuine loss reported exit 1, applied false, and the merchant_rules table was byte-identical before and after across three consecutive runs."
      - "So the finding is not that the routine is wrong. It is that the tree does not prove any of this against the thing that will actually run, and hazard H12.12 is about a real second run against a real database."
    concrete-fix: >-
      Add one database-backed test that runs rederiveMerchantRules twice
      through merchantRepository against the local stack and asserts the
      second run rewrites zero patterns, adds zero rules, leaves merchant_rules
      byte-identical and prints the same decision report; run it in the slow
      gate, where a database is already pinned by enforceGateDbTarget, rather
      than in the fast gate, so the fast gate keeps its zero-client property.
      test/e2e/merchant-rule-write.spec.ts is the precedent and the place.
    analysis: >-
      The in-memory double is the right default for the application layer and
      the deviation says so. What it cannot cover is the one thing the
      adapter adds: that applyRuleWrites persists exactly the write set the
      routine computed, so that the second run sees the state the first run
      believed it wrote. That link is the whole of idempotence in production.

  - id: HZ11-M3P12-06
    severity: medium
    evidence:
      - "src/platform/db/gate-target.ts:15 through :23 enumerates what the scan does not see and closes 'Those four are the standing residue.' It names a shell or SQL or CLI door, a door reached transitively through an exempted module, a service-role key arriving under another name, and 'a client constructed through an identifier computed at runtime rather than written literally'."
      - "WITNESSED, a fifth residue that is written literally. `import { PrismaClient as PC } from \"@prisma/client\"; const c = new PC();` -> doorsInSource returns []. The identifier is a literal, not computed, so it falls outside every clause of the stated list."
      - "WITNESSED, a sixth. `const c = new PrismaClient<{ log: [] }>();` -> doorsInSource returns []. The pattern at test/db/gate-target.test.ts:581 is /new\\s+PrismaClient\\s*\\(/ and a type argument sits between the name and the parenthesis."
      - "WITNESSED, a seventh, recorded here rather than in HZ11-M3P12-03 because it is a denominator question rather than a lexer one: only the FIRST construction of each kind in a file is examined, so a second unguarded construction below a guarded one is invisible."
    concrete-fix: >-
      Widen the construction pattern to allow a type argument list, add a
      pattern for a constructor called through a local alias by resolving
      `PrismaClient as X` from the import line, iterate ALL matches of the
      construction pattern rather than the first, and rewrite the residue
      paragraph to say what it now cannot see. If any of those is judged not
      worth building, the paragraph must say so: the defect this finding
      names is the sentence claiming the list is complete, not the gaps
      themselves.
    analysis: >-
      A stated residue list is the reader's only account of how far to trust a
      green scan. This one is short by three shapes, two of which a person
      writing ordinary TypeScript could produce without meaning anything by it.

  - id: HZ11-M3P12-07
    severity: low
    evidence:
      - "test/db/db-guard.test.ts:441 asserts `expect(typeof clientModule.prisma).toBe(\"object\")` and the comment above it says 'the binding is still there to be used: this asserts the module loaded rather than that the import silently failed.'"
      - "typeof on a Proxy is answered by the TARGET and invokes no trap. WITNESSED: a probe reading `typeof prisma` printed 'object' with prismaHasBeenConstructed() still false immediately after, and the same assertion passes in a process where every real property access throws (witnessed under a non-local target, where typeof returned 'object' and prisma.account threw)."
      - "The target is `{} as PrismaClient` at src/platform/db/client.ts:103, so the assertion is a statement about an empty object literal."
    concrete-fix: >-
      Replace it with an assertion that touches the trap and proves both
      halves at once, for example that `\"account\" in clientModule.prisma`
      is true and that prismaHasBeenConstructed() is true immediately after,
      run in a case where the target is pinned local; and keep the existing
      zero-construction assertion on a property that does NOT touch the trap,
      which is what the surrounding test is actually for.
    analysis: >-
      Small, but it is the one behavioural assertion standing behind the
      claim that the lazy binding is still usable, and it is answered by a
      part of the Proxy that has nothing to do with the client.

  - id: HZ11-M3P12-08
    severity: low
    evidence:
      - "npm ci at this head EXIT=1: 'npm ci can only install packages when your package.json and package-lock.json or npm-shrinkwrap.json are in sync ... Missing: @swc/helpers@0.5.23 from lock file'."
      - "package-lock.json:7751 pins \"@swc/helpers\": \"0.5.15\" while package-lock.json:7865 records a peer requirement of \">=0.5.17\"."
      - "This lane worked around it with npm install --no-package-lock so the tracked lock was not rewritten. Not attributed to this phase: git log on package-lock.json shows its last touch predates the fix rounds."
    concrete-fix: >-
      Run npm install once on the branch and commit the regenerated
      package-lock.json, so a clean checkout can npm ci. If the lock is
      deliberately frozen, add npm ci to the standing gate line so the drift
      is red at the moment it appears rather than at the next clean clone.
    analysis: >-
      It costs whoever next clones this branch the discovery, and it means the
      gate everyone quotes has never been run from a reproducible install.

