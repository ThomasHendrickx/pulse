  - id: CRIT-P14-11
    severity: high
    title: "CRITERION 14.2'S RESERVES-JOIN WITNESS IS VACUOUS. Every new fixture writes its counterparty accounts COMPACT, which is exactly the form the criterion forbids because a raw join then passes"
    where: test/fixtures/ar-current.csv, ar-partners.csv, ar-pot-outgoing.csv, ar-pot-drawdown-only.csv, ar-pot-both-ways.csv, ar-savings.csv, and test/e2e/accounts.spec.ts:200
    evidence: |
      Criterion 14.2 requires that each reserve group's rendered label be the label the
      household typed, "which fails if the reserves join at
      src/modules/overview/adapters/overview-repository.ts:175 through :176 compares raw
      stored strings, AND THE FIXTURE WRITES ITS COUNTERPARTY ACCOUNTS IN THE SPACED
      SURFACE FORM PRECISELY SO THAT A JOIN OVER RAW VALUES CANNOT PASS."
      Every counterparty account cell in every fixture this phase adds is written
      COMPACT and UPPER CASE: the Tegenrekening column of test/fixtures/ar-current.csv
      carries values of the shape BE66901100002243, with no space and no hyphen, and the
      same is true of every other ar-*.csv. A grep for a spaced account shape across
      test/fixtures matches only the pre-existing PDF fixtures and their generator, none
      of which this criterion's arm uses.
      The delimited parse stores the cell verbatim, so the stored
      Transaction.counterpartyIban for these rows IS already its own canonical form.
      Account.iban is stored canonical. So for every row in these fixtures the join
      condition ra."iban" = t."counterpartyIban" and the shipped condition
      ra."iban" = upper(replace(replace(t."counterpartyIban",' ',''),'-','')) at
      src/modules/overview/adapters/overview-repository.ts:219 select the SAME rows.
      The assertion at test/e2e/accounts.spec.ts:233 through :247, which the criterion
      designs to redden on a raw join, cannot redden on a raw join over this fixture.
      THE SEVENTH ASSERTION IS ABSENT ENTIRELY. Criterion 14.2 additionally requires
      "an application test over a household whose stored counterparty account column
      carries the SAME reserve account in two surface forms, one spaced and one compact",
      asserting "exactly ONE reserve-group is returned, carrying the household's typed
      label and the sum of both rows", and states why: "a fixture uniform in one surface
      form passes a normalised join with a raw grouping and the owner then sees one
      savings account twice, under the right name both times, with the money split."
      No such test exists. A grep for a mixed-surface-form reserve household across
      test/ returns nothing, and no test anywhere calls listReserveMovements.
    consequence: |
      Hazard H14.3 exactly ("The scenario is proved on a fixture built to pass"). Both
      halves of the reserves SQL, the normalised JOIN and the normalised GROUP BY at
      src/modules/overview/adapters/overview-repository.ts:227, are unguarded: the
      normalised grouping could be reverted to GROUP BY the raw column and every test in
      both phases stays green, while a household whose statement mixes the two surface
      forms, which the criterion documents as a real state of this product because the
      delimited parse stores verbatim and the PDF path compacts, sees one savings
      account listed twice with its money split between the two lines.
      This one is not a missing lane, unlike CRIT-P14-04 and CRIT-P14-05: the browser
      lane runs and the assertion is in it. What is missing is the input that makes the
      assertion discriminate.
    fix: |
      Write the Tegenrekening cells of the reserve rows in ar-current.csv in the spaced
      surface form, which is how the owner's own document prints them, and add the
      seventh assertion as a test over a household holding the same reserve account
      spaced on one row and compact on another, asserting one group with the summed
      total. Both changes redden against a raw join and a raw grouping respectively.
    criterion-touched: "14.2, and hazards H14.3 and H14.5"
    empirical-confirmation: |
      Not argued, measured, against the live database this review ran the browser gate on
      (pulse_review_m3p14crit, created for this review on the local stack at 127.0.0.1:54322).
      After the HEALING test seeded a household through the shipped registration and import
      path:
        select count(*) filter (where t."counterpartyIban" =
               upper(replace(replace(t."counterpartyIban",' ',''),'-','')))
        from transactions t where t.flow='RESERVE';
        -> reserve_rows 4, already_canonical 4
      Then the two joins, side by side over that household:
        NORMALISED|4
        RAW|4
      The raw join and the shipped normalised join select the SAME four labelled reserve
      rows over this phase's own fixture. The assertion criterion 14.2 built to redden on a
      raw join returns identical output under both.

  - id: CRIT-P15-12
    severity: medium
    title: "R-087. A comment states that the correction's reported movement is recomputed after the change; it is the preview object, computed before the write and returned unchanged"
    where: src/modules/accounts/application/correct-account-ring.ts:58 through :60, against :116 and :129
    evidence: |
      The comment on CorrectAccountRingOutcome.moved reads: "What ACTUALLY moved,
      recomputed after the change rather than restated from the preview, so the two can
      be compared and criterion 15.7's 'byte identical' is a fact rather than a
      tautology."
      correctAccountRing at src/modules/accounts/application/correct-account-ring.ts:111
      calls previewAccountRingChange FIRST, at :116, then updateAccountRole at :121 and
      deps.recompute at :129, and returns "moved: movement.value" at :130. That is the
      preview object itself, computed before the declaration was written and never
      recomputed. It is restated from the preview, which is the thing the comment says
      it is not, and the comparison it claims to enable is a tautology, which is the
      thing the comment says it is not.
      The test at test/application/account-registry.test.ts:551 says so honestly in its
      own comment ("And the outcome reports the same movement it previewed") and asserts
      toEqual between them, so nothing in the tree is relying on the false half; the
      criterion's real assertion at test/application/account-registry.test.ts:539
      through :548 compares the preview against after-minus-before over the world's own
      state, which is correct.
    consequence: |
      The next person who adds a second rule anywhere in the preview will read this
      comment and believe the outcome path independently cross-checks it. It does not.
      This is the exact shape R-087 names: a comment asserting a present-tense fact that
      nothing keeps true.
    fix: "Either recompute the movement after the write and compare, or correct the comment to say that the outcome restates the preview and that the dry-run argument (D-58) is what makes that safe."
    criterion-touched: "15.7"

  - id: CRIT-P15-13
    severity: medium
    title: "Criterion 15.7's preview test runs on a fixture that cannot distinguish the dry run from the second query the criterion forbids, and its Playwright half asserts words rather than figures"
    where: test/application/account-registry.test.ts:509 through :557, and test/e2e/accounts.spec.ts:452 through :461
    evidence: |
      Criterion 15.7 requires the application test to run "over a fixture that carries a
      settlement-matched card debit AND a matched transfer pair as well as ordinary rows,
      so a preview computed by a second rule diverges rather than agrees".
      The test imports test/fixtures/ar-current.csv only. That fixture carries eleven
      rows: one salary credit, three outside debits, three pot-to-pot transfers and four
      reserve transfers. There is no card import, so the settlement match at
      src/modules/ledger/domain/classify-flow.ts:93 never fires, and no partner statement
      is imported, so no transfer_link is ever created and there is no matched pair. On
      that fixture a naive second query summing rows whose counterparty account matches
      would return the same numbers the dry run returns.
      The mechanism itself IS the dry run required by decision D-58: the preview is
      previewDeclarationChange, which runs interpretLedger over the proposed declaration
      set (src/modules/ledger/application/preview-declaration-change.ts), and
      test/application/fake-import-world.ts:784 wires the REAL function rather than a
      stub. So the finding is about the WITNESS, not the implementation.
      THE PLAYWRIGHT HALF. Criterion 15.7 asks that "a Playwright test asserts every
      shown figure is byte identical to the movement the totals make when the change is
      confirmed, rendered in the reader's own language from all three catalogues". The
      only browser assertion on the preview is at test/e2e/accounts.spec.ts:455, which
      asserts the preview element contains the phrase "stop being counted". No figure is
      compared against any total, and it runs in English only. The three-locale spec at
      test/e2e/accounts.spec.ts:567 covers the month-accounts states and the reserves
      heading, not the preview.
    consequence: "Criterion 15.7 is reported met; its discriminating fixture and its byte-identical browser comparison are both absent, so the guard against decision D-58 being undone later is weaker than the criterion states."
    fix: "Import test/fixtures/ar-partners.csv alongside ar-current.csv so a matched pair exists, add a card fixture and its paying debit, and assert the rendered preview figures against the rendered totals before and after in all three locales."
    criterion-touched: "15.7"

  - id: CRIT-P14-14
    severity: low
    title: "Criterion 14.10's grep that the superseded skill sentence is gone was not written, and the sentence is still literally in the file"
    where: .claude/skills/pulse-domain/SKILL.md:24
    evidence: |
      Criterion 14.10 requires that SKILL.md's reserve sentence "is corrected in this
      phase's commit to record DR-0030 and the held state ... a grep asserts the
      superseded sentence is gone."
      The correction is made, and made well, in the R-087 corrected-in-place style:
      .claude/skills/pulse-domain/SKILL.md now carries the DR-0030 paragraphs and states
      plainly that the old clause is FALSE.
      No grep asserts it. `grep -rn "SKILL.md" test/ --include=*.ts` matches one comment
      at test/application/account-registry.test.ts:478 and nothing else, and no test
      reads that file's text.
      And the superseded sentence is still literally present, quoted inside the
      correction narrative at .claude/skills/pulse-domain/SKILL.md:24 ("that their
      statements are not imported in v1"), so a grep written to the criterion's letter
      would go red against a correctly corrected file.
    consequence: "A clause of 14.10 was not built, and the obvious way to build it now would be red against the right answer."
    fix: "Assert instead that the file contains the DR-0030 marker and that the old sentence appears only inside a paragraph marked CORRECTED, which is the property that actually matters."
    criterion-touched: "14.10"

  - id: CRIT-P14-15
    severity: high
    title: "THE WORST SELF-PASSING GUARD. The MerchantRule delete grep, which criteria 14.13 and 15.6 both require and which holds an ABSOLUTE rule of the domain, is blind to the ordinary Prisma form of the delete it forbids"
    where: test/application/account-registry.test.ts:495
    evidence: |
      Criterion 14.13: "A grep asserts that no code path in the accounts module and no
      code path in interpretation calls any delete on a MerchantRule, which is
      .claude/skills/pulse-domain/SKILL.md:41 held MECHANICALLY rather than promised in a
      step." Criterion 15.6 requires the same grep.
      The guard walks src/modules/ledger and src/modules/accounts and flags a line
      matching /(deleteRule|deleteMany|\\bdelete\\b)[^\\n]*[Rr]ule/. The pattern requires
      the word "delete" to appear BEFORE "Rule" ON THE SAME LINE. The Prisma client puts
      the MODEL NAME FIRST, so the natural delete reads
      `await tx.merchantRule.deleteMany({` and the word "Rule" is to the LEFT of
      "deleteMany" with nothing matching to its right.
      Probed rather than argued, running the guard's own regex line by line:
        MISSED  await tx.merchantRule.deleteMany({
        MISSED  await prisma.merchantRule.delete({ where: { id } });
        MISSED  the same call with its arguments on the following lines
        MISSED  await prisma.$executeRaw`DELETE FROM "merchant_rules" WHERE id = ...`
        CAUGHT  await deps.merchants.deleteRule(context, ruleId);
        CAUGHT  a prose line reading "delete the rule"
      So the guard catches a port method whose name happens to start with delete, and a
      comment, and misses every form the Prisma client actually offers, which is the form
      every repository in this codebase is written in
      (src/modules/ledger/adapters/ledger-repository.ts:173 is `tx.transferLink.deleteMany`,
      the same shape).
    consequence: |
      This is the one guard in either phase that holds an ABSOLUTE rule of the domain
      rather than a criterion's own assertion: recompute may never write to the
      declarations layer. Decision D-49 rests on it in M3-P14 and again in M3-P15, and
      both criteria describe it as the rule "held mechanically". It is not held. An
      engine path added later that deletes a dead MerchantRule the ordinary way passes
      this test, passes lint, passes typecheck, and takes away a decision the household
      made, which is the exact surprise decision D-49 exists to prevent.
      Under R-087 the test's name, "no interpretation code path calls any delete on a
      MerchantRule", is a false statement about what was checked.
    fix: |
      Match the model and the verb in either order and across a line break: search the
      file text (not line by line) for /merchantRule\\s*\\.\\s*delete/i and for
      /delete[^;]{0,80}merchantRule/i and for a raw DELETE against merchant_rules, and
      keep the deleteRule port-name arm. Then prove it by running it against an injected
      `tx.merchantRule.deleteMany({})` before trusting it, which is the both-directions
      discipline this phase already applied to its other two corrected guards.
    criterion-touched: "14.13 and 15.6, and pulse-domain rule 3"

