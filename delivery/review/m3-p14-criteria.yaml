reviewer-judgement-on-the-two-flagged-items:
  third-self-passing-guard:
    answer: "YES, and there are two of them, not one. The more serious is not the one I expected."
    detail: |
      CRIT-P14-15 is the serious one: the MerchantRule delete grep at
      test/application/account-registry.test.ts:495, required by BOTH criterion 14.13 and
      criterion 15.6 and described in both as the domain's absolute rule "held
      MECHANICALLY". Its pattern needs the word delete to precede the word Rule on one
      line, and the Prisma client writes the model name first, so
      `await tx.merchantRule.deleteMany({` is invisible to it. Probed: it misses every
      Prisma form and the raw SQL form, and catches a port method named deleteRule and a
      prose comment. It is green against exactly the code it exists to forbid.
      CRIT-P14-02 is the second: criterion 14.4's one-copy enumeration at
      test/domain/account-number.test.ts:162, whose PERMITTED list is empty while a second
      copy of the transformation sits in the tree at
      src/modules/overview/adapters/overview-repository.ts:98 and cannot match its
      detector. The two copies already disagree on which characters they strip.
      CRIT-P14-06 is a third and weaker instance: an assertion that the ring predicates
      are DEFINED, which their definitions alone satisfy.
      Worth saying plainly: the implementer found two such guards in its own work and
      corrected both, and wrote the correction notes into the tree
      (test/domain/absent-flow-reads.test.ts:57 and scripts/gate-diff-tokens.sh:29). The
      discipline is right; the coverage of it was not complete. Every guard in these two
      phases should be run against the state it exists to catch before it is trusted, and
      three of them were not.
  the-navigation-decision:
    answer: "The criterion should NOT have forced a different answer, and deciding rather than asking was correct. One consequence deserves to reach the owner as an outcome, not as a question."
    detail: |
      Criterion 14.7 constrains four measurable properties: rendered line count against a
      captured baseline, tap-target floor in both dimensions, no clipping, no horizontal
      overflow. The two-per-line wrap meets all four and the guard that measures them
      passed in my run under both the desktop and the phone projects
      (test/e2e/month-view.spec.ts:708, tests 27 and 50). The alternatives the criterion
      leaves open, shorter labels or a collapsed menu, would meet it too, so the criterion
      genuinely does not decide between them and DR-0029 puts the choice with the
      implementer rather than the owner: the two answers do not produce different data or
      a different risk.
      The measurement behind it is real and is recorded in the diff rather than asserted:
      at a quarter row the fourth link pushed "Overview" from one line to two at 390 and
      from two to FOUR at 360 at a 200 percent text size. That is hazard H14.8 caught by
      the instrument built for it, and it rules out the do-nothing answer.
      The sign-out move to align-self: end is a consequence rather than a preference, and
      it is defended by a measurement too: the focus-order spec reddened on the centred
      form reading tops [24, 24, 72, 72, 48], and both focus-order tests passed in my run
      at 390 and at 1280 (tests 41 and 42).
      WHAT SHOULD REACH THE OWNER AS AN OUTCOME. To keep the wrapped nav to two
      tap-target rows the phone nav type dropped from --text-base to --text-xs on EVERY
      route (src/app/globals.css:236), which the implementer chose so the reconciliation
      verdict stays above the fold criterion 7.8 pins. That is a visible change to every
      screen in the product, made for a good reason, and it currently lives only in a
      stylesheet comment. It belongs in the release note the owner reads, not as a
      question and not as a decision to revisit.

what-this-contract-did-not-reach:
  statement: |
    "All acceptance criteria met" is one input and never a terminal green, and this
    review is one input too. Naming what it did not reach:
    THE MECHANISM IS IN BETTER SHAPE THAN THE WITNESSES. I walked the SQL, the
    classification order, the corrections and the projection by hand and found the
    implementation correct everywhere I looked, including all four arms of criterion
    14.16. Almost every finding here is about a guard that does not hold what it says it
    holds. That asymmetry is itself a fact about these phases: the code was built
    carefully and the instruments were built in a hurry at the end.
    WHAT I COULD NOT REACH. I did not exercise the real overview repository against a
    seeded household by hand for each of criterion 14.14's five cases; I established
