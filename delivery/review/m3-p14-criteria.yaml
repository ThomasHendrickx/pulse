e2e:
  quoted-honestly: |
    ONE FULL RUN of the Playwright gate, mine, against the pinned local stack.
      57 passed (20.4m), 8 failed, exit 1.
    It ran on the reviewer-local ports 3410 and 3510 rather than 3000 and 3100 because
    two other worktrees held those, twice racing this review's own start; the config used
    was otherwise identical to playwright.config.ts. It completed BEFORE the stack was
    destroyed: its last four tests passed.
    THE EIGHT, and the shape of each:
      accounts.spec.ts:173 CONTROL ARM             - signUp never produced household-context
      accounts.spec.ts:200 REGISTERED ARM          - toBeVisible after a submit
      accounts.spec.ts:286 mistyped account number - accounts-status element not found
      accounts.spec.ts:379 no ring is refused      - import-status element not found
      auth.spec.ts:11 sign up, sign out, sign in   - Sign in heading not found
      import.spec.ts:170 KBC card PDF plus companion - page.goto: test timeout 30000ms
      merchants.spec.ts:129 card group labels      - signUp never produced household-context
      navigation.spec.ts:195 desktop viewport      - signUp never produced household-context
    FIVE OF THE EIGHT fail inside signUp, before the test reaches its subject, which is
    the shape the dispatch records as settled for this container. Load average was between
    13 and 19 on four cores throughout, with two other Playwright suites running.
    THE DISPATCH'S OWN SIGNATURE OF ENVIRONMENTAL UNRELIABILITY REPRODUCED IN THIS RUN:
    navigation.spec.ts:195 FAILED under the chromium project (test 40) and PASSED under
    the chromium-phone project (test 63) in the SAME run.
  re-run-in-isolation: |
    The four failures in this phase's own spec were re-run in isolation against a freshly
    created and freshly migrated database after the stack was rebuilt:
      npx playwright test -g "CONTROL ARM|REGISTERED ARM|mistyped account number|declaration carrying no ring"
      -> 4 passed (1.2m), exit 0
    So none of the four is a defect in this phase. Recorded rather than assumed.
  claim: |
    I DO NOT CLAIM THE SUITE GREEN, and neither does the implementer. Criterion 14.10 and
    criterion 15.8 both require npm run test:e2e to exit 0 and it does not, in my run or
    in the implementer's reported run. Both criteria are marked partial for that clause
    and for no other reason.

