criteria:
  - id: "12.1"
    quote: "CONVERGENCE, COUNTED. A test in test/domain/counterparty-identity.test.ts parses the fixture through the shipped path and counts DISTINCT counterpartyIdentity keys over its rows."
    met: true
    evidence: >-
      test/domain/counterparty-identity.test.ts:72 parses the committed fixture
      through statementParser and asserts 24 rows, 12 identity keys and a
      BASELINE of exactly 24, printing all three. Captured by this review:
      "fixture rows 24, identity keys 12, baseline keys 24". The composition
      test at test/domain/counterparty-identity.test.ts:89 prints
      "account-basis rows 16 over 4 accounts, descriptor-basis rows 8" and
      asserts at least 8, at least 4 and at least 8. Independently reproduced
      through the committed harness: npx tsx
      test/fixtures/measure-identity-convergence.ts on the fixture, exit 0,
      rows 24, baseline-distinct-keys 24, identity-distinct-keys 12,
      identity-account-keys 4, identity-descriptor-keys 8,
      identity-rows-account-basis 16, identity-rows-descriptor-basis 8.
    plan-defect: >-
      THE COMPOSITION CLAUSE'S ARITHMETIC IS WRONG, and it is the plan's error
      rather than the implementer's, recorded here as instructed rather than
      raised as a finding against the work. The criterion asserts that "the 24
      rows and 12 counterparties this criterion also pins force the
      descriptor-basis count to exactly 8, so the at-least-8 threshold and the
      exactly-8 arithmetic are one requirement and not two." They do not force
      it. 24 rows over 12 counterparties is equally satisfied by, for instance,
      10 account rows over 5 accounts and 14 descriptor rows over 7
      counterparties. What forces 8 is the generator's composition, not the two
      pinned numbers. The threshold the criterion actually states, at least 8,
      is met with room to spare, so the criterion is met and the defective
      sentence changes no verdict; it should be corrected in the plan so a
      later reader does not rely on an entailment that is not there.
