    the extraction matches a shape rather than an identity: a username that is
    not the literal word postgres before the dot still yields a ref, and a host
    db.<ref>.example.com that is not the provider's domain still yields a ref.
    Neither is exploitable, and this lane says why rather than leaving it as a
    worry: in both cases the operator must independently name that exact host
    on the command line, and the host equality check at src/platform/db/target-guard.ts:242
    is the identity anchor that the ref extraction leans on. A permissive extraction
    cannot reach a project the operator did not name.
  - >-
    REMAINING CLAUSES: The no-override clause, the refusal-before-any-repository-call
    clause with a fake that must record none, and the clause that the routine's
    own diff carries only the wiring, are each carried by a labelled test in test/db/target-guard.test.ts,
    all green in the fast gate this review ran.
deviations-judged:
- deviation: >-
    Criterion 12.17, the half requiring the phase work history to record the command
    actually run AGAINST THE DEPLOYED DATABASE with its exit code and its printed
    before-and-after assignment-set sizes.
  serves-plan-intent: true
  reasoning: >-
    Judged against plan intent and it serves it. Decision D-46 forbids the routine
    running before the code deploys, and this branch is neither merged nor deployed,
    so the deployed run cannot be produced here without violating the decision
    criterion 12.17 itself pins. Criterion 12.17's own text hands it to criterion
    16.1. This lane records the same thing under criterion 12.17 as a plan defect
    rather than an implementer omission.
- deviation: >-
    Criteria 12.7, 12.8 and 12.9, which speak of "a seeded database" holding MerchantRule
    rows written under the baseline derivation.
  serves-plan-intent: true
  reasoning: >-
    Judged and accepted, with the cost named rather than waved through. The seeded
    subject for criteria 12.7, 12.8 and 12.9 is the in-memory fake at test/application/fake-import-world.ts
    and not a live Postgres, which is this tree's standing convention for the
    application layer. It serves plan intent because every clause those criteria
    state is about the routine's DECISIONS, and the fake carries the whole rule
    table and the whole row set. WHAT IT COSTS, and this lane says it rather than
    leaving it to the deviation: the real write path is then witnessed only by
    test/e2e/merchant-rule-write.spec.ts:76, which criterion 12.14 owes, and in
    the fast gate its atomicity rests on the substring assertion this review reports
    as finding CR6-M3P12-03.
- deviation: files-to-touch, which does not name .gitignore.
  serves-plan-intent: true
  reasoning: >-
