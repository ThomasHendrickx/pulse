      claimantMerchantClass 50". Acceptance is by the (ruleId, transactionId)
      pair at src/modules/merchants/application/rederive-rules.ts:966, never by
      the rule alone.
    the-model-of-the-tie-break: >-
      CHECKED AGAINST THE MATCHER RATHER THAN ASSUMED, because the property
      MODELS the tie-break instead of importing it, on the ground that importing
      would certify the function against itself. The model at
      test/property/rederive-loss-reporting.test.ts:99 is CORRECT for the worlds
      the generator builds. EXACT on equality: the matcher's bySpecificity at
      src/modules/merchants/domain/merchant-rule.ts:64 sorts by pattern length,
      then pattern, then id, and for EXACT candidates every pattern equals the
      key, so it reduces to lowest id, which is what the model does. Account
      basis then returns undefined, matching
      src/modules/merchants/domain/merchant-rule.ts:126. PREFIX by longest
      pattern then lowest id: the matcher's middle term, lexicographic pattern
      order, is unreachable for PREFIX, because two prefixes of one key of equal
      length are the same string, so the model is equivalent rather than merely
      close. The one divergence I found is inert: the model does not filter the
      empty pattern or a bare namespace, which the matcher does at
      src/modules/merchants/domain/merchant-rule.ts:113, and no generated world
      contains either.
    what-it-does-about-PATTERN: >-
