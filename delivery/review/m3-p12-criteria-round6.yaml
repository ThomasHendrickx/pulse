- deviation: >-
    CRITERIA finding CR5-M3P12-11, which asks that a pass-two promotion adding
    no rule get its own outcome token.
  serves-plan-intent: true
  reasoning: >-
    Serves plan intent, and the reasoning holds structurally. A token separating
    an inserted promotion from one already held differs between run one and run
    two by construction, because run one inserts and run two finds the same rule
    already held. Criterion 12.8's content is that idempotence means the same
    ANSWER, so a token that cannot be stable across runs is exactly what that
    criterion forbids. Building it, witnessing four idempotence tests fail and
    reverting is better evidence than declining it on argument. formatDecisionReport
    at src/modules/merchants/application/rederive-rules.ts:1061 emits no such
    token, which this lane read and confirms.
- deviation: >-
    CRITERIA finding CR5-M3P12-05 and the dispatch that accepted it, both of which
    describe the development-server refusal as gated on isProduction() being false.
  serves-plan-intent: true
  reasoning: >-
    Serves plan intent. Gating the development-server refusal on NODE_ENV being
    exactly "development" rather than on the negation of isProduction() is narrower
