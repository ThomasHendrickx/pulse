control-experiment:
  claim: |
    The implementer claims M5, deleting the same-kind conjunct from the
    claimant lookup, reddens two properties WITH the new cross-kind generator
    dimension and is not caught at all without it.
  method: |
    A reviewer probe applied M5's exact edit to
    src/modules/merchants/application/rederive-rules.ts and, for half B, also
    removed the string "cross-kind-pattern-collision" from the scenarios list
    in test/property/rederive-loss-reporting.test.ts, then ran the property
    file and the 59-test example file. Both files were restored and both
    checksums matched (src 33f7f7fee0ddf710, property 13d4bca44a4659ab), and
    git status was clean afterwards.
  half-a-with-the-dimension: |
    Tests 2 failed (2). RED ON BOTH.
    FIRST: AssertionError: expected { row: 'descriptorRow', lost: false } to
    deeply equal { row: 'descriptorRow', lost: true }
    SECOND: AssertionError: expected 'PREFIX' to be 'EXACT'
    The 59 example tests: 59 passed (59). They do not catch it either way.
  half-b-without-the-dimension: |
    Property file: Tests 2 passed (2). GREEN.
    Example file: Tests 59 passed (59). GREEN.
    M5 is NOT CAUGHT AT ALL, by anything.
  half-c-control-for-the-control: |
    With no mutant and the dimension still removed the property file is
    Tests 2 passed (2), so half B's green is the mutant surviving and not the
    generator having been broken by the edit.
  verdict: |
    REPRODUCED IN BOTH HALVES, exactly as claimed. This is the argument the
    round wanted and it holds: a missing generator DIMENSION is a defect in
    the instrument, not a missing count. Six shape counts were all greater
    than zero in half B while a wrong predicate walked through, which is the
    clearest available demonstration that a count is not a discriminator.
probes:
  - name: "the sixth wrong predicate the five mutants do not represent"
    what: |
      Criterion 12.7 fixes the order of the two key spaces in the BEFORE set
      ("THE PRE-PHASE SPACE IS CONSULTED FIRST"), and it says why: with the
      identity space first, a row claimed in both spaces is credited to the
      claimant on both sides, nothing changes hands and the exception is
      unreachable. No mutant in the five represents that wrong answer, so I
      built it: swap the two arms of the ?? in assignmentSet at
      src/modules/merchants/application/rederive-rules.ts:441.
    result: |
      RED, on the FIRST biconditional:
      AssertionError: expected { row: 'descriptorRow', lost: true } to deeply
      equal { row: 'descriptorRow', lost: false }
      So the property DOES discriminate the ordering. The tree is restored
      (checksum 33f7f7fee0ddf710 before and after, git status clean).
  - name: "a mutant that crashes rather than being caught"
    what: |
      Inserted a call to an identifier that does not exist, so the property
      file dies rather than failing an assertion.
    result: |
      The harness's own attribution reports 'red on: FIRST biconditional and
      SECOND, the lineage check', does not increment its failure counter, and
      exits 0. It is indistinguishable in the harness output from a genuine
      catch except for the '(no assertion line found)' line, which nothing
      acts on. See finding CR6-M3P12-01.
  - name: "an anchor that silently stops matching"
    what: |
      test/property/mutants.mts:196 counts the anchor's occurrences and throws
      when the count is not exactly one, inside the try whose finally restores
      the file. Handed a deliberately non-matching anchor the probe threw
      'anchor matched 0 times' and the file was still restored. THIS DEFENCE
      HOLDS; it is not the twelfth.
  - name: "the label guard in the measurement harness"
    what: |
      measurementLabel at test/fixtures/measure-identity-convergence.ts:45
      exists to stop a real document's FILE NAME reaching a record, because
      those names embed an account number (fleet warning 9). Handed a wholly
      invented path in the shape a bank export uses, where the account number
      leads the basename.
    result: |
      It emitted the first eight characters of the account number. See
      finding CR6-M3P12-02.
