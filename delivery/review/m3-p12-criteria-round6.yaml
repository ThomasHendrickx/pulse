  - >-
    PLAN DEFECT: THE COMPOSITION CLAUSE'S ARITHMETIC IS WRONG, and it is the plan's
    error rather than the implementer's, recorded here as instructed rather than
    raised as a finding against the work. The criterion asserts that "the 24 rows
    and 12 counterparties this criterion also pins force the descriptor-basis
    count to exactly 8, so the at-least-8 threshold and the exactly-8 arithmetic
    are one requirement and not two." They do not force it. 24 rows over 12 counterparties
    is equally satisfied by, for instance, 10 account rows over 5 accounts and
    14 descriptor rows over 7 counterparties. What forces 8 is the generator's
    composition, not the two pinned numbers. The threshold the criterion actually
    states, at least 8, is met with room to spare, so the criterion is met and
    the defective sentence changes no verdict; it should be corrected in the plan
    so a later reader does not rely on an entailment that is not there.
