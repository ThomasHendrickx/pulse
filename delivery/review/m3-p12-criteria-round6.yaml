# WHAT THIS CONTRACT DID NOT REACH. Required by the criteria contract, which
# says in as many words that "all acceptance criteria met" is one input and
# never a terminal green: a phase whose contract did not contain the defect
# can satisfy every criterion in it and still be broken.
not-reached-by-this-contract:
  - >-
    THE DEPLOYED RUN, AND EVERYTHING DOWNSTREAM OF IT. Nothing in this phase
    runs the re-derivation against a real database of the owner's. The interlock
    is verified as a pure function over invented connection strings, the routine
    is verified against a fake write port, and criterion 12.17 hands the
    deployed run to criterion 16.1. So the strongest claim available today is
    that the routine is correct about a model of the table, not that it is
    correct about the table.
  - >-
    THE REAL WRITE PATH. npm run test:e2e was not run, so
    test/e2e/merchant-rule-write.spec.ts:76, the only test that exercises
    applyRuleWrites against Postgres, is unwitnessed, and in the fast gate its
    atomicity is pinned by the substring this review reports as CR6-M3P12-03.
  - >-
    CONTENT, AS OPPOSED TO IDENTIFIER SHAPES. gate:privacy decides three things
    and a merchant name or a place name inside a tracked file is invisible to
    all three. I did not compare the tree token by token against the real
    documents, which is how the two descriptors that reached this public
    repository were found before, and no criterion in this phase asks anyone to.
  - >-
    PATTERN, IN THE GENERATED WORLDS. After this round the generator can falsify
    the same-kind conjunct for PREFIX and still cannot for PATTERN. That is a
    narrower version of the gap this round closed and no criterion names it.
  - >-
    THE NUMBERS ON THE OWNER'S OWN MONTH. Criterion 12.2's figures are evaluated
    on the record, not on a re-run, because reading the owner's uploads was
    refused by this environment. Transcription between the run and the record is
    not closed by anything I did.

