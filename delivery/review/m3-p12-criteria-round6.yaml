    path into a public repository and broke any clone; removing it and widening
    the ignore pattern from a directory-only form is a repair, and files-to-touch
    cannot be expected to have anticipated it.
- deviation: >-
    files-to-touch, which does not name src/app/globals.css, test/e2e/, messages/en.json,
