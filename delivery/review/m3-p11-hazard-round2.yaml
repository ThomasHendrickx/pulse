findings:
  - id: HZ2-M3P11-01
    severity: medium
    analysis: >-
      THE IDENTITY THE NEW CLAIM RECORD IS KEYED BY IS NOT UNIQUE PER ROW,
      so both arms HZ-M3P11-02 named are still reachable. The fix separates
      two identities without noticing that they are different. A claim is
      MATCHED on direction plus label, which is correct and is what stops a
      naming on one side raising its notice on the other. A claim is
      WRITTEN and RETIRED on rowKey alone, and rowKey is the row's
      data-group-key, which the review derives per direction from the same
      counterparty identity. A counterparty that has both a spend row and a
      refund is one identity in two directions, so the two rows carry the
      same key and the store cannot tell them apart at the only two moments
      it needs to. Naming the second of those rows replaces the first row's
      entry, so the first row's difference is untold, which is the
      overwrite arm. A failure on either retires the other's entry, which
      is the arm about a failure clearing a sibling's claim. Both were
      named in round one, both were the reason for this fix, and both were
      reached by this lane. Nothing here is exotic data: a shop that issues
      a refund is the ordinary case and the review's own structure produces
      it. The module's honest note about what it still cannot do reasons
      about the row that ANSWERS not being the row that submitted, and does
      not reach the different problem that two rows which SUBMIT can share
      a key. The fast-gate tests that witnessed this fix red then green all
      use two distinct row keys, so they encode the assumption rather than
      test it, and the one whose prose describes exactly this two-row case
      gives the two rows different keys. One consequence outside the
      mechanism: the spec addresses rows by data-group-key, so a fixture in
      which one counterparty appeared on both sides would make those
      locators ambiguous and the spec would fail on a strict-mode violation
      rather than measure anything.
    evidence:
      - >-
        Probe run by this lane with npx tsx from the session scratchpad,
        importing the SHIPPED modules by absolute path and editing nothing.
        buildMerchantReview over three invented rows in which one
        counterparty has a spend row and a refund printed:
        income group keys: ["descriptor:PROBE COUNTERPARTY ALPHA"];
        spend group keys: ["descriptor:PROBE COUNTERPARTY BETA","descriptor:PROBE COUNTERPARTY ALPHA"];
        KEYS APPEARING IN BOTH DIRECTIONS: ["descriptor:PROBE COUNTERPARTY ALPHA"].
      - >-
        The overwrite arm, same run, driving the shipped claim store with
        that key exactly as the leaf does: "after naming the income row,
        entries: 1"; "after naming the spend row too, entries: 1
        [{"rowKey":"descriptor:PROBE COUNTERPARTY ALPHA","direction":"spend"}]";
        "income row asks for its difference notice, outcome: none".
      - >-
        The wrong-row retirement arm, same run: "income entries surviving
        the spend row's failure: 0"; "income row asks after that failure,
        outcome: none".
      - >-
        The code the probe exercised: the additive write at
        src/modules/merchants/ui/naming-claims.ts:65, the retirement at
        naming-claims.ts:73, the direction-scoped match at
        naming-claims.ts:103 and naming-claims.ts:113, the leaf passing
        groupKey as the identity at
        src/modules/merchants/ui/merchant-row.tsx:271 and
        merchant-row.tsx:295, and the per-direction grouping that makes the
        key ambiguous at
        src/modules/merchants/domain/merchant-review.ts:178 and
        merchant-review.ts:179 over the key defined at
        merchant-review.ts:49.
      - >-
        The fast-gate tests that encode the distinct-key assumption:
        test/app/naming-claims.test.ts:31, test/app/naming-claims.test.ts:37,
        test/app/naming-claims.test.ts:56, test/app/naming-claims.test.ts:62
        and test/app/naming-claims.test.ts:85, the last of these inside the
        two-row direction test that begins at
        test/app/naming-claims.test.ts:79.
      - >-
        Gates run by this lane at this head, none of which sees it: npm run
        typecheck EXIT=0, npm run lint EXIT=0, npm test EXIT=0 over 690
        tests in 52 files, npx playwright test --list EXIT=0 over 114
        tests, npm run gate:privacy EXIT=0, npm run gate:decisions EXIT=0.
    concrete-fix: >-
      Make the identity as specific as the match already is. The smallest
      correct change is to key the store on the pair rather than on the
      row: add the direction to NamingClaim's identity and have
      recordNaming (naming-claims.ts:65) and forgetNaming
      (naming-claims.ts:73) filter on rowKey AND direction. That is three
      lines, needs nothing from the projection criterion 11.8 pins to an
      empty diff, and the leaf already has the direction in scope at both
      call sites (merchant-row.tsx:271 and merchant-row.tsx:295). Then make
      the fast-gate tests the red witness for THIS fix rather than
      inheriting the last one's: give two entries the SAME rowKey with two
      different directions, which is the shape the screen actually
      produces, and keep one case with distinct keys so both are pinned. As
      written those tests pass unchanged against the defective code, which
      is why they did not catch it. The alternative, making the row key
      unique on the screen by folding the direction into it, is the larger
      change, because that attribute is what criterion 11.3 compares and
      what the spec addresses rows by.
  - id: HZ2-M3P11-02
    severity: low
    analysis: >-
      THE ONE NOTICE ON SCREEN CAN BE ABOUT A ROW THE READER DID NOT JUST
      ACT ON. The queue closes the collision and puts a pairing problem in
      its place. It shows the notice that has waited longest, so if row A's
      notice is up undismissed and row B's is waiting, and the reader then
      retries row A, the leaf clears row A's notice at the start of the
      action, row A leaves the queue, B's notice takes the screen, and row
      A's new failure joins the back. The reader presses the naming control
      on row A and what appears at the bottom of the phone is a sentence
      about row B. Nothing is lost and nothing is covered, so the harm
      HZ-M3P11-01 named stays closed; what is wrong is that the notice on
      screen is no longer the one the reader's last action produced, and
      the notice text carries no row identity. The aria-describedby the fix
      round added helps a reader who is on the row and does nothing for one
      reading the bottom of the screen. Separately, and this is the half
      clause R-087 asks to be named rather than noted: the queue module
      documents its re-entry as idempotent so that a row keeps its place,
      which is true of enterNoticeQueue in isolation and is defeated by the
      leaf, whose queue effect lists the notice OBJECT as a dependency and
      whose setNotice always builds a new object, so every re-raise runs
      the cleanup and then the effect and lands at the back.
    evidence:
      - >-
        Probe run by this lane with npx tsx, driving the shipped
        notice-queue module in the order the leaf drives it: "A raised then
        B raised. showing A: true showing B: false waiting:
        ["rowA","rowB"]"; "idempotent re-enter of A keeps its place:
        ["rowA","rowB"]"; "A re-submits, so the leaf sets notice null and A
        leaves. showing B now: true"; "A's NEW failure enters. waiting:
        ["rowB","rowA"] showing A: false showing B: true".
      - >-
        The code the probe exercised: the front-of-queue rule at
        src/modules/merchants/ui/notice-queue.ts:86, the idempotent
        re-entry and the comment claiming it at
        src/modules/merchants/ui/notice-queue.ts:66 and
        notice-queue.ts:68, the leaf's queue effect and its dependency list
        at src/modules/merchants/ui/merchant-row.tsx:189 through
        merchant-row.tsx:199, and the clearing of the notice at the start
        of every submit at merchant-row.tsx:270.
      - >-
        The committed journey never reaches it: the two-notice test at
        test/e2e/optimistic-naming.spec.ts:567 raises two notices on two
        rows and dismisses them in order, and never re-raises on a row
        whose notice is already up. npm test EXIT=0 over 690 tests and npx
        playwright test --list EXIT=0 over 114 at this head.
    concrete-fix: >-
      Decide which notice wins and put the decision in one place. The
      behaviour that matches what a reader expects is that the newest
      notice is the one on screen, which is isNoticeShowing at
      src/modules/merchants/ui/notice-queue.ts:86 reading the LAST entry
      rather than the first, with the older ones waiting behind it; that
      keeps everything the queue bought, since nothing is dropped and
      nothing is covered, and it makes the notice always be about the
      action just taken. Whichever order is chosen, correct the comment at
      src/modules/merchants/ui/notice-queue.ts:66 so it stops claiming an
      idempotence the leaf defeats, or give the leaf's queue effect at
      src/modules/merchants/ui/merchant-row.tsx:199 a dependency that does
      not change on every re-raise so the claim becomes true. Add the
      measurement beside the two-notice journey at
      test/e2e/optimistic-naming.spec.ts:567: raise a notice on one row,
      leave it, raise one on a second row, act on the first row again, and
      assert which notice is on screen.
  - id: HZ2-M3P11-03
    severity: low
    analysis: >-
      THE NEW SHAPE GUARD VALIDATES THE DISCRIMINANT AND NOT THE PAYLOAD IT
      THEN DEREFERENCES. The guard was written for a framework that stops
      signalling the redirect as a rejection, and against that it works:
      undefined, null and an object with no ok all fall to the loud failure
      arm. It checks that ok is a boolean and stops there, so the refusal
      arm's own payload is still taken on trust, and the refusal arm is the
      one that dereferences. An answer of ok false carrying no error passes
      the guard, reaches the lookup of the refusal wording by kind, and
      throws exactly the TypeError the finding was raised about, in exactly
      the place it was raised about, so the reader meets an error boundary
      instead of a notice. The shape is one the server action cannot
      produce today, which is why this is low rather than medium; it is
      also precisely the assumption HZ-M3P11-06 said should stop being
      made, so leaving half of it in place leaves that finding half open.
    evidence:
      - >-
        Probe run by this lane with npx tsx, applying the shipped
        predicate to six answers and taking the branch the leaf takes:
        undefined -> loud failure arm (guard caught it); null -> loud
        failure arm; {} -> loud failure arm; {"ok":true} -> no notice;
        {"ok":false,"error":{"kind":"empty-counterparty"}} -> refusal
        wording; {"ok":false} -> THROWN INSIDE THE TRANSITION: TypeError:
        Cannot read properties of undefined (reading 'kind').
      - >-
        The code the probe mirrors: the predicate isNamingActionResult
        declared in src/modules/merchants/ui/merchant-row.tsx:76, its use
        at src/modules/merchants/ui/merchant-row.tsx:299, and the
        dereference it is meant to guard at merchant-row.tsx:314.
      - >-
        The predicate has no unit test of its own, so nothing in the fast
        gate would notice the missing arm: npm test EXIT=0 over 690 tests
        at this head, and npm run typecheck EXIT=0.
    concrete-fix: >-
      Finish the predicate at src/modules/merchants/ui/merchant-row.tsx:76:
      on the false arm require error to be an object carrying a string
      kind, and return false otherwise, so a malformed refusal joins the
      three shapes that already degrade to the loud failure. That is two
      lines and needs no other change, because the caller at
      merchant-row.tsx:299 already treats a failed guard as the transport
      arm. Give the predicate a unit test beside the other two pure
      modules, with the six shapes above as its cases; it is a pure
      function and the fast gate is where it belongs, which is the same
      reasoning this fix round applied to the claim and the queue.

