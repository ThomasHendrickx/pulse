reattack:
  - id: R1
    probe: two rows in flight and a third arriving
    status: probed
    result: >-
      The store is genuinely additive and per rowKey, and two rows with
      DIFFERENT keys no longer overwrite each other. But the key the leaf
      passes is the row's data-group-key, and that value is not unique on
      the screen. Captured, running the shipped domain and the shipped
      claim module together through npx tsx on a three-row invented
      fixture where one counterparty has a spend row and a refund:
        income group keys: ["descriptor:PROBE COUNTERPARTY ALPHA"]
        spend  group keys: ["descriptor:PROBE COUNTERPARTY BETA","descriptor:PROBE COUNTERPARTY ALPHA"]
        KEYS APPEARING IN BOTH DIRECTIONS: ["descriptor:PROBE COUNTERPARTY ALPHA"]
        after naming the income row, entries: 1
        after naming the spend row too, entries: 1 [{"rowKey":"descriptor:PROBE COUNTERPARTY ALPHA","direction":"spend"}]
        income row asks for its difference notice, outcome: none
      So the second naming still overwrote the first row's entry and the
      first row's difference is still untold. See HZ2-M3P11-01.
  - id: R2
    probe: a failure retiring the wrong row
    status: probed
    result: >-
      REACHED. forgetNaming filters on rowKey alone while claimNaming
      matches on direction plus label, so the retirement is coarser than
      the claim. With the duplicate key above, captured in the same run:
        income entries surviving the spend row's failure: 0
        income row asks after that failure, outcome: none
      A failure on the spend row retires the income row's claim, which is
      the arm HZ-M3P11-02 named. See HZ2-M3P11-01.
  - id: R3
    probe: >-
      the queue under rapid repeated failures, and under dismissal while an
      action is still pending
    status: probed
    result: >-
      No notice is ever covered and none is lost, so HZ-M3P11-01's harm is
      closed. What the queue does instead is reorder. Captured, driving the
      shipped notice-queue module in the order the leaf drives it:
        A raised then B raised. showing A: true showing B: false waiting: ["rowA","rowB"]
        idempotent re-enter of A keeps its place: ["rowA","rowB"]
        A re-submits, so the leaf sets notice null and A leaves. showing B now: true
        A's NEW failure enters. waiting: ["rowB","rowA"] showing A: false showing B: true
      The idempotence the module documents is real of enterNoticeQueue and
      is defeated by the leaf, whose queue effect lists [notice, noticeId]
      and whose setNotice always builds a NEW object, so a re-raise runs
      the cleanup and then the effect. See HZ2-M3P11-02.
  - id: R4
    probe: >-
      the masked comparison against a label whose masking changes its length
    status: probed
    result: >-
      CLOSED, and closed structurally rather than by luck. The screen's
      label is mask(stored), the stored value is the trimmed typed string,
      and the claim now compares against mask(typed) and mask(typed.trim()),
      so the trimmed branch matches whatever the masking does to either
      side; the rule does not depend on the masking being injective.
      Captured, running the shipped masking and the shipped claim module
      together over three invented names, one of them carrying a long digit
      run of the shape the masking exists for (the digits are not quoted
      here, so this document adds no identifier shape to the tree):
        a name typed with surrounding whitespace, digit run    -> differs
        a name typed with surrounding whitespace, plain        -> differs
        a name typed with no surrounding whitespace, digit run -> confirmed
      Recorded as a by-product: on these invented inputs maskCardNumbers
      returned its argument unchanged, so this run exercised the symmetry
      of the comparison rather than a length change. The symmetry is what
      the closure rests on and it holds for any render function.
  - id: R5
    probe: >-
      the shape-parsing client against a resolution it does not recognise
    status: probed
    result: >-
      Half closed. Captured, running the shipped guard's own predicate over
      six answers and taking the branch the leaf takes:
        undefined -> loud failure arm (guard caught it)
        null -> loud failure arm (guard caught it)
        {} -> loud failure arm (guard caught it)
        {"ok":true} -> no notice
        {"ok":false,"error":{"kind":"empty-counterparty"}} -> refusal: failed copy
        {"ok":false} -> THROWN INSIDE THE TRANSITION: TypeError: Cannot read properties of undefined (reading 'kind')
      See HZ2-M3P11-03.
  - id: R6
    probe: >-
      new defects introduced by the eight commits, spec vacuity included
    status: not-yet-probed

findings:
  - id: HZ2-M3P11-01
    severity: medium
    title: >-
      The identity the new claim record is keyed by is NOT unique per row.
      One counterparty with rows on both sides renders two rows carrying
      the same data-group-key, so the additive write still overwrites a
      sibling and a failure still retires the wrong row.
    status: CONFIRMED by probe, witness captured under reattack R1 and R2
  - id: HZ2-M3P11-02
    severity: low
    title: >-
      The notice queue is ordered by when a notice was raised, and the
      leaf's own effect sends a re-raising row to the back, so the one
      notice on screen can be about a row the reader did not just act on.
    status: CONFIRMED by probe, witness captured under reattack R3
  - id: HZ2-M3P11-03
    severity: low
    title: >-
      The new shape guard validates the discriminant but not the payload it
      then dereferences: an answer of ok false with no error still throws a
      TypeError inside the transition, which is the class HZ-M3P11-06 was
      raised to close.
    status: CONFIRMED by probe, witness captured under reattack R5
