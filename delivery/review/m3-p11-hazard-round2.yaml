deviations-judged:
  - deviation: >-
      files-to-touch (the list carries src/modules/merchants/ui,
      src/platform/ui, src/app/globals.css, messages/, playwright.config.ts
      and test/e2e/ with one new spec)
    serves-plan-intent: true
    reasoning: >-
      The three files outside the list are each a mechanical consequence of
      a guard merged after the plan was written, and leaving any of them
      unedited would have left the tree red rather than the phase smaller.
      test/app/client-boundary.test.ts asserts the client files by name, so
      the two new leaves redden it until named;
      test/domain/merchant-review.test.ts pins the descriptor-surface
      walk's counts, and moving the review row into a leaf moved a counted
      surface; test/e2e/merchants.spec.ts is inside the declared path and
      is an amendment forced by this phase's own step removing the failure
      redirect. All three were declared rather than absorbed, which is what
      the scope rule asks. This lane checked the stronger half itself: the
      layers criterion 11.8 pins to an empty diff really are empty, so the
      widening did not reach the domain or the application.
  - deviation: >-
      criterion 11.7(a), "grep -rln \"use client\" src/ returns at most
      FIVE files"
    serves-plan-intent: true
    reasoning: >-
      The number is unsatisfiable on any tree containing M3-P14, which
      shipped a fourth directive file before this phase, so five was stale
      rather than breached. The right response to a criterion that cannot
      pass is to report it, which is what happened, rather than to
      reinterpret it silently, which is the shape hazard H11.11 exists
      against. The SUBSTANCE of 11.7 is what the guard was for and it holds
      at this head: one module leaf, the toast, nothing under src/app, and
      an import closure this lane walked itself. The count should be
      corrected to six in a plan amendment rather than argued about again
      next phase.
  - deviation: >-
      step "Make the naming action REPORT its outcome instead of
      redirecting a failure into a status nothing reads"
    serves-plan-intent: true
    reasoning: >-
      The clause's premise is stale because M3-P12 merged after the plan
      was written and made the screen read that status, so the step's
      description of the base was wrong while its instruction was right.
      The implementer kept the instruction and recorded the premise as
      false, which is the honest handling. This lane checked the
      consequence the premise change creates and found it stated rather
      than hidden: nothing sets the status any more, the banner path is
      kept renderable for a hand-typed URL, and the comment that used to
      claim the action redirects with those statuses was corrected in
      place (src/modules/merchants/ui/merchant-review.tsx:152).

hazard-classes-addressed:
  - class-id: H11.1
    probed: >-
      Walked every value the leaf renders looking for a figure derived in
      the browser, and drove the merge case's arithmetic question at the
      source. The leaf renders the total straight from its server prop
      (src/modules/merchants/ui/merchant-row.tsx:250) and predicts the
      label alone (merchant-row.tsx:258); the summing the hazard describes
      lives only in the use case
      (src/modules/merchants/application/assign-merchant.ts:165 through
      assign-merchant.ts:167), which the fix round did not touch.
    cleared-because: >-
      No money figure is computed anywhere on the client. The one place a
      domain rule could have been copied into the browser, the merge, is
      explicitly not predicted, and the committed journey holds a naming
      into an existing merchant in flight and asserts two rows and two
      totals are still there.
  - class-id: H11.2
    probed: >-
      Tried to construct a silent revert on every arm of the client's
      catch and on the queue: a transport failure, a domain refusal, an
      unrecognised resolution, a second row failing while the first notice
      is up, and a row leaving the screen with a notice still queued. Drove
      the shipped notice queue directly with npx tsx.
    cleared-because: >-
      Every failure arm raises a notice, the notice has no timer
      (src/platform/ui/toast.tsx), and a row that unmounts releases the
      queue rather than closing it behind itself
      (src/modules/merchants/ui/merchant-row.tsx:195). The one residue is
      ordering rather than silence and is recorded as HZ2-M3P11-02.
  - class-id: H11.3
    probed: >-
      Checked both halves of the non-visual path for presence AND for
      reachability: the polite region's insertion, the description on the
      control that has focus, and what happens to that description while
      the control is disabled for exactly the window it exists.
    cleared-because: >-
      The region is always in the tree and filled only while predicting
      (src/modules/merchants/ui/merchant-row.tsx:344), the failure notice
      is assertive and the difference notice polite
      (merchant-row.tsx:321 and merchant-row.tsx:328), and the fix round
      closed the gap this lane would otherwise have raised by putting the
      same description on the naming field, which is not disabled
      (merchant-row.tsx:339).
  - class-id: H11.4
    probed: >-
      Read every string the leaf and the toast can render and traced each
      to its origin, then compared the three catalogues and the reworded
      failure sentence across them.
    cleared-because: >-
      No English sentence exists in either component: both take every
      string as a prop and the copy object is resolved server side
      (src/modules/merchants/ui/merchant-review.tsx:74). No error code and
      no exception text crosses the boundary; only the refusal KIND does
      (src/modules/merchants/ui/actions.ts:57). The three catalogues carry
      the same key set and three real translations of the reworded
      sentence.
  - class-id: H11.5
    probed: >-
      Drove the shipped claim module directly with npx tsx against the
      shipped review projection: two rows named in sequence, a failure on
      one while another waits, a claim asked for from the other direction,
      and a name whose rendering the masking would rewrite.
    finding: HZ2-M3P11-01
  - class-id: H11.6
    probed: >-
      Read package.json and the two new modules' import lists for a toast
      package, a component library or a state store, and checked what the
      queue and the claim record are actually built out of.
    cleared-because: >-
      Nothing was added. Both new modules are dependency-free TypeScript
      (src/modules/merchants/ui/notice-queue.ts and
      src/modules/merchants/ui/naming-claims.ts), the notice is hand-built
      (src/platform/ui/toast.tsx), and the cross-row state is a plain
      module value read through useSyncExternalStore rather than a
      provider, which is also what keeps the review list a server
      component.
  - class-id: H11.7
    probed: >-
      Looked for any window in which the predicted label is on screen
      without its marking: before the marking is applied, between the two
      halves, and after the response is released.
    cleared-because: >-
      The marking is derived from the same value as the prediction, so
      they cannot disagree: data-unconfirmed, the region's content and the
      description are all conditioned on the single predicted flag
      (src/modules/merchants/ui/merchant-row.tsx:245 and
      merchant-row.tsx:254), which is set in the same statement as the
      optimistic label. There is no ordering in which one appears without
      the other.
  - class-id: H11.8
    probed: >-
      Compared the merchants module's domain and application directories
      against the base to see whether any presentation problem had been
      solved beneath the ui layer, the sort and the projection especially.
    cleared-because: >-
      git diff --stat origin/main...HEAD over
      src/modules/merchants/application and src/modules/merchants/domain
      printed nothing at all, and the fix round added no file under either.
      The claim module's own note records that the projection was NOT
      widened to carry the link it would have liked, and names criterion
      11.8 as the reason.
  - class-id: H11.9
    probed: >-
      Ran the privacy gate over the merged fix head and over this
      document, and read what the phase's new DOM attribute and new spec
      put into failure messages and retained traces.
    cleared-because: >-
      npm run gate:privacy EXIT=0, "gate:privacy clean". The group key that
      became a DOM attribute is masked before it is rendered
      (src/modules/merchants/ui/merchant-review.tsx:87), every merchant
      name in the new spec is invented, and this lane's own probe output
      was restated without quoting a digit run so this document adds no
      identifier shape to the tree.
  - class-id: H11.10
    probed: >-
      Checked specifically for aria-busy on the row, the group label or
      the live region, which is the inversion this class names, and for
      the weaker version of the same error, a description attached to a
      control assistive technology cannot reach.
    cleared-because: >-
      aria-busy appears only on the submit control
      (src/platform/ui/submit-button.tsx:106) and the spec asserts its
      absence on the other three elements. The fix round also closed the
      reachability half by putting the same description on the naming
      field, since the submit control is disabled for exactly the window
      the description exists.
  - class-id: H11.11
    probed: >-
      Looked for a criterion quietly reinterpreted rather than reported
      red, by comparing each criterion's literal demand against what the
      artifact does, and by reading the declared deviations for the ones
      that could not pass as written.
    cleared-because: >-
      The one criterion that cannot pass as written, 11.7(a)'s count of
