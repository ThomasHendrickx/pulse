findings:
  - id: CR-401
    severity: low
    evidence:
      - >-
        src/modules/merchants/adapters/merchant-repository.ts:137-163:
        setMerchantTag runs demote-then-promote inside prisma.$transaction
        with no isolation level, so Postgres read committed applies. Two
        CONCURRENT promotes of different tags on one merchant can each
        take a demote snapshot that does not contain the other's
        not-yet-committed primary, demote nothing that matters, and
        commit two primaries: the comment at
        src/modules/merchants/application/ports.ts:82 ("at most one
        primary per merchant is an application-enforced invariant") and
        the test sentence at
        test/application/resolve-merchants.test.ts:421 ("exactly one
        primary per merchant, always") both state more than read
        committed guarantees. Static analysis; not executed against a
        database (off-limits to this reviewer).
      - >-
        Same function, second weakness: the upsert where clause at
        src/modules/merchants/adapters/merchant-repository.ts:148-154
        selects on the (merchantId, tagId) unique alone, with no
        householdId, and neither setMerchantTag nor upsertRule
        (merchant-repository.ts:72-102) verifies that input.merchantId
        belongs to context.householdId, against CLAUDE.md non-negotiable
        6. Executed grep bounds the exposure: tagMerchant and
        setMerchantTag have no call site outside src/modules/merchants
        (no UI action exists this phase), and the only upsertRule caller
        is assignMerchant, which derives merchantId in-household, so no
        cross-household write is REACHABLE at this head; the adapter
        alone does not enforce it.
    concrete-fix: >-
      Pass an explicit isolation level to the setMerchantTag transaction
      (Serializable, with a retry on serialization failure) or lock the
      merchant row first; and start the function by resolving the
      merchant under householdId (findFirst on id plus householdId,
      throw on miss), which closes both the tenancy gap and the
      foreign-merchant upsert in one check. One regression test naming
      the invariant's concurrency edge, even if it can only document the
      chosen isolation.
    analysis: >-
      Filed low, not medium: the race needs two concurrent promotes on
      one merchant in a single household, no UI path can issue one at
      all at this head, the bad state is a display anomaly (two primary
      badges) with zero monetary effect, and the next promote heals it.
      What earns the finding is the gap between the stated invariant
      ("always", "atomic") and what the committed code guarantees, which
      is exactly the class R-087 names.
  - id: CR-402
    severity: low
    evidence:
      - >-
        Executed construction P-I1: normaliseCounterparty("STARBUCKS
        OXFORD") is "STARBUCKS OXFORD" under the committed recipe, so a
        manual naming stores that EXACT pattern
        (src/modules/merchants/application/assign-merchant.ts:57-66);
        re-normalising the same raw text under a recipe with OXFORD
        added to CITY_TOKENS yields "STARBUCKS", and matchRules of that
        string against the stored rule returns undefined. Captured
        probe output in the work log above.
      - >-
        The recipe file INVITES exactly that extension with no warning:
        src/modules/merchants/domain/normalise-counterparty.ts:19-20
        ("extend the list when a new export shows a new shape") and the
        city-token comment say a missing city only means the pattern
        includes it, which is true at write time and silently false for
        every ALREADY-STORED rule the moment the list grows. Contrast
        src/modules/import/domain/dedup.ts:18-22, where the sibling
        recipe carries an explicit STABILITY CONTRACT for precisely this
        reason. Open question M1P4-C8 in the work history discusses the
        list as data but never names the stored-pattern invalidation.
    concrete-fix: >-
      Write the missing stability note at the top of
      normalise-counterparty.ts: rule patterns are stored in normalised
      form, so ANY recipe change (city token, noise pattern, date shape)
      must ship with a one-off re-normalisation of stored MerchantRule
      patterns (EXACT and PREFIX) in the same change, or must instead
      normalise the stored pattern at match time (the recipe is
      idempotent over its own output, executed probe P-J1, so
      re-normalising patterns is safe for EXACT). Add it to M1P4-C8 so
      the list-as-data product question carries the migration
      obligation.
    analysis: >-
      Filed low: nothing at THIS head triggers it, totals never move
      (the affected rows regress to visible unresolved groups, the
      H3.1-adjacent outcome of a user decision silently ceasing to
      apply, not a misassignment), and the one-click naming repairs each
      regressed group. It is the same frozen-recipe class the dedup key
      already documents, one module over, with the guard missing.
  - id: CR-403
    severity: low
    evidence:
      - >-
        Executed probes (captured in the work log, P-G3): with the comma
        style, parseAmountToCents("7EUR42,10") returns 74210 and
        parseUnsignedAmountToCents("7EUR42,10") returns 74210;
        parseUnsignedAmountToCents("EEURUR742,10") returns 74210; with
        the dot style parseAmountToCents("1EUR2") returns 1200. In each
        case stripCurrencyNoise
        (src/modules/import/domain/parse-amount.ts:25-26) deletes a
        currency token BETWEEN digit fragments and the fragments
        concatenate into a plausible parsed amount instead of a loud row
        error, the positive-magnitude sibling of CR-308's interleaved
        shape.
      - >-
        The CR-308 closure itself holds as narrowed: the corrected
        comment now claims only that the unsigned entry cannot return a
        negative value (parse-amount.ts:81), and the executed witnesses
        confirm it ("EEURUR-742,10" is a row error at both entry points,
        probes P-G1 and P-G2; no splice variant produces a negative at
        the unsigned entry, P-G4). No false claim stands in the
        committed text.
    concrete-fix: >-
      Constrain the strip to the token positions a real cell can carry:
      strip currency tokens only at the start and end of the trimmed
      cell (or reject when a removed token had digits adjacent on both
      sides), and add the '7EUR42,10' witness beside the CR-308 block in
      test/domain/profile-detection.test.ts, red first.
    analysis: >-
      Filed low for the same honestly-bounded reachability as CR-308: no
      observed or plausible bank export writes a currency token inside a
      digit run, the shape cannot arise from the committed fixtures'
      grammar, and household-scale exposure is nil. Recorded because the
      class now has a second executed member on the books and the
      one-line positional constraint would close the family rather than
      the instance.

