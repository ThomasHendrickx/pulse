findings:
  - id: CR-404
    severity: low
    evidence:
      - >-
        prisma/schema/migrations/20260820084740_one_primary_per_merchant/migration.sql:13-14
        states "The index is asserted by name and predicate in
        test/application/resolve-merchants.test.ts", and
        prisma/schema/merchants.prisma:108 repeats "asserted by name and
        predicate". The assertion actually shipped is the regex at
        test/application/resolve-merchants.test.ts:537-539, whose index
        name position is the pattern "?\w*"? and therefore matches ANY
        name (including none): the table, column and predicate are
        pinned, the NAME is not. Both comments state more than the test
        checks (R-087).
      - >-
        Consequence, honestly bounded: a migration edit renaming the
        index while keeping the predicate stays green, so only the
        comments' cross-reference by name goes stale; the invariant the
        index enforces is fully covered by the predicate the regex does
        pin, and the fast gate still reds if the statement is lost,
        which is the protection that matters.
    concrete-fix: >-
      Pin the name: replace "?\w*"? with
      "merchant_tags_one_primary_per_merchant" in the regex at
      test/application/resolve-merchants.test.ts:538 (making both
      comments true as written), or reword the two comments to "asserted
      by table, column and predicate". One line either way.
    analysis: >-
      Filed under R-087's rule that a false present-tense claim in a
      comment is a finding stated loudly, not a nit left in prose. Low
      because the gap is between a comment and its test, with no
      reachable behaviour difference: every state the index guards is
      guarded regardless of its name.

