hazard-classes-addressed:
  - class-id: H3.1
    probed: >-
      Constructed the destructive paths rather than asking the tests:
      (1) the row-edit-undone witness runs in the executed suite (a
      direct merchantId row edit is erased by the next recompute while
      the declaration survives); (2) executed P-B, a manual EXACT rule
      against a same-string PREFIX and a universal PATTERN in all six
      permutations, winner the manual rule every time, so no later or
      broader rule can shadow a naming (EXACT tier first,
      src/modules/merchants/domain/merchant-rule.ts:67); (3) executed
      P-C, tie-break determinism under order reversal at every chain
      step; (4) executed P-D, a crash between the rule write and
      recompute loses nothing, the next recompute applies the surviving
      declaration; (5) executed P-E, recompute is a fixed point; (6) by
      construction plus executed grep, the interpret use case's whole
      merchants surface is one read-only resolver function and no code
      path under src/modules/ledger writes any declaration table; (7)
      re-assignment updates the one decision through the (householdId,
      kind, pattern) unique instead of stacking a contradictory rule.
      Adjacent but outside the class as declared: CR-402 records how a
      FUTURE normalisation-recipe change would silently detach stored
      rules from their subjects (rows regress to visible unresolved, no
      misassignment), and CR-401 records the tag invariant's race,
      neither reachable at this head.
    cleared-because: >-
      No path at this head stores a correction as a row edit or lets a
      recompute destroy a user decision: every probe construction came
      back with the declaration intact and re-applied, and the port
      shape makes the forbidden write unrepresentable in interpretation.
  - class-id: H3.2
    probed: >-
      (1) Executed P-A: a universal PATTERN rule matching every string,
      then a full recompute; flows, fact columns and both direction
      totals byte-identical, INTERNAL legs untouched and merchantless.
      (2) Executed P-F: group totals sum exactly to direction totals and
      row counts partition (no drop, no double count) even under a
      crafted key collision between a merchantId and a normalised text.
      (3) Executed grep: merchantId appears nowhere in the ledger
      domain, the reconciliation property test or any domain test, and
      interpretLedger takes no merchant input, so resolution cannot
      reach flow, pairing or the identity even in principle; resolution
      runs after classification and produces only the merchants[] write
      (src/modules/ledger/application/interpret-window.ts:83-105), and
      replaceInterpretation's merchant branch updates the one
      interpretation column under householdId
      (src/modules/ledger/adapters/ledger-repository.ts:177-184). (4)
      The refund correction's counterpartyKey deliberately does not
      adopt the new normaliser (named at
      src/modules/merchants/domain/normalise-counterparty.ts:9-15), so
      no classification key changed. (5) The e2e asserts the on-screen
      totals digit for digit against fixture-derived values before and
      after a naming; relied on per criterion 3.3, with the fast-gate
      mirror executed here.
    cleared-because: >-
      Resolution renames and regroups only: no monetary total, flow
      value, pairing or reconciliation input is reachable from the
      merchant machinery at this head, established by executed probes
      over the committed code and by the absence of the column from
      every counting path.
