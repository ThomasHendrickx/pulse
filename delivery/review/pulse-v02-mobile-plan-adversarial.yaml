  - id: MPR-022
    severity: low
    evidence:
      - >-
        Criteria 7.7 (b) and 8.4 (b) scope the vertical sweep to elements
        whose computed overflow-y is hidden, clip, scroll or auto, on the
        stated ground that "an element with visible overflow reports content
        height it is not clipping".
      - >-
        The reasoning is sound and I could not defeat it with a CSS
        technique. The two forms decision D-17 actually invites are both
        caught: the -webkit-box form of line clamping requires overflow
        hidden and is caught by (b) as well as by (c)'s grep, and the Tailwind
        line-clamp utility generates the same overflow hidden and is caught
        by (b) even though (c) greps only *.css files and would miss the
        class in a tsx.
      - >-
        What is not caught is truncation performed BEFORE render: a label
        shortened in the component, by a slice, a substring or an ellipsis
        helper. textContent is then identical at both widths, so 7.6 and 8.3
        are satisfied; nothing clips, so both axes of 7.7 and 8.4 are
        satisfied; and (c)'s grep sees no CSS.
      - >-
        Decision D-17 forbids it in as many words, and the mockup ellipsizes
        every long name (Main.dc.html:87, MerchantReview.dc.html:50), so the
        pressure to reach for it is real. Criterion 7.13 now guarantees a
        committed fixture whose labels are known and at least 28 characters,
        which is what makes the check below possible.
    analysis: >-
      I judge the plan writer's deviation from my suggested edit CORRECT and
      better than what I proposed: a blanket scrollHeight sweep would have
      reported ordinary visible overflow and the criterion would have been
      loosened in a fix round rather than obeyed. The residual is one step
      away from CSS and is the only truncation route left open.
    concrete-edit: >-
      Add a fourth check to criteria 7.7 and 8.4: "(d) On the dense dataset,
      for every collected group-label, the trimmed textContent is character
      for character the label the fixture defines for that group, and
      contains no horizontal-ellipsis character and no trailing run of full
      stops. FALSIFIED BY a rendered label shorter than the fixture's, which
      is truncation performed before render and is what decision D-17
      forbids."
  - id: MPR-023
