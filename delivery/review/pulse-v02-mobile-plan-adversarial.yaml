findings:
  - id: MPR-001
    severity: critical
    evidence:
      - >-
        The amendment's own verified-root-cause for M3-P7 names the defect:
        "src/app/globals.css:756 and :781 both declare grid-template-columns
        minmax(0, 1fr) auto auto with two of those tracks pinned to min-width
        var(--space-14), 80px each (styles/tokens.css:121), so a spend row
        spends 160px of a 390px screen on two figures and gives the merchant
        name what is left."
      - >-
        Step 5 is the only place that fix appears: "The three-column rows
        (src/app/globals.css:756 and :781) become the mockup's two-line row:
        name and amount on line one, row count and month-over-month delta on
        line two." No acceptance criterion in M3-P7 measures it. Criteria 7.1
        through 7.13 read in full: 7.1 work history, 7.2 viewport tag, 7.3
        one media condition, 7.4 tokens and literals, 7.5 tap-target height,
        7.6 same testids at both widths, 7.7 horizontal clipping, 7.8
        reconciliation above 844, 7.9 card order and geometry, 7.10 gates and
        empty diffs, 7.11 skill greps, 7.12 playwright projects, 7.13
        fixtures.
      - >-
        Measured at the phase base: .month-row is minmax(0, 1fr) auto auto
        with gap var(--space-7) and padding var(--space-5) var(--space-7)
        (src/app/globals.css:781 through :787), so its min-content width at
        390 is 80 plus 80 plus two gaps of 16 plus 32 of padding, which is
        224. It does not overflow 390 and never has.
      - >-
        .month-group-label carries text-wrap pretty and overflow-wrap anywhere
        (src/app/globals.css:803 through :808), so a long Belgian descriptor
        WRAPS inside the leftover 166px rather than clipping, and
        element.scrollWidth never exceeds element.clientWidth.
      - >-
        .pulse-amount is white-space nowrap (styles/tokens.css:163 through
        :168) inside an 80px track, and the widest figure the existing
        fixtures render fits it, so it does not clip either.
    analysis: >-
      This is the failure the whole round exists to prevent, reproduced one
      level down from where it was caught last time. THE CHEAT, concretely:
      an implementer moves the reconciliation panel to the top of the DOM
      (7.8), gives the three cards testids and stacks them income, spend,
      reserves (7.9), pads .app-nav-link, .app-signout, .month-nav,
      .month-unresolved-pill and .empty-state-cta to 44px (7.5), adds the
      five tokens and one media condition (7.3, 7.4), adds the phone project
      (7.12), and DOES NOT TOUCH .month-columns OR .month-row. Every one of
      7.1 through 7.13 passes. The screen still spends 160px of 390 on two
      amount tracks, and every merchant name wraps character by character in
      the 166px that are left, because overflow-wrap anywhere breaks inside
      words. That is precisely the screen the owner graded 1 out of 10, with
      a tidier header. The one structural change the phase exists to make is
      the only one no criterion falsifies.
    concrete-edit: >-
      Add criterion 7.14 to M3-P7: "At 390 by 844 and again at 360 by 740, on
      the reconciling seeded dataset, for every element with data-testid
      group-label inside main: (a) its bounding width is at least 55 percent
      of the bounding width of its containing row element; (b) for a label of
      at most 24 characters its bounding height is at most 1.6 times its own
      computed line-height, so a short name occupies one line; (c) the amount
      element in the same row has a bounding top within 4 CSS pixels of the
      label's top, and the row-count element's bounding top is greater than
      or equal to the label's bounding bottom, so line one carries name and
      amount and line two carries count and delta. FALSIFIED BY a label
      narrower than 55 percent of its row, a short label taller than one
      line, a row count sharing line one with the label, or an amount that is
      not on line one. The spec names every offending row by its group-label
      text in the failure message." Add to criterion 7.4's second half, or as
      part of 7.14: "grep -nE 'grid-template-columns' src/app/globals.css
      returns no declaration of three or more tracks on .month-row or
      .month-columns outside the single @media block." Re-point hazard H7.1's
      addressed-by from criterion 7.5 to criteria 7.5 and 7.14, since 7.5
      alone does not reach the row.
  - id: MPR-002
    severity: high
    evidence:
      - >-
        Criterion 7.6: "collects every element carrying a data-testid as the
        pair of its testid and its trimmed textContent, sorted; the two
        collections are deeply equal. At 390 by 844 every collected element
        THAT DOES NOT CARRY THE VISUALLY-HIDDEN CLASS has a bounding rect
        whose width and height are both greater than zero." Criterion 8.3
        carries the same exemption verbatim.
      - >-
        src/app/globals.css:548 through :556 declares .visually-hidden as
        position absolute, width 1px, height 1px, padding 0, margin -1px,
        overflow hidden, clip-path inset(50%), white-space nowrap. clip-path
        does not alter the layout box, so getBoundingClientRect on such an
        element returns width 1 and height 1, both greater than zero. The
        exemption therefore protects nothing that the zero-size test would
        have caught, and its only effect is to license the class.
      - >-
        Nothing in M3-P7 or M3-P8 forbids REMOVING a data-testid. An element
        with no testid is collected at neither width, so its collections stay
        deeply equal.
      - >-
        The plan asserts the coverage this criterion buys: "the in-progress
        badge, the days-elapsed meta, the comparison head, every group delta
        and every reconciliation cause block are inside it by construction."
        Those testids do exist at the base (in-progress-badge at
        src/modules/overview/ui/month-view.tsx:460, month-meta at :465,
        compare-head at :118, group-delta at :142 and :189, the four
        recon-cause blocks at :342, :354, :366 and :382), but "by
        construction" holds only while they are still published.
    analysis: >-
      Hazard H7.2 is the second reason this round exists and criterion 7.6 is
      the only thing addressing it. TWO CHEATS, both cheap. (1) Add the
      visually-hidden class to the days-elapsed meta and the comparison head
      at phone width: they stay in the collection with identical text, and
      the criterion's own exemption removes them from the size test. The
      phone screen is tidier because it says less, exactly as H7.2 predicts,
      and 7.6 passes by its own wording. (2) Delete data-testid="month-meta"
      and render the meta only above the breakpoint: absent at both widths,
      collections equal, and 7.10's requirement that pre-existing specs pass
      under the DESKTOP project does not notice, because the element still
      renders at desktop width.
    concrete-edit: >-
      In criterion 7.6, delete the clause "that does not carry the
      visually-hidden class" so the zero-size test applies to every collected
      element, and append: "The collected testid set at 390 by 844 contains
      at least month-title, in-progress-badge, month-meta, compare-head,
      pot-change, recon-panel, income-total, spend-total, reserves-net, and
      every group-total and group-delta the desktop width renders; and no
      element inside main has computed display none, visibility hidden, or
      the visually-hidden class at 390 by 844 unless it also has it at 1280
      by 720. FALSIFIED BY a missing testid from that list, or by any element
      hidden at one width and not the other." Make the same two edits to
      criterion 8.3, with the testid list unresolved-group, merchant-group,
      group-label, group-total, unresolved-count, income-total, spend-total.
  - id: MPR-003
    severity: high
    evidence:
      - >-
        Criterion 8.4: "evaluating element.scrollWidth greater than
        element.clientWidth plus 1 over every element inside main returns an
        empty offender list". Criterion 7.7 is the same sweep on the month
        view.
      - >-
        src/modules/merchants/ui/merchant-review.tsx:52 renders <span
        className="visually-hidden">{t("namePlaceholder")}</span> INSIDE main
        on /merchants. With width 1px, overflow hidden and white-space
        nowrap (src/app/globals.css:548 through :556), that span's
        scrollWidth is the full rendered width of its label text and its
        clientWidth is 1. It is an offender on the first evaluation, at the
        phase base, before M3-P8 changes anything.
      - >-
        M3-P7 rebuilds the month navigation as icon-only controls: step 4 and
        the mockup's own pattern (delivery/design/mobile-v02/Main.dc.html:40
        and :43 carry aria-label on 44px anchors wrapping an inline SVG), and
        the project's accessible-label pattern is exactly the class above
        (src/app/globals.css:546 through :547 states it as the house rule).
        Any such label added inside main makes 7.7 an offender too.
      - >-
        The sweep measures width only. A name limited with -webkit-line-clamp
        and overflow hidden, or with a max-height and overflow hidden, is
        clipped VERTICALLY: textContent is unchanged, so criterion 7.6 and
        8.3 pass, and scrollWidth equals clientWidth, so 7.7 and 8.4 pass.
      - >-
        Decision D-17 is what that defeats: "Names WRAP and are never
        truncated, on both rebuilt screens, against the mockup." Criterion
        8.4's only other half greps for text-overflow, which line-clamp does
        not use.
    analysis: >-
      Two defects in one pair of criteria, in opposite directions. As
      written, 8.4 CANNOT PASS without deleting an accessible label the
      project mandates, which pushes the implementer either into an
      accessibility regression or into inventing an exclusion nobody
      reviewed; and once an exclusion is invented ad hoc it will be written
      to whatever makes the run green. Meanwhile the sweep's chosen axis is
      the wrong one for the hazard it is guarding: a phone rebuild truncates
      DOWNWARD, by clamping a wrapped name to one or two lines, and that is
      the one clipping mode neither criterion can see. The narrower version
      of this sweep that exists today (test/e2e/month-view.spec.ts:300
      through :323) avoids the first problem only by listing seven selectors
      by hand, none of which is a hidden label.
    concrete-edit: >-
      Rewrite the sweep in criteria 7.7 and 8.4 as: "over every element
      inside main that does not match .visually-hidden, evaluating
      element.scrollWidth greater than element.clientWidth plus 1 OR
      element.scrollHeight greater than element.clientHeight plus 1 returns
      an empty offender list, and the failure message names each offender by
      its testid or its first 40 characters of text and says which axis
      overflowed. FALSIFIED BY a non-empty list." Add to both criteria: "grep
      -nE 'line-clamp|-webkit-box-orient|text-overflow' src/app/globals.css
      returns exactly one line, the text-overflow inside .app-household that
      M3-P1 criterion 1.5 decided. FALSIFIED BY any line-clamp or box-orient
      declaration, or by a second text-overflow." Delete the standalone
      text-overflow half of 8.4, which this subsumes.
  - id: MPR-004
    severity: high
    evidence:
      - >-
        Criterion 7.8: "At 390 by 844 with window.scrollY at 0, the element
        carrying the reconciliation verdict has a bounding rect with top at
        least 0 and bottom at most 844".
      - >-
        844 is the DEVICE height of the frame the mockup targets, not the
        visible viewport of a browser on that device. Under Playwright a
        viewport of 390 by 844 gives window.innerHeight 844, because there is
        no browser chrome; on the phone the owner actually uses, the URL bar
        and the bottom bar consume roughly 100 CSS pixels of that 844.
      - >-
        The plan states the fold's provenance as "delivery/design/mobile-v02/
        canvas.json:3 fixes the frame at 390 by 844" (M3-P7 grounding, and
        the same claim for canvas.json:5 in M3-P8's grounding). canvas.json:3
        actually reads w 390, h 1180 and canvas.json:5 reads w 390, h 1010.
        The only 844 in the design directory is the min-height on the frame
        wrapper (Main.dc.html:21, BooksDoNotClose.dc.html:21,
        MerchantReview.dc.html:21) and the prose of the canvas annotation at
        canvas.json:9. The artboards are 1180 and 1010 tall, so the approved
        design itself expects the page to scroll.
      - >-
        The criterion runs in one locale. Criterion 7.7 runs "in each of en,
        nl and fr"; 7.8 does not. The Dutch and French reconciliation copy is
        the longest in the catalogue (messages/nl.json and fr.json carry the
        same 111 keys), and it is the copy directly above and inside the
        panel being measured.
    analysis: >-
      THE CHEAT: place the reconciliation verdict at a top of about 790 so
      its bottom lands just inside 844. Criterion 7.8 passes; on the device,
      the verdict is below the fold and the criterion has certified the exact
      thing it was written to prevent. The plan's own words for this criterion
      are "the reconciliation answer is above the fold", and 844 is not the
      fold. This is also the one place where a wrong citation has become
      load-bearing: the number is presented as coming from the approved
      canvas and does not.
    concrete-edit: >-
      Replace criterion 7.8 with: "At 390 by 844 with window.scrollY at 0, in
      each of en, nl and fr, on the reconciling seeded dataset AND on the
      non-reconciling one, the element with testid recon-verdict has a
      bounding rect with top at least 0 and bottom at most 700, that being
      844 less an allowance of about 144 CSS pixels for the browser chrome a
      real phone spends on the URL bar and the bottom bar, which Playwright
      does not render; and on the non-reconciling dataset the element with
      testid recon-difference also has bottom at most 700. FALSIFIED BY a
      bottom greater than 700 in any of the six cases." Add "the month view
      publishes testid recon-verdict on the element carrying the books-close
      or books-do-not-close answer" to the same criterion, because as written
      its subject, "the element carrying the reconciliation verdict", names
      no testid and no selector and an implementer chooses it after the fact.
      Correct both groundings to cite Main.dc.html:21 and
      MerchantReview.dc.html:21 for the 390 by 844 frame, and record that the
      artboards are 1180 and 1010 tall so the design expects scrolling below
      the fold.
