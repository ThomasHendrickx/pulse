        Criterion 7.4's literal half measures src/app/globals.css and files
        matching *.tsx under src/ only.
      - >-
        There are four stylesheets in the tree today (src/app/globals.css,
        styles/tokens.css, styles/pulse-theme.css, styles/pulse-tokens.css)
        and nothing in either criterion, or in files-to-touch, prevents a
        fifth. A new src/app/month.css imported from globals.css would carry
        any number of media conditions and any number of px literals, and
