  - id: MPR-017
    severity: high
    evidence:
      - >-
        Criterion 7.14 (b): "the horizontal distance from the left edge of
        its group-label to the left edge of its group-total is at least 60
        percent of the ROW ELEMENT'S CONTENT-BOX WIDTH."
      - >-
        The denominator is a box the implementer controls. .month-row's own
        horizontal padding is var(--space-7) on each side
        (src/app/globals.css:786), and nothing in 7.14, 7.4 or 7.9 fixes it.
      - >-
        Box chain measured at the phase base for a 390 viewport:
        .app-main padding is var(--space-12) var(--space-9)
        (src/app/globals.css:181 through :187), so 48 horizontal;
        .month-card carries a hairline border on each side
        (src/app/globals.css:727 through :731); .month-row takes 32 of
        horizontal padding. 390 less 48 less 2 less 32 gives a row content
        box of 308, which confirms the criterion's stated "about 310" AND
        confirms that its author did subtract the row's own padding.
        The rest follows: two gaps of 16 and two tracks of var(--space-14)
        leave the name 116 and the label-to-total distance 132, which is
        about 43 percent, exactly as the criterion states. The arithmetic in
        7.14 is correct.
      - >-
        THE LEVER. Hold the row's border box at 340 and raise its horizontal
        padding from 16 to 60 per side. The content box becomes 220. A
        two-track grid with one gap of 16 and an amount track of
        var(--space-14) then leaves the name 124 and the label-to-total
        distance 140, which is about 64 percent of 220 and PASSES (b), while
        the name has 124 pixels to sit in against the 116 the criterion
        itself declares broken.
      - >-
        Nothing else catches it: (a) passes because the grid has two tracks,
        (c) passes because the amount is on line one and the count below,
        7.7's sweep passes because .month-group-label wraps rather than
        clips (src/app/globals.css:803 through :808), and 7.6 passes because
        the text is unchanged.
    analysis: >-
      This is the one finding of the delta round that reaches back into
      MPR-001. The fix round did the hard part and did it well: 7.14 measures
      the row, it is stated so that the base tree fails all three parts, and
      the arithmetic behind that statement is right to the pixel. What is
      left is that (b) is a RATIO whose denominator the same change
      controls, so the criterion can be satisfied by making the row's usable
      width smaller rather than by making the name's share of it bigger. An
      implementer does not have to be adversarial to reach it: padding a row
      out is the ordinary reflex when a phone layout feels cramped, and it
      moves this criterion from red to green while moving the screen the
      wrong way.
    concrete-edit: >-
      Replace 7.14 (b) with: "NAME WIDTH. For every element with data-testid
      spend-group, the horizontal distance from the left edge of its
      group-label to the left edge of its group-total is at least 60 percent
      of the row element's BORDER-box width, and is at least 180 CSS pixels
      at 390 by 844 and at least 160 CSS pixels at 360 by 740. The border box
      is the denominator, not the content box, so the row's own horizontal
      padding cannot be raised to shrink the number the percentage is taken
      against; the absolute floors exist because a percentage of anything is
      satisfiable by making everything narrower. MEASURED AT THE PHASE BASE:
      the row's border box at 390 is about 340 and the label-to-total
      distance is about 132, which is about 39 percent and below both floors,
      so (b) fails."
