findings:
  - id: CR11-M3P12-01
    severity: high
    evidence:
      - "src/platform/db/client.ts:87 through :97. client() memoises ONLY into globalForPrisma.prisma, and line 93 guards that write with if (!isProduction()). In production nothing is ever memoised, so line 89's existing !== undefined is false on every call and line 92 constructs a fresh PrismaClient for every property read."
      - "MEASURED. Probe importing the shipped module and issuing four $queryRawUnsafe calls through the exported binding against the pinned LOCAL stack (parsed host 127.0.0.1 port 54322). NODE_ENV=production: backends on the database after queries one to four were 19, 20, 21, 22, one leaked connection per query, none released. NODE_ENV=test on the same tree and the same probe: 19, 19, 19, 19."
      - "The same probe counting the client's own startup line, which runs inside constructClient at src/platform/db/client.ts:73: EIGHT lines for four queries under NODE_ENV=production, ONE under NODE_ENV=test. Eight rather than four because a METHOD read constructs twice, once in Reflect.get at src/platform/db/client.ts:105 and again in the .bind(client()) at line 111."
      - "A second probe: under NODE_ENV=production two successive reads of the same model property return objects that are not identical (same object = false), and prismaHasBeenConstructed() at src/platform/db/client.ts:121 returns false after all of them. Under NODE_ENV=test and with NODE_ENV unset the same reads return the identical object and the predicate returns true."
      - "The behaviour this replaced did not have the defect: git show 2d82402:src/platform/db/client.ts line 51 exports prisma as a MODULE-LEVEL const, which ES module semantics evaluate once per process whatever NODE_ENV holds."
      - "Every call site is a property read of exactly this shape: src/modules/ledger/adapters/ledger-repository.ts:36, :81, :144 and :172, src/modules/merchants/adapters/merchant-repository.ts:28, :84 and :148, src/modules/overview/adapters/overview-repository.ts:100 and :330, src/modules/accounts/adapters/account-repository.ts:30."
      - "No test can see it: the two laziness assertions at test/db/db-guard.test.ts:436 and :447 read prismaHasBeenConstructed(), which is hard-false in production, and both run under vitest where NODE_ENV is test."
    concrete-fix: "Memoise in a module-scope binding rather than only on globalThis. Add `let instance: PrismaClient | undefined;` beside globalForPrisma in src/platform/db/client.ts and make client() read `instance ?? globalForPrisma.prisma` first, assign the constructed client to `instance` unconditionally, and keep the existing globalThis write under !isProduction() for the hot-reload case only. Call client() ONCE in the get trap and bind the method to that same value rather than calling client() a second time at line 111. Make prismaHasBeenConstructed() read `instance !== undefined` so the seam is honest in production, and add a test that sets NODE_ENV to production, reads two properties, and asserts the same object comes back both times."
    analysis: "Round ten's stated purpose was to remove eager construction, and it did. What it removed with it was the singleton, because the old module got its once-per-process property from being a module-level const and the new one gets it from a cache that production is excluded from. The module's own header at src/platform/db/client.ts:6 still gives connection exhaustion as the reason the instance is cached, so the file states the invariant it now breaks. The blast radius is production only, which is why ten rounds of a fast gate that never leaves NODE_ENV=test could not reach it."

  - id: CR11-M3P12-02
    severity: high
    evidence:
      - "The stripper at test/db/gate-target.test.ts:518 through :562 has three lexical states, line comment, block comment and quoted string. It has NO REGEX-LITERAL state, so the contents of a regex literal are scanned as if they were code, and a quote, a backtick or a slash-star inside one opens a phantom state."
      - "ATTACK, DOOR HIDDEN. An untracked file scripts/zz-probe-hidden.ts carrying `const BACKTICK = /[<backtick>]/;` above an unguarded `const client = new PrismaClient();`. The single backtick inside the character class opens a phantom template-literal state that finds no closing backtick and blanks the rest of the file. npx vitest run test/db/gate-target.test.ts: Test Files 1 passed (1), Tests 44 passed (44). The same probe with `const SLASHSTAR = /[/*]/;` in place of the backtick, which opens a phantom block comment: 44 passed (44)."
      - "ATTACK, GUARD INVENTED. An untracked file scripts/zz-probe-invent.ts carrying `const PUNCT = /[/*]/;` on one line and the REAL LINE COMMENT `//*/ assertGateDbTargetIsLocal();` on the next, above an unguarded constructor. The phantom block comment opened by the regex is closed by the star-slash inside the comment, so the remainder of that comment survives into the code-only text and is read as a guard CALL. 44 passed (44). A second shape, scripts/zz-probe-regex2.ts, writes the guard name only inside a regex literal, `const NAME = /assertGateDbTargetIsLocal()/;`: 44 passed (44)."
      - "THE CONTROL, so these are green because the scan was fooled and not because untracked files are unread: a bare untracked `new PrismaClient()` in scripts/zz-probe-control.ts reddened the scan with '+ scripts/zz-probe-control.ts (prisma)', Tests 1 failed | 43 passed (44). The widest denominator scannedSourceFiles() at test/db/gate-target.test.ts:439 does read git ls-files --others, so an untracked probe is a real input to the shipped test."
      - "Every probe file was deleted immediately after its run and git status shows only this review file."
    concrete-fix: "Give codeOnly a regex-literal state. Track whether the previous significant token permits a regex (after `=`, `(`, `,`, `:`, `[`, `!`, `&`, `|`, `?`, `{`, `}`, `;`, `return`, `typeof` and the start of input a `/` begins a literal; after an identifier, a number, `)` or `]` it is division), then consume to the unescaped closing `/` with a character-class sub-state so a `/` inside `[...]` does not terminate it, and BLANK it like the other states. Add both directions to the 'shapes that used to pass' describe at test/db/gate-target.test.ts:705 as string-driven cases: a regex carrying a lone backtick above a bare door must still report the door, and a regex carrying slash-star above a line comment naming the guard must still report the door as unguarded."
    analysis: "Round ten's claim is that a one-pass lexer is safe where a stack of regexes was not, because over-stripping hides a door and under-stripping invents a guard and a regex cannot be safe in both. The lexer is not safe in both either, and for the same reason as its predecessor: it does not model the language it reads. Both directions are reachable from ordinary TypeScript that typechecks and lints, and the under-strip direction turns a real comment into a real guard, which is precisely the defect round ten was written to close."

  - id: CR11-M3P12-03
    severity: high
    evidence:
      - "test/db/gate-target.test.ts:626 decides `guarded` from `new RegExp('\\\\b' + entry.guard + '\\\\s*\\\\(').exec(source)`, which tests for a syntactic CALL and never for an executed one."
      - "ATTACK. An untracked scripts/zz-probe-dead.ts whose only occurrence of the guard is inside a function that nothing invokes: `const neverCalled = (): void => { assertGateDbTargetIsLocal(); };` followed by `const client = new PrismaClient();`. npx vitest run test/db/gate-target.test.ts: Test Files 1 passed (1), Tests 44 passed (44). The ordering test is satisfied too, because the call's index precedes the constructor's. No lexer trickery is involved: the file is ordinary code and the guard genuinely never runs."
      - "The same shape is reachable as `if (false) assertGateDbTargetIsLocal();` or as a call inside a catch block that is never entered."
    concrete-fix: "Where the scan cannot decide execution, say so. Two options, and the first is cheap: require the guard call to be at TOP LEVEL, that is on a line matching /^\\s*assertGate\\w+\\(/ with no enclosing brace depth, which is the shape every real door in this tree uses today (prisma/seed.ts, test/e2e/auth.spec.ts, test/e2e/merchant-rule-write.spec.ts) and which the dead-code shapes fail. Track brace depth in the same pass codeOnly already makes. The second option is to stop deciding this textually and assert it behaviourally, by importing each door module under a spy on the guard and asserting the spy ran before the constructor. Whichever is taken, add the dead-code shape to the 'shapes that used to pass' describe so it is red forever, and correct the fifth blind spot into the not-covered list at delivery/work-history/m3-p12.yaml:3628."
    analysis: "Round ten's first claim is that the guarded test now requires a call rather than a mention, and that is true as far as it goes. What it does not reach is that a call is still a spelling. The mechanism the round names for itself, 'a check whose evidence is the spelling of a file rather than what the program does', survives the fix in a narrower form: the evidence is now the spelling of a call rather than the spelling of a name."

  - id: CR11-M3P12-04
    severity: high
    evidence:
      - "src/platform/db/runtime-target.ts:43 exports noteInterlockApproved(source: string) with no proof of work: it takes an arbitrary string, validates nothing, and records it. src/platform/db/guard.ts:164 admits on `env.interlockApproval !== undefined` alone."
      - "PROBE, NODE_ENV=test, DATABASE_URL a wholly invented non-local host. A: assessNonProductionDbTarget refuses. B: after ONE call to noteInterlockApproved('i-am-not-an-interlock') from a caller that resolved nothing and matched nothing, it returns allowed with the reason 'i-am-not-an-interlock resolved this process's connection and matched it against a target named on its own command line', a sentence the artifact prints about work that never happened. C: resetInterlockApprovalForTest() clears the register. D: a SECOND approval is then accepted. E: the application client is then constructed against the non-local target and prismaHasBeenConstructed() returns true."
      - "src/platform/db/runtime-target.ts:27 states 'IT IS DELIBERATELY WRITE-ONCE AND NEVER CLEARED'. The module exports the clear at line 54. Grep over the tracked tree for resetInterlockApprovalForTest finds the definition and no call site at all, so the widening buys nothing today."
      - "The register records a SOURCE NAME and never a TARGET, so the guard skips its host check without re-establishing what is being opened. The exemption reason at test/db/gate-target.test.ts:456 nevertheless states that the client refuses 'unless an in-process interlock has already named and approved that exact target', and delivery/work-history/m3-p12.yaml:3617 states that the client 'honours and nothing else can set' the register."
      - "Grep confirms only scripts/rederive-merchant-rules.ts:346 calls it today. Nothing in the tree PINS that: the door scan reads constructor patterns, not this call, and there is no allow-list test over its callers."
    concrete-fix: "Make the approval carry the fact it claims. Change noteInterlockApproved to take the resolved connection string it matched, store the target rather than the source name, and have assessNonProductionDbTarget compare the approved target against the DATABASE_URL it is being asked about rather than admitting on presence. Delete resetInterlockApprovalForTest and let the two tests that would need it run in their own process, or gate it on process.env.NODE_ENV === 'test' inside the function so it cannot fire elsewhere. Add a caller allow list beside the door scan, in the same shape ALLOWED_UNGUARDED already has: scan the tracked tree's code-only text for a call to noteInterlockApproved and assert the set of files containing one is exactly {scripts/rederive-merchant-rules.ts}, with a reason string per entry and a staleness test. Then correct the two sentences above, which are the R-087 half of this finding."
    analysis: "Round ten's argument for widening the guard rests entirely on this register being a fact rather than a flag. It is a flag: a string with no validation, an unrestricted writer, an exported clear and no record of what was approved. The difference between this and PULSE_ALLOW_REMOTE_DB_IN_DEV is that the environment variable is at least visible to an operator reading their own shell, while this one is set from inside the program. Nothing here says the migration command is wrong to use it; the finding is that the property the widening was bought with does not hold, and the artifact asserts that it does in two places."

  - id: CR11-M3P12-05
    severity: medium
    evidence:
      - "test/db/gate-target.test.ts:691 through :699, the ordering test, calls scanDoors() with its default argument, which is trackedSourceFiles() at test/db/gate-target.test.ts:432. test/db/gate-target.test.ts:791 through :799, the guarded test for untracked files, calls scanDoors(scannedSourceFiles())."
      - "WITNESSED BOTH WAYS ON ONE FILE. scripts/zz-probe-late.ts, a door whose guard call sits AFTER its constructor. Left untracked: Test Files 1 passed (1), Tests 44 passed (44). The identical file staged with git add: 'EVERY guarded door calls its guard BEFORE it constructs its client' went red with '+ scripts/zz-probe-late.ts (prisma)', Tests 1 failed | 43 passed (44). Index restored with git rm --cached and the file deleted."
      - "The comment at test/db/gate-target.test.ts:435 gives the reason the working tree is the denominator, that the fast gate is normally run BEFORE git add and that is the moment the author most wants to be told. That reasoning applies to order exactly as it applies to presence."
    concrete-fix: "Pass the same denominator to both. Change the ordering test at test/db/gate-target.test.ts:693 from scanDoors() to scanDoors(scannedSourceFiles()), and change the staleness test at test/db/gate-target.test.ts:667 the same way so an exemption is judged against the tree the other tests read. One shared const scanned = scannedSourceFiles() at the describe level would make a third divergence impossible."
    analysis: "This is the same shape as round eight's finding about the denominator, one level down: the definition was widened in one test and not in its sibling, so the two now disagree about what the tree is. It is medium rather than high because the window is a file that has never been staged, and the guarded half does cover that file."

  - id: CR11-M3P12-06
    severity: medium
    evidence:
      - "src/platform/db/client.ts:6 through :7 states 'One PrismaClient per process' and gives avoiding connection exhaustion as the reason. Finding CR11-M3P12-01 measures 19, 20, 21, 22 backends over four queries under NODE_ENV=production, so the sentence is false in the one environment it is about."
      - "src/platform/db/client.ts:118 through :120 calls prismaHasBeenConstructed a 'TEST AND SCRIPT SEAM' for 'a caller that must know whether a client has been constructed'. It returns false in production however many have been constructed."
      - "src/platform/db/runtime-target.ts:25 states 'Only code inside this process that has actually done that work can call this'. The probe under CR11-M3P12-04 called it from code that did none of that work."
      - "src/platform/db/runtime-target.ts:27 states 'IT IS DELIBERATELY WRITE-ONCE AND NEVER CLEARED' in a module that exports a clear at line 54."
      - "test/db/gate-target.test.ts:456, the client exemption's reason, ends 'unless an in-process interlock has already named and approved that exact target'. The register carries no target."
      - "delivery/work-history/m3-p12.yaml:3617 states the register is one 'which the client honours and nothing else can set', and delivery/work-history/m3-p12.yaml:3674 states it is 'process-local and write-once by construction'. Both are refuted by the probe under CR11-M3P12-04, and the second is the sentence that BOUNDS an admitted omission, so the bound rests on a false premise."
    concrete-fix: "Correct all six in place, quoting the old text as this repository's clause R-087 practice already does elsewhere in these same files. src/platform/db/client.ts:6 should say what is true after CR11-M3P12-01 is fixed, and if that fix is deferred it must say that production constructs per read. src/platform/db/runtime-target.ts:25 and :27 should say that the register is an ordinary module-scope variable with an exported writer and an exported clear, and that what keeps its caller set to one is review rather than construction, until the allow list under CR11-M3P12-04 exists. test/db/gate-target.test.ts:456 should drop 'that exact target' or the register should start carrying one. The two work-history sentences should be corrected in the same change, and the not-covered block at delivery/work-history/m3-p12.yaml:3628 should gain the regex-literal and dead-code blind spots."
    analysis: "Clause R-087 asks for these to be raised as findings rather than as notes, and they are all of the shape it names: a present-tense assertion of fact that nothing checks. Two of them are load-bearing rather than cosmetic. The 'nothing else can set' sentence is the justification for widening the guard, and the 'write-once by construction' sentence is what makes an admitted gap sound bounded."

  - id: CR11-M3P12-07
    severity: low
    evidence:
      - "test/db/gate-target.test.ts:666 through :672 asserts of each exemption only that doors.some(door => door.path === entry.path), which compares PATHS and ignores kind, while the Door type at test/db/gate-target.test.ts:600 carries a kind and each exemption's reason is written about one specific kind."
      - "The src/middleware.ts reason at test/db/gate-target.test.ts:461 is about an ANON-key Supabase client. If that file kept its anon client and also acquired a service-role createClient, the entry would stay green while covering a door its reason never considered."
      - "The teeth that DO exist are real and I witnessed them: renaming the createServerClient call in src/middleware.ts reddened 'the allow list carries no stale entry: every exemption is still a door' at 1 failed | 43 passed (44). The file was restored and git diff --stat is empty."
    concrete-fix: "Give ALLOWED_UNGUARDED entries a kind alongside path and reason, match on the pair in the staleness test at test/db/gate-target.test.ts:670 and in the exempt sets at test/db/gate-target.test.ts:659 and :692, so an exemption covers the door it was written for and a new door of another kind in the same file is reported."
    analysis: "Small, but it is the one direction in which the exemption list can grow silently, and the round's own reason for listing the two anon-key files separately was that the staleness test checks each path so a file that stops being a door is retired on its own. The same argument applies to kinds."

  - id: CR11-M3P12-08
    severity: low
    evidence:
      - "npm ci at head a1c17d5 under node v22.12.0 and npm 10.9.0 exits non-zero: 'npm error code EUSAGE ... Missing: @swc/helpers@0.5.23 from lock file'. package-lock.json:3282 through :3284 pins @swc/helpers at 0.5.15 while a next entry at package-lock.json:7865 requires >=0.5.17."
      - "This branch did not cause it: git diff --stat 2d82402 a1c17d5 -- package.json package-lock.json is EMPTY, and round nine recorded npm ci exit 0 with 364 packages at 2d82402."
      - "npm install --no-save --no-audit --no-fund exits 0 and adds 473 packages, and git status confirms package-lock.json is unchanged by it. Every gate below was run against that install."
    concrete-fix: "Regenerate the lock with npm install on a pinned node 22, commit the result, and re-run the gates so the recorded numbers belong to a tree npm ci can reproduce. Nothing in this phase depends on the outcome, but a lock that npm ci refuses means the gate criterion 12.14 records cannot be reproduced from a clean checkout."
    analysis: "Recorded rather than passed over because criterion 12.14 is about a gate anyone can re-run, and at this head the ordinary way to install refuses. It is reported as low and as not this phase's doing."

criteria:
