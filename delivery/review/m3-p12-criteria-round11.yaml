deviations-judged:
  - deviation: "files-to-touch, which does not carry prisma/seed.ts. Declared in fix round ten under CRITERIA finding CR9-M3P12-05, which found this set and the one below missing from a block that had declared eleven others."
    serves-plan-intent: true
    reasoning: "prisma/seed.ts was the tree's one unguarded door, opening both a Prisma client and a Supabase service-role admin client from the ambient environment, and I confirmed it is a door in my own sweep. Leaving it open to stay inside a files-to-touch list would trade a real exposure for a paperwork match. The plan amendment is declared as in flight on a separate branch, which is the right route rather than editing the plan under review."
  - deviation: "files-to-touch, which does not carry test/property/, though criteria 12.7 and 12.21 both name a property test in that directory BY PATH."
    serves-plan-intent: true
    reasoning: "Two acceptance criteria name files in that directory by path, so the omission is an oversight in the declaration and not a decision the implementer took. Honouring files-to-touch here would make criteria 12.7 and 12.21 unmeetable. I verified both files exist and both are green: test/property/rederive-loss-reporting.test.ts and test/property/pass-one-preserves-meaning.test.ts."
  - deviation: "Criterion 12.17, the half requiring the phase work history to record the command actually run AGAINST THE DEPLOYED DATABASE with its exit code and its printed before-and-after assignment-set sizes."
    serves-plan-intent: true
    reasoning: "Decision D-46 forbids the routine running before the code deploys, and this branch is not deployed, so producing the evidence would require violating the decision the same criterion pins. The criterion's own final clause assigns the deployed run to criterion 16.1. Recorded as owed rather than as done, which is the honest disposition."
  - deviation: "Criteria 12.7, 12.8 and 12.9, which speak of \"a seeded database\" holding MerchantRule rows written under the baseline derivation."
    serves-plan-intent: true
    reasoning: "The in-memory fake is this codebase's standing convention for application tests and is what makes criterion 12.9's 'issues no write against the transactions table' observable at all, since a real Postgres would need a query log. The work history also records the same-merchant collision reproduced against REAL Postgres at delivery/work-history/m3-p12.yaml:1217, so the one place where the fake could have hidden a schema-level defect was checked against the real engine."
  - deviation: "files-to-touch, which does not name .gitignore."
    serves-plan-intent: true
    reasoning: "Fixing a tracked node_modules symlink that publishes a container path and breaks any clone is plainly within intent, and widening the ignore pattern is the half that stops it recurring. The deviation's own correction, that the blob remains reachable in the branch's pushed history, is stated rather than glossed, and the owner's no-rewrite decision is recorded as the orchestrator's rather than claimed as the implementer's. Known item, not spent on this round."
  - deviation: "files-to-touch, which does not name src/app/globals.css, test/e2e/, messages/en.json, messages/nl.json, messages/fr.json or src/app/(app)/merchants/page.tsx."
    serves-plan-intent: true
    reasoning: "Criterion 12.18 requires an e2e test and a reader-visible error, which cannot be built without the message catalogues and the page. The three catalogues moving together is what the frontend skill requires. I saw the resulting e2e test green in my own slow-gate run."
  - deviation: "Criterion 12.1's composition clause, \"at least 8 rows carry none\", under its strict reading."
    serves-plan-intent: true
    reasoning: "The plan text itself was corrected on this branch to count the descriptor half BY BASIS rather than by an absent field, and the criterion as it now reads says why at length. My own harness run shows 18 rows carrying an account field against 16 taking the account basis, so a strict 'carry none' reading would have contradicted the step that builds the fixture. The deviation is against the superseded wording."
  - deviation: "Criterion 12.5's committed baseline table, test/fixtures/baseline-descriptor-keys.json."
    serves-plan-intent: true
    reasoning: "The table is committed and the test reads it, which is what the criterion asks. I verified something stronger by hand: src/modules/merchants/domain/normalise-counterparty.ts is byte-identical to the merge base, so the descriptor branch cannot have moved whatever the table says."
  - deviation: "Step 13, \"run the full gate before calling the slice done\", read as one clean run of every gate."
    serves-plan-intent: true
    reasoning: "Accepted, and independently discharged: I ran every gate myself at this head in one sitting and all seven exited 0, including test:e2e at 55 passed. Whatever the implementer's run history looked like, the head under review passes the full gate."
  - deviation: "Criterion 12.23, added to the plan AFTER this implementation was built."
    serves-plan-intent: true
    reasoning: "The criterion's own text prescribes exactly this disposition. It is no longer merely declared: the interlock is implemented and 33 tests naming the criterion are green, so the deviation has been discharged rather than carried."
  - deviation: "files-to-touch, which does not name src/platform/db/guard-cli.ts or src/platform/db/resolve-env.ts."
    serves-plan-intent: true
    reasoning: "Criterion 12.23 requires the interlock to resolve the environment the way the command it guards resolves it, and the criterion names guard-cli.ts's implementation as the reading. Extracting the one reader into resolve-env.ts rather than writing a second copy is the direction the criterion's word 'decorative' points."
  - deviation: "Criterion 12.17, the deployed run."
