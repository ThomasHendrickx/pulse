  - >-
    The two files are src/middleware.ts:17 and src/platform/auth/supabase-server.ts:13. Both
    open whatever project NEXT_PUBLIC_SUPABASE_URL names. Under the slow gate they are covered,
    because enforceGateDbTarget assigns that variable at src/platform/db/gate-target.ts:287
    through :294 before any server starts, which is a real mechanism and not an accident.
  - >-
    MY OWN SWEEP FOUND NOTHING ELSE. package.json declares no node-postgres, no postgres.js,
    no knex and no drizzle. No tracked source file invokes psql, the supabase CLI or a prisma
    migrate command; the three execFileSync calls in the new test code, at test/application/counterparty-identity-surfaces.test.ts:333,
    test/fixtures/measure-identity-convergence.ts:110 and test/property/mutants.mts:198, run
    git, npx tsx and npx vitest. And I ran the whole fast gate with an INVENTED unreachable
    DATABASE_URL and DIRECT_URL: 43 files and 665 tests still passed, exit 0, so no fast-gate
    test opens a live database at all.
  concrete-fix: >-
    Either narrow the title or widen the definition. Widening is one line: in the door loop
    at test/db/gate-target.test.ts:466 through :492 add a third kind, supabase-anon, matched
    by /create(Server|Browser)Client\s*\(/ over the code-only source, and add src/middleware.ts
