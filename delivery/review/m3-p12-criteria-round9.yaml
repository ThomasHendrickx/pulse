findings:
- id: CR9-M3P12-01
  severity: high
  analysis: >-
    THE SCAN THAT ROUND EIGHT BUILT CANNOT SEE THE GUARD IT INSTALLED BEING REMOVED. Round
    eight's own lesson, written into fleet warning 18 and into the scan's header, is that
    a guard's stated scope is not its reach and that one must prove it RED against a real
    open door before trusting it green. I did that, and it stayed green against the most likely
    regression there is.
  evidence:
  - >-
    THE ASYMMETRY. The scan decides whether a file IS a door by reading code with comments
    dropped and quoted spans blanked, at test/db/gate-target.test.ts:468, and the header at
    test/db/gate-target.test.ts:460 says so in as many words: PROSE IS NOT A DOOR, the scan
    reads CODE. But it decides whether that door is GUARDED by reading the RAW file, at test/db/gate-target.test.ts:473
    for the Prisma door and test/db/gate-target.test.ts:483 for the Supabase admin door. A
    mention of the assert's NAME anywhere in the file, in an import, in a comment or in a
    string, satisfies the guarded predicate. The header's claim is therefore true of one half
    of the scan and false of the other, and it is the half that decides pass or fail.
  - >-
    WITNESSED, PROBE 4. I deleted BOTH real guard calls from prisma/seed.ts, leaving the import
    statement and the forty-line comment above them exactly as they are. The seed is then
    wholly unguarded: it constructs a Prisma client and a service-role admin client from the
    environment with nothing checking either. The ENTIRE FAST GATE STAYED GREEN: npx vitest
    run reported Test Files 43 passed (43), Tests 665 passed (665), and npm run lint exited
    0 with two no-unused-vars WARNINGS, which eslint does not fail on. Not one instrument
    in the tree noticed.
  - >-
    WITNESSED, PROBE 5. I restored the calls and instead MOVED the database assertion to sit
    AFTER new PrismaClient() rather than before it, which is the exact thing the dedicated
    test at test/db/gate-target.test.ts:519 says it pins, its comment reading Order is the
    whole point: refuse before a client exists. The scan stayed green: 33 passed. The reason
    is that BOTH sides of that comparison resolve to prose. seed.indexOf at test/db/gate-target.test.ts:524
    finds the assert name in the IMPORT at prisma/seed.ts:6, and seed.indexOf at test/db/gate-target.test.ts:525
    finds the literal new PrismaClient() inside the backticked comment at prisma/seed.ts:46.
    Neither operand ever reaches the code.
  - >-
    WITNESSED, PROBE 3, the same defect on a fresh door. A tracked file carrying a bare new
    PrismaClient() and a $queryRaw goes RED as it should. Adding one line comment naming assertGateDbTargetIsLocal,
    with no call, turns it GREEN: 33 passed.
  - >-
    AND THE CONTROL, so this is a hole and not a scan that never fires. Probe 2, the same
    tracked file with no mention of the assert at all, went RED with expected [ scripts/zz-probe-door.ts
    (prisma) ] to deeply equal []. Probe 4b, prisma/seed.ts with the import removed as well
    as the calls, went RED on two tests. The scan works; what it cannot see is a door whose
    file still names its guard.
  - >-
    EVERY PROBE WAS REVERTED. After the last one git write-tree returned 96112bb7abfd485e0ad0071c19ba9a1095536e91,
    equal to HEAD's tree, and git diff HEAD was empty.
  concrete-fix: >-
    Compute guarded from the SAME code-only text the door predicate uses, and require a CALL
    rather than a mention. In test/db/gate-target.test.ts:473 and :483 replace raw.includes(name)
    with a test against source for the name followed by an open parenthesis, for example /assertGateDbTargetIsLocal\s*\(/.test(source),
    where source is the codeOnly value already computed at test/db/gate-target.test.ts:468.
    Then fix the ordering test the same way: at test/db/gate-target.test.ts:519 through :530,
    run codeOnly over the seed before taking either indexOf, and search for the CALL form
    assertGateDbTargetIsLocal( and assertGateApiTargetIsLocal( rather than the bare names,
    so the import and the header comment cannot satisfy either operand. Add my probe 4 and
    probe 5 as the regression: a fixture string of a door whose guard name appears only in
    an import or a comment must be reported unguarded, and a door whose call sits after its
    client must fail the order test.
- id: CR9-M3P12-02
  severity: medium
  analysis: >-
    THE ONE EXEMPTION IS SUBSTANTIVELY RIGHT AND ITS STATED REASON IS FALSE IN TWO CLAUSES.
    The exemption itself I judge honest: the application's own runtime client must be able
    to open production, so the gate interlock cannot be called there, and that half of the
    reason is true. The two clauses beside it are not, and clause R-087 makes a false present-tense
    claim in a document a finding rather than a note.
  evidence:
  - >-
    CLAUSE ONE, No test and no script CONSTRUCTS it, at test/db/gate-target.test.ts:433. A
    script does. scripts/rederive-merchant-rules.ts:108 imports @/modules/ledger/application
    and :109 through :115 imports @/modules/merchants/application; those pull in src/modules/ledger/adapters/ledger-repository.ts:13
    and src/modules/merchants/adapters/merchant-repository.ts:14, both of which import @/platform/db/client,
    whose module body constructs the client at src/platform/db/client.ts:51. That is import
    time, so it happens BEFORE the script's own interlock runs.
  - >-
    WITNESSED. I ran the shipped command against a wholly invented non-local DATABASE_URL
    with a mismatched host and ref. Its first line of output was [pulse:db] DATABASE_URL present,
    scheme ok, which is emitted by src/platform/db/client.ts:13 through :15, and only THEN
    came the interlock's refusal and exit 3. The client module had already been evaluated.
    This is not a breach of criterion 12.23, which requires refusal before any repository
    CALL and gets it, since Prisma connects lazily; it is a refutation of the exemption's
    stated reason, which is the sentence a future reader will act on.
  - >-
    CLAUSE TWO, It carries its own interlock instead, assessDevServerDbTarget, which refuses
    a non-production server pointed at a deployed database. That guard's FIRST branch, at
    src/platform/db/guard.ts:129, returns allowed for anything whose NODE_ENV is not exactly
    development, with the reason a test run or a script is not the thing this guard is about.
    Every script, every vitest run and every tsx one-off is non-production and is checked
    by NOTHING. The exemption's closing sentence, that the exemption is a different guard
    rather than no guard, is true only for next dev.
  - >-
    THE ONE THING THAT DOES WORK, recorded so the fix is scoped and not a rewrite: the staleness
    test CAN retire an exemption that has stopped being a door. WITNESSED, probe 6: I made
    src/platform/db/client.ts:40 stop constructing a client and the test at test/db/gate-target.test.ts:511
    went RED with the allow list carries no stale entry: every exemption is still a door.
    Reverted; tree byte-identical.
  concrete-fix: >-
    Correct the exemption reason at test/db/gate-target.test.ts:433 to say what is true: that
    no test and no script contains the CONSTRUCTOR, that scripts/rederive-merchant-rules.ts
    does cause this module to be evaluated transitively at import time and therefore constructs
    the client before its own interlock runs, that construction opens no socket because Prisma
    connects lazily, and that assessDevServerDbTarget checks nothing unless NODE_ENV is exactly
    development, so on the script path the exemption is a deliberate absence of a guard rather
    than a different one. If the transitive construction is judged worth closing rather than
    documenting, the smaller change is to move the two repository imports in scripts/rederive-merchant-rules.ts
    behind a dynamic import performed after assessRederiveTarget has returned allowed, so
    the client module is never evaluated on a refused run.
- id: CR9-M3P12-03
  severity: low
  analysis: >-
    The scan's denominator is the TRACKED tree, so a door that has been written but not yet
    staged is invisible to it. That is a defensible reading of what belongs to the repository,
    but the fast gate is normally run BEFORE git add, which is the moment the author most
    wants to be told.
  evidence:
  - >-
    The denominator is git ls-files at test/db/gate-target.test.ts:414 through :421. I verified
    it myself: 314 tracked files, 174 under the scan's extension filter, against 58 for the
    old test/ plus scripts/ walk. The 58 to 174 claim is exactly right.
  - >-
    WITNESSED, probe 1. An UNTRACKED scripts/zz-probe-door.ts carrying a bare new PrismaClient()
    and a $queryRaw left the scan GREEN, 33 passed. git add on the same bytes turned it RED.
    Reverted; tree byte-identical.
  concrete-fix: >-
    Union the tracked list with the untracked, not-ignored list, so a door is seen the moment
    it exists on disk. In test/db/gate-target.test.ts:414 through :421 add a second execFileSync
    of git with the arguments ls-files, -z, --others, --exclude-standard, concatenate the
    two results and de-duplicate before the extension filter. The denominator assertion at
    test/db/gate-target.test.ts:493 needs no change; add one assertion that a file present
    on disk but not staged is included.
